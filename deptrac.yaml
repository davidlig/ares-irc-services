imports:
  - { resource: deptrac-baseline/phase-02.yaml }
  - { resource: deptrac-baseline/phase-03.yaml }
  - { resource: deptrac-baseline/phase-04.yaml }
  - { resource: deptrac-baseline/phase-05.yaml }
  - { resource: deptrac-baseline/phase-06.yaml }
  - { resource: deptrac-baseline/phase-07.yaml }
  - { resource: deptrac-baseline/phase-08.yaml }
  - { resource: deptrac-baseline/phase-09.yaml }

deptrac:
  paths:
    - ./src

  # The cache lives under var/ so running the gate never dirties the repository root.
  cache_file: ./var/cache/deptrac.cache

  layers:
    - name: Irc Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Irc\\Domain\\#'
        - type: classNameRegex
          value: '#^App\\Domain\\IRC\\#'

    - name: Irc Application Public
      collectors:
        - type: classNameRegex
          value: '#^App\\Irc\\Application\\(?:Port\\In|PublishedEvent)(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Application\\IRC\\(?:Port\\In|PublishedEvent)(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Application\\Port(?:\\|$)#'

    - name: Irc Application Internal
      collectors:
        - type: classNameRegex
          value: '#^App\\Irc\\Application\\(?!(?:Port\\In|PublishedEvent)(?:\\|$))#'
        - type: classNameRegex
          value: '#^App\\Application\\IRC\\(?!(?:Port\\In|PublishedEvent)(?:\\|$))#'
        - type: classNameRegex
          value: '#^App\\Application\\(?!(?:ChanServ|MemoServ|NickServ|OperServ|IRC|Port|Shared)(?:\\|$))#'

    - name: Irc Adapter
      collectors:
        - type: classNameRegex
          value: '#^App\\Irc\\Adapter\\(?!(?:Protocol\\(?:InspIRCd|UnrealStandalone|UnrealUdb))(?:\\|$))#'
        - type: classNameRegex
          value: '#^App\\Infrastructure\\IRC\\(?!(?:Protocol\\UnrealUdb)(?:\\|$))#'
        - type: classNameRegex
          value: '#^App\\Infrastructure\\(?!(?:ChanServ|IRC|MemoServ|NickServ|OperServ|Udb)(?:\\|$))#'
        - type: classNameRegex
          value: '#^App\\UI(?:\\|$)#'

    - name: NickServ Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\NickServ\\Domain\\#'
        - type: classNameRegex
          value: '#^App\\Domain\\NickServ\\#'

    - name: NickServ Application Public
      collectors:
        - type: classNameRegex
          value: '#^App\\NickServ\\Application\\(?:Port\\In|PublishedEvent)(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Application\\NickServ\\(?:Port\\In|PublishedEvent)(?:\\|$)#'

    - name: NickServ Application Internal
      collectors:
        - type: classNameRegex
          value: '#^App\\NickServ\\Application\\(?!(?:Port\\In|PublishedEvent)(?:\\|$))#'
        - type: classNameRegex
          value: '#^App\\Application\\NickServ\\(?!(?:Port\\In|PublishedEvent)(?:\\|$))#'

    - name: NickServ Adapter
      collectors:
        - type: classNameRegex
          value: '#^App\\NickServ\\Adapter(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Infrastructure\\NickServ(?:\\|$)#'

    - name: ChanServ Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\ChanServ\\Domain\\#'
        - type: classNameRegex
          value: '#^App\\Domain\\ChanServ\\#'

    - name: ChanServ Application Public
      collectors:
        - type: classNameRegex
          value: '#^App\\ChanServ\\Application\\(?:Port\\In|PublishedEvent)(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Application\\ChanServ\\(?:Port\\In|PublishedEvent)(?:\\|$)#'

    - name: ChanServ Application Internal
      collectors:
        - type: classNameRegex
          value: '#^App\\ChanServ\\Application\\(?!(?:Port\\In|PublishedEvent)(?:\\|$))#'
        - type: classNameRegex
          value: '#^App\\Application\\ChanServ\\(?!(?:Port\\In|PublishedEvent)(?:\\|$))#'

    - name: ChanServ Adapter
      collectors:
        - type: classNameRegex
          value: '#^App\\ChanServ\\Adapter(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Infrastructure\\ChanServ(?:\\|$)#'

    - name: MemoServ Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\MemoServ\\Domain\\#'

    - name: MemoServ Application Public
      collectors:
        - type: classNameRegex
          value: '#^App\\MemoServ\\Application\\(?:Port\\In|PublishedEvent)(?:\\|$)#'

    - name: MemoServ Application Internal
      collectors:
        - type: classNameRegex
          value: '#^App\\MemoServ\\Application\\(?!(?:Port\\In|PublishedEvent)(?:\\|$))#'

    - name: MemoServ Adapter
      collectors:
        - type: classNameRegex
          value: '#^App\\MemoServ\\Adapter(?:\\|$)#'

    - name: OperServ Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\OperServ\\Domain\\#'
        - type: classNameRegex
          value: '#^App\\Domain\\OperServ\\#'

    - name: OperServ Application Public
      collectors:
        - type: classNameRegex
          value: '#^App\\OperServ\\Application\\(?:Port\\In|PublishedEvent)(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Application\\OperServ\\(?:Port\\In|PublishedEvent)(?:\\|$)#'

    - name: OperServ Application Internal
      collectors:
        - type: classNameRegex
          value: '#^App\\OperServ\\Application\\(?!(?:Port\\In|PublishedEvent)(?:\\|$))#'
        - type: classNameRegex
          value: '#^App\\Application\\OperServ\\(?!(?:Port\\In|PublishedEvent)(?:\\|$))#'

    - name: OperServ Adapter
      collectors:
        - type: classNameRegex
          value: '#^App\\OperServ\\Adapter(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Infrastructure\\OperServ(?:\\|$)#'

    - name: Shared Domain
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\Domain(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Domain\\Shared(?:\\|$)#'

    - name: Shared Application
      collectors:
        - type: classNameRegex
          value: '#^App\\Shared\\Application(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Application\\Shared(?:\\|$)#'

    - name: InspIRCd
      collectors:
        - type: classNameRegex
          value: '#^App\\Irc\\Adapter\\Protocol\\InspIRCd(?:\\|$)#'

    - name: UnrealStandalone
      collectors:
        - type: classNameRegex
          value: '#^App\\Irc\\Adapter\\Protocol\\UnrealStandalone(?:\\|$)#'

    - name: UnrealUdb
      collectors:
        - type: classNameRegex
          value: '#^App\\Irc\\Adapter\\Protocol\\UnrealUdb(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Infrastructure\\IRC\\Protocol\\UnrealUdb(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Domain\\Udb(?:\\|$)#'
        - type: classNameRegex
          value: '#^App\\Infrastructure\\Udb(?:\\|$)#'

    - name: Bootstrap
      collectors:
        - type: classNameRegex
          value: '#^App\\Bootstrap(?:\\|$)#'

    - name: External
      collectors:
        - type: classNameRegex
          value: '#^(?:Amp|Doctrine|Psr|Revolt|Symfony)\\#'

  ruleset:
    Irc Domain:
      - Shared Domain
    Irc Application Public:
      - Irc Domain
      - Shared Domain
      - Shared Application
    Irc Application Internal:
      - Irc Domain
      - Irc Application Public
      - Shared Domain
      - Shared Application
    Irc Adapter:
      - Irc Domain
      - Irc Application Public
      - Irc Application Internal
      - NickServ Application Public
      - ChanServ Application Public
      - MemoServ Application Public
      - OperServ Application Public
      - Shared Domain
      - Shared Application
      - External

    NickServ Domain:
      - Shared Domain
    NickServ Application Public:
      - NickServ Domain
      - Shared Domain
      - Shared Application
    NickServ Application Internal:
      - NickServ Domain
      - NickServ Application Public
      - Shared Domain
      - Shared Application
    NickServ Adapter:
      - NickServ Domain
      - NickServ Application Public
      - NickServ Application Internal
      - Irc Application Public
      - ChanServ Application Public
      - MemoServ Application Public
      - OperServ Application Public
      - Shared Domain
      - Shared Application
      - External

    ChanServ Domain:
      - Shared Domain
    ChanServ Application Public:
      - ChanServ Domain
      - Shared Domain
      - Shared Application
    ChanServ Application Internal:
      - ChanServ Domain
      - ChanServ Application Public
      - Shared Domain
      - Shared Application
    ChanServ Adapter:
      - ChanServ Domain
      - ChanServ Application Public
      - ChanServ Application Internal
      - Irc Application Public
      - NickServ Application Public
      - MemoServ Application Public
      - OperServ Application Public
      - Shared Domain
      - Shared Application
      - External

    MemoServ Domain:
      - Shared Domain
    MemoServ Application Public:
      - MemoServ Domain
      - Shared Domain
      - Shared Application
    MemoServ Application Internal:
      - MemoServ Domain
      - MemoServ Application Public
      - Shared Domain
      - Shared Application
    MemoServ Adapter:
      - MemoServ Domain
      - MemoServ Application Public
      - MemoServ Application Internal
      - Irc Application Public
      - NickServ Application Public
      - ChanServ Application Public
      - OperServ Application Public
      - Shared Domain
      - Shared Application
      - External

    OperServ Domain:
      - Shared Domain
    OperServ Application Public:
      - OperServ Domain
      - Shared Domain
      - Shared Application
    OperServ Application Internal:
      - OperServ Domain
      - OperServ Application Public
      - Shared Domain
      - Shared Application
    OperServ Adapter:
      - OperServ Domain
      - OperServ Application Public
      - OperServ Application Internal
      - Irc Application Public
      - NickServ Application Public
      - ChanServ Application Public
      - MemoServ Application Public
      - Shared Domain
      - Shared Application
      - External

    Shared Domain: ~
    Shared Application:
      - Shared Domain

    InspIRCd:
      - Irc Domain
      - Irc Application Public
      - Irc Application Internal
      - Irc Adapter
      - NickServ Application Public
      - ChanServ Application Public
      - MemoServ Application Public
      - OperServ Application Public
      - Shared Domain
      - Shared Application
      - External
    UnrealStandalone:
      - Irc Domain
      - Irc Application Public
      - Irc Application Internal
      - Irc Adapter
      - NickServ Application Public
      - ChanServ Application Public
      - MemoServ Application Public
      - OperServ Application Public
      - Shared Domain
      - Shared Application
      - External
    UnrealUdb:
      - Irc Domain
      - Irc Application Public
      - Irc Application Internal
      - Irc Adapter
      - NickServ Application Public
      - ChanServ Application Public
      - MemoServ Application Public
      - OperServ Application Public
      - Shared Domain
      - Shared Application
      - External
    Bootstrap:
      - Irc Domain
      - Irc Application Public
      - Irc Application Internal
      - Irc Adapter
      - NickServ Domain
      - NickServ Application Public
      - NickServ Application Internal
      - NickServ Adapter
      - ChanServ Domain
      - ChanServ Application Public
      - ChanServ Application Internal
      - ChanServ Adapter
      - MemoServ Domain
      - MemoServ Application Public
      - MemoServ Application Internal
      - MemoServ Adapter
      - OperServ Domain
      - OperServ Application Public
      - OperServ Application Internal
      - OperServ Adapter
      - Shared Domain
      - Shared Application
      - InspIRCd
      - UnrealStandalone
      - UnrealUdb
      - External
    External: ~

services:
  ares:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
    container_name: ares-irc-services
    restart: on-failure:10
    deploy:
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 10

    # Bind mounts for persistence
    volumes:
      - ../var/data:/app/var/data
      - ../var/log:/app/var/log
      - ../.env.local:/app/.env.local

    # Network configuration for external IRCD access
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - APP_ENV=prod

    healthcheck:
      test: ["CMD-SHELL", "grep -Fq 'irc:connect' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

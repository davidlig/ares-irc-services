services:
  ares:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
    container_name: ares-irc-services
    restart: unless-stopped
    mem_limit: ${ARES_CONTAINER_MEMORY_LIMIT:-2G}
    stop_grace_period: 30s

    # Bind mounts for persistence
    volumes:
      - ../var/data:/app/var/data
      - ../var/log:/app/var/log
      - ../.env.local:/app/.env.local

    # Network configuration for external IRCD access
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - APP_ENV=prod
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}

    healthcheck:
      test: ["CMD-SHELL", "grep -Fq 'irc:connect' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

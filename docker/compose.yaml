services:
  ares:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
    container_name: ares-irc-services
    restart: unless-stopped
    mem_limit: ${ARES_CONTAINER_MEMORY_LIMIT:-2G}
    stop_grace_period: 30s

    # Deployments override host paths to keep persistence outside release checkouts.
    # Local development retains the existing defaults; env remains writable for sync.
    volumes:
      - ${ARES_DATA_DIR:-../var/data}:/app/var/data
      - ${ARES_LOG_DIR:-../var/log}:/app/var/log
      - ${ARES_ENV_FILE:-../.env.local}:/app/.env.local

    # Network configuration for external IRCD access
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - APP_ENV=prod
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}

    healthcheck:
      test: ["CMD-SHELL", "grep -Fq 'irc:connect' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Übersetzungen für ChanServ — Deutsch
# Domäne: chanserv
#
# IRC-Formatcodes (doppelte Anführungszeichen oder !irc-Literalblöcke):
#   \x02        Fettdruck ein/aus
#   \x03NN      Farbe (DEZIMAL: 03=grün, 04=rot, 07=orange, 14=dunkelgrau)
#   \x03        Farbe zurücksetzen
#   \x0F        gesamte Formatierung zurücksetzen
#
# IRC-Farben verwenden DEZIMALZAHLEN (0-15), keine Hexadezimalzahlen.
#   \x0314 = dunkelgrau (14 dezimal): RICHTIG
#   \x030F = Farbe 0 gefolgt vom Buchstaben F: FALSCH
#
# Mehrzeiliger IRC-Text: !irc |- mit echten Zeilenumbrüchen und Leerzeichen.
# Blöcke ohne Tag dekodieren keine Escape-Sequenzen; CTCP-Literale erhalten.
# HELP-Beispiele: example/examples und %command_prefix%.
# Die Darstellung ergänzt /msg ohne Farbe und einen Rand von zwei Leerzeichen.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Ungültiger Channel-Name. Verwenden Sie \x02#channel\x02."
  generic: "\x0304✗\x03 Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#channel> <Beschreibung>"
  example: "%command_prefix%\x02\x0303REGISTER #channel Gemeinschaftsprojekt\x03\x0F"
  short: "Einen Channel registrieren."
  help: |-
    Registriert einen Channel und verknüpft ihn mit Ihrem Nickname. Sie
    müssen bei %nickserv% identifiziert sein. Im Modus APPROVAL muss ein
    IRCop die Anfrage genehmigen.
  success: "\x0303✔\x03 Channel \x02%channel%\x02 wurde registriert."
  already_registered: "\x0304✗\x03 Der Channel \x02%channel%\x02 ist bereits registriert oder wartet auf die Registrierung."
  channel_not_on_network: "\x0304✗\x03 Channel \x02%channel%\x02 existiert nicht im Netzwerk."
  pending_deletion: "\x0304✗\x03 Der Channel \x02%channel%\x02 steht zur Löschung an und kann nicht registriert werden."
  insufficient_channel_rank: "\x0304✗\x03 Du musst mindestens Operator-Status in \x02%channel%\x02 haben, um den Channel zu registrieren."
  limit_exceeded: "\x0304✗\x03 Sie haben das Maximum von %max% registrierten Channels erreicht."
  throttled: "\x0304✗\x03 Sie müssen \x02%minutes%\x02 Minute(n) warten, bevor Sie einen weiteren Channel registrieren."

  awaiting_approval: "\x0307✔\x03 Die Anfrage für %channel% wartet auf die Freigabe durch einen IRCop."
  restricted_indefinite: "\x0304✗\x03 Neue Registrierungsanfragen für \x02%channel%\x02 sind unbegrenzt gesperrt."
  restricted_until: "\x0304✗\x03 Neue Registrierungsanfragen für \x02%channel%\x02 sind bis %date% gesperrt"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%\x02\x0303REGMODE APPROVAL\x03\x0F"
  short: "Registrierungsmodus für Channels festlegen oder anzeigen."
  help: |-
    Registrierung auf DIRECT oder APPROVAL setzen oder STATUS abfragen.
    DIRECT ist der Standard und registriert sofort.
  status: "\x0307ℹ\x03 Der Channel-Registrierungsmodus ist %mode%."
  changed: "\x0303✔\x03 Der Channel-Registrierungsmodus ist jetzt %mode%."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [page]|ACCEPT <#channel>|REJECT <#channel> <Grund>}"
  pending.syntax: "CREG PENDING [page]"
  pending.example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  pending.short: "Listet offene Anfragen auf einer begrenzten Seite auf."
  pending.help: "Listet offene Anfragen auf einer begrenzten Seite auf."
  accept.syntax: "CREG ACCEPT <#channel>"
  accept.example: "%command_prefix%\x02\x0303CREG ACCEPT #channel\x03\x0F"
  accept.short: "Genehmigt eine Channel-Registrierungsanfrage."
  accept.help: "Prüft die Anfrage erneut und aktiviert die Registrierung."
  reject.syntax: "CREG REJECT <#channel> <Grund>"
  reject.example: "%command_prefix%\x02\x0303CREG REJECT #channel Benötigt ein öffentliches Topic\x03\x0F"
  reject.short: "Lehnt eine Channel-Registrierungsanfrage ab."
  reject.help: "Lehnt eine Anfrage mit erforderlicher Begründung und Sperre ab."
  example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  short: "Channel-Registrierungsanfragen prüfen."
  help: |-
    Listet offene Anfragen auf oder nimmt eine an oder lehnt sie ab.
    Ablehnungen benötigen eine Begründung. Nur ACCEPT registriert den Channel.
  pending_header: "\x0314Offene Registrierungen (Seite %page%)\x03"
  pending_item: "  %channel% — Antragsteller %requester%, eingereicht %submitted%: %description%"
  accepted: "\x0303✔\x03 Die Registrierung für %channel% wurde genehmigt."
  rejected: "\x0303✔\x03 Die Registrierung für %channel% wurde abgelehnt."
  not_pending: "\x0304✗\x03 Für %channel% liegt keine offene Registrierung vor."
  channel_not_on_network: "\x0304✗\x03 Der Channel %channel% ist nicht im Netzwerk."
  founder_limit: "\x0304✗\x03 Der Antragsteller hat das Registrierungslimit erreicht."
  requester_inactive: "\x0304✗\x03 Das anfragende Konto ist nicht mehr aktiv."
  requester_ineligible: "\x0304✗\x03 Der Antragsteller benötigt aktuell Operator-Status im Channel."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <#channel>"
  example: "%command_prefix%\x02\x0303STATUS #channel\x03\x0F"
  header: "\x02Status des Channels \x0307%channel%\x03\x02"
  short: "Channel-Registrierungsstatus anzeigen."
  help: |-
    Zeigt, ob ein Channel nicht registriert ist, auf Freigabe wartet,
    abgelehnt oder registriert wurde.
    Ablehnungsdetails sehen nur der Antragsteller und berechtigte IRCops.
  unregistered: "  \x0314Status                  \x03: Nicht registriert"
  pending: "  \x0314Status                  \x03: \x0307Freigabe ausstehend\x03"
  registered: "  \x0314Status                  \x03: \x0303Registriert\x03"
  suspended: "  \x0314Status                  \x03: \x0304Suspendiert\x03"
  forbidden: "  \x0314Status                  \x03: \x0304Gesperrt\x03"
  pending_deletion: "  \x0314Status                  \x03: \x0307Löschung ausstehend\x03"
  rejected_private: "  \x0314Status                  \x03: \x0304Registrierung abgelehnt\x03"
  rejected: "  \x0314Status                  \x03: \x0304Registrierung abgelehnt\x03"
  rejection_reason: "  \x0314Begründung              \x03: %reason%"
  rejection_audit: "  \x0314Abgelehnt von           \x03: %operator% am %date%"
  restriction_until: "  \x0314Verfügbar ab            \x03: %date%"
  footer: "\x0314─────────────────────────────\x03\x0F"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#channel>"
  example: "%command_prefix%\x02\x0303INFO #channel\x03\x0F"
  short: "Channel-Informationen anzeigen."
  help: |-
    Zeigt ausführliche Informationen zu einem registrierten Channel, darunter
    Eigentümer, Registrierungsdaten, letzte Aktivität und Einstellungen.
  header: "\x02Informationen für Channel \x0307%channel%\x03\x02"
  founder: "  \x0314Founder\x03            : \x02%nickname%\x02"
  registered: "  \x0314Registriert\x03        : %date%"
  successor: "  \x0314Successor\x03          : \x02%nickname%\x02"
  description: "  \x0314Beschreibung\x03       : %desc%"

  short: "Channel-Informationen anzeigen."
  help: |-
    Zeigt ausführliche Informationen zu einem registrierten Channel, darunter
    Eigentümer, Registrierungsdaten, letzte Aktivität und Einstellungen.
  header: "Informationen für Channel %channel%"
  founder: "%label%%padding%: %nickname%"
  founder_label: "Founder"
  registered: "%label%%padding%: %date%"
  registered_label: "Registriert"
  successor: "%label%%padding%: %nickname%"
  successor_label: "Successor"
  description: "%label%%padding%: %desc%"
  description_label: "Beschreibung"
  url: "%label%%padding%: %url%"
  url_label: "URL"
  email: "%label%%padding%: %email%"
  email_label: "E-Mail"
  last_used: "%label%%padding%: %date%"
  last_used_label: "Zuletzt genutzt"
  topic: "%label%%padding%: %topic%"
  topic_label: "Letztes Topic"
  topic_set_by: "%label%%padding%: %nickname%"
  topic_set_by_label: "Topic gesetzt von"
  options: "%label%%padding%: %options%"
  options_label: "Optionen"
  verbose: "%label%%padding%: %state%"
  verbose_label: "Aktivitätsmeldungen"
  private: "Die Kanalinformationen für %channel% sind privat."
  no_expire: "%label%%padding%: Ja"
  no_expire_label: "Läuft nie ab"
  mlock_modes: "%label%%padding%: %modes%"
  mlock_modes_label: "Mode-Sperre"
  suspended_status: "%label%%padding%: %state%"
  suspended_status_label: "Status"
  suspended_status_value: "Suspendiert"
  suspended_reason: "%label%%padding%: %reason%"
  suspended_reason_label: "Begründung"
  suspended_until: "%label%%padding%: %date%"
  suspended_until_label: "Endet am"
  suspended_permanent: "%label%%padding%: Dauerhaft"
  suspended_permanent_label: "Endet am"
  forbidden_status: "%label%%padding%: %state%"
  forbidden_status_label: "Status"
  forbidden_status_value: "Gesperrt"
  forbidden_reason: "%label%%padding%: %reason%"
  forbidden_reason_label: "Begründung"
  pending_deletion_status: "%label%%padding%: %state%"
  pending_deletion_status_label: "Status"
  pending_deletion_status_value: "Löschung ausstehend"
  pending_deletion_at: "%label%%padding%: %date%"
  pending_deletion_at_label: "Gelöscht"
  pending_deletion_until: "%label%%padding%: %date%"
  pending_deletion_until_label: "Endgültig am"
  pending_deletion_notice: "Dieser Kanal ist eingefroren und kann nicht registriert werden."

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <#channel> {FOUNDER <Nickname> [Token]|SUCCESSOR [nickname]|DESC <Beschreibung>|URL [url]|EMAIL [E-Mail]|ENTRYMSG [Nachricht]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}|VERBOSE {ON|OFF}}"
  example: "%command_prefix%SET #channel DESC Ein Community-Channel"
  examples:
    - "%command_prefix%SET #channel URL https://example.test"
    - "%command_prefix%SET #channel MLOCK ON"
  short: "Channel-Optionen ändern."
  help: |-
    Ändert eine Channel-Option. Die Hilfe zu jeder Option erklärt ihre
    Voraussetzungen und Varianten.
  unknown_option: "Unbekannte Option %option%. Verwenden Sie eine der folgenden: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Verwende SET <#Kanal> FOUNDER <Nickname> <token> mit dem bestätigten Token des aktuellen Gründers."
    token_unavailable: "Der aktuelle Gründer hat kein bestätigtes Rettungstoken. Er muss sich zuerst authentifizieren und VERIFY verwenden."
    syntax: "SET <#Kanal> FOUNDER <Nickname> [Token]"
    example: "%command_prefix%SET #channel FOUNDER Alice"
    examples:
      - "%command_prefix%SET #channel FOUNDER Alice bestätigtes-Token"
    short: "Channel an einen anderen registrierten Nickname übertragen."
    help: |-
      Ändert den Gründer nach Prüfung des Tokens des aktuellen Gründers. Die
      administrative Ausnahme auf Gründerebene bleibt bestehen. Das Token wird nicht
      verbraucht.
    invalid_token: "Das Rettungstoken ist ungültig."
    updated: "Founder wurde zu %nickname% geändert."
    throttled: "Zu viele ungültige Token. Versuche es in %minutes% Minute(n) erneut."
    must_be_registered: "%nickname% muss registriert und aktiviert sein."
    suspended: "%nickname% ist suspendiert und kann nicht als Founder gesetzt werden."
    cannot_be_self: "Der neue Founder kann nicht der aktuelle Founder sein."
    cannot_be_successor: "Der neue Founder kann nicht der Channel-Successor sein."
    limit_exceeded: "%nickname% hat das Maximum von %max% registrierten Channels erreicht."
    notice_channel: "%from% weist %nickname% als Channel-Founder zu."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%SET #channel SUCCESSOR Alice"
    examples:
      - "%command_prefix%SET #channel SUCCESSOR"
    short: "Den Channel-Successor festlegen."
    help: |-
      Legt einen Nickname als Channel-Nachfolger fest. Ohne Nickname wird der
      aktuelle Nachfolger entfernt. Der Nickname muss registriert und aktiviert sein.
    cleared: "Successor wurde gelöscht."
    updated: "Successor wurde auf %nickname% gesetzt."
    must_be_registered: "%nickname% muss registriert und aktiviert sein."
    suspended: "%nickname% ist suspendiert und kann nicht als Successor gesetzt werden."
    cannot_be_founder: "Der Founder kann nicht als Successor gesetzt werden."
    notice_channel: "%from% weist %nickname% als Channel-Successor zu."
    notice_channel_cleared: "%from% hat den Channel-Successor gelöscht."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <Beschreibung>"
    example: "%command_prefix%SET #channel DESC Ein Community-Channel"
    short: "Channel-Beschreibung ändern."
    help: "Die Channel-Beschreibung ändern (erforderlich)."
    updated: "Beschreibung aktualisiert."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%SET #channel URL https://example.test"
    examples:
      - "%command_prefix%SET #channel URL"
    short: "Channel-URL festlegen."
    help: "Ändert die Website-Adresse (URL) eines Channels. Ohne URL wird sie entfernt."
    updated: "URL aktualisiert."
    cleared: "URL gelöscht."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#channel> EMAIL [E-Mail]"
    example: "%command_prefix%SET #channel EMAIL team@example.test"
    examples:
      - "%command_prefix%SET #channel EMAIL"
    short: "Channel-E-Mail festlegen."
    help: |-
      Ändert die E-Mail-Adresse eines Channels. Ohne E-Mail wird sie
      entfernt. Administrativ gesperrte E-Mail-Domains sind nicht zulässig.
      Administrative Ausnahme: Operatoren mit Gründerzugriff.
    invalid: "Ungültige E-Mail-Adresse."
    updated: "E-Mail aktualisiert."
    cleared: "E-Mail gelöscht."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#channel> ENTRYMSG [Nachricht]"
    example: "%command_prefix%SET #channel ENTRYMSG Willkommen"
    examples:
      - "%command_prefix%SET #channel ENTRYMSG"
    short: "Channel-Betretensnachricht festlegen."
    help: "Legt die Willkommensnachricht (NOTICE) fest. Ohne Nachricht wird sie entfernt."
    updated: "Betretensnachricht aktualisiert."
    too_long: "Betretensnachricht darf %max% Zeichen nicht überschreiten."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #channel TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #channel TOPICLOCK OFF"
    short: "Channel-Topic sperren."
    help: |-
      Verhindert Änderungen am Channel-Thema (Topic). Beim Aktivieren wird das
      aktuelle Thema gespeichert und gesperrt.
    on: "Topic-Sperre ist jetzt ON."
    off: "Topic-Sperre ist jetzt OFF."
    notice_on: "%nickname% aktiviert TOPICLOCK."
    notice_off: "%nickname% deaktiviert TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #channel MLOCK ON"
    examples:
      - "%command_prefix%SET #channel MLOCK OFF"
    short: "Channel-Modes sperren."
    help: |-
      Sperrt die aktuellen Channel-Modes (z. B. +nt). Bei ON können Modes nicht
      geändert werden.
    no_modes: "keine Modes"
    on: "MLOCK ist jetzt ON (%modes%)."
    off: "MLOCK ist jetzt OFF."
    notice_on: "%nickname% aktiviert MLOCK (%modes%)."
    notice_off: "%nickname% deaktiviert MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#Channel> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #channel PRIVATE ON"
    examples:
      - "%command_prefix%SET #channel PRIVATE OFF"
    short: "Channel-Informationen verbergen."
    help: |-
      Bei ON können nur der Gründer und Benutzer mit Zugriff die
      Channel-Informationen sehen.
    on: "Channel-Informationen sind jetzt privat."
    off: "Channel-Informationen sind jetzt öffentlich."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%SET #channel SECURE ON"
    examples:
      - "%command_prefix%SET #channel SECURE OFF"
    short: "Zugriffsliste für Channel-Ränge erforderlich."
    help: "Verhindert, dass Nicknames außerhalb der Zugriffsliste Channel-Ränge erhalten."
    on: "SECURE ist jetzt ON."
    off: "SECURE ist jetzt OFF."
    notice_on: "%nickname% aktiviert den SECURE-Modus."
    notice_off: "%nickname% deaktiviert den SECURE-Modus."

  # --- SET VERBOSE ---------------------------------------------------------
  verbose:
    syntax: "SET <#channel> VERBOSE {ON|OFF}"
    example: "%command_prefix%SET #channel VERBOSE ON"
    examples:
      - "%command_prefix%SET #channel VERBOSE OFF"
    short: "Channel-Aktivitätsbenachrichtigungen umschalten."
    help: |-
      Aktiviert oder deaktiviert NOTICE-Übertragungen an den Channel für
      durchgeführte Aktionen.
    on: "Channel-Aktivitätsbenachrichtigungen aktiviert."
    off: "Channel-Aktivitätsbenachrichtigungen deaktiviert."

# --- STATUS -------------------------------------------------------------------
status:
  syntax: "STATUS <#channel>"
  example: "%command_prefix%STATUS #channel"
  header: "Status des Channels %channel%"
  short: "Channel-Registrierungsstatus anzeigen."
  help: |-
    Zeigt, ob ein Channel nicht registriert ist, auf Freigabe wartet,
    abgelehnt oder registriert wurde.
    Ablehnungsdetails sehen nur der Antragsteller und berechtigte IRCops.
  unregistered: "%label%%padding%: Nicht registriert"
  unregistered_label: "Status"
  pending: "%label%%padding%: %state%"
  pending_label: "Status"
  pending_value: "Freigabe ausstehend"
  registered: "%label%%padding%: %state%"
  registered_label: "Status"
  registered_value: "Registriert"
  suspended: "%label%%padding%: %state%"
  suspended_label: "Status"
  suspended_value: "Suspendiert"
  forbidden: "%label%%padding%: %state%"
  forbidden_label: "Status"
  forbidden_value: "Gesperrt"
  pending_deletion: "%label%%padding%: %state%"
  pending_deletion_label: "Status"
  pending_deletion_value: "Löschung ausstehend"
  rejected_private: "%label%%padding%: %state%"
  rejected_private_label: "Status"
  rejected_private_value: "Registrierung abgelehnt"
  rejected: "%label%%padding%: %state%"
  rejected_label: "Status"
  rejected_value: "Registrierung abgelehnt"
  rejection_reason: "%label%%padding%: %reason%"
  rejection_reason_label: "Begründung"
  rejection_audit: "%label%%padding%: %operator% am %date%"
  rejection_audit_label: "Abgelehnt von"
  restriction_until: "%label%%padding%: %date%"
  restriction_until_label: "Verfügbar ab"
  footer: ""

# --- ACCESS -------------------------------------------------------------------
access:
  syntax: "ACCESS <#channel> {ADD <nickname> <Level>|DEL <nickname>|LIST}"
  example: "%command_prefix%ACCESS #channel LIST"
  examples:
    - "%command_prefix%ACCESS #channel ADD Alice 100"
    - "%command_prefix%ACCESS #channel DEL Alice"
  short: "Zugriffsliste verwalten."
  help: "Verwaltet die Zugriffsliste des Channels."
  unknown_sub: "Unbekannter Unterbefehl %sub%. Verwenden Sie LIST, ADD oder DEL."
  level_range: "Zugriffslevel muss zwischen %min% und %max% liegen."
  cannot_manage_level: "Sie können nur Nicks mit einem Level verwalten, das strikt unter Ihrem eigenen liegt."
  founder_not_in_list: "Der Founder ist nicht in der Zugriffsliste."
  max_entries: "Maximal %max% Zugriffseinträge pro Channel."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#channel> LIST"
    example: "%command_prefix%ACCESS #channel LIST"
    short: "Zugriffsliste auflisten (erfordert ACCESSLIST-Level)."
    help: "Zeigt Nickname und Level für jeden Eintrag."
    header: "Zugriffsliste für %channel%"
    empty: "Channel %channel% hat keine Zugriffseinträge."
    entry: "#%index%: %nickname% (Level %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#channel> ADD <nickname> <Level>"
    example: "%command_prefix%ACCESS #channel ADD Alice 100"
    short: "Zugriffslevel hinzufügen oder aktualisieren (erfordert ACCESSCHANGE-Level)."
    help: "Level 1-499. Sie können nur Level unter Ihrem eigenen setzen."
    done: "%nickname% auf Level %level% gesetzt."
    notice_channel: "%from% setzt %to% auf Level %level%"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#channel> DEL <nickname>"
    example: "%command_prefix%ACCESS #channel DEL Alice"
    short: "Aus Zugriffsliste entfernen (erfordert ACCESSCHANGE-Level)."
    help: "Sie können nur Nicks mit einem Level unter Ihrem eigenen entfernen."
    not_in_list: "%nickname% ist nicht in der Zugriffsliste."
    done: "%nickname% aus der Zugriffsliste entfernt."
    notice_channel: "%from% entfernt %to% aus der Zugriffsliste"

# --- DELACCESS ----------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#channel>"
  example: "%command_prefix%DELACCESS #channel"
  short: "Ihren eigenen Zugriff aus einem Channel entfernen."
  help: |-
    Entfernt deinen Zugriffseintrag aus der Channel-Liste. Du musst identifiziert
    sein. Der Gründer kann diesen Befehl nicht verwenden.
  done: "Ihr Zugriff wurde aus %channel% entfernt."
  not_in_list: "Sie haben keinen Zugriff in %channel%."
  founder_not_in_access: "Sie sind der Founder von %channel% und sind nicht in der Zugriffsliste."
  notice_channel: "%nickname% entfernt seinen Zugriff aus dem Channel"

# --- AKICK --------------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> {ADD <Maske> [Ablauf] [Begründung]|DEL {<Maske>|<Nummer>}|LIST|VIEW {<Maske>|<Nummer>}|CLEAR|CHECK <Nickname>|ENFORCE}"
  example: "%command_prefix%AKICK #channel ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #channel ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #channel DEL *!*@*"
    - "%command_prefix%AKICK #channel DEL 2"
    - "%command_prefix%AKICK #channel LIST"
    - "%command_prefix%AKICK #channel VIEW 1"
    - "%command_prefix%AKICK #channel CLEAR"
    - "%command_prefix%AKICK #channel CHECK Alice"
  short: "Auto-Kick-Liste verwalten."
  help: "Verwaltet automatische Kick-Einträge und deren optionale Ablaufzeit."
  unknown_sub: "Unbekannter Unterbefehl %sub%. Verwenden Sie ADD, DEL, LIST, VIEW, CLEAR oder CHECK."
  invalid_mask: "Ungültiges Maskenformat. Verwenden Sie nick!ident@host mit Platzhaltern (*)."
  dangerous_mask: "Die Maske %mask% ist zu allgemein. Sie muss mindestens 4 alphanumerische Zeichen enthalten."
  protected_user: "Nickname %nickname% hat Zugriff in diesem Channel."
  max_entries: "Maximal %max% AKICK-Einträge pro Channel."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <Maske> [Ablauf] [Begründung]"
    example: "%command_prefix%AKICK #channel ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #channel ADD *!*@* 7d Spam"
    short: "AKICK-Eintrag hinzufügen."
    help: |-
      Fügt der automatischen Kick-Liste des Channels eine Maske hinzu.

      Du kannst Dauer und Begründung angeben. Wenn du eine Begründung angibst, musst
      du auch eine Dauer angeben: 0 für dauerhaft, d für Tage, h für Stunden oder m
      für Minuten.
    done: "AKICK %mask% hinzugefügt."
    already_exists: "AKICK %mask% existiert bereits."
    notice_channel: "%from% fügt AKICK hinzu: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL {<Maske>|<Nummer>}"
    example: "%command_prefix%AKICK #channel DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #channel DEL 2"
    short: "AKICK-Eintrag entfernen."
    help: "Entfernt anhand der exakten Maske oder der Eintragsnummer aus LIST."
    not_found: "AKICK %mask% nicht gefunden."
    done: "AKICK %mask% entfernt."
    notice_channel: "%from% entfernt AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#channel> LIST"
    example: "%command_prefix%AKICK #channel LIST"
    short: "AKICK-Einträge auflisten."
    help: "Zeigt Maske, Begründung, Ablauf und wer hinzugefügt hat."
    header: "AKICK-Liste für %channel%"
    empty: "Channel %channel% hat keine AKICK-Einträge."
    entry: "#%index% %mask% %reason% (von %nickname%, läuft ab: %expiration%, Verwendungen: %uses%)"

  # --- AKICK VIEW ----------------------------------------------------------
  view:
    syntax: "AKICK <#channel> VIEW {<Maske>|<Nummer>}"
    example: "%command_prefix%AKICK #channel VIEW 1"
    examples:
      - "%command_prefix%AKICK #channel VIEW *!*@bad.host"
    short: "Detaillierte AKICK-Eintragsmetadaten anzeigen."
    help: |-
      Zeigt Grund, Ersteller, Erstellungsdatum, Ablaufdatum,
      Nutzungszähler und das Datum der letzten Verwendung für einen AKICK-Eintrag.
    header: "AKICK-Details für %channel%"
    reason: "%label%%padding%: %reason%"
    reason_label: "Grund"
    author: "%label%%padding%: %author%"
    author_label: "Autor"
    created: "%label%%padding%: %date%"
    created_label: "Erstellt am"
    expires: "%label%%padding%: %date%"
    expires_label: "Läuft ab"
    uses: "%label%%padding%: %uses%"
    uses_label: "Verwendungen"
    last_used: "%label%%padding%: %date%"
    last_used_label: "Zuletzt verwendet"

  # --- AKICK CLEAR ---------------------------------------------------------
  clear:
    syntax: "AKICK <#channel> CLEAR"
    example: "%command_prefix%AKICK #channel CLEAR"
    short: "Alle AKICK-Einträge leeren."
    help: |-
      Entfernt alle automatischen Kick-Einträge aus dem Channel.
      Erfordert Channel-Gründer oder AKICK-Level.
    empty: "Channel %channel% hat keine AKICK-Einträge zum Leeren."
    done: "%count% AKICK-Einträge aus %channel% geleert."
    notice_channel: "%from% hat %count% AKICK-Einträge aus %channel% geleert"

  # --- AKICK CHECK ---------------------------------------------------------
  check:
    syntax: "AKICK <#channel> CHECK <Nickname>"
    example: "%command_prefix%AKICK #channel CHECK Alice"
    short: "Prüfen, ob ein Nickname mit AKICK-Einträgen übereinstimmt."
    help: |-
      Prüft, ob ein verbundener Benutzer mit einem automatischen Kick-Eintrag des Channels übereinstimmt.
    no_match: "%nickname% stimmt mit keinem AKICK-Eintrag in %channel% überein."
    not_connected: "Benutzer %nickname% ist nicht verbunden."
    header: "AKICK-Treffer für %nickname% in %channel%"
    entry: "#%index% %mask% %reason%"

  # --- AKICK ENFORCE -------------------------------------------------------
  enforce:
    syntax: "AKICK <#channel> ENFORCE"
    example: "%command_prefix%AKICK #channel ENFORCE"
    short: "AKICK-Einträge auf aktuelle Kanalbenutzer anwenden."
    help: |-
      Prüft verbundene Benutzer im Kanal gegen die AKICK-Liste
      und bannt sowie kickt alle passenden Benutzer.
    no_matches: "Keine Benutzer in %channel% stimmen mit AKICK-Einträgen überein."
    done: "%count% AKICK-Ausschluss/-Ausschlüsse auf %channel% angewendet."
    notice_channel: "%from% hat AKICK auf %channel% angewendet (%count% Benutzer)"

# --- LEVELS -------------------------------------------------------------------
levels:
  syntax: "LEVELS <#channel> {LIST|SET <Level> <Wert>|RESET}"
  example: "%command_prefix%LEVELS #channel LIST"
  examples:
    - "%command_prefix%LEVELS #channel SET OPDEOP 50"
    - "%command_prefix%LEVELS #channel RESET"
  short: "Channel-Levels konfigurieren."
  help: |-
    Legt die Mindestzugriffsstufen für Channel-Aktionen fest. Nur der Gründer
    kann Stufen ändern oder zurücksetzen.
  unknown_sub: "Unbekannter Unterbefehl %sub%. Verwenden Sie LIST, SET oder RESET."
  unknown_key: "Unbekannter Level-Schlüssel %key% oder wird von diesem IRCd nicht unterstützt."
  value_range: "Level-Wert muss zwischen %min% und %max% liegen."


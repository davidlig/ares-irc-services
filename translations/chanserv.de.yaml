  noexpire_on: "Ablaufschutz aktiviert"
  noexpire_off: "Ablaufschutz deaktiviert"
  ircoponly_on: "Beschränkung auf IRCops aktiviert"
  ircoponly_off: "Beschränkung auf IRCops deaktiviert"
  history_clear: "Verlauf gelöscht"
  set_desc: "Option DESC aktualisiert"
  set_url: "Option URL aktualisiert"
  set_email: "Option EMAIL aktualisiert"

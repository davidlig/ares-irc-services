# --- CLEARACCESS -----------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#channel>"
  example: "%command_prefix%\x02\x0303CLEARACCESS #channel\x03\x0F"
  short: "Die gesamte Zugriffsliste eines Channels löschen."
  help: "Entfernt alle Zugriffseinträge des Channels. Dieser Vorgang ist unwiderruflich."
  success: "\x0303✔\x03 \x02%count%\x02 Zugriffseinträge aus \x02%channel%\x02 gelöscht."
  empty: "\x0307ℹ\x03 Channel \x02%channel%\x02 hat keine Zugriffseinträge."

# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#channel> [Begründung]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #channel\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #channel flooding\x03\x0F"
  short: "Alle Benutzer aus einem Channel kicken."
  help: |-
    Kickt alle Benutzer aus dem Channel. Dieser Befehl ist IRC-Operatoren
    vorbehalten; ohne angegebene Begründung wird eine Standardbegründung verwendet.
  not_on_network: "\x0304✗\x03 Channel \x02%channel%\x02 ist derzeit nicht im Netzwerk."
  empty: "\x0307ℹ\x03 Channel \x02%channel%\x02 hat keine Benutzer zum Kicken."
  success: "\x0303✔\x03 \x02%count%\x02 Benutzer aus \x02%channel%\x02 gekickt."
  default_reason: "CLEARUSERS-Befehl"

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <Muster> [Seite]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "Registrierte Kanäle nach Muster auflisten."
  help: |-
    Listet registrierte Channels auf, die dem Muster entsprechen. Das
    Platzhalterzeichen
    * steht für beliebig viele Zeichen. Die optionale Seite beginnt bei 1.
  header: "Kanal | Gründer | Registrierung | Zuletzt verwendet | Status"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Keine Kanäle entsprechen dem Muster %pattern%."
  status_active: "Aktiv"
  status_pending_registration: "Genehmigung ausstehend"
  status_rejected_registration: "Registrierung abgelehnt"

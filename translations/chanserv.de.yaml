# Übersetzungen für ChanServ — Deutsch
# Domäne: chanserv
#
# IRC-Formatcodes (doppelte Anführungszeichen oder !irc-Literalblöcke):
#   \x02        Fettdruck ein/aus
#   \x03NN      Farbe (DEZIMAL: 03=grün, 04=rot, 07=orange, 14=dunkelgrau)
#   \x03        Farbe zurücksetzen
#   \x0F        gesamte Formatierung zurücksetzen
#
# IRC-Farben verwenden DEZIMALZAHLEN (0-15), keine Hexadezimalzahlen.
#   \x0314 = dunkelgrau (14 dezimal): RICHTIG
#   \x030F = Farbe 0 gefolgt vom Buchstaben F: FALSCH
#
# Mehrzeiliger IRC-Text: !irc |- mit echten Zeilenumbrüchen und Leerzeichen.
# Blöcke ohne Tag dekodieren keine Escape-Sequenzen; CTCP-Literale erhalten.
# HELP-Beispiele: example/examples und %command_prefix%.
# Die Darstellung ergänzt /msg ohne Farbe und einen Rand von zwei Leerzeichen.

# --- ERROR --------------------------------------------------------------------
error:
  invalid_channel: "Ungültiger Channel-Name. Verwenden Sie %example%."
  invalid_channel_example: "#channel"
  generic: "Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut."

# --- REGISTER -----------------------------------------------------------------
register:
  syntax: "REGISTER <#channel> <Beschreibung>"
  example: "%command_prefix%REGISTER #channel Gemeinschaftsprojekt"
  short: "Einen Channel registrieren."
  help: |-
    Registriert einen Channel und verknüpft ihn mit Ihrem Nickname. Sie
    müssen bei %nickserv% identifiziert sein. Im Modus APPROVAL muss ein
    IRCop die Anfrage genehmigen.
  success: "Channel %channel% wurde registriert."
  already_registered: "Der Channel %channel% ist bereits registriert oder wartet auf die Registrierung."
  channel_not_on_network: "Channel %channel% existiert nicht im Netzwerk."
  pending_deletion: "Der Channel %channel% steht zur Löschung an und kann nicht registriert werden."
  insufficient_channel_rank: "Du musst mindestens Operator-Status in %channel% haben, um den Channel zu registrieren."
  limit_exceeded: "Sie haben das Maximum von %max% registrierten Channels erreicht."
  throttled: "Sie müssen %minutes% Minute(n) warten, bevor Sie einen weiteren Channel registrieren."

  awaiting_approval: "Die Anfrage für %channel% wartet auf die Freigabe durch einen IRCop."
  restricted_indefinite: "Neue Registrierungsanfragen für %channel% sind unbegrenzt gesperrt."
  restricted_until: "Neue Registrierungsanfragen für %channel% sind bis %date% gesperrt"

# --- INFO ---------------------------------------------------------------------

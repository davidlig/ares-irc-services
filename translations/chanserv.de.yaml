  last_used: "  \x0314Zuletzt genutzt\x03    : %date%"
  topic: "  \x0314Letztes Topic\x03      : %topic%"
  topic_set_by: "  \x0314Topic gesetzt von\x03  : %nickname%"
  options: "  \x0314Optionen\x03           : %options%"
  private: "\x0304✗\x03 Die Kanalinformationen für \x02%channel%\x02 sind privat."
  no_expire: "  \x0314Läuft nie ab\x03       : Ja"
  mlock_modes: "  \x0314Mode-Sperre\x03        : %modes%"
  suspended_status: "  \x0314Status\x03             : \x0304Suspendiert\x03"
  suspended_reason: "  \x0314Begründung\x03         : %reason%"
  suspended_until: "  \x0314Endet am\x03           : %date%"
  suspended_permanent: "  \x0314Endet am\x03           : Dauerhaft"
  forbidden_status: "  \x0314Status\x03             : \x0304Gesperrt\x03"
  forbidden_reason: "  \x0314Begründung\x03         : %reason%"
  pending_deletion_status: "  \x0314Status\x03             : \x0307Löschung ausstehend\x03"
  pending_deletion_at: "  \x0314Gelöscht\x03           : %date%"
  pending_deletion_until: "  \x0314Endgültig am\x03       : %date%"
  pending_deletion_notice: "  \x0307Dieser Kanal ist eingefroren und kann nicht registriert werden.\x03"


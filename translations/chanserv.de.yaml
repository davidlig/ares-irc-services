# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303OP #channel Alice\x03\x0F"
  short: "Channel-Operator-Modus vergeben."
  help: "Channel-Operator-Modus vergeben."
  done: "\x0303✔\x03 \x02%nickname%\x02 wurde der Channel-Operator-Status verliehen."
  user_not_on_channel: "\x0304✗\x03 Nickname \x02%nickname%\x02 ist nicht im Netzwerk."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 gibt \x0304%mode%\x03 an \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEOP #channel Alice\x03\x0F"
  short: "Channel-Operator-Modus entfernen."
  help: "Channel-Operator-Modus entfernen."
  done: "\x0303✔\x03 \x02%nickname%\x02 wurde der Operator-Status entzogen."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 Bei aktiviertem SECURE muss \x02%nickname%\x02 mindestens Level \x02%level%\x02 haben, um \x02%mode%\x02 zu erhalten."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#channel> {FOUNDER <Nickname> [Token]|SUCCESSOR [nickname]|DESC <Beschreibung>|URL [url]|EMAIL [E-Mail]|ENTRYMSG [Nachricht]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%\x02\x0303SET #channel DESC Ein Community-Channel\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #channel URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #channel MLOCK ON\x03\x0F"
  short: "Channel-Optionen ändern."
  help: |-
    Ändert eine Channel-Option. Die Hilfe zu jeder Option erklärt ihre
    Voraussetzungen und Varianten.
  unknown_option: "\x0304✗\x03 Unbekannte Option \x02%option%\x02. Verwenden Sie eine der folgenden: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Verwende SET <#Kanal> FOUNDER <Nickname> <token> mit dem bestätigten Token des aktuellen Gründers."
    token_unavailable: "Der aktuelle Gründer hat kein bestätigtes Rettungstoken. Er muss sich zuerst authentifizieren und VERIFY verwenden."
    syntax: "SET <#Kanal> FOUNDER <Nickname> [Token]"
    example: "%command_prefix%\x02\x0303SET #channel FOUNDER Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel FOUNDER Alice bestätigtes-Token\x03\x0F"
    short: "Channel an einen anderen registrierten Nickname übertragen."
    help: |-
      Ändert den Gründer nach Prüfung des Tokens des aktuellen Gründers. Die
      administrative Ausnahme auf Gründerebene bleibt bestehen. Das Token wird nicht
      verbraucht.
    invalid_token: "Das Rettungstoken ist ungültig."
    updated: "\x0303✔\x03 Founder wurde zu \x02%nickname%\x02 geändert."
    throttled: "Zu viele ungültige Token. Versuche es in %minutes% Minute(n) erneut."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 muss registriert und aktiviert sein."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 ist suspendiert und kann nicht als Founder gesetzt werden."
    cannot_be_self: "\x0304✗\x03 Der neue Founder kann nicht der aktuelle Founder sein."
    cannot_be_successor: "\x0304✗\x03 Der neue Founder kann nicht der Channel-Successor sein."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 hat das Maximum von %max% registrierten Channels erreicht."
    notice_channel: "\x02%from%\x02 weist \x02%nickname%\x02 als Channel-Founder zu."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%\x02\x0303SET #channel SUCCESSOR Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel SUCCESSOR\x03\x0F"
    short: "Den Channel-Successor festlegen."
    help: |-
      Legt einen Nickname als Channel-Nachfolger fest. Ohne Nickname wird der
      aktuelle Nachfolger entfernt. Der Nickname muss registriert und aktiviert sein.
    cleared: "\x0303✔\x03 Successor wurde gelöscht."
    updated: "\x0303✔\x03 Successor wurde auf \x02%nickname%\x02 gesetzt."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 muss registriert und aktiviert sein."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 ist suspendiert und kann nicht als Successor gesetzt werden."
    cannot_be_founder: "\x0304✗\x03 Der Founder kann nicht als Successor gesetzt werden."
    notice_channel: "\x02%from%\x02 weist \x02%nickname%\x02 als Channel-Successor zu."
    notice_channel_cleared: "\x02%from%\x02 hat den Channel-Successor gelöscht."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <Beschreibung>"
    example: "%command_prefix%\x02\x0303SET #channel DESC Ein Community-Channel\x03\x0F"
    short: "Channel-Beschreibung ändern."
    help: "Die Channel-Beschreibung ändern (erforderlich)."
    updated: "\x0303✔\x03 Beschreibung aktualisiert."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%\x02\x0303SET #channel URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel URL\x03\x0F"
    short: "Channel-URL festlegen."
    help: "Ändert die Website-Adresse (URL) eines Channels. Ohne URL wird sie entfernt."
    updated: "\x0303✔\x03 URL aktualisiert."
    cleared: "\x0303✔\x03 URL gelöscht."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#channel> EMAIL [E-Mail]"
    example: "%command_prefix%\x02\x0303SET #channel EMAIL team@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel EMAIL\x03\x0F"
    short: "Channel-E-Mail festlegen."
    help: |-
      Ändert die E-Mail-Adresse eines Channels. Ohne E-Mail wird sie
      entfernt. Administrativ gesperrte E-Mail-Domains sind nicht zulässig.
      Administrative Ausnahme: Operatoren mit Gründerzugriff.
    invalid: "\x0304✗\x03 Ungültige E-Mail-Adresse."
    updated: "\x0303✔\x03 E-Mail aktualisiert."
    cleared: "\x0303✔\x03 E-Mail gelöscht."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#channel> ENTRYMSG [Nachricht]"
    example: "%command_prefix%\x02\x0303SET #channel ENTRYMSG Willkommen\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel ENTRYMSG\x03\x0F"
    short: "Channel-Betretensnachricht festlegen."
    help: "Legt die Willkommensnachricht (NOTICE) fest. Ohne Nachricht wird sie entfernt."
    updated: "\x0303✔\x03 Betretensnachricht aktualisiert."
    too_long: "\x0304✗\x03 Betretensnachricht darf %max% Zeichen nicht überschreiten."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #channel TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel TOPICLOCK OFF\x03\x0F"
    short: "Channel-Topic sperren."
    help: |-
      Verhindert Änderungen am Channel-Thema (Topic). Beim Aktivieren wird das
      aktuelle Thema gespeichert und gesperrt.
    on: "\x0303✔\x03 Topic-Sperre ist jetzt ON."
    off: "\x0303✔\x03 Topic-Sperre ist jetzt OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 aktiviert TOPICLOCK."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 deaktiviert TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #channel MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel MLOCK OFF\x03\x0F"
    short: "Channel-Modes sperren."
    help: |-
      Sperrt die aktuellen Channel-Modes (z. B. +nt). Bei ON können Modes nicht
      geändert werden.
    no_modes: "keine Modes"
    on: "\x0303✔\x03 MLOCK ist jetzt ON (%modes%)."
    off: "\x0303✔\x03 MLOCK ist jetzt OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 aktiviert MLOCK (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 deaktiviert MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#Channel> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #channel PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel PRIVATE OFF\x03\x0F"
    short: "Channel-Informationen verbergen."
    help: |-
      Bei ON können nur der Gründer und Benutzer mit Zugriff die
      Channel-Informationen sehen.
    on: "\x0303✔\x03 Channel-Informationen sind jetzt privat."
    off: "\x0303✔\x03 Channel-Informationen sind jetzt öffentlich."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #channel SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel SECURE OFF\x03\x0F"
    short: "Zugriffsliste für Channel-Ränge erforderlich."
    help: "Verhindert, dass Nicknames außerhalb der Zugriffsliste Channel-Ränge erhalten."
    on: "\x0303✔\x03 SECURE ist jetzt ON."
    off: "\x0303✔\x03 SECURE ist jetzt OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 aktiviert den SECURE-Modus."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 deaktiviert den SECURE-Modus."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#channel> {ADD <nickname> <Level>|DEL <nickname>|LIST}"
  example: "%command_prefix%\x02\x0303ACCESS #channel LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #channel ADD Alice 100\x03\x0F"
    - "%command_prefix%\x02\x0303ACCESS #channel DEL Alice\x03\x0F"
  short: "Zugriffsliste verwalten."
  help: "Verwaltet die Zugriffsliste des Channels."
  unknown_sub: "\x0304✗\x03 Unbekannter Unterbefehl \x02%sub%\x02. Verwenden Sie LIST, ADD oder DEL."
  level_range: "\x0304✗\x03 Zugriffslevel muss zwischen %min% und %max% liegen."
  cannot_manage_level: "\x0304✗\x03 Sie können nur Nicks mit einem Level verwalten, das strikt unter Ihrem eigenen liegt."
  founder_not_in_list: "\x0304✗\x03 Der Founder ist nicht in der Zugriffsliste."
  max_entries: "\x0304✗\x03 Maximal %max% Zugriffseinträge pro Channel."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#channel> LIST"
    example: "%command_prefix%\x02\x0303ACCESS #channel LIST\x03\x0F"
    short: "Zugriffsliste auflisten (erfordert ACCESSLIST-Level)."
    help: "Zeigt Nickname und Level für jeden Eintrag."
    header: "\x0303Zugriffsliste für \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Channel \x02%channel%\x02 hat keine Zugriffseinträge."
    entry: "  #%index%: %nickname% (Level %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#channel> ADD <nickname> <Level>"
    example: "%command_prefix%\x02\x0303ACCESS #channel ADD Alice 100\x03\x0F"
    short: "Zugriffslevel hinzufügen oder aktualisieren (erfordert ACCESSCHANGE-Level)."
    help: "Level 1-499. Sie können nur Level unter Ihrem eigenen setzen."
    done: "\x0303✔\x03 \x02%nickname%\x02 auf Level %level% gesetzt."
    notice_channel: "\x0303✔\x03 \x0302%from%\x03 setzt \x0314%to%\x03 auf Level \x0304%level%\x03"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#channel> DEL <nickname>"
    example: "%command_prefix%\x02\x0303ACCESS #channel DEL Alice\x03\x0F"
    short: "Aus Zugriffsliste entfernen (erfordert ACCESSCHANGE-Level)."
    help: "Sie können nur Nicks mit einem Level unter Ihrem eigenen entfernen."
    not_in_list: "\x0304✗\x03 \x02%nickname%\x02 ist nicht in der Zugriffsliste."
    done: "\x0303✔\x03 \x02%nickname%\x02 aus der Zugriffsliste entfernt."
    notice_channel: "\x0304✗\x03 \x0302%from%\x03 entfernt \x0314%to%\x03 aus der Zugriffsliste"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#channel>"
  example: "%command_prefix%\x02\x0303DELACCESS #channel\x03\x0F"
  short: "Ihren eigenen Zugriff aus einem Channel entfernen."
  help: |-
    Entfernt deinen Zugriffseintrag aus der Channel-Liste. Du musst identifiziert
    sein. Der Gründer kann diesen Befehl nicht verwenden.
  done: "\x0303✔\x03 Ihr Zugriff wurde aus \x02%channel%\x02 entfernt."
  not_in_list: "\x0304✗\x03 Sie haben keinen Zugriff in \x02%channel%\x02."
  founder_not_in_access: "\x0304✗\x03 Sie sind der Founder von \x02%channel%\x02 und sind nicht in der Zugriffsliste."
  notice_channel: "\x0304✗\x03 \x0302%nickname%\x03 entfernt seinen Zugriff aus dem Channel"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#channel> {LIST|SET <Level> <Wert>|RESET}"
  example: "%command_prefix%\x02\x0303LEVELS #channel LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #channel SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #channel RESET\x03\x0F"
  short: "Channel-Levels konfigurieren."
  help: |-
    Legt die Mindestzugriffsstufen für Channel-Aktionen fest. Nur der Gründer
    kann Stufen ändern oder zurücksetzen.
  unknown_sub: "\x0304✗\x03 Unbekannter Unterbefehl \x02%sub%\x02. Verwenden Sie LIST, SET oder RESET."
  unknown_key: "\x0304✗\x03 Unbekannter Level-Schlüssel \x02%key%\x02 oder wird von diesem IRCd nicht unterstützt."
  value_range: "\x0304✗\x03 Level-Wert muss zwischen %min% und %max% liegen."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#channel> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #channel LIST\x03\x0F"
    short: "Level-Anforderungen auflisten."
    help: "Zeigt jeden Level-Schlüssel und seinen Wert (Standardwerte, wenn nicht gesetzt)."
    header: "\x0303Zugriffsstufen für %channel%\x03"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#channel> SET <Level> <Wert>"
    example: "%command_prefix%\x02\x0303LEVELS #channel SET OPDEOP 50\x03\x0F"
    short: "Eine Level-Anforderung festlegen."
    help: "Wert -1 bis 499. Nur Founder."
    done: "\x0303✔\x03 \x02%key%\x02 auf %value% gesetzt."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#channel> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #channel RESET\x03\x0F"
    short: "Alle Levels auf Standardwerte zurücksetzen."
    help: "Entfernt alle Überschreibungen. Nur Founder."
    done: "\x0303✔\x03 Alle Levels auf Standardwerte zurückgesetzt."

# --- VOICE -----------------------------------------------------------------
voice:
  syntax: "VOICE <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303VOICE #channel Alice\x03\x0F"
  short: "Voice-Modus im Channel vergeben."
  help: "Voice-Modus im Channel vergeben."
  done: "\x0303✔\x03 \x02%nickname%\x02 wurde Voice verliehen."
  user_not_on_channel: "\x0304✗\x03 Nickname \x02%nickname%\x02 ist nicht im Netzwerk."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 gibt \x0304%mode%\x03 an \x0314%to%\x03"

# --- DEVOICE ---------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEVOICE #channel Alice\x03\x0F"
  short: "Voice-Modus im Channel entfernen."
  help: "Voice-Modus im Channel entfernen."
  done: "\x0303✔\x03 \x02%nickname%\x02 wurde Voice entzogen."

# --- UNBAN -----------------------------------------------------------------
unban:
  syntax: "UNBAN <#channel>"
  example: "%command_prefix%\x02\x0303UNBAN #channel\x03\x0F"
  short: "Dich betreffende Bans entfernen."
  help: |-
    Entfernt alle normalen Kanal-Bans, die laut IRCd deiner aktuellen Identität entsprechen, einschließlich Platzhaltern und IP/CIDR-Masken.
    Identifizierung und das konfigurierbare UNBAN-Level (Standard 200) sind erforderlich. Der Gründer behält Zugriff; Kanalmitgliedschaft und Operatorstatus sind nicht erforderlich.
    Erweiterte Bans bleiben unverändert. Kein Nickname oder Maskenargument ist erlaubt. Die Aktion wird nicht in der Kanal-HISTORY gespeichert.
  done: "%count% dich betreffende Ban(s) in %channel% entfernt."
  no_matches: "Keine normalen Bans entsprechen deiner Identität in %channel%; nichts wurde geändert."
  unavailable: "Deine passenden Bans konnten nicht ermittelt werden; nichts wurde geändert."
  not_on_network: "Kanal %channel% ist nicht im Netzwerk."

# --- INVITE ----------------------------------------------------------------
invite:
  syntax: "INVITE <#channel>"
  example: "%command_prefix%\x02\x0303INVITE #channel\x03\x0F"
  short: "Sich selbst in den Channel einladen."
  help: "Sich selbst in den Channel einladen."
  done: "\x0303✔\x03 Sie wurden in \x02%channel%\x02 eingeladen."
  notice_channel: "\x0303✔\x03 \x0302%nickname%\x03 lädt sich selbst in den Channel ein."

# --- ADMIN -----------------------------------------------------------------
admin:
  syntax: "ADMIN <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303ADMIN #channel Alice\x03\x0F"
  short: "Channel-Admin-Modus vergeben."
  help: "Channel-Admin-Modus vergeben. Nur wenn der IRCd +a unterstützt."
  done: "\x0303✔\x03 \x02%nickname%\x02 wurde zum Channel-Admin ernannt."
  user_not_on_channel: "\x0304✗\x03 Nickname \x02%nickname%\x02 ist nicht im Netzwerk."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 gibt \x0304%mode%\x03 an \x0314%to%\x03"
  not_supported: "\x0304✗\x03 Dieses Netzwerk unterstützt den Channel-Admin-Modus (+a) nicht."

# --- DEADMIN ---------------------------------------------------------------
deadmin:
  syntax: "DEADMIN <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEADMIN #channel Alice\x03\x0F"
  short: "Channel-Admin-Modus entfernen."
  help: "Channel-Admin-Modus entfernen."
  done: "\x0303✔\x03 \x02%nickname%\x02 wurde der Admin-Status entzogen."

# --- HALFOP ----------------------------------------------------------------
halfop:
  syntax: "HALFOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303HALFOP #channel Alice\x03\x0F"
  short: "Halb-Operator-Modus im Channel vergeben."
  help: "Halb-Operator-Modus im Channel vergeben. Nur wenn der IRCd +h unterstützt."
  done: "\x0303✔\x03 \x02%nickname%\x02 wurde Halfop verliehen."
  user_not_on_channel: "\x0304✗\x03 Nickname \x02%nickname%\x02 ist nicht im Netzwerk."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 gibt \x0304%mode%\x03 an \x0314%to%\x03"
  not_supported: "\x0304✗\x03 Dieses Netzwerk unterstützt den Halfop-Modus (+h) nicht."

# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEHALFOP #channel Alice\x03\x0F"
  short: "Halb-Operator-Modus im Channel entfernen."
  help: "Halb-Operator-Modus im Channel entfernen."
  done: "\x0303✔\x03 \x02%nickname%\x02 wurde Halfop entzogen."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> {ADD <Maske> [Ablauf] [Begründung]|DEL {<Maske>|<Nummer>}|LIST}"
  example: "%command_prefix%\x02\x0303AKICK #channel ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #channel ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #channel DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #channel DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #channel LIST\x03\x0F"
  short: "Auto-Kick-Liste verwalten."
  help: "Verwaltet automatische Kick-Einträge und deren optionale Ablaufzeit."
  unknown_sub: "\x0304✗\x03 Unbekannter Unterbefehl \x02%sub%\x02. Verwenden Sie ADD, DEL oder LIST."
  invalid_mask: "\x0304✗\x03 Ungültiges Maskenformat. Verwenden Sie \x02nick!ident@host\x02 mit Platzhaltern (*)."
  dangerous_mask: "\x0304✗\x03 Die Maske \x02%mask%\x02 ist zu allgemein. Sie muss mindestens 4 alphanumerische Zeichen enthalten."
  protected_user: "\x0304✗\x03 Nickname \x02%nickname%\x02 hat Zugriff in diesem Channel."
  max_entries: "\x0304✗\x03 Maximal %max% AKICK-Einträge pro Channel."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <Maske> [Ablauf] [Begründung]"
    example: "%command_prefix%\x02\x0303AKICK #channel ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #channel ADD *!*@* 7d Spam\x03\x0F"
    short: "AKICK-Eintrag hinzufügen."
    help: |-
      Fügt der automatischen Kick-Liste des Channels eine Maske hinzu.

      Du kannst Dauer und Begründung angeben. Wenn du eine Begründung angibst, musst
      du auch eine Dauer angeben: 0 für dauerhaft, d für Tage, h für Stunden oder m
      für Minuten.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 hinzugefügt."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 existiert bereits."
    notice_channel: "\x02%from%\x02 fügt AKICK hinzu: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL {<Maske>|<Nummer>}"
    example: "%command_prefix%\x02\x0303AKICK #channel DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #channel DEL 2\x03\x0F"
    short: "AKICK-Eintrag entfernen."
    help: "Entfernt anhand der exakten Maske oder der Eintragsnummer aus LIST."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 nicht gefunden."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 entfernt."
    notice_channel: "\x02%from%\x02 entfernt AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#channel> LIST"
    example: "%command_prefix%\x02\x0303AKICK #channel LIST\x03\x0F"
    short: "AKICK-Einträge auflisten."
    help: "Zeigt Maske, Begründung, Ablauf und wer hinzugefügt hat."
    header: "\x0303AKICK-Liste für \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Channel \x02%channel%\x02 hat keine AKICK-Einträge."
    entry: "  #%index% %mask% %reason% (von %nickname%, läuft ab: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#channel>"
  example: "%command_prefix%\x02\x0303RESTORE #channel\x03\x0F"
  short: "Einen zur Löschung anstehenden Channel wiederherstellen."
  help: |-
    Stellt einen manuell gelöschten Channel wieder her, sofern die Schonfrist
    noch nicht abgelaufen ist.
  success: "\x0303✔\x03 Channel \x02%channel%\x02 wurde wiederhergestellt."
  not_pending_deletion: "\x0304✗\x03 Channel \x02%channel%\x02 steht nicht zur Löschung an."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#channel> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #channel\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP #channel FORCE\x03\x0F"
  short: "Einen registrierten Channel löschen."
  help: |-
    Löscht einen registrierten Channel aus der Datenbank.
    FORCE löscht einen zur Löschung vorgemerkten Channel endgültig.
    Ein IRCop mit DROP-Berechtigung kann ausstehende und abgelehnte
    Registrierungsanfragen sofort mit oder ohne FORCE freigeben.
  registration_restricted: "\x0304✗\x03 Diese Registrierungsanfrage ist bis %date% gesperrt."
  force:
    short: "Löscht einen zur Löschung vorgemerkten Channel endgültig."
  success: "\x0303✔\x03 Kanal \x02%channel%\x02 wurde zur Löschung markiert und kann während der Schonfrist wiederhergestellt werden."
  force_success: "\x0303✔\x03 Channel \x02%channel%\x02 wurde endgültig gelöscht."
  pending_deletion: "\x0304✗\x03 Channel \x02%channel%\x02 ist bereits zur Löschung vorgemerkt. Verwenden Sie DROP <#channel> FORCE, um ihn dauerhaft zu löschen."
  invalid_channel: "\x0304✗\x03 Ungültiger Channel-Name. Verwenden Sie \x02#channel\x02."
  pending_deletion_reason: "Der Channel %channel% wird gerade gelöscht. Weitere Informationen: /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#channel> <Dauer> <Begründung>"
  example: "%command_prefix%\x02\x0303SUSPEND #channel 7d Regelverstoß\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND #channel 0 Regelverstoß\x03\x0F"
  short: "Einen Channel suspendieren."
  help: |-
    Deaktiviert einen registrierten Channel vorübergehend. Dauerformate: 0 =
    dauerhaft, 1d, 12h, 60m.
    Während der Sperre sind Channel-Modi, Zugriff und Durchsetzung deaktiviert.
  success: "\x0303✔\x03 Channel \x02%channel%\x02 wurde suspendiert bis \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 Channel \x02%channel%\x02 ist bereits suspendiert."
  invalid_duration: "\x0304✗\x03 Ungültige Dauer. Verwenden Sie: 0 (dauerhaft), 1d, 12h oder 60m."
  channel_suspended: "\x0304✗\x03 Channel \x02%channel%\x02 ist suspendiert und kann nicht verwendet werden."
  notice_channel: "\x0304⚠\x03 Channel wurde suspendiert. Begründung: %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#channel>"
  example: "%command_prefix%\x02\x0303UNSUSPEND #channel\x03\x0F"
  short: "Eine Channel-Suspendierung aufheben."
  help: |-
    Reaktiviert einen gesperrten Channel und stellt Modi und Durchsetzung wieder
    her.
  success: "\x0303✔\x03 Channel \x02%channel%\x02 ist nicht mehr suspendiert."
  not_suspended: "\x0304✗\x03 Channel \x02%channel%\x02 ist nicht suspendiert."
  reason_expired: "abgelaufene Suspendierung"

# --- NOJOIN ----------------------------------------------------------------
nojoin:
  reason: "NOJOIN-Level-Einschränkung"

# --- DEBUG CHANNEL ---------------------------------------------------------
debug_channel:
  kick_reason: "Sie sind nicht berechtigt, diesen Channel zu betreten."

# --- IRCOPONLY -------------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#channel> {ON|OFF}"
  example: "%command_prefix%\x02\x0303IRCOPONLY #channel ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOPONLY #channel OFF\x03\x0F"
  short: "Einen Kanal auf IRC-Operatoren beschränken."
  help: |-
    Nur autorisierte IRC-Operatoren dürfen im Channel bleiben. %bot% setzt
    diese Einschränkung durch.
  on: "IRCOPONLY ist für %channel% aktiviert."
  off: "IRCOPONLY ist für %channel% deaktiviert."

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#channel> {ON|OFF}"
  example: "%command_prefix%\x02\x0303NOEXPIRE #Wichtig ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE #Wichtig OFF\x03\x0F"
  short: "Ablaufschutz für einen Channel setzen oder entfernen."
  help: |-
    Legt fest, ob der Channel wegen Inaktivität abläuft.
    ON verhindert den Ablauf, OFF wendet die normalen Regeln an.
  success_on: "\x0303✔\x03 Channel \x02%channel%\x02 ist jetzt vor Ablauf geschützt."
  success_off: "\x0303✔\x03 Channel \x02%channel%\x02 läuft jetzt normal ab."
  forbidden: "\x0304✗\x03 Channel \x02%channel%\x02 ist gesperrt."
  suspended: "\x0304✗\x03 Channel \x02%channel%\x02 ist suspendiert."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <#channel> <Begründung>"
  example: "%command_prefix%\x02\x0303FORBID #channel Regelverstoß\x03\x0F"
  short: "Einen Channel für die Nutzung sperren."
  help: |-
    Verbietet die Nutzung eines Channels, kickt alle Benutzer und verhindert
    ihren erneuten Beitritt. Ein registrierter Channel wird vor der Sperre
    aufgehoben.
  reason_required: "\x0304✗\x03 Sie müssen eine Begründung angeben."
  success: "\x0303✔\x03 Channel \x02%channel%\x02 wurde gesperrt."
  updated: "\x0303✔\x03 Begründung für die Sperre von Channel \x02%channel%\x02 wurde aktualisiert."
  channel_forbidden: "\x0304✗\x03 Channel \x02%channel%\x02 ist gesperrt und kann nicht verwendet werden."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#channel>"
  example: "%command_prefix%\x02\x0303UNFORBID #channel\x03\x0F"
  short: "Eine Channel-Sperrung aufheben."
  help: "Hebt die Channel-Sperre auf, sodass der Channel erneut registriert werden kann."
  success: "\x0303✔\x03 Channel \x02%channel%\x02 ist nicht mehr gesperrt."
  not_forbidden: "\x0304✗\x03 Channel \x02%channel%\x02 ist nicht gesperrt."

# --- DEBUG -----------------------------------------------------------------
debug:
  registration_completed: "%operator% hat den Kanal %target% registriert"
  registration_pending: "%operator% hat die Registrierung des Kanals %target% beantragt"
  founder_action: "Level-Founder-Aktion"

# --- HISTORY ---
history:
  syntax: "HISTORY <#channel> {ADD <Nachricht>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"

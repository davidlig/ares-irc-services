# --- CLEARUSERS (IRCop) -------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#channel> [Begründung]"
  example: "%command_prefix%CLEARUSERS #channel"
  examples:
    - "%command_prefix%CLEARUSERS #channel flooding"
  short: "Alle Benutzer aus einem Channel kicken."
  help: |-
    Kickt alle Benutzer aus dem Channel. Dieser Befehl ist IRC-Operatoren
    vorbehalten; ohne angegebene Begründung wird eine Standardbegründung verwendet.
  not_on_network: "Channel %channel% ist derzeit nicht im Netzwerk."
  empty: "Channel %channel% hat keine Benutzer zum Kicken."
  success: "%count% Benutzer aus %channel% gekickt."
  default_reason: "CLEARUSERS-Befehl"

# --- CLEARACCESS (IRCop) ------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#channel>"
  example: "%command_prefix%CLEARACCESS #channel"
  short: "Die gesamte Zugriffsliste eines Channels löschen."
  help: "Entfernt alle Zugriffseinträge des Channels. Dieser Vorgang ist unwiderruflich."
  success: "%count% Zugriffseinträge aus %channel% gelöscht."
  empty: "Channel %channel% hat keine Zugriffseinträge."

# --- IRCOPONLY (IRCop) --------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#channel> {ON|OFF}"
  example: "%command_prefix%IRCOPONLY #channel ON"
  examples:
    - "%command_prefix%IRCOPONLY #channel OFF"
  short: "Einen Kanal auf IRC-Operatoren beschränken."
  help: |-
    Nur autorisierte IRC-Operatoren dürfen im Channel bleiben. %bot% setzt
    diese Einschränkung durch.
  on: "IRCOPONLY ist für %channel% aktiviert."
  off: "IRCOPONLY ist für %channel% deaktiviert."

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <#channel> <nickname> <Beschreibung>"
  short: "Einen Channel administrativ registrieren."
  help: |-
    Syntax: SAREGISTER <#channel> <nickname> <Beschreibung>

    Registriert einen Channel sofort administrativ für den angegebenen Nickname
    als Gründer, ohne Anwesenheit, Verifizierung oder Ratenbegrenzung zu erfordern.
  example: "%command_prefix%SAREGISTER #channel Alice Gemeinschaftskanal"
  success: "Channel %channel% wurde für %founder% registriert."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#channel> {ON|OFF}"
  example: "%command_prefix%NOEXPIRE #Wichtig ON"
  examples:
    - "%command_prefix%NOEXPIRE #Wichtig OFF"
  short: "Ablaufschutz für einen Channel setzen oder entfernen."
  help: |-
    Legt fest, ob der Channel wegen Inaktivität abläuft.
    ON verhindert den Ablauf, OFF wendet die normalen Regeln an.
  success_on: "Channel %channel% ist jetzt vor Ablauf geschützt."
  success_off: "Channel %channel% läuft jetzt normal ab."
  forbidden: "Channel %channel% ist gesperrt."
  suspended: "Channel %channel% ist suspendiert."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <#channel> [FORCE]"
  example: "%command_prefix%DROP #channel"
  examples:
    - "%command_prefix%DROP #channel FORCE"
  short: "Einen registrierten Channel löschen."
  help: |-
    Löscht einen registrierten Channel aus der Datenbank.
    FORCE löscht einen zur Löschung vorgemerkten Channel endgültig.
    Ein IRCop mit DROP-Berechtigung kann ausstehende und abgelehnte
    Registrierungsanfragen sofort mit oder ohne FORCE freigeben.
  registration_restricted: "Diese Registrierungsanfrage ist bis %date% gesperrt."
  force:
    short: "Löscht einen zur Löschung vorgemerkten Channel endgültig."
  success: "Kanal %channel% wurde zur Löschung markiert und kann während der Schonfrist wiederhergestellt werden."
  force_success: "Channel %channel% wurde endgültig gelöscht."
  pending_deletion: "Channel %channel% ist bereits zur Löschung vorgemerkt. Verwenden Sie DROP <#channel> FORCE, um ihn dauerhaft zu löschen."
  invalid_channel: "Ungültiger Channel-Name. Verwenden Sie %example%."
  pending_deletion_reason: "Der Channel %channel% wird gerade gelöscht. Weitere Informationen: /msg %bot% \x0303INFO %channel%\x03"

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <#channel>"
  example: "%command_prefix%RESTORE #channel"
  short: "Einen zur Löschung anstehenden Channel wiederherstellen."
  help: |-
    Stellt einen manuell gelöschten Channel wieder her, sofern die Schonfrist
    noch nicht abgelaufen ist.
  success: "Channel %channel% wurde wiederhergestellt."
  not_pending_deletion: "Channel %channel% steht nicht zur Löschung an."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <#channel> <Dauer> <Begründung>"
  example: "%command_prefix%SUSPEND #channel 7d Regelverstoß"
  examples:
    - "%command_prefix%SUSPEND #channel 0 Regelverstoß"
  short: "Einen Channel suspendieren."
  help: |-
    Deaktiviert einen registrierten Channel vorübergehend. Dauerformate: 0 =
    dauerhaft, 1d, 12h, 60m.
    Während der Sperre sind Channel-Modi, Zugriff und Durchsetzung deaktiviert.
  success: "Channel %channel% wurde suspendiert bis %duration%."
  already_suspended: "Channel %channel% ist bereits suspendiert."
  invalid_duration: "Ungültige Dauer. Verwenden Sie: 0 (dauerhaft), 1d, 12h oder 60m."
  channel_suspended: "Channel %channel% ist suspendiert und kann nicht verwendet werden."
  notice_channel: "Channel wurde suspendiert. Begründung: %reason%"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#channel>"
  example: "%command_prefix%UNSUSPEND #channel"
  short: "Eine Channel-Suspendierung aufheben."
  help: |-
    Reaktiviert einen gesperrten Channel und stellt Modi und Durchsetzung wieder
    her.
  success: "Channel %channel% ist nicht mehr suspendiert."
  not_suspended: "Channel %channel% ist nicht suspendiert."
  reason_expired: "abgelaufene Suspendierung"

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <#channel> <Begründung>"
  example: "%command_prefix%FORBID #channel Regelverstoß"
  short: "Einen Channel für die Nutzung sperren."
  help: |-
    Verbietet die Nutzung eines Channels, kickt alle Benutzer und verhindert
    ihren erneuten Beitritt. Ein registrierter Channel wird vor der Sperre
    aufgehoben.
  reason_required: "Sie müssen eine Begründung angeben."
  success: "Channel %channel% wurde gesperrt."
  updated: "Begründung für die Sperre von Channel %channel% wurde aktualisiert."
  channel_forbidden: "Channel %channel% ist gesperrt und kann nicht verwendet werden."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#channel>"
  example: "%command_prefix%UNFORBID #channel"
  short: "Eine Channel-Sperrung aufheben."
  help: "Hebt die Channel-Sperre auf, sodass der Channel erneut registriert werden kann."
  success: "Channel %channel% ist nicht mehr gesperrt."
  not_forbidden: "Channel %channel% ist nicht gesperrt."


  examples:
    - "%command_prefix%\x02\x0303HISTORY #channel DEL 42\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #channel VIEW\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #channel VIEW 2\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #channel VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #channel CLEAR\x03\x0F"
  short: "Channel-Aktionsverlauf anzeigen oder verwalten."
  help: "Verwaltet den Aktionsverlauf eines Channels."

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#channel> ADD <Nachricht>"
    example: "%command_prefix%\x02\x0303HISTORY #channel ADD Moderationsprüfung\x03\x0F"
    short: "Einen manuellen Verlaufseintrag hinzufügen."
    help: |-
      Fügt einen manuellen Eintrag zum Channel-Verlauf hinzu.
    success: "\x0303✔\x03 Verlaufseintrag für \x02%channel%\x02 hinzugefügt."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#channel> DEL <id>"
    example: "%command_prefix%\x02\x0303HISTORY #channel DEL 42\x03\x0F"
    short: "Löscht einen Verlaufseintrag."
    help: "Löscht einen Verlaufseintrag anhand seiner ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#channel> VIEW [PAGE|ALL]"
    example: "%command_prefix%\x02\x0303HISTORY #channel VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY #channel VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY #channel VIEW ALL\x03\x0F"
    short: "Channel-Aktionsverlauf anzeigen."
    help: "Zeigt die Verlaufseinträge des Channels an."
    header: "\x02Verlauf für \x0307%channel%\x03\x02 (zeigt %start%-%end% von %total%):"
    entry: "#%id% [%date%] \x0303%action%\x03 von %operator% — %message%"
    no_entries: "\x0307ℹ\x03 Keine Verlaufseinträge für \x02%channel%\x02 gefunden."
    page_hint: "Verwenden Sie \x0303HISTORY %channel% VIEW %next_page%\x03 für weitere Einträge."

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#channel> CLEAR"
    example: "%command_prefix%\x02\x0303HISTORY #channel CLEAR\x03\x0F"
    short: "Alle Verlaufseinträge für einen Channel löschen."
    help: "Löscht alle Verlaufseinträge des Channels."
    success: "\x0303✔\x03 \x02%count%\x02 Verlaufseinträge für \x02%channel%\x02 gelöscht."


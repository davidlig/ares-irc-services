# Traductions de NickServ — Français
# Domaine: nickserv
#
# Codes de formatage IRC (guillemets doubles ou blocs littéraux !irc) :
#   \x02        active/désactive le gras
#   \x03NN      couleur (DÉCIMAL : 03=vert, 04=rouge, 07=orange, 14=gris foncé)
#   \x03        réinitialise la couleur
#   \x0F        réinitialise tout le formatage
#
# Les couleurs IRC utilisent des nombres DÉCIMAUX (0-15), pas hexadécimaux.
#   \x0314 = gris foncé (14 décimal) : CORRECT
#   \x030F = couleur 0 suivie de la lettre F : ERREUR
#
# Texte IRC multiligne : !irc |- avec des sauts de ligne et des espaces réels.
# Les blocs sans balise ne décodent pas les échappements ; préserver CTCP.
# Exemples HELP : example/examples et %command_prefix%.
# Le présentateur ajoute /msg sans couleur et une marge de deux espaces.

# --- REGISTER -----------------------------------------------------------------
register:
  token_unavailable: !irc |-
    L’inscription est en attente, mais le jeton n’a pas pu être remis.
    Attendez son expiration avant de vous réinscrire.
  syntax: "REGISTER <motdepasse> [email]"
  short: "Enregistrer votre surnom auprès des services."
  help: |-
    Enregistre votre pseudonyme. Selon la configuration du réseau, le jeton de
    vérification vous sera envoyé par chat ou par e-mail.
    Une fois validé, il deviendra votre jeton de récupération permanent :
    conservez-le en lieu sûr.
    La durée de validité de %duration% ne s’applique qu’avant sa validation.
    Les domaines de courriel bloqués par l’administration sont refusés.
  example: "%command_prefix%REGISTER MotDePasse$ur_123"
  examples:
    - "%command_prefix%REGISTER MotDePasse$ur_123 utilisateur@exemple.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Un jeton de vérification a été envoyé à %email%."
  pending_line_2: "Exécutez /msg %bot% %verify% pour terminer l’enregistrement."
  pending_line_3: "Vous ne l’avez pas reçu ? Vérifiez vos indésirables ou utilisez /msg %bot% %resend%"
  pending_line_4: "Le jeton expirera dans %duration%."
  already_registered: "Le surnom %nickname% est déjà enregistré."
  already_pending: "L’enregistrement de %nickname% est en attente. Utilisez %verify%. Si le jeton a été envoyé par e-mail et qu’une adresse valide est associée, vous pouvez en demander un autre avec %resend%."
  forbidden: "Le surnom %nickname% ne peut pas être enregistré sur ce réseau."
  pending_deletion: "Le surnom %nickname% est en attente de suppression et ne peut pas être enregistré."
  invalid_email: "L'adresse e-mail fournie n'est pas valide."
  email_already_used: "L'e-mail %email% est déjà utilisé par un autre surnom. Utilisez une adresse différente."
  throttled: "Vous devez attendre %minutes% minute(s) avant de réessayer l'enregistrement."
  guest_prefix_forbidden: "Vous ne pouvez pas enregistrer un surnom commençant par %prefix%."

# --- IDENTIFY -----------------------------------------------------------------
identify:
  syntax: "IDENTIFY <surnom> <motdepasse>"
  short: "S'identifier comme le propriétaire d'un surnom."
  help: |-
    Authentifie votre session auprès de %nickserv% avec votre surnom et mot de
    passe.
    Après une identification réussie, vous recevrez le mode enregistré %emphasis_0%
    et, si vous utilisiez un surnom invité, votre surnom enregistré sera restauré.
  example: "%command_prefix%IDENTIFY Utilisateur <mot_de_passe>"
  native_syntax: "/NICK <surnom>:<motdepasse> | /NICK <surnom>!<motdepasse>"
  native_short: "Affiche la syntaxe native d’authentification du pseudonyme."
  native_help: |-
    Ce protocole authentifie les comptes par changement de pseudonyme.
    Utilisez %emphasis_0% ou, si le pseudonyme est occupé, %emphasis_1%.
  native_example: "/NICK Utilisateur:<mot_de_passe>"
  native_examples:
    - "%command_prefix%/NICK Utilisateur!<mot_de_passe>"
  native_authentication: "Ce protocole gère l’authentification par changement de pseudonyme. Utilisez %command_0% ou, si le pseudonyme est occupé, %command_1%."
  native_authentication_command_0: "/NICK <surnom>:<motdepasse>"
  native_authentication_command_1: "/NICK <surnom>!<motdepasse>"
  success: "Vous êtes maintenant identifié en tant que %nickname%."
  already_identified: "Vous êtes déjà identifié en tant que %nickname%."
  invalid_credentials: "Mot de passe incorrect. Veuillez réessayer."
  locked_out: "Trop de tentatives échouées. Réessayez dans %minutes% minute(s)."
  ghost_released: "La session fantôme qui occupait %nickname% a été déconnectée."
  kill_reason: "Surnom %nickname% récupéré par %source% (le propriétaire enregistré s'est identifié)"
  pending: |-
    %first%
    %second%
  pending_line_1: "Le pseudonyme %nickname% est en attente de vérification par e-mail."
  pending_line_2: "Exécutez /msg %bot% %command_0% ou /msg %bot% %command_1%"
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Le surnom %nickname% est suspendu. Raison : %reason%"
  forbidden: "Le surnom %nickname% ne peut pas être utilisé sur ce réseau."
  pending_deletion: "Le surnom %nickname% est en attente de suppression et ne peut pas être utilisé."

# --- VERIFY -------------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirme une inscription ou un jeton de secours."
  help: |-
    Une fois validé, ce jeton deviendra votre jeton de récupération permanent.
    Conservez-le en lieu sûr : il vous permettra de récupérer votre pseudonyme.
    La durée de validité de %duration% ne s’applique qu’avant sa validation.
  example: "%command_prefix%VERIFY <jeton_reçu>"
  success: "Le surnom %nickname% a été enregistré avec succès et vous êtes maintenant identifié."
  success_native: "Le surnom %nickname% a été enregistré avec succès. Utilisez l’authentification native indiquée ci-dessous."
  invalid_token: "Le jeton de secours est incorrect."
  no_pending: "Vous n'avez aucun enregistrement en attente à vérifier."

# --- RESEND -------------------------------------------------------------------
resend:
  disabled: "Vous ne pouvez pas demander un autre jeton avec %resend%, car cet enregistrement envoie le jeton directement par chat."
  syntax: "RESEND"
  short: "Renvoyer le jeton de vérification à votre e-mail."
  help: |-
    RESEND n’est disponible que si le jeton de vérification a été envoyé par e-mail.
    Une fois validé, ce jeton deviendra votre jeton de récupération permanent.
    Conservez-le en lieu sûr : il vous permettra de récupérer votre pseudonyme.
    La durée de validité de %duration% ne s’applique qu’avant sa validation.
    En utilisant RESEND, vous recevrez un nouveau jeton par e-mail.
    La durée de l’enregistrement en attente sera prolongée de %duration%.
  example: "%command_prefix%RESEND"
  success: "Jeton de vérification renvoyé à %email%."
  no_pending: "Vous n'avez aucun enregistrement en attente à vérifier."
  throttled: "Vous devez attendre %minutes% minute(s) avant de demander un autre e-mail de vérification."

# --- RECOVER ------------------------------------------------------------------
recover:
  no_email: "Aucun e-mail n'est défini pour le surnom %nickname%. La récupération n'est pas disponible."
  email_sent: "Un jeton de récupération a été envoyé à %email_hint%. Vérifiez votre boîte de réception (et vos spams)."
  pending_deletion: "Le pseudonyme %nickname% est en attente de suppression et ne peut pas être récupéré."
  instructions: "EMAIL : %command_0% demande un jeton provisoire par courriel. TOKEN : fournissez votre jeton confirmé. %command_1% accepte le jeton valide du courriel ou le jeton confirmé. Celui du courriel remplace le jeton enregistré après validation. L’utilisation du jeton enregistré propose un remplacement facultatif avec %command_2% ; ignorez le message pour le conserver."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <surnom> [jeton]"
  short: "Récupérer votre surnom si vous avez perdu votre mot de passe."
  help: |-
    Sans jeton, demandez un jeton provisoire par e-mail.
    Vous pouvez aussi fournir un jeton de récupération valide ; s’il est
    provisoire, il ne remplacera le jeton enregistré qu’après validation.
    VERIFY vous proposera un remplacement facultatif après utilisation du jeton
    enregistré ; ignorez ce message si vous souhaitez conserver le jeton actuel.
  example: "%command_prefix%RECOVER Utilisateur"
  examples:
    - "%command_prefix%RECOVER Utilisateur <jeton_reçu>"
  pending: "L’enregistrement de %nickname% est en attente. Utilisez %command_0%. Si le jeton a été envoyé par e-mail et qu’une adresse valide est associée, vous pouvez en demander un autre avec %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Le surnom %nickname% est suspendu. Raison : %reason%"
  forbidden: "Le surnom %nickname% ne peut pas être utilisé sur ce réseau."
  throttled: "Trop de jetons incorrects. Réessayez dans %minutes% minute(s)."
  invalid_token: "Le jeton de secours est incorrect."
  success_identify: "Mot de passe réinitialisé. Identifiez-vous maintenant : %identify_cmd%"
  success_then_change: "Changez ensuite votre mot de passe : /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <nouveau_mot_de_passe>"

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <option> [paramètres]"
  short: "Modifier les options de votre pseudo."
  help: |-
    Modifie les paramètres de votre pseudonyme. Vous devez être identifié pour
    modifier ces options.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Option inconnue %option%. Options disponibles : %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <nouveau_motdepasse>"
    short: "Changer le mot de passe de votre surnom."
    help: |-
      Change le mot de passe de votre surnom. Le nouveau mot de passe
      prend effet immédiatement. Choisissez un mot de passe robuste d'au moins
      6 caractères que vous n'utilisez pas sur d'autres services.
    example: "%command_prefix%SET PASSWORD MotDePasse$ur_123"
    success: "Votre mot de passe a été mis à jour avec succès."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Utilisez %value% avec votre jeton de secours confirmé."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Modifie l’adresse e-mail à l’aide de votre jeton de récupération confirmé."
    help: |-
      SET EMAIL modifie l’adresse e-mail de contact après validation du jeton de
      récupération, sans le consommer. Le format et l’unicité sont vérifiés ; aucun
      e-mail de confirmation n’est envoyé.
      Les domaines de courriel bloqués par l’administration sont refusés.
    example: "%command_prefix%SET EMAIL utilisateur@exemple.com <token_confirmado>"
    success: "Votre e-mail a été mis à jour en %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Un jeton de confirmation a été envoyé à %current_email%."
    pending_line_2: "Pour confirmer le changement vers %new_email%, exécutez :"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "Le jeton expire dans une heure."
    pending_command: "SET EMAIL %new_email% <jeton>"
    invalid_token: "Le jeton est invalide ou a expiré. Demandez-en un nouveau avec %value%."
    invalid_token_value: "SET EMAIL <nouvel_e-mail>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <code>"
    short: "Changer la langue que les services utilisent pour communiquer avec vous."
    help: |-
      Change la langue que %nickserv% et les autres services utilisent pour vous
      parler.
      Langues disponibles :
      %emphasis_0% (catalan)
      %emphasis_1% (allemand)
      %emphasis_2% (grec)
      %emphasis_3% (anglais)
      %emphasis_4% (espagnol)
      %emphasis_5% (basque)
      %emphasis_6% (français)
      %emphasis_7% (galicien)
      %emphasis_8% (italien)
      %emphasis_9% (néerlandais)
      %emphasis_10% (polonais)
      %emphasis_11% (portugais)
      %emphasis_12% (roumain)
      %emphasis_13% (turc)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Langue changée en %language%."
    invalid: "Langue non prise en charge. Langues disponibles : %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <fuseau_horaire>"
    short: "Définir le fuseau horaire utilisé pour l'affichage des dates."
    help: |-
      Définit le fuseau horaire utilisé par %nickserv% pour afficher les dates.
      Consultez HELP SET TIMEZONE pour voir les régions. Utilisez OFF pour le
      supprimer.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Fuseau horaire défini sur %timezone%. Les dates seront affichées dans ce fuseau."
    cleared: "Fuseau horaire effacé. Les dates utiliseront le fuseau par défaut du réseau."
    invalid: "Fuseau horaire invalide %timezone%. Utilisez un identifiant valide (ex. UTC, Europe/Paris)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Affiche ou masque les informations de votre pseudonyme."
    help: |-
      Contrôle la visibilité des informations de votre surnom dans la commande INFO.
      Avec %emphasis_0%, seuls vous et les opérateurs IRC peuvent voir vos détails.
      Avec %emphasis_1%, vos informations sont publiques pour tous.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Les informations de votre surnom sont maintenant %value%."
    on_value: "privées"
    off: "Les informations de votre surnom sont maintenant %value%."
    off_value: "publiques"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Modifie la façon dont les services communiquent avec vous."
    help: |-
      Détermine comment %nickserv% et les autres services vous envoient des messages.
      Avec %emphasis_0%, les réponses sont envoyées par %emphasis_1%.
      Avec %emphasis_2%, les réponses sont envoyées par %emphasis_3%.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Les messages des services seront maintenant envoyés en %value%."
    on_value: "PRIVMSG"
    off: "Les messages des services seront maintenant envoyés en %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Définit ou supprime votre hôte virtuel."
    help: |-
      Définit un nom d’hôte personnalisé visible par les autres utilisateurs
      lorsque vous êtes identifié.

      Pour le supprimer, exécutez %emphasis_0% sans valeur.

      Seules les lettres (a-z, A-Z), les chiffres, les tirets et les points sont
      autorisés.
      Chaque partie doit commencer et finir par une lettre ou un chiffre.
      Le nom d’hôte peut compter jusqu’à 48 caractères et doit être unique par
      pseudonyme.
    example: "%command_prefix%SET VHOST utilisateur.exemple.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Votre hôte virtuel a été défini sur %vhost%."
    cleared: "Votre hôte virtuel a été effacé."
    invalid: "Vhost invalide. Uniquement lettres, chiffres, trait d'union et point (pas au début/fin de bloc) ; max 48 caractères."
    taken: "Ce vhost est déjà utilisé par un autre surnom."
    forced: "Votre vhost est configuré automatiquement et ne peut pas être modifié avec SET VHOST."

# --- INFO ---------------------------------------------------------------------
info:
  syntax: "INFO <surnom>"

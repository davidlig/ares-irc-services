# Traductions de NickServ — Français
# Domaine: nickserv
#
# Codes de formatage IRC (guillemets doubles ou blocs littéraux !irc) :
#   \x02        active/désactive le gras
#   \x03NN      couleur (DÉCIMAL : 03=vert, 04=rouge, 07=orange, 14=gris foncé)
#   \x03        réinitialise la couleur
#   \x0F        réinitialise tout le formatage
#
# Les couleurs IRC utilisent des nombres DÉCIMAUX (0-15), pas hexadécimaux.
#   \x0314 = gris foncé (14 décimal) : CORRECT
#   \x030F = couleur 0 suivie de la lettre F : ERREUR
#
# Texte IRC multiligne : !irc |- avec des sauts de ligne et des espaces réels.
# Les blocs sans balise ne décodent pas les échappements ; préserver CTCP.
# Exemples HELP : example/examples et %command_prefix%.
# Le présentateur ajoute /msg sans couleur et une marge de deux espaces.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    \x0304✗\x03 L’inscription est en attente, mais le jeton n’a pas pu être remis.
    Attendez son expiration avant de vous réinscrire.
  syntax: "REGISTER <password> [email]"
  short: "Enregistrer votre surnom auprès des services."
  help: |-
    Enregistre votre pseudonyme. Selon la configuration du réseau, le jeton de
    vérification vous sera envoyé par chat ou par e-mail.
    Une fois validé, il deviendra votre jeton de récupération permanent :
    conservez-le en lieu sûr.
    La durée de validité de %duration% ne s’applique qu’avant sa validation.
    Les domaines de courriel bloqués par l’administration sont refusés.
  example: "%command_prefix%\x02\x0303REGISTER MotDePasse$ur_123\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGISTER MotDePasse$ur_123 utilisateur@exemple.com\x03\x0F"
  pending: !irc |-
    \x0307→\x03 Un jeton de vérification a été envoyé à \x02%email%\x02.
      Exécutez /msg %bot% \x0303VERIFY <token>\x03 pour terminer l’enregistrement.
      Vous ne l’avez pas reçu ? Vérifiez vos indésirables ou utilisez /msg %bot% \x0303RESEND\x03
      Le jeton expirera dans \x02%duration%\x02.
  already_registered: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est déjà enregistré."
  already_pending: "\x0307→\x03 L’enregistrement de \x02%nickname%\x02 est en attente. Utilisez \x0303VERIFY <token>\x03. Si le jeton a été envoyé par e-mail et qu’une adresse valide est associée, vous pouvez en demander un autre avec \x0303RESEND\x03."
  forbidden: "\x0304✗\x03 Le surnom \x02%nickname%\x02 ne peut pas être enregistré sur ce réseau."
  pending_deletion: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est en attente de suppression et ne peut pas être enregistré."
  invalid_email: "\x0304✗\x03 L'adresse e-mail fournie n'est pas valide."
  email_already_used: "\x0304✗\x03 L'e-mail \x02%email%\x02 est déjà utilisé par un autre surnom. Utilisez une adresse différente."
  throttled: "\x0304✗\x03 Vous devez attendre \x02%minutes%\x02 minute(s) avant de réessayer l'enregistrement."
  guest_prefix_forbidden: "\x0304✗\x03 Vous ne pouvez pas enregistrer un surnom commençant par \x02%prefix%\x02."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirme une inscription ou un jeton de secours."
  help: |-
    Une fois validé, ce jeton deviendra votre jeton de récupération permanent.
    Conservez-le en lieu sûr : il vous permettra de récupérer votre pseudonyme.
    La durée de validité de %duration% ne s’applique qu’avant sa validation.
  example: "%command_prefix%\x02\x0303VERIFY <jeton_reçu>\x03\x0F"
  success: "\x0303✔\x03 Le surnom \x02%nickname%\x02 a été enregistré avec succès et vous êtes maintenant identifié."
  success_native: "\x0303✔\x03 Le surnom \x02%nickname%\x02 a été enregistré avec succès. Utilisez l’authentification native indiquée ci-dessous."
  invalid_token: "\x0304✗\x03 Le jeton de secours est incorrect."
  no_pending: "\x0304✗\x03 Vous n'avez aucun enregistrement en attente à vérifier."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "\x0307ℹ\x03 Vous ne pouvez pas demander un autre jeton avec \x0303RESEND\x03, car cet enregistrement envoie le jeton directement par chat."
  syntax: "RESEND"
  short: "Renvoyer le jeton de vérification à votre e-mail."
  help: |-
    RESEND n’est disponible que si le jeton de vérification a été envoyé par e-mail.
    Une fois validé, ce jeton deviendra votre jeton de récupération permanent.
    Conservez-le en lieu sûr : il vous permettra de récupérer votre pseudonyme.
    La durée de validité de %duration% ne s’applique qu’avant sa validation.
    En utilisant RESEND, vous recevrez un nouveau jeton par e-mail.
    La durée de l’enregistrement en attente sera prolongée de %duration%.
  example: "%command_prefix%\x02\x0303RESEND\x03\x0F"
  success: "\x0307→\x03 Jeton de vérification renvoyé à \x02%email%\x02."
  no_pending: "\x0304✗\x03 Vous n'avez aucun enregistrement en attente à vérifier."
  throttled: "\x0304✗\x03 Vous devez attendre \x02%minutes%\x02 minute(s) avant de demander un autre e-mail de vérification."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "\x0304✗\x03 Aucun e-mail n'est défini pour le surnom \x02%nickname%\x02. La récupération n'est pas disponible."
  email_sent: "\x0307→\x03 Un jeton de récupération a été envoyé à \x02%email_hint%\x02. Vérifiez votre boîte de réception (et vos spams)."
  pending_deletion: "\x0304✗\x03 Le pseudonyme \x02%nickname%\x02 est en attente de suppression et ne peut pas être récupéré."
  instructions: "\x0307ℹ\x03 EMAIL : \x0303RECOVER %nickname%\x03 demande un jeton provisoire par courriel. TOKEN : fournissez votre jeton confirmé. \x0303RECOVER %nickname% <token>\x03 accepte le jeton valide du courriel ou le jeton confirmé. Celui du courriel remplace le jeton enregistré après validation. L’utilisation du jeton enregistré propose un remplacement facultatif avec \x0303VERIFY\x03 ; ignorez le message pour le conserver."
  syntax: "RECOVER <surnom> [jeton]"
  short: "Récupérer votre surnom si vous avez perdu votre mot de passe."
  help: |-
    Sans jeton, demandez un jeton provisoire par e-mail.
    Vous pouvez aussi fournir un jeton de récupération valide ; s’il est
    provisoire, il ne remplacera le jeton enregistré qu’après validation.
    VERIFY vous proposera un remplacement facultatif après utilisation du jeton
    enregistré ; ignorez ce message si vous souhaitez conserver le jeton actuel.
  example: "%command_prefix%\x02\x0303RECOVER Utilisateur\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303RECOVER Utilisateur <jeton_reçu>\x03\x0F"
  pending: "\x0307→\x03 L’enregistrement de \x02%nickname%\x02 est en attente. Utilisez \x0303VERIFY <token>\x03. Si le jeton a été envoyé par e-mail et qu’une adresse valide est associée, vous pouvez en demander un autre avec \x0303RESEND\x03."
  suspended: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est suspendu. Raison : %reason%"
  forbidden: "\x0304✗\x03 Le surnom \x02%nickname%\x02 ne peut pas être utilisé sur ce réseau."
  throttled: "\x0304✗\x03 Trop de jetons incorrects. Réessayez dans \x02%minutes%\x02 minute(s)."
  invalid_token: "\x0304✗\x03 Le jeton de secours est incorrect."
  success_identify: "\x0303✔\x03 Mot de passe réinitialisé. Identifiez-vous maintenant : \x0303%identify_cmd%\x03"
  success_then_change: "Changez ensuite votre mot de passe : /msg %bot% \x0303SET PASSWORD <nouveau_mot_de_passe>\x03"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <surnom> <motdepasse>"
  short: "S'identifier comme le propriétaire d'un surnom."
  help: !irc |-
    Authentifie votre session auprès de %nickserv% avec votre surnom et mot de
    passe.
    Après une identification réussie, vous recevrez le mode enregistré \x02+r\x02
    et, si vous utilisiez un surnom invité, votre surnom enregistré sera restauré.
  example: "%command_prefix%\x02\x0303IDENTIFY Utilisateur <mot_de_passe>\x03\x0F"
  native_syntax: "/NICK <surnom>:<motdepasse> | /NICK <surnom>!<motdepasse>"
  native_short: "Affiche la syntaxe native d’authentification du pseudonyme."
  native_help: |-
    Ce protocole authentifie les comptes par changement de pseudonyme.
    Utilisez /NICK <surnom>:<motdepasse> ou, si le pseudonyme est occupé, /NICK <surnom>!<motdepasse>.
  native_example: "\x02\x0303/NICK Utilisateur:<mot_de_passe>\x03\x0F"
  native_examples:
    - "%command_prefix%\x02\x0303/NICK Utilisateur!<mot_de_passe>\x03\x0F"
  native_authentication: "\x0307ℹ\x03 Ce protocole gère l’authentification par changement de pseudonyme. Utilisez \x0303/NICK <surnom>:<motdepasse>\x03 ou, si le pseudonyme est occupé, \x0303/NICK <surnom>!<motdepasse>\x03."
  success: "\x0303✔\x03 Vous êtes maintenant identifié en tant que \x02%nickname%\x02."
  already_identified: "\x0307ℹ\x03 Vous êtes déjà identifié en tant que \x02%nickname%\x02."
  invalid_credentials: "\x0304✗\x03 Mot de passe incorrect. Veuillez réessayer."
  locked_out: "\x0304✗\x03 Trop de tentatives échouées. Réessayez dans \x02%minutes%\x02 minute(s)."
  ghost_released: "\x0307⚡\x03 La session fantôme qui occupait \x02%nickname%\x02 a été déconnectée."
  kill_reason: "Surnom %nickname% récupéré par %source% (le propriétaire enregistré s'est identifié)"
  pending: !irc |-
    \x0304✗\x03 Le pseudonyme \x02%nickname%\x02 est en attente de vérification par e-mail.
      Exécutez /msg %bot% \x0303VERIFY <token>\x03 ou /msg %bot% \x0303RESEND\x03
  suspended: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est suspendu. Raison : %reason%"
  forbidden: "\x0304✗\x03 Le surnom \x02%nickname%\x02 ne peut pas être utilisé sur ce réseau."
  pending_deletion: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est en attente de suppression et ne peut pas être utilisé."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <surnom>"
  short: "Afficher le statut d'enregistrement d'un surnom."
  help: |-
    Affiche l’état actuel d’un pseudonyme : enregistré, en attente de
    vérification, suspendu, etc.
  example: "%command_prefix%\x02\x0303STATUS Utilisateur\x03\x0F"
  header: "\x02Statut du surnom \x0307%nickname%\x03\x02"
  unregistered: "  Statut          : Non enregistré"
  not_registered_offline: "  Statut          : \x0315Non enregistré\x03"
  pending: "  Statut          : \x0307En attente de vérification\x03"
  pending_expires: "  Expire dans     : %minutes% minute(s)"
  pending_expires_at: "  Expire le       : %date%"
  not_connected: "  Statut          : \x0315Non connecté\x03"
  not_identified: "  Statut          : \x0307Non identifié\x03"
  identified: "  Statut          : \x0303Identifié\x03"
  suspended: "  Statut          : \x0304Suspendu\x03"
  suspended_reason: "  Raison          : %reason%"
  suspended_until: "  Fin le          : %date%"
  suspended_permanent: "  Fin le          : Permanent"
  forbidden: "  Statut          : \x0304Interdit\x03"
  forbidden_reason: "  Raison          : %reason%"
  pending_deletion: "  \x0314Statut\x03          : \x0307En attente de suppression\x03"
  pending_deletion_at: "  \x0314Supprimé\x03        : %date%"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <surnom>"
  short: "Afficher les informations d'un surnom enregistré."
  help: |-
    Affiche les informations d’enregistrement d’un pseudonyme : date de création,
    état de connexion, dernier message envoyé et adresse e-mail.

    L’adresse e-mail n’est visible que par le propriétaire identifié.
    Si le pseudonyme est privé, seul son propriétaire et les opérateurs IRC peuvent
    consulter ces informations.
  example: "%command_prefix%\x02\x0303INFO Utilisateur\x03\x0F"
  private: "\x0304✗\x03 Les informations du surnom \x02%nickname%\x02 sont privées."
  header: "\x02Informations pour le surnom \x0307%nickname%\x03\x02"
  status: "  \x0314Statut\x03           : %status%"
  status_registered: "\x0303Enregistré\x03"
  status_suspended: "\x0304Suspendu\x03"
  status_forbidden: "\x0304Interdit\x03"
  status_pending_deletion: "\x0307En attente de suppression\x03"
  reason: "  \x0314Raison\x03           : %reason%"
  suspended_until: "  \x0314Fin le\x03           : %date%"
  suspended_permanent: "  \x0314Fin le\x03           : Permanent"
  registered_at: "  \x0314Enregistré\x03       : %date%"
  last_seen_online: "  \x0314Dernière vue\x03     : \x0303● EN LIGNE\x03"
  last_seen_at: "  \x0314Dernière vue\x03     : %date%"
  last_seen_never: "  \x0314Dernière vue\x03     : Jamais"
  last_quit: "  \x0314Dernier départ\x03   : %message%"
  last_connect: "  \x0314Dernière vue de\x03  : %ip% (%host%)"
  language: "  \x0314Langue\x03           : %language%"
  email: "  \x0314E-mail\x03           : %email%"
  vhost: "  \x0314VHost\x03            : %vhost%"
  no_expire: "  \x0314N'expire jamais\x03       : Oui"
  pending_deletion_at: "  \x0314Supprimé\x03               : %date%"
  pending_deletion_until: "  \x0314Suppr. définitive\x03      : %date%"
  pending_deletion_notice: "  \x0307Ce pseudonyme est en attente de suppression et ne peut pas être enregistré.\x03"
  channels_header: !irc |-
    \x0314
    Canaux avec accès :\x03
  channels_entry_founder: "  %channel% (\x0303Fondateur\x03)"
  channels_entry_successor: "  %channel% (\x0303Successeur\x03)"
  channels_entry_access: "  %channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <option> <valeur>"
  short: "Modifier les options de votre pseudo."
  help: |-
    Modifie les paramètres de votre pseudonyme. Vous devez être identifié pour
    modifier ces options.
  example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
  unknown_option: "\x0304✗\x03 Option inconnue \x02%option%\x02. Options disponibles : %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <nouveau_motdepasse>"
    short: "Changer le mot de passe de votre surnom."
    help: |-
      Change le mot de passe de votre surnom. Le nouveau mot de passe
      prend effet immédiatement. Choisissez un mot de passe robuste d'au moins
      6 caractères que vous n'utilisez pas sur d'autres services.
    example: "%command_prefix%\x02\x0303SET PASSWORD MotDePasse$ur_123\x03\x0F"
    success: "\x0303✔\x03 Votre mot de passe a été mis à jour avec succès."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "\x0304✗\x03 Utilisez \x0303SET EMAIL <email> <token>\x03 avec votre jeton de secours confirmé."
    syntax: "SET EMAIL <email> <token>"
    short: "Modifie l’adresse e-mail à l’aide de votre jeton de récupération confirmé."
    help: |-
      SET EMAIL modifie l’adresse e-mail de contact après validation du jeton de
      récupération, sans le consommer. Le format et l’unicité sont vérifiés ; aucun
      e-mail de confirmation n’est envoyé.
      Les domaines de courriel bloqués par l’administration sont refusés.
    example: "%command_prefix%\x02\x0303SET EMAIL utilisateur@exemple.com <token_confirmado>\x03\x0F"
    success: "\x0303✔\x03 Votre e-mail a été mis à jour en \x02%email%\x02."
    pending_sent: !irc |-
      \x0307→\x03 Un jeton de confirmation a été envoyé à \x02%current_email%\x02.
        Pour confirmer le changement vers \x02%new_email%\x02, exécutez :
        /msg %bot% \x0303SET EMAIL %new_email% <jeton>\x03
        Le jeton expire dans une heure.
    invalid_token: "\x0304✗\x03 Le jeton est invalide ou a expiré. Demandez-en un nouveau avec \x0303SET EMAIL <nouvel_e-mail>\x03."

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <code>"
    short: "Changer la langue que les services utilisent pour communiquer avec vous."
    help: !irc |-
      Change la langue que %nickserv% et les autres services utilisent pour vous
      parler.
      Langues disponibles :
        \x02ca\x02 (catalan)
        \x02de\x02 (allemand)
        \x02el\x02 (grec)
        \x02en\x02 (anglais)
        \x02es\x02 (espagnol)
        \x02eu\x02 (basque)
        \x02fr\x02 (français)
        \x02gl\x02 (galicien)
        \x02it\x02 (italien)
        \x02nl\x02 (néerlandais)
        \x02pl\x02 (polonais)
        \x02pt\x02 (portugais)
        \x02ro\x02 (roumain)
        \x02tr\x02 (turc)
    example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
    success: "\x0303✔\x03 Langue changée en \x02%language%\x02."
    invalid: "\x0304✗\x03 Langue non prise en charge. Langues disponibles : %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <fuseau_horaire>"
    short: "Définir le fuseau horaire utilisé pour l'affichage des dates."
    help: |-
      Définit le fuseau horaire utilisé par %nickserv% pour afficher les dates.
      Consultez HELP SET TIMEZONE pour voir les régions. Utilisez OFF pour le
      supprimer.
    example: "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET TIMEZONE OFF\x03\x0F"
    success: "\x0303✔\x03 Fuseau horaire défini sur \x02%timezone%\x02. Les dates seront affichées dans ce fuseau."
    cleared: "\x0303✔\x03 Fuseau horaire effacé. Les dates utiliseront le fuseau par défaut du réseau."
    invalid: "\x0304✗\x03 Fuseau horaire invalide \x02%timezone%\x02. Utilisez un identifiant valide (ex. UTC, Europe/Paris)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Affiche ou masque les informations de votre pseudonyme."
    help: !irc |-
      Contrôle la visibilité des informations de votre surnom dans la commande INFO.
      Avec \x02PRIVATE ON\x02, seuls vous et les opérateurs IRC peuvent voir vos détails.
      Avec \x02PRIVATE OFF\x02, vos informations sont publiques pour tous.
    example: "%command_prefix%\x02\x0303SET PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET PRIVATE OFF\x03\x0F"
    on: "\x0303✔\x03 Les informations de votre surnom sont maintenant \x02privées\x02."
    off: "\x0303✔\x03 Les informations de votre surnom sont maintenant \x02publiques\x02."

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Modifie la façon dont les services communiquent avec vous."
    help: !irc |-
      Détermine comment %nickserv% et les autres services vous envoient des messages.
      Avec \x02MSG ON\x02, les réponses sont envoyées par \x02PRIVMSG\x02.
      Avec \x02MSG OFF\x02, les réponses sont envoyées par \x02NOTICE\x02.
    example: "%command_prefix%\x02\x0303SET MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET MSG OFF\x03\x0F"
    on: "\x0303✔\x03 Les messages des services seront maintenant envoyés en \x02PRIVMSG\x02."
    off: "\x0303✔\x03 Les messages des services seront maintenant envoyés en \x02NOTICE\x02."

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Définit ou supprime votre hôte virtuel."
    help: !irc |-
      Définit un nom d’hôte personnalisé visible par les autres utilisateurs
      lorsque vous êtes identifié.

      Pour le supprimer, exécutez \x02SET VHOST\x02 sans valeur.

      Seules les lettres (a-z, A-Z), les chiffres, les tirets et les points sont
      autorisés.
      Chaque partie doit commencer et finir par une lettre ou un chiffre.
      Le nom d’hôte peut compter jusqu’à 48 caractères et doit être unique par
      pseudonyme.
    example: "%command_prefix%\x02\x0303SET VHOST utilisateur.exemple.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET VHOST\x03\x0F"
    success: "\x0303✔\x03 Votre hôte virtuel a été défini sur \x02%vhost%\x02."
    cleared: "\x0303✔\x03 Votre hôte virtuel a été effacé."
    invalid: "\x0304✗\x03 Vhost invalide. Uniquement lettres, chiffres, trait d'union et point (pas au début/fin de bloc) ; max 48 caractères."
    taken: "\x0304✗\x03 Ce vhost est déjà utilisé par un autre surnom."
    forced: "\x0304✗\x03 Votre vhost est configuré automatiquement et ne peut pas être modifié avec SET VHOST."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <surnom> <option> <valeur>"
  short: "Modifier les paramètres d'un autre surnom."
  help: |-
    Permet à un IRCop de modifier les paramètres d’un autre pseudonyme enregistré.
    Les pseudonymes Root, IRCop et des services ne sont pas concernés.
  example: "%command_prefix%\x02\x0303SASET Utilisateur PRIVATE ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SASET Utilisateur TIMEZONE OFF\x03\x0F"
  unknown_option: "\x0304✗\x03 Option inconnue \x02%option%\x02. Options disponibles : %options%."
  cannot_modify_oper: "\x0304✗\x03 Impossible de modifier le surnom d'un opérateur IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <surnom> PASSWORD <nouveau_mdp>"
    short: "Changer le mot de passe d'un surnom."
    help: "Modifie le mot de passe d’un autre pseudonyme. Le changement est immédiat."
    example: "%command_prefix%\x02\x0303SASET Utilisateur PASSWORD MotDePasseSolide123\x03\x0F"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <surnom> EMAIL <nouvel_e-mail>"
    short: "Changer l'e-mail d'un surnom."
    help: |-
      Modifie l’adresse e-mail d’un autre pseudonyme. Le changement est immédiat et
      ne nécessite ni jeton de récupération ni e-mail de confirmation.
      BADMAIL ne limite pas ce changement administratif de courriel.
    example: "%command_prefix%\x02\x0303SASET Utilisateur EMAIL utilisateur@exemple.com\x03\x0F"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <surnom> LANGUAGE <code>"
    short: "Changer la langue d'un surnom."
    help: |-
      Modifie la langue d’un autre pseudonyme. Seuls en (anglais) et es (espagnol)
      sont disponibles pour cette commande.
    example: "%command_prefix%\x02\x0303SASET Utilisateur LANGUAGE es\x03\x0F"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <surnom> TIMEZONE <fuseau_horaire|OFF>"
    short: "Changer le fuseau horaire d'un surnom."
    help: |-
      Définit ou supprime le fuseau horaire d’un autre pseudonyme. Utilisez OFF pour
      le supprimer.
    example: "%command_prefix%\x02\x0303SASET Utilisateur TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Utilisateur TIMEZONE OFF\x03\x0F"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <surnom> PRIVATE {ON|OFF}"
    short: "Changer la confidentialité d'un surnom."
    help: "Active ou désactive la confidentialité des informations d’un autre pseudonyme."
    example: "%command_prefix%\x02\x0303SASET Utilisateur PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Utilisateur PRIVATE OFF\x03\x0F"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <surnom> MSG {ON|OFF}"
    short: "Changer la préférence de messages d'un surnom."
    help: |-
      Définit si les réponses à un autre pseudonyme sont envoyées par PRIVMSG (ON)
      ou NOTICE (OFF).
    example: "%command_prefix%\x02\x0303SASET Utilisateur MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Utilisateur MSG OFF\x03\x0F"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <surnom> VHOST [vhost]"
    short: "Changer l'hôte virtuel d'un surnom."
    help: |-
      Définit ou supprime l’hôte virtuel d’un autre pseudonyme. Exécutez SASET
      <pseudonyme> VHOST sans valeur pour le supprimer.
    example: "%command_prefix%\x02\x0303SASET Utilisateur VHOST utilisateur.exemple.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Utilisateur VHOST\x03\x0F"

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [commande]"
  short: "Afficher l'aide des commandes %nickserv%."
  help: |-
    Affiche l'aide générale de %nickserv% ou des informations détaillées
    pour une commande spécifique.
  examples_header: "\x02 ■ Exemples :\x02"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET TIMEZONE Europe\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  navigation_marker: "\x0310›\x03\x0F"
  info_marker: "\x0310ℹ\x03\x0F"
  error_marker: "\x0304✗\x03\x0F"
  warning_marker: "\x0304⚠\x03\x0F"
  intro: |-
    Permet d’enregistrer et de protéger votre pseudonyme afin d’empêcher son
    utilisation par d’autres. Gérez la sécurité de votre compte, personnalisez vos
    préférences et récupérez l’accès lorsque nécessaire.
  intro_expiration: "%marker% %label% : les pseudonymes inutilisés pendant plus de \x1F\x0304%days% jours\x03\x1F sont automatiquement supprimés."
  intro_expiration_label: "NOTE"
  general_header: "\x02 ■ Commandes disponibles :\x02"
  command_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Options :\x02"
  general_syntax: "HELP <commande>"
  general_footer: "%marker% Utilisez /msg %bot% \x02\x0303%syntax%\x03\x0F pour plus d’informations."
  set_sub_syntax: "HELP %command% <option>"
  set_sub_footer: "%marker% Utilisez /msg %bot% \x02\x0303%syntax%\x03\x0F pour plus d’informations."
  syntax_label: "Syntaxe : \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_auth: "Inscription et authentification"
    account_security: "Compte et sécurité"
  ircop_group:
    lookup: "Recherche et enquête"
    account_management: "Gestion des comptes"
    suspensions_bans: "Suspensions et interdictions"
    deletion: "Suppression et restauration"
  ircop_header: "\x02 ■ Commandes disponibles pour les IRCops :\x02"
  set_timezone:
    index_label: "Zones par région (utilisez \x02\x0303%syntax%\x03\x0F pour consulter une région) :"
    index_syntax: "HELP SET TIMEZONE <région>"
    region_header: "\x02 ■ Fuseaux horaires pour %region% :\x02"
    region_unknown: "%marker% Région inconnue. Utilisez \x02\x0303%syntax%\x03\x0F pour l'index."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "\x0304⚠\x03 Le surnom \x02%nickname%\x02 est enregistré. Vous serez renommé si vous ne vous identifiez pas."
  renamed_to: !irc |-
    \x0307→\x03 Vous avez été renommé en \x02%guest_nick%\x02. Pour récupérer votre pseudonyme :
    /msg %bot% \x0303IDENTIFY %nickname% <mot_de_passe>\x03
  nick_forbidden: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est interdit : %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <surnom>"
  short: "Obtenir l'adresse IP réelle et le nom d'hôte du surnom."
  help: |-
    Affiche l’adresse IP et le nom d’hôte réels d’un pseudonyme.
    À utiliser avec précaution : ces informations sont sensibles.
  example: "%command_prefix%\x02\x0303USERIP Utilisateur\x03\x0F"
  result: "\x0307ℹ\x03 Surnom : \x02%nickname%\x02 | IP : \x0307%ip%\x03 | Hôte : \x0307%host%\x03"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Recherche les surnoms par l'adresse IP de leur dernière connexion identifiée."
  help: |-
    Affiche les pseudonymes enregistrés dont la dernière connexion identifiée
    utilisait cette adresse IP. L’adresse enregistrée peut être obsolète.
  example: "%command_prefix%\x02\x0303WHOIP 192.0.2.10\x03\x0F"
  empty: "Aucun surnom enregistré ne correspond à cette adresse IP."
  header: "Surnoms correspondants :"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <surnom> <durée> <raison>"
  short: "Suspendre un surnom."
  help: |-
    Empêche le propriétaire de s’identifier. La durée peut être exprimée en jours
    (d), heures (h), minutes (m), ou 0 pour une suspension permanente. Les
    opérateurs
    IRC et les utilisateurs Root ne peuvent pas être suspendus.
  example: "%command_prefix%\x02\x0303SUSPEND MalUtilisateur 7d Spam sur #aide\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND Problematico 0 Evasión de prohibición\x03\x0F"
  success: "\x0303✔\x03 Le surnom \x02%nickname%\x02 a été suspendu jusqu'à \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est déjà suspendu."
  forbidden: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est interdit et ne peut pas être suspendu."
  cannot_suspend_oper: "\x0304✗\x03 Impossible de suspendre l'opérateur IRC \x02%nickname%\x02."
  cannot_suspend_root: "\x0304✗\x03 Impossible de suspendre l'utilisateur root \x02%nickname%\x02."
  cannot_suspend_service: "\x0304✗\x03 Impossible de suspendre le surnom de service \x02%nickname%\x02."
  invalid_duration: "\x0304✗\x03 Durée invalide. Utilisez : \x0303<j><h><m>\x03 (ex., 7j, 12h, 30m) ou \x03030\x03 pour permanent."

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <surnom>"
  short: "Lever la suspension d'un surnom."
  help: |-
    Lève une suspension active afin que le propriétaire puisse à nouveau
    s’identifier.
  example: "%command_prefix%\x02\x0303UNSUSPEND Utilisateur\x03\x0F"
  success: "\x0303✔\x03 La suspension a été levée pour \x02%nickname%\x02."
  not_suspended: "\x0304✗\x03 Le surnom \x02%nickname%\x02 n'est pas suspendu."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <surnom>"
  short: "Forcer le renommage d'un surnom connecté en un surnom aléatoire."
  help: |-
    Force un pseudonyme connecté à prendre un nom aléatoire précédé d’un
    préfixe défini par le réseau.
  example: "%command_prefix%\x02\x0303RENAME Problematico\x03\x0F"
  cannot_rename_root: "\x0304✗\x03 Impossible de renommer l'utilisateur root \x02%nickname%\x02."
  cannot_rename_oper: "\x0304✗\x03 Impossible de renommer l'opérateur IRC \x02%nickname%\x02."
  cannot_rename_service: "\x0304✗\x03 Impossible de renommer le surnom de service \x02%nickname%\x02."
  success: "\x0303✓\x03 Le surnom \x02%nickname%\x02 a été renommé en \x02%new_nick%\x02."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <surnom> [FORCE]"
  short: "Abandonner un surnom enregistré."
  help: |-
    Marque un pseudonyme enregistré pour suppression à la fin de la période de
    grâce ; il peut être restauré avec RESTORE. Ajoutez FORCE pour le supprimer
    définitivement. Les utilisateurs Root, IRCops et services, ainsi que votre
    propre
    pseudonyme, ne peuvent pas être supprimés.
  force:
    short: "Supprime définitivement un pseudonyme en attente de suppression."
  example: "%command_prefix%\x02\x0303DROP CuentaAntigua\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP CuentaAntigua FORCE\x03\x0F"
  suspended: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est suspendu. Levez d'abord la suspension."
  forbidden: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est interdit."
  cannot_drop_root: "\x0304✗\x03 Impossible d'abandonner l'utilisateur root \x02%nickname%\x02."
  cannot_drop_oper: "\x0304✗\x03 Impossible d'abandonner l'opérateur IRC \x02%nickname%\x02."
  cannot_drop_self: "\x0304✗\x03 Vous ne pouvez pas abandonner votre propre surnom."
  success: "\x0303✓\x03 Le surnom \x02%nickname%\x02 a été marqué pour suppression et peut être restauré pendant la période de grâce."
  force_success: "\x0303✓\x03 Le surnom \x02%nickname%\x02 a été définitivement supprimé."
  pending_deletion: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est déjà en attente de suppression. Utilisez DROP <surnom> FORCE pour le supprimer définitivement."
  cannot_drop_service: "\x0304✗\x03 Impossible d'abandonner le surnom de service \x02%nickname%\x02."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <surnom>"
  short: "Restaurer un surnom en attente de suppression."
  help: |-
    Restaure un pseudonyme en attente de suppression tant qu’il est encore dans sa
    période de grâce.
  example: "%command_prefix%\x02\x0303RESTORE CuentaAntigua\x03\x0F"
  success: "\x0303✓\x03 Le surnom \x02%nickname%\x02 a été restauré."
  not_pending_deletion: "\x0304✗\x03 Le surnom \x02%nickname%\x02 n'est pas en attente de suppression."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <surnom> <raison>"
  short: "Bloquer définitivement l'utilisation d'un surnom."
  help: |-
    Interdit définitivement un pseudonyme afin que personne ne puisse l’enregistrer
    ou l’utiliser. S’il est enregistré, il est supprimé ; s’il est connecté, il est
    forcé à prendre un pseudonyme aléatoire. Les utilisateurs Root, IRCops et
    services
    ne peuvent pas être interdits.
  example: "%command_prefix%\x02\x0303FORBID MalUtilisateur Violations répétées des règles\x03\x0F"
  success: "\x0303✔\x03 Le surnom \x02%nickname%\x02 a été interdit."
  updated: "\x0303✔\x03 La raison d'interdiction pour \x02%nickname%\x02 a été mise à jour."
  reason_required: "\x0304✗\x03 Vous devez fournir une raison pour l'interdiction."
  cannot_forbid_root: "\x0304✗\x03 Impossible d'interdire l'utilisateur root \x02%nickname%\x02."
  cannot_forbid_oper: "\x0304✗\x03 Impossible d'interdire l'opérateur IRC \x02%nickname%\x02."
  cannot_forbid_service: "\x0304✗\x03 Impossible d'interdire le surnom de service \x02%nickname%\x02."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <surnom>"
  short: "Lever l'interdiction d'un surnom."
  help: "Lève l’interdiction afin que le pseudonyme puisse à nouveau être utilisé."
  example: "%command_prefix%\x02\x0303UNFORBID PseudoInterdit\x03\x0F"
  success: "\x0303✔\x03 Le surnom \x02%nickname%\x02 n'est plus interdit."
  not_forbidden: "\x0304✗\x03 Le surnom \x02%nickname%\x02 n'est pas interdit."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD|DEL|LIST} [motif]"
  short: "Gérer les motifs de vhost interdits."
  help: |-
    Gère les motifs qui empêchent de définir un hôte virtuel correspondant avec SET
    VHOST. Le caractère générique * correspond à toute suite de caractères et ? à un
    caractère. Nécessite les privilèges d’opérateur IRC.
  example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL ou LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <motif>"
    short: "Ajouter un motif de vhost interdit."
    help: |-
      Ajoute un motif à la liste. Les utilisateurs ne pourront pas définir d’hôte
      virtuel correspondant avec SET VHOST. * correspond à toute suite et ? à un
      caractère.
    example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Motif de vhost interdit ajouté : \x02%pattern%\x02"
    already_exists: "\x0304✗\x03 Le motif \x02%pattern%\x02 existe déjà."
    invalid: "\x0304✗\x03 Format de motif vhost invalide."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <motif>"
    short: "Supprimer un motif de vhost interdit."
    help: "Supprime un motif de la liste des hôtes virtuels interdits."
    example: "%command_prefix%\x02\x0303FORBIDVHOST DEL *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Motif de vhost interdit supprimé : \x02%pattern%\x02"
    not_found: "\x0304✗\x03 Motif \x02%pattern%\x02 introuvable."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Lister tous les motifs de vhost interdits."
    syntax: "FORBIDVHOST LIST"
    help: "Affiche tous les motifs d’hôte virtuel interdits."
    example: "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
    header: "\x0307ℹ\x03 Motifs de vhost interdits (\x02%count%\x02) :"
    entry: "  %index%. \x0304%pattern%\x03 — par %nickname% (%date%)"
    empty: "\x0307ℹ\x03 Aucun motif de vhost interdit."

# --- HISTORY ---------------------------------------------------------------
history:
  syntax: "HISTORY <surnom> {ADD|DEL|VIEW|CLEAR}"
  short: "Consulter ou gérer l'historique des actions du surnom."
  help: |-
    Consulte et gère l’historique des actions d’un pseudonyme. Les suspensions,
    changements de mot de passe ou d’adresse e-mail et récupérations sont
    enregistrés
    automatiquement. VIEW affiche trois entrées par page ; ALL affiche tout
    l’historique.
  example: "%command_prefix%\x02\x0303HISTORY Utilisateur VIEW\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HISTORY Utilisateur VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY Utilisateur ADD Note manuelle\x03\x0F"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <surnom> ADD <message>"
    short: "Ajouter une entrée manuelle à l'historique."
    help: "Ajoute une entrée manuelle à l’historique du pseudonyme."
    example: "%command_prefix%\x02\x0303HISTORY Utilisateur ADD Signalé pour spam\x03\x0F"
    success: "\x0303✔\x03 Entrée d'historique ajoutée pour \x02%nickname%\x02."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <surnom> DEL <id>"
    short: "Supprimer une entrée d'historique par ID."
    help: "Supprime une entrée précise de l’historique à l’aide de son identifiant."
    example: "%command_prefix%\x02\x0303HISTORY Utilisateur DEL 42\x03\x0F"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <surnom> VIEW [PAGE|ALL]"
    short: "Afficher l'historique des actions du surnom."
    help: |-
      Affiche l’historique des actions du pseudonyme. Trois entrées sont affichées par
      page par défaut. Utilisez ALL pour les afficher toutes.
    example: "%command_prefix%\x02\x0303HISTORY Utilisateur VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY Utilisateur VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY Utilisateur VIEW ALL\x03\x0F"
    header: "\x02Historique pour \x0307%nickname%\x03\x02 (affichage %start%-%end% sur %total%) :"
    entry: "#%id% [%date%] \x0303%action%\x03 par %operator% — %message%"
    no_entries: "\x0307ℹ\x03 Aucune entrée d'historique trouvée pour \x02%nickname%\x02."
    page_hint: "Utilisez \x0303HISTORY %nickname% VIEW %next_page%\x03 pour plus d'entrées."

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <surnom> CLEAR"
    short: "Supprimer toutes les entrées d'historique d'un surnom."
    help: "Supprime de façon irréversible toutes les entrées de l’historique du pseudonyme."
    example: "%command_prefix%\x02\x0303HISTORY Utilisateur CLEAR\x03\x0F"
    success: "\x0303✔\x03 \x02%count%\x02 entrées d'historique effacées pour \x02%nickname%\x02."
history.message:
  password_changed_owner: "Mot de passe changé par le propriétaire"
  password_changed_operator: "Mot de passe changé par l'opérateur"
  email_changed_owner: "E-mail changé de %old_email% à %new_email%"
  email_changed_operator: "E-mail changé en %new_email% par l'opérateur"
  recover: "Mot de passe réinitialisé via jeton e-mail"
history.extra:
  old_email: "Ancien e-mail : %value%"
  new_email: "Nouvel e-mail : %value%"
  method: "Méthode : %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <surnom> {ON|OFF}"
  short: "Définir ou retirer la protection contre l'expiration d'un surnom."
  help: |-
    Détermine si le pseudonyme expire après une période d’inactivité.
    ON empêche l’expiration et OFF applique les règles habituelles.
  example: "%command_prefix%\x02\x0303NOEXPIRE Utilisateur ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE Utilisateur OFF\x03\x0F"
  success_on: "\x0303✔\x03 Le surnom \x02%nickname%\x02 est maintenant protégé contre l'expiration."
  success_off: "\x0303✔\x03 Le surnom \x02%nickname%\x02 expirera maintenant normalement."
  forbidden: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est interdit."
  suspended: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est suspendu."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <motif> [page]"
  short: "Liste les pseudos enregistrés correspondant à un motif."
  help: |-
    Affiche les pseudonymes enregistrés correspondant au motif. Le caractère
    générique
    * correspond à toute suite de caractères ; la page facultative commence à 1.
  example: "%command_prefix%\x02\x0303LIST Utilisateur*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST Utilisateur* 2\x03\x0F"
  header: "Pseudo | Enregistrement | Dernière connexion | IP | État"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Aucun pseudo ne correspond au motif %pattern%."
  status_pending: "En attente"
  status_registered: "Enregistré"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Gérer le mode d’inscription du réseau."
  help: !irc |-
    Configure le mode d’enregistrement des nouveaux comptes.

    • \x02EMAIL:\x02 Envoie le jeton de vérification à l’adresse e-mail de l’utilisateur.
    • \x02TOKEN:\x02 Envoie directement le jeton de vérification par IRC.
    • \x02STATUS:\x02 Affiche le mode actuel sans le modifier.

    Les enregistrements en attente conservent le mode utilisé à leur création.

    En mode TOKEN, la commande RESEND reste désactivée pour tous les utilisateurs.
  example: "%command_prefix%\x02\x0303REGMODE STATUS\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGMODE EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303REGMODE TOKEN\x03\x0F"
  status: "\x0307ℹ\x03 Mode d’inscription actuel : \x02%mode%\x02."
  changed: "\x0303✔\x03 Mode d’inscription modifié : \x02%mode%\x02."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: !irc |-
    Jeton de secours : \x0303%token%\x03

    Conservez ce jeton en lieu sûr. Vous en aurez besoin pour récupérer votre pseudonyme si vous oubliez votre mot de passe.

    Pour le confirmer, utilisez : /msg %bot% \x0303VERIFY %token%\x03

    \x0304⚠\x03 IMPORTANT : Seul le dernier jeton généré est valide. Une fois confirmé, il ne sera plus affiché. Ne le partagez avec personne.
  confirmed: "\x0303✔\x03 Votre jeton de secours est confirmé. Conservez-le en lieu sûr."
  unavailable: "\x0304✗\x03 Authentifiez-vous et confirmez votre jeton de secours avec \x0303VERIFY\x03 avant cette opération."
  locked_out: "\x0304✗\x03 Trop de jetons incorrects. Réessayez dans \x02%seconds%\x02 secondes."
  throttled: "\x0304✗\x03 Trop de jetons incorrects. Réessayez dans \x02%minutes%\x02 minute(s)."
  replaced: "\x0303✔\x03 Votre jeton de récupération est remplacé par le jeton du courriel que vous venez de valider. Conservez-le en lieu sûr."
  optional_replacement: !irc |-
    \x0307→\x03 Nouveau jeton de récupération facultatif : \x0303%token%\x03

    Pour remplacer votre jeton de récupération actuel, utilisez : /msg %bot% \x0303VERIFY %token%\x03

    Le jeton actuel reste valable jusqu’à confirmation.

    Si vous ne souhaitez pas le changer, ignorez ce message.
  replacement_unavailable: "\x0307ℹ\x03 Votre mot de passe est réinitialisé, mais aucun nouveau jeton n’a pu être émis. Votre jeton actuel reste valable."
  temporarily_unavailable: "\x0304✗\x03 La remise du jeton de récupération est temporairement indisponible. Réessayez plus tard."

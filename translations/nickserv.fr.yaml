# --- NICK PROTECTION ----------------------------------------------------------
protection:
  nick_in_use: "Le surnom %nickname% est enregistré. Vous serez renommé si vous ne vous identifiez pas."
  renamed_to: |-
    Vous avez été renommé en %guest_nick%. Pour récupérer votre pseudonyme :
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <mot_de_passe>"
  nick_forbidden: "Le surnom %nickname% est interdit : %reason%"

# --- USERIP (IRCop) -----------------------------------------------------------
userip:
  syntax: "USERIP <surnom>"
  short: "Obtenir l'adresse IP réelle et le nom d'hôte du surnom."
  help: |-
    Affiche l’adresse IP et le nom d’hôte réels d’un pseudonyme.
    À utiliser avec précaution : ces informations sont sensibles.
  example: "%command_prefix%USERIP Utilisateur"
  result: "Surnom : %nickname% | IP : %ip% | Hôte : %host%"

# --- WHOIP (IRCop) ------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Recherche les surnoms par l'adresse IP de leur dernière connexion identifiée."
  help: |-
    Affiche les pseudonymes enregistrés dont la dernière connexion identifiée
    utilisait cette adresse IP. L’adresse enregistrée peut être obsolète.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Aucun surnom enregistré ne correspond à cette adresse IP."
  header: "Surnoms correspondants :"

# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <motif> [page]"
  short: "Liste les pseudos enregistrés correspondant à un motif."
  help: |-
    Affiche les pseudonymes enregistrés correspondant au motif. Le caractère
    générique
    * correspond à toute suite de caractères ; la page facultative commence à 1.
  example: "%command_prefix%LIST Utilisateur*"
  examples:
    - "%command_prefix%LIST Utilisateur* 2"
  header: "Pseudo | Enregistrement | Dernière connexion | IP | État"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Aucun pseudo ne correspond au motif %pattern%."
  status_pending: "En attente"
  status_registered: "Enregistré"

# --- HISTORY ---
history:
  syntax: "HISTORY <surnom> <option> [paramètres]"
  short: "Consulter ou gérer l'historique des actions du surnom."
  help: |-
    Consulte et gère l’historique des actions d’un pseudonyme. Les suspensions,
    changements de mot de passe ou d’adresse e-mail et récupérations sont
    enregistrés
    automatiquement. VIEW affiche trois entrées par page ; ALL affiche tout
    l’historique.
  example: "%command_prefix%HISTORY Utilisateur VIEW"
  examples:
    - "%command_prefix%HISTORY Utilisateur VIEW ALL"
    - "%command_prefix%HISTORY Utilisateur ADD Note manuelle"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <surnom> ADD <message>"
    short: "Ajouter une entrée manuelle à l'historique."
    help: "Ajoute une entrée manuelle à l’historique du pseudonyme."
    example: "%command_prefix%HISTORY Utilisateur ADD Signalé pour spam"
    success: "Entrée d'historique ajoutée pour %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <surnom> DEL <id>"
    short: "Supprimer une entrée d'historique par ID."
    help: "Supprime une entrée précise de l’historique à l’aide de son identifiant."
    example: "%command_prefix%HISTORY Utilisateur DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <surnom> VIEW [PAGE|ALL]"
    short: "Afficher l'historique des actions du surnom."
    help: |-
      Affiche l’historique des actions du pseudonyme. Trois entrées sont affichées par
      page par défaut. Utilisez ALL pour les afficher toutes.
    example: "%command_prefix%HISTORY Utilisateur VIEW"
    examples:
      - "%command_prefix%HISTORY Utilisateur VIEW 2"
      - "%command_prefix%HISTORY Utilisateur VIEW ALL"
    header: "%heading% (affichage %start%-%end% sur %total%) :"
    header_title: "Historique pour %nickname%"
    entry: "#%id% [%date%] %action% par %operator% — %message%"
    no_entries: "Aucune entrée d'historique trouvée pour %nickname%."
    page_hint: "Utilisez %command% pour plus d'entrées."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <surnom> CLEAR"
    short: "Supprimer toutes les entrées d'historique d'un surnom."
    help: "Supprime de façon irréversible toutes les entrées de l’historique du pseudonyme."
    example: "%command_prefix%HISTORY Utilisateur CLEAR"
    success: "%count% entrées d'historique effacées pour %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Compte activé"
  resend: "Courriel de vérification renvoyé"
  noexpire_on: "Protection contre l’expiration activée"
  noexpire_off: "Protection contre l’expiration désactivée"
  userip: "Consultation USERIP"
  history_clear: "Historique effacé"
  password_changed_owner: "Mot de passe changé par le propriétaire"
  password_changed_operator: "Mot de passe changé par l'opérateur"
  email_changed_owner: "E-mail changé de %old_email% à %new_email%"
  email_changed_operator: "E-mail changé en %new_email% par l'opérateur"
  recover: "Mot de passe réinitialisé via jeton e-mail"
  saregister: "Compte enregistré administrativement"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Ancien e-mail : %value%"
  new_email: "Nouvel e-mail : %value%"
  method: "Méthode : %value%"

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <surnom> <motdepasse> [email]"
  short: "Enregistrer administrativement un pseudonyme."
  help: |-
    Syntaxe : SAREGISTER <surnom> <motdepasse> [email]

    Enregistre administrativement un pseudonyme immédiatement sans nécessiter
    de vérification du client ni de limites de fréquence.

    En mode TOKEN, le jeton de secours est affiché une seule fois à l'opérateur.
    En mode EMAIL, le jeton de secours est envoyé à l'adresse e-mail spécifiée.
  example: "%command_prefix%SAREGISTER Alice MotDePasse123"
  examples:
    - "%command_prefix%SAREGISTER Bob MotDePasse456 bob@exemple.fr"
  success_token: "Le pseudonyme %nickname% a été enregistré. Jeton de secours : %token%"
  success_email: "Le pseudonyme %nickname% a été enregistré. Jeton de secours envoyé à %email%."
  invalid_nickname: "Pseudonyme non valide %nickname%."

# --- SASET (IRCop) ------------------------------------------------------------
saset:
  syntax: "SASET <surnom> <option> [paramètres]"
  short: "Modifier les paramètres d'un autre surnom."
  help: |-
    Permet à un IRCop de modifier les paramètres d’un autre pseudonyme enregistré.
    Les pseudonymes Root, IRCop et des services ne sont pas concernés.
  example: "%command_prefix%SASET Utilisateur PRIVATE ON"
  examples:
    - "%command_prefix%SASET Utilisateur TIMEZONE OFF"
  unknown_option: "Option inconnue %option%. Options disponibles : %options%."
  cannot_modify_oper: "Impossible de modifier le surnom d'un opérateur IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <surnom> PASSWORD <nouveau_mdp>"
    short: "Changer le mot de passe d'un surnom."
    help: "Modifie le mot de passe d’un autre pseudonyme. Le changement est immédiat."
    example: "%command_prefix%SASET Utilisateur PASSWORD MotDePasseSolide123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <surnom> EMAIL <nouvel_e-mail>"
    short: "Changer l'e-mail d'un surnom."
    help: |-
      Modifie l’adresse e-mail d’un autre pseudonyme. Le changement est immédiat et
      ne nécessite ni jeton de récupération ni e-mail de confirmation.
      BADMAIL ne limite pas ce changement administratif de courriel.
    example: "%command_prefix%SASET Utilisateur EMAIL utilisateur@exemple.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <surnom> LANGUAGE <code>"
    short: "Changer la langue d'un surnom."
    help: |-
      Modifie la langue d’un autre pseudonyme. Seuls en (anglais) et es (espagnol)
      sont disponibles pour cette commande.
    example: "%command_prefix%SASET Utilisateur LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <surnom> TIMEZONE {<fuseau_horaire>|OFF}"
    short: "Changer le fuseau horaire d'un surnom."
    help: |-
      Définit ou supprime le fuseau horaire d’un autre pseudonyme. Utilisez OFF pour
      le supprimer.
    example: "%command_prefix%SASET Utilisateur TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Utilisateur TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <surnom> PRIVATE {ON|OFF}"
    short: "Changer la confidentialité d'un surnom."
    help: "Active ou désactive la confidentialité des informations d’un autre pseudonyme."
    example: "%command_prefix%SASET Utilisateur PRIVATE ON"
    examples:
      - "%command_prefix%SASET Utilisateur PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <surnom> MSG {ON|OFF}"
    short: "Changer la préférence de messages d'un surnom."
    help: |-
      Définit si les réponses à un autre pseudonyme sont envoyées par PRIVMSG (ON)
      ou NOTICE (OFF).
    example: "%command_prefix%SASET Utilisateur MSG ON"
    examples:
      - "%command_prefix%SASET Utilisateur MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <surnom> VHOST [vhost]"
    short: "Changer l'hôte virtuel d'un surnom."
    help: |-
      Définit ou supprime l’hôte virtuel d’un autre pseudonyme. Exécutez SASET
      <pseudonyme> VHOST sans valeur pour le supprimer.
    example: "%command_prefix%SASET Utilisateur VHOST utilisateur.exemple.org"
    examples:
      - "%command_prefix%SASET Utilisateur VHOST"

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax: "RENAME <surnom>"
  short: "Forcer le renommage d'un surnom connecté en un surnom aléatoire."
  help: |-
    Force un pseudonyme connecté à prendre un nom aléatoire précédé d’un
    préfixe défini par le réseau.
  example: "%command_prefix%RENAME Problematico"
  cannot_rename_root: "Impossible de renommer l'utilisateur root %nickname%."
  cannot_rename_oper: "Impossible de renommer l'opérateur IRC %nickname%."
  cannot_rename_service: "Impossible de renommer le surnom de service %nickname%."
  success: "Le surnom %nickname% a été renommé en %new_nick%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <surnom> {ON|OFF}"
  short: "Définir ou retirer la protection contre l'expiration d'un surnom."
  help: |-
    Détermine si le pseudonyme expire après une période d’inactivité.
    ON empêche l’expiration et OFF applique les règles habituelles.
  example: "%command_prefix%NOEXPIRE Utilisateur ON"
  examples:
    - "%command_prefix%NOEXPIRE Utilisateur OFF"
  success_on: "Le surnom %nickname% est maintenant protégé contre l'expiration."
  success_off: "Le surnom %nickname% expirera maintenant normalement."
  forbidden: "Le surnom %nickname% est interdit."
  suspended: "Le surnom %nickname% est suspendu."

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Gérer le mode d’inscription du réseau."
  help: |-
    Configure le mode d’enregistrement des nouveaux comptes.

    %emphasis_0% Envoie le jeton de vérification à l’adresse e-mail de l’utilisateur.
    %emphasis_1% Envoie directement le jeton de vérification par IRC.
    %emphasis_2% Affiche le mode actuel sans le modifier.

    Les enregistrements en attente conservent le mode utilisé à leur création.

    En mode TOKEN, la commande RESEND reste désactivée pour tous les utilisateurs.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Mode d’inscription actuel : %mode%."
  changed: "Mode d’inscription modifié : %mode%."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <surnom> <durée> <raison>"
  short: "Suspendre un surnom."
  help: |-
    Empêche le propriétaire de s’identifier. La durée peut être exprimée en jours
    (d), heures (h), minutes (m), ou 0 pour une suspension permanente. Les
    opérateurs
    IRC et les utilisateurs Root ne peuvent pas être suspendus.
  example: "%command_prefix%SUSPEND MalUtilisateur 7d Spam sur #aide"
  examples:
    - "%command_prefix%SUSPEND Problematico 0 Evasión de prohibición"
  success: "Le surnom %nickname% a été suspendu jusqu'à %duration%."
  already_suspended: "Le surnom %nickname% est déjà suspendu."
  forbidden: "Le surnom %nickname% est interdit et ne peut pas être suspendu."
  cannot_suspend_oper: "Impossible de suspendre l'opérateur IRC %nickname%."
  cannot_suspend_root: "Impossible de suspendre l'utilisateur root %nickname%."
  cannot_suspend_service: "Impossible de suspendre le surnom de service %nickname%."
  invalid_duration: "Durée invalide. Utilisez : %duration_format% (ex., 7j, 12h, 30m) ou %permanent% pour permanent."
  invalid_duration_format: "<j><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <surnom>"
  short: "Lever la suspension d'un surnom."
  help: |-
    Lève une suspension active afin que le propriétaire puisse à nouveau
    s’identifier.
  example: "%command_prefix%UNSUSPEND Utilisateur"
  success: "La suspension a été levée pour %nickname%."
  not_suspended: "Le surnom %nickname% n'est pas suspendu."

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <surnom> <raison>"
  short: "Bloquer définitivement l'utilisation d'un surnom."
  help: |-
    Interdit définitivement un pseudonyme afin que personne ne puisse l’enregistrer
    ou l’utiliser. S’il est enregistré, il est supprimé ; s’il est connecté, il est
    forcé à prendre un pseudonyme aléatoire. Les utilisateurs Root, IRCops et
    services
    ne peuvent pas être interdits.
  example: "%command_prefix%FORBID MalUtilisateur Violations répétées des règles"
  success: "Le surnom %nickname% a été interdit."
  updated: "La raison d'interdiction pour %nickname% a été mise à jour."
  reason_required: "Vous devez fournir une raison pour l'interdiction."
  cannot_forbid_root: "Impossible d'interdire l'utilisateur root %nickname%."
  cannot_forbid_oper: "Impossible d'interdire l'opérateur IRC %nickname%."
  cannot_forbid_service: "Impossible d'interdire le surnom de service %nickname%."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <surnom>"
  short: "Lever l'interdiction d'un surnom."
  help: "Lève l’interdiction afin que le pseudonyme puisse à nouveau être utilisé."
  example: "%command_prefix%UNFORBID PseudoInterdit"
  success: "Le surnom %nickname% n'est plus interdit."
  not_forbidden: "Le surnom %nickname% n'est pas interdit."

# --- FORBIDVHOST (IRCop) ------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST <option> [paramètres]"
  short: "Gérer les motifs de vhost interdits."
  help: |-
    Gère les motifs qui empêchent de définir un hôte virtuel correspondant avec SET
    VHOST. Le caractère générique * correspond à toute suite de caractères et ? à un
    caractère. Nécessite les privilèges d’opérateur IRC.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Sous-commande inconnue %sub%. Utilisez ADD, DEL ou LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <motif>"
    short: "Ajouter un motif de vhost interdit."
    help: |-
      Ajoute un motif à la liste. Les utilisateurs ne pourront pas définir d’hôte
      virtuel correspondant avec SET VHOST. * correspond à toute suite et ? à un
      caractère.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Motif de vhost interdit ajouté : %pattern%"
    already_exists: "Le motif %pattern% existe déjà."
    invalid: "Format de motif vhost invalide."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <motif>"
    short: "Supprimer un motif de vhost interdit."
    help: "Supprime un motif de la liste des hôtes virtuels interdits."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Motif de vhost interdit supprimé : %pattern%"
    not_found: "Motif %pattern% introuvable."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Lister tous les motifs de vhost interdits."
    syntax: "FORBIDVHOST LIST"
    help: "Affiche tous les motifs d’hôte virtuel interdits."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Motifs de vhost interdits (%count%) :"
    entry: "%index%. %pattern% — par %nickname% (%date%)"
    empty: "Aucun motif de vhost interdit."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <surnom> [FORCE]"
  short: "Abandonner un surnom enregistré."
  help: |-
    Marque un pseudonyme enregistré pour suppression à la fin de la période de
    grâce ; il peut être restauré avec RESTORE. Ajoutez FORCE pour le supprimer
    définitivement. Les utilisateurs Root, IRCops et services, ainsi que votre
    propre
    pseudonyme, ne peuvent pas être supprimés.
  force:
    short: "Supprime définitivement un pseudonyme en attente de suppression."
  example: "%command_prefix%DROP CuentaAntigua"
  examples:
    - "%command_prefix%DROP CuentaAntigua FORCE"
  suspended: "Le surnom %nickname% est suspendu. Levez d'abord la suspension."
  forbidden: "Le surnom %nickname% est interdit."
  cannot_drop_root: "Impossible d'abandonner l'utilisateur root %nickname%."
  cannot_drop_oper: "Impossible d'abandonner l'opérateur IRC %nickname%."
  cannot_drop_self: "Vous ne pouvez pas abandonner votre propre surnom."
  success: "Le surnom %nickname% a été marqué pour suppression et peut être restauré pendant la période de grâce."
  force_success: "Le surnom %nickname% a été définitivement supprimé."
  pending_deletion: "Le surnom %nickname% est déjà en attente de suppression. Utilisez DROP <surnom> FORCE pour le supprimer définitivement."
  cannot_drop_service: "Impossible d'abandonner le surnom de service %nickname%."

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <surnom>"
  short: "Restaurer un surnom en attente de suppression."
  help: |-
    Restaure un pseudonyme en attente de suppression tant qu’il est encore dans sa
    période de grâce.
  example: "%command_prefix%RESTORE CuentaAntigua"
  success: "Le surnom %nickname% a été restauré."
  not_pending_deletion: "Le surnom %nickname% n'est pas en attente de suppression."

# --- RESCUE -------------------------------------------------------------------
rescue:
  issued: |-
    Jeton de secours : %token_display%

    Conservez ce jeton en lieu sûr. Vous en aurez besoin pour récupérer votre pseudonyme si vous oubliez votre mot de passe.

    Pour le confirmer, utilisez : /msg %bot% %verify%

    %warning%
  issued_warning: "IMPORTANT : Seul le dernier jeton généré est valide. Une fois confirmé, il ne sera plus affiché. Ne le partagez avec personne."
  confirmed: "Votre jeton de secours est confirmé. Conservez-le en lieu sûr."
  unavailable: "Authentifiez-vous et confirmez votre jeton de secours avec %command_0% avant cette opération."
  unavailable_command_0: "VERIFY"
  locked_out: "Trop de jetons incorrects. Réessayez dans %seconds% secondes."
  throttled: "Trop de jetons incorrects. Réessayez dans %minutes% minute(s)."
  replaced: "Votre jeton de récupération est remplacé par le jeton du courriel que vous venez de valider. Conservez-le en lieu sûr."
  optional_replacement: |-
    Nouveau jeton de récupération facultatif : %token_display%

    Pour remplacer votre jeton de récupération actuel, utilisez : /msg %bot% %verify%

    Le jeton actuel reste valable jusqu’à confirmation.

    Si vous ne souhaitez pas le changer, ignorez ce message.
  replacement_unavailable: "Votre mot de passe est réinitialisé, mais aucun nouveau jeton n’a pu être émis. Votre jeton actuel reste valable."
  temporarily_unavailable: "La remise du jeton de récupération est temporairement indisponible. Réessayez plus tard."


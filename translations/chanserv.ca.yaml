# Traduccions de ChanServ — Català
# Domini: chanserv
#
# Codis de format IRC (cometes dobles o blocs literals !irc):
#   \x02        activa/desactiva la negreta
#   \x03NN      color (DECIMAL: 03=verd, 04=vermell, 07=taronja, 14=gris fosc)
#   \x03        restableix el color
#   \x0F        restableix tot el format
#
# Els colors IRC usen números DECIMALS (0-15), no hexadecimals.
#   \x0314 = gris fosc (14 decimal): CORRECTE
#   \x030F = color 0 seguit de la lletra F: ERROR
#
# Text IRC multilínia: !irc |- amb salts físics i espais reals.
# Els blocs sense etiqueta no descodifiquen escapes; conserva els literals CTCP.
# Exemples HELP: example/examples i %command_prefix%.
# El presentador afegeix /msg sense color i un marge de dos espais.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Nom de canal no vàlid. Utilitzeu \x02#channel\x02."
  generic: "\x0304✗\x03 S'ha produït un error. Torneu-ho a provar."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#channel> <description>"
  example: "%command_prefix%\x02\x0303REGISTER #canal Projecte comunitari\x03\x0F"
  short: "Registrar un canal."
  help: |-
    Registra i associa un canal al teu sobrenom. T'has
    d'haver identificat amb %nickserv%.
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha estat registrat."
  already_registered: "\x0304✗\x03 El canal \x02%channel%\x02 ja està registrat."
  channel_not_on_network: "\x0304✗\x03 El canal \x02%channel%\x02 no existeix a la xarxa."
  pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 està pendent d'eliminació i no pot ser registrat."
  insufficient_channel_rank: "\x0304✗\x03 Heu de tenir com a mínim estat d'operador a \x02%channel%\x02 per registrar-lo."
  limit_exceeded: "\x0304✗\x03 Heu assolit el màxim de %max% canals registrats."
  throttled: "\x0304✗\x03 Heu d'esperar \x02%minutes%\x02 minut(s) abans de registrar un altre canal."

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#channel>"
  example: "%command_prefix%\x02\x0303INFO #canal\x03\x0F"
  short: "Mostrar la informació del canal."
  help: |-
    Mostra informació detallada d'un canal registrat,
    incloent-ne el propietari, les dades de registre,
    l'activitat recent i les opcions de configuració.
  header: "\x02Informació del canal \x0307%channel%\x03\x02"
  founder: "  \x0314Fundador\x03           : \x02%nickname%\x02"
  registered: "  \x0314Registrat\x03          : %date%"
  successor: "  \x0314Successor\x03          : \x02%nickname%\x02"
  description: "  \x0314Descripció\x03         : %desc%"
  url: "  \x0314URL\x03                : %url%"
  email: "  \x0314Correu\x03             : %email%"
  last_used: "  \x0314Darrer ús\x03          : %date%"
  topic: "  \x0314Darrer tema\x03        : %topic%"
  topic_set_by: "  \x0314Tema posat per\x03     : %nickname%"
  options: "  \x0314Opcions\x03            : %options%"
  private: "\x0304✗\x03 La informació del canal \x02%channel%\x02 és privada."
  no_expire: "  \x0314Mai expira\x03         : Sí"
  mlock_modes: "  \x0314Bloqueig de modes\x03  : %modes%"
  suspended_status: "  \x0314Estat\x03              : \x0304Suspès\x03"
  suspended_reason: "  \x0314Motiu\x03              : %reason%"
  suspended_until: "  \x0314Acaba el\x03           : %date%"
  suspended_permanent: "  \x0314Acaba el\x03           : Permanent"
  forbidden_status: "  \x0314Estat\x03              : \x0304Prohibit\x03"
  forbidden_reason: "  \x0314Motiu\x03              : %reason%"
  pending_deletion_status: "  \x0314Estat\x03              : \x0307Pendent d'eliminació\x03"
  pending_deletion_at: "  \x0314Eliminat\x03           : %date%"
  pending_deletion_until: "  \x0314Elim. definitiva\x03   : %date%"
  pending_deletion_notice: "  \x0307Aquest canal està congelat i no pot ser registrat.\x03"

# --- HELP ------------------------------------------------------------------
help:
  examples_header: "\x02 ■ Exemples:\x02"
  syntax: "HELP [ordre] [opció]"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
  short: "Llistar les ordres o mostrar l'ajuda d'una ordre."
  help: "Mostra les ordres disponibles i l'ajuda detallada de les seves opcions."
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Permet registrar i administrar canals, configurar-ne les opcions i controlar
    qui hi pot accedir. Gestiona els nivells d'accés i els privilegis dels usuaris
    perquè els responsables mantinguin el control del canal.
  general_header: "\x02 ■ Comandes disponibles:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Opcions:\x02"
  general_footer: "\x0310ℹ\x03\x0F Fes servir /msg %bot% \x02\x0303HELP <comanda>\x03\x0F per obtenir més informació."
  set_sub_footer: "\x0310ℹ\x03\x0F Fes servir /msg %bot% \x02\x0303HELP %command% <opció>\x03\x0F per obtenir més informació."
  syntax_label: "Sintaxi: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0304⚠\x03\x0F NOTA: Els canals inactius més de \x1F\x0304%days% dies\x03\x1F s'esborren."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_info: "Registre i informació"
    access_levels: "Accés i nivells"
    ranks_entry: "Rangs i entrada"
  ircop_group:
    channel_operations: "Operacions del canal"
    channel_management: "Gestió del canal"
    deletion: "Eliminació i restauració"
    restrictions: "Restriccions"
    lookup: "Consulta i investigació"
  ircop_header: "\x02 ■ Comandes disponibles per als IRCops:\x02"

# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303OP #canal Alícia\x03\x0F"
  short: "Donar el mode d'operador de canal."
  help: "Donar el mode d'operador de canal."
  done: "\x0303✔\x03 A \x02%nickname%\x02 se li ha donat l'estat d'operador de canal."
  user_not_on_channel: "\x0304✗\x03 El sobrenom \x02%nickname%\x02 no és a la xarxa."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 dona \x0304%mode%\x03 a \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEOP #canal Alícia\x03\x0F"
  short: "Treure el mode d'operador de canal."
  help: "Treure el mode d'operador de canal."
  done: "\x0303✔\x03 A \x02%nickname%\x02 se li ha tret l'op."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 Amb SECURE activat, \x02%nickname%\x02 ha de tenir almenys el nivell \x02%level%\x02 per rebre \x02%mode%\x02."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#channel> <option> [value]"
  example: "%command_prefix%\x02\x0303SET #canal DESC Un canal comunitari\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #canal URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #canal MLOCK ON\x03\x0F"
  short: "Canviar les opcions del canal."
  help: |-
    Canvia una opció del canal. L'ajuda de cada opció n'explica els requisits i
    les variants.
  unknown_option: "\x0304✗\x03 Opció desconeguda \x02%option%\x02. Utilitzeu una de: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Utilitza SET <#canal> FOUNDER <sobrenom> <token> amb el testimoni confirmat del fundador actual."
    token_unavailable: "El fundador actual no té cap testimoni de rescat confirmat. Primer s’ha d’autenticar i utilitzar VERIFY."
    syntax: "SET <#canal> FOUNDER <sobrenom> [token]"
    example: "%command_prefix%\x02\x0303SET #canal FOUNDER Alícia\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal FOUNDER Alícia token-confirmat\x03\x0F"
    short: "Transferir el canal a un altre sobrenom registrat."
    help: |-
      Canvia el fundador després de validar el token del fundador actual. Es manté
      l'excepció administrativa de nivell fundador. El token no es consumeix.
    invalid_token: "El testimoni de rescat no és vàlid."
    updated: "\x0303✔\x03 El fundador s'ha canviat a \x02%nickname%\x02."
    throttled: "Massa testimonis incorrectes. Torna-ho a provar d’aquí a %minutes% minut(s)."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 ha d'estar registrat i activat."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 està suspès i no es pot establir com a fundador."
    cannot_be_self: "\x0304✗\x03 El nou fundador no pot ser el fundador actual."
    cannot_be_successor: "\x0304✗\x03 El nou fundador no pot ser el successor del canal."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 ha assolit el màxim de %max% canals registrats."
    notice_channel: "\x02%from%\x02 assigna \x02%nickname%\x02 com a fundador del canal."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%\x02\x0303SET #canal SUCCESSOR Alícia\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal SUCCESSOR\x03\x0F"
    short: "Establir el successor del canal."
    help: |-
      Assigna un sobrenom com a successor d'un canal. Si no s'indica cap sobrenom,
      s'esborra l'actual. El sobrenom ha d'estar registrat i activat.
    cleared: "\x0303✔\x03 S'ha esborrat el successor."
    updated: "\x0303✔\x03 S'ha establert el successor com a \x02%nickname%\x02."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 ha d'estar registrat i activat."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 està suspès i no es pot establir com a successor."
    cannot_be_founder: "\x0304✗\x03 El fundador no es pot establir com a successor."
    notice_channel: "\x02%from%\x02 assigna \x02%nickname%\x02 com a successor del canal."
    notice_channel_cleared: "\x02%from%\x02 ha esborrat el successor del canal."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <description>"
    example: "%command_prefix%\x02\x0303SET #canal DESC Un canal comunitari\x03\x0F"
    short: "Canviar la descripció del canal."
    help: "Canviar la descripció del canal (obligatòria)."
    updated: "\x0303✔\x03 Descripció actualitzada."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%\x02\x0303SET #canal URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal URL\x03\x0F"
    short: "Establir l'URL del canal."
    help: "Canvia l'adreça URL (web) d'un canal. Omet URL per esborrar-la."
    updated: "\x0303✔\x03 URL actualitzat."
    cleared: "\x0303✔\x03 URL esborrat."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canal> EMAIL [correu]"
    example: "%command_prefix%\x02\x0303SET #canal EMAIL equip@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal EMAIL\x03\x0F"
    short: "Establir el correu electrònic del canal."
    help: |-
      Canvia el correu electrònic d'un canal. Omet el correu per esborrar-
      lo. No s’admeten dominis de correu bloquejats administrativament.
      Excepció administrativa: operadors amb accés de nivell fundador.
    invalid: "\x0304✗\x03 Adreça de correu no vàlida."
    updated: "\x0303✔\x03 Correu electrònic actualitzat."
    cleared: "\x0303✔\x03 Correu electrònic esborrat."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canal> ENTRYMSG [missatge]"
    example: "%command_prefix%\x02\x0303SET #canal ENTRYMSG Benvingut\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal ENTRYMSG\x03\x0F"
    short: "Establir el missatge d'entrada del canal."
    help: "Estableix el missatge d'entrada (NOTICE). Omet el missatge per esborrar-lo."
    updated: "\x0303✔\x03 Missatge d'entrada actualitzat."
    too_long: "\x0304✗\x03 El missatge d'entrada no pot superar els %max% caràcters."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal TOPICLOCK OFF\x03\x0F"
    short: "Bloquejar el tema del canal."
    help: |-
      Impedeix canviar el tema del canal. En activar-ho,
      es fixa el tema actual.
    on: "\x0303✔\x03 El bloqueig de tema ara és ON."
    off: "\x0303✔\x03 El bloqueig de tema ara és OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activa TOPICLOCK."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 desactiva TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal MLOCK OFF\x03\x0F"
    short: "Bloquejar els modes del canal."
    help: |-
      Bloqueja els modes actuals (p. ex. +nt). Si és ON,
      no es poden canviar.
    no_modes: "sense modes"
    on: "\x0303✔\x03 MLOCK ara és ON (%modes%)."
    off: "\x0303✔\x03 MLOCK ara és OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activa MLOCK (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 desactiva MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canal> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal PRIVATE OFF\x03\x0F"
    short: "Fer privada la informació del canal."
    help: |-
      Quan és ON, només el fundador i els usuaris amb accés poden veure la
      informació del canal.
    on: "\x0303✔\x03 La informació del canal ara és privada."
    off: "\x0303✔\x03 La informació del canal ara és pública."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal SECURE OFF\x03\x0F"
    short: "Exigir la llista d'accés per als rangs del canal."
    help: "Impedeix assignar rangs al canal a sobrenoms que no siguin a la llista d'accés."
    on: "\x0303✔\x03 SECURE ara és ON."
    off: "\x0303✔\x03 SECURE ara és OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activa el mode SECURE."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 desactiva el mode SECURE."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#channel> {ADD|DEL|LIST} [nickname] [level]"
  example: "%command_prefix%\x02\x0303ACCESS #canal LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #canal ADD Alícia 100\x03\x0F"
    - "%command_prefix%\x02\x0303ACCESS #canal DEL Alícia\x03\x0F"
  short: "Gestionar la llista d'accés."
  help: "Gestiona la llista d'accés del canal."
  unknown_sub: "\x0304✗\x03 Subordre desconeguda \x02%sub%\x02. Utilitzeu LIST, ADD, o DEL."
  level_range: "\x0304✗\x03 El nivell d'accés ha d'estar entre %min% i %max%."
  cannot_manage_level: "\x0304✗\x03 Només podeu gestionar sobrenoms amb nivell estrictament inferior al vostre."
  founder_not_in_list: "\x0304✗\x03 El fundador no és a la llista d'accés."
  max_entries: "\x0304✗\x03 Màxim de %max% entrades d'accés per canal."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#channel> LIST"
    example: "%command_prefix%\x02\x0303ACCESS #canal LIST\x03\x0F"
    short: "Llistar la llista d'accés (requereix nivell ACCESSLIST)."
    help: "Mostra el sobrenom i el nivell de cada entrada."
    header: "\x0303Llista d'accés de \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 El canal \x02%channel%\x02 no té cap entrada d'accés."
    entry: "  #%index%: %nickname% (nivell %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#channel> ADD <nickname> <level>"
    example: "%command_prefix%\x02\x0303ACCESS #canal ADD Alícia 100\x03\x0F"
    short: "Afegir o actualitzar el nivell d'accés (requereix nivell ACCESSCHANGE)."
    help: "Nivell 1-499. Només podeu establir nivells inferiors al vostre."
    done: "\x0303✔\x03 \x02%nickname%\x02 establert al nivell %level%."
    notice_channel: "\x0303✔\x03 \x0302%from%\x03 estableix \x0314%to%\x03 al nivell \x0304%level%\x03"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#channel> DEL <nickname>"
    example: "%command_prefix%\x02\x0303ACCESS #canal DEL Alícia\x03\x0F"
    short: "Treure de la llista d'accés (requereix nivell ACCESSCHANGE)."
    help: "Només podeu treure sobrenoms amb nivell inferior al vostre."
    not_in_list: "\x0304✗\x03 \x02%nickname%\x02 no és a la llista d'accés."
    done: "\x0303✔\x03 \x02%nickname%\x02 tret de la llista d'accés."
    notice_channel: "\x0304✗\x03 \x0302%from%\x03 treu \x0314%to%\x03 de la llista d'accés"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#channel>"
  example: "%command_prefix%\x02\x0303DELACCESS #canal\x03\x0F"
  short: "Treure el vostre propi accés d'un canal."
  help: |-
    Elimina la teva entrada d'accés del canal. T'has
    d'haver identificat.
  done: "\x0303✔\x03 El vostre accés ha estat tret de \x02%channel%\x02."
  not_in_list: "\x0304✗\x03 No teniu accés a \x02%channel%\x02."
  founder_not_in_access: "\x0304✗\x03 Sou el fundador de \x02%channel%\x02 i no sou a la llista d'accés."
  notice_channel: "\x0304✗\x03 \x0302%nickname%\x03 treu el seu accés del canal"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#channel> {LIST|SET|RESET} [level] [value]"
  example: "%command_prefix%\x02\x0303LEVELS #canal LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #canal SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #canal RESET\x03\x0F"
  short: "Configurar els nivells del canal."
  help: |-
    Configura els nivells mínims d'accés per a les accions del canal. Només el
    fundador pot canviar o restablir els nivells.
  unknown_sub: "\x0304✗\x03 Subordre desconeguda \x02%sub%\x02. Utilitzeu LIST, SET, o RESET."
  unknown_key: "\x0304✗\x03 Clau de nivell desconeguda \x02%key%\x02 o no compatible amb aquest IRCd."
  value_range: "\x0304✗\x03 El valor del nivell ha d'estar entre %min% i %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#channel> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #canal LIST\x03\x0F"
    short: "Llistar els requisits de nivell."
    help: |-
      Mostra cada clau de nivell i el seu valor (el
      predeterminat si no s'ha establert).
    header: "\x0303Nivells de %channel%\x03"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#channel> SET <level> <value>"
    example: "%command_prefix%\x02\x0303LEVELS #canal SET OPDEOP 50\x03\x0F"
    short: "Establir un requisit de nivell."
    help: "Valor -1 a 499. Només el fundador."
    done: "\x0303✔\x03 \x02%key%\x02 establert a %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#channel> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #canal RESET\x03\x0F"
    short: "Restablir tots els nivells als valors predeterminats."
    help: "Treu totes les modificacions. Només el fundador."
    done: "\x0303✔\x03 Tots els nivells restablerts als valors predeterminats."

# --- VOICE -----------------------------------------------------------------
voice:
  syntax: "VOICE <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303VOICE #canal Alícia\x03\x0F"
  short: "Donar el mode de veu al canal."
  help: "Donar el mode de veu al canal."
  done: "\x0303✔\x03 A \x02%nickname%\x02 se li ha donat veu."
  user_not_on_channel: "\x0304✗\x03 El sobrenom \x02%nickname%\x02 no és a la xarxa."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 dona \x0304%mode%\x03 a \x0314%to%\x03"

# --- DEVOICE ---------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEVOICE #canal Alícia\x03\x0F"

# --- LEVEL FOUNDER ---------------------------------------------------------
level_founder:
  short: "Permet fer operacions que requereixen el nivell de fundador del canal."

# --- CLEARACCESS -----------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#channel>"
  example: "%command_prefix%\x02\x0303CLEARACCESS #canal\x03\x0F"
  short: "Esborrar tota la llista d'accés d'un canal."
  help: "Elimina totes les entrades d'accés del canal. Aquesta acció és irreversible."
  success: "\x0303✔\x03 S'han esborrat \x02%count%\x02 entrades d'accés de \x02%channel%\x02."
  empty: "\x0307ℹ\x03 El canal \x02%channel%\x02 no té cap entrada d'accés."

# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#channel> [motiu]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #canal\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #canal flooding\x03\x0F"
  short: "Fer kick a tots els usuaris d'un canal."
  help: |-
    Expulsa tots els usuaris del canal. És una ordre exclusiva d'IRCop; si no
    s'indica cap motiu, se n'utilitza un de predeterminat.
  not_on_network: "\x0304✗\x03 El canal \x02%channel%\x02 no és actualment a la xarxa."
  empty: "\x0307ℹ\x03 El canal \x02%channel%\x02 no té cap usuari per fer kick."
  success: "\x0303✔\x03 S'ha fet kick a \x02%count%\x02 usuari(s) de \x02%channel%\x02."
  default_reason: "ordre CLEARUSERS"

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <patró> [pàgina]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "Llista canals registrats que coincideixen amb un patró."
  help: |-
    Llista els canals registrats que coincideixen amb el
    patró. El comodí * coincideix amb qualsevol seqüència
    de caràcters. La pàgina és opcional i comença per 1.
  header: "Canal | Fundador | Registre | Últim ús | Estat"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Cap canal coincideix amb el patró %pattern%."
  status_active: "Actiu"

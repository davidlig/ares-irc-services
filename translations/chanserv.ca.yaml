  short: "Configurar els nivells del canal."
  help: |-
    Configura els nivells mínims d'accés per a les accions del canal. Només el
    fundador pot canviar o restablir els nivells.
  unknown_sub: "Subordre desconeguda %sub%. Utilitzeu LIST, SET, o RESET."
  unknown_key: "Clau de nivell desconeguda %key% o no compatible amb aquest IRCd."
  value_range: "El valor del nivell ha d'estar entre %min% i %max%."

  # --- LEVELS LIST ---------------------------------------------------------

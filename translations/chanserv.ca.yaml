# --- DEADMIN ---------------------------------------------------------------
deadmin:
  syntax: "DEADMIN <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEADMIN #canal Alícia\x03\x0F"
  short: "Treure el mode d'administrador de canal."
  help: "Treure el mode d'administrador de canal."
  done: "\x0303✔\x03 A \x02%nickname%\x02 se li ha tret l'admin."

# --- HALFOP ----------------------------------------------------------------
halfop:
  syntax: "HALFOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303HALFOP #canal Alícia\x03\x0F"
  short: "Donar el mode de semioperador al canal."

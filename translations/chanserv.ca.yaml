    short: "Elimina una entrada de l'historial."
    help: "Elimina una entrada de l'historial pel seu ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#channel> VIEW [PAGE|ALL]"
    example: "%command_prefix%HISTORY #canal VIEW"
    examples:
      - "%command_prefix%HISTORY #canal VIEW 2"
      - "%command_prefix%HISTORY #canal VIEW ALL"
    short: "Veure l'historial d'accions del canal."
    help: "Mostra les entrades de l'historial del canal."

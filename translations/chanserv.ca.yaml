  help: "Donar el mode de veu al canal."
  done: "A %nickname% se li ha donat veu."
  user_not_on_channel: "El sobrenom %nickname% no és a la xarxa."
  notice_grant: "%from% dona %mode% a %to%"

# --- DEVOICE ---------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#channel> <nickname>"
  example: "%command_prefix%DEVOICE #canal Alícia"
  short: "Treure el mode de veu al canal."
  help: "Treure el mode de veu al canal."
  done: "A %nickname% se li ha tret la veu."

# --- UNBAN -----------------------------------------------------------------
unban:
  syntax: "UNBAN <#channel>"
  example: "%command_prefix%UNBAN #canal"
  short: "Retirar els bans que t’afecten."
  help: "Retira tots els bans del canal que coincideixen amb la teva identitat actual, inclosos comodins i màscares IP/CIDR."
  done: "S’han retirat %count% ban(s) que t’afecten a %channel%"
  notice_channel: "%nickname% ha utilitzat UNBAN."
  no_matches: "Cap ban coincideix amb la teva identitat a %channel%"
  unavailable: "No s’han pogut determinar els bans que et corresponen; no s’ha canviat res."
  not_on_network: "El canal %channel% no és a la xarxa."

# --- INVITE ----------------------------------------------------------------
invite:
  syntax: "INVITE <#channel>"
  example: "%command_prefix%INVITE #canal"
  short: "Convidar-vos al canal."
  help: "Convidar-vos al canal."
  done: "Heu estat convidat a %channel%."
  notice_channel: "%nickname% es convida al canal."

# --- ADMIN -----------------------------------------------------------------
admin:
  syntax: "ADMIN <#channel> <nickname>"
  example: "%command_prefix%ADMIN #canal Alícia"
  short: "Donar el mode d'administrador de canal."
  help: "Donar el mode d'administrador de canal. Només si l'IRCd admet +a."
  done: "A %nickname% se li ha donat administrador de canal."
  user_not_on_channel: "El sobrenom %nickname% no és a la xarxa."
  notice_grant: "%from% dona %mode% a %to%"
  not_supported: "Aquesta xarxa no admet el mode d'administrador de canal (+a)."

# --- DEADMIN ---------------------------------------------------------------
deadmin:
  syntax: "DEADMIN <#channel> <nickname>"
  example: "%command_prefix%DEADMIN #canal Alícia"
  short: "Treure el mode d'administrador de canal."
  help: "Treure el mode d'administrador de canal."
  done: "A %nickname% se li ha tret l'admin."

# --- HALFOP ----------------------------------------------------------------
halfop:
  syntax: "HALFOP <#channel> <nickname>"
  example: "%command_prefix%HALFOP #canal Alícia"
  short: "Donar el mode de semioperador al canal."
  help: "Donar el mode de semioperador al canal. Només si l'IRCd admet +h."
  done: "A %nickname% se li ha donat halfop."
  user_not_on_channel: "El sobrenom %nickname% no és a la xarxa."
  notice_grant: "%from% dona %mode% a %to%"
  not_supported: "Aquesta xarxa no admet el mode de semioperador (+h)."

# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#channel> <nickname>"
  example: "%command_prefix%DEHALFOP #canal Alícia"
  short: "Treure el mode de semioperador al canal."
  help: "Treure el mode de semioperador al canal."
  done: "A %nickname% se li ha tret el halfop."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> {ADD <mask> [expiry] [motiu]|DEL {<mask>|<number>}|LIST}"
  example: "%command_prefix%AKICK #canal ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #canal ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #canal DEL *!*@*"
    - "%command_prefix%AKICK #canal DEL 2"
    - "%command_prefix%AKICK #canal LIST"
  short: "Gestionar la llista d'auto-kick."
  help: "Gestiona les entrades d'expulsió automàtica i la seva caducitat opcional."
  unknown_sub: "Subordre desconeguda %sub%. Utilitzeu ADD, DEL o LIST."
  invalid_mask: "Format de màscara no vàlid. Utilitzeu nick!ident@host amb comodins (*)."
  dangerous_mask: "La màscara %mask% és massa àmplia. Ha de contenir almenys 4 caràcters alfanumèrics."
  protected_user: "El sobrenom %nickname% té accés en aquest canal."
  max_entries: "Màxim de %max% entrades AKICK per canal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <mask> [expiry] [motiu]"
    example: "%command_prefix%AKICK #canal ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #canal ADD *!*@* 7d Spam"
    short: "Afegir entrada AKICK."
    help: |-
      Afegeix una màscara a la llista d'expulsió automàtica del canal.

      Pots indicar una durada i un motiu. Si inclous un motiu, també has d'especificar
      la durada: 0 per a permanent, d per a dies, h per a hores o m per a minuts.
    done: "AKICK %mask% afegit."
    already_exists: "AKICK %mask% ja existeix."
    notice_channel: "%from% afegeix AKICK: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL {<mask>|<number>}"
    example: "%command_prefix%AKICK #canal DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #canal DEL 2"
    short: "Treure entrada AKICK."
    help: "Treure per màscara exacta o número d'entrada de LIST."
    not_found: "AKICK %mask% no trobat."
    done: "AKICK %mask% tret."
    notice_channel: "%from% treu AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#channel> LIST"
    example: "%command_prefix%AKICK #canal LIST"
    short: "Llistar entrades AKICK."
    help: "Mostra la màscara, el motiu, la caducitat i qui l'ha afegit."
    header: "Llista AKICK de %channel%"
    empty: "El canal %channel% no té cap entrada AKICK."
    entry: "#%index% %mask% %reason% (per %nickname%, expira: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#channel>"
  example: "%command_prefix%RESTORE #canal"
  short: "Restaurar un canal pendent d'eliminació."
  help: |-
    Restaura un canal eliminat manualment que encara es troba dins del període de
    marge.
  success: "El canal %channel% ha estat restaurat."
  not_pending_deletion: "El canal %channel% no està pendent d'eliminació."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#channel> [FORCE]"
  example: "%command_prefix%DROP #canal"
  examples:
    - "%command_prefix%DROP #canal FORCE"
  short: "Eliminar un canal registrat."
  help: |-
    Elimina un canal registrat de la base de dades.
    FORCE elimina permanentment un canal pendent d’eliminació.
    Un IRCop amb permís DROP també pot alliberar immediatament
    sol·licituds de registre pendents i rebutjades, amb FORCE o sense.
  registration_restricted: "Aquesta sol·licitud de registre està restringida fins a %date%."
  force:
    short: "Elimina definitivament un canal pendent d'eliminació."
  success: "El canal %channel% ha estat marcat per a eliminació i pot ser restaurat durant el període de gràcia."
  force_success: "El canal %channel% ha estat eliminat permanentment."
  pending_deletion: "El canal %channel% ja està pendent d'eliminació. Utilitza DROP <#channel> FORCE per eliminar-lo permanentment."
  invalid_channel: "Nom de canal no vàlid. Utilitzeu %example%."
  pending_deletion_reason: "El canal %channel% està pendent d'eliminació. Més informació: /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#channel> <duration> <motiu>"
  example: "%command_prefix%SUSPEND #canal 7d Incompliment de les normes"
  examples:
    - "%command_prefix%SUSPEND #canal 0 Incompliment de les normes"
  short: "Suspendre un canal."
  help: |-
    Desactiva temporalment un canal registrat. Durada: 0 =
    permanent, 1d, 12h o 60m.
    Mentre estigui suspès, els modes, l'accés i l'aplicació
    de normes del canal estan desactivats.
  success: "El canal %channel% ha estat suspès fins a %duration%."
  already_suspended: "El canal %channel% ja està suspès."
  invalid_duration: "Durada no vàlida. Utilitzeu: 0 (permanent), 1d, 12h, o 60m."
  channel_suspended: "El canal %channel% està suspès i no es pot utilitzar."
  notice_channel: "El canal ha estat suspès. Motiu: %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#channel>"
  example: "%command_prefix%UNSUSPEND #canal"
  short: "Aixecar una suspensió de canal."
  help: "Reactiva un canal suspès i en restaura els modes i l'aplicació de normes."
  success: "El canal %channel% ja no està suspès."
  not_suspended: "El canal %channel% no està suspès."
  reason_expired: "suspensió expirada"

# --- NOJOIN ----------------------------------------------------------------
nojoin:
  reason: "restricció de nivell NOJOIN"

# --- DEBUG CHANNEL ---------------------------------------------------------
debug_channel:
  kick_reason: "No esteu autoritzat a unir-vos a aquest canal."

# --- IRCOPONLY -------------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#channel> {ON|OFF}"
  example: "%command_prefix%IRCOPONLY #canal ON"
  examples:
    - "%command_prefix%IRCOPONLY #canal OFF"
  short: "Restringir un canal als operadors IRC."
  help: |-
    Només els operadors IRC autoritzats poden romandre al canal. %bot% s'encarrega
    d'aplicar aquesta restricció.
  on: "IRCOPONLY activat a %channel%."
  off: "IRCOPONLY desactivat a %channel%."

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#channel> {ON|OFF}"
  example: "%command_prefix%NOEXPIRE #Important ON"
  examples:
    - "%command_prefix%NOEXPIRE #Important OFF"
  short: "Establir o treure la protecció contra l'expiració d'un canal."
  help: |-
    Controla si el canal caduca per inactivitat.
    ON n'evita la caducitat i OFF aplica les regles normals.
  success_on: "El canal %channel% ara està protegit contra l'expiració."
  success_off: "El canal %channel% ara expirarà normalment."
  forbidden: "El canal %channel% està prohibit."
  suspended: "El canal %channel% està suspès."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <#channel> <motiu>"
  example: "%command_prefix%FORBID #canal Incompliment de les normes"
  short: "Prohibir l'ús d'un canal."
  help: |-
    Prohibeix un canal, n'expulsa tots els usuaris i els
    impedeix tornar-hi. Si està registrat, se n'elimina el
    registre abans d'aplicar la prohibició.
  reason_required: "Heu d'especificar un motiu."
  success: "El canal %channel% ha estat prohibit."
  updated: "El motiu de prohibició del canal %channel% ha estat actualitzat."
  channel_forbidden: "El canal %channel% està prohibit i no es pot utilitzar."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#channel>"
  example: "%command_prefix%UNFORBID #canal"
  short: "Treure una prohibició de canal."
  help: "Retira la prohibició d'un canal perquè es pugui tornar a registrar."
  success: "El canal %channel% ja no està prohibit."
  not_forbidden: "El canal %channel% no està prohibit."


  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#channel> CLEAR"
    example: "%command_prefix%HISTORY #canal CLEAR"
    short: "Esborrar totes les entrades d'historial d'un canal."
    help: "Elimina totes les entrades de l'historial del canal."

# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEHALFOP #canal Alícia\x03\x0F"
  short: "Treure el mode de semioperador al canal."
  help: "Treure el mode de semioperador al canal."
  done: "\x0303✔\x03 A \x02%nickname%\x02 se li ha tret el halfop."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> {ADD|DEL|LIST} [mask] [expiry] [motiu]"
  example: "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canal DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canal DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canal LIST\x03\x0F"
  short: "Gestionar la llista d'auto-kick."
  help: "Gestiona les entrades d'expulsió automàtica i la seva caducitat opcional."
  unknown_sub: "\x0304✗\x03 Subordre desconeguda \x02%sub%\x02. Utilitzeu ADD, DEL o LIST."
  invalid_mask: "\x0304✗\x03 Format de màscara no vàlid. Utilitzeu \x02nick!ident@host\x02 amb comodins (*)."
  dangerous_mask: "\x0304✗\x03 La màscara \x02%mask%\x02 és massa àmplia. Ha de contenir almenys 4 caràcters alfanumèrics."
  protected_user: "\x0304✗\x03 El sobrenom \x02%nickname%\x02 té accés en aquest canal."
  max_entries: "\x0304✗\x03 Màxim de %max% entrades AKICK per canal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <mask> [expiry] [motiu]"
    example: "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 7d Spam\x03\x0F"
    short: "Afegir entrada AKICK."
    help: |-
      Afegeix una màscara a la llista d'expulsió automàtica del canal.

      Pots indicar una durada i un motiu. Si inclous un motiu, també has d'especificar
      la durada: 0 per a permanent, d per a dies, h per a hores o m per a minuts.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 afegit."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 ja existeix."
    notice_channel: "\x02%from%\x02 afegeix AKICK: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL <mask|number>"
    example: "%command_prefix%\x02\x0303AKICK #canal DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canal DEL 2\x03\x0F"
    short: "Treure entrada AKICK."
    help: "Treure per màscara exacta o número d'entrada de LIST."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 no trobat."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 tret."
    notice_channel: "\x02%from%\x02 treu AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#channel> LIST"
    example: "%command_prefix%\x02\x0303AKICK #canal LIST\x03\x0F"
    short: "Llistar entrades AKICK."
    help: "Mostra la màscara, el motiu, la caducitat i qui l'ha afegit."
    header: "\x0303Llista AKICK de \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 El canal \x02%channel%\x02 no té cap entrada AKICK."
    entry: "  #%index% %mask% %reason% (per %nickname%, expira: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#channel>"
  example: "%command_prefix%\x02\x0303RESTORE #canal\x03\x0F"
  short: "Restaurar un canal pendent d'eliminació."
  help: |-
    Restaura un canal eliminat manualment que encara es troba dins del període de
    marge.
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha estat restaurat."
  not_pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 no està pendent d'eliminació."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#channel> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #canal\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP #canal FORCE\x03\x0F"
  short: "Eliminar un canal registrat."
  help: |-
    Elimina un canal registrat de la base de dades.
    FORCE elimina definitivament un canal pendent d'eliminació.
  force:
    short: "Elimina definitivament un canal pendent d'eliminació."
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha estat marcat per a eliminació i pot ser restaurat durant el període de gràcia."
  force_success: "\x0303✔\x03 El canal \x02%channel%\x02 ha estat eliminat permanentment."
  pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 ja està pendent d'eliminació. Utilitza DROP <#channel> FORCE per eliminar-lo permanentment."
  invalid_channel: "\x0304✗\x03 Nom de canal no vàlid. Utilitzeu \x02#channel\x02."
  pending_deletion_reason: "El canal %channel% està pendent d'eliminació. Més informació: /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#channel> <duration> <motiu>"
  example: "%command_prefix%\x02\x0303SUSPEND #canal 7d Incompliment de les normes\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND #canal 0 Incompliment de les normes\x03\x0F"
  short: "Suspendre un canal."
  help: |-
    Desactiva temporalment un canal registrat. Durada: 0 =
    permanent, 1d, 12h o 60m.
    Mentre estigui suspès, els modes, l'accés i l'aplicació
    de normes del canal estan desactivats.
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha estat suspès fins a \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 El canal \x02%channel%\x02 ja està suspès."
  invalid_duration: "\x0304✗\x03 Durada no vàlida. Utilitzeu: 0 (permanent), 1d, 12h, o 60m."
  channel_suspended: "\x0304✗\x03 El canal \x02%channel%\x02 està suspès i no es pot utilitzar."
  notice_channel: "\x0304⚠\x03 El canal ha estat suspès. Motiu: %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#channel>"
  example: "%command_prefix%\x02\x0303UNSUSPEND #canal\x03\x0F"
  short: "Aixecar una suspensió de canal."
  help: "Reactiva un canal suspès i en restaura els modes i l'aplicació de normes."
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ja no està suspès."
  not_suspended: "\x0304✗\x03 El canal \x02%channel%\x02 no està suspès."
  reason_expired: "suspensió expirada"


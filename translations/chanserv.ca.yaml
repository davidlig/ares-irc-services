  successor_changed: "Successor canviat de %old_successor% a %new_successor%"
  successor_cleared: "Successor esborrat"
  access_add: "Accés afegit per a %target_nickname% (nivell %level%)"
  access_del: "Accés tret per a %target_nickname%"
  akick_add: "AKICK afegit: %mask%"
  akick_del: "AKICK tret: %mask%"
history.extra:

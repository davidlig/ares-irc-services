  accepted: "El registre de %channel% ha estat aprovat."
  rejected: "El registre de %channel% ha estat rebutjat."
  not_pending: "El canal %channel% no té cap registre pendent."
  channel_not_on_network: "El canal %channel% no és a la xarxa."
  founder_limit: "El sol·licitant ha assolit el límit de canals registrats."
  requester_inactive: "El compte sol·licitant ja no és actiu."
  requester_ineligible: "El sol·licitant ha de tenir actualment estat d’operador al canal."


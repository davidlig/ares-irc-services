# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#channel> <nickname>"
  example: "%command_prefix%DEOP #canal Alícia"
  short: "Treure el mode d'operador de canal."
  help: "Treure el mode d'operador de canal."
  done: "A %nickname% se li ha tret l'op."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "Amb SECURE activat, %nickname% ha de tenir almenys el nivell %level% per rebre %mode%."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#channel> {FOUNDER <sobrenom> [token]|SUCCESSOR [nickname]|DESC <description>|URL [url]|EMAIL [correu]|ENTRYMSG [missatge]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%SET #canal DESC Un canal comunitari"
  examples:
    - "%command_prefix%SET #canal URL https://example.test"
    - "%command_prefix%SET #canal MLOCK ON"
  short: "Canviar les opcions del canal."
  help: |-
    Canvia una opció del canal. L'ajuda de cada opció n'explica els requisits i
    les variants.
  unknown_option: "Opció desconeguda %option%. Utilitzeu una de: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Utilitza SET <#canal> FOUNDER <sobrenom> <token> amb el testimoni confirmat del fundador actual."
    token_unavailable: "El fundador actual no té cap testimoni de rescat confirmat. Primer s’ha d’autenticar i utilitzar VERIFY."
    syntax: "SET <#canal> FOUNDER <sobrenom> [token]"
    example: "%command_prefix%SET #canal FOUNDER Alícia"
    examples:
      - "%command_prefix%SET #canal FOUNDER Alícia token-confirmat"
    short: "Transferir el canal a un altre sobrenom registrat."
    help: |-
      Canvia el fundador després de validar el token del fundador actual. Es manté
      l'excepció administrativa de nivell fundador. El token no es consumeix.
    invalid_token: "El testimoni de rescat no és vàlid."
    updated: "El fundador s'ha canviat a %nickname%."
    throttled: "Massa testimonis incorrectes. Torna-ho a provar d’aquí a %minutes% minut(s)."
    must_be_registered: "%nickname% ha d'estar registrat i activat."
    suspended: "%nickname% està suspès i no es pot establir com a fundador."
    cannot_be_self: "El nou fundador no pot ser el fundador actual."
    cannot_be_successor: "El nou fundador no pot ser el successor del canal."
    limit_exceeded: "%nickname% ha assolit el màxim de %max% canals registrats."
    notice_channel: "%from% assigna %nickname% com a fundador del canal."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%SET #canal SUCCESSOR Alícia"
    examples:
      - "%command_prefix%SET #canal SUCCESSOR"
    short: "Establir el successor del canal."
    help: |-
      Assigna un sobrenom com a successor d'un canal. Si no s'indica cap sobrenom,
      s'esborra l'actual. El sobrenom ha d'estar registrat i activat.
    cleared: "S'ha esborrat el successor."
    updated: "S'ha establert el successor com a %nickname%."
    must_be_registered: "%nickname% ha d'estar registrat i activat."
    suspended: "%nickname% està suspès i no es pot establir com a successor."
    cannot_be_founder: "El fundador no es pot establir com a successor."
    notice_channel: "%from% assigna %nickname% com a successor del canal."
    notice_channel_cleared: "%from% ha esborrat el successor del canal."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <description>"
    example: "%command_prefix%SET #canal DESC Un canal comunitari"
    short: "Canviar la descripció del canal."
    help: "Canviar la descripció del canal (obligatòria)."
    updated: "Descripció actualitzada."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%SET #canal URL https://example.test"
    examples:
      - "%command_prefix%SET #canal URL"
    short: "Establir l'URL del canal."
    help: "Canvia l'adreça URL (web) d'un canal. Omet URL per esborrar-la."
    updated: "URL actualitzat."
    cleared: "URL esborrat."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canal> EMAIL [correu]"
    example: "%command_prefix%SET #canal EMAIL equip@example.test"
    examples:
      - "%command_prefix%SET #canal EMAIL"
    short: "Establir el correu electrònic del canal."
    help: |-
      Canvia el correu electrònic d'un canal. Omet el correu per esborrar-
      lo. No s’admeten dominis de correu bloquejats administrativament.
      Excepció administrativa: operadors amb accés de nivell fundador.
    invalid: "Adreça de correu no vàlida."
    updated: "Correu electrònic actualitzat."
    cleared: "Correu electrònic esborrat."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canal> ENTRYMSG [missatge]"
    example: "%command_prefix%SET #canal ENTRYMSG Benvingut"
    examples:
      - "%command_prefix%SET #canal ENTRYMSG"
    short: "Establir el missatge d'entrada del canal."
    help: "Estableix el missatge d'entrada (NOTICE). Omet el missatge per esborrar-lo."
    updated: "Missatge d'entrada actualitzat."
    too_long: "El missatge d'entrada no pot superar els %max% caràcters."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #canal TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #canal TOPICLOCK OFF"
    short: "Bloquejar el tema del canal."
    help: |-
      Impedeix canviar el tema del canal. En activar-ho,
      es fixa el tema actual.
    on: "El bloqueig de tema ara és ON."
    off: "El bloqueig de tema ara és OFF."
    notice_on: "%nickname% activa TOPICLOCK."
    notice_off: "%nickname% desactiva TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #canal MLOCK ON"
    examples:
      - "%command_prefix%SET #canal MLOCK OFF"
    short: "Bloquejar els modes del canal."
    help: |-
      Bloqueja els modes actuals (p. ex. +nt). Si és ON,
      no es poden canviar.
    no_modes: "sense modes"
    on: "MLOCK ara és ON (%modes%)."
    off: "MLOCK ara és OFF."
    notice_on: "%nickname% activa MLOCK (%modes%)."
    notice_off: "%nickname% desactiva MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canal> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #canal PRIVATE ON"
    examples:
      - "%command_prefix%SET #canal PRIVATE OFF"
    short: "Fer privada la informació del canal."
    help: |-
      Quan és ON, només el fundador i els usuaris amb accés poden veure la
      informació del canal.
    on: "La informació del canal ara és privada."
    off: "La informació del canal ara és pública."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%SET #canal SECURE ON"
    examples:
      - "%command_prefix%SET #canal SECURE OFF"
    short: "Exigir la llista d'accés per als rangs del canal."
    help: "Impedeix assignar rangs al canal a sobrenoms que no siguin a la llista d'accés."
    on: "SECURE ara és ON."
    off: "SECURE ara és OFF."
    notice_on: "%nickname% activa el mode SECURE."
    notice_off: "%nickname% desactiva el mode SECURE."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#channel> {ADD <nickname> <level>|DEL <nickname>|LIST}"
  example: "%command_prefix%ACCESS #canal LIST"
  examples:
    - "%command_prefix%ACCESS #canal ADD Alícia 100"

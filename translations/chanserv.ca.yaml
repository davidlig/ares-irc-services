  help: "Gestiona la llista d'accés del canal."
  unknown_sub: "Subordre desconeguda %sub%. Utilitzeu LIST, ADD, o DEL."
  level_range: "El nivell d'accés ha d'estar entre %min% i %max%."
  cannot_manage_level: "Només podeu gestionar sobrenoms amb nivell estrictament inferior al vostre."
  founder_not_in_list: "El fundador no és a la llista d'accés."

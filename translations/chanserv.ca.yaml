# --- HISTORY ---
history:
  syntax: "HISTORY <#channel> {ADD <message>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  example: "%command_prefix%HISTORY #canal ADD Revisió de moderació"
  examples:
    - "%command_prefix%HISTORY #canal DEL 42"
    - "%command_prefix%HISTORY #canal VIEW"
    - "%command_prefix%HISTORY #canal VIEW 2"
    - "%command_prefix%HISTORY #canal VIEW ALL"
    - "%command_prefix%HISTORY #canal CLEAR"
  short: "Veure o gestionar l'historial d'accions del canal."

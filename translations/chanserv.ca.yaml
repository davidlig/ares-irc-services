  pending.short: "Llista les sol·licituds pendents en una pàgina limitada."
  pending.help: "Mostra les sol·licituds pendents en una pàgina limitada."
  accept.syntax: "CREG ACCEPT <#channel>"
  accept.example: "%command_prefix%CREG ACCEPT #channel"
  accept.short: "Aprova una sol·licitud de registre de canal."
  accept.help: "Torna a validar el sol·licitant i activa el registre pendent."
  reject.syntax: "CREG REJECT <#channel> <raó>"
  reject.example: "%command_prefix%CREG REJECT #channel Necessita un tema públic"
  reject.short: "Rebutja una sol·licitud de registre de canal."
  reject.help: "Rebutja una sol·licitud amb un raó obligatori i una restricció."
  example: "%command_prefix%CREG PENDING"
  short: "Revisar les sol·licituds de registre de canals."
  help: |-
    Llista les sol·licituds pendents, o n’accepta o rebutja una.
    Els rebutjos requereixen un motiu. Només ACCEPT registra el canal.
  pending_header: "Registres pendents (pàgina %page%)"

nojoin:
  reason: "restricció de nivell NOJOIN"

# --- DEBUG CHANNEL ---------------------------------------------------------
debug_channel:
  kick_reason: "No esteu autoritzat a unir-vos a aquest canal."

# --- IRCOPONLY -------------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#channel> {ON|OFF}"
  example: "%command_prefix%\x02\x0303IRCOPONLY #canal ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOPONLY #canal OFF\x03\x0F"
  short: "Restringir un canal als operadors IRC."
  help: |-
    Només els operadors IRC autoritzats poden romandre al canal. %bot% s'encarrega
    d'aplicar aquesta restricció.
  on: "IRCOPONLY activat a %channel%."
  off: "IRCOPONLY desactivat a %channel%."

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#channel> {ON|OFF}"
  example: "%command_prefix%\x02\x0303NOEXPIRE #Important ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE #Important OFF\x03\x0F"
  short: "Establir o treure la protecció contra l'expiració d'un canal."
  help: |-
    Controla si el canal caduca per inactivitat.
    ON n'evita la caducitat i OFF aplica les regles normals.
  success_on: "\x0303✔\x03 El canal \x02%channel%\x02 ara està protegit contra l'expiració."
  success_off: "\x0303✔\x03 El canal \x02%channel%\x02 ara expirarà normalment."
  forbidden: "\x0304✗\x03 El canal \x02%channel%\x02 està prohibit."
  suspended: "\x0304✗\x03 El canal \x02%channel%\x02 està suspès."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <#channel> <motiu>"
  example: "%command_prefix%\x02\x0303FORBID #canal Incompliment de les normes\x03\x0F"
  short: "Prohibir l'ús d'un canal."
  help: |-
    Prohibeix un canal, n'expulsa tots els usuaris i els
    impedeix tornar-hi. Si està registrat, se n'elimina el
    registre abans d'aplicar la prohibició.
  reason_required: "\x0304✗\x03 Heu d'especificar un motiu."
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha estat prohibit."
  updated: "\x0303✔\x03 El motiu de prohibició del canal \x02%channel%\x02 ha estat actualitzat."
  channel_forbidden: "\x0304✗\x03 El canal \x02%channel%\x02 està prohibit i no es pot utilitzar."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#channel>"
  example: "%command_prefix%\x02\x0303UNFORBID #canal\x03\x0F"
  short: "Treure una prohibició de canal."
  help: "Retira la prohibició d'un canal perquè es pugui tornar a registrar."
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ja no està prohibit."
  not_forbidden: "\x0304✗\x03 El canal \x02%channel%\x02 no està prohibit."

# --- DEBUG -----------------------------------------------------------------

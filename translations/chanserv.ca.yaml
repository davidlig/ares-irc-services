# Traduccions de ChanServ — Català
# Domini: chanserv
#
# Codis de format IRC (cometes dobles o blocs literals !irc):
#   \x02        activa/desactiva la negreta
#   \x03NN      color (DECIMAL: 03=verd, 04=vermell, 07=taronja, 14=gris fosc)
#   \x03        restableix el color
#   \x0F        restableix tot el format
#
# Els colors IRC usen números DECIMALS (0-15), no hexadecimals.
#   \x0314 = gris fosc (14 decimal): CORRECTE
#   \x030F = color 0 seguit de la lletra F: ERROR
#
# Text IRC multilínia: !irc |- amb salts físics i espais reals.
# Els blocs sense etiqueta no descodifiquen escapes; conserva els literals CTCP.
# Exemples HELP: example/examples i %command_prefix%.
# El presentador afegeix /msg sense color i un marge de dos espais.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "Nom de canal no vàlid. Utilitzeu %example%."
  invalid_channel_example: "#channel"
  generic: "S'ha produït un error. Torneu-ho a provar."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#channel> <description>"
  example: "%command_prefix%REGISTER #canal Projecte comunitari"
  short: "Registrar un canal."
  help: |-
    Registra i associa un canal al teu sobrenom. T’has d’haver
    identificat amb %nickserv%. En mode APPROVAL, un IRCop ha d’aprovar
    la sol·licitud.
  success: "El canal %channel% ha estat registrat."
  already_registered: "El canal %channel% ja està registrat o en procés de registre."
  channel_not_on_network: "El canal %channel% no existeix a la xarxa."
  pending_deletion: "El canal %channel% està pendent d'eliminació i no pot ser registrat."
  insufficient_channel_rank: "Heu de tenir com a mínim estat d'operador a %channel% per registrar-lo."
  limit_exceeded: "Heu assolit el màxim de %max% canals registrats."
  throttled: "Heu d'esperar %minutes% minut(s) abans de registrar un altre canal."

  awaiting_approval: "Les sol·licituds per a %channel% esperen l’aprovació d’un IRCop."
  restricted_indefinite: "Les noves sol·licituds per a %channel% estan bloquejades indefinidament."
  restricted_until: "Les noves sol·licituds per a %channel% estan bloquejades fins a %date%"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%REGMODE APPROVAL"
  short: "Establir o consultar el mode de registre del canal."
  help: |-
    Estableix el registre com a DIRECT o APPROVAL, o consulta STATUS.
    DIRECT és el mode per defecte i manté el registre immediat.
  status: "El mode de registre del canal és %mode%."
  changed: "El mode de registre del canal ara és %mode%."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [page]|ACCEPT <#channel>|REJECT <#channel> <raó>}"

# ChanServ translations — English
# Domain: chanserv
#
# IRC formatting codes (double-quoted strings or !irc literal blocks):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=green, 04=red, 07=orange, 14=dark gray)
#   \x03        reset color
#   \x0F        reset all formatting
#
# IRC colors use DECIMAL numbers (0-15), not hexadecimal.
#   \x0314 = dark gray (14 decimal): CORRECT
#   \x030F = color 0 followed by the letter F: ERROR
#
# Multiline IRC text: !irc |- with physical newlines and real spaces.
# Untagged blocks do not decode escapes; preserve CTCP literals.
# HELP examples: example/examples and %command_prefix%.
# The presenter adds the uncolored /msg prefix and a two-space margin.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Invalid channel name. Use \x02#channel\x02."
  generic: "\x0304✗\x03 An error occurred. Please try again."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#channel> <description>"
  example: "%command_prefix%\x02\x0303REGISTER #channel Community project\x03\x0F"
  short: "Register a channel."
  help: |-
    Register and associate a channel to your nickname. You must be identified with
    %nickserv%. In APPROVAL mode, an IRCop must approve the request.
  success: "\x0303✔\x03 Channel \x02%channel%\x02 has been registered."
  awaiting_approval: "\x0307✔\x03 Registration request for \x02%channel%\x02 is awaiting IRCop approval."
  restricted_indefinite: "\x0304✗\x03 New registration requests for \x02%channel%\x02 are blocked indefinitely."
  restricted_until: "\x0304✗\x03 New registration requests for \x02%channel%\x02 are blocked until %date%"
  already_registered: "\x0304✗\x03 Channel \x02%channel%\x02 is already registered or has a registration request in progress."
  channel_not_on_network: "\x0304✗\x03 Channel \x02%channel%\x02 does not exist on the network."
  pending_deletion: "\x0304✗\x03 Channel \x02%channel%\x02 is pending deletion and cannot be registered."
  insufficient_channel_rank: "\x0304✗\x03 You must have at least operator status on \x02%channel%\x02 to register it."
  limit_exceeded: "\x0304✗\x03 You have reached the maximum of %max% registered channels."
  throttled: "\x0304✗\x03 You must wait \x02%minutes%\x02 minute(s) before registering another channel."

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%\x02\x0303REGMODE APPROVAL\x03\x0F"
  short: "Set or inspect channel registration mode."
  help: |-
    Set channel registration to DIRECT or APPROVAL, or use STATUS to inspect it.
    DIRECT is the default and preserves immediate registration.
  status: "\x0307ℹ\x03 Channel registration mode is \x02%mode%\x02."
  changed: "\x0303✔\x03 Channel registration mode is now \x02%mode%\x02."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [page]|ACCEPT <#channel>|REJECT <#channel> <reason>}"
  pending.syntax: "CREG PENDING [page]"
  pending.example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  pending.short: "List pending registration requests."
  pending.help: "Lists pending requests on a bounded page."
  accept.syntax: "CREG ACCEPT <#channel>"
  accept.example: "%command_prefix%\x02\x0303CREG ACCEPT #channel\x03\x0F"
  accept.short: "Approve a channel registration request."
  accept.help: "Revalidates the requester and activates a pending channel registration."
  reject.syntax: "CREG REJECT <#channel> <reason>"
  reject.example: "%command_prefix%\x02\x0303CREG REJECT #channel Needs a public topic\x03\x0F"
  reject.short: "Reject a channel registration request."
  reject.help: "Rejects a pending request with a mandatory reason and cooldown."
  example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  short: "Review channel registration requests."
  help: |-
    List pending channel registration requests, or accept or reject a request.
    Rejections require a reason. Only ACCEPT registers the channel.
  pending_header: "\x0314Pending registrations (page %page%)\x03"
  pending_item: "  %channel% — requester %requester%, submitted %submitted%: %description%"
  accepted: "\x0303✔\x03 Registration for \x02%channel%\x02 was approved."
  rejected: "\x0303✔\x03 Registration for \x02%channel%\x02 was rejected."
  not_pending: "\x0304✗\x03 Channel \x02%channel%\x02 has no pending registration."
  channel_not_on_network: "\x0304✗\x03 Channel \x02%channel%\x02 is not on the network."
  founder_limit: "\x0304✗\x03 The requester has reached the channel registration limit."
  requester_inactive: "\x0304✗\x03 The requesting account is no longer active."
  requester_ineligible: "\x0304✗\x03 The requester must currently have channel operator status."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <#channel>"
  example: "%command_prefix%\x02\x0303STATUS #channel\x03\x0F"
  header: "\x02Status of channel \x0307%channel%\x03\x02"
  short: "Show channel registration status."
  help: |-
    Show whether a channel is unregistered, pending approval, rejected or registered.
    Rejection details are visible only to the requester and authorized IRCops.
  unregistered: "  \x0314Status                  \x03: Not registered"
  pending: "  \x0314Status                  \x03: \x0307Approval pending\x03"
  registered: "  \x0314Status                  \x03: \x0303Registered\x03"
  suspended: "  \x0314Status                  \x03: \x0304Suspended\x03"
  forbidden: "  \x0314Status                  \x03: \x0304Forbidden\x03"
  pending_deletion: "  \x0314Status                  \x03: \x0307Pending deletion\x03"
  rejected_private: "  \x0314Status                  \x03: \x0304Registration rejected\x03"
  rejected: "  \x0314Status                  \x03: \x0304Registration rejected\x03"
  rejection_reason: "  \x0314Reason                  \x03: %reason%"
  rejection_audit: "  \x0314Rejected by             \x03: %operator% on %date%"
  restriction_until: "  \x0314Available from          \x03: %date%"
  footer: "\x0314─────────────────────────────\x03\x0F"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#channel>"
  example: "%command_prefix%\x02\x0303INFO #channel\x03\x0F"
  short: "Show channel information."
  help: |-
    Shows detailed information about a registered channel, including its owner,
    registration details, last activity and configuration options.
  header: "\x02Information for channel \x0307%channel%\x03\x02"
  founder: "  \x0314Founder\x03        : \x02%nickname%\x02"
  registered: "  \x0314Registered\x03     : %date%"
  successor: "  \x0314Successor\x03      : \x02%nickname%\x02"
  description: "  \x0314Description\x03    : %desc%"
  url: "  \x0314URL\x03            : %url%"
  email: "  \x0314Email\x03          : %email%"
  last_used: "  \x0314Last used\x03      : %date%"
  topic: "  \x0314Last topic\x03     : %topic%"
  topic_set_by: "  \x0314Topic set by\x03   : %nickname%"
  options: "  \x0314Options\x03        : %options%"
  private: "\x0304✗\x03 Channel information for \x02%channel%\x02 is private."
  no_expire: "  \x0314Never Expires\x03  : Yes"
  mlock_modes: "  \x0314Mode lock\x03      : %modes%"
  suspended_status: "  \x0314Status\x03         : \x0304Suspended\x03"
  suspended_reason: "  \x0314Reason\x03         : %reason%"
  suspended_until: "  \x0314Ends on\x03        : %date%"
  suspended_permanent: "  \x0314Ends on\x03        : Permanent"
  forbidden_status: "  \x0314Status\x03         : \x0304Forbidden\x03"
  forbidden_reason: "  \x0314Reason\x03         : %reason%"
  pending_deletion_status: "  \x0314Status\x03             : \x0307Pending deletion\x03"
  pending_deletion_at: "  \x0314Dropped\x03            : %date%"
  pending_deletion_until: "  \x0314Hard delete on\x03     : %date%"
  pending_deletion_notice: "  \x0307This channel is frozen and cannot be registered.\x03"

# --- HELP ------------------------------------------------------------------
help:
  examples_header: "\x02 ■ Ejemplos:\x02"
  syntax: "HELP [command] [option]"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
  short: "List commands or show help for a command."
  help: "Shows available commands and detailed help for their options."
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Lets you register and manage channels, configure their options and control
    who can access them. Manages access levels and user privileges to keep each
    channel under the control of its owners.
  general_header: "\x02 ■ Available commands:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Options:\x02"
  general_footer: "\x0310ℹ\x03\x0F Use /msg %bot% \x02\x0303HELP <command>\x03\x0F for more information."
  set_sub_footer: "\x0310ℹ\x03\x0F Use /msg %bot% \x02\x0303HELP %command% <option>\x03\x0F for more information."
  syntax_label: "Syntax: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0304⚠\x03\x0F NOTE: Channels unused for more than \x1F\x0304%days% days\x03\x1F are automatically removed."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_info: "Registration and information"
    access_levels: "Access and levels"
    ranks_entry: "Ranks and entry"
  ircop_group:
    channel_operations: "Channel operations"
    channel_management: "Channel management"
    deletion: "Deletion and restoration"
    restrictions: "Restrictions"
    lookup: "Lookup and investigation"
    registration_approval: "Registration approval"
  ircop_header: "\x02 ■ Available commands for IRC Operators:\x02"

# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303OP #channel Alice\x03\x0F"
  short: "Give channel operator mode."
  help: "Give channel operator mode."
  done: "\x0303✔\x03 \x02%nickname%\x02 has been given channel operator status."
  user_not_on_channel: "\x0304✗\x03 Nickname \x02%nickname%\x02 is not on the network."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 gives \x0304%mode%\x03 to \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEOP #channel Alice\x03\x0F"
  short: "Remove channel operator mode."
  help: "Remove channel operator mode."
  done: "\x0303✔\x03 \x02%nickname%\x02 has been deopped."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 With SECURE on, \x02%nickname%\x02 must have at least level \x02%level%\x02 to receive \x02%mode%\x02."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#channel> {FOUNDER <nickname> [token]|SUCCESSOR [nickname]|DESC <description>|URL [url]|EMAIL [email]|ENTRYMSG [message]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%\x02\x0303SET #channel DESC A community channel\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #channel URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #channel MLOCK ON\x03\x0F"
  short: "Change channel options."
  help: |-
    Changes a channel option. Each option has help explaining its requirements
    and variations.
  unknown_option: "\x0304✗\x03 Unknown option \x02%option%\x02. Use one of: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Use SET <#channel> FOUNDER <nickname> <token> with the current founder’s confirmed rescue token."
    token_unavailable: "The current founder has no confirmed rescue token. They must authenticate and use VERIFY first."
    syntax: "SET <#channel> FOUNDER <nickname> [token]"
    example: "%command_prefix%\x02\x0303SET #channel FOUNDER Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel FOUNDER Alice confirmed-token\x03\x0F"
    short: "Transfer channel to another registered nickname."
    help: |-
      Changes the founder after validating the current founder's token. The
      administrative founder-level exception remains available. The token is not
      consumed.
    invalid_token: "The rescue token is invalid."
    updated: "\x0303✔\x03 Founder has been changed to \x02%nickname%\x02."
    throttled: "Too many invalid tokens. Try again in %minutes% minute(s)."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 must be registered and activated."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 is suspended and cannot be set as founder."
    cannot_be_self: "\x0304✗\x03 The new founder cannot be the current founder."
    cannot_be_successor: "\x0304✗\x03 The new founder cannot be the channel successor."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 has reached the maximum of %max% registered channels."
    notice_channel: "\x02%from%\x02 assigns \x02%nickname%\x02 as channel founder."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%\x02\x0303SET #channel SUCCESSOR Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel SUCCESSOR\x03\x0F"
    short: "Set the channel successor."
    help: |-
      Assigns a nickname as the channel successor. Omitting the nickname clears the
      current successor. The nickname must be registered and activated.
    cleared: "\x0303✔\x03 Successor has been cleared."
    updated: "\x0303✔\x03 Successor has been set to \x02%nickname%\x02."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 must be registered and activated."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 is suspended and cannot be set as successor."
    cannot_be_founder: "\x0304✗\x03 The founder cannot be set as successor."
    notice_channel: "\x02%from%\x02 assigns \x02%nickname%\x02 as channel successor."
    notice_channel_cleared: "\x02%from%\x02 has cleared the channel successor."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <description>"
    example: "%command_prefix%\x02\x0303SET #channel DESC A community channel\x03\x0F"
    short: "Change channel description."
    help: "Change the channel description (required)."
    updated: "\x0303✔\x03 Description updated."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%\x02\x0303SET #channel URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel URL\x03\x0F"
    short: "Set channel URL."
    help: "Changes the channel website URL. Omit the URL to clear it."
    updated: "\x0303✔\x03 URL updated."
    cleared: "\x0303✔\x03 URL cleared."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#channel> EMAIL [email]"
    example: "%command_prefix%\x02\x0303SET #channel EMAIL team@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel EMAIL\x03\x0F"
    short: "Set channel email."
    help: |-
      Changes the channel email address. Omit the email to clear it.
      Administratively blocked email domains cannot be used. Administrative
      exception: operators with founder-level access.
    invalid: "\x0304✗\x03 Invalid email address."
    updated: "\x0303✔\x03 Email updated."
    cleared: "\x0303✔\x03 Email cleared."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#channel> ENTRYMSG [message]"
    example: "%command_prefix%\x02\x0303SET #channel ENTRYMSG Welcome\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel ENTRYMSG\x03\x0F"
    short: "Set channel entry message."
    help: "Sets the entry message (NOTICE). Omit the message to clear it."
    updated: "\x0303✔\x03 Entry message updated."
    too_long: "\x0304✗\x03 Entry message cannot exceed %max% characters."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #channel TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel TOPICLOCK OFF\x03\x0F"
    short: "Lock channel topic."
    help: "Prevents changes to the channel topic. Enabling it locks the current topic."
    on: "\x0303✔\x03 Topic lock is now ON."
    off: "\x0303✔\x03 Topic lock is now OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 enables TOPICLOCK."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 disables TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #channel MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel MLOCK OFF\x03\x0F"
    short: "Lock channel modes."
    help: "Locks the current channel modes (e.g. +nt). When ON, modes cannot be changed."
    no_modes: "no modes"
    on: "\x0303✔\x03 MLOCK is now ON (%modes%)."
    off: "\x0303✔\x03 MLOCK is now OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 enables MLOCK (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 disables MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#channel> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #channel PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel PRIVATE OFF\x03\x0F"
    short: "Hide channel information from users without access."
    help: "When ON, only the founder and users with access can view channel information."
    on: "\x0303✔\x03 Channel information is now private."
    off: "\x0303✔\x03 Channel information is now public."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #channel SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #channel SECURE OFF\x03\x0F"
    short: "Require access list for channel ranks."
    help: "Prevents granting channel ranks to nicknames that are not on the access list."
    on: "\x0303✔\x03 SECURE is now ON."
    off: "\x0303✔\x03 SECURE is now OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 enables SECURE mode."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 disables SECURE mode."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#channel> {ADD <nickname> <level>|DEL <nickname>|LIST}"
  example: "%command_prefix%\x02\x0303ACCESS #channel LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #channel ADD Alice 100\x03\x0F"
    - "%command_prefix%\x02\x0303ACCESS #channel DEL Alice\x03\x0F"
  short: "Manage access list."
  help: "Manages the channel access list."
  unknown_sub: "\x0304✗\x03 Unknown subcommand \x02%sub%\x02. Use LIST, ADD, or DEL."
  level_range: "\x0304✗\x03 Access level must be between %min% and %max%."
  cannot_manage_level: "\x0304✗\x03 You can only manage nicks with level strictly below your own."
  founder_not_in_list: "\x0304✗\x03 The founder is not in the access list."
  max_entries: "\x0304✗\x03 Maximum %max% access entries per channel."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#channel> LIST"
    example: "%command_prefix%\x02\x0303ACCESS #channel LIST\x03\x0F"
    short: "List access list (requires ACCESSLIST level)."
    help: "Shows nickname and level for each entry."
    header: "\x0303Access list for \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Channel \x02%channel%\x02 has no access entries."
    entry: "  #%index%: %nickname% (level %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#channel> ADD <nickname> <level>"
    example: "%command_prefix%\x02\x0303ACCESS #channel ADD Alice 100\x03\x0F"
    short: "Add or update access level (requires ACCESSCHANGE level)."
    help: "Level 1-499. You can only set levels below your own."
    done: "\x0303✔\x03 \x02%nickname%\x02 set to level %level%."
    notice_channel: "\x0303✔\x03 \x0302%from%\x03 sets \x0314%to%\x03 to level \x0304%level%\x03"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#channel> DEL <nickname>"
    example: "%command_prefix%\x02\x0303ACCESS #channel DEL Alice\x03\x0F"
    short: "Remove from access list (requires ACCESSCHANGE level)."
    help: "You can only remove nicks with level below your own."
    not_in_list: "\x0304✗\x03 \x02%nickname%\x02 is not in the access list."
    done: "\x0303✔\x03 \x02%nickname%\x02 removed from access list."
    notice_channel: "\x0304✗\x03 \x0302%from%\x03 removes \x0314%to%\x03 from access list"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#channel>"
  example: "%command_prefix%\x02\x0303DELACCESS #channel\x03\x0F"
  short: "Remove your own access from a channel."
  help: |-
    Removes your entry from the channel access list. You must be identified.
    The founder cannot use this command.
  done: "\x0303✔\x03 Your access has been removed from \x02%channel%\x02."
  not_in_list: "\x0304✗\x03 You don't have access in \x02%channel%\x02."
  founder_not_in_access: "\x0304✗\x03 You are the founder of \x02%channel%\x02 and are not on the access list."
  notice_channel: "\x0304✗\x03 \x0302%nickname%\x03 removes their access from the channel"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#channel> {LIST|SET <level> <value>|RESET}"
  example: "%command_prefix%\x02\x0303LEVELS #channel LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #channel SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #channel RESET\x03\x0F"
  short: "Configure channel levels."
  help: |-
    Configures the minimum access levels for channel actions. Only the founder
    can change or reset levels.
  unknown_sub: "\x0304✗\x03 Unknown subcommand \x02%sub%\x02. Use LIST, SET, or RESET."
  unknown_key: "\x0304✗\x03 Unknown level key \x02%key%\x02 or not supported by this IRCd."
  value_range: "\x0304✗\x03 Level value must be between %min% and %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#channel> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #channel LIST\x03\x0F"
    short: "List level requirements."
    help: "Shows each level key and its value (defaults if not set)."
    header: "\x0303Levels for %channel%\x03"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#channel> SET <level> <value>"
    example: "%command_prefix%\x02\x0303LEVELS #channel SET OPDEOP 50\x03\x0F"
    short: "Set a level requirement."
    help: "Value -1 to 499. Founder only."
    done: "\x0303✔\x03 \x02%key%\x02 set to %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#channel> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #channel RESET\x03\x0F"
    short: "Reset all levels to defaults."
    help: "Removes all overrides. Founder only."
    done: "\x0303✔\x03 All levels reset to defaults."

# --- VOICE -----------------------------------------------------------------
voice:
  syntax: "VOICE <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303VOICE #channel Alice\x03\x0F"
  short: "Give voice mode in the channel."
  help: "Give voice mode in the channel."
  done: "\x0303✔\x03 \x02%nickname%\x02 has been given voice."
  user_not_on_channel: "\x0304✗\x03 Nickname \x02%nickname%\x02 is not on the network."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 gives \x0304%mode%\x03 to \x0314%to%\x03"

# --- DEVOICE ---------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEVOICE #channel Alice\x03\x0F"
  short: "Remove voice mode in the channel."
  help: "Remove voice mode in the channel."
  done: "\x0303✔\x03 \x02%nickname%\x02 has been devoiced."

# --- UNBAN -----------------------------------------------------------------
unban:
  syntax: "UNBAN <#channel>"
  example: "%command_prefix%\x02\x0303UNBAN #channel\x03\x0F"
  short: "Remove bans affecting you."
  help: |-
    Remove all ordinary channel bans matching your current identity, including wildcards and IP/CIDR masks, according to the IRCd.
    Identification and the configurable UNBAN level (default 200) are required. The founder retains access; channel membership and operator status are not required.
    Extended bans are unchanged. No nickname or mask argument is accepted. The action is not recorded in channel HISTORY.
  done: "Removed %count% ban(s) affecting you in %channel%."
  no_matches: "No ordinary bans match your identity in %channel%; nothing was changed."
  unavailable: "Your matching bans could not be determined; nothing was changed."
  not_on_network: "Channel %channel% is not on the network."

# --- INVITE ----------------------------------------------------------------
invite:
  syntax: "INVITE <#channel>"
  example: "%command_prefix%\x02\x0303INVITE #channel\x03\x0F"
  short: "Invite yourself to the channel."
  help: "Invite yourself to the channel."
  done: "\x0303✔\x03 You have been invited to \x02%channel%\x02."
  notice_channel: "\x0303✔\x03 \x0302%nickname%\x03 invites themselves to the channel."

# --- ADMIN -----------------------------------------------------------------
admin:
  syntax: "ADMIN <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303ADMIN #channel Alice\x03\x0F"
  short: "Give channel admin mode."
  help: "Give channel admin mode. Only if IRCd supports +a."
  done: "\x0303✔\x03 \x02%nickname%\x02 has been given channel admin."
  user_not_on_channel: "\x0304✗\x03 Nickname \x02%nickname%\x02 is not on the network."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 gives \x0304%mode%\x03 to \x0314%to%\x03"
  not_supported: "\x0304✗\x03 This network does not support channel admin (+a) mode."

# --- DEADMIN ---------------------------------------------------------------
deadmin:
  syntax: "DEADMIN <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEADMIN #channel Alice\x03\x0F"
  short: "Remove channel admin mode."
  help: "Remove channel admin mode."
  done: "\x0303✔\x03 \x02%nickname%\x02 has been deadminned."

# --- HALFOP ----------------------------------------------------------------
halfop:
  syntax: "HALFOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303HALFOP #channel Alice\x03\x0F"
  short: "Give semi-operator mode in the channel."
  help: "Give semi-operator mode in the channel. Only if IRCd supports +h."
  done: "\x0303✔\x03 \x02%nickname%\x02 has been given halfop."
  user_not_on_channel: "\x0304✗\x03 Nickname \x02%nickname%\x02 is not on the network."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 gives \x0304%mode%\x03 to \x0314%to%\x03"
  not_supported: "\x0304✗\x03 This network does not support halfop (+h) mode."

# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEHALFOP #channel Alice\x03\x0F"
  short: "Remove semi-operator mode in the channel."
  help: "Remove semi-operator mode in the channel."
  done: "\x0303✔\x03 \x02%nickname%\x02 has been dehalfopped."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> {ADD <mask> [expiry] [reason]|DEL {<mask>|<number>}|LIST}"
  example: "%command_prefix%\x02\x0303AKICK #channel ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #channel ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #channel DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #channel DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #channel LIST\x03\x0F"
  short: "Manage auto-kick list."
  help: "Manages autokick entries and their optional expiry."
  unknown_sub: "\x0304✗\x03 Unknown subcommand \x02%sub%\x02. Use ADD, DEL, or LIST."
  invalid_mask: "\x0304✗\x03 Invalid mask format. Use \x02nick!ident@host\x02 with wildcards (*)."
  dangerous_mask: "\x0304✗\x03 The mask \x02%mask%\x02 is too broad. It must contain at least 4 alphanumeric characters."
  protected_user: "\x0304✗\x03 Nickname \x02%nickname%\x02 has access in this channel."
  max_entries: "\x0304✗\x03 Maximum %max% AKICK entries per channel."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <mask> [expiry] [reason]"
    example: "%command_prefix%\x02\x0303AKICK #channel ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #channel ADD *!*@* 7d Spam\x03\x0F"
    short: "Add AKICK entry."
    help: |-
      Adds a mask to the channel autokick list.

      You can specify a duration and a reason. If you include a reason, you must
      also specify the duration: 0 for permanent, d for days, h for hours or m
      for minutes.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 added."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 already exists."
    notice_channel: "\x02%from%\x02 adds AKICK: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL {<mask>|<number>}"
    example: "%command_prefix%\x02\x0303AKICK #channel DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #channel DEL 2\x03\x0F"
    short: "Remove AKICK entry."
    help: "Remove by exact mask or entry number from LIST."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 not found."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 removed."
    notice_channel: "\x02%from%\x02 removes AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#channel> LIST"
    example: "%command_prefix%\x02\x0303AKICK #channel LIST\x03\x0F"
    short: "List AKICK entries."
    help: "Shows mask, reason, expiry, and who added."
    header: "\x0303AKICK list for \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Channel \x02%channel%\x02 has no AKICK entries."
    entry: "  #%index% %mask% %reason% (by %nickname%, expires: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#channel>"
  example: "%command_prefix%\x02\x0303RESTORE #channel\x03\x0F"
  short: "Restore a channel pending deletion."
  help: "Restores a manually deleted channel that is still within its grace period."
  success: "\x0303✔\x03 Channel \x02%channel%\x02 has been restored."
  not_pending_deletion: "\x0304✗\x03 Channel \x02%channel%\x02 is not pending deletion."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#channel> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #channel\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP #channel FORCE\x03\x0F"
  short: "Drop a registered channel."
  help: |-
    Deletes a registered channel from the database.
    FORCE permanently deletes a channel that is pending deletion.
    An IRCop with DROP permission can also immediately release
    pending and rejected registration requests, with or without FORCE.
  registration_restricted: "\x0304✗\x03 This registration request is restricted until %date%."
  force:
    short: "Permanently deletes a channel that is pending deletion."
  success: "\x0303✔\x03 Channel \x02%channel%\x02 has been marked for deletion and can be restored during the grace period."
  force_success: "\x0303✔\x03 Channel \x02%channel%\x02 has been permanently dropped."
  pending_deletion: "\x0304✗\x03 Channel \x02%channel%\x02 is pending deletion. Use DROP <#channel> force to delete it permanently."
  invalid_channel: "\x0304✗\x03 Invalid channel name. Use \x02#channel\x02."
  pending_deletion_reason: "Channel %channel% is being deleted. More information /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#channel> <duration> <reason>"
  example: "%command_prefix%\x02\x0303SUSPEND #channel 7d Rule violation\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND #channel 0 Rule violation\x03\x0F"
  short: "Suspend a channel."
  help: |-
    Temporarily disables a registered channel. Duration formats: 0 = permanent,
    1d, 12h, 60m.
    While suspended, channel modes, access and enforcement are disabled.
  success: "\x0303✔\x03 Channel \x02%channel%\x02 has been suspended until \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 Channel \x02%channel%\x02 is already suspended."
  invalid_duration: "\x0304✗\x03 Invalid duration. Use: 0 (permanent), 1d, 12h, or 60m."
  channel_suspended: "\x0304✗\x03 Channel \x02%channel%\x02 is suspended and cannot be used."
  notice_channel: "\x0304⚠\x03 Channel has been suspended. Reason: %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#channel>"
  example: "%command_prefix%\x02\x0303UNSUSPEND #channel\x03\x0F"
  short: "Lift a channel suspension."
  help: "Reactivates a suspended channel, restoring its modes and enforcement."
  success: "\x0303✔\x03 Channel \x02%channel%\x02 is no longer suspended."
  not_suspended: "\x0304✗\x03 Channel \x02%channel%\x02 is not suspended."
  reason_expired: "expired suspension"

# --- NOJOIN ----------------------------------------------------------------
nojoin:
  reason: "NOJOIN level restriction"

# --- DEBUG CHANNEL ---------------------------------------------------------
debug_channel:
  kick_reason: "You are not authorized to join this channel."

# --- IRCOPONLY -------------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#channel> {ON|OFF}"
  example: "%command_prefix%\x02\x0303IRCOPONLY #channel ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOPONLY #channel OFF\x03\x0F"
  short: "Restrict a channel to IRC operators."
  help: |-
    Only authorized IRC operators can remain in the channel. %bot% enforces
    this restriction.
  on: "IRCOPONLY is now ON for %channel%."
  off: "IRCOPONLY is now OFF for %channel%."

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#channel> {ON|OFF}"
  example: "%command_prefix%\x02\x0303NOEXPIRE #Important ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE #Important OFF\x03\x0F"
  short: "Set or remove expiration protection for a channel."
  help: |-
    Controls whether the channel expires through inactivity.
    ON prevents expiry and OFF applies the normal rules.
  success_on: "\x0303✔\x03 Channel \x02%channel%\x02 is now protected from expiration."
  success_off: "\x0303✔\x03 Channel \x02%channel%\x02 will now expire normally."
  forbidden: "\x0304✗\x03 Channel \x02%channel%\x02 is forbidden."
  suspended: "\x0304✗\x03 Channel \x02%channel%\x02 is suspended."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <#channel> <reason>"
  example: "%command_prefix%\x02\x0303FORBID #channel Rule violation\x03\x0F"
  short: "Forbid a channel from being used."
  help: |-
    Forbids a channel, removing all users and preventing them from rejoining.
    If the channel is registered, its registration is deleted before the ban
    is applied.
  reason_required: "\x0304✗\x03 You must specify a reason."
  success: "\x0303✔\x03 Channel \x02%channel%\x02 has been forbidden."
  updated: "\x0303✔\x03 Forbidden reason for channel \x02%channel%\x02 has been updated."
  channel_forbidden: "\x0304✗\x03 Channel \x02%channel%\x02 is forbidden and cannot be used."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#channel>"
  example: "%command_prefix%\x02\x0303UNFORBID #channel\x03\x0F"
  short: "Remove a channel forbid."
  help: "Removes a channel ban so that the channel can be registered again."
  success: "\x0303✔\x03 Channel \x02%channel%\x02 is no longer forbidden."
  not_forbidden: "\x0304✗\x03 Channel \x02%channel%\x02 is not forbidden."

# --- DEBUG -----------------------------------------------------------------
debug:
  registration_completed: "%operator% registered channel %target%"
  registration_pending: "%operator% submitted a registration request for %target%"
  founder_action: "Level-founder action"

# --- HISTORY ---
history:
  syntax: "HISTORY <#channel> {ADD <message>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  example: "%command_prefix%\x02\x0303HISTORY #channel ADD Moderation review\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HISTORY #channel DEL 42\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #channel VIEW\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #channel VIEW 2\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #channel VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #channel CLEAR\x03\x0F"
  short: "View or manage channel action history."
  help: "Manages the channel action history."

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#channel> ADD <message>"
    example: "%command_prefix%\x02\x0303HISTORY #channel ADD Moderation review\x03\x0F"
    short: "Add a manual history entry."
    help: |-
      Adds a manual entry to the channel's history.
    success: "\x0303✔\x03 History entry added for \x02%channel%\x02."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#channel> DEL <id>"
    example: "%command_prefix%\x02\x0303HISTORY #channel DEL 42\x03\x0F"
    short: "Deletes a history entry."
    help: "Deletes a history entry by its ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#channel> VIEW [PAGE|ALL]"
    example: "%command_prefix%\x02\x0303HISTORY #channel VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY #channel VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY #channel VIEW ALL\x03\x0F"
    short: "View channel action history."
    help: "Views the channel's history entries."
    header: "\x02History for \x0307%channel%\x03\x02 (showing %start%-%end% of %total%):"
    entry: "#%id% [%date%] \x0303%action%\x03 by %operator% — %message%"
    no_entries: "\x0307ℹ\x03 No history entries found for \x02%channel%\x02."
    page_hint: "Use \x0303HISTORY %channel% VIEW %next_page%\x03 for more entries."

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#channel> CLEAR"
    example: "%command_prefix%\x02\x0303HISTORY #channel CLEAR\x03\x0F"
    short: "Delete all history entries for a channel."
    help: "Deletes all history entries for the channel."
    success: "\x0303✔\x03 Cleared \x02%count%\x02 history entries for \x02%channel%\x02."

# --- HISTORY MESSAGES ---
history.message:
  levels_set: "Access level changed"
  levels_reset: "Access levels reset"
  clearaccess: "Access list cleared"
  clearusers: "Channel users cleared"
  noexpire_on: "Expiration protection enabled"
  noexpire_off: "Expiration protection disabled"
  ircoponly_on: "IRCop-only restriction enabled"
  ircoponly_off: "IRCop-only restriction disabled"
  history_clear: "History cleared"
  set_desc: "Option DESC updated"
  set_url: "Option URL updated"
  set_email: "Option EMAIL updated"
  set_entrymsg: "Option ENTRYMSG updated"
  set_topiclock_on: "Option TOPICLOCK enabled"
  set_topiclock_off: "Option TOPICLOCK disabled"
  set_mlock_on: "Option MLOCK enabled"
  set_mlock_off: "Option MLOCK disabled"
  set_secure_on: "Option SECURE enabled"
  set_secure_off: "Option SECURE disabled"
  set_private_on: "Option PRIVATE enabled"
  set_private_off: "Option PRIVATE disabled"
  founder_changed: "Founder changed from %old_founder% to %new_founder%"
  successor_changed: "Successor changed from %old_successor% to %new_successor%"
  successor_cleared: "Successor cleared"
  registration_approved: "Channel registration approved"
  access_add: "Access added for %target_nickname% (level %level%)"
  access_del: "Access removed for %target_nickname%"
  akick_add: "AKICK added: %mask%"
  akick_del: "AKICK removed: %mask%"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  option: "Option: %value%"
  old_value: "Previous level: %value%"
  new_value: "New level: %value%"
  old_founder: "Old founder: %value%"
  new_founder: "New founder: %value%"
  old_successor: "Old successor: %value%"
  new_successor: "New successor: %value%"
  target_nickname: "Target: %value%"
  level: "Level: %value%"
  mask: "Mask: %value%"

# --- LEVEL FOUNDER ---------------------------------------------------------
level_founder:
  short: "Allows operations that require the channel founder level."

# --- CLEARACCESS -----------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#channel>"
  example: "%command_prefix%\x02\x0303CLEARACCESS #channel\x03\x0F"
  short: "Clear the entire access list of a channel."
  help: "Removes every entry from the channel access list. This action is irreversible."
  success: "\x0303✔\x03 Cleared \x02%count%\x02 access entries from \x02%channel%\x02."
  empty: "\x0307ℹ\x03 Channel \x02%channel%\x02 has no access entries."

# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#channel> [reason]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #channel\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #channel flooding\x03\x0F"
  short: "Kick all users from a channel."
  help: |-
    Removes all users from the channel. Restricted to IRC operators; a default
    reason is used when none is provided.
  not_on_network: "\x0304✗\x03 Channel \x02%channel%\x02 is not currently on the network."
  empty: "\x0307ℹ\x03 Channel \x02%channel%\x02 has no users to kick."
  success: "\x0303✔\x03 Kicked \x02%count%\x02 user(s) from \x02%channel%\x02."
  default_reason: "CLEARUSERS command"

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <pattern> [page]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "List registered channels matching a pattern."
  help: |-
    Lists registered channels matching the given pattern. The * wildcard matches
    any sequence of characters. The page is optional and starts at 1.
  header: "Channel | Founder | Registered | Last used | Status"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "No channels match the pattern %pattern%."
  status_active: "Active"
  status_pending_registration: "Pending approval"
  status_rejected_registration: "Rejected registration"

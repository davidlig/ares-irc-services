# ChanServ translations — English
# Domain: chanserv
#
# IRC formatting codes (double-quoted strings or !irc literal blocks):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=green, 04=red, 07=orange, 14=dark gray)
#   \x03        reset color
#   \x0F        reset all formatting
#
# IRC colors use DECIMAL numbers (0-15), not hexadecimal.
#   \x0314 = dark gray (14 decimal): CORRECT
#   \x030F = color 0 followed by the letter F: ERROR
#
# Multiline IRC text: !irc |- with physical newlines and real spaces.
# Untagged blocks do not decode escapes; preserve CTCP literals.
# HELP examples: example/examples and %command_prefix%.
# The presenter adds the uncolored /msg prefix and a two-space margin.

# --- ERROR --------------------------------------------------------------------
error:
  invalid_channel: "Invalid channel name. Use %example%."
  invalid_channel_example: "#channel"
  generic: "An error occurred. Please try again."

# --- REGISTER -----------------------------------------------------------------
register:
  syntax: "REGISTER <#channel> <description>"
  example: "%command_prefix%REGISTER #channel Community project"
  short: "Register a channel."
  help: |-
    Register and associate a channel to your nickname. You must be identified with
    %nickserv%. In APPROVAL mode, an IRCop must approve the request.
  success: "Channel %channel% has been registered."
  awaiting_approval: "Registration request for %channel% is awaiting IRCop approval."
  restricted_indefinite: "New registration requests for %channel% are blocked indefinitely."
  restricted_until: "New registration requests for %channel% are blocked until %date%"
  already_registered: "Channel %channel% is already registered or has a registration request in progress."
  channel_not_on_network: "Channel %channel% does not exist on the network."
  pending_deletion: "Channel %channel% is pending deletion and cannot be registered."
  insufficient_channel_rank: "You must have at least operator status on %channel% to register it."
  limit_exceeded: "You have reached the maximum of %max% registered channels."
  throttled: "You must wait %minutes% minute(s) before registering another channel."

# --- INFO ---------------------------------------------------------------------
info:
  syntax: "INFO <#channel>"
  example: "%command_prefix%INFO #channel"
  short: "Show channel information."
  help: |-
    Shows detailed information about a registered channel, including its owner,
    registration details, last activity and configuration options.
  header: "Information for channel %channel%"
  founder: "%label%%padding%: %nickname%"
  founder_label: "Founder"
  registered: "%label%%padding%: %date%"
  registered_label: "Registered"
  successor: "%label%%padding%: %nickname%"
  successor_label: "Successor"
  description: "%label%%padding%: %desc%"
  description_label: "Description"
  url: "%label%%padding%: %url%"
  url_label: "URL"
  email: "%label%%padding%: %email%"
  email_label: "Email"
  last_used: "%label%%padding%: %date%"
  last_used_label: "Last used"
  topic: "%label%%padding%: %topic%"
  topic_label: "Last topic"
  topic_set_by: "%label%%padding%: %nickname%"
  topic_set_by_label: "Topic set by"
  options: "%label%%padding%: %options%"
  options_label: "Options"
  verbose: "%label%%padding%: %state%"
  verbose_label: "Verbose"
  private: "Channel information for %channel% is private."
  no_expire: "%label%%padding%: Yes"
  no_expire_label: "Never Expires"
  mlock_modes: "%label%%padding%: %modes%"
  mlock_modes_label: "Mode lock"
  suspended_status: "%label%%padding%: %state%"
  suspended_status_label: "Status"
  suspended_status_value: "Suspended"
  suspended_reason: "%label%%padding%: %reason%"
  suspended_reason_label: "Reason"
  suspended_until: "%label%%padding%: %date%"
  suspended_until_label: "Ends on"
  suspended_permanent: "%label%%padding%: Permanent"
  suspended_permanent_label: "Ends on"
  forbidden_status: "%label%%padding%: %state%"
  forbidden_status_label: "Status"
  forbidden_status_value: "Forbidden"
  forbidden_reason: "%label%%padding%: %reason%"
  forbidden_reason_label: "Reason"
  pending_deletion_status: "%label%%padding%: %state%"
  pending_deletion_status_label: "Status"
  pending_deletion_status_value: "Pending deletion"
  pending_deletion_at: "%label%%padding%: %date%"
  pending_deletion_at_label: "Dropped"
  pending_deletion_until: "%label%%padding%: %date%"
  pending_deletion_until_label: "Hard delete on"
  pending_deletion_notice: "This channel is frozen and cannot be registered."

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <#channel> <option> [parameters]"
  example: "%command_prefix%SET #channel DESC A community channel"
  examples:
    - "%command_prefix%SET #channel URL https://example.test"
    - "%command_prefix%SET #channel MLOCK ON"
  short: "Change channel options."
  help: |-
    Changes a channel option. Each option has help explaining its requirements
    and variations.
  unknown_option: "Unknown option %option%. Use one of: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Use SET <#channel> FOUNDER <nickname> <token> with the current founder’s confirmed rescue token."
    token_unavailable: "The current founder has no confirmed rescue token. They must authenticate and use VERIFY first."
    syntax: "SET <#channel> FOUNDER <nickname> [token]"
    example: "%command_prefix%SET #channel FOUNDER Alice"
    examples:
      - "%command_prefix%SET #channel FOUNDER Alice confirmed-token"
    short: "Transfer channel to another registered nickname."
    help: |-
      Changes the founder after validating the current founder's token. The
      administrative founder-level exception remains available. The token is not
      consumed.
    invalid_token: "The rescue token is invalid."
    updated: "Founder has been changed to %nickname%."
    throttled: "Too many invalid tokens. Try again in %minutes% minute(s)."
    must_be_registered: "%nickname% must be registered and activated."
    suspended: "%nickname% is suspended and cannot be set as founder."
    cannot_be_self: "The new founder cannot be the current founder."
    cannot_be_successor: "The new founder cannot be the channel successor."
    limit_exceeded: "%nickname% has reached the maximum of %max% registered channels."
    notice_channel: "%from% assigns %nickname% as channel founder."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%SET #channel SUCCESSOR Alice"
    examples:
      - "%command_prefix%SET #channel SUCCESSOR"
    short: "Set the channel successor."
    help: |-
      Assigns a nickname as the channel successor. Omitting the nickname clears the
      current successor. The nickname must be registered and activated.
    cleared: "Successor has been cleared."
    updated: "Successor has been set to %nickname%."
    must_be_registered: "%nickname% must be registered and activated."
    suspended: "%nickname% is suspended and cannot be set as successor."
    cannot_be_founder: "The founder cannot be set as successor."
    notice_channel: "%from% assigns %nickname% as channel successor."
    notice_channel_cleared: "%from% has cleared the channel successor."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <description>"
    example: "%command_prefix%SET #channel DESC A community channel"
    short: "Change channel description."
    help: "Change the channel description (required)."
    updated: "Description updated."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%SET #channel URL https://example.test"
    examples:
      - "%command_prefix%SET #channel URL"
    short: "Set channel URL."
    help: "Changes the channel website URL. Omit the URL to clear it."
    updated: "URL updated."
    cleared: "URL cleared."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#channel> EMAIL [email]"
    example: "%command_prefix%SET #channel EMAIL team@example.test"
    examples:
      - "%command_prefix%SET #channel EMAIL"
    short: "Set channel email."
    help: |-
      Changes the channel email address. Omit the email to clear it.
      Administratively blocked email domains cannot be used. Administrative
      exception: operators with founder-level access.
    invalid: "Invalid email address."
    updated: "Email updated."
    cleared: "Email cleared."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#channel> ENTRYMSG [message]"
    example: "%command_prefix%SET #channel ENTRYMSG Welcome"
    examples:
      - "%command_prefix%SET #channel ENTRYMSG"
    short: "Set channel entry message."
    help: "Sets the entry message (NOTICE). Omit the message to clear it."
    updated: "Entry message updated."
    too_long: "Entry message cannot exceed %max% characters."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #channel TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #channel TOPICLOCK OFF"
    short: "Lock channel topic."
    help: "Prevents changes to the channel topic. Enabling it locks the current topic."
    on: "Topic lock is now ON."
    off: "Topic lock is now OFF."
    notice_on: "%nickname% enables TOPICLOCK."
    notice_off: "%nickname% disables TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #channel MLOCK ON"
    examples:
      - "%command_prefix%SET #channel MLOCK OFF"
    short: "Lock channel modes."
    help: "Locks the current channel modes (e.g. +nt). When ON, modes cannot be changed."
    no_modes: "no modes"
    on: "MLOCK is now ON (%modes%)."
    off: "MLOCK is now OFF."
    notice_on: "%nickname% enables MLOCK (%modes%)."
    notice_off: "%nickname% disables MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#channel> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #channel PRIVATE ON"
    examples:
      - "%command_prefix%SET #channel PRIVATE OFF"
    short: "Hide channel information from users without access."
    help: "When ON, only the founder and users with access can view channel information."
    on: "Channel information is now private."
    off: "Channel information is now public."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%SET #channel SECURE ON"
    examples:
      - "%command_prefix%SET #channel SECURE OFF"
    short: "Require access list for channel ranks."
    help: "Prevents granting channel ranks to nicknames that are not on the access list."
    on: "SECURE is now ON."
    off: "SECURE is now OFF."
    notice_on: "%nickname% enables SECURE mode."
    notice_off: "%nickname% disables SECURE mode."

  # --- SET VERBOSE ---------------------------------------------------------
  verbose:
    syntax: "SET <#channel> VERBOSE {ON|OFF}"
    example: "%command_prefix%SET #channel VERBOSE ON"
    examples:
      - "%command_prefix%SET #channel VERBOSE OFF"
    short: "Toggle channel action notices."
    help: |-
      Enables or disables channel NOTICE broadcasts for actions performed
      on the channel.
    on: "Channel action notices enabled."
    off: "Channel action notices disabled."

# --- STATUS -------------------------------------------------------------------
status:
  syntax: "STATUS <#channel>"
  example: "%command_prefix%STATUS #channel"
  header: "Status of channel %channel%"
  short: "Show channel registration status."
  help: |-
    Show whether a channel is unregistered, pending approval, rejected or registered.
    Rejection details are visible only to the requester and authorized IRCops.
  unregistered: "%label%%padding%: Not registered"
  unregistered_label: "Status"
  pending: "%label%%padding%: %state%"
  pending_label: "Status"
  pending_value: "Approval pending"
  registered: "%label%%padding%: %state%"
  registered_label: "Status"
  registered_value: "Registered"
  suspended: "%label%%padding%: %state%"
  suspended_label: "Status"
  suspended_value: "Suspended"
  forbidden: "%label%%padding%: %state%"
  forbidden_label: "Status"
  forbidden_value: "Forbidden"
  pending_deletion: "%label%%padding%: %state%"
  pending_deletion_label: "Status"
  pending_deletion_value: "Pending deletion"
  rejected_private: "%label%%padding%: %state%"
  rejected_private_label: "Status"
  rejected_private_value: "Registration rejected"
  rejected: "%label%%padding%: %state%"
  rejected_label: "Status"
  rejected_value: "Registration rejected"
  rejection_reason: "%label%%padding%: %reason%"
  rejection_reason_label: "Reason"
  rejection_audit: "%label%%padding%: %operator% on %date%"
  rejection_audit_label: "Rejected by"
  restriction_until: "%label%%padding%: %date%"
  restriction_until_label: "Available from"
  footer: ""

# --- ACCESS -------------------------------------------------------------------
access:
  syntax: "ACCESS <#channel> <option> [parameters]"
  example: "%command_prefix%ACCESS #channel LIST"
  examples:
    - "%command_prefix%ACCESS #channel ADD Alice 100"
    - "%command_prefix%ACCESS #channel DEL Alice"
  short: "Manage access list."
  help: "Manages the channel access list."
  unknown_sub: "Unknown subcommand %sub%. Use LIST, ADD, or DEL."
  level_range: "Access level must be between %min% and %max%."
  cannot_manage_level: "You can only manage nicks with level strictly below your own."
  founder_not_in_list: "The founder is not in the access list."
  max_entries: "Maximum %max% access entries per channel."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#channel> LIST"
    example: "%command_prefix%ACCESS #channel LIST"
    short: "List access list (requires ACCESSLIST level)."
    help: "Shows nickname and level for each entry."
    header: "Access list for %channel%"
    empty: "Channel %channel% has no access entries."
    entry: "#%index%: %nickname% (level %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#channel> ADD <nickname> <level>"
    example: "%command_prefix%ACCESS #channel ADD Alice 100"
    short: "Add or update access level (requires ACCESSCHANGE level)."
    help: "Level 1-499. You can only set levels below your own."
    done: "%nickname% set to level %level%."
    notice_channel: "%from% sets %to% to level %level%"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#channel> DEL <nickname>"
    example: "%command_prefix%ACCESS #channel DEL Alice"
    short: "Remove from access list (requires ACCESSCHANGE level)."
    help: "You can only remove nicks with level below your own."
    not_in_list: "%nickname% is not in the access list."
    done: "%nickname% removed from access list."
    notice_channel: "%from% removes %to% from access list"

# --- DELACCESS ----------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#channel>"
  example: "%command_prefix%DELACCESS #channel"
  short: "Remove your own access from a channel."
  help: |-
    Removes your entry from the channel access list. You must be identified.
    The founder cannot use this command.
  done: "Your access has been removed from %channel%."
  not_in_list: "You don't have access in %channel%."
  founder_not_in_access: "You are the founder of %channel% and are not on the access list."
  notice_channel: "%nickname% removes their access from the channel"

# --- AKICK --------------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> <option> [parameters]"
  example: "%command_prefix%AKICK #channel ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #channel ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #channel DEL *!*@*"
    - "%command_prefix%AKICK #channel DEL 2"
    - "%command_prefix%AKICK #channel LIST"
    - "%command_prefix%AKICK #channel VIEW 1"
    - "%command_prefix%AKICK #channel CLEAR"
    - "%command_prefix%AKICK #channel CHECK Alice"
  short: "Manage auto-kick list."
  help: "Manages autokick entries and their optional expiry."
  unknown_sub: "Unknown subcommand %sub%. Use ADD, DEL, LIST, VIEW, CLEAR, or CHECK."
  invalid_mask: "Invalid mask format. Use nick!ident@host with wildcards (*)."
  dangerous_mask: "The mask %mask% is too broad. It must contain at least 4 alphanumeric characters."
  protected_user: "Nickname %nickname% has access in this channel."
  max_entries: "Maximum %max% AKICK entries per channel."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <mask> [expiry] [reason]"
    example: "%command_prefix%AKICK #channel ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #channel ADD *!*@* 7d Spam"
    short: "Add AKICK entry."
    help: |-
      Adds a mask to the channel autokick list.

      You can specify a duration and a reason. If you include a reason, you must
      also specify the duration: 0 for permanent, d for days, h for hours or m
      for minutes.
    done: "AKICK %mask% added."
    already_exists: "AKICK %mask% already exists."
    notice_channel: "%from% adds AKICK: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL {<mask>|<number>}"
    example: "%command_prefix%AKICK #channel DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #channel DEL 2"
    short: "Remove AKICK entry."
    help: "Remove by exact mask or entry number from LIST."
    not_found: "AKICK %mask% not found."
    done: "AKICK %mask% removed."
    notice_channel: "%from% removes AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#channel> LIST"
    example: "%command_prefix%AKICK #channel LIST"
    short: "List AKICK entries."
    help: "Shows mask, reason, expiry, and who added."
    header: "AKICK list for %channel%"
    empty: "Channel %channel% has no AKICK entries."
    entry: "#%index% %mask% %reason% (by %nickname%, expires: %expiration%, uses: %uses%)"

  # --- AKICK VIEW ----------------------------------------------------------
  view:
    syntax: "AKICK <#channel> VIEW {<mask>|<number>}"
    example: "%command_prefix%AKICK #channel VIEW 1"
    examples:
      - "%command_prefix%AKICK #channel VIEW *!*@bad.host"
    short: "View detailed AKICK entry metadata."
    help: |-
      Displays reason, creator, creation date, expiration date,
      usage counter, and last used date for a specific autokick entry.
    header: "AKICK details for %channel%"
    reason: "%label%%padding%: %reason%"
    reason_label: "Reason"
    author: "%label%%padding%: %author%"
    author_label: "Author"
    created: "%label%%padding%: %date%"
    created_label: "Created"
    expires: "%label%%padding%: %date%"
    expires_label: "Expires"
    uses: "%label%%padding%: %uses%"
    uses_label: "Uses"
    last_used: "%label%%padding%: %date%"
    last_used_label: "Last used"

  # --- AKICK CLEAR ---------------------------------------------------------
  clear:
    syntax: "AKICK <#channel> CLEAR"
    example: "%command_prefix%AKICK #channel CLEAR"
    short: "Clear all AKICK entries."
    help: |-
      Removes all autokick entries from the channel.
      Requires channel founder or AKICK level.
    empty: "Channel %channel% has no AKICK entries to clear."
    done: "Cleared %count% AKICK entries from %channel%."
    notice_channel: "%from% cleared %count% AKICK entries from %channel%"

  # --- AKICK CHECK ---------------------------------------------------------
  check:
    syntax: "AKICK <#channel> CHECK <nickname>"
    example: "%command_prefix%AKICK #channel CHECK Alice"
    short: "Check if a nickname matches any AKICK entries."
    help: |-
      Checks whether a connected user matches any autokick entry in the channel.
    no_match: "%nickname% does not match any AKICK entries in %channel%."
    not_connected: "User %nickname% is not connected."
    header: "AKICK matches for %nickname% in %channel%"
    entry: "#%index% %mask% %reason%"

  # --- AKICK ENFORCE -------------------------------------------------------
  enforce:
    syntax: "AKICK <#channel> ENFORCE"
    example: "%command_prefix%AKICK #channel ENFORCE"
    short: "Enforce AKICK entries on current channel users."
    help: |-
      Checks connected users in the channel against the AKICK list
      and bans and kicks any matching users.
    no_matches: "No users in %channel% match any AKICK entries."
    done: "Enforced %count% AKICK entry/entries on %channel%."
    notice_channel: "%from% enforced AKICK on %channel% (%count% user(s))"

# --- LEVELS -------------------------------------------------------------------
levels:
  syntax: "LEVELS <#channel> <option> [parameters]"
  example: "%command_prefix%LEVELS #channel LIST"
  examples:
    - "%command_prefix%LEVELS #channel SET OPDEOP 50"
    - "%command_prefix%LEVELS #channel RESET"
  short: "Configure channel levels."
  help: |-
    Configures the minimum access levels for channel actions. Only the founder
    can change or reset levels.
  unknown_sub: "Unknown subcommand %sub%. Use LIST, SET, or RESET."
  unknown_key: "Unknown level key %key% or not supported by this IRCd."
  value_range: "Level value must be between %min% and %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#channel> LIST"
    example: "%command_prefix%LEVELS #channel LIST"
    short: "List level requirements."
    help: "Shows each level key and its value (defaults if not set)."
    header: "Levels for %channel%"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#channel> SET <level> <value>"
    example: "%command_prefix%LEVELS #channel SET OPDEOP 50"
    short: "Set a level requirement."
    help: "Value -1 to 499. Founder only."
    done: "%key% set to %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#channel> RESET"
    example: "%command_prefix%LEVELS #channel RESET"
    short: "Reset all levels to defaults."
    help: "Removes all overrides. Founder only."
    done: "All levels reset to defaults."


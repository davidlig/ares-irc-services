  help: "Shows available commands and detailed help for their options."
  header_title: "%bot%"
  header: "%title% %separator%"
  intro: |-
    Lets you register and manage channels, configure their options and control
    who can access them. Manages access levels and user privileges to keep each
    channel under the control of its owners.
  general_header: "Available commands:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Options:"
  general_footer: "Use /msg %bot% %help% for more information."
  general_footer_command: "HELP <command>"
  set_sub_footer: "Use /msg %bot% %help% for more information."
  set_sub_footer_command: "HELP %command% <option>"
  syntax_label: "Syntax: %syntax%"
  footer: ""
  intro_expiration: "NOTE: Channels unused for more than %period% are automatically removed."
  intro_expiration_period: "%days% days"
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    registration_info: "Registration and information"
    access_levels: "Access and levels"
    ranks_entry: "Ranks and entry"
  ircop_group:
    channel_operations: "Channel operations"
    channel_management: "Channel management"
    deletion: "Deletion and restoration"
    restrictions: "Restrictions"
    lookup: "Lookup and investigation"
    registration_approval: "Registration approval"
  ircop_header: "Available commands for IRC Operators:"

# --- CLEARUSERS (IRCop) -------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#channel> [reason]"
  example: "%command_prefix%CLEARUSERS #channel"
  examples:
    - "%command_prefix%CLEARUSERS #channel flooding"
  short: "Kick all users from a channel."
  help: |-
    Removes all users from the channel. Restricted to IRC operators; a default
    reason is used when none is provided.
  not_on_network: "Channel %channel% is not currently on the network."
  empty: "Channel %channel% has no users to kick."
  success: "Kicked %count% user(s) from %channel%."
  default_reason: "CLEARUSERS command"

# --- CLEARACCESS (IRCop) ------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#channel>"
  example: "%command_prefix%CLEARACCESS #channel"
  short: "Clear the entire access list of a channel."
  help: "Removes every entry from the channel access list. This action is irreversible."
  success: "Cleared %count% access entries from %channel%."
  empty: "Channel %channel% has no access entries."

# --- IRCOPONLY (IRCop) --------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#channel> {ON|OFF}"
  example: "%command_prefix%IRCOPONLY #channel ON"
  examples:
    - "%command_prefix%IRCOPONLY #channel OFF"
  short: "Restrict a channel to IRC operators."
  help: |-
    Only authorized IRC operators can remain in the channel. %bot% enforces
    this restriction.
  on: "IRCOPONLY is now ON for %channel%."
  off: "IRCOPONLY is now OFF for %channel%."

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <#channel> <nickname> <description>"
  short: "Administratively register a channel."
  help: |-
    Syntax: SAREGISTER <#channel> <nickname> <description>

    Administratively registers a channel immediately to the specified nickname
    as founder without requiring presence, verification, or throttle limits.
  example: "%command_prefix%SAREGISTER #channel Alice Community channel"
  success: "Channel %channel% has been registered to %founder%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#channel> {ON|OFF}"
  example: "%command_prefix%NOEXPIRE #Important ON"
  examples:
    - "%command_prefix%NOEXPIRE #Important OFF"
  short: "Set or remove expiration protection for a channel."
  help: |-
    Controls whether the channel expires through inactivity.
    ON prevents expiry and OFF applies the normal rules.
  success_on: "Channel %channel% is now protected from expiration."
  success_off: "Channel %channel% will now expire normally."
  forbidden: "Channel %channel% is forbidden."
  suspended: "Channel %channel% is suspended."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <#channel> [FORCE]"
  example: "%command_prefix%DROP #channel"
  examples:
    - "%command_prefix%DROP #channel FORCE"
  short: "Drop a registered channel."
  help: |-
    Deletes a registered channel from the database.
    FORCE permanently deletes a channel that is pending deletion.
    An IRCop with DROP permission can also immediately release
    pending and rejected registration requests, with or without FORCE.
  registration_restricted: "This registration request is restricted until %date%."
  force:
    short: "Permanently deletes a channel that is pending deletion."
  success: "Channel %channel% has been marked for deletion and can be restored during the grace period."
  force_success: "Channel %channel% has been permanently dropped."
  pending_deletion: "Channel %channel% is pending deletion. Use DROP <#channel> force to delete it permanently."
  invalid_channel: "Invalid channel name. Use %example%."
  pending_deletion_reason: "Channel %channel% is being deleted. More information /msg %bot% \x0303INFO %channel%\x03"

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <#channel>"
  example: "%command_prefix%RESTORE #channel"
  short: "Restore a channel pending deletion."
  help: "Restores a manually deleted channel that is still within its grace period."
  success: "Channel %channel% has been restored."
  not_pending_deletion: "Channel %channel% is not pending deletion."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <#channel> <duration> <reason>"
  example: "%command_prefix%SUSPEND #channel 7d Rule violation"
  examples:
    - "%command_prefix%SUSPEND #channel 0 Rule violation"
  short: "Suspend a channel."
  help: |-
    Temporarily disables a registered channel. Duration formats: 0 = permanent,
    1d, 12h, 60m.
    While suspended, channel modes, access and enforcement are disabled.
  success: "Channel %channel% has been suspended until %duration%."
  already_suspended: "Channel %channel% is already suspended."
  invalid_duration: "Invalid duration. Use: 0 (permanent), 1d, 12h, or 60m."
  channel_suspended: "Channel %channel% is suspended and cannot be used."
  notice_channel: "Channel has been suspended. Reason: %reason%"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#channel>"
  example: "%command_prefix%UNSUSPEND #channel"
  short: "Lift a channel suspension."
  help: "Reactivates a suspended channel, restoring its modes and enforcement."
  success: "Channel %channel% is no longer suspended."
  not_suspended: "Channel %channel% is not suspended."
  reason_expired: "expired suspension"

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <#channel> <reason>"
  example: "%command_prefix%FORBID #channel Rule violation"
  short: "Forbid a channel from being used."
  help: |-
    Forbids a channel, removing all users and preventing them from rejoining.
    If the channel is registered, its registration is deleted before the ban
    is applied.
  reason_required: "You must specify a reason."
  success: "Channel %channel% has been forbidden."
  updated: "Forbidden reason for channel %channel% has been updated."
  channel_forbidden: "Channel %channel% is forbidden and cannot be used."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#channel>"
  example: "%command_prefix%UNFORBID #channel"
  short: "Remove a channel forbid."
  help: "Removes a channel ban so that the channel can be registered again."
  success: "Channel %channel% is no longer forbidden."
  not_forbidden: "Channel %channel% is not forbidden."

# --- HISTORY ---
history:
  syntax: "HISTORY <#channel> <option> [parameters]"
  example: "%command_prefix%HISTORY #channel ADD Moderation review"
  examples:
    - "%command_prefix%HISTORY #channel DEL 42"
    - "%command_prefix%HISTORY #channel VIEW"
    - "%command_prefix%HISTORY #channel VIEW 2"
    - "%command_prefix%HISTORY #channel VIEW ALL"
    - "%command_prefix%HISTORY #channel CLEAR"
  short: "View or manage channel action history."
  help: "Manages the channel action history."

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#channel> ADD <message>"
    example: "%command_prefix%HISTORY #channel ADD Moderation review"
    short: "Add a manual history entry."
    help: |-
      Adds a manual entry to the channel's history.
    success: "History entry added for %channel%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#channel> DEL <id>"
    example: "%command_prefix%HISTORY #channel DEL 42"
    short: "Deletes a history entry."
    help: "Deletes a history entry by its ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#channel> VIEW [PAGE|ALL]"
    example: "%command_prefix%HISTORY #channel VIEW"
    examples:
      - "%command_prefix%HISTORY #channel VIEW 2"
      - "%command_prefix%HISTORY #channel VIEW ALL"
    short: "View channel action history."
    help: "Views the channel's history entries."
    header: "%heading% (showing %start%-%end% of %total%):"
    header_heading: "History for %channel%"
    entry: "#%id% [%date%] %action% by %operator% — %message%"
    no_entries: "No history entries found for %channel%."
    page_hint: "Use %command% for more entries."
    page_hint_command: "HISTORY %channel% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#channel> CLEAR"
    example: "%command_prefix%HISTORY #channel CLEAR"
    short: "Delete all history entries for a channel."
    help: "Deletes all history entries for the channel."
    success: "Cleared %count% history entries for %channel%."

# --- HISTORY MESSAGES ---

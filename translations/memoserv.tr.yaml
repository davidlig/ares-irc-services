# MemoServ çevirileri — Türkçe
# Alan: memoserv
#
# IRC biçimlendirme kodları (çift tırnaklar veya !irc düz metin blokları):
#   \x02        kalın yazıyı aç/kapat
#   \x03NN      renk (ONDALIK: 03=yeşil, 04=kırmızı, 07=turuncu, 14=koyu gri)
#   \x03        rengi sıfırla
#   \x0F        tüm biçimlendirmeyi sıfırla
#
# IRC renkleri onaltılık değil, ONDALIK sayılar (0-15) kullanır.
#   \x0314 = koyu gri (ondalık 14): DOĞRU
#   \x030F = 0 rengi ve ardından F harfi: HATA
#
# Çok satırlı IRC metni: !irc |- ile gerçek satır sonları ve boşluklar.
# Etiketsiz bloklar kaçışları çözmez; CTCP sabit metinlerini koruyun.
# HELP örnekleri: example/examples ve %command_prefix%.
# Sunum katmanı renksiz /msg ve iki boşlukluk kenar payı ekler.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#channel} <mesaj>"
  short: "Bir rumuza veya kanala mesaj gönderin."
  help: |-
    Kayıtlı bir takma ada veya kanala mesaj gönderir. Alıcının mesaj hizmeti
    etkinleştirilmiş olmalıdır (ENABLE).
  example: "%command_prefix%SEND Ana Merhaba, notu kontrol edebilir misin?"
  examples:
    - "%command_prefix%SEND #yardım Kanal için duyuru"
  sent_nick: "Mesaj %nickname% adlı kullanıcıya gönderildi."
  sent_channel: "Mesaj %channel% kanalına gönderildi."
  throttled: "Başka bir mesaj göndermeden önce %seconds% saniye beklemelisiniz."
  limit_reached: "%target% için mesaj sınırına ulaşıldı."
  ignored: "Bu hedefe mesaj gönderemezsiniz, yoksayma listesindesiniz."
  cannot_send_to_self: "Kendinize mesaj gönderemezsiniz."
  message_too_long: "Mesaj çok uzun. Maksimum %max% karakter."
  service_disabled_for_target: "%target% için mesaj hizmeti devre dışı."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#channel] <numara>"
  short: "Numarasına göre bir mesajı okuyun."
  help: |-
    Belirtilen numaralı mesajı okur. #kanal olmadan takma ad gelen kutunuzdan okur.
    #kanal ile MEMOREAD düzeyi gerekir.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #yardım 2"
  header: "Mesaj #%index%, gönderen: %from%:"
  footer: "%separator% %date%"
  not_found: "#%index% numaralı mesaj bulunamadı."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#channel]"
  short: "Mesajları listeleyin (okunmamış olanlar kırmızı * ile işaretlenir)."
  help: |-
    Mesajlarınızı veya kanalın mesajlarını listeler. Okunmamışlar kırmızı yıldız
    ve önizlemeyle (en fazla 50 karakter) gösterilir. #kanal yoksa gelen kutunuz;
    #kanal varsa MEMOREAD gerekir.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #yardım"
  header: "%target% için mesajlar:"
  empty: "%target% için mesaj yok."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#channel] {numara|ALL}"
  short: "Numarasına göre bir mesajı silin."
  help: |-
    Bir mesajı numarasıyla siler veya ALL ile gelen kutusunu boşaltır. Kanallar
    için MEMOCHANGE düzeyi gerekir.
  example: "%command_prefix%DEL ALL"
  examples:
    - "%command_prefix%DEL 1"
    - "%command_prefix%DEL #yardım 2"
    - "%command_prefix%DEL #yardım ALL"
  deleted: "#%index% numaralı mesaj silindi."
  not_found: "#%index% numaralı mesaj bulunamadı."
  all_deleted: "Bu gelen kutusundaki tüm mesajlar silindi."
  none_to_delete: "Silinecek mesaj yok."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE <seçenek> [parametreler]"
  short: "Mesajlar için yoksayma listesini yönetin."
  help: |-
    Hesabınızdan veya kayıtlı bir kanaldan mesaj almak istemediğiniz takma adları
    yönetir. Kanal listesini değiştirmek için MEMOCHANGE izni gerekir.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #yardım Ana"
    - "%command_prefix%IGNORE LIST #yardım"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#channel] <nickname>"
    short: "Yoksayılanlar listesine bir takma ad ekler."
    help: |-
      Bu rumuzdan gelen mesajlar gelen kutunuz (veya kanalın) için kabul
      edilmeyecektir.
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #yardım Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#channel] <nickname>"
    short: "Listeden bir takma adı siler."
    help: "Rumuzu yoksayma listesinden kaldırır."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #yardım Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#channel]"
    short: "Yoksayılan takma adları gösterir."
    help: "Mesajlar için sizin (veya kanalın) yoksaydığı rumuzların listesini gösterir."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #yardım"
  added: "%nickname% yoksayma listesine eklendi."
  removed: "%nickname% yoksayma listesinden kaldırıldı."
  already_ignored: "%nickname% zaten yoksayma listesinde."
  not_ignored: "%nickname% yoksayma listesinde değil."
  limit_reached_nick: "Rumuzunuz için yoksayma listesi sınırına ulaşıldı (maks %limit%)."
  limit_reached_channel: "%channel% için yoksayma listesi sınırına ulaşıldı (maks %limit%)."
  list_empty: "Yoksayma listesi boş."
  list_header: "Yoksayma listesi:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#channel]"
  short: "Mesaj almayı etkinleştirin."
  help: |-
    Takma adınız için mesaj almayı etkinleştirir; kanallarda bunu yalnızca kurucu
    etkinleştirebilir.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #yardım"
  enabled_nick: "Rumuzunuz için mesaj hizmeti etkinleştirildi."
  enabled_channel: "%channel% kanalı için mesaj hizmeti etkinleştirildi."
  already_enabled_nick: "Rumuzunuz için mesaj hizmeti zaten etkin."
  already_enabled_channel: "%channel% için mesaj hizmeti zaten etkin."
  founder_only: "%channel% için mesajları yalnızca kanal kurucusu etkinleştirebilir."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#channel]"
  short: "Mesaj almayı devre dışı bırakın."
  help: |-
    Takma adınız veya kanal için mesaj almayı devre dışı bırakır. Kanallarda bunu
    yalnızca kurucu devre dışı bırakabilir.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #yardım"
  disabled_nick: "Rumuzunuz için mesaj hizmeti devre dışı bırakıldı."
  disabled_channel: "%channel% kanalı için mesaj hizmeti devre dışı bırakıldı."
  already_disabled_nick: "Rumuzunuz için mesaj hizmeti zaten devre dışı."
  already_disabled_channel: "%channel% için mesaj hizmeti zaten devre dışı."
  founder_only: "%channel% için mesajları yalnızca kanal kurucusu devre dışı bırakabilir."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [komut] [seçenek]"
  short: "Komutları listeleyin veya bir komut için yardım gösterin."
  help: "Komut listesini veya bir komut ya da seçeneğin ayrıntılı yardımını gösterir."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Kayıtlı kullanıcılar arasında mesaj gönderip almayı ve kanallara duyuru
    göndermeyi sağlar. Alıcı çevrimdışı olsa bile mesajlar daha sonra okunmak üzere
    saklanır.
  general_header: "Kullanılabilir komutlar:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Seçenekler:"
  examples_header: "Örnekler:"
  general_help_command: "HELP <komut>"
  option_help_command: "HELP %command% <seçenek>"
  general_footer: "Daha fazla bilgi için /msg %bot% %help_command% kullanın."
  set_sub_footer: "Daha fazla bilgi için /msg %bot% %help_command% kullanın."
  syntax_label: "Sözdizimi: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Mesajlar"
    preferences: "Tercihler"
  ircop_header: "IRC operatörleri için kullanılabilir komutlar:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_received: "%sender% size yeni bir not gönderdi. Okumak için: /msg %bot% %list%"
  channel_received: "%channel% için %sender% tarafından yeni bir not gönderildi. Okumak için: /msg %bot% %list%"
  nick_pending: "Okunmayı bekleyen %count% mesajınız var. Listelemek için: /msg %bot% %list%"
  channel_pending: "%channel% kanalında okunmayı bekleyen %count% mesaj var. Mesajları görüntülemek için /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "%channel% kayıt isteğin kabul edildi."
  rejected: "%channel% kayıt isteğin reddedildi."
  reason: "Neden: %reason%"
  restriction: "Kullanılabilir olduğu tarih: %date%"

# Tłumaczenia OperServ — Polski
# Domena: operserv
#
# Kody formatowania IRC (podwójne cudzysłowy lub bloki literalne !irc):
#   \x02        włącza/wyłącza pogrubienie
#   \x03NN      kolor (DZIESIĘTNIE: 03=zielony, 04=czerwony, 07=pomarańczowy, 14=ciemnoszary)
#   \x03        resetuje kolor
#   \x0F        resetuje całe formatowanie
#
# Kolory IRC używają liczb DZIESIĘTNYCH (0-15), nie szesnastkowych.
#   \x0314 = ciemnoszary (14 dziesiętnie): POPRAWNIE
#   \x030F = kolor 0, a po nim litera F: BŁĄD
#
# Wielowierszowy tekst IRC: !irc |- z rzeczywistymi podziałami wierszy i spacjami.
# Bloki bez tagu nie dekodują sekwencji ucieczki; zachowaj literały CTCP.
# Przykłady HELP: example/examples i %command_prefix%.
# Prezenter dodaje /msg bez koloru i margines dwóch spacji.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "Ta komenda jest dostępna tylko dla administratorów root sieci."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [komenda] [opcja]"
  short: "Lista komend lub pomoc dla komendy."
  help: |-
    Bez argumentów wyświetla wszystkie polecenia. Użyj %help_command%, aby
    uzyskać pełną pomoc, lub %help_option_command% dla podopcji.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Umożliwia zarządzanie operatorami sieci i ich uprawnieniami, stosowanie
    ograniczeń dostępu oraz rozłączanie użytkowników. Pozwala też wysyłać ogłoszenia
    ogólne i zarządzać wiadomościami powitalnymi sieci.
  general_header: "Dostępne komendy:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opcje:"
  examples_header: "Przykłady:"
  general_help_command: "HELP <komenda>"
  option_help_command: "HELP %command% <opcja>"
  detail_help_command: "HELP <polecenie>"
  detail_help_option_command: "HELP <polecenie> <opcja>"
  general_footer: "Użyj /msg %bot% %help_command%, aby uzyskać więcej informacji."
  set_sub_footer: "Użyj /msg %bot% %help_command%, aby uzyskać więcej informacji."
  syntax_label: "Składnia: %syntax%"
  footer: ""
  intro_expiration: "UWAGA: Nieużywane przez ponad %days% dni pseudonimy są automatycznie usuwane."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operatorzy i role"
    network_security: "Bezpieczeństwo sieci"
    communication: "Komunikacja"
    low_level: "Niski poziom"
  ircop_header: "Dostępne komendy dla operatorów IRC:"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <nick> <rola>|DEL <nick>|LIST}"
  short: "Zarządzaj operatorami IRC sieci."
  help: |-
    Zarządzaj operatorami IRC sieci. ADD dodaje zarejestrowany nick
    jako operatora z określoną rolą.
    DEL usuwa operatora. LIST pokazuje wszystkich operatorów.
    Użyj ROLE LIST aby zobaczyć dostępne role.
    Ta komenda jest dostępna tylko dla użytkowników Root skonfigurowanych w
    serwisach.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Nieznana podkomenda %sub%. Użyj ADD, DEL lub LIST."
  unknown_role: "Rola %role% nie istnieje. Użyj /msg %bot% %role_list%, aby wyświetlić dostępne role."
  already_admin: "%nickname% jest już operatorem IRC (rola: %role%)."
  not_admin: "%nickname% nie jest operatorem IRC."
  role_changed: "Zmieniono rolę dla %nickname% z %old% na %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nick> <rola>"
    short: "Dodaj operatora IRC sieci."
    help: |-
      Dodaje zarejestrowany nick jako operatora IRC sieci.
      Użyj ROLE LIST aby zobaczyć dostępne role.
      Ta komenda jest dostępna tylko dla użytkowników Root.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "Dodano %nickname% jako %role%."
    nick_not_active: "Nick %nickname% nie jest aktywnym zarejestrowanym nickiem."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nick>"
    short: "Usuń operatora IRC sieci."
    help: |-
      Usuwa operatora IRC sieci z listy.
      Ta komenda jest dostępna tylko dla użytkowników Root.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "Usunięto %nickname% z operatorów IRC."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Lista wszystkich operatorów IRC sieci."
    help: |-
      Wyświetla wszystkich operatorów IRC sieci z ich rolami i datą rejestracji.
      Ta komenda jest dostępna tylko dla użytkowników Root.
    example: "%command_prefix%IRCOP LIST"
    header: "Operatorzy IRC Sieci"
    empty: "Brak operatorów IRC."

# --- ROLE ------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rola>|SET <rola> [operclass]}"
    short: "Konfiguruje klasę operatora UnrealIRCd."
    help: |-
      Umożliwia przeglądanie i konfigurowanie operclass dla roli.

      %options_header%
      %option_LIST%Wyświetla dostępne operclasses w sieci.
      %option_VIEW%Wyświetla operclass roli i dostępne klasy.
      %option_SET%Przypisuje operclass IRCOP-om podczas identyfikacji.

      Pomiń wartość, aby ją usunąć.

      Dostępne tylko w protokołach UnrealIRCd.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW WSPARCIE"
      - "%command_prefix%ROLE OPERCLASS SET WSPARCIE services-admin"
      - "%command_prefix%ROLE OPERCLASS SET WSPARCIE"
    list:
      header: "Dostepne Operclasses w Sieci"
      empty: "Brak dostepnych operclass w sieci."
      not_supported: "Aktualny protokol nie obsluguje listowania dostepnych operclasses."
    view:
      empty: "Rola %role% nie ma operclass."
      line: "Operclass: %operclass%"
      available: "Dostepne operclasses: %available%"
    set:
      done: "Operclass skonfigurowana dla roli %role%."
      cleared: "Operclass usunięta z roli %role%."
      not_available: "Operclass %operclass% nie jest dostepna w sieci. Dostepne operclasses: %available%."
  syntax: "ROLE {ADD <nazwa> [opis]|DEL <nazwa>|LIST|PERMS {{ADD|DEL} <rola> <uprawnienie>|{LIST|CLEAR} <rola>}|MODES {VIEW <rola>|SET <rola> [tryby]}|VHOST {VIEW <rola>|SET <rola> [vhost]}}"
  short: "Zarządza rolami operatorów, ich uprawnieniami i konfiguracją."
  help: |-
    Zarządza rolami operatorów, ich uprawnieniami i konfiguracją.

    Role ADMIN, OPER i PREOPER są chronione i nie można ich usunąć.
    Polecenie wyłącznie dla użytkowników Root.
  syntax_operclass: "ROLE {ADD <nazwa> [opis]|DEL <nazwa>|LIST|PERMS {{ADD|DEL} <rola> <uprawnienie>|{LIST|CLEAR} <rola>}|MODES {VIEW <rola>|SET <rola> [tryby]}|VHOST {VIEW <rola>|SET <rola> [vhost]}|OPERCLASS {LIST|VIEW <nazwa>|SET <nazwa> [operclass]}}"
  help_operclass: |-
    Zarządza rolami operatorów, ich uprawnieniami i konfiguracją.

    Role ADMIN, OPER i PREOPER są chronione i nie można ich usunąć.
    Polecenie wyłącznie dla użytkowników Root.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD WSPARCIE Operatorzy wsparcia"
  unknown_sub: "Nieznana podkomenda %sub%. Użyj ADD, DEL, LIST, PERMS, MODES lub VHOST."
  unknown_sub_operclass: "Nieznana podkomenda %sub%. Użyj ADD, DEL, LIST, PERMS, MODES, VHOST lub OPERCLASS."
  not_found: "Rola %role% nie istnieje."
  already_exists: "Rola %role% już istnieje."
  protected: "Rola %role% jest chroniona i nie może być usunięta."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <nazwa> [opis]"
    short: "Utwórz nową rolę."
    help: |-
      Tworzy nową niestandardową rolę. Opis jest opcjonalny.
      Ta komenda jest dostępna tylko dla użytkowników Root.
    example: "%command_prefix%ROLE ADD WSPARCIE Operatorzy wsparcia"
    done: "Utworzono rolę %role%."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <nazwa>"
    short: "Usuń rolę."
    help: |-
      Usuwa niestandardową rolę. Chronione role (ADMIN, OPER, PREOPER)
      nie mogą być usunięte. Jeśli rola ma przypisanych operatorów,
      musisz ich najpierw przenieść.
      Ta komenda jest dostępna tylko dla użytkowników Root.
    example: "%command_prefix%ROLE DEL WSPARCIE"
    done: "Usunięto rolę %role%."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Wyświetla dostępne role."
    help: |-
      Wyświetla wszystkie role. Chronione role są oznaczone [PROTECTED].
      Ta komenda jest dostępna tylko dla użytkowników Root.
    example: "%command_prefix%ROLE LIST"
    header: "Role Operatorów"
    empty: "Brak ról operatorów."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rola> <uprawnienie>|{LIST|CLEAR} <rola>}"
    short: "Zarządza uprawnieniami roli."
    help: |-
      Zarządza uprawnieniami przypisanymi do roli.

      %options_header%
      %option_LIST%Wyświetla wszystkie dostępne uprawnienia i wskazuje przypisane
                      roli.
      %option_ADD%Przypisuje uprawnienie do roli.
      %option_DEL%Odbiera uprawnienie roli (z wyjątkiem ról chronionych).
      %option_CLEAR%Usuwa wszystkie uprawnienia z roli.

      %assigned_status% oznacza przypisane uprawnienie; %unassigned_status% oznacza dostępne.

      Użyj ALL, aby dodać wszystkie dostępne uprawnienia naraz.
      Polecenie ograniczone do użytkowników Root.
    example: "%command_prefix%ROLE PERMS LIST WSPARCIE"
    examples:
      - "%command_prefix%ROLE PERMS ADD WSPARCIE operserv.gline"
      - "%command_prefix%ROLE PERMS ADD WSPARCIE ALL"
      - "%command_prefix%ROLE PERMS DEL WSPARCIE operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR WSPARCIE"
    not_found: "Uprawnienie %perm% nie istnieje."
    already_has: "Rola %role% już ma uprawnienie %perm%."
    does_not_have: "Rola %role% nie ma uprawnienia %perm%."
    list:
      header: "Lista uprawnień roli %role%"
      columns: "Przypisane | Klucz uprawnienia | Opis"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Dodano uprawnienie %perm% do roli %role%."
      all_done: "Dodano %count% uprawnień do roli %role%."
    del:
      done: "Usunięto uprawnienie %perm% z roli %role%."
    clear:
      done: "Usunięto %count% uprawnień z roli %role%."
      empty: "Rola %role% nie ma przypisanych uprawnień."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rola>|SET <rola> [tryby]}"
    short: "Konfiguruje tryby użytkownika dla roli."
    help: |-
      Zarządza trybami użytkownika IRCOP przypisanymi do roli.

      %options_header%
      %option_VIEW%Wyświetla bieżące tryby roli.
      %option_SET%Ustawia tryby IRCOP.

      Pomiń tryby, aby usunąć je wszystkie.

      Użytkownicy z tą rolą otrzymają te tryby podczas identyfikacji.
      Dostępne tryby zależnie od IRCD
      Polecenie ograniczone do użytkowników Root.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Tryby dla %role%"
      empty: "Rola %role% nie ma przypisanych trybów."
      line: "Tryby: %modes%"
    set:
      done: "Ustawiono tryby %modes% dla roli %role%."
      cleared: "Usunięto wszystkie tryby z roli %role%."
      invalid_mode: "Tryb %mode% nie jest prawidłowym trybem IRCOP."
      invalid_modes: "Nieprawidłowe tryby: %invalid%. Prawidłowe tryby: %valid%."
      no_irc_user_modes: "Obecny IRCD nie ma skonfigurowanych trybów IRCOP."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rola>|SET <rola> [vhost]}"
    short: "Konfiguruje wzorzec wirtualnego hosta roli."
    help: |-
      Konfiguruje wirtualny host otrzymywany przez operatorów roli podczas
      identyfikacji, zastępujący ich osobisty host.

      Host powstaje przez połączenie pseudonimu bez znaków specjalnych z
      skonfigurowanym wzorcem. Przykład:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Wyświetla wzorzec skonfigurowany dla roli.
      %option_SET%Ustawia lub usuwa wzorzec roli.

      Wzorzec może zawierać tylko litery, cyfry, łączniki i kropki. Musi zawierać
      co najmniej jedną kropkę, nie może zaczynać się ani kończyć łącznikiem lub
      kropką ani zawierać kolejnych kropek.

      Aby usunąć wymuszony host, użyj SET bez podania wzorca.

      Polecenie wyłącznie dla użytkowników Root.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Wymuszony vhost dla %role%"
      empty: "Rola %role% nie ma ustawionego wymuszonego wzorca vhost."
      line: "Wzorzec: %pattern%"
      example: "Przykład: %example_nickname%.%pattern%"
      example_nickname: "nick"
    set:
      done: "Ustawiono wymuszony wzorzec vhost dla roli %role%."
      cleared: "Usunięto wymuszony wzorzec vhost z roli %role%."
      invalid: "Nieprawidłowy wzorzec vhost. Dozwolone znaki: a-z, A-Z, 0-9, - i .. Musi mieć co najmniej jedną kropkę, nie może zaczynać/kończyć się - lub . ani mieć .."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <nick> <powód>"
  short: "Wymuś rozłączenie użytkownika z sieci."
  help: |-
    Rozłącza użytkownika z sieci IRC.
    IRCops i użytkownicy Root nie mogą zostać wyrzuceni.
  example: "%command_prefix%KILL BadUser Floodowanie kanałów"
  protected_root: "Nie można zabić użytkownika Root %nickname%."
  protected_ircop: "Nie można zabić operatora IRC %nickname%."
  done: "Użytkownik %nickname% został zabity (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <maska> <wygaśnięcie> <powód>|DEL {<maska>|<numer>}|LIST [maska]}"
  short: "Zarządzaj globalnymi G-line'ami w sieci."
  help: |-
    Zarządza globalnymi blokadami sieci (G-lines).
    ADD dodaje nową G-line z maską, czasem wygaśnięcia i powodem.
    DEL usuwa G-line według maski lub numeru wpisu.
    LIST wyświetla wszystkie G-lines, opcjonalnie filtrując po masce.

    Format wygaśnięcia: 0 = bezterminowo albo sufiks d, h, m (np. 7d, 12h, 30m).
    G-lines pasujące do użytkowników Root lub IRCop są odrzucane.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Nadużywanie spamu"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Uporczywe nadużycia"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Nieznana podkomenda %sub%. Użyj ADD, DEL lub LIST."
  invalid_mask: "Nieprawidłowy format maski. Musi być w formacie user@host (np., *@192.168.*)."
  global_mask: "Maska G-line %mask% jest zbyt szeroka. Maski globalne nie są dozwolone."
  dangerous_mask: "Maska G-line %mask% jest zbyt szeroka. Część hosta potrzebuje co najmniej 4 znaków alfanumerycznych."
  protected_user: "Nie można nadać G-line chronionemu użytkownikowi %nickname%."
  invalid_expiry: "Nieprawidłowy format wygaśnięcia. Użyj 0 dla stałego, lub wartości jak 7d, 12h, 30m."
  already_exists: "G-line dla %mask% już istnieje."
  max_entries: "Osiągnięto maksymalną liczbę G-line'ów (%max%)."
  not_found: "G-line %mask% nie znaleziony."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <maska> <wygaśnięcie> <powód>"
    short: "Dodaj sieciowy G-line."
    help: |-
      Dodaje globalną blokadę sieci (G-line).
      Maska musi mieć format użytkownik@host.
      Wygaśnięcie: 0 = bezterminowo albo sufiks d, h, m (np. 7d, 12h, 30m).
      G-lines pasujące do użytkowników Root lub IRCop są odrzucane.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Nadużywanie spamu"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Uporczywe nadużycia"
    done: "G-line dodany: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<maska>|<numer>}"
    short: "Usuń G-line."
    help: |-
      Usuwa G-line z listy.
      Możesz podać maskę lub numer wpisu z LIST.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% usunięty."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [maska]"
    short: "Lista wszystkich G-line'ów."
    help: "Wyświetla wszystkie G-lines. Opcjonalnie filtruje według wzorca maski."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-line'y (%count%)"
    empty: "Brak G-line'ów."
    entry: "%index%. %mask% - %reason% (%nickname%, wygasa: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {serwis|nick!ident@vhost} {PRIVMSG|NOTICE} <wiadomość>"
  short: "Wyślij globalną wiadomość do wszystkich połączonych użytkowników."
  help: |-
    Umożliwia wysyłanie wiadomości do wszystkich połączonych użytkowników
    z istniejącej usługi lub tymczasowego klienta o niestandardowej tożsamości.

    Wiadomości można wysyłać jako PRIVMSG (prywatne) lub NOTICE (powiadomienie).

    Aby użyć tymczasowego klienta, podaj maskę w formacie pseudonim!ident@vhost,
    używając prawidłowych znaków w każdym polu.

    Pseudonim nie może być zarejestrowany ani używany. Klient zostanie automatycznie
    rozłączony po wysłaniu, a jego pseudonim zablokowany na 24 godziny.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Prace konserwacyjne za 10 minut"
  examples:
    - "%command_prefix%GLOBAL Ogloszenia!oper@services.ares NOTICE Sieć zostanie uruchomiona ponownie"
  mask_invalid: "Nieprawidłowy format maski: %error%"
  nick_connected: "Nick %nickname% jest obecnie połączony."
  nick_registered: "Nick %nickname% jest zarejestrowany."
  type_invalid: "Typ wiadomości musi być PRIVMSG lub NOTICE."
  done: "Globalna wiadomość wysłana z %nickname% do %count% użytkowników."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <linia>"
  short: "Wyślij surową linię protokołu do IRCd."
  help: |-
    Wysyła wskazaną linię bezpośrednio do gniazda połączonego IRCd.
    Używaj z najwyższą ostrożnością. Nieprawidłowe linie protokołu mogą zablokować
    sieć.
  example: "%command_prefix%RAW :services.ares NOTICE * :Zaplanowana konserwacja"
  empty: "Musisz podać niepustą linię do wysłania."
  too_long: "Linia jest za długa. Maksymalnie 510 znaków."
  not_connected: "Brak połączenia z IRCd."
  done: "Surowa linia wysłana."
  protocol:
    syntax: "Aktywny protokół odrzucił składnię komendy RAW."
    done: "Wykonano komendę RAW obsługiwaną przez protokół."
    target: "Aktywny protokół odrzucił cel %target%."
    unsupported: "Aktywny protokół nie obsługuje tej komendy RAW."
    invalid_resource_type: "Nieznany typ zasobu protokołu: %resource_type%."
    invalid_resource: "Nieprawidłowy zasób protokołu: %resource%."
    invalid_value: "Nieprawidłowa wartość zasobu protokołu: %resource%."
    error: "Aktywny protokół nie mógł wykonać komendy RAW."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator% wykonuje komendę GLOBAL z nickiem %target% przez %type% do %count% użytkowników. Wiadomość: %message%"
  prefix_message: "Wiadomość: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Zarządzaj wiadomościami MOTD wysyłanymi użytkownikom przy połączeniu."
  syntax: "MOTD {ADD <cel> {PRIVMSG|NOTICE} <wygaśnięcie> <wiadomość>|DEL <id>|LIST|CLEAN}"
  help: |-
    Zarządza wpisami wiadomości dnia (MOTD) wysyłanymi użytkownikom podczas
    łączenia się z siecią.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Nieznana podkomenda. Użyj: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {serwis|nick!ident@vhost} {PRIVMSG|NOTICE} <wygaśnięcie> <wiadomość>"
    syntax_hint: "Użycie: %syntax%"
    short: "Dodaj wpis MOTD."
    help: "Dodaje wiadomość MOTD wysyłaną każdemu użytkownikowi po połączeniu z siecią."
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Dzisiejsza konserwacja"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Witamy a la red"
    done: "Wpis MOTD #%id% dodany."
    invalid_type: "Nieprawidłowy typ wiadomości. Musi być PRIVMSG lub NOTICE."
    invalid_expiry: "Nieprawidłowy format wygaśnięcia. Użyj: <liczba><s|m|h|d> lub 0 bezterminowo (np. 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Użycie: %syntax%"
    short: "Usuń wpis MOTD."
    help: "Usuwa wpis MOTD według jego ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "Wpis MOTD #%id% usunięty."
    not_found: "Wpis MOTD nie znaleziony."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Lista wszystkich wpisów MOTD."
    help: "Wyświetla wszystkie skonfigurowane wpisy MOTD."
    example: "%command_prefix%MOTD LIST"
    empty: "Brak skonfigurowanych wpisów MOTD."
    header: "Wpisy MOTD:"
    status_enabled: "włączone"
    status_disabled: "wyłączone"
    expired: "wygasłe"
    no_bot: "(brak bota)"
    shown_count: "pokazano %count% razy"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Usuń wszystkie wygasłe wpisy MOTD."
    help: "Usuwa wszystkie wpisy MOTD, których czas wygaśnięcia minął."
    example: "%command_prefix%MOTD CLEAN"
    done: "Usunięto %count% wygasłych wpisów MOTD."
    none: "Brak wygasłych wpisów MOTD do usunięcia."
  debug:
    finalized: "Wiadomość MOTD #%id% zakończyła się: [%type%] %message% | %date% | %shown_count%"

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <domena> <powód>|DEL {numer|ALL}|LIST <wzorzec> [strona]}"
  short: "Zarządzaj zablokowanymi domenami email."
  help: |-
    Zarządzaj zablokowanymi domenami email.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <domena> <powód>"
    short: "Zablokuj domenę."
    help: |-
      Akceptuje domeny ASCII lub punycode, nie adresy ani wzorce. Wymagany
      jest powód. Blokada jest dokładna i nie obejmuje subdomen.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {numer|ALL}"
    short: "Usuń blokady domen."
    help: |-
      Usuń stały identyfikator lub wszystkie wpisy za pomocą ALL. Inne
      identyfikatory pozostają bez zmian.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <wzorzec> [strona]"
    short: "Wyświetl zablokowane domeny."
    help: |-
      Wzorzec jest wymagany. Tylko * jest symbolem wieloznacznym dla
      dowolnego ciągu. Wielkość liter nie ma znaczenia. Opcjonalna strona
      zaczyna się od 1. Filtrowanie i stronicowanie zachowują
      identyfikatory.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Nieprawidłowa domena. Użyj ASCII lub punycode bez końcowej kropki."
  invalid_reason: "Wymagany jest niepusty powód administracyjny w jednym wierszu."
  duplicate: "Ta domena jest już zablokowana."
  not_found: "Nie ma zablokowanej domeny o tym identyfikatorze."
  added: "Zablokowano domenę %domain%."
  deleted: "Usunięto blokadę %id%."
  cleared: "Usunięto %total% zablokowanych domen."
  empty: "Brak pasujących zablokowanych domen."
  header: "ID | Domena | Powód"
  page: "Strona %page%/%pages%, %total% pasujących domen."
  row: "%id% | %domain% | %reason%"

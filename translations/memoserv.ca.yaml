# Traduccions de MemoServ — Català
# Domini: memoserv
#
# Codis de format IRC (cometes dobles o blocs literals !irc):
#   \x02        activa/desactiva la negreta
#   \x03NN      color (DECIMAL: 03=verd, 04=vermell, 07=taronja, 14=gris fosc)
#   \x03        restableix el color
#   \x0F        restableix tot el format
#
# Els colors IRC usen números DECIMALS (0-15), no hexadecimals.
#   \x0314 = gris fosc (14 decimal): CORRECTE
#   \x030F = color 0 seguit de la lletra F: ERROR
#
# Text IRC multilínia: !irc |- amb salts físics i espais reals.
# Els blocs sense etiqueta no descodifiquen escapes; conserva els literals CTCP.
# Exemples HELP: example/examples i %command_prefix%.
# El presentador afegeix /msg sense color i un marge de dos espais.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#channel} <message>"
  short: "Enviar un missatge a un sobrenom o canal."
  help: |-
    Envia un missatge a un sobrenom o canal registrat. El destinatari ha de tenir el
    servei de missatgeria activat (ENABLE).
  example: "%command_prefix%SEND Anna Hola, pots revisar el memo?"
  examples:
    - "%command_prefix%SEND #ajuda Avís per al canal"
  sent_nick: "Missatge enviat a %nickname%."
  sent_channel: "Missatge enviat al canal %channel%."
  throttled: "Heu d'esperar %seconds% segon(s) abans d'enviar un altre missatge."
  limit_reached: "Límit de missatges assolit per a %target%."
  ignored: "No podeu enviar missatges a aquest destinatari, sou a la seva llista d'ignorats."
  cannot_send_to_self: "No podeu enviar-vos un missatge a vós mateix."
  message_too_long: "Missatge massa llarg. El màxim és %max% caràcters."
  service_disabled_for_target: "El servei de missatges està desactivat per a %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#channel] <number>"
  short: "Llegir un missatge per número."
  help: |-
    Llegeix el missatge amb el número indicat. Sense #canal, llegeix la safata del
    teu sobrenom. Amb #canal, cal tenir el nivell MEMOREAD.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #ajuda 2"
  header: "Missatge #%index% de %from%:"
  footer: "%separator% %date%"
  not_found: "Missatge #%index% no trobat."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#channel]"
  short: "Llistar missatges (no llegits marcats amb * vermell)."
  help: |-
    Llista els teus missatges o els del canal. Els no llegits es mostren amb un
    asterisc vermell i una vista prèvia (màx. 50 caràcters). Sense #canal = la teva
    safata; amb #canal cal tenir MEMOREAD.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #ajuda"
  header: "Missatges per a %target%:"
  empty: "No hi ha missatges per a %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#channel] {number|ALL}"
  short: "Esborrar un missatge per número."
  help: |-
    Elimina un missatge pel número o utilitza ALL per buidar la bústia. En
    canals requereix el nivell MEMOCHANGE.
  example: "%command_prefix%DEL ALL"
  examples:
    - "%command_prefix%DEL 1"
    - "%command_prefix%DEL #ajuda 2"
    - "%command_prefix%DEL #ajuda ALL"
  deleted: "Missatge #%index% esborrat."
  not_found: "Missatge #%index% no trobat."
  all_deleted: "S’han eliminat tots els missatges d’aquesta bústia."
  none_to_delete: "No hi ha missatges per eliminar."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#channel] <nickname>|DEL [#channel] <nickname>|LIST [#channel]}"
  short: "Gestionar la llista d'ignorats per a missatges."
  help: |-
    Permet gestionar els sobrenoms dels quals no vols rebre missatges, tant al teu
    compte com en un canal registrat. Per modificar la llista d'un canal, necessites
    el permís MEMOCHANGE.
  example: "%command_prefix%IGNORE ADD Anna"
  examples:
    - "%command_prefix%IGNORE DEL #ajuda Anna"
    - "%command_prefix%IGNORE LIST #ajuda"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#channel] <nickname>"
    short: "Afegeix un sobrenom a la llista d'ignorats."
    help: |-
      Els missatges d'aquest sobrenom no s'acceptaran a
      la teva bústia (o a la del canal).
    example: "%command_prefix%IGNORE ADD Anna"
    examples:
      - "%command_prefix%IGNORE ADD #ajuda Anna"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#channel] <nickname>"
    short: "Elimina un sobrenom de la llista."
    help: "Treu el sobrenom de la llista d'ignorats."
    example: "%command_prefix%IGNORE DEL Anna"
    examples:
      - "%command_prefix%IGNORE DEL #ajuda Anna"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#channel]"
    short: "Mostra els sobrenoms ignorats."
    help: "Mostra la llista de sobrenoms que vós (o el canal) ignoreu per a missatges."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #ajuda"
  added: "%nickname% afegit a la llista d'ignorats."
  removed: "%nickname% tret de la llista d'ignorats."
  already_ignored: "%nickname% ja és a la llista d'ignorats."
  not_ignored: "%nickname% no és a la llista d'ignorats."
  limit_reached_nick: "Límit de la llista d'ignorats assolit per al vostre sobrenom (màx. %limit%)."
  limit_reached_channel: "Límit de la llista d'ignorats assolit per a %channel% (màx. %limit%)."
  list_empty: "La llista d'ignorats és buida."
  list_header: "Llista d'ignorats:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#channel]"
  short: "Activar la recepció de missatges."
  help: |-
    Activa la recepció de missatges al teu sobrenom. En canals, només el fundador
    ho pot activar.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #ajuda"
  enabled_nick: "Servei de missatges activat per al vostre sobrenom."
  enabled_channel: "Servei de missatges activat per al canal %channel%."
  already_enabled_nick: "El servei de missatges ja està activat per al vostre sobrenom."
  already_enabled_channel: "El servei de missatges ja està activat per a %channel%."
  founder_only: "Només el fundador del canal pot activar els missatges per a %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#channel]"
  short: "Desactivar la recepció de missatges."
  help: |-
    Desactiva la recepció de missatges al teu sobrenom o canal. En canals, només
    el fundador ho pot desactivar.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #ajuda"
  disabled_nick: "Servei de missatges desactivat per al vostre sobrenom."
  disabled_channel: "Servei de missatges desactivat per al canal %channel%."
  already_disabled_nick: "El servei de missatges ja està desactivat per al vostre sobrenom."
  already_disabled_channel: "El servei de missatges ja està desactivat per a %channel%."
  founder_only: "Només el fundador del canal pot desactivar els missatges per a %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [ordre] [opció]"
  short: "Llistar les ordres o mostrar l'ajuda d'una ordre."
  help: "Mostra la llista d'ordres o l'ajuda detallada d'una ordre o opció."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permet enviar i rebre missatges entre usuaris registrats i enviar avisos als
    canals. Els missatges es desen per consultar-los més tard, encara que el
    destinatari no estigui connectat.
  general_header: "Comandes disponibles:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opcions:"
  examples_header: "Exemples:"
  general_help_command: "HELP <comanda>"
  option_help_command: "HELP %command% <opció>"
  general_footer: "Fes servir /msg %bot% %help_command% per obtenir més informació."
  set_sub_footer: "Fes servir /msg %bot% %help_command% per obtenir més informació."
  syntax_label: "Sintaxi: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Missatges"
    preferences: "Preferències"
  ircop_header: "Comandes disponibles per als IRCops:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_received: "Has rebut un missatge nou de %sender%. Llegeix-lo amb /msg %bot% %list%"
  channel_received: "Ha arribat un missatge nou de %sender% per a %channel%. Llegeix-lo amb /msg %bot% %list%"
  nick_pending: "Tens %count% missatge(s) pendent(s) de llegir. Per llistar els missatges: /msg %bot% %list%"
  channel_pending: "El canal %channel% té %count% missatge(s) pendent(s) de llegir. Consulta els missatges amb /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "La teva sol·licitud de registre de %channel% ha estat acceptada."
  rejected: "La teva sol·licitud de registre de %channel% ha estat rebutjada."
  reason: "Motiu: %reason%"
  restriction: "Disponible a partir del: %date%"

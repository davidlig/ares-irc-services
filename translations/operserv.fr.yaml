# Traductions de OperServ — Français
# Domaine: operserv
#
# Codes de formatage IRC (guillemets doubles ou blocs littéraux !irc) :
#   \x02        active/désactive le gras
#   \x03NN      couleur (DÉCIMAL : 03=vert, 04=rouge, 07=orange, 14=gris foncé)
#   \x03        réinitialise la couleur
#   \x0F        réinitialise tout le formatage
#
# Les couleurs IRC utilisent des nombres DÉCIMAUX (0-15), pas hexadécimaux.
#   \x0314 = gris foncé (14 décimal) : CORRECT
#   \x030F = couleur 0 suivie de la lettre F : ERREUR
#
# Texte IRC multiligne : !irc |- avec des sauts de ligne et des espaces réels.
# Les blocs sans balise ne décodent pas les échappements ; préserver CTCP.
# Exemples HELP : example/examples et %command_prefix%.
# Le présentateur ajoute /msg sans couleur et une marge de deux espaces.

# --- ERROR --------------------------------------------------------------------
error:
  root_only: "Cette commande est réservée aux administrateurs root du réseau."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [commande] [option]"
  short: "Lister les commandes ou afficher l'aide d'une commande."
  help: |-
    Sans argument, affiche toutes les commandes. Utilisez %help_command% pour
    l’aide complète ou %help_option_command% pour les sous-options.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permet de gérer les opérateurs du réseau et leurs permissions, d’appliquer des
    restrictions d’accès et de déconnecter des utilisateurs. Permet aussi d’envoyer
    des annonces générales et de gérer les messages de bienvenue du réseau.
  general_header: "Commandes disponibles :"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Options :"
  examples_header: "Exemples :"
  general_help_command: "HELP <commande>"
  option_help_command: "HELP %command% <option>"
  detail_help_command: "HELP <commande>"
  detail_help_option_command: "HELP <commande> <option>"
  general_footer: "Utilisez /msg %bot% %help_command% pour plus d’informations."
  set_sub_footer: "Utilisez /msg %bot% %help_command% pour plus d’informations."
  syntax_label: "Syntaxe : %syntax%"
  footer: ""
  intro_expiration: "NOTE : les pseudonymes inutilisés pendant plus de %days% jours sont automatiquement supprimés."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Opérateurs et rôles"
    network_security: "Sécurité réseau"
    communication: "Communication"
    low_level: "Bas niveau"
  ircop_header: "Commandes disponibles pour les IRCops :"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax: "IRCOP <option> [paramètres]"
  short: "Gérer les opérateurs IRC du réseau."
  help: |-
    Gère les opérateurs IRC du réseau. ADD ajoute un surnom enregistré
    comme opérateur avec le rôle spécifié.
    DEL retire un opérateur. LIST affiche tous les opérateurs.
    Utilisez ROLE LIST pour voir les rôles disponibles.
    Cette commande est réservée aux utilisateurs Root configurés dans les services.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Sous-commande inconnue %sub%. Utilisez ADD, DEL ou LIST."
  unknown_role: "Le rôle %role% n’existe pas. Utilisez /msg %bot% %role_list% pour afficher les rôles disponibles."
  already_admin: "%nickname% est déjà un opérateur IRC (rôle : %role%)."
  not_admin: "%nickname% n'est pas un opérateur IRC."
  role_changed: "Rôle changé pour %nickname% de %old% à %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <surnom> <rôle>"
    short: "Ajouter un opérateur IRC du réseau."
    help: |-
      Ajoute un surnom enregistré comme opérateur IRC du réseau.
      Utilisez ROLE LIST pour voir les rôles disponibles.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "Ajouté %nickname% en tant que %role%."
    nick_not_active: "Le surnom %nickname% n'est pas un surnom enregistré actif."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <surnom>"
    short: "Retirer un opérateur IRC du réseau."
    help: |-
      Retire un opérateur IRC du réseau de la liste.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "%nickname% retiré des opérateurs IRC."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Lister tous les opérateurs IRC du réseau."
    help: |-
      Liste tous les opérateurs IRC du réseau avec leurs rôles et leur date
      d'enregistrement.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%IRCOP LIST"
    header: "Opérateurs IRC du réseau"
    empty: "Il n'y a aucun opérateur IRC."

# --- ROLE ---------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rôle>|SET <rôle> [operclass]}"
    short: "Configure la classe d’opérateur UnrealIRCd."
    help: |-
      Permet de consulter et de configurer l’operclass d’un rôle.

      %options_header%
      %option_LIST%Affiche les operclasses disponibles sur le réseau.
      %option_VIEW%Affiche l’operclass du rôle et celles disponibles.
      %option_SET%Attribue l’operclass aux IRCOP à l’identification.

      Omettez la valeur pour la supprimer.

      Disponible uniquement avec les protocoles UnrealIRCd.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SUPPORT"
      - "%command_prefix%ROLE OPERCLASS SET SUPPORT services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SUPPORT"
    list:
      header: "Operclasses Disponibles sur le Reseau"
      empty: "Aucune operclass disponible sur le reseau."
      not_supported: "Le protocole actuel ne prend pas en charge la liste des operclasses disponibles."
    view:
      empty: "Le role %role% n'a pas d'operclass."
      line: "Operclass: %operclass%"
      available: "Operclasses disponibles: %available%"
    set:
      done: "Operclass configurée pour le rôle %role%."
      cleared: "Operclass supprimée pour le rôle %role%."
      not_available: "L'operclass %operclass% n'est pas disponible sur le reseau. Operclasses disponibles: %available%."
  syntax: "ROLE <option> [paramètres]"
  short: "Gère les rôles d’opérateur, leurs permissions et leur configuration."
  help: |-
    Gère les rôles d’opérateur, leurs permissions et leur configuration.

    Les rôles ADMIN, OPER et PREOPER sont protégés et ne peuvent pas être supprimés.
    Commande réservée aux utilisateurs Root.
  syntax_operclass: "ROLE <option> [paramètres]"
  help_operclass: |-
    Gère les rôles d’opérateur, leurs permissions et leur configuration.

    Les rôles ADMIN, OPER et PREOPER sont protégés et ne peuvent pas être supprimés.
    Commande réservée aux utilisateurs Root.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SUPPORT Opérateurs de support"
  unknown_sub: "Sous-commande inconnue %sub%. Utilisez ADD, DEL, LIST, PERMS, MODES ou VHOST."
  unknown_sub_operclass: "Sous-commande inconnue %sub%. Utilisez ADD, DEL, LIST, PERMS, MODES, VHOST ou OPERCLASS."
  not_found: "Le rôle %role% n'existe pas."
  already_exists: "Le rôle %role% existe déjà."
  protected: "Le rôle %role% est protégé et ne peut pas être supprimé."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <nom> [description]"
    short: "Créer un nouveau rôle."
    help: |-
      Crée un nouveau rôle personnalisé. La description est optionnelle.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%ROLE ADD SUPPORT Opérateurs de support"
    done: "Rôle créé %role%."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <nom>"
    short: "Supprimer un rôle."
    help: |-
      Supprime un rôle personnalisé. Les rôles protégés (ADMIN, OPER, PREOPER)
      ne peuvent pas être supprimés. Si le rôle a des opérateurs assignés,
      vous devez d'abord les réassigner.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%ROLE DEL SUPPORT"
    done: "Rôle supprimé %role%."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Affiche les rôles disponibles."
    help: |-
      Liste tous les rôles. Les rôles protégés sont marqués [PROTÉGÉ].
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%ROLE LIST"
    header: "Rôles d'opérateur"
    empty: "Il n'y a aucun rôle d'opérateur."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rôle> <permission>|{LIST|CLEAR} <rôle>}"
    short: "Gère les permissions du rôle."
    help: |-
      Gère les permissions attribuées à un rôle.

      %options_header%
      %option_LIST%Affiche toutes les permissions disponibles et indique celles qui
                      lui sont attribuées.
      %option_ADD%Attribue une permission au rôle.
      %option_DEL%Retire une permission du rôle (sauf pour les rôles protégés).
      %option_CLEAR%Retire toutes les permissions du rôle.

      %assigned_status% indique une permission attribuée ; %unassigned_status% indique une permission disponible.

      Utilisez ALL pour ajouter toutes les permissions disponibles en une fois.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%ROLE PERMS LIST SUPPORT"
    examples:
      - "%command_prefix%ROLE PERMS ADD SUPPORT operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SUPPORT ALL"
      - "%command_prefix%ROLE PERMS DEL SUPPORT operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SUPPORT"
    not_found: "La permission %perm% n'existe pas."
    already_has: "Le rôle %role% a déjà la permission %perm%."
    does_not_have: "Le rôle %role% n'a pas la permission %perm%."
    list:
      header: "Liste des permissions de %role%"
      columns: "Attribuée | Clé de permission | Description"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Permission %perm% ajoutée au rôle %role%."
      all_done: "%count% permissions ajoutées au rôle %role%."
    del:
      done: "Permission %perm% retirée du rôle %role%."
    clear:
      done: "%count% permissions retirées du rôle %role%."
      empty: "Le rôle %role% n'a aucune permission assignée."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rôle>|SET <rôle> [modes]}"
    short: "Configure les modes utilisateur du rôle."
    help: |-
      Gère les modes utilisateur IRCOP attribués à un rôle.

      %options_header%
      %option_VIEW%Affiche les modes actuels du rôle.
      %option_SET%Définit les modes IRCOP.

      Omettez les modes pour tous les supprimer.

      Les utilisateurs de ce rôle recevront ces modes à l’identification.
      Modes disponibles selon l’IRCd
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Modes pour %role%"
      empty: "Le rôle %role% n'a aucun mode assigné."
      line: "Modes : %modes%"
    set:
      done: "Modes %modes% définis pour le rôle %role%."
      cleared: "Tous les modes retirés du rôle %role%."
      invalid_mode: "Le mode %mode% n'est pas un mode IRCOP valide."
      invalid_modes: "Modes invalides : %invalid%. Modes valides : %valid%."
      no_irc_user_modes: "L'IRCd actuel n'a aucun mode IRCOP configuré."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rôle>|SET <rôle> [vhost]}"
    short: "Configure le motif d’hôte virtuel du rôle."
    help: |-
      Configure l’hôte virtuel attribué aux opérateurs d’un rôle à l’identification,
      en remplacement de leur hôte personnel.

      L’hôte est généré en combinant le pseudonyme sans caractères spéciaux et le
      motif configuré. Exemple :

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Affiche le motif configuré pour un rôle.
      %option_SET%Définit ou supprime le motif d’un rôle.

      Le motif n’accepte que les lettres, chiffres, tirets et points. Il doit contenir
      au moins un point, ne peut commencer ni finir par un tiret ou un point,
      et ne peut contenir de points consécutifs.

      Pour supprimer l’hôte forcé, utilisez SET sans motif.

      Commande réservée aux utilisateurs Root.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Vhost forcé pour %role%"
      empty: "Le rôle %role% n'a aucun motif vhost forcé défini."
      line: "Motif : %pattern%"
      example: "Exemple : %example_nickname%.%pattern%"
      example_nickname: "surnom"
    set:
      done: "Motif vhost forcé défini pour le rôle %role%."
      cleared: "Motif vhost forcé retiré du rôle %role%."
      invalid: "Motif vhost invalide. Caractères valides : a-z, A-Z, 0-9, - et .. Doit avoir au moins un point, ne peut pas commencer/finir par - ou . ou avoir .."

# --- KILL ---------------------------------------------------------------------
kill:
  syntax: "KILL <surnom> <raison>"
  short: "Déconnecter de force un utilisateur du réseau."
  help: |-
    Déconnecte un utilisateur du réseau IRC.
    Les IRCops et les utilisateurs Root ne peuvent pas être expulsés.
  example: "%command_prefix%KILL BadUser Flooding en canales"
  protected_root: "Impossible de killer l'utilisateur Root %nickname%."
  protected_ircop: "Impossible de killer l'opérateur IRC %nickname%."
  done: "Utilisateur %nickname% a été killé (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax: "GLINE <option> [paramètres]"
  short: "Gérer les G-lines du réseau."
  help: |-
    Gère les G-lines (bannissements réseau globaux).
    ADD ajoute une G-line avec masque, expiration et raison.
    DEL supprime une G-line par masque ou numéro d’entrée.
    LIST affiche toutes les G-lines, avec filtrage facultatif par masque.

    Format d’expiration : 0 = permanent, ou suffixe d, h, m (ex. : 7d, 12h, 30m).
    Les G-lines correspondant à des utilisateurs Root ou IRCops sont rejetées.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abus de spam"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abus persistant"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Sous-commande inconnue %sub%. Utilisez ADD, DEL ou LIST."
  invalid_mask: "Format de masque invalide. Doit être au format utilisateur@hôte (ex., *@192.168.*)."
  global_mask: "Le masque G-line %mask% est trop large. Les masques globaux ne sont pas autorisés."
  dangerous_mask: "Le masque G-line %mask% est trop large. La partie hôte nécessite au moins 4 caractères alphanumériques."
  protected_user: "Impossible de G-liner l'utilisateur protégé %nickname%."
  invalid_expiry: "Format d'expiration invalide. Utilisez 0 pour permanent, ou une valeur comme 7j, 12h, 30m."
  already_exists: "G-line pour %mask% existe déjà."
  max_entries: "Nombre maximum de G-lines (%max%) atteint."
  not_found: "G-line %mask% introuvable."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <masque> <expiration> <raison>"
    short: "Ajouter une G-line du réseau."
    help: |-
      Ajoute une G-line (bannissement réseau global).
      Le masque doit être au format utilisateur@hôte.
      Expiration : 0 = permanent, ou suffixe d, h, m (ex. : 7d, 12h, 30m).
      Les G-lines correspondant à des utilisateurs Root ou IRCops sont rejetées.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abus de spam"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abus persistant"
    done: "G-line ajoutée : %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<masque>|<numéro>}"
    short: "Supprimer une G-line."
    help: |-
      Supprime une G-line de la liste.
      Vous pouvez indiquer le masque ou le numéro d’entrée affiché par LIST.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% supprimée."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [masque]"
    short: "Lister toutes les G-lines."
    help: "Affiche toutes les G-lines. Un filtre par motif de masque est facultatif."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-lines (%count%)"
    empty: "Il n'y a aucune G-line."
    entry: "%index%. %mask% - %reason% (%nickname%, expire : %expiration%)"

# --- BADMAIL ------------------------------------------------------------------
badmail:
  syntax: "BADMAIL <option> [paramètres]"
  short: "Gérer les domaines de courriel bloqués."
  help: |-
    Gérer les domaines de courriel bloqués.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <domaine> <raison>"
    short: "Bloquer un domaine."
    help: |-
      Accepte les domaines ASCII ou punycode, pas les adresses ni les
      motifs. Une raison administrative est requise. Le blocage est exact et
      exclut les sous-domaines.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {numéro|ALL}"
    short: "Supprimer des blocages de domaines."
    help: |-
      Supprime un identifiant permanent ou toutes les entrées avec ALL. Les
      autres identifiants ne changent pas.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <motif> [page]"
    short: "Lister les domaines bloqués."
    help: |-
      Le filtre est obligatoire. Seul * est un joker et correspond à toute
      séquence. La casse est ignorée. La page facultative commence à 1. Les
      identifiants sont conservés lors du filtrage et de la pagination.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Domaine invalide. Utilisez ASCII ou punycode sans point final."
  invalid_reason: "Une raison administrative non vide sur une seule ligne est requise."
  duplicate: "Ce domaine est déjà bloqué."
  not_found: "Aucun domaine bloqué ne porte cet identifiant."
  added: "Domaine %domain% bloqué."
  deleted: "Blocage %id% supprimé."
  cleared: "%total% domaines bloqués supprimés."
  empty: "Aucun domaine bloqué ne correspond."
  header: "ID | Domaine | Raison"
  page: "Page %page%/%pages%, %total% domaines correspondants."
  row: "%id% | %domain% | %reason%"

# --- GLOBAL -------------------------------------------------------------------
global:
  syntax: "GLOBAL {service|surnom!ident@vhôte} {PRIVMSG|NOTICE} <message>"
  short: "Envoyer un message global à tous les utilisateurs connectés."
  help: |-
    Permet d’envoyer des messages à tous les utilisateurs connectés, depuis un
    service existant ou un client temporaire doté d’une identité personnalisée.

    Les messages peuvent être envoyés par PRIVMSG (message privé) ou NOTICE (avis).

    Pour utiliser un client temporaire, indiquez un masque au format
    pseudonyme!ident@vhost, avec des caractères valides dans chaque champ.

    Le pseudonyme ne doit être ni enregistré ni utilisé. Le client est déconnecté
    automatiquement après l’envoi et son pseudonyme est bloqué pendant 24 heures.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Maintenance dans 10 minutes"
  examples:
    - "%command_prefix%GLOBAL Annonces!oper@services.ares NOTICE Le réseau va redémarrer"
  mask_invalid: "Format de masque invalide : %error%"
  nick_connected: "Le surnom %nickname% est actuellement connecté."
  nick_registered: "Le surnom %nickname% est enregistré."
  type_invalid: "Le type de message doit être PRIVMSG ou NOTICE."
  done: "Message global envoyé de %nickname% à %count% utilisateurs."

# --- MOTD ---------------------------------------------------------------------
motd:
  short: "Gérer les messages MOTD envoyés aux utilisateurs lors de la connexion."
  syntax: "MOTD <option> [paramètres]"
  help: |-
    Gère les entrées du message du jour (MOTD) envoyées aux utilisateurs lorsqu’ils
    se connectent au réseau.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Sous-commande inconnue. Utilisez : %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {service|surnom!ident@vhôte} {PRIVMSG|NOTICE} <expiration> <message>"
    syntax_hint: "Usage : %syntax%"
    short: "Ajouter une entrée MOTD."
    help: |-
      Ajoute un message MOTD envoyé à chaque utilisateur lors de sa connexion
      au réseau.
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Maintenance ce soir"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Bienvenue a la red"
    done: "Entrée MOTD n°%id% ajoutée."
    invalid_type: "Type de message invalide. Doit être PRIVMSG ou NOTICE."
    invalid_expiry: "Format d’expiration invalide. Utilisez : <nombre><s|m|h|d> ou 0 pour une durée illimitée (ex. : 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Usage : %syntax%"
    short: "Supprimer une entrée MOTD."
    help: "Supprime une entrée MOTD à partir de son identifiant."
    example: "%command_prefix%MOTD DEL 12"
    done: "Entrée MOTD n°%id% supprimée."
    not_found: "Entrée MOTD introuvable."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Lister toutes les entrées MOTD."
    help: "Affiche toutes les entrées MOTD configurées."
    example: "%command_prefix%MOTD LIST"
    empty: "Aucune entrée MOTD configurée."
    header: "Entrées MOTD :"
    status_enabled: "activée"
    status_disabled: "désactivée"
    expired: "expirée"
    no_bot: "(aucun bot)"
    shown_count: "affiché %count% fois"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Supprimer toutes les entrées MOTD expirées."
    help: "Supprime toutes les entrées MOTD dont la durée de validité est écoulée."
    example: "%command_prefix%MOTD CLEAN"
    done: "%count% entrées MOTD expirées supprimées."
    none: "Aucune entrée MOTD expirée à supprimer."
  debug:
    finalized: "Le message MOTD #%id% est terminé : [%type%] %message% | %date% | %shown_count%"

# --- RAW ----------------------------------------------------------------------
raw:
  syntax: "RAW <ligne>"
  short: "Envoyer une ligne de protocole brute à l'IRCd."
  help: |-
    Envoie directement la ligne indiquée au socket de l’IRCd de liaison.
    À utiliser avec une extrême prudence. Des lignes de protocole incorrectes
    peuvent
    bloquer le réseau.
  example: "%command_prefix%RAW :services.ares NOTICE * :Maintenance programmée"
  empty: "Vous devez spécifier une ligne non vide à envoyer."
  too_long: "Ligne trop longue. Maximum 510 caractères."

# Traductions de OperServ — Français
# Domaine: operserv
#
# Codes de formatage IRC (guillemets doubles ou blocs littéraux !irc) :
#   \x02        active/désactive le gras
#   \x03NN      couleur (DÉCIMAL : 03=vert, 04=rouge, 07=orange, 14=gris foncé)
#   \x03        réinitialise la couleur
#   \x0F        réinitialise tout le formatage
#
# Les couleurs IRC utilisent des nombres DÉCIMAUX (0-15), pas hexadécimaux.
#   \x0314 = gris foncé (14 décimal) : CORRECT
#   \x030F = couleur 0 suivie de la lettre F : ERREUR
#
# Texte IRC multiligne : !irc |- avec des sauts de ligne et des espaces réels.
# Les blocs sans balise ne décodent pas les échappements ; préserver CTCP.
# Exemples HELP : example/examples et %command_prefix%.
# Le présentateur ajoute /msg sans couleur et une marge de deux espaces.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "\x0304✗\x03 Cette commande est réservée aux administrateurs root du réseau."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [commande [sous-option]]"
  short: "Lister les commandes ou afficher l'aide d'une commande."
  help: !irc |-
    Sans argument, affiche toutes les commandes. Utilisez \x0303HELP <commande>\x03 pour
    l’aide complète ou \x0303HELP <commande> <option>\x03 pour les sous-options.
  example: "%command_prefix%\x02\x0303HELP KILL\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Permet de gérer les opérateurs du réseau et leurs permissions, d’appliquer des
    restrictions d’accès et de déconnecter des utilisateurs. Permet aussi d’envoyer
    des annonces générales et de gérer les messages de bienvenue du réseau.
  general_header: "\x02 ■ Commandes disponibles :\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Options :\x02"
  examples_header: "\x02 ■ Exemples :\x02"
  general_footer: "\x0310ℹ\x03\x0F Utilisez /msg %bot% \x02\x0303HELP <commande>\x03\x0F pour plus d’informations."
  set_sub_footer: "\x0310ℹ\x03\x0F Utilisez /msg %bot% \x02\x0303HELP %command% <option>\x03\x0F pour plus d’informations."
  syntax_label: "Syntaxe : \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0307⚠\x03\x0F NOTE : les pseudonymes inutilisés pendant plus de %days% jours sont automatiquement supprimés."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    operators_roles: "Opérateurs et rôles"
    network_security: "Sécurité réseau"
    communication: "Communication"
    low_level: "Bas niveau"
  ircop_header: "\x02 ■ Commandes disponibles pour les IRCops :\x02"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD|DEL|LIST} [surnom] [rôle]"
  short: "Gérer les opérateurs IRC du réseau."
  help: |-
    Gère les opérateurs IRC du réseau. ADD ajoute un surnom enregistré
    comme opérateur avec le rôle spécifié.
    DEL retire un opérateur. LIST affiche tous les opérateurs.
    Utilisez ROLE LIST pour voir les rôles disponibles.
    Cette commande est réservée aux utilisateurs Root configurés dans les services.
  example: "%command_prefix%\x02\x0303IRCOP ADD Ana OPER\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL ou LIST."
  unknown_role: "\x0304✗\x03 Le rôle \x02%role%\x02 n’existe pas. Utilisez /msg %bot% \x0303ROLE LIST\x03 pour afficher les rôles disponibles."
  already_admin: "\x0304✗\x03 \x02%nickname%\x02 est déjà un opérateur IRC (rôle : %role%)."
  not_admin: "\x0304✗\x03 \x02%nickname%\x02 n'est pas un opérateur IRC."
  role_changed: "\x0303✓\x03 Rôle changé pour \x02%nickname%\x02 de %old% à %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <surnom> <rôle>"
    short: "Ajouter un opérateur IRC du réseau."
    help: |-
      Ajoute un surnom enregistré comme opérateur IRC du réseau.
      Utilisez ROLE LIST pour voir les rôles disponibles.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%\x02\x0303IRCOP ADD Ana OPER\x03\x0F"
    done: "\x0303✓\x03 Ajouté \x02%nickname%\x02 en tant que \x02%role%\x02."
    nick_not_active: "\x0304✗\x03 Le surnom \x02%nickname%\x02 n'est pas un surnom enregistré actif."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <surnom>"
    short: "Retirer un opérateur IRC du réseau."
    help: |-
      Retire un opérateur IRC du réseau de la liste.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%\x02\x0303IRCOP DEL Ana\x03\x0F"
    done: "\x0303✓\x03 \x02%nickname%\x02 retiré des opérateurs IRC."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Lister tous les opérateurs IRC du réseau."
    help: |-
      Liste tous les opérateurs IRC du réseau avec leurs rôles et leur date
      d'enregistrement.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
    header: "\x0307---\x03 \x02Opérateurs IRC du réseau\x02 \x0307---\x03"
    empty: "Il n'y a aucun opérateur IRC."

# --- ROLE ------------------------------------------------------------------
role:

  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW|SET} [rôle] [paramètres]"
    short: "Configure la classe d’opérateur UnrealIRCd."
    help: !irc |-
      Permet de consulter et de configurer l’operclass d’un rôle.

      \x02 ■ Options :\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FAffiche les operclasses disponibles sur le réseau.
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FAffiche l’operclass du rôle et celles disponibles.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FAttribue l’operclass aux IRCOP à l’identification.

      Omettez la valeur pour la supprimer.

      Disponible uniquement avec les protocoles UnrealIRCd.
    example: "%command_prefix%\x02\x0303ROLE OPERCLASS LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE OPERCLASS VIEW SUPPORT\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET SUPPORT services-admin\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET SUPPORT\x03\x0F"
    list:
      header: "\x0307---\x03 \x02Operclasses Disponibles sur le Reseau\x02 \x0307---\x03"
      empty: "Aucune operclass disponible sur le reseau."
      not_supported: "\x0304✗\x03 Le protocole actuel ne prend pas en charge la liste des operclasses disponibles."
    view:
      empty: "Le role %role% n'a pas d'operclass."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Operclasses disponibles: \x0310%available%\x03"
    set:
      done: "\x0303✓\x03 Operclass configurée pour le rôle %role%."
      cleared: "\x0303✓\x03 Operclass supprimée pour le rôle %role%."
      not_available: "\x0304✗\x03 L'operclass \x02%operclass%\x02 n'est pas disponible sur le reseau. Operclasses disponibles: %available%."
  syntax: "ROLE <option> [nom] [...]"
  short: "Gère les rôles d’opérateur, leurs permissions et leur configuration."
  help: |-
    Gère les rôles d’opérateur, leurs permissions et leur configuration.

    Les rôles ADMIN, OPER et PREOPER sont protégés et ne peuvent pas être supprimés.
    Commande réservée aux utilisateurs Root.
  syntax_operclass: "ROLE <option> [nom] [...]"
  help_operclass: |-
    Gère les rôles d’opérateur, leurs permissions et leur configuration.

    Les rôles ADMIN, OPER et PREOPER sont protégés et ne peuvent pas être supprimés.
    Commande réservée aux utilisateurs Root.
  example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ROLE ADD SUPPORT Opérateurs de support\x03\x0F"
  unknown_sub: "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL, LIST, PERMS, MODES ou VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL, LIST, PERMS, MODES, VHOST ou OPERCLASS."
  not_found: "\x0304✗\x03 Le rôle \x02%role%\x02 n'existe pas."
  already_exists: "\x0304✗\x03 Le rôle \x02%role%\x02 existe déjà."
  protected: "\x0304✗\x03 Le rôle \x02%role%\x02 est protégé et ne peut pas être supprimé."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <nom> [description]"
    short: "Créer un nouveau rôle."
    help: |-
      Crée un nouveau rôle personnalisé. La description est optionnelle.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%\x02\x0303ROLE ADD SUPPORT Opérateurs de support\x03\x0F"
    done: "\x0303✓\x03 Rôle créé \x02%role%\x02."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <nom>"
    short: "Supprimer un rôle."
    help: |-
      Supprime un rôle personnalisé. Les rôles protégés (ADMIN, OPER, PREOPER)
      ne peuvent pas être supprimés. Si le rôle a des opérateurs assignés,
      vous devez d'abord les réassigner.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%\x02\x0303ROLE DEL SUPPORT\x03\x0F"
    done: "\x0303✓\x03 Rôle supprimé \x02%role%\x02."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Affiche les rôles disponibles."
    help: |-
      Liste tous les rôles. Les rôles protégés sont marqués [PROTÉGÉ].
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
    header: "\x0307---\x03 \x02Rôles d'opérateur\x02 \x0307---\x03"
    empty: "Il n'y a aucun rôle d'opérateur."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {ADD|DEL|LIST|CLEAR} <rôle> [paramètres]"
    short: "Gère les permissions du rôle."
    help: !irc |-
      Gère les permissions attribuées à un rôle.

      \x02 ■ Options :\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FAffiche toutes les permissions disponibles et indique celles qui
                      lui sont attribuées.
          \x0310›\x03\x0F \x02\x0303ADD       \x03\x0FAttribue une permission au rôle.
          \x0310›\x03\x0F \x02\x0303DEL       \x03\x0FRetire une permission du rôle (sauf pour les rôles protégés).
          \x0310›\x03\x0F \x02\x0303CLEAR     \x03\x0FRetire toutes les permissions du rôle.

      ✓ indique une permission attribuée ; ✗ indique une permission disponible.

      Utilisez ALL pour ajouter toutes les permissions disponibles en une fois.
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%\x02\x0303ROLE PERMS LIST SUPPORT\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE PERMS ADD SUPPORT operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS ADD SUPPORT ALL\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS DEL SUPPORT operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS CLEAR SUPPORT\x03\x0F"
    not_found: "\x0304✗\x03 La permission \x02%perm%\x02 n'existe pas."
    already_has: "\x0304✗\x03 Le rôle \x02%role%\x02 a déjà la permission \x02%perm%\x02."
    does_not_have: "\x0304✗\x03 Le rôle \x02%role%\x02 n'a pas la permission \x02%perm%\x02."
    list:
      header: "\x0303Liste des permissions de \x02%role%\x02\x03"
      columns: "Attribuée | Clé de permission | Description"
      row: "%assigned% | %permission% | %description%"
      assigned: "\x0303✓\x03\x0F"
      unassigned: "\x0304✗\x03\x0F"
    add:
      done: "\x0303✓\x03 Permission \x02%perm%\x02 ajoutée au rôle \x02%role%\x02."
      all_done: "\x0303✓\x03 \x02%count%\x02 permissions ajoutées au rôle \x02%role%\x02."
    del:
      done: "\x0303✓\x03 Permission \x02%perm%\x02 retirée du rôle \x02%role%\x02."
    clear:
      done: "\x0303✓\x03 \x02%count%\x02 permissions retirées du rôle \x02%role%\x02."
      empty: "\x0304✗\x03 Le rôle \x02%role%\x02 n'a aucune permission assignée."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW|SET} <rôle> [modes]"
    short: "Configure les modes utilisateur du rôle."
    help: !irc |-
      Gère les modes utilisateur IRCOP attribués à un rôle.

      \x02 ■ Options :\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FAffiche les modes actuels du rôle.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FDéfinit les modes IRCOP.

      Omettez les modes pour tous les supprimer.

      Les utilisateurs de ce rôle recevront ces modes à l’identification.
      Modes disponibles selon l’IRCd
      Cette commande est réservée aux utilisateurs Root.
    example: "%command_prefix%\x02\x0303ROLE MODES VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER oH\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02Modes pour %role%\x02 \x0307---\x03"
      empty: "Le rôle \x02%role%\x02 n'a aucun mode assigné."
      line: "  Modes : \x0303%modes%\x03"
    set:
      done: "\x0303✓\x03 Modes \x02%modes%\x02 définis pour le rôle \x02%role%\x02."
      cleared: "\x0303✓\x03 Tous les modes retirés du rôle \x02%role%\x02."
      invalid_mode: "\x0304✗\x03 Le mode \x02%mode%\x02 n'est pas un mode IRCOP valide."
      invalid_modes: "\x0304✗\x03 Modes invalides : %invalid%. Modes valides : %valid%."
      no_irc_user_modes: "\x0304✗\x03 L'IRCd actuel n'a aucun mode IRCOP configuré."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW|SET} <rôle> [vhost]"
    short: "Configure le motif d’hôte virtuel du rôle."
    help: !irc |-
      Configure l’hôte virtuel attribué aux opérateurs d’un rôle à l’identification,
      en remplacement de leur hôte personnel.

      L’hôte est généré en combinant le pseudonyme sans caractères spéciaux et le
      motif configuré. Exemple :

      _davidlig_ + admin.ares → davidlig.admin.ares

      \x02 ■ Options :\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FAffiche le motif configuré pour un rôle.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FDéfinit ou supprime le motif d’un rôle.

      Le motif n’accepte que les lettres, chiffres, tirets et points. Il doit contenir
      au moins un point, ne peut commencer ni finir par un tiret ou un point,
      et ne peut contenir de points consécutifs.

      Pour supprimer l’hôte forcé, utilisez SET sans motif.

      Commande réservée aux utilisateurs Root.
    example: "%command_prefix%\x02\x0303ROLE VHOST VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER admin.ares\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02Vhost forcé pour %role%\x02 \x0307---\x03"
      empty: "Le rôle \x02%role%\x02 n'a aucun motif vhost forcé défini."
      line: "  Motif : \x0303%pattern%\x03"
      example: "  Exemple : \x02surnom\x02.%pattern%"
    set:
      done: "\x0303✓\x03 Motif vhost forcé défini pour le rôle \x02%role%\x02."
      cleared: "\x0303✓\x03 Motif vhost forcé retiré du rôle \x02%role%\x02."
      invalid: "\x0304✗\x03 Motif vhost invalide. Caractères valides : a-z, A-Z, 0-9, - et .. Doit avoir au moins un point, ne peut pas commencer/finir par - ou . ou avoir .."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <surnom> <raison>"
  short: "Déconnecter de force un utilisateur du réseau."
  help: |-
    Déconnecte un utilisateur du réseau IRC.
    Les IRCops et les utilisateurs Root ne peuvent pas être expulsés.
  example: "%command_prefix%\x02\x0303KILL BadUser Flooding en canales\x03\x0F"
  protected_root: "\x0304✗\x03 Impossible de killer l'utilisateur Root \x02%nickname%\x02."
  protected_ircop: "\x0304✗\x03 Impossible de killer l'opérateur IRC \x02%nickname%\x02."
  done: "\x0303✓\x03 Utilisateur \x02%nickname%\x02 a été killé (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD|DEL|LIST} [masque] [expiration] [raison]"
  short: "Gérer les G-lines du réseau."
  help: |-
    Gère les G-lines (bannissements réseau globaux).
    ADD ajoute une G-line avec masque, expiration et motif.
    DEL supprime une G-line par masque ou numéro d’entrée.
    LIST affiche toutes les G-lines, avec filtrage facultatif par masque.

    Format d’expiration : 0 = permanent, ou suffixe d, h, m (ex. : 7d, 12h, 30m).
    Les G-lines correspondant à des utilisateurs Root ou IRCops sont rejetées.
  example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Abus de spam\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Abus persistant\x03\x0F"
    - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
  unknown_sub: "\x0304✗\x03 Sous-commande inconnue \x02%sub%\x02. Utilisez ADD, DEL ou LIST."
  invalid_mask: "\x0304✗\x03 Format de masque invalide. Doit être au format utilisateur@hôte (ex., *@192.168.*)."
  global_mask: "\x0304✗\x03 Le masque G-line \x02%mask%\x02 est trop large. Les masques globaux ne sont pas autorisés."
  dangerous_mask: "\x0304✗\x03 Le masque G-line \x02%mask%\x02 est trop large. La partie hôte nécessite au moins 4 caractères alphanumériques."
  protected_user: "\x0304✗\x03 Impossible de G-liner l'utilisateur protégé \x02%nickname%\x02."
  invalid_expiry: "\x0304✗\x03 Format d'expiration invalide. Utilisez 0 pour permanent, ou une valeur comme 7j, 12h, 30m."
  already_exists: "\x0304✗\x03 G-line pour \x02%mask%\x02 existe déjà."
  max_entries: "\x0304✗\x03 Nombre maximum de G-lines (%max%) atteint."
  not_found: "\x0304✗\x03 G-line \x02%mask%\x02 introuvable."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <masque> <expiration> <raison>"
    short: "Ajouter une G-line du réseau."
    help: |-
      Ajoute une G-line (bannissement réseau global).
      Le masque doit être au format utilisateur@hôte.
      Expiration : 0 = permanent, ou suffixe d, h, m (ex. : 7d, 12h, 30m).
      Les G-lines correspondant à des utilisateurs Root ou IRCops sont rejetées.
    example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Abus de spam\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Abus persistant\x03\x0F"
    done: "\x0303✓\x03 G-line ajoutée : \x02%mask%\x02 (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL <masque|numéro>"
    short: "Supprimer une G-line."
    help: |-
      Supprime une G-line de la liste.
      Vous pouvez indiquer le masque ou le numéro d’entrée affiché par LIST.
    example: "%command_prefix%\x02\x0303GLINE DEL *@192.168.1.*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE DEL 2\x03\x0F"
    done: "\x0303✓\x03 G-line \x02%mask%\x02 supprimée."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [masque]"
    short: "Lister toutes les G-lines."
    help: "Affiche toutes les G-lines. Un filtre par motif de masque est facultatif."
    example: "%command_prefix%\x02\x0303GLINE LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
    header: "\x0307---\x03 \x02G-lines (%count%) \x0307---\x03"
    empty: "Il n'y a aucune G-line."
    entry: "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, expire : %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {service|surnom!ident@vhôte} {PRIVMSG|NOTICE} <message>"
  short: "Envoyer un message global à tous les utilisateurs connectés."
  help: |-
    Permet d’envoyer des messages à tous les utilisateurs connectés, depuis un
    service existant ou un client temporaire doté d’une identité personnalisée.

    Les messages peuvent être envoyés par PRIVMSG (message privé) ou NOTICE (avis).

    Pour utiliser un client temporaire, indiquez un masque au format
    pseudonyme!ident@vhost, avec des caractères valides dans chaque champ.

    Le pseudonyme ne doit être ni enregistré ni utilisé. Le client est déconnecté
    automatiquement après l’envoi et son pseudonyme est bloqué pendant 24 heures.
  example: "%command_prefix%\x02\x0303GLOBAL %operserv% PRIVMSG Maintenance dans 10 minutes\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLOBAL Annonces!oper@services.ares NOTICE Le réseau va redémarrer\x03\x0F"
  mask_invalid: "\x0304✗\x03 Format de masque invalide : %error%"
  nick_connected: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est actuellement connecté."
  nick_registered: "\x0304✗\x03 Le surnom \x02%nickname%\x02 est enregistré."
  type_invalid: "\x0304✗\x03 Le type de message doit être PRIVMSG ou NOTICE."
  done: "\x0303✓\x03 Message global envoyé de \x02%nickname%\x02 à %count% utilisateurs."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <ligne>"
  short: "Envoyer une ligne de protocole brute à l'IRCd."
  help: |-
    Envoie directement la ligne indiquée au socket de l’IRCd de liaison.
    À utiliser avec une extrême prudence. Des lignes de protocole incorrectes
    peuvent
    bloquer le réseau.
  example: "%command_prefix%\x02\x0303RAW :services.ares NOTICE * :Maintenance programmée\x03\x0F"
  empty: "\x0304✗\x03 Vous devez spécifier une ligne non vide à envoyer."
  too_long: "\x0304✗\x03 Ligne trop longue. Maximum 510 caractères."
  not_connected: "\x0304✗\x03 Non connecté à l'IRCd."
  done: "\x0303✓\x03 Ligne brute envoyée."
  protocol:
    syntax: "\x0304✗\x03 Le protocole actif a rejeté la syntaxe de la commande RAW."
    done: "\x0303✓\x03 Commande RAW gérée par le protocole exécutée."
    target: "\x0304✗\x03 Le protocole actif a rejeté la cible %target%."
    unsupported: "\x0304✗\x03 Le protocole actif ne prend pas en charge cette commande RAW."
    invalid_resource_type: "\x0304✗\x03 Type de ressource de protocole inconnu : %resource_type%."
    invalid_resource: "\x0304✗\x03 Ressource de protocole invalide : %resource%."
    invalid_value: "\x0304✗\x03 Valeur invalide pour la ressource de protocole : %resource%."
    error: "\x0304✗\x03 Le protocole actif n’a pas pu exécuter la commande RAW."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator% exécute la commande GLOBAL avec le surnom %target% via %type% vers %count% utilisateurs. Message : %message%"
  prefix_message: "Message : %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Gérer les messages MOTD envoyés aux utilisateurs lors de la connexion."
  syntax: "MOTD {ADD|DEL|LIST|CLEAN} [args]"
  help: |-
    Gère les entrées du message du jour (MOTD) envoyées aux utilisateurs lorsqu’ils
    se connectent au réseau.
  example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Sous-commande inconnue. Utilisez : \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {service|surnom!ident@vhôte} {PRIVMSG|NOTICE} <expiration> <message>"
    syntax_hint: "\x0304✗\x03 Usage : \x02%syntax%\x02"
    short: "Ajouter une entrée MOTD."
    help: |-
      Ajoute un message MOTD envoyé à chaque utilisateur lors de sa connexion
      au réseau.
    example: "%command_prefix%\x02\x0303MOTD ADD %operserv% NOTICE 24h Maintenance ce soir\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303MOTD ADD %operserv% PRIVMSG 0 Bienvenue a la red\x03\x0F"
    done: "\x0303✓\x03 Entrée MOTD n°%id% ajoutée."
    invalid_type: "\x0304✗\x03 Type de message invalide. Doit être \x02PRIVMSG\x02 ou \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Format d’expiration invalide. Utilisez : \x02<nombre><s|m|h|d>\x02 ou \x020\x02 pour une durée illimitée (ex. : 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "\x0304✗\x03 Usage : \x02%syntax%\x02"
    short: "Supprimer une entrée MOTD."
    help: "Supprime une entrée MOTD à partir de son identifiant."
    example: "%command_prefix%\x02\x0303MOTD DEL 12\x03\x0F"
    done: "\x0303✓\x03 Entrée MOTD n°%id% supprimée."
    not_found: "\x0304✗\x03 Entrée MOTD introuvable."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Lister toutes les entrées MOTD."
    help: "Affiche toutes les entrées MOTD configurées."
    example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
    empty: "Aucune entrée MOTD configurée."
    header: "Entrées MOTD :"
    status_enabled: "\x0303activée\x03"
    status_disabled: "\x0304désactivée\x03"
    expired: "\x0304expirée\x03"
    no_bot: "(aucun bot)"
    shown_count: "affiché %count% fois"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Supprimer toutes les entrées MOTD expirées."
    help: "Supprime toutes les entrées MOTD dont la durée de validité est écoulée."
    example: "%command_prefix%\x02\x0303MOTD CLEAN\x03\x0F"
    done: "\x0303✓\x03 %count% entrées MOTD expirées supprimées."
    none: "\x0303✓\x03 Aucune entrée MOTD expirée à supprimer."
  debug:
    finalized: "Le message MOTD #%id% est terminé : [%type%] %message% | %date% | %shown_count%"

# Traduzioni di MemoServ — Italiano
# Dominio: memoserv
#
# Codici di formattazione IRC (virgolette doppie o blocchi letterali !irc):
#   \x02        attiva/disattiva il grassetto
#   \x03NN      colore (DECIMALE: 03=verde, 04=rosso, 07=arancione, 14=grigio scuro)
#   \x03        ripristina il colore
#   \x0F        ripristina tutta la formattazione
#
# I colori IRC usano numeri DECIMALI (0-15), non esadecimali.
#   \x0314 = grigio scuro (14 decimale): CORRETTO
#   \x030F = colore 0 seguito dalla lettera F: ERRORE
#
# Testo IRC multilinea: !irc |- con interruzioni di riga e spazi reali.
# I blocchi senza tag non decodificano gli escape; preservare i letterali CTCP.
# Esempi HELP: example/examples e %command_prefix%.
# Il presentatore aggiunge /msg senza colore e un margine di due spazi.

# --- SEND ------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#canale} <messaggio>"
  short: "Invia un messaggio a un nickname o canale."
  help: |-
    Invia un messaggio a un nickname o a un canale registrato. Il destinatario deve
    avere attivo il servizio memo (ENABLE).
  example: "%command_prefix%SEND Anna Ciao, puoi rivedere il memo?"
  examples:
    - "%command_prefix%SEND #aiuto Avviso per il canale"
  sent_nick: "Messaggio inviato a %nickname%."
  sent_channel: "Messaggio inviato al canale %channel%."
  throttled: "Deve attendere %seconds% secondo/i prima di inviare un altro messaggio."
  limit_reached: "Limite messaggi raggiunto per %target%."
  ignored: "Non può inviare messaggi a questo destinatario, è nella sua lista ignore."
  cannot_send_to_self: "Non può inviare un messaggio a se stesso."
  message_too_long: "Messaggio troppo lungo. Il massimo è %max% caratteri."
  service_disabled_for_target: "Il servizio messaggi è disabilitato per %target%."

# --- READ ------------------------------------------------------------------
read:
  syntax: "READ [#canale] <numero>"
  short: "Legge un messaggio per numero."
  help: |-
    Legge il messaggio con il numero indicato. Senza #canale, legge dalla casella
    del tuo nickname. Con #canale, richiede il livello MEMOREAD.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #aiuto 2"
  header: "Messaggio #%index% da %from%:"
  footer: "%separator% %date%"
  not_found: "Messaggio #%index% non trovato."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST [#canale]"
  short: "Elenca i messaggi (non letti marcati con * rosso)."
  help: |-
    Elenca i tuoi messaggi o quelli del canale. Quelli non letti sono contrassegnati
    con un asterisco rosso e un'anteprima (max 50 caratteri). Senza #canale = la
    tua casella; con #canale richiede MEMOREAD.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #aiuto"
  header: "Messaggi per %target%:"
  empty: "Nessun messaggio per %target%."

# --- DEL -------------------------------------------------------------------
del:
  syntax: "DEL [#canale] <numero>"
  short: "Elimina un messaggio per numero."
  help: |-
    Elimina il messaggio con il numero indicato. Per i canali richiede il livello
    MEMOCHANGE.
  example: "%command_prefix%DEL 1"
  examples:
    - "%command_prefix%DEL #aiuto 2"
  deleted: "Messaggio #%index% eliminato."
  not_found: "Messaggio #%index% non trovato."

# --- IGNORE ----------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#canale] <nickname>|DEL [#canale] <nickname>|LIST [#canale]}"
  short: "Gestisce la lista ignore per i messaggi."
  help: |-
    Gestisce i nickname da cui non vuoi ricevere messaggi, sia nel tuo account sia
    in un canale registrato. Per modificare la lista di un canale serve il permesso
    MEMOCHANGE.
  example: "%command_prefix%IGNORE ADD Anna"
  examples:
    - "%command_prefix%IGNORE DEL #aiuto Anna"
    - "%command_prefix%IGNORE LIST #aiuto"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#canale] <nickname>"
    short: "Aggiunge un nickname alla lista degli ignorati."
    help: |-
      I messaggi da questo nickname non saranno accettati per la sua casella (o quella
      del canale).
    example: "%command_prefix%IGNORE ADD Anna"
    examples:
      - "%command_prefix%IGNORE ADD #aiuto Anna"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#canale] <nickname>"
    short: "Rimuove un nickname dalla lista."
    help: "Rimuove il nickname dalla lista ignore."
    example: "%command_prefix%IGNORE DEL Anna"
    examples:
      - "%command_prefix%IGNORE DEL #aiuto Anna"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#canale]"
    short: "Mostra i nickname ignorati."
    help: "Mostra la lista dei nickname che lei (o il canale) ignora per i messaggi."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #aiuto"
  added: "%nickname% aggiunto alla lista ignore."
  removed: "%nickname% rimosso dalla lista ignore."
  already_ignored: "%nickname% è già nella lista ignore."
  not_ignored: "%nickname% non è nella lista ignore."
  limit_reached_nick: "Limite lista ignore raggiunto per il suo nickname (max %limit%)."
  limit_reached_channel: "Limite lista ignore raggiunto per %channel% (max %limit%)."
  list_empty: "Lista ignore vuota."
  list_header: "Lista ignore:"

# --- ENABLE ----------------------------------------------------------------
enable:
  syntax: "ENABLE [#canale]"
  short: "Abilita la ricezione dei messaggi."
  help: |-
    Attiva la ricezione dei messaggi per il tuo nickname; nei canali può farlo solo
    il fondatore.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #aiuto"
  enabled_nick: "Servizio messaggi abilitato per il suo nickname."
  enabled_channel: "Servizio messaggi abilitato per il canale %channel%."
  already_enabled_nick: "Il servizio messaggi è già abilitato per il suo nickname."
  already_enabled_channel: "Il servizio messaggi è già abilitato per %channel%."
  founder_only: "Solo il fondatore del canale può abilitare i messaggi per %channel%."

# --- DISABLE ---------------------------------------------------------------
disable:
  syntax: "DISABLE [#canale]"
  short: "Disabilita la ricezione dei messaggi."
  help: |-
    Disattiva la ricezione dei messaggi per il tuo nickname o canale. Nei canali
    può disattivarla solo il fondatore.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #aiuto"
  disabled_nick: "Servizio messaggi disabilitato per il suo nickname."
  disabled_channel: "Servizio messaggi disabilitato per il canale %channel%."
  already_disabled_nick: "Il servizio messaggi è già disabilitato per il suo nickname."
  already_disabled_channel: "Il servizio messaggi è già disabilitato per %channel%."
  founder_only: "Solo il fondatore del canale può disabilitare i messaggi per %channel%."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [comando] [opzione]"
  short: "Elenca i comandi o mostra l'aiuto per un comando."
  help: "Mostra l'elenco dei comandi o l'aiuto dettagliato per un comando o un'opzione."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permette di inviare e ricevere messaggi tra utenti registrati e di inviare
    avvisi
    ai canali. I messaggi vengono conservati per consultarli in seguito, anche se il
    destinatario non è connesso.
  general_header: "Comandi disponibili:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opzioni:"
  examples_header: "Esempi:"
  general_help_command: "HELP <comando>"
  option_help_command: "HELP %command% <opzione>"
  general_footer: "Usa /msg %bot% %help_command% per maggiori informazioni."
  set_sub_footer: "Usa /msg %bot% %help_command% per maggiori informazioni."
  syntax_label: "Sintassi: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Messaggi"
    preferences: "Preferenze"
  ircop_header: "Comandi disponibili per gli IRCop:"

# --- NOTIFY ----------------------------------------------------------------
notify:
  nick_pending: "Hai %count% messaggio/i da leggere. Per elencarli: /msg %bot% %list%"
  channel_pending: "Il canale %channel% ha %count% messaggio/i da leggere. Consultali con /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS ---
registration_decision:
  accepted: "La tua richiesta di registrazione per %channel% è stata approvata."
  rejected: "La tua richiesta di registrazione per %channel% è stata rifiutata."
  reason: "Motivo: %reason%"
  restriction: "Disponibile dal: %date%"

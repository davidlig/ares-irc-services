# Traduções de mensagens comuns — Português
# Domínio: common
#
# Códigos de formatação IRC (aspas duplas ou blocos literais !irc):
#   \x02        ativa/desativa o negrito
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermelho, 07=laranja, 14=cinzento escuro)
#   \x03        repõe a cor
#   \x0F        repõe toda a formatação
#
# As cores IRC usam números DECIMAIS (0-15), não hexadecimais.
#   \x0314 = cinzento escuro (14 decimal): CORRETO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multilinha: !irc |- com quebras de linha e espaços reais.
# Os blocos sem etiqueta não descodificam escapes; preserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O apresentador acrescenta /msg sem cor e uma margem de dois espaços.

# --- UNKNOWN COMMAND -------------------------------------------------------
unknown_command: "\x0304✗\x03\x0F Comando desconhecido \x0303%command%\x03\x0F. Utilize /msg %bot% \x0303HELP\x03\x0F"

# --- UNKNOWN HELP OPTION ---------------------------------------------------
unknown_help_option: "\x0304✗\x03\x0F Opção de ajuda \x0303%option%\x03\x0F desconhecida para \x0303%command%\x03\x0F. Utilize /msg %bot% \x0303HELP %command%\x03\x0F"

# --- ERROR -----------------------------------------------------------------
error:
  email_domain_blocked: "Este domínio de email está bloqueado administrativamente."
  syntax: "Sintaxe incorreta. Uso: %syntax%"
  oper_only: "Este comando é restrito a Operadores de IRC."
  not_identified: "Não está identificado. Utilize /msg %nickserv% IDENTIFY <nickname> <palavra-passe>"
  permission_denied: "Permissão negada. Não tem acesso a este comando."
  mail_failed: "O email não pôde ser enviado. Verifique o seu endereço ou tente novamente mais tarde."
  channel_not_registered: "O canal %channel% não está registado."
  nick_not_registered: "O nickname %nickname% não está registado."
  insufficient_access: "Acesso insuficiente para %operation% no canal %channel%."
  nick_not_online: "O nickname %nickname% não está ligado."

# --- DURATION --------------------------------------------------------------
duration:
  unit:
    year:
      singular: "ano"
      plural: "anos"
    month:
      singular: "mês"
      plural: "meses"
    day:
      singular: "dia"
      plural: "dias"
    hour:
      singular: "hora"
      plural: "horas"
    minute:
      singular: "minuto"
      plural: "minutos"
    second:
      singular: "segundo"
      plural: "segundos"
  list_separator: ", "
  list_join: "%prefix% e %last%"

# --- ANTIFLOOD -------------------------------------------------------------
antiflood:
  blocked: "Excedeu o limite de comandos. Tente novamente dentro de %seconds% segundos."
  debug_channel: "%nick% limite de %command% atingido para %host% (%seconds%s restantes)"

# --- CTCP ------------------------------------------------------------------
ctcp:
  version:
    tribute: |
      \x02Ao meu leal e eterno amigo,\x02

      Embora 2023 tenha sido o ano em que tivemos de nos despedir, o tempo não
      apagou um único detalhe teu. Continuo a recordar a tua energia inesgotável,
      o teu olhar nobre e aquela alegria imensa e contagiante que só tu sabias dar.

      Encheste a minha casa de vida e a minha vida de um amor incondicional que nunca
      esquecerei. Embora já não ouça os teus passos a correr para me receber nem sinta
      a tua cabeça a apoiar-se em mim à procura de carinho, sei que o teu espírito
      brincalhão continua a acompanhar-me.

      Obrigado por cada momento, por cada travessura e por teres sido o melhor
      companheiro que poderia desejar. O espaço que deixaste ao meu lado está agora
      cheio das recordações mais felizes. Serás sempre o meu grande amigo e terás
      sempre um lugar imenso no meu coração.

# --- DEBUG -----------------------------------------------------------------
debug:

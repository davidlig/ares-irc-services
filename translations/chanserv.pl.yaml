  set_sub_footer: "\x0310ℹ\x03\x0F Użyj /msg %bot% \x02\x0303HELP %command% <opcja>\x03\x0F, aby uzyskać więcej informacji."
  syntax_label: "Składnia: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0304⚠\x03\x0F UWAGA: Nieużywane przez ponad \x1F\x0304%days% dni\x03\x1F kanały są automatycznie usuwane."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_info: "Rejestracja i informacje"
    access_levels: "Dostęp i poziomy"
    ranks_entry: "Rangi i wejście"
  ircop_group:
    channel_operations: "Operacje kanału"
    channel_management: "Zarządzanie kanałem"
    deletion: "Usuwanie i przywracanie"
    restrictions: "Ograniczenia"
    lookup: "Wyszukiwanie i dochodzenie"
    registration_approval: "Zatwierdzanie rejestracji"
  ircop_header: "\x02 ■ Dostępne komendy dla operatorów IRC:\x02"

# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#kanał> <nick>"
  example: "%command_prefix%\x02\x0303OP #kanał Alicia\x03\x0F"
  short: "Nadaj tryb operatora kanału."
  help: "Nadaj tryb operatora kanału."
  done: "\x0303✔\x03 \x02%nickname%\x02 otrzymał status operatora kanału."
  user_not_on_channel: "\x0304✗\x03 Nick \x02%nickname%\x02 nie jest w sieci."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 nadaje \x0304%mode%\x03 dla \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#kanał> <nick>"
  example: "%command_prefix%\x02\x0303DEOP #kanał Alicia\x03\x0F"
  short: "Odbierz tryb operatora kanału."
  help: "Odbierz tryb operatora kanału."
  done: "\x0303✔\x03 \x02%nickname%\x02 stracił status operatora."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 Przy włączonym SECURE, \x02%nickname%\x02 musi mieć co najmniej poziom \x02%level%\x02 aby otrzymać \x02%mode%\x02."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#kanał> <opcja> [wartość]"
  example: "%command_prefix%\x02\x0303SET #kanał DESC Kanał społecznościowy\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #kanał URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #kanał MLOCK ON\x03\x0F"
  short: "Zmień opcje kanału."
  help: "Zmienia opcję kanału. Pomoc dla każdej opcji opisuje jej wymagania i warianty."
  unknown_option: "\x0304✗\x03 Nieznana opcja \x02%option%\x02. Użyj jednej z: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Użyj SET <#kanał> FOUNDER <nick> <token> z potwierdzonym tokenem obecnego założyciela."
    token_unavailable: "Obecny założyciel nie ma potwierdzonego tokenu ratunkowego. Musi najpierw się uwierzytelnić i użyć VERIFY."
    syntax: "SET <#kanał> FOUNDER <nick> [token]"
    example: "%command_prefix%\x02\x0303SET #kanał FOUNDER Alicia\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanał FOUNDER Alicia token-confirmado\x03\x0F"
    short: "Przekaż kanał innemu zarejestrowanemu nickowi."
    help: |-
      Zmienia założyciela po zweryfikowaniu tokenu obecnego założyciela. Zachowuje
      się administracyjny wyjątek poziomu założyciela. Token nie jest zużywany.
    invalid_token: "Token ratunkowy jest nieprawidłowy."
    updated: "\x0303✔\x03 Założyciel został zmieniony na \x02%nickname%\x02."
    throttled: "Zbyt wiele błędnych tokenów. Spróbuj ponownie za %minutes% minut."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 musi być zarejestrowany i aktywowany."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 jest zawieszony i nie może zostać ustawiony jako założyciel."
    cannot_be_self: "\x0304✗\x03 Nowy założyciel nie może być obecnym założycielem."
    cannot_be_successor: "\x0304✗\x03 Nowy założyciel nie może być następcą kanału."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 osiągnął maksymalną liczbę %max% zarejestrowanych kanałów."
    notice_channel: "\x02%from%\x02 ustanawia \x02%nickname%\x02 jako założyciela kanału."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#kanał> SUCCESSOR [nick]"
    example: "%command_prefix%\x02\x0303SET #kanał SUCCESSOR Alicia\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanał SUCCESSOR\x03\x0F"
    short: "Ustaw następcę kanału."
    help: |-
      Ustawia pseudonim jako następcę kanału. Pominięcie pseudonimu usuwa obecnego
      następcę. Pseudonim musi być zarejestrowany i aktywowany.
    cleared: "\x0303✔\x03 Następca został wyczyszczony."
    updated: "\x0303✔\x03 Następca został ustawiony na \x02%nickname%\x02."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 musi być zarejestrowany i aktywowany."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 jest zawieszony i nie może zostać ustawiony jako następca."
    cannot_be_founder: "\x0304✗\x03 Założyciel nie może być ustawiony jako następca."
    notice_channel: "\x02%from%\x02 ustanawia \x02%nickname%\x02 jako następcę kanału."
    notice_channel_cleared: "\x02%from%\x02 wyczyścił następcę kanału."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#kanał> DESC <opis>"
    example: "%command_prefix%\x02\x0303SET #kanał DESC Kanał społecznościowy\x03\x0F"
    short: "Zmień opis kanału."
    help: "Zmień opis kanału (wymagane)."
    updated: "\x0303✔\x03 Opis został zaktualizowany."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#kanał> URL [url]"
    example: "%command_prefix%\x02\x0303SET #kanał URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanał URL\x03\x0F"
    short: "Ustaw URL kanału."
    help: "Zmienia adres strony internetowej kanału. Pomiń URL, aby go usunąć."
    updated: "\x0303✔\x03 URL został zaktualizowany."
    cleared: "\x0303✔\x03 URL został wyczyszczony."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#kanał> EMAIL [e-mail]"
    example: "%command_prefix%\x02\x0303SET #kanał EMAIL zespol@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanał EMAIL\x03\x0F"
    short: "Ustaw e-mail kanału."
    help: |-
      Zmienia adres e-mail kanału. Pomiń adres, aby go usunąć.
      Administracyjnie zablokowane domeny email nie są dozwolone. Wyjątek
      administracyjny: operatorzy z dostępem na poziomie założyciela.
    invalid: "\x0304✗\x03 Nieprawidłowy adres e-mail."
    updated: "\x0303✔\x03 E-mail został zaktualizowany."
    cleared: "\x0303✔\x03 E-mail został wyczyszczony."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#kanał> ENTRYMSG [wiadomość]"
    example: "%command_prefix%\x02\x0303SET #kanał ENTRYMSG Witamy\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanał ENTRYMSG\x03\x0F"
    short: "Ustaw wiadomość wejściową kanału."
    help: "Ustawia wiadomość powitalną kanału (NOTICE). Pomiń wiadomość, aby ją usunąć."
    updated: "\x0303✔\x03 Wiadomość wejściowa została zaktualizowana."
    too_long: "\x0304✗\x03 Wiadomość wejściowa nie może przekraczać %max% znaków."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#kanał> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanał TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanał TOPICLOCK OFF\x03\x0F"
    short: "Zablokuj temat kanału."
    help: |-
      Blokuje możliwość zmiany tematu kanału. Po włączeniu obecny temat zostaje
      zapisany i zablokowany.
    on: "\x0303✔\x03 Blokada tematu jest teraz WŁĄCZONA."
    off: "\x0303✔\x03 Blokada tematu jest teraz WYŁĄCZONA."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 włącza TOPICLOCK."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 wyłącza TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#kanał> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanał MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanał MLOCK OFF\x03\x0F"
    short: "Zablokuj tryby kanału."
    help: "Blokuje obecne tryby kanału (np. +nt). Gdy ON, tryby nie mogą być zmieniane."
    no_modes: "brak trybów"
    on: "\x0303✔\x03 MLOCK jest teraz WŁĄCZONY (%modes%)."
    off: "\x0303✔\x03 MLOCK jest teraz WYŁĄCZONY."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 włącza MLOCK (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 wyłącza MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#kanał> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanał PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanał PRIVATE OFF\x03\x0F"
    short: "Ukryj informacje o kanale przed użytkownikami bez dostępu."
    help: |-
      Po włączeniu tylko założyciel i użytkownicy z dostępem mogą przeglądać
      informacje o kanale.
    on: "\x0303✔\x03 Informacje o kanale są teraz prywatne."

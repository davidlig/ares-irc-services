levels:
  syntax: "LEVELS <#kanał> {LIST|SET <poziom> <wartość>|RESET}"
  example: "%command_prefix%LEVELS #kanał LIST"
  examples:
    - "%command_prefix%LEVELS #kanał SET OPDEOP 50"
    - "%command_prefix%LEVELS #kanał RESET"
  short: "Konfiguruj poziomy kanału."
  help: |-

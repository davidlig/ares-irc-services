    - "%command_prefix%\x02\x0303DROP #kanał FORCE\x03\x0F"
  short: "Usuń zarejestrowany kanał."
  help: |-
    Usuwa zarejestrowany kanał z bazy danych.
    FORCE trwale usuwa kanał oczekujący na usunięcie.
    IRCop z uprawnieniem DROP może też natychmiast zwolnić
    odrzuconą rejestrację, z FORCE lub bez. FORCE wymaga dodatkowo DROP_FORCE.
  registration_restricted: "\x0304✗\x03 Ta prośba o rejestrację jest zablokowana do %date%."

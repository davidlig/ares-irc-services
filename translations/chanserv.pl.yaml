    example: "%command_prefix%SET #kanał FOUNDER Alicia"
    examples:
      - "%command_prefix%SET #kanał FOUNDER Alicia token-confirmado"
    short: "Przekaż kanał innemu zarejestrowanemu nickowi."
    help: |-
      Zmienia założyciela po zweryfikowaniu tokenu obecnego założyciela. Zachowuje
      się administracyjny wyjątek poziomu założyciela. Token nie jest zużywany.
    invalid_token: "Token ratunkowy jest nieprawidłowy."
    updated: "Założyciel został zmieniony na %nickname%."
    throttled: "Zbyt wiele błędnych tokenów. Spróbuj ponownie za %minutes% minut."
    must_be_registered: "%nickname% musi być zarejestrowany i aktywowany."
    suspended: "%nickname% jest zawieszony i nie może zostać ustawiony jako założyciel."
    cannot_be_self: "Nowy założyciel nie może być obecnym założycielem."
    cannot_be_successor: "Nowy założyciel nie może być następcą kanału."
    limit_exceeded: "%nickname% osiągnął maksymalną liczbę %max% zarejestrowanych kanałów."
    notice_channel: "%from% ustanawia %nickname% jako założyciela kanału."

  # --- SET SUCCESSOR -------------------------------------------------------

    notice_off: "%nickname% wyłącza TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#kanał> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #kanał MLOCK ON"
    examples:
      - "%command_prefix%SET #kanał MLOCK OFF"

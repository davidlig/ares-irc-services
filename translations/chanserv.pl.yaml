    Usuwa wszystkie zwykłe bany kanału pasujące do twojej bieżącej tożsamości, w tym symbole wieloznaczne i maski IP/CIDR, zgodnie z regułami IRCd.
    Wymaga identyfikacji i konfigurowalnego poziomu UNBAN (domyślnie 200). Założyciel zachowuje dostęp; obecność na kanale ani status operatora nie są wymagane.
    Rozszerzone bany pozostają bez zmian. Nie przyjmuje pseudonimu ani maski jako argumentu. Operacja nie jest zapisywana w HISTORY kanału.
  done: "Usunięto %count% banów dotyczących ciebie na %channel%."
  no_matches: "Żaden zwykły ban nie pasuje do twojej tożsamości na %channel%; nic nie zmieniono."

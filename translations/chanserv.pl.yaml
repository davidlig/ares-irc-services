    syntax: "SET <#kanał> DESC <opis>"
    example: "%command_prefix%SET #kanał DESC Kanał społecznościowy"
    short: "Zmień opis kanału."
    help: "Zmień opis kanału (wymagane)."
    updated: "Opis został zaktualizowany."

  # --- SET URL -------------------------------------------------------------

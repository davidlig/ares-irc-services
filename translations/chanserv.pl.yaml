    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "Wyświetla zarejestrowane kanały pasujące do wzorca."
  help: |-
    Wyświetla zarejestrowane kanały pasujące do wzorca. Symbol wieloznaczny *
    dopasowuje dowolny ciąg znaków. Numer strony jest opcjonalny i zaczyna się od 1.

    syntax: "SET <#kanał> SUCCESSOR [nick]"
    example: "%command_prefix%SET #kanał SUCCESSOR Alicia"
    examples:
      - "%command_prefix%SET #kanał SUCCESSOR"
    short: "Ustaw następcę kanału."
    help: |-
      Ustawia pseudonim jako następcę kanału. Pominięcie pseudonimu usuwa obecnego
      następcę. Pseudonim musi być zarejestrowany i aktywowany.
    cleared: "Następca został wyczyszczony."
    updated: "Następca został ustawiony na %nickname%."
    must_be_registered: "%nickname% musi być zarejestrowany i aktywowany."
    suspended: "%nickname% jest zawieszony i nie może zostać ustawiony jako następca."
    cannot_be_founder: "Założyciel nie może być ustawiony jako następca."
    notice_channel: "%from% ustanawia %nickname% jako następcę kanału."
    notice_channel_cleared: "%from% wyczyścił następcę kanału."

  # --- SET DESC ------------------------------------------------------------

  help: |-
    Tymczasowo dezaktywuje zarejestrowany kanał. Formaty czasu: 0 = bezterminowo,
    1d, 12h, 60m.
    Podczas zawieszenia tryby, dostęp i egzekwowanie zasad kanału są wyłączone.
  success: "Kanał %channel% został zawieszony do %duration%."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#kanał> {ADD <maska> [wygaśnięcie] [powód]|DEL {<maska>|<numer>}|LIST}"
  example: "%command_prefix%AKICK #kanał ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #kanał ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #kanał DEL *!*@*"
    - "%command_prefix%AKICK #kanał DEL 2"
    - "%command_prefix%AKICK #kanał LIST"
  short: "Zarządzaj listą auto-kick."
  help: |-
    Zarządza wpisami automatycznego wyrzucania z kanału i ich opcjonalnym
    wygaśnięciem.
  unknown_sub: "Nieznana podkomenda %sub%. Użyj ADD, DEL lub LIST."
  invalid_mask: "Nieprawidłowy format maski. Użyj nick!ident@host z symbolami wieloznacznymi (*)."
  dangerous_mask: "Maska %mask% jest zbyt szeroka. Musi zawierać co najmniej 4 znaki alfanumeryczne."
  protected_user: "Nick %nickname% ma dostęp na tym kanale."
  max_entries: "Maksymalnie %max% wpisów AKICK na kanał."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#kanał> ADD <maska> [wygaśnięcie] [powód]"
    example: "%command_prefix%AKICK #kanał ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #kanał ADD *!*@* 7d Spam"
    short: "Dodaj wpis AKICK."
    help: |-
      Dodaje maskę do listy automatycznego wyrzucania z kanału.

      Możesz podać czas trwania i powód. Jeśli podasz powód, musisz również określić
      czas: 0 oznacza bezterminowo, d — dni, h — godziny, a m — minuty.
    done: "AKICK %mask% dodany."
    already_exists: "AKICK %mask% już istnieje."
    notice_channel: "%from% dodaje AKICK: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#kanał> DEL {<maska>|<numer>}"
    example: "%command_prefix%AKICK #kanał DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #kanał DEL 2"
    short: "Usuń wpis AKICK."
    help: "Usuń według dokładnej maski lub numeru wpisu z LIST."
    not_found: "AKICK %mask% nie znaleziony."
    done: "AKICK %mask% usunięty."
    notice_channel: "%from% usuwa AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#kanał> LIST"
    example: "%command_prefix%AKICK #kanał LIST"
    short: "Lista wpisów AKICK."
    help: "Pokazuje maskę, powód, wygaśnięcie i kto dodał."
    header: "Lista AKICK dla %channel%"
    empty: "Kanał %channel% nie ma wpisów AKICK."
    entry: "#%index% %mask% %reason% (przez %nickname%, wygasa: %expiration%)"


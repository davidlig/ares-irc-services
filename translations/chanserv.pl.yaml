# Tłumaczenia ChanServ — Polski
# Domena: chanserv
#
# Kody formatowania IRC (podwójne cudzysłowy lub bloki literalne !irc):
#   \x02        włącza/wyłącza pogrubienie
#   \x03NN      kolor (DZIESIĘTNIE: 03=zielony, 04=czerwony, 07=pomarańczowy, 14=ciemnoszary)
#   \x03        resetuje kolor
#   \x0F        resetuje całe formatowanie
#
# Kolory IRC używają liczb DZIESIĘTNYCH (0-15), nie szesnastkowych.
#   \x0314 = ciemnoszary (14 dziesiętnie): POPRAWNIE
#   \x030F = kolor 0, a po nim litera F: BŁĄD
#
# Wielowierszowy tekst IRC: !irc |- z rzeczywistymi podziałami wierszy i spacjami.
# Bloki bez tagu nie dekodują sekwencji ucieczki; zachowaj literały CTCP.
# Przykłady HELP: example/examples i %command_prefix%.
# Prezenter dodaje /msg bez koloru i margines dwóch spacji.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Nieprawidłowa nazwa kanału. Użyj \x02#kanał\x02."
  generic: "\x0304✗\x03 Wystąpił błąd. Proszę spróbować ponownie."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#kanał> <opis>"
  example: "%command_prefix%\x02\x0303REGISTER #kanał Projekt społecznościowy\x03\x0F"
  short: "Zarejestruj kanał."
  help: |-
    Zarejestruj kanał i powiąż go ze swoim pseudonimem. Uwierzytelnij się przez
    %nickserv%.
    W trybie APPROVAL IRCop musi zatwierdzić prośbę.
  success: "\x0303✔\x03 Kanał \x02%channel%\x02 został zarejestrowany."
  already_registered: "\x0304✗\x03 Kanał \x02%channel%\x02 jest już zarejestrowany lub trwa jego rejestracja."
  channel_not_on_network: "\x0304✗\x03 Kanał \x02%channel%\x02 nie istnieje w sieci."
  pending_deletion: "\x0304✗\x03 Kanał \x02%channel%\x02 oczekuje na usunięcie i nie może być zarejestrowany."
  insufficient_channel_rank: "\x0304✗\x03 Musisz mieć co najmniej status operatora na \x02%channel%\x02, aby zarejestrować kanał."
  limit_exceeded: "\x0304✗\x03 Osiągnąłeś maksymalną liczbę %max% zarejestrowanych kanałów."
  throttled: "\x0304✗\x03 Musisz poczekać \x02%minutes%\x02 minut(y) przed zarejestrowaniem kolejnego kanału."

  awaiting_approval: "\x0307✔\x03 Prośba o rejestrację \x02%channel%\x02 oczekuje na zatwierdzenie IRCopa."
  restricted_indefinite: "\x0304✗\x03 Nowe prośby dla \x02%channel%\x02 są bezterminowo zablokowane."
  restricted_until: "\x0304✗\x03 Nowe prośby dla \x02%channel%\x02 są zablokowane do %date%"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%\x02\x0303REGMODE APPROVAL\x03\x0F"
  short: "Ustaw lub sprawdź tryb rejestracji kanałów."
  help: |-
    Ustaw tryb rejestracji na DIRECT lub APPROVAL albo sprawdź STATUS.
    DIRECT to tryb domyślny, który zachowuje natychmiastową rejestrację.

  status: "\x0307ℹ\x03 Tryb rejestracji kanałów to \x02%mode%\x02."
  changed: "\x0303✔\x03 Tryb rejestracji kanałów zmieniono na \x02%mode%\x02."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [strona]|ACCEPT <#kanał>|REJECT <#kanał> <powód>}"
  pending.syntax: "CREG PENDING [strona]"
  pending.example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  pending.short: "Wyświetl oczekujące prośby o rejestrację."
  pending.help: "Wyświetla oczekujące prośby na ograniczonej stronie."
  accept.syntax: "CREG ACCEPT <#kanał>"
  accept.example: "%command_prefix%\x02\x0303CREG ACCEPT #canal\x03\x0F"
  accept.short: "Zatwierdź prośbę o rejestrację kanału."
  accept.help: "Ponownie sprawdza wnioskodawcę i aktywuje oczekującą rejestrację."
  reject.syntax: "CREG REJECT <#kanał> <powód>"
  reject.example: "%command_prefix%\x02\x0303CREG REJECT #canal Motivo público\x03\x0F"
  reject.short: "Odrzuć prośbę o rejestrację kanału."
  reject.help: "Odrzuca prośbę z wymaganym powodem i ograniczeniem."
  example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  short: "Rozpatruj prośby o rejestrację kanałów."
  help: |-
    Wyświetla oczekujące prośby albo zatwierdza lub odrzuca prośbę.
    Odrzucenie wymaga powodu. Kanał rejestruje tylko ACCEPT.

  pending_header: "\x0314Oczekujące rejestracje (strona %page%)\x03"
  pending_item: "  %channel% — wnioskodawca %requester%, wysłano %submitted%: %description%"
  accepted: "\x0303✔\x03 Rejestracja \x02%channel%\x02 została zatwierdzona."
  rejected: "\x0303✔\x03 Rejestracja \x02%channel%\x02 została odrzucona."
  not_pending: "\x0304✗\x03 Kanał \x02%channel%\x02 nie ma oczekującej rejestracji."
  channel_not_on_network: "\x0304✗\x03 Kanału \x02%channel%\x02 nie ma w sieci."
  founder_limit: "\x0304✗\x03 Wnioskodawca osiągnął limit rejestracji kanałów."
  requester_inactive: "\x0304✗\x03 Konto wnioskodawcy nie jest już aktywne."
  requester_ineligible: "\x0304✗\x03 Wnioskodawca musi obecnie mieć uprawnienia operatora kanału."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <#kanał>"
  example: "%command_prefix%\x02\x0303STATUS #canal\x03\x0F"
  header: "\x02Stan kanału \x0307%channel%\x03\x02"
  short: "Pokaż stan rejestracji kanału."
  help: |-
    Pokazuje, czy kanał jest niezarejestrowany, oczekuje na zatwierdzenie,
    został odrzucony lub jest zarejestrowany.
    Szczegóły odrzucenia widzi tylko wnioskodawca i uprawnieni IRCopowie.

  unregistered: "  \x0314Stan                    \x03: Niezarejestrowany"
  pending: "  \x0314Stan                    \x03: \x0307Oczekuje na zatwierdzenie\x03"
  registered: "  \x0314Stan                    \x03: \x0303Zarejestrowany\x03"
  suspended: "  \x0314Stan                    \x03: \x0304Zawieszony\x03"
  forbidden: "  \x0314Stan                    \x03: \x0304Zabroniony\x03"
  pending_deletion: "  \x0314Stan                    \x03: \x0307Oczekuje na usunięcie\x03"
  rejected_private: "  \x0314Stan                    \x03: \x0304Rejestracja odrzucona\x03"
  rejected: "  \x0314Stan                    \x03: \x0304Rejestracja odrzucona\x03"
  rejection_reason: "  \x0314Powód                   \x03: %reason%"
  rejection_audit: "  \x0314Odrzucono przez         \x03: %operator% dnia %date%"
  restriction_until: "  \x0314Dostępny od             \x03: %date%"
  footer: "\x0314─────────────────────────────\x03\x0F"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#kanał>"
  example: "%command_prefix%\x02\x0303INFO #kanał\x03\x0F"
  short: "Pokaż informacje o kanale."
  help: |-
    Wyświetla szczegółowe informacje o zarejestrowanym kanale, w tym właściciela,
    dane rejestracji, ostatnią aktywność i opcje konfiguracji.
  header: "\x02Informacje o kanale \x0307%channel%\x03\x02"
  founder: "  \x0314Założyciel\x03             : \x02%nickname%\x02"
  registered: "  \x0314Zarejestrowany\x03         : %date%"
  successor: "  \x0314Następca\x03               : \x02%nickname%\x02"
  description: "  \x0314Opis\x03                   : %desc%"
  url: "  \x0314URL\x03                    : %url%"
  email: "  \x0314E-mail\x03                 : %email%"
  last_used: "  \x0314Ostatnio użyty\x03         : %date%"
  topic: "  \x0314Ostatni temat\x03          : %topic%"
  topic_set_by: "  \x0314Temat ustawiony przez\x03  : %nickname%"
  options: "  \x0314Opcje\x03                  : %options%"
  private: "\x0304✗\x03 Informacje o kanale \x02%channel%\x02 są prywatne."
  no_expire: "  \x0314Nigdy nie wygasa\x03       : Tak"
  mlock_modes: "  \x0314Blokada trybów\x03         : %modes%"
  suspended_status: "  \x0314Status\x03                 : \x0304Zawieszony\x03"
  suspended_reason: "  \x0314Powód\x03                  : %reason%"
  suspended_until: "  \x0314Koniec\x03                 : %date%"
  suspended_permanent: "  \x0314Koniec\x03                 : Stałe"
  forbidden_status: "  \x0314Status\x03                 : \x0304Zabroniony\x03"
  forbidden_reason: "  \x0314Powód\x03                  : %reason%"
  pending_deletion_status: "  \x0314Status\x03             : \x0307Oczekuje na usunięcie\x03"
  pending_deletion_at: "  \x0314Usunięty\x03           : %date%"
  pending_deletion_until: "  \x0314Trwale usunięcie\x03   : %date%"
  pending_deletion_notice: "  \x0307Ten kanał jest zamrożony i nie może zostać zarejestrowany.\x03"

# --- HELP ------------------------------------------------------------------
help:
  examples_header: "\x02 ■ Przykłady:\x02"
  syntax: "HELP [komenda] [opcja]"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
  short: "Lista komend lub pomoc dla komendy."
  help: "Wyświetla dostępne polecenia i szczegółową pomoc dotyczącą ich opcji."
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Umożliwia rejestrowanie i zarządzanie kanałami, konfigurowanie ich opcji oraz
    kontrolowanie dostępu. Zarządza poziomami dostępu i uprawnieniami użytkowników,
    aby kanał pozostawał pod kontrolą osób odpowiedzialnych.
  general_header: "\x02 ■ Dostępne komendy:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Opcje:\x02"

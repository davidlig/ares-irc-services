# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#kanał> {ADD|DEL|LIST} [maska] [wygaśnięcie] [powód]"
  example: "%command_prefix%\x02\x0303AKICK #kanał ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #kanał ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanał DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanał DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanał LIST\x03\x0F"
  short: "Zarządzaj listą auto-kick."
  help: |-
    Zarządza wpisami automatycznego wyrzucania z kanału i ich opcjonalnym
    wygaśnięciem.
  unknown_sub: "\x0304✗\x03 Nieznana podkomenda \x02%sub%\x02. Użyj ADD, DEL lub LIST."
  invalid_mask: "\x0304✗\x03 Nieprawidłowy format maski. Użyj \x02nick!ident@host\x02 z symbolami wieloznacznymi (*)."
  dangerous_mask: "\x0304✗\x03 Maska \x02%mask%\x02 jest zbyt szeroka. Musi zawierać co najmniej 4 znaki alfanumeryczne."
  protected_user: "\x0304✗\x03 Nick \x02%nickname%\x02 ma dostęp na tym kanale."
  max_entries: "\x0304✗\x03 Maksymalnie %max% wpisów AKICK na kanał."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#kanał> ADD <maska> [wygaśnięcie] [powód]"
    example: "%command_prefix%\x02\x0303AKICK #kanał ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #kanał ADD *!*@* 7d Spam\x03\x0F"
    short: "Dodaj wpis AKICK."
    help: |-
      Dodaje maskę do listy automatycznego wyrzucania z kanału.

      Możesz podać czas trwania i powód. Jeśli podasz powód, musisz również określić
      czas: 0 oznacza bezterminowo, d — dni, h — godziny, a m — minuty.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 dodany."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 już istnieje."
    notice_channel: "\x02%from%\x02 dodaje AKICK: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#kanał> DEL <maska|numer>"
    example: "%command_prefix%\x02\x0303AKICK #kanał DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #kanał DEL 2\x03\x0F"
    short: "Usuń wpis AKICK."
    help: "Usuń według dokładnej maski lub numeru wpisu z LIST."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 nie znaleziony."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 usunięty."
    notice_channel: "\x02%from%\x02 usuwa AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#kanał> LIST"
    example: "%command_prefix%\x02\x0303AKICK #kanał LIST\x03\x0F"
    short: "Lista wpisów AKICK."
    help: "Pokazuje maskę, powód, wygaśnięcie i kto dodał."
    header: "\x0303Lista AKICK dla \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Kanał \x02%channel%\x02 nie ma wpisów AKICK."
    entry: "  #%index% %mask% %reason% (przez %nickname%, wygasa: %expiration%)"


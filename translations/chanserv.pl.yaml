  short: "Wyrzuć wszystkich użytkowników z kanału."
  help: |-
    Wyrzuca wszystkich użytkowników z kanału. Polecenie wyłącznie dla IRCop;
    w razie pominięcia powodu używany jest domyślny.
  not_on_network: "\x0304✗\x03 Kanał \x02%channel%\x02 obecnie nie jest w sieci."

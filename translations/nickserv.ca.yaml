# Traduccions de NickServ — Català
# Domini: nickserv
#
# Codis de format IRC (cometes dobles o blocs literals !irc):
#   \x02        activa/desactiva la negreta
#   \x03NN      color (DECIMAL: 03=verd, 04=vermell, 07=taronja, 14=gris fosc)
#   \x03        restableix el color
#   \x0F        restableix tot el format
#
# Els colors IRC usen números DECIMALS (0-15), no hexadecimals.
#   \x0314 = gris fosc (14 decimal): CORRECTE
#   \x030F = color 0 seguit de la lletra F: ERROR
#
# Text IRC multilínia: !irc |- amb salts físics i espais reals.
# Els blocs sense etiqueta no descodifiquen escapes; conserva els literals CTCP.
# Exemples HELP: example/examples i %command_prefix%.
# El presentador afegeix /msg sense color i un marge de dos espais.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    El registre està pendent, però no s’ha pogut lliurar el testimoni.
    Espera que caduqui abans de registrar-te de nou.
  syntax: "REGISTER <contrasenya> [email]"
  short: "Registrar el vostre sobrenom amb els serveis."
  help: |-
    Registra el teu sobrenom. La xarxa t'indicarà el token de verificació
    per xat o per correu, segons la seva configuració.
    Un cop validat, serà el teu token de recuperació permanent:
    guarda'l en un lloc segur.
    La caducitat de %duration% només s'aplica abans de validar-lo.
    No s’admeten dominis de correu bloquejats administrativament.
  example: "%command_prefix%REGISTER Clau$egura_123"
  examples:
    - "%command_prefix%REGISTER Clau$egura_123 usuari@exemple.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "S'ha enviat un token de verificació a %email%."
  pending_line_2: "Executa /msg %bot% %verify% per completar el registre."
  pending_line_3: "No t'arriba? Revisa el correu brossa o fes servir /msg %bot% %resend%"
  pending_line_4: "El token caducarà d'aquí a %duration%."
  already_registered: "El sobrenom %nickname% ja està registrat."
  already_pending: "El registre de %nickname% està pendent. Fes servir %verify%. Si el token s'ha enviat per correu i hi ha una adreça vàlida associada, en pots sol·licitar un altre amb %resend%."
  forbidden: "El sobrenom %nickname% no es pot registrar en aquesta xarxa."
  pending_deletion: "El sobrenom %nickname% està pendent d'eliminació i no pot ser registrat."
  invalid_email: "L'adreça de correu proporcionada no és vàlida."
  email_already_used: "El correu %email% ja està en ús per un altre sobrenom. Utilitzeu una adreça diferent."
  throttled: "Heu d'esperar %minutes% minut(s) abans d'intentar registrar-vos de nou."
  guest_prefix_forbidden: "No podeu registrar un sobrenom que comenci amb %prefix%."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirma un registre o testimoni de rescat."
  help: |-
    Un cop validat, aquest token serà el teu token de recuperació permanent.
    Guarda'l en un lloc segur: el podràs fer servir per recuperar el sobrenom.
    La caducitat de %duration% només s'aplica abans de validar-lo.
  example: "%command_prefix%VERIFY <token-rebut>"
  success: "El sobrenom %nickname% s'ha registrat amb èxit i ara esteu identificat."
  success_native: "El sobrenom %nickname% s'ha registrat correctament. Utilitzeu l'autenticació nativa que es mostra a continuació."
  invalid_token: "El testimoni de rescat no és vàlid."
  no_pending: "No teniu cap registre pendent per verificar."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "No pots sol·licitar un altre token amb %resend% perquè aquest registre l'envia directament per xat."
  syntax: "RESEND"
  short: "Reenviar el token de verificació al vostre correu."
  help: |-
    RESEND només està disponible si el token de verificació s'ha enviat per correu.
    Un cop validat, aquest token serà el teu token de recuperació permanent.
    Guarda'l en un lloc segur: el podràs fer servir per recuperar el sobrenom.
    La caducitat de %duration% només s'aplica abans de validar-lo.
    Si fas servir RESEND, rebràs un token nou per correu.
    El termini del registre pendent es renovarà durant %duration%.
  example: "%command_prefix%RESEND"
  success: "Token de verificació reenviat a %email%."
  no_pending: "No teniu cap registre pendent per verificar."
  throttled: "Heu d'esperar %minutes% minut(s) abans de sol·licitar un altre correu de verificació."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "No hi ha cap correu establert per al sobrenom %nickname%. La recuperació no està disponible."
  email_sent: "S'ha enviat un token de recuperació a %email_hint%. Comproveu la vostra bústia (i la carpeta de correu brossa)."
  pending_deletion: "El sobrenom %nickname% està pendent d’eliminació i no es pot recuperar."
  instructions: "EMAIL: %command_0% sol·licita un testimoni provisional per correu. TOKEN: proporciona el testimoni confirmat. %command_1% accepta el del correu o el confirmat. El del correu substitueix el desat només en validar-lo. Utilitzar el desat ofereix un reemplaçament opcional amb %command_2%; ignora el missatge per conservar l’actual."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <nickname> [token]"
  short: "Recuperar el vostre sobrenom si heu perdut la contrasenya."
  help: |-
    Si no tens el token, demana'n un de provisional per correu.
    També pots proporcionar un token de recuperació vàlid; si és
    provisional, substituirà el token desat només després de validar-lo.
    Quan facis servir el token desat, se t'oferirà un reemplaçament opcional
    amb VERIFY; ignora aquest missatge si vols conservar l'actual.
  example: "%command_prefix%RECOVER Usuari"
  examples:
    - "%command_prefix%RECOVER Usuari <token-rebut>"
  pending: "El registre de %nickname% està pendent. Fes servir %command_0%. Si el token s'ha enviat per correu i hi ha una adreça vàlida associada, en pots sol·licitar un altre amb %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "El sobrenom %nickname% està suspès. Motiu: %reason%"
  forbidden: "El sobrenom %nickname% no es pot utilitzar en aquesta xarxa."
  throttled: "Massa testimonis incorrectes. Torna-ho a provar d’aquí a %minutes% minut(s)."
  invalid_token: "El testimoni de rescat no és vàlid."
  success_identify: "Contrasenya restablerta. Identifiqueu-vos ara: %identify_cmd%"
  success_then_change: "Després, canvia la contrasenya: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <contrasenya-nova>"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <password>"
  short: "Identificar-vos com a propietari d'un sobrenom."
  help: |-
    Autentica la sessió amb %nickserv% fent servir el sobrenom i la contrasenya.
    Després d'identificar-te correctament rebràs el mode registrat %emphasis_0%.
    Si fas servir un sobrenom de convidat, es restaura el sobrenom registrat.
  example: "%command_prefix%IDENTIFY Usuari <contrasenya>"
  native_syntax: "/NICK <nickname>:<password> | /NICK <nickname>!<password>"
  native_short: "Mostra la sintaxi d’autenticació nativa per canvi de sobrenom."
  native_help: |-
    Fes servir %emphasis_0% o, si el
    sobrenom està ocupat, %emphasis_1%.
  native_example: "/NICK Usuari:<contrasenya>"
  native_examples:
    - "%command_prefix%/NICK Usuari!<contrasenya>"
  native_authentication: "Aquest protocol gestiona l’autenticació mitjançant canvis de sobrenom. Utilitzeu %command_0% o, si el sobrenom està ocupat, %command_1%."
  native_authentication_command_0: "/NICK <nickname>:<password>"
  native_authentication_command_1: "/NICK <nickname>!<password>"
  success: "Ara esteu identificat com a %nickname%."
  already_identified: "Ja esteu identificat com a %nickname%."
  invalid_credentials: "Contrasenya incorrecta. Torneu-ho a provar."
  locked_out: "Massa intents fallits. Torneu-ho a provar d'aquí a %minutes% minut(s)."
  ghost_released: "La sessió fantasma que retenia %nickname% ha estat desconnectada."
  kill_reason: "Sobrenom %nickname% reclamat per %source% (el propietari registrat s'ha identificat)"
  pending: |-
    %first%
    %second%
  pending_line_1: "El sobrenom %nickname% està pendent de verificació del correu electrònic."
  pending_line_2: "Executa /msg %bot% %command_0% o /msg %bot% %command_1%"
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "El sobrenom %nickname% està suspès. Motiu: %reason%"
  forbidden: "El sobrenom %nickname% no es pot utilitzar en aquesta xarxa."
  pending_deletion: "El sobrenom %nickname% està pendent d'eliminació i no pot ser utilitzat."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <nickname>"
  short: "Mostrar l'estat de registre d'un sobrenom."
  help: |-
    Mostra l'estat actual d'un sobrenom: si està registrat,
    pendent de verificació, suspès, etc.
  example: "%command_prefix%STATUS Usuari"
  header: "Estat del sobrenom %nickname%"
  unregistered: "  Estat           : No registrat"
  not_registered_offline: "  Estat           : %state%"
  value_not_registered_offline: "No registrat"
  pending: "  Estat           : %state%"
  value_pending: "Verificació pendent"
  pending_expires: "  Expira en       : %minutes% minut(s)"
  pending_expires_at: "  Expira el       : %date%"
  not_connected: "  Estat           : %state%"
  value_not_connected: "No connectat"
  not_identified: "  Estat           : %state%"
  value_not_identified: "No identificat"
  identified: "  Estat           : %state%"
  value_identified: "Identificat"
  suspended: "  Estat           : %state%"
  value_suspended: "Suspès"
  suspended_reason: "  Motiu           : %reason%"
  suspended_until: "  Acaba el        : %date%"
  suspended_permanent: "  Acaba el        : Permanent"
  forbidden: "  Estat           : %state%"
  value_forbidden: "Prohibit"
  forbidden_reason: "  Motiu           : %reason%"
  pending_deletion: "  %label%          : %state%"
  value_pending_deletion: "Pendent d'eliminació"
  label_pending_deletion: "Estat"
  pending_deletion_at: "  %label%        : %date%"

  label_pending_deletion_at: "Eliminat"
# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <nickname>"
  short: "Mostrar informació sobre un sobrenom registrat."
  help: |-
    Mostra les dades de registre d'un sobrenom: data d'alta, estat de
    connexió, darrer missatge de sortida i correu electrònic.

    El correu només és visible per al propietari identificat.
    Si el sobrenom és privat, només el propietari i els operadors IRC
    poden veure'n la informació.
  example: "%command_prefix%INFO Usuari"
  private: "La informació del sobrenom %nickname% és privada."
  header: "Informació del sobrenom %nickname%"
  status: "%label%                 : %status%"
  label_status: "Estat"
  status_registered: "Registrat"
  status_suspended: "Suspès"
  status_forbidden: "Prohibit"
  status_pending_deletion: "Pendent d'eliminació"
  reason: "%label%                 : %reason%"
  label_reason: "Motiu"
  suspended_until: "%label%              : %date%"
  label_suspended_until: "Acaba el"
  suspended_permanent: "%label%              : Permanent"
  label_suspended_permanent: "Acaba el"
  registered_at: "%label%             : %date%"
  label_registered_at: "Registrat"
  last_seen_online: "%label%           : %online%"
  label_last_seen_online: "Darrer vist"
  value_last_seen_online: "EN LÍNIA ARA"
  last_seen_at: "%label%           : %date%"
  label_last_seen_at: "Darrer vist"
  last_seen_never: "%label%           : Mai"
  label_last_seen_never: "Darrer vist"
  last_quit: "%label%  : %message%"
  label_last_quit: "Darrer miss. sortida"
  last_connect: "%label%    : %ip% (%host%)"
  label_last_connect: "Darrer vist des de"
  language: "%label%                : %language%"
  label_language: "Idioma"
  email: "%label%                : %email%"
  label_email: "Correu"
  vhost: "%label%                 : %vhost%"
  label_vhost: "VHost"
  no_expire: "%label%            : Sí"

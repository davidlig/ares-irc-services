  channels_entry_successor: "%channel% (%role%)"
  channels_role_successor: "Successor"
  channels_entry_access: "%channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <new_password>|EMAIL <email> <token>|LANGUAGE <code>|TIMEZONE <timezone>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Canviar les opcions del teu sobrenom."
  help: |-
    Modifica la configuració del teu sobrenom. T'has d'haver identificat per canviar
    aquestes opcions.
  example: "%command_prefix%SET LANGUAGE ca"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Opció desconeguda %option%. Opcions disponibles: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <new_password>"
    short: "Canviar la contrasenya del vostre sobrenom."
    help: |-
      Canvia la contrasenya del vostre sobrenom. La nova contrasenya
      té efecte immediatament. Trieu una contrasenya forta d'almenys 6 caràcters
      que no utilitzeu en altres serveis.
    example: "%command_prefix%SET PASSWORD Clau$egura_123"
    success: "La vostra contrasenya s'ha actualitzat correctament."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Utilitza %value% amb el testimoni de rescat confirmat."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Canvia el correu electrònic amb el teu token de recuperació validat."
    help: |-
      SET EMAIL canvia el correu de contacte després de
      validar el token de recuperació, sense consumir-lo.
      Comprova el format i la unicitat; no envia confirmació.
      No s’admeten dominis de correu bloquejats administrativament.
    example: "%command_prefix%SET EMAIL usuari@exemple.com <token-validat>"
    success: "El vostre correu s'ha actualitzat a %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "S'ha enviat un token de confirmació a %current_email%."
    pending_line_2: "Per confirmar el canvi a %new_email%, executa:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "El token caduca al cap d'1 hora."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "El token no és vàlid o ha expirat. Sol·liciteu-ne un de nou amb %value%."
    invalid_token_value: "SET EMAIL <new_email>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <code>"
    short: "Canviar l'idioma que els serveis utilitzen per comunicar-se amb vós."
    help: |-
      Canvia l'idioma que %nickserv% i altres serveis utilitzen quan us parlen.
      Idiomes disponibles:
      %emphasis_0% (Català)
      %emphasis_1% (Alemany)
      %emphasis_2% (Grec)
      %emphasis_3% (Anglès)
      %emphasis_4% (Espanyol)
      %emphasis_5% (Basc)
      %emphasis_6% (Francès)
      %emphasis_7% (Gallec)
      %emphasis_8% (Italià)
      %emphasis_9% (Neerlandès)
      %emphasis_10% (Polonès)
      %emphasis_11% (Portuguès)
      %emphasis_12% (Romanès)
      %emphasis_13% (Turc)
    example: "%command_prefix%SET LANGUAGE ca"
    success: "Idioma canviat a %language%."
    invalid: "Idioma no admès. Idiomes disponibles: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <timezone>"
    short: "Establir la zona horària utilitzada en mostrar dates."
    help: |-
      Estableix la zona horària per a les dates de
      %nickserv%. Consulta HELP SET TIMEZONE per veure les
      regions. Fes servir OFF per eliminar-la.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Zona horària establerta a %timezone%. Les dates es mostraran en aquesta zona horària."
    cleared: "Zona horària esborrada. Les dates utilitzaran el valor predeterminat de la xarxa."
    invalid: "Zona horària no vàlida %timezone%. Utilitzeu un identificador vàlid (p. ex. UTC, Europe/Madrid)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Mostra o amaga la informació del teu sobrenom."
    help: |-
      Controla la visibilitat de la informació del vostre sobrenom a l'ordre INFO.
      Amb %emphasis_0% només vós i els operadors d'IRC podeu veure els vostres detalls.
      Amb %emphasis_1% la vostra informació és pública per a tothom.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "La informació del vostre sobrenom ara és %value%."
    on_value: "privada"
    off: "La informació del vostre sobrenom ara és %value%."
    off_value: "pública"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Canvia la manera com els serveis es comuniquen amb tu."
    help: |-
      Controla com %nickserv% i la resta de serveis t'envien missatges.
      Amb %emphasis_0%, les respostes s'envien com a %emphasis_1%.
      Amb %emphasis_2%, les respostes s'envien com a %emphasis_3%.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Els missatges del servei s'enviaran ara com a %value%."
    on_value: "PRIVMSG"
    off: "Els missatges del servei s'enviaran ara com a %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Estableix o elimina el teu host virtual."
    help: |-
      Estableix un nom d'amfitrió personalitzat que veuran altres usuaris quan
      t'hagis identificat.

      Per eliminar-lo, executa %emphasis_0% sense indicar cap valor.

      Només s'admeten lletres (a-z, A-Z), dígits, guions i punts.
      Cada segment ha de començar i acabar amb una lletra o un dígit.
      El nom d'amfitrió pot tenir fins a 48 caràcters i ha de ser únic per sobrenom.
    example: "%command_prefix%SET VHOST usuari.exemple.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "El vostre amfitrió virtual s'ha establert a %vhost%."
    cleared: "El vostre amfitrió virtual s'ha esborrat."
    invalid: "Vhost no vàlid. Només lletres, dígits, guionet i punt (no al principi/final de bloc); màx. 48 caràcters."
    taken: "Aquest vhost ja està en ús per un altre sobrenom."
    forced: "El vostre vhost es configura automàticament i no es pot canviar amb SET VHOST."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <sobrenom> {PASSWORD <nova_contrasenya>|EMAIL <nou_correu>|LANGUAGE <codi>|TIMEZONE {<zona_horària>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Modificar la configuració d'un altre sobrenom."
  help: |-
    Permet que un IRCop canviï la configuració d'un altre sobrenom registrat. No
    admet sobrenoms de Root, IRCop ni serveis.
  example: "%command_prefix%SASET Usuari PRIVATE ON"
  examples:
    - "%command_prefix%SASET Usuari TIMEZONE OFF"
  unknown_option: "Opció desconeguda %option%. Opcions disponibles: %options%."
  cannot_modify_oper: "No es pot modificar un sobrenom d'Operador d'IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <sobrenom> PASSWORD <nova_contrasenya>"
    short: "Canviar la contrasenya d'un sobrenom."
    help: "Canvia la contrasenya d'un altre sobrenom. El canvi és immediat."
    example: "%command_prefix%SASET Usuari PASSWORD ClauSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <sobrenom> EMAIL <nou_correu>"
    short: "Canviar el correu electrònic d'un sobrenom."
    help: |-
      Canvia el correu electrònic d'un altre sobrenom. El canvi és immediat i no
      requereix el token de recuperació ni envia cap correu de confirmació.
      BADMAIL no restringeix aquest canvi administratiu de correu.
    example: "%command_prefix%SASET Usuari EMAIL usuari@exemple.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <sobrenom> LANGUAGE <codi>"
    short: "Canviar l'idioma d'un sobrenom."
    help: |-
      Canvia l'idioma d'un altre sobrenom. S'admeten
      en (anglès) i ca (català).
    example: "%command_prefix%SASET Usuari LANGUAGE ca"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <sobrenom> TIMEZONE {<zona_horària>|OFF}"
    short: "Canviar la zona horària d'un sobrenom."
    help: |-
      Estableix o elimina la zona horària d'un altre
      sobrenom. Fes servir OFF per eliminar-la.
    example: "%command_prefix%SASET Usuari TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Usuari TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <sobrenom> PRIVATE {ON|OFF}"
    short: "Canviar la privadesa d'un sobrenom."
    help: "Activa o desactiva la privadesa de la informació d'un altre sobrenom."
    example: "%command_prefix%SASET Usuari PRIVATE ON"
    examples:
      - "%command_prefix%SASET Usuari PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <sobrenom> MSG {ON|OFF}"
    short: "Canviar la preferència de missatges d'un sobrenom."
    help: |-
      Estableix si un altre sobrenom rep respostes com a
      PRIVMSG (ON) o NOTICE (OFF).
    example: "%command_prefix%SASET Usuari MSG ON"
    examples:
      - "%command_prefix%SASET Usuari MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <sobrenom> VHOST [vhost]"
    short: "Canviar l'amfitrió virtual d'un sobrenom."
    help: |-
      Estableix o elimina l'host virtual d'un altre sobrenom.
      Per eliminar-lo, executa SASET <sobrenom> VHOST sense valor.
    example: "%command_prefix%SASET Usuari VHOST usuari.exemple.org"
    examples:
      - "%command_prefix%SASET Usuari VHOST"

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [command]"
  short: "Mostrar l'ajuda de les ordres de %nickserv%."
  help: |-
    Mostra l'ajuda general de %nickserv% o informació detallada
    per a una ordre específica.
  examples_header: "Exemples:"
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP SET"
    - "%command_prefix%HELP SET EMAIL"
    - "%command_prefix%HELP SET TIMEZONE Europe"
  header_title: "%bot%"
  header: "%title%"
  navigation_marker: ""
  info_marker: ""
  error_marker: ""
  warning_marker: ""
  intro: |-
    Permet registrar i protegir el teu sobrenom perquè
    altres usuaris no el puguin fer servir. Gestiona la
    seguretat del compte, personalitza les preferències
    i recupera l'accés quan ho necessitis.
  intro_expiration: "%label%: Els sobrenoms inactius més de %duration% s'esborren."
  intro_expiration_duration: "%days% dies"
  intro_expiration_label: "NOTA"
  general_header: "Comandes disponibles:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opcions:"
  general_syntax: "HELP <comanda>"
  general_footer: "Fes servir /msg %bot% %syntax% per obtenir més informació."
  set_sub_syntax: "HELP %command% <opció>"
  set_sub_footer: "Fes servir /msg %bot% %syntax% per obtenir més informació."
  syntax_label: "Sintaxi: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    registration_auth: "Registre i autenticació"
    account_security: "Compte i seguretat"
  ircop_group:
    lookup: "Consulta i investigació"
    account_management: "Gestió de comptes"
    suspensions_bans: "Suspensions i prohibicions"
    deletion: "Eliminació i restauració"
  ircop_header: "Comandes disponibles per als IRCops:"
  set_timezone:
    index_label: "Zones per regió (fes servir %syntax% per consultar una regió):"
    index_syntax: "HELP SET TIMEZONE <region>"
    region_header: "Zones horàries per a %region%:"
    region_unknown: "Regió desconeguda. Utilitzeu %syntax% per a l'índex."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "El sobrenom %nickname% està registrat. Se us canviarà el nom si no us identifiqueu."
  renamed_to: |-
    T'han canviat el sobrenom a %guest_nick%. Per recuperar el teu sobrenom:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <contrasenya>"
  nick_forbidden: "El sobrenom %nickname% està prohibit: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Obtenir l'adreça IP real i el nom d'amfitrió del sobrenom."
  help: |-
    Mostra l'adreça IP i el nom d'amfitrió reals d'un sobrenom.
    Fes-la servir amb responsabilitat: és informació sensible.
  example: "%command_prefix%USERIP Usuari"
  result: "Sobrenom: %nickname% | IP: %ip% | Amfitrió: %host%"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Troba nicks per l'adreça IP de la seva darrera connexió identificada."
  help: |-
    Mostra els sobrenoms registrats l'última connexió identificada dels quals
    ha fet servir aquesta adreça IP. L'adreça desada pot estar desactualitzada.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "No hi ha cap nick registrat que coincideixi amb aquesta IP."
  header: "Sobrenoms coincidents:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <duration> <motiu>"
  short: "Suspendre un sobrenom."
  help: |-
    Impedeix que el propietari s'identifiqui. La durada es pot expressar en dies
    (d), hores (h), minuts (m) o 0 per a una suspensió permanent. No es poden
    suspendre operadors IRC ni usuaris Root.
  example: "%command_prefix%SUSPEND UsuariDolent 7d Correu brossa a #ajuda"
  examples:
    - "%command_prefix%SUSPEND UsuariProblematic 0 Evasió de la prohibició"
  success: "El sobrenom %nickname% ha estat suspès fins a %duration%."
  already_suspended: "El sobrenom %nickname% ja està suspès."
  forbidden: "El sobrenom %nickname% està prohibit i no es pot suspendre."
  cannot_suspend_oper: "No es pot suspendre l'operador d'IRC %nickname%."
  cannot_suspend_root: "No es pot suspendre l'usuari root %nickname%."
  cannot_suspend_service: "No es pot suspendre el sobrenom de servei %nickname%."
  invalid_duration: "Durada no vàlida. Utilitzeu: %duration_format% (p. ex., 7d, 12h, 30m) o %permanent% per a permanent."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Treure la suspensió d'un sobrenom."
  help: "Retira una suspensió activa perquè el propietari es pugui tornar a identificar."
  example: "%command_prefix%UNSUSPEND Usuari"
  success: "S'ha aixecat la suspensió de %nickname%."
  not_suspended: "El sobrenom %nickname% no està suspès."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Forçar el canvi de nom d'un sobrenom connectat a un sobrenom aleatori."
  help: |-
    Força un sobrenom connectat a canviar a un nom aleatori amb un prefix definit
    per la xarxa.
  example: "%command_prefix%RENAME UsuariProblematic"
  cannot_rename_root: "No es pot reanomenar l'usuari root %nickname%."
  cannot_rename_oper: "No es pot reanomenar l'operador d'IRC %nickname%."
  cannot_rename_service: "No es pot reanomenar el sobrenom de servei %nickname%."
  success: "El sobrenom %nickname% ha estat reanomenat a %new_nick%."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Eliminar un sobrenom registrat."
  help: |-
    Marca un sobrenom registrat per eliminar-lo durant el període de gràcia; es pot
    restaurar amb RESTORE. Afegeix FORCE per eliminar-lo definitivament. No es poden
    eliminar usuaris Root, IRCops ni serveis, ni tampoc el teu propi sobrenom.
  force:
    short: "Elimina definitivament un sobrenom pendent d'eliminació."
  example: "%command_prefix%DROP CompteAntic"
  examples:
    - "%command_prefix%DROP CompteAntic FORCE"
  suspended: "El sobrenom %nickname% està suspès. Traieu la suspensió primer."
  forbidden: "El sobrenom %nickname% està prohibit."
  cannot_drop_root: "No es pot eliminar l'usuari root %nickname%."
  cannot_drop_oper: "No es pot eliminar l'operador d'IRC %nickname%."
  cannot_drop_self: "No podeu eliminar el vostre propi sobrenom."
  success: "El sobrenom %nickname% ha estat marcat per a eliminació i pot ser restaurat durant el període de gràcia."
  force_success: "El sobrenom %nickname% ha estat eliminat permanentment."
  pending_deletion: "El sobrenom %nickname% ja està pendent d'eliminació. Utilitza DROP <nickname> FORCE per eliminar-lo permanentment."
  cannot_drop_service: "No es pot eliminar el sobrenom de servei %nickname%."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Restaurar un sobrenom pendent d'eliminació."
  help: |-
    Restaura un sobrenom pendent d'eliminació mentre encara sigui dins del període
    de gràcia.
  example: "%command_prefix%RESTORE CompteAntic"
  success: "El sobrenom %nickname% ha estat restaurat."
  not_pending_deletion: "El sobrenom %nickname% no està pendent d'eliminació."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <motiu>"
  short: "Bloquejar permanentment l'ús d'un sobrenom."
  help: |-
    Prohibeix permanentment un sobrenom perquè ningú no
    el pugui registrar ni fer servir. Si està registrat,
    s'elimina; si està connectat, se'l força a canviar a
    un sobrenom aleatori. No es poden prohibir usuaris
    Root, IRCops ni serveis.
  example: "%command_prefix%FORBID UsuariDolent Incompliments reiterats de la política"
  success: "El sobrenom %nickname% ha estat prohibit."
  updated: "El motiu de prohibició de %nickname% ha estat actualitzat."
  reason_required: "Heu de proporcionar un motiu per a la prohibició."
  cannot_forbid_root: "No es pot prohibir l'usuari root %nickname%."
  cannot_forbid_oper: "No es pot prohibir l'operador d'IRC %nickname%."
  cannot_forbid_service: "No es pot prohibir el sobrenom de servei %nickname%."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Treure una prohibició de sobrenom."
  help: "Retira la prohibició perquè es pugui tornar a fer servir el sobrenom."
  example: "%command_prefix%UNFORBID SobrenomProhibit"
  success: "El sobrenom %nickname% ja no està prohibit."
  not_forbidden: "El sobrenom %nickname% no està prohibit."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <pattern>|DEL <pattern>|LIST}"
  short: "Gestionar els patrons de vhost prohibits."
  help: |-
    Gestiona els patrons que impedeixen hosts virtuals
    coincidents amb SET VHOST. * coincideix amb qualsevol
    seqüència i ? amb un caràcter. Calen privilegis
    d'operador IRC.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Subordre desconeguda %sub%. Utilitzeu ADD, DEL o LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <pattern>"
    short: "Afegir un patró de vhost prohibit."
    help: |-
      Afegeix un patró a la llista. Es bloquejaran els hosts
      virtuals coincidents mitjançant SET VHOST. * coincideix
      amb qualsevol seqüència i ? amb un caràcter.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Patró de vhost prohibit afegit: %pattern%"
    already_exists: "El patró %pattern% ja existeix."
    invalid: "Format de patró de vhost no vàlid."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <pattern>"
    short: "Treure un patró de vhost prohibit."
    help: "Elimina un patró de la llista d'hosts virtuals prohibits."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Patró de vhost prohibit tret: %pattern%"
    not_found: "Patró %pattern% no trobat."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Llistar tots els patrons de vhost prohibits."
    syntax: "FORBIDVHOST LIST"
    help: "Mostra tots els patrons d'host virtual prohibits."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Patrons de vhost prohibits (%count%):"
    entry: "%index%. %pattern% — per %nickname% (%date%)"
    empty: "No hi ha patrons de vhost prohibits."

# --- HISTORY ---
history:
  syntax: "HISTORY <nickname> {ADD <message>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Veure o gestionar l'historial d'accions del sobrenom."
  help: |-
    Consulta i gestiona l'historial d'accions d'un sobrenom. Registra automàticament
    les suspensions, els canvis de contrasenya o de correu i les recuperacions.
    VIEW mostra tres entrades per pàgina; ALL mostra tot l'historial.
  example: "%command_prefix%HISTORY Usuari VIEW"
  examples:
    - "%command_prefix%HISTORY Usuari VIEW ALL"
    - "%command_prefix%HISTORY Usuari ADD Nota manual"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <message>"
    short: "Afegir una entrada manual a l'historial."
    help: "Afegeix una entrada manual a l'historial del sobrenom."
    example: "%command_prefix%HISTORY Usuari ADD Avís per correu brossa"
    success: "Entrada d'historial afegida per a %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "Esborrar una entrada de l'historial per ID."
    help: "Elimina una entrada concreta de l'historial pel seu ID."
    example: "%command_prefix%HISTORY Usuari DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [PAGE|ALL]"
    short: "Veure l'historial d'accions del sobrenom."
    help: |-
      Mostra l'historial d'accions del sobrenom. Per defecte, mostra tres entrades
      per pàgina. Fes servir ALL per veure-les totes.
    example: "%command_prefix%HISTORY Usuari VIEW"
    examples:
      - "%command_prefix%HISTORY Usuari VIEW 2"
      - "%command_prefix%HISTORY Usuari VIEW ALL"
    header: "%heading% (mostrant %start%-%end% de %total%):"
    header_title: "Historial de %nickname%"
    entry: "#%id% [%date%] %action% per %operator% — %message%"
    no_entries: "No s'han trobat entrades d'historial per a %nickname%."
    page_hint: "Utilitzeu %command% per a més entrades."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Esborrar totes les entrades d'historial d'un sobrenom."
    help: "Elimina irreversiblement totes les entrades de l'historial del sobrenom."
    example: "%command_prefix%HISTORY Usuari CLEAR"
    success: "S'han esborrat %count% entrades d'historial de %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Compte activat"
  resend: "Correu de verificació reenviat"
  noexpire_on: "Protecció de caducitat activada"
  noexpire_off: "Protecció de caducitat desactivada"
  userip: "Consulta USERIP"
  history_clear: "Historial esborrat"
  password_changed_owner: "Contrasenya canviada pel propietari"
  password_changed_operator: "Contrasenya canviada per l'operador"
  email_changed_owner: "Correu canviat de %old_email% a %new_email%"
  email_changed_operator: "Correu canviat a %new_email% per l'operador"
  recover: "Contrasenya restablerta via token de correu"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Correu anterior: %value%"
  new_email: "Correu nou: %value%"
  method: "Mètode: %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Establir o treure la protecció contra l'expiració d'un sobrenom."
  help: |-
    Controla si el sobrenom caduca per inactivitat.
    ON n'evita la caducitat i OFF aplica les regles normals.
  example: "%command_prefix%NOEXPIRE Usuari ON"
  examples:
    - "%command_prefix%NOEXPIRE Usuari OFF"
  success_on: "El sobrenom %nickname% ara està protegit contra l'expiració."
  success_off: "El sobrenom %nickname% ara expirarà normalment."
  forbidden: "El sobrenom %nickname% està prohibit."
  suspended: "El sobrenom %nickname% està suspès."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <patró> [pàgina]"
  short: "Llista els sobrenoms registrats que coincideixen amb un patró."
  help: |-
    Llista sobrenoms registrats que coincideixen amb el
    patró. * coincideix amb qualsevol seqüència; la pàgina
    opcional comença per 1.
  example: "%command_prefix%LIST Usuari*"
  examples:
    - "%command_prefix%LIST Usuari* 2"
  header: "Sobrenom | Registre | Última connexió | IP | Estat"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Cap sobrenom coincideix amb el patró %pattern%."
  status_pending: "Pendent"
  status_registered: "Registrat"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Administrar el mode de registre de la xarxa."
  help: |-
    Configura el mode de registre dels comptes nous.

    %emphasis_0% Envia el token de verificació al correu electrònic de l'usuari.
    %emphasis_1% Lliura el token de verificació directament per IRC.
    %emphasis_2% Mostra el mode de registre actual sense modificar-lo.

    Els registres pendents mantenen el mode amb què s'han iniciat.

    En mode TOKEN, l'ordre RESEND continua desactivada per a tots els usuaris.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Mode de registre actual: %mode%."
  changed: "Mode de registre canviat a %mode%."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: |-
    Testimoni de rescat: %token_display%

    Desa aquest testimoni en un lloc segur. El necessitaràs per recuperar el teu sobrenom si oblides la contrasenya.

    Per confirmar-lo, utilitza: /msg %bot% %verify%

    %warning%
  issued_warning: "IMPORTANT: Només és vàlid l’últim testimoni generat. Un cop confirmat, no es tornarà a mostrar. No el comparteixis amb ningú."
  confirmed: "El testimoni de rescat s’ha confirmat. Desa’l en un lloc segur."
  unavailable: "Autentica’t i confirma el testimoni de rescat amb %command_0% abans d’utilitzar aquesta operació."
  unavailable_command_0: "VERIFY"
  locked_out: "Massa testimonis incorrectes. Torna-ho a provar d’aquí a %seconds% segons."
  throttled: "Massa testimonis incorrectes. Torna-ho a provar d’aquí a %minutes% minut(s)."
  replaced: "El testimoni de recuperació s’ha substituït pel del correu que acabes de validar. Desa’l en un lloc segur."
  optional_replacement: |-
    Nou testimoni de recuperació opcional: %token_display%

    Per substituir el testimoni actual, utilitza: /msg %bot% %verify%

    L’actual continua sent vàlid fins a la confirmació.

    Si no el vols canviar, ignora aquest missatge.
  replacement_unavailable: "La contrasenya s’ha restablert, però no s’ha pogut emetre un testimoni nou. L’actual continua sent vàlid."
  temporarily_unavailable: "El lliurament del testimoni de recuperació no està disponible temporalment. Torna-ho a provar més tard."


# Μεταφράσεις OperServ — Ελληνικά
# Τομέας: operserv
#
# Κωδικοί μορφοποίησης IRC (διπλά εισαγωγικά ή κυριολεκτικά μπλοκ !irc):
#   \x02        ενεργοποίηση/απενεργοποίηση έντονης γραφής
#   \x03NN      χρώμα (ΔΕΚΑΔΙΚΟ: 03=πράσινο, 04=κόκκινο, 07=πορτοκαλί, 14=σκούρο γκρι)
#   \x03        επαναφορά χρώματος
#   \x0F        επαναφορά όλης της μορφοποίησης
#
# Τα χρώματα IRC χρησιμοποιούν ΔΕΚΑΔΙΚΟΥΣ αριθμούς (0-15), όχι δεκαεξαδικούς.
#   \x0314 = σκούρο γκρι (14 δεκαδικό): ΣΩΣΤΟ
#   \x030F = χρώμα 0 και μετά το γράμμα F: ΛΑΘΟΣ
#
# Πολυγραμμικό κείμενο IRC: !irc |- με πραγματικές αλλαγές γραμμής και κενά.
# Τα μπλοκ χωρίς ετικέτα δεν αποκωδικοποιούν διαφυγές· διατηρήστε τα CTCP.
# Παραδείγματα HELP: example/examples και %command_prefix%.
# Ο παρουσιαστής προσθέτει άχρωμο /msg και περιθώριο δύο κενών.

# --- ERROR --------------------------------------------------------------------
error:
  root_only: "Αυτή η εντολή περιορίζεται σε root διαχειριστές του δικτύου."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [εντολή] [επιλογή]"
  short: "Λίστα εντολών ή βοήθεια για μια εντολή."
  help: |-
    Χωρίς ορίσματα εμφανίζει όλες τις εντολές. Χρησιμοποιήστε %help_command% για
    πλήρη βοήθεια ή %help_option_command% για υποεπιλογές.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Σας επιτρέπει να διαχειρίζεστε τους χειριστές του δικτύου και τα δικαιώματά
    τους, να εφαρμόζετε περιορισμούς πρόσβασης και να αποσυνδέετε χρήστες. Επιτρέπει
    επίσης την αποστολή γενικών ανακοινώσεων και τη διαχείριση των μηνυμάτων
    καλωσορίσματος του δικτύου.
  general_header: "Διαθέσιμες εντολές:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Επιλογές:"
  examples_header: "Παραδείγματα:"
  general_help_command: "HELP <εντολή>"
  option_help_command: "HELP %command% <επιλογή>"
  detail_help_command: "HELP <εντολή>"
  detail_help_option_command: "HELP <εντολή> <επιλογή>"
  general_footer: "Χρησιμοποιήστε /msg %bot% %help_command% για περισσότερες πληροφορίες."
  set_sub_footer: "Χρησιμοποιήστε /msg %bot% %help_command% για περισσότερες πληροφορίες."
  syntax_label: "Σύνταξη: %syntax%"
  footer: ""
  intro_expiration: "ΣΗΜΕΙΩΣΗ: Τα ψευδώνυμα που δεν χρησιμοποιούνται για περισσότερες από %days% ημέρες διαγράφονται αυτόματα."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operators και ρόλοι"
    network_security: "Ασφάλεια δικτύου"
    communication: "Επικοινωνία"
    low_level: "Χαμηλό επίπεδο"
  ircop_header: "Διαθέσιμες εντολές για IRC operators:"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <nickname> <ρόλος>|DEL <nickname>|LIST}"
  short: "Διαχείριση IRC operators του δικτύου."
  help: |-
    Διαχείριση IRC operators του δικτύου. ADD προσθέτει ένα καταχωρημένο
    ψευδώνυμο ως operator με τον καθορισμένο ρόλο.
    DEL αφαιρεί έναν operator. LIST εμφανίζει όλους τους operators.
    Χρησιμοποιήστε ROLE LIST για να δείτε τους διαθέσιμους ρόλους.
    Αυτή η εντολή περιορίζεται σε Root χρήστες που έχουν διαμορφωθεί στις υπηρεσίες.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Άγνωστη υπο-εντολή %sub%. Χρησιμοποιήστε ADD, DEL ή LIST."
  unknown_role: "Ο ρόλος %role% δεν υπάρχει. Χρησιμοποιήστε /msg %bot% %role_list% για να δείτε τους διαθέσιμους ρόλους."
  already_admin: "Ο/Η %nickname% είναι ήδη IRC operator (ρόλος: %role%)."
  not_admin: "Ο/Η %nickname% δεν είναι IRC operator."
  role_changed: "Άλλαξε ο ρόλος για %nickname% από %old% σε %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nickname> <role>"
    short: "Προσθήκη IRC operator δικτύου."
    help: |-
      Προσθέτει ένα καταχωρημένο ψευδώνυμο ως IRC operator δικτύου.
      Χρησιμοποιήστε ROLE LIST για να δείτε τους διαθέσιμους ρόλους.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "Προστέθηκε ο/η %nickname% ως %role%."
    nick_not_active: "Το ψευδώνυμο %nickname% δεν είναι ενεργό καταχωρημένο ψευδώνυμο."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nickname>"
    short: "Αφαίρεση IRC operator δικτύου."
    help: |-
      Αφαιρεί έναν IRC operator δικτύου από τη λίστα.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "Αφαιρέθηκε ο/η %nickname% από τους IRC operators."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Λίστα όλων των IRC operators δικτύου."
    help: |-
      Εμφανίζει όλους τους IRC operators δικτύου με τους ρόλους και την ημερομηνία
      καταχώρησης.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%IRCOP LIST"
    header: "IRC Operators Δικτύου"
    empty: "Δεν υπάρχουν IRC operators."

# --- ROLE ---------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <ρόλος>|SET <ρόλος> [operclass]}"
    short: "Διαχειρίζεται την operclass του UnrealIRCd."
    help: |-
      Εμφανίζει και ρυθμίζει την operclass ενός ρόλου.

      %options_header%
      %option_LIST%Εμφανίζει τις διαθέσιμες operclasses στο δίκτυο.
      %option_VIEW%Εμφανίζει την operclass του ρόλου και τις διαθέσιμες.
      %option_SET%Αναθέτει operclass στους IRCOP κατά την ταυτοποίηση.

      Παραλείψτε την τιμή για να την αφαιρέσετε.

      Διαθέσιμο μόνο σε πρωτόκολλα UnrealIRCd.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SOPORTE"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE"
    list:
      header: "Διαθέσιμες Operclasses στο Δίκτυο"
      empty: "Δεν υπάρχουν διαθέσιμες operclasses στο δίκτυο."
      not_supported: "Το τρέχον πρωτόκολλο δεν υποστηρίζει εμφάνιση διαθέσιμων operclasses."
    view:
      empty: "Ο ρόλος %role% δεν έχει operclass."
      line: "Operclass: %operclass%"
      available: "Διαθέσιμες operclasses: %available%"
    set:
      done: "Η operclass ρυθμίστηκε για τον ρόλο %role%."
      cleared: "Η operclass αφαιρέθηκε από τον ρόλο %role%."
      not_available: "Η operclass %operclass% δεν είναι διαθέσιμη στο δίκτυο. Διαθέσιμες operclasses: %available%."
  syntax: "ROLE {ADD <name> [description]|DEL <name>|LIST|PERMS {{ADD|DEL} <ρόλος> <permission>|{LIST|CLEAR} <ρόλος>}|MODES {VIEW <ρόλος>|SET <ρόλος> [modes]}|VHOST {VIEW <ρόλος>|SET <ρόλος> [pattern]}}"
  short: "Διαχείριση ρόλων operator."
  help: |-
    Διαχείριση ρόλων operator. ADD δημιουργεί νέο ρόλο, DEL τον αφαιρεί,
    LIST εμφανίζει όλους τους ρόλους, PERMS διαχειρίζεται άδειες για έναν ρόλο,
    MODES διαχειρίζεται λειτουργίες IRCOP, VHOST διαχειρίζεται μοτίβο
    αναγκαστικού vhost για έναν ρόλο.
    Οι προστατευμένοι ρόλοι (ADMIN, OPER, PREOPER) δεν μπορούν να διαγραφούν.
    Αυτή η εντολή περιορίζεται σε Root χρήστες.
  syntax_operclass: "ROLE {ADD <name> [description]|DEL <name>|LIST|PERMS {{ADD|DEL} <ρόλος> <permission>|{LIST|CLEAR} <ρόλος>}|MODES {VIEW <ρόλος>|SET <ρόλος> [modes]}|VHOST {VIEW <ρόλος>|SET <ρόλος> [pattern]}|OPERCLASS {LIST|VIEW <name>|SET <name> [operclass]}}"
  help_operclass: |-
    Διαχείριση ρόλων operator. ADD δημιουργεί νέο ρόλο, DEL τον αφαιρεί,
    LIST εμφανίζει όλους τους ρόλους, PERMS διαχειρίζεται άδειες για έναν ρόλο,
    MODES διαχειρίζεται λειτουργίες IRCOP, VHOST διαχειρίζεται μοτίβο αναγκαστικού vhost,
    OPERCLASS διαχειρίζεται την Unreal operclass ενός ρόλου.
    Οι προστατευμένοι ρόλοι (ADMIN, OPER, PREOPER) δεν μπορούν να διαγραφούν.
    Αυτή η εντολή περιορίζεται σε Root χρήστες.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SOPORTE Χειριστές υποστήριξης"
  unknown_sub: "Άγνωστη υπο-εντολή %sub%. Χρησιμοποιήστε ADD, DEL, LIST, PERMS, MODES, ή VHOST."
  unknown_sub_operclass: "Άγνωστη υπο-εντολή %sub%. Χρησιμοποιήστε ADD, DEL, LIST, PERMS, MODES, VHOST ή OPERCLASS."
  not_found: "Ο ρόλος %role% δεν υπάρχει."
  already_exists: "Ο ρόλος %role% υπάρχει ήδη."
  protected: "Ο ρόλος %role% είναι προστατευμένος και δεν μπορεί να διαγραφεί."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <name> [description]"
    short: "Δημιουργία νέου ρόλου."
    help: |-
      Δημιουργεί έναν νέο προσαρμοσμένο ρόλο. Η περιγραφή είναι προαιρετική.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%ROLE ADD SOPORTE Χειριστές υποστήριξης"
    done: "Δημιουργήθηκε ο ρόλος %role%."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <name>"
    short: "Διαγραφή ρόλου."
    help: |-
      Διαγράφει έναν προσαρμοσμένο ρόλο. Οι προστατευμένοι ρόλοι
      (ADMIN, OPER, PREOPER) δεν μπορούν να διαγραφούν.
      Αν ο ρόλος έχει ανατεθειμένους operators,
      πρέπει να τους επανατοποθετήσετε πρώτα.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%ROLE DEL SOPORTE"
    done: "Διαγράφηκε ο ρόλος %role%."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Λίστα όλων των ρόλων."
    help: |-
      Εμφανίζει όλους τους ρόλους. Οι προστατευμένοι ρόλοι
      σημειώνονται με [ΠΡΟΣΤΑΤΕΥΜΕΝΟΣ].
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%ROLE LIST"
    header: "Ρόλοι Operator"
    empty: "Δεν υπάρχουν ρόλοι operator."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <ρόλος> <permission>|{LIST|CLEAR} <ρόλος>}"
    short: "Διαχείριση αδειών ρόλου."
    help: |-
      Διαχείριση αδειών που ανατίθενται σε έναν ρόλο.

      %options_header%
      %option_LIST%Εμφανίζει όλες τις άδειες για τον ρόλο.
      %option_ADD%Αναθέτει μια άδεια στον ρόλο.
      %option_DEL%Αφαιρεί μια άδεια από τον ρόλο (όχι για προστατευμένους ρόλους).
      %option_CLEAR%Αφαιρεί όλες τις άδειες από τον ρόλο.

      Χρησιμοποιήστε ALL για να προσθέσετε όλες τις διαθέσιμες άδειες ταυτόχρονα.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%ROLE PERMS LIST SOPORTE"
    examples:
      - "%command_prefix%ROLE PERMS ADD SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SOPORTE ALL"
      - "%command_prefix%ROLE PERMS DEL SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SOPORTE"
    not_found: "Η άδεια %perm% δεν υπάρχει."
    already_has: "Ο ρόλος %role% έχει ήδη την άδεια %perm%."
    does_not_have: "Ο ρόλος %role% δεν έχει την άδεια %perm%."
    list:
      header: "Λίστα αδειών για %role%"
      columns: "Ανατέθηκε | Κλειδί άδειας | Περιγραφή"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Προστέθηκε η άδεια %perm% στον ρόλο %role%."
      all_done: "Προστέθηκαν %count% άδειες στον ρόλο %role%."
    del:
      done: "Αφαιρέθηκε η άδεια %perm% από τον ρόλο %role%."
    clear:
      done: "Αφαιρέθηκαν %count% άδειες από τον ρόλο %role%."
      empty: "Ο ρόλος %role% δεν έχει ανατεθειμένες άδειες."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <ρόλος>|SET <ρόλος> [modes]}"
    short: "Διαχείριση λειτουργιών χρήστη IRCOP για τον ρόλο."
    help: |-
      Διαχειρίζεται τις λειτουργίες χρήστη IRCOP που ανατίθενται σε ρόλο.

      %options_header%
      %option_VIEW%Εμφανίζει τις τρέχουσες λειτουργίες του ρόλου.
      %option_SET%Ορίζει λειτουργίες IRCOP.

      Παραλείψτε τις λειτουργίες για να αφαιρεθούν όλες.

      Οι χρήστες με αυτόν τον ρόλο λαμβάνουν τις λειτουργίες κατά την ταυτοποίηση.
      Διαθέσιμες λειτουργίες ανά IRCD
      Η εντολή περιορίζεται σε χρήστες Root.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Λειτουργίες για %role%"
      empty: "Ο ρόλος %role% δεν έχει ανατεθειμένες λειτουργίες."
      line: "Λειτουργίες: %modes%"
    set:
      done: "Ορίστηκαν οι λειτουργίες %modes% για τον ρόλο %role%."
      cleared: "Αφαιρέθηκαν όλες οι λειτουργίες από τον ρόλο %role%."
      invalid_mode: "Η λειτουργία %mode% δεν είναι έγκυρη λειτουργία IRCOP."
      invalid_modes: "Μη έγκυρες λειτουργίες: %invalid%. Έγκυρες λειτουργίες: %valid%."
      no_irc_user_modes: "Το τρέχον IRCD δεν έχει διαμορφωμένες λειτουργίες IRCOP."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <ρόλος>|SET <ρόλος> [pattern]}"
    short: "Διαχείριση μοτίβου αναγκαστικού vhost για έναν ρόλο."
    help: |-
      Ορίζει το εικονικό host που λαμβάνουν οι operators ενός ρόλου κατά την
      ταυτοποίηση, αντικαθιστώντας το προσωπικό τους host.

      Το host συνδυάζει το ψευδώνυμο χωρίς ειδικούς χαρακτήρες με το καθορισμένο
      μοτίβο. Παράδειγμα:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Εμφανίζει το μοτίβο host του ρόλου.
      %option_SET%Ορίζει ή αφαιρεί το μοτίβο ενός ρόλου.

      Το μοτίβο δέχεται γράμματα, αριθμούς, παύλες και τελείες. Πρέπει να περιέχει
      τουλάχιστον μία τελεία, να μην αρχίζει ή τελειώνει με παύλα ή τελεία και να μην
      έχει διαδοχικές τελείες.

      Χρησιμοποιήστε SET χωρίς μοτίβο για να αφαιρέσετε το υποχρεωτικό host.

      Η εντολή περιορίζεται σε χρήστες Root.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Αναγκαστικό vhost για %role%"
      empty: "Ο ρόλος %role% δεν έχει ορισμένο μοτίβο αναγκαστικού vhost."
      line: "Μοτίβο: %pattern%"
      example: "Παράδειγμα: %example_nickname%.%pattern%"
      example_nickname: "nickname"
    set:
      done: "Ορίστηκε μοτίβο αναγκαστικού vhost για τον ρόλο %role%."
      cleared: "Αφαιρέθηκε το μοτίβο αναγκαστικού vhost από τον ρόλο %role%."
      invalid: "Μη έγκυρο μοτίβο vhost. Έγκυροι χαρακτήρες: a-z, A-Z, 0-9, - και .. Πρέπει να έχει τουλάχιστον μία τελεία, δεν μπορεί να ξεκινά/τελειώνει με - ή . ή να έχει .."

# --- KILL ---------------------------------------------------------------------
kill:
  syntax: "KILL <nickname> <αιτιολογία>"
  short: "Αναγκαστική αποσύνδεση χρήστη από το δίκτυο."
  help: |-
    Αποσυνδέει έναν χρήστη από το δίκτυο IRC.
    Οι IRCops και οι Root χρήστες δεν μπορούν να γίνουν kill.
    Αυτή η εντολή απαιτεί την άδεια operserv.kill.

    Σύνταξη: KILL <ψευδώνυμο> <αιτιολογία>
    Παράδειγμα: KILL BadUser Flooding σε κανάλια
  example: "%command_prefix%KILL BadUser Κατάκλυση καναλιών"
  protected_root: "Δεν μπορεί να γίνει kill ο Root χρήστης %nickname%."
  protected_ircop: "Δεν μπορεί να γίνει kill ο IRC operator %nickname%."
  done: "Ο χρήστης %nickname% έχει γίνει kill (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <mask> <expiry> <αιτιολογία>|DEL {<mask>|<number>}|LIST [mask]}"
  short: "Διαχείριση G-lines σε όλο το δίκτυο."
  help: |-
    Διαχείριση G-lines σε όλο το δίκτυο (καθολικοί αποκλεισμοί).
    ADD προσθέτει νέο G-line με μάσκα, λήξη και αιτιολογία.
    DEL αφαιρεί ένα G-line με μάσκα ή αριθμό καταχώρησης.
    LIST εμφανίζει όλα τα G-lines, προαιρετικά φιλτραρισμένα κατά μάσκα.

    Μορφή λήξης: 0=μόνιμο, ή χρήση κατάληξης d, h, m (π.χ., 7d, 12h, 30m).
    Τα GLINE που ταιριάζουν με Root ή IRCop χρήστες απορρίπτονται.
    Αυτή η εντολή απαιτεί την άδεια operserv.gline.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Κατάχρηση ανεπιθύμητων"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Συνεχής κατάχρηση"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Άγνωστη υπο-εντολή %sub%. Χρησιμοποιήστε ADD, DEL ή LIST."
  invalid_mask: "Μη έγκυρη μορφή μάσκας. Πρέπει να είναι στη μορφή user@host (π.χ., *@192.168.*)."
  global_mask: "Η μάσκα G-line %mask% είναι πολύ ευρεία. Οι καθολικές μάσκες δεν επιτρέπονται."
  dangerous_mask: "Η μάσκα G-line %mask% είναι πολύ ευρεία. Το τμήμα host χρειάζεται τουλάχιστον 4 αλφαριθμητικούς χαρακτήρες."
  protected_user: "Δεν μπορεί να μπει G-line σε προστατευμένο χρήστη %nickname%."
  invalid_expiry: "Μη έγκυρη μορφή λήξης. Χρησιμοποιήστε 0 για μόνιμο, ή τιμή όπως 7d, 12h, 30m."
  already_exists: "Το G-line για %mask% υπάρχει ήδη."
  max_entries: "Επιτεύχθηκε ο μέγιστος αριθμός G-lines (%max%)."
  not_found: "Το G-line %mask% δεν βρέθηκε."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <mask> <expiry> <αιτιολογία>"
    short: "Προσθήκη G-line σε όλο το δίκτυο."
    help: |-
      Προσθέτει ένα G-line σε όλο το δίκτυο (καθολικός αποκλεισμός).
      Η μάσκα πρέπει να είναι στη μορφή user@host.
      Λήξη: 0=μόνιμο, ή χρήση κατάληξης d, h, m (π.χ., 7d, 12h, 30m).
      Τα GLINE που ταιριάζουν με Root ή IRCop χρήστες απορρίπτονται.
      Αυτή η εντολή απαιτεί την άδεια operserv.gline.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Κατάχρηση ανεπιθύμητων"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Συνεχής κατάχρηση"
    done: "Προστέθηκε G-line: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<mask>|<number>}"
    short: "Αφαίρεση G-line."
    help: |-
      Αφαιρεί ένα G-line από τη λίστα.
      Μπορείτε να καθορίσετε τη μάσκα ή τον αριθμό καταχώρησης από το LIST.
      Αυτή η εντολή απαιτεί την άδεια operserv.gline.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "Το G-line %mask% αφαιρέθηκε."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [mask]"
    short: "Λίστα όλων των G-lines."
    help: |-
      Εμφανίζει όλα τα G-lines. Προαιρετικά φιλτράρισμα κατά μοτίβο μάσκας.
      Αυτή η εντολή απαιτεί την άδεια operserv.gline.
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-lines (%count%)"
    empty: "Δεν υπάρχουν G-lines."
    entry: "%index%. %mask% - %reason% (%nickname%, λήγει: %expiration%)"

# --- BADMAIL ------------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <τομέας> <αιτιολογία>|DEL {αριθμός|ALL}|LIST <μοτίβο> [σελίδα]}"
  short: "Διαχείριση αποκλεισμένων τομέων email."
  help: |-
    Διαχείριση αποκλεισμένων τομέων email.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <τομέας> <αιτιολογία>"
    short: "Αποκλεισμός τομέα."
    help: |-
      Δέχεται τομείς ASCII ή punycode, όχι διευθύνσεις ή μοτίβα. Απαιτείται
      αιτιολογία. Ο αποκλεισμός είναι ακριβής και δεν περιλαμβάνει
      υποτομείς.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {αριθμός|ALL}"
    short: "Αφαίρεση αποκλεισμών τομέων."
    help: |-
      Διαγραφή μόνιμου αναγνωριστικού ή όλων των εγγραφών με ALL. Τα άλλα
      αναγνωριστικά δεν αλλάζουν.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <μοτίβο> [σελίδα]"
    short: "Λίστα αποκλεισμένων τομέων."
    help: |-
      Το μοτίβο είναι υποχρεωτικό. Μόνο το * ταιριάζει με οποιαδήποτε
      ακολουθία. Δεν γίνεται διάκριση πεζών και κεφαλαίων. Η προαιρετική
      σελίδα αρχίζει από 1. Τα αναγνωριστικά διατηρούνται κατά το
      φιλτράρισμα και τη σελιδοποίηση.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Μη έγκυρος τομέας. Χρησιμοποιήστε ASCII ή punycode χωρίς τελική τελεία."
  invalid_reason: "Απαιτείται μη κενή διοικητική αιτιολογία μίας γραμμής."
  duplicate: "Ο τομέας είναι ήδη αποκλεισμένος."
  not_found: "Δεν υπάρχει αποκλεισμένος τομέας με αυτό το αναγνωριστικό."
  added: "Ο τομέας %domain% αποκλείστηκε."
  deleted: "Ο αποκλεισμός %id% αφαιρέθηκε."
  cleared: "Αφαιρέθηκαν %total% αποκλεισμένοι τομείς."
  empty: "Δεν βρέθηκαν αντίστοιχοι αποκλεισμένοι τομείς."
  header: "ID | Τομέας | Αιτιολογία"
  page: "Σελίδα %page%/%pages%, %total% αντίστοιχοι τομείς."
  row: "%id% | %domain% | %reason%"

# --- GLOBAL -------------------------------------------------------------------
global:
  syntax: "GLOBAL {service|nick!ident@vhost} {PRIVMSG|NOTICE} <message>"
  short: "Αποστολή καθολικού μηνύματος σε όλους τους συνδεδεμένους χρήστες."
  help: |-
    Στέλνει ένα μήνυμα σε όλους τους συνδεδεμένους χρήστες.

    Αν το πρώτο όρισμα είναι όνομα υπηρεσίας, το μήνυμα θα σταλεί
    χρησιμοποιώντας αυτήν την υπάρχουσα υπηρεσία.

    Αν δεν είναι υπηρεσία, θα δημιουργηθεί ένας προσωρινός ψευδο-πελάτης
    με την καθορισμένη μάσκα. Η μάσκα πρέπει να είναι στη μορφή: nick!ident@vhost
    - nick: έγκυρο ψευδώνυμο IRC (γράμματα, []{}|\`, ψηφία, ξεκινά με γράμμα)
    - ident: αλφαριθμητικό με . _ ~ -
    - vhost: έγκυρο hostname

    Για ψευδο-πελάτες, το ψευδώνυμο δεν μπορεί να είναι συνδεδεμένο ή καταχωρημένο.
    Ο ψευδο-πελάτης θα παραμείνει συνδεδεμένος κατά την αποστολή και θα
    αποσυνδεθεί αυτόματα (το nick θα μπλοκαριστεί για 24 ώρες μέσω SQLINE/QLINE).

    PRIVMSG στέλνει ως ιδιωτικό μήνυμα, NOTICE στέλνει ως notice.
    Αυτή η εντολή απαιτεί την άδεια operserv.global.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Συντήρηση σε 10 λεπτά"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE Το δίκτυο θα επανεκκινηθεί"
  mask_invalid: "Μη έγκυρη μορφή μάσκας: %error%"
  nick_connected: "Το ψευδώνυμο %nickname% είναι τρέχοντα συνδεδεμένο."
  nick_registered: "Το ψευδώνυμο %nickname% είναι καταχωρημένο."
  type_invalid: "Ο τύπος μηνύματος πρέπει να είναι PRIVMSG ή NOTICE."
  done: "Καθολικό μήνυμα στάλθηκε από %nickname% σε %count% χρήστες."

# --- MOTD ---------------------------------------------------------------------
motd:
  short: "Διαχείριση μηνυμάτων MOTD που στέλνονται στους χρήστες κατά τη σύνδεση."
  syntax: "MOTD {ADD <στόχος> {PRIVMSG|NOTICE} <expiry> <μήνυμα>|DEL <id>|LIST|CLEAN}"
  help: |-
    Διαχείριση καταχωρήσεων Message Of The Day που στέλνονται στους χρήστες όταν
    συνδέονται στο δίκτυο.

  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Άγνωστη υπο-εντολή. Χρησιμοποιήστε: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <expiry> <message>"
    syntax_hint: "Χρήση: %syntax%"
    short: "Προσθήκη καταχώρησης MOTD."
    help: |-
      Προσθέτει ένα νέο μήνυμα MOTD που θα στέλνεται σε κάθε χρήστη όταν συνδέεται στο
      δίκτυο.

    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Συντήρηση απόψε"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Καλώς ορίσατε a la red"
    done: "Προστέθηκε καταχώρηση MOTD #%id%."
    invalid_type: "Μη έγκυρος τύπος μηνύματος. Πρέπει να είναι PRIVMSG ή NOTICE."
    invalid_expiry: "Μη έγκυρη μορφή λήξης. Χρησιμοποιήστε: <αριθμός><s|m|h|d> ή 0 για απεριόριστη διάρκεια (π.χ. 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Χρήση: %syntax%"
    short: "Διαγραφή καταχώρησης MOTD."
    help: |-
      Διαγράφει μια καταχώρηση MOTD με το ID της.

    example: "%command_prefix%MOTD DEL 12"
    done: "Διαγράφηκε η καταχώρηση MOTD #%id%."
    not_found: "Η καταχώρηση MOTD δεν βρέθηκε."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Λίστα όλων των καταχωρήσεων MOTD."
    help: |-
      Εμφανίζει όλες τις διαμορφωμένες καταχωρήσεις MOTD.

    example: "%command_prefix%MOTD LIST"
    empty: "Δεν υπάρχουν διαμορφωμένες καταχωρήσεις MOTD."
    header: "Καταχωρήσεις MOTD:"
    status_enabled: "ενεργή"
    status_disabled: "ανενεργή"
    expired: "έληξε"
    no_bot: "(χωρίς bot)"
    shown_count: "εμφανίστηκε %count% φορές"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Αφαίρεση όλων των ληγμένων καταχωρήσεων MOTD."
    help: |-
      Αφαιρεί όλες τις καταχωρήσεις MOTD των οποίων ο χρόνος λήξης έχει παρέλθει.

    example: "%command_prefix%MOTD CLEAN"
    done: "Αφαιρέθηκαν %count% ληγμένες καταχωρήσεις MOTD."
    none: "Δεν υπάρχουν ληγμένες καταχωρήσεις MOTD προς αφαίρεση."
  debug:
    finalized: "Το μήνυμα MOTD #%id% ολοκληρώθηκε: [%type%] %message% | %date% | %shown_count%"

# --- RAW ----------------------------------------------------------------------
raw:
  syntax: "RAW <line>"
  short: "Αποστολή ακατέργαστης γραμμής πρωτοκόλλου στο IRCd."
  help: |-
    Στέλνει τη δοσμένη γραμμή απευθείας στο socket του uplink IRCd.
    Χρησιμοποιήστε με εξαιρετική προσοχή. Μη έγκυρες γραμμές πρωτοκόλλου
    μπορεί να καταρρεύσουν το δίκτυο.
    Αυτή η εντολή απαιτεί την άδεια operserv.raw.
  example: "%command_prefix%RAW :services.ares NOTICE * :Προγραμματισμένη συντήρηση"
  empty: "Πρέπει να καθορίσετε μια μη κενή γραμμή για αποστολή."
  too_long: "Η γραμμή είναι πολύ μεγάλη. Μέγιστο 510 χαρακτήρες."
  not_connected: "Δεν υπάρχει σύνδεση με το IRCd."
  done: "Ακατέργαστη γραμμή στάλθηκε."
  protocol:
    syntax: "Το ενεργό πρωτόκολλο απέρριψε τη σύνταξη της εντολής RAW."
    done: "Η εντολή RAW του πρωτοκόλλου εκτελέστηκε."
    target: "Το ενεργό πρωτόκολλο απέρριψε τον στόχο %target%."
    unsupported: "Το ενεργό πρωτόκολλο δεν υποστηρίζει αυτή την εντολή RAW."
    invalid_resource_type: "Άγνωστος τύπος πόρου πρωτοκόλλου: %resource_type%."
    invalid_resource: "Μη έγκυρος πόρος πρωτοκόλλου: %resource%."
    invalid_value: "Μη έγκυρη τιμή για τον πόρο πρωτοκόλλου: %resource%."
    error: "Το ενεργό πρωτόκολλο δεν μπόρεσε να εκτελέσει την εντολή RAW."

# --- DEBUG --------------------------------------------------------------------
debug:
  action_global: "%operator% εκτελεί την εντολή GLOBAL με ψευδώνυμο %target% μέσω %type% σε %count% χρήστες. Μήνυμα: %message%"
  prefix_message: "Μήνυμα: %reason%"

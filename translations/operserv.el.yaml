# Μεταφράσεις OperServ — Ελληνικά
# Τομέας: operserv
#
# Κωδικοί μορφοποίησης IRC (διπλά εισαγωγικά ή κυριολεκτικά μπλοκ !irc):
#   \x02        ενεργοποίηση/απενεργοποίηση έντονης γραφής
#   \x03NN      χρώμα (ΔΕΚΑΔΙΚΟ: 03=πράσινο, 04=κόκκινο, 07=πορτοκαλί, 14=σκούρο γκρι)
#   \x03        επαναφορά χρώματος
#   \x0F        επαναφορά όλης της μορφοποίησης
#
# Τα χρώματα IRC χρησιμοποιούν ΔΕΚΑΔΙΚΟΥΣ αριθμούς (0-15), όχι δεκαεξαδικούς.
#   \x0314 = σκούρο γκρι (14 δεκαδικό): ΣΩΣΤΟ
#   \x030F = χρώμα 0 και μετά το γράμμα F: ΛΑΘΟΣ
#
# Πολυγραμμικό κείμενο IRC: !irc |- με πραγματικές αλλαγές γραμμής και κενά.
# Τα μπλοκ χωρίς ετικέτα δεν αποκωδικοποιούν διαφυγές· διατηρήστε τα CTCP.
# Παραδείγματα HELP: example/examples και %command_prefix%.
# Ο παρουσιαστής προσθέτει άχρωμο /msg και περιθώριο δύο κενών.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "\x0304✗\x03 Αυτή η εντολή περιορίζεται σε root διαχειριστές του δικτύου."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [command [sub-option]]"
  short: "Λίστα εντολών ή βοήθεια για μια εντολή."
  help: !irc |-
    Χωρίς ορίσματα εμφανίζει όλες τις εντολές. Χρησιμοποιήστε \x0303HELP <εντολή>\x03 για
    πλήρη βοήθεια ή \x0303HELP <εντολή> <επιλογή>\x03 για υποεπιλογές.
  example: "%command_prefix%\x02\x0303HELP KILL\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Σας επιτρέπει να διαχειρίζεστε τους χειριστές του δικτύου και τα δικαιώματά
    τους, να εφαρμόζετε περιορισμούς πρόσβασης και να αποσυνδέετε χρήστες. Επιτρέπει
    επίσης την αποστολή γενικών ανακοινώσεων και τη διαχείριση των μηνυμάτων
    καλωσορίσματος του δικτύου.
  general_header: "\x02 ■ Διαθέσιμες εντολές:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Επιλογές:\x02"
  examples_header: "\x02 ■ Παραδείγματα:\x02"
  general_footer: "\x0310ℹ\x03\x0F Χρησιμοποιήστε /msg %bot% \x02\x0303HELP <εντολή>\x03\x0F για περισσότερες πληροφορίες."
  set_sub_footer: "\x0310ℹ\x03\x0F Χρησιμοποιήστε /msg %bot% \x02\x0303HELP %command% <επιλογή>\x03\x0F για περισσότερες πληροφορίες."
  syntax_label: "Σύνταξη: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0307⚠\x03\x0F ΣΗΜΕΙΩΣΗ: Τα ψευδώνυμα που δεν χρησιμοποιούνται για περισσότερες από %days% ημέρες διαγράφονται αυτόματα."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    operators_roles: "Operators και ρόλοι"
    network_security: "Ασφάλεια δικτύου"
    communication: "Επικοινωνία"
    low_level: "Χαμηλό επίπεδο"
  ircop_header: "\x02 ■ Διαθέσιμες εντολές για IRC operators:\x02"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD|DEL|LIST} [nickname] [role]"
  short: "Διαχείριση IRC operators του δικτύου."
  help: |-
    Διαχείριση IRC operators του δικτύου. ADD προσθέτει ένα καταχωρημένο
    ψευδώνυμο ως operator με τον καθορισμένο ρόλο.
    DEL αφαιρεί έναν operator. LIST εμφανίζει όλους τους operators.
    Χρησιμοποιήστε ROLE LIST για να δείτε τους διαθέσιμους ρόλους.
    Αυτή η εντολή περιορίζεται σε Root χρήστες που έχουν διαμορφωθεί στις υπηρεσίες.
  example: "%command_prefix%\x02\x0303IRCOP ADD Ana OPER\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL ή LIST."
  unknown_role: "\x0304✗\x03 Ο ρόλος \x02%role%\x02 δεν υπάρχει. Χρησιμοποιήστε \x0303/msg %bot% ROLE LIST\x03 για να δείτε τους διαθέσιμους ρόλους."
  already_admin: "\x0304✗\x03 Ο/Η \x02%nickname%\x02 είναι ήδη IRC operator (ρόλος: %role%)."
  not_admin: "\x0304✗\x03 Ο/Η \x02%nickname%\x02 δεν είναι IRC operator."
  role_changed: "\x0303✓\x03 Άλλαξε ο ρόλος για \x02%nickname%\x02 από %old% σε %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nickname> <role>"
    short: "Προσθήκη IRC operator δικτύου."
    help: |-
      Προσθέτει ένα καταχωρημένο ψευδώνυμο ως IRC operator δικτύου.
      Χρησιμοποιήστε ROLE LIST για να δείτε τους διαθέσιμους ρόλους.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%\x02\x0303IRCOP ADD Ana OPER\x03\x0F"
    done: "\x0303✓\x03 Προστέθηκε ο/η \x02%nickname%\x02 ως \x02%role%\x02."
    nick_not_active: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι ενεργό καταχωρημένο ψευδώνυμο."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nickname>"
    short: "Αφαίρεση IRC operator δικτύου."
    help: |-
      Αφαιρεί έναν IRC operator δικτύου από τη λίστα.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%\x02\x0303IRCOP DEL Ana\x03\x0F"
    done: "\x0303✓\x03 Αφαιρέθηκε ο/η \x02%nickname%\x02 από τους IRC operators."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Λίστα όλων των IRC operators δικτύου."
    help: |-
      Εμφανίζει όλους τους IRC operators δικτύου με τους ρόλους και την ημερομηνία
      καταχώρησης.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
    header: "\x0307---\x03 \x02IRC Operators Δικτύου\x02 \x0307---\x03"
    empty: "Δεν υπάρχουν IRC operators."

# --- ROLE ------------------------------------------------------------------
role:

  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|<ρόλος>} [{VIEW|SET}] [operclass]"
    short: "Διαχειρίζεται την operclass του UnrealIRCd."
    help: !irc |-
      Εμφανίζει και ρυθμίζει την operclass ενός ρόλου.

      \x02 ■ Επιλογές:\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FΕμφανίζει τις διαθέσιμες operclasses στο δίκτυο.
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FΕμφανίζει την operclass του ρόλου και τις διαθέσιμες.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FΑναθέτει operclass στους IRCOP κατά την ταυτοποίηση.

      Παραλείψτε την τιμή για να την αφαιρέσετε.

      Διαθέσιμο μόνο σε πρωτόκολλα UnrealIRCd.
    example: "%command_prefix%\x02\x0303ROLE OPERCLASS LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE OPERCLASS VIEW SOPORTE\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET SOPORTE services-admin\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET SOPORTE\x03\x0F"
    list:
      header: "\x0307---\x03 \x02Διαθέσιμες Operclasses στο Δίκτυο\x02 \x0307---\x03"
      empty: "Δεν υπάρχουν διαθέσιμες operclasses στο δίκτυο."
      not_supported: "\x0304✗\x03 Το τρέχον πρωτόκολλο δεν υποστηρίζει εμφάνιση διαθέσιμων operclasses."
    view:
      empty: "Ο ρόλος %role% δεν έχει operclass."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Διαθέσιμες operclasses: \x0310%available%\x03"
    set:
      done: "\x0303✓\x03 Η operclass ρυθμίστηκε για τον ρόλο %role%."
      cleared: "\x0303✓\x03 Η operclass αφαιρέθηκε από τον ρόλο %role%."
      not_available: "\x0304✗\x03 Η operclass \x02%operclass%\x02 δεν είναι διαθέσιμη στο δίκτυο. Διαθέσιμες operclasses: %available%."
  syntax: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST} <όνομα> ..."
  short: "Διαχείριση ρόλων operator."
  help: |-
    Διαχείριση ρόλων operator. ADD δημιουργεί νέο ρόλο, DEL τον αφαιρεί,
    LIST εμφανίζει όλους τους ρόλους, PERMS διαχειρίζεται άδειες για έναν ρόλο,
    MODES διαχειρίζεται λειτουργίες IRCOP, VHOST διαχειρίζεται μοτίβο
    αναγκαστικού vhost για έναν ρόλο.
    Οι προστατευμένοι ρόλοι (ADMIN, OPER, PREOPER) δεν μπορούν να διαγραφούν.
    Αυτή η εντολή περιορίζεται σε Root χρήστες.
  syntax_operclass: "ROLE {ADD|DEL|LIST|PERMS|MODES|VHOST|OPERCLASS} <όνομα> ..."
  help_operclass: |-
    Διαχείριση ρόλων operator. ADD δημιουργεί νέο ρόλο, DEL τον αφαιρεί,
    LIST εμφανίζει όλους τους ρόλους, PERMS διαχειρίζεται άδειες για έναν ρόλο,
    MODES διαχειρίζεται λειτουργίες IRCOP, VHOST διαχειρίζεται μοτίβο αναγκαστικού vhost,
    OPERCLASS διαχειρίζεται την Unreal operclass ενός ρόλου.
    Οι προστατευμένοι ρόλοι (ADMIN, OPER, PREOPER) δεν μπορούν να διαγραφούν.
    Αυτή η εντολή περιορίζεται σε Root χρήστες.
  example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ROLE ADD SOPORTE Χειριστές υποστήριξης\x03\x0F"
  unknown_sub: "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL, LIST, PERMS, MODES, ή VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL, LIST, PERMS, MODES, VHOST ή OPERCLASS."
  not_found: "\x0304✗\x03 Ο ρόλος \x02%role%\x02 δεν υπάρχει."
  already_exists: "\x0304✗\x03 Ο ρόλος \x02%role%\x02 υπάρχει ήδη."
  protected: "\x0304✗\x03 Ο ρόλος \x02%role%\x02 είναι προστατευμένος και δεν μπορεί να διαγραφεί."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <name> [description]"
    short: "Δημιουργία νέου ρόλου."
    help: |-
      Δημιουργεί έναν νέο προσαρμοσμένο ρόλο. Η περιγραφή είναι προαιρετική.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%\x02\x0303ROLE ADD SOPORTE Χειριστές υποστήριξης\x03\x0F"
    done: "\x0303✓\x03 Δημιουργήθηκε ο ρόλος \x02%role%\x02."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <name>"
    short: "Διαγραφή ρόλου."
    help: |-
      Διαγράφει έναν προσαρμοσμένο ρόλο. Οι προστατευμένοι ρόλοι
      (ADMIN, OPER, PREOPER) δεν μπορούν να διαγραφούν.
      Αν ο ρόλος έχει ανατεθειμένους operators,
      πρέπει να τους επανατοποθετήσετε πρώτα.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%\x02\x0303ROLE DEL SOPORTE\x03\x0F"
    done: "\x0303✓\x03 Διαγράφηκε ο ρόλος \x02%role%\x02."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Λίστα όλων των ρόλων."
    help: |-
      Εμφανίζει όλους τους ρόλους. Οι προστατευμένοι ρόλοι
      σημειώνονται με [ΠΡΟΣΤΑΤΕΥΜΕΝΟΣ].
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
    header: "\x0307---\x03 \x02Ρόλοι Operator\x02 \x0307---\x03"
    empty: "Δεν υπάρχουν ρόλοι operator."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS <ρόλος> {LIST|ADD|DEL|CLEAR} [permission|ALL]"
    short: "Διαχείριση αδειών ρόλου."
    help: !irc |-
      Διαχείριση αδειών που ανατίθενται σε έναν ρόλο.

      \x02 ■ Επιλογές:\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FΕμφανίζει όλες τις άδειες για τον ρόλο.
          \x0310›\x03\x0F \x02\x0303ADD       \x03\x0FΑναθέτει μια άδεια στον ρόλο.
          \x0310›\x03\x0F \x02\x0303DEL       \x03\x0FΑφαιρεί μια άδεια από τον ρόλο (όχι για προστατευμένους ρόλους).
          \x0310›\x03\x0F \x02\x0303CLEAR     \x03\x0FΑφαιρεί όλες τις άδειες από τον ρόλο.

      Χρησιμοποιήστε ALL για να προσθέσετε όλες τις διαθέσιμες άδειες ταυτόχρονα.
      Αυτή η εντολή περιορίζεται σε Root χρήστες.
    example: "%command_prefix%\x02\x0303ROLE PERMS LIST SOPORTE\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE PERMS ADD SOPORTE operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS ADD SOPORTE ALL\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS DEL SOPORTE operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS CLEAR SOPORTE\x03\x0F"
    not_found: "\x0304✗\x03 Η άδεια \x02%perm%\x02 δεν υπάρχει."
    already_has: "\x0304✗\x03 Ο ρόλος \x02%role%\x02 έχει ήδη την άδεια \x02%perm%\x02."
    does_not_have: "\x0304✗\x03 Ο ρόλος \x02%role%\x02 δεν έχει την άδεια \x02%perm%\x02."
    list:
      header: "\x0303Λίστα αδειών για \x02%role%\x02\x03"
      columns: "Ανατέθηκε | Κλειδί άδειας | Περιγραφή"
      row: "%assigned% | %permission% | %description%"
      assigned: "\x0303✓\x03\x0F"
      unassigned: "\x0304✗\x03\x0F"
    add:
      done: "\x0303✓\x03 Προστέθηκε η άδεια \x02%perm%\x02 στον ρόλο \x02%role%\x02."
      all_done: "\x0303✓\x03 Προστέθηκαν \x02%count%\x02 άδειες στον ρόλο \x02%role%\x02."
    del:
      done: "\x0303✓\x03 Αφαιρέθηκε η άδεια \x02%perm%\x02 από τον ρόλο \x02%role%\x02."
    clear:
      done: "\x0303✓\x03 Αφαιρέθηκαν \x02%count%\x02 άδειες από τον ρόλο \x02%role%\x02."
      empty: "\x0304✗\x03 Ο ρόλος \x02%role%\x02 δεν έχει ανατεθειμένες άδειες."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES <ρόλος> {VIEW|SET} [modes]"
    short: "Διαχείριση λειτουργιών χρήστη IRCOP για τον ρόλο."
    help: !irc |-
      Διαχειρίζεται τις λειτουργίες χρήστη IRCOP που ανατίθενται σε ρόλο.

      \x02 ■ Επιλογές:\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FΕμφανίζει τις τρέχουσες λειτουργίες του ρόλου.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FΟρίζει λειτουργίες IRCOP.

      Παραλείψτε τις λειτουργίες για να αφαιρεθούν όλες.

      Οι χρήστες με αυτόν τον ρόλο λαμβάνουν τις λειτουργίες κατά την ταυτοποίηση.
      Διαθέσιμες λειτουργίες ανά IRCD
      Η εντολή περιορίζεται σε χρήστες Root.
    example: "%command_prefix%\x02\x0303ROLE MODES VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER oH\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02Λειτουργίες για %role%\x02 \x0307---\x03"
      empty: "Ο ρόλος \x02%role%\x02 δεν έχει ανατεθειμένες λειτουργίες."
      line: "  Λειτουργίες: \x0303%modes%\x03"
    set:
      done: "\x0303✓\x03 Ορίστηκαν οι λειτουργίες \x02%modes%\x02 για τον ρόλο \x02%role%\x02."
      cleared: "\x0303✓\x03 Αφαιρέθηκαν όλες οι λειτουργίες από τον ρόλο \x02%role%\x02."
      invalid_mode: "\x0304✗\x03 Η λειτουργία \x02%mode%\x02 δεν είναι έγκυρη λειτουργία IRCOP."
      invalid_modes: "\x0304✗\x03 Μη έγκυρες λειτουργίες: %invalid%. Έγκυρες λειτουργίες: %valid%."
      no_irc_user_modes: "\x0304✗\x03 Το τρέχον IRCD δεν έχει διαμορφωμένες λειτουργίες IRCOP."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST <ρόλος> {VIEW|SET} [pattern]"
    short: "Διαχείριση μοτίβου αναγκαστικού vhost για έναν ρόλο."
    help: !irc |-
      Ορίζει το εικονικό host που λαμβάνουν οι operators ενός ρόλου κατά την
      ταυτοποίηση, αντικαθιστώντας το προσωπικό τους host.

      Το host συνδυάζει το ψευδώνυμο χωρίς ειδικούς χαρακτήρες με το καθορισμένο
      μοτίβο. Παράδειγμα:

      _davidlig_ + admin.ares → davidlig.admin.ares

      \x02 ■ Επιλογές:\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FΕμφανίζει το μοτίβο host του ρόλου.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FΟρίζει ή αφαιρεί το μοτίβο ενός ρόλου.

      Το μοτίβο δέχεται γράμματα, αριθμούς, παύλες και τελείες. Πρέπει να περιέχει
      τουλάχιστον μία τελεία, να μην αρχίζει ή τελειώνει με παύλα ή τελεία και να μην
      έχει διαδοχικές τελείες.

      Χρησιμοποιήστε SET χωρίς μοτίβο για να αφαιρέσετε το υποχρεωτικό host.

      Η εντολή περιορίζεται σε χρήστες Root.
    example: "%command_prefix%\x02\x0303ROLE VHOST VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER admin.ares\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02Αναγκαστικό vhost για %role%\x02 \x0307---\x03"
      empty: "Ο ρόλος \x02%role%\x02 δεν έχει ορισμένο μοτίβο αναγκαστικού vhost."
      line: "  Μοτίβο: \x0303%pattern%\x03"
      example: "  Παράδειγμα: \x02nickname\x02.%pattern%"
    set:
      done: "\x0303✓\x03 Ορίστηκε μοτίβο αναγκαστικού vhost για τον ρόλο \x02%role%\x02."
      cleared: "\x0303✓\x03 Αφαιρέθηκε το μοτίβο αναγκαστικού vhost από τον ρόλο \x02%role%\x02."
      invalid: "\x0304✗\x03 Μη έγκυρο μοτίβο vhost. Έγκυροι χαρακτήρες: a-z, A-Z, 0-9, - και .. Πρέπει να έχει τουλάχιστον μία τελεία, δεν μπορεί να ξεκινά/τελειώνει με - ή . ή να έχει .."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <nickname> <reason>"
  short: "Αναγκαστική αποσύνδεση χρήστη από το δίκτυο."
  help: |-
    Αποσυνδέει έναν χρήστη από το δίκτυο IRC.
    Οι IRCops και οι Root χρήστες δεν μπορούν να γίνουν kill.
    Αυτή η εντολή απαιτεί την άδεια operserv.kill.

    Σύνταξη: KILL <ψευδώνυμο> <αιτία>
    Παράδειγμα: KILL BadUser Flooding σε κανάλια
  example: "%command_prefix%\x02\x0303KILL BadUser Κατάκλυση καναλιών\x03\x0F"
  protected_root: "\x0304✗\x03 Δεν μπορεί να γίνει kill ο Root χρήστης \x02%nickname%\x02."
  protected_ircop: "\x0304✗\x03 Δεν μπορεί να γίνει kill ο IRC operator \x02%nickname%\x02."
  done: "\x0303✓\x03 Ο χρήστης \x02%nickname%\x02 έχει γίνει kill (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD|DEL|LIST} [mask] [expiry] [reason]"
  short: "Διαχείριση G-lines σε όλο το δίκτυο."
  help: |-
    Διαχείριση G-lines σε όλο το δίκτυο (καθολικοί αποκλεισμοί).
    ADD προσθέτει νέο G-line με μάσκα, λήξη και αιτία.
    DEL αφαιρεί ένα G-line με μάσκα ή αριθμό καταχώρησης.
    LIST εμφανίζει όλα τα G-lines, προαιρετικά φιλτραρισμένα κατά μάσκα.

    Μορφή λήξης: 0=μόνιμο, ή χρήση κατάληξης d, h, m (π.χ., 7d, 12h, 30m).
    Τα GLINE που ταιριάζουν με Root ή IRCop χρήστες απορρίπτονται.
    Αυτή η εντολή απαιτεί την άδεια operserv.gline.
  example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Κατάχρηση ανεπιθύμητων\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Συνεχής κατάχρηση\x03\x0F"
    - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
  unknown_sub: "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL ή LIST."
  invalid_mask: "\x0304✗\x03 Μη έγκυρη μορφή μάσκας. Πρέπει να είναι στη μορφή user@host (π.χ., *@192.168.*)."
  global_mask: "\x0304✗\x03 Η μάσκα G-line \x02%mask%\x02 είναι πολύ ευρεία. Οι καθολικές μάσκες δεν επιτρέπονται."
  dangerous_mask: "\x0304✗\x03 Η μάσκα G-line \x02%mask%\x02 είναι πολύ ευρεία. Το τμήμα host χρειάζεται τουλάχιστον 4 αλφαριθμητικούς χαρακτήρες."
  protected_user: "\x0304✗\x03 Δεν μπορεί να μπει G-line σε προστατευμένο χρήστη \x02%nickname%\x02."
  invalid_expiry: "\x0304✗\x03 Μη έγκυρη μορφή λήξης. Χρησιμοποιήστε 0 για μόνιμο, ή τιμή όπως 7d, 12h, 30m."
  already_exists: "\x0304✗\x03 Το G-line για \x02%mask%\x02 υπάρχει ήδη."
  max_entries: "\x0304✗\x03 Επιτεύχθηκε ο μέγιστος αριθμός G-lines (%max%)."
  not_found: "\x0304✗\x03 Το G-line \x02%mask%\x02 δεν βρέθηκε."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <mask> <expiry> <reason>"
    short: "Προσθήκη G-line σε όλο το δίκτυο."
    help: |-
      Προσθέτει ένα G-line σε όλο το δίκτυο (καθολικός αποκλεισμός).
      Η μάσκα πρέπει να είναι στη μορφή user@host.
      Λήξη: 0=μόνιμο, ή χρήση κατάληξης d, h, m (π.χ., 7d, 12h, 30m).
      Τα GLINE που ταιριάζουν με Root ή IRCop χρήστες απορρίπτονται.
      Αυτή η εντολή απαιτεί την άδεια operserv.gline.
    example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Κατάχρηση ανεπιθύμητων\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Συνεχής κατάχρηση\x03\x0F"
    done: "\x0303✓\x03 Προστέθηκε G-line: \x02%mask%\x02 (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL <mask|number>"
    short: "Αφαίρεση G-line."
    help: |-
      Αφαιρεί ένα G-line από τη λίστα.
      Μπορείτε να καθορίσετε τη μάσκα ή τον αριθμό καταχώρησης από το LIST.
      Αυτή η εντολή απαιτεί την άδεια operserv.gline.
    example: "%command_prefix%\x02\x0303GLINE DEL *@192.168.1.*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE DEL 2\x03\x0F"
    done: "\x0303✓\x03 Το G-line \x02%mask%\x02 αφαιρέθηκε."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [mask]"
    short: "Λίστα όλων των G-lines."
    help: |-
      Εμφανίζει όλα τα G-lines. Προαιρετικά φιλτράρισμα κατά μοτίβο μάσκας.
      Αυτή η εντολή απαιτεί την άδεια operserv.gline.
    example: "%command_prefix%\x02\x0303GLINE LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
    header: "\x0307---\x03 \x02G-lines (%count%) \x0307---\x03"
    empty: "Δεν υπάρχουν G-lines."
    entry: "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, λήγει: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {service|nick!ident@vhost} {PRIVMSG|NOTICE} <message>"
  short: "Αποστολή καθολικού μηνύματος σε όλους τους συνδεδεμένους χρήστες."
  help: |-
    Στέλνει ένα μήνυμα σε όλους τους συνδεδεμένους χρήστες.

    Αν το πρώτο όρισμα είναι όνομα υπηρεσίας, το μήνυμα θα σταλεί
    χρησιμοποιώντας αυτήν την υπάρχουσα υπηρεσία.

    Αν δεν είναι υπηρεσία, θα δημιουργηθεί ένας προσωρινός ψευδο-πελάτης
    με την καθορισμένη μάσκα. Η μάσκα πρέπει να είναι στη μορφή: nick!ident@vhost
    - nick: έγκυρο ψευδώνυμο IRC (γράμματα, []{}|\`, ψηφία, ξεκινά με γράμμα)
    - ident: αλφαριθμητικό με . _ ~ -
    - vhost: έγκυρο hostname

    Για ψευδο-πελάτες, το ψευδώνυμο δεν μπορεί να είναι συνδεδεμένο ή καταχωρημένο.
    Ο ψευδο-πελάτης θα παραμείνει συνδεδεμένος κατά την αποστολή και θα
    αποσυνδεθεί αυτόματα (το nick θα μπλοκαριστεί για 24 ώρες μέσω SQLINE/QLINE).

    PRIVMSG στέλνει ως ιδιωτικό μήνυμα, NOTICE στέλνει ως notice.
    Αυτή η εντολή απαιτεί την άδεια operserv.global.
  example: "%command_prefix%\x02\x0303GLOBAL %operserv% PRIVMSG Συντήρηση σε 10 λεπτά\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLOBAL Avisos!oper@services.ares NOTICE Το δίκτυο θα επανεκκινηθεί\x03\x0F"
  mask_invalid: "\x0304✗\x03 Μη έγκυρη μορφή μάσκας: %error%"
  nick_connected: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι τρέχοντα συνδεδεμένο."
  nick_registered: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι καταχωρημένο."
  type_invalid: "\x0304✗\x03 Ο τύπος μηνύματος πρέπει να είναι PRIVMSG ή NOTICE."
  done: "\x0303✓\x03 Καθολικό μήνυμα στάλθηκε από \x02%nickname%\x02 σε %count% χρήστες."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <line>"
  short: "Αποστολή ακατέργαστης γραμμής πρωτοκόλλου στο IRCd."
  help: |-
    Στέλνει τη δοσμένη γραμμή απευθείας στο socket του uplink IRCd.
    Χρησιμοποιήστε με εξαιρετική προσοχή. Μη έγκυρες γραμμές πρωτοκόλλου
    μπορεί να καταρρεύσουν το δίκτυο.
    Αυτή η εντολή απαιτεί την άδεια operserv.raw.
  example: "%command_prefix%\x02\x0303RAW :services.ares NOTICE * :Προγραμματισμένη συντήρηση\x03\x0F"
  empty: "\x0304✗\x03 Πρέπει να καθορίσετε μια μη κενή γραμμή για αποστολή."
  too_long: "\x0304✗\x03 Η γραμμή είναι πολύ μεγάλη. Μέγιστο 510 χαρακτήρες."
  not_connected: "\x0304✗\x03 Δεν υπάρχει σύνδεση με το IRCd."
  done: "\x0303✓\x03 Ακατέργαστη γραμμή στάλθηκε."
  protocol:
    syntax: "\x0304✗\x03 Το ενεργό πρωτόκολλο απέρριψε τη σύνταξη της εντολής RAW."
    done: "\x0303✓\x03 Η εντολή RAW του πρωτοκόλλου εκτελέστηκε."
    target: "\x0304✗\x03 Το ενεργό πρωτόκολλο απέρριψε τον στόχο %target%."
    unsupported: "\x0304✗\x03 Το ενεργό πρωτόκολλο δεν υποστηρίζει αυτή την εντολή RAW."
    invalid_resource_type: "\x0304✗\x03 Άγνωστος τύπος πόρου πρωτοκόλλου: %resource_type%."
    invalid_resource: "\x0304✗\x03 Μη έγκυρος πόρος πρωτοκόλλου: %resource%."
    invalid_value: "\x0304✗\x03 Μη έγκυρη τιμή για τον πόρο πρωτοκόλλου: %resource%."
    error: "\x0304✗\x03 Το ενεργό πρωτόκολλο δεν μπόρεσε να εκτελέσει την εντολή RAW."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator% εκτελεί την εντολή GLOBAL με ψευδώνυμο %target% μέσω %type% σε %count% χρήστες. Μήνυμα: %message%"
  prefix_message: "Μήνυμα: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Διαχείριση μηνυμάτων MOTD που στέλνονται στους χρήστες κατά τη σύνδεση."
  syntax: "MOTD {ADD|DEL|LIST|CLEAN} [args]"
  help: |-
    Διαχείριση καταχωρήσεων Message Of The Day που στέλνονται στους χρήστες όταν
    συνδέονται στο δίκτυο.

  example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Άγνωστη υπο-εντολή. Χρησιμοποιήστε: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <expiry> <message>"
    syntax_hint: "\x0304✗\x03 Χρήση: \x02%syntax%\x02"
    short: "Προσθήκη καταχώρησης MOTD."
    help: |-
      Προσθέτει ένα νέο μήνυμα MOTD που θα στέλνεται σε κάθε χρήστη όταν συνδέεται στο
      δίκτυο.

    example: "%command_prefix%\x02\x0303MOTD ADD %operserv% NOTICE 24h Συντήρηση απόψε\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303MOTD ADD %operserv% PRIVMSG 0 Καλώς ορίσατε a la red\x03\x0F"
    done: "\x0303✓\x03 Προστέθηκε καταχώρηση MOTD #%id%."
    invalid_type: "\x0304✗\x03 Μη έγκυρος τύπος μηνύματος. Πρέπει να είναι \x02PRIVMSG\x02 ή \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Μη έγκυρη μορφή λήξης. Χρησιμοποιήστε: \x02<αριθμός><s|m|h|d>\x02 ή \x020\x02 για απεριόριστη διάρκεια (π.χ. 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "\x0304✗\x03 Χρήση: \x02%syntax%\x02"
    short: "Διαγραφή καταχώρησης MOTD."
    help: |-
      Διαγράφει μια καταχώρηση MOTD με το ID της.

    example: "%command_prefix%\x02\x0303MOTD DEL 12\x03\x0F"
    done: "\x0303✓\x03 Διαγράφηκε η καταχώρηση MOTD #%id%."
    not_found: "\x0304✗\x03 Η καταχώρηση MOTD δεν βρέθηκε."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Λίστα όλων των καταχωρήσεων MOTD."
    help: |-
      Εμφανίζει όλες τις διαμορφωμένες καταχωρήσεις MOTD.

    example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
    empty: "Δεν υπάρχουν διαμορφωμένες καταχωρήσεις MOTD."
    header: "Καταχωρήσεις MOTD:"
    status_enabled: "\x0303ενεργή\x03"
    status_disabled: "\x0304ανενεργή\x03"
    expired: "\x0304έληξε\x03"
    no_bot: "(χωρίς bot)"
    shown_count: "εμφανίστηκε %count% φορές"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Αφαίρεση όλων των ληγμένων καταχωρήσεων MOTD."
    help: |-
      Αφαιρεί όλες τις καταχωρήσεις MOTD των οποίων ο χρόνος λήξης έχει παρέλθει.

    example: "%command_prefix%\x02\x0303MOTD CLEAN\x03\x0F"
    done: "\x0303✓\x03 Αφαιρέθηκαν %count% ληγμένες καταχωρήσεις MOTD."
    none: "\x0303✓\x03 Δεν υπάρχουν ληγμένες καταχωρήσεις MOTD προς αφαίρεση."
  debug:
    finalized: "Το μήνυμα MOTD #%id% ολοκληρώθηκε: [%type%] %message% | %date% | %shown_count%"

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD|DEL|LIST} <arguments>"
  short: "Διαχείριση αποκλεισμένων τομέων email."
  help: |-
    Διαχείριση αποκλεισμένων τομέων email.
  example: "%command_prefix%\x02\x0303BADMAIL LIST *\x03\x0f"
  add:
    syntax: "BADMAIL ADD <domain> <reason>"
    short: "Αποκλεισμός τομέα."
    help: |-
      Δέχεται τομείς ASCII ή punycode, όχι διευθύνσεις ή μοτίβα. Απαιτείται
      αιτιολογία. Ο αποκλεισμός είναι ακριβής και δεν περιλαμβάνει
      υποτομείς.
    example: "%command_prefix%\x02\x0303BADMAIL ADD example.org abuse\x03\x0f"
  del:
    syntax: "BADMAIL DEL {id|ALL}"
    short: "Αφαίρεση αποκλεισμών τομέων."
    help: |-
      Διαγραφή μόνιμου αναγνωριστικού ή όλων των εγγραφών με ALL. Τα άλλα
      αναγνωριστικά δεν αλλάζουν.
    example: "%command_prefix%\x02\x0303BADMAIL DEL 1\x03\x0f"
  list:
    syntax: "BADMAIL LIST <pattern> [page]"
    short: "Λίστα αποκλεισμένων τομέων."
    help: |-
      Το μοτίβο είναι υποχρεωτικό. Μόνο το * ταιριάζει με οποιαδήποτε
      ακολουθία. Δεν γίνεται διάκριση πεζών και κεφαλαίων. Η προαιρετική
      σελίδα αρχίζει από 1. Τα αναγνωριστικά διατηρούνται κατά το
      φιλτράρισμα και τη σελιδοποίηση.
    example: "%command_prefix%\x02\x0303BADMAIL LIST *.org 2\x03\x0f"
  invalid_domain: "Μη έγκυρος τομέας. Χρησιμοποιήστε ASCII ή punycode χωρίς τελική τελεία."
  invalid_reason: "Απαιτείται μη κενή διοικητική αιτιολογία μίας γραμμής."
  duplicate: "Ο τομέας είναι ήδη αποκλεισμένος."
  not_found: "Δεν υπάρχει αποκλεισμένος τομέας με αυτό το αναγνωριστικό."
  added: "Ο τομέας %domain% αποκλείστηκε."
  deleted: "Ο αποκλεισμός %id% αφαιρέθηκε."
  cleared: "Αφαιρέθηκαν %total% αποκλεισμένοι τομείς."
  empty: "Δεν βρέθηκαν αντίστοιχοι αποκλεισμένοι τομείς."
  header: "ID | Τομέας | Αιτιολογία"
  page: "Σελίδα %page%/%pages%, %total% αντίστοιχοι τομείς."
  row: "%id% | %domain% | %reason%"

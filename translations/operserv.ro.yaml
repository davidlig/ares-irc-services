    short: "Eliminați toate intrările MOTD expirate."
    help: "Șterge toate intrările MOTD expirate."
    example: "%command_prefix%MOTD CLEAN"
    done: "Eliminate %count% intrări MOTD expirate."
    none: "Nu există intrări MOTD expirate de eliminat."

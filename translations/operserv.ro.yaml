# Traduceri OperServ — Română
# Domeniu: operserv
#
# Coduri de formatare IRC (ghilimele duble sau blocuri literale !irc):
#   \x02        activează/dezactivează caracterele aldine
#   \x03NN      culoare (ZECIMAL: 03=verde, 04=roșu, 07=portocaliu, 14=gri închis)
#   \x03        resetează culoarea
#   \x0F        resetează întreaga formatare
#
# Culorile IRC folosesc numere ZECIMALE (0-15), nu hexazecimale.
#   \x0314 = gri închis (14 zecimal): CORECT
#   \x030F = culoarea 0 urmată de litera F: EROARE
#
# Text IRC pe mai multe rânduri: !irc |- cu rânduri și spații reale.
# Blocurile fără etichetă nu decodează secvențe escape; păstrează literalii CTCP.
# Exemple HELP: example/examples și %command_prefix%.
# Prezentatorul adaugă /msg fără culoare și o margine de două spații.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "Această comandă este rezervată administratorilor root ai rețelei."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [comandă] [opțiune]"
  short: "Listați comenzile sau afișați ajutor pentru o comandă."
  help: |-
    Fără argumente, listează toate comenzile. Folosește %help_command% pentru ajutor
    complet sau %help_option_command% pentru subopțiunile SET.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Gestionează operatorii rețelei și permisiunile lor, aplică restricții de acces
    și deconectează utilizatorii. De asemenea, permite trimiterea de anunțuri
    generale
    și administrarea mesajelor de întâmpinare ale rețelei.
  general_header: "Comenzi disponibile:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opțiuni:"
  examples_header: "Exemple:"
  general_help_command: "HELP <comandă>"
  option_help_command: "HELP %command% <opțiune>"
  detail_help_command: "HELP <comandă>"
  detail_help_option_command: "HELP <comandă> <opțiune>"
  general_footer: "Folosește /msg %bot% %help_command% pentru mai multe informații."
  set_sub_footer: "Folosește /msg %bot% %help_command% pentru mai multe informații."
  syntax_label: "Sintaxă: %syntax%"
  footer: ""
  intro_expiration: "NOTĂ: Poreclele nefolosite mai mult de %days% zile sunt eliminate automat."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operatori și roluri"
    network_security: "Securitatea rețelei"
    communication: "Comunicare"
    low_level: "Nivel inferior"
  ircop_header: "Comenzi disponibile pentru IRCops:"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <poreclă> <rol>|DEL <poreclă>|LIST}"
  short: "Gestionați operatorii IRC ai rețelei."
  help: |-
    Gestionează operatorii IRC ai rețelei. ADD adaugă o poreclă înregistrată
    ca operator cu rolul specificat.
    DEL elimină un operator. LIST afișează toți operatorii.
    Folosiți ROLE LIST pentru a vedea rolurile disponibile.
    Această comandă este rezervată utilizatorilor Root configurați în servicii.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Subcomandă necunoscută %sub%. Folosiți ADD, DEL sau LIST."
  unknown_role: "Rolul %role% nu există. Folosiți /msg %bot% %role_list% pentru a vedea rolurile disponibile."
  already_admin: "%nickname% este deja operator IRC (rol: %role%)."
  not_admin: "%nickname% nu este operator IRC."
  role_changed: "Rol schimbat pentru %nickname% din %old% în %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <poreclă> <rol>"
    short: "Adăugați un operator IRC al rețelei."
    help: |-
      Adaugă o poreclă înregistrată ca operator IRC al rețelei.
      Folosiți ROLE LIST pentru a vedea rolurile disponibile.
      Această comandă este rezervată utilizatorilor Root.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "Adăugat %nickname% ca %role%."
    nick_not_active: "Porecla %nickname% nu este o poreclă înregistrată activă."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <poreclă>"
    short: "Eliminați un operator IRC al rețelei."
    help: |-
      Elimină un operator IRC al rețelei din listă.
      Această comandă este rezervată utilizatorilor Root.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "Eliminat %nickname% din operatorii IRC."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Listați toți operatorii IRC ai rețelei."
    help: |-
      Listează toți operatorii IRC ai rețelei cu rolurile și data înregistrării.
      Această comandă este rezervată utilizatorilor Root.
    example: "%command_prefix%IRCOP LIST"
    header: "Operatori IRC ai rețelei"
    empty: "Nu există operatori IRC."

# --- ROLE ------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rol>|SET <rol> [operclass]}"
    short: "Gestionează clasa de operator UnrealIRCd."
    help: |-
      Permite consultarea și configurarea operclass pentru un rol.

      %options_header%
      %option_LIST%Afișează operclass-urile disponibile în rețea.
      %option_VIEW%Afișează operclass-ul rolului și cele disponibile.
      %option_SET%Atribuie operclass IRCOP-ilor la identificare.

      Omite valoarea pentru a o elimina.

      Disponibil numai pentru protocoalele UnrealIRCd.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SOPORTE"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE"
    list:
      header: "Operclasses Disponibile in Retea"
      empty: "Nu exista operclasses disponibile in retea."
      not_supported: "Protocolul curent nu suporta listarea operclasses disponibile."
    view:
      empty: "Rolul %role% nu are operclass."
      line: "Operclass: %operclass%"
      available: "Operclasses disponibile: %available%"
    set:
      done: "Operclass configurată pentru rolul %role%."
      cleared: "Operclass eliminată pentru rolul %role%."
      not_available: "Operclass %operclass% nu este disponibila in retea. Operclasses disponibile: %available%."
  syntax: "ROLE {ADD <nume> [descriere]|DEL <nume>|LIST|PERMS {{ADD|DEL} <rol> <permisiune>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [moduri]}|VHOST {VIEW <rol>|SET <rol> [vhost]}}"
  short: "Gestionează rolurile operatorilor, permisiunile și configurarea lor."
  help: |-
    Gestionează rolurile operatorilor, permisiunile și configurarea lor.

    Rolurile ADMIN, OPER și PREOPER sunt protejate și nu pot fi șterse.
    Comandă rezervată utilizatorilor Root.
  syntax_operclass: "ROLE {ADD <nume> [descriere]|DEL <nume>|LIST|PERMS {{ADD|DEL} <rol> <permisiune>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [moduri]}|VHOST {VIEW <rol>|SET <rol> [vhost]}|OPERCLASS {LIST|VIEW <nume>|SET <nume> [operclass]}}"
  help_operclass: |-
    Gestionează rolurile de operator. ADD creează un nou rol, DEL îl șterge,
    LIST afișează toate rolurile, PERMS gestionează permisiunile unui rol, MODES gestionează modurile IRCOP,
    VHOST gestionează modelul de vhost forțat al unui rol, OPERCLASS gestionează operclass Unreal.
    Rolurile protejate (ADMIN, OPER, PREOPER) nu pot fi șterse.
    Această comandă este rezervată utilizatorilor Root.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SOPORTE Operatori de asistență"
  unknown_sub: "Subcomandă necunoscută %sub%. Folosiți ADD, DEL, LIST, PERMS, MODES sau VHOST."
  unknown_sub_operclass: "Subcomandă necunoscută %sub%. Folosiți ADD, DEL, LIST, PERMS, MODES, VHOST sau OPERCLASS."
  not_found: "Rolul %role% nu există."
  already_exists: "Rolul %role% există deja."
  protected: "Rolul %role% este protejat și nu poate fi șters."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <nume> [descriere]"
    short: "Creați un nou rol."
    help: |-
      Creează un nou rol personalizat. Descrierea este opțională.
      Această comandă este rezervată utilizatorilor Root.
    example: "%command_prefix%ROLE ADD SOPORTE Operatori de asistență"
    done: "Rol creat %role%."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <nume>"
    short: "Ștergeți un rol."
    help: |-
      Șterge un rol personalizat. Rolurile protejate (ADMIN, OPER, PREOPER)
      nu pot fi șterse. Dacă rolul are operatori alocați,
      trebuie să îi realocați mai întâi.
      Această comandă este rezervată utilizatorilor Root.
    example: "%command_prefix%ROLE DEL SOPORTE"
    done: "Rol șters %role%."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Afișează rolurile disponibile."
    help: |-
      Listează toate rolurile. Rolurile protejate sunt marcate cu [PROTECTED].
      Această comandă este rezervată utilizatorilor Root.
    example: "%command_prefix%ROLE LIST"
    header: "Roluri de operator"
    empty: "Nu există roluri de operator."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rol> <permisiune>|{LIST|CLEAR} <rol>}"
    short: "Gestionează permisiunile rolului."
    help: |-
      Gestionează permisiunile atribuite unui rol.

      %options_header%
      %option_LIST%Afișează toate permisiunile disponibile și indică pe cele
                      atribuite.
      %option_ADD%Atribuie o permisiune.
      %option_DEL%Elimină o permisiune (nu pentru roluri protejate).
      %option_CLEAR%Elimină toate permisiunile.

      %assigned_status% înseamnă atribuită; %unassigned_status% înseamnă disponibilă.

      Folosește ALL pentru a adăuga simultan toate permisiunile disponibile.
      Comandă rezervată utilizatorilor Root.
    example: "%command_prefix%ROLE PERMS LIST SOPORTE"
    examples:
      - "%command_prefix%ROLE PERMS ADD SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SOPORTE ALL"
      - "%command_prefix%ROLE PERMS DEL SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SOPORTE"
    not_found: "Permisiunea %perm% nu există."
    already_has: "Rolul %role% are deja permisiunea %perm%."
    does_not_have: "Rolul %role% nu are permisiunea %perm%."
    list:
      header: "Lista permisiunilor pentru %role%"
      columns: "Atribuită | Cheia permisiunii | Descriere"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Permisiunea %perm% adăugată rolului %role%."
      all_done: "Adăugate %count% permisiuni rolului %role%."
    del:
      done: "Permisiunea %perm% eliminată din rolul %role%."
    clear:
      done: "Eliminate %count% permisiuni din rolul %role%."
      empty: "Rolul %role% nu are permisiuni atribuite."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rol>|SET <rol> [moduri]}"
    short: "Configurează modurile de utilizator ale rolului."
    help: |-
      Gestionează modurile de utilizator IRCOP atribuite unui rol.

      %options_header%
      %option_VIEW%Afișează modurile curente ale rolului.
      %option_SET%Setează modurile IRCOP.

      Omite modurile pentru a le elimina pe toate.

      Utilizatorii cu acest rol primesc modurile la identificare.
      Moduri disponibile per IRCD
      Comandă rezervată utilizatorilor Root.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Moduri pentru %role%"
      empty: "Rolul %role% nu are moduri atribuite."
      line: "Moduri: %modes%"
    set:
      done: "Moduri setate %modes% pentru rolul %role%."
      cleared: "Toate modurile au fost eliminate din rolul %role%."
      invalid_mode: "Modul %mode% nu este un mod IRCOP valid."
      invalid_modes: "Moduri invalide: %invalid%. Moduri valide: %valid%."
      no_irc_user_modes: "IRCd-ul actual nu are moduri IRCOP configurate."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rol>|SET <rol> [vhost]}"
    short: "Configurează tiparul de host virtual al rolului."
    help: |-
      Configurează hostul virtual primit de operatorii unui rol la identificare,
      înlocuindu-l pe cel personal.

      Hostul combină porecla fără caractere speciale cu tiparul configurat. Exemplu:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Afișează tiparul configurat pentru rol.
      %option_SET%Setează sau elimină tiparul rolului.

      Tiparul acceptă litere, cifre, cratime și puncte. Trebuie să conțină cel puțin
      un
      punct, nu poate începe sau termina cu cratimă ori punct și nu poate conține
      puncte
      consecutive.

      Folosește SET fără tipar pentru a elimina hostul impus.

      Comandă rezervată utilizatorilor Root.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Vhost forțat pentru %role%"
      empty: "Rolul %role% nu are un model de vhost forțat setat."
      line: "Model: %pattern%"
      example: "Exemplu: %example_nickname%.%pattern%"
      example_nickname: "poreclă"
    set:
      done: "Model de vhost forțat setat pentru rolul %role%."
      cleared: "Modelul de vhost forțat a fost eliminat din rolul %role%."
      invalid: "Model de vhost invalid. Caractere valide: a-z, A-Z, 0-9, - și .. Trebuie să aibă cel puțin un punct, nu poate începe/termina cu - sau . sau să aibă .."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <poreclă> <motiv>"
  short: "Deconectați forțat un utilizator din rețea."
  help: |-
    Deconectează un utilizator de la rețeaua IRC.
    IRCop-ii și utilizatorii Root nu pot fi eliminați.
  example: "%command_prefix%KILL BadUser Floodare pe canale"
  protected_root: "Nu se poate da kill utilizatorului Root %nickname%."
  protected_ircop: "Nu se poate da kill operatorului IRC %nickname%."
  done: "Utilizatorul %nickname% a primit kill (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <mască> <expirare> <motiv>|DEL {<mască>|<număr>}|LIST [mască]}"
  short: "Gestionați G-line-urile la nivel de rețea."
  help: |-
    Gestionează G-line-uri (banuri globale) pentru rețea.
    ADD adaugă un G-line cu mască, expirare și motiv.
    DEL elimină un G-line după mască sau numărul intrării.
    LIST afișează toate G-line-urile, cu filtrare opțională după mască.

    Expirare: 0 = permanent sau sufixul d, h, m (ex.: 7d, 12h, 30m).
    G-line-urile care corespund utilizatorilor Root sau IRCop sunt respinse.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuz de spam"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuz persistent"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Subcomandă necunoscută %sub%. Folosiți ADD, DEL sau LIST."
  invalid_mask: "Format de mască invalid. Trebuie să fie în format utilizator@host (de ex. *@192.168.*)."
  global_mask: "Masca G-line %mask% este prea largă. Măștile globale nu sunt permise."
  dangerous_mask: "Masca G-line %mask% este prea largă. Partea de host necesită cel puțin 4 caractere alfanumerice."
  protected_user: "Nu se poate seta G-line pentru utilizatorul protejat %nickname%."
  invalid_expiry: "Format de expirare invalid. Folosiți 0 pentru permanent sau o valoare precum 7d, 12h, 30m."
  already_exists: "G-line pentru %mask% există deja."
  max_entries: "Numărul maxim de G-line-uri (%max%) a fost atins."
  not_found: "G-line %mask% nu a fost găsit."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <mască> <expirare> <motiv>"
    short: "Adăugați un G-line la nivel de rețea."
    help: |-
      Adaugă un G-line (ban global) pentru rețea.
      Masca trebuie să aibă formatul utilizator@host.
      Expirare: 0 = permanent sau sufixul d, h, m (ex.: 7d, 12h, 30m).
      G-line-urile care corespund utilizatorilor Root sau IRCop sunt respinse.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuz de spam"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuz persistent"
    done: "G-line adăugat: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<mască>|<număr>}"
    short: "Eliminați un G-line."
    help: |-
      Elimină un G-line din listă.
      Poți indica masca sau numărul intrării din LIST.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% eliminat."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [mască]"
    short: "Listați toate G-line-urile."
    help: "Listează toate G-line-urile. Opțional, filtrează după tiparul măștii."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-line-uri (%count%)"
    empty: "Nu există G-line-uri."
    entry: "%index%. %mask% - %reason% (%nickname%, expiră: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {serviciu|poreclă!ident@vhost} {PRIVMSG|NOTICE} <mesaj>"
  short: "Trimiteți un mesaj global tuturor utilizatorilor conectați."
  help: |-
    Trimite mesaje tuturor utilizatorilor conectați printr-un serviciu existent sau
    un client temporar cu identitate personalizată.

    Mesajele pot fi trimise ca PRIVMSG (privat) sau NOTICE (notificare).

    Pentru un client temporar, indică o mască în formatul poreclă!ident@vhost,
    folosind caractere valide în fiecare câmp.

    Porecla nu poate fi înregistrată sau folosită. Clientul se deconectează automat
    după trimitere, iar porecla este blocată timp de 24 de ore.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Mentenanță în 10 minute"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE Rețeaua va reporni"
  mask_invalid: "Format de mască invalid: %error%"
  nick_connected: "Porecla %nickname% este conectată în prezent."
  nick_registered: "Porecla %nickname% este înregistrată."
  type_invalid: "Tipul mesajului trebuie să fie PRIVMSG sau NOTICE."
  done: "Mesaj global trimis de la %nickname% către %count% utilizatori."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <linie>"
  short: "Trimiteți o linie de protocol brută către IRCd."
  help: |-
    Trimite linia indicată direct către socketul IRCd uplink.
    Folosește cu extremă precauție. Liniile de protocol invalide pot bloca rețeaua.
  example: "%command_prefix%RAW :services.ares NOTICE * :Mentenanță programată"
  empty: "Trebuie să specificați o linie nevidă de trimis."
  too_long: "Linia este prea lungă. Maxim 510 caractere."
  not_connected: "Neconectat la IRCd."
  done: "Linie brută trimisă."
  protocol:
    syntax: "Protocolul activ a respins sintaxa comenzii RAW."
    done: "Comanda RAW gestionată de protocol a fost executată."
    target: "Protocolul activ a respins ținta %target%."
    unsupported: "Protocolul activ nu acceptă această comandă RAW."
    invalid_resource_type: "Tip necunoscut de resursă de protocol: %resource_type%."
    invalid_resource: "Resursă de protocol invalidă: %resource%."
    invalid_value: "Valoare invalidă pentru resursa de protocol: %resource%."
    error: "Protocolul activ nu a putut executa comanda RAW."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator% execută comanda GLOBAL cu porecla %target% via %type% către %count% utilizatori. Mesaj: %message%"
  prefix_message: "Mesaj: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Gestionați mesajele MOTD de conectare trimise utilizatorilor la conectare."
  syntax: "MOTD {ADD <destinație> {PRIVMSG|NOTICE} <expirare> <mesaj>|DEL <id>|LIST|CLEAN}"
  help: |-
    Gestionează mesajele zilei (MOTD) trimise utilizatorilor când se conectează la
    rețea.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Subcomandă necunoscută. Folosiți: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {serviciu|poreclă!ident@vhost} {PRIVMSG|NOTICE} <expirare> <mesaj>"
    syntax_hint: "Utilizare: %syntax%"
    short: "Adăugați o intrare MOTD."
    help: "Adaugă un mesaj MOTD nou, trimis fiecărui utilizator la conectarea la rețea."
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Mentenanță în această seară"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Bun venit a la red"
    done: "Intrarea MOTD #%id% adăugată."
    invalid_type: "Tip de mesaj invalid. Trebuie să fie PRIVMSG sau NOTICE."
    invalid_expiry: "Format de expirare invalid. Folosește: <număr><s|m|h|d> sau 0 pentru nelimitat (de ex.: 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Utilizare: %syntax%"
    short: "Ștergeți o intrare MOTD."
    help: "Șterge o intrare MOTD după ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "Intrarea MOTD #%id% ștearsă."
    not_found: "Intrarea MOTD nu a fost găsită."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Listați toate intrările MOTD."
    help: "Listează toate intrările MOTD configurate."
    example: "%command_prefix%MOTD LIST"
    empty: "Nu există intrări MOTD configurate."
    header: "Intrări MOTD:"
    status_enabled: "activată"
    status_disabled: "dezactivată"
    expired: "expirată"
    no_bot: "(fără bot)"

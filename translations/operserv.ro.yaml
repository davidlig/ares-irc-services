# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <domeniu> <motiv>|DEL {număr|ALL}|LIST <model> [pagină]}"
  short: "Administrează domeniile email blocate."
  help: |-
    Administrează domeniile email blocate.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <domeniu> <motiv>"
    short: "Blochează un domeniu."
    help: |-
      Acceptă domenii ASCII sau punycode, nu adrese sau modele. Motivul este
      obligatoriu. Blocarea este exactă și nu include subdomenii.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {număr|ALL}"
    short: "Elimină blocările domeniilor."
    help: |-
      Șterge un identificator permanent sau toate intrările cu ALL. Ceilalți
      identificatori nu se schimbă.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <model> [pagină]"
    short: "Listează domeniile blocate."
    help: |-
      Modelul este obligatoriu. Numai * este un metacaracter pentru orice
      secvență. Nu se diferențiază majusculele. Pagina opțională începe de
      la 1. Filtrarea și paginarea păstrează identificatorii.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Domeniu invalid. Folosește ASCII sau punycode fără punct final."
  invalid_reason: "Este necesar un motiv administrativ nevid, pe o singură linie."
  duplicate: "Acest domeniu este deja blocat."
  not_found: "Nu există un domeniu blocat cu acest identificator."
  added: "Domeniul %domain% a fost blocat."
  deleted: "Blocarea %id% a fost eliminată."
  cleared: "Au fost eliminate %total% domenii blocate."
  empty: "Niciun domeniu blocat nu corespunde."
  header: "ID | Domeniu | Motiv"
  page: "Pagina %page%/%pages%, %total% domenii corespunzătoare."
  row: "%id% | %domain% | %reason%"

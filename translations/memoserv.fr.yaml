# Traductions de MemoServ — Français
# Domaine: memoserv
#
# Codes de formatage IRC (guillemets doubles ou blocs littéraux !irc) :
#   \x02        active/désactive le gras
#   \x03NN      couleur (DÉCIMAL : 03=vert, 04=rouge, 07=orange, 14=gris foncé)
#   \x03        réinitialise la couleur
#   \x0F        réinitialise tout le formatage
#
# Les couleurs IRC utilisent des nombres DÉCIMAUX (0-15), pas hexadécimaux.
#   \x0314 = gris foncé (14 décimal) : CORRECT
#   \x030F = couleur 0 suivie de la lettre F : ERREUR
#
# Texte IRC multiligne : !irc |- avec des sauts de ligne et des espaces réels.
# Les blocs sans balise ne décodent pas les échappements ; préserver CTCP.
# Exemples HELP : example/examples et %command_prefix%.
# Le présentateur ajoute /msg sans couleur et une marge de deux espaces.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {surnom|#canal} <message>"
  short: "Envoyer un message à un surnom ou un canal."
  help: |-
    Envoie un message à un pseudonyme ou à un salon enregistré. Le destinataire
    doit avoir activé le service de messages (ENABLE).
  example: "%command_prefix%SEND Ana Hola, ¿puedes revisar el memo?"
  examples:
    - "%command_prefix%SEND #aide Aviso para el canal"
  sent_nick: "Message envoyé à %nickname%."
  sent_channel: "Message envoyé au canal %channel%."
  throttled: "Vous devez attendre %seconds% seconde(s) avant d'envoyer un autre message."
  limit_reached: "Limite de messages atteinte pour %target%."
  ignored: "Vous ne pouvez pas envoyer de messages à cette cible, vous êtes sur sa liste d'ignorés."
  cannot_send_to_self: "Vous ne pouvez pas vous envoyer un message à vous-même."
  message_too_long: "Message trop long. Le maximum est de %max% caractères."
  service_disabled_for_target: "Le service de messages est désactivé pour %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#canal] <numéro>"
  short: "Lire un message par son numéro."
  help: |-
    Lit le message portant le numéro indiqué. Sans #salon, lit votre boîte de
    pseudonyme. Avec #salon, le niveau MEMOREAD est requis.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #aide 2"
  header: "Message n°%index% de %from% :"
  footer: "%separator% %date%"
  not_found: "Message n°%index% introuvable."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#canal]"
  short: "Lister les messages (non lus marqués par une * rouge)."
  help: |-
    Affiche vos messages ou ceux du salon. Les messages non lus sont signalés par
    un astérisque rouge et un aperçu (50 caractères max.). Sans #salon : votre boîte
    ;
    avec #salon, le niveau MEMOREAD est requis.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #aide"
  header: "Messages pour %target% :"
  empty: "Aucun message pour %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#canal] {numéro|ALL}"
  short: "Supprimer un message par son numéro."
  help: |-
    Supprime un message par son numéro, ou vide la boîte avec ALL. Pour un
    canal, le niveau MEMOCHANGE est requis.
  example: "%command_prefix%DEL ALL"
  examples:
    - "%command_prefix%DEL 1"
    - "%command_prefix%DEL #aide 2"
    - "%command_prefix%DEL #aide ALL"
  deleted: "Message n°%index% supprimé."
  not_found: "Message n°%index% introuvable."
  all_deleted: "Tous les messages de cette boîte ont été supprimés."
  none_to_delete: "Aucun message à supprimer."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#canal] <surnom>|DEL [#canal] <surnom>|LIST [#canal]}"
  short: "Gérer la liste d'ignorés pour les messages."
  help: |-
    Gère les pseudonymes dont vous ne souhaitez pas recevoir de messages, pour votre
    compte ou un salon enregistré. Pour modifier la liste d’un salon, le droit
    MEMOCHANGE est nécessaire.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #aide Ana"
    - "%command_prefix%IGNORE LIST #aide"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#canal] <surnom>"
    short: "Ajoute un pseudonyme à la liste des ignorés."
    help: |-
      Les messages de ce surnom ne seront pas acceptés pour votre boîte (ou celle du
      canal).
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #aide Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#canal] <surnom>"
    short: "Supprime un pseudonyme de la liste."
    help: "Retire le surnom de la liste d'ignorés."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #aide Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#canal]"
    short: "Affiche les pseudonymes ignorés."
    help: "Affiche la liste des surnoms que vous (ou le canal) ignorez pour les messages."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #aide"
  added: "%nickname% ajouté à la liste d'ignorés."
  removed: "%nickname% retiré de la liste d'ignorés."
  already_ignored: "%nickname% est déjà sur la liste d'ignorés."
  not_ignored: "%nickname% n'est pas sur la liste d'ignorés."
  limit_reached_nick: "Limite de la liste d'ignorés atteinte pour votre surnom (max %limit%)."
  limit_reached_channel: "Limite de la liste d'ignorés atteinte pour %channel% (max %limit%)."
  list_empty: "La liste d'ignorés est vide."
  list_header: "Liste d'ignorés :"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#canal]"
  short: "Activer la réception de messages."
  help: |-
    Active la réception de messages pour votre pseudonyme ; dans les salons, seul
    le fondateur peut l’activer.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #aide"
  enabled_nick: "Service de messages activé pour votre surnom."
  enabled_channel: "Service de messages activé pour le canal %channel%."
  already_enabled_nick: "Le service de messages est déjà activé pour votre surnom."
  already_enabled_channel: "Le service de messages est déjà activé pour %channel%."
  founder_only: "Seul le fondateur du canal peut activer les messages pour %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#canal]"
  short: "Désactiver la réception de messages."
  help: |-
    Désactive la réception de messages pour votre pseudonyme ou le salon. Dans les
    salons, seul le fondateur peut le désactiver.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #aide"
  disabled_nick: "Service de messages désactivé pour votre surnom."
  disabled_channel: "Service de messages désactivé pour le canal %channel%."
  already_disabled_nick: "Le service de messages est déjà désactivé pour votre surnom."
  already_disabled_channel: "Le service de messages est déjà désactivé pour %channel%."
  founder_only: "Seul le fondateur du canal peut désactiver les messages pour %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [commande] [option]"
  short: "Lister les commandes ou afficher l'aide d'une commande."
  help: "Affiche la liste des commandes ou l’aide détaillée d’une commande ou option."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permet d’envoyer et de recevoir des messages entre utilisateurs enregistrés et
    d’envoyer des annonces aux salons. Les messages sont conservés pour être
    consultés
    plus tard, même lorsque le destinataire est déconnecté.
  general_header: "Commandes disponibles :"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Options :"
  examples_header: "Exemples :"
  general_help_command: "HELP <commande>"
  option_help_command: "HELP %command% <option>"
  general_footer: "Utilisez /msg %bot% %help_command% pour plus d’informations."
  set_sub_footer: "Utilisez /msg %bot% %help_command% pour plus d’informations."
  syntax_label: "Syntaxe : %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Messages"
    preferences: "Préférences"
  ircop_header: "Commandes disponibles pour les IRCops :"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_pending: "Vous avez %count% message(s) en attente de lecture. Pour les afficher : /msg %bot% %list%"
  channel_pending: "Le salon %channel% a %count% message(s) en attente de lecture. Consultez-les avec /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "Votre demande d’enregistrement de %channel% a été acceptée."
  rejected: "Votre demande d’enregistrement de %channel% a été refusée."
  reason: "Raison : %reason%"
  restriction: "Disponible à partir du : %date%"

# Traductions de MemoServ — Français
# Domaine: memoserv
#
# Codes de formatage IRC (guillemets doubles ou blocs littéraux !irc) :
#   \x02        active/désactive le gras
#   \x03NN      couleur (DÉCIMAL : 03=vert, 04=rouge, 07=orange, 14=gris foncé)
#   \x03        réinitialise la couleur
#   \x0F        réinitialise tout le formatage
#
# Les couleurs IRC utilisent des nombres DÉCIMAUX (0-15), pas hexadécimaux.
#   \x0314 = gris foncé (14 décimal) : CORRECT
#   \x030F = couleur 0 suivie de la lettre F : ERREUR
#
# Texte IRC multiligne : !irc |- avec des sauts de ligne et des espaces réels.
# Les blocs sans balise ne décodent pas les échappements ; préserver CTCP.
# Exemples HELP : example/examples et %command_prefix%.
# Le présentateur ajoute /msg sans couleur et une marge de deux espaces.

# --- SEND ------------------------------------------------------------------
send:
  syntax: "SEND {surnom|#canal} <message>"
  short: "Envoyer un message à un surnom ou un canal."
  help: |-
    Envoie un message à un pseudonyme ou à un salon enregistré. Le destinataire
    doit avoir activé le service de messages (ENABLE).
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND Ana Hola, ¿puedes revisar el memo?\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND #aide Aviso para el canal\x03\x0F"
  sent_nick: "\x0303✔\x03 Message envoyé à \x02%nickname%\x02."
  sent_channel: "\x0303✔\x03 Message envoyé au canal \x02%channel%\x02."
  throttled: "\x0304✗\x03 Vous devez attendre \x02%seconds%\x02 seconde(s) avant d'envoyer un autre message."
  limit_reached: "\x0304✗\x03 Limite de messages atteinte pour \x02%target%\x02."
  ignored: "\x0304✗\x03 Vous ne pouvez pas envoyer de messages à cette cible, vous êtes sur sa liste d'ignorés."
  cannot_send_to_self: "\x0304✗\x03 Vous ne pouvez pas vous envoyer un message à vous-même."
  message_too_long: "\x0304✗\x03 Message trop long. Le maximum est de \x02%max%\x02 caractères."
  service_disabled_for_target: "\x0304✗\x03 Le service de messages est désactivé pour \x02%target%\x02."

# --- READ ------------------------------------------------------------------
read:
  syntax: "READ [#canal] <numéro>"
  short: "Lire un message par son numéro."
  help: |-
    Lit le message portant le numéro indiqué. Sans #salon, lit votre boîte de
    pseudonyme. Avec #salon, le niveau MEMOREAD est requis.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303READ 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303READ #aide 2\x03\x0F"
  header: "\x02\x0307Message n°%index%\x03 de \x02%from%\x02 :\x0F"
  footer: "\x0314─────────────────────────────\x03 \x0314%date%\x03"
  not_found: "\x0304✗\x03 Message n°%index% introuvable."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST [#canal]"
  short: "Lister les messages (non lus marqués par une * rouge)."
  help: |-
    Affiche vos messages ou ceux du salon. Les messages non lus sont signalés par
    un astérisque rouge et un aperçu (50 caractères max.). Sans #salon : votre boîte
    ;
    avec #salon, le niveau MEMOREAD est requis.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST #aide\x03\x0F"
  header: "\x02\x0307Messages pour %target%\x03 :\x0F"
  empty: "\x0307ℹ\x03 Aucun message pour \x02%target%\x02."

# --- DEL -------------------------------------------------------------------
del:
  syntax: "DEL [#canal] <numéro>"
  short: "Supprimer un message par son numéro."
  help: |-
    Supprime le message avec le numéro indiqué. Pour les canaux, nécessite le niveau
    MEMOCHANGE.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL #aide 2\x03\x0F"
  deleted: "\x0303✔\x03 Message n°%index% supprimé."
  not_found: "\x0304✗\x03 Message n°%index% introuvable."

# --- IGNORE ----------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD|DEL|LIST} [#canal] [surnom]"
  short: "Gérer la liste d'ignorés pour les messages."
  help: |-
    Gère les pseudonymes dont vous ne souhaitez pas recevoir de messages, pour votre
    compte ou un salon enregistré. Pour modifier la liste d’un salon, le droit
    MEMOCHANGE est nécessaire.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #aide Ana\x03\x0F"
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #aide\x03\x0F"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#canal] <surnom>"
    short: "Ajoute un pseudonyme à la liste des ignorés."
    help: |-
      Les messages de ce surnom ne seront pas acceptés pour votre boîte (ou celle du
      canal).
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD #aide Ana\x03\x0F"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#canal] <surnom>"
    short: "Supprime un pseudonyme de la liste."
    help: "Retire le surnom de la liste d'ignorés."
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #aide Ana\x03\x0F"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#canal]"
    short: "Affiche les pseudonymes ignorés."
    help: "Affiche la liste des surnoms que vous (ou le canal) ignorez pour les messages."
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #aide\x03\x0F"
  added: "\x0303✔\x03 \x02%nickname%\x02 ajouté à la liste d'ignorés."
  removed: "\x0303✔\x03 \x02%nickname%\x02 retiré de la liste d'ignorés."
  already_ignored: "\x0304✗\x03 \x02%nickname%\x02 est déjà sur la liste d'ignorés."
  not_ignored: "\x0304✗\x03 \x02%nickname%\x02 n'est pas sur la liste d'ignorés."
  limit_reached_nick: "\x0304✗\x03 Limite de la liste d'ignorés atteinte pour votre surnom (max \x02%limit%\x02)."
  limit_reached_channel: "\x0304✗\x03 Limite de la liste d'ignorés atteinte pour \x02%channel%\x02 (max \x02%limit%\x02)."
  list_empty: "\x0307ℹ\x03 La liste d'ignorés est vide."
  list_header: "\x02\x0307Liste d'ignorés :\x03\x0F"

# --- ENABLE ----------------------------------------------------------------
enable:
  syntax: "ENABLE [#canal]"
  short: "Activer la réception de messages."
  help: |-
    Active la réception de messages pour votre pseudonyme ; dans les salons, seul
    le fondateur peut l’activer.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE #aide\x03\x0F"
  enabled_nick: "\x0303✔\x03 Service de messages activé pour votre surnom."
  enabled_channel: "\x0303✔\x03 Service de messages activé pour le canal \x02%channel%\x02."
  already_enabled_nick: "\x0307ℹ\x03 Le service de messages est déjà activé pour votre surnom."
  already_enabled_channel: "\x0307ℹ\x03 Le service de messages est déjà activé pour \x02%channel%\x02."
  founder_only: "\x0304✗\x03 Seul le fondateur du canal peut activer les messages pour \x02%channel%\x02."

# --- DISABLE ---------------------------------------------------------------
disable:
  syntax: "DISABLE [#canal]"
  short: "Désactiver la réception de messages."
  help: |-
    Désactive la réception de messages pour votre pseudonyme ou le salon. Dans les
    salons, seul le fondateur peut le désactiver.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE #aide\x03\x0F"
  disabled_nick: "\x0303✔\x03 Service de messages désactivé pour votre surnom."
  disabled_channel: "\x0303✔\x03 Service de messages désactivé pour le canal \x02%channel%\x02."
  already_disabled_nick: "\x0307ℹ\x03 Le service de messages est déjà désactivé pour votre surnom."
  already_disabled_channel: "\x0307ℹ\x03 Le service de messages est déjà désactivé pour \x02%channel%\x02."
  founder_only: "\x0304✗\x03 Seul le fondateur du canal peut désactiver les messages pour \x02%channel%\x02."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [commande] [option]"
  short: "Lister les commandes ou afficher l'aide d'une commande."
  help: "Affiche la liste des commandes ou l’aide détaillée d’une commande ou option."
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP IGNORE ADD\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  intro: |-
    Permet d’envoyer et de recevoir des messages entre utilisateurs enregistrés et
    d’envoyer des annonces aux salons. Les messages sont conservés pour être
    consultés
    plus tard, même lorsque le destinataire est déconnecté.
  general_header: "\x02 ■ Commandes disponibles :\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Options :\x02"
  examples_header: "\x02 ■ Exemples :\x02"
  general_footer: "\x0310ℹ\x03\x0F Utilisez /msg %bot% \x02\x0303HELP <commande>\x03\x0F pour plus d’informations."
  set_sub_footer: "\x0310ℹ\x03\x0F Utilisez /msg %bot% \x02\x0303HELP %command% <option>\x03\x0F pour plus d’informations."
  syntax_label: "Syntaxe : \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    messages: "Messages"
    preferences: "Préférences"
  ircop_header: "\x02 ■ Commandes disponibles pour les IRCops :\x02"

# --- NOTIFY ----------------------------------------------------------------
notify:
  nick_pending: "Vous avez \x02%count%\x02 message(s) en attente de lecture. Pour les afficher : /msg %bot% \x0303LIST\x03"
  channel_pending: "Le salon \x02%channel%\x02 a \x02%count%\x02 message(s) en attente de lecture. Consultez-les avec /msg %bot% \x0303LIST %channel%\x03"

# --- CHANNEL REGISTRATION DECISIONS ---
registration_decision:
  accepted: "Votre demande d’enregistrement de %channel% a été acceptée par %operator%."
  rejected: "Votre demande d’enregistrement de %channel% a été refusée par %operator%."
  reason: "Motif : %reason%"
  restriction: "Restriction restante : %remaining_seconds% secondes."
  restriction_indefinite: "Ce salon est soumis à une restriction indéfinie."

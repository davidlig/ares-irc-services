# NickServ translations — English
# Domain: nickserv
#
# IRC formatting codes (inside double-quoted strings, use \x## hex escapes):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=green, 04=red, 07=orange, 14=dark grey)
#   \x03        reset color
#   \x0F        reset all formatting
#
# IRC colors use DECIMAL numbers (0-15), not hexadecimal.
#   \x0314 = dark gray (14 decimal): CORRECT
#   \x030F = color 0 followed by the letter F: ERROR
#
# Multiline IRC text: !irc |- with physical newlines and real spaces.
# Untagged blocks do not decode escapes; preserve CTCP literals.
# HELP examples: example/examples and %command_prefix%.
# The presenter adds the uncolored /msg prefix and a two-space margin.

# --- REGISTER ---------------------------------------------------------------
register:
  token_unavailable: "\x0304✗\x03 The registration is pending, but its token could not be delivered.\nWait for this registration to expire before registering again."
  syntax: "REGISTER <password> [email]"
  short:            "Register your nickname with the services."
  help: "TOKEN: REGISTER <password> [email]. EMAIL: REGISTER <password> <email>.\nAfter you validate this token, it becomes your permanent recovery token. Store it safely: you can use it to recover your nickname. The %duration% expiry applies only before validation."
  example: "%command_prefix%\x02\x0303REGISTER SafePa$$word_123\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGISTER SafePa$$word_123 user@example.com\x03\x0F"
  pending:          "\x0307→\x03 A verification token has been sent to \x02%email%\x02.\n  Run \x0303/msg %bot% VERIFY <token>\x03 to complete registration.\n  Didn't receive it? Check spam or use \x0303/msg %bot% RESEND\x03\n  The token will expire in \x02%duration%\x02."
  already_registered: "\x0304✗\x03 Nickname \x02%nickname%\x02 is already registered."
  already_pending: "\x0307→\x03 Registration for \x02%nickname%\x02 is pending. Use \x0303VERIFY <token>\x03. \x0303RESEND\x03 is available only while REGMODE is EMAIL and a valid email is assigned."
  forbidden:        "\x0304✗\x03 Nickname \x02%nickname%\x02 cannot be registered on this network."
  pending_deletion: "\x0304✗\x03 Nickname \x02%nickname%\x02 is pending deletion and cannot be registered."
  invalid_email:    "\x0304✗\x03 The email address provided is not valid."
  email_already_used: "\x0304✗\x03 The email \x02%email%\x02 is already in use by another nickname. Use a different address."
  throttled:          "\x0304✗\x03 You must wait \x02%minutes%\x02 minute(s) before trying to register again."
  guest_prefix_forbidden: "\x0304✗\x03 You cannot register a nick starting with \x02%prefix%\x02."

# --- VERIFY -----------------------------------------------------------------
verify:
  syntax:           "VERIFY <token>"
  short: "Confirms a registration or rescue token."
  help: "After you validate this token, it becomes your permanent recovery token. Store it safely: you can use it to recover your nickname. The %duration% expiry applies only before validation."
  example: "%command_prefix%\x02\x0303VERIFY <received_token>\x03\x0F"
  success:          "\x0303✔\x03 Nickname \x02%nickname%\x02 has been successfully registered and you are now identified."
  success_native:   "\x0303✔\x03 Nickname \x02%nickname%\x02 has been successfully registered. Use the native authentication shown below."
  invalid_token: "\x0304✗\x03 The rescue token is invalid."
  no_pending:       "\x0304✗\x03 You have no pending registration to verify."

# --- RESEND -----------------------------------------------------------------
resend:
  disabled: "\x0307ℹ\x03 \x0303RESEND\x03 is disabled while REGMODE is TOKEN."
  syntax:           "RESEND"
  short:            "Resend the verification token to your email."
  help: "RESEND is disabled while REGMODE is TOKEN.\nAfter you validate this token, it becomes your permanent recovery token. Store it safely: you can use it to recover your nickname. The %duration% expiry applies only before validation.\nIn EMAIL mode, RESEND renews the token and pending registration period for %duration%."
  example: "%command_prefix%\x02\x0303RESEND\x03\x0F"
  success:          "\x0307→\x03 Verification token resent to \x02%email%\x02."
  no_pending:       "\x0304✗\x03 You have no pending registration to resend a token for."
  throttled:        "\x0304✗\x03 You must wait \x02%minutes%\x02 minute(s) before requesting another verification email."

# --- RECOVER -----------------------------------------------------------------
recover:
  no_email: "\u000304✗\u0003 No email is set for nickname \u0002%nickname%\u0002. Recovery is not available."
  email_sent: "\u000307→\u0003 A recovery token has been sent to \u0002%email_hint%\u0002. Check your inbox (and spam folder)."
  pending_deletion: "\x0304✗\x03 Nickname \x02%nickname%\x02 is pending deletion and cannot be recovered."
  instructions: "\x0307ℹ\x03 Use \x0303RECOVER %nickname% <token>\x03 with your confirmed recovery token. \x02REGMODE TOKEN\x02 does not send email."
  syntax:           "RECOVER <nickname> [token]"
  short:            "Recover your nickname if you lost your password."
  help: "EMAIL: RECOVER <nickname> requests a provisional token by email. TOKEN: provide your confirmed recovery token. RECOVER <nickname> <token> accepts a valid emailed token or confirmed recovery token. An emailed token replaces the stored credential only after validation. Using the stored credential offers an optional replacement through VERIFY; ignore that message to keep your current token."
  example: "%command_prefix%\x02\x0303RECOVER User\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303RECOVER User <received_token>\x03\x0F"
  pending: "\x0307→\x03 Registration for \x02%nickname%\x02 is pending. Use \x0303VERIFY <token>\x03. \x0303RESEND\x03 is available only while REGMODE is EMAIL and a valid email is assigned."
  suspended:        "\x0304✗\x03 Nickname \x02%nickname%\x02 is suspended. Reason: %reason%"
  forbidden:        "\x0304✗\x03 Nickname \x02%nickname%\x02 cannot be used on this network."
  throttled: "\x0304✗\x03 Too many invalid tokens. Try again in \x02%minutes%\x02 minute(s)."
  invalid_token: "\x0304✗\x03 The rescue token is invalid."
  success_identify: "\x0303✔\x03 Password reset. Identify now: \x0303%identify_cmd%\x03"
  success_then_change: "Then change your password: \x0303/msg %bot% SET PASSWORD <new_password>\x03"

# --- IDENTIFY ---------------------------------------------------------------
identify:
  syntax:           "IDENTIFY <nickname> <password>"
  short:            "Identify yourself as the owner of a nickname."
  help:             "Authenticates your session with %nickserv% using your nickname and password.\nAfter a successful identification you will receive the registered mode \x02+r\x02\nand, if you were using a guest nick, your registered nick will be restored."
  example: "%command_prefix%\x02\x0303IDENTIFY User <password>\x03\x0F"
  native_syntax:    "/NICK <nickname>:<password> | /NICK <nickname>!<password>"
  native_short:     "Show the native nickname authentication syntax."
  native_help:      "This protocol authenticates accounts through nickname changes.\nUse /NICK <nickname>:<password> or, if the nickname is in use, /NICK <nickname>!<password>."
  native_example: "\x02\x0303/NICK User:<password>\x03\x0F"
  native_examples:
    - "%command_prefix%\x02\x0303/NICK User!<password>\x03\x0F"
  native_authentication: "\x0307ℹ\x03 This protocol handles authentication through nickname changes. Use \x0303/NICK <nickname>:<password>\x03 or, if the nickname is in use, \x0303/NICK <nickname>!<password>\x03."
  success:          "\x0303✔\x03 You are now identified as \x02%nickname%\x02."
  already_identified: "\x0307ℹ\x03 You are already identified as \x02%nickname%\x02."
  invalid_credentials: "\x0304✗\x03 Incorrect password. Please try again."
  locked_out:         "\x0304✗\x03 Too many failed attempts. Try again in \x02%minutes%\x02 minute(s)."
  ghost_released:   "\x0307⚡\x03 The ghost session holding \x02%nickname%\x02 has been disconnected."
  kill_reason:      "Nick %nickname% reclaimed by %source% (the registered owner has identified)"
  pending:          "\x0304✗\x03 Nickname \x02%nickname%\x02 is pending email verification.\n  Run \x0303/msg %bot% VERIFY <token>\x03 or \x0303/msg %bot% RESEND\x03."
  suspended:        "\x0304✗\x03 Nickname \x02%nickname%\x02 is suspended. Reason: %reason%"
  forbidden:        "\x0304✗\x03 Nickname \x02%nickname%\x02 cannot be used on this network."
  pending_deletion: "\x0304✗\x03 Nickname \x02%nickname%\x02 is pending deletion and cannot be used."

# --- STATUS -----------------------------------------------------------------
status:
  syntax:           "STATUS <nickname>"
  short:            "Display the registration status of a nickname."
  help:             "Shows the current status of a nickname: registered, pending verification,\nsuspended, or forbidden."
  example: "%command_prefix%\x02\x0303STATUS User\x03\x0F"
  header:           "\x02Status of nick \x0307%nickname%\x03\x02"
  unregistered:     "  Status          : Not registered"
  not_registered_offline: "  Status          : \x0315Not registered\x03"
  pending:          "  Status          : \x0307Pending verification\x03"
  pending_expires:  "  Expires in      : %minutes% minute(s)"
  pending_expires_at: "  Expires at      : %date%"
  not_connected:    "  Status          : \x0315Not connected\x03"
  not_identified:   "  Status          : \x0307Not identified\x03"
  identified:       "  Status          : \x0303Identified\x03"
  suspended:        "  Status          : \x0304Suspended\x03"
  suspended_reason: "  Reason          : %reason%"
  suspended_until:  "  Ends on         : %date%"
  suspended_permanent: "  Ends on         : Permanent"
  forbidden:        "  Status          : \x0304Forbidden\x03"
  forbidden_reason: "  Reason          : %reason%"
  pending_deletion:   "  \x0314Status\x03          : \x0307Pending deletion\x03"
  pending_deletion_at: "  \x0314Dropped\x03         : %date%"

# --- INFO -------------------------------------------------------------------
info:
  syntax:           "INFO <nickname>"
  short:            "Display information about a registered nickname."
  help:             "Shows registration details for a nickname: registration date, connection\nstatus, last quit message, and email address. The email is only visible to\nthe owner when identified. With PRIVATE ON only the owner and IRC Operators\ncan view the information."
  example: "%command_prefix%\x02\x0303INFO User\x03\x0F"
  private:          "\x0304✗\x03 Nickname \x02%nickname%\x02 information is private."
  header:           "\x02Information for nickname \x0307%nickname%\x03\x02"
  status:           "  \x0314Status\x03          : %status%"
  status_registered:  "\x0303Registered\x03"
  status_suspended:   "\x0304Suspended\x03"
  status_forbidden:   "\x0304Forbidden\x03"
  status_pending_deletion: "\x0307Pending deletion\x03"
  reason:           "  \x0314Reason\x03          : %reason%"
  suspended_until:  "  \x0314Ends on\x03         : %date%"
  suspended_permanent: "  \x0314Ends on\x03         : Permanent"
  registered_at:    "  \x0314Registered\x03      : %date%"
  last_seen_online: "  \x0314Last seen\x03       : \x0303● NOW ONLINE\x03"
  last_seen_at:     "  \x0314Last seen\x03       : %date%"
  last_seen_never:  "  \x0314Last seen\x03       : Never"
  last_quit:        "  \x0314Last quit msg\x03   : %message%"
  last_connect:     "  \x0314Last seen from\x03  : %ip% (%host%)"
  language:         "  \x0314Language\x03        : %language%"
  email:            "  \x0314Email\x03           : %email%"
  vhost:            "  \x0314VHost\x03           : %vhost%"
  no_expire:        "  \x0314Never Expires\x03   : Yes"
  pending_deletion_at: "  \x0314Dropped\x03                : %date%"
  pending_deletion_until: "  \x0314Hard delete on\x03         : %date%"
  pending_deletion_notice: "  \x0307This nickname is pending deletion and cannot be registered.\x03"
  channels_header:  "\x0314\x0AChannels with access:\x03"
  channels_entry_founder:   "  %channel% (\x0303Founder\x03)"
  channels_entry_successor: "  %channel% (\x0303Successor\x03)"
  channels_entry_access:    "  %channel% (%level%)"

# --- SET --------------------------------------------------------------------
set:
  syntax:           "SET <option> <value>"
  short:            "Change your nickname options."
  help:             "Modifies your %nickserv% nickname settings.\nYou must be identified to use this command."
  example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
  unknown_option:   "\x0304✗\x03 Unknown option \x02%option%\x02. Available options: %options%."

  password:
    syntax:         "SET PASSWORD <new_password>"
    short:          "Change your nickname password."
    help:           "Changes the password for your nickname. The new password takes\neffect immediately. Choose a strong password of at least 6 characters\nthat you do not use on other services."
    success:        "\x0303✔\x03 Your password has been updated successfully."

  email:
    token_required: "\x0304✗\x03 Use \x0303SET EMAIL <email> <token>\x03 with your confirmed rescue token."
    syntax: "SET EMAIL <email> <token>"
    short:          "Change the email address linked to your nickname (two-step confirmation)."
    help: "SET EMAIL changes the contact address after validating your rescue token, without consuming it. Format and uniqueness are checked; no confirmation email is sent."
    success:        "\x0303✔\x03 Your email has been updated to \x02%email%\x02."
    pending_sent:   "\x0307→\x03 A confirmation token has been sent to \x02%current_email%\x02.\n  To confirm the change to \x02%new_email%\x02 run:\n  \x0303/msg %bot% SET EMAIL %new_email% <token>\x03\n  The token expires in 1 hour."
    invalid_token:  "\x0304✗\x03 The token is invalid or has expired. Request a new one with \x0303SET EMAIL <new_email>\x03."

  language:
    syntax:         "SET LANGUAGE <code>"
    short:          "Change the language the services use to communicate with you."
    help:           "Changes the language %nickserv% and other services use when talking to you.\nAvailable languages:\n  \x02ca\x02 (Catalan)\n  \x02de\x02 (German)\n  \x02el\x02 (Greek)\n  \x02en\x02 (English)\n  \x02es\x02 (Spanish)\n  \x02eu\x02 (Basque)\n  \x02fr\x02 (French)\n  \x02gl\x02 (Galician)\n  \x02it\x02 (Italian)\n  \x02nl\x02 (Dutch)\n  \x02pl\x02 (Polish)\n  \x02pt\x02 (Portuguese)\n  \x02ro\x02 (Romanian)\n  \x02tr\x02 (Turkish)"
    success:        "\x0303✔\x03 Language changed to \x02%language%\x02."
    invalid:        "\x0304✗\x03 Unsupported language. Available languages: %languages%."

  timezone:
    syntax:         "SET TIMEZONE <timezone>"
    short:          "Set the timezone used when displaying dates."
    help:           "Sets the timezone used when %nickserv% shows dates.\nUse \x02HELP SET TIMEZONE\x02 for the region index; \x02HELP SET TIMEZONE <region>\x02 (e.g. Europe) for that region's timezones. Use \x02OFF\x02 to clear."
    success:        "\x0303✔\x03 Timezone set to \x02%timezone%\x02. Dates will be shown in this timezone."
    cleared:        "\x0303✔\x03 Timezone cleared. Dates will use the network default."
    invalid:        "\x0304✗\x03 Invalid timezone \x02%timezone%\x02. Use a valid identifier (e.g. UTC, Europe/Madrid)."

  private:
    syntax:         "SET PRIVATE {ON|OFF}"
    short:          "Enable or disable privacy for your nickname information."
    help:           "Controls the visibility of your nickname information in the INFO command.\nWith \x02PRIVATE ON\x02 only you and IRC Operators can view your details.\nWith \x02PRIVATE OFF\x02 your information is public to everyone."
    on:             "\x0303✔\x03 Your nickname information is now \x02private\x02."
    off:            "\x0303✔\x03 Your nickname information is now \x02public\x02."

  msg:
    syntax:         "SET MSG {ON|OFF}"
    short:          "Use PRIVMSG (ON) or NOTICE (OFF) for service replies."
    help:           "Controls how %nickserv% and other services send messages to you.\nWith \x02MSG ON\x02 replies are sent as \x02PRIVMSG\x02 (some clients may trigger replies or notifications).\nWith \x02MSG OFF\x02 replies are sent as \x02NOTICE\x02 (default; typically no auto-reply)."
    on:             "\x0303✔\x03 Service messages will now be sent as \x02PRIVMSG\x02."
    off:            "\x0303✔\x03 Service messages will now be sent as \x02NOTICE\x02."

  vhost:
    syntax:         "SET VHOST [vhost]"
    short:          "Set or clear your custom virtual host (displayed hostname)."
    help:           "Sets a custom hostname that others see when you are identified.\nRun \x02SET VHOST\x02 with no value to clear it. Only letters (a-z, A-Z), digits, hyphen and dot;\nno hyphen or dot at start/end of any block; max 48 characters. Unique per nickname."
    success:        "\x0303✔\x03 Your virtual host has been set to \x02%vhost%\x02."
    cleared:        "\x0303✔\x03 Your virtual host has been cleared."
    invalid:        "\x0304✗\x03 Invalid vhost. Only letters, digits, hyphen and dot (not at start/end of block); max 48 characters."
    taken:          "\x0304✗\x03 That vhost is already in use by another nickname."
    forced:         "\x0304✗\x03 Your vhost is configured automatically and cannot be changed with SET VHOST."

# --- SASET (IRCop) --------------------------------------------------------------
saset:
  syntax:           "SASET <nickname> <option> <value>"
  short:            "Modify another nickname's settings."
  help:             |
    Allows an IRCop to modify a registered nickname's settings.
    The target nickname cannot be a Root user, IRCop, or service.

    Available options: PASSWORD, EMAIL, LANGUAGE, TIMEZONE, PRIVATE, MSG, VHOST

    SASET PASSWORD: Changes the password directly (without email confirmation).
    SASET EMAIL: Changes the email directly (without token validation).

    This command requires IRCop permission: nickserv.saset

    Syntax: SASET <nickname> <option> <value>
    Example: SASET User PASSWORD newpass
  unknown_option:   "\x0304✗\x03 Unknown option \x02%option%\x02. Available options: %options%."
  cannot_modify_oper: "\x0304✗\x03 Cannot modify an IRC Operator nickname."

  password:
    syntax:         "SASET <nickname> PASSWORD <new_password>"
    short:          "Change a nickname's password."
    help:           "Changes another nickname's password.\nThe change is immediate.\n\nSyntax: SASET <nickname> PASSWORD <new_password>\nExample: SASET User PASSWORD newpass123"

  email:
    syntax:         "SASET <nickname> EMAIL <new_email>"
    short:          "Change a nickname's email."
    help:           "Changes another nickname's email.\nNo confirmation is sent—the change is immediate.\n\nSyntax: SASET <nickname> EMAIL <new_email>\nExample: SASET User EMAIL user@example.com"

  language:
    syntax:         "SASET <nickname> LANGUAGE <code>"
    short:          "Change a nickname's language."
    help:           "Changes another nickname's language.\nAvailable languages: en (English), es (Spanish).\n\nSyntax: SASET <nickname> LANGUAGE <code>\nExample: SASET User LANGUAGE es"

  timezone:
    syntax:         "SASET <nickname> TIMEZONE <timezone|OFF>"
    short:          "Change a nickname's timezone."
    help:           "Sets or clears another nickname's timezone.\nUse OFF to clear it.\n\nSyntax: SASET <nickname> TIMEZONE <timezone>\nExample: SASET User TIMEZONE Europe/London"

  private:
    syntax:         "SASET <nickname> PRIVATE {ON|OFF}"
    short:          "Change a nickname's privacy."
    help:           "Enables or disables privacy for another nickname's information.\n\nSyntax: SASET <nickname> PRIVATE {ON|OFF}\nExample: SASET User PRIVATE ON"

  msg:
    syntax:         "SASET <nickname> MSG {ON|OFF}"
    short:          "Change a nickname's message preference."
    help:           "Sets whether another nickname receives responses as PRIVMSG (ON) or NOTICE (OFF).\n\nSyntax: SASET <nickname> MSG {ON|OFF}\nExample: SASET User MSG ON"

  vhost:
    syntax:         "SASET <nickname> VHOST [vhost]"
    short:          "Change a nickname's virtual host."
    help:           "Sets or clears another nickname's virtual host.\nRun \x02SASET <nickname> VHOST\x02 with no value to clear it.\n\nSyntax: SASET <nickname> VHOST [vhost]\nExample: SASET User VHOST users.example.com"


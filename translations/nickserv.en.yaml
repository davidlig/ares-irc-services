# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "Nick %nickname% is registered. You will be renamed if you don't identify."
  renamed_to: |-
    You have been renamed to %guest_nick%. To recover your nickname:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <password>"
  nick_forbidden: "Nickname %nickname% is forbidden: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Get the nickname's real IP address and hostname."
  help: |-
    Shows a nickname's real IP address and hostname.
    Use responsibly: this is sensitive information.
  example: "%command_prefix%USERIP User"
  result: "Nickname: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Find nicknames by the IP address of their last identified connection."
  help: |-
    Shows registered nicknames whose last identified connection used this IP
    address. The stored address may be outdated.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "No registered nicknames match this IP address."
  header: "Matching nicknames:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <duration> <reason>"
  short: "Suspend a nickname."
  help: |-
    Prevents the owner from identifying. Specify the duration in days (d),
    hours (h), minutes (m), or use 0 for a permanent suspension. IRC operators
    and Root users cannot be suspended.
  example: "%command_prefix%SUSPEND BadUser 7d Spam in #help"
  examples:
    - "%command_prefix%SUSPEND Troublemaker 0 Ban evasion"
  success: "Nickname %nickname% has been suspended until %duration%."
  already_suspended: "Nickname %nickname% is already suspended."
  forbidden: "Nickname %nickname% is forbidden and cannot be suspended."
  cannot_suspend_oper: "Cannot suspend IRC operator %nickname%."
  cannot_suspend_root: "Cannot suspend root user %nickname%."
  cannot_suspend_service: "Cannot suspend service nickname %nickname%."
  invalid_duration: "Invalid duration. Use: %duration_format% (e.g., 7d, 12h, 30m) or %permanent% for permanent."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Remove suspension from a nickname."
  help: "Removes an active suspension so that the owner can identify again."
  example: "%command_prefix%UNSUSPEND User"
  success: "Suspension has been lifted from %nickname%."
  not_suspended: "Nickname %nickname% is not suspended."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Force rename a connected nickname to a random nickname."
  help: |-
    Forces a connected nickname to change to a random name with a prefix
    defined by the network.
  example: "%command_prefix%RENAME Troublemaker"
  cannot_rename_root: "Cannot rename root user %nickname%."
  cannot_rename_oper: "Cannot rename IRC operator %nickname%."
  cannot_rename_service: "Cannot rename service nickname %nickname%."
  success: "Nickname %nickname% has been renamed to %new_nick%."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Drop a registered nickname."
  help: |-
    Marks a registered nickname for deletion during the grace period; it can be
    restored with RESTORE. Add FORCE to delete it permanently. Root users, IRC
    operators, services and your own nickname cannot be deleted.
  force:
    short: "Permanently deletes a nickname that is pending deletion."
  example: "%command_prefix%DROP OldAccount"
  examples:
    - "%command_prefix%DROP OldAccount FORCE"
  suspended: "Nickname %nickname% is suspended. Unsuspend first."
  forbidden: "Nickname %nickname% is forbidden."
  cannot_drop_root: "Cannot drop root user %nickname%."
  cannot_drop_oper: "Cannot drop IRC operator %nickname%."
  cannot_drop_self: "You cannot drop your own nickname."
  success: "Nickname %nickname% has been marked for deletion and can be restored during the grace period."
  force_success: "Nickname %nickname% has been permanently dropped."
  pending_deletion: "Nickname %nickname% is already pending deletion. Use DROP <nickname> force to delete it permanently."
  cannot_drop_service: "Cannot drop service nickname %nickname%."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Restore a nickname pending deletion."
  help: |-
    Restores a nickname pending deletion while it is still within the grace
    period.
  example: "%command_prefix%RESTORE OldAccount"
  success: "Nickname %nickname% has been restored."
  not_pending_deletion: "Nickname %nickname% is not pending deletion."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <reason>"
  short: "Permanently block a nickname from being used."
  help: |-
    Permanently forbids a nickname so that nobody can register or use it. If
    registered, its registration is deleted; if connected, it is forced to change
    to a random nickname. Root users, IRC operators and services cannot be banned.
  example: "%command_prefix%FORBID BadUser Repeated policy violations"
  success: "Nickname %nickname% has been forbidden."
  updated: "Forbidden reason for %nickname% has been updated."
  reason_required: "You must provide a reason for the prohibition."
  cannot_forbid_root: "Cannot forbid root user %nickname%."
  cannot_forbid_oper: "Cannot forbid IRC operator %nickname%."
  cannot_forbid_service: "Cannot forbid service nickname %nickname%."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Remove a nickname prohibition."
  help: "Removes a ban so that the nickname can be used again."
  example: "%command_prefix%UNFORBID BannedNick"
  success: "Nickname %nickname% is no longer forbidden."
  not_forbidden: "Nickname %nickname% is not forbidden."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <pattern>|DEL <pattern>|LIST}"
  short: "Manage forbidden vhost patterns."
  help: |-
    Manages patterns that prevent matching vhosts from being set with SET VHOST.
    The * wildcard matches any sequence and ? matches one character.
    Requires IRC operator privileges.
  example: "%command_prefix%FORBIDVHOST ADD *.pirate.example"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Unknown subcommand %sub%. Use ADD, DEL, or LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <pattern>"
    short: "Add a forbidden vhost pattern."
    help: |-
      Adds a pattern to the list. Users cannot set matching vhosts with SET VHOST.
      The * wildcard matches any sequence and ? matches one character.
    example: "%command_prefix%FORBIDVHOST ADD *.pirate.example"
    done: "Forbidden vhost pattern added: %pattern%"
    already_exists: "Pattern %pattern% already exists."
    invalid: "Invalid vhost pattern format."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <pattern>"
    short: "Remove a forbidden vhost pattern."
    help: "Removes a pattern from the forbidden vhost list."
    example: "%command_prefix%FORBIDVHOST DEL *.pirate.example"
    done: "Forbidden vhost pattern removed: %pattern%"
    not_found: "Pattern %pattern% not found."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "List all forbidden vhost patterns."
    syntax: "FORBIDVHOST LIST"
    help: "Shows all forbidden vhost patterns."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Forbidden vhost patterns (%count%):"
    entry: "%index%. %pattern% — by %nickname% (%date%)"
    empty: "No forbidden vhost patterns."

# --- HISTORY ---
history:
  syntax: "HISTORY <nickname> {ADD <message>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "View or manage nickname action history."
  help: |-
    Views and manages a nickname's action history. Suspensions, password or email
    changes and recoveries are recorded automatically.
    VIEW shows three entries per page; ALL shows the complete history.
  example: "%command_prefix%HISTORY User VIEW"
  examples:
    - "%command_prefix%HISTORY User VIEW ALL"
    - "%command_prefix%HISTORY User ADD Manual note"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <message>"
    short: "Add a manual history entry."
    help: "Adds a manual entry to the nickname history."
    example: "%command_prefix%HISTORY User ADD Reported for spam"
    success: "History entry added for %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "Delete a history entry by ID."
    help: "Removes a specific history entry by its ID."
    example: "%command_prefix%HISTORY User DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [PAGE|ALL]"
    short: "View nickname action history."
    help: |-
      Shows the nickname action history. Shows three entries per page by default.
      Use ALL to view every entry.
    example: "%command_prefix%HISTORY User VIEW"
    examples:
      - "%command_prefix%HISTORY User VIEW 2"
      - "%command_prefix%HISTORY User VIEW ALL"
    header: "%heading% (showing %start%-%end% of %total%):"
    header_title: "History for %nickname%"
    entry: "#%id% [%date%] %action% by %operator% — %message%"
    no_entries: "No history entries found for %nickname%."
    page_hint: "Use %command% for more entries."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Delete all history entries for a nickname."
    help: "Irreversibly removes every nickname history entry."
    example: "%command_prefix%HISTORY User CLEAR"
    success: "Cleared %count% history entries for %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Account activated"
  resend: "Verification email resent"
  noexpire_on: "Expiration protection enabled"
  noexpire_off: "Expiration protection disabled"
  userip: "USERIP consultation"
  history_clear: "History cleared"
  password_changed_owner: "Password changed by owner"
  password_changed_operator: "Password changed by operator"
  email_changed_owner: "Email changed from %old_email% to %new_email%"
  email_changed_operator: "Email changed to %new_email% by operator"
  recover: "Password reset via email token"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Old email: %value%"
  new_email: "New email: %value%"
  method: "Method: %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Set or remove expiration protection for a nickname."
  help: |-
    Controls whether the nickname expires through inactivity.
    ON prevents expiry and OFF applies the normal rules.
  example: "%command_prefix%NOEXPIRE User ON"
  examples:
    - "%command_prefix%NOEXPIRE User OFF"
  success_on: "Nickname %nickname% is now protected from expiration."
  success_off: "Nickname %nickname% will now expire normally."
  forbidden: "Nickname %nickname% is forbidden."
  suspended: "Nickname %nickname% is suspended."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <pattern> [page]"
  short: "List registered nicknames matching a pattern."
  help: |-
    Lists registered nicknames matching the pattern. The * wildcard matches any
    sequence of characters; the optional page starts at 1.
  example: "%command_prefix%LIST User*"
  examples:
    - "%command_prefix%LIST User* 2"
  header: "Nickname | Registration | Last connection | IP | Status"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "No nicknames match the pattern %pattern%."
  status_pending: "Pending"
  status_registered: "Registered"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Manage the network registration mode."
  help: |-
    Configures the registration mode for new accounts.

    %emphasis_0% Sends the verification token to the user's email address.
    %emphasis_1% Delivers the verification token directly over IRC.
    %emphasis_2% Shows the current registration mode without changing it.

    Pending registrations keep the mode in which they started.

    In TOKEN mode, RESEND remains disabled for all users.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Current registration mode: %mode%."
  changed: "Registration mode changed to %mode%."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: |-
    Rescue token: %token_display%

    Store this token in a safe place. You will need it to recover your nickname if you forget your password.

    To confirm it, use: /msg %bot% %verify%

    %warning%
  issued_warning: "IMPORTANT: Only the most recently generated token is valid. Once confirmed, it will not be displayed again. Do not share it with anyone."
  confirmed: "Your rescue token has been confirmed. Store it safely."
  unavailable: "Authenticate and confirm your rescue token with %command_0% before using this operation."
  unavailable_command_0: "VERIFY"
  locked_out: "Too many invalid tokens. Try again in %seconds% seconds."
  throttled: "Too many invalid tokens. Try again in %minutes% minute(s)."
  replaced: "Your recovery token has been replaced by the token validated from the email. Store that token safely."
  optional_replacement: |-
    Optional new recovery token: %token_display%

    To replace your current recovery token, use: /msg %bot% %verify%

    Your current token remains valid until confirmation.

    If you do not want to change it, ignore this message.
  replacement_unavailable: "Your password was reset, but a replacement token could not be issued. Your current recovery token is still valid."
  temporarily_unavailable: "Recovery token delivery is temporarily unavailable. Try again later."


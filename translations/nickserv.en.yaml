# NickServ translations — English
# Domain: nickserv
#
# IRC formatting codes (double-quoted strings or !irc literal blocks):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=green, 04=red, 07=orange, 14=dark gray)
#   \x03        reset color
#   \x0F        reset all formatting
#
# IRC colors use DECIMAL numbers (0-15), not hexadecimal.
#   \x0314 = dark gray (14 decimal): CORRECT
#   \x030F = color 0 followed by the letter F: ERROR
#
# Multiline IRC text: !irc |- with physical newlines and real spaces.
# Untagged blocks do not decode escapes; preserve CTCP literals.
# HELP examples: example/examples and %command_prefix%.
# The presenter adds the uncolored /msg prefix and a two-space margin.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    The registration is pending, but its token could not be delivered.
    Wait for this registration to expire before registering again.
  syntax: "REGISTER <password> [email]"
  short: "Register your nickname with the services."
  help: |-
    Registers your nickname. Depending on the network configuration, you will
    receive the verification token in chat or by email.
    Once validated, it becomes your permanent recovery token:
    keep it somewhere safe.
    The %duration% expiry applies only before validation.
    Administratively blocked email domains cannot be used.
  example: "%command_prefix%REGISTER SafePa$$word_123"
  examples:
    - "%command_prefix%REGISTER SafePa$$word_123 user@example.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "A verification token has been sent to %email%."
  pending_line_2: "Run /msg %bot% %verify% to complete registration."
  pending_line_3: "Not received it? Check spam or use /msg %bot% %resend%"
  pending_line_4: "The token will expire in %duration%."
  already_registered: "Nickname %nickname% is already registered."
  already_pending: "Registration for %nickname% is pending. Use %verify%. If the token was sent by email and a valid address is associated, you can request another with %resend%."
  forbidden: "Nickname %nickname% cannot be registered on this network."
  pending_deletion: "Nickname %nickname% is pending deletion and cannot be registered."
  invalid_email: "The email address provided is not valid."
  email_already_used: "The email %email% is already in use by another nickname. Use a different address."
  throttled: "You must wait %minutes% minute(s) before trying to register again."
  guest_prefix_forbidden: "You cannot register a nick starting with %prefix%."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirms a registration or rescue token."
  help: |-
    Once validated, this token becomes your permanent recovery token.
    Keep it somewhere safe: you can use it to recover your nickname.
    The %duration% expiry applies only before validation.
  example: "%command_prefix%VERIFY <received_token>"
  success: "Nickname %nickname% has been successfully registered and you are now identified."
  success_native: "Nickname %nickname% has been successfully registered. Use the native authentication shown below."
  invalid_token: "The rescue token is invalid."
  no_pending: "You have no pending registration to verify."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "You cannot request another token with %resend% because this registration delivers the token directly in chat."
  syntax: "RESEND"
  short: "Resend the verification token to your email."
  help: |-
    RESEND is only available if the verification token was sent by email.
    Once validated, this token becomes your permanent recovery token.
    Keep it somewhere safe: you can use it to recover your nickname.
    The %duration% expiry applies only before validation.
    Using RESEND sends you a new token by email.
    The pending registration deadline is renewed for %duration%.
  example: "%command_prefix%RESEND"
  success: "Verification token resent to %email%."
  no_pending: "You have no pending registration to verify."
  throttled: "You must wait %minutes% minute(s) before requesting another verification email."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "No email is set for nickname %nickname%. Recovery is not available."
  email_sent: "A recovery token has been sent to %email_hint%. Check your inbox (and spam folder)."
  pending_deletion: "Nickname %nickname% is pending deletion and cannot be recovered."
  instructions: "EMAIL: %command_0% requests a provisional token by email. TOKEN: provide your confirmed recovery token. %command_1% accepts either a valid email token or the confirmed token. The email token replaces the saved one only after validation. Using the saved token offers an optional replacement with %command_2%; ignore that message to keep the current one."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <nickname> [token]"
  short: "Recover your nickname if you lost your password."
  help: |-
    Without a token, requests a provisional token by email.
    You can also provide a valid recovery token; a provisional token replaces
    the saved one only after validation.
    Using the saved token offers an optional replacement with VERIFY;
    ignore that message to keep the current one.
  example: "%command_prefix%RECOVER User"
  examples:
    - "%command_prefix%RECOVER User <received_token>"
  pending: "Registration for %nickname% is pending. Use %command_0%. If the token was sent by email and a valid address is associated, you can request another with %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Nickname %nickname% is suspended. Reason: %reason%"
  forbidden: "Nickname %nickname% cannot be used on this network."
  throttled: "Too many invalid tokens. Try again in %minutes% minute(s)."
  invalid_token: "The rescue token is invalid."
  success_identify: "Password reset. Identify now: %identify_cmd%"
  success_then_change: "Then change your password: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <new_password>"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <password>"
  short: "Identify yourself as the owner of a nickname."
  help: |-
    Authenticates your session with %nickserv% using your nickname and password.
    After a successful identification you will receive the registered mode %emphasis_0%
    and, if you were using a guest nick, your registered nick will be restored.
  example: "%command_prefix%IDENTIFY User <password>"
  native_syntax: "/NICK <nickname>:<password> | /NICK <nickname>!<password>"
  native_short: "Show the native nickname authentication syntax."
  native_help: |-
    This protocol authenticates accounts through nickname changes.
    Use %emphasis_0% or, if the nickname is in use, %emphasis_1%.
  native_example: "/NICK User:<password>"
  native_examples:
    - "%command_prefix%/NICK User!<password>"
  native_authentication: "This protocol handles authentication through nickname changes. Use %command_0% or, if the nickname is in use, %command_1%."
  native_authentication_command_0: "/NICK <nickname>:<password>"
  native_authentication_command_1: "/NICK <nickname>!<password>"
  success: "You are now identified as %nickname%."
  already_identified: "You are already identified as %nickname%."
  invalid_credentials: "Incorrect password. Please try again."
  locked_out: "Too many failed attempts. Try again in %minutes% minute(s)."
  ghost_released: "The ghost session holding %nickname% has been disconnected."
  kill_reason: "Nick %nickname% reclaimed by %source% (the registered owner has identified)"
  pending: |-
    %first%
    %second%
  pending_line_1: "Nickname %nickname% is pending email verification."
  pending_line_2: "Run /msg %bot% %command_0% or /msg %bot% %command_1%"
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Nickname %nickname% is suspended. Reason: %reason%"
  forbidden: "Nickname %nickname% cannot be used on this network."
  pending_deletion: "Nickname %nickname% is pending deletion and cannot be used."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <nickname>"
  short: "Display the registration status of a nickname."
  help: |-
    Shows the current state of a nickname: registered, pending verification,
    suspended, and so on.
  example: "%command_prefix%STATUS User"
  header: "Status of nick %nickname%"
  unregistered: "  Status          : Not registered"
  not_registered_offline: "  Status          : %state%"
  value_not_registered_offline: "Not registered"
  pending: "  Status          : %state%"
  value_pending: "Pending verification"
  pending_expires: "  Expires in      : %minutes% minute(s)"
  pending_expires_at: "  Expires at      : %date%"
  not_connected: "  Status          : %state%"
  value_not_connected: "Not connected"
  not_identified: "  Status          : %state%"
  value_not_identified: "Not identified"
  identified: "  Status          : %state%"
  value_identified: "Identified"
  suspended: "  Status          : %state%"
  value_suspended: "Suspended"
  suspended_reason: "  Reason          : %reason%"
  suspended_until: "  Ends on         : %date%"
  suspended_permanent: "  Ends on         : Permanent"
  forbidden: "  Status          : %state%"
  value_forbidden: "Forbidden"
  forbidden_reason: "  Reason          : %reason%"
  pending_deletion: "  %label%          : %state%"
  value_pending_deletion: "Pending deletion"
  label_pending_deletion: "Status"
  pending_deletion_at: "  %label%         : %date%"

  label_pending_deletion_at: "Dropped"
# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <nickname>"
  short: "Display information about a registered nickname."
  help: |-
    Shows registration details for a nickname: registration date, connection
    status, last quit message and email address.

    The email is visible only to the identified owner.
    If the nickname is private, only its owner and IRC operators can view
    the information.
  example: "%command_prefix%INFO User"
  private: "Nickname %nickname% information is private."
  header: "Information for nickname %nickname%"
  status: "%label%          : %status%"
  label_status: "Status"
  status_registered: "Registered"
  status_suspended: "Suspended"
  status_forbidden: "Forbidden"
  status_pending_deletion: "Pending deletion"
  reason: "%label%          : %reason%"
  label_reason: "Reason"
  suspended_until: "%label%         : %date%"
  label_suspended_until: "Ends on"
  suspended_permanent: "%label%         : Permanent"
  label_suspended_permanent: "Ends on"
  registered_at: "%label%      : %date%"
  label_registered_at: "Registered"
  last_seen_online: "%label%       : %online%"
  label_last_seen_online: "Last seen"
  value_last_seen_online: "NOW ONLINE"
  last_seen_at: "%label%       : %date%"
  label_last_seen_at: "Last seen"
  last_seen_never: "%label%       : Never"
  label_last_seen_never: "Last seen"
  last_quit: "%label%   : %message%"
  label_last_quit: "Last quit msg"
  last_connect: "%label%  : %ip% (%host%)"
  label_last_connect: "Last seen from"
  language: "%label%        : %language%"
  label_language: "Language"
  email: "%label%           : %email%"
  label_email: "Email"
  vhost: "%label%           : %vhost%"
  label_vhost: "VHost"
  no_expire: "%label%   : Yes"
  label_no_expire: "Never Expires"
  pending_deletion_at: "%label%                : %date%"
  label_pending_deletion_at: "Dropped"
  pending_deletion_until: "%label%         : %date%"
  label_pending_deletion_until: "Hard delete on"
  pending_deletion_notice: "%notice%"
  value_pending_deletion_notice: "This nickname is pending deletion and cannot be registered."
  channels_header: |-

    Channels with access:
  channels_entry_founder: "%channel% (%role%)"
  channels_role_founder: "Founder"
  channels_entry_successor: "%channel% (%role%)"
  channels_role_successor: "Successor"
  channels_entry_access: "%channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <new_password>|EMAIL <email> <token>|LANGUAGE <code>|TIMEZONE <timezone>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Change your nickname options."
  help: |-
    Changes your nickname settings. You must be identified to change these
    options.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Unknown option %option%. Available options: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <new_password>"
    short: "Change your nickname password."
    help: |-
      Changes the password for your nickname. The new password takes
      effect immediately. Choose a strong password of at least 6 characters
      that you do not use on other services.
    example: "%command_prefix%SET PASSWORD SafePa$$word_123"
    success: "Your password has been updated successfully."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Use %value% with your confirmed rescue token."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Changes your email address using your confirmed rescue token."
    help: |-
      SET EMAIL changes the contact email after validating the rescue token,
      without consuming it. It checks format and uniqueness and sends no
      confirmation email.
      Administratively blocked email domains cannot be used.
    example: "%command_prefix%SET EMAIL user@example.com <confirmed_token>"
    success: "Your email has been updated to %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "A confirmation token has been sent to %current_email%."
    pending_line_2: "To confirm the change to %new_email%, run:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "The token expires in 1 hour."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "The token is invalid or has expired. Request a new one with %value%."
    invalid_token_value: "SET EMAIL <new_email>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <code>"
    short: "Change the language the services use to communicate with you."
    help: |-
      Changes the language %nickserv% and other services use when talking to you.
      Available languages:
      %emphasis_0% (Catalan)
      %emphasis_1% (German)
      %emphasis_2% (Greek)
      %emphasis_3% (English)
      %emphasis_4% (Spanish)
      %emphasis_5% (Basque)
      %emphasis_6% (French)
      %emphasis_7% (Galician)
      %emphasis_8% (Italian)
      %emphasis_9% (Dutch)
      %emphasis_10% (Polish)
      %emphasis_11% (Portuguese)
      %emphasis_12% (Romanian)
      %emphasis_13% (Turkish)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Language changed to %language%."
    invalid: "Unsupported language. Available languages: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <timezone>"
    short: "Set the timezone used when displaying dates."
    help: |-
      Sets the timezone %nickserv% uses to display dates. See HELP SET TIMEZONE
      for the regions. Use OFF to clear it.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Timezone set to %timezone%. Dates will be shown in this timezone."
    cleared: "Timezone cleared. Dates will use the network default."
    invalid: "Invalid timezone %timezone%. Use a valid identifier (e.g. UTC, Europe/Madrid)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Shows or hides your nickname information."
    help: |-
      Controls the visibility of your nickname information in the INFO command.
      With %emphasis_0% only you and IRC Operators can view your details.
      With %emphasis_1% your information is public to everyone.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Your nickname information is now %value%."
    on_value: "private"
    off: "Your nickname information is now %value%."
    off_value: "public"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Changes how services communicate with you."
    help: |-
      Controls how %nickserv% and the other services send you messages.
      With %emphasis_0%, replies are sent as %emphasis_1%.
      With %emphasis_2%, replies are sent as %emphasis_3%.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Service messages will now be sent as %value%."
    on_value: "PRIVMSG"
    off: "Service messages will now be sent as %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Sets or removes your virtual host."
    help: |-
      Sets a custom hostname that other users will see while you are identified.

      To remove it, run %emphasis_0% without a value.

      Only letters (a-z, A-Z), digits, hyphens and dots are allowed.
      Each component must start and end with a letter or digit.
      The hostname can be up to 48 characters and must be unique per nickname.
    example: "%command_prefix%SET VHOST user.example.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Your virtual host has been set to %vhost%."
    cleared: "Your virtual host has been cleared."
    invalid: "Invalid vhost. Only letters, digits, hyphen and dot (not at start/end of block); max 48 characters."
    taken: "That vhost is already in use by another nickname."
    forced: "Your vhost is configured automatically and cannot be changed with SET VHOST."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <nickname> {PASSWORD <new_password>|EMAIL <new_email>|LANGUAGE <code>|TIMEZONE {<timezone>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Modify another nickname's settings."
  help: |-
    Allows an IRC operator to change another registered nickname's settings.
    Root users, IRC operators and services cannot be targeted.
  example: "%command_prefix%SASET User PRIVATE ON"
  examples:
    - "%command_prefix%SASET User TIMEZONE OFF"
  unknown_option: "Unknown option %option%. Available options: %options%."
  cannot_modify_oper: "Cannot modify an IRC Operator nickname."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <nickname> PASSWORD <new_password>"
    short: "Change a nickname's password."
    help: "Changes another nickname's password. The change takes effect immediately."
    example: "%command_prefix%SASET User PASSWORD StrongPassword123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <nickname> EMAIL <new_email>"
    short: "Change a nickname's email."
    help: |-
      Changes another nickname's email address immediately. No rescue token is
      required and no confirmation email is sent.
      BADMAIL does not restrict this administrative email change.
    example: "%command_prefix%SASET User EMAIL user@example.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <nickname> LANGUAGE <code>"
    short: "Change a nickname's language."
    help: |-
      Changes another nickname's language. This command supports en (English)
      and es (Spanish).
    example: "%command_prefix%SASET User LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <nickname> TIMEZONE {<timezone>|OFF}"
    short: "Change a nickname's timezone."
    help: "Sets or clears another nickname's timezone. Use OFF to clear it."
    example: "%command_prefix%SASET User TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET User TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <nickname> PRIVATE {ON|OFF}"
    short: "Change a nickname's privacy."
    help: "Enables or disables privacy for another nickname's information."
    example: "%command_prefix%SASET User PRIVATE ON"
    examples:
      - "%command_prefix%SASET User PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <nickname> MSG {ON|OFF}"
    short: "Change a nickname's message preference."
    help: |-
      Sets whether another nickname receives replies as PRIVMSG (ON) or NOTICE
      (OFF).
    example: "%command_prefix%SASET User MSG ON"
    examples:
      - "%command_prefix%SASET User MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <nickname> VHOST [vhost]"
    short: "Change a nickname's virtual host."
    help: |-
      Sets or removes another nickname's virtual host. Run SASET <nickname> VHOST
      without a value to remove it.
    example: "%command_prefix%SASET User VHOST user.example.org"
    examples:
      - "%command_prefix%SASET User VHOST"


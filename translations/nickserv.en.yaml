# NickServ translations — English
# Domain: nickserv
#
# IRC formatting codes (double-quoted strings or !irc literal blocks):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=green, 04=red, 07=orange, 14=dark gray)
#   \x03        reset color
#   \x0F        reset all formatting
#
# IRC colors use DECIMAL numbers (0-15), not hexadecimal.
#   \x0314 = dark gray (14 decimal): CORRECT
#   \x030F = color 0 followed by the letter F: ERROR
#
# Multiline IRC text: !irc |- with physical newlines and real spaces.
# Untagged blocks do not decode escapes; preserve CTCP literals.
# HELP examples: example/examples and %command_prefix%.
# The presenter adds the uncolored /msg prefix and a two-space margin.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    \x0304✗\x03 The registration is pending, but its token could not be delivered.
    Wait for this registration to expire before registering again.
  syntax: "REGISTER <password> [email]"
  short: "Register your nickname with the services."
  help: |-
    Registers your nickname. Depending on the network configuration, you will
    receive the verification token in chat or by email.
    Once validated, it becomes your permanent recovery token:
    keep it somewhere safe.
    The %duration% expiry applies only before validation.
    Administratively blocked email domains cannot be used.
  example: "%command_prefix%\x02\x0303REGISTER SafePa$$word_123\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGISTER SafePa$$word_123 user@example.com\x03\x0F"
  pending: !irc |-
    \x0307→\x03 A verification token has been sent to \x02%email%\x02.
      Run /msg %bot% \x0303VERIFY <token>\x03 to complete registration.
      Not received it? Check spam or use /msg %bot% \x0303RESEND\x03
      The token will expire in \x02%duration%\x02.
  already_registered: "\x0304✗\x03 Nickname \x02%nickname%\x02 is already registered."
  already_pending: "\x0307→\x03 Registration for \x02%nickname%\x02 is pending. Use \x0303VERIFY <token>\x03. If the token was sent by email and a valid address is associated, you can request another with \x0303RESEND\x03."
  forbidden: "\x0304✗\x03 Nickname \x02%nickname%\x02 cannot be registered on this network."
  pending_deletion: "\x0304✗\x03 Nickname \x02%nickname%\x02 is pending deletion and cannot be registered."
  invalid_email: "\x0304✗\x03 The email address provided is not valid."
  email_already_used: "\x0304✗\x03 The email \x02%email%\x02 is already in use by another nickname. Use a different address."
  throttled: "\x0304✗\x03 You must wait \x02%minutes%\x02 minute(s) before trying to register again."
  guest_prefix_forbidden: "\x0304✗\x03 You cannot register a nick starting with \x02%prefix%\x02."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirms a registration or rescue token."
  help: |-
    Once validated, this token becomes your permanent recovery token.
    Keep it somewhere safe: you can use it to recover your nickname.
    The %duration% expiry applies only before validation.
  example: "%command_prefix%\x02\x0303VERIFY <received_token>\x03\x0F"
  success: "\x0303✔\x03 Nickname \x02%nickname%\x02 has been successfully registered and you are now identified."
  success_native: "\x0303✔\x03 Nickname \x02%nickname%\x02 has been successfully registered. Use the native authentication shown below."
  invalid_token: "\x0304✗\x03 The rescue token is invalid."
  no_pending: "\x0304✗\x03 You have no pending registration to verify."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "\x0307ℹ\x03 You cannot request another token with \x0303RESEND\x03 because this registration delivers the token directly in chat."
  syntax: "RESEND"
  short: "Resend the verification token to your email."
  help: |-
    RESEND is only available if the verification token was sent by email.
    Once validated, this token becomes your permanent recovery token.
    Keep it somewhere safe: you can use it to recover your nickname.
    The %duration% expiry applies only before validation.
    Using RESEND sends you a new token by email.
    The pending registration deadline is renewed for %duration%.
  example: "%command_prefix%\x02\x0303RESEND\x03\x0F"
  success: "\x0307→\x03 Verification token resent to \x02%email%\x02."
  no_pending: "\x0304✗\x03 You have no pending registration to verify."
  throttled: "\x0304✗\x03 You must wait \x02%minutes%\x02 minute(s) before requesting another verification email."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "\x0304✗\x03 No email is set for nickname \x02%nickname%\x02. Recovery is not available."
  email_sent: "\x0307→\x03 A recovery token has been sent to \x02%email_hint%\x02. Check your inbox (and spam folder)."
  pending_deletion: "\x0304✗\x03 Nickname \x02%nickname%\x02 is pending deletion and cannot be recovered."
  instructions: "\x0307ℹ\x03 EMAIL: \x0303RECOVER %nickname%\x03 requests a provisional token by email. TOKEN: provide your confirmed recovery token. \x0303RECOVER %nickname% <token>\x03 accepts either a valid email token or the confirmed token. The email token replaces the saved one only after validation. Using the saved token offers an optional replacement with \x0303VERIFY\x03; ignore that message to keep the current one."
  syntax: "RECOVER <nickname> [token]"
  short: "Recover your nickname if you lost your password."
  help: |-
    Without a token, requests a provisional token by email.
    You can also provide a valid recovery token; a provisional token replaces
    the saved one only after validation.
    Using the saved token offers an optional replacement with VERIFY;
    ignore that message to keep the current one.
  example: "%command_prefix%\x02\x0303RECOVER User\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303RECOVER User <received_token>\x03\x0F"
  pending: "\x0307→\x03 Registration for \x02%nickname%\x02 is pending. Use \x0303VERIFY <token>\x03. If the token was sent by email and a valid address is associated, you can request another with \x0303RESEND\x03."
  suspended: "\x0304✗\x03 Nickname \x02%nickname%\x02 is suspended. Reason: %reason%"
  forbidden: "\x0304✗\x03 Nickname \x02%nickname%\x02 cannot be used on this network."
  throttled: "\x0304✗\x03 Too many invalid tokens. Try again in \x02%minutes%\x02 minute(s)."
  invalid_token: "\x0304✗\x03 The rescue token is invalid."
  success_identify: "\x0303✔\x03 Password reset. Identify now: \x0303%identify_cmd%\x03"
  success_then_change: "Then change your password: /msg %bot% \x0303SET PASSWORD <new_password>\x03"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <password>"
  short: "Identify yourself as the owner of a nickname."
  help: !irc |-
    Authenticates your session with %nickserv% using your nickname and password.
    After a successful identification you will receive the registered mode \x02+r\x02
    and, if you were using a guest nick, your registered nick will be restored.
  example: "%command_prefix%\x02\x0303IDENTIFY User <password>\x03\x0F"
  native_syntax: "/NICK <nickname>:<password> | /NICK <nickname>!<password>"
  native_short: "Show the native nickname authentication syntax."
  native_help: |-
    This protocol authenticates accounts through nickname changes.
    Use /NICK <nickname>:<password> or, if the nickname is in use, /NICK <nickname>!<password>.
  native_example: "\x02\x0303/NICK User:<password>\x03\x0F"
  native_examples:
    - "%command_prefix%\x02\x0303/NICK User!<password>\x03\x0F"
  native_authentication: "\x0307ℹ\x03 This protocol handles authentication through nickname changes. Use \x0303/NICK <nickname>:<password>\x03 or, if the nickname is in use, \x0303/NICK <nickname>!<password>\x03."
  success: "\x0303✔\x03 You are now identified as \x02%nickname%\x02."
  already_identified: "\x0307ℹ\x03 You are already identified as \x02%nickname%\x02."
  invalid_credentials: "\x0304✗\x03 Incorrect password. Please try again."
  locked_out: "\x0304✗\x03 Too many failed attempts. Try again in \x02%minutes%\x02 minute(s)."
  ghost_released: "\x0307⚡\x03 The ghost session holding \x02%nickname%\x02 has been disconnected."
  kill_reason: "Nick %nickname% reclaimed by %source% (the registered owner has identified)"
  pending: !irc |-
    \x0304✗\x03 Nickname \x02%nickname%\x02 is pending email verification.
      Run /msg %bot% \x0303VERIFY <token>\x03 or /msg %bot% \x0303RESEND\x03
  suspended: "\x0304✗\x03 Nickname \x02%nickname%\x02 is suspended. Reason: %reason%"
  forbidden: "\x0304✗\x03 Nickname \x02%nickname%\x02 cannot be used on this network."
  pending_deletion: "\x0304✗\x03 Nickname \x02%nickname%\x02 is pending deletion and cannot be used."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <nickname>"
  short: "Display the registration status of a nickname."
  help: |-
    Shows the current state of a nickname: registered, pending verification,
    suspended, and so on.
  example: "%command_prefix%\x02\x0303STATUS User\x03\x0F"
  header: "\x02Status of nick \x0307%nickname%\x03\x02"
  unregistered: "  Status          : Not registered"
  not_registered_offline: "  Status          : \x0315Not registered\x03"
  pending: "  Status          : \x0307Pending verification\x03"
  pending_expires: "  Expires in      : %minutes% minute(s)"
  pending_expires_at: "  Expires at      : %date%"
  not_connected: "  Status          : \x0315Not connected\x03"
  not_identified: "  Status          : \x0307Not identified\x03"
  identified: "  Status          : \x0303Identified\x03"
  suspended: "  Status          : \x0304Suspended\x03"
  suspended_reason: "  Reason          : %reason%"
  suspended_until: "  Ends on         : %date%"
  suspended_permanent: "  Ends on         : Permanent"
  forbidden: "  Status          : \x0304Forbidden\x03"
  forbidden_reason: "  Reason          : %reason%"
  pending_deletion: "  \x0314Status\x03          : \x0307Pending deletion\x03"
  pending_deletion_at: "  \x0314Dropped\x03         : %date%"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <nickname>"
  short: "Display information about a registered nickname."
  help: |-
    Shows registration details for a nickname: registration date, connection
    status, last quit message and email address.

    The email is visible only to the identified owner.
    If the nickname is private, only its owner and IRC operators can view
    the information.
  example: "%command_prefix%\x02\x0303INFO User\x03\x0F"
  private: "\x0304✗\x03 Nickname \x02%nickname%\x02 information is private."
  header: "\x02Information for nickname \x0307%nickname%\x03\x02"
  status: "  \x0314Status\x03          : %status%"
  status_registered: "\x0303Registered\x03"
  status_suspended: "\x0304Suspended\x03"
  status_forbidden: "\x0304Forbidden\x03"
  status_pending_deletion: "\x0307Pending deletion\x03"
  reason: "  \x0314Reason\x03          : %reason%"
  suspended_until: "  \x0314Ends on\x03         : %date%"
  suspended_permanent: "  \x0314Ends on\x03         : Permanent"
  registered_at: "  \x0314Registered\x03      : %date%"
  last_seen_online: "  \x0314Last seen\x03       : \x0303● NOW ONLINE\x03"
  last_seen_at: "  \x0314Last seen\x03       : %date%"
  last_seen_never: "  \x0314Last seen\x03       : Never"
  last_quit: "  \x0314Last quit msg\x03   : %message%"
  last_connect: "  \x0314Last seen from\x03  : %ip% (%host%)"
  language: "  \x0314Language\x03        : %language%"
  email: "  \x0314Email\x03           : %email%"
  vhost: "  \x0314VHost\x03           : %vhost%"
  no_expire: "  \x0314Never Expires\x03   : Yes"
  pending_deletion_at: "  \x0314Dropped\x03                : %date%"
  pending_deletion_until: "  \x0314Hard delete on\x03         : %date%"
  pending_deletion_notice: "  \x0307This nickname is pending deletion and cannot be registered.\x03"
  channels_header: !irc |-
    \x0314
    Channels with access:\x03
  channels_entry_founder: "  %channel% (\x0303Founder\x03)"
  channels_entry_successor: "  %channel% (\x0303Successor\x03)"
  channels_entry_access: "  %channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <option> [value]"
  short: "Change your nickname options."
  help: |-
    Changes your nickname settings. You must be identified to change these
    options.
  example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
  unknown_option: "\x0304✗\x03 Unknown option \x02%option%\x02. Available options: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <new_password>"
    short: "Change your nickname password."
    help: |-
      Changes the password for your nickname. The new password takes
      effect immediately. Choose a strong password of at least 6 characters
      that you do not use on other services.
    example: "%command_prefix%\x02\x0303SET PASSWORD SafePa$$word_123\x03\x0F"
    success: "\x0303✔\x03 Your password has been updated successfully."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "\x0304✗\x03 Use \x0303SET EMAIL <email> <token>\x03 with your confirmed rescue token."
    syntax: "SET EMAIL <email> <token>"
    short: "Changes your email address using your confirmed rescue token."
    help: |-
      SET EMAIL changes the contact email after validating the rescue token,
      without consuming it. It checks format and uniqueness and sends no
      confirmation email.
      Administratively blocked email domains cannot be used.
    example: "%command_prefix%\x02\x0303SET EMAIL user@example.com <confirmed_token>\x03\x0F"
    success: "\x0303✔\x03 Your email has been updated to \x02%email%\x02."
    pending_sent: !irc |-
      \x0307→\x03 A confirmation token has been sent to \x02%current_email%\x02.
        To confirm the change to \x02%new_email%\x02, run:
        /msg %bot% \x0303SET EMAIL %new_email% <token>\x03
        The token expires in 1 hour.
    invalid_token: "\x0304✗\x03 The token is invalid or has expired. Request a new one with \x0303SET EMAIL <new_email>\x03."

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <code>"
    short: "Change the language the services use to communicate with you."
    help: !irc |-
      Changes the language %nickserv% and other services use when talking to you.
      Available languages:
        \x02ca\x02 (Catalan)
        \x02de\x02 (German)
        \x02el\x02 (Greek)
        \x02en\x02 (English)
        \x02es\x02 (Spanish)
        \x02eu\x02 (Basque)
        \x02fr\x02 (French)
        \x02gl\x02 (Galician)
        \x02it\x02 (Italian)
        \x02nl\x02 (Dutch)
        \x02pl\x02 (Polish)
        \x02pt\x02 (Portuguese)
        \x02ro\x02 (Romanian)
        \x02tr\x02 (Turkish)
    example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
    success: "\x0303✔\x03 Language changed to \x02%language%\x02."
    invalid: "\x0304✗\x03 Unsupported language. Available languages: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <timezone>"
    short: "Set the timezone used when displaying dates."
    help: |-
      Sets the timezone %nickserv% uses to display dates. See HELP SET TIMEZONE
      for the regions. Use OFF to clear it.
    example: "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET TIMEZONE OFF\x03\x0F"
    success: "\x0303✔\x03 Timezone set to \x02%timezone%\x02. Dates will be shown in this timezone."
    cleared: "\x0303✔\x03 Timezone cleared. Dates will use the network default."
    invalid: "\x0304✗\x03 Invalid timezone \x02%timezone%\x02. Use a valid identifier (e.g. UTC, Europe/Madrid)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Shows or hides your nickname information."
    help: !irc |-
      Controls the visibility of your nickname information in the INFO command.
      With \x02PRIVATE ON\x02 only you and IRC Operators can view your details.
      With \x02PRIVATE OFF\x02 your information is public to everyone.
    example: "%command_prefix%\x02\x0303SET PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET PRIVATE OFF\x03\x0F"
    on: "\x0303✔\x03 Your nickname information is now \x02private\x02."
    off: "\x0303✔\x03 Your nickname information is now \x02public\x02."

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Changes how services communicate with you."
    help: !irc |-
      Controls how %nickserv% and the other services send you messages.
      With \x02MSG ON\x02, replies are sent as \x02PRIVMSG\x02.
      With \x02MSG OFF\x02, replies are sent as \x02NOTICE\x02.
    example: "%command_prefix%\x02\x0303SET MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET MSG OFF\x03\x0F"
    on: "\x0303✔\x03 Service messages will now be sent as \x02PRIVMSG\x02."
    off: "\x0303✔\x03 Service messages will now be sent as \x02NOTICE\x02."

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Sets or removes your virtual host."
    help: !irc |-
      Sets a custom hostname that other users will see while you are identified.

      To remove it, run \x02SET VHOST\x02 without a value.

      Only letters (a-z, A-Z), digits, hyphens and dots are allowed.
      Each component must start and end with a letter or digit.
      The hostname can be up to 48 characters and must be unique per nickname.
    example: "%command_prefix%\x02\x0303SET VHOST user.example.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET VHOST\x03\x0F"
    success: "\x0303✔\x03 Your virtual host has been set to \x02%vhost%\x02."
    cleared: "\x0303✔\x03 Your virtual host has been cleared."
    invalid: "\x0304✗\x03 Invalid vhost. Only letters, digits, hyphen and dot (not at start/end of block); max 48 characters."
    taken: "\x0304✗\x03 That vhost is already in use by another nickname."
    forced: "\x0304✗\x03 Your vhost is configured automatically and cannot be changed with SET VHOST."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <nickname> <option> [value]"
  short: "Modify another nickname's settings."
  help: |-
    Allows an IRC operator to change another registered nickname's settings.
    Root users, IRC operators and services cannot be targeted.
  example: "%command_prefix%\x02\x0303SASET User PRIVATE ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SASET User TIMEZONE OFF\x03\x0F"
  unknown_option: "\x0304✗\x03 Unknown option \x02%option%\x02. Available options: %options%."
  cannot_modify_oper: "\x0304✗\x03 Cannot modify an IRC Operator nickname."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <nickname> PASSWORD <new_password>"
    short: "Change a nickname's password."
    help: "Changes another nickname's password. The change takes effect immediately."
    example: "%command_prefix%\x02\x0303SASET User PASSWORD StrongPassword123\x03\x0F"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <nickname> EMAIL <new_email>"
    short: "Change a nickname's email."
    help: |-
      Changes another nickname's email address immediately. No rescue token is
      required and no confirmation email is sent.
      BADMAIL does not restrict this administrative email change.
    example: "%command_prefix%\x02\x0303SASET User EMAIL user@example.com\x03\x0F"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <nickname> LANGUAGE <code>"
    short: "Change a nickname's language."
    help: |-
      Changes another nickname's language. This command supports en (English)
      and es (Spanish).
    example: "%command_prefix%\x02\x0303SASET User LANGUAGE es\x03\x0F"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <nickname> TIMEZONE <timezone|OFF>"
    short: "Change a nickname's timezone."
    help: "Sets or clears another nickname's timezone. Use OFF to clear it."
    example: "%command_prefix%\x02\x0303SASET User TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET User TIMEZONE OFF\x03\x0F"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <nickname> PRIVATE {ON|OFF}"
    short: "Change a nickname's privacy."
    help: "Enables or disables privacy for another nickname's information."
    example: "%command_prefix%\x02\x0303SASET User PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET User PRIVATE OFF\x03\x0F"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <nickname> MSG {ON|OFF}"
    short: "Change a nickname's message preference."
    help: |-
      Sets whether another nickname receives replies as PRIVMSG (ON) or NOTICE
      (OFF).
    example: "%command_prefix%\x02\x0303SASET User MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET User MSG OFF\x03\x0F"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <nickname> VHOST [vhost]"
    short: "Change a nickname's virtual host."
    help: |-
      Sets or removes another nickname's virtual host. Run SASET <nickname> VHOST
      without a value to remove it.
    example: "%command_prefix%\x02\x0303SASET User VHOST user.example.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET User VHOST\x03\x0F"

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [command]"
  short: "Display help for %nickserv% commands."
  help: |-
    Displays general %nickserv% help or detailed information
    for a specific command.
  examples_header: "\x02 ■ Ejemplos:\x02"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET TIMEZONE Europe\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  navigation_marker: "\x0310›\x03\x0F"
  info_marker: "\x0310ℹ\x03\x0F"
  error_marker: "\x0304✗\x03\x0F"
  warning_marker: "\x0304⚠\x03\x0F"
  intro: |-
    Lets you register and protect your nickname to prevent others from using it.
    Manage your account security, customize your preferences and recover access
    when you need it.
  intro_expiration: "%marker% %label%: Nicknames unused for more than \x1F\x0304%days% days\x03\x1F are automatically removed."
  intro_expiration_label: "NOTE"
  general_header: "\x02 ■ Available commands:\x02"
  command_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Options:\x02"
  general_syntax: "HELP <command>"
  general_footer: "%marker% Use /msg %bot% \x02\x0303%syntax%\x03\x0F for more information."
  set_sub_syntax: "HELP %command% <option>"
  set_sub_footer: "%marker% Use /msg %bot% \x02\x0303%syntax%\x03\x0F for more information."
  syntax_label: "Syntax: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_auth: "Registration and authentication"
    account_security: "Account and security"
  ircop_group:
    lookup: "Lookup and investigation"
    account_management: "Account management"
    suspensions_bans: "Suspensions and bans"
    deletion: "Deletion and restoration"
  ircop_header: "\x02 ■ Available commands for IRC Operators:\x02"
  set_timezone:
    index_label: "Timezones by region (use \x02\x0303%syntax%\x03\x0F to view a region):"
    index_syntax: "HELP SET TIMEZONE <region>"
    region_header: "\x02 ■ Timezones for %region%:\x02"
    region_unknown: "%marker% Unknown region. Use \x02\x0303%syntax%\x03\x0F for the index."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "\x0304⚠\x03 Nick \x02%nickname%\x02 is registered. You will be renamed if you don't identify."
  renamed_to: !irc |-
    \x0307→\x03 You have been renamed to \x02%guest_nick%\x02. To recover your nickname:
    /msg %bot% \x0303IDENTIFY %nickname% <password>\x03
  nick_forbidden: "\x0304✗\x03 Nickname \x02%nickname%\x02 is forbidden: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Get the nickname's real IP address and hostname."
  help: |-
    Shows a nickname's real IP address and hostname.
    Use responsibly: this is sensitive information.
  example: "%command_prefix%\x02\x0303USERIP User\x03\x0F"
  result: "\x0307ℹ\x03 Nickname: \x02%nickname%\x02 | IP: \x0307%ip%\x03 | Host: \x0307%host%\x03"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Find nicknames by the IP address of their last identified connection."
  help: |-
    Shows registered nicknames whose last identified connection used this IP
    address. The stored address may be outdated.
  example: "%command_prefix%\x02\x0303WHOIP 192.0.2.10\x03\x0F"
  empty: "No registered nicknames match this IP address."
  header: "Matching nicknames:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <duration> <reason>"
  short: "Suspend a nickname."
  help: |-
    Prevents the owner from identifying. Specify the duration in days (d),
    hours (h), minutes (m), or use 0 for a permanent suspension. IRC operators
    and Root users cannot be suspended.
  example: "%command_prefix%\x02\x0303SUSPEND BadUser 7d Spam in #help\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND Troublemaker 0 Ban evasion\x03\x0F"
  success: "\x0303✔\x03 Nickname \x02%nickname%\x02 has been suspended until \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 Nickname \x02%nickname%\x02 is already suspended."
  forbidden: "\x0304✗\x03 Nickname \x02%nickname%\x02 is forbidden and cannot be suspended."
  cannot_suspend_oper: "\x0304✗\x03 Cannot suspend IRC operator \x02%nickname%\x02."
  cannot_suspend_root: "\x0304✗\x03 Cannot suspend root user \x02%nickname%\x02."
  cannot_suspend_service: "\x0304✗\x03 Cannot suspend service nickname \x02%nickname%\x02."
  invalid_duration: "\x0304✗\x03 Invalid duration. Use: \x0303<d><h><m>\x03 (e.g., 7d, 12h, 30m) or \x03030\x03 for permanent."

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Remove suspension from a nickname."
  help: "Removes an active suspension so that the owner can identify again."
  example: "%command_prefix%\x02\x0303UNSUSPEND User\x03\x0F"
  success: "\x0303✔\x03 Suspension has been lifted from \x02%nickname%\x02."
  not_suspended: "\x0304✗\x03 Nickname \x02%nickname%\x02 is not suspended."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Force rename a connected nickname to a random nickname."
  help: |-
    Forces a connected nickname to change to a random name with a prefix
    defined by the network.
  example: "%command_prefix%\x02\x0303RENAME Troublemaker\x03\x0F"
  cannot_rename_root: "\x0304✗\x03 Cannot rename root user \x02%nickname%\x02."
  cannot_rename_oper: "\x0304✗\x03 Cannot rename IRC operator \x02%nickname%\x02."
  cannot_rename_service: "\x0304✗\x03 Cannot rename service nickname \x02%nickname%\x02."
  success: "\x0303✓\x03 Nickname \x02%nickname%\x02 has been renamed to \x02%new_nick%\x02."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Drop a registered nickname."
  help: |-
    Marks a registered nickname for deletion during the grace period; it can be
    restored with RESTORE. Add FORCE to delete it permanently. Root users, IRC
    operators, services and your own nickname cannot be deleted.
  force:
    short: "Permanently deletes a nickname that is pending deletion."
  example: "%command_prefix%\x02\x0303DROP OldAccount\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP OldAccount FORCE\x03\x0F"
  suspended: "\x0304✗\x03 Nickname \x02%nickname%\x02 is suspended. Unsuspend first."
  forbidden: "\x0304✗\x03 Nickname \x02%nickname%\x02 is forbidden."
  cannot_drop_root: "\x0304✗\x03 Cannot drop root user \x02%nickname%\x02."
  cannot_drop_oper: "\x0304✗\x03 Cannot drop IRC operator \x02%nickname%\x02."
  cannot_drop_self: "\x0304✗\x03 You cannot drop your own nickname."
  success: "\x0303✓\x03 Nickname \x02%nickname%\x02 has been marked for deletion and can be restored during the grace period."
  force_success: "\x0303✓\x03 Nickname \x02%nickname%\x02 has been permanently dropped."
  pending_deletion: "\x0304✗\x03 Nickname \x02%nickname%\x02 is already pending deletion. Use DROP <nickname> force to delete it permanently."
  cannot_drop_service: "\x0304✗\x03 Cannot drop service nickname \x02%nickname%\x02."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Restore a nickname pending deletion."
  help: |-
    Restores a nickname pending deletion while it is still within the grace
    period.
  example: "%command_prefix%\x02\x0303RESTORE OldAccount\x03\x0F"
  success: "\x0303✓\x03 Nickname \x02%nickname%\x02 has been restored."
  not_pending_deletion: "\x0304✗\x03 Nickname \x02%nickname%\x02 is not pending deletion."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <reason>"
  short: "Permanently block a nickname from being used."
  help: |-
    Permanently forbids a nickname so that nobody can register or use it. If
    registered, its registration is deleted; if connected, it is forced to change
    to a random nickname. Root users, IRC operators and services cannot be banned.
  example: "%command_prefix%\x02\x0303FORBID BadUser Repeated policy violations\x03\x0F"
  success: "\x0303✔\x03 Nickname \x02%nickname%\x02 has been forbidden."
  updated: "\x0303✔\x03 Forbidden reason for \x02%nickname%\x02 has been updated."
  reason_required: "\x0304✗\x03 You must provide a reason for the prohibition."
  cannot_forbid_root: "\x0304✗\x03 Cannot forbid root user \x02%nickname%\x02."
  cannot_forbid_oper: "\x0304✗\x03 Cannot forbid IRC operator \x02%nickname%\x02."
  cannot_forbid_service: "\x0304✗\x03 Cannot forbid service nickname \x02%nickname%\x02."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Remove a nickname prohibition."
  help: "Removes a ban so that the nickname can be used again."
  example: "%command_prefix%\x02\x0303UNFORBID BannedNick\x03\x0F"
  success: "\x0303✔\x03 Nickname \x02%nickname%\x02 is no longer forbidden."
  not_forbidden: "\x0304✗\x03 Nickname \x02%nickname%\x02 is not forbidden."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD|DEL|LIST} [pattern]"
  short: "Manage forbidden vhost patterns."
  help: |-
    Manages patterns that prevent matching vhosts from being set with SET VHOST.
    The * wildcard matches any sequence and ? matches one character.
    Requires IRC operator privileges.
  example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirate.example\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Unknown subcommand \x02%sub%\x02. Use ADD, DEL, or LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <pattern>"
    short: "Add a forbidden vhost pattern."
    help: |-
      Adds a pattern to the list. Users cannot set matching vhosts with SET VHOST.
      The * wildcard matches any sequence and ? matches one character.
    example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirate.example\x03\x0F"
    done: "\x0303✓\x03 Forbidden vhost pattern added: \x02%pattern%\x02"
    already_exists: "\x0304✗\x03 Pattern \x02%pattern%\x02 already exists."
    invalid: "\x0304✗\x03 Invalid vhost pattern format."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <pattern>"
    short: "Remove a forbidden vhost pattern."
    help: "Removes a pattern from the forbidden vhost list."
    example: "%command_prefix%\x02\x0303FORBIDVHOST DEL *.pirate.example\x03\x0F"
    done: "\x0303✓\x03 Forbidden vhost pattern removed: \x02%pattern%\x02"
    not_found: "\x0304✗\x03 Pattern \x02%pattern%\x02 not found."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "List all forbidden vhost patterns."
    syntax: "FORBIDVHOST LIST"
    help: "Shows all forbidden vhost patterns."
    example: "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
    header: "\x0307ℹ\x03 Forbidden vhost patterns (\x02%count%\x02):"
    entry: "  %index%. \x0304%pattern%\x03 — by %nickname% (%date%)"
    empty: "\x0307ℹ\x03 No forbidden vhost patterns."

# --- HISTORY ---
history:
  syntax: "HISTORY <nickname> {ADD|DEL|VIEW|CLEAR}"
  short: "View or manage nickname action history."
  help: |-
    Views and manages a nickname's action history. Suspensions, password or email
    changes and recoveries are recorded automatically.
    VIEW shows three entries per page; ALL shows the complete history.
  example: "%command_prefix%\x02\x0303HISTORY User VIEW\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HISTORY User VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY User ADD Manual note\x03\x0F"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <message>"
    short: "Add a manual history entry."
    help: "Adds a manual entry to the nickname history."
    example: "%command_prefix%\x02\x0303HISTORY User ADD Reported for spam\x03\x0F"
    success: "\x0303✔\x03 History entry added for \x02%nickname%\x02."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "Delete a history entry by ID."
    help: "Removes a specific history entry by its ID."
    example: "%command_prefix%\x02\x0303HISTORY User DEL 42\x03\x0F"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [PAGE|ALL]"
    short: "View nickname action history."
    help: |-
      Shows the nickname action history. Shows three entries per page by default.
      Use ALL to view every entry.
    example: "%command_prefix%\x02\x0303HISTORY User VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY User VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY User VIEW ALL\x03\x0F"
    header: "\x02History for \x0307%nickname%\x03\x02 (showing %start%-%end% of %total%):"
    entry: "#%id% [%date%] \x0303%action%\x03 by %operator% — %message%"
    no_entries: "\x0307ℹ\x03 No history entries found for \x02%nickname%\x02."
    page_hint: "Use \x0303HISTORY %nickname% VIEW %next_page%\x03 for more entries."

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Delete all history entries for a nickname."
    help: "Irreversibly removes every nickname history entry."
    example: "%command_prefix%\x02\x0303HISTORY User CLEAR\x03\x0F"
    success: "\x0303✔\x03 Cleared \x02%count%\x02 history entries for \x02%nickname%\x02."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Account activated"
  resend: "Verification email resent"
  noexpire_on: "Expiration protection enabled"
  noexpire_off: "Expiration protection disabled"
  userip: "USERIP consultation"
  history_clear: "History cleared"
  password_changed_owner: "Password changed by owner"
  password_changed_operator: "Password changed by operator"
  email_changed_owner: "Email changed from %old_email% to %new_email%"
  email_changed_operator: "Email changed to %new_email% by operator"
  recover: "Password reset via email token"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Old email: %value%"
  new_email: "New email: %value%"
  method: "Method: %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Set or remove expiration protection for a nickname."
  help: |-
    Controls whether the nickname expires through inactivity.
    ON prevents expiry and OFF applies the normal rules.
  example: "%command_prefix%\x02\x0303NOEXPIRE User ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE User OFF\x03\x0F"
  success_on: "\x0303✔\x03 Nickname \x02%nickname%\x02 is now protected from expiration."
  success_off: "\x0303✔\x03 Nickname \x02%nickname%\x02 will now expire normally."
  forbidden: "\x0304✗\x03 Nickname \x02%nickname%\x02 is forbidden."
  suspended: "\x0304✗\x03 Nickname \x02%nickname%\x02 is suspended."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <pattern> [page]"
  short: "List registered nicknames matching a pattern."
  help: |-
    Lists registered nicknames matching the pattern. The * wildcard matches any
    sequence of characters; the optional page starts at 1.
  example: "%command_prefix%\x02\x0303LIST User*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST User* 2\x03\x0F"
  header: "Nickname | Registration | Last connection | IP | Status"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "No nicknames match the pattern %pattern%."
  status_pending: "Pending"
  status_registered: "Registered"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Manage the network registration mode."
  help: !irc |-
    Configures the registration mode for new accounts.

    • \x02EMAIL:\x02 Sends the verification token to the user's email address.
    • \x02TOKEN:\x02 Delivers the verification token directly over IRC.
    • \x02STATUS:\x02 Shows the current registration mode without changing it.

    Pending registrations keep the mode in which they started.

    In TOKEN mode, RESEND remains disabled for all users.
  example: "%command_prefix%\x02\x0303REGMODE STATUS\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGMODE EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303REGMODE TOKEN\x03\x0F"
  status: "\x0307ℹ\x03 Current registration mode: \x02%mode%\x02."
  changed: "\x0303✔\x03 Registration mode changed to \x02%mode%\x02."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: !irc |-
    Rescue token: \x0303%token%\x03

    Store this token in a safe place. You will need it to recover your nickname if you forget your password.

    To confirm it, use: /msg %bot% \x0303VERIFY %token%\x03

    \x0304⚠\x03 IMPORTANT: Only the most recently generated token is valid. Once confirmed, it will not be displayed again. Do not share it with anyone.
  confirmed: "\x0303✔\x03 Your rescue token has been confirmed. Store it safely."
  unavailable: "\x0304✗\x03 Authenticate and confirm your rescue token with \x0303VERIFY\x03 before using this operation."
  locked_out: "\x0304✗\x03 Too many invalid tokens. Try again in \x02%seconds%\x02 seconds."
  throttled: "\x0304✗\x03 Too many invalid tokens. Try again in \x02%minutes%\x02 minute(s)."
  replaced: "\x0303✔\x03 Your recovery token has been replaced by the token validated from the email. Store that token safely."
  optional_replacement: !irc |-
    \x0307→\x03 Optional new recovery token: \x0303%token%\x03

    To replace your current recovery token, use: /msg %bot% \x0303VERIFY %token%\x03

    Your current token remains valid until confirmation.

    If you do not want to change it, ignore this message.
  replacement_unavailable: "\x0307ℹ\x03 Your password was reset, but a replacement token could not be issued. Your current recovery token is still valid."
  temporarily_unavailable: "\x0304✗\x03 Recovery token delivery is temporarily unavailable. Try again later."

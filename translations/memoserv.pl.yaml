# Tłumaczenia MemoServ — Polski
# Domena: memoserv
#
# Kody formatowania IRC (podwójne cudzysłowy lub bloki literalne !irc):
#   \x02        włącza/wyłącza pogrubienie
#   \x03NN      kolor (DZIESIĘTNIE: 03=zielony, 04=czerwony, 07=pomarańczowy, 14=ciemnoszary)
#   \x03        resetuje kolor
#   \x0F        resetuje całe formatowanie
#
# Kolory IRC używają liczb DZIESIĘTNYCH (0-15), nie szesnastkowych.
#   \x0314 = ciemnoszary (14 dziesiętnie): POPRAWNIE
#   \x030F = kolor 0, a po nim litera F: BŁĄD
#
# Wielowierszowy tekst IRC: !irc |- z rzeczywistymi podziałami wierszy i spacjami.
# Bloki bez tagu nie dekodują sekwencji ucieczki; zachowaj literały CTCP.
# Przykłady HELP: example/examples i %command_prefix%.
# Prezenter dodaje /msg bez koloru i margines dwóch spacji.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {nick|#kanał} <wiadomość>"
  short: "Wyślij wiadomość do nicka lub kanału."
  help: |-
    Wysyła wiadomość do zarejestrowanego pseudonimu lub kanału. Odbiorca musi mieć
    włączoną usługę wiadomości (ENABLE).
  example: "%command_prefix%SEND Ana Cześć, możesz sprawdzić memo?"
  examples:
    - "%command_prefix%SEND #pomoc Ogłoszenie dla kanału"
  sent_nick: "Wiadomość wysłana do %nickname%."
  sent_channel: "Wiadomość wysłana na kanał %channel%."
  throttled: "Musisz poczekać %seconds% sekund(y) przed wysłaniem kolejnej wiadomości."
  limit_reached: "Osiągnięto limit wiadomości dla %target%."
  ignored: "Nie możesz wysyłać wiadomości do tego celu, jesteś na jego liście ignorowanych."
  cannot_send_to_self: "Nie możesz wysłać wiadomości do siebie."
  message_too_long: "Wiadomość jest za długa. Maksymalnie %max% znaków."
  service_disabled_for_target: "Usługa wiadomości jest wyłączona dla %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#kanał] <numer>"
  short: "Przeczytaj wiadomość według numeru."
  help: |-
    Odczytuje wiadomość o podanym numerze. Bez #kanał odczytuje ze skrzynki
    pseudonimu. Z #kanał wymagany jest poziom MEMOREAD.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #pomoc 2"
  header: "Wiadomość #%index% od %from%:"
  footer: "%separator% %date%"
  not_found: "Wiadomość #%index% nie znaleziona."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#kanał]"
  short: "Lista wiadomości (nieprzeczytane oznaczone czerwoną *)."
  help: |-
    Wyświetla Twoje wiadomości lub wiadomości kanału. Nieprzeczytane są oznaczone
    czerwoną gwiazdką i podglądem (maks. 50 znaków). Bez #kanał: Twoja skrzynka;
    z #kanał wymagany jest MEMOREAD.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #pomoc"
  header: "Wiadomości dla %target%:"
  empty: "Brak wiadomości dla %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#kanał] <numer>"
  short: "Usuń wiadomość według numeru."
  help: "Usuwa wiadomość o podanym numerze. Dla kanałów wymaga poziomu MEMOCHANGE."
  example: "%command_prefix%DEL 1"
  examples:
    - "%command_prefix%DEL #pomoc 2"
  deleted: "Wiadomość #%index% usunięta."
  not_found: "Wiadomość #%index% nie znaleziona."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#kanał] <nick>|DEL [#kanał] <nick>|LIST [#kanał]}"
  short: "Zarządzaj listą ignorowanych dla wiadomości."
  help: |-
    Zarządza pseudonimami, od których nie chcesz otrzymywać wiadomości — na Twoim
    koncie lub zarejestrowanym kanale. Do zmiany listy kanału wymagane jest
    uprawnienie MEMOCHANGE.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #pomoc Ana"
    - "%command_prefix%IGNORE LIST #pomoc"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#kanał] <nick>"
    short: "Dodaje pseudonim do listy ignorowanych."
    help: |-
      Wiadomości od tego nicka nie będą przyjmowane do Twojej skrzynki (lub skrzynki
      kanału).
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #pomoc Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#kanał] <nick>"
    short: "Usuwa pseudonim z listy."
    help: "Usuwa nick z listy ignorowanych."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #pomoc Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#kanał]"
    short: "Wyświetla ignorowane pseudonimy."
    help: "Pokazuje listę nicków, które Ty (lub kanał) ignorujecie dla wiadomości."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #pomoc"
  added: "%nickname% dodany do listy ignorowanych."
  removed: "%nickname% usunięty z listy ignorowanych."
  already_ignored: "%nickname% jest już na liście ignorowanych."
  not_ignored: "%nickname% nie jest na liście ignorowanych."
  limit_reached_nick: "Osiągnięto limit listy ignorowanych dla Twojego nicka (maks. %limit%)."
  limit_reached_channel: "Osiągnięto limit listy ignorowanych dla %channel% (maks. %limit%)."
  list_empty: "Lista ignorowanych jest pusta."
  list_header: "Lista ignorowanych:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#kanał]"
  short: "Włącz odbiór wiadomości."
  help: |-
    Włącza odbieranie wiadomości dla Twojego pseudonimu; na kanałach może to
    włączyć tylko założyciel.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #pomoc"
  enabled_nick: "Usługa wiadomości włączona dla Twojego nicka."
  enabled_channel: "Usługa wiadomości włączona dla kanału %channel%."
  already_enabled_nick: "Usługa wiadomości jest już włączona dla Twojego nicka."
  already_enabled_channel: "Usługa wiadomości jest już włączona dla %channel%."
  founder_only: "Tylko założyciel kanału może włączyć wiadomości dla %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#kanał]"
  short: "Wyłącz odbiór wiadomości."
  help: |-
    Wyłącza odbieranie wiadomości dla Twojego pseudonimu lub kanału. Na kanałach
    może to wyłączyć tylko założyciel.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #pomoc"
  disabled_nick: "Usługa wiadomości wyłączona dla Twojego nicka."
  disabled_channel: "Usługa wiadomości wyłączona dla kanału %channel%."
  already_disabled_nick: "Usługa wiadomości jest już wyłączona dla Twojego nicka."
  already_disabled_channel: "Usługa wiadomości jest już wyłączona dla %channel%."
  founder_only: "Tylko założyciel kanału może wyłączyć wiadomości dla %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [komenda] [opcja]"
  short: "Lista komend lub pomoc dla komendy."
  help: "Wyświetla listę poleceń lub szczegółową pomoc dla polecenia bądź opcji."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Umożliwia wysyłanie i odbieranie wiadomości między zarejestrowanymi
    użytkownikami oraz wysyłanie ogłoszeń na kanały. Wiadomości są przechowywane do
    późniejszego odczytu, nawet gdy odbiorca jest offline.
  general_header: "Dostępne komendy:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opcje:"
  examples_header: "Przykłady:"
  general_help_command: "HELP <komenda>"
  option_help_command: "HELP %command% <opcja>"
  general_footer: "Użyj /msg %bot% %help_command%, aby uzyskać więcej informacji."
  set_sub_footer: "Użyj /msg %bot% %help_command%, aby uzyskać więcej informacji."
  syntax_label: "Składnia: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Wiadomości"
    preferences: "Preferencje"
  ircop_header: "Dostępne komendy dla operatorów IRC:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_pending: "Masz %count% oczekujących wiadomości do odczytania. Wyświetl je poleceniem: /msg %bot% %list%"
  channel_pending: "Kanał %channel% ma %count% oczekujących wiadomości. Sprawdź je poleceniem /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "Twoja prośba o rejestrację kanału %channel% została zatwierdzona."
  rejected: "Twoja prośba o rejestrację kanału %channel% została odrzucona."
  reason: "Powód: %reason%"
  restriction: "Dostępny od: %date%"

# Tłumaczenia MemoServ — Polski
# Domena: memoserv
#
# Kody formatowania IRC (podwójne cudzysłowy lub bloki literalne !irc):
#   \x02        włącza/wyłącza pogrubienie
#   \x03NN      kolor (DZIESIĘTNIE: 03=zielony, 04=czerwony, 07=pomarańczowy, 14=ciemnoszary)
#   \x03        resetuje kolor
#   \x0F        resetuje całe formatowanie
#
# Kolory IRC używają liczb DZIESIĘTNYCH (0-15), nie szesnastkowych.
#   \x0314 = ciemnoszary (14 dziesiętnie): POPRAWNIE
#   \x030F = kolor 0, a po nim litera F: BŁĄD
#
# Wielowierszowy tekst IRC: !irc |- z rzeczywistymi podziałami wierszy i spacjami.
# Bloki bez tagu nie dekodują sekwencji ucieczki; zachowaj literały CTCP.
# Przykłady HELP: example/examples i %command_prefix%.
# Prezenter dodaje /msg bez koloru i margines dwóch spacji.

# --- SEND ------------------------------------------------------------------
send:
  syntax: "SEND {nick|#kanał} <wiadomość>"
  short: "Wyślij wiadomość do nicka lub kanału."
  help: |-
    Wysyła wiadomość do zarejestrowanego pseudonimu lub kanału. Odbiorca musi mieć
    włączoną usługę wiadomości (ENABLE).
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND Ana Cześć, możesz sprawdzić memo?\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND #pomoc Ogłoszenie dla kanału\x03\x0F"
  sent_nick: "\x0303✔\x03 Wiadomość wysłana do \x02%nickname%\x02."
  sent_channel: "\x0303✔\x03 Wiadomość wysłana na kanał \x02%channel%\x02."
  throttled: "\x0304✗\x03 Musisz poczekać \x02%seconds%\x02 sekund(y) przed wysłaniem kolejnej wiadomości."
  limit_reached: "\x0304✗\x03 Osiągnięto limit wiadomości dla \x02%target%\x02."
  ignored: "\x0304✗\x03 Nie możesz wysyłać wiadomości do tego celu, jesteś na jego liście ignorowanych."
  cannot_send_to_self: "\x0304✗\x03 Nie możesz wysłać wiadomości do siebie."
  message_too_long: "\x0304✗\x03 Wiadomość jest za długa. Maksymalnie \x02%max%\x02 znaków."
  service_disabled_for_target: "\x0304✗\x03 Usługa wiadomości jest wyłączona dla \x02%target%\x02."

# --- READ ------------------------------------------------------------------
read:
  syntax: "READ [#kanał] <numer>"
  short: "Przeczytaj wiadomość według numeru."
  help: |-
    Odczytuje wiadomość o podanym numerze. Bez #kanał odczytuje ze skrzynki
    pseudonimu. Z #kanał wymagany jest poziom MEMOREAD.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303READ 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303READ #pomoc 2\x03\x0F"
  header: "\x02\x0307Wiadomość #%index%\x03 od \x02%from%\x02:\x0F"
  footer: "\x0314─────────────────────────────\x03 \x0314%date%\x03"
  not_found: "\x0304✗\x03 Wiadomość #%index% nie znaleziona."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST [#kanał]"
  short: "Lista wiadomości (nieprzeczytane oznaczone czerwoną *)."
  help: |-
    Wyświetla Twoje wiadomości lub wiadomości kanału. Nieprzeczytane są oznaczone
    czerwoną gwiazdką i podglądem (maks. 50 znaków). Bez #kanał: Twoja skrzynka;
    z #kanał wymagany jest MEMOREAD.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST #pomoc\x03\x0F"
  header: "\x02\x0307Wiadomości dla %target%\x03:\x0F"
  empty: "\x0307ℹ\x03 Brak wiadomości dla \x02%target%\x02."

# --- DEL -------------------------------------------------------------------
del:
  syntax: "DEL [#kanał] <numer>"
  short: "Usuń wiadomość według numeru."
  help: "Usuwa wiadomość o podanym numerze. Dla kanałów wymaga poziomu MEMOCHANGE."
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL #pomoc 2\x03\x0F"
  deleted: "\x0303✔\x03 Wiadomość #%index% usunięta."
  not_found: "\x0304✗\x03 Wiadomość #%index% nie znaleziona."

# --- IGNORE ----------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD|DEL|LIST} [#kanał] [nick]"
  short: "Zarządzaj listą ignorowanych dla wiadomości."
  help: |-
    Zarządza pseudonimami, od których nie chcesz otrzymywać wiadomości — na Twoim
    koncie lub zarejestrowanym kanale. Do zmiany listy kanału wymagane jest
    uprawnienie MEMOCHANGE.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #pomoc Ana\x03\x0F"
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #pomoc\x03\x0F"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#kanał] <nick>"
    short: "Dodaje pseudonim do listy ignorowanych."
    help: |-
      Wiadomości od tego nicka nie będą przyjmowane do Twojej skrzynki (lub skrzynki
      kanału).
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD #pomoc Ana\x03\x0F"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#kanał] <nick>"
    short: "Usuwa pseudonim z listy."
    help: "Usuwa nick z listy ignorowanych."
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #pomoc Ana\x03\x0F"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#kanał]"
    short: "Wyświetla ignorowane pseudonimy."
    help: "Pokazuje listę nicków, które Ty (lub kanał) ignorujecie dla wiadomości."
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #pomoc\x03\x0F"
  added: "\x0303✔\x03 \x02%nickname%\x02 dodany do listy ignorowanych."
  removed: "\x0303✔\x03 \x02%nickname%\x02 usunięty z listy ignorowanych."
  already_ignored: "\x0304✗\x03 \x02%nickname%\x02 jest już na liście ignorowanych."
  not_ignored: "\x0304✗\x03 \x02%nickname%\x02 nie jest na liście ignorowanych."
  limit_reached_nick: "\x0304✗\x03 Osiągnięto limit listy ignorowanych dla Twojego nicka (maks. \x02%limit%\x02)."
  limit_reached_channel: "\x0304✗\x03 Osiągnięto limit listy ignorowanych dla \x02%channel%\x02 (maks. \x02%limit%\x02)."
  list_empty: "\x0307ℹ\x03 Lista ignorowanych jest pusta."
  list_header: "\x02\x0307Lista ignorowanych:\x03\x0F"

# --- ENABLE ----------------------------------------------------------------
enable:
  syntax: "ENABLE [#kanał]"
  short: "Włącz odbiór wiadomości."
  help: |-
    Włącza odbieranie wiadomości dla Twojego pseudonimu; na kanałach może to
    włączyć tylko założyciel.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE #pomoc\x03\x0F"
  enabled_nick: "\x0303✔\x03 Usługa wiadomości włączona dla Twojego nicka."
  enabled_channel: "\x0303✔\x03 Usługa wiadomości włączona dla kanału \x02%channel%\x02."
  already_enabled_nick: "\x0307ℹ\x03 Usługa wiadomości jest już włączona dla Twojego nicka."
  already_enabled_channel: "\x0307ℹ\x03 Usługa wiadomości jest już włączona dla \x02%channel%\x02."
  founder_only: "\x0304✗\x03 Tylko założyciel kanału może włączyć wiadomości dla \x02%channel%\x02."

# --- DISABLE ---------------------------------------------------------------
disable:
  syntax: "DISABLE [#kanał]"
  short: "Wyłącz odbiór wiadomości."
  help: |-
    Wyłącza odbieranie wiadomości dla Twojego pseudonimu lub kanału. Na kanałach
    może to wyłączyć tylko założyciel.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE #pomoc\x03\x0F"
  disabled_nick: "\x0303✔\x03 Usługa wiadomości wyłączona dla Twojego nicka."
  disabled_channel: "\x0303✔\x03 Usługa wiadomości wyłączona dla kanału \x02%channel%\x02."
  already_disabled_nick: "\x0307ℹ\x03 Usługa wiadomości jest już wyłączona dla Twojego nicka."
  already_disabled_channel: "\x0307ℹ\x03 Usługa wiadomości jest już wyłączona dla \x02%channel%\x02."
  founder_only: "\x0304✗\x03 Tylko założyciel kanału może wyłączyć wiadomości dla \x02%channel%\x02."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [komenda] [opcja]"
  short: "Lista komend lub pomoc dla komendy."
  help: "Wyświetla listę poleceń lub szczegółową pomoc dla polecenia bądź opcji."
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP IGNORE ADD\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  intro: |-
    Umożliwia wysyłanie i odbieranie wiadomości między zarejestrowanymi
    użytkownikami oraz wysyłanie ogłoszeń na kanały. Wiadomości są przechowywane do
    późniejszego odczytu, nawet gdy odbiorca jest offline.
  general_header: "\x02 ■ Dostępne komendy:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Opcje:\x02"
  examples_header: "\x02 ■ Przykłady:\x02"
  general_footer: "\x0310ℹ\x03\x0F Użyj /msg %bot% \x02\x0303HELP <komenda>\x03\x0F, aby uzyskać więcej informacji."
  set_sub_footer: "\x0310ℹ\x03\x0F Użyj /msg %bot% \x02\x0303HELP %command% <opcja>\x03\x0F, aby uzyskać więcej informacji."
  syntax_label: "Składnia: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    messages: "Wiadomości"
    preferences: "Preferencje"
  ircop_header: "\x02 ■ Dostępne komendy dla operatorów IRC:\x02"

# --- NOTIFY ----------------------------------------------------------------
notify:
  nick_pending: "Masz \x02%count%\x02 oczekujących wiadomości do odczytania. Wyświetl je poleceniem: /msg %bot% \x0303LIST\x03"
  channel_pending: "Kanał \x02%channel%\x02 ma \x02%count%\x02 oczekujących wiadomości. Sprawdź je poleceniem /msg %bot% \x0303LIST %channel%\x03"

# --- CHANNEL REGISTRATION DECISIONS ---
registration_decision:
  accepted: "Twoja prośba o rejestrację kanału %channel% została zatwierdzona."
  rejected: "Twoja prośba o rejestrację kanału %channel% została odrzucona."
  reason: "Powód: %reason%"
  restriction: "Dostępny od: %date%"

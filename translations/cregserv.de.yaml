# CReG-Übersetzungen — Deutsch
# Domain: cregserv

unknown_command: "\x0304✗\x03 Unbekannter Befehl \x02%command%\x02. Benutze \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Falsche Syntax. Verwendung: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Dieser Befehl ist IRC-Operatoren vorbehalten."
  not_identified: "\x0304✗\x03 Du bist nicht identifiziert. Benutze \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Keine Berechtigung. Du hast keinen Zugriff auf diesen Befehl."

registra:
  syntax: "REGISTRA <#channel> <Beschreibung>"
  short: "Beantragt die Genehmigung einer Kanalregistrierung."
  help: "Fordert die Registrierung eines neuen Kanals an. Ein Services-Operator prüft die Anfrage und genehmigt oder lehnt sie ab; der Kanal wird erst nach der Genehmigung registriert. Du musst mit %nickserv% identifiziert sein.\n\n\x02#channel:\x02 Der zu registrierende Kanal. Er muss mit # beginnen, darf noch nicht registriert sein (prüfe das mit dem Befehl ESTADO) und höchstens 64 Zeichen einschließlich # haben.\n\n\x02Beschreibung:\x02 Das Thema oder der Zweck des Kanals, bis zu 255 Zeichen. Der Operator wägt dies bei der Prüfung der Anfrage ab.\n\nNach dem Absenden bleibt die Anfrage ausstehend, bis ein Services-Operator sie genehmigt oder ablehnt. Du kannst alle 24 Stunden nur eine Anfrage senden."
  example: "/msg CReG REGISTRA #mychannel ein Ort zum Chatten"
  requested: "\x0303✔\x03 Du hast die Registrierung des Kanals \x02%channel%\x02 beantragt. Ein Services-Operator wird die Anfrage prüfen."
  invalid_channel: "\x0304✗\x03 Der Kanalname muss mit \x02#\x02 beginnen."
  channel_too_long: "\x0304✗\x03 Der Kanalname ist zu lang: höchstens \x0264\x02 Zeichen einschließlich \x02#\x02."
  description_too_long: "\x0304✗\x03 Die Beschreibung ist zu lang: höchstens \x02255\x02 Zeichen."
  already_registered: "\x0304✗\x03 Der Kanal \x02%channel%\x02 ist bereits registriert."
  pending_deletion: "\x0304✗\x03 Der Kanal \x02%channel%\x02 wird gerade gelöscht und kann erst nach Abschluss der Löschung registriert werden."
  duplicate: "\x0304✗\x03 Für \x02%channel%\x02 wartet bereits eine Registrierungsanfrage auf Genehmigung. Benutze \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 Die Registrierung von \x02%channel%\x02 wurde abgelehnt."
  throttled: "\x0304✗\x03 Du musst \x02%minutes%\x02 Minute(n) warten, bevor du einen weiteren Kanal beantragst."

estado:
  syntax: "ESTADO <#channel>"
  short: "Zeigt den Registrierungsstatus eines Kanals."
  help: "Zeigt, an welcher Stelle ein Kanal im Registrierungsprozess steht.\n\nDie möglichen Zustände sind:\n    \x02REGISTRIERT\x02: Der Kanal ist bereits bei %chanserv% registriert.\n    \x02IN PRÜFUNG\x02: Eine Registrierungsanfrage wartet darauf, dass ein Services-Operator sie genehmigt oder ablehnt.\n    \x02ABGELEHNT\x02: Die Registrierungsanfrage wurde abgelehnt.\n    \x02WIRD GELÖSCHT\x02: Der Kanal wurde abgemeldet und befindet sich in der Löschschonfrist; er kann erst registriert werden, wenn die Löschung abgeschlossen ist.\n    \x02KEIN PROZESS\x02: Für den Kanal gibt es keinen Registrierungsprozess."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 Der Kanal \x02%channel%\x02 ist bereits registriert."
  pending_deletion: "\x0304✗\x03 Der Kanal \x02%channel%\x02 wird gerade gelöscht und kann erst nach Abschluss der Löschung registriert werden."
  pending: "\x0303◌\x03 Der Kanal \x02%channel%\x02 befindet sich in Bearbeitung und wartet auf die Prüfung durch einen Services-Operator (beantragt am %date%)."
  denied: "\x0304✗\x03 Der Kanal \x02%channel%\x02 ist seit dem %date% abgelehnt. Grund: %reason%"
  no_request: "\x0304✗\x03 Der Kanal \x02%channel%\x02 hat keinen Registrierungsprozess."

cancel:
  syntax: "CANCEL <#channel>"
  short: "Storniert deine ausstehende Registrierungsanfrage für einen Kanal."
  help: "Storniert eine Kanalregistrierungsanfrage, die noch nicht genehmigt oder abgelehnt wurde. Du kannst nur deine eigenen ausstehenden Anfragen stornieren.\n\n\x02#channel:\x02 Der Kanal, dessen Anfrage du stornieren möchtest. Die Anfrage muss von dir stammen und noch ausstehend sein.\n\nNach der Stornierung wird die Anfrage entfernt und der Kanalname ist wieder frei."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 Deine Registrierungsanfrage für Kanal \x02%channel%\x02 wurde storniert und der Kanalname ist wieder frei."
  invalid_channel: "\x0304✗\x03 Der Kanalname muss mit \x02#\x02 beginnen."
  no_request: "\x0304✗\x03 Kanal \x02%channel%\x02 hat keinen Registrierungsprozess."
  not_yours: "\x0304✗\x03 Die Registrierungsanfrage für \x02%channel%\x02 gehört dir nicht."
  not_pending: "\x0304✗\x03 Die Registrierungsanfrage für \x02%channel%\x02 wurde bereits genehmigt oder abgelehnt und kann nicht storniert werden."

aprobar:
  syntax: "APROBAR <#channel>"
  short: "Genehmigt eine ausstehende Kanalregistrierungsanfrage."
  help: "Registriert einen Kanal, dessen Anfrage auf Prüfung wartet. Der Kanal wird auf den Benutzer registriert, der ihn beantragt hat; keiner von euch beiden muss sich darin befinden. Du brauchst die Berechtigung \x02cregserv.aprobar\x02.\n\n\x02#channel:\x02 Der Kanal mit der ausstehenden Anfrage. Mit PENDIENTES siehst du die Warteschlange.\n\nNach der Genehmigung wird der Kanal bei \x02%chanserv%\x02 registriert und die Anfrage geschlossen."
  example: "/msg CReG APROBAR #channel"
  approved: "\x0303✔\x03 Der Kanal \x02%channel%\x02 wurde erfolgreich für \x02%founder%\x02 registriert."
  invalid_channel: "\x0304✗\x03 Der Kanalname muss mit \x02#\x02 beginnen."
  no_pending: "\x0304✗\x03 Der Kanal \x02%channel%\x02 befindet sich nicht in einem Registrierungsprozess."
  already_registered: "\x0304✗\x03 Der Kanal \x02%channel%\x02 ist bereits bei \x02%chanserv%\x02 registriert."
  already_approved: "\x0304✗\x03 Der Kanal \x02%channel%\x02 ist bereits registriert."
  already_denied: "\x0304✗\x03 Der Kanal \x02%channel%\x02 kann nicht registriert werden, da er als \x0304ABGELEHNT\x03 markiert ist."
  failed: "\x0304✗\x03 Die Registrierung des Kanals \x02%channel%\x02 konnte nicht abgeschlossen werden."

denegar:
  syntax: "DENEGAR <#channel> <Grund>"
  short: "Lehnt eine ausstehende Kanalregistrierungsanfrage ab."
  help: "Weist eine Registrierungsanfrage zurück und lässt den Kanalnamen frei. Der Grund ist Pflicht und wird von DENEGADOS angezeigt. Du brauchst die Berechtigung \x02cregserv.denegar\x02.\n\n\x02#channel:\x02 Der Kanal mit der ausstehenden Anfrage.\n\x02Grund:\x02 Warum die Anfrage abgelehnt wird; er wird gespeichert und allen angezeigt, die DENEGADOS abfragen.\n\nDer Kanalname ist nach der Ablehnung wieder frei und kann neu beantragt werden."
  example: "/msg CReG DENEGAR #channel Off-Topic"
  denied: "\x0303✔\x03 Die Registrierung des Kanals \x02%channel%\x02 wurde abgelehnt."
  invalid_channel: "\x0304✗\x03 Der Kanalname muss mit \x02#\x02 beginnen."
  no_pending: "\x0304✗\x03 Der Kanal \x02%channel%\x02 hat keinen Registrierungsprozess."
  already_approved: "\x0304✗\x03 Bereits registrierte und genehmigte Kanäle können nicht abgelehnt werden."
  already_denied: "\x0304✗\x03 Der Kanal \x02%channel%\x02 ist bereits abgelehnt."

pendientes:
  syntax: "PENDIENTES"
  short: "Listet die auf Prüfung wartenden Kanalregistrierungsanfragen auf."
  help: "Listet jede auf Prüfung wartende Kanalregistrierungsanfrage auf und zeigt Kanal, Antragsteller, Datum und Beschreibung. Du brauchst die Berechtigung \x02cregserv.pendientes\x02.\n\nDieser Befehl akzeptiert keine Parameter."
  example: "/msg CReG PENDIENTES"
  empty: "Es warten keine Kanäle auf Prüfung."
  line: "\x02Kanal:\x02 %channel%, \x02Beantragt von:\x02 %requester%, \x02Datum:\x02 %date%, \x02Beschreibung:\x02 %description%"
  end: "Ende der Liste."

denegados:
  syntax: "DENEGADOS"
  short: "Listet die abgelehnten Kanalregistrierungsanfragen auf."
  help: "Listet jede abgelehnte Kanalregistrierungsanfrage zusammen mit dem Grund der Ablehnung auf. Du brauchst die Berechtigung \x02cregserv.denegados\x02.\n\nDieser Befehl akzeptiert keine Parameter."
  example: "/msg CReG DENEGADOS"
  empty: "Es gibt keine abgelehnten Kanäle."
  line: "\x02Kanal:\x02 %channel%, \x02Grund:\x02 %reason%"
  end: "Ende der Liste."

drop:
  syntax: "DROP <#channel>"
  short: "Entfernt den Registrierungseintrag, den \x02%bot%\x02 für einen Kanal speichert."
  help: "Entfernt den Eintrag, den \x02%bot%\x02 für einen Kanal speichert, und meldet den Kanal, wenn er dort registriert ist, auch bei \x02%chanserv%\x02 ab. Du brauchst die Berechtigung \x02cregserv.drop\x02.\n\n\x02#channel:\x02 Der Kanal, den du entfernen möchtest.\n\nDie Abmeldung bei \x02%chanserv%\x02 ist weich: Der Kanal tritt statt sofortiger Löschung in eine Schonfrist für die Löschung ein."
  example: "/msg CReG DROP #channel"
  dropped: "\x0303✔\x03 Der Registrierungseintrag des Kanals \x02%channel%\x02 wurde aus \x02%bot%\x02 entfernt."
  dropped_channel: "\x0303✔\x03 Der Kanal \x02%channel%\x02 wurde gelöscht und tritt nun in die Schonfrist für die Löschung ein."
  invalid_channel: "\x0304✗\x03 Der Kanalname muss mit \x02#\x02 beginnen."
  no_request: "\x0304✗\x03 Der Kanal \x02%channel%\x02 ist nicht bei \x02%bot%\x02 erfasst."

saregister:
  syntax: "SAREGISTER <#channel> [Beschreibung]"
  short: "Registriert einen Kanal, ohne sich darin zu befinden."
  help: "Registriert einen Kanal auf Anforderung des Staffs, ohne den Anfrage- und Genehmigungsablauf zu durchlaufen. Du musst dich nicht im Kanal befinden, und der Kanal muss noch nicht existieren. Du brauchst die Berechtigung \x02cregserv.saregister\x02.\n\n\x02#channel:\x02 Der Kanal, den du registrieren möchtest.\n\x02Beschreibung:\x02 Optionale Beschreibung, die mit der Registrierung gespeichert wird."
  example: "/msg CReG SAREGISTER #channel ein Staff-Kanal"
  done: "\x0303✔\x03 Der Kanal \x02%channel%\x02 wurde registriert."
  invalid_channel: "\x0304✗\x03 Der Kanalname muss mit \x02#\x02 beginnen."
  pending_deletion: "\x0304✗\x03 Der Kanal \x02%channel%\x02 steht auf der Löschliste und kann nicht registriert werden."
  already_registered: "\x0304✗\x03 Der Kanal \x02%channel%\x02 ist bereits registriert."
  failed: "\x0304✗\x03 Die Registrierung des Kanals \x02%channel%\x02 konnte nicht abgeschlossen werden."


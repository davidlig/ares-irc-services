# Traduzioni di messaggi comuni — Italiano
# Dominio: common
#
# Codici di formattazione IRC (virgolette doppie o blocchi letterali !irc):
#   \x02        attiva/disattiva il grassetto
#   \x03NN      colore (DECIMALE: 03=verde, 04=rosso, 07=arancione, 14=grigio scuro)
#   \x03        ripristina il colore
#   \x0F        ripristina tutta la formattazione
#
# I colori IRC usano numeri DECIMALI (0-15), non esadecimali.
#   \x0314 = grigio scuro (14 decimale): CORRETTO
#   \x030F = colore 0 seguito dalla lettera F: ERRORE
#
# Testo IRC multilinea: !irc |- con interruzioni di riga e spazi reali.
# I blocchi senza tag non decodificano gli escape; preservare i letterali CTCP.
# Esempi HELP: example/examples e %command_prefix%.
# Il presentatore aggiunge /msg senza colore e un margine di due spazi.

# --- UNKNOWN COMMAND -------------------------------------------------------
unknown_command: "\x0304✗\x03\x0F Comando sconosciuto \x0303%command%\x03\x0F. Usa /msg %bot% \x0303HELP\x03\x0F"

# --- UNKNOWN HELP OPTION ---------------------------------------------------
unknown_help_option: "\x0304✗\x03\x0F Opzione di aiuto \x0303%option%\x03\x0F sconosciuta per \x0303%command%\x03\x0F. Usa /msg %bot% \x0303HELP %command%\x03\x0F"

# --- ERROR -----------------------------------------------------------------
error:
  email_domain_blocked: "Questo dominio email è bloccato amministrativamente."
  syntax: "Sintassi errata. Uso: %syntax%"
  oper_only: "Questo comando è riservato agli IRC Operator."
  not_identified: "Non hai effettuato l'identificazione. Usa /msg %nickserv% IDENTIFY <nickname> <password>"
  permission_denied: "Permesso negato. Non ha accesso a questo comando."
  mail_failed: "Impossibile inviare l'email. Verifichi l'indirizzo o riprovi più tardi."
  channel_not_registered: "Il canale %channel% non è registrato."
  nick_not_registered: "Il nickname %nickname% non è registrato."
  insufficient_access: "Accesso insufficiente per %operation% sul canale %channel%."
  nick_not_online: "Il nickname %nickname% non è connesso."

# --- DURATION --------------------------------------------------------------
duration:
  unit:
    year:
      singular: "anno"
      plural: "anni"
    month:
      singular: "mese"
      plural: "mesi"
    day:
      singular: "giorno"
      plural: "giorni"
    hour:
      singular: "ora"
      plural: "ore"
    minute:
      singular: "minuto"
      plural: "minuti"
    second:
      singular: "secondo"
      plural: "secondi"
  list_separator: ", "
  list_join: "%prefix% e %last%"

# --- ANTIFLOOD -------------------------------------------------------------
antiflood:
  blocked: "Ha superato il limite di comandi. Riprovi tra %seconds% secondi."
  debug_channel: "%nick% limite %command% raggiunto per %host% (%seconds%s rimanenti)"

# --- CTCP ------------------------------------------------------------------
ctcp:
  version:
    tribute: |
      \x02Al mio leale e eterno amico,\x02

      Anche se il 2023 è stato l'anno in cui abbiamo dovuto dirci addio, il tempo non
      ha cancellato nemmeno un tuo dettaglio. Ricordo ancora la tua energia
      inesauribile, il tuo sguardo nobile e quella gioia immensa e contagiosa che solo
      tu sapevi donare.

      Hai riempito la mia casa di vita e la mia vita di un amore incondizionato che non
      dimenticherò mai. Anche se non sento più i tuoi passi correre ad accogliermi né
      la tua testa appoggiarsi a me in cerca di affetto, so che il tuo spirito giocoso
      continua ad accompagnarmi.

      Grazie per ogni momento, per ogni marachella e per essere stato il miglior
      compagno che potessi desiderare. Lo spazio che hai lasciato accanto a me è ora
      pieno dei ricordi più felici. Sarai sempre il mio grande amico e avrai sempre un
      posto immenso nel mio cuore.


# CReG translations — Polski
# Domain: cregserv

unknown_command: "\x0304✗\x03 Nieznane polecenie \x02%command%\x02. Użyj \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Nieprawidłowa składnia. Użycie: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 To polecenie jest zarezerwowane dla operatorów IRC."
  not_identified: "\x0304✗\x03 Nie jesteś zidentyfikowany. Użyj \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Brak uprawnienia. Nie masz dostępu do tego polecenia."

registra:
  syntax: "REGISTRA <#kanał> <opis>"
  short: "Prosi o zatwierdzenie rejestracji kanału."
  help: "Prosi o rejestrację nowego kanału. Operator usług sprawdza prośbę i ją zatwierdza lub odrzuca; kanał jest rejestrowany dopiero po zatwierdzeniu. Musisz być zidentyfikowany z %nickserv%.\n\n\x02#kanał:\x02 Kanał do rejestracji. Musi zaczynać się od #, nie może być już zarejestrowany (sprawdź to komendą ESTADO) i może mieć najwyżej 64 znaki razem z #.\n\n\x02opis:\x02 Temat lub cel kanału, do 255 znaków. To operator bierze pod uwagę, sprawdzając prośbę.\n\nPo wysłaniu prośba pozostaje oczekująca, aż operator usług ją zatwierdzi lub odrzuci. Możesz wysłać jedną prośbę na 24 godziny."
  example: "/msg CReG REGISTRA #mychannel miejsce do rozmów"
  requested: "\x0303✔\x03 Poprosiłeś o rejestrację kanału \x02%channel%\x02. Operator usług oceni tę prośbę."
  invalid_channel: "\x0304✗\x03 Nazwa kanału musi zaczynać się od \x02#\x02."
  channel_too_long: "\x0304✗\x03 Nazwa kanału jest za długa: maksymalnie \x0264\x02 znaki wraz z \x02#\x02."
  description_too_long: "\x0304✗\x03 Opis jest za długi: maksymalnie \x02255\x02 znaków."
  already_registered: "\x0304✗\x03 Kanał \x02%channel%\x02 jest już zarejestrowany."
  pending_deletion: "\x0304✗\x03 Kanał \x02%channel%\x02 jest właśnie usuwany i nie może być zarejestrowany do czasu zakończenia usuwania."
  duplicate: "\x0304✗\x03 Prośba o rejestrację \x02%channel%\x02 już czeka na zatwierdzenie. Użyj \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 Prośba o rejestrację \x02%channel%\x02 została odrzucona."
  throttled: "\x0304✗\x03 Musisz poczekać \x02%minutes%\x02 minut(y), zanim poprosisz o kolejny kanał."

estado:
  syntax: "ESTADO <#kanał>"
  short: "Pokazuje stan rejestracji kanału."
  help: "Wskazuje, na jakim etapie jest kanał w procesie rejestracji.\n\nMożliwe stany to:\n    \x02ZAREJESTROWANY\x02: kanał jest już zarejestrowany w %chanserv%.\n    \x02W TRAKCIE SPRAWDZENIA\x02: prośba o rejestrację czeka na zatwierdzenie lub odrzucenie przez operatora usług.\n    \x02ODRZUCONY\x02: prośba o rejestrację została odrzucona.\n    \x02JEST USUWANY\x02: kanał został wyrejestrowany i znajduje się w okresie karencji usuwania; nie można go zarejestrować ponownie do czasu zakończenia usuwania.\n    \x02BRAK PROCESU\x02: kanał nie ma procesu rejestracji."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 Kanał \x02%channel%\x02 jest już zarejestrowany."
  pending_deletion: "\x0304✗\x03 Kanał \x02%channel%\x02 jest właśnie usuwany i nie może być zarejestrowany do czasu zakończenia usuwania."
  pending: "\x0303◌\x03 Kanał \x02%channel%\x02 jest w trakcie i czeka na sprawdzenie przez operatora usług (poproszono %date%)."
  denied: "\x0304✗\x03 Kanał \x02%channel%\x02 jest odrzucony od %date%. Powód: %reason%"
  no_request: "\x0304✗\x03 Kanał \x02%channel%\x02 nie ma procesu rejestracji."

cancel:
  syntax: "CANCEL <#kanał>"
  short: "Anuluje twoją oczekującą prośbę o rejestrację kanału."
  help: "Anuluje prośbę o rejestrację kanału, która nie została jeszcze zatwierdzona ani odrzucona. Możesz anulować tylko własne prośby oczekujące.\n\n\x02#kanał:\x02 Kanał, którego prośbę chcesz anulować. Prośba musi być twoja i nadal musi być oczekująca.\n\nPo anulowaniu prośba zostaje usunięta, a nazwa kanału staje się wolna."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 Twoja prośba o rejestrację kanału \x02%channel%\x02 została anulowana, a nazwa kanału znów jest wolna."
  invalid_channel: "\x0304✗\x03 Nazwa kanału musi zaczynać się od \x02#\x02."
  no_request: "\x0304✗\x03 Kanał \x02%channel%\x02 nie ma procesu rejestracji."
  not_yours: "\x0304✗\x03 Prośba o rejestrację \x02%channel%\x02 nie należy do ciebie."
  not_pending: "\x0304✗\x03 Prośba o rejestrację \x02%channel%\x02 została już zatwierdzona lub odrzucona i nie można jej anulować."

aprobar:
  syntax: "APROBAR <#kanał>"
  short: "Zatwierdza oczekującą prośbę o rejestrację kanału."
  help: "Rejestruje kanał, którego prośba czeka na sprawdzenie. Kanał jest rejestrowany na osobę, która ją złożyła; żadne z was nie musi być w środku. Potrzebujesz uprawnienia \x02cregserv.aprobar\x02.\n\n\x02#kanał:\x02 Kanał z oczekującą prośbą. Użyj PENDIENTES, aby zobaczyć kolejkę.\n\nPo zatwierdzeniu kanał zostaje zarejestrowany w \x02%chanserv%\x02, a prośba zostaje zamknięta."
  example: "/msg CReG APROBAR #kanał"
  approved: "\x0303✔\x03 Kanał \x02%channel%\x02 został poprawnie zarejestrowany dla \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 Nazwa kanału musi zaczynać się od \x02#\x02."
  no_pending: "\x0304✗\x03 Kanał \x02%channel%\x02 nie jest w procesie rejestracji."
  already_registered: "\x0304✗\x03 Kanał \x02%channel%\x02 jest już zarejestrowany w \x02%chanserv%\x02."
  already_approved: "\x0304✗\x03 Kanał \x02%channel%\x02 jest już zarejestrowany."
  already_denied: "\x0304✗\x03 Kanału \x02%channel%\x02 nie można zarejestrować, ponieważ jest oznaczony jako \x0304ODRZUCONE\x03."
  failed: "\x0304✗\x03 Nie udało się zakończyć rejestracji kanału \x02%channel%\x02."

denegar:
  syntax: "DENEGAR <#kanał> <powód>"
  short: "Odrzuca oczekującą prośbę o rejestrację kanału."
  help: "Odrzuca prośbę o rejestrację, pozostawiając nazwę kanału wolną. Powód jest obowiązkowy i jest pokazywany przez DENEGADOS. Potrzebujesz uprawnienia \x02cregserv.denegar\x02.\n\n\x02#kanał:\x02 Kanał z oczekującą prośbą.\n\x02powód:\x02 Dlaczego prośba zostaje odrzucona; jest zapisywany i pokazywany każdemu, kto sprawdza DENEGADOS.\n\nNazwa kanału jest wolna, więc po odrzuceniu można ją zgłosić ponownie."
  example: "/msg CReG DENEGAR #kanał nie na temat"
  denied: "\x0303✔\x03 Rejestracja kanału \x02%channel%\x02 została odrzucona."
  invalid_channel: "\x0304✗\x03 Nazwa kanału musi zaczynać się od \x02#\x02."
  no_pending: "\x0304✗\x03 Kanał \x02%channel%\x02 nie ma procesu rejestracji."
  already_approved: "\x0304✗\x03 Już zarejestrowanych i zatwierdzonych kanałów nie można odrzucić."
  already_denied: "\x0304✗\x03 Kanał \x02%channel%\x02 jest już odrzucony."

pendientes:
  syntax: "PENDIENTES"
  short: "Wyświetla prośby o rejestrację kanałów oczekujących na sprawdzenie."
  help: "Wyświetla każdą prośbę o rejestrację kanału oczekującą na ocenę przez operatora usług, pokazując kanał, kto ją złożył, datę i opis. Potrzebujesz uprawnienia \x02cregserv.pendientes\x02.\n\nTo polecenie nie przyjmuje parametrów."
  example: "/msg CReG PENDIENTES"
  empty: "Brak kanałów oczekujących na sprawdzenie."
  line: "\x02Kanał:\x02 %channel%, \x02Zgłoszono przez:\x02 %requester%, \x02Data:\x02 %date%, \x02Opis:\x02 %description%"
  end: "Koniec listy."

denegados:
  syntax: "DENEGADOS"
  short: "Wyświetla prośby o rejestrację kanałów, które zostały odrzucone."
  help: "Wyświetla każdą odrzuconą prośbę o rejestrację kanału wraz z powodem odrzucenia. Potrzebujesz uprawnienia \x02cregserv.denegados\x02.\n\nTo polecenie nie przyjmuje parametrów."
  example: "/msg CReG DENEGADOS"
  empty: "Brak odrzuconych kanałów."
  line: "\x02Kanał:\x02 %channel%, \x02Powód:\x02 %reason%"
  end: "Koniec listy."

drop:
  syntax: "DROP <#kanał>"
  short: "Usuwa wpis o rejestracji, który \x02%bot%\x02 przechowuje dla kanału."
  help: "Usuwa wpis o rejestracji, który \x02%bot%\x02 przechowuje dla kanału, a jeśli kanał jest tam zarejestrowany, wyrejestrowuje go również z \x02%chanserv%\x02. Potrzebujesz uprawnienia \x02cregserv.drop\x02.\n\n\x02#kanał:\x02 Kanał, który chcesz usunąć.\n\nWyrejestrowanie z \x02%chanserv%\x02 jest miękkie: kanał wchodzi w okres karencji usuwania zamiast być usunięty od razu."
  example: "/msg CReG DROP #kanał"
  dropped: "\x0303✔\x03 Wpis o rejestracji kanału \x02%channel%\x02 został usunięty z \x02%bot%\x02."
  dropped_channel: "\x0303✔\x03 Kanał \x02%channel%\x02 został usunięty i wchodzi teraz w okres karencji usuwania."
  invalid_channel: "\x0304✗\x03 Nazwa kanału musi zaczynać się od \x02#\x02."
  no_request: "\x0304✗\x03 Kanał \x02%channel%\x02 nie jest zarejestrowany w \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#kanał> [opis]"
  short: "Rejestruje kanał, nie będąc w środku."
  help: "Rejestruje kanał na prośbę staffu, bez przechodzenia przez proces zgłoszenia i zatwierdzenia. Nie musisz znajdować się w kanale, a kanał nie musi jeszcze istnieć. Potrzebujesz uprawnienia \x02cregserv.saregister\x02.\n\n\x02#kanał:\x02 Kanał, który chcesz zarejestrować.\n\x02opis:\x02 Opcjonalny opis zapisywany razem z rejestracją."
  example: "/msg CReG SAREGISTER #kanał kanał staffu"
  done: "\x0303✔\x03 Kanał \x02%channel%\x02 został zarejestrowany."
  invalid_channel: "\x0304✗\x03 Nazwa kanału musi zaczynać się od \x02#\x02."
  pending_deletion: "\x0304✗\x03 Kanał \x02%channel%\x02 oczekuje na usunięcie i nie może być zarejestrowany."
  already_registered: "\x0304✗\x03 Kanał \x02%channel%\x02 jest już zarejestrowany."
  failed: "\x0304✗\x03 Nie udało się zakończyć rejestracji kanału \x02%channel%\x02."


    done: "Protokolleigener RAW-Befehl ausgeführt."
    target: "Das aktive Protokoll hat das Ziel %target% abgelehnt."
    unsupported: "Das aktive Protokoll unterstützt diesen RAW-Befehl nicht."
    invalid_resource_type: "Unbekannter Protokoll-Ressourcentyp: %resource_type%."

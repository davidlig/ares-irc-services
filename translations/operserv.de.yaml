# Übersetzungen für OperServ — Deutsch
# Domäne: operserv
#
# IRC-Formatcodes (doppelte Anführungszeichen oder !irc-Literalblöcke):
#   \x02        Fettdruck ein/aus
#   \x03NN      Farbe (DEZIMAL: 03=grün, 04=rot, 07=orange, 14=dunkelgrau)
#   \x03        Farbe zurücksetzen
#   \x0F        gesamte Formatierung zurücksetzen
#
# IRC-Farben verwenden DEZIMALZAHLEN (0-15), keine Hexadezimalzahlen.
#   \x0314 = dunkelgrau (14 dezimal): RICHTIG
#   \x030F = Farbe 0 gefolgt vom Buchstaben F: FALSCH
#
# Mehrzeiliger IRC-Text: !irc |- mit echten Zeilenumbrüchen und Leerzeichen.
# Blöcke ohne Tag dekodieren keine Escape-Sequenzen; CTCP-Literale erhalten.
# HELP-Beispiele: example/examples und %command_prefix%.
# Die Darstellung ergänzt /msg ohne Farbe und einen Rand von zwei Leerzeichen.

# --- ERROR --------------------------------------------------------------------
error:
  root_only: "Dieser Befehl ist Netzwerk-Root-Administratoren vorbehalten."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [Befehl] [Option]"
  short: "Befehle auflisten oder Hilfe für einen Befehl anzeigen."
  help: |-
    Ohne Argumente werden alle Befehle aufgelistet. Verwende %help_command% für
    vollständige Hilfe oder %help_option_command% für SET-Unteroptionen.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Verwaltet Netzwerk-Operatoren und Berechtigungen, setzt Zugriffsbeschränkungen
    durch und trennt Benutzer vom Netzwerk. Außerdem kannst du allgemeine
    Mitteilungen
    senden und Netzwerk-Willkommensnachrichten verwalten.
  general_header: "Verfügbare Befehle:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Optionen:"
  examples_header: "Beispiele:"
  general_help_command: "HELP <Befehl>"
  option_help_command: "HELP %command% <Option>"
  detail_help_command: "HELP <Befehl>"
  detail_help_option_command: "HELP <Befehl> <Option>"
  general_footer: "Verwende /msg %bot% %help_command% für weitere Informationen."
  set_sub_footer: "Verwende /msg %bot% %help_command% für weitere Informationen."
  syntax_label: "Syntax: %syntax%"
  footer: ""
  intro_expiration: "HINWEIS: Nicknamen, die länger als %days% Tage ungenutzt bleiben, werden automatisch entfernt."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operatoren und Rollen"
    network_security: "Netzwerksicherheit"
    communication: "Kommunikation"
    low_level: "Niedrige Ebene"
  ircop_header: "Verfügbare Befehle für IRC-Operatoren:"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax: "IRCOP <Option> [Parameter]"
  short: "Netzwerk-IRC-Operatoren verwalten."
  help: |-
    Verwaltet Netzwerk-IRC-Operatoren. ADD fügt einen registrierten Nickname
    als Operator mit der angegebenen Rolle hinzu.
    DEL entfernt einen Operator. LIST zeigt alle Operatoren.
    Verwenden Sie ROLE LIST, um verfügbare Rollen zu sehen.
    Dieser Befehl ist Root-Benutzern vorbehalten, die in den Services konfiguriert
    sind.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Unbekannter Unterbefehl %sub%. Verwenden Sie ADD, DEL oder LIST."
  unknown_role: "Rolle %role% existiert nicht. Verwenden Sie /msg %bot% %role_list%, um verfügbare Rollen zu sehen."
  already_admin: "%nickname% ist bereits ein IRC-Operator (Rolle: %role%)."
  not_admin: "%nickname% ist kein IRC-Operator."
  role_changed: "Rolle für %nickname% von %old% auf %new% geändert."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nickname> <Rolle>"
    short: "Einen Netzwerk-IRC-Operator hinzufügen."
    help: |-
      Fügt einen registrierten Nickname als Netzwerk-IRC-Operator hinzu.
      Verwenden Sie ROLE LIST, um verfügbare Rollen zu sehen.
      Dieser Befehl ist Root-Benutzern vorbehalten.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "%nickname% als %role% hinzugefügt."
    nick_not_active: "Nickname %nickname% ist kein aktiver registrierter Nickname."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nickname>"
    short: "Einen Netzwerk-IRC-Operator entfernen."
    help: |-
      Entfernt einen Netzwerk-IRC-Operator aus der Liste.
      Dieser Befehl ist Root-Benutzern vorbehalten.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "%nickname% aus den IRC-Operatoren entfernt."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Alle Netzwerk-IRC-Operatoren auflisten."
    help: |-
      Listet alle Netzwerk-IRC-Operatoren mit ihren Rollen und Registrierungsdatum.
      Dieser Befehl ist Root-Benutzern vorbehalten.
    example: "%command_prefix%IRCOP LIST"
    header: "Netzwerk-IRC-Operatoren"
    empty: "Es gibt keine IRC-Operatoren."

# --- ROLE ---------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <Rolle>|SET <Rolle> [operclass]}"
    short: "Konfiguriert die Operator-Klasse von UnrealIRCd."
    help: |-
      Zeigt und konfiguriert die Operclass einer Rolle.

      %options_header%
      %option_LIST%Listet die verfügbaren Operclasses im Netzwerk auf.
      %option_VIEW%Zeigt die Operclass der Rolle und verfügbare Klassen an.
      %option_SET%Weist IRCOPs beim Identifizieren eine Operclass zu.

      Lass den Wert weg, um ihn zu entfernen.

      Nur für UnrealIRCd-Protokolle verfügbar.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SOPORTE"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE"
    list:
      header: "Verfugbare Operclasses im Netzwerk"
      empty: "Keine Operclasses im Netzwerk verfugbar."
      not_supported: "Das aktuelle Protokoll unterstutzt das Auflisten verfugbarer Operclasses nicht."
    view:
      empty: "Die Rolle %role% hat keine Operclass."
      line: "Operclass: %operclass%"
      available: "Verfugbare Operclasses: %available%"
    set:
      done: "Operclass für die Rolle %role% konfiguriert."
      cleared: "Operclass der Rolle %role% entfernt."
      not_available: "Die Operclass %operclass% ist im Netzwerk nicht verfugbar. Verfugbare Operclasses: %available%."
  syntax: "ROLE <Option> [Parameter]"
  short: "Verwaltet Operator-Rollen, Berechtigungen und Einstellungen."
  help: |-
    Verwaltet Operator-Rollen, Berechtigungen und Einstellungen.

    Die Rollen ADMIN, OPER und PREOPER sind geschützt und können nicht gelöscht
    werden.
    Nur für Root-Benutzer.
  syntax_operclass: "ROLE <Option> [Parameter]"
  help_operclass: |-
    Verwaltet Operator-Rollen. ADD erstellt eine neue Rolle, DEL löscht sie,
    LIST zeigt alle Rollen, PERMS verwaltet Berechtigungen einer Rolle, MODES verwaltet IRCOP-Modes,
    VHOST verwaltet das erzwungene VHost-Muster einer Rolle, OPERCLASS verwaltet die Unreal-Operclass.
    Geschützte Rollen (ADMIN, OPER, PREOPER) können nicht gelöscht werden.
    Dieser Befehl ist Root-Benutzern vorbehalten.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SOPORTE Support-Operatoren"
  unknown_sub: "Unbekannter Unterbefehl %sub%. Verwenden Sie ADD, DEL, LIST, PERMS, MODES oder VHOST."
  unknown_sub_operclass: "Unbekannter Unterbefehl %sub%. Verwenden Sie ADD, DEL, LIST, PERMS, MODES, VHOST oder OPERCLASS."
  not_found: "Rolle %role% existiert nicht."
  already_exists: "Rolle %role% existiert bereits."
  protected: "Rolle %role% ist geschützt und kann nicht gelöscht werden."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <Name> [Beschreibung]"
    short: "Eine neue Rolle erstellen."
    help: |-
      Erstellt eine neue benutzerdefinierte Rolle. Beschreibung ist optional.
      Dieser Befehl ist Root-Benutzern vorbehalten.
    example: "%command_prefix%ROLE ADD SOPORTE Support-Operatoren"
    done: "Rolle %role% erstellt."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <Name>"
    short: "Eine Rolle löschen."
    help: |-
      Löscht eine benutzerdefinierte Rolle. Geschützte Rollen (ADMIN, OPER, PREOPER)
      können nicht gelöscht werden. Wenn der Rolle Operatoren zugewiesen sind,
      müssen diese zuerst neu zugewiesen werden.
      Dieser Befehl ist Root-Benutzern vorbehalten.
    example: "%command_prefix%ROLE DEL SOPORTE"
    done: "Rolle %role% gelöscht."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Zeigt verfügbare Rollen an."
    help: |-
      Listet alle Rollen auf. Geschützte Rollen sind mit [GESCHÜTZT] markiert.
      Dieser Befehl ist Root-Benutzern vorbehalten.
    example: "%command_prefix%ROLE LIST"
    header: "Operator-Rollen"
    empty: "Es gibt keine Operator-Rollen."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <Rolle> <Berechtigung>|{LIST|CLEAR} <Rolle>}"
    short: "Verwaltet die Berechtigungen einer Rolle."
    help: |-
      Verwaltet die einer Rolle zugewiesenen Berechtigungen.

      %options_header%
      %option_LIST%Zeigt alle verfügbaren Berechtigungen und markiert die
                      zugewiesenen.
      %option_ADD%Weist eine Berechtigung zu.
      %option_DEL%Entfernt eine Berechtigung (nicht für geschützte Rollen).
      %option_CLEAR%Entfernt alle Berechtigungen.

      %assigned_status% bedeutet zugewiesen; %unassigned_status% bedeutet verfügbar.

      Verwende ALL, um alle verfügbaren Berechtigungen auf einmal hinzuzufügen.
      Nur für Root-Benutzer.
    example: "%command_prefix%ROLE PERMS LIST SOPORTE"
    examples:
      - "%command_prefix%ROLE PERMS ADD SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SOPORTE ALL"
      - "%command_prefix%ROLE PERMS DEL SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SOPORTE"
    not_found: "Berechtigung %perm% existiert nicht."
    already_has: "Rolle %role% hat bereits die Berechtigung %perm%."
    does_not_have: "Rolle %role% hat die Berechtigung %perm% nicht."
    list:
      header: "Berechtigungsliste für %role%"
      columns: "Zugewiesen | Berechtigungsschlüssel | Beschreibung"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Berechtigung %perm% zu Rolle %role% hinzugefügt."
      all_done: "%count% Berechtigungen zu Rolle %role% hinzugefügt."
    del:
      done: "Berechtigung %perm% von Rolle %role% entfernt."
    clear:
      done: "%count% Berechtigungen von Rolle %role% entfernt."
      empty: "Rolle %role% hat keine Berechtigungen zugewiesen."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <Rolle>|SET <Rolle> [Modi]}"
    short: "Konfiguriert die Benutzermodi einer Rolle."
    help: |-
      Verwaltet die IRCOP-Benutzermodi einer Rolle.

      %options_header%
      %option_VIEW%Zeigt die aktuellen Modi der Rolle an.
      %option_SET%Legt IRCOP-Modi fest.

      Lass die Modi weg, um alle zu entfernen.

      Benutzer dieser Rolle erhalten die Modi beim Identifizieren.
      Verfügbare Modi nach IRCD
      Nur für Root-Benutzer.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Modes für %role%"
      empty: "Die Rolle %role% hat keine Modes zugewiesen."
      line: "Modes: %modes%"
    set:
      done: "Modes %modes% für Rolle %role% gesetzt."
      cleared: "Alle Modes von Rolle %role% entfernt."
      invalid_mode: "Der Mode %mode% ist kein gültiger IRCOP-Mode."
      invalid_modes: "Ungültige Modes: %invalid%. Gültige Modes: %valid%."
      no_irc_user_modes: "Der aktuelle IRCD hat keine IRCOP-Modes konfiguriert."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <Rolle>|SET <Rolle> [VHost]}"
    short: "Konfiguriert das virtuelle Hostmuster einer Rolle."
    help: |-
      Legt den virtuellen Host fest, den Operatoren einer Rolle beim Identifizieren
      anstelle ihres persönlichen Hosts erhalten.

      Der Host wird aus dem Nickname ohne Sonderzeichen und dem konfigurierten Muster
      erzeugt. Beispiel:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Zeigt das Hostmuster einer Rolle an.
      %option_SET%Legt das Hostmuster fest oder entfernt es.

      Das Muster erlaubt Buchstaben, Ziffern, Bindestriche und Punkte. Es muss
      mindestens
      einen Punkt enthalten, darf nicht mit Bindestrich oder Punkt beginnen oder enden
      und keine aufeinanderfolgenden Punkte enthalten.

      Verwende SET ohne Muster, um den erzwungenen Host zu entfernen.

      Nur für Root-Benutzer.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Erzwungener VHost für %role%"
      empty: "Die Rolle %role% hat kein erzwungenes VHost-Muster gesetzt."
      line: "Muster: %pattern%"
      example: "Beispiel: %example_nickname%.%pattern%"
      example_nickname: "nickname"
    set:
      done: "Erzwungenes VHost-Muster für Rolle %role% gesetzt."
      cleared: "Erzwungenes VHost-Muster von Rolle %role% entfernt."
      invalid: "Ungültiges VHost-Muster. Gültige Zeichen: a-z, A-Z, 0-9, - und .. Muss mindestens einen Punkt haben, darf nicht mit - oder . beginnen/enden oder .. enthalten"

# --- KILL ---------------------------------------------------------------------
kill:
  syntax: "KILL <nickname> <Begründung>"
  short: "Einen Benutzer zwangsweise vom Netzwerk trennen."
  help: |-
    Trennt einen Benutzer vom IRC-Netzwerk.
    IRC-Operatoren und Root-Benutzer können nicht gekillt werden.
  example: "%command_prefix%KILL BadUser Flooding en canales"
  protected_root: "Root-Benutzer %nickname% kann nicht gekillt werden."
  protected_ircop: "IRC-Operator %nickname% kann nicht gekillt werden."
  done: "Benutzer %nickname% wurde gekillt (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax: "GLINE <Option> [Parameter]"
  short: "Netzwerkweite G-Lines verwalten."
  help: |-
    Verwaltet netzwerkweite G-Lines (Bans).
    ADD fügt eine G-Line mit Maske, Ablaufzeit und Begründung hinzu.
    DEL entfernt eine G-Line anhand der Maske oder Eintragsnummer.
    LIST zeigt alle G-Lines an und kann nach Maske gefiltert werden.

    Ablaufzeit: 0 = dauerhaft oder Endung d, h, m (z. B. 7d, 12h, 30m).
    G-Lines, die auf Root oder IRC-Operatoren passen, werden abgelehnt.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spam-Missbrauch"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Anhaltender Missbrauch"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Unbekannter Unterbefehl %sub%. Verwenden Sie ADD, DEL oder LIST."
  invalid_mask: "Ungültiges Maskenformat. Muss im Format benutzer@host sein (z. B. *@192.168.*)."
  global_mask: "G-Line-Maske %mask% ist zu allgemein. Globale Masken sind nicht erlaubt."
  dangerous_mask: "G-Line-Maske %mask% ist zu allgemein. Der Host-Teil benötigt mindestens 4 alphanumerische Zeichen."
  protected_user: "Geschützter Benutzer %nickname% kann nicht mit G-Line belegt werden."
  invalid_expiry: "Ungültiges Ablauf-Format. Verwenden Sie 0 für dauerhaft oder einen Wert wie 7d, 12h, 30m."
  already_exists: "G-Line für %mask% existiert bereits."
  max_entries: "Maximale Anzahl von G-Lines (%max%) erreicht."
  not_found: "G-Line %mask% nicht gefunden."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <Maske> <Ablauf> <Begründung>"
    short: "Eine netzwerkweite G-Line hinzufügen."
    help: |-
      Fügt eine netzwerkweite G-Line (Ban) hinzu.
      Die Maske muss das Format Benutzer@Host haben.
      Ablaufzeit: 0 = dauerhaft oder Endung d, h, m (z. B. 7d, 12h, 30m).
      G-Lines, die auf Root oder IRC-Operatoren passen, werden abgelehnt.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spam-Missbrauch"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Anhaltender Missbrauch"
    done: "G-Line hinzugefügt: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<Maske>|<Nummer>}"
    short: "Eine G-Line entfernen."
    help: |-
      Entfernt eine G-Line aus der Liste.
      Du kannst die Maske oder die Eintragsnummer aus LIST angeben.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-Line %mask% entfernt."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [Maske]"
    short: "Alle G-Lines auflisten."
    help: "Listet alle G-Lines auf. Optional kann nach einem Maskenmuster gefiltert werden."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-Lines (%count%)"
    empty: "Es gibt keine G-Lines."
    entry: "%index%. %mask% - %reason% (%nickname%, läuft ab: %expiration%)"

# --- BADMAIL ------------------------------------------------------------------
badmail:
  syntax: "BADMAIL <Option> [Parameter]"
  short: "Gesperrte E-Mail-Domains verwalten."
  help: |-
    Gesperrte E-Mail-Domains verwalten.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <Domain> <Begründung>"
    short: "Eine Domain sperren."
    help: |-
      Akzeptiert ASCII- oder Punycode-Domains, keine Adressen oder Muster.
      Eine Begründung ist erforderlich. Die Sperre gilt exakt, nicht für
      Subdomains.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {Nummer|ALL}"
    short: "Domainsperren entfernen."
    help: |-
      Eine dauerhafte Kennung oder mit ALL alle Einträge löschen. Andere
      Kennungen bleiben unverändert.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <Muster> [Seite]"
    short: "Gesperrte Domains auflisten."
    help: |-
      Ein Muster ist erforderlich. Nur * ist ein Platzhalter für beliebige
      Zeichenfolgen. Groß- und Kleinschreibung wird ignoriert. Die optionale
      Seite beginnt bei 1. Kennungen bleiben beim Filtern und Blättern
      erhalten.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Ungültige Domain. ASCII oder Punycode ohne abschließenden Punkt verwenden."
  invalid_reason: "Eine nicht leere, einzeilige administrative Begründung ist erforderlich."
  duplicate: "Diese Domain ist bereits gesperrt."
  not_found: "Keine gesperrte Domain mit dieser Kennung gefunden."
  added: "Domain %domain% gesperrt."
  deleted: "Domainsperre %id% entfernt."
  cleared: "%total% Domainsperren entfernt."
  empty: "Keine passenden gesperrten Domains."
  header: "ID | Domain | Begründung"
  page: "Seite %page%/%pages%, %total% passende Domains."
  row: "%id% | %domain% | %reason%"

# --- GLOBAL -------------------------------------------------------------------
global:
  syntax: "GLOBAL {Service|nick!ident@vhost} {PRIVMSG|NOTICE} <Nachricht>"
  short: "Eine globale Nachricht an alle verbundenen Benutzer senden."
  help: |-
    Sendet Nachrichten an alle verbundenen Benutzer – mit einem vorhandenen
    Dienst oder einem temporären Client mit benutzerdefinierter Identität.

    Nachrichten können als PRIVMSG (privat) oder NOTICE (Hinweis) gesendet werden.

    Für einen temporären Client muss eine Maske im Format Nickname!Ident@VHost
    angegeben werden; jedes Feld muss gültige Zeichen enthalten.

    Der Nickname darf weder registriert noch in Benutzung sein. Der Client wird nach
    dem Senden automatisch getrennt und der Nickname 24 Stunden lang gesperrt.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Wartung in 10 Minuten"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE Das Netzwerk wird neu gestartet"
  mask_invalid: "Ungültiges Maskenformat: %error%"
  nick_connected: "Nickname %nickname% ist derzeit verbunden."
  nick_registered: "Nickname %nickname% ist registriert."
  type_invalid: "Nachrichtentyp muss PRIVMSG oder NOTICE sein."
  done: "Globale Nachricht von %nickname% an %count% Benutzer gesendet."

# --- MOTD ---------------------------------------------------------------------
motd:
  short: "Connect-MOTD-Nachrichten verwalten, die Benutzern beim Verbinden gesendet werden."
  syntax: "MOTD <Option> [Parameter]"
  help: |-
    Verwaltet MOTD-Einträge (Nachricht des Tages), die beim Verbinden an Benutzer
    gesendet werden.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Unbekannter Unterbefehl. Verwenden Sie: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {Service|nick!ident@vhost} {PRIVMSG|NOTICE} <Ablauf> <Nachricht>"
    syntax_hint: "Verwendung: %syntax%"
    short: "Einen MOTD-Eintrag hinzufügen."
    help: |-
      Fügt eine neue MOTD-Nachricht hinzu, die jedem Benutzer beim Verbinden
      gesendet wird.
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Wartung heute Nacht"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Willkommen a la red"
    done: "MOTD-Eintrag #%id% hinzugefügt."
    invalid_type: "Ungültiger Nachrichtentyp. Muss PRIVMSG oder NOTICE sein."
    invalid_expiry: "Ungültiges Ablaufzeitformat. Verwende <Zahl><s|m|h|d> oder 0 für unbegrenzt (z. B. 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Verwendung: %syntax%"
    short: "Einen MOTD-Eintrag löschen."
    help: "Löscht einen MOTD-Eintrag anhand seiner ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "MOTD-Eintrag #%id% gelöscht."
    not_found: "MOTD-Eintrag nicht gefunden."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Alle MOTD-Einträge auflisten."
    help: "Listet alle konfigurierten MOTD-Einträge auf."
    example: "%command_prefix%MOTD LIST"

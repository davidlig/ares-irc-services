# --- RAW ----------------------------------------------------------------------
raw:
  syntax: "RAW <Zeile>"
  short: "Eine rohe Protokollzeile an den IRCd senden."
  help: |-
    Sendet die angegebene Zeile direkt an den Socket des IRCd-Linkservers.
    Mit äußerster Vorsicht verwenden. Ungültige Protokollzeilen können das Netzwerk
    stören.
  example: "%command_prefix%RAW :services.ares NOTICE * :Geplante Wartung"
  empty: "Sie müssen eine nicht-leere Zeile zum Senden angeben."
  too_long: "Zeile ist zu lang. Maximal 510 Zeichen."

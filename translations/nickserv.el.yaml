# --- SET -------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <new_password>|EMAIL <email> <token>|LANGUAGE <code>|TIMEZONE <timezone>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Αλλάξτε τις επιλογές του ψευδωνύμου σας."
  help: |-
    Τροποποιεί τις ρυθμίσεις του ψευδωνύμου σας. Πρέπει να έχετε ταυτοποιηθεί για να
    αλλάξετε αυτές τις επιλογές.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Άγνωστη επιλογή %option%. Διαθέσιμες επιλογές: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <new_password>"
    short: "Αλλάξτε τον κωδικό του ψευδωνύμου σας."
    help: |-
      Αλλάζει τον κωδικό για το ψευδώνυμό σας. Ο νέος κωδικός
      ισχύει άμεσα. Επιλέξτε έναν ισχυρό κωδικό τουλάχιστον 6 χαρακτήρων
      που δεν χρησιμοποιείτε σε άλλες υπηρεσίες.
    example: "%command_prefix%SET PASSWORD Ασφαλές$Pass123_123"
    success: "Ο κωδικός σας έχει ενημερωθεί επιτυχώς."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Χρησιμοποίησε %value% με το επιβεβαιωμένο διακριτικό διάσωσης."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Αλλάξτε τη διεύθυνση email που συνδέεται με το ψευδώνυμό σας (επιβεβαίωση δύο βημάτων)."
    help: |-
      Το SET EMAIL αλλάζει τη διεύθυνση επικοινωνίας μετά την επικύρωση του
      διακριτικού διάσωσης, χωρίς να το καταναλώνει. Ελέγχει μορφή και μοναδικότητα·
      δεν στέλνει email επιβεβαίωσης.
      Δεν επιτρέπονται διοικητικά αποκλεισμένοι τομείς email.
    example: "%command_prefix%SET EMAIL user@example.gr <token_confirmado>"
    success: "Το email σας έχει ενημερωθεί σε %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Ένα token επιβεβαίωσης έχει σταλεί στο %current_email%."
    pending_line_2: "Για να επιβεβαιώσετε την αλλαγή σε %new_email% εκτελέστε:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "Το token λήγει σε 1 ώρα."
    pending_command: "SET EMAIL %new_email% <διακριτικό>"
    invalid_token: "Το token είναι άκυρο ή έχει λήξει. Ζητήστε νέο με %value%."
    invalid_token_value: "SET EMAIL <new_email>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <code>"
    short: "Αλλάξτε τη γλώσσα που χρησιμοποιούν οι υπηρεσίες για να επικοινωνούν μαζί σας."
    help: |-
      Αλλάζει τη γλώσσα που το %nickserv% και άλλες υπηρεσίες χρησιμοποιούν όταν σας
      μιλούν.
      Διαθέσιμες γλώσσες:
      %emphasis_0% (Καταλανικά)
      %emphasis_1% (Γερμανικά)
      %emphasis_2% (Ελληνικά)
      %emphasis_3% (Αγγλικά)
      %emphasis_4% (Ισπανικά)
      %emphasis_5% (Βασκικά)
      %emphasis_6% (Γαλλικά)
      %emphasis_7% (Γαλικιακά)
      %emphasis_8% (Ιταλικά)
      %emphasis_9% (Ολλανδικά)
      %emphasis_10% (Πολωνικά)
      %emphasis_11% (Πορτογαλικά)
      %emphasis_12% (Ρουμανικά)
      %emphasis_13% (Τουρκικά)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Η γλώσσα άλλαξε σε %language%."
    invalid: "Μη υποστηριζόμενη γλώσσα. Διαθέσιμες γλώσσες: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <timezone>"
    short: "Ορίστε τη ζώνη ώρας που χρησιμοποιείται κατά την εμφάνιση ημερομηνιών."
    help: |-
      Ορίζει τη ζώνη ώρας που χρησιμοποιεί το %nickserv% για την εμφάνιση ημερομηνιών.
      Δείτε το HELP SET TIMEZONE για τις περιοχές. Χρησιμοποιήστε OFF για κατάργηση.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Ζώνη ώρας ορίστηκε σε %timezone%. Οι ημερομηνίες θα εμφανίζονται σε αυτήν τη ζώνη ώρας."
    cleared: "Η ζώνη ώρας εκκαθαρίστηκε. Οι ημερομηνίες θα χρησιμοποιούν την προεπιλογή του δικτύου."
    invalid: "Μη έγκυρη ζώνη ώρας %timezone%. Χρησιμοποιήστε έγκυρο αναγνωριστικό (π.χ. UTC, Europe/Athens)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Ενεργοποίηση ή απενεργοποίηση ιδιωτικότητας για τις πληροφορίες του ψευδωνύμου σας."
    help: |-
      Ελέγχει την ορατότητα των πληροφοριών του ψευδωνύμου σας στην εντολή INFO.
      Με %emphasis_0% μόνο εσείς και οι IRC Operators μπορούν να δουν τις λεπτομέρειές
      σας.
      Με %emphasis_1% οι πληροφορίες σας είναι δημόσιες για όλους.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Οι πληροφορίες του ψευδωνύμου σας είναι τώρα %value%."
    on_value: "ιδιωτικές"
    off: "Οι πληροφορίες του ψευδωνύμου σας είναι τώρα %value%."
    off_value: "δημόσιες"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Χρήση PRIVMSG (ON) ή NOTICE (OFF) για απαντήσεις υπηρεσιών."
    help: |-
      Ελέγχει πώς το %nickserv% και άλλες υπηρεσίες στέλνουν μηνύματα σε εσάς.
      Με %emphasis_0% οι απαντήσεις στέλνονται ως %emphasis_1% (ορισμένοι clients μπορεί να
      ενεργοποιούν απαντήσεις ή ειδοποιήσεις).
      Με %emphasis_2% οι απαντήσεις στέλνονται ως %emphasis_3% (προεπιλογή· συνήθως χωρίς
      αυτόματη απάντηση).
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Τα μηνύματα υπηρεσιών θα στέλνονται τώρα ως %value%."
    on_value: "PRIVMSG"
    off: "Τα μηνύματα υπηρεσιών θα στέλνονται τώρα ως %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Ορίστε ή εκκαθαρίστε το προσαρμοσμένο εικονικό host σας (εμφανιζόμενο hostname)."
    help: |-
      Ορίζει ένα προσαρμοσμένο hostname που βλέπουν οι άλλοι όταν είστε
      ταυτοποιημένοι.

      Χρησιμοποιήστε %emphasis_0% χωρίς τιμή για εκκαθάριση.

      Μόνο γράμματα (a-z, A-Z),
      ψηφία,
      παύλα και τελεία· όχι παύλα ή τελεία στην αρχή/τέλος κάθε μπλοκ· μέγιστο 48
      χαρακτήρες.
      Μοναδικό ανά ψευδώνυμο.
    example: "%command_prefix%SET VHOST user.example.gr"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Το εικονικό host σας έχει οριστεί σε %vhost%."
    cleared: "Το εικονικό host σας έχει εκκαθαριστεί."
    invalid: "Μη έγκυρο vhost. Μόνο γράμματα, ψηφία, παύλα και τελεία (όχι στην αρχή/τέλος μπλοκ)· μέγιστο 48 χαρακτήρες."
    taken: "Αυτό το vhost χρησιμοποιείται ήδη από άλλο ψευδώνυμο."
    forced: "Το vhost σας διαμορφώνεται αυτόματα και δεν μπορεί να αλλάξει με SET VHOST."

# --- SAREGISTER ------------------------------------------------------------
saregister:
  syntax: "SAREGISTER <nickname> <κωδικός> [email]"
  short: "Διοικητική καταχώριση ψευδωνύμου."
  help: |-
    Σύνταξη: SAREGISTER <nickname> <κωδικός> [email]

    Καταχωρεί διοικητικά ένα ψευδώνυμο αμέσως χωρίς να απαιτείται
    επαλήθευση πελάτη ή όρια συχνότητας.

    Στη λειτουργία TOKEN, το διακριτικό διάσωσης εμφανίζεται μία φορά στον διαχειριστή.
    Στη λειτουργία EMAIL, το διακριτικό διάσωσης αποστέλλεται στην καθορισμένη διεύθυνση email.
  example: "%command_prefix%SAREGISTER Alice Κωδικός123"
  examples:
    - "%command_prefix%SAREGISTER Bob Κωδικός456 bob@example.gr"
  success_token: "Το ψευδώνυμο %nickname% καταχωρήθηκε. Διακριτικό διάσωσης: %token%"
  success_email: "Το ψευδώνυμο %nickname% καταχωρήθηκε. Το διακριτικό διάσωσης στάλθηκε στο %email%."
  invalid_nickname: "Μη έγκυρο ψευδώνυμο %nickname%."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <ψευδώνυμο> {PASSWORD <νέος_κωδικός>|EMAIL <νέο_email>|LANGUAGE <κωδικός>|TIMEZONE {<ζώνη_ώρας>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Τροποποίηση ρυθμίσεων άλλου ψευδωνύμου."
  help: |-
    Επιτρέπει σε IRC Operator να τροποποιεί τις ρυθμίσεις ενός καταχωρημένου
    ψευδωνύμου.
    Το ψευδώνυμο-στόχος δεν μπορεί να είναι root χρήστης, IRC Operator ή υπηρεσία.

    Διαθέσιμες επιλογές: PASSWORD, EMAIL, LANGUAGE, TIMEZONE, PRIVATE, MSG, VHOST

    SASET PASSWORD: Αλλάζει τον κωδικό πρόσβασης άμεσα (χωρίς επιβεβαίωση email).
    SASET EMAIL: Αλλάζει το email άμεσα (χωρίς επικύρωση token).

    Αυτή η εντολή απαιτεί άδεια IRCop: nickserv.saset

    Σύνταξη: SASET <ψευδώνυμο> <επιλογή> <τιμή>
    Παράδειγμα: SASET Χρήστης PASSWORD νέοςκωδικός
  example: "%command_prefix%SASET Χρήστης PRIVATE ON"
  examples:
    - "%command_prefix%SASET Χρήστης TIMEZONE OFF"
  unknown_option: "Άγνωστη επιλογή %option%. Διαθέσιμες επιλογές: %options%."
  cannot_modify_oper: "Δεν μπορεί να τροποποιηθεί ψευδώνυμο IRC Operator."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <ψευδώνυμο> PASSWORD <νέος_κωδικός>"
    short: "Αλλαγή κωδικού ψευδωνύμου."
    help: |-
      Αλλάζει τον κωδικό πρόσβασης άλλου ψευδωνύμου.
      Η αλλαγή είναι άμεση.

      Σύνταξη: SASET <ψευδώνυμο> PASSWORD <νέος_κωδικός>
      Παράδειγμα: SASET Χρήστης PASSWORD νέοςκωδικός123
    example: "%command_prefix%SASET Χρήστης PASSWORD ClaveSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <ψευδώνυμο> EMAIL <νέο_email>"
    short: "Αλλαγή email ψευδωνύμου."
    help: |-
      Αλλάζει το email άλλου ψευδωνύμου.
      Δεν αποστέλλεται επιβεβαίωση—η αλλαγή είναι άμεση.

      Σύνταξη: SASET <ψευδώνυμο> EMAIL <νέο_email>
      Παράδειγμα: SASET Χρήστης EMAIL χρήστης@παράδειγμα.com
      Το BADMAIL δεν περιορίζει αυτή τη διοικητική αλλαγή email.
    example: "%command_prefix%SASET Χρήστης EMAIL user@example.gr"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <ψευδώνυμο> LANGUAGE <κωδικός>"
    short: "Αλλαγή γλώσσας ψευδωνύμου."
    help: |-
      Αλλάζει τη γλώσσα άλλου ψευδωνύμου.
      Διαθέσιμες γλώσσες: en (Αγγλικά), es (Ισπανικά).

      Σύνταξη: SASET <ψευδώνυμο> LANGUAGE <κωδικός>
      Παράδειγμα: SASET Χρήστης LANGUAGE el
    example: "%command_prefix%SASET Χρήστης LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <ψευδώνυμο> TIMEZONE {<ζώνη_ώρας>|OFF}"
    short: "Αλλαγή ζώνης ώρας ψευδωνύμου."
    help: |-
      Ορίζει ή εκκαθαρίζει τη ζώνη ώρας άλλου ψευδωνύμου.
      Χρησιμοποιήστε OFF για εκκαθάριση.

      Σύνταξη: SASET <ψευδώνυμο> TIMEZONE <ζώνη_ώρας>
      Παράδειγμα: SASET Χρήστης TIMEZONE Europe/Athens
    example: "%command_prefix%SASET Χρήστης TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Χρήστης TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <ψευδώνυμο> PRIVATE {ON|OFF}"
    short: "Αλλαγή ιδιωτικότητας ψευδωνύμου."
    help: |-
      Ενεργοποιεί ή απενεργοποιεί την ιδιωτικότητα των πληροφοριών άλλου ψευδωνύμου.

      Σύνταξη: SASET <ψευδώνυμο> PRIVATE {ON|OFF}
      Παράδειγμα: SASET Χρήστης PRIVATE ON
    example: "%command_prefix%SASET Χρήστης PRIVATE ON"
    examples:
      - "%command_prefix%SASET Χρήστης PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <ψευδώνυμο> MSG {ON|OFF}"
    short: "Αλλαγή προτίμησης μηνυμάτων ψευδωνύμου."
    help: |-
      Ορίζει αν άλλο ψευδώνυμο λαμβάνει απαντήσεις ως PRIVMSG (ON) ή NOTICE (OFF).

      Σύνταξη: SASET <ψευδώνυμο> MSG {ON|OFF}
      Παράδειγμα: SASET Χρήστης MSG ON
    example: "%command_prefix%SASET Χρήστης MSG ON"
    examples:
      - "%command_prefix%SASET Χρήστης MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <ψευδώνυμο> VHOST [vhost]"
    short: "Αλλαγή εικονικού host ψευδωνύμου."
    help: |-
      Ορίζει ή αφαιρεί το εικονικό host άλλου ψευδωνύμου. Εκτελέστε SASET <ψευδώνυμο>
      VHOST χωρίς τιμή για να το αφαιρέσετε.
    example: "%command_prefix%SASET Χρήστης VHOST user.example.gr"
    examples:
      - "%command_prefix%SASET Χρήστης VHOST"

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [command]"
  short: "Εμφάνιση βοήθειας για εντολές του %nickserv%."
  help: |-
    Εμφανίζει γενική βοήθεια του %nickserv% ή λεπτομερείς πληροφορίες
    για μια συγκεκριμένη εντολή.
  examples_header: "Παραδείγματα:"
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP SET"
    - "%command_prefix%HELP SET EMAIL"
    - "%command_prefix%HELP SET TIMEZONE Europe"
  header_title: "%bot%"
  header: "%title%"
  navigation_marker: ""
  info_marker: ""
  error_marker: ""
  warning_marker: ""
  intro: |-
    Σας επιτρέπει να καταχωρείτε και να προστατεύετε το ψευδώνυμό σας, ώστε να μην
    το χρησιμοποιούν άλλοι χρήστες. Διαχειριστείτε την ασφάλεια του λογαριασμού σας,
    προσαρμόστε τις προτιμήσεις σας και ανακτήστε την πρόσβαση όποτε χρειαστεί.
  intro_expiration: "%label%: Τα ψευδώνυμα που δεν χρησιμοποιούνται για περισσότερες από %duration% διαγράφονται αυτόματα."
  intro_expiration_duration: "%days% ημέρες"
  intro_expiration_label: "ΣΗΜΕΙΩΣΗ"
  general_header: "Διαθέσιμες εντολές:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Επιλογές:"
  general_syntax: "HELP <εντολή>"
  general_footer: "Χρησιμοποιήστε /msg %bot% %syntax% για περισσότερες πληροφορίες."
  set_sub_syntax: "HELP %command% <επιλογή>"
  set_sub_footer: "Χρησιμοποιήστε /msg %bot% %syntax% για περισσότερες πληροφορίες."
  syntax_label: "Σύνταξη: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    registration_auth: "Εγγραφή και ταυτοποίηση"
    account_security: "Λογαριασμός και ασφάλεια"
  ircop_group:
    lookup: "Αναζήτηση και διερεύνηση"
    account_management: "Διαχείριση λογαριασμών"
    suspensions_bans: "Αναστολές και απαγορεύσεις"
    deletion: "Διαγραφή και επαναφορά"
  ircop_header: "Διαθέσιμες εντολές για IRC operators:"
  set_timezone:
    index_label: "Περιοχές (χρησιμοποιήστε %syntax% για λίστα):"
    index_syntax: "HELP SET TIMEZONE <region>"
    region_header: "Ζώνες ώρας για %region%:"
    region_unknown: "Άγνωστη περιοχή. Χρησιμοποιήστε %syntax% για το ευρετήριο."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "Το ψευδώνυμο %nickname% είναι καταχωρημένο. Θα μετονομαστείτε αν δεν ταυτοποιηθείτε."
  renamed_to: |-
    Έχετε μετονομαστεί σε %guest_nick%. Για ανάκτηση του ψευδωνύμου σας:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <κωδικός>"
  nick_forbidden: "Το ψευδώνυμο %nickname% είναι απαγορευμένο: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Λάβετε την πραγματική διεύθυνση IP και το hostname του ψευδωνύμου."
  help: |-
    Εμφανίζει την πραγματική διεύθυνση IP και το hostname του καθορισμένου
    ψευδωνύμου.
    Διαθέσιμο μόνο σε IRCops με άδεια 'nickserv.userip'.

    Αυτή η εντολή εμφανίζει ευαίσθητες πληροφορίες ψευδωνύμου.
    Χρησιμοποιήστε υπεύθυνα.

    Σύνταξη: USERIP <ψευδώνυμο>
    Παράδειγμα: USERIP SomeUser
  example: "%command_prefix%USERIP Χρήστης"
  result: "Ψευδώνυμο: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Βρίσκει ψευδώνυμα με βάση την IP της τελευταίας ταυτοποιημένης σύνδεσής τους."
  help: |-
    Εμφανίζει τα καταχωρημένα ψευδώνυμα των οποίων η τελευταία ταυτοποιημένη σύνδεση
    χρησιμοποίησε αυτή την IP.
    Η αποθηκευμένη διεύθυνση μπορεί να είναι παλιά.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Δεν βρέθηκαν καταχωρημένα ψευδώνυμα για αυτή την IP."
  header: "Ψευδώνυμα που ταιριάζουν:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <duration> <αιτιολογία>"
  short: "Αναστολή ψευδωνύμου."
  help: |-
    Θέτει σε αναστολή ένα ψευδώνυμο, εμποδίζοντας τον κάτοχο από το να ταυτοποιηθεί.
    Η αναστολή μπορεί να είναι προσωρινή ή μόνιμη.

    Μορφές διάρκειας: %emphasis_0% (ημέρες), %emphasis_1% (ώρες), %emphasis_2%
    (λεπτά), ή %emphasis_3% (μόνιμη).

    Οι χρήστες σε αναστολή δεν μπορούν να ταυτοποιηθούν στο ψευδώνυμό τους.
    Οι IRC operators και οι root χρήστες δεν μπορούν να τεθούν σε αναστολή.

    Σύνταξη: SUSPEND <ψευδώνυμο> <διάρκεια> <αιτιολογία>
    Παραδείγματα:
      SUSPEND BadUser 7d Spamming στο #help
      SUSPEND Abuser 30d Επαναλαμβανόμενο flood
      SUSPEND ProblemUser 0 Αποφυγή permaban
  example: "%command_prefix%SUSPEND ΚακόςΧρήστης 7d Spam en #βοήθεια"
  examples:
    - "%command_prefix%SUSPEND Προβληματικός 0 Παράκαμψη αποκλεισμού"
  success: "Το ψευδώνυμο %nickname% έχει τεθεί σε αναστολή μέχρι %duration%."
  already_suspended: "Το ψευδώνυμο %nickname% είναι ήδη σε αναστολή."
  forbidden: "Το ψευδώνυμο %nickname% είναι απαγορευμένο και δεν μπορεί να τεθεί σε αναστολή."
  cannot_suspend_oper: "Δεν μπορεί να τεθεί σε αναστολή ο IRC operator %nickname%."
  cannot_suspend_root: "Δεν μπορεί να τεθεί σε αναστολή ο root χρήστης %nickname%."
  cannot_suspend_service: "Δεν μπορεί να τεθεί σε αναστολή το ψευδώνυμο υπηρεσίας %nickname%."
  invalid_duration: "Μη έγκυρη διάρκεια. Χρησιμοποιήστε: %duration_format% (π.χ., 7d, 12h, 30m) ή %permanent% για μόνιμη."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Αφαίρεση αναστολής από ψευδώνυμο."
  help: |-
    Αφαιρεί μια ενεργή αναστολή από ένα ψευδώνυμο, επιτρέποντας στον κάτοχο να
    ταυτοποιηθεί ξανά.

    Σύνταξη: UNSUSPEND <ψευδώνυμο>
    Παράδειγμα: UNSUSPEND SomeUser
  example: "%command_prefix%UNSUSPEND Χρήστης"
  success: "Η αναστολή έχει αρθεί από %nickname%."
  not_suspended: "Το ψευδώνυμο %nickname% δεν είναι σε αναστολή."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Αναγκαστική μετονομασία συνδεδεμένου ψευδωνύμου σε τυχαίο."
  help: |-
    Αναγκάζει ένα συνδεδεμένο ψευδώνυμο να αλλάξει σε τυχαίο όνομα με πρόθεμα που
    έχει ορίσει το δίκτυο.
  example: "%command_prefix%RENAME Προβληματικός"
  cannot_rename_root: "Δεν μπορεί να μετονομαστεί ο root χρήστης %nickname%."
  cannot_rename_oper: "Δεν μπορεί να μετονομαστεί ο IRC operator %nickname%."
  cannot_rename_service: "Δεν μπορεί να μετονομαστεί το ψευδώνυμο υπηρεσίας %nickname%."
  success: "Το ψευδώνυμο %nickname% έχει μετονομαστεί σε %new_nick%."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Διαγραφή καταχωρημένου ψευδωνύμου."
  help: |-
    Διαγράφει ένα καταχωρημένο ψευδώνυμο από τη βάση δεδομένων.
    Αυτή η ενέργεια δεν μπορεί να αναιρεθεί.

    Αν ο χρήστης είναι online, θα μετονομαστεί σε ψευδώνυμο Guest-.
    Οι root χρήστες και οι IRC operators δεν μπορούν να διαγραφούν.
    Δεν μπορείτε να διαγράψετε το δικό σας ψευδώνυμο.

    Αυτή η εντολή απαιτεί άδεια IRCop: nickserv.drop

    Σύνταξη: DROP <ψευδώνυμο>
    Παράδειγμα: DROP OldAccount
  force:
    short: "Διαγράφει οριστικά ένα ψευδώνυμο που εκκρεμεί προς διαγραφή."
  example: "%command_prefix%DROP ΠαλιόςΛογαριασμός"
  examples:
    - "%command_prefix%DROP ΠαλιόςΛογαριασμός FORCE"
  suspended: "Το ψευδώνυμο %nickname% είναι σε αναστολή. Άρετε πρώτα την αναστολή."
  forbidden: "Το ψευδώνυμο %nickname% είναι απαγορευμένο."
  cannot_drop_root: "Δεν μπορεί να διαγραφεί ο root χρήστης %nickname%."
  cannot_drop_oper: "Δεν μπορεί να διαγραφεί ο IRC operator %nickname%."
  cannot_drop_self: "Δεν μπορείτε να διαγράψετε το δικό σας ψευδώνυμο."
  success: "Το ψευδώνυμο %nickname% έχει σημανθεί για διαγραφή και μπορεί να επαναφερθεί κατά την περίοδο χάριτος."
  force_success: "Το ψευδώνυμο %nickname% έχει διαγραφεί οριστικά."
  pending_deletion: "Το ψευδώνυμο %nickname% είναι ήδη σε αναμονή διαγραφής. Χρησιμοποιήστε DROP <nickname> FORCE για οριστική διαγραφή."
  cannot_drop_service: "Δεν μπορεί να διαγραφεί το ψευδώνυμο υπηρεσίας %nickname%."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Επαναφορά ψευδωνύμου σε αναμονή διαγραφής."
  help: |-
    Επαναφέρει ένα ψευδώνυμο που διαγράφηκε χειροκίνητα και βρίσκεται ακόμα εντός
    της περιόδου χάριτος. Απαιτεί άδεια IRCop: nickserv.restore.
  example: "%command_prefix%RESTORE ΠαλιόςΛογαριασμός"
  success: "Το ψευδώνυμο %nickname% έχει επαναφερθεί."
  not_pending_deletion: "Το ψευδώνυμο %nickname% δεν είναι σε αναμονή διαγραφής."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <αιτιολογία>"
  short: "Μόνιμος αποκλεισμός ψευδωνύμου από χρήση."
  help: |-
    Απαγορεύει τη χρήση ενός ψευδωνύμου στο δίκτυο.
    Το ψευδώνυμο δεν μπορεί να καταχωρηθεί ή να χρησιμοποιηθεί από κανέναν.

    Αν το ψευδώνυμο είναι τρέχοντα καταχωρημένο, θα διαγραφεί πρώτα.
    Αν κάποιος το χρησιμοποιεί, θα αναγκαστεί να αλλάξει σε ψευδώνυμο Guest-.

    Οι root χρήστες, οι IRC operators και τα ψευδώνυμα υπηρεσιών δεν μπορούν να
    απαγορευτούν.

    Αυτή η εντολή απαιτεί άδεια IRCop: nickserv.forbid

    Σύνταξη: FORBID <ψευδώνυμο> <αιτιολογία>
    Παράδειγμα: FORBID BadNick Επαναλαμβανόμενες παραβιάσεις πολιτικής
  example: "%command_prefix%FORBID ΚακόςΧρήστης Επαναλαμβανόμενες παραβιάσεις κανόνων"
  success: "Το ψευδώνυμο %nickname% έχει απαγορευτεί."
  updated: "Η αιτιολογία απαγόρευσης για το %nickname% έχει ενημερωθεί."
  reason_required: "Πρέπει να δώσετε αιτιολογία για την απαγόρευση."
  cannot_forbid_root: "Δεν μπορεί να απαγορευτεί ο root χρήστης %nickname%."
  cannot_forbid_oper: "Δεν μπορεί να απαγορευτεί ο IRC operator %nickname%."
  cannot_forbid_service: "Δεν μπορεί να απαγορευτεί το ψευδώνυμο υπηρεσίας %nickname%."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Άρση απαγόρευσης ψευδωνύμου."
  help: |-
    Αφαιρεί την απαγόρευση ενός ψευδωνύμου, επιτρέποντας τη χρήση του ξανά.

    Αυτή η εντολή απαιτεί άδεια IRCop: nickserv.forbid

    Σύνταξη: UNFORBID <ψευδώνυμο>
    Παράδειγμα: UNFORBID SomeNick
  example: "%command_prefix%UNFORBID ΑπαγορευμένοΨευδώνυμο"
  success: "Το ψευδώνυμο %nickname% δεν είναι πλέον απαγορευμένο."
  not_forbidden: "Το ψευδώνυμο %nickname% δεν είναι απαγορευμένο."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <pattern>|DEL <pattern>|LIST}"
  short: "Διαχείριση απαγορευμένων μοτίβων vhost."
  help: |-
    Διαχειρίζεται μοτίβα που εμποδίζουν τον ορισμό vhost που ταιριάζουν με SET
    VHOST. Το * αντιστοιχεί σε οποιαδήποτε ακολουθία χαρακτήρων και το ? σε έναν
    χαρακτήρα. Απαιτούνται δικαιώματα IRC Operator.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Άγνωστη υπο-εντολή %sub%. Χρησιμοποιήστε ADD, DEL ή LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <pattern>"
    short: "Προσθήκη απαγορευμένου μοτίβου vhost."
    help: |-
      Προσθέτει ένα μοτίβο στη λίστα απαγορευμένων vhost. Οι χρήστες δεν θα
      μπορούν να ορίσουν vhosts που ταιριάζουν με αυτό το μοτίβο μέσω SET VHOST.

      Wildcards: * ταιριάζει με οποιαδήποτε ακολουθία, ? ταιριάζει με έναν χαρακτήρα.

      Σύνταξη: FORBIDVHOST ADD <μοτίβο>
      Παράδειγμα: FORBIDVHOST ADD *.pirated.com
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Προστέθηκε απαγορευμένο μοτίβο vhost: %pattern%"
    already_exists: "Το μοτίβο %pattern% υπάρχει ήδη."
    invalid: "Μη έγκυρη μορφή μοτίβου vhost."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <pattern>"
    short: "Αφαίρεση απαγορευμένου μοτίβου vhost."
    help: |-
      Αφαιρεί ένα μοτίβο από τη λίστα απαγορευμένων vhost.

      Σύνταξη: FORBIDVHOST DEL <μοτίβο>
      Παράδειγμα: FORBIDVHOST DEL *.pirated.com
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Αφαιρέθηκε απαγορευμένο μοτίβο vhost: %pattern%"
    not_found: "Το μοτίβο %pattern% δεν βρέθηκε."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Λίστα όλων των απαγορευμένων μοτίβων vhost."
    syntax: "FORBIDVHOST LIST"
    help: |-
      Εμφανίζει όλα τα απαγορευμένα μοτίβα vhost.

      Σύνταξη: FORBIDVHOST LIST
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Απαγορευμένα μοτίβα vhost (%count%):"
    entry: "%index%. %pattern% — από %nickname% (%date%)"
    empty: "Δεν υπάρχουν απαγορευμένα μοτίβα vhost."

# --- HISTORY ---
history:
  syntax: "HISTORY <nickname> {ADD <message>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Προβολή ή διαχείριση ιστορικού ενεργειών ψευδωνύμου."
  help: |-
    Διαχείριση του ιστορικού ενεργειών για ένα ψευδώνυμο.
    Μόνο IRCops με άδεια 'nickserv.history' μπορούν να χρησιμοποιήσουν αυτήν την
    εντολή.

    Ενέργειες που καταγράφονται αυτόματα:
      SUSPEND, UNSUSPEND, SET PASSWORD, SET EMAIL, SASET PASSWORD,
      SASET EMAIL, RECOVER

    Σύνταξη: HISTORY <ψευδώνυμο> ADD <message>
            HISTORY <ψευδώνυμο> DEL <id>
            HISTORY <ψευδώνυμο> VIEW [PAGE|ALL]
            HISTORY <ψευδώνυμο> CLEAR

    Παραδείγματα:
      HISTORY SomeNick VIEW
      HISTORY SomeNick ADD Χειροκίνητη σημείωση για αυτόν τον χρήστη
      HISTORY SomeNick VIEW 2
      HISTORY SomeNick VIEW ALL
      HISTORY SomeNick DEL 123
      HISTORY SomeNick CLEAR

    Χρησιμοποιήστε VIEW για να δείτε το ιστορικό (εμφανίζει 3 καταχωρήσεις
    προεπιλεγμένα).
    Χρησιμοποιήστε VIEW PAGE 2 για την επόμενη σελίδα.
    Χρησιμοποιήστε VIEW ALL για πλήρες ιστορικό.
    Χρησιμοποιήστε ADD για χειροκίνητη καταχώρηση.
    Χρησιμοποιήστε DEL για διαγραφή συγκεκριμένης καταχώρησης μέσω ID.
    Χρησιμοποιήστε CLEAR για διαγραφή όλων των καταχωρήσεων ιστορικού.
  example: "%command_prefix%HISTORY Χρήστης VIEW"
  examples:
    - "%command_prefix%HISTORY Χρήστης VIEW ALL"
    - "%command_prefix%HISTORY Χρήστης ADD Χειροκίνητη σημείωση"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <message>"
    short: "Προσθήκη χειροκίνητης καταχώρησης ιστορικού."
    help: |-
      Προσθέτει μια χειροκίνητη καταχώρηση στο ιστορικό του ψευδωνύμου.

      Σύνταξη: HISTORY <ψευδώνυμο> ADD <message>
      Παράδειγμα: HISTORY SomeNick ADD Ο χρήστης αναφέρθηκε για spam
    example: "%command_prefix%HISTORY Χρήστης ADD Αναφέρθηκε για ανεπιθύμητα"
    success: "Η καταχώρηση ιστορικού προστέθηκε για %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "Διαγραφή καταχώρησης ιστορικού μέσω ID."
    help: |-
      Διαγράφει μια συγκεκριμένη καταχώρηση ιστορικού με το ID της.

      Σύνταξη: HISTORY <ψευδώνυμο> DEL <id>
      Παράδειγμα: HISTORY SomeNick DEL 42
    example: "%command_prefix%HISTORY Χρήστης DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [PAGE|ALL]"
    short: "Προβολή ιστορικού ενεργειών ψευδωνύμου."
    help: |-
      Εμφανίζει το ιστορικό ενεργειών του ψευδωνύμου.

      Σύνταξη: HISTORY <ψευδώνυμο> VIEW
              HISTORY <ψευδώνυμο> VIEW PAGE
              HISTORY <ψευδώνυμο> VIEW ALL

      Προεπιλεγμένα εμφανίζει 3 καταχωρήσεις κάθε φορά.
      Χρησιμοποιήστε VIEW 2 για τη δεύτερη σελίδα.
      Χρησιμοποιήστε VIEW ALL για πλήρες ιστορικό.
    example: "%command_prefix%HISTORY Χρήστης VIEW"
    examples:
      - "%command_prefix%HISTORY Χρήστης VIEW 2"
      - "%command_prefix%HISTORY Χρήστης VIEW ALL"
    header: "%heading% (εμφάνιση %start%-%end% από %total%):"
    header_title: "Ιστορικό για %nickname%"
    entry: "#%id% [%date%] %action% από %operator% — %message%"
    no_entries: "Δεν βρέθηκαν καταχωρήσεις ιστορικού για %nickname%."
    page_hint: "Χρησιμοποιήστε %command% για περισσότερες καταχωρήσεις."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Διαγραφή όλων των καταχωρήσεων ιστορικού για ένα ψευδώνυμο."
    help: |-
      Αφαιρεί όλες τις καταχωρήσεις ιστορικού για το καθορισμένο ψευδώνυμο.
      Αυτή η ενέργεια δεν μπορεί να αναιρεθεί.

      Σύνταξη: HISTORY <ψευδώνυμο> CLEAR
      Παράδειγμα: HISTORY SomeNick CLEAR
    example: "%command_prefix%HISTORY Χρήστης CLEAR"
    success: "Εκκαθαρίστηκαν %count% καταχωρήσεις ιστορικού για %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Ο λογαριασμός ενεργοποιήθηκε"
  resend: "Το email επαλήθευσης στάλθηκε ξανά"
  noexpire_on: "Η προστασία λήξης ενεργοποιήθηκε"
  noexpire_off: "Η προστασία λήξης απενεργοποιήθηκε"
  userip: "Ερώτημα USERIP"
  history_clear: "Το ιστορικό διαγράφηκε"
  password_changed_owner: "Ο κωδικός άλλαξε από τον κάτοχο"
  password_changed_operator: "Ο κωδικός άλλαξε από operator"
  email_changed_owner: "Το email άλλαξε από %old_email% σε %new_email%"
  email_changed_operator: "Το email άλλαξε σε %new_email% από operator"
  recover: "Επαναφορά κωδικού μέσω token email"
  saregister: "Ο λογαριασμός καταχωρήθηκε διοικητικά"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Προηγούμενο email: %value%"
  new_email: "Νέο email: %value%"
  method: "Μέθοδος: %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Ορισμός ή αφαίρεση προστασίας λήξης για ένα ψευδώνυμο."
  help: |-
    Ελέγχει αν ένα ψευδώνυμο θα λήξει λόγω αδράνειας.
    Όταν είναι ON, το ψευδώνυμο δεν λήγει ποτέ ανεξάρτητα από την τελευταία
    δραστηριότητα.
    Όταν είναι OFF, ισχύουν οι κανονικοί κανόνες λήξης.

    Μόνο IRCops με άδεια 'nickserv.noexpire' μπορούν να χρησιμοποιήσουν αυτήν την
    εντολή.

    Σύνταξη: NOEXPIRE <ψευδώνυμο> {ON|OFF}
    Παραδείγματα:
      NOEXPIRE ImportantUser ON
      NOEXPIRE ImportantUser OFF
  example: "%command_prefix%NOEXPIRE Χρήστης ON"
  examples:
    - "%command_prefix%NOEXPIRE Χρήστης OFF"
  success_on: "Το ψευδώνυμο %nickname% είναι τώρα προστατευμένο από λήξη."
  success_off: "Το ψευδώνυμο %nickname% θα λήγει τώρα κανονικά."
  forbidden: "Το ψευδώνυμο %nickname% είναι απαγορευμένο."
  suspended: "Το ψευδώνυμο %nickname% είναι σε αναστολή."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <μοτίβο> [σελίδα]"
  short: "Εμφανίζει καταχωρισμένα ψευδώνυμα βάσει μοτίβου."
  help: |-
    Εμφανίζει τα καταχωρισμένα ψευδώνυμα που ταιριάζουν με το μοτίβο. Το *
    αντιστοιχεί σε οποιαδήποτε ακολουθία χαρακτήρων. Η σελίδα είναι προαιρετική και
    ξεκινά από το 1.
  example: "%command_prefix%LIST Χρήστης*"
  examples:
    - "%command_prefix%LIST Χρήστης* 2"
  header: "Ψευδώνυμο | Εγγραφή | Τελευταία σύνδεση | IP | Κατάσταση"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Δεν βρέθηκαν ψευδώνυμα για το μοτίβο %pattern%."
  status_pending: "Σε αναμονή"
  status_registered: "Καταχωρισμένο"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Διαχείριση του τρόπου εγγραφής του δικτύου."
  help: |-
    Ρυθμίζει τη λειτουργία εγγραφής για νέους λογαριασμούς.

    %emphasis_0% Το διακριτικό επαλήθευσης αποστέλλεται στη διεύθυνση email του χρήστη.
    %emphasis_1% Το διακριτικό παρέχεται απευθείας μέσω IRC.
    %emphasis_2% Εμφανίζει την τρέχουσα λειτουργία χωρίς αλλαγές.

    Οι εκκρεμείς εγγραφές διατηρούν τη λειτουργία με την οποία ξεκίνησαν.

    Στη λειτουργία TOKEN, η εντολή RESEND παραμένει
    απενεργοποιημένη για όλους τους χρήστες.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Τρέχων τρόπος εγγραφής: %mode%."
  changed: "Ο τρόπος εγγραφής άλλαξε σε %mode%."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: |-
    Διακριτικό διάσωσης: %token_display%

    Φύλαξε αυτό το διακριτικό σε ασφαλές μέρος. Θα το χρειαστείς για να ανακτήσεις το ψευδώνυμό σου αν ξεχάσεις τον κωδικό πρόσβασής σου.

    Για να το επιβεβαιώσεις, χρησιμοποίησε: /msg %bot% %verify%

    %warning%
  issued_warning: "ΣΗΜΑΝΤΙΚΟ: Ισχύει μόνο το τελευταίο διακριτικό που δημιουργήθηκε. Μετά την επιβεβαίωση, δεν θα εμφανιστεί ξανά. Μην το μοιραστείς με κανέναν."
  confirmed: "Το διακριτικό διάσωσης επιβεβαιώθηκε. Φύλαξέ το με ασφάλεια."
  unavailable: "Συνδέσου και επιβεβαίωσε το διακριτικό διάσωσης με %command_0% πριν από αυτή την ενέργεια."
  unavailable_command_0: "VERIFY"
  locked_out: "Πάρα πολλά λανθασμένα διακριτικά. Δοκίμασε ξανά σε %seconds% δευτερόλεπτα."
  throttled: "Πάρα πολλά λανθασμένα διακριτικά. Δοκίμασε ξανά σε %minutes% λεπτά."
  replaced: "Το διακριτικό ανάκτησης αντικαταστάθηκε με το διακριτικό του email που μόλις επικύρωσες. Φύλαξέ το με ασφάλεια."
  optional_replacement: |-
    Προαιρετικό νέο διακριτικό ανάκτησης: %token_display%

    Για να αντικαταστήσεις το τρέχον διακριτικό σου, χρησιμοποίησε: /msg %bot% %verify%

    Το τρέχον παραμένει έγκυρο μέχρι την επιβεβαίωση.

    Αν δεν θέλεις αλλαγή, αγνόησε αυτό το μήνυμα.
  replacement_unavailable: "Ο κωδικός επαναφέρθηκε, αλλά δεν εκδόθηκε νέο διακριτικό. Το τρέχον διακριτικό παραμένει έγκυρο."
  temporarily_unavailable: "Η παράδοση διακριτικού ανάκτησης είναι προσωρινά μη διαθέσιμη. Δοκίμασε αργότερα."


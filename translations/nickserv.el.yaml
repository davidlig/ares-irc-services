# Μεταφράσεις NickServ — Ελληνικά
# Τομέας: nickserv
#
# Κωδικοί μορφοποίησης IRC (διπλά εισαγωγικά ή κυριολεκτικά μπλοκ !irc):
#   \x02        ενεργοποίηση/απενεργοποίηση έντονης γραφής
#   \x03NN      χρώμα (ΔΕΚΑΔΙΚΟ: 03=πράσινο, 04=κόκκινο, 07=πορτοκαλί, 14=σκούρο γκρι)
#   \x03        επαναφορά χρώματος
#   \x0F        επαναφορά όλης της μορφοποίησης
#
# Τα χρώματα IRC χρησιμοποιούν ΔΕΚΑΔΙΚΟΥΣ αριθμούς (0-15), όχι δεκαεξαδικούς.
#   \x0314 = σκούρο γκρι (14 δεκαδικό): ΣΩΣΤΟ
#   \x030F = χρώμα 0 και μετά το γράμμα F: ΛΑΘΟΣ
#
# Πολυγραμμικό κείμενο IRC: !irc |- με πραγματικές αλλαγές γραμμής και κενά.
# Τα μπλοκ χωρίς ετικέτα δεν αποκωδικοποιούν διαφυγές· διατηρήστε τα CTCP.
# Παραδείγματα HELP: example/examples και %command_prefix%.
# Ο παρουσιαστής προσθέτει άχρωμο /msg και περιθώριο δύο κενών.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    Η εγγραφή εκκρεμεί, αλλά το διακριτικό δεν παραδόθηκε.
    Περίμενε να λήξει η εγγραφή πριν εγγραφείς ξανά.
  syntax: "REGISTER <κωδικός> [email]"
  short: "Καταχωρήστε το ψευδώνυμό σας στις υπηρεσίες."
  help: |-
    Καταχωρεί το ψευδώνυμό σας. Το δίκτυο θα σας στείλει το διακριτικό επαλήθευσης
    μέσω συνομιλίας ή email, ανάλογα με τις ρυθμίσεις του.
    Μόλις επαληθευτεί, γίνεται το μόνιμο διακριτικό ανάκτησής σας:
    Φυλάξτε το σε ασφαλές μέρος.
    Η διάρκεια ισχύος %duration% εφαρμόζεται μόνο πριν από την επαλήθευση.
    Δεν επιτρέπονται διοικητικά αποκλεισμένοι τομείς email.
  example: "%command_prefix%REGISTER Ασφαλές$Pass123_123"
  examples:
    - "%command_prefix%REGISTER Ασφαλές$Pass123_123 user@example.gr"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Έχει σταλεί διακριτικό επαλήθευσης στο %email%."
  pending_line_2: "Εκτελέστε /msg %bot% %verify% για να ολοκληρωθεί η εγγραφή."
  pending_line_3: "Δεν το λάβατε; Ελέγξτε τα ανεπιθύμητα ή χρησιμοποιήστε /msg %bot% %resend%"
  pending_line_4: "Το διακριτικό λήγει σε %duration%."
  already_registered: "Το ψευδώνυμο %nickname% είναι ήδη καταχωρημένο."
  already_pending: "Η εγγραφή του %nickname% εκκρεμεί. Χρησιμοποίησε %verify%. Το %resend% διατίθεται μόνο με REGMODE EMAIL και έγκυρη διεύθυνση email."
  forbidden: "Το ψευδώνυμο %nickname% δεν μπορεί να καταχωρηθεί σε αυτό το δίκτυο."
  pending_deletion: "Το ψευδώνυμο %nickname% είναι σε αναμονή διαγραφής και δεν μπορεί να καταχωρηθεί."
  invalid_email: "Η διεύθυνση email που δώσατε δεν είναι έγκυρη."
  email_already_used: "Το email %email% χρησιμοποιείται ήδη από άλλο ψευδώνυμο. Χρησιμοποιήστε διαφορετική διεύθυνση."
  throttled: "Πρέπει να περιμένετε %minutes% λεπτό(ά) πριν δοκιμάσετε να καταχωρηθείτε ξανά."
  guest_prefix_forbidden: "Δεν μπορείτε να καταχωρήσετε ψευδώνυμο που ξεκινά με %prefix%."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Επιβεβαιώνει εγγραφή ή διακριτικό διάσωσης."
  help: |-
    Μόλις επαληθευτεί, αυτό γίνεται το μόνιμο διακριτικό ανάκτησής σας.
    Φυλάξτε το με ασφάλεια: μπορείτε να το χρησιμοποιήσετε για ανάκτηση του
    ψευδωνύμου σας.
    Η διάρκεια ισχύος %duration% εφαρμόζεται μόνο πριν από την επαλήθευση.
  example: "%command_prefix%VERIFY <ληφθέν_διακριτικό>"
  success: "Το ψευδώνυμο %nickname% έχει καταχωρηθεί επιτυχώς και είστε πλέον ταυτοποιημένοι."
  success_native: "Το ψευδώνυμο %nickname% καταχωρήθηκε επιτυχώς. Χρησιμοποιήστε την εγγενή ταυτοποίηση που εμφανίζεται παρακάτω."
  invalid_token: "Το διακριτικό διάσωσης είναι άκυρο."
  no_pending: "Δεν έχετε εκκρεμή καταχώρηση προς επαλήθευση."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "Το %resend% είναι απενεργοποιημένο όταν το REGMODE είναι TOKEN."
  syntax: "RESEND"
  short: "Επαναποστολή του token επαλήθευσης στο email σας."
  help: |-
    Το RESEND είναι διαθέσιμο μόνο αν το διακριτικό επαλήθευσης στάλθηκε με email.
    Μόλις επαληθευτεί, αυτό γίνεται το μόνιμο διακριτικό ανάκτησής σας.
    Φυλάξτε το με ασφάλεια: μπορείτε να το χρησιμοποιήσετε για ανάκτηση του
    ψευδωνύμου σας.
    Η διάρκεια ισχύος %duration% εφαρμόζεται μόνο πριν από την επαλήθευση.
    Με το RESEND θα λάβετε νέο διακριτικό μέσω email.
    Η προθεσμία της εκκρεμούς εγγραφής θα ανανεωθεί κατά %duration%.
  example: "%command_prefix%RESEND"
  success: "Το token επαλήθευσης επαναστάλθηκε στο %email%."
  no_pending: "Δεν έχετε εκκρεμή καταχώρηση προς επαλήθευση."
  throttled: "Πρέπει να περιμένετε %minutes% λεπτό(ά) πριν ζητήσετε άλλο email επαλήθευσης."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "Δεν έχει οριστεί email για το ψευδώνυμο %nickname%. Η ανάκτηση δεν είναι διαθέσιμη."
  email_sent: "Ένα token ανάκτησης έχει σταλεί στο %email_hint%. Ελέγξτε τα εισερχόμενά σας (και τον φάκελο spam)."
  pending_deletion: "Το ψευδώνυμο %nickname% εκκρεμεί προς διαγραφή και δεν μπορεί να ανακτηθεί."
  instructions: "EMAIL: το %command_0% ζητά προσωρινό διακριτικό με email. TOKEN: δώσε το επιβεβαιωμένο διακριτικό. Το %command_1% δέχεται έγκυρο διακριτικό email ή επιβεβαιωμένο. Το email αντικαθιστά το αποθηκευμένο μόνο μετά από επικύρωση. Το αποθηκευμένο προσφέρει προαιρετική αντικατάσταση με %command_2%· αγνόησε το μήνυμα για να το κρατήσεις."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <nickname> [token]"
  short: "Ανακτήστε το ψευδώνυμό σας αν χάσατε τον κωδικό σας."
  help: |-
    EMAIL: το RECOVER <ψευδώνυμο> ζητά προσωρινό διακριτικό με email. TOKEN: δώσε το
    επιβεβαιωμένο διακριτικό. Το RECOVER <ψευδώνυμο> <διακριτικό> δέχεται έγκυρο
    διακριτικό email ή επιβεβαιωμένο. Το email αντικαθιστά το αποθηκευμένο μόνο μετά
    από επικύρωση. Το αποθηκευμένο προσφέρει προαιρετική αντικατάσταση με VERIFY·
    αγνόησε το μήνυμα για να το κρατήσεις.
  example: "%command_prefix%RECOVER Χρήστης"
  examples:
    - "%command_prefix%RECOVER Χρήστης <ληφθέν_διακριτικό>"
  pending: "Η εγγραφή του %nickname% εκκρεμεί. Χρησιμοποίησε %command_0%. Το %command_1% διατίθεται μόνο με REGMODE EMAIL και έγκυρη διεύθυνση email."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Το ψευδώνυμο %nickname% είναι σε αναστολή. Αιτιολογία: %reason%"
  forbidden: "Το ψευδώνυμο %nickname% δεν μπορεί να χρησιμοποιηθεί σε αυτό το δίκτυο."
  throttled: "Πάρα πολλά λανθασμένα διακριτικά. Δοκίμασε ξανά σε %minutes% λεπτά."
  invalid_token: "Το διακριτικό διάσωσης είναι άκυρο."
  success_identify: "Επαναφορά κωδικού. Ταυτοποιηθείτε τώρα: %identify_cmd%"
  success_then_change: "Μετά αλλάξτε τον κωδικό σας: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <new_password>"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <password>"
  short: "Ταυτοποιηθείτε ως ο κάτοχος ενός ψευδωνύμου."
  help: |-
    Πιστοποιεί τη συνεδρία σας με το %nickserv% χρησιμοποιώντας το ψευδώνυμο και τον
    κωδικό σας.
    Μετά από επιτυχή ταυτοποίηση θα λάβετε τη λειτουργία %emphasis_0%
    και, αν χρησιμοποιούσατε ψευδώνυμο επισκέπτη, το καταχωρημένο σας ψευδώνυμο θα
    αποκατασταθεί.
  example: "%command_prefix%IDENTIFY Χρήστης <κωδικός>"
  native_syntax: "/NICK <nickname>:<password> | /NICK <nickname>!<password>"
  native_short: "Εμφανίζει τη σύνταξη εγγενούς ταυτοποίησης ψευδωνύμου."
  native_help: |-
    Αυτό το πρωτόκολλο ταυτοποιεί λογαριασμούς μέσω αλλαγών ψευδωνύμου.
    Χρησιμοποιήστε %emphasis_0% ή, αν το ψευδώνυμο χρησιμοποιείται, %emphasis_1%.
  native_example: "/NICK Χρήστης:<κωδικός>"
  native_examples:
    - "%command_prefix%/NICK Χρήστης!<κωδικός>"
  native_authentication: "Αυτό το πρωτόκολλο διαχειρίζεται την ταυτοποίηση μέσω αλλαγών ψευδωνύμου. Χρησιμοποιήστε %command_0% ή, αν το ψευδώνυμο χρησιμοποιείται, %command_1%."
  native_authentication_command_0: "/NICK <nickname>:<password>"
  native_authentication_command_1: "/NICK <nickname>!<password>"
  success: "Είστε πλέον ταυτοποιημένοι ως %nickname%."
  already_identified: "Είστε ήδη ταυτοποιημένοι ως %nickname%."
  invalid_credentials: "Λανθασμένος κωδικός. Παρακαλώ δοκιμάστε ξανά."
  locked_out: "Πάρα πολλές αποτυχημένες προσπάθειες. Δοκιμάστε ξανά σε %minutes% λεπτό(ά)."
  ghost_released: "Η συνεδρία-φάντασμα που κατείχε το %nickname% έχει αποσυνδεθεί."
  kill_reason: "Το ψευδώνυμο %nickname% ανακτήθηκε από %source% (ο καταχωρημένος κάτοχος ταυτοποιήθηκε)"
  pending: |-
    %first%
    %second%
  pending_line_1: "Το ψευδώνυμο %nickname% έχει εκκρεμή επαλήθευση email."
  pending_line_2: "Εκτελέστε /msg %bot% %command_0% ή /msg %bot% %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Το ψευδώνυμο %nickname% είναι σε αναστολή. Αιτιολογία: %reason%"
  forbidden: "Το ψευδώνυμο %nickname% δεν μπορεί να χρησιμοποιηθεί σε αυτό το δίκτυο."
  pending_deletion: "Το ψευδώνυμο %nickname% είναι σε αναμονή διαγραφής και δεν μπορεί να χρησιμοποιηθεί."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <nickname>"
  short: "Εμφάνιση κατάστασης καταχώρησης ενός ψευδωνύμου."
  help: |-
    Εμφανίζει την τρέχουσα κατάσταση ενός ψευδωνύμου: καταχωρημένο, εκκρεμή
    επαλήθευση,
    σε αναστολή ή απαγορευμένο.
  example: "%command_prefix%STATUS Χρήστης"
  header: "Κατάσταση του ψευδωνύμου %nickname%"
  unregistered: "  Κατάσταση      : Μη καταχωρημένο"
  not_registered_offline: "  Κατάσταση      : %state%"
  value_not_registered_offline: "Μη καταχωρημένο"
  pending: "  Κατάσταση      : %state%"

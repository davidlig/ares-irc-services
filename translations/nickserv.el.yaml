# Μεταφράσεις NickServ — Ελληνικά
# Τομέας: nickserv
#
# Κωδικοί μορφοποίησης IRC (διπλά εισαγωγικά ή κυριολεκτικά μπλοκ !irc):
#   \x02        ενεργοποίηση/απενεργοποίηση έντονης γραφής
#   \x03NN      χρώμα (ΔΕΚΑΔΙΚΟ: 03=πράσινο, 04=κόκκινο, 07=πορτοκαλί, 14=σκούρο γκρι)
#   \x03        επαναφορά χρώματος
#   \x0F        επαναφορά όλης της μορφοποίησης
#
# Τα χρώματα IRC χρησιμοποιούν ΔΕΚΑΔΙΚΟΥΣ αριθμούς (0-15), όχι δεκαεξαδικούς.
#   \x0314 = σκούρο γκρι (14 δεκαδικό): ΣΩΣΤΟ
#   \x030F = χρώμα 0 και μετά το γράμμα F: ΛΑΘΟΣ
#
# Πολυγραμμικό κείμενο IRC: !irc |- με πραγματικές αλλαγές γραμμής και κενά.
# Τα μπλοκ χωρίς ετικέτα δεν αποκωδικοποιούν διαφυγές· διατηρήστε τα CTCP.
# Παραδείγματα HELP: example/examples και %command_prefix%.
# Ο παρουσιαστής προσθέτει άχρωμο /msg και περιθώριο δύο κενών.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    \x0304✗\x03 Η εγγραφή εκκρεμεί, αλλά το διακριτικό δεν παραδόθηκε.
    Περίμενε να λήξει η εγγραφή πριν εγγραφείς ξανά.
  syntax: "REGISTER <password> [email]"
  short: "Καταχωρήστε το ψευδώνυμό σας στις υπηρεσίες."
  help: |-
    Καταχωρεί το ψευδώνυμό σας. Το δίκτυο θα σας στείλει το διακριτικό επαλήθευσης
    μέσω συνομιλίας ή email, ανάλογα με τις ρυθμίσεις του.
    Μόλις επαληθευτεί, γίνεται το μόνιμο διακριτικό ανάκτησής σας:
    Φυλάξτε το σε ασφαλές μέρος.
    Η διάρκεια ισχύος %duration% εφαρμόζεται μόνο πριν από την επαλήθευση.
  example: "%command_prefix%\x02\x0303REGISTER Ασφαλές$Pass123_123\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGISTER Ασφαλές$Pass123_123 user@example.gr\x03\x0F"
  pending: !irc |-
    \x0307→\x03 Έχει σταλεί διακριτικό επαλήθευσης στο \x02%email%\x02.
      Εκτελέστε /msg %bot% \x0303VERIFY <token>\x03 για να ολοκληρωθεί η εγγραφή.
      Δεν το λάβατε; Ελέγξτε τα ανεπιθύμητα ή χρησιμοποιήστε /msg %bot% \x0303RESEND\x03
      Το διακριτικό λήγει σε \x02%duration%\x02.
  already_registered: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι ήδη καταχωρημένο."
  already_pending: "\x0307→\x03 Η εγγραφή του \x02%nickname%\x02 εκκρεμεί. Χρησιμοποίησε \x0303VERIFY <token>\x03. Το \x0303RESEND\x03 διατίθεται μόνο με REGMODE EMAIL και έγκυρη διεύθυνση email."
  forbidden: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν μπορεί να καταχωρηθεί σε αυτό το δίκτυο."
  pending_deletion: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι σε αναμονή διαγραφής και δεν μπορεί να καταχωρηθεί."
  invalid_email: "\x0304✗\x03 Η διεύθυνση email που δώσατε δεν είναι έγκυρη."
  email_already_used: "\x0304✗\x03 Το email \x02%email%\x02 χρησιμοποιείται ήδη από άλλο ψευδώνυμο. Χρησιμοποιήστε διαφορετική διεύθυνση."
  throttled: "\x0304✗\x03 Πρέπει να περιμένετε \x02%minutes%\x02 λεπτό(ά) πριν δοκιμάσετε να καταχωρηθείτε ξανά."
  guest_prefix_forbidden: "\x0304✗\x03 Δεν μπορείτε να καταχωρήσετε ψευδώνυμο που ξεκινά με \x02%prefix%\x02."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Επιβεβαιώνει εγγραφή ή διακριτικό διάσωσης."
  help: |-
    Μόλις επαληθευτεί, αυτό γίνεται το μόνιμο διακριτικό ανάκτησής σας.
    Φυλάξτε το με ασφάλεια: μπορείτε να το χρησιμοποιήσετε για ανάκτηση του
    ψευδωνύμου σας.
    Η διάρκεια ισχύος %duration% εφαρμόζεται μόνο πριν από την επαλήθευση.
  example: "%command_prefix%\x02\x0303VERIFY <ληφθέν_διακριτικό>\x03\x0F"
  success: "\x0303✔\x03 Το ψευδώνυμο \x02%nickname%\x02 έχει καταχωρηθεί επιτυχώς και είστε πλέον ταυτοποιημένοι."
  success_native: "\x0303✔\x03 Το ψευδώνυμο \x02%nickname%\x02 καταχωρήθηκε επιτυχώς. Χρησιμοποιήστε την εγγενή ταυτοποίηση που εμφανίζεται παρακάτω."
  invalid_token: "\x0304✗\x03 Το διακριτικό διάσωσης είναι άκυρο."
  no_pending: "\x0304✗\x03 Δεν έχετε εκκρεμή καταχώρηση προς επαλήθευση."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "\x0307ℹ\x03 Το \x0303RESEND\x03 είναι απενεργοποιημένο όταν το REGMODE είναι TOKEN."
  syntax: "RESEND"
  short: "Επαναποστολή του token επαλήθευσης στο email σας."
  help: |-
    Το RESEND είναι διαθέσιμο μόνο αν το διακριτικό επαλήθευσης στάλθηκε με email.
    Μόλις επαληθευτεί, αυτό γίνεται το μόνιμο διακριτικό ανάκτησής σας.
    Φυλάξτε το με ασφάλεια: μπορείτε να το χρησιμοποιήσετε για ανάκτηση του
    ψευδωνύμου σας.
    Η διάρκεια ισχύος %duration% εφαρμόζεται μόνο πριν από την επαλήθευση.
    Με το RESEND θα λάβετε νέο διακριτικό μέσω email.
    Η προθεσμία της εκκρεμούς εγγραφής θα ανανεωθεί κατά %duration%.
  example: "%command_prefix%\x02\x0303RESEND\x03\x0F"
  success: "\x0307→\x03 Το token επαλήθευσης επαναστάλθηκε στο \x02%email%\x02."
  no_pending: "\x0304✗\x03 Δεν έχετε εκκρεμή καταχώρηση προς επαλήθευση."
  throttled: "\x0304✗\x03 Πρέπει να περιμένετε \x02%minutes%\x02 λεπτό(ά) πριν ζητήσετε άλλο email επαλήθευσης."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "\x0304✗\x03 Δεν έχει οριστεί email για το ψευδώνυμο \x02%nickname%\x02. Η ανάκτηση δεν είναι διαθέσιμη."
  email_sent: "\x0307→\x03 Ένα token ανάκτησης έχει σταλεί στο \x02%email_hint%\x02. Ελέγξτε τα εισερχόμενά σας (και τον φάκελο spam)."
  pending_deletion: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 εκκρεμεί προς διαγραφή και δεν μπορεί να ανακτηθεί."
  instructions: "\x0307ℹ\x03 EMAIL: το \x0303RECOVER %nickname%\x03 ζητά προσωρινό διακριτικό με email. TOKEN: δώσε το επιβεβαιωμένο διακριτικό. Το \x0303RECOVER %nickname% <token>\x03 δέχεται έγκυρο διακριτικό email ή επιβεβαιωμένο. Το email αντικαθιστά το αποθηκευμένο μόνο μετά από επικύρωση. Το αποθηκευμένο προσφέρει προαιρετική αντικατάσταση με \x0303VERIFY\x03· αγνόησε το μήνυμα για να το κρατήσεις."
  syntax: "RECOVER <nickname> [token]"
  short: "Ανακτήστε το ψευδώνυμό σας αν χάσατε τον κωδικό σας."
  help: |-
    EMAIL: το RECOVER <ψευδώνυμο> ζητά προσωρινό διακριτικό με email. TOKEN: δώσε το
    επιβεβαιωμένο διακριτικό. Το RECOVER <ψευδώνυμο> <διακριτικό> δέχεται έγκυρο
    διακριτικό email ή επιβεβαιωμένο. Το email αντικαθιστά το αποθηκευμένο μόνο μετά
    από επικύρωση. Το αποθηκευμένο προσφέρει προαιρετική αντικατάσταση με VERIFY·
    αγνόησε το μήνυμα για να το κρατήσεις.
  example: "%command_prefix%\x02\x0303RECOVER Χρήστης\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303RECOVER Χρήστης <ληφθέν_διακριτικό>\x03\x0F"
  pending: "\x0307→\x03 Η εγγραφή του \x02%nickname%\x02 εκκρεμεί. Χρησιμοποίησε \x0303VERIFY <token>\x03. Το \x0303RESEND\x03 διατίθεται μόνο με REGMODE EMAIL και έγκυρη διεύθυνση email."
  suspended: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι σε αναστολή. Αιτία: %reason%"
  forbidden: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν μπορεί να χρησιμοποιηθεί σε αυτό το δίκτυο."
  throttled: "\x0304✗\x03 Πάρα πολλά λανθασμένα διακριτικά. Δοκίμασε ξανά σε \x02%minutes%\x02 λεπτά."
  invalid_token: "\x0304✗\x03 Το διακριτικό διάσωσης είναι άκυρο."
  success_identify: "\x0303✔\x03 Επαναφορά κωδικού. Ταυτοποιηθείτε τώρα: \x0303%identify_cmd%\x03"
  success_then_change: "Μετά αλλάξτε τον κωδικό σας: \x0303/msg %bot% SET PASSWORD <new_password>\x03"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <password>"
  short: "Ταυτοποιηθείτε ως ο κάτοχος ενός ψευδωνύμου."
  help: !irc |-
    Πιστοποιεί τη συνεδρία σας με το %nickserv% χρησιμοποιώντας το ψευδώνυμο και τον
    κωδικό σας.
    Μετά από επιτυχή ταυτοποίηση θα λάβετε τη λειτουργία \x02+r\x02
    και, αν χρησιμοποιούσατε ψευδώνυμο επισκέπτη, το καταχωρημένο σας ψευδώνυμο θα
    αποκατασταθεί.
  example: "%command_prefix%\x02\x0303IDENTIFY Χρήστης <κωδικός>\x03\x0F"
  native_syntax: "/NICK <nickname>:<password> | /NICK <nickname>!<password>"
  native_short: "Εμφανίζει τη σύνταξη εγγενούς ταυτοποίησης ψευδωνύμου."
  native_help: |-
    Αυτό το πρωτόκολλο ταυτοποιεί λογαριασμούς μέσω αλλαγών ψευδωνύμου.
    Χρησιμοποιήστε /NICK <nickname>:<password> ή, αν το ψευδώνυμο χρησιμοποιείται, /NICK <nickname>!<password>.
  native_example: "\x02\x0303/NICK Χρήστης:<κωδικός>\x03\x0F"
  native_examples:
    - "%command_prefix%\x02\x0303/NICK Χρήστης!<κωδικός>\x03\x0F"
  native_authentication: "\x0307ℹ\x03 Αυτό το πρωτόκολλο διαχειρίζεται την ταυτοποίηση μέσω αλλαγών ψευδωνύμου. Χρησιμοποιήστε \x0303/NICK <nickname>:<password>\x03 ή, αν το ψευδώνυμο χρησιμοποιείται, \x0303/NICK <nickname>!<password>\x03."
  success: "\x0303✔\x03 Είστε πλέον ταυτοποιημένοι ως \x02%nickname%\x02."
  already_identified: "\x0307ℹ\x03 Είστε ήδη ταυτοποιημένοι ως \x02%nickname%\x02."
  invalid_credentials: "\x0304✗\x03 Λανθασμένος κωδικός. Παρακαλώ δοκιμάστε ξανά."
  locked_out: "\x0304✗\x03 Πάρα πολλές αποτυχημένες προσπάθειες. Δοκιμάστε ξανά σε \x02%minutes%\x02 λεπτό(ά)."
  ghost_released: "\x0307⚡\x03 Η συνεδρία-φάντασμα που κατείχε το \x02%nickname%\x02 έχει αποσυνδεθεί."
  kill_reason: "Το ψευδώνυμο %nickname% ανακτήθηκε από %source% (ο καταχωρημένος κάτοχος ταυτοποιήθηκε)"
  pending: !irc |-
    \x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 έχει εκκρεμή επαλήθευση email.
      Εκτελέστε \x0303/msg %bot% VERIFY <token>\x03 ή \x0303/msg %bot% RESEND\x03.
  suspended: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι σε αναστολή. Αιτία: %reason%"
  forbidden: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν μπορεί να χρησιμοποιηθεί σε αυτό το δίκτυο."
  pending_deletion: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι σε αναμονή διαγραφής και δεν μπορεί να χρησιμοποιηθεί."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <nickname>"
  short: "Εμφάνιση κατάστασης καταχώρησης ενός ψευδωνύμου."
  help: |-
    Εμφανίζει την τρέχουσα κατάσταση ενός ψευδωνύμου: καταχωρημένο, εκκρεμή
    επαλήθευση,
    σε αναστολή ή απαγορευμένο.
  example: "%command_prefix%\x02\x0303STATUS Χρήστης\x03\x0F"
  header: "\x02Κατάσταση του ψευδωνύμου \x0307%nickname%\x03\x02"
  unregistered: "  Κατάσταση      : Μη καταχωρημένο"
  not_registered_offline: "  Κατάσταση      : \x0315Μη καταχωρημένο\x03"
  pending: "  Κατάσταση      : \x0307Εκκρεμής επαλήθευση\x03"
  pending_expires: "  Λήγει σε       : %minutes% λεπτό(ά)"
  pending_expires_at: "  Λήγει στις     : %date%"
  not_connected: "  Κατάσταση      : \x0315Μη συνδεδεμένο\x03"
  not_identified: "  Κατάσταση      : \x0307Μη ταυτοποιημένο\x03"
  identified: "  Κατάσταση      : \x0303Ταυτοποιημένο\x03"
  suspended: "  Κατάσταση      : \x0304Σε αναστολή\x03"
  suspended_reason: "  Αιτία          : %reason%"
  suspended_until: "  Λήγει στις     : %date%"
  suspended_permanent: "  Λήγει στις     : Μόνιμη"
  forbidden: "  Κατάσταση      : \x0304Απαγορευμένο\x03"
  forbidden_reason: "  Αιτία          : %reason%"
  pending_deletion: "  \x0314Κατάσταση\x03          : \x0307Σε αναμονή διαγραφής\x03"
  pending_deletion_at: "  \x0314Διαγράφηκε\x03      : %date%"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <nickname>"
  short: "Εμφάνιση πληροφοριών για καταχωρημένο ψευδώνυμο."
  help: |-
    Εμφανίζει λεπτομέρειες καταχώρησης για ένα ψευδώνυμο: ημερομηνία καταχώρησης,
    κατάσταση σύνδεσης, τελευταίο μήνυμα εξόδου και διεύθυνση email. Το email
    είναι ορατό μόνο στον κάτοχο όταν είναι ταυτοποιημένος. Με PRIVATE ON μόνο
    ο κάτοχος και οι IRC Operators μπορούν να δουν τις πληροφορίες.
  example: "%command_prefix%\x02\x0303INFO Χρήστης\x03\x0F"
  private: "\x0304✗\x03 Οι πληροφορίες του ψευδωνύμου \x02%nickname%\x02 είναι ιδιωτικές."
  header: "\x02Πληροφορίες για το ψευδώνυμο \x0307%nickname%\x03\x02"
  status: "  \x0314Κατάσταση\x03       : %status%"
  status_registered: "\x0303Καταχωρημένο\x03"
  status_suspended: "\x0304Σε αναστολή\x03"
  status_forbidden: "\x0304Απαγορευμένο\x03"
  status_pending_deletion: "\x0307Σε αναμονή διαγραφής\x03"
  reason: "  \x0314Αιτία\x03                 : %reason%"
  suspended_until: "  \x0314Λήγει στις\x03      : %date%"
  suspended_permanent: "  \x0314Λήγει στις\x03      : Μόνιμη"
  registered_at: "  \x0314Καταχωρήθηκε\x03    : %date%"
  last_seen_online: "  \x0314Τελ. εμφάνιση\x03   : \x0303● ONLINE ΤΩΡΑ\x03"
  last_seen_at: "  \x0314Τελ. εμφάνιση\x03   : %date%"
  last_seen_never: "  \x0314Τελ. εμφάνιση\x03   : Ποτέ"
  last_quit: "  \x0314Τελ. μήνυμα\x03     : %message%"
  last_connect: "  \x0314Τελ. εμφ. από\x03   : %ip% (%host%)"
  language: "  \x0314Γλώσσα\x03          : %language%"
  email: "  \x0314Email\x03           : %email%"
  vhost: "  \x0314VHost\x03           : %vhost%"
  no_expire: "  \x0314Ποτέ δεν λήγει\x03       : Ναι"
  pending_deletion_at: "  \x0314Διαγράφηκε\x03             : %date%"
  pending_deletion_until: "  \x0314Οριστική διαγραφή\x03      : %date%"
  pending_deletion_notice: "  \x0307Αυτό το ψευδώνυμο είναι σε αναμονή διαγραφής και δεν μπορεί να καταχωρηθεί.\x03"
  channels_header: !irc |-
    \x0314
    Κανάλια με πρόσβαση:\x03
  channels_entry_founder: "  %channel% (\x0303Ιδρυτής\x03)"
  channels_entry_successor: "  %channel% (\x0303Διάδοχος\x03)"
  channels_entry_access: "  %channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <option> <value>"
  short: "Αλλάξτε τις επιλογές του ψευδωνύμου σας."
  help: |-
    Τροποποιεί τις ρυθμίσεις του ψευδωνύμου σας. Πρέπει να έχετε ταυτοποιηθεί για να
    αλλάξετε αυτές τις επιλογές.
  example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
  unknown_option: "\x0304✗\x03 Άγνωστη επιλογή \x02%option%\x02. Διαθέσιμες επιλογές: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <new_password>"
    short: "Αλλάξτε τον κωδικό του ψευδωνύμου σας."
    help: |-
      Αλλάζει τον κωδικό για το ψευδώνυμό σας. Ο νέος κωδικός
      ισχύει άμεσα. Επιλέξτε έναν ισχυρό κωδικό τουλάχιστον 6 χαρακτήρων
      που δεν χρησιμοποιείτε σε άλλες υπηρεσίες.
    example: "%command_prefix%\x02\x0303SET PASSWORD Ασφαλές$Pass123_123\x03\x0F"
    success: "\x0303✔\x03 Ο κωδικός σας έχει ενημερωθεί επιτυχώς."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "\x0304✗\x03 Χρησιμοποίησε \x0303SET EMAIL <email> <token>\x03 με το επιβεβαιωμένο διακριτικό διάσωσης."
    syntax: "SET EMAIL <email> <token>"
    short: "Αλλάξτε τη διεύθυνση email που συνδέεται με το ψευδώνυμό σας (επιβεβαίωση δύο βημάτων)."
    help: |-
      Το SET EMAIL αλλάζει τη διεύθυνση επικοινωνίας μετά την επικύρωση του
      διακριτικού διάσωσης, χωρίς να το καταναλώνει. Ελέγχει μορφή και μοναδικότητα·
      δεν στέλνει email επιβεβαίωσης.
    example: "%command_prefix%\x02\x0303SET EMAIL user@example.gr <token_confirmado>\x03\x0F"
    success: "\x0303✔\x03 Το email σας έχει ενημερωθεί σε \x02%email%\x02."
    pending_sent: !irc |-
      \x0307→\x03 Ένα token επιβεβαίωσης έχει σταλεί στο \x02%current_email%\x02.
        Για να επιβεβαιώσετε την αλλαγή σε \x02%new_email%\x02 εκτελέστε:
        \x0303/msg %bot% SET EMAIL %new_email% <διακριτικό>\x03
        Το token λήγει σε 1 ώρα.
    invalid_token: "\x0304✗\x03 Το token είναι άκυρο ή έχει λήξει. Ζητήστε νέο με \x0303SET EMAIL <new_email>\x03."

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <code>"
    short: "Αλλάξτε τη γλώσσα που χρησιμοποιούν οι υπηρεσίες για να επικοινωνούν μαζί σας."
    help: !irc |-
      Αλλάζει τη γλώσσα που το %nickserv% και άλλες υπηρεσίες χρησιμοποιούν όταν σας
      μιλούν.
      Διαθέσιμες γλώσσες:
        \x02ca\x02 (Καταλανικά)
        \x02de\x02 (Γερμανικά)
        \x02el\x02 (Ελληνικά)
        \x02en\x02 (Αγγλικά)
        \x02es\x02 (Ισπανικά)
        \x02eu\x02 (Βασκικά)
        \x02fr\x02 (Γαλλικά)
        \x02gl\x02 (Γαλικιακά)
        \x02it\x02 (Ιταλικά)
        \x02nl\x02 (Ολλανδικά)
        \x02pl\x02 (Πολωνικά)
        \x02pt\x02 (Πορτογαλικά)
        \x02ro\x02 (Ρουμανικά)
        \x02tr\x02 (Τουρκικά)
    example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
    success: "\x0303✔\x03 Η γλώσσα άλλαξε σε \x02%language%\x02."
    invalid: "\x0304✗\x03 Μη υποστηριζόμενη γλώσσα. Διαθέσιμες γλώσσες: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <timezone>"
    short: "Ορίστε τη ζώνη ώρας που χρησιμοποιείται κατά την εμφάνιση ημερομηνιών."
    help: |-
      Ορίζει τη ζώνη ώρας που χρησιμοποιεί το %nickserv% για την εμφάνιση ημερομηνιών.
      Δείτε το HELP SET TIMEZONE για τις περιοχές. Χρησιμοποιήστε OFF για κατάργηση.
    example: "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET TIMEZONE OFF\x03\x0F"
    success: "\x0303✔\x03 Ζώνη ώρας ορίστηκε σε \x02%timezone%\x02. Οι ημερομηνίες θα εμφανίζονται σε αυτήν τη ζώνη ώρας."
    cleared: "\x0303✔\x03 Η ζώνη ώρας εκκαθαρίστηκε. Οι ημερομηνίες θα χρησιμοποιούν την προεπιλογή του δικτύου."
    invalid: "\x0304✗\x03 Μη έγκυρη ζώνη ώρας \x02%timezone%\x02. Χρησιμοποιήστε έγκυρο αναγνωριστικό (π.χ. UTC, Europe/Athens)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Ενεργοποίηση ή απενεργοποίηση ιδιωτικότητας για τις πληροφορίες του ψευδωνύμου σας."
    help: !irc |-
      Ελέγχει την ορατότητα των πληροφοριών του ψευδωνύμου σας στην εντολή INFO.
      Με \x02PRIVATE ON\x02 μόνο εσείς και οι IRC Operators μπορούν να δουν τις λεπτομέρειές
      σας.
      Με \x02PRIVATE OFF\x02 οι πληροφορίες σας είναι δημόσιες για όλους.
    example: "%command_prefix%\x02\x0303SET PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET PRIVATE OFF\x03\x0F"
    on: "\x0303✔\x03 Οι πληροφορίες του ψευδωνύμου σας είναι τώρα \x02ιδιωτικές\x02."
    off: "\x0303✔\x03 Οι πληροφορίες του ψευδωνύμου σας είναι τώρα \x02δημόσιες\x02."

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Χρήση PRIVMSG (ON) ή NOTICE (OFF) για απαντήσεις υπηρεσιών."
    help: !irc |-
      Ελέγχει πώς το %nickserv% και άλλες υπηρεσίες στέλνουν μηνύματα σε εσάς.
      Με \x02MSG ON\x02 οι απαντήσεις στέλνονται ως \x02PRIVMSG\x02 (ορισμένοι clients μπορεί να
      ενεργοποιούν απαντήσεις ή ειδοποιήσεις).
      Με \x02MSG OFF\x02 οι απαντήσεις στέλνονται ως \x02NOTICE\x02 (προεπιλογή· συνήθως χωρίς
      αυτόματη απάντηση).
    example: "%command_prefix%\x02\x0303SET MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET MSG OFF\x03\x0F"
    on: "\x0303✔\x03 Τα μηνύματα υπηρεσιών θα στέλνονται τώρα ως \x02PRIVMSG\x02."
    off: "\x0303✔\x03 Τα μηνύματα υπηρεσιών θα στέλνονται τώρα ως \x02NOTICE\x02."

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Ορίστε ή εκκαθαρίστε το προσαρμοσμένο εικονικό host σας (εμφανιζόμενο hostname)."
    help: !irc |-
      Ορίζει ένα προσαρμοσμένο hostname που βλέπουν οι άλλοι όταν είστε
      ταυτοποιημένοι.

      Χρησιμοποιήστε \x02SET VHOST\x02 χωρίς τιμή για εκκαθάριση.

      Μόνο γράμματα (a-z, A-Z),
      ψηφία,
      παύλα και τελεία· όχι παύλα ή τελεία στην αρχή/τέλος κάθε μπλοκ· μέγιστο 48
      χαρακτήρες.
      Μοναδικό ανά ψευδώνυμο.
    example: "%command_prefix%\x02\x0303SET VHOST user.example.gr\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET VHOST\x03\x0F"
    success: "\x0303✔\x03 Το εικονικό host σας έχει οριστεί σε \x02%vhost%\x02."
    cleared: "\x0303✔\x03 Το εικονικό host σας έχει εκκαθαριστεί."
    invalid: "\x0304✗\x03 Μη έγκυρο vhost. Μόνο γράμματα, ψηφία, παύλα και τελεία (όχι στην αρχή/τέλος μπλοκ)· μέγιστο 48 χαρακτήρες."
    taken: "\x0304✗\x03 Αυτό το vhost χρησιμοποιείται ήδη από άλλο ψευδώνυμο."
    forced: "\x0304✗\x03 Το vhost σας διαμορφώνεται αυτόματα και δεν μπορεί να αλλάξει με SET VHOST."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <ψευδώνυμο> <επιλογή> <τιμή>"
  short: "Τροποποίηση ρυθμίσεων άλλου ψευδωνύμου."
  help: |-
    Επιτρέπει σε IRC Operator να τροποποιεί τις ρυθμίσεις ενός καταχωρημένου
    ψευδωνύμου.
    Το ψευδώνυμο-στόχος δεν μπορεί να είναι root χρήστης, IRC Operator ή υπηρεσία.

    Διαθέσιμες επιλογές: PASSWORD, EMAIL, LANGUAGE, TIMEZONE, PRIVATE, MSG, VHOST

    SASET PASSWORD: Αλλάζει τον κωδικό πρόσβασης άμεσα (χωρίς επιβεβαίωση email).
    SASET EMAIL: Αλλάζει το email άμεσα (χωρίς επικύρωση token).

    Αυτή η εντολή απαιτεί άδεια IRCop: nickserv.saset

    Σύνταξη: SASET <ψευδώνυμο> <επιλογή> <τιμή>
    Παράδειγμα: SASET Χρήστης PASSWORD νέοςκωδικός
  example: "%command_prefix%\x02\x0303SASET Χρήστης PRIVATE ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SASET Χρήστης TIMEZONE OFF\x03\x0F"
  unknown_option: "\x0304✗\x03 Άγνωστη επιλογή \x02%option%\x02. Διαθέσιμες επιλογές: %options%."
  cannot_modify_oper: "\x0304✗\x03 Δεν μπορεί να τροποποιηθεί ψευδώνυμο IRC Operator."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <ψευδώνυμο> PASSWORD <νέος_κωδικός>"
    short: "Αλλαγή κωδικού ψευδωνύμου."
    help: |-
      Αλλάζει τον κωδικό πρόσβασης άλλου ψευδωνύμου.
      Η αλλαγή είναι άμεση.

      Σύνταξη: SASET <ψευδώνυμο> PASSWORD <νέος_κωδικός>
      Παράδειγμα: SASET Χρήστης PASSWORD νέοςκωδικός123
    example: "%command_prefix%\x02\x0303SASET Χρήστης PASSWORD ClaveSegura123\x03\x0F"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <ψευδώνυμο> EMAIL <νέο_email>"
    short: "Αλλαγή email ψευδωνύμου."
    help: |-
      Αλλάζει το email άλλου ψευδωνύμου.
      Δεν αποστέλλεται επιβεβαίωση—η αλλαγή είναι άμεση.

      Σύνταξη: SASET <ψευδώνυμο> EMAIL <νέο_email>
      Παράδειγμα: SASET Χρήστης EMAIL χρήστης@παράδειγμα.com
    example: "%command_prefix%\x02\x0303SASET Χρήστης EMAIL user@example.gr\x03\x0F"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <ψευδώνυμο> LANGUAGE <κωδικός>"
    short: "Αλλαγή γλώσσας ψευδωνύμου."
    help: |-
      Αλλάζει τη γλώσσα άλλου ψευδωνύμου.
      Διαθέσιμες γλώσσες: en (Αγγλικά), es (Ισπανικά).

      Σύνταξη: SASET <ψευδώνυμο> LANGUAGE <κωδικός>
      Παράδειγμα: SASET Χρήστης LANGUAGE el
    example: "%command_prefix%\x02\x0303SASET Χρήστης LANGUAGE es\x03\x0F"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <ψευδώνυμο> TIMEZONE <ζώνη_ώρας|OFF>"
    short: "Αλλαγή ζώνης ώρας ψευδωνύμου."
    help: |-
      Ορίζει ή εκκαθαρίζει τη ζώνη ώρας άλλου ψευδωνύμου.
      Χρησιμοποιήστε OFF για εκκαθάριση.

      Σύνταξη: SASET <ψευδώνυμο> TIMEZONE <ζώνη_ώρας>
      Παράδειγμα: SASET Χρήστης TIMEZONE Europe/Athens
    example: "%command_prefix%\x02\x0303SASET Χρήστης TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Χρήστης TIMEZONE OFF\x03\x0F"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <ψευδώνυμο> PRIVATE {ON|OFF}"
    short: "Αλλαγή ιδιωτικότητας ψευδωνύμου."
    help: |-
      Ενεργοποιεί ή απενεργοποιεί την ιδιωτικότητα των πληροφοριών άλλου ψευδωνύμου.

      Σύνταξη: SASET <ψευδώνυμο> PRIVATE {ON|OFF}
      Παράδειγμα: SASET Χρήστης PRIVATE ON
    example: "%command_prefix%\x02\x0303SASET Χρήστης PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Χρήστης PRIVATE OFF\x03\x0F"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <ψευδώνυμο> MSG {ON|OFF}"
    short: "Αλλαγή προτίμησης μηνυμάτων ψευδωνύμου."
    help: |-
      Ορίζει αν άλλο ψευδώνυμο λαμβάνει απαντήσεις ως PRIVMSG (ON) ή NOTICE (OFF).

      Σύνταξη: SASET <ψευδώνυμο> MSG {ON|OFF}
      Παράδειγμα: SASET Χρήστης MSG ON
    example: "%command_prefix%\x02\x0303SASET Χρήστης MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Χρήστης MSG OFF\x03\x0F"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <ψευδώνυμο> VHOST [vhost]"
    short: "Αλλαγή εικονικού host ψευδωνύμου."
    help: |-
      Ορίζει ή αφαιρεί το εικονικό host άλλου ψευδωνύμου. Εκτελέστε SASET <ψευδώνυμο>
      VHOST χωρίς τιμή για να το αφαιρέσετε.
    example: "%command_prefix%\x02\x0303SASET Χρήστης VHOST user.example.gr\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Χρήστης VHOST\x03\x0F"

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [command]"
  short: "Εμφάνιση βοήθειας για εντολές του %nickserv%."
  help: |-
    Εμφανίζει γενική βοήθεια του %nickserv% ή λεπτομερείς πληροφορίες
    για μια συγκεκριμένη εντολή.
  examples_header: "\x02 ■ Παραδείγματα:\x02"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET TIMEZONE Europe\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  navigation_marker: "\x0310›\x03\x0F"
  info_marker: "\x0310ℹ\x03\x0F"
  error_marker: "\x0304✗\x03\x0F"
  warning_marker: "\x0304⚠\x03\x0F"
  intro: |-
    Σας επιτρέπει να καταχωρείτε και να προστατεύετε το ψευδώνυμό σας, ώστε να μην
    το χρησιμοποιούν άλλοι χρήστες. Διαχειριστείτε την ασφάλεια του λογαριασμού σας,
    προσαρμόστε τις προτιμήσεις σας και ανακτήστε την πρόσβαση όποτε χρειαστεί.
  intro_expiration: "%marker% %label%: Τα ψευδώνυμα που δεν χρησιμοποιούνται για περισσότερες από \x1F\x0304%days% ημέρες\x03\x1F διαγράφονται αυτόματα."
  intro_expiration_label: "ΣΗΜΕΙΩΣΗ"
  general_header: "\x02 ■ Διαθέσιμες εντολές:\x02"
  command_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Επιλογές:\x02"
  general_syntax: "HELP <εντολή>"
  general_footer: "%marker% Χρησιμοποιήστε /msg %bot% \x02\x0303%syntax%\x03\x0F για περισσότερες πληροφορίες."
  set_sub_syntax: "HELP %command% <επιλογή>"
  set_sub_footer: "%marker% Χρησιμοποιήστε /msg %bot% \x02\x0303%syntax%\x03\x0F για περισσότερες πληροφορίες."
  syntax_label: "Σύνταξη: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_auth: "Εγγραφή και ταυτοποίηση"
    account_security: "Λογαριασμός και ασφάλεια"
  ircop_group:
    lookup: "Αναζήτηση και διερεύνηση"
    account_management: "Διαχείριση λογαριασμών"
    suspensions_bans: "Αναστολές και απαγορεύσεις"
    deletion: "Διαγραφή και επαναφορά"
  ircop_header: "\x02 ■ Διαθέσιμες εντολές για IRC operators:\x02"
  set_timezone:
    index_label: "Περιοχές (χρησιμοποιήστε \x02\x0303%syntax%\x03\x0F για λίστα):"
    index_syntax: "HELP SET TIMEZONE <region>"
    region_header: "\x02 ■ Ζώνες ώρας για %region%:\x02"
    region_unknown: "%marker% Άγνωστη περιοχή. Χρησιμοποιήστε \x02\x0303%syntax%\x03\x0F για το ευρετήριο."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "\x0304⚠\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι καταχωρημένο. Θα μετονομαστείτε αν δεν ταυτοποιηθείτε."
  renamed_to: !irc |-
    \x0307→\x03 Έχετε μετονομαστεί σε \x02%guest_nick%\x02. Για ανάκτηση του ψευδωνύμου σας:
    \x0303/msg %bot% IDENTIFY %nickname% <κωδικός>\x03
  nick_forbidden: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι απαγορευμένο: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Λάβετε την πραγματική διεύθυνση IP και το hostname του ψευδωνύμου."
  help: |-
    Εμφανίζει την πραγματική διεύθυνση IP και το hostname του καθορισμένου
    ψευδωνύμου.
    Διαθέσιμο μόνο σε IRCops με άδεια 'nickserv.userip'.

    Αυτή η εντολή εμφανίζει ευαίσθητες πληροφορίες ψευδωνύμου.
    Χρησιμοποιήστε υπεύθυνα.

    Σύνταξη: USERIP <ψευδώνυμο>
    Παράδειγμα: USERIP SomeUser
  example: "%command_prefix%\x02\x0303USERIP Χρήστης\x03\x0F"
  result: "\x0307ℹ\x03 Ψευδώνυμο: \x02%nickname%\x02 | IP: \x0307%ip%\x03 | Host: \x0307%host%\x03"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Βρίσκει ψευδώνυμα με βάση την IP της τελευταίας ταυτοποιημένης σύνδεσής τους."
  help: |-
    Εμφανίζει τα καταχωρημένα ψευδώνυμα των οποίων η τελευταία ταυτοποιημένη σύνδεση
    χρησιμοποίησε αυτή την IP.
    Η αποθηκευμένη διεύθυνση μπορεί να είναι παλιά.
  example: "%command_prefix%\x02\x0303WHOIP 192.0.2.10\x03\x0F"
  empty: "Δεν βρέθηκαν καταχωρημένα ψευδώνυμα για αυτή την IP."
  header: "Ψευδώνυμα που ταιριάζουν:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <duration> <reason>"
  short: "Αναστολή ψευδωνύμου."
  help: !irc |-
    Θέτει σε αναστολή ένα ψευδώνυμο, εμποδίζοντας τον κάτοχο από το να ταυτοποιηθεί.
    Η αναστολή μπορεί να είναι προσωρινή ή μόνιμη.

    Μορφές διάρκειας: \x0303%d\x03 (ημέρες), \x0303%h\x03 (ώρες), \x0303%m\x03
    (λεπτά), ή \x03030\x03 (μόνιμη).

    Οι χρήστες σε αναστολή δεν μπορούν να ταυτοποιηθούν στο ψευδώνυμό τους.
    Οι IRC operators και οι root χρήστες δεν μπορούν να τεθούν σε αναστολή.

    Σύνταξη: SUSPEND <ψευδώνυμο> <διάρκεια> <αιτία>
    Παραδείγματα:
      SUSPEND BadUser 7d Spamming στο #help
      SUSPEND Abuser 30d Επαναλαμβανόμενο flood
      SUSPEND ProblemUser 0 Αποφυγή permaban
  example: "%command_prefix%\x02\x0303SUSPEND ΚακόςΧρήστης 7d Spam en #βοήθεια\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND Προβληματικός 0 Παράκαμψη αποκλεισμού\x03\x0F"
  success: "\x0303✔\x03 Το ψευδώνυμο \x02%nickname%\x02 έχει τεθεί σε αναστολή μέχρι \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι ήδη σε αναστολή."
  forbidden: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι απαγορευμένο και δεν μπορεί να τεθεί σε αναστολή."
  cannot_suspend_oper: "\x0304✗\x03 Δεν μπορεί να τεθεί σε αναστολή ο IRC operator \x02%nickname%\x02."
  cannot_suspend_root: "\x0304✗\x03 Δεν μπορεί να τεθεί σε αναστολή ο root χρήστης \x02%nickname%\x02."
  cannot_suspend_service: "\x0304✗\x03 Δεν μπορεί να τεθεί σε αναστολή το ψευδώνυμο υπηρεσίας \x02%nickname%\x02."
  invalid_duration: "\x0304✗\x03 Μη έγκυρη διάρκεια. Χρησιμοποιήστε: \x0303<d><h><m>\x03 (π.χ., 7d, 12h, 30m) ή \x03030\x03 για μόνιμη."

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Αφαίρεση αναστολής από ψευδώνυμο."
  help: |-
    Αφαιρεί μια ενεργή αναστολή από ένα ψευδώνυμο, επιτρέποντας στον κάτοχο να
    ταυτοποιηθεί ξανά.

    Σύνταξη: UNSUSPEND <ψευδώνυμο>
    Παράδειγμα: UNSUSPEND SomeUser
  example: "%command_prefix%\x02\x0303UNSUSPEND Χρήστης\x03\x0F"
  success: "\x0303✔\x03 Η αναστολή έχει αρθεί από \x02%nickname%\x02."
  not_suspended: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι σε αναστολή."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Αναγκαστική μετονομασία συνδεδεμένου ψευδωνύμου σε τυχαίο."
  help: |-
    Αναγκάζει ένα συνδεδεμένο ψευδώνυμο να αλλάξει σε τυχαίο όνομα με πρόθεμα που
    έχει ορίσει το δίκτυο.
  example: "%command_prefix%\x02\x0303RENAME Προβληματικός\x03\x0F"
  cannot_rename_root: "\x0304✗\x03 Δεν μπορεί να μετονομαστεί ο root χρήστης \x02%nickname%\x02."
  cannot_rename_oper: "\x0304✗\x03 Δεν μπορεί να μετονομαστεί ο IRC operator \x02%nickname%\x02."
  cannot_rename_service: "\x0304✗\x03 Δεν μπορεί να μετονομαστεί το ψευδώνυμο υπηρεσίας \x02%nickname%\x02."
  success: "\x0303✓\x03 Το ψευδώνυμο \x02%nickname%\x02 έχει μετονομαστεί σε \x02%new_nick%\x02."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Διαγραφή καταχωρημένου ψευδωνύμου."
  help: |-
    Διαγράφει ένα καταχωρημένο ψευδώνυμο από τη βάση δεδομένων.
    Αυτή η ενέργεια δεν μπορεί να αναιρεθεί.

    Αν ο χρήστης είναι online, θα μετονομαστεί σε ψευδώνυμο Guest-.
    Οι root χρήστες και οι IRC operators δεν μπορούν να διαγραφούν.
    Δεν μπορείτε να διαγράψετε το δικό σας ψευδώνυμο.

    Αυτή η εντολή απαιτεί άδεια IRCop: nickserv.drop

    Σύνταξη: DROP <ψευδώνυμο>
    Παράδειγμα: DROP OldAccount
  force:
    short: "Διαγράφει οριστικά ένα ψευδώνυμο που εκκρεμεί προς διαγραφή."
  example: "%command_prefix%\x02\x0303DROP ΠαλιόςΛογαριασμός\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP ΠαλιόςΛογαριασμός FORCE\x03\x0F"
  suspended: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι σε αναστολή. Άρετε πρώτα την αναστολή."
  forbidden: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι απαγορευμένο."
  cannot_drop_root: "\x0304✗\x03 Δεν μπορεί να διαγραφεί ο root χρήστης \x02%nickname%\x02."
  cannot_drop_oper: "\x0304✗\x03 Δεν μπορεί να διαγραφεί ο IRC operator \x02%nickname%\x02."
  cannot_drop_self: "\x0304✗\x03 Δεν μπορείτε να διαγράψετε το δικό σας ψευδώνυμο."
  success: "\x0303✓\x03 Το ψευδώνυμο \x02%nickname%\x02 έχει σημανθεί για διαγραφή και μπορεί να επαναφερθεί κατά την περίοδο χάριτος."
  force_success: "\x0303✓\x03 Το ψευδώνυμο \x02%nickname%\x02 έχει διαγραφεί οριστικά."
  pending_deletion: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι ήδη σε αναμονή διαγραφής. Χρησιμοποιήστε DROP <nickname> FORCE για οριστική διαγραφή."
  cannot_drop_service: "\x0304✗\x03 Δεν μπορεί να διαγραφεί το ψευδώνυμο υπηρεσίας \x02%nickname%\x02."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Επαναφορά ψευδωνύμου σε αναμονή διαγραφής."
  help: |-
    Επαναφέρει ένα ψευδώνυμο που διαγράφηκε χειροκίνητα και βρίσκεται ακόμα εντός
    της περιόδου χάριτος. Απαιτεί άδεια IRCop: nickserv.restore.
  example: "%command_prefix%\x02\x0303RESTORE ΠαλιόςΛογαριασμός\x03\x0F"
  success: "\x0303✓\x03 Το ψευδώνυμο \x02%nickname%\x02 έχει επαναφερθεί."
  not_pending_deletion: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι σε αναμονή διαγραφής."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <reason>"
  short: "Μόνιμος αποκλεισμός ψευδωνύμου από χρήση."
  help: |-
    Απαγορεύει τη χρήση ενός ψευδωνύμου στο δίκτυο.
    Το ψευδώνυμο δεν μπορεί να καταχωρηθεί ή να χρησιμοποιηθεί από κανέναν.

    Αν το ψευδώνυμο είναι τρέχοντα καταχωρημένο, θα διαγραφεί πρώτα.
    Αν κάποιος το χρησιμοποιεί, θα αναγκαστεί να αλλάξει σε ψευδώνυμο Guest-.

    Οι root χρήστες, οι IRC operators και τα ψευδώνυμα υπηρεσιών δεν μπορούν να
    απαγορευτούν.

    Αυτή η εντολή απαιτεί άδεια IRCop: nickserv.forbid

    Σύνταξη: FORBID <ψευδώνυμο> <αιτία>
    Παράδειγμα: FORBID BadNick Επαναλαμβανόμενες παραβιάσεις πολιτικής
  example: "%command_prefix%\x02\x0303FORBID ΚακόςΧρήστης Επαναλαμβανόμενες παραβιάσεις κανόνων\x03\x0F"
  success: "\x0303✔\x03 Το ψευδώνυμο \x02%nickname%\x02 έχει απαγορευτεί."
  updated: "\x0303✔\x03 Η αιτία απαγόρευσης για το \x02%nickname%\x02 έχει ενημερωθεί."
  reason_required: "\x0304✗\x03 Πρέπει να δώσετε αιτία για την απαγόρευση."
  cannot_forbid_root: "\x0304✗\x03 Δεν μπορεί να απαγορευτεί ο root χρήστης \x02%nickname%\x02."
  cannot_forbid_oper: "\x0304✗\x03 Δεν μπορεί να απαγορευτεί ο IRC operator \x02%nickname%\x02."
  cannot_forbid_service: "\x0304✗\x03 Δεν μπορεί να απαγορευτεί το ψευδώνυμο υπηρεσίας \x02%nickname%\x02."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Άρση απαγόρευσης ψευδωνύμου."
  help: |-
    Αφαιρεί την απαγόρευση ενός ψευδωνύμου, επιτρέποντας τη χρήση του ξανά.

    Αυτή η εντολή απαιτεί άδεια IRCop: nickserv.forbid

    Σύνταξη: UNFORBID <ψευδώνυμο>
    Παράδειγμα: UNFORBID SomeNick
  example: "%command_prefix%\x02\x0303UNFORBID ΑπαγορευμένοΨευδώνυμο\x03\x0F"
  success: "\x0303✔\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι πλέον απαγορευμένο."
  not_forbidden: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι απαγορευμένο."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD|DEL|LIST} [pattern]"
  short: "Διαχείριση απαγορευμένων μοτίβων vhost."
  help: |-
    Διαχειρίζεται μοτίβα που εμποδίζουν τον ορισμό vhost που ταιριάζουν με SET
    VHOST. Το * αντιστοιχεί σε οποιαδήποτε ακολουθία χαρακτήρων και το ? σε έναν
    χαρακτήρα. Απαιτούνται δικαιώματα IRC Operator.
  example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL ή LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <pattern>"
    short: "Προσθήκη απαγορευμένου μοτίβου vhost."
    help: |-
      Προσθέτει ένα μοτίβο στη λίστα απαγορευμένων vhost. Οι χρήστες δεν θα
      μπορούν να ορίσουν vhosts που ταιριάζουν με αυτό το μοτίβο μέσω SET VHOST.

      Wildcards: * ταιριάζει με οποιαδήποτε ακολουθία, ? ταιριάζει με έναν χαρακτήρα.

      Σύνταξη: FORBIDVHOST ADD <μοτίβο>
      Παράδειγμα: FORBIDVHOST ADD *.pirated.com
    example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Προστέθηκε απαγορευμένο μοτίβο vhost: \x02%pattern%\x02"
    already_exists: "\x0304✗\x03 Το μοτίβο \x02%pattern%\x02 υπάρχει ήδη."
    invalid: "\x0304✗\x03 Μη έγκυρη μορφή μοτίβου vhost."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <pattern>"
    short: "Αφαίρεση απαγορευμένου μοτίβου vhost."
    help: |-
      Αφαιρεί ένα μοτίβο από τη λίστα απαγορευμένων vhost.

      Σύνταξη: FORBIDVHOST DEL <μοτίβο>
      Παράδειγμα: FORBIDVHOST DEL *.pirated.com
    example: "%command_prefix%\x02\x0303FORBIDVHOST DEL *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Αφαιρέθηκε απαγορευμένο μοτίβο vhost: \x02%pattern%\x02"
    not_found: "\x0304✗\x03 Το μοτίβο \x02%pattern%\x02 δεν βρέθηκε."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Λίστα όλων των απαγορευμένων μοτίβων vhost."
    syntax: "FORBIDVHOST LIST"
    help: |-
      Εμφανίζει όλα τα απαγορευμένα μοτίβα vhost.

      Σύνταξη: FORBIDVHOST LIST
    example: "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
    header: "\x0307ℹ\x03 Απαγορευμένα μοτίβα vhost (\x02%count%\x02):"
    entry: "  %index%. \x0304%pattern%\x03 — από %nickname% (%date%)"
    empty: "\x0307ℹ\x03 Δεν υπάρχουν απαγορευμένα μοτίβα vhost."

# --- HISTORY ---------------------------------------------------------------
history:
  syntax: "HISTORY <nickname> {ADD|DEL|VIEW|CLEAR}"
  short: "Προβολή ή διαχείριση ιστορικού ενεργειών ψευδωνύμου."
  help: |-
    Διαχείριση του ιστορικού ενεργειών για ένα ψευδώνυμο.
    Μόνο IRCops με άδεια 'nickserv.history' μπορούν να χρησιμοποιήσουν αυτήν την
    εντολή.

    Ενέργειες που καταγράφονται αυτόματα:
      SUSPEND, UNSUSPEND, SET PASSWORD, SET EMAIL, SASET PASSWORD,
      SASET EMAIL, RECOVER

    Σύνταξη: HISTORY <ψευδώνυμο> ADD <message>
            HISTORY <ψευδώνυμο> DEL <id>
            HISTORY <ψευδώνυμο> VIEW [PAGE|ALL]
            HISTORY <ψευδώνυμο> CLEAR

    Παραδείγματα:
      HISTORY SomeNick VIEW
      HISTORY SomeNick ADD Χειροκίνητη σημείωση για αυτόν τον χρήστη
      HISTORY SomeNick VIEW 2
      HISTORY SomeNick VIEW ALL
      HISTORY SomeNick DEL 123
      HISTORY SomeNick CLEAR

    Χρησιμοποιήστε VIEW για να δείτε το ιστορικό (εμφανίζει 3 καταχωρήσεις
    προεπιλεγμένα).
    Χρησιμοποιήστε VIEW PAGE 2 για την επόμενη σελίδα.
    Χρησιμοποιήστε VIEW ALL για πλήρες ιστορικό.
    Χρησιμοποιήστε ADD για χειροκίνητη καταχώρηση.
    Χρησιμοποιήστε DEL για διαγραφή συγκεκριμένης καταχώρησης μέσω ID.
    Χρησιμοποιήστε CLEAR για διαγραφή όλων των καταχωρήσεων ιστορικού.
  example: "%command_prefix%\x02\x0303HISTORY Χρήστης VIEW\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HISTORY Χρήστης VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY Χρήστης ADD Χειροκίνητη σημείωση\x03\x0F"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <message>"
    short: "Προσθήκη χειροκίνητης καταχώρησης ιστορικού."
    help: |-
      Προσθέτει μια χειροκίνητη καταχώρηση στο ιστορικό του ψευδωνύμου.

      Σύνταξη: HISTORY <ψευδώνυμο> ADD <message>
      Παράδειγμα: HISTORY SomeNick ADD Ο χρήστης αναφέρθηκε για spam
    example: "%command_prefix%\x02\x0303HISTORY Χρήστης ADD Αναφέρθηκε για ανεπιθύμητα\x03\x0F"
    success: "\x0303✔\x03 Η καταχώρηση ιστορικού προστέθηκε για \x02%nickname%\x02."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "Διαγραφή καταχώρησης ιστορικού μέσω ID."
    help: |-
      Διαγράφει μια συγκεκριμένη καταχώρηση ιστορικού με το ID της.

      Σύνταξη: HISTORY <ψευδώνυμο> DEL <id>
      Παράδειγμα: HISTORY SomeNick DEL 42
    example: "%command_prefix%\x02\x0303HISTORY Χρήστης DEL 42\x03\x0F"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [PAGE|ALL]"
    short: "Προβολή ιστορικού ενεργειών ψευδωνύμου."
    help: |-
      Εμφανίζει το ιστορικό ενεργειών του ψευδωνύμου.

      Σύνταξη: HISTORY <ψευδώνυμο> VIEW
              HISTORY <ψευδώνυμο> VIEW PAGE
              HISTORY <ψευδώνυμο> VIEW ALL

      Προεπιλεγμένα εμφανίζει 3 καταχωρήσεις κάθε φορά.
      Χρησιμοποιήστε VIEW 2 για τη δεύτερη σελίδα.
      Χρησιμοποιήστε VIEW ALL για πλήρες ιστορικό.
    example: "%command_prefix%\x02\x0303HISTORY Χρήστης VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY Χρήστης VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY Χρήστης VIEW ALL\x03\x0F"
    header: "\x02Ιστορικό για \x0307%nickname%\x03\x02 (εμφάνιση %start%-%end% από %total%):"
    entry: "#%id% [%date%] \x0303%action%\x03 από %operator% — %message%"
    no_entries: "\x0307ℹ\x03 Δεν βρέθηκαν καταχωρήσεις ιστορικού για \x02%nickname%\x02."
    page_hint: "Χρησιμοποιήστε \x0303HISTORY %nickname% VIEW %next_page%\x03 για περισσότερες καταχωρήσεις."

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Διαγραφή όλων των καταχωρήσεων ιστορικού για ένα ψευδώνυμο."
    help: |-
      Αφαιρεί όλες τις καταχωρήσεις ιστορικού για το καθορισμένο ψευδώνυμο.
      Αυτή η ενέργεια δεν μπορεί να αναιρεθεί.

      Σύνταξη: HISTORY <ψευδώνυμο> CLEAR
      Παράδειγμα: HISTORY SomeNick CLEAR
    example: "%command_prefix%\x02\x0303HISTORY Χρήστης CLEAR\x03\x0F"
    success: "\x0303✔\x03 Εκκαθαρίστηκαν \x02%count%\x02 καταχωρήσεις ιστορικού για \x02%nickname%\x02."
history.message:
  password_changed_owner: "Ο κωδικός άλλαξε από τον κάτοχο"
  password_changed_operator: "Ο κωδικός άλλαξε από operator"
  email_changed_owner: "Το email άλλαξε από %old_email% σε %new_email%"
  email_changed_operator: "Το email άλλαξε σε %new_email% από operator"
  recover: "Επαναφορά κωδικού μέσω token email"
history.extra:
  old_email: "Προηγούμενο email: %value%"
  new_email: "Νέο email: %value%"
  method: "Μέθοδος: %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Ορισμός ή αφαίρεση προστασίας λήξης για ένα ψευδώνυμο."
  help: |-
    Ελέγχει αν ένα ψευδώνυμο θα λήξει λόγω αδράνειας.
    Όταν είναι ON, το ψευδώνυμο δεν λήγει ποτέ ανεξάρτητα από την τελευταία
    δραστηριότητα.
    Όταν είναι OFF, ισχύουν οι κανονικοί κανόνες λήξης.

    Μόνο IRCops με άδεια 'nickserv.noexpire' μπορούν να χρησιμοποιήσουν αυτήν την
    εντολή.

    Σύνταξη: NOEXPIRE <ψευδώνυμο> {ON|OFF}
    Παραδείγματα:
      NOEXPIRE ImportantUser ON
      NOEXPIRE ImportantUser OFF
  example: "%command_prefix%\x02\x0303NOEXPIRE Χρήστης ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE Χρήστης OFF\x03\x0F"
  success_on: "\x0303✔\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι τώρα προστατευμένο από λήξη."
  success_off: "\x0303✔\x03 Το ψευδώνυμο \x02%nickname%\x02 θα λήγει τώρα κανονικά."
  forbidden: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι απαγορευμένο."
  suspended: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 είναι σε αναστολή."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <μοτίβο> [σελίδα]"
  short: "Εμφανίζει καταχωρισμένα ψευδώνυμα βάσει μοτίβου."
  help: |-
    Εμφανίζει τα καταχωρισμένα ψευδώνυμα που ταιριάζουν με το μοτίβο. Το *
    αντιστοιχεί σε οποιαδήποτε ακολουθία χαρακτήρων. Η σελίδα είναι προαιρετική και
    ξεκινά από το 1.
  example: "%command_prefix%\x02\x0303LIST Χρήστης*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST Χρήστης* 2\x03\x0F"
  header: "Ψευδώνυμο | Εγγραφή | Τελευταία σύνδεση | IP | Κατάσταση"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Δεν βρέθηκαν ψευδώνυμα για το μοτίβο %pattern%."
  status_pending: "Σε αναμονή"
  status_registered: "Καταχωρισμένο"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Διαχείριση του τρόπου εγγραφής του δικτύου."
  help: !irc |-
    Ρυθμίζει τη λειτουργία εγγραφής για νέους λογαριασμούς.

    • \x02EMAIL:\x02 Το διακριτικό επαλήθευσης αποστέλλεται στη διεύθυνση email του χρήστη.
    • \x02TOKEN:\x02 Το διακριτικό παρέχεται απευθείας μέσω IRC.
    • \x02STATUS:\x02 Εμφανίζει την τρέχουσα λειτουργία χωρίς αλλαγές.

    Οι εκκρεμείς εγγραφές διατηρούν τη λειτουργία με την οποία ξεκίνησαν.

    Στη λειτουργία TOKEN, η εντολή RESEND παραμένει
    απενεργοποιημένη για όλους τους χρήστες.
  example: "%command_prefix%\x02\x0303REGMODE STATUS\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGMODE EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303REGMODE TOKEN\x03\x0F"
  status: "\x0307ℹ\x03 Τρέχων τρόπος εγγραφής: \x02%mode%\x02."
  changed: "\x0303✔\x03 Ο τρόπος εγγραφής άλλαξε σε \x02%mode%\x02."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: !irc |-
    Διακριτικό διάσωσης: \x0303%token%\x03

    Φύλαξε αυτό το διακριτικό σε ασφαλές μέρος. Θα το χρειαστείς για να ανακτήσεις το ψευδώνυμό σου αν ξεχάσεις τον κωδικό πρόσβασής σου.

    Για να το επιβεβαιώσεις, χρησιμοποίησε: /msg %bot% \x0303VERIFY %token%\x03


# Traducións de MemoServ — Galego
# Dominio: memoserv
#
# Códigos de formato IRC (comiñas dobres ou bloques literais !irc):
#   \x02        activa/desactiva a negra
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermello, 07=laranxa, 14=gris escuro)
#   \x03        restablece a cor
#   \x0F        restablece todo o formato
#
# As cores IRC usan números DECIMAIS (0-15), non hexadecimais.
#   \x0314 = gris escuro (14 decimal): CORRECTO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multiliña: !irc |- con saltos físicos e espazos reais.
# Os bloques sen etiqueta non descodifican escapes; conserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O presentador engade /msg sen cor e unha marxe de dous espazos.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {alcume|#canle} <mensaxe>"
  short: "Enviar unha mensaxe a un alcume ou canle."
  help: |-
    Envía unha mensaxe a un alcume ou canle rexistrada. A persoa destinataria debe
    ter activado o servizo de mensaxes (ENABLE).
  example: "%command_prefix%SEND Ana Hola, ¿puedes revisar el memo?"
  examples:
    - "%command_prefix%SEND #axuda Aviso para el canal"
  sent_nick: "Mensaxe enviada a %nickname%."
  sent_channel: "Mensaxe enviada á canle %channel%."
  throttled: "Debe agardar %seconds% segundo(s) antes de enviar outra mensaxe."
  limit_reached: "Límite de mensaxes alcanzado para %target%."
  ignored: "Non pode enviar mensaxes a este destinatario, está na súa lista de ignorados."
  cannot_send_to_self: "Non pode enviar unha mensaxe a si mesmo."
  message_too_long: "Mensaxe demasiado longa. O máximo é %max% caracteres."
  service_disabled_for_target: "O servizo de mensaxes está desactivado para %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#canle] <número>"
  short: "Ler unha mensaxe polo número."
  help: |-
    Le a mensaxe co número indicado. Sen #canle, le a da túa caixa do alcume.
    Con #canle, require o nivel MEMOREAD.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #axuda 2"
  header: "Mensaxe nº%index% de %from%:"
  footer: "%separator% %date%"
  not_found: "Mensaxe nº%index% non atopada."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#canle]"
  short: "Listar mensaxes (non lidas marcadas con * vermello)."
  help: |-
    Lista as túas mensaxes ou as da canle. As non lidas móstranse cun asterisco
    vermello e unha vista previa (máx. 50 caracteres). Sen #canle = a túa caixa;
    con #canle require MEMOREAD.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #axuda"
  header: "Mensaxes para %target%:"
  empty: "Non hai mensaxes para %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#canle] {número|ALL}"
  short: "Eliminar unha mensaxe polo número."
  help: |-
    Elimina unha mensaxe polo seu número ou usa ALL para baleirar a caixa. Nas
    canles require o nivel MEMOCHANGE.
  example: "%command_prefix%DEL ALL"
  examples:
    - "%command_prefix%DEL 1"
    - "%command_prefix%DEL #axuda 2"
    - "%command_prefix%DEL #axuda ALL"
  deleted: "Mensaxe nº%index% eliminada."
  not_found: "Mensaxe nº%index% non atopada."
  all_deleted: "Elimináronse todas as mensaxes desta caixa."
  none_to_delete: "Non hai mensaxes para eliminar."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#canle] <alcume>|DEL [#canle] <alcume>|LIST [#canle]}"
  short: "Xestionar a lista de ignorados para mensaxes."
  help: |-
    Xestiona os alcumes dos que non queres recibir mensaxes, tanto na túa conta
    como nunha canle rexistrada. Para modificar a lista dunha canle necesitas o
    permiso MEMOCHANGE.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #axuda Ana"
    - "%command_prefix%IGNORE LIST #axuda"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#canle] <alcume>"
    short: "Engade un alcume á lista de ignorados."
    help: |-
      As mensaxes deste alcume non serán aceptadas para a súa caixa de entrada (ou a
      da canle).
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #axuda Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#canle] <alcume>"
    short: "Elimina un alcume da lista."
    help: "Elimina o alcume da lista de ignorados."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #axuda Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#canle]"
    short: "Amosa os alcumes ignorados."
    help: "Mostra a lista de alcumes que vostede (ou a canle) ignora para mensaxes."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #axuda"
  added: "%nickname% engadido á lista de ignorados."
  removed: "%nickname% eliminado da lista de ignorados."
  already_ignored: "%nickname% xa está na lista de ignorados."
  not_ignored: "%nickname% non está na lista de ignorados."
  limit_reached_nick: "Límite da lista de ignorados alcanzado para o seu alcume (máx. %limit%)."
  limit_reached_channel: "Límite da lista de ignorados alcanzado para %channel% (máx. %limit%)."
  list_empty: "A lista de ignorados está baleira."
  list_header: "Lista de ignorados:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#canle]"
  short: "Activar a recepción de mensaxes."
  help: |-
    Activa a recepción de mensaxes para o teu alcume; nas canles, só a persoa
    fundadora pode activala.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #axuda"
  enabled_nick: "Servizo de mensaxes activado para o seu alcume."
  enabled_channel: "Servizo de mensaxes activado para a canle %channel%."
  already_enabled_nick: "O servizo de mensaxes xa está activado para o seu alcume."
  already_enabled_channel: "O servizo de mensaxes xa está activado para %channel%."
  founder_only: "Só o fundador da canle pode activar as mensaxes para %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#canle]"
  short: "Desactivar a recepción de mensaxes."
  help: |-
    Desactiva a recepción de mensaxes para o teu alcume ou canle. Nas canles,
    só a persoa fundadora pode desactivala.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #axuda"
  disabled_nick: "Servizo de mensaxes desactivado para o seu alcume."
  disabled_channel: "Servizo de mensaxes desactivado para a canle %channel%."
  already_disabled_nick: "O servizo de mensaxes xa está desactivado para o seu alcume."
  already_disabled_channel: "O servizo de mensaxes xa está desactivado para %channel%."
  founder_only: "Só o fundador da canle pode desactivar as mensaxes para %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [comando] [opción]"
  short: "Listar comandos ou mostrar axuda dun comando."
  help: "Amosa a lista de comandos ou a axuda detallada dun comando ou opción."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permite enviar e recibir mensaxes entre persoas usuarias rexistradas e enviar
    avisos ás canles. As mensaxes gárdanse para consultalas máis tarde, aínda que a
    persoa destinataria non estea conectada.
  general_header: "Comandos dispoñibles:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opcións:"
  examples_header: "Exemplos:"
  general_help_command: "HELP <comando>"
  option_help_command: "HELP %command% <opción>"
  general_footer: "Usa /msg %bot% %help_command% para obter máis información."
  set_sub_footer: "Usa /msg %bot% %help_command% para obter máis información."
  syntax_label: "Sintaxe: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Mensaxes"
    preferences: "Preferencias"
  ircop_header: "Comandos dispoñibles para IRCops:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_pending: "Tes %count% mensaxe(s) pendente(s) de ler. Para listalas: /msg %bot% %list%"
  channel_pending: "A canle %channel% ten %count% mensaxe(s) pendente(s) de ler. Consulta as mensaxes con /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "A túa solicitude de rexistro de %channel% foi aceptada."
  rejected: "A túa solicitude de rexistro de %channel% foi rexeitada."
  reason: "Razón: %reason%"
  restriction: "Dispoñible a partir do: %date%"

# Μεταφράσεις MemoServ — Ελληνικά
# Τομέας: memoserv
#
# Κωδικοί μορφοποίησης IRC (διπλά εισαγωγικά ή κυριολεκτικά μπλοκ !irc):
#   \x02        ενεργοποίηση/απενεργοποίηση έντονης γραφής
#   \x03NN      χρώμα (ΔΕΚΑΔΙΚΟ: 03=πράσινο, 04=κόκκινο, 07=πορτοκαλί, 14=σκούρο γκρι)
#   \x03        επαναφορά χρώματος
#   \x0F        επαναφορά όλης της μορφοποίησης
#
# Τα χρώματα IRC χρησιμοποιούν ΔΕΚΑΔΙΚΟΥΣ αριθμούς (0-15), όχι δεκαεξαδικούς.
#   \x0314 = σκούρο γκρι (14 δεκαδικό): ΣΩΣΤΟ
#   \x030F = χρώμα 0 και μετά το γράμμα F: ΛΑΘΟΣ
#
# Πολυγραμμικό κείμενο IRC: !irc |- με πραγματικές αλλαγές γραμμής και κενά.
# Τα μπλοκ χωρίς ετικέτα δεν αποκωδικοποιούν διαφυγές· διατηρήστε τα CTCP.
# Παραδείγματα HELP: example/examples και %command_prefix%.
# Ο παρουσιαστής προσθέτει άχρωμο /msg και περιθώριο δύο κενών.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#channel} <message>"
  short: "Αποστολή μηνύματος σε ψευδώνυμο ή κανάλι."
  help: |-
    Στέλνει ένα μήνυμα σε ένα καταχωρημένο ψευδώνυμο ή κανάλι. Ο παραλήπτης πρέπει
    να έχει ενεργοποιήσει την υπηρεσία μηνυμάτων (ENABLE).
  example: "%command_prefix%SEND Άννα Γεια, μπορείς να ελέγξεις το μήνυμα;"
  examples:
    - "%command_prefix%SEND #βοήθεια Ειδοποίηση για το κανάλι"
  sent_nick: "Μήνυμα στάλθηκε στο %nickname%."
  sent_channel: "Μήνυμα στάλθηκε στο κανάλι %channel%."
  throttled: "Πρέπει να περιμένετε %seconds% δευτερόλεπτο(α) πριν στείλετε άλλο μήνυμα."
  limit_reached: "Επιτεύχθηκε το όριο μηνυμάτων για %target%."
  ignored: "Δεν μπορείτε να στείλετε μηνύματα σε αυτόν τον παραλήπτη, είστε στη λίστα αγνόησής του."
  cannot_send_to_self: "Δεν μπορείτε να στείλετε μήνυμα στον εαυτό σας."
  message_too_long: "Το μήνυμα είναι πολύ μεγάλο. Το μέγιστο είναι %max% χαρακτήρες."
  service_disabled_for_target: "Η υπηρεσία μηνυμάτων είναι απενεργοποιημένη για %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#channel] <number>"
  short: "Ανάγνωση μηνύματος με αριθμό."
  help: |-
    Διαβάζει το μήνυμα με τον δοσμένο αριθμό. Χωρίς #channel, διαβάζει από τα
    εισερχόμενά σας. Με #channel, απαιτεί επίπεδο MEMOREAD.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #βοήθεια 2"
  header: "Μήνυμα #%index% από %from%:"
  footer: "%separator% %date%"
  not_found: "Το μήνυμα #%index% δεν βρέθηκε."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#channel]"
  short: "Λίστα μηνυμάτων (μη αναγνωσμένα σημειώνονται με κόκκινο *)."
  help: |-
    Εμφανίζει τα μηνύματά σας ή τα μηνύματα του καναλιού. Τα μη αναγνωσμένα μηνύματα
    εμφανίζονται με κόκκινο αστερίσκο και προεπισκόπηση (μέγιστο 50 χαρακτήρες).
    Χωρίς #channel = τα εισερχόμενά σας· με #channel απαιτεί MEMOREAD.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #βοήθεια"
  header: "Μηνύματα για %target%:"
  empty: "Δεν υπάρχουν μηνύματα για %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#channel] {number|ALL}"
  short: "Διαγραφή μηνύματος με αριθμό."
  help: |-
    Διαγράφει ένα μήνυμα με τον αριθμό του ή αδειάζει τη θυρίδα με ALL. Για
    κανάλια απαιτείται το επίπεδο MEMOCHANGE.
  example: "%command_prefix%DEL ALL"
  examples:
    - "%command_prefix%DEL 1"
    - "%command_prefix%DEL #βοήθεια 2"
    - "%command_prefix%DEL #βοήθεια ALL"
  deleted: "Το μήνυμα #%index% διαγράφηκε."
  not_found: "Το μήνυμα #%index% δεν βρέθηκε."
  all_deleted: "Διαγράφηκαν όλα τα μηνύματα αυτής της θυρίδας."
  none_to_delete: "Δεν υπάρχουν μηνύματα για διαγραφή."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE <επιλογή> [παράμετροι]"
  short: "Διαχείριση λίστας αγνόησης για μηνύματα."
  help: |-
    ADD προσθέτει ένα ψευδώνυμο στη λίστα αγνόησής σας (ή του καναλιού)· DEL
    αφαιρεί· LIST εμφανίζει τη λίστα. Για κανάλια, ADD/DEL απαιτούν MEMOCHANGE.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #βοήθεια Ana"
    - "%command_prefix%IGNORE LIST #βοήθεια"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#channel] <nickname>"
    short: "Προσθήκη ψευδωνύμου στη λίστα αγνόησης."
    help: |-
      Τα μηνύματα από αυτό το ψευδώνυμο δεν θα γίνονται δεκτά στα εισερχόμενά σας (ή
      του καναλιού).
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #βοήθεια Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#channel] <nickname>"
    short: "Αφαίρεση ψευδωνύμου από τη λίστα αγνόησης."
    help: "Αφαιρεί το ψευδώνυμο από τη λίστα αγνόησης."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #βοήθεια Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#channel]"
    short: "Λίστα ψευδωνύμων που αγνοούνται."
    help: "Εμφανίζει τη λίστα των ψευδωνύμων που εσείς (ή το κανάλι) αγνοείτε για μηνύματα."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #βοήθεια"
  added: "Το %nickname% προστέθηκε στη λίστα αγνόησης."
  removed: "Το %nickname% αφαιρέθηκε από τη λίστα αγνόησης."
  already_ignored: "Το %nickname% είναι ήδη στη λίστα αγνόησης."
  not_ignored: "Το %nickname% δεν είναι στη λίστα αγνόησης."
  limit_reached_nick: "Επιτεύχθηκε το όριο λίστας αγνόησης για το ψευδώνυμό σας (μέγιστο %limit%)."
  limit_reached_channel: "Επιτεύχθηκε το όριο λίστας αγνόησης για %channel% (μέγιστο %limit%)."
  list_empty: "Η λίστα αγνόησης είναι κενή."
  list_header: "Λίστα αγνόησης:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#channel]"
  short: "Ενεργοποίηση λήψης μηνυμάτων."
  help: |-
    Ενεργοποιεί τη λήψη μηνυμάτων για το ψευδώνυμό σας ή, για κανάλια, μόνο ο
    ιδρυτής μπορεί να ενεργοποιήσει.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #βοήθεια"
  enabled_nick: "Η υπηρεσία μηνυμάτων ενεργοποιήθηκε για το ψευδώνυμό σας."
  enabled_channel: "Η υπηρεσία μηνυμάτων ενεργοποιήθηκε για το κανάλι %channel%."
  already_enabled_nick: "Η υπηρεσία μηνυμάτων είναι ήδη ενεργοποιημένη για το ψευδώνυμό σας."
  already_enabled_channel: "Η υπηρεσία μηνυμάτων είναι ήδη ενεργοποιημένη για %channel%."
  founder_only: "Μόνο ο ιδρυτής του καναλιού μπορεί να ενεργοποιήσει τα μηνύματα για %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#channel]"
  short: "Απενεργοποίηση λήψης μηνυμάτων."
  help: |-
    Απενεργοποιεί τη λήψη μηνυμάτων για το ψευδώνυμό σας ή το κανάλι. Για κανάλια,
    μόνο ο ιδρυτής μπορεί να απενεργοποιήσει.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #βοήθεια"
  disabled_nick: "Η υπηρεσία μηνυμάτων απενεργοποιήθηκε για το ψευδώνυμό σας."
  disabled_channel: "Η υπηρεσία μηνυμάτων απενεργοποιήθηκε για το κανάλι %channel%."
  already_disabled_nick: "Η υπηρεσία μηνυμάτων είναι ήδη απενεργοποιημένη για το ψευδώνυμό σας."
  already_disabled_channel: "Η υπηρεσία μηνυμάτων είναι ήδη απενεργοποιημένη για %channel%."
  founder_only: "Μόνο ο ιδρυτής του καναλιού μπορεί να απενεργοποιήσει τα μηνύματα για %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [εντολή] [επιλογή]"
  short: "Λίστα εντολών ή βοήθεια για μια εντολή."
  help: "Εμφανίζει τη λίστα εντολών ή αναλυτική βοήθεια για μια εντολή ή επιλογή."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Επιτρέπει την αποστολή και λήψη μηνυμάτων μεταξύ καταχωρημένων χρηστών και την
    αποστολή ειδοποιήσεων σε κανάλια. Τα μηνύματα αποθηκεύονται για να τα διαβάσετε
    αργότερα, ακόμη και αν ο παραλήπτης δεν είναι συνδεδεμένος.
  general_header: "Διαθέσιμες εντολές:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Επιλογές:"
  examples_header: "Παραδείγματα:"
  general_help_command: "HELP <εντολή>"
  option_help_command: "HELP %command% <επιλογή>"
  general_footer: "Χρησιμοποιήστε /msg %bot% %help_command% για περισσότερες πληροφορίες."
  set_sub_footer: "Χρησιμοποιήστε /msg %bot% %help_command% για περισσότερες πληροφορίες."
  syntax_label: "Σύνταξη: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Μηνύματα"
    preferences: "Προτιμήσεις"
  ircop_header: "Διαθέσιμες εντολές για IRC operators:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_received: "Έλαβες νέο μήνυμα από τον χρήστη %sender%. Διάβασέ το με /msg %bot% %list%"
  channel_received: "Έφτασε νέο μήνυμα από τον χρήστη %sender% για το %channel%. Διάβασέ το με /msg %bot% %list%"
  nick_pending: "Έχετε %count% μη αναγνωσμένο(α) μήνυμα(τα). Για λίστα: /msg %bot% %list%"
  channel_pending: "Το κανάλι %channel% έχει %count% μη αναγνωσμένο(α) μήνυμα(τα). Ελέγξτε τα μηνύματα με /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "Το αίτημα εγγραφής για το %channel% έγινε δεκτό."
  rejected: "Το αίτημα εγγραφής για το %channel% απορρίφθηκε."
  reason: "Αιτία: %reason%"
  restriction: "Διαθέσιμο από: %date%"

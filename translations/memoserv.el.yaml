# Μεταφράσεις MemoServ — Ελληνικά
# Τομέας: memoserv
#
# Κωδικοί μορφοποίησης IRC (διπλά εισαγωγικά ή κυριολεκτικά μπλοκ !irc):
#   \x02        ενεργοποίηση/απενεργοποίηση έντονης γραφής
#   \x03NN      χρώμα (ΔΕΚΑΔΙΚΟ: 03=πράσινο, 04=κόκκινο, 07=πορτοκαλί, 14=σκούρο γκρι)
#   \x03        επαναφορά χρώματος
#   \x0F        επαναφορά όλης της μορφοποίησης
#
# Τα χρώματα IRC χρησιμοποιούν ΔΕΚΑΔΙΚΟΥΣ αριθμούς (0-15), όχι δεκαεξαδικούς.
#   \x0314 = σκούρο γκρι (14 δεκαδικό): ΣΩΣΤΟ
#   \x030F = χρώμα 0 και μετά το γράμμα F: ΛΑΘΟΣ
#
# Πολυγραμμικό κείμενο IRC: !irc |- με πραγματικές αλλαγές γραμμής και κενά.
# Τα μπλοκ χωρίς ετικέτα δεν αποκωδικοποιούν διαφυγές· διατηρήστε τα CTCP.
# Παραδείγματα HELP: example/examples και %command_prefix%.
# Ο παρουσιαστής προσθέτει άχρωμο /msg και περιθώριο δύο κενών.

# --- SEND ------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#channel} <message>"
  short: "Αποστολή μηνύματος σε ψευδώνυμο ή κανάλι."
  help: |-
    Στέλνει ένα μήνυμα σε ένα καταχωρημένο ψευδώνυμο ή κανάλι. Ο παραλήπτης πρέπει
    να έχει ενεργοποιήσει την υπηρεσία μηνυμάτων (ENABLE).
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND Άννα Γεια, μπορείς να ελέγξεις το μήνυμα;\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND #βοήθεια Ειδοποίηση για το κανάλι\x03\x0F"
  sent_nick: "\x0303✔\x03 Μήνυμα στάλθηκε στο \x02%nickname%\x02."
  sent_channel: "\x0303✔\x03 Μήνυμα στάλθηκε στο κανάλι \x02%channel%\x02."
  throttled: "\x0304✗\x03 Πρέπει να περιμένετε \x02%seconds%\x02 δευτερόλεπτο(α) πριν στείλετε άλλο μήνυμα."
  limit_reached: "\x0304✗\x03 Επιτεύχθηκε το όριο μηνυμάτων για \x02%target%\x02."
  ignored: "\x0304✗\x03 Δεν μπορείτε να στείλετε μηνύματα σε αυτόν τον παραλήπτη, είστε στη λίστα αγνόησής του."
  cannot_send_to_self: "\x0304✗\x03 Δεν μπορείτε να στείλετε μήνυμα στον εαυτό σας."
  message_too_long: "\x0304✗\x03 Το μήνυμα είναι πολύ μεγάλο. Το μέγιστο είναι \x02%max%\x02 χαρακτήρες."
  service_disabled_for_target: "\x0304✗\x03 Η υπηρεσία μηνυμάτων είναι απενεργοποιημένη για \x02%target%\x02."

# --- READ ------------------------------------------------------------------
read:
  syntax: "READ [#channel] <number>"
  short: "Ανάγνωση μηνύματος με αριθμό."
  help: |-
    Διαβάζει το μήνυμα με τον δοσμένο αριθμό. Χωρίς #channel, διαβάζει από τα
    εισερχόμενά σας. Με #channel, απαιτεί επίπεδο MEMOREAD.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303READ 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303READ #βοήθεια 2\x03\x0F"
  header: "\x02\x0307Μήνυμα #%index%\x03 από \x02%from%\x02:\x0F"
  footer: "\x0314─────────────────────────────\x03 \x0314%date%\x03"
  not_found: "\x0304✗\x03 Το μήνυμα #%index% δεν βρέθηκε."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST [#channel]"
  short: "Λίστα μηνυμάτων (μη αναγνωσμένα σημειώνονται με κόκκινο *)."
  help: |-
    Εμφανίζει τα μηνύματά σας ή τα μηνύματα του καναλιού. Τα μη αναγνωσμένα μηνύματα
    εμφανίζονται με κόκκινο αστερίσκο και προεπισκόπηση (μέγιστο 50 χαρακτήρες).
    Χωρίς #channel = τα εισερχόμενά σας· με #channel απαιτεί MEMOREAD.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST #βοήθεια\x03\x0F"
  header: "\x02\x0307Μηνύματα για %target%\x03:\x0F"
  empty: "\x0307ℹ\x03 Δεν υπάρχουν μηνύματα για \x02%target%\x02."

# --- DEL -------------------------------------------------------------------
del:
  syntax: "DEL [#channel] <number>"
  short: "Διαγραφή μηνύματος με αριθμό."
  help: |-
    Διαγράφει το μήνυμα με τον δοσμένο αριθμό. Για κανάλια απαιτεί επίπεδο
    MEMOCHANGE.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL #βοήθεια 2\x03\x0F"
  deleted: "\x0303✔\x03 Το μήνυμα #%index% διαγράφηκε."
  not_found: "\x0304✗\x03 Το μήνυμα #%index% δεν βρέθηκε."

# --- IGNORE ----------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD|DEL|LIST} [#channel] [nickname]"
  short: "Διαχείριση λίστας αγνόησης για μηνύματα."
  help: |-
    ADD προσθέτει ένα ψευδώνυμο στη λίστα αγνόησής σας (ή του καναλιού)· DEL
    αφαιρεί· LIST εμφανίζει τη λίστα. Για κανάλια, ADD/DEL απαιτούν MEMOCHANGE.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #βοήθεια Ana\x03\x0F"
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #βοήθεια\x03\x0F"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#channel] <nickname>"
    short: "Προσθήκη ψευδωνύμου στη λίστα αγνόησης."
    help: |-
      Τα μηνύματα από αυτό το ψευδώνυμο δεν θα γίνονται δεκτά στα εισερχόμενά σας (ή
      του καναλιού).
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD #βοήθεια Ana\x03\x0F"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#channel] <nickname>"
    short: "Αφαίρεση ψευδωνύμου από τη λίστα αγνόησης."
    help: "Αφαιρεί το ψευδώνυμο από τη λίστα αγνόησης."
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #βοήθεια Ana\x03\x0F"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#channel]"
    short: "Λίστα ψευδωνύμων που αγνοούνται."
    help: "Εμφανίζει τη λίστα των ψευδωνύμων που εσείς (ή το κανάλι) αγνοείτε για μηνύματα."
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #βοήθεια\x03\x0F"
  added: "\x0303✔\x03 Το \x02%nickname%\x02 προστέθηκε στη λίστα αγνόησης."
  removed: "\x0303✔\x03 Το \x02%nickname%\x02 αφαιρέθηκε από τη λίστα αγνόησης."
  already_ignored: "\x0304✗\x03 Το \x02%nickname%\x02 είναι ήδη στη λίστα αγνόησης."
  not_ignored: "\x0304✗\x03 Το \x02%nickname%\x02 δεν είναι στη λίστα αγνόησης."
  limit_reached_nick: "\x0304✗\x03 Επιτεύχθηκε το όριο λίστας αγνόησης για το ψευδώνυμό σας (μέγιστο \x02%limit%\x02)."
  limit_reached_channel: "\x0304✗\x03 Επιτεύχθηκε το όριο λίστας αγνόησης για \x02%channel%\x02 (μέγιστο \x02%limit%\x02)."
  list_empty: "\x0307ℹ\x03 Η λίστα αγνόησης είναι κενή."
  list_header: "\x02\x0307Λίστα αγνόησης:\x03\x0F"

# --- ENABLE ----------------------------------------------------------------
enable:
  syntax: "ENABLE [#channel]"
  short: "Ενεργοποίηση λήψης μηνυμάτων."
  help: |-
    Ενεργοποιεί τη λήψη μηνυμάτων για το ψευδώνυμό σας ή, για κανάλια, μόνο ο
    ιδρυτής μπορεί να ενεργοποιήσει.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE #βοήθεια\x03\x0F"
  enabled_nick: "\x0303✔\x03 Η υπηρεσία μηνυμάτων ενεργοποιήθηκε για το ψευδώνυμό σας."
  enabled_channel: "\x0303✔\x03 Η υπηρεσία μηνυμάτων ενεργοποιήθηκε για το κανάλι \x02%channel%\x02."
  already_enabled_nick: "\x0307ℹ\x03 Η υπηρεσία μηνυμάτων είναι ήδη ενεργοποιημένη για το ψευδώνυμό σας."
  already_enabled_channel: "\x0307ℹ\x03 Η υπηρεσία μηνυμάτων είναι ήδη ενεργοποιημένη για \x02%channel%\x02."
  founder_only: "\x0304✗\x03 Μόνο ο ιδρυτής του καναλιού μπορεί να ενεργοποιήσει τα μηνύματα για \x02%channel%\x02."

# --- DISABLE ---------------------------------------------------------------
disable:
  syntax: "DISABLE [#channel]"
  short: "Απενεργοποίηση λήψης μηνυμάτων."
  help: |-
    Απενεργοποιεί τη λήψη μηνυμάτων για το ψευδώνυμό σας ή το κανάλι. Για κανάλια,
    μόνο ο ιδρυτής μπορεί να απενεργοποιήσει.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE #βοήθεια\x03\x0F"
  disabled_nick: "\x0303✔\x03 Η υπηρεσία μηνυμάτων απενεργοποιήθηκε για το ψευδώνυμό σας."
  disabled_channel: "\x0303✔\x03 Η υπηρεσία μηνυμάτων απενεργοποιήθηκε για το κανάλι \x02%channel%\x02."
  already_disabled_nick: "\x0307ℹ\x03 Η υπηρεσία μηνυμάτων είναι ήδη απενεργοποιημένη για το ψευδώνυμό σας."
  already_disabled_channel: "\x0307ℹ\x03 Η υπηρεσία μηνυμάτων είναι ήδη απενεργοποιημένη για \x02%channel%\x02."
  founder_only: "\x0304✗\x03 Μόνο ο ιδρυτής του καναλιού μπορεί να απενεργοποιήσει τα μηνύματα για \x02%channel%\x02."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [εντολή] [επιλογή]"
  short: "Λίστα εντολών ή βοήθεια για μια εντολή."
  help: "Εμφανίζει τη λίστα εντολών ή αναλυτική βοήθεια για μια εντολή ή επιλογή."
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP IGNORE ADD\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  intro: |-
    Επιτρέπει την αποστολή και λήψη μηνυμάτων μεταξύ καταχωρημένων χρηστών και την
    αποστολή ειδοποιήσεων σε κανάλια. Τα μηνύματα αποθηκεύονται για να τα διαβάσετε
    αργότερα, ακόμη και αν ο παραλήπτης δεν είναι συνδεδεμένος.
  general_header: "\x02 ■ Διαθέσιμες εντολές:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Επιλογές:\x02"
  examples_header: "\x02 ■ Παραδείγματα:\x02"
  general_footer: "\x0310ℹ\x03\x0F Χρησιμοποιήστε /msg %bot% \x02\x0303HELP <εντολή>\x03\x0F για περισσότερες πληροφορίες."
  set_sub_footer: "\x0310ℹ\x03\x0F Χρησιμοποιήστε /msg %bot% \x02\x0303HELP %command% <επιλογή>\x03\x0F για περισσότερες πληροφορίες."
  syntax_label: "Σύνταξη: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    messages: "Μηνύματα"
    preferences: "Προτιμήσεις"
  ircop_header: "\x02 ■ Διαθέσιμες εντολές για IRC operators:\x02"

# --- NOTIFY ----------------------------------------------------------------
notify:
  nick_pending: "Έχετε \x02%count%\x02 μη αναγνωσμένο(α) μήνυμα(τα). Για λίστα: /msg %bot% \x0303LIST\x03"
  channel_pending: "Το κανάλι \x02%channel%\x02 έχει \x02%count%\x02 μη αναγνωσμένο(α) μήνυμα(τα). Ελέγξτε τα μηνύματα με /msg %bot% \x0303LIST %channel%\x03"

# --- CHANNEL REGISTRATION DECISIONS ---
registration_decision:
  accepted: "Το αίτημα εγγραφής για το %channel% έγινε δεκτό."
  rejected: "Το αίτημα εγγραφής για το %channel% απορρίφθηκε."
  reason: "Αιτία: %reason%"
  restriction: "Διαθέσιμο από: %date%"

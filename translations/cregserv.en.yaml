# CReG translations — English
# Domain: cregserv

unknown_command: "\x0304✗\x03 Unknown command \x02%command%\x02. Use \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Incorrect syntax. Usage: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 This command is restricted to IRC Operators."
  not_identified: "\x0304✗\x03 You are not identified. Use \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permission denied. You do not have access to this command."

registra:
  syntax: "REGISTRA <#channel> <description>"
  short: "Request the approval of a channel registration."
  help: "Requests registration of a new channel. A services oper reviews the request and approves or denies it; the channel is only registered once approved. You must be identified with %nickserv%.\n\n\x02#channel:\x02 The channel to register. It must start with #, must not already be registered (check with the ESTADO command), and must be at most 64 characters including the #.\n\n\x02description:\x02 The channel's theme or purpose, up to 255 characters. This is what the oper weighs when reviewing the request.\n\nOnce submitted, the request stays pending until a services oper approves or denies it. You can only send one request every 24 hours."
  example: "/msg CReG REGISTRA #mychannel a place to chat"
  requested: "\x0303✔\x03 You have requested the registration of channel \x02%channel%\x02. A services operator will evaluate the request."
  invalid_channel: "\x0304✗\x03 The channel name must start with \x02#\x02."
  channel_too_long: "\x0304✗\x03 The channel name is too long: at most \x0264\x02 characters including \x02#\x02."
  description_too_long: "\x0304✗\x03 The description is too long: at most \x02255\x02 characters."
  already_registered: "\x0304✗\x03 Channel \x02%channel%\x02 is already registered."
  pending_deletion: "\x0304✗\x03 Channel \x02%channel%\x02 is being deleted and cannot be registered until the deletion completes."
  duplicate: "\x0304✗\x03 A registration request for \x02%channel%\x02 is already waiting for approval. Use \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 The registration of \x02%channel%\x02 was denied."
  throttled: "\x0304✗\x03 You must wait \x02%minutes%\x02 minute(s) before requesting another channel."

estado:
  syntax: "ESTADO <#channel>"
  short: "Show the registration state of a channel."
  help: "Reports where a channel stands in the registration process.\n\nThe possible states are:\n    \x02REGISTERED\x02: the channel is already registered with %chanserv%.\n    \x02IN REVIEW\x02: a registration request is waiting for a services oper to approve or deny it.\n    \x02DENIED\x02: the registration request was denied.\n    \x02BEING DELETED\x02: the channel was dropped and is in its deletion grace period; it cannot be registered again until deletion completes.\n    \x02NO PROCESS\x02: the channel has no registration process."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 Channel \x02%channel%\x02 is already registered."
  pending_deletion: "\x0304✗\x03 Channel \x02%channel%\x02 is being deleted and cannot be registered until the deletion completes."
  pending: "\x0303◌\x03 Channel \x02%channel%\x02 is in process, waiting for a services operator to review it (requested %date%)."
  denied: "\x0304✗\x03 Channel \x02%channel%\x02 was denied on %date%. Reason: %reason%"
  no_request: "\x0304✗\x03 Channel \x02%channel%\x02 has no registration process."

cancel:
  syntax: "CANCEL <#channel>"
  short: "Cancel your pending registration request for a channel."
  help: "Cancels a channel registration request that has not yet been approved or denied. You can only cancel your own pending requests.\n\n\x02#channel:\x02 The channel whose request you want to cancel. The request must be one you submitted and that is still pending.\n\nOnce cancelled, the request is removed and the channel name is freed."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 Your registration request for channel \x02%channel%\x02 has been cancelled and the channel name is free again."
  invalid_channel: "\x0304✗\x03 The channel name must start with \x02#\x02."
  no_request: "\x0304✗\x03 Channel \x02%channel%\x02 has no registration process."
  not_yours: "\x0304✗\x03 The registration request of \x02%channel%\x02 does not belong to you."
  not_pending: "\x0304✗\x03 The registration request of \x02%channel%\x02 was already approved or denied and cannot be cancelled."

aprobar:
  syntax: "APROBAR <#channel>"
  short: "Approve a pending channel registration request."
  help: "Registers a channel whose registration request is waiting for review. The channel is registered to the user who requested it; neither of you needs to be inside it. You need the \x02cregserv.aprobar\x02 permission.\n\n\x02#channel:\x02 The channel with the pending request. Use PENDIENTES to see the queue.\n\nOnce approved, the channel is registered with \x02%chanserv%\x02 and the request is closed."
  example: "/msg CReG APROBAR #mychannel"
  approved: "\x0303✔\x03 Channel \x02%channel%\x02 has been correctly registered for \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 The channel name must start with \x02#\x02."
  no_pending: "\x0304✗\x03 Channel \x02%channel%\x02 is not in a registration process."
  already_registered: "\x0304✗\x03 Channel \x02%channel%\x02 is already registered with \x02%chanserv%\x02."
  already_approved: "\x0304✗\x03 Channel \x02%channel%\x02 is already registered."
  already_denied: "\x0304✗\x03 Channel \x02%channel%\x02 cannot be registered because it is marked as \x0304DENIED\x03."
  failed: "\x0304✗\x03 The registration of channel \x02%channel%\x02 could not be completed."

denegar:
  syntax: "DENEGAR <#channel> <reason>"
  short: "Deny a pending channel registration request."
  help: "Denies a registration request, keeping the channel name free. The reason is mandatory and is shown by DENEGADOS. You need the \x02cregserv.denegar\x02 permission.\n\n\x02#channel:\x02 The channel with the pending request.\n\x02reason:\x02 Why the request is denied; it is stored and shown to anyone checking DENEGADOS.\n\nThe channel name becomes free to request again once denied."
  example: "/msg CReG DENEGAR #mychannel off-topic"
  denied: "\x0303✔\x03 The registration of channel \x02%channel%\x02 has been denied."
  invalid_channel: "\x0304✗\x03 The channel name must start with \x02#\x02."
  no_pending: "\x0304✗\x03 Channel \x02%channel%\x02 has no registration process."
  already_approved: "\x0304✗\x03 Already registered and approved channels cannot be denied."
  already_denied: "\x0304✗\x03 Channel \x02%channel%\x02 is already denied."

pendientes:
  syntax: "PENDIENTES"
  short: "List the channel registration requests waiting for review."
  help: "Lists every registration request waiting for a services oper to evaluate, showing the channel, who requested it, the date and the description. You need the \x02cregserv.pendientes\x02 permission.\n\nThis command takes no parameters."
  example: "/msg CReG PENDIENTES"
  empty: "There are no channels waiting for review."
  line: "\x02Channel:\x02 %channel%, \x02Requested by:\x02 %requester%, \x02Date:\x02 %date%, \x02Description:\x02 %description%"
  end: "End of the list."

denegados:
  syntax: "DENEGADOS"
  short: "List the channel registration requests that were denied."
  help: "Lists every denied registration request together with the reason it was denied. You need the \x02cregserv.denegados\x02 permission.\n\nThis command takes no parameters."
  example: "/msg CReG DENEGADOS"
  empty: "There are no denied channels."
  line: "\x02Channel:\x02 %channel%, \x02Reason:\x02 %reason%"
  end: "End of the list."

drop:
  syntax: "DROP <#channel>"
  short: "Remove the registration record \x02%bot%\x02 keeps for a channel."
  help: "Removes the registration record \x02%bot%\x02 keeps for a channel and, if the channel is registered there, also drops it from \x02%chanserv%\x02. You need the \x02cregserv.drop\x02 permission.\n\n\x02#channel:\x02 The channel to remove.\n\nThe \x02%chanserv%\x02 drop is a soft drop: the channel enters a deletion grace period instead of being deleted immediately."
  example: "/msg CReG DROP #mychannel"
  dropped: "\x0303✔\x03 The registration record of channel \x02%channel%\x02 has been removed from \x02%bot%\x02."
  dropped_channel: "\x0303✔\x03 Channel \x02%channel%\x02 has been dropped and now enters the deletion grace period."
  invalid_channel: "\x0304✗\x03 The channel name must start with \x02#\x02."
  no_request: "\x0304✗\x03 The channel \x02%channel%\x02 is not recorded with \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#channel> [description]"
  short: "Register a channel without being in it."
  help: "Registers a channel at staff request, without going through the request-and-approval flow. You do not need to be inside the channel and it does not need to exist yet. You need the \x02cregserv.saregister\x02 permission.\n\n\x02#channel:\x02 The channel to register.\n\x02description:\x02 Optional description stored with the registration."
  example: "/msg CReG SAREGISTER #mychannel a staff channel"
  done: "\x0303✔\x03 Channel \x02%channel%\x02 has been registered."
  invalid_channel: "\x0304✗\x03 The channel name must start with \x02#\x02."
  pending_deletion: "\x0304✗\x03 Channel \x02%channel%\x02 is pending deletion and cannot be registered."
  already_registered: "\x0304✗\x03 Channel \x02%channel%\x02 is already registered."
  failed: "\x0304✗\x03 The registration of channel \x02%channel%\x02 could not be completed."


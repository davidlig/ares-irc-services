# CReG translations — English
# Domain: cregserv

unknown_command: "\x0304✗\x03 Unknown command \x02%command%\x02. Use \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Incorrect syntax. Usage: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 This command is restricted to IRC Operators."
  not_identified: "\x0304✗\x03 You are not identified. Use \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permission denied. You do not have access to this command."

registra:
  syntax: "REGISTRA <#channel> <description>"
  short: "Request the approval of a channel registration."
  help: "Ask for a channel to be registered. A services operator evaluates the request and approves or denies it; the channel is only registered once approved. You must be identified with %nickserv%."
  requested: "\x0303✔\x03 You have requested the registration of channel \x02%channel%\x02. A services operator will evaluate the request."
  invalid_channel: "\x0304✗\x03 The channel name must start with \x02#\x02."
  channel_too_long: "\x0304✗\x03 The channel name is too long: at most \x0264\x02 characters including \x02#\x02."
  description_too_long: "\x0304✗\x03 The description is too long: at most \x02255\x02 characters."
  already_registered: "\x0304✗\x03 Channel \x02%channel%\x02 is already registered."
  duplicate: "\x0304✗\x03 A registration request for \x02%channel%\x02 is already waiting for approval. Use \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 The registration of \x02%channel%\x02 was denied."
  throttled: "\x0304✗\x03 You must wait \x02%minutes%\x02 minute(s) before requesting another channel."

estado:
  syntax: "ESTADO <#channel>"
  short: "Show the registration state of a channel."
  help: "Report where a channel stands in the registration workflow: registered, in process or denied."
  registered: "\x0303✔\x03 Channel \x02%channel%\x02 is already registered."
  pending: "\x0303◌\x03 Channel \x02%channel%\x02 is in process, waiting for a services operator to review it (requested %date%)."
  denied: "\x0304✗\x03 Channel \x02%channel%\x02 was denied on %date%. Reason: %reason%"
  no_request: "\x0304✗\x03 Channel \x02%channel%\x02 has no registration process."

aprobar:
  syntax: "APROBAR <#channel>"
  short: "Approve a pending channel registration request."
  help: "Register a channel whose request is waiting for review. The channel is registered for the user who requested it; neither of you has to be in it. You need the \x02cregserv.aprobar\x02 permission."
  approved: "\x0303✔\x03 Channel \x02%channel%\x02 has been correctly registered for \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 The channel name must start with \x02#\x02."
  no_pending: "\x0304✗\x03 Channel \x02%channel%\x02 is not in a registration process."
  already_registered: "\x0304✗\x03 Channel \x02%channel%\x02 is already registered with \x02ChanServ\x02."
  already_approved: "\x0304✗\x03 Channel \x02%channel%\x02 is already registered."
  already_denied: "\x0304✗\x03 Channel \x02%channel%\x02 cannot be registered because it is marked as \x0304DENIED\x03."
  failed: "\x0304✗\x03 The registration of channel \x02%channel%\x02 could not be completed."

denegar:
  syntax: "DENEGAR <#channel> <reason>"
  short: "Deny a pending channel registration request."
  help: "Refuse a registration request, keeping the channel name free. The reason is mandatory and is shown by DENEGADOS. You need the \x02cregserv.denegar\x02 permission."
  denied: "\x0303✔\x03 The registration of channel \x02%channel%\x02 has been denied."
  invalid_channel: "\x0304✗\x03 The channel name must start with \x02#\x02."
  no_pending: "\x0304✗\x03 Channel \x02%channel%\x02 has no registration process."
  already_approved: "\x0304✗\x03 Already registered and approved channels cannot be denied."
  already_denied: "\x0304✗\x03 Channel \x02%channel%\x02 is already denied."

unknown_command: "\x0304✗\x03 Onbekend commando \x02%command%\x02. Gebruik \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Onjuiste syntax. Gebruik: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Dit commando is voorbehouden aan IRC-operatoren."
  not_identified: "\x0304✗\x03 Je bent niet geïdentificeerd. Gebruik \x0303/msg %nickserv% IDENTIFY\x03."

# MemoServ translations — English
# Domain: memoserv
#
# IRC formatting codes (double-quoted strings or !irc literal blocks):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=green, 04=red, 07=orange, 14=dark gray)
#   \x03        reset color
#   \x0F        reset all formatting
#
# IRC colors use DECIMAL numbers (0-15), not hexadecimal.
#   \x0314 = dark gray (14 decimal): CORRECT
#   \x030F = color 0 followed by the letter F: ERROR
#
# Multiline IRC text: !irc |- with physical newlines and real spaces.
# Untagged blocks do not decode escapes; preserve CTCP literals.
# HELP examples: example/examples and %command_prefix%.
# The presenter adds the uncolored /msg prefix and a two-space margin.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#channel} <message>"
  short: "Send a message to a nickname or channel."
  help: |-
    Sends a message to a registered nickname or channel. The recipient must have
    the memo service enabled (ENABLE).
  example: "%command_prefix%SEND Ana Hi, can you check the memo?"
  examples:
    - "%command_prefix%SEND #help Notice for the channel"
  sent_nick: "Message sent to %nickname%."
  sent_channel: "Message sent to channel %channel%."
  throttled: "You must wait %seconds% second(s) before sending another message."
  limit_reached: "Message limit reached for %target%."
  ignored: "You cannot send messages to this target, you are on their ignore list."
  cannot_send_to_self: "You cannot send a message to yourself."
  message_too_long: "Message too long. Maximum is %max% characters."
  service_disabled_for_target: "Message service is disabled for %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#channel] <number>"
  short: "Read a message by number."
  help: |-
    Reads the message with the given number. Without #channel, reads your nickname
    inbox. With #channel, requires MEMOREAD access.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #help 2"
  header: "Message #%index% from %from%:"
  footer: "%separator% %date%"
  not_found: "Message #%index% not found."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#channel]"
  short: "List messages (unread marked with red *)."
  help: |-
    Lists your messages or those of a channel. Unread messages have a red asterisk
    and a preview (up to 50 characters). Without #channel, lists your inbox; with
    #channel, requires MEMOREAD access.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #help"
  header: "Messages for %target%:"
  empty: "No messages for %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#channel] {number|ALL}"
  short: "Delete a message by number."
  help: |-
    Deletes a message by number, or use ALL to empty the inbox. Channel deletion
    requires MEMOCHANGE.
  example: "%command_prefix%DEL ALL"
  examples:
    - "%command_prefix%DEL 1"
    - "%command_prefix%DEL #help 2"
    - "%command_prefix%DEL #help ALL"
  deleted: "Message #%index% deleted."
  not_found: "Message #%index% not found."
  all_deleted: "All messages in this inbox have been deleted."
  none_to_delete: "There are no messages to delete."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#channel] <nickname>|DEL [#channel] <nickname>|LIST [#channel]}"
  short: "Manage ignore list for messages."
  help: |-
    Manages the nicknames whose messages you do not want to receive, both for your
    account and for a registered channel. Changing a channel list requires the
    MEMOCHANGE permission.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #help Ana"
    - "%command_prefix%IGNORE LIST #help"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#channel] <nickname>"
    short: "Adds a nickname to the ignore list."
    help: |-
      Messages from this nickname will not be accepted for your inbox (or the
      channel's).
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #help Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#channel] <nickname>"
    short: "Removes a nickname from the list."
    help: "Removes the nickname from the ignore list."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #help Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#channel]"
    short: "Shows ignored nicknames."
    help: "Shows the list of nicknames you (or the channel) ignore for messages."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #help"
  added: "%nickname% added to ignore list."
  removed: "%nickname% removed from ignore list."
  already_ignored: "%nickname% is already on the ignore list."
  not_ignored: "%nickname% is not on the ignore list."
  limit_reached_nick: "Ignore list limit reached for your nickname (max %limit%)."
  limit_reached_channel: "Ignore list limit reached for %channel% (max %limit%)."
  list_empty: "Ignore list is empty."
  list_header: "Ignore list:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#channel]"
  short: "Enable message reception."
  help: |-
    Enables receiving messages for your nickname or channel. Only the founder
    can enable it for a channel.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #help"
  enabled_nick: "Message service enabled for your nickname."
  enabled_channel: "Message service enabled for channel %channel%."
  already_enabled_nick: "Message service is already enabled for your nickname."
  already_enabled_channel: "Message service is already enabled for %channel%."
  founder_only: "Only the channel founder can enable messages for %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#channel]"
  short: "Disable message reception."
  help: |-
    Disables receiving messages for your nickname or channel. Only the founder
    can disable it for a channel.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #help"
  disabled_nick: "Message service disabled for your nickname."
  disabled_channel: "Message service disabled for channel %channel%."
  already_disabled_nick: "Message service is already disabled for your nickname."
  already_disabled_channel: "Message service is already disabled for %channel%."
  founder_only: "Only the channel founder can disable messages for %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [command] [option]"
  short: "List commands or show help for a command."
  help: "Shows the command list or detailed help for a command or option."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Lets registered users exchange messages and send notices to channels.
    Messages are saved for later reading, even when the recipient is offline.
  general_header: "Available commands:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Options:"
  examples_header: "Examples:"
  general_help_command: "HELP <command>"
  option_help_command: "HELP %command% <option>"
  general_footer: "Use /msg %bot% %help_command% for more information."
  set_sub_footer: "Use /msg %bot% %help_command% for more information."
  syntax_label: "Syntax: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Messages"
    preferences: "Preferences"
  ircop_header: "Available commands for IRC Operators:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_received: "You received a new memo from %sender%. Read it with /msg %bot% %list%"
  channel_received: "A new memo from %sender% has arrived for %channel%. Read it with /msg %bot% %list%"
  nick_pending: "You have %count% unread message(s). To list them: /msg %bot% %list%"
  channel_pending: "Channel %channel% has %count% unread message(s). Read them with /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "Your registration request for %channel% was accepted."
  rejected: "Your registration request for %channel% was rejected."
  reason: "Reason: %reason%"
  restriction: "Available from: %date%"

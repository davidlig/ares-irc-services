# OperServ translations — English
# Domain: operserv
#
# IRC formatting codes (double-quoted strings or !irc literal blocks):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=green, 04=red, 07=orange, 14=dark gray)
#   \x03        reset color
#   \x0F        reset all formatting
#
# IRC colors use DECIMAL numbers (0-15), not hexadecimal.
#   \x0314 = dark gray (14 decimal): CORRECT
#   \x030F = color 0 followed by the letter F: ERROR
#
# Multiline IRC text: !irc |- with physical newlines and real spaces.
# Untagged blocks do not decode escapes; preserve CTCP literals.
# HELP examples: example/examples and %command_prefix%.
# The presenter adds the uncolored /msg prefix and a two-space margin.

# --- ERROR --------------------------------------------------------------------
error:
  root_only: "This command is restricted to network root administrators."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [command] [option]"
  short: "List commands or show help for a command."
  help: |-
    Without arguments, lists all commands. Use %help_command% for full help,
    or %help_option_command% for sub-options.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Lets you manage network operators and their permissions, apply access
    restrictions and disconnect users. You can also send network-wide
    announcements and manage network welcome messages.
  general_header: "Available commands:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Options:"
  examples_header: "Ejemplos:"
  general_help_command: "HELP <command>"
  option_help_command: "HELP %command% <option>"
  detail_help_command: "HELP <command>"
  detail_help_option_command: "HELP <command> <option>"
  general_footer: "Use /msg %bot% %help_command% for more information."
  set_sub_footer: "Use /msg %bot% %help_command% for more information."
  syntax_label: "Syntax: %syntax%"
  footer: ""
  intro_expiration: "NOTE: Nicknames unused for more than %days% days are automatically removed."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operators and roles"
    network_security: "Network security"
    communication: "Communication"
    low_level: "Low level"
  ircop_header: "Available commands for IRC Operators:"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax: "IRCOP <option> [parameters]"
  short: "Manage network IRC operators."
  help: |-
    Manage network IRC operators. ADD adds a registered nickname
    as an operator with the specified role.
    DEL removes an operator. LIST shows all operators.
    Use ROLE LIST to see available roles.
    This command is restricted to Root users configured in services.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Unknown subcommand %sub%. Use ADD, DEL, or LIST."
  unknown_role: "Role %role% does not exist. Use /msg %bot% %role_list% to see available roles."
  already_admin: "%nickname% is already an IRC operator (role: %role%)."
  not_admin: "%nickname% is not an IRC operator."
  role_changed: "Changed role for %nickname% from %old% to %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nickname> <role>"
    short: "Add a network IRC operator."
    help: |-
      Adds a registered nickname as a network IRC operator.
      Use ROLE LIST to see available roles.
      This command is restricted to Root users.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "Added %nickname% as %role%."
    nick_not_active: "Nickname %nickname% is not an active registered nickname."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nickname>"
    short: "Remove a network IRC operator."
    help: |-
      Removes a network IRC operator from the list.
      This command is restricted to Root users.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "Removed %nickname% from IRC operators."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "List all network IRC operators."
    help: |-
      Lists all network IRC operators with their roles and registration date.
      This command is restricted to Root users.
    example: "%command_prefix%IRCOP LIST"
    header: "Network IRC Operators"
    empty: "There are no IRC operators."

# --- ROLE ---------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <role>|SET <role> [operclass]}"
    short: "Configures the UnrealIRCd operator class."
    help: |-
      Views and configures the operclass of a role.

      %options_header%
      %option_LIST%Shows the operclasses available on the network.
      %option_VIEW%Shows the role operclass and available classes.
      %option_SET%Assigns the operclass to IRCOPs on identification.

      Omit the value to remove it.

      Available only with UnrealIRCd protocols.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SUPPORT"
      - "%command_prefix%ROLE OPERCLASS SET SUPPORT services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SUPPORT"
    list:
      header: "Available Operclasses on the Network"
      empty: "There are no operclasses available on the network."
      not_supported: "The current protocol does not support listing available operclasses."
    view:
      empty: "Role %role% has no assigned operclass."
      line: "Operclass: %operclass%"
      available: "Available operclasses: %available%"
    set:
      done: "Operclass configured for role %role%."
      cleared: "Operclass removed from role %role%."
      not_available: "Operclass %operclass% is not available on the network. Available operclasses: %available%."
  syntax: "ROLE <option> [parameters]"
  short: "Manages operator roles, their permissions and their settings."
  help: |-
    Manages operator roles, their permissions and their settings.

    The ADMIN, OPER and PREOPER roles are protected and cannot be deleted.
    Restricted to Root users.
  syntax_operclass: "ROLE <option> [parameters]"
  help_operclass: |-
    Manages operator roles, their permissions and their settings.

    The ADMIN, OPER and PREOPER roles are protected and cannot be deleted.
    Restricted to Root users.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SUPPORT Support operators"
  unknown_sub: "Unknown subcommand %sub%. Use ADD, DEL, LIST, PERMS, MODES, or VHOST."
  unknown_sub_operclass: "Unknown subcommand %sub%. Use ADD, DEL, LIST, PERMS, MODES, VHOST, or OPERCLASS."
  not_found: "Role %role% does not exist."
  already_exists: "Role %role% already exists."
  protected: "Role %role% is protected and cannot be deleted."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <name> [description]"
    short: "Create a new role."
    help: |-
      Creates a new custom role. Description is optional.
      This command is restricted to Root users.
    example: "%command_prefix%ROLE ADD SUPPORT Support operators"
    done: "Created role %role%."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <name>"
    short: "Delete a role."
    help: |-
      Deletes a custom role. Protected roles (ADMIN, OPER, PREOPER)
      cannot be deleted. If the role has operators assigned,
      you must reassign them first.
      This command is restricted to Root users.
    example: "%command_prefix%ROLE DEL SUPPORT"
    done: "Deleted role %role%."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Shows available roles."
    help: |-
      Lists all roles. Protected roles are marked with [PROTECTED].
      This command is restricted to Root users.
    example: "%command_prefix%ROLE LIST"
    header: "Operator Roles"
    empty: "There are no operator roles."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <role> <permission>|{LIST|CLEAR} <role>}"
    short: "Manages role permissions."
    help: |-
      Manages the permissions assigned to a role.

      %options_header%
      %option_LIST%Shows all available permissions and indicates which ones are
                      assigned to the role.
      %option_ADD%Assigns a permission to the role.
      %option_DEL%Removes a permission from the role (not for protected roles).
      %option_CLEAR%Removes all role permissions.

      %assigned_status% means assigned; %unassigned_status% means available.

      Use ALL to add all available permissions at once.
      Restricted to Root users.
    example: "%command_prefix%ROLE PERMS LIST SUPPORT"
    examples:
      - "%command_prefix%ROLE PERMS ADD SUPPORT operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SUPPORT ALL"
      - "%command_prefix%ROLE PERMS DEL SUPPORT operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SUPPORT"
    not_found: "Permission %perm% does not exist."
    already_has: "Role %role% already has permission %perm%."
    does_not_have: "Role %role% does not have permission %perm%."
    list:
      header: "Permission list for %role%"
      columns: "Assigned | Permission key | Description"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Added permission %perm% to role %role%."
      all_done: "Added %count% permissions to role %role%."
    del:
      done: "Removed permission %perm% from role %role%."
    clear:
      done: "Removed %count% permissions from role %role%."
      empty: "Role %role% has no permissions assigned."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <role>|SET <role> [modes]}"
    short: "Configures the role user modes."
    help: |-
      Manages the IRCOP user modes assigned to a role.

      %options_header%
      %option_VIEW%Shows the current role modes.
      %option_SET%Sets IRCOP modes.

      Omit the modes to remove them all.

      Users with this role receive these modes on identification.
      Available modes by IRCd
      Restricted to Root users.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Modes for %role%"
      empty: "The role %role% has no modes assigned."
      line: "Modes: %modes%"
    set:
      done: "Set modes %modes% for role %role%."
      cleared: "Removed all modes from role %role%."
      invalid_mode: "The mode %mode% is not a valid IRCOP mode."
      invalid_modes: "Invalid modes: %invalid%. Valid modes: %valid%."
      no_irc_user_modes: "The current IRCD has no IRCOP modes configured."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <role>|SET <role> [vhost]}"
    short: "Configures the role virtual host pattern."
    help: |-
      Configures the virtual host assigned to operators of a role on identification,
      replacing their personal host.

      The host is generated by combining the nickname, without special characters,
      with the configured pattern. For example:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Shows the pattern configured for a role.
      %option_SET%Sets or removes the pattern for a role.

      The pattern allows only letters, digits, hyphens and dots. It must contain
      at least one dot, must not start or end with a hyphen or dot, and must not
      contain consecutive dots.

      To remove the forced host, use SET without a pattern.

      Restricted to Root users.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Forced vhost for %role%"
      empty: "The role %role% has no forced vhost pattern set."
      line: "Pattern: %pattern%"
      example: "Example: %example_nickname%.%pattern%"
      example_nickname: "nickname"
    set:
      done: "Set forced vhost pattern for role %role%."
      cleared: "Removed forced vhost pattern from role %role%."
      invalid: "Invalid vhost pattern. Valid characters: a-z, A-Z, 0-9, - and .. Must have at least one dot, cannot start/end with - or . or have .."

# --- KILL ---------------------------------------------------------------------
kill:
  syntax: "KILL <nickname> <reason>"
  short: "Forcefully disconnect a user from the network."
  help: |-
    Disconnects a user from the IRC network.
    IRC operators and Root users cannot be killed.
  example: "%command_prefix%KILL BadUser Channel flooding"
  protected_root: "Cannot kill Root user %nickname%."
  protected_ircop: "Cannot kill IRC operator %nickname%."
  done: "User %nickname% has been killed (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax: "GLINE <option> [parameters]"
  short: "Manage network-wide G-lines."
  help: |-
    Manages network G-lines (global bans).
    ADD adds a new G-line with a mask, expiry and reason.
    DEL removes a G-line by mask or entry number.
    LIST shows all G-lines, optionally filtered by mask.

    Expiry format: 0=permanent, or use suffix d, h, m (e.g. 7d, 12h, 30m).
    G-lines matching Root users or IRC operators are rejected.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spam abuse"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Persistent abuse"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Unknown subcommand %sub%. Use ADD, DEL, or LIST."
  invalid_mask: "Invalid mask format. Must be in format user@host (e.g., *@192.168.*)."
  global_mask: "G-line mask %mask% is too broad. Global masks are not allowed."
  dangerous_mask: "G-line mask %mask% is too broad. Host part needs at least 4 alphanumeric characters."
  protected_user: "Cannot G-line protected user %nickname%."
  invalid_expiry: "Invalid expiry format. Use 0 for permanent, or a value like 7d, 12h, 30m."
  already_exists: "G-line for %mask% already exists."
  max_entries: "Maximum number of G-lines (%max%) reached."
  not_found: "G-line %mask% not found."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <mask> <expiry> <reason>"
    short: "Add a network-wide G-line."
    help: |-
      Adds a network G-line (global ban).
      The mask must use the user@host format.
      Expiry: 0=permanent, or use suffix d, h, m (e.g. 7d, 12h, 30m).
      G-lines matching Root users or IRC operators are rejected.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spam abuse"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Persistent abuse"
    done: "G-line added: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<mask>|<number>}"
    short: "Remove a G-line."
    help: |-
      Removes a G-line from the list.
      You can specify its mask or its entry number from LIST.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% removed."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [mask]"
    short: "List all G-lines."
    help: "Lists all G-lines. Optionally filters by mask pattern."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-lines (%count%)"
    empty: "There are no G-lines."
    entry: "%index%. %mask% - %reason% (%nickname%, expires: %expiration%)"

# --- BADMAIL ------------------------------------------------------------------
badmail:
  syntax: "BADMAIL <option> [parameters]"
  short: "Manage blocked email domains."
  help: |-
    Manage blocked email domains.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <domain> <reason>"
    short: "Block a domain."
    help: |-
      Accepts ASCII or punycode domains, not addresses or patterns. A reason
      is required. Blocking is exact and does not include subdomains.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {number|ALL}"
    short: "Remove blocked domains."
    help: |-
      Delete a permanent identifier, or ALL entries. Other identifiers do
      not change.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <pattern> [page]"
    short: "List blocked domains."
    help: |-
      The pattern is required. Only * is a wildcard, matching any sequence.
      Matching ignores case. The optional page starts at 1. Filtering and
      pages preserve permanent identifiers.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Invalid domain. Use an ASCII or punycode domain without a trailing dot."
  invalid_reason: "A nonblank, single-line administrative reason is required."
  duplicate: "This domain is already blocked."
  not_found: "No blocked domain has that identifier."
  added: "Blocked domain %domain%."
  deleted: "Removed blocked domain %id%."
  cleared: "Removed %total% blocked domains."
  empty: "No blocked domains match."
  header: "ID | Domain | Reason"
  page: "Page %page%/%pages%, %total% matching domains."
  row: "%id% | %domain% | %reason%"

# --- GLOBAL -------------------------------------------------------------------
global:
  syntax: "GLOBAL {service|nick!ident@vhost} {PRIVMSG|NOTICE} <message>"
  short: "Send a global message to all connected users."
  help: |-
    Sends messages to all connected users through an existing service or a
    temporary client with a custom identity.

    Messages can be sent as PRIVMSG (private message) or NOTICE (notice).

    To use a temporary client, specify a mask in nickname!ident@vhost format,
    using valid characters for each field.

    The nickname must not be registered or in use. The client disconnects
    automatically after sending, and its nickname is blocked for 24 hours.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Maintenance in 10 minutes"
  examples:
    - "%command_prefix%GLOBAL Notices!oper@services.ares NOTICE The network will restart"
  mask_invalid: "Invalid mask format: %error%"
  nick_connected: "Nickname %nickname% is currently connected."
  nick_registered: "Nickname %nickname% is registered."
  type_invalid: "Message type must be PRIVMSG or NOTICE."
  done: "Global message sent from %nickname% to %count% users."

# --- MOTD ---------------------------------------------------------------------
motd:
  short: "Manage connect MOTD messages sent to users on connect."
  syntax: "MOTD <option> [parameters]"
  help: |-
    Manages message-of-the-day (MOTD) entries sent when a user connects to the
    network.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Unknown subcommand. Use: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <expiry> <message>"
    syntax_hint: "Usage: %syntax%"
    short: "Add a MOTD entry."
    help: |-
      Adds a new MOTD message to be sent to each user when they connect to the
      network.
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Maintenance tonight"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Welcome to the network"
    done: "MOTD entry #%id% added."
    invalid_type: "Invalid message type. Must be PRIVMSG or NOTICE."
    invalid_expiry: "Invalid expiry format. Use: <number><s|m|h|d> or 0 for indefinite (e.g. 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Usage: %syntax%"
    short: "Delete a MOTD entry."
    help: "Removes a MOTD entry by its ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "MOTD entry #%id% deleted."
    not_found: "MOTD entry not found."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "List all MOTD entries."
    help: "Lists all configured MOTD entries."
    example: "%command_prefix%MOTD LIST"
    empty: "No MOTD entries configured."
    header: "MOTD entries:"
    status_enabled: "enabled"
    status_disabled: "disabled"
    expired: "expired"
    no_bot: "(no bot)"
    shown_count: "shown %count% times"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Remove all expired MOTD entries."
    help: "Removes all MOTD entries whose expiry time has passed."
    example: "%command_prefix%MOTD CLEAN"
    done: "Removed %count% expired MOTD entries."
    none: "No expired MOTD entries to remove."
  debug:
    finalized: "MOTD message #%id% has ended: [%type%] %message% | %date% | %shown_count%"

# --- RAW ----------------------------------------------------------------------
raw:
  syntax: "RAW <line>"
  short: "Send a raw protocol line to the IRCd."
  help: |-
    Sends the given line directly to the linked IRCd socket.
    Use with extreme caution. Invalid protocol lines can disrupt the network.
  example: "%command_prefix%RAW :services.ares NOTICE * :Scheduled maintenance"
  empty: "You must specify a non-empty line to send."
  too_long: "Line is too long. Maximum 510 characters."
  not_connected: "Not connected to IRCd."
  done: "Raw line sent."
  protocol:
    syntax: "The active protocol rejected the RAW command syntax."
    done: "Protocol-owned RAW command executed."
    target: "The active protocol rejected target %target%."
    unsupported: "The active protocol does not support this RAW command."
    invalid_resource_type: "Unknown protocol resource type: %resource_type%."
    invalid_resource: "Invalid protocol resource: %resource%."
    invalid_value: "Invalid value for protocol resource: %resource%."
    error: "The active protocol could not execute the RAW command."

# --- DEBUG --------------------------------------------------------------------
debug:
  action_global: "%operator% executes command GLOBAL with nickname %target% via %type% to %count% users. Message: %message%"
  prefix_message: "Message: %reason%"

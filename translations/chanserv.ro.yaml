# --- LEVEL FOUNDER ---------------------------------------------------------
level_founder:
  short: "Permite operațiuni care necesită nivelul de fondator al canalului."

# --- CLEARACCESS -----------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#canal>"
  example: "%command_prefix%\x02\x0303CLEARACCESS #canal\x03\x0F"
  short: "Ștergeți întreaga listă de acces a unui canal."
  help: "Elimină toate intrările de acces ale canalului. Acțiunea este ireversibilă."
  success: "\x0303✔\x03 S-au șters \x02%count%\x02 intrări de acces din \x02%channel%\x02."
  empty: "\x0307ℹ\x03 Canalul \x02%channel%\x02 nu are intrări de acces."

# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#canal> [motiv]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #canal\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #canal inundare\x03\x0F"
  short: "Eliminați prin kick toți utilizatorii dintr-un canal."
  help: |-
    Evacuează toți utilizatorii de pe canal. Comanda este rezervată IRCop; dacă
    nu se indică un motiv, se folosește unul implicit.
  not_on_network: "\x0304✗\x03 Canalul \x02%channel%\x02 nu se află în prezent în rețea."
  empty: "\x0307ℹ\x03 Canalul \x02%channel%\x02 nu are utilizatori cărora să li se dea kick."
  success: "\x0303✔\x03 S-a dat kick la \x02%count%\x02 utilizator(i) din \x02%channel%\x02."
  default_reason: "Comanda CLEARUSERS"

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <model> [pagină]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "Listează canalele înregistrate care corespund unui model."
  help: |-
    Listează canalele înregistrate care corespund tiparului. Caracterul * reprezintă
     orice secvență de caractere. Pagina este opțională și începe de la 1.
  header: "Canal | Fondator | Înregistrare | Ultima utilizare | Stare"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Niciun canal nu corespunde modelului %pattern%."
  status_pending_registration: "Aprobare în așteptare"
  status_rejected_registration: "Înregistrare respinsă"
  status_active: "Activ"

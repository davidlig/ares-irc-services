levels:
  syntax: "LEVELS <#canal> {LIST|SET|RESET} [nivel] [valoare]"
  example: "%command_prefix%\x02\x0303LEVELS #canal LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #canal SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #canal RESET\x03\x0F"
  short: "Configurați nivelurile canalului."
  help: |-
    Configurează nivelurile minime de acces pentru acțiunile canalului. Numai
    fondatorul poate modifica sau reseta nivelurile.
  unknown_sub: "\x0304✗\x03 Subcomandă necunoscută \x02%sub%\x02. Folosiți LIST, SET sau RESET."

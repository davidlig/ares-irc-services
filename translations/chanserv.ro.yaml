# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <#canal> {FOUNDER <poreclă> [token]|SUCCESSOR [poreclă]|DESC <descriere>|URL [url]|EMAIL [e-mail]|ENTRYMSG [mesaj]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%SET #canal DESC Un canal comunitar"
  examples:
    - "%command_prefix%SET #canal URL https://example.test"
    - "%command_prefix%SET #canal MLOCK ON"
  short: "Modificați opțiunile canalului."
  help: |-
    Modifică o opțiune a canalului. Ajutorul fiecărei opțiuni explică cerințele și
    variantele disponibile.
  unknown_option: "Opțiune necunoscută %option%. Folosiți una dintre: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Folosește SET <#canal> FOUNDER <poreclă> <token> cu tokenul confirmat al fondatorului actual."
    token_unavailable: "Fondatorul actual nu are token de salvare confirmat. Trebuie să se autentifice și să folosească VERIFY mai întâi."
    syntax: "SET <#canal> FOUNDER <poreclă> [token]"
    example: "%command_prefix%SET #canal FOUNDER Alice"
    examples:
      - "%command_prefix%SET #canal FOUNDER Alice token-confirmat"
    short: "Transferați canalul către o altă poreclă înregistrată."
    help: |-
      Schimbă fondatorul după validarea tokenului fondatorului curent. Excepția
      administrativă de nivel fondator rămâne activă. Tokenul nu este consumat.
    invalid_token: "Tokenul de salvare este invalid."
    updated: "Fondatorul a fost schimbat în %nickname%."
    throttled: "Prea multe tokenuri incorecte. Încearcă din nou peste %minutes% minut(e)."
    must_be_registered: "%nickname% trebuie să fie înregistrată și activată."
    suspended: "%nickname% este suspendată și nu poate fi setată ca fondator."
    cannot_be_self: "Noul fondator nu poate fi fondatorul actual."
    cannot_be_successor: "Noul fondator nu poate fi succesorul canalului."
    limit_exceeded: "%nickname% a atins limita maximă de %max% canale înregistrate."
    notice_channel: "%from% desemnează %nickname% ca fondator al canalului."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canal> SUCCESSOR [poreclă]"
    example: "%command_prefix%SET #canal SUCCESSOR Alice"
    examples:
      - "%command_prefix%SET #canal SUCCESSOR"
    short: "Setați succesorul canalului."
    help: |-
      Stabilește o poreclă drept succesor al canalului. Omite porecla pentru a o
      șterge.
      Porecla trebuie să fie înregistrată și activată.
    cleared: "Succesorul a fost șters."
    updated: "Succesorul a fost setat la %nickname%."
    must_be_registered: "%nickname% trebuie să fie înregistrată și activată."
    suspended: "%nickname% este suspendată și nu poate fi setată ca succesor."
    cannot_be_founder: "Fondatorul nu poate fi setat ca succesor."
    notice_channel: "%from% desemnează %nickname% ca succesor al canalului."
    notice_channel_cleared: "%from% a șters succesorul canalului."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canal> DESC <descriere>"
    example: "%command_prefix%SET #canal DESC Un canal comunitar"
    short: "Schimbați descrierea canalului."
    help: "Schimbați descrierea canalului (obligatorie)."
    updated: "Descrierea a fost actualizată."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canal> URL [url]"
    example: "%command_prefix%SET #canal URL https://example.test"
    examples:
      - "%command_prefix%SET #canal URL"
    short: "Setați URL-ul canalului."
    help: "Schimbă adresa web (URL) a canalului. Omite URL-ul pentru a-l șterge."
    updated: "URL-ul a fost actualizat."
    cleared: "URL-ul a fost șters."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canal> EMAIL [e-mail]"
    example: "%command_prefix%SET #canal EMAIL echipa@example.test"
    examples:
      - "%command_prefix%SET #canal EMAIL"
    short: "Setați e-mailul canalului."
    help: |-
      Schimbă adresa de e-mail a canalului. Omite e-mailul pentru a-l
      șterge. Domeniile email blocate administrativ nu sunt permise.
      Excepție administrativă: operatorii cu acces la nivel de fondator.
    invalid: "Adresă de e-mail invalidă."
    updated: "E-mailul a fost actualizat."
    cleared: "E-mailul a fost șters."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canal> ENTRYMSG [mesaj]"
    example: "%command_prefix%SET #canal ENTRYMSG Bun venit"
    examples:
      - "%command_prefix%SET #canal ENTRYMSG"
    short: "Setați mesajul de intrare al canalului."
    help: "Stabilește mesajul de întâmpinare (NOTICE). Omite mesajul pentru a-l șterge."
    updated: "Mesajul de intrare a fost actualizat."
    too_long: "Mesajul de intrare nu poate depăși %max% caractere."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canal> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #canal TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #canal TOPICLOCK OFF"
    short: "Blocați subiectul canalului."
    help: |-
      Împiedică schimbarea topicului canalului. La activare, topicul curent este
      salvat și blocat.
    on: "Blocarea subiectului este acum ACTIVATĂ."
    off: "Blocarea subiectului este acum DEZACTIVATĂ."
    notice_on: "%nickname% activează TOPICLOCK."
    notice_off: "%nickname% dezactivează TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canal> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #canal MLOCK ON"
    examples:
      - "%command_prefix%SET #canal MLOCK OFF"
    short: "Blocați modurile canalului."
    help: |-
      Blochează modurile actuale ale canalului (de ex. +nt). Când este ON, modurile nu
      pot fi schimbate.
    no_modes: "fără moduri"
    on: "MLOCK este acum ACTIVAT (%modes%)."
    off: "MLOCK este acum DEZACTIVAT."
    notice_on: "%nickname% activează MLOCK (%modes%)."
    notice_off: "%nickname% dezactivează MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canal> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #canal PRIVATE ON"
    examples:
      - "%command_prefix%SET #canal PRIVATE OFF"
    short: "Ascunde informațiile canalului de utilizatorii fără acces."
    help: |-
      Când este ON, doar fondatorul și utilizatorii cu acces pot vedea informațiile
      canalului.
    on: "Informațiile canalului sunt acum private."
    off: "Informațiile canalului sunt acum publice."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canal> SECURE {ON|OFF}"
    example: "%command_prefix%SET #canal SECURE ON"
    examples:
      - "%command_prefix%SET #canal SECURE OFF"
    short: "Solicitați lista de acces pentru ranguri de canal."
    help: |-
      Împiedică atribuirea rangurilor de canal poreclelor care nu sunt în lista de
      acces.
    on: "SECURE este acum ACTIVAT."
    off: "SECURE este acum DEZACTIVAT."
    notice_on: "%nickname% activează modul SECURE."
    notice_off: "%nickname% dezactivează modul SECURE."


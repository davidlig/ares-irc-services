# --- OP -----------------------------------------------------------------------
op:
  syntax: "OP <#canal> <poreclă>"
  example: "%command_prefix%OP #canal Alice"
  short: "Acordați modul de operator de canal."
  help: "Acordați modul de operator de canal."
  done: "Lui %nickname% i s-a acordat statutul de operator de canal."
  user_not_on_channel: "Porecla %nickname% nu se află în rețea."
  notice_grant: "%from% acordă %mode% lui %to%"

# --- DEOP ---------------------------------------------------------------------
deop:
  syntax: "DEOP <#canal> <poreclă>"
  example: "%command_prefix%DEOP #canal Alice"
  short: "Retrageți modul de operator de canal."
  help: "Retrageți modul de operator de canal."
  done: "Lui %nickname% i s-a retras statutul de operator."

# --- HALFOP -------------------------------------------------------------------
halfop:
  syntax: "HALFOP <#canal> <poreclă>"
  example: "%command_prefix%HALFOP #canal Alice"
  short: "Acordați modul de semi-operator pe canal."
  help: "Acordați modul de semi-operator pe canal. Doar dacă IRCd-ul suportă +h."
  done: "Lui %nickname% i s-a acordat halfop."
  user_not_on_channel: "Porecla %nickname% nu se află în rețea."
  notice_grant: "%from% acordă %mode% lui %to%"
  not_supported: "Această rețea nu suportă modul halfop (+h)."

# --- DEHALFOP -----------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#canal> <poreclă>"
  example: "%command_prefix%DEHALFOP #canal Alice"
  short: "Retrageți modul de semi-operator pe canal."
  help: "Retrageți modul de semi-operator pe canal."
  done: "Lui %nickname% i s-a retras halfopul."

# --- VOICE --------------------------------------------------------------------
voice:
  syntax: "VOICE <#canal> <poreclă>"
  example: "%command_prefix%VOICE #canal Alice"
  short: "Acordați modul voice pe canal."
  help: "Acordați modul voice pe canal."
  done: "Lui %nickname% i s-a acordat voice."
  user_not_on_channel: "Porecla %nickname% nu se află în rețea."
  notice_grant: "%from% acordă %mode% lui %to%"

# --- DEVOICE ------------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#canal> <poreclă>"
  example: "%command_prefix%DEVOICE #canal Alice"
  short: "Retrageți modul voice pe canal."
  help: "Retrageți modul voice pe canal."
  done: "Lui %nickname% i s-a retras voice-ul."

# --- HELP ---------------------------------------------------------------------
help:
  examples_header: "Exemple:"
  syntax: "HELP [comandă] [opțiune]"
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP SET"
    - "%command_prefix%HELP SET EMAIL"
  short: "Listați comenzile sau afișați ajutor pentru o comandă."
  help: "Afișează comenzile disponibile și ajutor detaliat pentru opțiunile lor."
  header_title: "%bot%"
  header: "%title% %separator%"
  intro: |-
    Permite înregistrarea și administrarea canalelor, configurarea opțiunilor și
    controlul accesului. Gestionează nivelurile de acces și privilegiile
    utilizatorilor
    pentru a păstra canalul sub controlul celor responsabili.
  general_header: "Comenzi disponibile:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opțiuni:"
  general_footer: "Folosește /msg %bot% %help% pentru mai multe informații."
  general_footer_command: "HELP <comandă>"
  set_sub_footer: "Folosește /msg %bot% %help% pentru mai multe informații."
  set_sub_footer_command: "HELP %command% <opțiune>"
  syntax_label: "Sintaxă: %syntax%"
  footer: ""
  intro_expiration: "NOTĂ: Canalele nefolosite mai mult de %period% sunt eliminate automat."
  intro_expiration_period: "%days% zile"
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    registration_info: "Înregistrare și informații"
    access_levels: "Acces și niveluri"
    ranks_entry: "Ranguri și intrare"
  ircop_group:
    channel_operations: "Operațiuni de canal"
    channel_management: "Gestionarea canalului"
    deletion: "Ștergere și restaurare"
    restrictions: "Restricții"
    lookup: "Căutare și investigare"
    registration_approval: "Aprobarea înregistrării"
  ircop_header: "Comenzi disponibile pentru IRCops:"

# --- CLEARUSERS (IRCop) -------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#canal> [motiv]"
  example: "%command_prefix%CLEARUSERS #canal"
  examples:
    - "%command_prefix%CLEARUSERS #canal inundare"
  short: "Eliminați prin kick toți utilizatorii dintr-un canal."
  help: |-
    Evacuează toți utilizatorii de pe canal. Comanda este rezervată IRCop; dacă
    nu se indică un motiv, se folosește unul implicit.
  not_on_network: "Canalul %channel% nu se află în prezent în rețea."
  empty: "Canalul %channel% nu are utilizatori cărora să li se dea kick."
  success: "S-a dat kick la %count% utilizator(i) din %channel%."
  default_reason: "Comanda CLEARUSERS"

# --- CLEARACCESS (IRCop) ------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#canal>"
  example: "%command_prefix%CLEARACCESS #canal"
  short: "Ștergeți întreaga listă de acces a unui canal."
  help: "Elimină toate intrările de acces ale canalului. Acțiunea este ireversibilă."
  success: "S-au șters %count% intrări de acces din %channel%."
  empty: "Canalul %channel% nu are intrări de acces."

# --- IRCOPONLY (IRCop) --------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#canal> {ON|OFF}"
  example: "%command_prefix%IRCOPONLY #canal ON"
  examples:
    - "%command_prefix%IRCOPONLY #canal OFF"
  short: "Restricționați un canal la operatorii IRC."
  help: |-
    Doar operatorii IRC autorizați pot rămâne pe canal. %bot% aplică această
    restricție.
  on: "IRCOPONLY este activat pe %channel%."
  off: "IRCOPONLY este dezactivat pe %channel%."

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <#canal> <poreclă> <descriere>"
  short: "Înregistrați administrativ un canal."
  help: |-
    Sintaxă: SAREGISTER <#canal> <poreclă> <descriere>

    Înregistrează administrativ un canal imediat pentru porecla
    specificată ca fondator, fără a necesita prezență, verificare sau limite de frecvență.
  example: "%command_prefix%SAREGISTER #canal Alice Canal comunitar"
  success: "Canalul %channel% a fost înregistrat pentru %founder%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#canal> {ON|OFF}"
  example: "%command_prefix%NOEXPIRE #Important ON"
  examples:
    - "%command_prefix%NOEXPIRE #Important OFF"
  short: "Setați sau eliminați protecția împotriva expirării pentru un canal."
  help: |-
    Controlează expirarea canalului din cauza inactivității.
    ON previne expirarea, iar OFF aplică regulile normale.
  success_on: "Canalul %channel% este acum protejat împotriva expirării."
  success_off: "Canalul %channel% va expira acum normal."
  forbidden: "Canalul %channel% este interzis."
  suspended: "Canalul %channel% este suspendat."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <#canal> [FORCE]"
  example: "%command_prefix%DROP #canal"
  examples:
    - "%command_prefix%DROP #canal FORCE"
  short: "Eliminați un canal înregistrat."
  help: |-
    Șterge un canal înregistrat din baza de date.
    FORCE șterge definitiv un canal aflat în așteptarea ștergerii.
    Un IRCop cu permisiunea DROP poate elibera imediat și
    cererile de înregistrare în așteptare și respinse, cu sau fără FORCE.
  registration_restricted: "Această cerere de înregistrare este restricționată până la %date%."
  force:
    short: "Șterge definitiv un canal aflat în așteptarea ștergerii."
  success: "Canalul %channel% a fost marcat pentru ștergere și poate fi restaurat în perioada de grație."
  force_success: "Canalul %channel% a fost șters definitiv."
  pending_deletion: "Canalul %channel% este deja în așteptare de ștergere. Folosiți DROP <#canal> FORCE pentru a-l șterge definitiv."
  invalid_channel: "Nume de canal invalid. Folosiți %example%."
  pending_deletion_reason: "Canalul %channel% este în curs de ștergere. Mai multe informații: /msg %bot% \x0303INFO %channel%\x03"

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <#canal>"
  example: "%command_prefix%RESTORE #canal"
  short: "Restaurați un canal în așteptare de ștergere."
  help: "Restaurează un canal șters manual, dacă perioada de grație nu a expirat."
  success: "Canalul %channel% a fost restaurat."
  not_pending_deletion: "Canalul %channel% nu este în așteptare de ștergere."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canal> <durată> <motiv>"
  example: "%command_prefix%SUSPEND #canal 7d Încălcarea regulilor"
  examples:
    - "%command_prefix%SUSPEND #canal 0 Încălcarea regulilor"
  short: "Suspendă un canal."
  help: |-
    Suspendă temporar un canal înregistrat. Formate de durată: 0 = permanent,
    1d, 12h, 60m.
    Pe durata suspendării, modurile, accesul și aplicarea regulilor sunt
    dezactivate.
  success: "Canalul %channel% a fost suspendat până la %duration%."
  already_suspended: "Canalul %channel% este deja suspendat."
  invalid_duration: "Durată invalidă. Folosiți: 0 (permanent), 1d, 12h sau 60m."
  channel_suspended: "Canalul %channel% este suspendat și nu poate fi folosit."
  notice_channel: "Canalul a fost suspendat. Motiv: %reason%"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#canal>"
  example: "%command_prefix%UNSUSPEND #canal"
  short: "Anulați suspendarea unui canal."
  help: |-
    Reactivează un canal suspendat și îi restabilește modurile și aplicarea
    regulilor.
  success: "Canalul %channel% nu mai este suspendat."
  not_suspended: "Canalul %channel% nu este suspendat."
  reason_expired: "suspendare expirată"

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <#canal> <motiv>"
  example: "%command_prefix%FORBID #canal Încălcarea regulilor"
  short: "Interziceți utilizarea unui canal."
  help: |-
    Interzice folosirea canalului, evacuând toți utilizatorii și împiedicându-i
    să revină. Dacă este înregistrat, canalul este șters înainte de interzicere.
  reason_required: "Trebuie să specificați un motiv."
  success: "Canalul %channel% a fost interzis."
  updated: "Motivul interzicerii pentru canalul %channel% a fost actualizat."
  channel_forbidden: "Canalul %channel% este interzis și nu poate fi folosit."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#canal>"
  example: "%command_prefix%UNFORBID #canal"
  short: "Anulați interzicerea unui canal."
  help: "Elimină interdicția canalului, permițând înregistrarea lui din nou."
  success: "Canalul %channel% nu mai este interzis."
  not_forbidden: "Canalul %channel% nu este interzis."

# --- HISTORY ---
history:
  syntax: "HISTORY <#canal> {ADD <mesaj>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  example: "%command_prefix%HISTORY #canal ADD Revizuire moderare"
  examples:
    - "%command_prefix%HISTORY #canal DEL 42"
    - "%command_prefix%HISTORY #canal VIEW"
    - "%command_prefix%HISTORY #canal VIEW 2"
    - "%command_prefix%HISTORY #canal VIEW ALL"
    - "%command_prefix%HISTORY #canal CLEAR"
  short: "Vizualizați sau gestionați istoricul de acțiuni al canalului."
  help: "Gestionează istoricul acțiunilor unui canal."

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#canal> ADD <mesaj>"
    example: "%command_prefix%HISTORY #canal ADD Revizuire moderare"
    short: "Adăugați o intrare manuală în istoric."
    help: |-
      Adaugă o intrare manuală în istoricul canalului.
    success: "Intrare în istoric adăugată pentru %channel%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#canal> DEL <id>"
    example: "%command_prefix%HISTORY #canal DEL 42"
    short: "Șterge o intrare din istoric."
    help: "Șterge o intrare din istoric după ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#canal> VIEW [PAGINĂ|ALL]"
    example: "%command_prefix%HISTORY #canal VIEW"
    examples:
      - "%command_prefix%HISTORY #canal VIEW 2"
      - "%command_prefix%HISTORY #canal VIEW ALL"
    short: "Vizualizați istoricul de acțiuni al canalului."
    help: "Afișează intrările din istoricul canalului."
    header: "%heading% (se afișează %start%-%end% din %total%):"
    header_heading: "Istoric pentru %channel%"
    entry: "#%id% [%date%] %action% de %operator% — %message%"
    no_entries: "Nu s-au găsit intrări în istoric pentru %channel%."
    page_hint: "Folosiți %command% pentru mai multe intrări."
    page_hint_command: "HISTORY %channel% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#canal> CLEAR"
    example: "%command_prefix%HISTORY #canal CLEAR"
    short: "Ștergeți toate intrările din istoricul unui canal."
    help: "Șterge toate intrările din istoricul canalului."
    success: "S-au șters %count% intrări din istoricul canalului %channel%."


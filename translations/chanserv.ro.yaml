# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#canal> <poreclă>"
  example: "%command_prefix%\x02\x0303OP #canal Alice\x03\x0F"
  short: "Acordați modul de operator de canal."
  help: "Acordați modul de operator de canal."
  done: "\x0303✔\x03 Lui \x02%nickname%\x02 i s-a acordat statutul de operator de canal."
  user_not_on_channel: "\x0304✗\x03 Porecla \x02%nickname%\x02 nu se află în rețea."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 acordă \x0304%mode%\x03 lui \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#canal> <poreclă>"
  example: "%command_prefix%\x02\x0303DEOP #canal Alice\x03\x0F"
  short: "Retrageți modul de operator de canal."
  help: "Retrageți modul de operator de canal."
  done: "\x0303✔\x03 Lui \x02%nickname%\x02 i s-a retras statutul de operator."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 Cu SECURE activat, \x02%nickname%\x02 trebuie să aibă cel puțin nivelul \x02%level%\x02 pentru a primi \x02%mode%\x02."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#canal> <opțiune> [valoare]"
  example: "%command_prefix%\x02\x0303SET #canal DESC Un canal comunitar\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #canal URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #canal MLOCK ON\x03\x0F"
  short: "Modificați opțiunile canalului."
  help: |-
    Modifică o opțiune a canalului. Ajutorul fiecărei opțiuni explică cerințele și
    variantele disponibile.
  unknown_option: "\x0304✗\x03 Opțiune necunoscută \x02%option%\x02. Folosiți una dintre: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Folosește SET <#canal> FOUNDER <poreclă> <token> cu tokenul confirmat al fondatorului actual."
    token_unavailable: "Fondatorul actual nu are token de salvare confirmat. Trebuie să se autentifice și să folosească VERIFY mai întâi."
    syntax: "SET <#canal> FOUNDER <poreclă> [token]"
    example: "%command_prefix%\x02\x0303SET #canal FOUNDER Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal FOUNDER Alice token-confirmat\x03\x0F"
    short: "Transferați canalul către o altă poreclă înregistrată."
    help: |-
      Schimbă fondatorul după validarea tokenului fondatorului curent. Excepția
      administrativă de nivel fondator rămâne activă. Tokenul nu este consumat.
    invalid_token: "Tokenul de salvare este invalid."
    updated: "\x0303✔\x03 Fondatorul a fost schimbat în \x02%nickname%\x02."
    throttled: "Prea multe tokenuri incorecte. Încearcă din nou peste %minutes% minut(e)."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 trebuie să fie înregistrată și activată."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 este suspendată și nu poate fi setată ca fondator."
    cannot_be_self: "\x0304✗\x03 Noul fondator nu poate fi fondatorul actual."
    cannot_be_successor: "\x0304✗\x03 Noul fondator nu poate fi succesorul canalului."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 a atins limita maximă de %max% canale înregistrate."
    notice_channel: "\x02%from%\x02 desemnează \x02%nickname%\x02 ca fondator al canalului."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canal> SUCCESSOR [poreclă]"
    example: "%command_prefix%\x02\x0303SET #canal SUCCESSOR Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal SUCCESSOR\x03\x0F"
    short: "Setați succesorul canalului."
    help: |-
      Stabilește o poreclă drept succesor al canalului. Omite porecla pentru a o
      șterge.
      Porecla trebuie să fie înregistrată și activată.
    cleared: "\x0303✔\x03 Succesorul a fost șters."
    updated: "\x0303✔\x03 Succesorul a fost setat la \x02%nickname%\x02."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 trebuie să fie înregistrată și activată."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 este suspendată și nu poate fi setată ca succesor."
    cannot_be_founder: "\x0304✗\x03 Fondatorul nu poate fi setat ca succesor."
    notice_channel: "\x02%from%\x02 desemnează \x02%nickname%\x02 ca succesor al canalului."
    notice_channel_cleared: "\x02%from%\x02 a șters succesorul canalului."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canal> DESC <descriere>"
    example: "%command_prefix%\x02\x0303SET #canal DESC Un canal comunitar\x03\x0F"
    short: "Schimbați descrierea canalului."
    help: "Schimbați descrierea canalului (obligatorie)."
    updated: "\x0303✔\x03 Descrierea a fost actualizată."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canal> URL [url]"
    example: "%command_prefix%\x02\x0303SET #canal URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal URL\x03\x0F"
    short: "Setați URL-ul canalului."
    help: "Schimbă adresa web (URL) a canalului. Omite URL-ul pentru a-l șterge."
    updated: "\x0303✔\x03 URL-ul a fost actualizat."
    cleared: "\x0303✔\x03 URL-ul a fost șters."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canal> EMAIL [e-mail]"
    example: "%command_prefix%\x02\x0303SET #canal EMAIL echipa@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal EMAIL\x03\x0F"
    short: "Setați e-mailul canalului."
    help: |-
      Schimbă adresa de e-mail a canalului. Omite e-mailul pentru a-l
      șterge. Domeniile email blocate administrativ nu sunt permise.
      Excepție administrativă: operatorii cu acces la nivel de fondator.
    invalid: "\x0304✗\x03 Adresă de e-mail invalidă."
    updated: "\x0303✔\x03 E-mailul a fost actualizat."
    cleared: "\x0303✔\x03 E-mailul a fost șters."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canal> ENTRYMSG [mesaj]"
    example: "%command_prefix%\x02\x0303SET #canal ENTRYMSG Bun venit\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal ENTRYMSG\x03\x0F"
    short: "Setați mesajul de intrare al canalului."
    help: "Stabilește mesajul de întâmpinare (NOTICE). Omite mesajul pentru a-l șterge."
    updated: "\x0303✔\x03 Mesajul de intrare a fost actualizat."
    too_long: "\x0304✗\x03 Mesajul de intrare nu poate depăși %max% caractere."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canal> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal TOPICLOCK OFF\x03\x0F"
    short: "Blocați subiectul canalului."
    help: |-
      Împiedică schimbarea topicului canalului. La activare, topicul curent este
      salvat și blocat.
    on: "\x0303✔\x03 Blocarea subiectului este acum ACTIVATĂ."
    off: "\x0303✔\x03 Blocarea subiectului este acum DEZACTIVATĂ."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activează TOPICLOCK."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 dezactivează TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canal> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal MLOCK OFF\x03\x0F"
    short: "Blocați modurile canalului."
    help: |-
      Blochează modurile actuale ale canalului (de ex. +nt). Când este ON, modurile nu
      pot fi schimbate.
    no_modes: "fără moduri"
    on: "\x0303✔\x03 MLOCK este acum ACTIVAT (%modes%)."
    off: "\x0303✔\x03 MLOCK este acum DEZACTIVAT."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activează MLOCK (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 dezactivează MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canal> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal PRIVATE OFF\x03\x0F"
    short: "Ascunde informațiile canalului de utilizatorii fără acces."
    help: |-
      Când este ON, doar fondatorul și utilizatorii cu acces pot vedea informațiile
      canalului.
    on: "\x0303✔\x03 Informațiile canalului sunt acum private."
    off: "\x0303✔\x03 Informațiile canalului sunt acum publice."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canal> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canal SECURE OFF\x03\x0F"
    short: "Solicitați lista de acces pentru ranguri de canal."
    help: |-
      Împiedică atribuirea rangurilor de canal poreclelor care nu sunt în lista de
      acces.
    on: "\x0303✔\x03 SECURE este acum ACTIVAT."
    off: "\x0303✔\x03 SECURE este acum DEZACTIVAT."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activează modul SECURE."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 dezactivează modul SECURE."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#canal> {ADD|DEL|LIST} [poreclă] [nivel]"
  example: "%command_prefix%\x02\x0303ACCESS #canal LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #canal ADD Alice 100\x03\x0F"
    - "%command_prefix%\x02\x0303ACCESS #canal DEL Alice\x03\x0F"
  short: "Gestionați lista de acces."
  help: "Gestionează lista de acces a canalului."
  unknown_sub: "\x0304✗\x03 Subcomandă necunoscută \x02%sub%\x02. Folosiți LIST, ADD sau DEL."
  level_range: "\x0304✗\x03 Nivelul de acces trebuie să fie între %min% și %max%."

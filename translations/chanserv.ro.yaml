# Traduceri ChanServ — Română
# Domeniu: chanserv
#
# Coduri de formatare IRC (ghilimele duble sau blocuri literale !irc):
#   \x02        activează/dezactivează caracterele aldine
#   \x03NN      culoare (ZECIMAL: 03=verde, 04=roșu, 07=portocaliu, 14=gri închis)
#   \x03        resetează culoarea
#   \x0F        resetează întreaga formatare
#
# Culorile IRC folosesc numere ZECIMALE (0-15), nu hexazecimale.
#   \x0314 = gri închis (14 zecimal): CORECT
#   \x030F = culoarea 0 urmată de litera F: EROARE
#
# Text IRC pe mai multe rânduri: !irc |- cu rânduri și spații reale.
# Blocurile fără etichetă nu decodează secvențe escape; păstrează literalii CTCP.
# Exemple HELP: example/examples și %command_prefix%.
# Prezentatorul adaugă /msg fără culoare și o margine de două spații.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Nume de canal invalid. Folosiți \x02#canal\x02."
  generic: "\x0304✗\x03 A apărut o eroare. Vă rugăm să încercați din nou."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#canal> <descriere>"
  example: "%command_prefix%\x02\x0303REGISTER #canal Proiect comunitar\x03\x0F"
  short: "Înregistrați un canal."
  help: |-
    Înregistrează un canal și asociază-l poreclei tale. Identifică-te cu
    %nickserv%.
    În modul APPROVAL, un IRCop trebuie să aprobe cererea.
  success: "\x0303✔\x03 Canalul \x02%channel%\x02 a fost înregistrat."
  already_registered: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja înregistrat."
  channel_not_on_network: "\x0304✗\x03 Canalul \x02%channel%\x02 nu există în rețea."
  pending_deletion: "\x0304✗\x03 Canalul \x02%channel%\x02 este în așteptare de ștergere și nu poate fi înregistrat."
  insufficient_channel_rank: "\x0304✗\x03 Trebuie să ai cel puțin statut de operator pe \x02%channel%\x02 pentru a-l înregistra."
  limit_exceeded: "\x0304✗\x03 Ați atins limita maximă de %max% canale înregistrate."
  throttled: "\x0304✗\x03 Trebuie să așteptați \x02%minutes%\x02 minut(e) înainte de a înregistra alt canal."

  awaiting_approval: "\x0307✔\x03 Cererea de înregistrare pentru \x02%channel%\x02 așteaptă aprobarea unui IRCop."
  restricted_indefinite: "\x0304✗\x03 Cereri noi pentru \x02%channel%\x02 sunt blocate pe termen nelimitat."
  restricted_until: "\x0304✗\x03 Cereri noi pentru \x02%channel%\x02 sunt blocate până la %date%"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%\x02\x0303REGMODE APPROVAL\x03\x0F"
  short: "Setează sau verifică modul de înregistrare a canalelor."
  help: |-
    Setează înregistrarea la DIRECT sau APPROVAL ori verifică STATUS.
    DIRECT este modul implicit și păstrează înregistrarea imediată.

  status: "\x0307ℹ\x03 Modul de înregistrare a canalelor este \x02%mode%\x02."
  changed: "\x0303✔\x03 Modul de înregistrare a canalelor este acum \x02%mode%\x02."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [pagină]|ACCEPT <#canal>|REJECT <#canal> <motiv>}"
  pending.syntax: "CREG PENDING [pagină]"
  pending.example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  pending.short: "Listează cererile de înregistrare în așteptare."
  pending.help: "Listează cererile în așteptare într-o pagină limitată."
  accept.syntax: "CREG ACCEPT <#canal>"
  accept.example: "%command_prefix%\x02\x0303CREG ACCEPT #canal\x03\x0F"
  accept.short: "Aprobă o cerere de înregistrare a canalului."
  accept.help: "Verifică din nou solicitantul și activează înregistrarea."
  reject.syntax: "CREG REJECT <#canal> <motiv>"
  reject.example: "%command_prefix%\x02\x0303CREG REJECT #canal Motivo público\x03\x0F"
  reject.short: "Respinge o cerere de înregistrare a canalului."
  reject.help: "Respinge cererea cu motiv obligatoriu și restricție."
  example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  short: "Revizuiește cererile de înregistrare a canalelor."
  help: |-
    Listează cererile în așteptare sau aprobă ori respinge o cerere.
    Respingerea necesită un motiv. Numai ACCEPT înregistrează canalul.

  pending_header: "\x0314Înregistrări în așteptare (pagina %page%)\x03"
  pending_item: "  %channel% — solicitant %requester%, trimisă %submitted%: %description%"
  accepted: "\x0303✔\x03 Înregistrarea pentru \x02%channel%\x02 a fost aprobată."
  rejected: "\x0307✔\x03 Înregistrarea pentru \x02%channel%\x02 a fost respinsă."
  not_pending: "\x0304✗\x03 Canalul \x02%channel%\x02 nu are o înregistrare în așteptare."
  channel_not_on_network: "\x0304✗\x03 Canalul \x02%channel%\x02 nu este în rețea."
  founder_limit: "\x0304✗\x03 Solicitantul a atins limita de înregistrări de canale."
  requester_inactive: "\x0304✗\x03 Contul solicitantului nu mai este activ."
  requester_ineligible: "\x0304✗\x03 Solicitantul trebuie să aibă acum statut de operator pe canal."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <#canal>"
  example: "%command_prefix%\x02\x0303STATUS #canal\x03\x0F"
  short: "Afișează starea înregistrării canalului."
  help: |-
    Arată dacă un canal nu este înregistrat, așteaptă aprobarea, a fost respins
    sau este înregistrat.
    Detaliile respingerii sunt vizibile doar solicitantului și IRCopilor
    autorizați.

  unregistered: "\x0314%channel% nu este înregistrat.\x03"
  pending: "\x0314%channel% așteaptă aprobarea unui IRCop.\x03"
  registered: "\x0314%channel% este înregistrat.\x03"
  suspended: "\x0314%channel% este înregistrat, dar suspendat.\x03"
  forbidden: "\x0314Înregistrarea pentru %channel% este interzisă.\x03"
  pending_deletion: "\x0314%channel% este în așteptarea ștergerii.\x03"
  rejected_private: "\x0314%channel% are o cerere de înregistrare respinsă.\x03"
  rejected: "\x0314Înregistrarea pentru %channel% a fost respinsă.\x03"
  rejection_reason: "  \x0314Motiv\x03: %reason%"
  rejection_audit: "  \x0314Respinsă de\x03: %operator% la %date%"
  restriction_indefinite: "  \x0314Cererile noi sunt blocate pe termen nelimitat.\x03"
  restriction_until: "  \x0314Cererile noi sunt blocate până la %date%\x03"
  restriction_expired: "  \x0314Restricția de înregistrare s-a încheiat la %date%.\x03"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#canal>"
  example: "%command_prefix%\x02\x0303INFO #canal\x03\x0F"
  short: "Afișați informațiile canalului."
  help: |-
    Afișează informații detaliate despre un canal înregistrat, inclusiv
    proprietarul,
    datele înregistrării, ultima activitate și opțiunile de configurare.
  header: "\x02Informații pentru canalul \x0307%channel%\x03\x02"
  founder: "  \x0314Fondator\x03             : \x02%nickname%\x02"
  registered: "  \x0314Înregistrat\x03          : %date%"
  successor: "  \x0314Succesor\x03             : \x02%nickname%\x02"
  description: "  \x0314Descriere\x03            : %desc%"
  url: "  \x0314URL\x03                  : %url%"
  email: "  \x0314E-mail\x03               : %email%"
  last_used: "  \x0314Ultima folosire\x03      : %date%"
  topic: "  \x0314Ultimul subiect\x03      : %topic%"
  topic_set_by: "  \x0314Subiect setat de\x03     : %nickname%"
  options: "  \x0314Opțiuni\x03              : %options%"
  private: "\x0304✗\x03 Informațiile canalului \x02%channel%\x02 sunt private."
  no_expire: "  \x0314Nu expiră niciodată\x03  : Da"
  mlock_modes: "  \x0314Blocare moduri\x03       : %modes%"
  suspended_status: "  \x0314Stare\x03                : \x0304Suspendat\x03"
  suspended_reason: "  \x0314Motiv\x03                : %reason%"
  suspended_until: "  \x0314Se termină la\x03        : %date%"
  suspended_permanent: "  \x0314Se termină la\x03        : Permanent"
  forbidden_status: "  \x0314Stare\x03                : \x0304Interzis\x03"
  forbidden_reason: "  \x0314Motiv\x03                : %reason%"
  pending_deletion_status: "  \x0314Stare\x03              : \x0307În așteptarea ștergerii\x03"
  pending_deletion_at: "  \x0314Șters\x03              : %date%"
  pending_deletion_until: "  \x0314Ștergere definitivă\x03 : %date%"
  pending_deletion_notice: "  \x0307Acest canal este înghețat și nu poate fi înregistrat.\x03"


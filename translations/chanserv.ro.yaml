  pending_value: "În așteptarea aprobării"
  registered: "%label%%padding%: %state%"
  registered_label: "Stare"
  registered_value: "Înregistrat"
  suspended: "%label%%padding%: %state%"
  suspended_label: "Stare"
  suspended_value: "Suspendat"
  forbidden: "%label%%padding%: %state%"
  forbidden_label: "Stare"
  forbidden_value: "Interzis"
  pending_deletion: "%label%%padding%: %state%"
  pending_deletion_label: "Stare"
  pending_deletion_value: "În așteptarea ștergerii"
  rejected_private: "%label%%padding%: %state%"
  rejected_private_label: "Stare"
  rejected_private_value: "Înregistrare respinsă"
  rejected: "%label%%padding%: %state%"
  rejected_label: "Stare"
  rejected_value: "Înregistrare respinsă"
  rejection_reason: "%label%%padding%: %reason%"
  rejection_reason_label: "Motiv"
  rejection_audit: "%label%%padding%: %operator% la %date%"
  rejection_audit_label: "Respinsă de"
  restriction_until: "%label%%padding%: %date%"
  restriction_until_label: "Disponibilă de la"
  footer: ""

# --- ACCESS -------------------------------------------------------------------
access:
  syntax: "ACCESS <#canal> {ADD <poreclă> <nivel>|DEL <poreclă>|LIST}"
  example: "%command_prefix%ACCESS #canal LIST"
  examples:
    - "%command_prefix%ACCESS #canal ADD Alice 100"
    - "%command_prefix%ACCESS #canal DEL Alice"
  short: "Gestionați lista de acces."
  help: "Gestionează lista de acces a canalului."
  unknown_sub: "Subcomandă necunoscută %sub%. Folosiți LIST, ADD sau DEL."
  level_range: "Nivelul de acces trebuie să fie între %min% și %max%."
  cannot_manage_level: "Puteți gestiona doar porecle cu nivel strict inferior propriului nivel."
  founder_not_in_list: "Fondatorul nu se află în lista de acces."
  max_entries: "Maxim %max% intrări de acces per canal."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#canal> LIST"
    example: "%command_prefix%ACCESS #canal LIST"
    short: "Listați lista de acces (necesită nivel ACCESSLIST)."
    help: "Afișează porecla și nivelul pentru fiecare intrare."
    header: "Lista de acces pentru %channel%"
    empty: "Canalul %channel% nu are intrări de acces."
    entry: "#%index%: %nickname% (nivel %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#canal> ADD <poreclă> <nivel>"
    example: "%command_prefix%ACCESS #canal ADD Alice 100"
    short: "Adăugați sau actualizați nivelul de acces (necesită nivel ACCESSCHANGE)."
    help: "Nivel 1-499. Puteți seta doar niveluri inferioare propriului nivel."
    done: "%nickname% setat la nivelul %level%."
    notice_channel: "%from% setează %to% la nivelul %level%"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#canal> DEL <poreclă>"
    example: "%command_prefix%ACCESS #canal DEL Alice"
    short: "Eliminați din lista de acces (necesită nivel ACCESSCHANGE)."
    help: "Puteți elimina doar porecle cu nivel inferior propriului nivel."
    not_in_list: "%nickname% nu se află în lista de acces."
    done: "%nickname% eliminat din lista de acces."
    notice_channel: "%from% elimină %to% din lista de acces"

# --- DELACCESS ----------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#canal>"
  example: "%command_prefix%DELACCESS #canal"
  short: "Eliminați propriul acces dintr-un canal."
  help: |-
    Elimină intrarea ta din lista de acces a canalului. Trebuie să fii identificat.
    Fondatorul nu poate folosi această comandă.
  done: "Accesul dumneavoastră a fost eliminat din %channel%."
  not_in_list: "Nu aveți acces în %channel%."
  founder_not_in_access: "Sunteți fondatorul canalului %channel% și nu vă aflați în lista de acces."
  notice_channel: "%nickname% își elimină accesul din canal"

# --- AKICK --------------------------------------------------------------------
akick:
  syntax: "AKICK <#canal> {ADD <mască> [expirare] [motiv]|DEL {<mască>|<număr>}|LIST}"
  example: "%command_prefix%AKICK #canal ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #canal ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #canal DEL *!*@*"
    - "%command_prefix%AKICK #canal DEL 2"
    - "%command_prefix%AKICK #canal LIST"
  short: "Gestionați lista de auto-kick."
  help: "Gestionează intrările de kick automat și expirarea lor opțională."
  unknown_sub: "Subcomandă necunoscută %sub%. Folosiți ADD, DEL sau LIST."
  invalid_mask: "Format de mască invalid. Folosiți poreclă!ident@host cu metacaractere (*)."
  dangerous_mask: "Masca %mask% este prea largă. Trebuie să conțină cel puțin 4 caractere alfanumerice."
  protected_user: "Porecla %nickname% are acces pe acest canal."
  max_entries: "Maxim %max% intrări AKICK per canal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canal> ADD <mască> [expirare] [motiv]"
    example: "%command_prefix%AKICK #canal ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #canal ADD *!*@* 7d Spam"
    short: "Adăugați intrare AKICK."
    help: |-
      Adaugă o mască la lista de kick automat a canalului.

      Poți indica o durată și un motiv. Dacă incluzi un motiv, trebuie să indici și
      durata: 0 pentru permanent, d pentru zile, h pentru ore sau m pentru minute.
    done: "AKICK %mask% adăugat."
    already_exists: "AKICK %mask% există deja."
    notice_channel: "%from% adaugă AKICK: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canal> DEL {<mască>|<număr>}"
    example: "%command_prefix%AKICK #canal DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #canal DEL 2"
    short: "Eliminați intrare AKICK."
    help: "Eliminați după masca exactă sau numărul intrării din LIST."
    not_found: "AKICK %mask% nu a fost găsit."
    done: "AKICK %mask% eliminat."
    notice_channel: "%from% elimină AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canal> LIST"
    example: "%command_prefix%AKICK #canal LIST"
    short: "Listați intrările AKICK."
    help: "Afișează masca, motivul, expirarea și cine a adăugat."
    header: "Lista AKICK pentru %channel%"
    empty: "Canalul %channel% nu are intrări AKICK."
    entry: "#%index% %mask% %reason% (de %nickname%, expiră: %expiration%)"

# --- LEVELS -------------------------------------------------------------------
levels:
  syntax: "LEVELS <#canal> {LIST|SET <nivel> <valoare>|RESET}"
  example: "%command_prefix%LEVELS #canal LIST"
  examples:
    - "%command_prefix%LEVELS #canal SET OPDEOP 50"
    - "%command_prefix%LEVELS #canal RESET"
  short: "Configurați nivelurile canalului."
  help: |-
    Configurează nivelurile minime de acces pentru acțiunile canalului. Numai
    fondatorul poate modifica sau reseta nivelurile.
  unknown_sub: "Subcomandă necunoscută %sub%. Folosiți LIST, SET sau RESET."
  unknown_key: "Cheie de nivel necunoscută %key% sau nesuportată de acest IRCd."
  value_range: "Valoarea nivelului trebuie să fie între %min% și %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#canal> LIST"
    example: "%command_prefix%LEVELS #canal LIST"
    short: "Listați cerințele de nivel."
    help: "Afișează fiecare cheie de nivel și valoarea sa (implicită dacă nu este setată)."
    header: "Niveluri pentru %channel%"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#canal> SET <nivel> <valoare>"
    example: "%command_prefix%LEVELS #canal SET OPDEOP 50"
    short: "Setați o cerință de nivel."
    help: "Valoare de la -1 la 499. Doar fondatorul."
    done: "%key% setat la %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#canal> RESET"
    example: "%command_prefix%LEVELS #canal RESET"
    short: "Resetați toate nivelurile la valorile implicite."
    help: "Elimină toate suprascrierile. Doar fondatorul."
    done: "Toate nivelurile au fost resetate la valorile implicite."


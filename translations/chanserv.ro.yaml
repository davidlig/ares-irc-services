  value_range: "\x0304✗\x03 Valoarea nivelului trebuie să fie între %min% și %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#canal> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #canal LIST\x03\x0F"
    short: "Listați cerințele de nivel."
    help: "Afișează fiecare cheie de nivel și valoarea sa (implicită dacă nu este setată)."
    header: "\x0303Niveluri pentru %channel%\x03"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#canal> SET <nivel> <valoare>"
    example: "%command_prefix%\x02\x0303LEVELS #canal SET OPDEOP 50\x03\x0F"
    short: "Setați o cerință de nivel."
    help: "Valoare de la -1 la 499. Doar fondatorul."
    done: "\x0303✔\x03 \x02%key%\x02 setat la %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#canal> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #canal RESET\x03\x0F"
    short: "Resetați toate nivelurile la valorile implicite."
    help: "Elimină toate suprascrierile. Doar fondatorul."
    done: "\x0303✔\x03 Toate nivelurile au fost resetate la valorile implicite."


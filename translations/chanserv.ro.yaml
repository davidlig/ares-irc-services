# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <model> [pagină]"
  example: "%command_prefix%LIST #*"
  examples:
    - "%command_prefix%LIST #* 2"
  short: "Listează canalele înregistrate care corespund unui model."
  help: |-
    Listează canalele înregistrate care corespund tiparului. Caracterul * reprezintă
     orice secvență de caractere. Pagina este opțională și începe de la 1.
  header: "Canal | Fondator | Înregistrare | Ultima utilizare | Stare"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Niciun canal nu corespunde modelului %pattern%."
  status_pending_registration: "Aprobare în așteptare"
  status_rejected_registration: "Înregistrare respinsă"
  status_active: "Activ"

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%REGMODE APPROVAL"
  short: "Setează sau verifică modul de înregistrare a canalelor."
  help: |-
    Setează înregistrarea la DIRECT sau APPROVAL ori verifică STATUS.
    DIRECT este modul implicit și păstrează înregistrarea imediată.

  status: "Modul de înregistrare a canalelor este %mode%."
  changed: "Modul de înregistrare a canalelor este acum %mode%."

# --- CREG (IRCop) -------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [pagină]|ACCEPT <#canal>|REJECT <#canal> <motiv>}"
  pending.syntax: "CREG PENDING [pagină]"
  pending.example: "%command_prefix%CREG PENDING"
  pending.short: "Listează cererile de înregistrare în așteptare."
  pending.help: "Listează cererile în așteptare într-o pagină limitată."
  accept.syntax: "CREG ACCEPT <#canal>"
  accept.example: "%command_prefix%CREG ACCEPT #canal"
  accept.short: "Aprobă o cerere de înregistrare a canalului."
  accept.help: "Verifică din nou solicitantul și activează înregistrarea."
  reject.syntax: "CREG REJECT <#canal> <motiv>"
  reject.example: "%command_prefix%CREG REJECT #canal Motivo público"
  reject.short: "Respinge o cerere de înregistrare a canalului."
  reject.help: "Respinge cererea cu motiv obligatoriu și restricție."
  example: "%command_prefix%CREG PENDING"
  short: "Revizuiește cererile de înregistrare a canalelor."
  help: |-
    Listează cererile în așteptare sau aprobă ori respinge o cerere.
    Respingerea necesită un motiv. Numai ACCEPT înregistrează canalul.

  pending_header: "Înregistrări în așteptare (pagina %page%)"
  pending_item: "%channel% — solicitant %requester%, trimisă %submitted%: %description%"
  accepted: "Înregistrarea pentru %channel% a fost aprobată."
  rejected: "Înregistrarea pentru %channel% a fost respinsă."
  not_pending: "Canalul %channel% nu are o înregistrare în așteptare."
  channel_not_on_network: "Canalul %channel% nu este în rețea."
  founder_limit: "Solicitantul a atins limita de înregistrări de canale."
  requester_inactive: "Contul solicitantului nu mai este activ."
  requester_ineligible: "Solicitantul trebuie să aibă acum statut de operator pe canal."


# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#canal> <poreclă>"
  example: "%command_prefix%\x02\x0303DEHALFOP #canal Alice\x03\x0F"
  short: "Retrageți modul de semi-operator pe canal."
  help: "Retrageți modul de semi-operator pe canal."
  done: "\x0303✔\x03 Lui \x02%nickname%\x02 i s-a retras halfopul."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#canal> {ADD|DEL|LIST} [mască] [expirare] [motiv]"
  example: "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canal DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canal DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canal LIST\x03\x0F"
  short: "Gestionați lista de auto-kick."
  help: "Gestionează intrările de kick automat și expirarea lor opțională."
  unknown_sub: "\x0304✗\x03 Subcomandă necunoscută \x02%sub%\x02. Folosiți ADD, DEL sau LIST."
  invalid_mask: "\x0304✗\x03 Format de mască invalid. Folosiți \x02poreclă!ident@host\x02 cu metacaractere (*)."
  dangerous_mask: "\x0304✗\x03 Masca \x02%mask%\x02 este prea largă. Trebuie să conțină cel puțin 4 caractere alfanumerice."
  protected_user: "\x0304✗\x03 Porecla \x02%nickname%\x02 are acces pe acest canal."
  max_entries: "\x0304✗\x03 Maxim %max% intrări AKICK per canal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canal> ADD <mască> [expirare] [motiv]"
    example: "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 7d Spam\x03\x0F"
    short: "Adăugați intrare AKICK."
    help: |-
      Adaugă o mască la lista de kick automat a canalului.

      Poți indica o durată și un motiv. Dacă incluzi un motiv, trebuie să indici și
      durata: 0 pentru permanent, d pentru zile, h pentru ore sau m pentru minute.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 adăugat."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 există deja."
    notice_channel: "\x02%from%\x02 adaugă AKICK: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canal> DEL <mască|număr>"
    example: "%command_prefix%\x02\x0303AKICK #canal DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canal DEL 2\x03\x0F"
    short: "Eliminați intrare AKICK."
    help: "Eliminați după masca exactă sau numărul intrării din LIST."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 nu a fost găsit."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 eliminat."
    notice_channel: "\x02%from%\x02 elimină AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canal> LIST"
    example: "%command_prefix%\x02\x0303AKICK #canal LIST\x03\x0F"
    short: "Listați intrările AKICK."
    help: "Afișează masca, motivul, expirarea și cine a adăugat."
    header: "\x0303Lista AKICK pentru \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Canalul \x02%channel%\x02 nu are intrări AKICK."
    entry: "  #%index% %mask% %reason% (de %nickname%, expiră: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#canal>"
  example: "%command_prefix%\x02\x0303RESTORE #canal\x03\x0F"
  short: "Restaurați un canal în așteptare de ștergere."
  help: "Restaurează un canal șters manual, dacă perioada de grație nu a expirat."
  success: "\x0303✔\x03 Canalul \x02%channel%\x02 a fost restaurat."
  not_pending_deletion: "\x0304✗\x03 Canalul \x02%channel%\x02 nu este în așteptare de ștergere."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#canal> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #canal\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP #canal FORCE\x03\x0F"
  short: "Eliminați un canal înregistrat."
  help: |-
    Elimină din baza de date un canal înregistrat.
    FORCE șterge definitiv un canal aflat în așteptarea ștergerii.
    DROP pentru o cerere respinsă o elimină după expirarea blocării.
    Un IRCop autorizat poate elibera explicit o blocare nelimitată.
  registration_restricted: "\x0304✗\x03 Această cerere de înregistrare este restricționată până la %date%."
  force:
    short: "Șterge definitiv un canal aflat în așteptarea ștergerii."
  success: "\x0303✔\x03 Canalul \x02%channel%\x02 a fost marcat pentru ștergere și poate fi restaurat în perioada de grație."
  force_success: "\x0303✔\x03 Canalul \x02%channel%\x02 a fost șters definitiv."
  pending_deletion: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja în așteptare de ștergere. Folosiți DROP <#canal> FORCE pentru a-l șterge definitiv."
  invalid_channel: "\x0304✗\x03 Nume de canal invalid. Folosiți \x02#canal\x02."
  pending_deletion_reason: "Canalul %channel% este în curs de ștergere. Mai multe informații: /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canal> <durată> <motiv>"
  example: "%command_prefix%\x02\x0303SUSPEND #canal 7d Încălcarea regulilor\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND #canal 0 Încălcarea regulilor\x03\x0F"
  short: "Suspendă un canal."
  help: |-
    Suspendă temporar un canal înregistrat. Formate de durată: 0 = permanent,
    1d, 12h, 60m.
    Pe durata suspendării, modurile, accesul și aplicarea regulilor sunt
    dezactivate.
  success: "\x0303✔\x03 Canalul \x02%channel%\x02 a fost suspendat până la \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 Canalul \x02%channel%\x02 este deja suspendat."
  invalid_duration: "\x0304✗\x03 Durată invalidă. Folosiți: 0 (permanent), 1d, 12h sau 60m."
  channel_suspended: "\x0304✗\x03 Canalul \x02%channel%\x02 este suspendat și nu poate fi folosit."
  notice_channel: "\x0304⚠\x03 Canalul a fost suspendat. Motiv: %reason%"


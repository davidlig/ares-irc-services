    Înregistrează un canal și asociază-l poreclei tale. Identifică-te cu
    %nickserv%.
    În modul APPROVAL, un IRCop trebuie să aprobe cererea.
  success: "Canalul %channel% a fost înregistrat."
  already_registered: "Canalul %channel% este deja înregistrat sau are o cerere de înregistrare în curs."
  channel_not_on_network: "Canalul %channel% nu există în rețea."
  pending_deletion: "Canalul %channel% este în așteptare de ștergere și nu poate fi înregistrat."
  insufficient_channel_rank: "Trebuie să ai cel puțin statut de operator pe %channel% pentru a-l înregistra."
  limit_exceeded: "Ați atins limita maximă de %max% canale înregistrate."
  throttled: "Trebuie să așteptați %minutes% minut(e) înainte de a înregistra alt canal."

  awaiting_approval: "Cererea de înregistrare pentru %channel% așteaptă aprobarea unui IRCop."

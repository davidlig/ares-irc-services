# OperServ-vertalingen — Nederlands
# Domein: operserv
#
# IRC-opmaakcodes (dubbele aanhalingstekens of letterlijke !irc-blokken):
#   \x02        vet aan/uit
#   \x03NN      kleur (DECIMAAL: 03=groen, 04=rood, 07=oranje, 14=donkergrijs)
#   \x03        kleur herstellen
#   \x0F        alle opmaak herstellen
#
# IRC-kleuren gebruiken DECIMALE getallen (0-15), geen hexadecimale.
#   \x0314 = donkergrijs (14 decimaal): GOED
#   \x030F = kleur 0 gevolgd door de letter F: FOUT
#
# IRC-tekst over meerdere regels: !irc |- met echte regeleinden en spaties.
# Blokken zonder tag decoderen geen escapes; behoud letterlijke CTCP-waarden.
# HELP-voorbeelden: example/examples en %command_prefix%.
# De presentatielaag voegt /msg zonder kleur en een marge van twee spaties toe.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "Dit commando is voorbehouden aan netwerk-rootbeheerders."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [commando] [optie]"
  short: "Toon commando's of hulp voor een commando."
  help: |-
    Toont zonder argumenten alle commando’s. Gebruik %help_command% voor volledige
    hulp, of %help_option_command% voor SET-subopties.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Beheert netwerkoperators en hun rechten, past toegangsbeperkingen toe en
    verbreekt gebruikersverbindingen. Ook kun je algemene aankondigingen sturen en
    welkomstberichten voor het netwerk beheren.
  general_header: "Beschikbare opdrachten:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opties:"
  examples_header: "Voorbeelden:"
  general_help_command: "HELP <opdracht>"
  option_help_command: "HELP %command% <optie>"
  detail_help_command: "HELP <commando>"
  detail_help_option_command: "HELP <commando> <optie>"
  general_footer: "Gebruik /msg %bot% %help_command% voor meer informatie."
  set_sub_footer: "Gebruik /msg %bot% %help_command% voor meer informatie."
  syntax_label: "Syntaxis: %syntax%"
  footer: ""
  intro_expiration: "OPMERKING: Nicknamen die langer dan %days% dagen niet zijn gebruikt, worden automatisch verwijderd."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operators en rollen"
    network_security: "Netwerkbeveiliging"
    communication: "Communicatie"
    low_level: "Laag niveau"
  ircop_header: "Beschikbare opdrachten voor IRC-operators:"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <bijnaam> <rol>|DEL <bijnaam>|LIST}"
  short: "Beheer netwerk IRC-operators."
  help: |-
    Beheer netwerk IRC-operators. ADD voegt een geregistreerde bijnaam toe
    als operator met de opgegeven rol.
    DEL verwijdert een operator. LIST toont alle operators.
    Gebruik ROLE LIST om beschikbare rollen te zien.
    Dit commando is voorbehouden aan Root-gebruikers die in de services zijn
    geconfigureerd.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Onbekende sub-opdracht %sub%. Gebruik ADD, DEL of LIST."
  unknown_role: "Rol %role% bestaat niet. Gebruik /msg %bot% %role_list% om beschikbare rollen te zien."
  already_admin: "%nickname% is al een IRC-operator (rol: %role%)."
  not_admin: "%nickname% is geen IRC-operator."
  role_changed: "Rol gewijzigd voor %nickname% van %old% naar %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <bijnaam> <rol>"
    short: "Voeg een netwerk IRC-operator toe."
    help: |-
      Voegt een geregistreerde bijnaam toe als netwerk IRC-operator.
      Gebruik ROLE LIST om beschikbare rollen te zien.
      Dit commando is voorbehouden aan Root-gebruikers.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "%nickname% toegevoegd als %role%."
    nick_not_active: "Bijnaam %nickname% is geen actieve geregistreerde bijnaam."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <bijnaam>"
    short: "Verwijder een netwerk IRC-operator."
    help: |-
      Verwijdert een netwerk IRC-operator uit de lijst.
      Dit commando is voorbehouden aan Root-gebruikers.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "%nickname% verwijderd uit IRC-operators."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Toon alle netwerk IRC-operators."
    help: |-
      Toont alle netwerk IRC-operators met hun rollen en registratiedatum.
      Dit commando is voorbehouden aan Root-gebruikers.
    example: "%command_prefix%IRCOP LIST"
    header: "Netwerk IRC Operators"
    empty: "Er zijn geen IRC-operators."

# --- ROLE ------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rol>|SET <rol> [operclass]}"
    short: "Beheert de UnrealIRCd-operatorclass."
    help: |-
      Bekijk en configureer de operclass van een rol.

      %options_header%
      %option_LIST%Toont beschikbare operclasses op het netwerk.
      %option_VIEW%Toont de operclass van de rol en de beschikbare opties.
      %option_SET%Wijst IRCOPs bij identificatie een operclass toe.

      Laat de waarde weg om deze te verwijderen.

      Alleen beschikbaar bij UnrealIRCd-protocollen.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SOPORTE"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE"
    list:
      header: "Beschikbare Operclasses in het Netwerk"
      empty: "Geen operclasses beschikbaar in het netwerk."
      not_supported: "Het huidige protocol ondersteunt het weergeven van beschikbare operclasses niet."
    view:
      empty: "Rol %role% heeft geen operclass."
      line: "Operclass: %operclass%"
      available: "Beschikbare operclasses: %available%"
    set:
      done: "De operclass voor rol %role% is ingesteld."
      cleared: "De operclass voor rol %role% is verwijderd."
      not_available: "Operclass %operclass% is niet beschikbaar in het netwerk. Beschikbare operclasses: %available%."
  syntax: "ROLE {ADD <naam> [beschrijving]|DEL <naam>|LIST|PERMS {{ADD|DEL} <rol> <permissie>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modi]}|VHOST {VIEW <rol>|SET <rol> [vhost]}}"
  short: "Beheert operatorrollen, rechten en instellingen."
  help: |-
    Beheert operatorrollen, rechten en instellingen.

    De rollen ADMIN, OPER en PREOPER zijn beschermd en kunnen niet verwijderd
    worden.
    Alleen voor Root-gebruikers.
  syntax_operclass: "ROLE {ADD <naam> [beschrijving]|DEL <naam>|LIST|PERMS {{ADD|DEL} <rol> <permissie>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modi]}|VHOST {VIEW <rol>|SET <rol> [vhost]}|OPERCLASS {LIST|VIEW <naam>|SET <naam> [operclass]}}"
  help_operclass: |-
    Beheer operatorrollen. ADD maakt een nieuwe rol aan, DEL verwijdert deze,
    LIST toont alle rollen, PERMS beheert permissies voor een rol, MODES beheert IRCOP-modi,
    VHOST beheert het geforceerde vhost-patroon voor een rol, OPERCLASS beheert de Unreal-operclass.
    Beschermde rollen (ADMIN, OPER, PREOPER) kunnen niet worden verwijderd.
    Dit commando is voorbehouden aan Root-gebruikers.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SOPORTE Supportoperators"
  unknown_sub: "Onbekende subopdracht %sub%. Gebruik ADD, DEL, LIST, PERMS, MODES of VHOST."
  unknown_sub_operclass: "Onbekende subopdracht %sub%. Gebruik ADD, DEL, LIST, PERMS, MODES, VHOST of OPERCLASS."
  not_found: "Rol %role% bestaat niet."
  already_exists: "Rol %role% bestaat al."
  protected: "Rol %role% is beschermd en kan niet worden verwijderd."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <naam> [beschrijving]"
    short: "Maak een nieuwe rol aan."
    help: |-
      Maakt een nieuwe aangepaste rol aan. Beschrijving is optioneel.
      Dit commando is voorbehouden aan Root-gebruikers.
    example: "%command_prefix%ROLE ADD SOPORTE Supportoperators"
    done: "Rol %role% aangemaakt."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <naam>"
    short: "Verwijder een rol."
    help: |-
      Verwijdert een aangepaste rol. Beschermde rollen (ADMIN, OPER, PREOPER)
      kunnen niet worden verwijderd. Als de rol operators toegewezen heeft,
      moet u deze eerst opnieuw toewijzen.
      Dit commando is voorbehouden aan Root-gebruikers.
    example: "%command_prefix%ROLE DEL SOPORTE"
    done: "Rol %role% verwijderd."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Toont beschikbare rollen."
    help: |-
      Toont alle rollen. Beschermde rollen zijn gemarkeerd met [PROTECTED].
      Dit commando is voorbehouden aan Root-gebruikers.
    example: "%command_prefix%ROLE LIST"
    header: "Operatorrollen"
    empty: "Er zijn geen operatorrollen."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rol> <permissie>|{LIST|CLEAR} <rol>}"
    short: "Beheert de rechten van een rol."
    help: |-
      Beheert toegewezen rechten voor een rol.

      %options_header%
      %option_LIST%Toont alle beschikbare rechten en welke zijn toegewezen.
      %option_ADD%Wijst een recht toe.
      %option_DEL%Verwijdert een recht (niet voor beschermde rollen).
      %option_CLEAR%Verwijdert alle rechten.

      %assigned_status% betekent toegewezen; %unassigned_status% betekent beschikbaar.

      Gebruik ALL om alle beschikbare rechten tegelijk toe te voegen.
      Alleen voor Root-gebruikers.
    example: "%command_prefix%ROLE PERMS LIST SOPORTE"
    examples:
      - "%command_prefix%ROLE PERMS ADD SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SOPORTE ALL"
      - "%command_prefix%ROLE PERMS DEL SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SOPORTE"
    not_found: "Permissie %perm% bestaat niet."
    already_has: "Rol %role% heeft al permissie %perm%."
    does_not_have: "Rol %role% heeft permissie %perm% niet."
    list:
      header: "Rechtenlijst voor %role%"
      columns: "Toegewezen | Rechtssleutel | Beschrijving"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Permissie %perm% toegevoegd aan rol %role%."
      all_done: "%count% permissies toegevoegd aan rol %role%."
    del:
      done: "Permissie %perm% verwijderd uit rol %role%."
    clear:
      done: "%count% permissies verwijderd uit rol %role%."
      empty: "Rol %role% heeft geen permissies toegewezen."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rol>|SET <rol> [modi]}"
    short: "Configureert gebruikersmodi voor een rol."
    help: |-
      Beheert IRCOP-gebruikersmodi die aan een rol zijn toegewezen.

      %options_header%
      %option_VIEW%Toont de huidige modi van de rol.
      %option_SET%Stelt IRCOP-modi in.

      Laat de modi weg om ze allemaal te verwijderen.

      Gebruikers met deze rol krijgen de modi bij identificatie.
      Beschikbare modi per IRCD
      Alleen voor Root-gebruikers.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Modi voor %role%"
      empty: "De rol %role% heeft geen modi toegewezen."
      line: "Modi: %modes%"
    set:
      done: "Modi %modes% ingesteld voor rol %role%."
      cleared: "Alle modi verwijderd uit rol %role%."
      invalid_mode: "De modus %mode% is geen geldige IRCOP-modus."
      invalid_modes: "Ongeldige modi: %invalid%. Geldige modi: %valid%."
      no_irc_user_modes: "De huidige IRCD heeft geen IRCOP-modi geconfigureerd."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rol>|SET <rol> [vhost]}"
    short: "Stelt het virtuele hostpatroon van een rol in."
    help: |-
      Stelt de virtuele host in die operators van een rol bij identificatie krijgen,
      in plaats van hun persoonlijke host.

      De host wordt opgebouwd uit de bijnaam zonder speciale tekens en het patroon.
      Voorbeeld:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Toont het ingestelde patroon van een rol.
      %option_SET%Stelt het patroon in of verwijdert het.

      Het patroon accepteert letters, cijfers, streepjes en punten. Het moet minstens
      één punt bevatten, mag niet beginnen of eindigen met een streepje of punt en mag
      geen opeenvolgende punten bevatten.

      Gebruik SET zonder patroon om de geforceerde host te verwijderen.

      Alleen voor Root-gebruikers.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Geforceerde vhost voor %role%"
      empty: "De rol %role% heeft geen geforceerd vhost-patroon ingesteld."
      line: "Patroon: %pattern%"
      example: "Voorbeeld: %example_nickname%.%pattern%"
      example_nickname: "bijnaam"
    set:
      done: "Geforceerd vhost-patroon ingesteld voor rol %role%."
      cleared: "Geforceerd vhost-patroon verwijderd uit rol %role%."
      invalid: "Ongeldig vhost-patroon. Geldige tekens: a-z, A-Z, 0-9, - en .. Moet ten minste één punt bevatten, mag niet beginnen/eindigen met - of . of .. hebben"

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <bijnaam> <reden>"
  short: "Verbreek geforceerd de verbinding van een gebruiker met het netwerk."
  help: |-
    Verbreekt de verbinding van een gebruiker met het IRC-netwerk.
    IRC-operators en Root-gebruikers kunnen niet gekilld worden.
  example: "%command_prefix%KILL BadUser Kanaaloverlast"
  protected_root: "Kan Root-gebruiker %nickname% niet killen."
  protected_ircop: "Kan IRC-operator %nickname% niet killen."
  done: "Gebruiker %nickname% is gekilld (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <masker> <verloop> <reden>|DEL {<masker>|<nummer>}|LIST [masker]}"
  short: "Beheer netwerkbrede G-lines."
  help: |-
    Beheert netwerkbrede G-lines (bans).
    ADD voegt een G-line toe met masker, vervaltijd en reden.
    DEL verwijdert een G-line op masker of vermeldingsnummer.
    LIST toont alle G-lines en kan op masker worden gefilterd.

    Vervaltijd: 0 = permanent, of achtervoegsel d, h, m (bijv. 7d, 12h, 30m).
    G-lines die overeenkomen met Root- of IRC-operatorgebruikers worden geweigerd.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spammisbruik"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Aanhoudend misbruik"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Onbekende sub-opdracht %sub%. Gebruik ADD, DEL of LIST."
  invalid_mask: "Ongeldig maskerformaat. Moet in formaat gebruiker@host zijn (bijv. *@192.168.*)."
  global_mask: "G-line masker %mask% is te breed. Globale maskers zijn niet toegestaan."
  dangerous_mask: "G-line masker %mask% is te breed. Het hostdeel heeft ten minste 4 alfanumerieke tekens nodig."
  protected_user: "Kan beschermde gebruiker %nickname% niet G-linen."
  invalid_expiry: "Ongeldig verloopformaat. Gebruik 0 voor permanent, of een waarde zoals 7d, 12h, 30m."
  already_exists: "G-line voor %mask% bestaat al."
  max_entries: "Maximaal aantal G-lines (%max%) bereikt."
  not_found: "G-line %mask% niet gevonden."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <masker> <verloop> <reden>"
    short: "Voeg een netwerkbrede G-line toe."
    help: |-
      Voegt een netwerkbrede G-line (ban) toe.
      Het masker moet de vorm gebruiker@host hebben.
      Vervaltijd: 0 = permanent, of achtervoegsel d, h, m (bijv. 7d, 12h, 30m).
      G-lines die overeenkomen met Root- of IRC-operatorgebruikers worden geweigerd.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spammisbruik"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Aanhoudend misbruik"
    done: "G-line toegevoegd: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<masker>|<nummer>}"
    short: "Verwijder een G-line."
    help: |-
      Verwijdert een G-line uit de lijst.
      Je kunt het masker of het vermeldingsnummer uit LIST opgeven.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% verwijderd."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [masker]"
    short: "Toon alle G-lines."
    help: "Toont alle G-lines. Optioneel filteren op maskerpatroon."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-lines (%count%)"
    empty: "Er zijn geen G-lines."
    entry: "%index%. %mask% - %reason% (%nickname%, verloopt: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {service|nick!ident@vhost} {PRIVMSG|NOTICE} <bericht>"
  short: "Stuur een globaal bericht naar alle verbonden gebruikers."
  help: |-
    Stuurt berichten naar alle verbonden gebruikers via een bestaande service of een
    tijdelijke client met aangepaste identiteit.

    Berichten kunnen als PRIVMSG (privé) of NOTICE (melding) worden verzonden.

    Voor een tijdelijke client moet een masker in de vorm bijnaam!ident@vhost worden
    opgegeven, met geldige tekens voor elk veld.

    De bijnaam mag niet geregistreerd of in gebruik zijn. De client verbreekt na
    verzending automatisch de verbinding en de bijnaam wordt 24 uur geblokkeerd.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Onderhoud over 10 minuten"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE Het netwerk wordt herstart"
  mask_invalid: "Ongeldig maskerformaat: %error%"
  nick_connected: "Bijnaam %nickname% is momenteel verbonden."
  nick_registered: "Bijnaam %nickname% is geregistreerd."
  type_invalid: "Berichttype moet PRIVMSG of NOTICE zijn."
  done: "Globaal bericht verzonden van %nickname% naar %count% gebruikers."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <regel>"
  short: "Stuur een rauwe protocolregel naar de IRCd."
  help: |-
    Stuurt de opgegeven regel rechtstreeks naar de socket van de uplink-IRCd.
    Gebruik dit uiterst voorzichtig. Ongeldige protocolregels kunnen het netwerk
    platleggen.
  example: "%command_prefix%RAW :services.ares NOTICE * :Gepland onderhoud"
  empty: "U moet een niet-lege regel opgeven om te verzenden."
  too_long: "Regel is te lang. Maximum 510 tekens."
  not_connected: "Niet verbonden met IRCd."
  done: "Rauwe regel verzonden."
  protocol:
    syntax: "Het actieve protocol heeft de syntaxis van het RAW-commando geweigerd."
    done: "RAW-commando van het protocol uitgevoerd."
    target: "Het actieve protocol heeft doel %target% geweigerd."
    unsupported: "Het actieve protocol ondersteunt dit RAW-commando niet."
    invalid_resource_type: "Onbekend protocolresourcetype: %resource_type%."
    invalid_resource: "Ongeldige protocolresource: %resource%."
    invalid_value: "Ongeldige waarde voor protocolresource: %resource%."
    error: "Het actieve protocol kon het RAW-commando niet uitvoeren."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator% voert commando GLOBAL uit met bijnaam %target% via %type% naar %count% gebruikers. Bericht: %message%"
  prefix_message: "Bericht: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Beheer connect MOTD-berichten die naar gebruikers worden gestuurd bij verbinding."
  syntax: "MOTD {ADD <doel> {PRIVMSG|NOTICE} <verloop> <bericht>|DEL <id>|LIST|CLEAN}"
  help: |-
    Beheert MOTD-vermeldingen (bericht van de dag) die bij verbinding naar
    gebruikers
    worden gestuurd.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Onbekende subopdracht. Gebruik: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <verloop> <bericht>"
    syntax_hint: "Gebruik: %syntax%"
    short: "Voeg een MOTD-vermelding toe."
    help: |-
      Voegt een MOTD-bericht toe dat naar elke gebruiker wordt gestuurd bij
      verbinding.
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Onderhoud vanavond"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Welkom a la red"
    done: "MOTD-vermelding #%id% toegevoegd."
    invalid_type: "Ongeldig berichttype. Moet PRIVMSG of NOTICE zijn."
    invalid_expiry: "Ongeldige vervaldatum. Gebruik: <getal><s|m|h|d> of 0 voor onbeperkt (bijv. 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Gebruik: %syntax%"
    short: "Verwijder een MOTD-vermelding."
    help: "Verwijdert een MOTD-vermelding op basis van ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "MOTD-vermelding #%id% verwijderd."
    not_found: "MOTD-vermelding niet gevonden."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Toon alle MOTD-vermeldingen."
    help: "Toont alle ingestelde MOTD-vermeldingen."
    example: "%command_prefix%MOTD LIST"
    empty: "Geen MOTD-vermeldingen geconfigureerd."
    header: "MOTD-vermeldingen:"
    status_enabled: "ingeschakeld"
    status_disabled: "uitgeschakeld"
    expired: "verlopen"
    no_bot: "(geen bot)"
    shown_count: "%count% keer getoond"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Verwijder alle verlopen MOTD-vermeldingen."
    help: "Verwijdert alle verlopen MOTD-vermeldingen."
    example: "%command_prefix%MOTD CLEAN"
    done: "%count% verlopen MOTD-vermeldingen verwijderd."
    none: "Geen verlopen MOTD-vermeldingen om te verwijderen."
  debug:
    finalized: "MOTD-bericht #%id% is beëindigd: [%type%] %message% | %date% | %shown_count%"

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <domein> <reden>|DEL {nummer|ALL}|LIST <patroon> [pagina]}"
  short: "Geblokkeerde e-maildomeinen beheren."
  help: |-
    Geblokkeerde e-maildomeinen beheren.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <domein> <reden>"
    short: "Een domein blokkeren."
    help: |-
      Accepteert ASCII- of punycode-domeinen, geen adressen of patronen. Een
      reden is verplicht. De blokkade geldt exact, niet voor subdomeinen.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {nummer|ALL}"
    short: "Domeinblokkades verwijderen."
    help: |-
      Verwijder een blijvend nummer of alle vermeldingen met ALL. Andere
      nummers veranderen niet.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <patroon> [pagina]"
    short: "Geblokkeerde domeinen tonen."
    help: |-
      Een patroon is verplicht. Alleen * is een joker voor elke tekenreeks.
      Hoofdletters worden genegeerd. De optionele pagina begint bij 1.
      Nummers blijven behouden bij filteren en pagineren.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Ongeldig domein. Gebruik ASCII of punycode zonder afsluitende punt."
  invalid_reason: "Een niet-lege administratieve reden op één regel is verplicht."
  duplicate: "Dit domein is al geblokkeerd."
  not_found: "Geen geblokkeerd domein met dit nummer."
  added: "Domein %domain% geblokkeerd."
  deleted: "Domeinblokkade %id% verwijderd."
  cleared: "%total% domeinblokkades verwijderd."
  empty: "Geen overeenkomende geblokkeerde domeinen."
  header: "ID | Domein | Reden"
  page: "Pagina %page%/%pages%, %total% overeenkomende domeinen."
  row: "%id% | %domain% | %reason%"

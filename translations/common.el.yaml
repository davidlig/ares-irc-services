# Μεταφράσεις κοινών μηνυμάτων — Ελληνικά
# Τομέας: common
#
# Κωδικοί μορφοποίησης IRC (διπλά εισαγωγικά ή κυριολεκτικά μπλοκ !irc):
#   \x02        ενεργοποίηση/απενεργοποίηση έντονης γραφής
#   \x03NN      χρώμα (ΔΕΚΑΔΙΚΟ: 03=πράσινο, 04=κόκκινο, 07=πορτοκαλί, 14=σκούρο γκρι)
#   \x03        επαναφορά χρώματος
#   \x0F        επαναφορά όλης της μορφοποίησης
#
# Τα χρώματα IRC χρησιμοποιούν ΔΕΚΑΔΙΚΟΥΣ αριθμούς (0-15), όχι δεκαεξαδικούς.
#   \x0314 = σκούρο γκρι (14 δεκαδικό): ΣΩΣΤΟ
#   \x030F = χρώμα 0 και μετά το γράμμα F: ΛΑΘΟΣ
#
# Πολυγραμμικό κείμενο IRC: !irc |- με πραγματικές αλλαγές γραμμής και κενά.
# Τα μπλοκ χωρίς ετικέτα δεν αποκωδικοποιούν διαφυγές· διατηρήστε τα CTCP.
# Παραδείγματα HELP: example/examples και %command_prefix%.
# Ο παρουσιαστής προσθέτει άχρωμο /msg και περιθώριο δύο κενών.

# --- UNKNOWN COMMAND -------------------------------------------------------
unknown_command: "\x0304✗\x03\x0F Άγνωστη εντολή \x0303%command%\x03\x0F. Χρησιμοποιήστε /msg %bot% \x0303HELP\x03\x0F"

# --- UNKNOWN HELP OPTION ---------------------------------------------------
unknown_help_option: "\x0304✗\x03\x0F Άγνωστη επιλογή βοήθειας \x0303%option%\x03\x0F για την \x0303%command%\x03\x0F. Χρησιμοποιήστε /msg %bot% \x0303HELP %command%\x03\x0F"

# --- ERROR -----------------------------------------------------------------
error:
  syntax: "\x0304✗\x03 Λανθασμένη σύνταξη. Χρήση: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Αυτή η εντολή περιορίζεται σε IRC Operators."
  not_identified: "\x0304✗\x03 Δεν έχετε ταυτοποιηθεί. Χρησιμοποιήστε /msg %nickserv% \x0303IDENTIFY <ψευδώνυμο> <κωδικός>\x03"
  permission_denied: "\x0304✗\x03 Άρνηση πρόσβασης. Δεν έχετε πρόσβαση σε αυτήν την εντολή."
  mail_failed: "\x0304✗\x03 Το email δεν μπόρεσε να σταλεί. Ελέγξτε τη διεύθυνσή σας ή δοκιμάστε αργότερα."
  channel_not_registered: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν είναι καταχωρημένο."
  nick_not_registered: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι καταχωρημένο."
  insufficient_access: "\x0304✗\x03 Ανεπαρκής πρόσβαση για \x02%operation%\x02 στο κανάλι \x02%channel%\x02."
  nick_not_online: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι συνδεδεμένο."

# --- DURATION --------------------------------------------------------------
duration:
  unit:
    year:
      singular: "έτος"
      plural: "έτη"
    month:
      singular: "μήνας"
      plural: "μήνες"
    day:
      singular: "ημέρα"
      plural: "ημέρες"
    hour:
      singular: "ώρα"
      plural: "ώρες"
    minute:
      singular: "λεπτό"
      plural: "λεπτά"
    second:
      singular: "δευτερόλεπτο"
      plural: "δευτερόλεπτα"
  list_separator: ", "
  list_join: "%prefix% και %last%"

# --- ANTIFLOOD -------------------------------------------------------------
antiflood:
  blocked: "Έχετε υπερβεί το όριο ρυθμού εντολών. Παρακαλώ δοκιμάστε ξανά σε %seconds% δευτερόλεπτα."
  debug_channel: "%nick% %command% επιτεύχθηκε όριο για %host% (%seconds%s απομένουν)"

# --- CTCP ------------------------------------------------------------------
ctcp:
  version:
    tribute: |
      \x02Για τον πιστό και αιώνιο φίλο μου,\x02

      Αν και το 2023 ήταν η χρονιά που έπρεπε να πούμε αντίο, ο χρόνος δεν έχει σβήσει ούτε μία
      λεπτομέρεια από εσένα. Ακόμα θυμάμαι την απεριόριστη ενέργειά σου, το ευγενικό σου βλέμμα
      και εκείνη την τεράστια και μεταδοτική χαρά που μόνο εσύ ήξερες να δίνεις.

      Γέμισες το σπίτι μου με ζωή και τη ζωή μου με ανιδιοτελή αγάπη που δεν θα ξεχάσω ποτέ.
      Αν και πια δεν ακούω τα βήματά σου να τρέχουν για να με υποδεχτούν ούτε νιώθω το κεφάλι
      σου να ακουμπά πάνω μου αναζητώντας στοργή, ξέρω πως το παιχνιδιάρικο πνεύμα σου ακόμα
      με συντροφεύει.

      Σε ευχαριστώ για κάθε στιγμή, κάθε σκανταλιά, και που υπήρξες ο καλύτερος σύντροφος που
      θα μπορούσα να ζητήσω. Ο χώρος που άφησες δίπλα μου τώρα γεμίζει με τις πιο ευτυχισμένες
      αναμνήσεις. Θα είσαι πάντα ο αγαπημένος μου φίλος και θα έχεις πάντα μια τεράστια θέση
      στην καρδιά μου.

# --- DEBUG -----------------------------------------------------------------
debug:
  action_message: "%operator% εκτελεί την εντολή %command% σε %target%. %reason%"
  action_with_option: "%operator% εκτελεί την εντολή %command% σε %target%. Επιλογή: %option%. %reason%"
  action_with_value: "%operator% εκτελεί την εντολή %command% σε %target%. Επιλογή: %option%=%value%. %reason%"
  prefix_reason: "Αιτία: %reason%"
  action_duration: "%operator% εκτελεί την εντολή %command% σε %target%. Διάρκεια: %duration%. %reason%"

# --- HISTORY ---------------------------------------------------------------
history:
  unknown_operator: "(άγνωστος)"
  del:
    success: "\x0303✔\x03 Η καταχώρηση ιστορικού \x02%id%\x02 διαγράφηκε."
    not_found: "\x0304✗\x03 Η καταχώρηση ιστορικού \x02%id%\x02 δεν βρέθηκε."
    invalid_id: "\x0304✗\x03 Μη έγκυρο ID καταχώρησης: \x02%id%\x02."
  view:
    extra: "  Επιπλέον \x0307→\x03 %extra%"
  message:
    unsuspend: "Άρση αναστολής"
  extra:
    duration: "Διάρκεια: %value%"
    expires_at: "Λήγει: %value%"
    ip: "IP: %value%"
    host: "Host: %value%"

# --- LIST ------------------------------------------------------------------
list:
  page: "Σελίδα %page%/%pages% — %total% αποτελέσματα"
  status_suspended: "Σε αναστολή"
  status_pending_deletion: "Σε αναμονή διαγραφής"
  status_forbidden: "Απαγορευμένο"

# --- REPLY -----------------------------------------------------------------
reply:
  separator: "\x0314─────────────────────────────\x03"

# --- LABEL -----------------------------------------------------------------
label:
  no_reason: "Χωρίς αιτία"
  never: "ποτέ"
  unknown_creator: "άγνωστος"
  permanent: "Μόνιμη"
  permanent_inline: "μόνιμη"

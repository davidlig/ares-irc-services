# OperServ çevirileri — Türkçe
# Alan: operserv
#
# IRC biçimlendirme kodları (çift tırnaklar veya !irc düz metin blokları):
#   \x02        kalın yazıyı aç/kapat
#   \x03NN      renk (ONDALIK: 03=yeşil, 04=kırmızı, 07=turuncu, 14=koyu gri)
#   \x03        rengi sıfırla
#   \x0F        tüm biçimlendirmeyi sıfırla
#
# IRC renkleri onaltılık değil, ONDALIK sayılar (0-15) kullanır.
#   \x0314 = koyu gri (ondalık 14): DOĞRU
#   \x030F = 0 rengi ve ardından F harfi: HATA
#
# Çok satırlı IRC metni: !irc |- ile gerçek satır sonları ve boşluklar.
# Etiketsiz bloklar kaçışları çözmez; CTCP sabit metinlerini koruyun.
# HELP örnekleri: example/examples ve %command_prefix%.
# Sunum katmanı renksiz /msg ve iki boşlukluk kenar payı ekler.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "Bu komut yalnızca ağ root yöneticileri içindir."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [komut] [seçenek]"
  short: "Komutları listeleyin veya bir komut için yardım gösterin."
  help: |-
    Argüman olmadan tüm komutları listeler. Tam yardım için %help_command%, alt
    seçenekler için %help_option_command% kullanın.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Ağ operatörlerini ve izinlerini yönetmeyi, erişim kısıtlamaları uygulamayı ve
    kullanıcıların bağlantısını kesmeyi sağlar. Ayrıca genel duyurular göndermeye ve
    ağın karşılama mesajlarını yönetmeye yarar.
  general_header: "Kullanılabilir komutlar:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Seçenekler:"
  examples_header: "Örnekler:"
  general_help_command: "HELP <komut>"
  option_help_command: "HELP %command% <seçenek>"
  detail_help_command: "HELP <komut>"
  detail_help_option_command: "HELP <komut> <seçenek>"
  general_footer: "Daha fazla bilgi için /msg %bot% %help_command% kullanın."
  set_sub_footer: "Daha fazla bilgi için /msg %bot% %help_command% kullanın."
  syntax_label: "Sözdizimi: %syntax%"
  footer: ""
  intro_expiration: "NOT: %days% günden uzun süre kullanılmayan takma adlar otomatik olarak silinir."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operatörler ve roller"
    network_security: "Ağ güvenliği"
    communication: "İletişim"
    low_level: "Düşük seviye"
  ircop_header: "IRC operatörleri için kullanılabilir komutlar:"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <nickname> <rol>|DEL <nickname>|LIST}"
  short: "Ağ IRC operatörlerini yönetin."
  help: |-
    Ağ IRC operatörlerini yönetin. ADD, kayıtlı bir rumuzu
    belirtilen rolle operatör olarak ekler.
    DEL bir operatörü kaldırır. LIST tüm operatörleri gösterir.
    Mevcut rolleri görmek için ROLE LIST kullanın.
    Bu komut yalnızca hizmetlerde yapılandırılmış Root kullanıcıları içindir.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Bilinmeyen alt komut %sub%. ADD, DEL veya LIST kullanın."
  unknown_role: "%role% rolü mevcut değil. Kullanılabilir rolleri görmek için /msg %bot% %role_list% kullanın."
  already_admin: "%nickname% zaten bir IRC operatörüdür (rol: %role%)."
  not_admin: "%nickname% bir IRC operatörü değil."
  role_changed: "%nickname% için rol %old% yerine %new% olarak değiştirildi."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nickname> <rol>"
    short: "Bir ağ IRC operatörü ekleyin."
    help: |-
      Kayıtlı bir rumuzu ağ IRC operatörü olarak ekler.
      Mevcut rolleri görmek için ROLE LIST kullanın.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "%nickname%, %role% olarak eklendi."
    nick_not_active: "%nickname% rumuzu etkin bir kayıtlı rumuz değil."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nickname>"
    short: "Bir ağ IRC operatörünü kaldırın."
    help: |-
      Listeden bir ağ IRC operatörünü kaldırır.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "%nickname% IRC operatörlerinden kaldırıldı."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Tüm ağ IRC operatörlerini listeleyin."
    help: |-
      Tüm ağ IRC operatörlerini rolleri ve kayıt tarihleriyle listeler.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%IRCOP LIST"
    header: "Ağ IRC Operatörleri"
    empty: "IRC operatörü bulunmamaktadır."

# --- ROLE ------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rol>|SET <rol> [operclass]}"
    short: "UnrealIRCd operatör sınıfını yapılandırır."
    help: |-
      Bir rolün operclass değerini görüntüler ve yapılandırır.

      %options_header%
      %option_LIST%Ağdaki kullanılabilir operclass değerlerini gösterir.
      %option_VIEW%Rolün operclass değerini ve kullanılabilir olanları gösterir.
      %option_SET%Kimlik doğrulanırken IRCOP için operclass atar.

      Silmek için değeri boş bırakın.

      Yalnızca UnrealIRCd protokollerinde kullanılabilir.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW DESTEK"
      - "%command_prefix%ROLE OPERCLASS SET DESTEK services-admin"
      - "%command_prefix%ROLE OPERCLASS SET DESTEK"
    list:
      header: "Agdaki Kullanilabilir Operclass'lar"
      empty: "Agda kullanilabilir operclass yok."
      not_supported: "Gecerli protokol kullanilabilir operclass'lari listelemeyi desteklemiyor."
    view:
      empty: "%role% rolunun operclass degeri yok."
      line: "Operclass: %operclass%"
      available: "Kullanilabilir operclass'lar: %available%"
    set:
      done: "%role% rolü için operclass yapılandırıldı."
      cleared: "%role% rolünün operclass değeri silindi."
      not_available: "%operclass% operclass'i agda mevcut degil. Mevcut operclass'lar: %available%."
  syntax: "ROLE {ADD <ad> [açıklama]|DEL <ad>|LIST|PERMS {{ADD|DEL} <rol> <izin>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modlar]}|VHOST {VIEW <rol>|SET <rol> [sanal_host]}}"
  short: "Operatör rollerini, izinlerini ve yapılandırmalarını yönetir."
  help: |-
    Operatör rollerini, izinlerini ve yapılandırmalarını yönetir.

    ADMIN, OPER ve PREOPER rolleri korumalıdır ve silinemez.
    Yalnızca Root kullanıcıları kullanabilir.
  syntax_operclass: "ROLE {ADD <ad> [açıklama]|DEL <ad>|LIST|PERMS {{ADD|DEL} <rol> <izin>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modlar]}|VHOST {VIEW <rol>|SET <rol> [sanal_host]}|OPERCLASS {LIST|VIEW <ad>|SET <ad> [operclass]}}"
  help_operclass: |-
    Operatör rollerini, izinlerini ve yapılandırmalarını yönetir.

    ADMIN, OPER ve PREOPER rolleri korumalıdır ve silinemez.
    Yalnızca Root kullanıcıları kullanabilir.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD DESTEK Destek operatörleri"
  unknown_sub: "Bilinmeyen alt komut %sub%. ADD, DEL, LIST, PERMS, MODES veya VHOST kullanın."
  unknown_sub_operclass: "Bilinmeyen alt komut %sub%. ADD, DEL, LIST, PERMS, MODES, VHOST veya OPERCLASS kullanın."
  not_found: "%role% rolü mevcut değil."
  already_exists: "%role% rolü zaten mevcut."
  protected: "%role% rolü korumalıdır ve silinemez."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <ad> [açıklama]"
    short: "Yeni bir rol oluşturun."
    help: |-
      Yeni bir özel rol oluşturur. Açıklama isteğe bağlıdır.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%ROLE ADD DESTEK Destek operatörleri"
    done: "%role% rolü oluşturuldu."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <ad>"
    short: "Bir rolü silin."
    help: |-
      Özel bir rolü siler. Korumalı roller (ADMIN, OPER, PREOPER)
      silinemez. Rolde atanmış operatörler varsa,
      önce onları yeniden atamanız gerekir.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%ROLE DEL DESTEK"
    done: "%role% rolü silindi."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Kullanılabilir rolleri gösterir."
    help: |-
      Tüm rolleri listeler. Korumalı roller [PROTECTED] ile işaretlenir.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%ROLE LIST"
    header: "Operatör Rolleri"
    empty: "Operatör rolü bulunmamaktadır."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rol> <izin>|{LIST|CLEAR} <rol>}"
    short: "Rolün izinlerini yönetir."
    help: |-
      Bir role atanmış izinleri yönetir.

      %options_header%
      %option_LIST%Tüm kullanılabilir izinleri ve role atanmış olanları gösterir.
      %option_ADD%Role izin atar.
      %option_DEL%Rolden izin kaldırır (korumalı roller hariç).
      %option_CLEAR%Roldeki tüm izinleri kaldırır.

      %assigned_status% izin atandığını, %unassigned_status% kullanılabilir olduğunu belirtir.

      Tüm kullanılabilir izinleri aynı anda eklemek için ALL kullanın.
      Bu komut yalnızca Root kullanıcılarına açıktır.
    example: "%command_prefix%ROLE PERMS LIST DESTEK"
    examples:
      - "%command_prefix%ROLE PERMS ADD DESTEK operserv.gline"
      - "%command_prefix%ROLE PERMS ADD DESTEK ALL"
      - "%command_prefix%ROLE PERMS DEL DESTEK operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR DESTEK"
    not_found: "%perm% izni mevcut değil."
    already_has: "%role% rolü zaten %perm% iznine sahip."
    does_not_have: "%role% rolü %perm% iznine sahip değil."
    list:
      header: "%role% rolünün izin listesi"
      columns: "Atandı | İzin anahtarı | Açıklama"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "%perm% izni %role% rolüne eklendi."
      all_done: "%role% rolüne %count% izin eklendi."
    del:
      done: "%perm% izni %role% rolünden kaldırıldı."
    clear:
      done: "%role% rolünden %count% izin kaldırıldı."
      empty: "%role% rolüne atanmış izin yok."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rol>|SET <rol> [modlar]}"
    short: "Rolün kullanıcı modlarını yapılandırır."
    help: |-
      Bir role atanmış IRCOP kullanıcı modlarını yönetir.

      %options_header%
      %option_VIEW%Rolün mevcut modlarını gösterir.
      %option_SET%IRCOP modlarını ayarlar.

      Tüm modları kaldırmak için boş bırakın.

      Bu roldeki kullanıcılara kimlik doğrularken bu modlar verilir.
      IRCD’ye göre kullanılabilir modlar
      Bu komut yalnızca Root kullanıcılarına açıktır.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "%role% için Modlar"
      empty: "%role% rolüne atanmış mod yok."
      line: "Modlar: %modes%"
    set:
      done: "%role% rolü için modlar %modes% olarak ayarlandı."
      cleared: "%role% rolünden tüm modlar kaldırıldı."
      invalid_mode: "%mode% modu geçerli bir IRCOP modu değil."
      invalid_modes: "Geçersiz modlar: %invalid%. Geçerli modlar: %valid%."
      no_irc_user_modes: "Mevcut IRCD'de yapılandırılmış IRCOP modu yok."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rol>|SET <rol> [sanal_host]}"
    short: "Rolün sanal ana bilgisayar kalıbını yapılandırır."
    help: |-
      Kimlik doğrularken rol operatörlerine kişisel hostlarının yerine verilecek sanal
      hostu yapılandırır.

      Host, özel karakterler içermeyen takma adın yapılandırılmış kalıpla
      birleştirilmesiyle oluşturulur. Örnek:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Bir rol için yapılandırılmış kalıbı gösterir.
      %option_SET%Bir rolün kalıbını ayarlar veya siler.

      Kalıpta yalnızca harf, rakam, tire ve nokta kullanılabilir. En az bir nokta
      içermeli; tire veya noktayla başlayıp bitmemeli ve art arda nokta içermemelidir.

      Zorunlu hostu kaldırmak için kalıp belirtmeden SET kullanın.

      Yalnızca Root kullanıcıları kullanabilir.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "%role% için Zorunlu vhost"
      empty: "%role% rolü için zorunlu vhost kalıbı ayarlanmamış."
      line: "Kalıp: %pattern%"
      example: "Örnek: %example_nickname%.%pattern%"
      example_nickname: "rumuz"
    set:
      done: "%role% rolü için zorunlu vhost kalıbı ayarlandı."
      cleared: "%role% rolünden zorunlu vhost kalıbı kaldırıldı."
      invalid: "Geçersiz vhost kalıbı. Geçerli karakterler: a-z, A-Z, 0-9, - ve .. En az bir nokta olmalı, - veya . ile başlayamaz/bitemez veya .. içeremez."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <nickname> <gerekçe>"
  short: "Bir kullanıcıyı ağdan zorla ayırın."
  help: |-
    Bir kullanıcının IRC ağındaki bağlantısını keser.
    IRCop ve Root kullanıcıları KILL edilemez.
  example: "%command_prefix%KILL BadUser Kanallarda taşkınlık"
  protected_root: "Root kullanıcı %nickname% kill'lenemez."
  protected_ircop: "IRC operatörü %nickname% kill'lenemez."
  done: "%nickname% kullanıcısı kill'lendi (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <maske> <süre> <gerekçe>|DEL {<maske>|<numara>}|LIST [maske]}"
  short: "Ağ genelindeki G-line'ları yönetin."
  help: |-
    Ağ genelindeki G-line yasaklarını yönetir.
    ADD maske, süre ve gerekçeyle yeni G-line ekler.
    DEL maskeye veya kayıt numarasına göre G-line siler.
    LIST tüm G-line kayıtlarını listeler; isteğe bağlı olarak maskeyle filtreler.

    Süre biçimi: 0 = süresiz veya d, h, m soneki (ör. 7d, 12h, 30m).
    Root veya IRCop kullanıcılarıyla eşleşen G-line kayıtları reddedilir.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spam kötüye kullanımı"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Sürekli kötüye kullanım"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Bilinmeyen alt komut %sub%. ADD, DEL veya LIST kullanın."
  invalid_mask: "Geçersiz maske formatı. user@host formatında olmalıdır (örn., *@192.168.*)."
  global_mask: "G-line maskesi %mask% çok geniş. Genel maskeler kullanılamaz."
  dangerous_mask: "G-line maskesi %mask% çok geniş. Host kısmı en az 4 alfanümerik karakter içermelidir."
  protected_user: "Korumalı kullanıcı %nickname% G-line ile engellenemez."
  invalid_expiry: "Geçersiz süre formatı. Kalıcı için 0 veya 7g, 12s, 30d gibi bir değer kullanın."
  already_exists: "%mask% için G-line zaten mevcut."
  max_entries: "Maksimum G-line sayısına (%max%) ulaşıldı."
  not_found: "G-line %mask% bulunamadı."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <maske> <süre> <gerekçe>"
    short: "Ağ genelinde bir G-line ekleyin."
    help: |-
      Ağa genel G-line yasağı ekler.
      Maske kullanıcı@host biçiminde olmalıdır.
      Süre: 0 = süresiz veya d, h, m soneki (ör. 7d, 12h, 30m).
      Root veya IRCop kullanıcılarıyla eşleşen G-line kayıtları reddedilir.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spam kötüye kullanımı"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Sürekli kötüye kullanım"
    done: "G-line eklendi: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<maske>|<numara>}"
    short: "Bir G-line'ı kaldırın."
    help: |-
      Listeden bir G-line kaydını siler.
      Maskeyi veya LIST çıktısındaki kayıt numarasını belirtebilirsiniz.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% kaldırıldı."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [maske]"
    short: "Tüm G-line'ları listeleyin."
    help: |-
      Tüm G-line kayıtlarını listeler. İsteğe bağlı olarak maske kalıbına göre
      filtreler.
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-line'lar (%count%)"
    empty: "G-line bulunmamaktadır."
    entry: "%index%. %mask% - %reason% (%nickname%, bitiş: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {service|nick!ident@vhost} {PRIVMSG|NOTICE} <mesaj>"
  short: "Tüm bağlı kullanıcılara genel bir mesaj gönderin."
  help: |-
    Mevcut bir hizmeti veya özel kimlikli geçici bir istemciyi kullanarak bağlı tüm
    kullanıcılara mesaj gönderir.

    Mesajlar PRIVMSG (özel mesaj) veya NOTICE (bildirim) olarak gönderilebilir.

    Geçici istemci için her alanda geçerli karakterler kullanarak
    takma_ad!ident@vhost
    biçiminde maske belirtin.

    Takma ad kayıtlı veya kullanımda olmamalıdır. İstemcinin bağlantısı gönderimden
    sonra kesilir ve takma adı 24 saat boyunca engellenir.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG 10 dakika içinde bakım"
  examples:
    - "%command_prefix%GLOBAL Duyurular!oper@services.ares NOTICE Ağ yeniden başlatılacak"
  mask_invalid: "Geçersiz maske formatı: %error%"
  nick_connected: "%nickname% rumuzu şu anda bağlı."
  nick_registered: "%nickname% rumuzu kayıtlı."
  type_invalid: "Mesaj türü PRIVMSG veya NOTICE olmalıdır."
  done: "Genel mesaj %nickname% adresinden %count% kullanıcıya gönderildi."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <satır>"
  short: "IRCd'ye ham bir protokol satırı gönderin."
  help: |-
    Belirtilen satırı doğrudan bağlantı IRCd soketine gönderir.
    Son derece dikkatli kullanın. Geçersiz protokol satırları ağı kilitleyebilir.
  example: "%command_prefix%RAW :services.ares NOTICE * :Planlı bakım"
  empty: "Göndermek için boş olmayan bir satır belirtmelisiniz."
  too_long: "Satır çok uzun. Maksimum 510 karakter."
  not_connected: "IRCd'ye bağlı değil."
  done: "Ham satır gönderildi."
  protocol:
    syntax: "Etkin protokol RAW komutunun sözdizimini reddetti."
    done: "Protokol tarafından yönetilen RAW komutu yürütüldü."
    target: "Etkin protokol %target% hedefini reddetti."
    unsupported: "Etkin protokol bu RAW komutunu desteklemiyor."
    invalid_resource_type: "Bilinmeyen protokol kaynak türü: %resource_type%."
    invalid_resource: "Geçersiz protokol kaynağı: %resource%."
    invalid_value: "Protokol kaynağı için geçersiz değer: %resource%."
    error: "Etkin protokol RAW komutunu yürütemedi."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator%, %type% aracılığıyla %target% rumuzu ile %count% kullanıcıya GLOBAL komutunu çalıştırıyor. Mesaj: %message%"
  prefix_message: "Mesaj: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Bağlantıda kullanıcılara gönderilen MOTD mesajlarını yönetin."
  syntax: "MOTD {ADD <hedef> {PRIVMSG|NOTICE} <süre> <mesaj>|DEL <id>|LIST|CLEAN}"
  help: "Kullanıcı ağa bağlandığında gönderilen günün mesajı (MOTD) kayıtlarını yönetir."
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Bilinmeyen alt komut. Kullanın: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <süre> <mesaj>"
    syntax_hint: "Kullanım: %syntax%"
    short: "Bir MOTD girişi ekleyin."
    help: "Her kullanıcı ağa bağlandığında gönderilecek yeni bir MOTD mesajı ekler."
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Bu gece bakım"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Hoş geldiniz a la red"
    done: "MOTD girişi #%id% eklendi."
    invalid_type: "Geçersiz mesaj türü. PRIVMSG veya NOTICE olmalıdır."
    invalid_expiry: "Geçersiz sona erme biçimi. Şunu kullanın: <sayı><s|m|h|d> veya süresiz için 0 (ör. 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Kullanım: %syntax%"
    short: "Bir MOTD girişini silin."
    help: "Bir MOTD kaydını kimliğine göre siler."
    example: "%command_prefix%MOTD DEL 12"
    done: "MOTD girişi #%id% silindi."
    not_found: "MOTD girişi bulunamadı."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Tüm MOTD girişlerini listeleyin."
    help: "Yapılandırılmış tüm MOTD kayıtlarını listeler."
    example: "%command_prefix%MOTD LIST"
    empty: "Yapılandırılmış MOTD girişi yok."
    header: "MOTD girişleri:"
    status_enabled: "etkin"
    status_disabled: "devre dışı"
    expired: "süresi dolmuş"
    no_bot: "(bot yok)"
    shown_count: "%count% kez gösterildi"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Süresi dolmuş tüm MOTD girişlerini kaldırın."
    help: "Süresi dolmuş tüm MOTD kayıtlarını siler."
    example: "%command_prefix%MOTD CLEAN"
    done: "%count% süresi dolmuş MOTD girişi kaldırıldı."
    none: "Kaldırılacak süresi dolmuş MOTD girişi yok."
  debug:
    finalized: "MOTD mesajı #%id% sona erdi: [%type%] %message% | %date% | %shown_count%"

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <alan_adı> <gerekçe>|DEL {numara|ALL}|LIST <kalıp> [sayfa]}"
  short: "Engellenen e-posta alan adlarını yönet."
  help: |-
    Engellenen e-posta alan adlarını yönet.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <alan_adı> <gerekçe>"
    short: "Bir alan adını engelle."
    help: |-
      ASCII veya punycode alan adlarını kabul eder; adres veya kalıp kabul
      etmez. Gerekçe zorunludur. Engel tam eşleşir, alt alan adlarını
      kapsamaz.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {numara|ALL}"
    short: "Alan adı engellerini kaldır."
    help: |-
      Kalıcı bir kimliği veya ALL ile tüm kayıtları siler. Diğer kimlikler
      değişmez.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <kalıp> [sayfa]"
    short: "Engellenen alan adlarını listele."
    help: |-
      Kalıp zorunludur. Yalnızca * herhangi bir diziyi eşleştiren joker
      karakterdir. Büyük ve küçük harf ayrımı yapılmaz. İsteğe bağlı sayfa
      1’den başlar. Filtreleme ve sayfalama kimlikleri korur.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Geçersiz alan adı. Sonda nokta olmadan ASCII veya punycode kullanın."
  invalid_reason: "Boş olmayan, tek satırlık bir yönetim gerekçesi gereklidir."
  duplicate: "Bu alan adı zaten engellenmiş."
  not_found: "Bu kimliğe sahip engellenmiş alan adı yok."
  added: "%domain% alan adı engellendi."
  deleted: "%id% alan adı engeli kaldırıldı."
  cleared: "%total% alan adı engeli kaldırıldı."
  empty: "Eşleşen engellenmiş alan adı yok."
  header: "ID | Alan adı | Gerekçe"
  page: "Sayfa %page%/%pages%, eşleşen %total% alan adı."
  row: "%id% | %domain% | %reason%"

# OperServ çevirileri — Türkçe
# Alan: operserv
#
# IRC biçimlendirme kodları (çift tırnaklar veya !irc düz metin blokları):
#   \x02        kalın yazıyı aç/kapat
#   \x03NN      renk (ONDALIK: 03=yeşil, 04=kırmızı, 07=turuncu, 14=koyu gri)
#   \x03        rengi sıfırla
#   \x0F        tüm biçimlendirmeyi sıfırla
#
# IRC renkleri onaltılık değil, ONDALIK sayılar (0-15) kullanır.
#   \x0314 = koyu gri (ondalık 14): DOĞRU
#   \x030F = 0 rengi ve ardından F harfi: HATA
#
# Çok satırlı IRC metni: !irc |- ile gerçek satır sonları ve boşluklar.
# Etiketsiz bloklar kaçışları çözmez; CTCP sabit metinlerini koruyun.
# HELP örnekleri: example/examples ve %command_prefix%.
# Sunum katmanı renksiz /msg ve iki boşlukluk kenar payı ekler.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "\x0304✗\x03 Bu komut yalnızca ağ root yöneticileri içindir."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [komut] [seçenek]"
  short: "Komutları listeleyin veya bir komut için yardım gösterin."
  help: !irc |-
    Argüman olmadan tüm komutları listeler. Tam yardım için \x0303HELP <komut>\x03, alt
    seçenekler için \x0303HELP <komut> <seçenek>\x03 kullanın.
  example: "%command_prefix%\x02\x0303HELP KILL\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Ağ operatörlerini ve izinlerini yönetmeyi, erişim kısıtlamaları uygulamayı ve
    kullanıcıların bağlantısını kesmeyi sağlar. Ayrıca genel duyurular göndermeye ve
    ağın karşılama mesajlarını yönetmeye yarar.
  general_header: "\x02 ■ Kullanılabilir komutlar:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Seçenekler:\x02"
  examples_header: "\x02 ■ Örnekler:\x02"
  general_footer: "\x0310ℹ\x03\x0F Daha fazla bilgi için /msg %bot% \x02\x0303HELP <komut>\x03\x0F kullanın."
  set_sub_footer: "\x0310ℹ\x03\x0F Daha fazla bilgi için /msg %bot% \x02\x0303HELP %command% <seçenek>\x03\x0F kullanın."
  syntax_label: "Sözdizimi: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0307⚠\x03\x0F NOT: %days% günden uzun süre kullanılmayan takma adlar otomatik olarak silinir."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    operators_roles: "Operatörler ve roller"
    network_security: "Ağ güvenliği"
    communication: "İletişim"
    low_level: "Düşük seviye"
  ircop_header: "\x02 ■ IRC operatörleri için kullanılabilir komutlar:\x02"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD|DEL|LIST} [nickname] [rol]"
  short: "Ağ IRC operatörlerini yönetin."
  help: |-
    Ağ IRC operatörlerini yönetin. ADD, kayıtlı bir rumuzu
    belirtilen rolle operatör olarak ekler.
    DEL bir operatörü kaldırır. LIST tüm operatörleri gösterir.
    Mevcut rolleri görmek için ROLE LIST kullanın.
    Bu komut yalnızca hizmetlerde yapılandırılmış Root kullanıcıları içindir.
  example: "%command_prefix%\x02\x0303IRCOP ADD Ana OPER\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL veya LIST kullanın."
  unknown_role: "\x0304✗\x03 \x02%role%\x02 rolü mevcut değil. Kullanılabilir rolleri görmek için /msg %bot% \x0303ROLE LIST\x03 kullanın."
  already_admin: "\x0304✗\x03 \x02%nickname%\x02 zaten bir IRC operatörüdür (rol: %role%)."
  not_admin: "\x0304✗\x03 \x02%nickname%\x02 bir IRC operatörü değil."
  role_changed: "\x0303✓\x03 \x02%nickname%\x02 için rol %old% yerine %new% olarak değiştirildi."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nickname> <rol>"
    short: "Bir ağ IRC operatörü ekleyin."
    help: |-
      Kayıtlı bir rumuzu ağ IRC operatörü olarak ekler.
      Mevcut rolleri görmek için ROLE LIST kullanın.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%\x02\x0303IRCOP ADD Ana OPER\x03\x0F"
    done: "\x0303✓\x03 \x02%nickname%\x02, \x02%role%\x02 olarak eklendi."
    nick_not_active: "\x0304✗\x03 \x02%nickname%\x02 rumuzu etkin bir kayıtlı rumuz değil."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nickname>"
    short: "Bir ağ IRC operatörünü kaldırın."
    help: |-
      Listeden bir ağ IRC operatörünü kaldırır.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%\x02\x0303IRCOP DEL Ana\x03\x0F"
    done: "\x0303✓\x03 \x02%nickname%\x02 IRC operatörlerinden kaldırıldı."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Tüm ağ IRC operatörlerini listeleyin."
    help: |-
      Tüm ağ IRC operatörlerini rolleri ve kayıt tarihleriyle listeler.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
    header: "\x0307---\x03 \x02Ağ IRC Operatörleri\x02 \x0307---\x03"
    empty: "IRC operatörü bulunmamaktadır."

# --- ROLE ------------------------------------------------------------------
role:

  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW|SET} [rol] [parametreler]"
    short: "UnrealIRCd operatör sınıfını yapılandırır."
    help: !irc |-
      Bir rolün operclass değerini görüntüler ve yapılandırır.

      \x02 ■ Seçenekler:\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FAğdaki kullanılabilir operclass değerlerini gösterir.
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FRolün operclass değerini ve kullanılabilir olanları gösterir.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FKimlik doğrulanırken IRCOP için operclass atar.

      Silmek için değeri boş bırakın.

      Yalnızca UnrealIRCd protokollerinde kullanılabilir.
    example: "%command_prefix%\x02\x0303ROLE OPERCLASS LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE OPERCLASS VIEW DESTEK\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET DESTEK services-admin\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET DESTEK\x03\x0F"
    list:
      header: "\x0307---\x03 \x02Agdaki Kullanilabilir Operclass'lar\x02 \x0307---\x03"
      empty: "Agda kullanilabilir operclass yok."
      not_supported: "\x0304✗\x03 Gecerli protokol kullanilabilir operclass'lari listelemeyi desteklemiyor."
    view:
      empty: "%role% rolunun operclass degeri yok."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Kullanilabilir operclass'lar: \x0310%available%\x03"
    set:
      done: "\x0303✓\x03 %role% rolü için operclass yapılandırıldı."
      cleared: "\x0303✓\x03 %role% rolünün operclass değeri silindi."
      not_available: "\x0304✗\x03 \x02%operclass%\x02 operclass'i agda mevcut degil. Mevcut operclass'lar: %available%."
  syntax: "ROLE <seçenek> [ad] [...]"
  short: "Operatör rollerini, izinlerini ve yapılandırmalarını yönetir."
  help: |-
    Operatör rollerini, izinlerini ve yapılandırmalarını yönetir.

    ADMIN, OPER ve PREOPER rolleri korumalıdır ve silinemez.
    Yalnızca Root kullanıcıları kullanabilir.
  syntax_operclass: "ROLE <seçenek> [ad] [...]"
  help_operclass: |-
    Operatör rollerini, izinlerini ve yapılandırmalarını yönetir.

    ADMIN, OPER ve PREOPER rolleri korumalıdır ve silinemez.
    Yalnızca Root kullanıcıları kullanabilir.
  example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ROLE ADD DESTEK Destek operatörleri\x03\x0F"
  unknown_sub: "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL, LIST, PERMS, MODES veya VHOST kullanın."
  unknown_sub_operclass: "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL, LIST, PERMS, MODES, VHOST veya OPERCLASS kullanın."
  not_found: "\x0304✗\x03 \x02%role%\x02 rolü mevcut değil."
  already_exists: "\x0304✗\x03 \x02%role%\x02 rolü zaten mevcut."
  protected: "\x0304✗\x03 \x02%role%\x02 rolü korumalıdır ve silinemez."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <ad> [açıklama]"
    short: "Yeni bir rol oluşturun."
    help: |-
      Yeni bir özel rol oluşturur. Açıklama isteğe bağlıdır.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%\x02\x0303ROLE ADD DESTEK Destek operatörleri\x03\x0F"
    done: "\x0303✓\x03 \x02%role%\x02 rolü oluşturuldu."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <ad>"
    short: "Bir rolü silin."
    help: |-
      Özel bir rolü siler. Korumalı roller (ADMIN, OPER, PREOPER)
      silinemez. Rolde atanmış operatörler varsa,
      önce onları yeniden atamanız gerekir.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%\x02\x0303ROLE DEL DESTEK\x03\x0F"
    done: "\x0303✓\x03 \x02%role%\x02 rolü silindi."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Kullanılabilir rolleri gösterir."
    help: |-
      Tüm rolleri listeler. Korumalı roller [PROTECTED] ile işaretlenir.
      Bu komut yalnızca Root kullanıcıları içindir.
    example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
    header: "\x0307---\x03 \x02Operatör Rolleri\x02 \x0307---\x03"
    empty: "Operatör rolü bulunmamaktadır."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {ADD|DEL|LIST|CLEAR} <rol> [parametreler]"
    short: "Rolün izinlerini yönetir."
    help: !irc |-
      Bir role atanmış izinleri yönetir.

      \x02 ■ Seçenekler:\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FTüm kullanılabilir izinleri ve role atanmış olanları gösterir.
          \x0310›\x03\x0F \x02\x0303ADD       \x03\x0FRole izin atar.
          \x0310›\x03\x0F \x02\x0303DEL       \x03\x0FRolden izin kaldırır (korumalı roller hariç).
          \x0310›\x03\x0F \x02\x0303CLEAR     \x03\x0FRoldeki tüm izinleri kaldırır.

      ✓ izin atandığını, ✗ kullanılabilir olduğunu belirtir.

      Tüm kullanılabilir izinleri aynı anda eklemek için ALL kullanın.
      Bu komut yalnızca Root kullanıcılarına açıktır.
    example: "%command_prefix%\x02\x0303ROLE PERMS LIST DESTEK\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE PERMS ADD DESTEK operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS ADD DESTEK ALL\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS DEL DESTEK operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS CLEAR DESTEK\x03\x0F"
    not_found: "\x0304✗\x03 \x02%perm%\x02 izni mevcut değil."
    already_has: "\x0304✗\x03 \x02%role%\x02 rolü zaten \x02%perm%\x02 iznine sahip."
    does_not_have: "\x0304✗\x03 \x02%role%\x02 rolü \x02%perm%\x02 iznine sahip değil."
    list:
      header: "\x0303\x02%role%\x02 rolünün izin listesi\x03"
      columns: "Atandı | İzin anahtarı | Açıklama"
      row: "%assigned% | %permission% | %description%"
      assigned: "\x0303✓\x03\x0F"
      unassigned: "\x0304✗\x03\x0F"
    add:
      done: "\x0303✓\x03 \x02%perm%\x02 izni \x02%role%\x02 rolüne eklendi."
      all_done: "\x0303✓\x03 \x02%role%\x02 rolüne \x02%count%\x02 izin eklendi."
    del:
      done: "\x0303✓\x03 \x02%perm%\x02 izni \x02%role%\x02 rolünden kaldırıldı."
    clear:
      done: "\x0303✓\x03 \x02%role%\x02 rolünden \x02%count%\x02 izin kaldırıldı."
      empty: "\x0304✗\x03 \x02%role%\x02 rolüne atanmış izin yok."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW|SET} <rol> [modlar]"
    short: "Rolün kullanıcı modlarını yapılandırır."
    help: !irc |-
      Bir role atanmış IRCOP kullanıcı modlarını yönetir.

      \x02 ■ Seçenekler:\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FRolün mevcut modlarını gösterir.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FIRCOP modlarını ayarlar.

      Tüm modları kaldırmak için boş bırakın.

      Bu roldeki kullanıcılara kimlik doğrularken bu modlar verilir.
      IRCD’ye göre kullanılabilir modlar
      Bu komut yalnızca Root kullanıcılarına açıktır.
    example: "%command_prefix%\x02\x0303ROLE MODES VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER oH\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02%role% için Modlar\x02 \x0307---\x03"
      empty: "\x02%role%\x02 rolüne atanmış mod yok."
      line: "  Modlar: \x0303%modes%\x03"
    set:
      done: "\x0303✓\x03 \x02%role%\x02 rolü için modlar \x02%modes%\x02 olarak ayarlandı."
      cleared: "\x0303✓\x03 \x02%role%\x02 rolünden tüm modlar kaldırıldı."
      invalid_mode: "\x0304✗\x03 \x02%mode%\x02 modu geçerli bir IRCOP modu değil."
      invalid_modes: "\x0304✗\x03 Geçersiz modlar: %invalid%. Geçerli modlar: %valid%."
      no_irc_user_modes: "\x0304✗\x03 Mevcut IRCD'de yapılandırılmış IRCOP modu yok."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW|SET} <rol> [sanal_host]"
    short: "Rolün sanal ana bilgisayar kalıbını yapılandırır."
    help: !irc |-
      Kimlik doğrularken rol operatörlerine kişisel hostlarının yerine verilecek sanal
      hostu yapılandırır.

      Host, özel karakterler içermeyen takma adın yapılandırılmış kalıpla
      birleştirilmesiyle oluşturulur. Örnek:

      _davidlig_ + admin.ares → davidlig.admin.ares

      \x02 ■ Seçenekler:\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FBir rol için yapılandırılmış kalıbı gösterir.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FBir rolün kalıbını ayarlar veya siler.

      Kalıpta yalnızca harf, rakam, tire ve nokta kullanılabilir. En az bir nokta
      içermeli; tire veya noktayla başlayıp bitmemeli ve art arda nokta içermemelidir.

      Zorunlu hostu kaldırmak için kalıp belirtmeden SET kullanın.

      Yalnızca Root kullanıcıları kullanabilir.
    example: "%command_prefix%\x02\x0303ROLE VHOST VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER admin.ares\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02%role% için Zorunlu vhost\x02 \x0307---\x03"
      empty: "\x02%role%\x02 rolü için zorunlu vhost kalıbı ayarlanmamış."
      line: "  Kalıp: \x0303%pattern%\x03"
      example: "  Örnek: \x02rumuz\x02.%pattern%"
    set:
      done: "\x0303✓\x03 \x02%role%\x02 rolü için zorunlu vhost kalıbı ayarlandı."
      cleared: "\x0303✓\x03 \x02%role%\x02 rolünden zorunlu vhost kalıbı kaldırıldı."
      invalid: "\x0304✗\x03 Geçersiz vhost kalıbı. Geçerli karakterler: a-z, A-Z, 0-9, - ve .. En az bir nokta olmalı, - veya . ile başlayamaz/bitemez veya .. içeremez."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <nickname> <gerekçe>"
  short: "Bir kullanıcıyı ağdan zorla ayırın."
  help: |-
    Bir kullanıcının IRC ağındaki bağlantısını keser.
    IRCop ve Root kullanıcıları KILL edilemez.
  example: "%command_prefix%\x02\x0303KILL BadUser Kanallarda taşkınlık\x03\x0F"
  protected_root: "\x0304✗\x03 Root kullanıcı \x02%nickname%\x02 kill'lenemez."
  protected_ircop: "\x0304✗\x03 IRC operatörü \x02%nickname%\x02 kill'lenemez."
  done: "\x0303✓\x03 \x02%nickname%\x02 kullanıcısı kill'lendi (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD|DEL|LIST} [maske] [süre] [gerekçe]"
  short: "Ağ genelindeki G-line'ları yönetin."
  help: |-
    Ağ genelindeki G-line yasaklarını yönetir.
    ADD maske, süre ve gerekçeyle yeni G-line ekler.
    DEL maskeye veya kayıt numarasına göre G-line siler.
    LIST tüm G-line kayıtlarını listeler; isteğe bağlı olarak maskeyle filtreler.

    Süre biçimi: 0 = süresiz veya d, h, m soneki (ör. 7d, 12h, 30m).
    Root veya IRCop kullanıcılarıyla eşleşen G-line kayıtları reddedilir.
  example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Spam kötüye kullanımı\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Sürekli kötüye kullanım\x03\x0F"
    - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
  unknown_sub: "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL veya LIST kullanın."
  invalid_mask: "\x0304✗\x03 Geçersiz maske formatı. user@host formatında olmalıdır (örn., *@192.168.*)."
  global_mask: "\x0304✗\x03 G-line maskesi \x02%mask%\x02 çok geniş. Genel maskeler kullanılamaz."
  dangerous_mask: "\x0304✗\x03 G-line maskesi \x02%mask%\x02 çok geniş. Host kısmı en az 4 alfanümerik karakter içermelidir."
  protected_user: "\x0304✗\x03 Korumalı kullanıcı \x02%nickname%\x02 G-line ile engellenemez."
  invalid_expiry: "\x0304✗\x03 Geçersiz süre formatı. Kalıcı için 0 veya 7g, 12s, 30d gibi bir değer kullanın."
  already_exists: "\x0304✗\x03 \x02%mask%\x02 için G-line zaten mevcut."
  max_entries: "\x0304✗\x03 Maksimum G-line sayısına (%max%) ulaşıldı."
  not_found: "\x0304✗\x03 G-line \x02%mask%\x02 bulunamadı."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <maske> <süre> <gerekçe>"
    short: "Ağ genelinde bir G-line ekleyin."
    help: |-
      Ağa genel G-line yasağı ekler.
      Maske kullanıcı@host biçiminde olmalıdır.
      Süre: 0 = süresiz veya d, h, m soneki (ör. 7d, 12h, 30m).
      Root veya IRCop kullanıcılarıyla eşleşen G-line kayıtları reddedilir.
    example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Spam kötüye kullanımı\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Sürekli kötüye kullanım\x03\x0F"
    done: "\x0303✓\x03 G-line eklendi: \x02%mask%\x02 (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL <maske|numara>"
    short: "Bir G-line'ı kaldırın."
    help: |-
      Listeden bir G-line kaydını siler.
      Maskeyi veya LIST çıktısındaki kayıt numarasını belirtebilirsiniz.
    example: "%command_prefix%\x02\x0303GLINE DEL *@192.168.1.*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE DEL 2\x03\x0F"
    done: "\x0303✓\x03 G-line \x02%mask%\x02 kaldırıldı."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [maske]"
    short: "Tüm G-line'ları listeleyin."
    help: |-
      Tüm G-line kayıtlarını listeler. İsteğe bağlı olarak maske kalıbına göre
      filtreler.
    example: "%command_prefix%\x02\x0303GLINE LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
    header: "\x0307---\x03 \x02G-line'lar (%count%) \x0307---\x03"
    empty: "G-line bulunmamaktadır."
    entry: "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, bitiş: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {service|nick!ident@vhost} {PRIVMSG|NOTICE} <mesaj>"
  short: "Tüm bağlı kullanıcılara genel bir mesaj gönderin."
  help: |-
    Mevcut bir hizmeti veya özel kimlikli geçici bir istemciyi kullanarak bağlı tüm
    kullanıcılara mesaj gönderir.

    Mesajlar PRIVMSG (özel mesaj) veya NOTICE (bildirim) olarak gönderilebilir.

    Geçici istemci için her alanda geçerli karakterler kullanarak
    takma_ad!ident@vhost
    biçiminde maske belirtin.

    Takma ad kayıtlı veya kullanımda olmamalıdır. İstemcinin bağlantısı gönderimden
    sonra kesilir ve takma adı 24 saat boyunca engellenir.
  example: "%command_prefix%\x02\x0303GLOBAL %operserv% PRIVMSG 10 dakika içinde bakım\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLOBAL Duyurular!oper@services.ares NOTICE Ağ yeniden başlatılacak\x03\x0F"
  mask_invalid: "\x0304✗\x03 Geçersiz maske formatı: %error%"
  nick_connected: "\x0304✗\x03 \x02%nickname%\x02 rumuzu şu anda bağlı."
  nick_registered: "\x0304✗\x03 \x02%nickname%\x02 rumuzu kayıtlı."
  type_invalid: "\x0304✗\x03 Mesaj türü PRIVMSG veya NOTICE olmalıdır."
  done: "\x0303✓\x03 Genel mesaj \x02%nickname%\x02 adresinden %count% kullanıcıya gönderildi."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <satır>"
  short: "IRCd'ye ham bir protokol satırı gönderin."
  help: |-
    Belirtilen satırı doğrudan bağlantı IRCd soketine gönderir.
    Son derece dikkatli kullanın. Geçersiz protokol satırları ağı kilitleyebilir.
  example: "%command_prefix%\x02\x0303RAW :services.ares NOTICE * :Planlı bakım\x03\x0F"
  empty: "\x0304✗\x03 Göndermek için boş olmayan bir satır belirtmelisiniz."
  too_long: "\x0304✗\x03 Satır çok uzun. Maksimum 510 karakter."
  not_connected: "\x0304✗\x03 IRCd'ye bağlı değil."
  done: "\x0303✓\x03 Ham satır gönderildi."
  protocol:
    syntax: "\x0304✗\x03 Etkin protokol RAW komutunun sözdizimini reddetti."
    done: "\x0303✓\x03 Protokol tarafından yönetilen RAW komutu yürütüldü."
    target: "\x0304✗\x03 Etkin protokol %target% hedefini reddetti."
    unsupported: "\x0304✗\x03 Etkin protokol bu RAW komutunu desteklemiyor."
    invalid_resource_type: "\x0304✗\x03 Bilinmeyen protokol kaynak türü: %resource_type%."
    invalid_resource: "\x0304✗\x03 Geçersiz protokol kaynağı: %resource%."
    invalid_value: "\x0304✗\x03 Protokol kaynağı için geçersiz değer: %resource%."
    error: "\x0304✗\x03 Etkin protokol RAW komutunu yürütemedi."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator%, %type% aracılığıyla %target% rumuzu ile %count% kullanıcıya GLOBAL komutunu çalıştırıyor. Mesaj: %message%"
  prefix_message: "Mesaj: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Bağlantıda kullanıcılara gönderilen MOTD mesajlarını yönetin."
  syntax: "MOTD {ADD|DEL|LIST|CLEAN} [argümanlar]"
  help: "Kullanıcı ağa bağlandığında gönderilen günün mesajı (MOTD) kayıtlarını yönetir."
  example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Bilinmeyen alt komut. Kullanın: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <süre> <mesaj>"
    syntax_hint: "\x0304✗\x03 Kullanım: \x02%syntax%\x02"
    short: "Bir MOTD girişi ekleyin."
    help: "Her kullanıcı ağa bağlandığında gönderilecek yeni bir MOTD mesajı ekler."
    example: "%command_prefix%\x02\x0303MOTD ADD %operserv% NOTICE 24h Bu gece bakım\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303MOTD ADD %operserv% PRIVMSG 0 Hoş geldiniz a la red\x03\x0F"
    done: "\x0303✓\x03 MOTD girişi #%id% eklendi."
    invalid_type: "\x0304✗\x03 Geçersiz mesaj türü. \x02PRIVMSG\x02 veya \x02NOTICE\x02 olmalıdır."
    invalid_expiry: "\x0304✗\x03 Geçersiz sona erme biçimi. Şunu kullanın: \x02<sayı><s|m|h|d>\x02 veya süresiz için \x020\x02 (ör. 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "\x0304✗\x03 Kullanım: \x02%syntax%\x02"
    short: "Bir MOTD girişini silin."
    help: "Bir MOTD kaydını kimliğine göre siler."
    example: "%command_prefix%\x02\x0303MOTD DEL 12\x03\x0F"
    done: "\x0303✓\x03 MOTD girişi #%id% silindi."
    not_found: "\x0304✗\x03 MOTD girişi bulunamadı."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Tüm MOTD girişlerini listeleyin."
    help: "Yapılandırılmış tüm MOTD kayıtlarını listeler."
    example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
    empty: "Yapılandırılmış MOTD girişi yok."
    header: "MOTD girişleri:"
    status_enabled: "\x0303etkin\x03"
    status_disabled: "\x0304devre dışı\x03"
    expired: "\x0304süresi dolmuş\x03"
    no_bot: "(bot yok)"
    shown_count: "%count% kez gösterildi"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Süresi dolmuş tüm MOTD girişlerini kaldırın."
    help: "Süresi dolmuş tüm MOTD kayıtlarını siler."
    example: "%command_prefix%\x02\x0303MOTD CLEAN\x03\x0F"
    done: "\x0303✓\x03 %count% süresi dolmuş MOTD girişi kaldırıldı."
    none: "\x0303✓\x03 Kaldırılacak süresi dolmuş MOTD girişi yok."
  debug:
    finalized: "MOTD mesajı #%id% sona erdi: [%type%] %message% | %date% | %shown_count%"

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD|DEL|LIST} <parametreler>"
  short: "Engellenen e-posta alan adlarını yönet."
  help: |-
    Engellenen e-posta alan adlarını yönet.
  example: "%command_prefix%\x02\x0303BADMAIL LIST *\x03\x0f"
  add:
    syntax: "BADMAIL ADD <alan_adı> <gerekçe>"
    short: "Bir alan adını engelle."
    help: |-
      ASCII veya punycode alan adlarını kabul eder; adres veya kalıp kabul
      etmez. Gerekçe zorunludur. Engel tam eşleşir, alt alan adlarını
      kapsamaz.
    example: "%command_prefix%\x02\x0303BADMAIL ADD example.org abuse\x03\x0f"
  del:
    syntax: "BADMAIL DEL {numara|ALL}"
    short: "Alan adı engellerini kaldır."
    help: |-
      Kalıcı bir kimliği veya ALL ile tüm kayıtları siler. Diğer kimlikler
      değişmez.
    example: "%command_prefix%\x02\x0303BADMAIL DEL 1\x03\x0f"
  list:
    syntax: "BADMAIL LIST <kalıp> [sayfa]"
    short: "Engellenen alan adlarını listele."
    help: |-
      Kalıp zorunludur. Yalnızca * herhangi bir diziyi eşleştiren joker
      karakterdir. Büyük ve küçük harf ayrımı yapılmaz. İsteğe bağlı sayfa
      1’den başlar. Filtreleme ve sayfalama kimlikleri korur.
    example: "%command_prefix%\x02\x0303BADMAIL LIST *.org 2\x03\x0f"
  invalid_domain: "Geçersiz alan adı. Sonda nokta olmadan ASCII veya punycode kullanın."
  invalid_reason: "Boş olmayan, tek satırlık bir yönetim gerekçesi gereklidir."
  duplicate: "Bu alan adı zaten engellenmiş."
  not_found: "Bu kimliğe sahip engellenmiş alan adı yok."
  added: "\x0303✓\x03 \x02%domain%\x02 alan adı engellendi."
  deleted: "\x0303✓\x03 \x02%id%\x02 alan adı engeli kaldırıldı."
  cleared: "\x0303✓\x03 \x02%total%\x02 alan adı engeli kaldırıldı."
  empty: "Eşleşen engellenmiş alan adı yok."
  header: "ID | Alan adı | Gerekçe"
  page: "Sayfa %page%/%pages%, eşleşen %total% alan adı."
  row: "%id% | %domain% | %reason%"

# --- NICK PROTECTION ----------------------------------------------------------
protection:
  nick_in_use: "Porecla %nickname% este înregistrată. Veți fi redenumit dacă nu vă identificați."
  renamed_to: |-
    Ați fost redenumit în %guest_nick%. Pentru a vă recupera porecla:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <parolă>"
  nick_forbidden: "Porecla %nickname% este interzisă: %reason%"

# --- USERIP (IRCop) -----------------------------------------------------------
userip:
  syntax: "USERIP <poreclă>"
  short: "Obțineți adresa IP reală și hostname-ul poreclei."
  help: |-
    Afișează adresa IP și numele gazdei reale ale unei porecle.
    Folosește responsabil aceste informații sensibile.
  example: "%command_prefix%USERIP Utilizator"
  result: "Poreclă: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP (IRCop) ------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Caută nickname-uri după IP-ul ultimei lor conexiuni identificate."
  help: |-
    Afișează poreclele înregistrate a căror ultimă conexiune identificată a folosit
    această adresă IP. Adresa salvată poate fi învechită.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Nu există nickname-uri înregistrate care să corespundă acestei adrese IP."
  header: "Nickname-uri corespunzătoare:"

# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <model> [pagină]"
  short: "Listează poreclele înregistrate care se potrivesc unui model."
  help: |-
    Listează poreclele înregistrate care corespund tiparului. * reprezintă orice
    secvență de caractere; pagina opțională începe de la 1.
  example: "%command_prefix%LIST Utilizator*"
  examples:
    - "%command_prefix%LIST Utilizator* 2"
  header: "Poreclă | Înregistrare | Ultima conexiune | IP | Stare"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Nicio poreclă nu corespunde modelului %pattern%."
  status_pending: "În așteptare"
  status_registered: "Înregistrat"

# --- HISTORY ---
history:
  syntax: "HISTORY <poreclă> <opțiune> [parametri]"
  short: "Vizualizați sau gestionați istoricul de acțiuni al poreclei."
  help: |-
    Consultă și gestionează istoricul acțiunilor unei porecle. Suspendările și
    schimbările parolei, e-mailului ori recuperării sunt înregistrate automat.
    VIEW afișează trei intrări pe pagină; ALL afișează istoricul complet.
  example: "%command_prefix%HISTORY Utilizator VIEW"
  examples:
    - "%command_prefix%HISTORY Utilizator VIEW ALL"
    - "%command_prefix%HISTORY Utilizator ADD Notă manuală"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <poreclă> ADD <mesaj>"
    short: "Adăugați o intrare manuală în istoric."
    help: "Adaugă manual o intrare în istoricul poreclei."
    example: "%command_prefix%HISTORY Utilizator ADD Raportat pentru spam"
    success: "Intrare în istoric adăugată pentru %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <poreclă> DEL <id>"
    short: "Ștergeți o intrare din istoric după ID."
    help: "Șterge o intrare specifică din istoric după ID."
    example: "%command_prefix%HISTORY Utilizator DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <poreclă> VIEW [PAGINĂ|ALL]"
    short: "Vizualizați istoricul de acțiuni al poreclei."
    help: |-
      Afișează istoricul acțiunilor poreclei. Implicit, arată trei intrări pe pagină.
      Folosește ALL pentru a le vedea pe toate.
    example: "%command_prefix%HISTORY Utilizator VIEW"
    examples:
      - "%command_prefix%HISTORY Utilizator VIEW 2"
      - "%command_prefix%HISTORY Utilizator VIEW ALL"
    header: "%heading% (se afișează %start%-%end% din %total%):"
    header_title: "Istoric pentru %nickname%"
    entry: "#%id% [%date%] %action% de %operator% — %message%"
    no_entries: "Nu s-au găsit intrări în istoric pentru %nickname%."
    page_hint: "Folosiți %command% pentru mai multe intrări."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <poreclă> CLEAR"
    short: "Ștergeți toate intrările din istoricul unei porecle."
    help: "Șterge ireversibil toate intrările din istoricul poreclei."
    example: "%command_prefix%HISTORY Utilizator CLEAR"
    success: "S-au șters %count% intrări din istoricul poreclei %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Cont activat"
  resend: "Email de verificare retrimis"
  noexpire_on: "Protecție împotriva expirării activată"
  noexpire_off: "Protecție împotriva expirării dezactivată"
  userip: "Consultare USERIP"
  history_clear: "Istoric șters"
  password_changed_owner: "Parolă schimbată de proprietar"
  password_changed_operator: "Parolă schimbată de operator"
  email_changed_owner: "E-mail schimbat din %old_email% în %new_email%"
  email_changed_operator: "E-mail schimbat la %new_email% de operator"
  recover: "Parolă resetată prin token de e-mail"
  saregister: "Cont înregistrat administrativ"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Vechi e-mail: %value%"
  new_email: "Nou e-mail: %value%"
  method: "Metodă: %value%"

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <poreclă> <parolă> [email]"
  short: "Înregistrează administrativ o poreclă."
  help: |-
    Sintaxă: SAREGISTER <poreclă> <parolă> [email]

    Înregistrează administrativ o poreclă imediat, fără a necesita
    verificarea clientului sau limite de frecvență.

    În modul TOKEN, tokenul de salvare este afișat o singură dată operatorului.
    În modul EMAIL, tokenul de salvare este trimis la adresa de e-mail specificată.
  example: "%command_prefix%SAREGISTER Alice Parolă123"
  examples:
    - "%command_prefix%SAREGISTER Bob Parolă456 bob@exemplu.ro"
  success_token: "Porecla %nickname% a fost înregistrată. Token de salvare: %token%"
  success_email: "Porecla %nickname% a fost înregistrată. Token de salvare trimis la %email%."
  invalid_nickname: "Poreclă nevalidă %nickname%."

# --- SASET (IRCop) ------------------------------------------------------------
saset:
  syntax: "SASET <poreclă> <opțiune> [parametri]"
  short: "Modifică setările altei porecle."
  help: |-
    Permite unui IRCop să schimbe setările altei porecle înregistrate. Poreclele
    Root, IRCop și ale serviciilor nu sunt acceptate.
  example: "%command_prefix%SASET Utilizator PRIVATE ON"
  examples:
    - "%command_prefix%SASET Utilizator TIMEZONE OFF"
  unknown_option: "Opțiune necunoscută %option%. Opțiuni disponibile: %options%."
  cannot_modify_oper: "Nu se poate modifica o poreclă de operator IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <poreclă> PASSWORD <parolă_nouă>"
    short: "Schimbă parola unei porecle."
    help: "Schimbă imediat parola altei porecle."
    example: "%command_prefix%SASET Utilizator PASSWORD ClaveSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <poreclă> EMAIL <e-mail_nou>"
    short: "Schimbă e-mailul unei porecle."
    help: |-
      Schimbă imediat e-mailul altei porecle. Nu este necesar tokenul de recuperare și
      nu se trimite un e-mail de confirmare.
      BADMAIL nu restricționează această schimbare administrativă de email.
    example: "%command_prefix%SASET Utilizator EMAIL utilizator@exemplu.ro"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <poreclă> LANGUAGE <cod>"
    short: "Schimbă limba unei porecle."
    help: "Schimbă limba altei porecle. Sunt disponibile en (engleză) și es (spaniolă)."
    example: "%command_prefix%SASET Utilizator LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <poreclă> TIMEZONE {<fus_orar>|OFF}"
    short: "Schimbă fusul orar al unei porecle."
    help: "Setează sau elimină fusul orar al altei porecle. Folosește OFF pentru eliminare."
    example: "%command_prefix%SASET Utilizator TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Utilizator TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <poreclă> PRIVATE {ON|OFF}"
    short: "Schimbă confidențialitatea unei porecle."
    help: "Activează sau dezactivează confidențialitatea informațiilor altei porecle."
    example: "%command_prefix%SASET Utilizator PRIVATE ON"
    examples:
      - "%command_prefix%SASET Utilizator PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <poreclă> MSG {ON|OFF}"
    short: "Schimbă preferința de mesaje a unei porecle."
    help: |-
      Stabilește dacă altă poreclă primește răspunsurile ca PRIVMSG (ON) sau NOTICE
      (OFF).
    example: "%command_prefix%SASET Utilizator MSG ON"
    examples:
      - "%command_prefix%SASET Utilizator MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <poreclă> VHOST [vhost]"
    short: "Schimbă gazda virtuală a unei porecle."
    help: |-
      Setează sau elimină gazda virtuală a altei porecle. Rulează SASET <poreclă>
      VHOST fără valoare pentru eliminare.
    example: "%command_prefix%SASET Utilizator VHOST user.exemplu.ro"
    examples:
      - "%command_prefix%SASET Utilizator VHOST"

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax: "RENAME <poreclă>"
  short: "Forțați redenumirea unei porecle conectate la o poreclă aleatorie."
  help: |-
    Forțează o poreclă conectată să treacă la un nume aleatoriu cu un prefix
    stabilit
    de rețea.
  example: "%command_prefix%RENAME Problematic"
  cannot_rename_root: "Nu se poate redenumi utilizatorul root %nickname%."
  cannot_rename_oper: "Nu se poate redenumi operatorul IRC %nickname%."
  cannot_rename_service: "Nu se poate redenumi porecla de serviciu %nickname%."
  success: "Porecla %nickname% a fost redenumită în %new_nick%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <poreclă> {ON|OFF}"
  short: "Setați sau eliminați protecția împotriva expirării pentru o poreclă."
  help: |-
    Controlează expirarea poreclei din cauza inactivității.
    ON previne expirarea, iar OFF aplică regulile normale.
  example: "%command_prefix%NOEXPIRE Utilizator ON"
  examples:
    - "%command_prefix%NOEXPIRE Utilizator OFF"
  success_on: "Porecla %nickname% este acum protejată împotriva expirării."
  success_off: "Porecla %nickname% va expira acum normal."
  forbidden: "Porecla %nickname% este interzisă."
  suspended: "Porecla %nickname% este suspendată."

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Gestionează modul de înregistrare al rețelei."
  help: |-
    Configurează modul de înregistrare pentru conturile noi.

    %emphasis_0% Trimite tokenul de verificare la adresa de e-mail a utilizatorului.
    %emphasis_1% Oferă tokenul de verificare direct prin IRC.
    %emphasis_2% Afișează modul curent fără a-l modifica.

    Înregistrările în așteptare păstrează modul folosit la inițiere.

    În modul TOKEN, comanda RESEND rămâne dezactivată pentru toți utilizatorii.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Modul actual de înregistrare: %mode%."
  changed: "Modul de înregistrare a fost schimbat în %mode%."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <poreclă> <durată> <motiv>"
  short: "Suspendă o poreclă."
  help: |-
    Împiedică proprietarul să se identifice. Durata poate fi indicată în zile (d),
    ore (h), minute (m) sau 0 pentru suspendare permanentă. Operatorii IRC și
    utilizatorii Root nu pot fi suspendați.
  example: "%command_prefix%SUSPEND UtilizatorRău 7d Spam en #ayuda"
  examples:
    - "%command_prefix%SUSPEND Problematic 0 Evitarea interdicției"
  success: "Porecla %nickname% a fost suspendată până la %duration%."
  already_suspended: "Porecla %nickname% este deja suspendată."
  forbidden: "Porecla %nickname% este interzisă și nu poate fi suspendată."
  cannot_suspend_oper: "Nu se poate suspenda operatorul IRC %nickname%."
  cannot_suspend_root: "Nu se poate suspenda utilizatorul root %nickname%."
  cannot_suspend_service: "Nu se poate suspenda porecla de serviciu %nickname%."
  invalid_duration: "Durată invalidă. Folosiți: %duration_format% (de ex. 7d, 12h, 30m) sau %permanent% pentru permanentă."
  invalid_duration_format: "<z><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <poreclă>"
  short: "Eliminați suspendarea unei porecle."
  help: |-
    Elimină o suspendare activă, astfel încât proprietarul să se poată identifica
    din nou.
  example: "%command_prefix%UNSUSPEND Utilizator"
  success: "Suspendarea a fost ridicată pentru %nickname%."
  not_suspended: "Porecla %nickname% nu este suspendată."

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <poreclă> <motiv>"
  short: "Blocați permanent o poreclă de la a fi folosită."
  help: |-
    Interzice permanent o poreclă, astfel încât nimeni să nu o poată înregistra sau
    folosi. O înregistrare existentă este eliminată; utilizatorul conectat este
    mutat
    la o poreclă aleatorie. Poreclele Root, IRCop și ale serviciilor nu pot fi
    interzise.
  example: "%command_prefix%FORBID UtilizatorRău Încălcări repetate ale politicii"
  success: "Porecla %nickname% a fost interzisă."
  updated: "Motivul interzicerii pentru %nickname% a fost actualizat."
  reason_required: "Trebuie să furnizați un motiv pentru interdicție."
  cannot_forbid_root: "Nu se poate interzice utilizatorul root %nickname%."
  cannot_forbid_oper: "Nu se poate interzice operatorul IRC %nickname%."
  cannot_forbid_service: "Nu se poate interzice porecla de serviciu %nickname%."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <poreclă>"
  short: "Eliminați interdicția unei porecle."
  help: "Elimină interdicția, permițând folosirea din nou a poreclei."
  example: "%command_prefix%UNFORBID PoreclăInterzisă"
  success: "Porecla %nickname% nu mai este interzisă."
  not_forbidden: "Porecla %nickname% nu este interzisă."

# --- FORBIDVHOST (IRCop) ------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST <opțiune> [parametri]"
  short: "Gestionați modelele de vhost interzise."
  help: |-
    Gestionează tiparele care împiedică setarea VHost-urilor corespunzătoare prin
    SET
    VHOST. * reprezintă orice secvență, iar ? un singur caracter. Necesită drepturi
    IRCop.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Subcomandă necunoscută %sub%. Folosiți ADD, DEL sau LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <model>"
    short: "Adăugați un model de vhost interzis."
    help: |-
      Adaugă un tipar în listă. Utilizatorii nu vor putea seta VHost-uri care
      corespund
      prin SET VHOST. * reprezintă orice secvență, iar ? un singur caracter.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Model de vhost interzis adăugat: %pattern%"
    already_exists: "Modelul %pattern% există deja."
    invalid: "Format de model vhost invalid."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <model>"
    short: "Eliminați un model de vhost interzis."
    help: "Elimină un tipar din lista VHost-urilor interzise."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Model de vhost interzis eliminat: %pattern%"
    not_found: "Modelul %pattern% nu a fost găsit."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Listați toate modelele de vhost interzise."
    syntax: "FORBIDVHOST LIST"
    help: "Afișează toate tiparele VHost interzise."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Modele de vhost interzise (%count%):"
    entry: "%index%. %pattern% — de %nickname% (%date%)"
    empty: "Nu există modele de vhost interzise."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <poreclă> [FORCE]"
  short: "Eliminați o poreclă înregistrată."
  help: |-
    Marchează o poreclă înregistrată pentru ștergere în perioada de grație; poate fi
    restaurată cu RESTORE. Adaugă FORCE pentru ștergere permanentă. Nu pot fi șterse
    poreclele Root, IRCop, ale serviciilor sau propria ta poreclă.
  force:
    short: "Șterge definitiv o poreclă aflată în așteptarea ștergerii."
  example: "%command_prefix%DROP ContVechi"
  examples:
    - "%command_prefix%DROP ContVechi FORCE"
  suspended: "Porecla %nickname% este suspendată. Anulați mai întâi suspendarea."
  forbidden: "Porecla %nickname% este interzisă."
  cannot_drop_root: "Nu se poate elimina utilizatorul root %nickname%."
  cannot_drop_oper: "Nu se poate elimina operatorul IRC %nickname%."
  cannot_drop_self: "Nu vă puteți elimina propria poreclă."
  success: "Porecla %nickname% a fost marcată pentru ștergere și poate fi restaurată în perioada de grație."
  force_success: "Porecla %nickname% a fost ștearsă definitiv."
  pending_deletion: "Porecla %nickname% este deja în așteptare de ștergere. Folosiți DROP <poreclă> FORCE pentru a o șterge definitiv."
  cannot_drop_service: "Nu se poate elimina porecla de serviciu %nickname%."

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <poreclă>"
  short: "Restaurați o poreclă în așteptare de ștergere."
  help: |-
    Restaurează o poreclă aflată în așteptarea ștergerii, cât timp este în perioada
    de grație.
  example: "%command_prefix%RESTORE ContVechi"
  success: "Porecla %nickname% a fost restaurată."
  not_pending_deletion: "Porecla %nickname% nu este în așteptare de ștergere."

# --- RESCUE -------------------------------------------------------------------
rescue:
  issued: |-
    Token de salvare: %token_display%

    Păstrează acest token într-un loc sigur. Vei avea nevoie de el pentru a-ți recupera pseudonimul dacă îți uiți parola.

    Pentru a-l confirma, folosește: /msg %bot% %verify%

    %warning%
  issued_warning: "IMPORTANT: Numai ultimul token generat este valid. După confirmare, nu va mai fi afișat. Nu îl divulga nimănui."
  confirmed: "Tokenul de salvare a fost confirmat. Păstrează-l în siguranță."
  unavailable: "Autentifică-te și confirmă tokenul de salvare cu %command_0% înainte de această operație."
  unavailable_command_0: "VERIFY"
  locked_out: "Prea multe tokenuri incorecte. Încearcă din nou peste %seconds% secunde."
  throttled: "Prea multe tokenuri incorecte. Încearcă din nou peste %minutes% minut(e)."
  replaced: "Tokenul de recuperare a fost înlocuit cu tokenul din email pe care l-ai validat. Păstrează-l în siguranță."
  optional_replacement: |-
    Token nou de recuperare opțional: %token_display%

    Pentru a înlocui tokenul de recuperare actual, folosește: /msg %bot% %verify%

    Tokenul actual rămâne valid până la confirmare.

    Dacă nu dorești schimbarea, ignoră acest mesaj.
  replacement_unavailable: "Parola a fost resetată, dar nu s-a putut emite un token nou. Tokenul actual rămâne valid."
  temporarily_unavailable: "Livrarea tokenului de recuperare este temporar indisponibilă. Încearcă mai târziu."


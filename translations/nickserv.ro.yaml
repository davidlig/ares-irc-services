# Traduceri NickServ — Română
# Domeniu: nickserv
#
# Coduri de formatare IRC (ghilimele duble sau blocuri literale !irc):
#   \x02        activează/dezactivează caracterele aldine
#   \x03NN      culoare (ZECIMAL: 03=verde, 04=roșu, 07=portocaliu, 14=gri închis)
#   \x03        resetează culoarea
#   \x0F        resetează întreaga formatare
#
# Culorile IRC folosesc numere ZECIMALE (0-15), nu hexazecimale.
#   \x0314 = gri închis (14 zecimal): CORECT
#   \x030F = culoarea 0 urmată de litera F: EROARE
#
# Text IRC pe mai multe rânduri: !irc |- cu rânduri și spații reale.
# Blocurile fără etichetă nu decodează secvențe escape; păstrează literalii CTCP.
# Exemple HELP: example/examples și %command_prefix%.
# Prezentatorul adaugă /msg fără culoare și o margine de două spații.

# --- REGISTER -----------------------------------------------------------------
register:
  token_unavailable: !irc |-
    Înregistrarea este în așteptare, dar tokenul nu a putut fi livrat.
    Așteaptă expirarea înainte de a te înregistra din nou.
  syntax: "REGISTER <parolă> [email]"
  short: "Înregistrați-vă porecla la servicii."
  help: |-
    Înregistrează-ți porecla. Rețeaua îți va trimite tokenul de verificare prin chat
    sau e-mail, în funcție de configurare.
    După verificare, acesta devine tokenul tău permanent de recuperare:
    Păstrează-l într-un loc sigur.
    Durata de expirare %duration% se aplică doar înainte de verificare.
    Domeniile email blocate administrativ nu sunt permise.
  example: "%command_prefix%REGISTER Parolă$Sigură_123"
  examples:
    - "%command_prefix%REGISTER Parolă$Sigură_123 utilizator@exemplu.ro"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "A fost trimis un token de verificare la %email%."
  pending_line_2: "Rulează /msg %bot% %verify% pentru a finaliza înregistrarea."
  pending_line_3: "Nu l-ai primit? Verifică spamul sau folosește /msg %bot% %resend%"
  pending_line_4: "Tokenul expiră în %duration%."
  already_registered: "Porecla %nickname% este deja înregistrată."
  already_pending: "Înregistrarea pentru %nickname% este în așteptare. Folosește %verify%. Dacă tokenul a fost trimis prin e-mail și există o adresă validă asociată, poți solicita altul cu %resend%."
  forbidden: "Porecla %nickname% nu poate fi înregistrată în această rețea."
  pending_deletion: "Porecla %nickname% este în așteptare de ștergere și nu poate fi înregistrată."
  invalid_email: "Adresa de e-mail furnizată nu este validă."
  email_already_used: "E-mailul %email% este deja folosit de o altă poreclă. Folosiți o adresă diferită."
  throttled: "Trebuie să așteptați %minutes% minut(e) înainte de a încerca să vă înregistrați din nou."
  guest_prefix_forbidden: "Nu puteți înregistra o poreclă care începe cu %prefix%."

# --- IDENTIFY -----------------------------------------------------------------
identify:
  syntax: "IDENTIFY <poreclă> <parolă>"
  short: "Identificați-vă ca proprietar al unei porecle."
  help: |-
    Autentifică sesiunea dumneavoastră cu %nickserv% folosind porecla și parola.
    După o identificare reușită veți primi modul înregistrat %emphasis_0%
    și, dacă foloseați o poreclă de oaspete, porecla dumneavoastră înregistrată va
    fi restaurată.
  example: "%command_prefix%IDENTIFY Utilizator <parolă>"
  native_syntax: "/NICK <poreclă>:<parolă> | /NICK <poreclă>!<parolă>"
  native_short: "Afișează sintaxa nativă de autentificare a pseudonimului."
  native_help: |-
    Acest protocol autentifică conturile prin schimbarea pseudonimului.
    Folosește %emphasis_0% sau, dacă pseudonimul este ocupat, %emphasis_1%.
  native_example: "/NICK Utilizator:<parolă>"
  native_examples:
    - "%command_prefix%/NICK Utilizator!<parolă>"
  native_authentication: "Acest protocol gestionează autentificarea prin schimbarea pseudonimului. Folosește %command_0% sau, dacă pseudonimul este ocupat, %command_1%."
  native_authentication_command_0: "/NICK <poreclă>:<parolă>"
  native_authentication_command_1: "/NICK <poreclă>!<parolă>"
  success: "Sunteți acum identificat ca %nickname%."
  already_identified: "Sunteți deja identificat ca %nickname%."
  invalid_credentials: "Parolă incorectă. Vă rugăm să încercați din nou."
  locked_out: "Prea multe încercări eșuate. Încercați din nou peste %minutes% minut(e)."
  ghost_released: "Sesiunea fantomă care deținea %nickname% a fost deconectată."
  kill_reason: "Porecla %nickname% revendicată de %source% (proprietarul înregistrat s-a identificat)"
  pending: |-
    %first%
    %second%
  pending_line_1: "Porecla %nickname% este în așteptarea verificării e-mailului."
  pending_line_2: "Executați /msg %bot% %command_0% sau /msg %bot% %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Porecla %nickname% este suspendată. Motiv: %reason%"
  forbidden: "Porecla %nickname% nu poate fi folosită în această rețea."
  pending_deletion: "Porecla %nickname% este în așteptare de ștergere și nu poate fi folosită."

# --- VERIFY -------------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirmă o înregistrare sau un token de salvare."
  help: |-
    După verificare, tokenul devine tokenul tău permanent de recuperare.
    Păstrează-l în siguranță: îl poți folosi pentru a-ți recupera porecla.
    Durata de expirare %duration% se aplică doar înainte de verificare.
  example: "%command_prefix%VERIFY <token_primit>"
  success: "Porecla %nickname% a fost înregistrată cu succes și acum sunteți identificat."
  success_native: "Porecla %nickname% a fost înregistrată cu succes. Folosiți autentificarea nativă afișată mai jos."
  invalid_token: "Tokenul de salvare este invalid."
  no_pending: "Nu aveți nicio înregistrare în așteptare de verificat."

# --- RESEND -------------------------------------------------------------------
resend:
  disabled: "%resend% este dezactivat când REGMODE este TOKEN."
  syntax: "RESEND"
  short: "Retrimiteți tokenul de verificare la e-mailul dumneavoastră."
  help: |-
    RESEND este disponibil doar dacă tokenul de verificare a fost trimis prin
    e-mail.
    După verificare, tokenul devine tokenul tău permanent de recuperare. Păstrează-l
    în siguranță pentru a-ți putea recupera porecla. Expirarea %duration% se aplică
    doar înainte de verificare.
    Cu RESEND, vei primi un token nou prin e-mail.
    Termenul înregistrării în așteptare se prelungește cu %duration%.
  example: "%command_prefix%RESEND"
  success: "Tokenul de verificare a fost retrimis la %email%."
  no_pending: "Nu aveți nicio înregistrare în așteptare de verificat."
  throttled: "Trebuie să așteptați %minutes% minut(e) înainte de a solicita alt e-mail de verificare."

# --- RECOVER ------------------------------------------------------------------
recover:
  no_email: "Nu este setat niciun e-mail pentru porecla %nickname%. Recuperarea nu este disponibilă."
  email_sent: "Un token de recuperare a fost trimis la %email_hint%. Verificați inboxul (și folderul de spam)."
  pending_deletion: "Porecla %nickname% așteaptă ștergerea și nu poate fi recuperată."
  instructions: "EMAIL: %command_0% solicită un token provizoriu prin email. TOKEN: furnizează tokenul confirmat. %command_1% acceptă tokenul valid din email sau tokenul confirmat. Cel din email îl înlocuiește pe cel stocat doar după validare. Folosirea celui stocat oferă înlocuire opțională prin %command_2%; ignoră mesajul pentru a-l păstra."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <poreclă> [token]"
  short: "Recuperați-vă porecla dacă v-ați pierdut parola."
  help: |-
    Fără token, solicită prin e-mail un token provizoriu.
    Poți furniza și un token valid de recuperare; dacă este provizoriu, îl
    înlocuiește
    pe cel salvat doar după verificare.
    După folosirea tokenului salvat, VERIFY oferă opțional un înlocuitor; ignoră
    mesajul dacă dorești să-l păstrezi pe cel actual.
  example: "%command_prefix%RECOVER Utilizator"
  examples:
    - "%command_prefix%RECOVER Utilizator <token_primit>"
  pending: "Înregistrarea pentru %nickname% este în așteptare. Folosește %command_0%. %command_1% este disponibil doar cu REGMODE EMAIL și o adresă validă asociată."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Porecla %nickname% este suspendată. Motiv: %reason%"
  forbidden: "Porecla %nickname% nu poate fi folosită în această rețea."
  throttled: "Prea multe tokenuri incorecte. Încearcă din nou peste %minutes% minut(e)."
  invalid_token: "Tokenul de salvare este invalid."
  success_identify: "Parolă resetată. Identificați-vă acum: %identify_cmd%"
  success_then_change: "Apoi schimbați-vă parola: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <parolă_nouă>"

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <opțiune> [parametri]"
  short: "Schimbați opțiunile poreclei dumneavoastră."
  help: |-
    Modifică setările poreclei tale. Trebuie să fii identificat pentru a schimba
    aceste opțiuni.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Opțiune necunoscută %option%. Opțiuni disponibile: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <parolă_nouă>"
    short: "Schimbați parola poreclei dumneavoastră."
    help: |-
      Schimbă parola pentru porecla dumneavoastră. Noua parolă intră în
      vigoare imediat. Alegeți o parolă puternică de cel puțin 6 caractere
      pe care să nu o folosiți la alte servicii.
    example: "%command_prefix%SET PASSWORD Parolă$Sigură_123"
    success: "Parola dumneavoastră a fost actualizată cu succes."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Folosește %value% cu tokenul de salvare confirmat."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Schimbă adresa de e-mail folosind tokenul de recuperare confirmat."
    help: |-
      SET EMAIL schimbă adresa de contact după validarea tokenului de recuperare, fără
      a-l consuma. Verifică formatul și unicitatea; nu trimite e-mail de confirmare.
      Domeniile email blocate administrativ nu sunt permise.
    example: "%command_prefix%SET EMAIL utilizator@exemplu.ro <token_confirmado>"
    success: "E-mailul dumneavoastră a fost actualizat la %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Un token de confirmare a fost trimis la %current_email%."
    pending_line_2: "Pentru a confirma schimbarea la %new_email% executați:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "Tokenul expiră într-o oră."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "Tokenul este invalid sau a expirat. Solicitați unul nou cu %value%."
    invalid_token_value: "SET EMAIL <e-mail_nou>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <cod>"
    short: "Schimbați limba pe care serviciile o folosesc pentru a comunica cu dumneavoastră."
    help: |-
      Schimbă limba pe care %nickserv% și celelalte servicii o folosesc când vă
      vorbesc.
      Limbi disponibile:
      %emphasis_0% (catalană)
      %emphasis_1% (germană)
      %emphasis_2% (greacă)
      %emphasis_3% (engleză)
      %emphasis_4% (spaniolă)
      %emphasis_5% (bască)
      %emphasis_6% (franceză)
      %emphasis_7% (galiciană)
      %emphasis_8% (italiană)
      %emphasis_9% (olandeză)
      %emphasis_10% (poloneză)
      %emphasis_11% (portugheză)
      %emphasis_12% (română)
      %emphasis_13% (turcă)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Limba a fost schimbată în %language%."
    invalid: "Limbă nesuportată. Limbi disponibile: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <fus_orar>"
    short: "Setați fusul orar folosit la afișarea datelor."
    help: |-
      Setează fusul orar folosit de %nickserv% pentru afișarea datelor. Consultă HELP
      SET
      TIMEZONE pentru regiuni. Folosește OFF pentru eliminare.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Fusul orar a fost setat la %timezone%. Datele vor fi afișate în acest fus orar."
    cleared: "Fusul orar a fost șters. Datele vor folosi valoarea implicită a rețelei."
    invalid: "Fus orar invalid %timezone%. Folosiți un identificator valid (de ex. UTC, Europe/București)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Afișează sau ascunde informațiile poreclei tale."
    help: |-
      Controlează vizibilitatea informațiilor poreclei dumneavoastră în comanda INFO.
      Cu %emphasis_0% doar dumneavoastră și operatorii IRC puteți vizualiza detaliile.
      Cu %emphasis_1% informațiile dumneavoastră sunt publice pentru toată lumea.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Informațiile poreclei dumneavoastră sunt acum %value%."
    on_value: "private"
    off: "Informațiile poreclei dumneavoastră sunt acum %value%."
    off_value: "publice"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Schimbă modul în care serviciile îți trimit mesaje."
    help: |-
      Controlează cum %nickserv% și celelalte servicii îți trimit mesaje.
      Cu %emphasis_0%, răspunsurile sunt trimise ca %emphasis_1%.
      Cu %emphasis_2%, răspunsurile sunt trimise ca %emphasis_3%.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Mesajele serviciilor vor fi trimise acum ca %value%."
    on_value: "PRIVMSG"
    off: "Mesajele serviciilor vor fi trimise acum ca %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Setează sau elimină gazda virtuală."
    help: |-
      Setează un nume de gazdă personalizat, vizibil altor utilizatori când ești
      identificat.

      Pentru eliminare, rulează %emphasis_0% fără valoare.

      Sunt permise litere (a-z, A-Z), cifre, cratime și puncte. Fiecare segment
      trebuie
      să înceapă și să se termine cu o literă sau cifră. Numele poate avea maximum
      48 de caractere și trebuie să fie unic pentru fiecare poreclă.
    example: "%command_prefix%SET VHOST user.exemplu.ro"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Gazda dumneavoastră virtuală a fost setată la %vhost%."
    cleared: "Gazda dumneavoastră virtuală a fost ștearsă."
    invalid: "Vhost invalid. Doar litere, cifre, cratimă și punct (nu la începutul/sfârșitul blocului); max 48 de caractere."
    taken: "Acel vhost este deja folosit de o altă poreclă."
    forced: "Vhostul dumneavoastră este configurat automat și nu poate fi schimbat cu SET VHOST."


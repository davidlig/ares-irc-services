# --- UNBAN -----------------------------------------------------------------
unban:
  syntax: "UNBAN <#channel>"
  example: "%command_prefix%UNBAN #channel"
  short: "Αφαίρεση αποκλεισμών που σε επηρεάζουν."
  help: |-
    Αφαιρεί όλους τους απλούς αποκλεισμούς του καναλιού που αντιστοιχούν στην τρέχουσα ταυτότητά σου, μαζί με μπαλαντέρ και μάσκες IP/CIDR, σύμφωνα με το IRCd.
    Απαιτούνται ταυτοποίηση και το ρυθμιζόμενο επίπεδο UNBAN (προεπιλογή 200). Ο ιδρυτής διατηρεί πρόσβαση· δεν απαιτείται συμμετοχή ή δικαίωμα χειριστή στο κανάλι.
    Οι εκτεταμένοι αποκλεισμοί παραμένουν αμετάβλητοι. Δεν δέχεται ψευδώνυμο ή μάσκα ως όρισμα. Η ενέργεια δεν καταγράφεται στο HISTORY του καναλιού.
  done: "Αφαιρέθηκαν %count% αποκλεισμοί που σε επηρεάζουν στο %channel%."
  no_matches: "Κανένας απλός αποκλεισμός δεν αντιστοιχεί στην ταυτότητά σου στο %channel%· δεν άλλαξε τίποτα."
  unavailable: "Δεν ήταν δυνατός ο προσδιορισμός των αντίστοιχων αποκλεισμών σου· δεν άλλαξε τίποτα."
  not_on_network: "Το κανάλι %channel% δεν βρίσκεται στο δίκτυο."


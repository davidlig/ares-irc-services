  short: "Αφαίρεση λειτουργίας admin καναλιού."
  help: "Αφαίρεση λειτουργίας admin καναλιού."
  done: "\x0303✔\x03 Αφαιρέθηκε το admin από τον/την \x02%nickname%\x02."

# --- HALFOP ----------------------------------------------------------------

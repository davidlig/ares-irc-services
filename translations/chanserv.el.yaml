debug_channel:
  kick_reason: "Δεν είστε εξουσιοδοτημένοι να εισέλθετε σε αυτό το κανάλι."

# --- IRCOPONLY -------------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#channel> {ON|OFF}"
  example: "%command_prefix%\x02\x0303IRCOPONLY #κανάλι ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOPONLY #κανάλι OFF\x03\x0F"
  short: "Περιορίστε ένα κανάλι στους χειριστές IRC."
  help: |-
    Μόνο εξουσιοδοτημένοι χειριστές IRC μπορούν να παραμείνουν στο κανάλι. Το %bot%
    εισέρχεται και προστατεύει το +O.
  on: "Το IRCOPONLY ενεργοποιήθηκε στο %channel%."
  off: "Το IRCOPONLY απενεργοποιήθηκε στο %channel%."

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#channel> {ON|OFF}"
  example: "%command_prefix%\x02\x0303NOEXPIRE #Σημαντικό ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE #Σημαντικό OFF\x03\x0F"
  short: "Ορισμός ή αφαίρεση προστασίας λήξης για ένα κανάλι."
  help: |-
    Ελέγχει αν ένα κανάλι θα λήξει λόγω αδράνειας.
    Όταν είναι ON, το κανάλι δεν λήγει ποτέ ανεξάρτητα από την τελευταία
    δραστηριότητα.
    Όταν είναι OFF, ισχύουν οι κανονικοί κανόνες λήξης.

    Μόνο IRCops με άδεια 'chanserv.noexpire' μπορούν να χρησιμοποιήσουν αυτήν την
    εντολή.

    Σύνταξη: NOEXPIRE <#κανάλι> {ON|OFF}
    Παραδείγματα:
      NOEXPIRE #Important ON
      NOEXPIRE #Important OFF
  success_on: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 είναι τώρα προστατευμένο από λήξη."
  success_off: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 θα λήγει τώρα κανονικά."
  forbidden: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι απαγορευμένο."
  suspended: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι σε αναστολή."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <#channel> <reason>"
  example: "%command_prefix%\x02\x0303FORBID #κανάλι Παραβίαση κανόνων\x03\x0F"
  short: "Απαγόρευση χρήσης καναλιού."
  help: |-
    Αποτρέπει τη χρήση ενός καναλιού από οποιονδήποτε.
    Αν το κανάλι είναι τρέχοντα καταχωρημένο, θα διαγραφεί πρώτα.
    Όλοι οι χρήστες στο κανάλι θα γίνουν kick και το κανάλι θα κλειδωθεί.
    Αυτή η εντολή απαιτεί άδεια IRCop: chanserv.forbid
  reason_required: "\x0304✗\x03 Πρέπει να καθορίσετε μια αιτία."
  success: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 έχει απαγορευτεί."
  updated: "\x0303✔\x03 Η αιτία απαγόρευσης για το κανάλι \x02%channel%\x02 έχει ενημερωθεί."
  channel_forbidden: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι απαγορευμένο και δεν μπορεί να χρησιμοποιηθεί."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#channel>"
  example: "%command_prefix%\x02\x0303UNFORBID #κανάλι\x03\x0F"
  short: "Άρση απαγόρευσης καναλιού."
  help: |-
    Αφαιρεί την απαγόρευση ενός καναλιού, επιτρέποντας την εκ νέου καταχώρησή του.
    Αυτή η εντολή απαιτεί άδεια IRCop: chanserv.forbid
  success: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 δεν είναι πλέον απαγορευμένο."
  not_forbidden: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν είναι απαγορευμένο."

# --- DEBUG -----------------------------------------------------------------
debug:
  founder_action: "Ενέργεια ιδρυτή-επιπέδου"

# --- HISTORY ---------------------------------------------------------------
history:
  syntax: "HISTORY <#channel> {ADD|DEL|VIEW|CLEAR}"
  example: "%command_prefix%\x02\x0303HISTORY #κανάλι ADD Έλεγχος συντονισμού\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HISTORY #κανάλι DEL 42\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #κανάλι VIEW\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #κανάλι VIEW 2\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #κανάλι VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #κανάλι CLEAR\x03\x0F"
  short: "Προβολή ή διαχείριση ιστορικού ενεργειών καναλιού."
  help: |-
    Διαχείριση του ιστορικού ενεργειών για ένα κανάλι.
    Μόνο IRCops με άδεια 'chanserv.history' μπορούν να χρησιμοποιήσουν αυτήν την
    εντολή.

    Υπο-εντολές:
      ADD   — Προσθήκη χειροκίνητης καταχώρησης στο ιστορικό του καναλιού.
      DEL   — Διαγραφή συγκεκριμένης καταχώρησης μέσω ID.
      VIEW  — Προβολή καταχωρήσεων ιστορικού (σελιδοποιημένη, 3 ανά σελίδα).
      CLEAR — Διαγραφή όλων των καταχωρήσεων ιστορικού για το κανάλι.

    Σύνταξη: HISTORY <#κανάλι> {ADD|DEL|VIEW|CLEAR} [arguments]
    Παραδείγματα:
      HISTORY #channel VIEW
      HISTORY #channel VIEW 2
      HISTORY #channel VIEW ALL
      HISTORY #channel ADD Ύποπτη απόπειρα takeover
      HISTORY #channel DEL 42
      HISTORY #channel CLEAR

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#channel> ADD <message>"
    example: "%command_prefix%\x02\x0303HISTORY #κανάλι ADD Έλεγχος συντονισμού\x03\x0F"
    short: "Προσθήκη χειροκίνητης καταχώρησης ιστορικού."
    help: |-
      Προσθέτει μια χειροκίνητη καταχώρηση στο ιστορικό του καναλιού.
    success: "\x0303✔\x03 Η καταχώρηση ιστορικού προστέθηκε για το \x02%channel%\x02."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#channel> DEL <id>"
    example: "%command_prefix%\x02\x0303HISTORY #κανάλι DEL 42\x03\x0F"
    short: "Διαγραφή καταχώρησης ιστορικού μέσω ID."
    help: "Διαγράφει μια καταχώρηση ιστορικού με το ID της."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#channel> VIEW [PAGE|ALL]"
    example: "%command_prefix%\x02\x0303HISTORY #κανάλι VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY #κανάλι VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY #κανάλι VIEW ALL\x03\x0F"
    short: "Προβολή ιστορικού ενεργειών καναλιού."
    help: "Εμφανίζει τις καταχωρήσεις ιστορικού του καναλιού."
    header: "\x02Ιστορικό για \x0307%channel%\x03\x02 (εμφάνιση %start%-%end% από %total%):"
    entry: "#%id% [%date%] \x0303%action%\x03 από %operator% — %message%"
    no_entries: "\x0307ℹ\x03 Δεν βρέθηκαν καταχωρήσεις ιστορικού για \x02%channel%\x02."
    page_hint: "Χρησιμοποιήστε \x0303HISTORY %channel% VIEW %next_page%\x03 για περισσότερες καταχωρήσεις."

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#channel> CLEAR"
    example: "%command_prefix%\x02\x0303HISTORY #κανάλι CLEAR\x03\x0F"
    short: "Διαγραφή όλων των καταχωρήσεων ιστορικού για ένα κανάλι."
    help: "Διαγράφει όλες τις καταχωρήσεις ιστορικού του καναλιού."
    success: "\x0303✔\x03 Εκκαθαρίστηκαν \x02%count%\x02 καταχωρήσεις ιστορικού για \x02%channel%\x02."
history.message:
  founder_changed: "Ο ιδρυτής άλλαξε από %old_founder% σε %new_founder%"
  successor_changed: "Ο διάδοχος άλλαξε από %old_successor% σε %new_successor%"
  successor_cleared: "Ο διάδοχος εκκαθαρίστηκε"
  access_add: "Πρόσβαση προστέθηκε για %target_nickname% (επίπεδο %level%)"
  access_del: "Πρόσβαση αφαιρέθηκε για %target_nickname%"
  akick_add: "AKICK προστέθηκε: %mask%"
  akick_del: "AKICK αφαιρέθηκε: %mask%"
history.extra:
  old_founder: "Προηγούμενος ιδρυτής: %value%"
  new_founder: "Νέος ιδρυτής: %value%"
  old_successor: "Προηγούμενος διάδοχος: %value%"
  new_successor: "Νέος διάδοχος: %value%"
  target_nickname: "Στόχος: %value%"
  level: "Επίπεδο: %value%"
  mask: "Μάσκα: %value%"

# --- LEVEL FOUNDER ---------------------------------------------------------
level_founder:
  short: "Επιτρέπει ενέργειες που απαιτούν επίπεδο ιδρυτή του καναλιού."

# --- CLEARACCESS -----------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#channel>"
  example: "%command_prefix%\x02\x0303CLEARACCESS #κανάλι\x03\x0F"
  short: "Εκκαθάριση ολόκληρης της λίστας πρόσβασης ενός καναλιού."
  help: |-
    Αφαιρεί όλες τις καταχωρήσεις πρόσβασης από τη λίστα πρόσβασης ενός καναλιού.
    Αυτή η ενέργεια είναι μη αναστρέψιμη και δεν μπορεί να αναιρεθεί.
    Μόνο IRCops με άδεια 'chanserv.clearaccess' μπορούν να χρησιμοποιήσουν αυτήν την
    εντολή.

    Σύνταξη: CLEARACCESS <#κανάλι>
    Παραδείγματα:
      CLEARACCESS #channel
  success: "\x0303✔\x03 Εκκαθαρίστηκαν \x02%count%\x02 καταχωρήσεις πρόσβασης από \x02%channel%\x02."
  empty: "\x0307ℹ\x03 Το κανάλι \x02%channel%\x02 δεν έχει καταχωρήσεις πρόσβασης."

# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#channel> [reason]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #κανάλι\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #κανάλι κατάκλυση\x03\x0F"
  short: "Kick όλων των χρηστών από ένα κανάλι."
  help: |-
    Κάνει kick όλους τους χρήστες από το καθορισμένο κανάλι.
    Αυτή είναι μια εντολή μόνο για IRCop, που χρησιμοποιείται για διαχείριση
    καναλιού.
    Μπορεί να δοθεί προαιρετική αιτία· αν παραλειφθεί, χρησιμοποιείται μια
    προεπιλεγμένη αιτία.

    Μόνο IRCops με άδεια 'chanserv.clearusers' μπορούν να χρησιμοποιήσουν αυτήν την
    εντολή.

    Σύνταξη: CLEARUSERS <#κανάλι> [reason]
    Παραδείγματα:
      CLEARUSERS #channel
      CLEARUSERS #channel flooding
  not_on_network: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν είναι τρέχοντα στο δίκτυο."
  empty: "\x0307ℹ\x03 Το κανάλι \x02%channel%\x02 δεν έχει χρήστες για kick."
  success: "\x0303✔\x03 Έγιναν kick \x02%count%\x02 χρήστης(ες) από \x02%channel%\x02."
  default_reason: "Εντολή CLEARUSERS"

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <μοτίβο> [σελίδα]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "Λίστα καταχωρισμένων καναλιών που ταιριάζουν με μοτίβο."
  help: |-
    Εμφανίζει τα καταχωρισμένα κανάλια που ταιριάζουν με το μοτίβο. Ο χαρακτήρας *
    αντιστοιχεί σε οποιαδήποτε ακολουθία χαρακτήρων. Η σελίδα είναι προαιρετική και
    ξεκινά από το 1.
  header: "Κανάλι | Ιδρυτής | Καταχώριση | Τελευταία χρήση | Κατάσταση"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Κανένα κανάλι δεν ταιριάζει με το μοτίβο %pattern%."
  status_active: "Ενεργό"

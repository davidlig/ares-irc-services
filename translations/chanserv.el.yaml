# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEHALFOP #κανάλι Αλίκη\x03\x0F"
  short: "Αφαίρεση λειτουργίας semi-operator στο κανάλι."
  help: "Αφαίρεση λειτουργίας semi-operator στο κανάλι."
  done: "\x0303✔\x03 Αφαιρέθηκε το halfop από τον/την \x02%nickname%\x02."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> {ADD|DEL|LIST} [mask] [expiry] [reason]"
  example: "%command_prefix%\x02\x0303AKICK #κανάλι ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #κανάλι ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #κανάλι DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #κανάλι DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #κανάλι LIST\x03\x0F"
  short: "Διαχείριση λίστας auto-kick."
  help: |-
    ADD <μάσκα> [expiry] [reason]: προσθήκη καταχώρησης. DEL <mask|num>: αφαίρεση.
    LIST: λίστα καταχωρήσεων.
  unknown_sub: "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε ADD, DEL ή LIST."
  invalid_mask: "\x0304✗\x03 Μη έγκυρη μορφή μάσκας. Χρησιμοποιήστε \x02nick!ident@host\x02 με χαρακτήρες wildcard (*)."
  dangerous_mask: "\x0304✗\x03 Η μάσκα \x02%mask%\x02 είναι πολύ ευρεία. Πρέπει να περιέχει τουλάχιστον 4 αλφαριθμητικούς χαρακτήρες."
  protected_user: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 έχει πρόσβαση σε αυτό το κανάλι."
  max_entries: "\x0304✗\x03 Μέγιστο %max% καταχωρήσεις AKICK ανά κανάλι."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <mask> [expiry] [reason]"
    example: "%command_prefix%\x02\x0303AKICK #κανάλι ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #κανάλι ADD *!*@* 7d Spam\x03\x0F"
    short: "Προσθήκη καταχώρησης AKICK."
    help: |-
      Απαιτείται λήξη αν καθορίζεται αιτία. Μορφές: 0 (μόνιμο), 1d, 7d, 30d, 12h, 60m.
      Παραδείγματα: 'AKICK #c ADD *!*@* 0', 'AKICK #c ADD *!*@* 7d Spam'.
    done: "\x0303✔\x03 Το AKICK \x02%mask%\x02 προστέθηκε."
    already_exists: "\x0304✗\x03 Το AKICK \x02%mask%\x02 υπάρχει ήδη."
    notice_channel: "\x02%from%\x02 προσθέτει AKICK: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL <mask|number>"
    example: "%command_prefix%\x02\x0303AKICK #κανάλι DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #κανάλι DEL 2\x03\x0F"
    short: "Αφαίρεση καταχώρησης AKICK."
    help: "Αφαίρεση με ακριβή μάσκα ή αριθμό καταχώρησης από το LIST."
    not_found: "\x0304✗\x03 Το AKICK \x02%mask%\x02 δεν βρέθηκε."
    done: "\x0303✔\x03 Το AKICK \x02%mask%\x02 αφαιρέθηκε."
    notice_channel: "\x02%from%\x02 αφαιρεί AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#channel> LIST"
    example: "%command_prefix%\x02\x0303AKICK #κανάλι LIST\x03\x0F"
    short: "Λίστα καταχωρήσεων AKICK."
    help: "Εμφανίζει μάσκα, αιτία, λήξη και ποιος πρόσθεσε."
    header: "\x0303Λίστα AKICK για \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Το κανάλι \x02%channel%\x02 δεν έχει καταχωρήσεις AKICK."
    entry: "  #%index% %mask% %reason% (από %nickname%, λήγει: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#channel>"
  example: "%command_prefix%\x02\x0303RESTORE #κανάλι\x03\x0F"
  short: "Επαναφορά καναλιού σε αναμονή διαγραφής."
  help: |-
    Επαναφέρει ένα κανάλι που διαγράφηκε χειροκίνητα και βρίσκεται ακόμα εντός της
    περιόδου χάριτος. Απαιτεί άδεια IRCop: chanserv.restore.
  success: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 έχει επαναφερθεί."
  not_pending_deletion: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν είναι σε αναμονή διαγραφής."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#channel> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #κανάλι\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP #κανάλι FORCE\x03\x0F"
  short: "Διαγραφή καταχωρημένου καναλιού."
  help: |-
    Αφαιρεί ένα καταχωρημένο κανάλι από τη βάση δεδομένων.
    Αυτή η εντολή απαιτεί άδεια IRCop: chanserv.drop.
    Το FORCE διαγράφει οριστικά ένα κανάλι σε αναμονή διαγραφής και απαιτεί άδεια
    IRCop: chanserv.drop.force.
  force:
    short: "Διαγράφει οριστικά ένα κανάλι που εκκρεμεί προς διαγραφή."
  success: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 έχει επισημανθεί για διαγραφή και μπορεί να αποκατασταθεί κατά την περίοδο χάριτος."
  force_success: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 έχει διαγραφεί οριστικά."
  pending_deletion: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι ήδη σε αναμονή διαγραφής. Χρησιμοποιήστε DROP <#channel> FORCE για οριστική διαγραφή."
  invalid_channel: "\x0304✗\x03 Μη έγκυρο όνομα καναλιού. Χρησιμοποιήστε \x02#channel\x02."
  pending_deletion_reason: "Το κανάλι %channel% βρίσκεται σε διαδικασία διαγραφής. Περισσότερες πληροφορίες /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#channel> <duration> <reason>"
  example: "%command_prefix%\x02\x0303SUSPEND #κανάλι 7d Παραβίαση κανόνων\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND #κανάλι 0 Παραβίαση κανόνων\x03\x0F"
  short: "Αναστολή καναλιού."
  help: |-
    Απενεργοποιεί προσωρινά ένα καταχωρημένο κανάλι. Μορφές διάρκειας: 0 = μόνιμη,
    1d, 12h, 60m.
    Όσο είναι σε αναστολή, οι λειτουργίες καναλιού, η πρόσβαση και η επιβολή είναι
    απενεργοποιημένες.
    Αυτή η εντολή απαιτεί άδεια IRCop: chanserv.suspend
  success: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 έχει τεθεί σε αναστολή μέχρι \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι ήδη σε αναστολή."
  invalid_duration: "\x0304✗\x03 Μη έγκυρη διάρκεια. Χρησιμοποιήστε: 0 (μόνιμη), 1d, 12h, ή 60m."
  channel_suspended: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι σε αναστολή και δεν μπορεί να χρησιμοποιηθεί."
  notice_channel: "\x0304⚠\x03 Το κανάλι έχει τεθεί σε αναστολή. Αιτία: %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#channel>"
  example: "%command_prefix%\x02\x0303UNSUSPEND #κανάλι\x03\x0F"
  short: "Άρση αναστολής καναλιού."
  help: |-
    Επανενεργοποιεί ένα κανάλι σε αναστολή, αποκαθιστώντας τις λειτουργίες και την
    επιβολή του.
    Αυτή η εντολή απαιτεί άδεια IRCop: chanserv.suspend
  success: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 δεν είναι πλέον σε αναστολή."
  not_suspended: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν είναι σε αναστολή."
  reason_expired: "έληξε η αναστολή"

# --- NOJOIN ----------------------------------------------------------------
nojoin:
  reason: "Περιορισμός επιπέδου NOJOIN"


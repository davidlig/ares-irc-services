# Μεταφράσεις ChanServ — Ελληνικά
# Τομέας: chanserv
#
# Κωδικοί μορφοποίησης IRC (διπλά εισαγωγικά ή κυριολεκτικά μπλοκ !irc):
#   \x02        ενεργοποίηση/απενεργοποίηση έντονης γραφής
#   \x03NN      χρώμα (ΔΕΚΑΔΙΚΟ: 03=πράσινο, 04=κόκκινο, 07=πορτοκαλί, 14=σκούρο γκρι)
#   \x03        επαναφορά χρώματος
#   \x0F        επαναφορά όλης της μορφοποίησης
#
# Τα χρώματα IRC χρησιμοποιούν ΔΕΚΑΔΙΚΟΥΣ αριθμούς (0-15), όχι δεκαεξαδικούς.
#   \x0314 = σκούρο γκρι (14 δεκαδικό): ΣΩΣΤΟ
#   \x030F = χρώμα 0 και μετά το γράμμα F: ΛΑΘΟΣ
#
# Πολυγραμμικό κείμενο IRC: !irc |- με πραγματικές αλλαγές γραμμής και κενά.
# Τα μπλοκ χωρίς ετικέτα δεν αποκωδικοποιούν διαφυγές· διατηρήστε τα CTCP.
# Παραδείγματα HELP: example/examples και %command_prefix%.
# Ο παρουσιαστής προσθέτει άχρωμο /msg και περιθώριο δύο κενών.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "Μη έγκυρο όνομα καναλιού. Χρησιμοποιήστε %example%."
  invalid_channel_example: "#channel"
  generic: "Παρουσιάστηκε σφάλμα. Παρακαλώ δοκιμάστε ξανά."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#channel> <description>"
  example: "%command_prefix%REGISTER #κανάλι Κοινοτικό έργο"
  short: "Καταχώρηση καναλιού."
  help: |-
    Καταχωρίζει ένα κανάλι και το συνδέει με το ψευδώνυμό σας. Πρέπει
    να έχετε ταυτοποιηθεί στο %nickserv%. Στη λειτουργία APPROVAL, ένας
    IRCop πρέπει να εγκρίνει το αίτημα.
  success: "Το κανάλι %channel% έχει καταχωρηθεί."
  already_registered: "Το κανάλι %channel% είναι ήδη εγγεγραμμένο ή η εγγραφή του εκκρεμεί."
  channel_not_on_network: "Το κανάλι %channel% δεν υπάρχει στο δίκτυο."
  pending_deletion: "Το κανάλι %channel% είναι σε αναμονή διαγραφής και δεν μπορεί να καταχωρηθεί."
  insufficient_channel_rank: "Πρέπει να έχεις τουλάχιστον κατάσταση operator στο %channel% για να το καταχωρήσεις."
  limit_exceeded: "Έχετε φτάσει το μέγιστο όριο των %max% καταχωρημένων καναλιών."
  throttled: "Πρέπει να περιμένετε %minutes% λεπτό(ά) πριν καταχωρήσετε άλλο κανάλι."

  awaiting_approval: "Το αίτημα για το %channel% αναμένει έγκριση από IRCop."
  restricted_indefinite: "Τα νέα αιτήματα εγγραφής για %channel% αποκλείονται επ’ αόριστον."
  restricted_until: "Τα νέα αιτήματα εγγραφής για %channel% αποκλείονται έως %date%"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%REGMODE APPROVAL"
  short: "Ορισμός ή προβολή της λειτουργίας εγγραφής καναλιών."
  help: |-
    Ορίζει DIRECT ή APPROVAL ή εμφανίζει την κατάσταση με STATUS.
    Το DIRECT είναι η προεπιλογή και διατηρεί την άμεση εγγραφή.
  status: "Η λειτουργία εγγραφής καναλιών είναι %mode%."
  changed: "Η λειτουργία εγγραφής καναλιών άλλαξε σε %mode%."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [page]|ACCEPT <#channel>|REJECT <#channel> <αιτία>}"
  pending.syntax: "CREG PENDING [page]"
  pending.example: "%command_prefix%CREG PENDING"
  pending.short: "Εμφανίζει εκκρεμή αιτήματα σε περιορισμένη σελίδα."
  pending.help: "Εμφανίζει εκκρεμή αιτήματα σε περιορισμένη σελίδα."
  accept.syntax: "CREG ACCEPT <#channel>"
  accept.example: "%command_prefix%CREG ACCEPT #channel"
  accept.short: "Εγκρίνει αίτημα εγγραφής καναλιού."
  accept.help: "Ελέγχει ξανά το αίτημα και ενεργοποιεί την εγγραφή."
  reject.syntax: "CREG REJECT <#channel> <αιτία>"
  reject.example: "%command_prefix%CREG REJECT #channel Απαιτείται δημόσιο θέμα"
  reject.short: "Απορρίπτει αίτημα εγγραφής καναλιού."
  reject.help: "Απορρίπτει αίτημα με υποχρεωτική αιτία και περιορισμό."
  example: "%command_prefix%CREG PENDING"
  short: "Έλεγχος αιτημάτων εγγραφής καναλιών."
  help: |-
    Εμφανίζει εκκρεμή αιτήματα ή αποδέχεται ή απορρίπτει ένα.
    Η απόρριψη απαιτεί αιτιολογία. Μόνο το ACCEPT εγγράφει το κανάλι.
  pending_header: "Εκκρεμείς εγγραφές (σελίδα %page%)"
  pending_item: "%channel% — αιτών %requester%, υποβλήθηκε %submitted%: %description%"
  accepted: "Η εγγραφή του %channel% εγκρίθηκε."
  rejected: "Η εγγραφή του %channel% απορρίφθηκε."
  not_pending: "Το %channel% δεν έχει εκκρεμές αίτημα εγγραφής."
  channel_not_on_network: "Το κανάλι %channel% δεν βρίσκεται στο δίκτυο."
  founder_limit: "Ο αιτών έφτασε το όριο εγγραφών καναλιών."
  requester_inactive: "Ο λογαριασμός του αιτούντος δεν είναι πλέον ενεργός."
  requester_ineligible: "Ο αιτών πρέπει τώρα να έχει δικαιώματα operator στο κανάλι."


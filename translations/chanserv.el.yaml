secure:
  requires_min_level: "Με το SECURE ενεργό, ο/η %nickname% πρέπει να έχει τουλάχιστον επίπεδο %level% για να λάβει %mode%."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#channel> {FOUNDER <ψευδώνυμο> [token]|SUCCESSOR [nickname]|DESC <description>|URL [url]|EMAIL [email]|ENTRYMSG [message]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%SET #κανάλι DESC Ένα κοινοτικό κανάλι"
  examples:
    - "%command_prefix%SET #κανάλι URL https://example.test"
    - "%command_prefix%SET #κανάλι MLOCK ON"
  short: "Αλλαγή επιλογών καναλιού."
  help: |-
    Αλλάζει μια επιλογή καναλιού. Η βοήθεια κάθε επιλογής εξηγεί τις απαιτήσεις και
    τις παραλλαγές της.
  unknown_option: "Άγνωστη επιλογή %option%. Χρησιμοποιήστε μία από: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Χρησιμοποίησε SET <#κανάλι> FOUNDER <ψευδώνυμο> <token> με το επιβεβαιωμένο διακριτικό του τρέχοντος ιδρυτή."
    token_unavailable: "Ο τρέχων ιδρυτής δεν έχει επιβεβαιωμένο διακριτικό διάσωσης. Πρέπει πρώτα να συνδεθεί και να χρησιμοποιήσει VERIFY."
    syntax: "SET <#κανάλι> FOUNDER <ψευδώνυμο> [token]"
    example: "%command_prefix%SET #κανάλι FOUNDER Αλίκη"
    examples:
      - "%command_prefix%SET #κανάλι FOUNDER Αλίκη επιβεβαιωμένο-διακριτικό"
    short: "Μεταφορά καναλιού σε άλλο καταχωρημένο ψευδώνυμο."
    help: |-
      Αλλάζει τον ιδρυτή μετά την επικύρωση του διακριτικού του τρέχοντος ιδρυτή.
      Διατηρεί την υπάρχουσα διοικητική εξαίρεση επιπέδου ιδρυτή. Το διακριτικό δεν
      καταναλώνεται.
    invalid_token: "Το διακριτικό διάσωσης είναι άκυρο."
    updated: "Ο ιδρυτής έχει αλλάξει σε %nickname%."
    throttled: "Πάρα πολλά λανθασμένα διακριτικά. Δοκίμασε ξανά σε %minutes% λεπτά."
    must_be_registered: "Το %nickname% πρέπει να είναι καταχωρημένο και ενεργοποιημένο."
    suspended: "Το %nickname% είναι σε αναστολή και δεν μπορεί να οριστεί ως ιδρυτής."
    cannot_be_self: "Ο νέος ιδρυτής δεν μπορεί να είναι ο τρέχων ιδρυτής."
    cannot_be_successor: "Ο νέος ιδρυτής δεν μπορεί να είναι ο διάδοχος του καναλιού."
    limit_exceeded: "Το %nickname% έχει φτάσει το μέγιστο όριο των %max% καταχωρημένων καναλιών."
    notice_channel: "%from% ορίζει τον/την %nickname% ως ιδρυτή καναλιού."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%SET #κανάλι SUCCESSOR Αλίκη"
    examples:
      - "%command_prefix%SET #κανάλι SUCCESSOR"
    short: "Ορισμός διαδόχου καναλιού."
    help: |-
      Ορίζει ένα ψευδώνυμο ως διάδοχο καναλιού. Παραλείψτε το ψευδώνυμο για
      εκκαθάριση. Το ψευδώνυμο πρέπει να είναι καταχωρημένο και ενεργοποιημένο.
    cleared: "Ο διάδοχος έχει εκκαθαριστεί."
    updated: "Ο διάδοχος έχει οριστεί σε %nickname%."
    must_be_registered: "Το %nickname% πρέπει να είναι καταχωρημένο και ενεργοποιημένο."
    suspended: "Το %nickname% είναι σε αναστολή και δεν μπορεί να οριστεί ως διάδοχος."
    cannot_be_founder: "Ο ιδρυτής δεν μπορεί να οριστεί ως διάδοχος."
    notice_channel: "%from% ορίζει τον/την %nickname% ως διάδοχο καναλιού."
    notice_channel_cleared: "%from% έχει εκκαθαρίσει τον διάδοχο καναλιού."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <description>"
    example: "%command_prefix%SET #κανάλι DESC Ένα κοινοτικό κανάλι"
    short: "Αλλαγή περιγραφής καναλιού."
    help: "Αλλάξτε την περιγραφή του καναλιού (απαιτείται)."
    updated: "Η περιγραφή ενημερώθηκε."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%SET #κανάλι URL https://example.test"
    examples:
      - "%command_prefix%SET #κανάλι URL"
    short: "Ορισμός URL καναλιού."
    help: "Αλλάξτε την ιστοσελίδα (URL) του καναλιού. Παραλείψτε το url για εκκαθάριση."
    updated: "Το URL ενημερώθηκε."
    cleared: "Το URL εκκαθαρίστηκε."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#κανάλι> EMAIL [email]"
    example: "%command_prefix%SET #κανάλι EMAIL team@example.test"
    examples:
      - "%command_prefix%SET #κανάλι EMAIL"
    short: "Ορισμός email καναλιού."
    help: |-
      Αλλάζει τη διεύθυνση email του καναλιού. Παραλείψτε το email για
      διαγραφή. Δεν επιτρέπονται διοικητικά αποκλεισμένοι τομείς email.
      Διοικητική εξαίρεση: διαχειριστές με πρόσβαση επιπέδου ιδρυτή.
    invalid: "Μη έγκυρη διεύθυνση email."
    updated: "Το email ενημερώθηκε."
    cleared: "Το email εκκαθαρίστηκε."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#κανάλι> ENTRYMSG [message]"
    example: "%command_prefix%SET #κανάλι ENTRYMSG Καλώς ορίσατε"
    examples:
      - "%command_prefix%SET #κανάλι ENTRYMSG"
    short: "Ορισμός μηνύματος εισόδου καναλιού."
    help: "Ορίζει το μήνυμα εισόδου (NOTICE). Παραλείψτε το μήνυμα για διαγραφή."
    updated: "Το μήνυμα εισόδου ενημερώθηκε."
    too_long: "Το μήνυμα εισόδου δεν μπορεί να υπερβαίνει τους %max% χαρακτήρες."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #κανάλι TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #κανάλι TOPICLOCK OFF"
    short: "Κλείδωμα θέματος καναλιού."
    help: |-
      Αποτρέπει την αλλαγή του θέματος του καναλιού. Όταν είναι ON, το τρέχον θέμα
      αποθηκεύεται και κλειδώνεται.
    on: "Το κλείδωμα θέματος είναι τώρα ON."
    off: "Το κλείδωμα θέματος είναι τώρα OFF."
    notice_on: "%nickname% ενεργοποιεί το TOPICLOCK."
    notice_off: "%nickname% απενεργοποιεί το TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #κανάλι MLOCK ON"
    examples:
      - "%command_prefix%SET #κανάλι MLOCK OFF"
    short: "Κλείδωμα λειτουργιών καναλιού."
    help: |-
      Κλειδώνει τις τρέχουσες λειτουργίες καναλιού (π.χ. +nt). Όταν είναι ON, οι
      λειτουργίες δεν μπορούν να αλλάξουν.
    no_modes: "καμία λειτουργία"
    on: "Το MLOCK είναι τώρα ON (%modes%)."
    off: "Το MLOCK είναι τώρα OFF."
    notice_on: "%nickname% ενεργοποιεί το MLOCK (%modes%)."
    notice_off: "%nickname% απενεργοποιεί το MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#κανάλι> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #κανάλι PRIVATE ON"
    examples:
      - "%command_prefix%SET #κανάλι PRIVATE OFF"
    short: "Απόκρυψη πληροφοριών καναλιού."
    help: |-
      Όταν είναι ON, μόνο ο ιδρυτής και οι χρήστες με πρόσβαση μπορούν να δουν τις
      πληροφορίες του καναλιού.
    on: "Οι πληροφορίες του καναλιού είναι πλέον ιδιωτικές."
    off: "Οι πληροφορίες του καναλιού είναι πλέον δημόσιες."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%SET #κανάλι SECURE ON"
    examples:
      - "%command_prefix%SET #κανάλι SECURE OFF"
    short: "Απαίτηση λίστας πρόσβασης για βαθμίδες καναλιού."
    help: |-
      Όταν είναι ON, μόνο χρήστες στη λίστα πρόσβασης μπορούν να λάβουν βαθμίδες
      καναλιού (OP, VOICE, κλπ.).
    on: "Το SECURE είναι τώρα ON."
    off: "Το SECURE είναι τώρα OFF."
    notice_on: "%nickname% ενεργοποιεί τη λειτουργία SECURE."
    notice_off: "%nickname% απενεργοποιεί τη λειτουργία SECURE."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#channel> {ADD <nickname> <level>|DEL <nickname>|LIST}"
  example: "%command_prefix%ACCESS #κανάλι LIST"
  examples:
    - "%command_prefix%ACCESS #κανάλι ADD Αλίκη 100"
    - "%command_prefix%ACCESS #κανάλι DEL Αλίκη"
  short: "Διαχείριση λίστας πρόσβασης."
  help: "Διαχειρίζεται τη λίστα πρόσβασης του καναλιού."
  unknown_sub: "Άγνωστη υπο-εντολή %sub%. Χρησιμοποιήστε LIST, ADD, ή DEL."
  level_range: "Το επίπεδο πρόσβασης πρέπει να είναι μεταξύ %min% και %max%."
  cannot_manage_level: "Μπορείτε να διαχειριστείτε μόνο ψευδώνυμα με επίπεδο αυστηρά χαμηλότερο από το δικό σας."
  founder_not_in_list: "Ο ιδρυτής δεν είναι στη λίστα πρόσβασης."
  max_entries: "Μέγιστο %max% καταχωρήσεις πρόσβασης ανά κανάλι."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#channel> LIST"
    example: "%command_prefix%ACCESS #κανάλι LIST"
    short: "Λίστα πρόσβασης (απαιτεί επίπεδο ACCESSLIST)."
    help: "Εμφανίζει ψευδώνυμο και επίπεδο για κάθε καταχώρηση."
    header: "Λίστα πρόσβασης για %channel%"
    empty: "Το κανάλι %channel% δεν έχει καταχωρήσεις πρόσβασης."
    entry: "#%index%: %nickname% (επίπεδο %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#channel> ADD <nickname> <level>"
    example: "%command_prefix%ACCESS #κανάλι ADD Αλίκη 100"
    short: "Προσθήκη ή ενημέρωση επιπέδου πρόσβασης (απαιτεί επίπεδο ACCESSCHANGE)."
    help: "Επίπεδο 1-499. Μπορείτε να ορίσετε μόνο επίπεδα χαμηλότερα από το δικό σας."
    done: "%nickname% ορίστηκε σε επίπεδο %level%."
    notice_channel: "%from% ορίζει τον/την %to% σε επίπεδο %level%"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#channel> DEL <nickname>"
    example: "%command_prefix%ACCESS #κανάλι DEL Αλίκη"
    short: "Αφαίρεση από τη λίστα πρόσβασης (απαιτεί επίπεδο ACCESSCHANGE)."
    help: "Μπορείτε να αφαιρέσετε μόνο ψευδώνυμα με επίπεδο χαμηλότερο από το δικό σας."
    not_in_list: "Το %nickname% δεν είναι στη λίστα πρόσβασης."
    done: "Το %nickname% αφαιρέθηκε από τη λίστα πρόσβασης."
    notice_channel: "%from% αφαιρεί τον/την %to% από τη λίστα πρόσβασης"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#channel>"
  example: "%command_prefix%DELACCESS #κανάλι"
  short: "Αφαίρεση της δικής σας πρόσβασης από ένα κανάλι."
  help: |-
    Αφαιρεί την καταχώρηση πρόσβασής σας από τη λίστα πρόσβασης του καναλιού. Πρέπει
    να είστε ταυτοποιημένοι. Ο ιδρυτής δεν μπορεί να χρησιμοποιήσει αυτήν την
    εντολή.
  done: "Η πρόσβασή σας έχει αφαιρεθεί από το %channel%."
  not_in_list: "Δεν έχετε πρόσβαση στο %channel%."
  founder_not_in_access: "Είστε ο ιδρυτής του %channel% και δεν είστε στη λίστα πρόσβασης."
  notice_channel: "%nickname% αφαιρεί την πρόσβασή του/της από το κανάλι"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#channel> {LIST|SET <level> <value>|RESET}"
  example: "%command_prefix%LEVELS #κανάλι LIST"
  examples:
    - "%command_prefix%LEVELS #κανάλι SET OPDEOP 50"
    - "%command_prefix%LEVELS #κανάλι RESET"
  short: "Διαμόρφωση επιπέδων καναλιού."
  help: |-
    LIST: εμφάνιση απαιτήσεων επιπέδου (OPDEOP, VOICEDEVOICE, κλπ.). SET: ορισμός
    ελάχιστου επιπέδου για μια ενέργεια (-1 έως 499). RESET: επαναφορά προεπιλογών.
    Μόνο ο ιδρυτής για SET/RESET.
  unknown_sub: "Άγνωστη υπο-εντολή %sub%. Χρησιμοποιήστε LIST, SET, ή RESET."
  unknown_key: "Άγνωστο κλειδί επιπέδου %key% ή δεν υποστηρίζεται από αυτό το IRCd."
  value_range: "Η τιμή επιπέδου πρέπει να είναι μεταξύ %min% και %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#channel> LIST"
    example: "%command_prefix%LEVELS #κανάλι LIST"
    short: "Λίστα απαιτήσεων επιπέδου."
    help: |-
      Εμφανίζει κάθε κλειδί επιπέδου και την τιμή του (προεπιλογές αν δεν έχει
      οριστεί).
    header: "Επίπεδα για το %channel%"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#channel> SET <level> <value>"
    example: "%command_prefix%LEVELS #κανάλι SET OPDEOP 50"
    short: "Ορισμός απαίτησης επιπέδου."
    help: "Τιμή -1 έως 499. Μόνο ο ιδρυτής."
    done: "%key% ορίστηκε σε %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#channel> RESET"
    example: "%command_prefix%LEVELS #κανάλι RESET"
    short: "Επαναφορά όλων των επιπέδων στις προεπιλογές."
    help: "Αφαιρεί όλες τις παρακάμψεις. Μόνο ο ιδρυτής."
    done: "Όλα τα επίπεδα επαναφέρθηκαν στις προεπιλογές."

# --- VOICE -----------------------------------------------------------------
voice:
  syntax: "VOICE <#channel> <nickname>"
  example: "%command_prefix%VOICE #κανάλι Αλίκη"
  short: "Δώστε λειτουργία voice στο κανάλι."
  help: "Δώστε λειτουργία voice στο κανάλι."
  done: "Στο %nickname% δόθηκε voice."
  user_not_on_channel: "Το ψευδώνυμο %nickname% δεν είναι στο δίκτυο."
  notice_grant: "%from% δίνει %mode% σε %to%"

# --- DEVOICE ---------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#channel> <nickname>"
  example: "%command_prefix%DEVOICE #κανάλι Αλίκη"
  short: "Αφαίρεση λειτουργίας voice στο κανάλι."
  help: "Αφαίρεση λειτουργίας voice στο κανάλι."

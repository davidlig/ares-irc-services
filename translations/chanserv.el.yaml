# Μεταφράσεις ChanServ — Ελληνικά
# Τομέας: chanserv
#
# Κωδικοί μορφοποίησης IRC (διπλά εισαγωγικά ή κυριολεκτικά μπλοκ !irc):
#   \x02        ενεργοποίηση/απενεργοποίηση έντονης γραφής
#   \x03NN      χρώμα (ΔΕΚΑΔΙΚΟ: 03=πράσινο, 04=κόκκινο, 07=πορτοκαλί, 14=σκούρο γκρι)
#   \x03        επαναφορά χρώματος
#   \x0F        επαναφορά όλης της μορφοποίησης
#
# Τα χρώματα IRC χρησιμοποιούν ΔΕΚΑΔΙΚΟΥΣ αριθμούς (0-15), όχι δεκαεξαδικούς.
#   \x0314 = σκούρο γκρι (14 δεκαδικό): ΣΩΣΤΟ
#   \x030F = χρώμα 0 και μετά το γράμμα F: ΛΑΘΟΣ
#
# Πολυγραμμικό κείμενο IRC: !irc |- με πραγματικές αλλαγές γραμμής και κενά.
# Τα μπλοκ χωρίς ετικέτα δεν αποκωδικοποιούν διαφυγές· διατηρήστε τα CTCP.
# Παραδείγματα HELP: example/examples και %command_prefix%.
# Ο παρουσιαστής προσθέτει άχρωμο /msg και περιθώριο δύο κενών.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Μη έγκυρο όνομα καναλιού. Χρησιμοποιήστε \x02#channel\x02."
  generic: "\x0304✗\x03 Παρουσιάστηκε σφάλμα. Παρακαλώ δοκιμάστε ξανά."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#channel> <description>"
  example: "%command_prefix%\x02\x0303REGISTER #κανάλι Κοινοτικό έργο\x03\x0F"
  short: "Καταχώρηση καναλιού."
  help: |-
    Καταχωρήστε και συσχετίστε ένα κανάλι με το ψευδώνυμό σας. Πρέπει να είστε
    ταυτοποιημένοι με το %nickserv%.
  success: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 έχει καταχωρηθεί."
  already_registered: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι ήδη καταχωρημένο."
  channel_not_on_network: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν υπάρχει στο δίκτυο."
  pending_deletion: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι σε αναμονή διαγραφής και δεν μπορεί να καταχωρηθεί."
  insufficient_channel_rank: "\x0304✗\x03 Πρέπει να έχεις τουλάχιστον κατάσταση operator στο \x02%channel%\x02 για να το καταχωρήσεις."
  limit_exceeded: "\x0304✗\x03 Έχετε φτάσει το μέγιστο όριο των %max% καταχωρημένων καναλιών."
  throttled: "\x0304✗\x03 Πρέπει να περιμένετε \x02%minutes%\x02 λεπτό(ά) πριν καταχωρήσετε άλλο κανάλι."

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#channel>"
  example: "%command_prefix%\x02\x0303INFO #κανάλι\x03\x0F"
  short: "Εμφάνιση πληροφοριών καναλιού."
  help: |-
    Εμφανίζει ιδρυτή, ημερομηνία καταχώρησης, διάδοχο, URL, email, περιγραφή,
    τελευταία χρήση, θέμα και επιλογές (TOPICLOCK, MLOCK, SECURE).
  header: "\x02Πληροφορίες για το κανάλι \x0307%channel%\x03\x02"
  founder: "  \x0314Ιδρυτής\x03         : \x02%nickname%\x02"
  registered: "  \x0314Καταχωρήθηκε\x03    : %date%"
  successor: "  \x0314Διάδοχος\x03        : \x02%nickname%\x02"
  description: "  \x0314Περιγραφή\x03       : %desc%"
  url: "  \x0314URL\x03             : %url%"
  email: "  \x0314Email\x03           : %email%"
  last_used: "  \x0314Τελ. χρήση\x03      : %date%"
  topic: "  \x0314Τελευταίο θέμα\x03  : %topic%"
  topic_set_by: "  \x0314Θέμα από\x03        : %nickname%"
  options: "  \x0314Επιλογές\x03        : %options%"
  private: "\x0304✗\x03 Οι πληροφορίες του καναλιού \x02%channel%\x02 είναι ιδιωτικές."
  no_expire: "  \x0314Ποτέ δεν λήγει\x03  : Ναι"
  mlock_modes: "  \x0314Κλείδωμα λειτ.\x03  : %modes%"
  suspended_status: "  \x0314Κατάσταση\x03       : \x0304Σε αναστολή\x03"
  suspended_reason: "  \x0314Αιτία\x03           : %reason%"
  suspended_until: "  \x0314Λήγει στις\x03      : %date%"
  suspended_permanent: "  \x0314Λήγει στις\x03      : Μόνιμη"
  forbidden_status: "  \x0314Κατάσταση\x03       : \x0304Απαγορευμένο\x03"
  forbidden_reason: "  \x0314Αιτία\x03           : %reason%"
  pending_deletion_status: "  \x0314Κατάσταση\x03          : \x0307Σε εκκρεμότητα διαγραφής\x03"
  pending_deletion_at: "  \x0314Διαγράφηκε\x03         : %date%"
  pending_deletion_until: "  \x0314Οριστική διαγραφή\x03  : %date%"
  pending_deletion_notice: "  \x0307Αυτό το κανάλι είναι παγωμένο και δεν μπορεί να καταχωρηθεί.\x03"

# --- HELP ------------------------------------------------------------------
help:
  examples_header: "\x02 ■ Παραδείγματα:\x02"
  syntax: "HELP [εντολή] [επιλογή]"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
  short: "Λίστα εντολών ή βοήθεια για μια εντολή."
  help: "Εμφανίζει τις διαθέσιμες εντολές και αναλυτική βοήθεια για τις επιλογές τους."
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Σας επιτρέπει να καταχωρείτε και να διαχειρίζεστε κανάλια, να ρυθμίζετε τις
    επιλογές τους και να ελέγχετε ποιος έχει πρόσβαση σε αυτά. Διαχειρίζεται τα
    επίπεδα πρόσβασης και τα προνόμια των χρηστών, ώστε το κανάλι να παραμένει υπό
    τον έλεγχο των υπευθύνων του.
  general_header: "\x02 ■ Διαθέσιμες εντολές:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Επιλογές:\x02"
  general_footer: "\x0310ℹ\x03\x0F Χρησιμοποιήστε /msg %bot% \x02\x0303HELP <εντολή>\x03\x0F για περισσότερες πληροφορίες."
  set_sub_footer: "\x0310ℹ\x03\x0F Χρησιμοποιήστε /msg %bot% \x02\x0303HELP %command% <επιλογή>\x03\x0F για περισσότερες πληροφορίες."
  syntax_label: "Σύνταξη: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0304⚠\x03\x0F ΣΗΜΕΙΩΣΗ: Τα κανάλια που δεν χρησιμοποιούνται για περισσότερες από \x1F\x0304%days% ημέρες\x03\x1F διαγράφονται αυτόματα."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_info: "Εγγραφή και πληροφορίες"
    access_levels: "Πρόσβαση και επίπεδα"
    ranks_entry: "Ρόλοι και είσοδος"
  ircop_group:
    channel_operations: "Λειτουργίες καναλιού"
    channel_management: "Διαχείριση καναλιού"
    deletion: "Διαγραφή και επαναφορά"
    restrictions: "Περιορισμοί"
    lookup: "Αναζήτηση και διερεύνηση"
  ircop_header: "\x02 ■ Διαθέσιμες εντολές για IRC operators:\x02"

# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303OP #κανάλι Αλίκη\x03\x0F"
  short: "Δώστε κατάσταση operator καναλιού."
  help: "Δώστε κατάσταση operator καναλιού."
  done: "\x0303✔\x03 Στο \x02%nickname%\x02 δόθηκε κατάσταση operator καναλιού."
  user_not_on_channel: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι στο δίκτυο."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 δίνει \x0304%mode%\x03 σε \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEOP #κανάλι Αλίκη\x03\x0F"
  short: "Αφαίρεση κατάστασης operator καναλιού."
  help: "Αφαίρεση κατάστασης operator καναλιού."
  done: "\x0303✔\x03 Αφαιρέθηκε το op από τον/την \x02%nickname%\x02."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 Με το SECURE ενεργό, ο/η \x02%nickname%\x02 πρέπει να έχει τουλάχιστον επίπεδο \x02%level%\x02 για να λάβει \x02%mode%\x02."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#channel> <option> [value]"
  example: "%command_prefix%\x02\x0303SET #κανάλι DESC Ένα κοινοτικό κανάλι\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #κανάλι URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #κανάλι MLOCK ON\x03\x0F"
  short: "Αλλαγή επιλογών καναλιού."
  help: |-
    Αλλάζει μια επιλογή καναλιού. Η βοήθεια κάθε επιλογής εξηγεί τις απαιτήσεις και
    τις παραλλαγές της.
  unknown_option: "\x0304✗\x03 Άγνωστη επιλογή \x02%option%\x02. Χρησιμοποιήστε μία από: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Χρησιμοποίησε SET <#κανάλι> FOUNDER <ψευδώνυμο> <token> με το επιβεβαιωμένο διακριτικό του τρέχοντος ιδρυτή."
    token_unavailable: "Ο τρέχων ιδρυτής δεν έχει επιβεβαιωμένο διακριτικό διάσωσης. Πρέπει πρώτα να συνδεθεί και να χρησιμοποιήσει VERIFY."
    syntax: "SET <#κανάλι> FOUNDER <ψευδώνυμο> [token]"
    example: "%command_prefix%\x02\x0303SET #κανάλι FOUNDER Αλίκη\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #κανάλι FOUNDER Αλίκη επιβεβαιωμένο-διακριτικό\x03\x0F"
    short: "Μεταφορά καναλιού σε άλλο καταχωρημένο ψευδώνυμο."
    help: |-
      Αλλάζει τον ιδρυτή μετά την επικύρωση του διακριτικού του τρέχοντος ιδρυτή.
      Διατηρεί την υπάρχουσα διοικητική εξαίρεση επιπέδου ιδρυτή. Το διακριτικό δεν
      καταναλώνεται.
    invalid_token: "Το διακριτικό διάσωσης είναι άκυρο."
    updated: "\x0303✔\x03 Ο ιδρυτής έχει αλλάξει σε \x02%nickname%\x02."
    throttled: "Πάρα πολλά λανθασμένα διακριτικά. Δοκίμασε ξανά σε %minutes% λεπτά."
    must_be_registered: "\x0304✗\x03 Το \x02%nickname%\x02 πρέπει να είναι καταχωρημένο και ενεργοποιημένο."
    suspended: "\x0304✗\x03 Το \x02%nickname%\x02 είναι σε αναστολή και δεν μπορεί να οριστεί ως ιδρυτής."
    cannot_be_self: "\x0304✗\x03 Ο νέος ιδρυτής δεν μπορεί να είναι ο τρέχων ιδρυτής."
    cannot_be_successor: "\x0304✗\x03 Ο νέος ιδρυτής δεν μπορεί να είναι ο διάδοχος του καναλιού."
    limit_exceeded: "\x0304✗\x03 Το \x02%nickname%\x02 έχει φτάσει το μέγιστο όριο των %max% καταχωρημένων καναλιών."
    notice_channel: "\x02%from%\x02 ορίζει τον/την \x02%nickname%\x02 ως ιδρυτή καναλιού."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%\x02\x0303SET #κανάλι SUCCESSOR Αλίκη\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #κανάλι SUCCESSOR\x03\x0F"
    short: "Ορισμός διαδόχου καναλιού."
    help: |-
      Ορίζει ένα ψευδώνυμο ως διάδοχο καναλιού. Παραλείψτε το ψευδώνυμο για
      εκκαθάριση. Το ψευδώνυμο πρέπει να είναι καταχωρημένο και ενεργοποιημένο.
    cleared: "\x0303✔\x03 Ο διάδοχος έχει εκκαθαριστεί."
    updated: "\x0303✔\x03 Ο διάδοχος έχει οριστεί σε \x02%nickname%\x02."
    must_be_registered: "\x0304✗\x03 Το \x02%nickname%\x02 πρέπει να είναι καταχωρημένο και ενεργοποιημένο."
    suspended: "\x0304✗\x03 Το \x02%nickname%\x02 είναι σε αναστολή και δεν μπορεί να οριστεί ως διάδοχος."
    cannot_be_founder: "\x0304✗\x03 Ο ιδρυτής δεν μπορεί να οριστεί ως διάδοχος."
    notice_channel: "\x02%from%\x02 ορίζει τον/την \x02%nickname%\x02 ως διάδοχο καναλιού."
    notice_channel_cleared: "\x02%from%\x02 έχει εκκαθαρίσει τον διάδοχο καναλιού."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <description>"
    example: "%command_prefix%\x02\x0303SET #κανάλι DESC Ένα κοινοτικό κανάλι\x03\x0F"
    short: "Αλλαγή περιγραφής καναλιού."
    help: "Αλλάξτε την περιγραφή του καναλιού (απαιτείται)."
    updated: "\x0303✔\x03 Η περιγραφή ενημερώθηκε."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%\x02\x0303SET #κανάλι URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #κανάλι URL\x03\x0F"
    short: "Ορισμός URL καναλιού."
    help: "Αλλάξτε την ιστοσελίδα (URL) του καναλιού. Παραλείψτε το url για εκκαθάριση."
    updated: "\x0303✔\x03 Το URL ενημερώθηκε."
    cleared: "\x0303✔\x03 Το URL εκκαθαρίστηκε."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#κανάλι> EMAIL <email|none>"
    example: "%command_prefix%\x02\x0303SET #κανάλι EMAIL team@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #κανάλι EMAIL\x03\x0F"
    short: "Ορισμός email καναλιού."
    help: |-
      Αλλάζει τη διεύθυνση email του καναλιού. Παραλείψτε το email για
      διαγραφή. Δεν επιτρέπονται διοικητικά αποκλεισμένοι τομείς email.
      Διοικητική εξαίρεση: διαχειριστές με πρόσβαση επιπέδου ιδρυτή.
    invalid: "\x0304✗\x03 Μη έγκυρη διεύθυνση email."
    updated: "\x0303✔\x03 Το email ενημερώθηκε."
    cleared: "\x0303✔\x03 Το email εκκαθαρίστηκε."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#κανάλι> ENTRYMSG <message|none>"
    example: "%command_prefix%\x02\x0303SET #κανάλι ENTRYMSG Καλώς ορίσατε\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #κανάλι ENTRYMSG\x03\x0F"
    short: "Ορισμός μηνύματος εισόδου καναλιού."
    help: "Ορίζει το μήνυμα εισόδου (NOTICE). Παραλείψτε το μήνυμα για διαγραφή."
    updated: "\x0303✔\x03 Το μήνυμα εισόδου ενημερώθηκε."
    too_long: "\x0304✗\x03 Το μήνυμα εισόδου δεν μπορεί να υπερβαίνει τους %max% χαρακτήρες."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #κανάλι TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #κανάλι TOPICLOCK OFF\x03\x0F"
    short: "Κλείδωμα θέματος καναλιού."
    help: |-
      Αποτρέπει την αλλαγή του θέματος του καναλιού. Όταν είναι ON, το τρέχον θέμα
      αποθηκεύεται και κλειδώνεται.
    on: "\x0303✔\x03 Το κλείδωμα θέματος είναι τώρα ON."
    off: "\x0303✔\x03 Το κλείδωμα θέματος είναι τώρα OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 ενεργοποιεί το TOPICLOCK."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 απενεργοποιεί το TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #κανάλι MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #κανάλι MLOCK OFF\x03\x0F"
    short: "Κλείδωμα λειτουργιών καναλιού."
    help: |-
      Κλειδώνει τις τρέχουσες λειτουργίες καναλιού (π.χ. +nt). Όταν είναι ON, οι
      λειτουργίες δεν μπορούν να αλλάξουν.
    no_modes: "καμία λειτουργία"
    on: "\x0303✔\x03 Το MLOCK είναι τώρα ON (%modes%)."
    off: "\x0303✔\x03 Το MLOCK είναι τώρα OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 ενεργοποιεί το MLOCK (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 απενεργοποιεί το MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#κανάλι> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #κανάλι PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #κανάλι PRIVATE OFF\x03\x0F"
    short: "Απόκρυψη πληροφοριών καναλιού."
    help: |-
      Όταν είναι ON, μόνο ο ιδρυτής και οι χρήστες με πρόσβαση μπορούν να δουν τις
      πληροφορίες του καναλιού.
    on: "\x0303✔\x03 Οι πληροφορίες του καναλιού είναι πλέον ιδιωτικές."
    off: "\x0303✔\x03 Οι πληροφορίες του καναλιού είναι πλέον δημόσιες."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #κανάλι SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #κανάλι SECURE OFF\x03\x0F"
    short: "Απαίτηση λίστας πρόσβασης για βαθμίδες καναλιού."
    help: |-
      Όταν είναι ON, μόνο χρήστες στη λίστα πρόσβασης μπορούν να λάβουν βαθμίδες
      καναλιού (OP, VOICE, κλπ.).
    on: "\x0303✔\x03 Το SECURE είναι τώρα ON."
    off: "\x0303✔\x03 Το SECURE είναι τώρα OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 ενεργοποιεί τη λειτουργία SECURE."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 απενεργοποιεί τη λειτουργία SECURE."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#channel> {ADD|DEL|LIST} [nickname] [level]"
  example: "%command_prefix%\x02\x0303ACCESS #κανάλι LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #κανάλι ADD Αλίκη 100\x03\x0F"
    - "%command_prefix%\x02\x0303ACCESS #κανάλι DEL Αλίκη\x03\x0F"
  short: "Διαχείριση λίστας πρόσβασης."
  help: "Διαχειρίζεται τη λίστα πρόσβασης του καναλιού."
  unknown_sub: "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε LIST, ADD, ή DEL."
  level_range: "\x0304✗\x03 Το επίπεδο πρόσβασης πρέπει να είναι μεταξύ %min% και %max%."
  cannot_manage_level: "\x0304✗\x03 Μπορείτε να διαχειριστείτε μόνο ψευδώνυμα με επίπεδο αυστηρά χαμηλότερο από το δικό σας."
  founder_not_in_list: "\x0304✗\x03 Ο ιδρυτής δεν είναι στη λίστα πρόσβασης."
  max_entries: "\x0304✗\x03 Μέγιστο %max% καταχωρήσεις πρόσβασης ανά κανάλι."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#channel> LIST"
    example: "%command_prefix%\x02\x0303ACCESS #κανάλι LIST\x03\x0F"
    short: "Λίστα πρόσβασης (απαιτεί επίπεδο ACCESSLIST)."
    help: "Εμφανίζει ψευδώνυμο και επίπεδο για κάθε καταχώρηση."
    header: "\x0303Λίστα πρόσβασης για \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Το κανάλι \x02%channel%\x02 δεν έχει καταχωρήσεις πρόσβασης."
    entry: "  #%index%: %nickname% (επίπεδο %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#channel> ADD <nickname> <level>"
    example: "%command_prefix%\x02\x0303ACCESS #κανάλι ADD Αλίκη 100\x03\x0F"
    short: "Προσθήκη ή ενημέρωση επιπέδου πρόσβασης (απαιτεί επίπεδο ACCESSCHANGE)."
    help: "Επίπεδο 1-499. Μπορείτε να ορίσετε μόνο επίπεδα χαμηλότερα από το δικό σας."
    done: "\x0303✔\x03 \x02%nickname%\x02 ορίστηκε σε επίπεδο %level%."
    notice_channel: "\x0303✔\x03 \x0302%from%\x03 ορίζει τον/την \x0314%to%\x03 σε επίπεδο \x0304%level%\x03"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#channel> DEL <nickname>"
    example: "%command_prefix%\x02\x0303ACCESS #κανάλι DEL Αλίκη\x03\x0F"
    short: "Αφαίρεση από τη λίστα πρόσβασης (απαιτεί επίπεδο ACCESSCHANGE)."
    help: "Μπορείτε να αφαιρέσετε μόνο ψευδώνυμα με επίπεδο χαμηλότερο από το δικό σας."
    not_in_list: "\x0304✗\x03 Το \x02%nickname%\x02 δεν είναι στη λίστα πρόσβασης."
    done: "\x0303✔\x03 Το \x02%nickname%\x02 αφαιρέθηκε από τη λίστα πρόσβασης."
    notice_channel: "\x0304✗\x03 \x0302%from%\x03 αφαιρεί τον/την \x0314%to%\x03 από τη λίστα πρόσβασης"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#channel>"
  example: "%command_prefix%\x02\x0303DELACCESS #κανάλι\x03\x0F"
  short: "Αφαίρεση της δικής σας πρόσβασης από ένα κανάλι."
  help: |-
    Αφαιρεί την καταχώρηση πρόσβασής σας από τη λίστα πρόσβασης του καναλιού. Πρέπει
    να είστε ταυτοποιημένοι. Ο ιδρυτής δεν μπορεί να χρησιμοποιήσει αυτήν την
    εντολή.
  done: "\x0303✔\x03 Η πρόσβασή σας έχει αφαιρεθεί από το \x02%channel%\x02."
  not_in_list: "\x0304✗\x03 Δεν έχετε πρόσβαση στο \x02%channel%\x02."
  founder_not_in_access: "\x0304✗\x03 Είστε ο ιδρυτής του \x02%channel%\x02 και δεν είστε στη λίστα πρόσβασης."
  notice_channel: "\x0304✗\x03 \x0302%nickname%\x03 αφαιρεί την πρόσβασή του/της από το κανάλι"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#channel> {LIST|SET|RESET} [level] [value]"
  example: "%command_prefix%\x02\x0303LEVELS #κανάλι LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #κανάλι SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #κανάλι RESET\x03\x0F"
  short: "Διαμόρφωση επιπέδων καναλιού."
  help: |-
    LIST: εμφάνιση απαιτήσεων επιπέδου (OPDEOP, VOICEDEVOICE, κλπ.). SET: ορισμός
    ελάχιστου επιπέδου για μια ενέργεια (-1 έως 499). RESET: επαναφορά προεπιλογών.
    Μόνο ο ιδρυτής για SET/RESET.
  unknown_sub: "\x0304✗\x03 Άγνωστη υπο-εντολή \x02%sub%\x02. Χρησιμοποιήστε LIST, SET, ή RESET."
  unknown_key: "\x0304✗\x03 Άγνωστο κλειδί επιπέδου \x02%key%\x02 ή δεν υποστηρίζεται από αυτό το IRCd."
  value_range: "\x0304✗\x03 Η τιμή επιπέδου πρέπει να είναι μεταξύ %min% και %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#channel> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #κανάλι LIST\x03\x0F"
    short: "Λίστα απαιτήσεων επιπέδου."
    help: |-
      Εμφανίζει κάθε κλειδί επιπέδου και την τιμή του (προεπιλογές αν δεν έχει
      οριστεί).
    header: "\x0303Επίπεδα για το %channel%\x03"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#channel> SET <level> <value>"
    example: "%command_prefix%\x02\x0303LEVELS #κανάλι SET OPDEOP 50\x03\x0F"
    short: "Ορισμός απαίτησης επιπέδου."
    help: "Τιμή -1 έως 499. Μόνο ο ιδρυτής."
    done: "\x0303✔\x03 \x02%key%\x02 ορίστηκε σε %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#channel> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #κανάλι RESET\x03\x0F"
    short: "Επαναφορά όλων των επιπέδων στις προεπιλογές."
    help: "Αφαιρεί όλες τις παρακάμψεις. Μόνο ο ιδρυτής."
    done: "\x0303✔\x03 Όλα τα επίπεδα επαναφέρθηκαν στις προεπιλογές."

# --- VOICE -----------------------------------------------------------------
voice:
  syntax: "VOICE <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303VOICE #κανάλι Αλίκη\x03\x0F"
  short: "Δώστε λειτουργία voice στο κανάλι."
  help: "Δώστε λειτουργία voice στο κανάλι."
  done: "\x0303✔\x03 Στο \x02%nickname%\x02 δόθηκε voice."
  user_not_on_channel: "\x0304✗\x03 Το ψευδώνυμο \x02%nickname%\x02 δεν είναι στο δίκτυο."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 δίνει \x0304%mode%\x03 σε \x0314%to%\x03"

# --- DEVOICE ---------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEVOICE #κανάλι Αλίκη\x03\x0F"

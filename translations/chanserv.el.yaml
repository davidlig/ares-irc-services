  help: "Αφαίρεση λειτουργίας semi-operator στο κανάλι."
  done: "Αφαιρέθηκε το halfop από τον/την %nickname%."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> {ADD <mask> [expiry] [αιτιολογία]|DEL {<mask>|<number>}|LIST}"
  example: "%command_prefix%AKICK #κανάλι ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #κανάλι ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #κανάλι DEL *!*@*"
    - "%command_prefix%AKICK #κανάλι DEL 2"
    - "%command_prefix%AKICK #κανάλι LIST"
  short: "Διαχείριση λίστας auto-kick."
  help: |-
    ADD <μάσκα> [expiry] [αιτιολογία]: προσθήκη καταχώρησης.
    DEL <mask|num>: αφαίρεση.
    LIST: λίστα καταχωρήσεων.
  unknown_sub: "Άγνωστη υπο-εντολή %sub%. Χρησιμοποιήστε ADD, DEL ή LIST."
  invalid_mask: "Μη έγκυρη μορφή μάσκας. Χρησιμοποιήστε nick!ident@host με χαρακτήρες wildcard (*)."
  dangerous_mask: "Η μάσκα %mask% είναι πολύ ευρεία. Πρέπει να περιέχει τουλάχιστον 4 αλφαριθμητικούς χαρακτήρες."
  protected_user: "Το ψευδώνυμο %nickname% έχει πρόσβαση σε αυτό το κανάλι."
  max_entries: "Μέγιστο %max% καταχωρήσεις AKICK ανά κανάλι."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <mask> [expiry] [αιτιολογία]"
    example: "%command_prefix%AKICK #κανάλι ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #κανάλι ADD *!*@* 7d Spam"
    short: "Προσθήκη καταχώρησης AKICK."
    help: |-
      Απαιτείται λήξη αν καθορίζεται αιτιολογία.
      Μορφές: 0 (μόνιμο), 1d, 7d, 30d, 12h, 60m.
      Παραδείγματα: 'AKICK #c ADD *!*@* 0', 'AKICK #c ADD *!*@* 7d Spam'.
    done: "Το AKICK %mask% προστέθηκε."
    already_exists: "Το AKICK %mask% υπάρχει ήδη."
    notice_channel: "%from% προσθέτει AKICK: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL {<mask>|<number>}"
    example: "%command_prefix%AKICK #κανάλι DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #κανάλι DEL 2"
    short: "Αφαίρεση καταχώρησης AKICK."
    help: "Αφαίρεση με ακριβή μάσκα ή αριθμό καταχώρησης από το LIST."
    not_found: "Το AKICK %mask% δεν βρέθηκε."
    done: "Το AKICK %mask% αφαιρέθηκε."
    notice_channel: "%from% αφαιρεί AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#channel> LIST"
    example: "%command_prefix%AKICK #κανάλι LIST"
    short: "Λίστα καταχωρήσεων AKICK."
    help: "Εμφανίζει μάσκα, αιτιολογία, λήξη και ποιος πρόσθεσε."
    header: "Λίστα AKICK για %channel%"
    empty: "Το κανάλι %channel% δεν έχει καταχωρήσεις AKICK."
    entry: "#%index% %mask% %reason% (από %nickname%, λήγει: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#channel>"
  example: "%command_prefix%RESTORE #κανάλι"
  short: "Επαναφορά καναλιού σε αναμονή διαγραφής."
  help: |-
    Επαναφέρει ένα κανάλι που διαγράφηκε χειροκίνητα και βρίσκεται ακόμα εντός της
    περιόδου χάριτος. Απαιτεί άδεια IRCop: chanserv.restore.
  success: "Το κανάλι %channel% έχει επαναφερθεί."
  not_pending_deletion: "Το κανάλι %channel% δεν είναι σε αναμονή διαγραφής."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#channel> [FORCE]"
  example: "%command_prefix%DROP #κανάλι"
  examples:
    - "%command_prefix%DROP #κανάλι FORCE"
  short: "Διαγραφή καταχωρημένου καναλιού."
  help: |-
    Διαγράφει ένα εγγεγραμμένο κανάλι από τη βάση δεδομένων.
    Το FORCE διαγράφει οριστικά ένα κανάλι που εκκρεμεί προς διαγραφή.
    Ένας IRCop με άδεια DROP μπορεί επίσης να αποδεσμεύσει άμεσα
    εκκρεμείς και απορριφθείσες αιτήσεις εγγραφής, με ή χωρίς FORCE.
  registration_restricted: "Αυτό το αίτημα εγγραφής αποκλείεται έως %date%."
  force:
    short: "Διαγράφει οριστικά ένα κανάλι που εκκρεμεί προς διαγραφή."
  success: "Το κανάλι %channel% έχει επισημανθεί για διαγραφή και μπορεί να αποκατασταθεί κατά την περίοδο χάριτος."
  force_success: "Το κανάλι %channel% έχει διαγραφεί οριστικά."
  pending_deletion: "Το κανάλι %channel% είναι ήδη σε αναμονή διαγραφής. Χρησιμοποιήστε DROP <#channel> FORCE για οριστική διαγραφή."
  invalid_channel: "Μη έγκυρο όνομα καναλιού. Χρησιμοποιήστε %example%."
  pending_deletion_reason: "Το κανάλι %channel% βρίσκεται σε διαδικασία διαγραφής. Περισσότερες πληροφορίες /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#channel> <duration> <αιτιολογία>"
  example: "%command_prefix%SUSPEND #κανάλι 7d Παραβίαση κανόνων"
  examples:
    - "%command_prefix%SUSPEND #κανάλι 0 Παραβίαση κανόνων"
  short: "Αναστολή καναλιού."
  help: |-
    Απενεργοποιεί προσωρινά ένα καταχωρημένο κανάλι. Μορφές διάρκειας: 0 = μόνιμη,
    1d, 12h, 60m.
    Όσο είναι σε αναστολή, οι λειτουργίες καναλιού, η πρόσβαση και η επιβολή είναι
    απενεργοποιημένες.
    Αυτή η εντολή απαιτεί άδεια IRCop: chanserv.suspend
  success: "Το κανάλι %channel% έχει τεθεί σε αναστολή μέχρι %duration%."
  already_suspended: "Το κανάλι %channel% είναι ήδη σε αναστολή."
  invalid_duration: "Μη έγκυρη διάρκεια. Χρησιμοποιήστε: 0 (μόνιμη), 1d, 12h, ή 60m."
  channel_suspended: "Το κανάλι %channel% είναι σε αναστολή και δεν μπορεί να χρησιμοποιηθεί."
  notice_channel: "Το κανάλι έχει τεθεί σε αναστολή. Αιτιολογία: %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#channel>"
  example: "%command_prefix%UNSUSPEND #κανάλι"
  short: "Άρση αναστολής καναλιού."
  help: |-
    Επανενεργοποιεί ένα κανάλι σε αναστολή, αποκαθιστώντας τις λειτουργίες και την
    επιβολή του.
    Αυτή η εντολή απαιτεί άδεια IRCop: chanserv.suspend
  success: "Το κανάλι %channel% δεν είναι πλέον σε αναστολή."
  not_suspended: "Το κανάλι %channel% δεν είναι σε αναστολή."
  reason_expired: "έληξε η αναστολή"


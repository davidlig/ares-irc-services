# CReG translations — Français
# Domaine : cregserv

unknown_command: "\x0304✗\x03 Commande inconnue \x02%command%\x02. Utilisez \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Syntaxe incorrecte. Utilisation : \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Cette commande est réservée aux opérateurs IRC."
  not_identified: "\x0304✗\x03 Vous n'êtes pas identifié. Utilisez \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permission refusée. Vous n'avez pas accès à cette commande."

registra:
  syntax: "REGISTRA <#canal> <description>"
  short: "Demande l'approbation de l'enregistrement d'un canal."
  help: "Demande l'enregistrement d'un nouveau canal. Un opérateur de services examine la demande et l'approuve ou la refuse ; le canal n'est enregistré qu'une fois approuvée. Vous devez être identifié avec %nickserv%.\n\n\x02#canal :\x02 Le canal à enregistrer. Il doit commencer par #, ne doit pas déjà être enregistré (vérifiez avec la commande ESTADO) et comporter au plus 64 caractères en incluant le #.\n\n\x02description :\x02 Le thème ou l'objectif du canal, jusqu'à 255 caractères. C'est ce que l'opérateur prend en compte en examinant la demande.\n\nUne fois envoyée, la demande reste en attente qu'un opérateur de services l'approuve ou la refuse. Vous ne pouvez envoyer qu'une demande toutes les 24 heures."
  example: "/msg CReG REGISTRA #mychannel un endroit pour discuter"
  requested: "\x0303✔\x03 Vous avez demandé l'enregistrement du canal \x02%channel%\x02. Un opérateur de services évaluera la demande."
  invalid_channel: "\x0304✗\x03 Le nom du canal doit commencer par un \x02#\x02."
  channel_too_long: "\x0304✗\x03 Le nom du canal est trop long : \x0264\x02 caractères maximum, \x02#\x02 compris."
  description_too_long: "\x0304✗\x03 La description est trop longue : \x02255\x02 caractères maximum."
  already_registered: "\x0304✗\x03 Le canal \x02%channel%\x02 est déjà enregistré."
  pending_deletion: "\x0304✗\x03 Le canal \x02%channel%\x02 est en cours de suppression et ne peut pas être enregistré tant que la suppression n'est pas terminée."
  duplicate: "\x0304✗\x03 Une demande d'enregistrement pour \x02%channel%\x02 attend déjà une approbation. Utilisez \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 La demande d'enregistrement de \x02%channel%\x02 a été refusée."
  throttled: "\x0304✗\x03 Vous devez attendre \x02%minutes%\x02 minute(s) avant de demander un autre canal."

estado:
  syntax: "ESTADO <#canal>"
  short: "Affiche l'état d'enregistrement d'un canal."
  help: "Indique à quelle étape en est un canal dans le processus d'enregistrement.\n\nLes états possibles sont :\n    \x02ENREGISTRÉ\x02 : le canal est déjà enregistré avec ChanServ.\n    \x02EN EXAMEN\x02 : une demande d'enregistrement attend qu'un opérateur de services l'approuve ou la refuse.\n    \x02REFUSÉ\x02 : la demande d'enregistrement a été refusée.\n    \x02EN SUPPRESSION\x02 : le canal a été abandonné et se trouve dans sa période de grâce de suppression ; il ne peut pas être réenregistré tant que la suppression n'est pas terminée.\n    \x02AUCUN PROCESSUS\x02 : le canal n'a aucun processus d'enregistrement."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 Le canal \x02%channel%\x02 est déjà enregistré."
  pending_deletion: "\x0304✗\x03 Le canal \x02%channel%\x02 est en cours de suppression et ne peut pas être enregistré tant que la suppression n'est pas terminée."
  pending: "\x0303◌\x03 Le canal \x02%channel%\x02 est en cours, en attente de l'examen d'un opérateur de services (demandé le %date%)."
  denied: "\x0304✗\x03 Le canal \x02%channel%\x02 est refusé depuis le %date%. Motif : %reason%"
  no_request: "\x0304✗\x03 Le canal \x02%channel%\x02 n'a aucun processus d'enregistrement."

cancel:
  syntax: "CANCEL <#canal>"
  short: "Annule votre demande d'enregistrement de canal en attente."
  help: "Annule une demande d'enregistrement de canal qui n'a encore été approuvée ni refusée. Vous ne pouvez annuler que vos propres demandes en attente.\n\n\x02#canal :\x02 Le canal dont vous voulez annuler la demande. La demande doit être celle que vous avez envoyée et doit toujours être en attente.\n\nUne fois annulée, la demande est supprimée et le nom du canal est libéré."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 Votre demande d'enregistrement du canal \x02%channel%\x02 a été annulée et le nom du canal est de nouveau libre."
  invalid_channel: "\x0304✗\x03 Le nom du canal doit commencer par \x02#\x02."
  no_request: "\x0304✗\x03 Le canal \x02%channel%\x02 n'a aucun processus d'enregistrement."
  not_yours: "\x0304✗\x03 La demande d'enregistrement de \x02%channel%\x02 ne vous appartient pas."
  not_pending: "\x0304✗\x03 La demande d'enregistrement de \x02%channel%\x02 a déjà été approuvée ou refusée et ne peut pas être annulée."

aprobar:
  syntax: "APROBAR <#canal>"
  short: "Approuve une demande d'enregistrement de canal en attente."
  help: "Enregistre un canal dont la demande est en attente d'examen. Le canal est enregistré au nom de l'utilisateur qui l'a demandé ; aucun de vous deux n'a besoin d'y être. Vous avez besoin de la permission \x02cregserv.aprobar\x02.\n\n\x02#canal:\x02 Le canal dont la demande est en attente. Utilisez PENDIENTES pour voir la file d'attente.\n\nUne fois approuvé, le canal est enregistré auprès de \x02ChanServ\x02 et la demande est clôturée."
  example: "/msg CReG APROBAR #canal"
  approved: "\x0303✔\x03 Le canal \x02%channel%\x02 a été enregistré avec succès pour \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 Le nom du canal doit commencer par un \x02#\x02."
  no_pending: "\x0304✗\x03 Le canal \x02%channel%\x02 n'est pas en cours d'enregistrement."
  already_registered: "\x0304✗\x03 Le canal \x02%channel%\x02 est déjà enregistré auprès de \x02ChanServ\x02."
  already_approved: "\x0304✗\x03 Le canal \x02%channel%\x02 est déjà enregistré."
  already_denied: "\x0304✗\x03 Le canal \x02%channel%\x02 ne peut pas être enregistré car il est marqué \x0304REFUSÉ\x03."
  failed: "\x0304✗\x03 L'enregistrement du canal \x02%channel%\x02 n'a pas pu aboutir."

denegar:
  syntax: "DENEGAR <#canal> <motif>"
  short: "Refuse une demande d'enregistrement de canal en attente."
  help: "Rejette une demande d'enregistrement en laissant le nom du canal libre. Le motif est obligatoire et est affiché par DENEGADOS. Vous avez besoin de la permission \x02cregserv.denegar\x02.\n\n\x02#canal:\x02 Le canal dont la demande est en attente.\n\x02motif:\x02 Pourquoi la demande est refusée ; il est enregistré et affiché à quiconque consulte DENEGADOS.\n\nLe nom du canal redevient libre pour être redemandé après le refus."
  example: "/msg CReG DENEGAR #canal hors sujet"
  denied: "\x0303✔\x03 L'enregistrement du canal \x02%channel%\x02 a été refusé."
  invalid_channel: "\x0304✗\x03 Le nom du canal doit commencer par un \x02#\x02."
  no_pending: "\x0304✗\x03 Le canal \x02%channel%\x02 n'a aucun processus d'enregistrement."
  already_approved: "\x0304✗\x03 Les canaux déjà enregistrés et approuvés ne peuvent pas être refusés."
  already_denied: "\x0304✗\x03 Le canal \x02%channel%\x02 est déjà refusé."

pendientes:
  syntax: "PENDIENTES"
  short: "Liste les demandes d'enregistrement de canal en attente d'examen."
  help: "Liste chaque demande d'enregistrement en attente de l'évaluation d'un opérateur de services, avec le canal, qui l'a demandée, la date et la description. Vous avez besoin de la permission \x02cregserv.pendientes\x02.\n\nCette commande n'accepte aucun paramètre."
  example: "/msg CReG PENDIENTES"
  empty: "Aucun canal n'attend d'examen."
  line: "\x02Canal :\x02 %channel%, \x02Demandé par :\x02 %requester%, \x02Date :\x02 %date%, \x02Description :\x02 %description%"
  end: "Fin de la liste."

denegados:
  syntax: "DENEGADOS"
  short: "Liste les demandes d'enregistrement de canal qui ont été refusées."
  help: "Liste chaque demande d'enregistrement refusée avec le motif du refus. Vous avez besoin de la permission \x02cregserv.denegados\x02.\n\nCette commande n'accepte aucun paramètre."
  example: "/msg CReG DENEGADOS"
  empty: "Aucun canal n'est refusé."
  line: "\x02Canal :\x02 %channel%, \x02Motif :\x02 %reason%"
  end: "Fin de la liste."

drop:
  syntax: "DROP <#canal>"
  short: "Supprime l'enregistrement que \x02%bot%\x02 conserve pour un canal."
  help: "Supprime l'enregistrement que \x02%bot%\x02 conserve pour un canal et, si le canal y est enregistré, le retire aussi de \x02ChanServ\x02. Vous avez besoin de la permission \x02cregserv.drop\x02.\n\n\x02#canal:\x02 Le canal à supprimer.\n\nLe retrait de \x02ChanServ\x02 est un retrait doux : le canal entre dans une période de grâce de suppression au lieu d'être supprimé immédiatement."
  example: "/msg CReG DROP #canal"
  dropped: "\x0303✔\x03 L'enregistrement du canal \x02%channel%\x02 a été supprimé de \x02%bot%\x02."
  dropped_channel: "\x0303✔\x03 Le canal \x02%channel%\x02 a été supprimé et entre désormais dans la période de grâce de suppression."
  invalid_channel: "\x0304✗\x03 Le nom du canal doit commencer par un \x02#\x02."
  no_request: "\x0304✗\x03 Le canal \x02%channel%\x02 n'est pas enregistré auprès de \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#canal> [description]"
  short: "Enregistre un canal sans s'y trouver."
  help: "Enregistre un canal à la demande du staff, sans passer par le flux de demande et d'approbation. Vous n'avez pas besoin d'être dans le canal et il n'a pas besoin d'exister encore. Vous avez besoin de la permission \x02cregserv.saregister\x02.\n\n\x02#canal:\x02 Le canal à enregistrer.\n\x02description:\x02 Description facultative enregistrée avec l'enregistrement."
  example: "/msg CReG SAREGISTER #canal un canal du staff"
  done: "\x0303✔\x03 Le canal \x02%channel%\x02 a été enregistré."
  invalid_channel: "\x0304✗\x03 Le nom du canal doit commencer par un \x02#\x02."
  pending_deletion: "\x0304✗\x03 Le canal \x02%channel%\x02 est en attente de suppression et ne peut pas être enregistré."
  already_registered: "\x0304✗\x03 Le canal \x02%channel%\x02 est déjà enregistré."
  failed: "\x0304✗\x03 L'enregistrement du canal \x02%channel%\x02 n'a pas pu aboutir."


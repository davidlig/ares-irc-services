# CReG translations — Italiano
# Domain: cregserv

unknown_command: "\x0304✗\x03 Comando sconosciuto \x02%command%\x02. Usa \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Sintassi errata. Uso: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Questo comando è riservato agli operatori IRC."
  not_identified: "\x0304✗\x03 Non sei identificato. Usa \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permesso negato. Non hai accesso a questo comando."

registra:
  syntax: "REGISTRA <#canale> <descrizione>"
  short: "Richiede l'approvazione della registrazione di un canale."
  help: "Chiedi la registrazione di un canale nuovo. Un operatore dei servizi esamina la richiesta e la approva o la nega; il canale viene registrato solo una volta approvata. Devi essere identificato con %nickserv%.\n\n\x02#canale:\x02 Il canale da registrare. Deve iniziare con #, non deve essere già registrato (verifica con il comando ESTADO) e deve avere al massimo 64 caratteri compreso il #.\n\n\x02descrizione:\x02 Il tema o lo scopo del canale, fino a 255 caratteri. È ciò che l'operatore valuta nell'esaminare la richiesta.\n\nUna volta inviata, la richiesta resta in attesa che un operatore dei servizi la approvi o la neghi. Puoi inviare solo una richiesta ogni 24 ore."
  example: "/msg CReG REGISTRA #mychannel un posto per chiacchierare"
  requested: "\x0303✔\x03 Hai richiesto la registrazione del canale \x02%channel%\x02. Un operatore dei servizi valuterà la richiesta."
  invalid_channel: "\x0304✗\x03 Il nome del canale deve iniziare con un \x02#\x02."
  channel_too_long: "\x0304✗\x03 Il nome del canale è troppo lungo: al massimo \x0264\x02 caratteri compreso il \x02#\x02."
  description_too_long: "\x0304✗\x03 La descrizione è troppo lunga: al massimo \x02255\x02 caratteri."
  already_registered: "\x0304✗\x03 Il canale \x02%channel%\x02 è già registrato."
  pending_deletion: "\x0304✗\x03 Il canale \x02%channel%\x02 è in fase di eliminazione e non può essere registrato fino al completamento dell'eliminazione."
  duplicate: "\x0304✗\x03 Esiste già una richiesta di registrazione per \x02%channel%\x02 in attesa di approvazione. Usa \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 La richiesta di registrazione di \x02%channel%\x02 è stata negata."
  throttled: "\x0304✗\x03 Devi aspettare \x02%minutes%\x02 minuto/i prima di richiedere un altro canale."

estado:
  syntax: "ESTADO <#canale>"
  short: "Mostra lo stato di registrazione di un canale."
  help: "Indica a che punto si trova un canale nel processo di registrazione.\n\nGli stati possibili sono:\n    \x02REGISTRATO\x02: il canale è già registrato con ChanServ.\n    \x02IN REVISIONE\x02: una richiesta di registrazione attende che un operatore dei servizi la approvi o la neghi.\n    \x02NEGATO\x02: la richiesta di registrazione è stata negata.\n    \x02IN ELIMINAZIONE\x02: il canale è stato dismesso ed è nel suo periodo di grazia di eliminazione; non può essere registrato di nuovo fino al completamento dell'eliminazione.\n    \x02NESSUN PROCESSO\x02: il canale non ha alcun processo di registrazione."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 Il canale \x02%channel%\x02 è già registrato."
  pending_deletion: "\x0304✗\x03 Il canale \x02%channel%\x02 è in fase di eliminazione e non può essere registrato fino al completamento dell'eliminazione."
  pending: "\x0303◌\x03 Il canale \x02%channel%\x02 è in corso, in attesa della revisione di un operatore dei servizi (richiesto il %date%)."
  denied: "\x0304✗\x03 Il canale \x02%channel%\x02 è negato dal %date%. Motivo: %reason%"
  no_request: "\x0304✗\x03 Il canale \x02%channel%\x02 non ha alcun processo di registrazione."

cancel:
  syntax: "CANCEL <#canale>"
  short: "Annulla la tua richiesta di registrazione pendente per un canale."
  help: "Annulla una richiesta di registrazione di canale che non è stata ancora approvata né negata. Puoi annullare solo le tue richieste pendenti.\n\n\x02#canale:\x02 Il canale di cui vuoi annullare la richiesta. La richiesta deve essere quella che hai inviato tu e deve essere ancora in attente.\n\nUna volta annullata, la richiesta viene rimossa e il nome del canale torna libero."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 La tua richiesta di registrazione del canale \x02%channel%\x02 è stata annullata e il nome del canale è di nuovo libero."
  invalid_channel: "\x0304✗\x03 Il nome del canale deve iniziare con \x02#\x02."
  no_request: "\x0304✗\x03 Il canale \x02%channel%\x02 non ha alcun processo di registrazione."
  not_yours: "\x0304✗\x03 La richiesta di registrazione di \x02%channel%\x02 non ti appartiene."
  not_pending: "\x0304✗\x03 La richiesta di registrazione di \x02%channel%\x02 è già stata approvata o negata e non può essere annullata."

aprobar:
  syntax: "APROBAR <#canale>"
  short: "Approva una richiesta di registrazione di canale pendente."
  help: "Registra un canale la cui richiesta è in attesa di revisione. Il canale viene registrato a nome di chi l'ha richiesto; nessuno dei due deve trovarsi al suo interno. Hai bisogno del permesso \x02cregserv.aprobar\x02.\n\n\x02#canale:\x02 Il canale con la richiesta in attesa. Usa PENDIENTES per vedere la coda.\n\nUna volta approvato, il canale viene registrato su \x02ChanServ\x02 e la richiesta viene chiusa."
  example: "/msg CReG APROBAR #canale"
  approved: "\x0303✔\x03 Il canale \x02%channel%\x02 è stato registrato correttamente per \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 Il nome del canale deve iniziare con un \x02#\x02."
  no_pending: "\x0304✗\x03 Il canale \x02%channel%\x02 non è in processo di registrazione."
  already_registered: "\x0304✗\x03 Il canale \x02%channel%\x02 è già registrato con \x02ChanServ\x02."
  already_approved: "\x0304✗\x03 Il canale \x02%channel%\x02 è già registrato."
  already_denied: "\x0304✗\x03 Il canale \x02%channel%\x02 non può essere registrato perché è contrassegnato come \x0304NEGATO\x03."
  failed: "\x0304✗\x03 La registrazione del canale \x02%channel%\x02 non è stata completata."

denegar:
  syntax: "DENEGAR <#canale> <motivo>"
  short: "Nega una richiesta di registrazione di canale pendente."
  help: "Nega una richiesta di registrazione lasciando libero il nome del canale. Il motivo è obbligatorio ed è mostrato da DENEGADOS. Hai bisogno del permesso \x02cregserv.denegar\x02.\n\n\x02#canale:\x02 Il canale con la richiesta in attesa.\n\x02motivo:\x02 Perché la richiesta viene negata; viene salvato e mostrato a chiunque consulti DENEGADOS.\n\nIl nome del canale torna libero per essere richiesto di nuovo dopo il rifiuto."
  example: "/msg CReG DENEGAR #canale fuori tema"
  denied: "\x0303✔\x03 La registrazione del canale \x02%channel%\x02 è stata negata."
  invalid_channel: "\x0304✗\x03 Il nome del canale deve iniziare con un \x02#\x02."
  no_pending: "\x0304✗\x03 Il canale \x02%channel%\x02 non ha alcun processo di registrazione."
  already_approved: "\x0304✗\x03 I canali già registrati e approvati non possono essere negati."
  already_denied: "\x0304✗\x03 Il canale \x02%channel%\x02 è già negato."

pendientes:
  syntax: "PENDIENTES"
  short: "Elenca le richieste di registrazione di canale in attesa di revisione."
  help: "Elenca ogni richiesta di registrazione in attesa che un operatore dei servizi la valuti, mostrando il canale, chi l'ha richiesta, la data e la descrizione. Hai bisogno del permesso \x02cregserv.pendientes\x02.\n\nQuesto comando non accetta parametri."
  example: "/msg CReG PENDIENTES"
  empty: "Non ci sono canali in attesa di revisione."
  line: "\x02Canale:\x02 %channel%, \x02Richiesto da:\x02 %requester%, \x02Data:\x02 %date%, \x02Descrizione:\x02 %description%"
  end: "Fine dell'elenco."

denegados:
  syntax: "DENEGADOS"
  short: "Elenca le richieste di registrazione di canale che sono state negate."
  help: "Elenca ogni richiesta di registrazione negata insieme al motivo per cui è stata negata. Hai bisogno del permesso \x02cregserv.denegados\x02.\n\nQuesto comando non accetta parametri."
  example: "/msg CReG DENEGADOS"
  empty: "Non ci sono canali negati."
  line: "\x02Canale:\x02 %channel%, \x02Motivo:\x02 %reason%"
  end: "Fine dell'elenco."

drop:
  syntax: "DROP <#canale>"
  short: "Rimuove il record di registrazione che \x02%bot%\x02 conserva per un canale."
  help: "Rimuove il record che \x02%bot%\x02 conserva per un canale e, se il canale è registrato lì, lo deregistra anche da \x02ChanServ\x02. Hai bisogno del permesso \x02cregserv.drop\x02.\n\n\x02#canale:\x02 Il canale da rimuovere.\n\nLa deregistrazione da \x02ChanServ\x02 è morbida: il canale entra in un periodo di grazia di eliminazione invece di essere subito cancellato."
  example: "/msg CReG DROP #canale"
  dropped: "\x0303✔\x03 Il record di registrazione del canale \x02%channel%\x02 è stato rimosso da \x02%bot%\x02."
  dropped_channel: "\x0303✔\x03 Il canale \x02%channel%\x02 è stato eliminato e ora entra nel periodo di grazia di eliminazione."
  invalid_channel: "\x0304✗\x03 Il nome del canale deve iniziare con un \x02#\x02."
  no_request: "\x0304✗\x03 Il canale \x02%channel%\x02 non è registrato presso \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#canale> [descrizione]"
  short: "Registra un canale senza trovarsi al suo interno."
  help: "Registra un canale su richiesta dello staff, senza passare dal flusso di richiesta e approvazione. Non devi trovarsi nel canale e il canale non deve ancora esistere. Hai bisogno del permesso \x02cregserv.saregister\x02.\n\n\x02#canale:\x02 Il canale da registrare.\n\x02descrizione:\x02 Descrizione facoltativa salvata con la registrazione."
  example: "/msg CReG SAREGISTER #canale un canale dello staff"
  done: "\x0303✔\x03 Il canale \x02%channel%\x02 è stato registrato."
  invalid_channel: "\x0304✗\x03 Il nome del canale deve iniziare con un \x02#\x02."
  pending_deletion: "\x0304✗\x03 Il canale \x02%channel%\x02 è in attesa di eliminazione e non può essere registrato."
  already_registered: "\x0304✗\x03 Il canale \x02%channel%\x02 è già registrato."
  failed: "\x0304✗\x03 La registrazione del canale \x02%channel%\x02 non è stata completata."


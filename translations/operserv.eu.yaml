# OperServ itzulpenak — Euskara
# Domeinua: operserv
#
# IRC formatu-kodeak (komatxo bikoitzak edo !irc bloke literalak):
#   \x02        letra lodia aktibatu/desaktibatu
#   \x03NN      kolorea (HAMARTARRA: 03=berdea, 04=gorria, 07=laranja, 14=gris iluna)
#   \x03        kolorea berrezarri
#   \x0F        formatu osoa berrezarri
#
# IRC koloreek zenbaki HAMARTARRAK (0-15) erabiltzen dituzte, ez hamaseitarrak.
#   \x0314 = gris iluna (14 hamartarra): ZUZENA
#   \x030F = 0 kolorea eta ondoren F letra: OKERRA
#
# Lerro anitzeko IRC testua: !irc |- benetako lerro-jauzi eta zuriuneekin.
# Etiketarik gabeko blokeek ez dituzte ihesak deskodetzen; gorde CTCP literalak.
# HELP adibideak: example/examples eta %command_prefix%.
# Aurkezleak kolorerik gabeko /msg eta bi zuriuneko marjina gehitzen ditu.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "\x0304✗\x03 Komando hau sareko root administratzaileentzat mugatuta dago."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [komandoa [azpi-aukera]]"
  short: "Zerrendatu komandoak edo erakutsi komando baten laguntza."
  help: !irc |-
    Argumenturik gabe komando guztiak zerrendatzen ditu. Erabili \x0303HELP <komandoa>\x03
    laguntza osorako, edo \x0303HELP <komandoa> <aukera>\x03 azpi-aukertarako.
  example: "%command_prefix%\x02\x0303HELP KILL\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Sareko operadoreak eta haien baimenak kudeatzeko, sarbide-murrizketak
    aplikatzeko eta erabiltzaileak deskonektatzeko aukera ematen du. Sareko
    komunikatu orokorrak bidali eta ongietorri-mezuak ere kudea ditzake.
  general_header: "\x02 ■ Komando erabilgarriak:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Aukerak:\x02"
  examples_header: "\x02 ■ Adibideak:\x02"
  general_footer: "\x0310ℹ\x03\x0F Erabili /msg %bot% \x02\x0303HELP <komandoa>\x03\x0F informazio gehiago lortzeko."
  set_sub_footer: "\x0310ℹ\x03\x0F Erabili /msg %bot% \x02\x0303HELP %command% <aukera>\x03\x0F informazio gehiago lortzeko."
  syntax_label: "Sintaxia: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0307⚠\x03\x0F OHARRA: %days% egun baino gehiagoz erabiltzen ez diren ezizenak automatikoki ezabatuko dira."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    operators_roles: "Operadoreak eta rolak"
    network_security: "Sareko segurtasuna"
    communication: "Komunikazioa"
    low_level: "Behe-maila"
  ircop_header: "\x02 ■ IRC operadoreentzako komando erabilgarriak:\x02"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD|DEL|LIST} [ezizena] [rola]"
  short: "Kudeatu sareko IRC operadoreak."
  help: |-
    Sareko IRC operadoreak kudeatzen ditu. ADDk ezizen erregistratu bat gehitzen du
    zehaztutako rolarekin operadore gisa.
    DELek operadore bat kentzen du. LISTek operadore guztiak erakusten ditu.
    Erabili ROLE LIST rolak ikusteko.
    Komando hau zerbitzuetan konfiguratutako Root erabiltzaileentzat mugatuta dago.
  example: "%command_prefix%\x02\x0303IRCOP ADD Ane OPER\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Azpikomando ezezaguna \x02%sub%\x02. Erabili ADD, DEL edo LIST."
  unknown_role: "\x0304✗\x03 \x02%role%\x02 rola ez da existitzen. Erabili \x0303/msg %bot% ROLE LIST\x03 rolak ikusteko."
  already_admin: "\x0304✗\x03 \x02%nickname%\x02 jada IRC operadorea da (rola: %role%)."
  not_admin: "\x0304✗\x03 \x02%nickname%\x02 ez da IRC operadorea."
  role_changed: "\x0303✓\x03 \x02%nickname%\x02(r)en rola aldatu da: %old% → %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <ezizena> <rola>"
    short: "Gehitu sareko IRC operadore bat."
    help: |-
      Ezizen erregistratu bat sareko IRC operadore gisa gehitzen du.
      Erabili ROLE LIST rolak ikusteko.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%\x02\x0303IRCOP ADD Ane OPER\x03\x0F"
    done: "\x0303✓\x03 \x02%nickname%\x02 \x02%role%\x02 gisa gehitu da."
    nick_not_active: "\x0304✗\x03 \x02%nickname%\x02 ezizena ez da ezizen erregistratu aktibo bat."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <ezizena>"
    short: "Kendu sareko IRC operadore bat."
    help: |-
      Sareko IRC operadore bat zerrendatik kentzen du.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%\x02\x0303IRCOP DEL Ane\x03\x0F"
    done: "\x0303✓\x03 \x02%nickname%\x02 IRC operadoreetatik kendu da."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Zerrendatu sareko IRC operadore guztiak."
    help: |-
      Sareko IRC operadore guztiak bere rolekin eta erregistro datarekin zerrendatzen
      ditu.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
    header: "\x0307---\x03 \x02Sareko IRC Operadoreak\x02 \x0307---\x03"
    empty: "Ez dago IRC operadorerik."

# --- ROLE ------------------------------------------------------------------
role:

  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW|SET} [rola] [parametroak]"
    short: "UnrealIRCd-eko operadore-klasea konfiguratzen du."
    help: !irc |-
      Rol baten operclass-a kontsultatu eta konfiguratzen du.

      \x02 ■ Aukerak:\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FSareko operclass erabilgarriak erakusten ditu.
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FRolaren operclass-a eta erabilgarriak erakusten ditu.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FIRCOPei identifikatzean operclass-a esleitzen die.

      Utzi balioa hutsik kentzeko.

      UnrealIRCd protokoloetan soilik dago erabilgarri.
    example: "%command_prefix%\x02\x0303ROLE OPERCLASS LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE OPERCLASS VIEW LAGUNTZA\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET LAGUNTZA services-admin\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET LAGUNTZA\x03\x0F"
    list:
      header: "\x0307---\x03 \x02Sarean Erabilgarri Dauden Operclass-ak\x02 \x0307---\x03"
      empty: "Ez dago operclass-ik erabilgarri sarean."
      not_supported: "\x0304✗\x03 Uneko protokoloak ez du onartzen erabilgarri dauden operclass-ak zerrendatzea."
    view:
      empty: "%role% rolak ez du operclass-ik."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Erabilgarri dauden operclass-ak: \x0310%available%\x03"
    set:
      done: "\x0303✓\x03 Operclass-a ezarri zaio %role% rolari."
      cleared: "\x0303✓\x03 Operclass-a kendu zaio %role% rolari."
      not_available: "\x0304✗\x03 \x02%operclass%\x02 operclass ez dago erabilgarri sarean. Erabilgarri daudenak: %available%."
  syntax: "ROLE <aukera> [izena] [...]"
  short: "Kudeatu operadore rolak."
  help: |-
    Operadore rolak kudeatzen ditu. ADDek rol berri bat sortzen du, DELek kentzen
    du,
    LISTek rol guztiak erakusten ditu, PERMSek rol baten baimenak kudeatzen ditu,
    MODESek IRCOP moduak kudeatzen ditu,
    VHOSTek rol baten behartutako vhost eredua kudeatzen du.
    Babestutako rolak (ADMIN, OPER, PREOPER) ezin dira ezabatu.
    Komando hau Root erabiltzaileentzat mugatuta dago.
  syntax_operclass: "ROLE <aukera> [izena] [...]"
  help_operclass: |-
    Operadore rolak kudeatzen ditu. ADDek rol berri bat sortzen du, DELek kentzen du,
    LISTek rol guztiak erakusten ditu, PERMSek rol baten baimenak kudeatzen ditu, MODESek IRCOP moduak kudeatzen ditu,
    VHOSTek rol baten behartutako vhost eredua kudeatzen du, OPERCLASSek Unreal operclass kudeatzen du.
    Babestutako rolak (ADMIN, OPER, PREOPER) ezin dira ezabatu.
    Komando hau Root erabiltzaileentzat mugatuta dago.
  example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ROLE ADD LAGUNTZA Laguntza-operadoreak\x03\x0F"
  unknown_sub: "\x0304✗\x03 Azpikomando ezezaguna \x02%sub%\x02. Erabili ADD, DEL, LIST, PERMS, MODES edo VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Azpikomando ezezaguna \x02%sub%\x02. Erabili ADD, DEL, LIST, PERMS, MODES, VHOST edo OPERCLASS."
  not_found: "\x0304✗\x03 \x02%role%\x02 rola ez da existitzen."
  already_exists: "\x0304✗\x03 \x02%role%\x02 rola jada existitzen da."
  protected: "\x0304✗\x03 \x02%role%\x02 rola babestuta dago eta ezin da ezabatu."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <izena> [deskribapena]"
    short: "Sortu rol berri bat."
    help: |-
      Rol pertsonalizatu berri bat sortzen du. Deskribapena aukerakoa da.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%\x02\x0303ROLE ADD LAGUNTZA Laguntza-operadoreak\x03\x0F"
    done: "\x0303✓\x03 \x02%role%\x02 rola sortu da."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <izena>"
    short: "Ezabatu rol bat."
    help: |-
      Rol pertsonalizatu bat ezabatzen du. Babestutako rolak (ADMIN, OPER, PREOPER)
      ezin dira ezabatu. Rolak operadoreak esleituta baditu,
      lehenik berresleitu behar dituzu.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%\x02\x0303ROLE DEL LAGUNTZA\x03\x0F"
    done: "\x0303✓\x03 \x02%role%\x02 rola ezabatu da."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Zerrendatu rol guztiak."
    help: |-
      Rol guztiak zerrendatzen ditu. Babestutako rolak [PROTECTED] markarekin daude.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
    header: "\x0307---\x03 \x02Operadore Rolak\x02 \x0307---\x03"
    empty: "Ez dago operadore rolik."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {ADD|DEL|LIST|CLEAR} <rola> [parametroak]"
    short: "Kudeatu rol baten baimenak."
    help: !irc |-
      Rol bati esleitutako baimenak kudeatzen ditu.

      \x02 ■ Aukerak:\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FRolaren baimen guztiak erakusten ditu.
          \x0310›\x03\x0F \x02\x0303ADD       \x03\x0FBaimen bat esleitzen dio rolari.
          \x0310›\x03\x0F \x02\x0303DEL       \x03\x0FBaimen bat kentzen dio rolari (ez babestutako roletarako).
          \x0310›\x03\x0F \x02\x0303CLEAR     \x03\x0FRolaren baimen guztiak kentzen ditu.

      Erabili ALL eskuragarri dauden baimen guztiak batera gehitzeko.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%\x02\x0303ROLE PERMS LIST LAGUNTZA\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE PERMS ADD LAGUNTZA operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS ADD LAGUNTZA ALL\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS DEL LAGUNTZA operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS CLEAR LAGUNTZA\x03\x0F"
    not_found: "\x0304✗\x03 \x02%perm%\x02 baimena ez da existitzen."
    already_has: "\x0304✗\x03 \x02%role%\x02 rolak jada \x02%perm%\x02 baimena du."
    does_not_have: "\x0304✗\x03 \x02%role%\x02 rolak ez du \x02%perm%\x02 baimenik."
    list:
      header: "\x0303%role%\x02 rolaren baimen-zerrenda\x02\x03"
      columns: "Esleituta | Baimen-gakoa | Deskribapena"
      row: "%assigned% | %permission% | %description%"
      assigned: "\x0303✓\x03\x0F"
      unassigned: "\x0304✗\x03\x0F"
    add:
      done: "\x0303✓\x03 \x02%perm%\x02 baimena gehitu zaio \x02%role%\x02 rolari."
      all_done: "\x0303✓\x03 \x02%count%\x02 baimen gehitu zaizkio \x02%role%\x02 rolari."
    del:
      done: "\x0303✓\x03 \x02%perm%\x02 baimena kendu zaio \x02%role%\x02 rolari."
    clear:
      done: "\x0303✓\x03 \x02%count%\x02 baimen kendu zaizkio \x02%role%\x02 rolari."
      empty: "\x0304✗\x03 \x02%role%\x02 rolak ez du baimenik esleituta."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW|SET} <rola> [moduak]"
    short: "Kudeatu rolerako IRCOP erabiltzaile moduak."
    help: !irc |-
      Rol bati esleitutako IRCOP erabiltzaile-moduak kudeatzen ditu.

      \x02 ■ Aukerak:\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FRolaren uneko moduak erakusten ditu.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FIRCOP moduak ezartzen ditu.

      Utzi moduak hutsik guztiak kentzeko.

      Rol hau duten erabiltzaileek identifikatzean jasoko dituzte moduak.
      IRCd bakoitzeko moduak
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%\x02\x0303ROLE MODES VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER oH\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02%role% rolaren moduak\x02 \x0307---\x03"
      empty: "\x02%role%\x02 rolak ez du modurik esleituta."
      line: "  Moduak: \x0303%modes%\x03"
    set:
      done: "\x0303✓\x03 \x02%modes%\x02 moduak ezarri dira \x02%role%\x02 rolerako."
      cleared: "\x0303✓\x03 \x02%role%\x02 rolaren modu guztiak kendu dira."
      invalid_mode: "\x0304✗\x03 \x02%mode%\x02 modua ez da IRCOP modu baliozkoa."
      invalid_modes: "\x0304✗\x03 Modu baliogabeak: %invalid%. Modu baliozkoak: %valid%."
      no_irc_user_modes: "\x0304✗\x03 Uneko IRCdk ez du IRCOP modurik konfiguratuta."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW|SET} <rola> [vhost]"
    short: "Kudeatu rol baten behartutako vhost eredua."
    help: !irc |-
      Rol bateko operadoreei identifikatzean ematen zaien ostalari birtuala
      konfiguratzen du, haien ostalari pertsonala ordeztuz.

      Ostalaria ezizena karaktere berezirik gabe eta konfiguratutako ereduaz
      batuz sortzen da. Adibidez:

      _davidlig_ + admin.ares → davidlig.admin.ares

      \x02 ■ Aukerak:\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FRol baten eredua erakusten du.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FRol baten eredua ezarri edo kentzen du.

      Ereduak letrak, zenbakiak, marratxoak eta puntuak soilik onartzen ditu.
      Gutxienez puntu bat behar du; ezin da marratxo edo puntuz hasi/amaitu,
      ezin ditu jarraian dauden puntuak izan.

      Erabili SET eredurik gabe behartutako host-a kentzeko.

      Root erabiltzaileentzat soilik.
    example: "%command_prefix%\x02\x0303ROLE VHOST VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER admin.ares\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02%role% rolaren behartutako vhost-a\x02 \x0307---\x03"
      empty: "\x02%role%\x02 rolak ez du behartutako vhost eredurik ezarrita."
      line: "  Eredua: \x0303%pattern%\x03"
      example: "  Adibidea: \x02ezizena\x02.%pattern%"
    set:
      done: "\x0303✓\x03 \x02%role%\x02 rolerako behartutako vhost eredua ezarri da."
      cleared: "\x0303✓\x03 \x02%role%\x02 rolaren behartutako vhost eredua kendu da."
      invalid: "\x0304✗\x03 Vhost eredu baliogabea. Karaktere baliozkoak: a-z, A-Z, 0-9, - eta .. Gutxienez puntu bat eduki behar du, ezin da - edo .-z hasi/amaitu ezta .. eduki ere."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <ezizena> <arrazoia>"
  short: "Behartu erabiltzaile bat saretik deskonektatzera."
  help: |-
    Erabiltzaile bat IRC saretik deskonektatzen du.
    IRCop-ak eta Root erabiltzaileak ezin dira kill bidez deskonektatu.
    Komando honek operserv.kill baimena behar du.

    Sintaxia: KILL <ezizena> <arrazoia>
    Adibidea: KILL ErabiltzaileGaiztoa Flood egiten kanaletan
  example: "%command_prefix%\x02\x0303KILL BadUser Flooding en canales\x03\x0F"
  protected_root: "\x0304✗\x03 Ezin da Root erabiltzaile \x02%nickname%\x02 kill bidez deskonektatu."
  protected_ircop: "\x0304✗\x03 Ezin da IRC operadore \x02%nickname%\x02 kill bidez deskonektatu."
  done: "\x0303✓\x03 \x02%nickname%\x02 erabiltzailea kill bidez deskonektatu da (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD|DEL|LIST} [maskara] [iraungitzea] [arrazoia]"
  short: "Kudeatu sare osoko G-lineak."
  help: |-
    Sare osoko G-lineak (debeku globalak) kudeatzen ditu.
    ADDek G-line berri bat gehitzen du maskara, iraungitze eta arrazoiarekin.
    DELek G-line bat kentzen du maskara edo sarrera zenbakiaren arabera.
    LISTek G-line guztiak erakusten ditu, aukeran maskararekin iragazita.

    Iraungitze formatua: 0=iraunkorra, edo erabili d, o, m atzizkia (adib., 7d, 12o,
    30m).
    Root edo IRCop erabiltzaileekin bat datozen GLINEak baztertzen dira.
    Komando honek operserv.gline baimena behar du.
  example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Spam gehiegikeria\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Etengabeko gehiegikeria\x03\x0F"
    - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
  unknown_sub: "\x0304✗\x03 Azpikomando ezezaguna \x02%sub%\x02. Erabili ADD, DEL edo LIST."
  invalid_mask: "\x0304✗\x03 Maskara formatu baliogabea. Formatua user@host izan behar du (adib., *@192.168.*)."
  global_mask: "\x0304✗\x03 \x02%mask%\x02 G-line maskara zabalegia da. Maskara globalak ez dira onartzen."
  dangerous_mask: "\x0304✗\x03 \x02%mask%\x02 G-line maskara zabalegia da. Ostalari zatiak gutxienez 4 karaktere alfanumeriko behar ditu."
  protected_user: "\x0304✗\x03 Ezin da babestutako \x02%nickname%\x02 erabiltzailea G-line bidez debekatu."
  invalid_expiry: "\x0304✗\x03 Iraungitze formatu baliogabea. Erabili 0 iraunkorrerako, edo balio bat nola 7d, 12o, 30m."
  already_exists: "\x0304✗\x03 \x02%mask%\x02 maskararen G-linea jada existitzen da."
  max_entries: "\x0304✗\x03 G-lineen gehieneko kopurua (%max%) iritsi da."
  not_found: "\x0304✗\x03 \x02%mask%\x02 G-linea ez da aurkitu."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <maskara> <iraungitzea> <arrazoia>"
    short: "Gehitu sare osoko G-line bat."
    help: |-
      Sare osoko G-line bat (debeku globala) gehitzen du.
      Maskarak user@host formatuan egon behar du.
      Iraungitzea: 0=iraunkorra, edo erabili d, o, m atzizkia (adib., 7d, 12o, 30m).
      Root edo IRCop erabiltzaileekin bat datozen GLINEak baztertzen dira.
      Komando honek operserv.gline baimena behar du.
    example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Spam gehiegikeria\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Etengabeko gehiegikeria\x03\x0F"
    done: "\x0303✓\x03 G-linea gehitu da: \x02%mask%\x02 (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL <maskara|zenbakia>"
    short: "Kendu G-line bat."
    help: |-
      G-line bat zerrendatik kentzen du.
      Maskara edo LISTeko sarrera zenbakia zehaztu dezakezu.
      Komando honek operserv.gline baimena behar du.
    example: "%command_prefix%\x02\x0303GLINE DEL *@192.168.1.*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE DEL 2\x03\x0F"
    done: "\x0303✓\x03 \x02%mask%\x02 G-linea kendu da."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [maskara]"
    short: "Zerrendatu G-line guztiak."
    help: |-
      G-line guztiak zerrendatzen ditu. Aukeran maskara ereduarekin iragazi.
      Komando honek operserv.gline baimena behar du.
    example: "%command_prefix%\x02\x0303GLINE LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
    header: "\x0307---\x03 \x02G-lineak (%count%) \x0307---\x03"
    empty: "Ez dago G-linearik."
    entry: "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, iraungitzea: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {zerbitzua|nick!ident@vhost} {PRIVMSG|NOTICE} <mezua>"
  short: "Bidali mezu global bat konektatutako erabiltzaile guztiei."
  help: |-
    Konektatutako erabiltzaile guztiei mezu bat bidaltzen die.

    Lehen argumentua zerbitzu izen bat bada, mezua existitzen den zerbitzu hori
    erabiliz bidaliko da.

    Zerbitzu bat ez bada, aldi baterako pseudo-bezero bat sortuko da
    zehaztutako maskararekin. Maskarak formatu honetan egon behar du:
    nick!ident@vhost
    - ezizena: IRC ezizen baliozkoa (letrak, []{}|\`, digituak, letraz hasten da)
    - ident: alfanumerikoa . _ ~ - karaktereekin
    - vhost: ostalari izen baliozkoa

    Pseudo-bezeroentzat, ezizena ezin da konektatuta edo erregistratuta egon.
    Pseudo-bezeroa konektatuta egongo da bidalketan zehar eta automatikoki
    deskonektatuko da (ezizena 24 orduz blokeatuko da SQLINE/QLINE bidez).

    PRIVMSGek mezu pribatu gisa bidaltzen du, NOTICEk ohar gisa.
    Komando honek operserv.global baimena behar du.
  example: "%command_prefix%\x02\x0303GLOBAL %operserv% PRIVMSG Mantentze-lanak 10 minutu barru\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLOBAL Avisos!oper@services.ares NOTICE Sarea berrabiaraziko da\x03\x0F"
  mask_invalid: "\x0304✗\x03 Maskara formatu baliogabea: %error%"
  nick_connected: "\x0304✗\x03 \x02%nickname%\x02 ezizena unean konektatuta dago."
  nick_registered: "\x0304✗\x03 \x02%nickname%\x02 ezizena erregistratuta dago."
  type_invalid: "\x0304✗\x03 Mezu motak PRIVMSG edo NOTICE izan behar du."
  done: "\x0303✓\x03 Mezu globala \x02%nickname%\x02-(e)tik bidali zaie %count% erabiltzaileri."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <lerroa>"
  short: "Bidali protokolo lerro gordin bat IRCd-ra."
  help: |-
    Emandako lerroa zuzenean goiko IRCd socket-era bidaltzen du.
    Muturreko kontuz erabili. Protokolo lerro baliogabeek sarea kraskatu dezakete.
    Komando honek operserv.raw baimena behar du.
  example: "%command_prefix%\x02\x0303RAW :services.ares NOTICE * :Programatutako mantentze-lanak\x03\x0F"
  empty: "\x0304✗\x03 Hutsik ez dagoen lerro bat zehaztu behar duzu bidaltzeko."
  too_long: "\x0304✗\x03 Lerroa luzeegia da. Gehienez 510 karaktere."
  not_connected: "\x0304✗\x03 Ez dago IRCd-ra konektatuta."
  done: "\x0303✓\x03 Lerro gordina bidali da."
  protocol:
    syntax: "\x0304✗\x03 Protokolo aktiboak RAW komandoaren sintaxia baztertu du."
    done: "\x0303✓\x03 Protokoloak kudeatutako RAW komandoa exekutatu da."
    target: "\x0304✗\x03 Protokolo aktiboak %target% helburua baztertu du."
    unsupported: "\x0304✗\x03 Protokolo aktiboak ez du RAW komando hau onartzen."
    invalid_resource_type: "\x0304✗\x03 Protokolo-baliabide mota ezezaguna: %resource_type%."
    invalid_resource: "\x0304✗\x03 Protokolo-baliabide baliogabea: %resource%."
    invalid_value: "\x0304✗\x03 Protokolo-baliabidearen balio baliogabea: %resource%."
    error: "\x0304✗\x03 Protokolo aktiboak ezin izan du RAW komandoa exekutatu."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator%(e)k GLOBAL komandoa exekutatzen du %target% ezizenarekin %type% bidez %count% erabiltzaileri. Mezua: %message%"
  prefix_message: "Mezua: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Kudeatu konexio MOTD mezuak, erabiltzaileei konektatzean bidaliak."
  syntax: "MOTD {ADD|DEL|LIST|CLEAN} [arg]"
  help: |-
    Kudeatu Eguneko Mezua sarrerak, erabiltzaileei sarera konektatzean bidaltzen
    zaizkienak.

  example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Azpikomando ezezaguna. Erabili: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {zerbitzua|nick!ident@vhost} {PRIVMSG|NOTICE} <iraungitzea> <mezua>"
    syntax_hint: "\x0304✗\x03 Erabilera: \x02%syntax%\x02"
    short: "Gehitu MOTD sarrera bat."
    help: |-
      MOTD mezu berri bat gehitzen du, erabiltzaile bakoitzari sarera konektatzean
      bidaliko zaiona.

    example: "%command_prefix%\x02\x0303MOTD ADD %operserv% NOTICE 24h Mantenimiento esta noche\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303MOTD ADD %operserv% PRIVMSG 0 Ongi etorri a la red\x03\x0F"
    done: "\x0303✓\x03 #%id% MOTD sarrera gehitu da."
    invalid_type: "\x0304✗\x03 Mezu mota baliogabea. \x02PRIVMSG\x02 edo \x02NOTICE\x02 izan behar du."
    invalid_expiry: "\x0304✗\x03 Iraungitze-formatu baliogabea. Erabili: \x02<zenbakia><s|m|h|d>\x02 edo \x020\x02 mugagabea izateko (adib., 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <ida>"
    syntax_hint: "\x0304✗\x03 Erabilera: \x02%syntax%\x02"
    short: "Ezabatu MOTD sarrera bat."
    help: |-
      MOTD sarrera bat ezabatzen du bere IDaren arabera.

    example: "%command_prefix%\x02\x0303MOTD DEL 12\x03\x0F"
    done: "\x0303✓\x03 #%id% MOTD sarrera ezabatu da."
    not_found: "\x0304✗\x03 MOTD sarrera ez da aurkitu."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Zerrendatu MOTD sarrera guztiak."
    help: |-
      Konfiguratutako MOTD sarrera guztiak zerrendatzen ditu.

    example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
    empty: "Ez dago MOTD sarrerarik konfiguratuta."
    header: "MOTD sarrerak:"
    status_enabled: "\x0303gaituta\x03"
    status_disabled: "\x0304desgaituta\x03"
    expired: "\x0304iraungia\x03"
    no_bot: "(botik ez)"
    shown_count: "%count% aldiz erakutsia"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Kendu iraungitako MOTD sarrera guztiak."
    help: |-
      Bere iraungitze denbora igaro den MOTD sarrera guztiak kentzen ditu.

    example: "%command_prefix%\x02\x0303MOTD CLEAN\x03\x0F"
    done: "\x0303✓\x03 %count% iraungitako MOTD sarrera kendu dira."
    none: "\x0303✓\x03 Ez dago kentzeko iraungitako MOTD sarrerarik."
  debug:
    finalized: "#%id% MOTD mezua amaitu da: [%type%] %message% | %date% | %shown_count%"

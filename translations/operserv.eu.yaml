# OperServ itzulpenak — Euskara
# Domeinua: operserv
#
# IRC formatu-kodeak (komatxo bikoitzak edo !irc bloke literalak):
#   \x02        letra lodia aktibatu/desaktibatu
#   \x03NN      kolorea (HAMARTARRA: 03=berdea, 04=gorria, 07=laranja, 14=gris iluna)
#   \x03        kolorea berrezarri
#   \x0F        formatu osoa berrezarri
#
# IRC koloreek zenbaki HAMARTARRAK (0-15) erabiltzen dituzte, ez hamaseitarrak.
#   \x0314 = gris iluna (14 hamartarra): ZUZENA
#   \x030F = 0 kolorea eta ondoren F letra: OKERRA
#
# Lerro anitzeko IRC testua: !irc |- benetako lerro-jauzi eta zuriuneekin.
# Etiketarik gabeko blokeek ez dituzte ihesak deskodetzen; gorde CTCP literalak.
# HELP adibideak: example/examples eta %command_prefix%.
# Aurkezleak kolorerik gabeko /msg eta bi zuriuneko marjina gehitzen ditu.

# --- ERROR --------------------------------------------------------------------
error:
  root_only: "Komando hau sareko root administratzaileentzat mugatuta dago."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [komandoa] [aukera]"
  short: "Zerrendatu komandoak edo erakutsi komando baten laguntza."
  help: |-
    Argumenturik gabe komando guztiak zerrendatzen ditu. Erabili %help_command%
    laguntza osorako, edo %help_option_command% azpi-aukertarako.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Sareko operadoreak eta haien baimenak kudeatzeko, sarbide-murrizketak
    aplikatzeko eta erabiltzaileak deskonektatzeko aukera ematen du. Sareko
    komunikatu orokorrak bidali eta ongietorri-mezuak ere kudea ditzake.
  general_header: "Komando erabilgarriak:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Aukerak:"
  examples_header: "Adibideak:"
  general_help_command: "HELP <komandoa>"
  option_help_command: "HELP %command% <aukera>"
  detail_help_command: "HELP <komandoa>"
  detail_help_option_command: "HELP <komandoa> <aukera>"
  general_footer: "Erabili /msg %bot% %help_command% informazio gehiago lortzeko."
  set_sub_footer: "Erabili /msg %bot% %help_command% informazio gehiago lortzeko."
  syntax_label: "Sintaxia: %syntax%"
  footer: ""
  intro_expiration: "OHARRA: %days% egun baino gehiagoz erabiltzen ez diren ezizenak automatikoki ezabatuko dira."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operadoreak eta rolak"
    network_security: "Sareko segurtasuna"
    communication: "Komunikazioa"
    low_level: "Behe-maila"
  ircop_header: "IRC operadoreentzako komando erabilgarriak:"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <ezizena> <rola>|DEL <ezizena>|LIST}"
  short: "Kudeatu sareko IRC operadoreak."
  help: |-
    Sareko IRC operadoreak kudeatzen ditu. ADDk ezizen erregistratu bat gehitzen du
    zehaztutako rolarekin operadore gisa.
    DELek operadore bat kentzen du. LISTek operadore guztiak erakusten ditu.
    Erabili ROLE LIST rolak ikusteko.
    Komando hau zerbitzuetan konfiguratutako Root erabiltzaileentzat mugatuta dago.
  example: "%command_prefix%IRCOP ADD Ane OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Azpikomando ezezaguna %sub%. Erabili ADD, DEL edo LIST."
  unknown_role: "%role% rola ez da existitzen. Erabili /msg %bot% %role_list% rolak ikusteko."
  already_admin: "%nickname% jada IRC operadorea da (rola: %role%)."
  not_admin: "%nickname% ez da IRC operadorea."
  role_changed: "%nickname%(r)en rola aldatu da: %old% → %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <ezizena> <rola>"
    short: "Gehitu sareko IRC operadore bat."
    help: |-
      Ezizen erregistratu bat sareko IRC operadore gisa gehitzen du.
      Erabili ROLE LIST rolak ikusteko.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%IRCOP ADD Ane OPER"
    done: "%nickname% %role% gisa gehitu da."
    nick_not_active: "%nickname% ezizena ez da ezizen erregistratu aktibo bat."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <ezizena>"
    short: "Kendu sareko IRC operadore bat."
    help: |-
      Sareko IRC operadore bat zerrendatik kentzen du.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%IRCOP DEL Ane"
    done: "%nickname% IRC operadoreetatik kendu da."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Zerrendatu sareko IRC operadore guztiak."
    help: |-
      Sareko IRC operadore guztiak bere rolekin eta erregistro datarekin zerrendatzen
      ditu.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%IRCOP LIST"
    header: "Sareko IRC Operadoreak"
    empty: "Ez dago IRC operadorerik."

# --- ROLE ---------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rola>|SET <rola> [operclass]}"
    short: "UnrealIRCd-eko operadore-klasea konfiguratzen du."
    help: |-
      Rol baten operclass-a kontsultatu eta konfiguratzen du.

      %options_header%
      %option_LIST%Sareko operclass erabilgarriak erakusten ditu.
      %option_VIEW%Rolaren operclass-a eta erabilgarriak erakusten ditu.
      %option_SET%IRCOPei identifikatzean operclass-a esleitzen die.

      Utzi balioa hutsik kentzeko.

      UnrealIRCd protokoloetan soilik dago erabilgarri.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW LAGUNTZA"
      - "%command_prefix%ROLE OPERCLASS SET LAGUNTZA services-admin"
      - "%command_prefix%ROLE OPERCLASS SET LAGUNTZA"
    list:
      header: "Sarean Erabilgarri Dauden Operclass-ak"
      empty: "Ez dago operclass-ik erabilgarri sarean."
      not_supported: "Uneko protokoloak ez du onartzen erabilgarri dauden operclass-ak zerrendatzea."
    view:
      empty: "%role% rolak ez du operclass-ik."
      line: "Operclass: %operclass%"
      available: "Erabilgarri dauden operclass-ak: %available%"
    set:
      done: "Operclass-a ezarri zaio %role% rolari."
      cleared: "Operclass-a kendu zaio %role% rolari."
      not_available: "%operclass% operclass ez dago erabilgarri sarean. Erabilgarri daudenak: %available%."
  syntax: "ROLE {ADD <izena> [deskribapena]|DEL <izena>|LIST|PERMS {{ADD|DEL} <rola> <baimena>|{LIST|CLEAR} <rola>}|MODES {VIEW <rola>|SET <rola> [moduak]}|VHOST {VIEW <rola>|SET <rola> [vhost]}}"
  short: "Kudeatu operadore rolak."
  help: |-
    Operadore rolak kudeatzen ditu. ADDek rol berri bat sortzen du, DELek kentzen
    du,
    LISTek rol guztiak erakusten ditu, PERMSek rol baten baimenak kudeatzen ditu,
    MODESek IRCOP moduak kudeatzen ditu,
    VHOSTek rol baten behartutako vhost eredua kudeatzen du.
    Babestutako rolak (ADMIN, OPER, PREOPER) ezin dira ezabatu.
    Komando hau Root erabiltzaileentzat mugatuta dago.
  syntax_operclass: "ROLE {ADD <izena> [deskribapena]|DEL <izena>|LIST|PERMS {{ADD|DEL} <rola> <baimena>|{LIST|CLEAR} <rola>}|MODES {VIEW <rola>|SET <rola> [moduak]}|VHOST {VIEW <rola>|SET <rola> [vhost]}|OPERCLASS {LIST|VIEW <izena>|SET <izena> [operclass]}}"
  help_operclass: |-
    Operadore rolak kudeatzen ditu. ADDek rol berri bat sortzen du, DELek kentzen du,
    LISTek rol guztiak erakusten ditu, PERMSek rol baten baimenak kudeatzen ditu, MODESek IRCOP moduak kudeatzen ditu,
    VHOSTek rol baten behartutako vhost eredua kudeatzen du, OPERCLASSek Unreal operclass kudeatzen du.
    Babestutako rolak (ADMIN, OPER, PREOPER) ezin dira ezabatu.
    Komando hau Root erabiltzaileentzat mugatuta dago.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD LAGUNTZA Laguntza-operadoreak"
  unknown_sub: "Azpikomando ezezaguna %sub%. Erabili ADD, DEL, LIST, PERMS, MODES edo VHOST."
  unknown_sub_operclass: "Azpikomando ezezaguna %sub%. Erabili ADD, DEL, LIST, PERMS, MODES, VHOST edo OPERCLASS."
  not_found: "%role% rola ez da existitzen."
  already_exists: "%role% rola jada existitzen da."
  protected: "%role% rola babestuta dago eta ezin da ezabatu."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <izena> [deskribapena]"
    short: "Sortu rol berri bat."
    help: |-
      Rol pertsonalizatu berri bat sortzen du. Deskribapena aukerakoa da.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%ROLE ADD LAGUNTZA Laguntza-operadoreak"
    done: "%role% rola sortu da."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <izena>"
    short: "Ezabatu rol bat."
    help: |-
      Rol pertsonalizatu bat ezabatzen du. Babestutako rolak (ADMIN, OPER, PREOPER)
      ezin dira ezabatu. Rolak operadoreak esleituta baditu,
      lehenik berresleitu behar dituzu.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%ROLE DEL LAGUNTZA"
    done: "%role% rola ezabatu da."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Zerrendatu rol guztiak."
    help: |-
      Rol guztiak zerrendatzen ditu. Babestutako rolak [PROTECTED] markarekin daude.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%ROLE LIST"
    header: "Operadore Rolak"
    empty: "Ez dago operadore rolik."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rola> <baimena>|{LIST|CLEAR} <rola>}"
    short: "Kudeatu rol baten baimenak."
    help: |-
      Rol bati esleitutako baimenak kudeatzen ditu.

      %options_header%
      %option_LIST%Rolaren baimen guztiak erakusten ditu.
      %option_ADD%Baimen bat esleitzen dio rolari.
      %option_DEL%Baimen bat kentzen dio rolari (ez babestutako roletarako).
      %option_CLEAR%Rolaren baimen guztiak kentzen ditu.

      Erabili ALL eskuragarri dauden baimen guztiak batera gehitzeko.
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%ROLE PERMS LIST LAGUNTZA"
    examples:
      - "%command_prefix%ROLE PERMS ADD LAGUNTZA operserv.gline"
      - "%command_prefix%ROLE PERMS ADD LAGUNTZA ALL"
      - "%command_prefix%ROLE PERMS DEL LAGUNTZA operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR LAGUNTZA"
    not_found: "%perm% baimena ez da existitzen."
    already_has: "%role% rolak jada %perm% baimena du."
    does_not_have: "%role% rolak ez du %perm% baimenik."
    list:
      header: "%role% rolaren baimen-zerrenda"
      columns: "Esleituta | Baimen-gakoa | Deskribapena"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "%perm% baimena gehitu zaio %role% rolari."
      all_done: "%count% baimen gehitu zaizkio %role% rolari."
    del:
      done: "%perm% baimena kendu zaio %role% rolari."
    clear:
      done: "%count% baimen kendu zaizkio %role% rolari."
      empty: "%role% rolak ez du baimenik esleituta."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rola>|SET <rola> [moduak]}"
    short: "Kudeatu rolerako IRCOP erabiltzaile moduak."
    help: |-
      Rol bati esleitutako IRCOP erabiltzaile-moduak kudeatzen ditu.

      %options_header%
      %option_VIEW%Rolaren uneko moduak erakusten ditu.
      %option_SET%IRCOP moduak ezartzen ditu.

      Utzi moduak hutsik guztiak kentzeko.

      Rol hau duten erabiltzaileek identifikatzean jasoko dituzte moduak.
      IRCd bakoitzeko moduak
      Komando hau Root erabiltzaileentzat mugatuta dago.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "%role% rolaren moduak"
      empty: "%role% rolak ez du modurik esleituta."
      line: "Moduak: %modes%"
    set:
      done: "%modes% moduak ezarri dira %role% rolerako."
      cleared: "%role% rolaren modu guztiak kendu dira."
      invalid_mode: "%mode% modua ez da IRCOP modu baliozkoa."
      invalid_modes: "Modu baliogabeak: %invalid%. Modu baliozkoak: %valid%."
      no_irc_user_modes: "Uneko IRCdk ez du IRCOP modurik konfiguratuta."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rola>|SET <rola> [vhost]}"
    short: "Kudeatu rol baten behartutako vhost eredua."
    help: |-
      Rol bateko operadoreei identifikatzean ematen zaien ostalari birtuala
      konfiguratzen du, haien ostalari pertsonala ordeztuz.

      Ostalaria ezizena karaktere berezirik gabe eta konfiguratutako ereduaz
      batuz sortzen da. Adibidez:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Rol baten eredua erakusten du.
      %option_SET%Rol baten eredua ezarri edo kentzen du.

      Ereduak letrak, zenbakiak, marratxoak eta puntuak soilik onartzen ditu.
      Gutxienez puntu bat behar du; ezin da marratxo edo puntuz hasi/amaitu,
      ezin ditu jarraian dauden puntuak izan.

      Erabili SET eredurik gabe behartutako host-a kentzeko.

      Root erabiltzaileentzat soilik.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "%role% rolaren behartutako vhost-a"
      empty: "%role% rolak ez du behartutako vhost eredurik ezarrita."
      line: "Eredua: %pattern%"
      example: "Adibidea: %example_nickname%.%pattern%"
      example_nickname: "ezizena"
    set:
      done: "%role% rolerako behartutako vhost eredua ezarri da."
      cleared: "%role% rolaren behartutako vhost eredua kendu da."
      invalid: "Vhost eredu baliogabea. Karaktere baliozkoak: a-z, A-Z, 0-9, - eta .. Gutxienez puntu bat eduki behar du, ezin da - edo .-z hasi/amaitu ezta .. eduki ere."

# --- KILL ---------------------------------------------------------------------
kill:
  syntax: "KILL <ezizena> <arrazoia>"
  short: "Behartu erabiltzaile bat saretik deskonektatzera."
  help: |-
    Erabiltzaile bat IRC saretik deskonektatzen du.
    IRCop-ak eta Root erabiltzaileak ezin dira kill bidez deskonektatu.
    Komando honek operserv.kill baimena behar du.

    Sintaxia: KILL <ezizena> <arrazoia>
    Adibidea: KILL ErabiltzaileGaiztoa Flood egiten kanaletan
  example: "%command_prefix%KILL BadUser Flooding en canales"
  protected_root: "Ezin da Root erabiltzaile %nickname% kill bidez deskonektatu."
  protected_ircop: "Ezin da IRC operadore %nickname% kill bidez deskonektatu."
  done: "%nickname% erabiltzailea kill bidez deskonektatu da (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <maskara> <iraungitzea> <arrazoia>|DEL {<maskara>|<zenbakia>}|LIST [maskara]}"
  short: "Kudeatu sare osoko G-lineak."
  help: |-
    Sare osoko G-lineak (debeku globalak) kudeatzen ditu.
    ADDek G-line berri bat gehitzen du maskara, iraungitze eta arrazoiarekin.
    DELek G-line bat kentzen du maskara edo sarrera zenbakiaren arabera.
    LISTek G-line guztiak erakusten ditu, aukeran maskararekin iragazita.

    Iraungitze formatua: 0=iraunkorra, edo erabili d, o, m atzizkia (adib., 7d, 12o,
    30m).
    Root edo IRCop erabiltzaileekin bat datozen GLINEak baztertzen dira.
    Komando honek operserv.gline baimena behar du.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spam gehiegikeria"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Etengabeko gehiegikeria"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Azpikomando ezezaguna %sub%. Erabili ADD, DEL edo LIST."
  invalid_mask: "Maskara formatu baliogabea. Formatua user@host izan behar du (adib., *@192.168.*)."
  global_mask: "%mask% G-line maskara zabalegia da. Maskara globalak ez dira onartzen."
  dangerous_mask: "%mask% G-line maskara zabalegia da. Ostalari zatiak gutxienez 4 karaktere alfanumeriko behar ditu."
  protected_user: "Ezin da babestutako %nickname% erabiltzailea G-line bidez debekatu."
  invalid_expiry: "Iraungitze formatu baliogabea. Erabili 0 iraunkorrerako, edo balio bat nola 7d, 12o, 30m."
  already_exists: "%mask% maskararen G-linea jada existitzen da."
  max_entries: "G-lineen gehieneko kopurua (%max%) iritsi da."
  not_found: "%mask% G-linea ez da aurkitu."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <maskara> <iraungitzea> <arrazoia>"
    short: "Gehitu sare osoko G-line bat."
    help: |-
      Sare osoko G-line bat (debeku globala) gehitzen du.
      Maskarak user@host formatuan egon behar du.
      Iraungitzea: 0=iraunkorra, edo erabili d, o, m atzizkia (adib., 7d, 12o, 30m).
      Root edo IRCop erabiltzaileekin bat datozen GLINEak baztertzen dira.
      Komando honek operserv.gline baimena behar du.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Spam gehiegikeria"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Etengabeko gehiegikeria"
    done: "G-linea gehitu da: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<maskara>|<zenbakia>}"
    short: "Kendu G-line bat."
    help: |-
      G-line bat zerrendatik kentzen du.
      Maskara edo LISTeko sarrera zenbakia zehaztu dezakezu.
      Komando honek operserv.gline baimena behar du.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "%mask% G-linea kendu da."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [maskara]"
    short: "Zerrendatu G-line guztiak."
    help: |-
      G-line guztiak zerrendatzen ditu. Aukeran maskara ereduarekin iragazi.
      Komando honek operserv.gline baimena behar du.
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-lineak (%count%)"
    empty: "Ez dago G-linearik."
    entry: "%index%. %mask% - %reason% (%nickname%, iraungitzea: %expiration%)"

# --- BADMAIL ------------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <domeinua> <arrazoia>|DEL {zenbakia|ALL}|LIST <eredua> [orria]}"
  short: "Blokeatutako posta-domeinuak kudeatu."
  help: |-
    Blokeatutako posta-domeinuak kudeatu.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <domeinua> <arrazoia>"
    short: "Domeinu bat blokeatu."
    help: |-
      ASCII edo punycode domeinuak onartzen ditu, ez helbideak edo ereduak.
      Arrazoia derrigorrezkoa da. Blokeoa zehatza da eta ez ditu
      azpidomeinuak hartzen.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {zenbakia|ALL}"
    short: "Domeinuen blokeoak kendu."
    help: |-
      Ezabatu identifikatzaile iraunkor bat edo sarrera guztiak ALL
      erabiliz. Beste identifikatzaileak ez dira aldatzen.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <eredua> [orria]"
    short: "Blokeatutako domeinuak zerrendatu."
    help: |-
      Eredua derrigorrezkoa da. * da komodin bakarra eta edozein
      sekuentziarekin bat dator. Ez ditu maiuskulak bereizten. Aukerako
      orria 1ean hasten da. Identifikatzaileak mantentzen dira iragaztean
      eta orrialdekatzean.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Domeinu baliogabea. Erabili ASCII edo punycode, amaierako punturik gabe."
  invalid_reason: "Lerro bakarreko administrazio-arrazoi ez hutsa behar da."
  duplicate: "Domeinu hau dagoeneko blokeatuta dago."
  not_found: "Ez dago identifikatzaile hori duen domeinu blokeaturik."
  added: "%domain% domeinua blokeatu da."
  deleted: "%id% domeinu-blokeoa kendu da."
  cleared: "%total% domeinu-blokeo kendu dira."
  empty: "Ez dago bat datorren domeinu blokeaturik."
  header: "ID | Domeinua | Arrazoia"
  page: "%page%/%pages% orria, bat datozen %total% domeinu."
  row: "%id% | %domain% | %reason%"

# --- GLOBAL -------------------------------------------------------------------
global:
  syntax: "GLOBAL {zerbitzua|nick!ident@vhost} {PRIVMSG|NOTICE} <mezua>"
  short: "Bidali mezu global bat konektatutako erabiltzaile guztiei."
  help: |-
    Konektatutako erabiltzaile guztiei mezu bat bidaltzen die.

    Lehen argumentua zerbitzu izen bat bada, mezua existitzen den zerbitzu hori
    erabiliz bidaliko da.

    Zerbitzu bat ez bada, aldi baterako pseudo-bezero bat sortuko da
    zehaztutako maskararekin. Maskarak formatu honetan egon behar du:
    nick!ident@vhost
    - ezizena: IRC ezizen baliozkoa (letrak, []{}|\`, digituak, letraz hasten da)
    - ident: alfanumerikoa . _ ~ - karaktereekin
    - vhost: ostalari izen baliozkoa

    Pseudo-bezeroentzat, ezizena ezin da konektatuta edo erregistratuta egon.
    Pseudo-bezeroa konektatuta egongo da bidalketan zehar eta automatikoki
    deskonektatuko da (ezizena 24 orduz blokeatuko da SQLINE/QLINE bidez).

    PRIVMSGek mezu pribatu gisa bidaltzen du, NOTICEk ohar gisa.
    Komando honek operserv.global baimena behar du.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Mantentze-lanak 10 minutu barru"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE Sarea berrabiaraziko da"
  mask_invalid: "Maskara formatu baliogabea: %error%"
  nick_connected: "%nickname% ezizena unean konektatuta dago."
  nick_registered: "%nickname% ezizena erregistratuta dago."
  type_invalid: "Mezu motak PRIVMSG edo NOTICE izan behar du."
  done: "Mezu globala %nickname%-(e)tik bidali zaie %count% erabiltzaileri."

# --- MOTD ---------------------------------------------------------------------
motd:
  short: "Kudeatu konexio MOTD mezuak, erabiltzaileei konektatzean bidaliak."
  syntax: "MOTD {ADD <helburua> {PRIVMSG|NOTICE} <iraungitzea> <mezua>|DEL <id>|LIST|CLEAN}"
  help: |-
    Kudeatu Eguneko Mezua sarrerak, erabiltzaileei sarera konektatzean bidaltzen
    zaizkienak.

  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Azpikomando ezezaguna. Erabili: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {zerbitzua|nick!ident@vhost} {PRIVMSG|NOTICE} <iraungitzea> <mezua>"
    syntax_hint: "Erabilera: %syntax%"
    short: "Gehitu MOTD sarrera bat."
    help: |-
      MOTD mezu berri bat gehitzen du, erabiltzaile bakoitzari sarera konektatzean
      bidaliko zaiona.

    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Mantenimiento esta noche"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Ongi etorri a la red"
    done: "#%id% MOTD sarrera gehitu da."
    invalid_type: "Mezu mota baliogabea. PRIVMSG edo NOTICE izan behar du."
    invalid_expiry: "Iraungitze-formatu baliogabea. Erabili: <zenbakia><s|m|h|d> edo 0 mugagabea izateko (adib., 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <ida>"
    syntax_hint: "Erabilera: %syntax%"
    short: "Ezabatu MOTD sarrera bat."
    help: |-
      MOTD sarrera bat ezabatzen du bere IDaren arabera.

    example: "%command_prefix%MOTD DEL 12"
    done: "#%id% MOTD sarrera ezabatu da."
    not_found: "MOTD sarrera ez da aurkitu."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Zerrendatu MOTD sarrera guztiak."
    help: |-
      Konfiguratutako MOTD sarrera guztiak zerrendatzen ditu.

    example: "%command_prefix%MOTD LIST"
    empty: "Ez dago MOTD sarrerarik konfiguratuta."
    header: "MOTD sarrerak:"
    status_enabled: "gaituta"
    status_disabled: "desgaituta"
    expired: "iraungia"
    no_bot: "(botik ez)"
    shown_count: "%count% aldiz erakutsia"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Kendu iraungitako MOTD sarrera guztiak."
    help: |-
      Bere iraungitze denbora igaro den MOTD sarrera guztiak kentzen ditu.

    example: "%command_prefix%MOTD CLEAN"
    done: "%count% iraungitako MOTD sarrera kendu dira."
    none: "Ez dago kentzeko iraungitako MOTD sarrerarik."
  debug:
    finalized: "#%id% MOTD mezua amaitu da: [%type%] %message% | %date% | %shown_count%"

# --- RAW ----------------------------------------------------------------------
raw:
  syntax: "RAW <lerroa>"
  short: "Bidali protokolo lerro gordin bat IRCd-ra."
  help: |-
    Emandako lerroa zuzenean goiko IRCd socket-era bidaltzen du.
    Muturreko kontuz erabili. Protokolo lerro baliogabeek sarea kraskatu dezakete.
    Komando honek operserv.raw baimena behar du.
  example: "%command_prefix%RAW :services.ares NOTICE * :Programatutako mantentze-lanak"
  empty: "Hutsik ez dagoen lerro bat zehaztu behar duzu bidaltzeko."
  too_long: "Lerroa luzeegia da. Gehienez 510 karaktere."
  not_connected: "Ez dago IRCd-ra konektatuta."
  done: "Lerro gordina bidali da."
  protocol:
    syntax: "Protokolo aktiboak RAW komandoaren sintaxia baztertu du."
    done: "Protokoloak kudeatutako RAW komandoa exekutatu da."
    target: "Protokolo aktiboak %target% helburua baztertu du."
    unsupported: "Protokolo aktiboak ez du RAW komando hau onartzen."
    invalid_resource_type: "Protokolo-baliabide mota ezezaguna: %resource_type%."
    invalid_resource: "Protokolo-baliabide baliogabea: %resource%."
    invalid_value: "Protokolo-baliabidearen balio baliogabea: %resource%."
    error: "Protokolo aktiboak ezin izan du RAW komandoa exekutatu."

# --- DEBUG --------------------------------------------------------------------
debug:
  action_global: "%operator%(e)k GLOBAL komandoa exekutatzen du %target% ezizenarekin %type% bidez %count% erabiltzaileri. Mezua: %message%"
  prefix_message: "Mezua: %reason%"

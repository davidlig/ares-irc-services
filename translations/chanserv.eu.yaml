    syntax: "SET <#kanala> FOUNDER <ezizena> [tokena]"
    example: "%command_prefix%SET #kanala FOUNDER Ane"
    examples:
      - "%command_prefix%SET #kanala FOUNDER Ane token-berretsia"
    short: "Transferitu kanala beste ezizen erregistratu batera."
    help: |-
      Uneko sortzailearen tokena balioztatu ondoren sortzailea aldatzen du.
      Sortzaile-mailako administrazio-salbuespena mantentzen da. Tokena ez da
      kontsumitzen.
    invalid_token: "Erreskate-tokena baliogabea da."
    updated: "Sortzailea %nickname%(e)ra aldatu da."
    throttled: "Token oker gehiegi. Saiatu berriro %minutes% minutu barru."
    must_be_registered: "%nickname% erregistratuta eta aktibatuta egon behar da."
    suspended: "%nickname% etenda dago eta ezin da sortzaile gisa ezarri."
    cannot_be_self: "Sortzaile berria ezin da egungo sortzailea izan."
    cannot_be_successor: "Sortzaile berria ezin da kanalaren ondorengoa izan."
    limit_exceeded: "%nickname% erregistratutako kanalen gehieneko kopurura iritsi da: %max%."
    notice_channel: "%from%(e)k %nickname% ezartzen du kanal sortzaile gisa."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#kanala> SUCCESSOR [ezizena]"
    example: "%command_prefix%SET #kanala SUCCESSOR Ane"
    examples:
      - "%command_prefix%SET #kanala SUCCESSOR"
    short: "Ezarri kanalaren ondorengoa."
    help: |-
      Ezizen bat kanalaren ondorengo gisa ezartzen du. Ezizenik ez emanez gero,
      ungokoa ezabatzen du. Ezizenak erregistratuta eta aktibatuta egon behar du.
    cleared: "Ondorengoa garbitu da."
    updated: "Ondorengoa %nickname% gisa ezarri da."
    must_be_registered: "%nickname% erregistratuta eta aktibatuta egon behar da."
    suspended: "%nickname% etenda dago eta ezin da ondorengo gisa ezarri."
    cannot_be_founder: "Sortzailea ezin da ondorengo gisa ezarri."
    notice_channel: "%from%(e)k %nickname% ezartzen du kanal ondorengo gisa."
    notice_channel_cleared: "%from%(e)k kanalaren ondorengoa garbitu du."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#kanala> DESC <deskribapena>"
    example: "%command_prefix%SET #kanala DESC Komunitate-kanala"
    short: "Aldatu kanalaren deskribapena."
    help: "Aldatu kanalaren deskribapena (derrigorrezkoa)."
    updated: "Deskribapena eguneratu da."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#kanala> URL [urla]"
    example: "%command_prefix%SET #kanala URL https://example.test"
    examples:
      - "%command_prefix%SET #kanala URL"
    short: "Ezarri kanalaren URLa."
    help: "Kanalaren web-helbidea (URLa) aldatzen du. Utzi URLa hutsik ezabatzeko."
    updated: "URLa eguneratu da."
    cleared: "URLa garbitu da."

  # --- SET EMAIL -----------------------------------------------------------

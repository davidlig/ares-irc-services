    - "%command_prefix%SET #kanala MLOCK ON"
  short: "Aldatu kanalaren aukerak."
  help: |-
    Kanalaren aukera bat aldatzen du. Aukera bakoitzaren laguntzak haren
    baldintzak eta aldaerak azaltzen ditu.
  unknown_option: "Aukera ezezaguna %option%. Erabili hauetako bat: %options%."


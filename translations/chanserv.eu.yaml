# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#kanala> {ADD|DEL|LIST} [maskara] [iraungitzea] [arrazoia]"
  example: "%command_prefix%\x02\x0303AKICK #kanala ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #kanala ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanala DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanala DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanala LIST\x03\x0F"
  short: "Kudeatu auto-kick zerrenda."
  help: "Auto-kick sarrerak eta haien aukerako iraungitzea kudeatzen ditu."
  unknown_sub: "\x0304✗\x03 Azpikomando ezezaguna \x02%sub%\x02. Erabili ADD, DEL edo LIST."
  invalid_mask: "\x0304✗\x03 Maskara formatu baliogabea. Erabili \x02nick!ident@host\x02 komodinak erabiliz (*)."
  dangerous_mask: "\x0304✗\x03 \x02%mask%\x02 maskara zabalegia da. Gutxienez 4 karaktere alfanumeriko eduki behar ditu."
  protected_user: "\x0304✗\x03 \x02%nickname%\x02 ezizenak sarbidea du kanal honetan."
  max_entries: "\x0304✗\x03 Gehienez %max% AKICK sarrera kanal bakoitzeko."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#kanala> ADD <maskara> [iraungitzea] [arrazoia]"
    example: "%command_prefix%\x02\x0303AKICK #kanala ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #kanala ADD *!*@* 7d Spam\x03\x0F"
    short: "Gehitu AKICK sarrera."
    help: |-
      Kanalaren auto-kick zerrendara maskara bat gehitzen du.

      Iraupena eta arrazoia zehaztu ditzakezu. Arrazoia emanez gero, iraupena ere
      zehaztu behar da: 0 iraunkorra izateko, d egunetarako, h orduetarako edo
      m minutuetarako.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 gehitu da."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 jada existitzen da."
    notice_channel: "\x02%from%\x02(e)k AKICK gehitzen du: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#kanala> DEL <maskara|zenbakia>"
    example: "%command_prefix%\x02\x0303AKICK #kanala DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #kanala DEL 2\x03\x0F"
    short: "Kendu AKICK sarrera."
    help: "Kendu maskara zehatzaren edo LISTeko sarrera zenbakiaren arabera."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 ez da aurkitu."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 kendu da."
    notice_channel: "\x02%from%\x02(e)k AKICK kentzen du: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#kanala> LIST"
    example: "%command_prefix%\x02\x0303AKICK #kanala LIST\x03\x0F"
    short: "Zerrendatu AKICK sarrerak."
    help: "Maskara, arrazoia, iraungitzea eta nork gehitu zuen erakusten ditu."
    header: "\x0303\x02%channel%\x02 kanalaren AKICK zerrenda\x03"
    empty: "\x0307ℹ\x03 \x02%channel%\x02 kanalak ez du AKICK sarrerarik."
    entry: "  #%index% %mask% %reason% (%nickname%-(e)k gehituta, iraungitzea: %expiration%)"


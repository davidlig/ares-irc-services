    FORCE aukerak ezabatzeko zain dagoen kanala behin betiko ezabatzen du.
    DROP baimena duen IRCop batek zain dauden eta ukatutako erregistro-eskaerak
    berehala askatu ditzake, FORCE erabilita edo gabe.

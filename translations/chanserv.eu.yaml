  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
  short: "Zerrendatu komandoak edo erakutsi komando baten laguntza."
  help: "Eskuragarri dauden komandoak eta haien aukeren laguntza zehatza erakusten ditu."
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Kanalak erregistratzeko eta kudeatzeko aukera ematen du: ezarpenak
    konfiguratu, sarbidea kontrolatu eta erabiltzaileen sarbide-mailak eta
    pribilegioak kudeatu, arduradunek kanalen kontrola izan dezaten.
  general_header: "\x02 ■ Komando erabilgarriak:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Aukerak:\x02"
  general_footer: "\x0310ℹ\x03\x0F Erabili /msg %bot% \x02\x0303HELP <komandoa>\x03\x0F informazio gehiago lortzeko."
  set_sub_footer: "\x0310ℹ\x03\x0F Erabili /msg %bot% \x02\x0303HELP %command% <aukera>\x03\x0F informazio gehiago lortzeko."
  syntax_label: "Sintaxia: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0304⚠\x03\x0F OHARRA: \x1F\x0304%days% egun\x03\x1F baino gehiagoz erabiltzen ez diren kanalak automatikoki ezabatuko dira."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_info: "Erregistroa eta informazioa"
    access_levels: "Sarbidea eta mailak"
    ranks_entry: "Mailak eta sarrera"
  ircop_group:
    channel_operations: "Kanaleko eragiketak"
    channel_management: "Kanalaren kudeaketa"
    deletion: "Ezabaketa eta leheneratzea"
    restrictions: "Murrizketak"
    lookup: "Bilaketa eta ikerketa"
  ircop_header: "\x02 ■ IRC operadoreentzako komando erabilgarriak:\x02"

# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#kanala> <ezizena>"
  example: "%command_prefix%\x02\x0303OP #kanala Ane\x03\x0F"
  short: "Eman kanal operadore modua."
  help: "Eman kanal operadore modua."
  done: "\x0303✔\x03 \x02%nickname%\x02(r)i kanal operadore estatusa eman zaio."
  user_not_on_channel: "\x0304✗\x03 \x02%nickname%\x02 ezizena ez dago sarean."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03(e)k \x0304%mode%\x03 ematen dio \x0314%to%\x03(r)i"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#kanala> <ezizena>"
  example: "%command_prefix%\x02\x0303DEOP #kanala Ane\x03\x0F"
  short: "Kendu kanal operadore modua."
  help: "Kendu kanal operadore modua."
  done: "\x0303✔\x03 \x02%nickname%\x02(r)i operadore modua kendu zaio."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 SECURE aktiboarekin, \x02%nickname%\x02(e)k gutxienez \x02%level%\x02 maila eduki behar du \x02%mode%\x02 jasotzeko."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#kanala> <aukera> [balioa]"
  example: "%command_prefix%\x02\x0303SET #kanala DESC Komunitate-kanala\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #kanala URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #kanala MLOCK ON\x03\x0F"
  short: "Aldatu kanalaren aukerak."
  help: |-
    Kanalaren aukera bat aldatzen du. Aukera bakoitzaren laguntzak haren
    baldintzak eta aldaerak azaltzen ditu.
  unknown_option: "\x0304✗\x03 Aukera ezezaguna \x02%option%\x02. Erabili hauetako bat: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Erabili SET <#kanala> FOUNDER <ezizena> <token> egungo sortzailearen token berretsiarekin."
    token_unavailable: "Egungo sortzaileak ez du erreskate-token berretsirik. Lehenik autentifikatu eta VERIFY erabili behar du."
    syntax: "SET <#kanala> FOUNDER <ezizena> [tokena]"
    example: "%command_prefix%\x02\x0303SET #kanala FOUNDER Ane\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanala FOUNDER Ane token-berretsia\x03\x0F"
    short: "Transferitu kanala beste ezizen erregistratu batera."
    help: |-
      Uneko sortzailearen tokena balioztatu ondoren sortzailea aldatzen du.
      Sortzaile-mailako administrazio-salbuespena mantentzen da. Tokena ez da
      kontsumitzen.
    invalid_token: "Erreskate-tokena baliogabea da."
    updated: "\x0303✔\x03 Sortzailea \x02%nickname%\x02(e)ra aldatu da."
    throttled: "Token oker gehiegi. Saiatu berriro %minutes% minutu barru."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 erregistratuta eta aktibatuta egon behar da."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 etenda dago eta ezin da sortzaile gisa ezarri."
    cannot_be_self: "\x0304✗\x03 Sortzaile berria ezin da egungo sortzailea izan."
    cannot_be_successor: "\x0304✗\x03 Sortzaile berria ezin da kanalaren ondorengoa izan."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 erregistratutako kanalen gehieneko kopurura iritsi da: %max%."
    notice_channel: "\x02%from%\x02(e)k \x02%nickname%\x02 ezartzen du kanal sortzaile gisa."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#kanala> SUCCESSOR [ezizena]"
    example: "%command_prefix%\x02\x0303SET #kanala SUCCESSOR Ane\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanala SUCCESSOR\x03\x0F"
    short: "Ezarri kanalaren ondorengoa."
    help: |-
      Ezizen bat kanalaren ondorengo gisa ezartzen du. Ezizenik ez emanez gero,
      ungokoa ezabatzen du. Ezizenak erregistratuta eta aktibatuta egon behar du.
    cleared: "\x0303✔\x03 Ondorengoa garbitu da."
    updated: "\x0303✔\x03 Ondorengoa \x02%nickname%\x02 gisa ezarri da."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 erregistratuta eta aktibatuta egon behar da."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 etenda dago eta ezin da ondorengo gisa ezarri."
    cannot_be_founder: "\x0304✗\x03 Sortzailea ezin da ondorengo gisa ezarri."
    notice_channel: "\x02%from%\x02(e)k \x02%nickname%\x02 ezartzen du kanal ondorengo gisa."
    notice_channel_cleared: "\x02%from%\x02(e)k kanalaren ondorengoa garbitu du."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#kanala> DESC <deskribapena>"
    example: "%command_prefix%\x02\x0303SET #kanala DESC Komunitate-kanala\x03\x0F"
    short: "Aldatu kanalaren deskribapena."
    help: "Aldatu kanalaren deskribapena (derrigorrezkoa)."
    updated: "\x0303✔\x03 Deskribapena eguneratu da."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#kanala> URL [urla]"
    example: "%command_prefix%\x02\x0303SET #kanala URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanala URL\x03\x0F"
    short: "Ezarri kanalaren URLa."
    help: "Kanalaren web-helbidea (URLa) aldatzen du. Utzi URLa hutsik ezabatzeko."
    updated: "\x0303✔\x03 URLa eguneratu da."
    cleared: "\x0303✔\x03 URLa garbitu da."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#kanala> EMAIL [posta]"
    example: "%command_prefix%\x02\x0303SET #kanala EMAIL talde@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanala EMAIL\x03\x0F"
    short: "Ezarri kanalaren posta elektronikoa."
    help: |-
      Kanalaren posta-helbidea aldatzen du. Utzi posta hutsik ezabatzeko.
      Administrazioak blokeatutako posta-domeinuak ez dira onartzen.
      Administrazio-salbuespena: sortzaile-mailako sarbidea duten
      operadoreak.
    invalid: "\x0304✗\x03 Helbide elektroniko baliogabea."
    updated: "\x0303✔\x03 Posta eguneratu da."
    cleared: "\x0303✔\x03 Posta garbitu da."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#kanala> ENTRYMSG [mezua]"
    example: "%command_prefix%\x02\x0303SET #kanala ENTRYMSG Ongi etorri\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanala ENTRYMSG\x03\x0F"
    short: "Ezarri kanalaren sarrera mezua."
    help: "Sarrera-mezua (NOTICE) ezartzen du. Utzi mezua hutsik ezabatzeko."
    updated: "\x0303✔\x03 Sarrera mezua eguneratu da."
    too_long: "\x0304✗\x03 Sarrera mezuak ezin du %max% karaktere baino gehiago izan."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#kanala> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanala TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanala TOPICLOCK OFF\x03\x0F"
    short: "Blokeatu kanalaren gaia."
    help: "Kanaleko gaia aldatzea blokeatzen du. Aktibatzean, uneko gaia ezartzen du."
    on: "\x0303✔\x03 Gaiaren blokeoa orain ON dago."
    off: "\x0303✔\x03 Gaiaren blokeoa orain OFF dago."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03(e)k TOPICLOCK gaitzen du."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03(e)k TOPICLOCK desgaitzen du."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#kanala> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanala MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanala MLOCK OFF\x03\x0F"
    short: "Blokeatu kanalaren moduak."
    help: |-
      Uneko kanal moduak blokeatzen ditu (adib. +nt). ON dagoenean, moduak ezin dira
      aldatu.
    no_modes: "modurik ez"
    on: "\x0303✔\x03 MLOCK orain ON dago (%modes%)."
    off: "\x0303✔\x03 MLOCK orain OFF dago."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03(e)k MLOCK gaitzen du (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03(e)k MLOCK desgaitzen du."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#kanala> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanala PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanala PRIVATE OFF\x03\x0F"
    short: "Ezkutatu kanalaren informazioa sarbiderik gabeko erabiltzaileei."
    help: |-
      ON dagoenean, sortzaileak eta sarbidea duten erabiltzaileek soilik ikus dezakete
      kanalaren informazioa.
    on: "\x0303✔\x03 Kanalaren informazioa pribatua da orain."
    off: "\x0303✔\x03 Kanalaren informazioa publikoa da orain."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#kanala> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanala SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanala SECURE OFF\x03\x0F"
    short: "Eskatu sarbide zerrenda kanal mailetarako."
    help: "Sarbide-zerrendan ez dauden ezizenei kanaleko mailak esleitzea blokeatzen du."
    on: "\x0303✔\x03 SECURE orain ON dago."
    off: "\x0303✔\x03 SECURE orain OFF dago."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03(e)k SECURE modua gaitzen du."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03(e)k SECURE modua desgaitzen du."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#kanala> {ADD|DEL|LIST} [ezizena] [maila]"
  example: "%command_prefix%\x02\x0303ACCESS #kanala LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #kanala ADD Ane 100\x03\x0F"
    - "%command_prefix%\x02\x0303ACCESS #kanala DEL Ane\x03\x0F"
  short: "Kudeatu sarbide zerrenda."
  help: "Kanalaren sarbide-zerrenda kudeatzen du."
  unknown_sub: "\x0304✗\x03 Azpikomando ezezaguna \x02%sub%\x02. Erabili LIST, ADD edo DEL."
  level_range: "\x0304✗\x03 Sarbide mailak %min% eta %max% artean egon behar du."
  cannot_manage_level: "\x0304✗\x03 Zurea baino maila hertsiki baxuagoa duten ezizenak soilik kudea ditzakezu."
  founder_not_in_list: "\x0304✗\x03 Sortzailea ez dago sarbide zerrendan."
  max_entries: "\x0304✗\x03 Gehienez %max% sarbide sarrera kanal bakoitzeko."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#kanala> LIST"
    example: "%command_prefix%\x02\x0303ACCESS #kanala LIST\x03\x0F"
    short: "Zerrendatu sarbide zerrenda (ACCESSLIST maila behar da)."
    help: "Ezizena eta maila erakusten ditu sarrera bakoitzeko."
    header: "\x0303\x02%channel%\x02 kanalaren sarbide zerrenda\x03"
    empty: "\x0307ℹ\x03 \x02%channel%\x02 kanalak ez du sarbide sarrerarik."
    entry: "  #%index%: %nickname% (%level% maila)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#kanala> ADD <ezizena> <maila>"
    example: "%command_prefix%\x02\x0303ACCESS #kanala ADD Ane 100\x03\x0F"
    short: "Gehitu edo eguneratu sarbide maila (ACCESSCHANGE maila behar da)."
    help: "Maila 1-499. Zurea baino maila baxuagoak soilik ezar ditzakezu."
    done: "\x0303✔\x03 \x02%nickname%\x02 %level% mailara ezarri da."
    notice_channel: "\x0303✔\x03 \x0302%from%\x03(e)k \x0314%to%\x03 \x0304%level%\x03 mailara ezartzen du"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#kanala> DEL <ezizena>"
    example: "%command_prefix%\x02\x0303ACCESS #kanala DEL Ane\x03\x0F"
    short: "Kendu sarbide zerrendatik (ACCESSCHANGE maila behar da)."
    help: "Zurea baino maila baxuagoa duten ezizenak soilik ken ditzakezu."
    not_in_list: "\x0304✗\x03 \x02%nickname%\x02 ez dago sarbide zerrendan."
    done: "\x0303✔\x03 \x02%nickname%\x02 sarbide zerrendatik kendu da."
    notice_channel: "\x0304✗\x03 \x0302%from%\x03(e)k \x0314%to%\x03 sarbide zerrendatik kentzen du"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#kanala>"
  example: "%command_prefix%\x02\x0303DELACCESS #kanala\x03\x0F"
  short: "Kendu zure sarbidea kanal batetik."
  help: |-
    Kanalaren sarbide-zerrendatik zure sarrera ezabatzen du. Identifikatuta
    egon behar duzu. Sortzaileak ezin du komando hau erabili.
  done: "\x0303✔\x03 Zure sarbidea \x02%channel%\x02 kanaletik kendu da."
  not_in_list: "\x0304✗\x03 Ez duzu sarbiderik \x02%channel%\x02 kanalean."
  founder_not_in_access: "\x0304✗\x03 \x02%channel%\x02 kanalaren sortzailea zara eta ez zaude sarbide zerrendan."
  notice_channel: "\x0304✗\x03 \x0302%nickname%\x03(e)k kanaletik bere sarbidea kentzen du"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#kanala> {LIST|SET|RESET} [maila] [balioa]"
  example: "%command_prefix%\x02\x0303LEVELS #kanala LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #kanala SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #kanala RESET\x03\x0F"
  short: "Konfiguratu kanal mailak."
  help: |-
    Kanal-ekintzetarako gutxieneko sarbide-mailak konfiguratzen ditu. Sortzaileak
    soilik alda edo berrezar ditzake mailak.
  unknown_sub: "\x0304✗\x03 Azpikomando ezezaguna \x02%sub%\x02. Erabili LIST, SET edo RESET."
  unknown_key: "\x0304✗\x03 Maila giltza ezezaguna \x02%key%\x02 edo IRCd honek ez du onartzen."
  value_range: "\x0304✗\x03 Maila balioak %min% eta %max% artean egon behar du."

  # --- LEVELS LIST ---------------------------------------------------------

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#kanala> {ADD <maskara> [iraungitzea] [arrazoia]|DEL {<maskara>|<zenbakia>}|LIST}"
  example: "%command_prefix%AKICK #kanala ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #kanala ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #kanala DEL *!*@*"
    - "%command_prefix%AKICK #kanala DEL 2"
    - "%command_prefix%AKICK #kanala LIST"
  short: "Kudeatu auto-kick zerrenda."
  help: "Auto-kick sarrerak eta haien aukerako iraungitzea kudeatzen ditu."
  unknown_sub: "Azpikomando ezezaguna %sub%. Erabili ADD, DEL edo LIST."
  invalid_mask: "Maskara formatu baliogabea. Erabili nick!ident@host komodinak erabiliz (*)."
  dangerous_mask: "%mask% maskara zabalegia da. Gutxienez 4 karaktere alfanumeriko eduki behar ditu."
  protected_user: "%nickname% ezizenak sarbidea du kanal honetan."
  max_entries: "Gehienez %max% AKICK sarrera kanal bakoitzeko."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#kanala> ADD <maskara> [iraungitzea] [arrazoia]"
    example: "%command_prefix%AKICK #kanala ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #kanala ADD *!*@* 7d Spam"
    short: "Gehitu AKICK sarrera."
    help: |-
      Kanalaren auto-kick zerrendara maskara bat gehitzen du.

      Iraupena eta arrazoia zehaztu ditzakezu. Arrazoia emanez gero, iraupena ere
      zehaztu behar da: 0 iraunkorra izateko, d egunetarako, h orduetarako edo
      m minutuetarako.
    done: "AKICK %mask% gehitu da."
    already_exists: "AKICK %mask% jada existitzen da."
    notice_channel: "%from%(e)k AKICK gehitzen du: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#kanala> DEL {<maskara>|<zenbakia>}"
    example: "%command_prefix%AKICK #kanala DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #kanala DEL 2"
    short: "Kendu AKICK sarrera."
    help: "Kendu maskara zehatzaren edo LISTeko sarrera zenbakiaren arabera."
    not_found: "AKICK %mask% ez da aurkitu."
    done: "AKICK %mask% kendu da."
    notice_channel: "%from%(e)k AKICK kentzen du: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#kanala> LIST"
    example: "%command_prefix%AKICK #kanala LIST"
    short: "Zerrendatu AKICK sarrerak."
    help: "Maskara, arrazoia, iraungitzea eta nork gehitu zuen erakusten ditu."
    header: "%channel% kanalaren AKICK zerrenda"
    empty: "%channel% kanalak ez du AKICK sarrerarik."
    entry: "#%index% %mask% %reason% (%nickname%-(e)k gehituta, iraungitzea: %expiration%)"


    syntax: "SET <#kanala> EMAIL [posta]"
    example: "%command_prefix%SET #kanala EMAIL talde@example.test"
    examples:
      - "%command_prefix%SET #kanala EMAIL"
    short: "Ezarri kanalaren posta elektronikoa."

    off: "Gaiaren blokeoa orain OFF dago."
    notice_on: "%nickname%(e)k TOPICLOCK gaitzen du."
    notice_off: "%nickname%(e)k TOPICLOCK desgaitzen du."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#kanala> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #kanala MLOCK ON"
    examples:
      - "%command_prefix%SET #kanala MLOCK OFF"
    short: "Blokeatu kanalaren moduak."
    help: |-
      Uneko kanal moduak blokeatzen ditu (adib. +nt). ON dagoenean, moduak ezin dira
      aldatu.
    no_modes: "modurik ez"
    on: "MLOCK orain ON dago (%modes%)."
    off: "MLOCK orain OFF dago."
    notice_on: "%nickname%(e)k MLOCK gaitzen du (%modes%)."
    notice_off: "%nickname%(e)k MLOCK desgaitzen du."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#kanala> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #kanala PRIVATE ON"
    examples:
      - "%command_prefix%SET #kanala PRIVATE OFF"
    short: "Ezkutatu kanalaren informazioa sarbiderik gabeko erabiltzaileei."

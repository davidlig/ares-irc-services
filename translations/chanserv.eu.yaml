# ChanServ itzulpenak — Euskara
# Domeinua: chanserv
#
# IRC formatu-kodeak (komatxo bikoitzak edo !irc bloke literalak):
#   \x02        letra lodia aktibatu/desaktibatu
#   \x03NN      kolorea (HAMARTARRA: 03=berdea, 04=gorria, 07=laranja, 14=gris iluna)
#   \x03        kolorea berrezarri
#   \x0F        formatu osoa berrezarri
#
# IRC koloreek zenbaki HAMARTARRAK (0-15) erabiltzen dituzte, ez hamaseitarrak.
#   \x0314 = gris iluna (14 hamartarra): ZUZENA
#   \x030F = 0 kolorea eta ondoren F letra: OKERRA
#
# Lerro anitzeko IRC testua: !irc |- benetako lerro-jauzi eta zuriuneekin.
# Etiketarik gabeko blokeek ez dituzte ihesak deskodetzen; gorde CTCP literalak.
# HELP adibideak: example/examples eta %command_prefix%.
# Aurkezleak kolorerik gabeko /msg eta bi zuriuneko marjina gehitzen ditu.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Kanal izen baliogabea. Erabili \x02#kanala\x02."
  generic: "\x0304✗\x03 Errore bat gertatu da. Saiatu berriro."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#kanala> <deskribapena>"
  example: "%command_prefix%\x02\x0303REGISTER #kanala Komunitate-proiektua\x03\x0F"
  short: "Erregistratu kanal bat."
  help: |-
    Erregistratu eta lotu kanal bat zure ezizenarekin. %nickserv% zerbitzuan
    identifikatuta egon behar duzu.
  success: "\x0303✔\x03 \x02%channel%\x02 kanala erregistratu da."
  already_registered: "\x0304✗\x03 \x02%channel%\x02 kanala jada erregistratuta dago."
  channel_not_on_network: "\x0304✗\x03 \x02%channel%\x02 kanala ez dago sarean."
  pending_deletion: "\x0304✗\x03 \x02%channel%\x02 kanala ezabatzearen zain dago eta ezin da erregistratu."
  insufficient_channel_rank: "\x0304✗\x03 \x02%channel%\x02 erregistratzeko gutxienez operadore maila izan behar duzu."
  limit_exceeded: "\x0304✗\x03 Erregistratutako kanalen gehieneko kopurura iritsi zara: %max%."
  throttled: "\x0304✗\x03 \x02%minutes%\x02 minutu itxaron behar duzu beste kanal bat erregistratu aurretik."

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#kanala>"
  example: "%command_prefix%\x02\x0303INFO #kanala\x03\x0F"
  short: "Erakutsi kanalaren informazioa."
  help: |-
    Erregistratutako kanal baten informazio zehatza erakusten du: jabea,
    erregistro-datuak, azken jarduera eta konfigurazio-aukerak.
  header: "\x02\x0307%channel%\x03 kanalaren informazioa\x02"
  founder: "  \x0314Sortzailea\x03         : \x02%nickname%\x02"
  registered: "  \x0314Erregistratua\x03      : %date%"
  successor: "  \x0314Ondorengoa\x03         : \x02%nickname%\x02"
  description: "  \x0314Deskribapena\x03       : %desc%"
  url: "  \x0314URLa\x03               : %url%"
  email: "  \x0314Posta\x03              : %email%"
  last_used: "  \x0314Azken erabilera\x03    : %date%"
  topic: "  \x0314Azken gaia\x03         : %topic%"
  topic_set_by: "  \x0314Gaia ezarlea\x03       : %nickname%"
  options: "  \x0314Aukerak\x03            : %options%"
  private: "\x0304✗\x03 \x02%channel%\x02 kanalaren informazioa pribatua da."
  no_expire: "  \x0314Iraungitzen ez da\x03  : Bai"
  mlock_modes: "  \x0314Modu blokeoa\x03       : %modes%"
  suspended_status: "  \x0314Egoera\x03             : \x0304Etenda\x03"
  suspended_reason: "  \x0314Arrazoia\x03           : %reason%"
  suspended_until: "  \x0314Amaiera\x03            : %date%"
  suspended_permanent: "  \x0314Amaiera\x03            : Iraunkorra"
  forbidden_status: "  \x0314Egoera\x03             : \x0304Debekatua\x03"
  forbidden_reason: "  \x0314Arrazoia\x03           : %reason%"
  pending_deletion_status: "  \x0314Egoera\x03             : \x0307Ezabatzeke\x03"
  pending_deletion_at: "  \x0314Ezabatuta\x03          : %date%"
  pending_deletion_until: "  \x0314Behin betiko\x03       : %date%"
  pending_deletion_notice: "  \x0307Kanal hau izoztuta dago eta ezin da erregistratu.\x03"

# --- HELP ------------------------------------------------------------------
help:
  examples_header: "\x02 ■ Adibideak:\x02"

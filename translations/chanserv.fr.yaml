# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#canal> <surnom>"
  example: "%command_prefix%DEOP #salon Alicia"
  short: "Retirer le mode opérateur de canal."
  help: "Retirer le mode opérateur de canal."
  done: "%nickname% a été déopé."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "Avec SECURE activé, %nickname% doit avoir au moins le niveau %level% pour recevoir %mode%."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#canal> {FOUNDER <surnom> [jeton]|SUCCESSOR [surnom]|DESC <description>|URL [url]|EMAIL [e-mail]|ENTRYMSG [message]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%SET #salon DESC Un salon communautaire"
  examples:
    - "%command_prefix%SET #salon URL https://example.test"
    - "%command_prefix%SET #salon MLOCK ON"
  short: "Modifier les options du canal."
  help: |-
    Modifie une option du salon. L’aide de chaque option décrit ses exigences et
    ses variantes.
  unknown_option: "Option inconnue %option%. Utilisez l'une de : %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Utilisez SET <#canal> FOUNDER <surnom> <token> avec le jeton confirmé du fondateur actuel."
    token_unavailable: "Le fondateur actuel n’a pas de jeton de secours confirmé. Il doit d’abord s’authentifier et utiliser VERIFY."
    syntax: "SET <#canal> FOUNDER <surnom> [jeton]"
    example: "%command_prefix%SET #salon FOUNDER Alicia"
    examples:
      - "%command_prefix%SET #salon FOUNDER Alicia token-confirmado"
    short: "Transférer le canal à un autre surnom enregistré."
    help: |-
      Change le fondateur après validation du jeton du fondateur actuel.
      L’exception administrative de niveau fondateur est conservée. Le jeton n’est pas
      consommé.
    invalid_token: "Le jeton de secours est incorrect."
    updated: "Le fondateur a été changé en %nickname%."
    throttled: "Trop de jetons incorrects. Réessayez dans %minutes% minute(s)."
    must_be_registered: "%nickname% doit être enregistré et activé."
    suspended: "%nickname% est suspendu et ne peut pas être défini comme fondateur."
    cannot_be_self: "Le nouveau fondateur ne peut pas être le fondateur actuel."
    cannot_be_successor: "Le nouveau fondateur ne peut pas être le successeur du canal."
    limit_exceeded: "%nickname% a atteint la limite maximale de %max% canaux enregistrés."
    notice_channel: "%from% désigne %nickname% comme fondateur du canal."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canal> SUCCESSOR [surnom]"
    example: "%command_prefix%SET #salon SUCCESSOR Alicia"
    examples:
      - "%command_prefix%SET #salon SUCCESSOR"
    short: "Définir le successeur du canal."
    help: |-
      Désigne un pseudonyme comme successeur du salon. Sans pseudonyme,
      le successeur actuel est supprimé. Le pseudonyme doit être enregistré et
      identifié.
    cleared: "Le successeur a été effacé."
    updated: "Le successeur a été défini sur %nickname%."
    must_be_registered: "%nickname% doit être enregistré et activé."
    suspended: "%nickname% est suspendu et ne peut pas être défini comme successeur."
    cannot_be_founder: "Le fondateur ne peut pas être défini comme successeur."
    notice_channel: "%from% désigne %nickname% comme successeur du canal."
    notice_channel_cleared: "%from% a effacé le successeur du canal."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canal> DESC <description>"
    example: "%command_prefix%SET #salon DESC Un salon communautaire"
    short: "Modifier la description du canal."
    help: "Modifie la description du canal (obligatoire)."
    updated: "Description mise à jour."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canal> URL [url]"
    example: "%command_prefix%SET #salon URL https://example.test"
    examples:
      - "%command_prefix%SET #salon URL"
    short: "Définir l'URL du canal."
    help: "Modifie l’adresse du site web du salon. Omettez l’URL pour la supprimer."
    updated: "URL mise à jour."
    cleared: "URL effacée."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#salon> EMAIL [e-mail]"
    example: "%command_prefix%SET #salon EMAIL equipe@example.test"
    examples:
      - "%command_prefix%SET #salon EMAIL"
    short: "Définir l'e-mail du canal."
    help: |-
      Modifie l’adresse e-mail du salon. Omettez l’adresse pour la
      supprimer. Les domaines de courriel bloqués par l’administration sont
      refusés. Exception administrative : opérateurs avec accès de niveau
      fondateur.
    invalid: "Adresse e-mail invalide."
    updated: "E-mail mis à jour."
    cleared: "E-mail effacé."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#salon> ENTRYMSG [message]"
    example: "%command_prefix%SET #salon ENTRYMSG Bienvenue"
    examples:
      - "%command_prefix%SET #salon ENTRYMSG"
    short: "Définir le message d'entrée du canal."
    help: |-
      Définit le message d’accueil du salon (NOTICE). Omettez le message pour le
      supprimer.
    updated: "Message d'entrée mis à jour."
    too_long: "Le message d'entrée ne peut pas dépasser %max% caractères."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canal> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #salon TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #salon TOPICLOCK OFF"
    short: "Verrouiller le sujet du canal."
    help: |-
      Empêche de modifier le sujet du salon. À l’activation, le sujet actuel est
      enregistré et verrouillé.
    on: "Le verrouillage du sujet est maintenant ON."
    off: "Le verrouillage du sujet est maintenant OFF."
    notice_on: "%nickname% active TOPICLOCK."
    notice_off: "%nickname% désactive TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canal> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #salon MLOCK ON"
    examples:
      - "%command_prefix%SET #salon MLOCK OFF"
    short: "Verrouiller les modes du canal."
    help: |-
      Verrouille les modes actuels du canal (ex. +nt). Lorsque ON, les modes ne
      peuvent pas être modifiés.
    no_modes: "aucun mode"
    on: "MLOCK est maintenant ON (%modes%)."
    off: "MLOCK est maintenant OFF."
    notice_on: "%nickname% active MLOCK (%modes%)."
    notice_off: "%nickname% désactive MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canal> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #salon PRIVATE ON"
    examples:
      - "%command_prefix%SET #salon PRIVATE OFF"
    short: "Masquer les informations du canal aux utilisateurs sans accès."
    help: |-
      Lorsque l’option est activée, seuls le fondateur et les utilisateurs autorisés
      peuvent consulter les informations du salon.
    on: "Les informations du canal sont maintenant privées."
    off: "Les informations du canal sont maintenant publiques."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canal> SECURE {ON|OFF}"
    example: "%command_prefix%SET #salon SECURE ON"
    examples:
      - "%command_prefix%SET #salon SECURE OFF"
    short: "Exiger la liste d'accès pour les rangs du canal."
    help: |-
      Empêche d’attribuer des statuts dans le salon aux pseudonymes absents
      de la liste d’accès.
    on: "SECURE est maintenant ON."
    off: "SECURE est maintenant OFF."
    notice_on: "%nickname% active le mode SECURE."
    notice_off: "%nickname% désactive le mode SECURE."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#canal> {ADD <surnom> <niveau>|DEL <surnom>|LIST}"
  example: "%command_prefix%ACCESS #salon LIST"
  examples:
    - "%command_prefix%ACCESS #salon ADD Alicia 100"
    - "%command_prefix%ACCESS #salon DEL Alicia"
  short: "Gérer la liste d'accès."
  help: "Gère la liste d’accès du salon."
  unknown_sub: "Sous-commande inconnue %sub%. Utilisez LIST, ADD ou DEL."
  level_range: "Le niveau d'accès doit être entre %min% et %max%."
  cannot_manage_level: "Vous pouvez uniquement gérer les surnoms avec un niveau strictement inférieur au vôtre."
  founder_not_in_list: "Le fondateur n'est pas dans la liste d'accès."
  max_entries: "Maximum %max% entrées d'accès par canal."

  # --- ACCESS LIST ---------------------------------------------------------

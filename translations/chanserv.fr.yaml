# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#canal> <description>"
  example: "%command_prefix%REGISTER #salon Projet communautaire"
  short: "Enregistrer un canal."
  help: |-
    Enregistre un salon et l’associe à votre pseudo. Vous devez être
    identifié auprès de %nickserv%. En mode APPROVAL, un IRCop doit
    approuver la demande.
  success: "Le canal %channel% a été enregistré."
  already_registered: "Le salon %channel% est déjà enregistré ou une demande est en cours."
  channel_not_on_network: "Le canal %channel% n'existe pas sur le réseau."
  pending_deletion: "Le canal %channel% est en attente de suppression et ne peut pas être enregistré."
  insufficient_channel_rank: "Vous devez avoir au moins le statut d'opérateur sur %channel% pour l'enregistrer."
  limit_exceeded: "Vous avez atteint la limite maximale de %max% canaux enregistrés."
  throttled: "Vous devez attendre %minutes% minute(s) avant d'enregistrer un autre canal."

  awaiting_approval: "La demande pour %channel% attend l’approbation d’un IRCop."
  restricted_indefinite: "Les nouvelles demandes pour %channel% sont bloquées indéfiniment."
  restricted_until: "Les nouvelles demandes pour %channel% sont bloquées jusqu’au %date%"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%REGMODE APPROVAL"
  short: "Définir ou consulter le mode d’enregistrement des salons."
  help: |-
    Définit DIRECT ou APPROVAL, ou consulte le mode avec STATUS.
    DIRECT est le mode par défaut et conserve l’enregistrement immédiat.
  status: "Le mode d’enregistrement des salons est %mode%."
  changed: "Le mode d’enregistrement des salons est maintenant %mode%."


# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#canal>"
  example: "%command_prefix%DELACCESS #salon"
  short: "Retirer votre propre accès d'un canal."
  help: |-
    Supprime votre entrée de la liste d’accès du salon. Vous devez être identifié.
    Le fondateur ne peut pas utiliser cette commande.
  done: "Votre accès a été retiré de %channel%."
  not_in_list: "Vous n'avez pas d'accès dans %channel%."
  founder_not_in_access: "Vous êtes le fondateur de %channel% et ne figurez pas dans la liste d'accès."
  notice_channel: "%nickname% retire son accès du canal"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#canal> {LIST|SET <niveau> <valeur>|RESET}"
  example: "%command_prefix%LEVELS #salon LIST"
  examples:
    - "%command_prefix%LEVELS #salon SET OPDEOP 50"
    - "%command_prefix%LEVELS #salon RESET"
  short: "Configurer les niveaux du canal."
  help: |-
    Configure les niveaux d’accès minimum requis pour les actions du salon.
    Seul le fondateur peut modifier ou réinitialiser les niveaux.
  unknown_sub: "Sous-commande inconnue %sub%. Utilisez LIST, SET ou RESET."
  unknown_key: "Clé de niveau inconnue %key% ou non prise en charge par cet IRCd."
  value_range: "La valeur de niveau doit être entre %min% et %max%."

  # --- LEVELS LIST ---------------------------------------------------------

  new_founder: "Nouveau fondateur : %value%"
  old_successor: "Ancien successeur : %value%"
  new_successor: "Nouveau successeur : %value%"
  target_nickname: "Cible : %value%"
  level: "Niveau : %value%"
  mask: "Masque : %value%"

# --- LEVEL FOUNDER ---------------------------------------------------------
level_founder:
  short: "Permet d’effectuer les opérations qui exigent le niveau fondateur du salon."

# --- CLEARACCESS -----------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#canal>"
  example: "%command_prefix%\x02\x0303CLEARACCESS #salon\x03\x0F"
  short: "Vider toute la liste d'accès d'un canal."
  help: "Supprime toutes les entrées d’accès du salon. Cette action est irréversible."
  success: "\x0303✔\x03 \x02%count%\x02 entrées d'accès effacées de \x02%channel%\x02."
  empty: "\x0307ℹ\x03 Le canal \x02%channel%\x02 n'a aucune entrée d'accès."

# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#canal> [raison]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #salon\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #salon flood\x03\x0F"
  short: "Expulser tous les utilisateurs d'un canal."
  help: |-
    Expulse tous les utilisateurs du salon. Cette commande est réservée aux IRCops ;
    une raison par défaut est utilisée si vous n’en indiquez aucune.
  not_on_network: "\x0304✗\x03 Le canal \x02%channel%\x02 n'est pas actuellement sur le réseau."
  empty: "\x0307ℹ\x03 Le canal \x02%channel%\x02 n'a aucun utilisateur à expulser."
  success: "\x0303✔\x03 \x02%count%\x02 utilisateur(s) expulsé(s) de \x02%channel%\x02."
  default_reason: "Commande CLEARUSERS"

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <motif> [page]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "Lister les salons enregistrés correspondant à un motif."
  help: |-
    Affiche les salons enregistrés correspondant au motif indiqué. Le caractère
    générique * correspond à n’importe quelle suite de caractères. La page est
    facultative et commence à 1.
  header: "Salon | Fondateur | Enregistrement | Dernière utilisation | État"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Aucun salon ne correspond au motif %pattern%."
  status_active: "Actif"
  status_pending_registration: "En attente d’approbation"
  status_rejected_registration: "Enregistrement refusé"

  help: "Donner le mode voice dans le canal."
  done: "%nickname% a reçu le voice."
  user_not_on_channel: "Le surnom %nickname% n'est pas sur le réseau."
  notice_grant: "%from% donne %mode% à %to%"

# --- DEVOICE ---------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#canal> <surnom>"
  example: "%command_prefix%DEVOICE #salon Alicia"
  short: "Retirer le mode voice dans le canal."
  help: "Retirer le mode voice dans le canal."
  done: "%nickname% a été dévoicé."

# --- UNBAN -----------------------------------------------------------------
unban:
  syntax: "UNBAN <#canal>"
  example: "%command_prefix%UNBAN #salon"
  short: "Retirer les bannissements qui vous affectent."
  help: "Retire tous les bannissements du canal correspondant à votre identité actuelle, y compris les jokers et les masques IP/CIDR."
  done: "%count% bannissement(s) vous affectant retiré(s) de %channel%"
  notice_channel: "%nickname% a utilisé UNBAN."
  no_matches: "Aucun bannissement ne correspond à votre identité dans %channel%"
  unavailable: "Impossible de déterminer vos bannissements correspondants ; rien n’a changé."
  not_on_network: "Le canal %channel% n’est pas sur le réseau."

# --- INVITE ----------------------------------------------------------------
invite:
  syntax: "INVITE <#canal>"
  example: "%command_prefix%INVITE #salon"
  short: "S'inviter soi-même sur le canal."
  help: "S'inviter soi-même sur le canal."
  done: "Vous avez été invité sur %channel%."
  notice_channel: "%nickname% s'invite sur le canal."

# --- ADMIN -----------------------------------------------------------------
admin:
  syntax: "ADMIN <#canal> <surnom>"
  example: "%command_prefix%ADMIN #salon Alicia"
  short: "Donner le mode admin de canal."
  help: "Donne le mode admin de canal. Uniquement si l'IRCd prend en charge +a."
  done: "%nickname% a reçu le statut admin de canal."
  user_not_on_channel: "Le surnom %nickname% n'est pas sur le réseau."
  notice_grant: "%from% donne %mode% à %to%"
  not_supported: "Ce réseau ne prend pas en charge le mode admin de canal (+a)."

# --- DEADMIN ---------------------------------------------------------------
deadmin:
  syntax: "DEADMIN <#canal> <surnom>"
  example: "%command_prefix%DEADMIN #salon Alicia"
  short: "Retirer le mode admin de canal."
  help: "Retirer le mode admin de canal."
  done: "%nickname% a été déadminné."

# --- HALFOP ----------------------------------------------------------------
halfop:
  syntax: "HALFOP <#canal> <surnom>"
  example: "%command_prefix%HALFOP #salon Alicia"
  short: "Donner le mode semi-opérateur dans le canal."
  help: |-
    Donne le mode semi-opérateur dans le canal. Uniquement si l'IRCd prend en charge
    +h.
  done: "%nickname% a reçu le halfop."
  user_not_on_channel: "Le surnom %nickname% n'est pas sur le réseau."
  notice_grant: "%from% donne %mode% à %to%"
  not_supported: "Ce réseau ne prend pas en charge le mode halfop (+h)."

# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#canal> <surnom>"
  example: "%command_prefix%DEHALFOP #salon Alicia"
  short: "Retirer le mode semi-opérateur dans le canal."
  help: "Retirer le mode semi-opérateur dans le canal."
  done: "%nickname% a été déhalfopé."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#canal> {ADD <masque> [expiration] [raison]|DEL {<masque>|<numéro>}|LIST}"
  example: "%command_prefix%AKICK #salon ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #salon ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #salon DEL *!*@*"
    - "%command_prefix%AKICK #salon DEL 2"
    - "%command_prefix%AKICK #salon LIST"
  short: "Gérer la liste d'auto-kick."
  help: "Gère les entrées d’expulsion automatique du salon et leur éventuelle expiration."
  unknown_sub: "Sous-commande inconnue %sub%. Utilisez ADD, DEL ou LIST."
  invalid_mask: "Format de masque invalide. Utilisez surnom!ident@hôte avec des jokers (*)."
  dangerous_mask: "Le masque %mask% est trop large. Il doit contenir au moins 4 caractères alphanumériques."
  protected_user: "Le surnom %nickname% a un accès dans ce canal."
  max_entries: "Maximum %max% entrées AKICK par canal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canal> ADD <masque> [expiration] [raison]"
    example: "%command_prefix%AKICK #salon ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #salon ADD *!*@* 7d Spam"
    short: "Ajouter une entrée AKICK."
    help: |-
      Ajoute un masque à la liste d’expulsion automatique du salon.

      Vous pouvez indiquer une durée et une raison. Si vous ajoutez une raison,
      vous devez aussi préciser la durée : 0 pour permanente, d pour les jours,
      h pour les heures ou m pour les minutes.
    done: "AKICK %mask% ajouté."
    already_exists: "AKICK %mask% existe déjà."
    notice_channel: "%from% ajoute AKICK : %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canal> DEL {<masque>|<numéro>}"
    example: "%command_prefix%AKICK #salon DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #salon DEL 2"
    short: "Supprimer une entrée AKICK."
    help: "Supprime par masque exact ou numéro d'entrée de LIST."
    not_found: "AKICK %mask% introuvable."
    done: "AKICK %mask% supprimé."
    notice_channel: "%from% supprime AKICK : %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canal> LIST"
    example: "%command_prefix%AKICK #salon LIST"
    short: "Lister les entrées AKICK."
    help: "Affiche le masque, la raison, l'expiration et qui a ajouté."
    header: "Liste AKICK pour %channel%"
    empty: "Le canal %channel% n'a aucune entrée AKICK."
    entry: "#%index% %mask% %reason% (par %nickname%, expire : %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#canal>"
  example: "%command_prefix%RESTORE #salon"
  short: "Restaurer un canal en attente de suppression."
  help: |-
    Restaure un salon supprimé manuellement, s’il se trouve encore dans sa
    période de grâce.
  success: "Le canal %channel% a été restauré."
  not_pending_deletion: "Le canal %channel% n'est pas en attente de suppression."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#canal> [FORCE]"
  example: "%command_prefix%DROP #salon"
  examples:
    - "%command_prefix%DROP #salon FORCE"
  short: "Abandonner un canal enregistré."
  help: |-
    Supprime un salon enregistré de la base de données.
    FORCE supprime définitivement un salon en attente de suppression.
    Un IRCop ayant la permission DROP peut aussi libérer immédiatement
    les demandes d’enregistrement en attente et refusées, avec ou sans FORCE.
  registration_restricted: "Cette demande d’enregistrement est bloquée jusqu’au %date%."
  force:
    short: "Supprime définitivement un salon en attente de suppression."
  success: "Le canal %channel% a été marqué pour suppression et peut être restauré pendant la période de grâce."
  force_success: "Le canal %channel% a été définitivement supprimé."
  pending_deletion: "Le canal %channel% est déjà en attente de suppression. Utilisez DROP <#canal> FORCE pour le supprimer définitivement."
  invalid_channel: "Nom de canal invalide. Utilisez %example%."
  pending_deletion_reason: "Le salon %channel% est en cours de suppression. Plus d’informations : /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canal> <durée> <raison>"
  example: "%command_prefix%SUSPEND #salon 7d Non-respect des règles"
  examples:
    - "%command_prefix%SUSPEND #salon 0 Non-respect des règles"
  short: "Suspendre un canal."
  help: |-
    Désactive temporairement un salon enregistré. Formats de durée : 0 =
    permanent, 1d, 12h, 60m.
    Pendant la suspension, les modes, les accès et l’application des règles du salon
    sont désactivés.
  success: "Le canal %channel% a été suspendu jusqu'à %duration%."
  already_suspended: "Le canal %channel% est déjà suspendu."
  invalid_duration: "Durée invalide. Utilisez : 0 (permanent), 1j, 12h ou 60m."
  channel_suspended: "Le canal %channel% est suspendu et ne peut pas être utilisé."
  notice_channel: "Le canal a été suspendu. Raison : %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#canal>"
  example: "%command_prefix%UNSUSPEND #salon"
  short: "Lever la suspension d'un canal."
  help: "Réactive un salon suspendu et restaure ses modes et l’application des règles."
  success: "Le canal %channel% n'est plus suspendu."
  not_suspended: "Le canal %channel% n'est pas suspendu."
  reason_expired: "suspension expirée"

# --- NOJOIN ----------------------------------------------------------------
nojoin:
  reason: "Restriction de niveau NOJOIN"

# --- DEBUG CHANNEL ---------------------------------------------------------
debug_channel:
  kick_reason: "Vous n'êtes pas autorisé à rejoindre ce canal."

# --- IRCOPONLY -------------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#canal> {ON|OFF}"
  example: "%command_prefix%IRCOPONLY #salon ON"
  examples:
    - "%command_prefix%IRCOPONLY #salon OFF"
  short: "Réserver un canal aux opérateurs IRC."
  help: |-
    Seuls les opérateurs IRC autorisés peuvent rester dans le salon. %bot%
    se charge d’appliquer cette restriction.
  on: "IRCOPONLY est activé sur %channel%."
  off: "IRCOPONLY est désactivé sur %channel%."

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#canal> {ON|OFF}"
  example: "%command_prefix%NOEXPIRE #Important ON"
  examples:
    - "%command_prefix%NOEXPIRE #Important OFF"
  short: "Définir ou retirer la protection contre l'expiration d'un canal."
  help: |-
    Détermine si le salon expire après une période d’inactivité.
    ON empêche l’expiration et OFF applique les règles habituelles.
  success_on: "Le canal %channel% est maintenant protégé contre l'expiration."
  success_off: "Le canal %channel% expirera maintenant normalement."
  forbidden: "Le canal %channel% est interdit."
  suspended: "Le canal %channel% est suspendu."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <#canal> <raison>"
  example: "%command_prefix%FORBID #salon Non-respect des règles"
  short: "Interdire l'utilisation d'un canal."
  help: |-
    Interdit l’utilisation d’un salon, en expulse tous les utilisateurs et
    les empêche de revenir. Si le salon est enregistré, son enregistrement est
    supprimé avant l’application de l’interdiction.
  reason_required: "Vous devez spécifier une raison."
  success: "Le canal %channel% a été interdit."
  updated: "La raison d'interdiction du canal %channel% a été mise à jour."
  channel_forbidden: "Le canal %channel% est interdit et ne peut pas être utilisé."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#canal>"
  example: "%command_prefix%UNFORBID #salon"
  short: "Lever l'interdiction d'un canal."
  help: "Lève l’interdiction d’un salon afin qu’il puisse être enregistré à nouveau."
  success: "Le canal %channel% n'est plus interdit."
  not_forbidden: "Le canal %channel% n'est pas interdit."

# --- DEBUG -----------------------------------------------------------------
debug:
  registration_completed: "%operator% a enregistré le canal %target%"
  registration_pending: "%operator% a demandé l’enregistrement du canal %target%"
  founder_action: "Action niveau-fondateur"

# --- HISTORY ---
history:
  syntax: "HISTORY <#canal> {ADD <message>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  example: "%command_prefix%HISTORY #salon ADD Examen de modération"
  examples:
    - "%command_prefix%HISTORY #salon DEL 42"
    - "%command_prefix%HISTORY #salon VIEW"
    - "%command_prefix%HISTORY #salon VIEW 2"
    - "%command_prefix%HISTORY #salon VIEW ALL"
    - "%command_prefix%HISTORY #salon CLEAR"
  short: "Consulter ou gérer l'historique des actions du canal."
  help: "Gère l’historique des actions du salon."

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#canal> ADD <message>"
    example: "%command_prefix%HISTORY #salon ADD Examen de modération"
    short: "Ajouter une entrée manuelle à l'historique."
    help: |-
      Ajoute une entrée manuelle à l'historique du canal.
    success: "Entrée d'historique ajoutée pour %channel%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#canal> DEL <id>"
    example: "%command_prefix%HISTORY #salon DEL 42"
    short: "Supprime une entrée de l’historique."
    help: "Supprime une entrée de l'historique par son ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#canal> VIEW [PAGE|ALL]"
    example: "%command_prefix%HISTORY #salon VIEW"
    examples:
      - "%command_prefix%HISTORY #salon VIEW 2"
      - "%command_prefix%HISTORY #salon VIEW ALL"
    short: "Afficher l'historique des actions du canal."
    help: "Affiche les entrées de l'historique du canal."
    header: "%heading% (affichage %start%-%end% sur %total%) :"
    header_heading: "Historique pour %channel%"
    entry: "#%id% [%date%] %action% par %operator% — %message%"
    no_entries: "Aucune entrée d'historique trouvée pour %channel%."
    page_hint: "Utilisez %command% pour plus d'entrées."
    page_hint_command: "HISTORY %channel% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#canal> CLEAR"
    example: "%command_prefix%HISTORY #salon CLEAR"
    short: "Supprimer toutes les entrées d'historique d'un canal."
    help: "Supprime toutes les entrées de l'historique du canal."
    success: "%count% entrées d'historique effacées pour %channel%."


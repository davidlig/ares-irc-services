  rejected: "L’enregistrement de %channel% a été refusé."
  not_pending: "Aucune demande en attente pour %channel%."
  channel_not_on_network: "Le salon %channel% n’est pas sur le réseau."
  founder_limit: "Le demandeur a atteint la limite d’enregistrement de salons."
  requester_inactive: "Le compte du demandeur n’est plus actif."
  requester_ineligible: "Le demandeur doit actuellement être opérateur du salon."


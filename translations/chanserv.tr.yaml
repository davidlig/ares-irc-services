# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> {ADD <maske> [süre] [gerekçe]|DEL {<maske>|<numara>}|LIST}"
  example: "%command_prefix%AKICK #kanal ADD *!*@* 0"

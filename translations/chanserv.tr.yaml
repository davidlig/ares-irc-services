# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#channel> {FOUNDER <takma_ad> [token]|SUCCESSOR [nickname]|DESC <açıklama>|URL [url]|EMAIL [e-posta]|ENTRYMSG [mesaj]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%SET #kanal DESC Bir topluluk kanalı"
  examples:
    - "%command_prefix%SET #kanal URL https://example.test"
    - "%command_prefix%SET #kanal MLOCK ON"
  short: "Kanal seçeneklerini değiştirin."
  help: |-
    Bir kanal seçeneğini değiştirir. Her seçeneğin yardımı gereksinimleri ve
    çeşitlerini açıklar.
  unknown_option: "Bilinmeyen seçenek %option%. Şunlardan birini kullanın: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Mevcut kurucunun onaylanmış belirteciyle SET <#kanal> FOUNDER <takma_ad> <token> kullanın."
    token_unavailable: "Mevcut kurucunun onaylanmış kurtarma belirteci yok. Önce kimliğini doğrulamalı ve VERIFY kullanmalıdır."
    syntax: "SET <#kanal> FOUNDER <takma_ad> [token]"
    example: "%command_prefix%SET #kanal FOUNDER Alicia"
    examples:
      - "%command_prefix%SET #kanal FOUNDER Alicia token-confirmado"
    short: "Kanalı başka bir kayıtlı rumuza devredin."
    help: |-
      Geçerli kurucunun tokenını doğruladıktan sonra kurucuyu değiştirir. Kurucu
      düzeyindeki yönetici istisnası korunur. Token tüketilmez.
    invalid_token: "Kurtarma belirteci geçersiz."
    updated: "Kurucu %nickname% olarak değiştirildi."
    throttled: "Çok fazla geçersiz belirteç. %minutes% dakika sonra tekrar deneyin."
    must_be_registered: "%nickname% kayıtlı ve etkinleştirilmiş olmalıdır."
    suspended: "%nickname% askıya alınmış ve kurucu olarak atanamaz."
    cannot_be_self: "Yeni kurucu mevcut kurucu olamaz."
    cannot_be_successor: "Yeni kurucu kanal halefi olamaz."
    limit_exceeded: "%nickname% maksimum %max% kayıtlı kanal sınırına ulaştı."
    notice_channel: "%from%, %nickname% adlı kullanıcıyı kanal kurucusu olarak atar."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%SET #kanal SUCCESSOR Alicia"
    examples:
      - "%command_prefix%SET #kanal SUCCESSOR"
    short: "Kanal halefini ayarlayın."
    help: |-
      Bir takma adı kanalın halefi olarak atar. Takma ad belirtilmezse mevcut halef
      silinir. Takma ad kayıtlı ve etkin olmalıdır.
    cleared: "Halef temizlendi."
    updated: "Halef %nickname% olarak ayarlandı."
    must_be_registered: "%nickname% kayıtlı ve etkinleştirilmiş olmalıdır."
    suspended: "%nickname% askıya alınmış ve halef olarak atanamaz."
    cannot_be_founder: "Kurucu halef olarak atanamaz."
    notice_channel: "%from%, %nickname% adlı kullanıcıyı kanal halefi olarak atar."
    notice_channel_cleared: "%from% kanal halefini temizledi."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <açıklama>"
    example: "%command_prefix%SET #kanal DESC Bir topluluk kanalı"
    short: "Kanal açıklamasını değiştirin."
    help: "Kanal açıklamasını değiştirin (zorunlu)."
    updated: "Açıklama güncellendi."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%SET #kanal URL https://example.test"
    examples:
      - "%command_prefix%SET #kanal URL"
    short: "Kanal URL'sini ayarlayın."
    help: "Kanalın web adresini değiştirir. Silmek için URL belirtmeyin."
    updated: "URL güncellendi."
    cleared: "URL temizlendi."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#kanal> EMAIL [e-posta]"
    example: "%command_prefix%SET #kanal EMAIL equipo@example.test"
    examples:
      - "%command_prefix%SET #kanal EMAIL"
    short: "Kanal e-postasını ayarlayın."
    help: |-
      Kanalın e-posta adresini değiştirir. Silmek için adres belirtmeyin.
      Yönetim tarafından engellenen e-posta alan adları kullanılamaz.
      Yönetim istisnası: kurucu düzeyinde erişimi olan operatörler.
    invalid: "Geçersiz e-posta adresi."
    updated: "E-posta güncellendi."
    cleared: "E-posta temizlendi."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#kanal> ENTRYMSG [mesaj]"
    example: "%command_prefix%SET #kanal ENTRYMSG Hoş geldiniz"
    examples:
      - "%command_prefix%SET #kanal ENTRYMSG"
    short: "Kanal giriş mesajını ayarlayın."
    help: "Kanal giriş mesajını (NOTICE) ayarlar. Silmek için mesaj belirtmeyin."
    updated: "Giriş mesajı güncellendi."
    too_long: "Giriş mesajı %max% karakteri aşamaz."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #kanal TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #kanal TOPICLOCK OFF"
    short: "Kanal başlığını kilitleyin."
    help: |-
      Kanal konusunun değiştirilmesini engeller. Etkinleştirildiğinde mevcut konu
      kaydedilir ve kilitlenir.
    on: "Başlık kilidi şimdi AÇIK."
    off: "Başlık kilidi şimdi KAPALI."
    notice_on: "%nickname% TOPICLOCK özelliğini etkinleştiriyor."
    notice_off: "%nickname% TOPICLOCK özelliğini devre dışı bırakıyor."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #kanal MLOCK ON"
    examples:
      - "%command_prefix%SET #kanal MLOCK OFF"
    short: "Kanal modlarını kilitleyin."
    help: "Mevcut kanal modlarını (örn. +nt) kilitler. ON durumunda, modlar değiştirilemez."
    no_modes: "mod yok"
    on: "MLOCK şimdi AÇIK (%modes%)."
    off: "MLOCK şimdi KAPALI."
    notice_on: "%nickname% MLOCK özelliğini etkinleştiriyor (%modes%)."
    notice_off: "%nickname% MLOCK özelliğini devre dışı bırakıyor."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#channel> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #kanal PRIVATE ON"
    examples:
      - "%command_prefix%SET #kanal PRIVATE OFF"
    short: "Kanal bilgilerini erişimi olmayan kullanıcılardan gizleyin."
    help: |-
      Açık olduğunda kanal bilgilerini yalnızca kurucu ve erişimi olan kullanıcılar
      görebilir.
    on: "Kanal bilgileri artık gizli."
    off: "Kanal bilgileri artık herkese açık."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%SET #kanal SECURE ON"
    examples:
      - "%command_prefix%SET #kanal SECURE OFF"
    short: "Kanal rütbeleri için erişim listesi gerektirin."
    help: "Erişim listesinde olmayan takma adlara kanalda rütbe verilmesini engeller."
    on: "SECURE şimdi AÇIK."
    off: "SECURE şimdi KAPALI."
    notice_on: "%nickname% SECURE modunu etkinleştiriyor."
    notice_off: "%nickname% SECURE modunu devre dışı bırakıyor."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#channel> {ADD <nickname> <seviye>|DEL <nickname>|LIST}"
  example: "%command_prefix%ACCESS #kanal LIST"
  examples:
    - "%command_prefix%ACCESS #kanal ADD Alicia 100"
    - "%command_prefix%ACCESS #kanal DEL Alicia"
  short: "Erişim listesini yönetin."
  help: "Kanalın erişim listesini yönetir."
  unknown_sub: "Bilinmeyen alt komut %sub%. LIST, ADD veya DEL kullanın."
  level_range: "Erişim seviyesi %min% ile %max% arasında olmalıdır."
  cannot_manage_level: "Yalnızca seviyesi sizinkinden kesinlikle daha düşük olan rumuzları yönetebilirsiniz."
  founder_not_in_list: "Kurucu erişim listesinde değil."
  max_entries: "Kanal başına maksimum %max% erişim girişi."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#channel> LIST"
    example: "%command_prefix%ACCESS #kanal LIST"
    short: "Erişim listesini listele (ACCESSLIST seviyesi gerektirir)."
    help: "Her giriş için rumuz ve seviyeyi gösterir."
    header: "%channel% için erişim listesi"
    empty: "%channel% kanalının erişim girişi yok."
    entry: "#%index%: %nickname% (seviye %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#channel> ADD <nickname> <seviye>"
    example: "%command_prefix%ACCESS #kanal ADD Alicia 100"
    short: "Erişim seviyesi ekle veya güncelle (ACCESSCHANGE seviyesi gerektirir)."
    help: |-
      Seviye 1-499. Yalnızca kendi seviyenizin altındaki seviyeleri
      ayarlayabilirsiniz.
    done: "%nickname% seviye %level% olarak ayarlandı."
    notice_channel: "%from%, %to% adlı kullanıcıyı %level% seviyesine ayarlıyor"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#channel> DEL <nickname>"
    example: "%command_prefix%ACCESS #kanal DEL Alicia"
    short: "Erişim listesinden kaldır (ACCESSCHANGE seviyesi gerektirir)."
    help: "Yalnızca seviyesi sizinkinden düşük olan rumuzları kaldırabilirsiniz."
    not_in_list: "%nickname% erişim listesinde değil."
    done: "%nickname% erişim listesinden kaldırıldı."
    notice_channel: "%from%, %to% adlı kullanıcıyı erişim listesinden kaldırıyor"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#channel>"
  example: "%command_prefix%DELACCESS #kanal"
  short: "Bir kanaldan kendi erişiminizi kaldırın."
  help: |-
    Kanalın erişim listesindeki kendi kaydınızı siler. Kimliğiniz doğrulanmış
    olmalıdır.
    Kurucu bu komutu kullanamaz.
  done: "%channel% kanalından erişiminiz kaldırıldı."

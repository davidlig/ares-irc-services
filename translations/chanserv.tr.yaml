    syntax: "LEVELS <#channel> SET <seviye> <değer>"
    example: "%command_prefix%\x02\x0303LEVELS #kanal SET OPDEOP 50\x03\x0F"
    short: "Bir seviye gereksinimi ayarlayın."
    help: "Değer -1 ila 499. Yalnızca kurucu."
    done: "\x0303✔\x03 \x02%key%\x02 %value% olarak ayarlandı."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#channel> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #kanal RESET\x03\x0F"
    short: "Tüm seviyeleri varsayılanlara sıfırlayın."
    help: "Tüm geçersiz kılmaları kaldırır. Yalnızca kurucu."
    done: "\x0303✔\x03 Tüm seviyeler varsayılanlara sıfırlandı."


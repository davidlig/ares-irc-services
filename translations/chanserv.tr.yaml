# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#channel> [gerekçe]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #kanal\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #kanal flooding\x03\x0F"
  short: "Bir kanaldaki tüm kullanıcıları atın."
  help: |-
    Kanaldaki tüm kullanıcıları atar. Yalnızca IRCop kullanabilir; gerekçe
    belirtilmezse
    varsayılan bir gerekçe kullanılır.
  not_on_network: "\x0304✗\x03 \x02%channel%\x02 kanalı şu anda ağda değil."

# ChanServ çevirileri — Türkçe
# Alan: chanserv
#
# IRC biçimlendirme kodları (çift tırnaklar veya !irc düz metin blokları):
#   \x02        kalın yazıyı aç/kapat
#   \x03NN      renk (ONDALIK: 03=yeşil, 04=kırmızı, 07=turuncu, 14=koyu gri)
#   \x03        rengi sıfırla
#   \x0F        tüm biçimlendirmeyi sıfırla
#
# IRC renkleri onaltılık değil, ONDALIK sayılar (0-15) kullanır.
#   \x0314 = koyu gri (ondalık 14): DOĞRU
#   \x030F = 0 rengi ve ardından F harfi: HATA
#
# Çok satırlı IRC metni: !irc |- ile gerçek satır sonları ve boşluklar.
# Etiketsiz bloklar kaçışları çözmez; CTCP sabit metinlerini koruyun.
# HELP örnekleri: example/examples ve %command_prefix%.
# Sunum katmanı renksiz /msg ve iki boşlukluk kenar payı ekler.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Geçersiz kanal adı. \x02#channel\x02 kullanın."
  generic: "\x0304✗\x03 Bir hata oluştu. Lütfen tekrar deneyin."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#channel> <açıklama>"
  example: "%command_prefix%\x02\x0303REGISTER #kanal Topluluk projesi\x03\x0F"
  short: "Bir kanalı kaydedin."
  help: |-
    Kanalı kaydedip takma adına bağlar. %nickserv% ile kimliğini doğrula.
    APPROVAL modunda bir IRCop isteği onaylamalıdır.
  success: "\x0303✔\x03 \x02%channel%\x02 kanalı kaydedildi."
  already_registered: "\x0304✗\x03 Kanal \x02%channel%\x02 zaten kayıtlı veya kayıt isteği işleniyor."
  channel_not_on_network: "\x0304✗\x03 \x02%channel%\x02 kanalı ağda mevcut değil."
  pending_deletion: "\x0304✗\x03 \x02%channel%\x02 kanalı silinmeyi bekliyor ve kaydedilemez."
  insufficient_channel_rank: "\x0304✗\x03 Bu kanalı kaydetmek için \x02%channel%\x02 üzerinde en az operatör durumunda olmalısınız."
  limit_exceeded: "\x0304✗\x03 Maksimum %max% kayıtlı kanal sınırına ulaştınız."
  throttled: "\x0304✗\x03 Başka bir kanal kaydetmeden önce \x02%minutes%\x02 dakika beklemelisiniz."

  awaiting_approval: "\x0307✔\x03 \x02%channel%\x02 kayıt isteği bir IRCop onayı bekliyor."
  restricted_indefinite: "\x0304✗\x03 \x02%channel%\x02 için yeni istekler süresiz olarak engellendi."
  restricted_until: "\x0304✗\x03 \x02%channel%\x02 için yeni istekler %date% tarihine kadar engellendi"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%\x02\x0303REGMODE APPROVAL\x03\x0F"
  short: "Kanal kayıt modunu ayarlayın veya görüntüleyin."
  help: |-
    Kaydı DIRECT ya da APPROVAL olarak ayarlayın veya STATUS ile görüntüleyin.
    DIRECT varsayılandır ve anında kaydı sürdürür.

  status: "\x0307ℹ\x03 Kanal kayıt modu \x02%mode%\x02."
  changed: "\x0303✔\x03 Kanal kayıt modu artık \x02%mode%\x02."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [sayfa]|ACCEPT <#kanal>|REJECT <#kanal> <neden>}"
  pending.syntax: "CREG PENDING [sayfa]"
  pending.example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  pending.short: "Bekleyen kayıt isteklerini listeleyin."
  pending.help: "Bekleyen istekleri sınırlı bir sayfada listeler."
  accept.syntax: "CREG ACCEPT <#kanal>"
  accept.example: "%command_prefix%\x02\x0303CREG ACCEPT #canal\x03\x0F"
  accept.short: "Bir kanal kayıt isteğini onaylayın."
  accept.help: "İstek sahibini yeniden doğrular ve bekleyen kaydı etkinleştirir."
  reject.syntax: "CREG REJECT <#kanal> <neden>"
  reject.example: "%command_prefix%\x02\x0303CREG REJECT #canal Motivo público\x03\x0F"
  reject.short: "Bir kanal kayıt isteğini reddedin."
  reject.help: "İsteği zorunlu bir neden ve kısıtlamayla reddeder."
  example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  short: "Kanal kayıt isteklerini inceleyin."
  help: |-
    Bekleyen istekleri listeler veya bir isteği kabul ya da reddeder.
    Ret için neden gerekir. Kanalı yalnızca ACCEPT kaydeder.

  pending_header: "\x0314Bekleyen kayıtlar (sayfa %page%)\x03"
  pending_item: "  %channel% — isteyen %requester%, gönderim %submitted%: %description%"
  accepted: "\x0303✔\x03 \x02%channel%\x02 kaydı onaylandı."
  rejected: "\x0303✔\x03 \x02%channel%\x02 kaydı reddedildi."
  not_pending: "\x0304✗\x03 \x02%channel%\x02 için bekleyen kayıt yok."
  channel_not_on_network: "\x0304✗\x03 \x02%channel%\x02 ağda değil."
  founder_limit: "\x0304✗\x03 İstek sahibi kanal kayıt sınırına ulaştı."
  requester_inactive: "\x0304✗\x03 İstek sahibinin hesabı artık etkin değil."
  requester_ineligible: "\x0304✗\x03 İstek sahibi şu anda kanalda operatör olmalıdır."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <#kanal>"
  example: "%command_prefix%\x02\x0303STATUS #canal\x03\x0F"
  header: "\x02Kanal durumu \x0307%channel%\x03\x02"
  short: "Kanal kayıt durumunu gösterin."
  help: |-
    Kanalın kayıtlı olmadığını, onay beklediğini, reddedildiğini veya kayıtlı
    olduğunu gösterir.
    Ret ayrıntılarını yalnızca istek sahibi ve yetkili IRCoplar görebilir.

  unregistered: "  \x0314Durum                   \x03: Kayıtlı değil"
  pending: "  \x0314Durum                   \x03: \x0307Onay bekliyor\x03"
  registered: "  \x0314Durum                   \x03: \x0303Kayıtlı\x03"
  suspended: "  \x0314Durum                   \x03: \x0304Askıya alındı\x03"
  forbidden: "  \x0314Durum                   \x03: \x0304Yasaklandı\x03"
  pending_deletion: "  \x0314Durum                   \x03: \x0307Silinmeyi bekliyor\x03"
  rejected_private: "  \x0314Durum                   \x03: \x0304Kayıt reddedildi\x03"
  rejected: "  \x0314Durum                   \x03: \x0304Kayıt reddedildi\x03"
  rejection_reason: "  \x0314Neden                   \x03: %reason%"
  rejection_audit: "  \x0314Reddeden                \x03: %operator%, %date% tarihinde"
  restriction_until: "  \x0314Kullanılabilir olduğu tarih\x03: %date%"
  footer: "\x0314─────────────────────────────\x03\x0F"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#channel>"
  example: "%command_prefix%\x02\x0303INFO #kanal\x03\x0F"
  short: "Kanal bilgilerini gösterin."
  help: |-
    Kayıtlı bir kanalın sahibi, kayıt bilgileri, son etkinliği ve yapılandırma
    seçenekleri dahil ayrıntılarını gösterir.
  header: "\x02\x0307%channel%\x03 kanalı için bilgi\x02"
  founder: "  \x0314Kurucu\x03             : \x02%nickname%\x02"
  registered: "  \x0314Kayıt\x03              : %date%"
  successor: "  \x0314Halef\x03              : \x02%nickname%\x02"
  description: "  \x0314Açıklama\x03           : %desc%"
  url: "  \x0314URL\x03                : %url%"
  email: "  \x0314E-posta\x03            : %email%"
  last_used: "  \x0314Son kullanım\x03       : %date%"
  topic: "  \x0314Son başlık\x03         : %topic%"
  topic_set_by: "  \x0314Başlığı ayarlayan\x03  : %nickname%"
  options: "  \x0314Seçenekler\x03         : %options%"
  private: "\x0304✗\x03 \x02%channel%\x02 kanalının bilgileri özeldir."
  no_expire: "  \x0314Hiç Sona Ermez\x03     : Evet"
  mlock_modes: "  \x0314Mod kilidi\x03         : %modes%"
  suspended_status: "  \x0314Durum\x03              : \x0304Askıya alındı\x03"
  suspended_reason: "  \x0314Gerekçe\x03            : %reason%"
  suspended_until: "  \x0314Bitiş tarihi\x03       : %date%"
  suspended_permanent: "  \x0314Bitiş tarihi\x03       : Kalıcı"
  forbidden_status: "  \x0314Durum\x03              : \x0304Yasaklandı\x03"
  forbidden_reason: "  \x0314Gerekçe\x03            : %reason%"
  pending_deletion_status: "  \x0314Durum\x03              : \x0307Silinme bekleniyor\x03"
  pending_deletion_at: "  \x0314Silindi\x03            : %date%"
  pending_deletion_until: "  \x0314Kalıcı silinme\x03     : %date%"
  pending_deletion_notice: "  \x0307Bu kanal dondurulmuştur ve kaydedilemez.\x03"


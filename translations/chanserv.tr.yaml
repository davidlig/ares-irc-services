# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#channel> {ADD|DEL|LIST} [maske] [süre] [gerekçe]"
  example: "%command_prefix%\x02\x0303AKICK #kanal ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #kanal ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanal DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanal DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanal LIST\x03\x0F"
  short: "Otomatik atma listesini yönetin."
  help: "Kanalın otomatik atma kayıtlarını ve isteğe bağlı sürelerini yönetir."
  unknown_sub: "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL veya LIST kullanın."
  invalid_mask: "\x0304✗\x03 Geçersiz maske formatı. Joker karakterler (*) ile \x02nick!ident@host\x02 kullanın."
  dangerous_mask: "\x0304✗\x03 \x02%mask%\x02 maskesi çok geniş. En az 4 alfanümerik karakter içermelidir."
  protected_user: "\x0304✗\x03 \x02%nickname%\x02 rumuzunun bu kanalda erişimi var."
  max_entries: "\x0304✗\x03 Kanal başına maksimum %max% AKICK girişi."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <maske> [süre] [gerekçe]"
    example: "%command_prefix%\x02\x0303AKICK #kanal ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #kanal ADD *!*@* 7d Spam\x03\x0F"
    short: "AKICK girişi ekleyin."
    help: |-
      Kanalın otomatik atma listesine bir maske ekler.

      Süre ve gerekçe belirtebilirsiniz. Gerekçe eklerseniz süreyi de belirtmelisiniz:
      0 süresiz, d gün, h saat veya m dakika anlamına gelir.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 eklendi."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 zaten mevcut."
    notice_channel: "\x02%from%\x02 AKICK ekliyor: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL <maske|numara>"
    example: "%command_prefix%\x02\x0303AKICK #kanal DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #kanal DEL 2\x03\x0F"
    short: "AKICK girişini kaldırın."
    help: "Tam maske veya LIST'teki giriş numarası ile kaldırın."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 bulunamadı."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 kaldırıldı."
    notice_channel: "\x02%from%\x02 AKICK kaldırıyor: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#channel> LIST"
    example: "%command_prefix%\x02\x0303AKICK #kanal LIST\x03\x0F"
    short: "AKICK girişlerini listeleyin."
    help: "Maske, gerekçe, süre ve ekleyeni gösterir."
    header: "\x0303\x02%channel%\x02 için AKICK listesi\x03"
    empty: "\x0307ℹ\x03 \x02%channel%\x02 kanalının AKICK girişi yok."
    entry: "  #%index% %mask% %reason% (ekleyen: %nickname%, bitiş: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#channel>"
  example: "%command_prefix%\x02\x0303RESTORE #kanal\x03\x0F"
  short: "Silinmeyi bekleyen bir kanalı geri yükle."
  help: "Elle silinmiş ve hâlâ bekleme süresinde olan bir kanalı geri yükler."
  success: "\x0303✔\x03 \x02%channel%\x02 kanalı geri yüklendi."
  not_pending_deletion: "\x0304✗\x03 \x02%channel%\x02 kanalı silinmeyi beklemiyor."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#channel> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #kanal\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP #kanal FORCE\x03\x0F"
  short: "Kayıtlı bir kanalı bırakın."
  help: |-
    Kayıtlı bir kanalı veritabanından siler.
    FORCE, silinmeyi bekleyen kanalı kalıcı olarak siler.
    DROP yetkisi olan bir IRCop reddedilmiş kaydı da FORCE ile
    veya FORCE olmadan hemen serbest bırakabilir. FORCE ayrıca DROP_FORCE gerektirir.
  registration_restricted: "\x0304✗\x03 Bu kayıt isteği %date% tarihine kadar kısıtlı."
  force:
    short: "Silinmeyi bekleyen kanalı kalıcı olarak siler."
  success: "\x0303✔\x03 Kanal \x02%channel%\x02 silinmek üzere işaretlendi ve ödemesiz dönem boyunca geri yüklenebilir."
  force_success: "\x0303✔\x03 \x02%channel%\x02 kanalı kalıcı olarak silindi."
  pending_deletion: "\x0304✗\x03 \x02%channel%\x02 kanalı zaten silinmeyi bekliyor. Kalıcı olarak silmek için DROP <#channel> FORCE kullanın."
  invalid_channel: "\x0304✗\x03 Geçersiz kanal adı. \x02#channel\x02 kullanın."
  pending_deletion_reason: "%channel% kanalı siliniyor. Daha fazla bilgi: /msg %bot% \x0303INFO %channel%\x03"


levels:
  syntax: "LEVELS <#channel> {LIST|SET|RESET} [seviye] [değer]"
  example: "%command_prefix%\x02\x0303LEVELS #kanal LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #kanal SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #kanal RESET\x03\x0F"
  short: "Kanal seviyelerini yapılandırın."

  value_range: "\x0304✗\x03 Seviye değeri %min% ile %max% arasında olmalıdır."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#channel> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #kanal LIST\x03\x0F"
    short: "Seviye gereksinimlerini listeleyin."
    help: "Her seviye anahtarını ve değerini gösterir (ayarlanmamışsa varsayılanlar)."
    header: "\x0303%channel% için düzeyler\x03"

  # --- LEVELS SET ----------------------------------------------------------

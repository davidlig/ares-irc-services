  help: "Kanalın otomatik atma kayıtlarını ve isteğe bağlı sürelerini yönetir."
  unknown_sub: "Bilinmeyen alt komut %sub%. ADD, DEL veya LIST kullanın."
  invalid_mask: "Geçersiz maske formatı. Joker karakterler (*) ile nick!ident@host kullanın."
  dangerous_mask: "%mask% maskesi çok geniş. En az 4 alfanümerik karakter içermelidir."
  protected_user: "%nickname% rumuzunun bu kanalda erişimi var."
  max_entries: "Kanal başına maksimum %max% AKICK girişi."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#channel> ADD <maske> [süre] [gerekçe]"
    example: "%command_prefix%AKICK #kanal ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #kanal ADD *!*@* 7d Spam"
    short: "AKICK girişi ekleyin."
    help: |-
      Kanalın otomatik atma listesine bir maske ekler.

      Süre ve gerekçe belirtebilirsiniz. Gerekçe eklerseniz süreyi de belirtmelisiniz:
      0 süresiz, d gün, h saat veya m dakika anlamına gelir.
    done: "AKICK %mask% eklendi."
    already_exists: "AKICK %mask% zaten mevcut."
    notice_channel: "%from% AKICK ekliyor: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#channel> DEL {<maske>|<numara>}"
    example: "%command_prefix%AKICK #kanal DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #kanal DEL 2"
    short: "AKICK girişini kaldırın."
    help: "Tam maske veya LIST'teki giriş numarası ile kaldırın."
    not_found: "AKICK %mask% bulunamadı."
    done: "AKICK %mask% kaldırıldı."
    notice_channel: "%from% AKICK kaldırıyor: %mask%"

  # --- AKICK LIST ----------------------------------------------------------

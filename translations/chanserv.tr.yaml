# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303OP #kanal Alicia\x03\x0F"
  short: "Kanal operatörü modu verin."
  help: "Kanal operatörü modu verin."
  done: "\x0303✔\x03 \x02%nickname%\x02 adlı kullanıcıya kanal operatörü statüsü verildi."
  user_not_on_channel: "\x0304✗\x03 \x02%nickname%\x02 rumuzu ağda değil."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03, \x0314%to%\x03 adlı kullanıcıya \x0304%mode%\x03 veriyor"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#channel> <nickname>"
  example: "%command_prefix%\x02\x0303DEOP #kanal Alicia\x03\x0F"
  short: "Kanal operatörü modunu kaldırın."
  help: "Kanal operatörü modunu kaldırın."
  done: "\x0303✔\x03 \x02%nickname%\x02 adlı kullanıcının op'u alındı."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 SECURE açıkken, \x02%nickname%\x02 \x02%mode%\x02 alabilmek için en az seviye \x02%level%\x02 olmalıdır."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#channel> <seçenek> [değer]"
  example: "%command_prefix%\x02\x0303SET #kanal DESC Bir topluluk kanalı\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #kanal URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #kanal MLOCK ON\x03\x0F"
  short: "Kanal seçeneklerini değiştirin."
  help: |-
    Bir kanal seçeneğini değiştirir. Her seçeneğin yardımı gereksinimleri ve
    çeşitlerini açıklar.
  unknown_option: "\x0304✗\x03 Bilinmeyen seçenek \x02%option%\x02. Şunlardan birini kullanın: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Mevcut kurucunun onaylanmış belirteciyle SET <#kanal> FOUNDER <takma_ad> <token> kullanın."
    token_unavailable: "Mevcut kurucunun onaylanmış kurtarma belirteci yok. Önce kimliğini doğrulamalı ve VERIFY kullanmalıdır."
    syntax: "SET <#kanal> FOUNDER <takma_ad> [token]"
    example: "%command_prefix%\x02\x0303SET #kanal FOUNDER Alicia\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanal FOUNDER Alicia token-confirmado\x03\x0F"
    short: "Kanalı başka bir kayıtlı rumuza devredin."
    help: |-
      Geçerli kurucunun tokenını doğruladıktan sonra kurucuyu değiştirir. Kurucu
      düzeyindeki yönetici istisnası korunur. Token tüketilmez.
    invalid_token: "Kurtarma belirteci geçersiz."
    updated: "\x0303✔\x03 Kurucu \x02%nickname%\x02 olarak değiştirildi."
    throttled: "Çok fazla geçersiz belirteç. %minutes% dakika sonra tekrar deneyin."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 kayıtlı ve etkinleştirilmiş olmalıdır."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 askıya alınmış ve kurucu olarak atanamaz."
    cannot_be_self: "\x0304✗\x03 Yeni kurucu mevcut kurucu olamaz."
    cannot_be_successor: "\x0304✗\x03 Yeni kurucu kanal halefi olamaz."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 maksimum %max% kayıtlı kanal sınırına ulaştı."
    notice_channel: "\x02%from%\x02, \x02%nickname%\x02 adlı kullanıcıyı kanal kurucusu olarak atar."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#channel> SUCCESSOR [nickname]"
    example: "%command_prefix%\x02\x0303SET #kanal SUCCESSOR Alicia\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanal SUCCESSOR\x03\x0F"
    short: "Kanal halefini ayarlayın."
    help: |-
      Bir takma adı kanalın halefi olarak atar. Takma ad belirtilmezse mevcut halef
      silinir. Takma ad kayıtlı ve etkin olmalıdır.
    cleared: "\x0303✔\x03 Halef temizlendi."
    updated: "\x0303✔\x03 Halef \x02%nickname%\x02 olarak ayarlandı."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 kayıtlı ve etkinleştirilmiş olmalıdır."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 askıya alınmış ve halef olarak atanamaz."
    cannot_be_founder: "\x0304✗\x03 Kurucu halef olarak atanamaz."
    notice_channel: "\x02%from%\x02, \x02%nickname%\x02 adlı kullanıcıyı kanal halefi olarak atar."
    notice_channel_cleared: "\x02%from%\x02 kanal halefini temizledi."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#channel> DESC <açıklama>"
    example: "%command_prefix%\x02\x0303SET #kanal DESC Bir topluluk kanalı\x03\x0F"
    short: "Kanal açıklamasını değiştirin."
    help: "Kanal açıklamasını değiştirin (zorunlu)."
    updated: "\x0303✔\x03 Açıklama güncellendi."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#channel> URL [url]"
    example: "%command_prefix%\x02\x0303SET #kanal URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanal URL\x03\x0F"
    short: "Kanal URL'sini ayarlayın."
    help: "Kanalın web adresini değiştirir. Silmek için URL belirtmeyin."
    updated: "\x0303✔\x03 URL güncellendi."
    cleared: "\x0303✔\x03 URL temizlendi."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#kanal> EMAIL [e-posta]"
    example: "%command_prefix%\x02\x0303SET #kanal EMAIL equipo@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanal EMAIL\x03\x0F"
    short: "Kanal e-postasını ayarlayın."
    help: |-
      Kanalın e-posta adresini değiştirir. Silmek için adres belirtmeyin.
      Yönetim tarafından engellenen e-posta alan adları kullanılamaz.
      Yönetim istisnası: kurucu düzeyinde erişimi olan operatörler.
    invalid: "\x0304✗\x03 Geçersiz e-posta adresi."
    updated: "\x0303✔\x03 E-posta güncellendi."
    cleared: "\x0303✔\x03 E-posta temizlendi."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#kanal> ENTRYMSG [mesaj]"
    example: "%command_prefix%\x02\x0303SET #kanal ENTRYMSG Hoş geldiniz\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanal ENTRYMSG\x03\x0F"
    short: "Kanal giriş mesajını ayarlayın."
    help: "Kanal giriş mesajını (NOTICE) ayarlar. Silmek için mesaj belirtmeyin."
    updated: "\x0303✔\x03 Giriş mesajı güncellendi."
    too_long: "\x0304✗\x03 Giriş mesajı %max% karakteri aşamaz."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#channel> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanal TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanal TOPICLOCK OFF\x03\x0F"
    short: "Kanal başlığını kilitleyin."
    help: |-
      Kanal konusunun değiştirilmesini engeller. Etkinleştirildiğinde mevcut konu
      kaydedilir ve kilitlenir.
    on: "\x0303✔\x03 Başlık kilidi şimdi AÇIK."
    off: "\x0303✔\x03 Başlık kilidi şimdi KAPALI."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 TOPICLOCK özelliğini etkinleştiriyor."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 TOPICLOCK özelliğini devre dışı bırakıyor."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#channel> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanal MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanal MLOCK OFF\x03\x0F"
    short: "Kanal modlarını kilitleyin."
    help: "Mevcut kanal modlarını (örn. +nt) kilitler. ON durumunda, modlar değiştirilemez."
    no_modes: "mod yok"
    on: "\x0303✔\x03 MLOCK şimdi AÇIK (%modes%)."
    off: "\x0303✔\x03 MLOCK şimdi KAPALI."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 MLOCK özelliğini etkinleştiriyor (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 MLOCK özelliğini devre dışı bırakıyor."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#channel> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanal PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanal PRIVATE OFF\x03\x0F"
    short: "Kanal bilgilerini erişimi olmayan kullanıcılardan gizleyin."
    help: |-
      Açık olduğunda kanal bilgilerini yalnızca kurucu ve erişimi olan kullanıcılar
      görebilir.
    on: "\x0303✔\x03 Kanal bilgileri artık gizli."
    off: "\x0303✔\x03 Kanal bilgileri artık herkese açık."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#channel> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanal SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanal SECURE OFF\x03\x0F"
    short: "Kanal rütbeleri için erişim listesi gerektirin."
    help: "Erişim listesinde olmayan takma adlara kanalda rütbe verilmesini engeller."
    on: "\x0303✔\x03 SECURE şimdi AÇIK."

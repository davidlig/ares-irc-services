# Traducións de mensaxes comúns — Galego
# Dominio: common
#
# Códigos de formato IRC (comiñas dobres ou bloques literais !irc):
#   \x02        activa/desactiva a negra
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermello, 07=laranxa, 14=gris escuro)
#   \x03        restablece a cor
#   \x0F        restablece todo o formato
#
# As cores IRC usan números DECIMAIS (0-15), non hexadecimais.
#   \x0314 = gris escuro (14 decimal): CORRECTO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multiliña: !irc |- con saltos físicos e espazos reais.
# Os bloques sen etiqueta non descodifican escapes; conserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O presentador engade /msg sen cor e unha marxe de dous espazos.

# --- UNKNOWN COMMAND -------------------------------------------------------
unknown_command: "\x0304✗\x03\x0F Comando descoñecido \x0303%command%\x03\x0F. Usa /msg %bot% \x0303HELP\x03\x0F"

# --- UNKNOWN HELP OPTION ---------------------------------------------------
unknown_help_option: "\x0304✗\x03\x0F Opción de axuda \x0303%option%\x03\x0F descoñecida para \x0303%command%\x03\x0F. Usa /msg %bot% \x0303HELP %command%\x03\x0F"

# --- ERROR -----------------------------------------------------------------
error:
  email_domain_blocked: "Este dominio de correo está bloqueado administrativamente."
  syntax: "Sintaxe incorrecta. Uso: %syntax%"
  oper_only: "Este comando está restrinxido a operadores de IRC."
  not_identified: "Non te identificaches. Usa /msg %nickserv% IDENTIFY <alcume> <contrasinal>"
  permission_denied: "Permiso denegado. Non ten acceso a este comando."
  mail_failed: "Non se puido enviar o correo electrónico. Comprobe o seu enderezo ou tenteo de novo máis tarde."
  channel_not_registered: "A canle %channel% non está rexistrada."
  nick_not_registered: "O alcume %nickname% non está rexistrado."
  insufficient_access: "Acceso insuficiente para %operation% na canle %channel%."
  nick_not_online: "O alcume %nickname% non está conectado."

# --- DURATION --------------------------------------------------------------
duration:
  unit:
    year:
      singular: "ano"
      plural: "anos"
    month:
      singular: "mes"
      plural: "meses"
    day:
      singular: "día"
      plural: "días"
    hour:
      singular: "hora"
      plural: "horas"
    minute:
      singular: "minuto"
      plural: "minutos"
    second:
      singular: "segundo"
      plural: "segundos"
  list_separator: ", "
  list_join: "%prefix% e %last%"

# --- ANTIFLOOD -------------------------------------------------------------
antiflood:
  blocked: "Excedeu o límite de velocidade de comandos. Ténteo de novo en %seconds% segundos."
  debug_channel: "%nick% límite de %command% alcanzado para %host% (quedan %seconds%s)"

# --- CTCP ------------------------------------------------------------------
ctcp:
  version:
    tribute: |
      \x02Para o meu leal e eterno amigo,\x02

      Aínda que 2023 foi o ano no que tivemos que dicirnos adeus, o tempo non
      borrou nin un só detalle de ti. Aínda lembro a túa enerxía inesgotable, a túa
      mirada nobre e esa alegría inmensa e contaxiosa que só ti sabías transmitir.

      Enchiches a miña casa de vida e a miña vida dun amor incondicional que nunca
      esquecerei. Aínda que xa non escoite os teus pasos correndo a recibirme nin
      sinta a túa cabeza apoiándose en min buscando agarimo, sei que o teu espíritoxoguetón segue acompañándome.

      Grazas por cada momento, por cada trasnada e por ser o mellor compañeiro que
      podería desexar. O espazo que deixaches ao meu lado está agora cheo dos
      recordos máis felices. Sempre serás o meu gran amigo e sempre terás un lugar
      inmenso no meu corazón.


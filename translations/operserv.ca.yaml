# Traduccions de OperServ — Català
# Domini: operserv
#
# Codis de format IRC (cometes dobles o blocs literals !irc):
#   \x02        activa/desactiva la negreta
#   \x03NN      color (DECIMAL: 03=verd, 04=vermell, 07=taronja, 14=gris fosc)
#   \x03        restableix el color
#   \x0F        restableix tot el format
#
# Els colors IRC usen números DECIMALS (0-15), no hexadecimals.
#   \x0314 = gris fosc (14 decimal): CORRECTE
#   \x030F = color 0 seguit de la lletra F: ERROR
#
# Text IRC multilínia: !irc |- amb salts físics i espais reals.
# Els blocs sense etiqueta no descodifiquen escapes; conserva els literals CTCP.
# Exemples HELP: example/examples i %command_prefix%.
# El presentador afegeix /msg sense color i un marge de dos espais.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "Aquesta ordre està restringida als administradors root de la xarxa."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [ordre] [opció]"
  short: "Llistar les ordres o mostrar l'ajuda d'una ordre."
  help: |-
    Sense arguments, llista totes les ordres. Fes servir
    %help_command% per a l'ajuda completa, o bé
    %help_option_command% per a les subopcions.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permet gestionar els operadors de la xarxa i els
    seus permisos, aplicar restriccions d'accés i
    desconnectar usuaris. També permet enviar comunicats
    generals i gestionar els missatges de benvinguda.
  general_header: "Comandes disponibles:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opcions:"
  examples_header: "Exemples:"
  general_help_command: "HELP <comanda>"
  option_help_command: "HELP %command% <opció>"
  detail_help_command: "HELP <ordre>"
  detail_help_option_command: "HELP <ordre> <opció>"
  general_footer: "Fes servir /msg %bot% %help_command% per obtenir més informació."
  set_sub_footer: "Fes servir /msg %bot% %help_command% per obtenir més informació."
  syntax_label: "Sintaxi: %syntax%"
  footer: ""
  intro_expiration: |-
    NOTA: Els nicks inactius més de %days% dies
    s'eliminen automàticament.
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operadors i rols"
    network_security: "Seguretat de xarxa"
    communication: "Comunicació"
    low_level: "Baix nivell"
  ircop_header: "Comandes disponibles per als IRCops:"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <nickname> <rol>|DEL <nickname>|LIST}"
  short: "Gestionar els operadors d'IRC de la xarxa."
  help: |-
    Gestiona els operadors d'IRC de la xarxa. ADD afegeix un sobrenom registrat
    com a operador amb el rol especificat.
    DEL treu un operador. LIST mostra tots els operadors.
    Utilitzeu ROLE LIST per veure els rols disponibles.
    Aquesta ordre està restringida als usuaris Root configurats als serveis.
  example: "%command_prefix%IRCOP ADD Anna OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Subordre desconeguda %sub%. Utilitzeu ADD, DEL o LIST."
  unknown_role: "El rol %role% no existeix. Fes servir /msg %bot% %role_list% per veure els rols disponibles."
  already_admin: "%nickname% ja és un operador d'IRC (rol: %role%)."
  not_admin: "%nickname% no és un operador d'IRC."
  role_changed: "Rol canviat de %nickname% de %old% a %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nickname> <role>"
    short: "Afegir un operador d'IRC de xarxa."
    help: |-
      Afegeix un sobrenom registrat com a operador d'IRC de xarxa.
      Utilitzeu ROLE LIST per veure els rols disponibles.
      Aquesta ordre està restringida als usuaris Root.
    example: "%command_prefix%IRCOP ADD Anna OPER"
    done: "Afegit %nickname% com a %role%."
    nick_not_active: "El sobrenom %nickname% no és un sobrenom registrat actiu."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nickname>"
    short: "Treure un operador d'IRC de xarxa."
    help: |-
      Treu un operador d'IRC de xarxa de la llista.
      Aquesta ordre està restringida als usuaris Root.
    example: "%command_prefix%IRCOP DEL Anna"
    done: "Tret %nickname% dels operadors d'IRC."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Llistar tots els operadors d'IRC de xarxa."
    help: |-
      Llista tots els operadors d'IRC de xarxa amb els seus rols i data de registre.
      Aquesta ordre està restringida als usuaris Root.
    example: "%command_prefix%IRCOP LIST"
    header: "Operadors d'IRC de la xarxa"
    empty: "No hi ha operadors d'IRC."

# --- ROLE ------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rol>|SET <rol> [operclass]}"
    short: "Configura la classe d'operador d'UnrealIRCd."
    help: |-
      Permet consultar i configurar l'operclass d'un rol.

      %options_header%
      %option_LIST%Mostra les operclasses disponibles a la xarxa.
      %option_VIEW%Mostra l'operclass del rol i les disponibles.
      %option_SET%Assigna l'operclass als IRCOP quan s'identifiquen.

      Omet el valor per eliminar-la.

      Només disponible amb protocols UnrealIRCd.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SUPORT"
      - "%command_prefix%ROLE OPERCLASS SET SUPORT services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SUPORT"
    list:
      header: "Operclasses Disponibles a la Xarxa"
      empty: "No hi ha operclasses disponibles a la xarxa."
      not_supported: "El protocol actual no suporta llistar operclasses disponibles."
    view:
      empty: "El rol %role% no té operclass."
      line: "Operclass: %operclass%"
      available: "Operclasses disponibles: %available%"
    set:
      done: "S'ha configurat l'operclass per al rol %role%."
      cleared: "S'ha eliminat l'operclass del rol %role%."
      not_available: "L'operclass %operclass% no està disponible a la xarxa. Operclasses disponibles: %available%."
  syntax: "ROLE {ADD <name> [description]|DEL <name>|LIST|PERMS {{ADD|DEL} <rol> <permís>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modes]}|VHOST {VIEW <rol>|SET <rol> [vhost]}}"
  short: "Permet gestionar els rols d'operador, els seus permisos i la configuració."
  help: |-
    Permet gestionar els rols d'operador, els seus permisos i la configuració.

    Els rols ADMIN, OPER i PREOPER estan protegits i no es poden eliminar.
    Ordre exclusiva per a usuaris Root.
  syntax_operclass: "ROLE {ADD <name> [description]|DEL <name>|LIST|PERMS {{ADD|DEL} <rol> <permís>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modes]}|VHOST {VIEW <rol>|SET <rol> [vhost]}|OPERCLASS {LIST|VIEW <name>|SET <name> [operclass]}}"
  help_operclass: |-
    Permet gestionar els rols d'operador, els seus permisos i la configuració.

    Els rols ADMIN, OPER i PREOPER estan protegits i no es poden eliminar.
    Ordre exclusiva per a usuaris Root.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SUPORT Operadors d'assistència"
  unknown_sub: "Subordre desconeguda %sub%. Utilitzeu ADD, DEL, LIST, PERMS, MODES, o VHOST."
  unknown_sub_operclass: "Subordre desconeguda %sub%. Utilitzeu ADD, DEL, LIST, PERMS, MODES, VHOST o OPERCLASS."
  not_found: "El rol %role% no existeix."
  already_exists: "El rol %role% ja existeix."
  protected: "El rol %role% està protegit i no es pot esborrar."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <name> [description]"
    short: "Crear un nou rol."
    help: |-
      Crea un nou rol personalitzat. La descripció és opcional.
      Aquesta ordre està restringida als usuaris Root.
    example: "%command_prefix%ROLE ADD SUPORT Operadors d'assistència"
    done: "Creat el rol %role%."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <name>"
    short: "Esborrar un rol."
    help: |-
      Esborra un rol personalitzat. Els rols protegits (ADMIN, OPER, PREOPER)
      no es poden esborrar. Si el rol té operadors assignats,
      els haureu de reassignar primer.
      Aquesta ordre està restringida als usuaris Root.
    example: "%command_prefix%ROLE DEL SUPORT"
    done: "Esborrat el rol %role%."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Mostra els rols disponibles."
    help: |-
      Llista tots els rols. Els rols protegits estan marcats amb [PROTEGIT].
      Aquesta ordre està restringida als usuaris Root.
    example: "%command_prefix%ROLE LIST"
    header: "Rols d'operador"
    empty: "No hi ha rols d'operador."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rol> <permís>|{LIST|CLEAR} <rol>}"
    short: "Gestiona els permisos del rol."
    help: |-
      Gestiona els permisos assignats a un rol.

      %options_header%
      %option_LIST%Mostra tots els permisos disponibles i indica quins té assignats
                      el rol.
      %option_ADD%Assigna un permís al rol.
      %option_DEL%Elimina un permís del rol (no en els rols protegits).
      %option_CLEAR%Elimina tots els permisos del rol.

      %assigned_status% indica que el permís està assignat; %unassigned_status% indica que està disponible.

      Fes servir ALL per afegir tots els permisos disponibles alhora.
      Aquesta ordre està restringida als usuaris Root.
    example: "%command_prefix%ROLE PERMS LIST SUPORT"
    examples:
      - "%command_prefix%ROLE PERMS ADD SUPORT operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SUPORT ALL"
      - "%command_prefix%ROLE PERMS DEL SUPORT operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SUPORT"
    not_found: "El permís %perm% no existeix."
    already_has: "El rol %role% ja té el permís %perm%."
    does_not_have: "El rol %role% no té el permís %perm%."
    list:
      header: "Llista de permisos de %role%"
      columns: "Assignat | Clau del permís | Descripció"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Afegit el permís %perm% al rol %role%."
      all_done: "Afegits %count% permisos al rol %role%."
    del:
      done: "Tret el permís %perm% del rol %role%."
    clear:
      done: "Tretes %count% permisos del rol %role%."
      empty: "El rol %role% no té cap permís assignat."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rol>|SET <rol> [modes]}"
    short: "Configura els modes d'usuari del rol."
    help: |-
      Gestiona els modes d'usuari IRCOP assignats a un rol.

      %options_header%
      %option_VIEW%Mostra els modes actuals del rol.
      %option_SET%Estableix els modes IRCOP.

      Omet els modes per eliminar-los tots.

      Els usuaris amb aquest rol rebran aquests modes quan s'identifiquin.
      Modes disponibles segons l'IRCd
      Aquesta ordre està restringida als usuaris Root.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Modes de %role%"
      empty: "El rol %role% no té cap mode assignat."
      line: "Modes: %modes%"
    set:
      done: "Establerts els modes %modes% per al rol %role%."
      cleared: "Tots els modes han estat trets del rol %role%."
      invalid_mode: "El mode %mode% no és un mode IRCOP vàlid."
      invalid_modes: "Modes no vàlids: %invalid%. Modes vàlids: %valid%."
      no_irc_user_modes: "L'IRCD actual no té modes IRCOP configurats."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rol>|SET <rol> [vhost]}"
    short: "Configura el patró d'host virtual del rol."
    help: |-
      Permet configurar l'host virtual que reben els operadors d'un rol quan
      s'identifiquen, en substitució del seu host personal.

      L'host es genera combinant el sobrenom sense caràcters especials amb el
      patró configurat. Per exemple:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Mostra el patró configurat per a un rol.
      %option_SET%Estableix o elimina el patró d'un rol.

      El patró només admet lletres, números, guions i punts. Ha de contenir
      almenys un punt, no pot començar ni acabar amb guió o punt,
      ni contenir punts consecutius.

      Per eliminar l'host forçat, fes servir SET sense indicar cap patró.

      Ordre exclusiva per a usuaris Root.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Vhost forçat de %role%"
      empty: "El rol %role% no té cap patró de vhost forçat establert."
      line: "Patró: %pattern%"
      example: "Exemple: %example_nickname%.%pattern%"
      example_nickname: "nickname"
    set:
      done: "Establert el patró de vhost forçat per al rol %role%."
      cleared: "Tret el patró de vhost forçat del rol %role%."
      invalid: "Patró de vhost no vàlid. Caràcters vàlids: a-z, A-Z, 0-9, - i .. Ha de tenir almenys un punt, no pot començar/acabar amb - o . ni tenir .."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <nickname> <motiu>"
  short: "Desconnectar forçosament un usuari de la xarxa."
  help: |-
    Desconnecta un usuari de la xarxa IRC.
    No es pot expulsar amb KILL els IRCops ni els usuaris Root.
  example: "%command_prefix%KILL UsuariDolent Inundació als canals"
  protected_root: "No es pot matar l'usuari Root %nickname%."
  protected_ircop: "No es pot matar l'operador d'IRC %nickname%."
  done: "L'usuari %nickname% ha estat mort (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <mask> <expiry> <motiu>|DEL {<mask>|<number>}|LIST [mask]}"
  short: "Gestionar les G-lines de tota la xarxa."
  help: |-
    Gestiona les G-lines (prohibicions globals) de la xarxa.
    ADD afegeix una G-line nova amb màscara, caducitat i motiu.
    DEL elimina una G-line per màscara o número d'entrada.
    LIST mostra totes les G-lines i es pot filtrar per màscara.

    Format de caducitat: 0 = permanent, o bé sufix d, h, m (p. ex. 7d, 12h, 30m).
    Es rebutgen les G-lines que coincideixin amb usuaris Root o IRCop.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abús de correu brossa"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abús persistent"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Subordre desconeguda %sub%. Utilitzeu ADD, DEL o LIST."
  invalid_mask: "Format de màscara no vàlid. Ha de tenir el format user@host (p. ex., *@192.168.*)."
  global_mask: "La màscara de G-line %mask% és massa àmplia. No es permeten màscares globals."
  dangerous_mask: "La màscara de G-line %mask% és massa àmplia. La part de l'amfitrió necessita almenys 4 caràcters alfanumèrics."
  protected_user: "No es pot posar G-line a l'usuari protegit %nickname%."
  invalid_expiry: "Format de caducitat no vàlid. Utilitzeu 0 per a permanent, o un valor com 7d, 12h, 30m."
  already_exists: "La G-line per a %mask% ja existeix."
  max_entries: "Nombre màxim de G-lines (%max%) assolit."
  not_found: "G-line %mask% no trobada."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <mask> <expiry> <motiu>"
    short: "Afegir una G-line de tota la xarxa."
    help: |-
      Afegeix una G-line (prohibició global) a la xarxa.
      La màscara ha de tenir el format usuari@host.
      Caducitat: 0 = permanent, o bé sufix d, h, m (p. ex. 7d, 12h, 30m).
      Es rebutgen les G-lines que coincideixin amb usuaris Root o IRCop.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abús de correu brossa"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abús persistent"
    done: "G-line afegida: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<mask>|<number>}"
    short: "Treure una G-line."
    help: |-
      Elimina una G-line de la llista.
      Pots indicar-ne la màscara o el número d'entrada de LIST.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% treta."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [mask]"
    short: "Llistar totes les G-lines."
    help: "Llista totes les G-lines. També es pot filtrar per patró de màscara."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-lines (%count%)"
    empty: "No hi ha G-lines."
    entry: "%index%. %mask% - %reason% (%nickname%, expira: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {service|nick!ident@vhost} {PRIVMSG|NOTICE} <message>"
  short: "Enviar un missatge global a tots els usuaris connectats."
  help: |-
    Permet enviar missatges a tots els usuaris
    connectats amb un servei existent o un client temporal
    amb identitat personalitzada.

    Els missatges es poden enviar com a PRIVMSG (privat)
    o NOTICE (avís).

    Per fer servir un client temporal, indica una màscara
    amb el format sobrenom!ident@vhost i caràcters vàlids
    en cada camp.

    El sobrenom no pot estar registrat ni en ús. El client
    es desconnecta després de l'enviament i el sobrenom
    queda bloquejat durant 24 hores.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Manteniment d'aquí a 10 minuts"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE La xarxa es reiniciarà"
  mask_invalid: "Format de màscara no vàlid: %error%"
  nick_connected: "El sobrenom %nickname% està connectat actualment."
  nick_registered: "El sobrenom %nickname% està registrat."
  type_invalid: "El tipus de missatge ha de ser PRIVMSG o NOTICE."
  done: "Missatge global enviat des de %nickname% a %count% usuaris."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <line>"
  short: "Enviar una línia de protocol en brut a l'IRCd."
  help: |-
    Envia directament la línia indicada al sòcol de l'IRCd d'enllaç.
    Fes-ho amb molta precaució. Les línies de protocol no vàlides poden bloquejar la
    xarxa.
  example: "%command_prefix%RAW :services.ares NOTICE * :Manteniment programat"
  empty: "Heu d'especificar una línia no buida per enviar."
  too_long: "La línia és massa llarga. Màxim 510 caràcters."
  not_connected: "No està connectat a l'IRCd."
  done: "Línia en brut enviada."
  protocol:
    syntax: "El protocol actiu ha rebutjat la sintaxi de l’ordre RAW."
    done: "Ordre RAW gestionada pel protocol executada."
    target: "El protocol actiu ha rebutjat la destinació %target%."
    unsupported: "El protocol actiu no admet aquesta ordre RAW."
    invalid_resource_type: "Tipus de recurs de protocol desconegut: %resource_type%."
    invalid_resource: "Recurs de protocol no vàlid: %resource%."
    invalid_value: "Valor no vàlid per al recurs de protocol: %resource%."
    error: "El protocol actiu no ha pogut executar l’ordre RAW."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator% executa l'ordre GLOBAL amb el sobrenom %target% via %type% a %count% usuaris. Missatge: %message%"
  prefix_message: "Missatge: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Gestionar els missatges MOTD enviats als usuaris en connectar-se."
  syntax: "MOTD {ADD <destinació> {PRIVMSG|NOTICE} <expiry> <missatge>|DEL <id>|LIST|CLEAN}"
  help: |-
    Gestiona les entrades del missatge del dia (MOTD) que s'envien quan un usuari
    es connecta a la xarxa.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Subordre desconeguda. Utilitzeu: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {service|nick!ident@vhost} {PRIVMSG|NOTICE} <expiry> <message>"
    syntax_hint: "Ús: %syntax%"
    short: "Afegir una entrada MOTD."
    help: |-
      Afegeix un missatge MOTD nou que s'enviarà a cada usuari quan es connecti a
      la xarxa.
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Manteniment aquesta nit"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG Benvingut a la xarxa"
    done: "Entrada MOTD #%id% afegida."
    invalid_type: "Tipus de missatge no vàlid. Ha de ser PRIVMSG o NOTICE."
    invalid_expiry: "El format de caducitat no és vàlid. Fes servir: <número><s|m|h|d> o 0 per indicar que no caduca (p. ex. 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Ús: %syntax%"
    short: "Esborrar una entrada MOTD."
    help: "Elimina una entrada MOTD pel seu ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "Entrada MOTD #%id% esborrada."
    not_found: "Entrada MOTD no trobada."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Llistar totes les entrades MOTD."
    help: "Llista totes les entrades MOTD configurades."
    example: "%command_prefix%MOTD LIST"
    empty: "No hi ha entrades MOTD configurades."
    header: "Entrades MOTD:"
    status_enabled: "activat"
    status_disabled: "desactivat"
    expired: "expirat"
    no_bot: "(sense bot)"
    shown_count: "mostrat %count% vegades"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Treure totes les entrades MOTD expirades."
    help: "Elimina totes les entrades MOTD que ja hagin caducat."
    example: "%command_prefix%MOTD CLEAN"
    done: "S'han tret %count% entrades MOTD expirades."
    none: "No hi ha entrades MOTD expirades per treure."
  debug:

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <domini> <motiu>|DEL {número|ALL}|LIST <patró> [pàgina]}"
  short: "Administrar dominis de correu bloquejats."
  help: |-
    Administrar dominis de correu bloquejats.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <domini> <motiu>"
    short: "Bloquejar un domini."
    help: |-
      Accepta dominis ASCII o punycode, no adreces ni patrons. El motiu és
      obligatori. El bloqueig és exacte i no inclou subdominis.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {número|ALL}"
    short: "Eliminar dominis bloquejats."
    help: |-
      Elimina un identificador permanent o totes les entrades amb ALL. Els
      altres identificadors no canvien.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <patró> [pàgina]"
    short: "Llistar dominis bloquejats."
    help: |-
      El patró és obligatori. Només * és un comodí i coincideix amb
      qualsevol seqüència. No distingeix majúscules. La pàgina opcional
      comença a 1. Els identificadors es conserven en filtrar i paginar.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Domini invàlid. Usa ASCII o punycode, sense punt final."
  invalid_reason: "Cal un motiu administratiu no buit i d’una sola línia."
  duplicate: "Aquest domini ja està bloquejat."
  not_found: "No hi ha cap domini bloquejat amb aquest identificador."
  added: "Domini %domain% bloquejat."
  deleted: "Domini bloquejat %id% eliminat."
  cleared: "S’han eliminat %total% dominis bloquejats."
  empty: "Cap domini bloquejat coincideix."
  header: "ID | Domini | Motiu"
  page: "Pàgina %page%/%pages%, %total% dominis coincidents."
  row: "%id% | %domain% | %reason%"

  not_identified: "Ez zaude identifikatuta. Erabili /msg %nickserv% IDENTIFY <ezizena> <pasahitza>"
  permission_denied: "Baimena ukatuta. Ez duzu komando honetarako sarbiderik."
  mail_failed: "Ezin izan da posta elektronikoa bidali. Egiaztatu zure helbidea edo saiatu berriro geroago."
  channel_not_registered: "%channel% kanala ez dago erregistratuta."
  nick_not_registered: "%nickname% ezizena ez dago erregistratuta."
  insufficient_access: "Ez duzu nahikoa sarbide %operation% egiteko %channel% kanalean."
  nick_not_online: "%nickname% ezizena ez dago konektatuta."

# --- DURATION --------------------------------------------------------------
duration:
  unit:
    year:
      singular: "urte"
      plural: "urte"
    month:
      singular: "hilabete"
      plural: "hilabete"
    day:
      singular: "egun"
      plural: "egun"
    hour:
      singular: "ordu"
      plural: "ordu"
    minute:
      singular: "minutu"
      plural: "minutu"
    second:
      singular: "segundo"
      plural: "segundo"
  list_separator: ", "
  list_join: "%prefix% eta %last%"

# --- ANTIFLOOD -------------------------------------------------------------
antiflood:
  blocked: "Komando tasa muga gainditu duzu. Saiatu berriro %seconds% segundotan."
  debug_channel: "%nick%-(r)en %command% muga iritsi da %host%-(e)ntzat (%seconds%s geratzen dira)"

# --- CTCP ------------------------------------------------------------------
ctcp:
  version:
    tribute: |
      \x02Nire lagun leial eta betierekoarentzat,\x02

      2023a agur esan behar izan genuen urtea izan zen arren, denborak ez du zure
      xehentasun bakar bat ere ezabatu. Oraindik gogoan ditut zure energia agortezina,
      begirada noble eta zuk bakarrik eman zenezakeen poz handi eta kutsakorra.

      Nire etxea bizitzaz bete zenuen, eta nire bizitza inoiz ahaztuko ez dudan
      baldintzarik gabeko maitasunez. Jada ez ditut zure urratsak entzuten ni
      agurtzera korrika etortzen, ezta zure burua nire gainean jartzen sentitzen
      laztan bila; baina badakit zure izpiritu jostalariak laguntzen jarraitzen didala.

      Eskerrik asko une bakoitzagatik, bihurrikeria bakoitzagatik eta eskatu ahal izan
      dudan lagunik onena izateagatik. Nire ondoan utzi zenuen lekua oroitzapen
      zoriontsuenez beteta dago orain. Beti izango zara nire lagun maitea, eta beti
      izango duzu leku handi bat nire bihotzean.


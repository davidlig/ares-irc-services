# MemoServ itzulpenak — Euskara
# Domeinua: memoserv
#
# IRC formatu-kodeak (komatxo bikoitzak edo !irc bloke literalak):
#   \x02        letra lodia aktibatu/desaktibatu
#   \x03NN      kolorea (HAMARTARRA: 03=berdea, 04=gorria, 07=laranja, 14=gris iluna)
#   \x03        kolorea berrezarri
#   \x0F        formatu osoa berrezarri
#
# IRC koloreek zenbaki HAMARTARRAK (0-15) erabiltzen dituzte, ez hamaseitarrak.
#   \x0314 = gris iluna (14 hamartarra): ZUZENA
#   \x030F = 0 kolorea eta ondoren F letra: OKERRA
#
# Lerro anitzeko IRC testua: !irc |- benetako lerro-jauzi eta zuriuneekin.
# Etiketarik gabeko blokeek ez dituzte ihesak deskodetzen; gorde CTCP literalak.
# HELP adibideak: example/examples eta %command_prefix%.
# Aurkezleak kolorerik gabeko /msg eta bi zuriuneko marjina gehitzen ditu.

# --- SEND ------------------------------------------------------------------
send:
  syntax: "SEND {ezizena|#kanala} <mezua>"
  short: "Bidali mezu bat ezizen edo kanal batera."
  help: |-
    Mezua bidaltzen dio ezizen erregistratu bati edo kanal bati. Hartzaileak
    mezu-zerbitzua gaituta eduki behar du (ENABLE).
  example: "%command_prefix%SEND Ane Kaixo, berrikus dezakezu memo hau?"
  examples:
    - "%command_prefix%SEND #laguntza Kanalaren oharra"
  sent_nick: "Mezua %nickname%(r)i bidali zaio."
  sent_channel: "Mezua %channel% kanalera bidali da."
  throttled: "%seconds% segundo itxaron behar duzu beste mezu bat bidali aurretik."
  limit_reached: "%target%(r)entzako mezu muga iritsi da."
  ignored: "Ezin diozu mezu bidali helburu honi, bere baztertze zerrendan zaude."
  cannot_send_to_self: "Ezin diozu mezu bat bidali zeure buruari."
  message_too_long: "Mezua luzeegia da. Gehienez %max% karaktere onartzen dira."
  service_disabled_for_target: "Mezu zerbitzua desgaituta dago %target%(r)entzat."

# --- READ ------------------------------------------------------------------
read:
  syntax: "READ [#kanala] <zenbakia>"
  short: "Irakurri mezu bat zenbakiaren arabera."
  help: |-
    Emandako zenbakiko mezua irakurtzen du. #kanalik gabe, zure ezizenaren
    sarrera-ontzitik irakurtzen du; #kanalarekin, MEMOREAD maila behar da.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #laguntza 2"
  header: "#%index% mezua %from%(e)k bidalia:"
  footer: "%separator% %date%"
  not_found: "#%index% mezua ez da aurkitu."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST [#kanala]"
  short: "Zerrendatu mezuak (irakurri gabeak * gorriaz markatuta)."
  help: |-
    Zure mezuak edo kanalekoak zerrendatzen ditu. Irakurri gabekoek izartxo
    gorria eta aurrebista dituzte (gehienez 50 karaktere). #kanalik gabe = zure
    sarrera-ontzia; #kanalarekin MEMOREAD behar da.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #laguntza"
  header: "%target%(r)en mezuak:"
  empty: "Ez dago mezurik %target%(r)entzat."

# --- DEL -------------------------------------------------------------------
del:
  syntax: "DEL [#kanala] <zenbakia>"
  short: "Ezabatu mezu bat zenbakiaren arabera."
  help: "Emandako zenbakiko mezua ezabatzen du. Kanalentzat MEMOCHANGE maila behar du."
  example: "%command_prefix%DEL 1"
  examples:
    - "%command_prefix%DEL #laguntza 2"
  deleted: "#%index% mezua ezabatu da."
  not_found: "#%index% mezua ez da aurkitu."

# --- IGNORE ----------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#kanala] <ezizena>|DEL [#kanala] <ezizena>|LIST [#kanala]}"
  short: "Kudeatu mezuetarako baztertze zerrenda."
  help: |-
    Kudeatu mezurik jaso nahi ez duzun ezizenen zerrenda, zure kontuan zein
    erregistratutako kanal batean. Kanalaren zerrenda aldatzeko MEMOCHANGE baimena
    behar duzu.
  example: "%command_prefix%IGNORE ADD Ane"
  examples:
    - "%command_prefix%IGNORE DEL #laguntza Ane"
    - "%command_prefix%IGNORE LIST #laguntza"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#kanala] <ezizena>"
    short: "Gehitu ezizen bat baztertuen zerrendara."
    help: "Ezizen honen mezuak ez dira onartuko zure sarrera-ontzirako (edo kanalarenak)."
    example: "%command_prefix%IGNORE ADD Ane"
    examples:
      - "%command_prefix%IGNORE ADD #laguntza Ane"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#kanala] <ezizena>"
    short: "Kendu ezizen bat zerrendatik."
    help: "Ezizena baztertze zerrendatik kentzen du."
    example: "%command_prefix%IGNORE DEL Ane"
    examples:
      - "%command_prefix%IGNORE DEL #laguntza Ane"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#kanala]"
    short: "Erakutsi baztertutako ezizenak."
    help: "Zuk (edo kanalak) mezuetarako baztertzen dituzun ezizenen zerrenda erakusten du."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #laguntza"
  added: "%nickname% baztertze zerrendara gehitu da."
  removed: "%nickname% baztertze zerrendatik kendu da."
  already_ignored: "%nickname% jada baztertze zerrendan dago."
  not_ignored: "%nickname% ez dago baztertze zerrendan."
  limit_reached_nick: "Zure ezizenarentzat baztertze zerrendaren muga iritsi da (gehienez %limit%)."
  limit_reached_channel: "%channel% kanalarentzat baztertze zerrendaren muga iritsi da (gehienez %limit%)."
  list_empty: "Baztertze zerrenda hutsik dago."
  list_header: "Baztertze zerrenda:"

# --- ENABLE ----------------------------------------------------------------
enable:
  syntax: "ENABLE [#kanala]"
  short: "Gaitu mezuen harrera."
  help: "Gaitu mezuak zure ezizenarentzat; kanaletan, sortzaileak bakarrik gaitu dezake."
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #laguntza"
  enabled_nick: "Mezu zerbitzua gaituta zure ezizenarentzat."
  enabled_channel: "Mezu zerbitzua gaituta %channel% kanalerako."
  already_enabled_nick: "Mezu zerbitzua jada gaituta dago zure ezizenarentzat."
  already_enabled_channel: "Mezu zerbitzua jada gaituta dago %channel% kanalerako."
  founder_only: "Kanal sortzaileak soilik gaitu ditzake mezuak %channel% kanalerako."

# --- DISABLE ---------------------------------------------------------------
disable:
  syntax: "DISABLE [#kanala]"
  short: "Desgaitu mezuen harrera."
  help: |-
    Desgaitu zure ezizen edo kanalerako mezuak. Kanaletan, sortzaileak bakarrik
    desgaitu dezake.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #laguntza"
  disabled_nick: "Mezu zerbitzua desgaituta zure ezizenarentzat."
  disabled_channel: "Mezu zerbitzua desgaituta %channel% kanalerako."
  already_disabled_nick: "Mezu zerbitzua jada desgaituta dago zure ezizenarentzat."
  already_disabled_channel: "Mezu zerbitzua jada desgaituta dago %channel% kanalerako."
  founder_only: "Kanal sortzaileak soilik desgaitu ditzake mezuak %channel% kanalerako."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [komandoa] [aukera]"
  short: "Zerrendatu komandoak edo erakutsi komando baten laguntza."
  help: "Erakutsi komandoen zerrenda edo komando edo aukera baten laguntza zehatza."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Erregistratutako erabiltzaileen artean mezuak bidali eta jasotzeko eta
    kanaletara oharrak bidaltzeko aukera ematen du. Mezuak geroago kontsultatzeko
    gordetzen dira, hartzailea konektatuta ez badago ere.
  general_header: "Komando erabilgarriak:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Aukerak:"
  examples_header: "Adibideak:"
  general_help_command: "HELP <komandoa>"
  option_help_command: "HELP %command% <aukera>"
  general_footer: "Erabili /msg %bot% %help_command% informazio gehiago lortzeko."
  set_sub_footer: "Erabili /msg %bot% %help_command% informazio gehiago lortzeko."
  syntax_label: "Sintaxia: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Mezuak"
    preferences: "Hobespenak"
  ircop_header: "IRC operadoreentzako komando erabilgarriak:"

# --- NOTIFY ----------------------------------------------------------------
notify:
  nick_pending: "%count% mezu irakurtzeke dituzu. Zerrendatzeko: /msg %bot% %list%"
  channel_pending: "%channel% kanalak %count% mezu irakurtzeke ditu. Erabili /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS ---
registration_decision:
  accepted: "%channel% kanalaren erregistro-eskaera onartu da."
  rejected: "%channel% kanalaren erregistro-eskaera ukatu da."
  reason: "Arrazoia: %reason%"
  restriction: "Noiztik erabilgarri: %date%"

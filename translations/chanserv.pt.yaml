# Traduções de ChanServ — Português
# Domínio: chanserv
#
# Códigos de formatação IRC (aspas duplas ou blocos literais !irc):
#   \x02        ativa/desativa o negrito
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermelho, 07=laranja, 14=cinzento escuro)
#   \x03        repõe a cor
#   \x0F        repõe toda a formatação
#
# As cores IRC usam números DECIMAIS (0-15), não hexadecimais.
#   \x0314 = cinzento escuro (14 decimal): CORRETO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multilinha: !irc |- com quebras de linha e espaços reais.
# Os blocos sem etiqueta não descodificam escapes; preserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O apresentador acrescenta /msg sem cor e uma margem de dois espaços.

# --- ERROR --------------------------------------------------------------------
error:
  invalid_channel: "Nome de canal inválido. Use %example%."
  invalid_channel_example: "#canal"
  generic: "Ocorreu um erro. Tente novamente."

# --- REGISTER -----------------------------------------------------------------
register:
  syntax: "REGISTER <#canal> <descrição>"
  example: "%command_prefix%REGISTER #canal Projeto comunitário"
  short: "Registar um canal."
  help: |-
    Regista um canal e associa-o à tua alcunha. Identifica-te com %nickserv%.
    No modo APPROVAL, um IRCop tem de aprovar o pedido.
  success: "O canal %channel% foi registado."
  already_registered: "O canal %channel% já está registado ou tem um pedido de registo em curso."
  channel_not_on_network: "O canal %channel% não existe na rede."
  pending_deletion: "O canal %channel% está pendente de eliminação e não pode ser registado."
  insufficient_channel_rank: "Tem de ter pelo menos estado de operador em %channel% para o registar."
  limit_exceeded: "Atingiu o máximo de %max% canais registados."
  throttled: "Deve aguardar %minutes% minuto(s) antes de registar outro canal."

  awaiting_approval: "O pedido de registo de %channel% aguarda aprovação de um IRCop."
  restricted_indefinite: "Novos pedidos para %channel% estão bloqueados indefinidamente."
  restricted_until: "Novos pedidos para %channel% estão bloqueados até %date%"

# --- INFO ---------------------------------------------------------------------

# Traduções de ChanServ — Português
# Domínio: chanserv
#
# Códigos de formatação IRC (aspas duplas ou blocos literais !irc):
#   \x02        ativa/desativa o negrito
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermelho, 07=laranja, 14=cinzento escuro)
#   \x03        repõe a cor
#   \x0F        repõe toda a formatação
#
# As cores IRC usam números DECIMAIS (0-15), não hexadecimais.
#   \x0314 = cinzento escuro (14 decimal): CORRETO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multilinha: !irc |- com quebras de linha e espaços reais.
# Os blocos sem etiqueta não descodificam escapes; preserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O apresentador acrescenta /msg sem cor e uma margem de dois espaços.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Nome de canal inválido. Use \x02#canal\x02."
  generic: "\x0304✗\x03 Ocorreu um erro. Tente novamente."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#canal> <descrição>"
  example: "%command_prefix%\x02\x0303REGISTER #canal Projeto comunitário\x03\x0F"
  short: "Registar um canal."
  help: |-
    Registe e associe um canal ao seu nickname. Deve estar identificado com
    %nickserv%.
  success: "\x0303✔\x03 O canal \x02%channel%\x02 foi registado."
  already_registered: "\x0304✗\x03 O canal \x02%channel%\x02 já está registado."
  channel_not_on_network: "\x0304✗\x03 O canal \x02%channel%\x02 não existe na rede."
  pending_deletion: "\x0304✗\x03 O canal \x02%channel%\x02 está pendente de eliminação e não pode ser registado."
  insufficient_channel_rank: "\x0304✗\x03 Tem de ter pelo menos estado de operador em \x02%channel%\x02 para o registar."
  limit_exceeded: "\x0304✗\x03 Atingiu o máximo de %max% canais registados."
  throttled: "\x0304✗\x03 Deve aguardar \x02%minutes%\x02 minuto(s) antes de registar outro canal."

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#canal>"
  example: "%command_prefix%\x02\x0303INFO #canal\x03\x0F"
  short: "Mostrar informações do canal."
  help: |-
    Mostra as informações detalhadas de um canal registado, incluindo proprietário,
    dados de registo, atividade recente e opções de configuração.
  header: "\x02Informações do canal \x0307%channel%\x03\x02"
  founder: "  \x0314Fundador\x03             : \x02%nickname%\x02"
  registered: "  \x0314Registado\x03            : %date%"
  successor: "  \x0314Sucessor\x03             : \x02%nickname%\x02"
  description: "  \x0314Descrição\x03            : %desc%"
  url: "  \x0314URL\x03                  : %url%"
  email: "  \x0314Email\x03                : %email%"
  last_used: "  \x0314Último uso\x03           : %date%"
  topic: "  \x0314Último tópico\x03        : %topic%"
  topic_set_by: "  \x0314Tópico definido por\x03  : %nickname%"
  options: "  \x0314Opções\x03               : %options%"
  private: "\x0304✗\x03 As informações do canal \x02%channel%\x02 são privadas."
  no_expire: "  \x0314Nunca expira\x03         : Sim"
  mlock_modes: "  \x0314Bloqueio de modos\x03    : %modes%"
  suspended_status: "  \x0314Estado\x03               : \x0304Suspenso\x03"
  suspended_reason: "  \x0314Motivo\x03               : %reason%"
  suspended_until: "  \x0314Termina em\x03           : %date%"
  suspended_permanent: "  \x0314Termina em\x03           : Permanente"
  forbidden_status: "  \x0314Estado\x03               : \x0304Proibido\x03"
  forbidden_reason: "  \x0314Motivo\x03               : %reason%"
  pending_deletion_status: "  \x0314Estado\x03             : \x0307A aguardar eliminação\x03"
  pending_deletion_at: "  \x0314Eliminado\x03          : %date%"
  pending_deletion_until: "  \x0314Elim. definitiva\x03   : %date%"
  pending_deletion_notice: "  \x0307Este canal está congelado e não pode ser registado.\x03"

# --- HELP ------------------------------------------------------------------
help:

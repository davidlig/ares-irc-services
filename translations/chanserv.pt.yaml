  syntax: "INFO <#canal>"
  example: "%command_prefix%INFO #canal"
  short: "Mostrar informações do canal."
  help: |-
    Mostra as informações detalhadas de um canal registado, incluindo proprietário,
    dados de registo, atividade recente e opções de configuração.
  header: "Informações do canal %channel%"
  founder: "%label%%padding%: %nickname%"
  founder_label: "Fundador"
  registered: "%label%%padding%: %date%"
  registered_label: "Registado"
  successor: "%label%%padding%: %nickname%"
  successor_label: "Sucessor"
  description: "%label%%padding%: %desc%"
  description_label: "Descrição"
  url: "%label%%padding%: %url%"
  url_label: "URL"
  email: "%label%%padding%: %email%"
  email_label: "Email"
  last_used: "%label%%padding%: %date%"
  last_used_label: "Último uso"
  topic: "%label%%padding%: %topic%"
  topic_label: "Último tópico"
  topic_set_by: "%label%%padding%: %nickname%"
  topic_set_by_label: "Tópico definido por"
  options: "%label%%padding%: %options%"
  options_label: "Opções"
  private: "As informações do canal %channel% são privadas."
  no_expire: "%label%%padding%: Sim"
  no_expire_label: "Nunca expira"
  mlock_modes: "%label%%padding%: %modes%"
  mlock_modes_label: "Bloqueio de modos"
  suspended_status: "%label%%padding%: %state%"
  suspended_status_label: "Estado"
  suspended_status_value: "Suspenso"
  suspended_reason: "%label%%padding%: %reason%"
  suspended_reason_label: "Motivo"
  suspended_until: "%label%%padding%: %date%"
  suspended_until_label: "Termina em"
  suspended_permanent: "%label%%padding%: Permanente"
  suspended_permanent_label: "Termina em"
  forbidden_status: "%label%%padding%: %state%"
  forbidden_status_label: "Estado"
  forbidden_status_value: "Proibido"
  forbidden_reason: "%label%%padding%: %reason%"
  forbidden_reason_label: "Motivo"
  pending_deletion_status: "%label%%padding%: %state%"
  pending_deletion_status_label: "Estado"
  pending_deletion_status_value: "A aguardar eliminação"
  pending_deletion_at: "%label%%padding%: %date%"
  pending_deletion_at_label: "Eliminado"
  pending_deletion_until: "%label%%padding%: %date%"
  pending_deletion_until_label: "Elim. definitiva"
  pending_deletion_notice: "Este canal está congelado e não pode ser registado."

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <#canal> <opção> [parâmetros]"
  example: "%command_prefix%SET #canal DESC Um canal comunitário"
  examples:
    - "%command_prefix%SET #canal URL https://example.test"
    - "%command_prefix%SET #canal MLOCK ON"
  short: "Alterar opções do canal."
  help: |-
    Altera uma opção do canal. A ajuda de cada opção explica os respetivos
    requisitos e variantes.
  unknown_option: "Opção desconhecida %option%. Use uma das seguintes: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Use SET <#canal> FOUNDER <apelido> <token> com o token confirmado do fundador atual."
    token_unavailable: "O fundador atual não tem um token de recuperação confirmado. Deve autenticar-se e usar VERIFY primeiro."
    syntax: "SET <#canal> FOUNDER <apelido> [token]"
    example: "%command_prefix%SET #canal FOUNDER Alice"
    examples:
      - "%command_prefix%SET #canal FOUNDER Alice token-confirmado"
    short: "Transferir canal para outro nickname registado."
    help: |-
      Altera o fundador depois de validar o token do fundador atual. Mantém-se a
      exceção administrativa do nível de fundador. O token não é consumido.
    invalid_token: "O token de recuperação é inválido."
    updated: "O fundador foi alterado para %nickname%."
    throttled: "Demasiados tokens inválidos. Tente novamente em %minutes% minuto(s)."
    must_be_registered: "%nickname% deve estar registado e ativado."
    suspended: "%nickname% está suspenso e não pode ser definido como fundador."
    cannot_be_self: "O novo fundador não pode ser o fundador atual."
    cannot_be_successor: "O novo fundador não pode ser o sucessor do canal."
    limit_exceeded: "%nickname% atingiu o máximo de %max% canais registados."
    notice_channel: "%from% atribui %nickname% como fundador do canal."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canal> SUCCESSOR [nickname]"
    example: "%command_prefix%SET #canal SUCCESSOR Alice"
    examples:
      - "%command_prefix%SET #canal SUCCESSOR"
    short: "Definir o sucessor do canal."
    help: |-
      Define um nickname como sucessor de um canal. Se não indicar um nickname,
      elimina o atual. O nickname tem de estar registado e ativado.
    cleared: "Sucessor removido."
    updated: "Sucessor definido como %nickname%."
    must_be_registered: "%nickname% deve estar registado e ativado."
    suspended: "%nickname% está suspenso e não pode ser definido como sucessor."
    cannot_be_founder: "O fundador não pode ser definido como sucessor."
    notice_channel: "%from% atribui %nickname% como sucessor do canal."
    notice_channel_cleared: "%from% removeu o sucessor do canal."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canal> DESC <descrição>"
    example: "%command_prefix%SET #canal DESC Um canal comunitário"
    short: "Alterar a descrição do canal."
    help: "Alterar a descrição do canal (obrigatório)."
    updated: "Descrição atualizada."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canal> URL [url]"
    example: "%command_prefix%SET #canal URL https://example.test"
    examples:
      - "%command_prefix%SET #canal URL"
    short: "Definir URL do canal."
    help: "Altera o endereço web do canal. Omita o URL para o remover."
    updated: "URL atualizada."
    cleared: "URL removida."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canal> EMAIL [email]"
    example: "%command_prefix%SET #canal EMAIL equipa@example.test"
    examples:
      - "%command_prefix%SET #canal EMAIL"
    short: "Definir email do canal."
    help: |-
      Altera o endereço de email do canal. Omita o email para o remover. Não
      são permitidos domínios de email bloqueados administrativamente.
      Exceção administrativa: operadores com acesso de nível fundador.
    invalid: "Endereço de email inválido."
    updated: "Email atualizado."
    cleared: "Email removido."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canal> ENTRYMSG [mensagem]"
    example: "%command_prefix%SET #canal ENTRYMSG Bem-vindo"
    examples:
      - "%command_prefix%SET #canal ENTRYMSG"
    short: "Definir mensagem de entrada do canal."
    help: "Define a mensagem de entrada (NOTICE). Omita a mensagem para a remover."
    updated: "Mensagem de entrada atualizada."
    too_long: "A mensagem de entrada não pode exceder %max% caracteres."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canal> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #canal TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #canal TOPICLOCK OFF"
    short: "Bloquear tópico do canal."
    help: "Impede a alteração do tópico do canal. Ao ativar, define o tópico atual."
    on: "Bloqueio de tópico está agora ON."
    off: "Bloqueio de tópico está agora OFF."
    notice_on: "%nickname% ativa TOPICLOCK."
    notice_off: "%nickname% desativa TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canal> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #canal MLOCK ON"
    examples:
      - "%command_prefix%SET #canal MLOCK OFF"
    short: "Bloquear modos do canal."
    help: |-
      Bloqueia os modos atuais do canal (ex: +nt). Quando ON, os modos não podem ser
      alterados.
    no_modes: "sem modos"
    on: "MLOCK está agora ON (%modes%)."
    off: "MLOCK está agora OFF."
    notice_on: "%nickname% ativa MLOCK (%modes%)."
    notice_off: "%nickname% desativa MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canal> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #canal PRIVATE ON"
    examples:
      - "%command_prefix%SET #canal PRIVATE OFF"
    short: "Ocultar as informações do canal de utilizadores sem acesso."
    help: |-
      Quando está ON, só o fundador e os utilizadores com acesso podem ver as
      informações do canal.
    on: "As informações do canal são agora privadas."
    off: "As informações do canal são agora públicas."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canal> SECURE {ON|OFF}"
    example: "%command_prefix%SET #canal SECURE ON"
    examples:
      - "%command_prefix%SET #canal SECURE OFF"
    short: "Exigir lista de acesso para níveis de canal."
    help: |-
      Impede a atribuição de níveis no canal a nicknames que não constem da lista
      de acesso.
    on: "SECURE está agora ON."
    off: "SECURE está agora OFF."
    notice_on: "%nickname% ativa o modo SECURE."
    notice_off: "%nickname% desativa o modo SECURE."

  # --- SET VERBOSE ---------------------------------------------------------
  verbose:
    syntax: "SET <#canal> VERBOSE {ON|OFF}"
    example: "%command_prefix%SET #canal VERBOSE ON"
    examples:
      - "%command_prefix%SET #canal VERBOSE OFF"
    short: "Alternar notificações de ações do canal."
    help: |-
      Ativa ou desativa as transmissões NOTICE para o canal para as ações
      realizadas nele.
    on: "Notificações de ações do canal ativadas."
    off: "Notificações de ações do canal desativadas."

# --- STATUS -------------------------------------------------------------------
status:
  syntax: "STATUS <#canal>"
  example: "%command_prefix%STATUS #canal"
  header: "Estado do canal %channel%"
  short: "Mostrar o estado de registo de um canal."
  help: |-
    Indica se o canal não está registado, aguarda aprovação, foi rejeitado ou
    está registado.
    Os detalhes da rejeição só são visíveis ao requerente e a IRCops
    autorizados.

  unregistered: "%label%%padding%: Não registado"
  unregistered_label: "Estado"
  pending: "%label%%padding%: %state%"
  pending_label: "Estado"
  pending_value: "A aguardar aprovação"
  registered: "%label%%padding%: %state%"
  registered_label: "Estado"
  registered_value: "Registado"
  suspended: "%label%%padding%: %state%"
  suspended_label: "Estado"
  suspended_value: "Suspenso"
  forbidden: "%label%%padding%: %state%"
  forbidden_label: "Estado"
  forbidden_value: "Proibido"
  pending_deletion: "%label%%padding%: %state%"
  pending_deletion_label: "Estado"
  pending_deletion_value: "A aguardar eliminação"
  rejected_private: "%label%%padding%: %state%"
  rejected_private_label: "Estado"
  rejected_private_value: "Registo rejeitado"
  rejected: "%label%%padding%: %state%"
  rejected_label: "Estado"
  rejected_value: "Registo rejeitado"
  rejection_reason: "%label%%padding%: %reason%"
  rejection_reason_label: "Razão"
  rejection_audit: "%label%%padding%: %operator% em %date%"
  rejection_audit_label: "Rejeitado por"
  restriction_until: "%label%%padding%: %date%"
  restriction_until_label: "Disponível a partir de"
  footer: ""

# --- ACCESS -------------------------------------------------------------------
access:
  syntax: "ACCESS <#canal> <opção> [parâmetros]"
  example: "%command_prefix%ACCESS #canal LIST"
  examples:
    - "%command_prefix%ACCESS #canal ADD Alice 100"
    - "%command_prefix%ACCESS #canal DEL Alice"
  short: "Gerir lista de acesso."
  help: "Gere a lista de acesso do canal."
  unknown_sub: "Subcomando desconhecido %sub%. Use LIST, ADD ou DEL."
  level_range: "O nível de acesso deve estar entre %min% e %max%."
  cannot_manage_level: "Só pode gerir nicks com nível estritamente abaixo do seu."
  founder_not_in_list: "O fundador não está na lista de acesso."
  max_entries: "Máximo de %max% entradas de acesso por canal."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#canal> LIST"
    example: "%command_prefix%ACCESS #canal LIST"
    short: "Listar lista de acesso (requer nível ACCESSLIST)."
    help: "Mostra o nickname e o nível para cada entrada."
    header: "Lista de acesso de %channel%"
    empty: "O canal %channel% não tem entradas de acesso."
    entry: "#%index%: %nickname% (nível %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#canal> ADD <nickname> <nível>"
    example: "%command_prefix%ACCESS #canal ADD Alice 100"
    short: "Adicionar ou atualizar nível de acesso (requer nível ACCESSCHANGE)."
    help: "Nível 1-499. Só pode definir níveis abaixo do seu."
    done: "%nickname% definido para o nível %level%."
    notice_channel: "%from% define %to% para o nível %level%"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#canal> DEL <nickname>"
    example: "%command_prefix%ACCESS #canal DEL Alice"
    short: "Remover da lista de acesso (requer nível ACCESSCHANGE)."
    help: "Só pode remover nicks com nível abaixo do seu."
    not_in_list: "%nickname% não está na lista de acesso."
    done: "%nickname% removido da lista de acesso."
    notice_channel: "%from% remove %to% da lista de acesso"

# --- DELACCESS ----------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#canal>"
  example: "%command_prefix%DELACCESS #canal"
  short: "Remover o seu próprio acesso de um canal."
  help: |-
    Remove a sua entrada da lista de acesso do canal. Tem de estar identificado.
    O fundador não pode utilizar este comando.
  done: "O seu acesso foi removido de %channel%."
  not_in_list: "Não tem acesso em %channel%."
  founder_not_in_access: "É o fundador de %channel% e não está na lista de acesso."
  notice_channel: "%nickname% remove o seu acesso do canal"

# --- AKICK --------------------------------------------------------------------
akick:
  syntax: "AKICK <#canal> <opção> [parâmetros]"
  example: "%command_prefix%AKICK #canal ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #canal ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #canal DEL *!*@*"
    - "%command_prefix%AKICK #canal DEL 2"
    - "%command_prefix%AKICK #canal LIST"
    - "%command_prefix%AKICK #canal VIEW 1"
    - "%command_prefix%AKICK #canal CLEAR"
    - "%command_prefix%AKICK #canal CHECK Alice"
  short: "Gerir lista de auto-kick."
  help: "Gere as entradas de expulsão automática e a respetiva expiração opcional."
  unknown_sub: "Subcomando desconhecido %sub%. Use ADD, DEL, LIST, VIEW, CLEAR ou CHECK."
  invalid_mask: "Formato de máscara inválido. Use nick!ident@host com caracteres universais (*)."
  dangerous_mask: "A máscara %mask% é demasiado ampla. Deve conter pelo menos 4 caracteres alfanuméricos."
  protected_user: "O nickname %nickname% tem acesso neste canal."
  max_entries: "Máximo de %max% entradas AKICK por canal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canal> ADD <máscara> [expiração] [motivo]"
    example: "%command_prefix%AKICK #canal ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #canal ADD *!*@* 7d Spam"
    short: "Adicionar entrada AKICK."
    help: |-
      Adiciona uma máscara à lista de expulsão automática do canal.

      Pode indicar uma duração e um motivo. Se incluir um motivo, tem também de
      especificar a duração: 0 para permanente, d para dias, h para horas ou m para
      minutos.
    done: "AKICK %mask% adicionado."
    already_exists: "AKICK %mask% já existe."
    notice_channel: "%from% adiciona AKICK: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canal> DEL {<máscara>|<número>}"
    example: "%command_prefix%AKICK #canal DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #canal DEL 2"
    short: "Remover entrada AKICK."
    help: "Remover por máscara exata ou número de entrada da LIST."
    not_found: "AKICK %mask% não encontrado."
    done: "AKICK %mask% removido."
    notice_channel: "%from% remove AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canal> LIST"
    example: "%command_prefix%AKICK #canal LIST"
    short: "Listar entradas AKICK."
    help: "Mostra máscara, motivo, expiração e quem adicionou."
    header: "Lista AKICK de %channel%"
    empty: "O canal %channel% não tem entradas AKICK."
    entry: "#%index% %mask% %reason% (por %nickname%, expira: %expiration%, usos: %uses%)"

  # --- AKICK VIEW ----------------------------------------------------------
  view:
    syntax: "AKICK <#canal> VIEW {<máscara>|<número>}"
    example: "%command_prefix%AKICK #canal VIEW 1"
    examples:
      - "%command_prefix%AKICK #canal VIEW *!*@bad.host"
    short: "Ver metadados detalhados de uma entrada AKICK."
    help: |-
      Mostra motivo, autor, data de criação, data de expiração,
      contador de usos e data do último uso para uma entrada de autokick.
    header: "Detalhes de AKICK para %channel%"
    reason: "%label%%padding%: %reason%"
    reason_label: "Motivo"
    author: "%label%%padding%: %author%"
    author_label: "Autor"
    created: "%label%%padding%: %date%"
    created_label: "Data criação"
    expires: "%label%%padding%: %date%"
    expires_label: "Data expiração"
    uses: "%label%%padding%: %uses%"
    uses_label: "Usos"
    last_used: "%label%%padding%: %date%"
    last_used_label: "Último uso"

  # --- AKICK CLEAR ---------------------------------------------------------
  clear:
    syntax: "AKICK <#canal> CLEAR"
    example: "%command_prefix%AKICK #canal CLEAR"
    short: "Esvaziar todas as entradas AKICK."
    help: |-
      Remove todas as entradas de expulsão automática do canal.
      Requer nível de fundador ou AKICK.
    empty: "O canal %channel% não tem entradas AKICK para esvaziar."
    done: "%count% entradas AKICK esvaziadas de %channel%."
    notice_channel: "%from% esvaziou %count% entradas AKICK de %channel%"

  # --- AKICK CHECK ---------------------------------------------------------
  check:
    syntax: "AKICK <#canal> CHECK <alcunha>"
    example: "%command_prefix%AKICK #canal CHECK Alice"
    short: "Verificar se uma alcunha coincide com entradas AKICK."
    help: |-
      Verifica se um utilizador conectado coincide com alguma entrada de autokick do canal.
    no_match: "%nickname% não coincide com nenhuma entrada AKICK em %channel%."
    not_connected: "O utilizador %nickname% não está conectado."
    header: "Coincidências AKICK para %nickname% em %channel%"
    entry: "#%index% %mask% %reason%"

  # --- AKICK ENFORCE -------------------------------------------------------
  enforce:
    syntax: "AKICK <#canal> ENFORCE"
    example: "%command_prefix%AKICK #canal ENFORCE"
    short: "Aplica as entradas AKICK aos utilizadores atuais do canal."
    help: |-
      Verifica os utilizadores no canal contra a lista AKICK
      e bane e expulsa os que coincidirem.
    no_matches: "Nenhum utilizador em %channel% coincide com a lista AKICK."
    done: "Foram aplicadas %count% expulsões de AKICK em %channel%."
    notice_channel: "%from% aplicou expulsões AKICK em %channel% (%count% utilizadores)"

# --- LEVELS -------------------------------------------------------------------
levels:
  syntax: "LEVELS <#canal> <opção> [parâmetros]"
  example: "%command_prefix%LEVELS #canal LIST"
  examples:
    - "%command_prefix%LEVELS #canal SET OPDEOP 50"
    - "%command_prefix%LEVELS #canal RESET"
  short: "Configurar níveis do canal."
  help: |-
    Configura os níveis mínimos de acesso para as ações do canal. Só o fundador
    pode alterar ou repor os níveis.
  unknown_sub: "Subcomando desconhecido %sub%. Use LIST, SET ou RESET."
  unknown_key: "Chave de nível desconhecida %key% ou não suportada por este IRCd."
  value_range: "O valor do nível deve estar entre %min% e %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#canal> LIST"
    example: "%command_prefix%LEVELS #canal LIST"
    short: "Listar requisitos de nível."
    help: "Mostra cada chave de nível e o seu valor (padrões se não definidos)."
    header: "Níveis de %channel%"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#canal> SET <nível> <valor>"
    example: "%command_prefix%LEVELS #canal SET OPDEOP 50"
    short: "Definir um requisito de nível."
    help: "Valor -1 a 499. Apenas o fundador."
    done: "%key% definido para %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#canal> RESET"
    example: "%command_prefix%LEVELS #canal RESET"
    short: "Repor todos os níveis para os padrões."
    help: "Remove todas as substituições. Apenas o fundador."
    done: "Todos os níveis repostos para os padrões."

# --- INVITE -------------------------------------------------------------------
invite:
  syntax: "INVITE <#canal>"
  example: "%command_prefix%INVITE #canal"
  short: "Convidar-se para o canal."
  help: "Convidar-se para o canal."
  done: "Foi convidado para %channel%."

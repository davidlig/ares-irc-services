# --- CLEARUSERS (IRCop) -------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#canal> [motivo]"
  example: "%command_prefix%CLEARUSERS #canal"
  examples:
    - "%command_prefix%CLEARUSERS #canal flooding"
  short: "Expulsar todos os utilizadores de um canal."
  help: |-
    Expulsa todos os utilizadores do canal. É exclusivo de IRCop; se omitir o
    motivo, será utilizado um motivo predefinido.
  not_on_network: "O canal %channel% não está atualmente na rede."
  empty: "O canal %channel% não tem utilizadores para expulsar."
  success: "Expulsos %count% utilizador(es) de %channel%."
  default_reason: "Comando CLEARUSERS"

# --- CLEARACCESS (IRCop) ------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#canal>"
  example: "%command_prefix%CLEARACCESS #canal"
  short: "Limpar toda a lista de acesso de um canal."
  help: "Elimina todas as entradas de acesso do canal. Esta ação é irreversível."
  success: "Removidas %count% entradas de acesso de %channel%."
  empty: "O canal %channel% não tem entradas de acesso."

# --- IRCOPONLY (IRCop) --------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#canal> {ON|OFF}"
  example: "%command_prefix%IRCOPONLY #canal ON"
  examples:
    - "%command_prefix%IRCOPONLY #canal OFF"
  short: "Restringir um canal a operadores IRC."
  help: |-
    Só os operadores IRC autorizados podem permanecer no canal. %bot% aplica
    esta restrição.
  on: "IRCOPONLY ativado em %channel%."
  off: "IRCOPONLY desativado em %channel%."

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <#canal> <nickname> <descrição>"
  short: "Registar administrativamente um canal."
  help: |-
    Sintaxe: SAREGISTER <#canal> <nickname> <descrição>

    Regista administrativamente um canal de imediato para o nickname
    especificado como fundador sem exigir presença, verificação ou limites de frequência.
  example: "%command_prefix%SAREGISTER #canal Alice Canal comunitário"
  success: "O canal %channel% foi registado para %founder%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#canal> {ON|OFF}"
  example: "%command_prefix%NOEXPIRE #Importante ON"
  examples:
    - "%command_prefix%NOEXPIRE #Importante OFF"
  short: "Definir ou remover proteção de expiração para um canal."
  help: |-
    Controla se o canal expira por inatividade.
    ON evita a expiração e OFF aplica as regras normais.
  success_on: "O canal %channel% está agora protegido contra expiração."
  success_off: "O canal %channel% irá agora expirar normalmente."
  forbidden: "O canal %channel% está proibido."
  suspended: "O canal %channel% está suspenso."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <#canal> [FORCE]"
  example: "%command_prefix%DROP #canal"
  examples:
    - "%command_prefix%DROP #canal FORCE"
  short: "Remover um canal registado."
  help: |-
    Elimina um canal registado da base de dados.
    FORCE elimina permanentemente um canal pendente de eliminação.
    Um IRCop com a permissão DROP também pode libertar imediatamente
    pedidos de registo pendentes e rejeitados, com ou sem FORCE.
  registration_restricted: "Este pedido de registo está restringido até %date%."
  force:
    short: "Elimina permanentemente um canal pendente de eliminação."
  success: "O canal %channel% foi marcado para eliminação e pode ser restaurado durante o período de carência."
  force_success: "O canal %channel% foi eliminado permanentemente."
  pending_deletion: "O canal %channel% já está pendente de eliminação. Use DROP <#canal> FORCE para eliminá-lo permanentemente."
  invalid_channel: "Nome de canal inválido. Use %example%."
  pending_deletion_reason: "O canal %channel% está em processo de eliminação. Mais informações: /msg %bot% \x0303INFO %channel%\x03"

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <#canal>"
  example: "%command_prefix%RESTORE #canal"
  short: "Restaurar um canal pendente de eliminação."
  help: |-
    Restaura um canal eliminado manualmente que ainda esteja dentro do período
    de tolerância.
  success: "O canal %channel% foi restaurado."
  not_pending_deletion: "O canal %channel% não está pendente de eliminação."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canal> <duração> <motivo>"
  example: "%command_prefix%SUSPEND #canal 7d Incumprimento das regras"
  examples:
    - "%command_prefix%SUSPEND #canal 0 Incumprimento das regras"
  short: "Suspender um canal."
  help: |-
    Desativa temporariamente um canal registado. Formatos de duração: 0 =
    permanente, 1d, 12h, 60m.
    Enquanto estiver suspenso, os modos, o acesso e a aplicação das regras do canal
    ficam desativados.
  success: "O canal %channel% foi suspenso até %duration%."
  already_suspended: "O canal %channel% já está suspenso."
  invalid_duration: "Duração inválida. Use: 0 (permanente), 1d, 12h ou 60m."
  channel_suspended: "O canal %channel% está suspenso e não pode ser usado."
  notice_channel: "O canal foi suspenso. Motivo: %reason%"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#canal>"
  example: "%command_prefix%UNSUSPEND #canal"
  short: "Levantar a suspensão de um canal."
  help: |-
    Reativa um canal suspenso, restaurando os respetivos modos e a aplicação das
    regras.
  success: "O canal %channel% já não está suspenso."
  not_suspended: "O canal %channel% não está suspenso."
  reason_expired: "suspensão expirada"

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <#canal> <motivo>"
  example: "%command_prefix%FORBID #canal Incumprimento das regras"
  short: "Proibir um canal de ser usado."
  help: |-
    Proíbe a utilização de um canal, expulsando todos os utilizadores e impedindo-os
    de voltar a entrar. Se estiver registado, o registo é removido antes de aplicar
    a proibição.
  reason_required: "Deve especificar um motivo."
  success: "O canal %channel% foi proibido."
  updated: "O motivo de proibição do canal %channel% foi atualizado."
  channel_forbidden: "O canal %channel% está proibido e não pode ser usado."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#canal>"
  example: "%command_prefix%UNFORBID #canal"
  short: "Remover a proibição de um canal."
  help: "Remove a proibição de um canal, permitindo que volte a ser registado."
  success: "O canal %channel% já não está proibido."
  not_forbidden: "O canal %channel% não está proibido."

# --- HISTORY ---
history:
  syntax: "HISTORY <#canal> <opção> [parâmetros]"
  example: "%command_prefix%HISTORY #canal ADD Revisão da moderação"
  examples:
    - "%command_prefix%HISTORY #canal DEL 42"
    - "%command_prefix%HISTORY #canal VIEW"
    - "%command_prefix%HISTORY #canal VIEW 2"
    - "%command_prefix%HISTORY #canal VIEW ALL"
    - "%command_prefix%HISTORY #canal CLEAR"
  short: "Ver ou gerir histórico de ações do canal."
  help: "Gere o histórico de ações do canal."

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#canal> ADD <mensagem>"
    example: "%command_prefix%HISTORY #canal ADD Revisão da moderação"
    short: "Adicionar uma entrada manual ao histórico."
    help: |-
      Adiciona uma entrada manual ao histórico do canal.
    success: "Entrada de histórico adicionada para %channel%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#canal> DEL <id>"
    example: "%command_prefix%HISTORY #canal DEL 42"
    short: "Elimina uma entrada do histórico."
    help: "Elimina uma entrada do histórico pelo seu ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#canal> VIEW [PÁGINA|ALL]"
    example: "%command_prefix%HISTORY #canal VIEW"
    examples:
      - "%command_prefix%HISTORY #canal VIEW 2"
      - "%command_prefix%HISTORY #canal VIEW ALL"
    short: "Ver histórico de ações do canal."
    help: "Mostra as entradas do histórico do canal."
    header: "%heading% (a mostrar %start%-%end% de %total%):"
    header_heading: "Histórico de %channel%"
    entry: "#%id% [%date%] %action% por %operator% — %message%"
    no_entries: "Nenhuma entrada de histórico encontrada para %channel%."
    page_hint: "Use %command% para mais entradas."
    page_hint_command: "HISTORY %channel% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#canal> CLEAR"
    example: "%command_prefix%HISTORY #canal CLEAR"
    short: "Eliminar todas as entradas de histórico de um canal."
    help: "Elimina todas as entradas do histórico do canal."
    success: "Eliminadas %count% entradas de histórico de %channel%."


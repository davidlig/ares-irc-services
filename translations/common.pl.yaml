# Tłumaczenia wspólnych komunikatów — Polski
# Domena: common
#
# Kody formatowania IRC (podwójne cudzysłowy lub bloki literalne !irc):
#   \x02        włącza/wyłącza pogrubienie
#   \x03NN      kolor (DZIESIĘTNIE: 03=zielony, 04=czerwony, 07=pomarańczowy, 14=ciemnoszary)
#   \x03        resetuje kolor
#   \x0F        resetuje całe formatowanie
#
# Kolory IRC używają liczb DZIESIĘTNYCH (0-15), nie szesnastkowych.
#   \x0314 = ciemnoszary (14 dziesiętnie): POPRAWNIE
#   \x030F = kolor 0, a po nim litera F: BŁĄD
#
# Wielowierszowy tekst IRC: !irc |- z rzeczywistymi podziałami wierszy i spacjami.
# Bloki bez tagu nie dekodują sekwencji ucieczki; zachowaj literały CTCP.
# Przykłady HELP: example/examples i %command_prefix%.
# Prezenter dodaje /msg bez koloru i margines dwóch spacji.

# --- UNKNOWN COMMAND -------------------------------------------------------
unknown_command: "\x0304✗\x03\x0F Nieznane polecenie \x0303%command%\x03\x0F. Użyj /msg %bot% \x0303HELP\x03\x0F"

# --- UNKNOWN HELP OPTION ---------------------------------------------------
unknown_help_option: "\x0304✗\x03\x0F Nieznana opcja pomocy \x0303%option%\x03\x0F dla \x0303%command%\x03\x0F. Użyj /msg %bot% \x0303HELP %command%\x03\x0F"

# --- ERROR -----------------------------------------------------------------
error:
  email_domain_blocked: "Ta domena email jest zablokowana administracyjnie."
  syntax: "Nieprawidłowa składnia. Użycie: %syntax%"
  oper_only: "Ta komenda jest dostępna tylko dla Operatorów IRC."
  not_identified: "Nie jesteś zidentyfikowany. Użyj /msg %nickserv% IDENTIFY <pseudonim> <hasło>"
  permission_denied: "Odmowa dostępu. Nie masz uprawnień do tej komendy."
  mail_failed: "Nie można wysłać wiadomości e-mail. Sprawdź adres lub spróbuj później."
  channel_not_registered: "Kanał %channel% nie jest zarejestrowany."
  nick_not_registered: "Nick %nickname% nie jest zarejestrowany."
  insufficient_access: "Niewystarczający dostęp do %operation% na kanale %channel%."
  nick_not_online: "Nick %nickname% nie jest połączony."

# --- DURATION --------------------------------------------------------------
duration:
  unit:
    year:
      singular: "rok"
      plural: "lata"
    month:
      singular: "miesiąc"
      plural: "miesiące"
    day:
      singular: "dzień"
      plural: "dni"
    hour:
      singular: "godzina"
      plural: "godziny"
    minute:
      singular: "minuta"
      plural: "minuty"
    second:
      singular: "sekunda"
      plural: "sekundy"
  list_separator: ", "
  list_join: "%prefix% i %last%"

# --- ANTIFLOOD -------------------------------------------------------------
antiflood:
  blocked: "Przekroczyłeś limit wysyłania komend. Spróbuj ponownie za %seconds% sekund."
  debug_channel: "%nick% limit %command% osiągnięty dla %host% (pozostało %seconds%s)"

# --- CTCP ------------------------------------------------------------------
ctcp:
  version:
    tribute: |
      \x02Mojemu wiernemu i wiecznemu przyjacielowi,\x02

      Choć rok 2023 był czasem, gdy musieliśmy się pożegnać, czas nie wymazał
      żadnego szczegółu związanego z Tobą. Wciąż pamiętam Twoją niewyczerpaną energię,
      szlachetne spojrzenie i ogromną, zaraźliwą radość, którą tylko Ty potrafiłeś dawać.

      Wypełniłeś mój dom życiem, a moje życie bezwarunkową miłością, której nigdy niezapomnę. Choć nie słyszę już Twoich kroków biegnących na powitanie ani nie czuję,
      jak opierasz głowę o mnie, szukając czułości, wiem, że Twój figlarny duch nadal
      mi towarzyszy.

      Dziękuję za każdą chwilę, każdą psotę i za to, że byłeś najlepszym towarzyszem,\jakiego mogłem sobie wymarzyć. Miejsce, które zostawiłeś u mego boku, jest teraz
      wypełnione najpiękniejszymi wspomnieniami. Zawsze będziesz moim wielkim
      przyjacielem i zawsze będziesz mieć ogromne miejsce w moim sercu.


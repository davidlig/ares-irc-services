# --- NICK PROTECTION ----------------------------------------------------------
protection:
  nick_in_use: "O nick %nickname% está registado. Será renomeado se não se identificar."
  renamed_to: |-
    O seu nickname foi alterado para %guest_nick%. Para recuperar o seu nickname:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <palavra-passe>"
  nick_forbidden: "O nickname %nickname% está proibido: %reason%"

# --- USERIP (IRCop) -----------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Obter o endereço IP real e hostname do nickname."
  help: |-
    Mostra o endereço IP e o nome de host reais de um nickname.
    Utilize com responsabilidade: é informação sensível.
  example: "%command_prefix%USERIP Utilizador"
  result: "Nickname: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP (IRCop) ------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Procura nicknames pelo IP da última ligação identificada."
  help: |-
    Mostra os nicknames registados cuja última ligação identificada utilizou
    este endereço IP. O endereço guardado pode estar desatualizado.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Não há nicknames registados correspondentes a este endereço IP."
  header: "Nicknames correspondentes:"

# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <padrão> [página]"
  short: "Lista alcunhas registadas que correspondem a um padrão."
  help: |-
    Lista os nicknames registados que correspondem ao padrão. O carácter *
    corresponde a qualquer sequência de caracteres; a página opcional começa em 1.
  example: "%command_prefix%LIST Utilizador*"
  examples:
    - "%command_prefix%LIST Utilizador* 2"
  header: "Alcunha | Registo | Última ligação | IP | Estado"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Nenhuma alcunha corresponde ao padrão %pattern%."
  status_pending: "Pendente"
  status_registered: "Registado"

# --- HISTORY ---
history:
  syntax: "HISTORY <nickname> <opção> [parâmetros]"
  short: "Ver ou gerir histórico de ações do nickname."
  help: |-
    Consulta e gere o histórico de ações de um nickname. Regista automaticamente
    suspensões, alterações de palavra-passe ou email e recuperações. VIEW mostra
    três entradas por página; ALL mostra o histórico completo.
  example: "%command_prefix%HISTORY Utilizador VIEW"
  examples:
    - "%command_prefix%HISTORY Utilizador VIEW ALL"
    - "%command_prefix%HISTORY Utilizador ADD Nota manual"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <mensagem>"
    short: "Adicionar uma entrada manual ao histórico."
    help: "Adiciona uma entrada manual ao histórico do nickname."
    example: "%command_prefix%HISTORY Utilizador ADD Reportado por spam"
    success: "Entrada de histórico adicionada para %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "Eliminar uma entrada de histórico por ID."
    help: "Remove uma entrada específica do histórico pelo seu ID."
    example: "%command_prefix%HISTORY Utilizador DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [PÁGINA|ALL]"
    short: "Ver histórico de ações do nickname."
    help: |-
      Mostra o histórico de ações do nickname. Por predefinição, mostra três entradas
      por página. Use ALL para as ver todas.
    example: "%command_prefix%HISTORY Utilizador VIEW"
    examples:
      - "%command_prefix%HISTORY Utilizador VIEW 2"
      - "%command_prefix%HISTORY Utilizador VIEW ALL"
    header: "%heading% (a mostrar %start%-%end% de %total%):"
    header_title: "Histórico de %nickname%"
    entry: "#%id% [%date%] %action% por %operator% — %message%"
    no_entries: "Nenhuma entrada de histórico encontrada para %nickname%."
    page_hint: "Use %command% para mais entradas."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Eliminar todas as entradas de histórico de um nickname."
    help: "Elimina irreversivelmente todas as entradas do histórico do nickname."
    example: "%command_prefix%HISTORY Utilizador CLEAR"
    success: "Eliminadas %count% entradas de histórico de %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Conta ativada"
  resend: "Email de verificação reenviado"
  noexpire_on: "Proteção contra expiração ativada"
  noexpire_off: "Proteção contra expiração desativada"
  userip: "Consulta USERIP"
  history_clear: "Histórico limpo"
  password_changed_owner: "Palavra-passe alterada pelo proprietário"
  password_changed_operator: "Palavra-passe alterada pelo operador"
  email_changed_owner: "Email alterado de %old_email% para %new_email%"
  email_changed_operator: "Email alterado para %new_email% pelo operador"
  recover: "Palavra-passe redefinida via token de email"
  saregister: "Conta registada administrativamente"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Email anterior: %value%"
  new_email: "Novo email: %value%"
  method: "Método: %value%"

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <nickname> <palavra-passe> [email]"
  short: "Registar administrativamente um nickname."
  help: |-
    Sintaxe: SAREGISTER <nickname> <palavra-passe> [email]

    Regista administrativamente um nickname de forma imediata sem exigir
    verificação do cliente nem limites de frequência.

    No modo TOKEN, o token de recuperação é apresentado uma vez ao operador.
    No modo EMAIL, o token de recuperação é enviado para o endereço de email indicado.
  example: "%command_prefix%SAREGISTER Alice PalavraPasse123"
  examples:
    - "%command_prefix%SAREGISTER Bob PalavraPasse456 bob@exemplo.pt"
  success_token: "O nickname %nickname% foi registado. Token de recuperação: %token%"
  success_email: "O nickname %nickname% foi registado. Token de recuperação enviado para %email%."
  invalid_nickname: "Nickname inválido %nickname%."

# --- SASET (IRCop) ------------------------------------------------------------
saset:
  syntax: "SASET <nickname> <opção> [parâmetros]"
  short: "Modificar as configurações de outro nickname."
  help: |-
    Permite a um IRCop alterar as definições de outro nickname registado. Não
    admite nicknames Root, IRCop ou de serviços.
  example: "%command_prefix%SASET Utilizador PRIVATE ON"
  examples:
    - "%command_prefix%SASET Utilizador TIMEZONE OFF"
  unknown_option: "Opção desconhecida %option%. Opções disponíveis: %options%."
  cannot_modify_oper: "Não é possível modificar um nickname de Operador de IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <nickname> PASSWORD <nova_palavra-passe>"
    short: "Alterar a palavra-passe de um nickname."
    help: "Altera a palavra-passe de outro nickname. A alteração é imediata."
    example: "%command_prefix%SASET Utilizador PASSWORD ClaveSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <nickname> EMAIL <novo_email>"
    short: "Alterar o email de um nickname."
    help: |-
      Altera o email de outro nickname. A alteração é imediata e não requer o token
      de recuperação nem envia um email de confirmação.
      BADMAIL não restringe esta alteração administrativa de email.
    example: "%command_prefix%SASET Utilizador EMAIL utilizador@exemplo.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <nickname> LANGUAGE <código>"
    short: "Alterar o idioma de um nickname."
    help: |-
      Altera o idioma de outro nickname. Estão disponíveis en (inglês) e pt
      (português).
    example: "%command_prefix%SASET Utilizador LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <nickname> TIMEZONE {<fuso_horário>|OFF}"
    short: "Alterar o fuso horário de um nickname."
    help: "Define ou remove o fuso horário de outro nickname. Use OFF para o remover."
    example: "%command_prefix%SASET Utilizador TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Utilizador TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <nickname> PRIVATE {ON|OFF}"
    short: "Alterar a privacidade de um nickname."
    help: "Ativa ou desativa a privacidade das informações de outro nickname."
    example: "%command_prefix%SASET Utilizador PRIVATE ON"
    examples:
      - "%command_prefix%SASET Utilizador PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <nickname> MSG {ON|OFF}"
    short: "Alterar a preferência de mensagens de um nickname."
    help: "Define se outro nickname recebe respostas como PRIVMSG (ON) ou NOTICE (OFF)."
    example: "%command_prefix%SASET Utilizador MSG ON"
    examples:
      - "%command_prefix%SASET Utilizador MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <nickname> VHOST [vhost]"
    short: "Alterar o host virtual de um nickname."
    help: |-
      Define ou remove o host virtual de outro nickname. Para o remover, execute
      SASET <nickname> VHOST sem valor.
    example: "%command_prefix%SASET Utilizador VHOST utilizador.exemplo.org"
    examples:
      - "%command_prefix%SASET Utilizador VHOST"

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Forçar renomeação de um nickname ligado para um nickname aleatório."
  help: |-
    Obriga um nickname ligado a mudar para um nome aleatório com um prefixo
    definido pela rede.
  example: "%command_prefix%RENAME Problemático"
  cannot_rename_root: "Não é possível renomear o utilizador root %nickname%."
  cannot_rename_oper: "Não é possível renomear o operador de IRC %nickname%."
  cannot_rename_service: "Não é possível renomear o nickname de serviço %nickname%."
  success: "O nickname %nickname% foi renomeado para %new_nick%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Definir ou remover proteção de expiração para um nickname."
  help: |-
    Controla se o nickname expira por inatividade.
    ON evita a expiração e OFF aplica as regras normais.
  example: "%command_prefix%NOEXPIRE Utilizador ON"
  examples:
    - "%command_prefix%NOEXPIRE Utilizador OFF"
  success_on: "O nickname %nickname% está agora protegido contra expiração."
  success_off: "O nickname %nickname% irá agora expirar normalmente."
  forbidden: "O nickname %nickname% está proibido."
  suspended: "O nickname %nickname% está suspenso."

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Gerir o modo de registo da rede."
  help: |-
    Configura o modo de registo para novas contas.

    %emphasis_0% Envia o token de verificação para o email do utilizador.
    %emphasis_1% Entrega o token de verificação diretamente por IRC.
    %emphasis_2% Mostra o modo de registo atual sem o alterar.

    Os registos pendentes mantêm o modo com que foram iniciados.

    No modo TOKEN, o comando RESEND continua desativado para todos os utilizadores.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Modo de registo atual: %mode%."
  changed: "Modo de registo alterado para %mode%."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <duração> <motivo>"
  short: "Suspender um nickname."
  help: |-
    Impede o proprietário de se identificar. A duração pode ser indicada em dias
    (d), horas (h), minutos (m) ou 0 para uma suspensão permanente. Não é possível
    suspender Operadores IRC nem utilizadores Root.
  example: "%command_prefix%SUSPEND UtilizadorInadequado 7d Spam en #ajuda"
  examples:
    - "%command_prefix%SUSPEND Problemático 0 Evasão do banimento"
  success: "O nickname %nickname% foi suspenso até %duration%."
  already_suspended: "O nickname %nickname% já está suspenso."
  forbidden: "O nickname %nickname% está proibido e não pode ser suspenso."
  cannot_suspend_oper: "Não é possível suspender o operador de IRC %nickname%."
  cannot_suspend_root: "Não é possível suspender o utilizador root %nickname%."
  cannot_suspend_service: "Não é possível suspender o nickname de serviço %nickname%."
  invalid_duration: "Duração inválida. Use: %duration_format% (ex: 7d, 12h, 30m) ou %permanent% para permanente."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Remover a suspensão de um nickname."
  help: |-
    Remove uma suspensão ativa para que o proprietário se possa voltar a
    identificar.
  example: "%command_prefix%UNSUSPEND Utilizador"
  success: "A suspensão foi levantada de %nickname%."
  not_suspended: "O nickname %nickname% não está suspenso."

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <motivo>"
  short: "Bloquear permanentemente um nickname de ser usado."
  help: |-
    Proíbe permanentemente um nickname para que ninguém o possa registar ou usar.
    Se estiver registado, é eliminado; se estiver ligado, é obrigado a mudar para
    um nickname aleatório. Não é possível proibir utilizadores Root, IRCops ou
    serviços.
  example: "%command_prefix%FORBID UtilizadorInadequado Violaciones repetidas de política"
  success: "O nickname %nickname% foi proibido."
  updated: "O motivo de proibição de %nickname% foi atualizado."
  reason_required: "Deve fornecer um motivo para a proibição."
  cannot_forbid_root: "Não é possível proibir o utilizador root %nickname%."
  cannot_forbid_oper: "Não é possível proibir o operador de IRC %nickname%."
  cannot_forbid_service: "Não é possível proibir o nickname de serviço %nickname%."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Remover uma proibição de nickname."
  help: "Remove a proibição para que o nickname possa voltar a ser utilizado."
  example: "%command_prefix%UNFORBID NicknameProibido"
  success: "O nickname %nickname% já não está proibido."
  not_forbidden: "O nickname %nickname% não está proibido."

# --- FORBIDVHOST (IRCop) ------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST <opção> [parâmetros]"
  short: "Gerir padrões de vhost proibidos."
  help: |-
    Gere os padrões que impedem a definição de vhosts correspondentes a SET VHOST.
    O carácter * corresponde a qualquer sequência e ? a um carácter. Requer
    privilégios de Operador IRC.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Subcomando desconhecido %sub%. Use ADD, DEL ou LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <padrão>"
    short: "Adicionar um padrão de vhost proibido."
    help: |-
      Adiciona um padrão à lista. Os utilizadores não poderão definir vhosts
      correspondentes através de SET VHOST. * corresponde a qualquer sequência e ?
      a um carácter.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Padrão de vhost proibido adicionado: %pattern%"
    already_exists: "O padrão %pattern% já existe."
    invalid: "Formato de padrão de vhost inválido."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <padrão>"
    short: "Remover um padrão de vhost proibido."
    help: "Remove um padrão da lista de vhosts proibidos."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Padrão de vhost proibido removido: %pattern%"
    not_found: "Padrão %pattern% não encontrado."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Listar todos os padrões de vhost proibidos."
    syntax: "FORBIDVHOST LIST"
    help: "Mostra todos os padrões de vhost proibidos."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Padrões de vhost proibidos (%count%):"
    entry: "%index%. %pattern% — por %nickname% (%date%)"
    empty: "Nenhum padrão de vhost proibido."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Remover um nickname registado."
  help: |-
    Marca um nickname registado para eliminação durante o período de tolerância;
    pode ser restaurado com RESTORE. Adicione FORCE para o eliminar definitivamente.
    Não é possível eliminar utilizadores Root, IRCops ou serviços, nem o seu próprio
    nickname.
  force:
    short: "Elimina permanentemente um nickname pendente de eliminação."
  example: "%command_prefix%DROP ContaAntiga"
  examples:
    - "%command_prefix%DROP ContaAntiga FORCE"
  suspended: "O nickname %nickname% está suspenso. Remova a suspensão primeiro."
  forbidden: "O nickname %nickname% está proibido."
  cannot_drop_root: "Não é possível remover o utilizador root %nickname%."
  cannot_drop_oper: "Não é possível remover o operador de IRC %nickname%."
  cannot_drop_self: "Não pode remover o seu próprio nickname."
  success: "O nickname %nickname% foi marcado para eliminação e pode ser restaurado durante o período de carência."
  force_success: "O nickname %nickname% foi eliminado permanentemente."
  pending_deletion: "O nickname %nickname% já está pendente de eliminação. Use DROP <nickname> FORCE para eliminá-lo permanentemente."
  cannot_drop_service: "Não é possível remover o nickname de serviço %nickname%."

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Restaurar um nickname pendente de eliminação."
  help: |-
    Restaura um nickname pendente de eliminação enquanto estiver no período de
    tolerância.
  example: "%command_prefix%RESTORE ContaAntiga"
  success: "O nickname %nickname% foi restaurado."
  not_pending_deletion: "O nickname %nickname% não está pendente de eliminação."

# --- RESCUE -------------------------------------------------------------------
rescue:
  issued: |-
    Token de recuperação: %token_display%

    Guarde este token num local seguro. Vai precisar dele para recuperar o seu nickname se se esquecer da palavra-passe.

    Para o confirmar, utilize: /msg %bot% %verify%

    %warning%
  issued_warning: "IMPORTANTE: Só o último token gerado é válido. Depois de confirmado, não voltará a ser mostrado. Não o partilhe com ninguém."
  confirmed: "O token de recuperação foi confirmado. Guarde-o em segurança."
  unavailable: "Autentique-se e confirme o token de recuperação com %command_0% antes desta operação."
  unavailable_command_0: "VERIFY"
  locked_out: "Demasiados tokens inválidos. Tente novamente em %seconds% segundos."
  throttled: "Demasiados tokens inválidos. Tente novamente em %minutes% minuto(s)."
  replaced: "O token de recuperação foi substituído pelo token do email que acabou de validar. Guarde-o em segurança."
  optional_replacement: |-
    Novo token de recuperação opcional: %token_display%

    Para substituir o seu token de recuperação atual, utilize: /msg %bot% %verify%

    O token atual mantém-se válido até à confirmação.

    Se não o quiser alterar, ignore esta mensagem.
  replacement_unavailable: "A palavra-passe foi reposta, mas não foi possível emitir um novo token. O token atual continua válido."
  temporarily_unavailable: "A entrega do token de recuperação está temporariamente indisponível. Tente mais tarde."


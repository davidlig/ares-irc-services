  help: |-
    Mostra os dados de registo de um nickname: data de registo, estado da ligação,
    última mensagem de saída e endereço de email.

    O email só é visível para o proprietário identificado. Se o nickname for
    privado, apenas o proprietário e os Operadores IRC podem ver a informação.
  example: "%command_prefix%INFO Utilizador"
  private: "As informações do nickname %nickname% são privadas."
  header: "Informações do nickname %nickname%"
  status: "%label%            : %status%"
  label_status: "Estado"
  status_registered: "Registado"
  status_suspended: "Suspenso"
  status_forbidden: "Proibido"
  status_pending_deletion: "Pendente de eliminação"
  reason: "%label%                 : %reason%"
  label_reason: "Motivo"
  suspended_until: "%label%        : %date%"
  label_suspended_until: "Termina em"
  suspended_permanent: "%label%        : Permanente"
  label_suspended_permanent: "Termina em"
  registered_at: "%label%         : %date%"
  label_registered_at: "Registado"
  last_seen_online: "%label%        : %online%"
  label_last_seen_online: "Última vez"
  value_last_seen_online: "ONLINE AGORA"
  last_seen_at: "%label%        : %date%"
  label_last_seen_at: "Última vez"
  last_seen_never: "%label%        : Nunca"
  label_last_seen_never: "Última vez"
  last_quit: "%label%  : %message%"
  label_last_quit: "Última msg saída"
  last_connect: "%label%     : %ip% (%host%)"
  label_last_connect: "Última vez de"
  language: "%label%            : %language%"
  label_language: "Idioma"
  email: "%label%             : %email%"
  label_email: "Email"
  vhost: "%label%             : %vhost%"

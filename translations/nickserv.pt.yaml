# Traduções de NickServ — Português
# Domínio: nickserv
#
# Códigos de formatação IRC (aspas duplas ou blocos literais !irc):
#   \x02        ativa/desativa o negrito
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermelho, 07=laranja, 14=cinzento escuro)
#   \x03        repõe a cor
#   \x0F        repõe toda a formatação
#
# As cores IRC usam números DECIMAIS (0-15), não hexadecimais.
#   \x0314 = cinzento escuro (14 decimal): CORRETO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multilinha: !irc |- com quebras de linha e espaços reais.
# Os blocos sem etiqueta não descodificam escapes; preserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O apresentador acrescenta /msg sem cor e uma margem de dois espaços.

# --- REGISTER -----------------------------------------------------------------
register:
  token_unavailable: !irc |-
    O registo está pendente, mas não foi possível entregar o token.
    Aguarde a sua expiração antes de se registar novamente.
  syntax: "REGISTER <palavra-passe> [email]"
  short: "Registe o seu nickname nos serviços."
  help: |-
    Registe o seu nickname. A rede indicará o token de verificação por chat ou
    email, conforme a configuração. Depois de validado, será o seu token de
    recuperação permanente: guarde-o num local seguro. A validade de %duration%
    aplica-se apenas antes da validação.
    Não são permitidos domínios de email bloqueados administrativamente.
  example: "%command_prefix%REGISTER Palavra$Passe_Segura_123"
  examples:
    - "%command_prefix%REGISTER Palavra$Passe_Segura_123 utilizador@exemplo.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Foi enviado um token de verificação para %email%."
  pending_line_2: "Execute /msg %bot% %verify% para concluir o registo."
  pending_line_3: "Não recebeu? Verifique o spam ou use /msg %bot% %resend%"
  pending_line_4: "O token expira dentro de %duration%."
  already_registered: "O nickname %nickname% já está registado."
  already_pending: "O registo de %nickname% está pendente. Use %verify%. Se o token foi enviado por email e existe um endereço válido associado, pode pedir outro com %resend%."
  forbidden: "O nickname %nickname% não pode ser registado nesta rede."
  pending_deletion: "O nickname %nickname% está pendente de eliminação e não pode ser registado."
  invalid_email: "O endereço de email fornecido não é válido."
  email_already_used: "O email %email% já está em uso por outro nickname. Use um endereço diferente."
  throttled: "Deve aguardar %minutes% minuto(s) antes de tentar registar novamente."
  guest_prefix_forbidden: "Não pode registar um nick que começa com %prefix%."

# --- IDENTIFY -----------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <palavra-passe>"
  short: "Identifique-se como proprietário de um nickname."
  help: |-
    Autentica a sua sessão com %nickserv% usando o seu nickname e palavra-passe.
    Após uma identificação bem-sucedida receberá o modo registado %emphasis_0%
    e, se estava a usar um nick de convidado, o seu nick registado será restaurado.
  example: "%command_prefix%IDENTIFY Utilizador <palavra-passe>"
  native_syntax: "/NICK <nickname>:<palavra-passe> | /NICK <nickname>!<palavra-passe>"
  native_short: "Mostra a sintaxe nativa de autenticação do apelido."
  native_help: |-
    Este protocolo autentica contas através de mudanças de apelido.
    Use %emphasis_0% ou, se o apelido estiver ocupado, %emphasis_1%.
  native_example: "/NICK Utilizador:<palavra-passe>"
  native_examples:
    - "%command_prefix%/NICK Utilizador!<palavra-passe>"
  native_authentication: "Este protocolo gere a autenticação através de mudanças de apelido. Use %command_0% ou, se o apelido estiver ocupado, %command_1%."
  native_authentication_command_0: "/NICK <nickname>:<palavra-passe>"
  native_authentication_command_1: "/NICK <nickname>!<palavra-passe>"
  success: "Está agora identificado como %nickname%."
  already_identified: "Já está identificado como %nickname%."
  invalid_credentials: "Palavra-passe incorreta. Tente novamente."
  locked_out: "Demasiadas tentativas falhadas. Tente novamente dentro de %minutes% minuto(s)."
  ghost_released: "A sessão fantasma que ocupava %nickname% foi desligada."
  kill_reason: "Nick %nickname% recuperado por %source% (o proprietário registado identificou-se)"
  pending: |-
    %first%
    %second%
  pending_line_1: "O nickname %nickname% aguarda verificação por email."
  pending_line_2: "Execute /msg %bot% %command_0% ou /msg %bot% %command_1%"
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "O nickname %nickname% está suspenso. Motivo: %reason%"
  forbidden: "O nickname %nickname% não pode ser usado nesta rede."
  pending_deletion: "O nickname %nickname% está pendente de eliminação e não pode ser usado."

# --- VERIFY -------------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirma um registo ou token de recuperação."
  help: |-
    Depois de validado, este token será o seu token de recuperação permanente.
    Guarde-o num local seguro: poderá utilizá-lo para recuperar o nickname.
    A validade de %duration% aplica-se apenas antes da validação.
  example: "%command_prefix%VERIFY <token_recebido>"
  success: "O nickname %nickname% foi registado com sucesso e agora está identificado."
  success_native: "O nickname %nickname% foi registado com sucesso. Use a autenticação nativa indicada abaixo."
  invalid_token: "O token de recuperação é inválido."
  no_pending: "Não tem nenhum registo pendente para verificar."

# --- RESEND -------------------------------------------------------------------
resend:
  disabled: "Não pode pedir outro token com %resend% porque este registo entrega o token diretamente por chat."
  syntax: "RESEND"
  short: "Reenviar o token de verificação para o seu email."
  help: |-
    RESEND só está disponível se o token de verificação tiver sido enviado por
    email.
    Depois de validado, este será o seu token de recuperação permanente.
    Guarde-o num local seguro: poderá utilizá-lo para recuperar o nickname.
    A validade de %duration% aplica-se apenas antes da validação.
    Ao usar RESEND, receberá um novo token por email.
    O prazo do registo pendente será renovado por %duration%.
  example: "%command_prefix%RESEND"
  success: "Token de verificação reenviado para %email%."
  no_pending: "Não tem nenhum registo pendente para verificar."
  throttled: "Deve aguardar %minutes% minuto(s) antes de solicitar outro email de verificação."

# --- RECOVER ------------------------------------------------------------------
recover:
  no_email: "Não está definido nenhum email para o nickname %nickname%. A recuperação não está disponível."
  email_sent: "Um token de recuperação foi enviado para %email_hint%. Verifique a sua caixa de entrada (e a pasta de spam)."
  pending_deletion: "O apelido %nickname% está pendente de eliminação e não pode ser recuperado."
  instructions: "EMAIL: %command_0% solicita um token provisório por email. TOKEN: forneça o token confirmado. %command_1% aceita o token válido do email ou o confirmado. O do email substitui o guardado apenas após validação. Usar o guardado oferece uma substituição opcional com %command_2%; ignore a mensagem para o manter."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <nickname> [token]"
  short: "Recupere o seu nickname se perdeu a sua palavra-passe."
  help: |-
    Sem token, peça por email um token provisório.
    Também pode fornecer um token de recuperação válido; se for provisório,
    substitui o token guardado apenas depois de validado. Ao usar o token guardado,
    é oferecida uma substituição opcional com VERIFY; ignore a mensagem se quiser
    manter o atual.
  example: "%command_prefix%RECOVER Utilizador"
  examples:
    - "%command_prefix%RECOVER Utilizador <token_recebido>"
  pending: "O registo de %nickname% está pendente. Use %command_0%. Se o token foi enviado por email e existe um endereço válido associado, pode pedir outro com %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "O nickname %nickname% está suspenso. Motivo: %reason%"
  forbidden: "O nickname %nickname% não pode ser usado nesta rede."
  throttled: "Demasiados tokens inválidos. Tente novamente em %minutes% minuto(s)."
  invalid_token: "O token de recuperação é inválido."
  success_identify: "Palavra-passe redefinida. Identifique-se agora: %identify_cmd%"
  success_then_change: "Depois altere a palavra-passe: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <nova_palavra-passe>"

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <opção> [parâmetros]"
  short: "Alterar as opções do seu nickname."
  help: |-
    Altera as definições do seu nickname. Tem de estar identificado para alterar
    estas opções.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Opção desconhecida %option%. Opções disponíveis: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <nova_palavra-passe>"
    short: "Alterar a sua palavra-passe do nickname."
    help: |-
      Altera a palavra-passe do seu nickname. A nova palavra-passe tem
      efeito imediato. Escolha uma palavra-passe forte de pelo menos 6 caracteres
      que não use noutros serviços.
    example: "%command_prefix%SET PASSWORD Palavra$Passe_Segura_123"
    success: "A sua palavra-passe foi atualizada com sucesso."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Use %value% com o token de recuperação confirmado."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Altera o email utilizando o seu token de recuperação confirmado."
    help: |-
      SET EMAIL altera o endereço de contacto após validar o token de recuperação,
      sem o consumir. Verifica o formato e a unicidade; não envia email de
      confirmação.
      Não são permitidos domínios de email bloqueados administrativamente.
    example: "%command_prefix%SET EMAIL utilizador@exemplo.com <token-confirmado>"
    success: "O seu email foi atualizado para %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Foi enviado um token de confirmação para %current_email%."
    pending_line_2: "Para confirmar a alteração para %new_email%, execute:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "O token expira em 1 hora."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "O token é inválido ou expirou. Solicite um novo com %value%."
    invalid_token_value: "SET EMAIL <novo_email>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <código>"
    short: "Alterar o idioma que os serviços usam para comunicar consigo."
    help: |-
      Altera o idioma que %nickserv% e outros serviços usam quando falam consigo.
      Idiomas disponíveis:
      %emphasis_0% (Catalão)
      %emphasis_1% (Alemão)
      %emphasis_2% (Grego)
      %emphasis_3% (Inglês)
      %emphasis_4% (Espanhol)
      %emphasis_5% (Basco)
      %emphasis_6% (Francês)
      %emphasis_7% (Galego)
      %emphasis_8% (Italiano)
      %emphasis_9% (Holandês)
      %emphasis_10% (Polaco)
      %emphasis_11% (Português)
      %emphasis_12% (Romeno)
      %emphasis_13% (Turco)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Idioma alterado para %language%."
    invalid: "Idioma não suportado. Idiomas disponíveis: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <fuso_horário>"
    short: "Definir o fuso horário usado ao mostrar datas."
    help: |-
      Define o fuso horário utilizado por %nickserv% para apresentar as datas.
      Consulte
      HELP SET TIMEZONE para ver as regiões. Use OFF para o remover.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Fuso horário definido como %timezone%. As datas serão mostradas neste fuso."
    cleared: "Fuso horário removido. As datas usarão o padrão da rede."
    invalid: "Fuso horário inválido %timezone%. Use um identificador válido (ex: UTC, Europe/Lisbon)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Mostra ou oculta as informações do seu nickname."
    help: |-
      Controla a visibilidade das informações do seu nickname no comando INFO.
      Com %emphasis_0% apenas você e Operadores de IRC podem ver os seus detalhes.
      Com %emphasis_1% as suas informações são públicas para todos.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "As informações do seu nickname são agora %value%."
    on_value: "privadas"
    off: "As informações do seu nickname são agora %value%."
    off_value: "públicas"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Altera a forma como os serviços comunicam consigo."
    help: |-
      Controla como %nickserv% e os restantes serviços lhe enviam mensagens.
      Com %emphasis_0%, as respostas são enviadas como %emphasis_1%.
      Com %emphasis_2%, as respostas são enviadas como %emphasis_3%.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "As mensagens dos serviços serão agora enviadas como %value%."
    on_value: "PRIVMSG"
    off: "As mensagens dos serviços serão agora enviadas como %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Define ou remove o seu host virtual."
    help: |-
      Define um nome de host personalizado que os outros utilizadores verão quando
      estiver identificado.

      Para o remover, execute %emphasis_0% sem indicar um valor.

      Só são permitidas letras (a-z, A-Z), algarismos, hífenes e pontos. Cada bloco
      tem de começar e terminar com uma letra ou um algarismo. O host pode ter até
      48 caracteres e tem de ser único por nickname.
    example: "%command_prefix%SET VHOST utilizador.exemplo.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "O seu host virtual foi definido como %vhost%."
    cleared: "O seu host virtual foi removido."
    invalid: "Vhost inválido. Apenas letras, dígitos, hífen e ponto (não no início/fim de bloco); máx. 48 caracteres."
    taken: "Esse vhost já está em uso por outro nickname."
    forced: "O seu vhost é configurado automaticamente e não pode ser alterado com SET VHOST."

# --- INFO ---------------------------------------------------------------------

# Traduções de NickServ — Português
# Domínio: nickserv
#
# Códigos de formatação IRC (aspas duplas ou blocos literais !irc):
#   \x02        ativa/desativa o negrito
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermelho, 07=laranja, 14=cinzento escuro)
#   \x03        repõe a cor
#   \x0F        repõe toda a formatação
#
# As cores IRC usam números DECIMAIS (0-15), não hexadecimais.
#   \x0314 = cinzento escuro (14 decimal): CORRETO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multilinha: !irc |- com quebras de linha e espaços reais.
# Os blocos sem etiqueta não descodificam escapes; preserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O apresentador acrescenta /msg sem cor e uma margem de dois espaços.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    \x0304✗\x03 O registo está pendente, mas não foi possível entregar o token.
    Aguarde a sua expiração antes de se registar novamente.
  syntax: "REGISTER <password> [email]"
  short: "Registe o seu nickname nos serviços."
  help: |-
    Registe o seu nickname. A rede indicará o token de verificação por chat ou
    email, conforme a configuração. Depois de validado, será o seu token de
    recuperação permanente: guarde-o num local seguro. A validade de %duration%
    aplica-se apenas antes da validação.
  example: "%command_prefix%\x02\x0303REGISTER Palavra$Passe_Segura_123\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGISTER Palavra$Passe_Segura_123 utilizador@exemplo.com\x03\x0F"
  pending: !irc |-
    \x0307→\x03 Foi enviado um token de verificação para \x02%email%\x02.
      Execute /msg %bot% \x0303VERIFY <token>\x03 para concluir o registo.
      Não recebeu? Verifique o spam ou use /msg %bot% \x0303RESEND\x03
      O token expira dentro de \x02%duration%\x02.
  already_registered: "\x0304✗\x03 O nickname \x02%nickname%\x02 já está registado."
  already_pending: "\x0307→\x03 O registo de \x02%nickname%\x02 está pendente. Use \x0303VERIFY <token>\x03. Se o token foi enviado por email e existe um endereço válido associado, pode pedir outro com \x0303RESEND\x03."
  forbidden: "\x0304✗\x03 O nickname \x02%nickname%\x02 não pode ser registado nesta rede."
  pending_deletion: "\x0304✗\x03 O nickname \x02%nickname%\x02 está pendente de eliminação e não pode ser registado."
  invalid_email: "\x0304✗\x03 O endereço de email fornecido não é válido."
  email_already_used: "\x0304✗\x03 O email \x02%email%\x02 já está em uso por outro nickname. Use um endereço diferente."
  throttled: "\x0304✗\x03 Deve aguardar \x02%minutes%\x02 minuto(s) antes de tentar registar novamente."
  guest_prefix_forbidden: "\x0304✗\x03 Não pode registar um nick que começa com \x02%prefix%\x02."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirma um registo ou token de recuperação."
  help: |-
    Depois de validado, este token será o seu token de recuperação permanente.
    Guarde-o num local seguro: poderá utilizá-lo para recuperar o nickname.
    A validade de %duration% aplica-se apenas antes da validação.
  example: "%command_prefix%\x02\x0303VERIFY <token_recebido>\x03\x0F"
  success: "\x0303✔\x03 O nickname \x02%nickname%\x02 foi registado com sucesso e agora está identificado."
  success_native: "\x0303✔\x03 O nickname \x02%nickname%\x02 foi registado com sucesso. Use a autenticação nativa indicada abaixo."
  invalid_token: "\x0304✗\x03 O token de recuperação é inválido."
  no_pending: "\x0304✗\x03 Não tem nenhum registo pendente para verificar."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "\x0307ℹ\x03 Não pode pedir outro token com \x0303RESEND\x03 porque este registo entrega o token diretamente por chat."
  syntax: "RESEND"
  short: "Reenviar o token de verificação para o seu email."
  help: |-
    RESEND só está disponível se o token de verificação tiver sido enviado por
    email.
    Depois de validado, este será o seu token de recuperação permanente.
    Guarde-o num local seguro: poderá utilizá-lo para recuperar o nickname.
    A validade de %duration% aplica-se apenas antes da validação.
    Ao usar RESEND, receberá um novo token por email.
    O prazo do registo pendente será renovado por %duration%.
  example: "%command_prefix%\x02\x0303RESEND\x03\x0F"
  success: "\x0307→\x03 Token de verificação reenviado para \x02%email%\x02."
  no_pending: "\x0304✗\x03 Não tem nenhum registo pendente para verificar."
  throttled: "\x0304✗\x03 Deve aguardar \x02%minutes%\x02 minuto(s) antes de solicitar outro email de verificação."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "\x0304✗\x03 Não está definido nenhum email para o nickname \x02%nickname%\x02. A recuperação não está disponível."
  email_sent: "\x0307→\x03 Um token de recuperação foi enviado para \x02%email_hint%\x02. Verifique a sua caixa de entrada (e a pasta de spam)."
  pending_deletion: "\x0304✗\x03 O apelido \x02%nickname%\x02 está pendente de eliminação e não pode ser recuperado."
  instructions: "\x0307ℹ\x03 EMAIL: \x0303RECOVER %nickname%\x03 solicita um token provisório por email. TOKEN: forneça o token confirmado. \x0303RECOVER %nickname% <token>\x03 aceita o token válido do email ou o confirmado. O do email substitui o guardado apenas após validação. Usar o guardado oferece uma substituição opcional com \x0303VERIFY\x03; ignore a mensagem para o manter."
  syntax: "RECOVER <nickname> [token]"
  short: "Recupere o seu nickname se perdeu a sua palavra-passe."
  help: |-
    Sem token, peça por email um token provisório.
    Também pode fornecer um token de recuperação válido; se for provisório,
    substitui o token guardado apenas depois de validado. Ao usar o token guardado,
    é oferecida uma substituição opcional com VERIFY; ignore a mensagem se quiser
    manter o atual.
  example: "%command_prefix%\x02\x0303RECOVER Utilizador\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303RECOVER Utilizador <token_recebido>\x03\x0F"
  pending: "\x0307→\x03 O registo de \x02%nickname%\x02 está pendente. Use \x0303VERIFY <token>\x03. Se o token foi enviado por email e existe um endereço válido associado, pode pedir outro com \x0303RESEND\x03."
  suspended: "\x0304✗\x03 O nickname \x02%nickname%\x02 está suspenso. Motivo: %reason%"
  forbidden: "\x0304✗\x03 O nickname \x02%nickname%\x02 não pode ser usado nesta rede."
  throttled: "\x0304✗\x03 Demasiados tokens inválidos. Tente novamente em \x02%minutes%\x02 minuto(s)."
  invalid_token: "\x0304✗\x03 O token de recuperação é inválido."
  success_identify: "\x0303✔\x03 Palavra-passe redefinida. Identifique-se agora: \x0303%identify_cmd%\x03"
  success_then_change: "Depois altere a palavra-passe: /msg %bot% \x0303SET PASSWORD <nova_palavra-passe>\x03"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <palavra-passe>"
  short: "Identifique-se como proprietário de um nickname."
  help: !irc |-
    Autentica a sua sessão com %nickserv% usando o seu nickname e palavra-passe.
    Após uma identificação bem-sucedida receberá o modo registado \x02+r\x02
    e, se estava a usar um nick de convidado, o seu nick registado será restaurado.
  example: "%command_prefix%\x02\x0303IDENTIFY Utilizador <palavra-passe>\x03\x0F"
  native_syntax: "/NICK <nickname>:<palavra-passe> | /NICK <nickname>!<palavra-passe>"
  native_short: "Mostra a sintaxe nativa de autenticação do apelido."
  native_help: |-
    Este protocolo autentica contas através de mudanças de apelido.
    Use /NICK <nickname>:<palavra-passe> ou, se o apelido estiver ocupado, /NICK <nickname>!<palavra-passe>.
  native_example: "\x02\x0303/NICK Utilizador:<palavra-passe>\x03\x0F"
  native_examples:
    - "%command_prefix%\x02\x0303/NICK Utilizador!<palavra-passe>\x03\x0F"
  native_authentication: "\x0307ℹ\x03 Este protocolo gere a autenticação através de mudanças de apelido. Use \x0303/NICK <nickname>:<palavra-passe>\x03 ou, se o apelido estiver ocupado, \x0303/NICK <nickname>!<palavra-passe>\x03."
  success: "\x0303✔\x03 Está agora identificado como \x02%nickname%\x02."
  already_identified: "\x0307ℹ\x03 Já está identificado como \x02%nickname%\x02."
  invalid_credentials: "\x0304✗\x03 Palavra-passe incorreta. Tente novamente."
  locked_out: "\x0304✗\x03 Demasiadas tentativas falhadas. Tente novamente dentro de \x02%minutes%\x02 minuto(s)."
  ghost_released: "\x0307⚡\x03 A sessão fantasma que ocupava \x02%nickname%\x02 foi desligada."
  kill_reason: "Nick %nickname% recuperado por %source% (o proprietário registado identificou-se)"
  pending: !irc |-
    \x0304✗\x03 O nickname \x02%nickname%\x02 aguarda verificação por email.
      Execute /msg %bot% \x0303VERIFY <token>\x03 ou /msg %bot% \x0303RESEND\x03
  suspended: "\x0304✗\x03 O nickname \x02%nickname%\x02 está suspenso. Motivo: %reason%"
  forbidden: "\x0304✗\x03 O nickname \x02%nickname%\x02 não pode ser usado nesta rede."
  pending_deletion: "\x0304✗\x03 O nickname \x02%nickname%\x02 está pendente de eliminação e não pode ser usado."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <nickname>"
  short: "Mostrar o estado de registo de um nickname."
  help: |-
    Mostra o estado atual de um nickname: se está registado, à espera de
    verificação, suspenso, etc.
  example: "%command_prefix%\x02\x0303STATUS Utilizador\x03\x0F"
  header: "\x02Estado do nick \x0307%nickname%\x03\x02"
  unregistered: "  Estado          : Não registado"
  not_registered_offline: "  Estado          : \x0315Não registado\x03"
  pending: "  Estado          : \x0307Pendente de verificação\x03"
  pending_expires: "  Expira em       : %minutes% minuto(s)"
  pending_expires_at: "  Expira em       : %date%"
  not_connected: "  Estado          : \x0315Não ligado\x03"
  not_identified: "  Estado          : \x0307Não identificado\x03"
  identified: "  Estado          : \x0303Identificado\x03"
  suspended: "  Estado          : \x0304Suspenso\x03"
  suspended_reason: "  Motivo          : %reason%"
  suspended_until: "  Termina em      : %date%"
  suspended_permanent: "  Termina em      : Permanente"
  forbidden: "  Estado          : \x0304Proibido\x03"
  forbidden_reason: "  Motivo          : %reason%"
  pending_deletion: "  \x0314Estado\x03          : \x0307Pendente de eliminação\x03"
  pending_deletion_at: "  \x0314Eliminado\x03       : %date%"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <nickname>"
  short: "Mostrar informações sobre um nickname registado."
  help: |-
    Mostra os dados de registo de um nickname: data de registo, estado da ligação,
    última mensagem de saída e endereço de email.

    O email só é visível para o proprietário identificado. Se o nickname for
    privado, apenas o proprietário e os Operadores IRC podem ver a informação.
  example: "%command_prefix%\x02\x0303INFO Utilizador\x03\x0F"
  private: "\x0304✗\x03 As informações do nickname \x02%nickname%\x02 são privadas."
  header: "\x02Informações do nickname \x0307%nickname%\x03\x02"
  status: "  \x0314Estado\x03            : %status%"
  status_registered: "\x0303Registado\x03"
  status_suspended: "\x0304Suspenso\x03"
  status_forbidden: "\x0304Proibido\x03"
  status_pending_deletion: "\x0307Pendente de eliminação\x03"
  reason: "  \x0314Motivo\x03                 : %reason%"
  suspended_until: "  \x0314Termina em\x03        : %date%"
  suspended_permanent: "  \x0314Termina em\x03        : Permanente"
  registered_at: "  \x0314Registado\x03         : %date%"
  last_seen_online: "  \x0314Última vez\x03        : \x0303● ONLINE AGORA\x03"
  last_seen_at: "  \x0314Última vez\x03        : %date%"
  last_seen_never: "  \x0314Última vez\x03        : Nunca"
  last_quit: "  \x0314Última msg saída\x03  : %message%"
  last_connect: "  \x0314Última vez de\x03     : %ip% (%host%)"
  language: "  \x0314Idioma\x03            : %language%"
  email: "  \x0314Email\x03             : %email%"
  vhost: "  \x0314VHost\x03             : %vhost%"
  no_expire: "  \x0314Nunca expira\x03           : Sim"
  pending_deletion_at: "  \x0314Eliminado\x03              : %date%"
  pending_deletion_until: "  \x0314Elim. definitiva\x03       : %date%"
  pending_deletion_notice: "  \x0307Este nickname está pendente de eliminação e não pode ser registado.\x03"
  channels_header: !irc |-
    \x0314
    Canais com acesso:\x03
  channels_entry_founder: "  %channel% (\x0303Fundador\x03)"
  channels_entry_successor: "  %channel% (\x0303Sucessor\x03)"
  channels_entry_access: "  %channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <opção> <valor>"
  short: "Alterar as opções do seu nickname."
  help: |-
    Altera as definições do seu nickname. Tem de estar identificado para alterar
    estas opções.
  example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
  unknown_option: "\x0304✗\x03 Opção desconhecida \x02%option%\x02. Opções disponíveis: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <nova_palavra-passe>"
    short: "Alterar a sua palavra-passe do nickname."
    help: |-
      Altera a palavra-passe do seu nickname. A nova palavra-passe tem
      efeito imediato. Escolha uma palavra-passe forte de pelo menos 6 caracteres
      que não use noutros serviços.
    example: "%command_prefix%\x02\x0303SET PASSWORD Palavra$Passe_Segura_123\x03\x0F"
    success: "\x0303✔\x03 A sua palavra-passe foi atualizada com sucesso."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "\x0304✗\x03 Use \x0303SET EMAIL <email> <token>\x03 com o token de recuperação confirmado."
    syntax: "SET EMAIL <email> <token>"
    short: "Altera o email utilizando o seu token de recuperação confirmado."
    help: |-
      SET EMAIL altera o endereço de contacto após validar o token de recuperação,
      sem o consumir. Verifica o formato e a unicidade; não envia email de
      confirmação.
    example: "%command_prefix%\x02\x0303SET EMAIL utilizador@exemplo.com <token-confirmado>\x03\x0F"
    success: "\x0303✔\x03 O seu email foi atualizado para \x02%email%\x02."
    pending_sent: !irc |-
      \x0307→\x03 Foi enviado um token de confirmação para \x02%current_email%\x02.
        Para confirmar a alteração para \x02%new_email%\x02, execute:
        /msg %bot% \x0303SET EMAIL %new_email% <token>\x03
        O token expira em 1 hora.
    invalid_token: "\x0304✗\x03 O token é inválido ou expirou. Solicite um novo com \x0303SET EMAIL <novo_email>\x03."

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <código>"
    short: "Alterar o idioma que os serviços usam para comunicar consigo."
    help: !irc |-
      Altera o idioma que %nickserv% e outros serviços usam quando falam consigo.
      Idiomas disponíveis:
        \x02ca\x02 (Catalão)
        \x02de\x02 (Alemão)
        \x02el\x02 (Grego)
        \x02en\x02 (Inglês)
        \x02es\x02 (Espanhol)
        \x02eu\x02 (Basco)
        \x02fr\x02 (Francês)
        \x02gl\x02 (Galego)
        \x02it\x02 (Italiano)
        \x02nl\x02 (Holandês)
        \x02pl\x02 (Polaco)
        \x02pt\x02 (Português)
        \x02ro\x02 (Romeno)
        \x02tr\x02 (Turco)
    example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
    success: "\x0303✔\x03 Idioma alterado para \x02%language%\x02."
    invalid: "\x0304✗\x03 Idioma não suportado. Idiomas disponíveis: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <fuso_horário>"
    short: "Definir o fuso horário usado ao mostrar datas."
    help: |-
      Define o fuso horário utilizado por %nickserv% para apresentar as datas.
      Consulte
      HELP SET TIMEZONE para ver as regiões. Use OFF para o remover.
    example: "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET TIMEZONE OFF\x03\x0F"
    success: "\x0303✔\x03 Fuso horário definido como \x02%timezone%\x02. As datas serão mostradas neste fuso."
    cleared: "\x0303✔\x03 Fuso horário removido. As datas usarão o padrão da rede."
    invalid: "\x0304✗\x03 Fuso horário inválido \x02%timezone%\x02. Use um identificador válido (ex: UTC, Europe/Lisbon)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Mostra ou oculta as informações do seu nickname."
    help: !irc |-
      Controla a visibilidade das informações do seu nickname no comando INFO.
      Com \x02PRIVATE ON\x02 apenas você e Operadores de IRC podem ver os seus detalhes.
      Com \x02PRIVATE OFF\x02 as suas informações são públicas para todos.
    example: "%command_prefix%\x02\x0303SET PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET PRIVATE OFF\x03\x0F"
    on: "\x0303✔\x03 As informações do seu nickname são agora \x02privadas\x02."
    off: "\x0303✔\x03 As informações do seu nickname são agora \x02públicas\x02."

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Altera a forma como os serviços comunicam consigo."
    help: !irc |-
      Controla como %nickserv% e os restantes serviços lhe enviam mensagens.
      Com \x02MSG ON\x02, as respostas são enviadas como \x02PRIVMSG\x02.
      Com \x02MSG OFF\x02, as respostas são enviadas como \x02NOTICE\x02.
    example: "%command_prefix%\x02\x0303SET MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET MSG OFF\x03\x0F"
    on: "\x0303✔\x03 As mensagens dos serviços serão agora enviadas como \x02PRIVMSG\x02."
    off: "\x0303✔\x03 As mensagens dos serviços serão agora enviadas como \x02NOTICE\x02."

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Define ou remove o seu host virtual."
    help: !irc |-
      Define um nome de host personalizado que os outros utilizadores verão quando
      estiver identificado.

      Para o remover, execute \x02SET VHOST\x02 sem indicar um valor.

      Só são permitidas letras (a-z, A-Z), algarismos, hífenes e pontos. Cada bloco
      tem de começar e terminar com uma letra ou um algarismo. O host pode ter até
      48 caracteres e tem de ser único por nickname.
    example: "%command_prefix%\x02\x0303SET VHOST utilizador.exemplo.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET VHOST\x03\x0F"
    success: "\x0303✔\x03 O seu host virtual foi definido como \x02%vhost%\x02."
    cleared: "\x0303✔\x03 O seu host virtual foi removido."
    invalid: "\x0304✗\x03 Vhost inválido. Apenas letras, dígitos, hífen e ponto (não no início/fim de bloco); máx. 48 caracteres."
    taken: "\x0304✗\x03 Esse vhost já está em uso por outro nickname."
    forced: "\x0304✗\x03 O seu vhost é configurado automaticamente e não pode ser alterado com SET VHOST."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <nickname> <opção> <valor>"
  short: "Modificar as configurações de outro nickname."
  help: |-
    Permite a um IRCop alterar as definições de outro nickname registado. Não
    admite nicknames Root, IRCop ou de serviços.
  example: "%command_prefix%\x02\x0303SASET Utilizador PRIVATE ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SASET Utilizador TIMEZONE OFF\x03\x0F"
  unknown_option: "\x0304✗\x03 Opção desconhecida \x02%option%\x02. Opções disponíveis: %options%."
  cannot_modify_oper: "\x0304✗\x03 Não é possível modificar um nickname de Operador de IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <nickname> PASSWORD <nova_palavra-passe>"
    short: "Alterar a palavra-passe de um nickname."
    help: "Altera a palavra-passe de outro nickname. A alteração é imediata."
    example: "%command_prefix%\x02\x0303SASET Utilizador PASSWORD ClaveSegura123\x03\x0F"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <nickname> EMAIL <novo_email>"
    short: "Alterar o email de um nickname."
    help: |-
      Altera o email de outro nickname. A alteração é imediata e não requer o token
      de recuperação nem envia um email de confirmação.
    example: "%command_prefix%\x02\x0303SASET Utilizador EMAIL utilizador@exemplo.com\x03\x0F"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <nickname> LANGUAGE <código>"
    short: "Alterar o idioma de um nickname."
    help: |-
      Altera o idioma de outro nickname. Estão disponíveis en (inglês) e pt
      (português).
    example: "%command_prefix%\x02\x0303SASET Utilizador LANGUAGE es\x03\x0F"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <nickname> TIMEZONE <fuso_horário|OFF>"
    short: "Alterar o fuso horário de um nickname."
    help: "Define ou remove o fuso horário de outro nickname. Use OFF para o remover."
    example: "%command_prefix%\x02\x0303SASET Utilizador TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Utilizador TIMEZONE OFF\x03\x0F"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <nickname> PRIVATE {ON|OFF}"
    short: "Alterar a privacidade de um nickname."
    help: "Ativa ou desativa a privacidade das informações de outro nickname."
    example: "%command_prefix%\x02\x0303SASET Utilizador PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Utilizador PRIVATE OFF\x03\x0F"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <nickname> MSG {ON|OFF}"
    short: "Alterar a preferência de mensagens de um nickname."
    help: "Define se outro nickname recebe respostas como PRIVMSG (ON) ou NOTICE (OFF)."
    example: "%command_prefix%\x02\x0303SASET Utilizador MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Utilizador MSG OFF\x03\x0F"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <nickname> VHOST [vhost]"
    short: "Alterar o host virtual de um nickname."
    help: |-
      Define ou remove o host virtual de outro nickname. Para o remover, execute
      SASET <nickname> VHOST sem valor.
    example: "%command_prefix%\x02\x0303SASET Utilizador VHOST utilizador.exemplo.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Utilizador VHOST\x03\x0F"

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [comando]"
  short: "Mostrar ajuda para os comandos %nickserv%."
  help: |-
    Mostra ajuda geral de %nickserv% ou informações detalhadas
    para um comando específico.
  examples_header: "\x02 ■ Exemplos:\x02"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET TIMEZONE Europe\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  navigation_marker: "\x0310›\x03\x0F"
  info_marker: "\x0310ℹ\x03\x0F"
  error_marker: "\x0304✗\x03\x0F"
  warning_marker: "\x0304⚠\x03\x0F"
  intro: |-
    Permite registar e proteger o seu nickname para impedir que outros utilizadores
    o utilizem. Gere a segurança da conta, personalize as preferências e recupere
    o acesso quando precisar.
  intro_expiration: "%marker% %label%: Nicknames não utilizados por mais de \x1F\x0304%days% dias\x03\x1F são removidos automaticamente."
  intro_expiration_label: "NOTA"
  general_header: "\x02 ■ Comandos disponíveis:\x02"
  command_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Opções:\x02"
  general_syntax: "HELP <comando>"
  general_footer: "%marker% Use /msg %bot% \x02\x0303%syntax%\x03\x0F para mais informações."
  set_sub_syntax: "HELP %command% <opção>"
  set_sub_footer: "%marker% Use /msg %bot% \x02\x0303%syntax%\x03\x0F para mais informações."
  syntax_label: "Sintaxe: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_auth: "Registo e autenticação"
    account_security: "Conta e segurança"
  ircop_group:
    lookup: "Pesquisa e investigação"
    account_management: "Gestão de contas"
    suspensions_bans: "Suspensões e proibições"
    deletion: "Eliminação e restauração"
  ircop_header: "\x02 ■ Comandos disponíveis para IRCops:\x02"
  set_timezone:
    index_label: "Fusos horários por região (use \x02\x0303%syntax%\x03\x0F para consultar uma região):"
    index_syntax: "HELP SET TIMEZONE <região>"
    region_header: "\x02 ■ Fusos horários de %region%:\x02"
    region_unknown: "%marker% Região desconhecida. Use \x02\x0303%syntax%\x03\x0F para o índice."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "\x0304⚠\x03 O nick \x02%nickname%\x02 está registado. Será renomeado se não se identificar."
  renamed_to: !irc |-
    \x0307→\x03 O seu nickname foi alterado para \x02%guest_nick%\x02. Para recuperar o seu nickname:
    /msg %bot% \x0303IDENTIFY %nickname% <palavra-passe>\x03
  nick_forbidden: "\x0304✗\x03 O nickname \x02%nickname%\x02 está proibido: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Obter o endereço IP real e hostname do nickname."
  help: |-
    Mostra o endereço IP e o nome de host reais de um nickname.
    Utilize com responsabilidade: é informação sensível.
  example: "%command_prefix%\x02\x0303USERIP Utilizador\x03\x0F"
  result: "\x0307ℹ\x03 Nickname: \x02%nickname%\x02 | IP: \x0307%ip%\x03 | Host: \x0307%host%\x03"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Procura nicknames pelo IP da última ligação identificada."
  help: |-
    Mostra os nicknames registados cuja última ligação identificada utilizou
    este endereço IP. O endereço guardado pode estar desatualizado.
  example: "%command_prefix%\x02\x0303WHOIP 192.0.2.10\x03\x0F"
  empty: "Não há nicknames registados correspondentes a este endereço IP."
  header: "Nicknames correspondentes:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <duração> <motivo>"
  short: "Suspender um nickname."
  help: |-
    Impede o proprietário de se identificar. A duração pode ser indicada em dias
    (d), horas (h), minutos (m) ou 0 para uma suspensão permanente. Não é possível
    suspender Operadores IRC nem utilizadores Root.
  example: "%command_prefix%\x02\x0303SUSPEND UtilizadorInadequado 7d Spam en #ajuda\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND Problemático 0 Evasão do banimento\x03\x0F"
  success: "\x0303✔\x03 O nickname \x02%nickname%\x02 foi suspenso até \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 O nickname \x02%nickname%\x02 já está suspenso."
  forbidden: "\x0304✗\x03 O nickname \x02%nickname%\x02 está proibido e não pode ser suspenso."
  cannot_suspend_oper: "\x0304✗\x03 Não é possível suspender o operador de IRC \x02%nickname%\x02."
  cannot_suspend_root: "\x0304✗\x03 Não é possível suspender o utilizador root \x02%nickname%\x02."
  cannot_suspend_service: "\x0304✗\x03 Não é possível suspender o nickname de serviço \x02%nickname%\x02."
  invalid_duration: "\x0304✗\x03 Duração inválida. Use: \x0303<d><h><m>\x03 (ex: 7d, 12h, 30m) ou \x03030\x03 para permanente."

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Remover a suspensão de um nickname."
  help: |-
    Remove uma suspensão ativa para que o proprietário se possa voltar a
    identificar.
  example: "%command_prefix%\x02\x0303UNSUSPEND Utilizador\x03\x0F"
  success: "\x0303✔\x03 A suspensão foi levantada de \x02%nickname%\x02."
  not_suspended: "\x0304✗\x03 O nickname \x02%nickname%\x02 não está suspenso."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Forçar renomeação de um nickname ligado para um nickname aleatório."
  help: |-
    Obriga um nickname ligado a mudar para um nome aleatório com um prefixo
    definido pela rede.
  example: "%command_prefix%\x02\x0303RENAME Problemático\x03\x0F"
  cannot_rename_root: "\x0304✗\x03 Não é possível renomear o utilizador root \x02%nickname%\x02."
  cannot_rename_oper: "\x0304✗\x03 Não é possível renomear o operador de IRC \x02%nickname%\x02."
  cannot_rename_service: "\x0304✗\x03 Não é possível renomear o nickname de serviço \x02%nickname%\x02."
  success: "\x0303✓\x03 O nickname \x02%nickname%\x02 foi renomeado para \x02%new_nick%\x02."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Remover um nickname registado."
  help: |-
    Marca um nickname registado para eliminação durante o período de tolerância;
    pode ser restaurado com RESTORE. Adicione FORCE para o eliminar definitivamente.
    Não é possível eliminar utilizadores Root, IRCops ou serviços, nem o seu próprio
    nickname.
  force:
    short: "Elimina permanentemente um nickname pendente de eliminação."
  example: "%command_prefix%\x02\x0303DROP ContaAntiga\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP ContaAntiga FORCE\x03\x0F"
  suspended: "\x0304✗\x03 O nickname \x02%nickname%\x02 está suspenso. Remova a suspensão primeiro."
  forbidden: "\x0304✗\x03 O nickname \x02%nickname%\x02 está proibido."
  cannot_drop_root: "\x0304✗\x03 Não é possível remover o utilizador root \x02%nickname%\x02."
  cannot_drop_oper: "\x0304✗\x03 Não é possível remover o operador de IRC \x02%nickname%\x02."
  cannot_drop_self: "\x0304✗\x03 Não pode remover o seu próprio nickname."
  success: "\x0303✓\x03 O nickname \x02%nickname%\x02 foi marcado para eliminação e pode ser restaurado durante o período de carência."
  force_success: "\x0303✓\x03 O nickname \x02%nickname%\x02 foi eliminado permanentemente."
  pending_deletion: "\x0304✗\x03 O nickname \x02%nickname%\x02 já está pendente de eliminação. Use DROP <nickname> FORCE para eliminá-lo permanentemente."
  cannot_drop_service: "\x0304✗\x03 Não é possível remover o nickname de serviço \x02%nickname%\x02."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Restaurar um nickname pendente de eliminação."
  help: |-
    Restaura um nickname pendente de eliminação enquanto estiver no período de
    tolerância.
  example: "%command_prefix%\x02\x0303RESTORE ContaAntiga\x03\x0F"
  success: "\x0303✓\x03 O nickname \x02%nickname%\x02 foi restaurado."
  not_pending_deletion: "\x0304✗\x03 O nickname \x02%nickname%\x02 não está pendente de eliminação."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <motivo>"
  short: "Bloquear permanentemente um nickname de ser usado."
  help: |-
    Proíbe permanentemente um nickname para que ninguém o possa registar ou usar.
    Se estiver registado, é eliminado; se estiver ligado, é obrigado a mudar para
    um nickname aleatório. Não é possível proibir utilizadores Root, IRCops ou
    serviços.
  example: "%command_prefix%\x02\x0303FORBID UtilizadorInadequado Violaciones repetidas de política\x03\x0F"
  success: "\x0303✔\x03 O nickname \x02%nickname%\x02 foi proibido."
  updated: "\x0303✔\x03 O motivo de proibição de \x02%nickname%\x02 foi atualizado."
  reason_required: "\x0304✗\x03 Deve fornecer um motivo para a proibição."
  cannot_forbid_root: "\x0304✗\x03 Não é possível proibir o utilizador root \x02%nickname%\x02."
  cannot_forbid_oper: "\x0304✗\x03 Não é possível proibir o operador de IRC \x02%nickname%\x02."
  cannot_forbid_service: "\x0304✗\x03 Não é possível proibir o nickname de serviço \x02%nickname%\x02."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Remover uma proibição de nickname."
  help: "Remove a proibição para que o nickname possa voltar a ser utilizado."
  example: "%command_prefix%\x02\x0303UNFORBID NicknameProibido\x03\x0F"
  success: "\x0303✔\x03 O nickname \x02%nickname%\x02 já não está proibido."
  not_forbidden: "\x0304✗\x03 O nickname \x02%nickname%\x02 não está proibido."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD|DEL|LIST} [padrão]"
  short: "Gerir padrões de vhost proibidos."
  help: |-
    Gere os padrões que impedem a definição de vhosts correspondentes a SET VHOST.
    O carácter * corresponde a qualquer sequência e ? a um carácter. Requer
    privilégios de Operador IRC.
  example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Subcomando desconhecido \x02%sub%\x02. Use ADD, DEL ou LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <padrão>"
    short: "Adicionar um padrão de vhost proibido."
    help: |-
      Adiciona um padrão à lista. Os utilizadores não poderão definir vhosts
      correspondentes através de SET VHOST. * corresponde a qualquer sequência e ?
      a um carácter.
    example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Padrão de vhost proibido adicionado: \x02%pattern%\x02"
    already_exists: "\x0304✗\x03 O padrão \x02%pattern%\x02 já existe."
    invalid: "\x0304✗\x03 Formato de padrão de vhost inválido."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <padrão>"
    short: "Remover um padrão de vhost proibido."
    help: "Remove um padrão da lista de vhosts proibidos."
    example: "%command_prefix%\x02\x0303FORBIDVHOST DEL *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Padrão de vhost proibido removido: \x02%pattern%\x02"
    not_found: "\x0304✗\x03 Padrão \x02%pattern%\x02 não encontrado."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Listar todos os padrões de vhost proibidos."
    syntax: "FORBIDVHOST LIST"
    help: "Mostra todos os padrões de vhost proibidos."
    example: "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
    header: "\x0307ℹ\x03 Padrões de vhost proibidos (\x02%count%\x02):"
    entry: "  %index%. \x0304%pattern%\x03 — por %nickname% (%date%)"
    empty: "\x0307ℹ\x03 Nenhum padrão de vhost proibido."

# --- HISTORY ---------------------------------------------------------------
history:
  syntax: "HISTORY <nickname> {ADD|DEL|VIEW|CLEAR}"
  short: "Ver ou gerir histórico de ações do nickname."
  help: |-
    Consulta e gere o histórico de ações de um nickname. Regista automaticamente
    suspensões, alterações de palavra-passe ou email e recuperações. VIEW mostra
    três entradas por página; ALL mostra o histórico completo.
  example: "%command_prefix%\x02\x0303HISTORY Utilizador VIEW\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HISTORY Utilizador VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY Utilizador ADD Nota manual\x03\x0F"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <mensagem>"
    short: "Adicionar uma entrada manual ao histórico."
    help: "Adiciona uma entrada manual ao histórico do nickname."
    example: "%command_prefix%\x02\x0303HISTORY Utilizador ADD Reportado por spam\x03\x0F"
    success: "\x0303✔\x03 Entrada de histórico adicionada para \x02%nickname%\x02."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "Eliminar uma entrada de histórico por ID."
    help: "Remove uma entrada específica do histórico pelo seu ID."
    example: "%command_prefix%\x02\x0303HISTORY Utilizador DEL 42\x03\x0F"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [PÁGINA|ALL]"
    short: "Ver histórico de ações do nickname."
    help: |-
      Mostra o histórico de ações do nickname. Por predefinição, mostra três entradas
      por página. Use ALL para as ver todas.
    example: "%command_prefix%\x02\x0303HISTORY Utilizador VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY Utilizador VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY Utilizador VIEW ALL\x03\x0F"
    header: "\x02Histórico de \x0307%nickname%\x03\x02 (a mostrar %start%-%end% de %total%):"
    entry: "#%id% [%date%] \x0303%action%\x03 por %operator% — %message%"
    no_entries: "\x0307ℹ\x03 Nenhuma entrada de histórico encontrada para \x02%nickname%\x02."
    page_hint: "Use \x0303HISTORY %nickname% VIEW %next_page%\x03 para mais entradas."

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Eliminar todas as entradas de histórico de um nickname."
    help: "Elimina irreversivelmente todas as entradas do histórico do nickname."
    example: "%command_prefix%\x02\x0303HISTORY Utilizador CLEAR\x03\x0F"
    success: "\x0303✔\x03 Eliminadas \x02%count%\x02 entradas de histórico de \x02%nickname%\x02."
history.message:
  password_changed_owner: "Palavra-passe alterada pelo proprietário"
  password_changed_operator: "Palavra-passe alterada pelo operador"
  email_changed_owner: "Email alterado de %old_email% para %new_email%"
  email_changed_operator: "Email alterado para %new_email% pelo operador"
  recover: "Palavra-passe redefinida via token de email"
history.extra:
  old_email: "Email anterior: %value%"
  new_email: "Novo email: %value%"
  method: "Método: %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Definir ou remover proteção de expiração para um nickname."
  help: |-
    Controla se o nickname expira por inatividade.
    ON evita a expiração e OFF aplica as regras normais.
  example: "%command_prefix%\x02\x0303NOEXPIRE Utilizador ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE Utilizador OFF\x03\x0F"
  success_on: "\x0303✔\x03 O nickname \x02%nickname%\x02 está agora protegido contra expiração."
  success_off: "\x0303✔\x03 O nickname \x02%nickname%\x02 irá agora expirar normalmente."
  forbidden: "\x0304✗\x03 O nickname \x02%nickname%\x02 está proibido."
  suspended: "\x0304✗\x03 O nickname \x02%nickname%\x02 está suspenso."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <padrão> [página]"
  short: "Lista alcunhas registadas que correspondem a um padrão."
  help: |-
    Lista os nicknames registados que correspondem ao padrão. O carácter *
    corresponde a qualquer sequência de caracteres; a página opcional começa em 1.
  example: "%command_prefix%\x02\x0303LIST Utilizador*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST Utilizador* 2\x03\x0F"
  header: "Alcunha | Registo | Última ligação | IP | Estado"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Nenhuma alcunha corresponde ao padrão %pattern%."
  status_pending: "Pendente"
  status_registered: "Registado"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Gerir o modo de registo da rede."
  help: !irc |-
    Configura o modo de registo para novas contas.

    • \x02EMAIL:\x02 Envia o token de verificação para o email do utilizador.
    • \x02TOKEN:\x02 Entrega o token de verificação diretamente por IRC.
    • \x02STATUS:\x02 Mostra o modo de registo atual sem o alterar.

    Os registos pendentes mantêm o modo com que foram iniciados.

    No modo TOKEN, o comando RESEND continua desativado para todos os utilizadores.
  example: "%command_prefix%\x02\x0303REGMODE STATUS\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGMODE EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303REGMODE TOKEN\x03\x0F"
  status: "\x0307ℹ\x03 Modo de registo atual: \x02%mode%\x02."
  changed: "\x0303✔\x03 Modo de registo alterado para \x02%mode%\x02."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: !irc |-
    Token de recuperação: \x0303%token%\x03

    Guarde este token num local seguro. Vai precisar dele para recuperar o seu nickname se se esquecer da palavra-passe.

    Para o confirmar, utilize: /msg %bot% \x0303VERIFY %token%\x03

    \x0304⚠\x03 IMPORTANTE: Só o último token gerado é válido. Depois de confirmado, não voltará a ser mostrado. Não o partilhe com ninguém.
  confirmed: "\x0303✔\x03 O token de recuperação foi confirmado. Guarde-o em segurança."
  unavailable: "\x0304✗\x03 Autentique-se e confirme o token de recuperação com \x0303VERIFY\x03 antes desta operação."
  locked_out: "\x0304✗\x03 Demasiados tokens inválidos. Tente novamente em \x02%seconds%\x02 segundos."
  throttled: "\x0304✗\x03 Demasiados tokens inválidos. Tente novamente em \x02%minutes%\x02 minuto(s)."
  replaced: "\x0303✔\x03 O token de recuperação foi substituído pelo token do email que acabou de validar. Guarde-o em segurança."
  optional_replacement: !irc |-
    \x0307→\x03 Novo token de recuperação opcional: \x0303%token%\x03

    Para substituir o seu token de recuperação atual, utilize: /msg %bot% \x0303VERIFY %token%\x03

    O token atual mantém-se válido até à confirmação.

    Se não o quiser alterar, ignore esta mensagem.
  replacement_unavailable: "\x0307ℹ\x03 A palavra-passe foi reposta, mas não foi possível emitir um novo token. O token atual continua válido."
  temporarily_unavailable: "\x0304✗\x03 A entrega do token de recuperação está temporariamente indisponível. Tente mais tarde."

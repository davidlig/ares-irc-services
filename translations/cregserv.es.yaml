# Traducciones CReG — Español
# Dominio: cregserv

unknown_command: "\x0304✗\x03 Comando desconocido \x02%command%\x02. Usa \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Sintaxis incorrecta. Uso: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Este comando está restringido a operadores IRC."
  not_identified: "\x0304✗\x03 No estás identificado. Usa \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permiso denegado. No tienes acceso a este comando."

registra:
  syntax: "REGISTRA <#canal> <descripción>"
  short: "Solicita la aprobación del registro de un canal."
  help: "Pide que un canal sea registrado. Un operador de servicios evalúa la solicitud y la aprueba o la deniega; el canal solo se registra una vez aprobada. Debes estar identificado con %nickserv%."
  requested: "\x0303✔\x03 Has solicitado el registro del canal \x02%channel%\x02. Un operador de servicios evaluará la solicitud."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  channel_too_long: "\x0304✗\x03 El nombre del canal es demasiado largo: como máximo \x0264\x02 caracteres incluido el \x02#\x02."
  description_too_long: "\x0304✗\x03 La descripción es demasiado larga: como máximo \x02255\x02 caracteres."
  already_registered: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  duplicate: "\x0304✗\x03 Ya existe una solicitud de registro para \x02%channel%\x02 a la espera de aprobación. Usa \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 La solicitud de registro de \x02%channel%\x02 fue denegada."
  throttled: "\x0304✗\x03 Debes esperar \x02%minutes%\x02 minuto(s) antes de solicitar otro canal."

estado:
  syntax: "ESTADO <#canal>"
  short: "Muestra el estado de registro de un canal."
  help: "Indica en qué punto se encuentra un canal dentro del proceso de registro: registrado, en proceso o denegado."
  registered: "\x0303✔\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  pending: "\x0303◌\x03 El canal \x02%channel%\x02 se encuentra en proceso, a la espera de la revisión de un operador de servicios (solicitado el %date%)."
  denied: "\x0304✗\x03 El canal \x02%channel%\x02 está denegado desde el %date%. Motivo: %reason%"
  no_request: "\x0304✗\x03 El canal \x02%channel%\x02 no tiene ningún proceso de registro."

aprobar:
  syntax: "APROBAR <#canal>"
  short: "Aprueba una solicitud de registro de canal pendiente."
  help: "Registra un canal cuya solicitud está a la espera de revisión. El canal se registra a nombre del usuario que la solicitó; ninguno de los dos tiene que estar dentro. Necesitas el permiso \x02cregserv.aprobar\x02."
  approved: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido correctamente registrado para \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  no_pending: "\x0304✗\x03 El canal \x02%channel%\x02 no se encuentra en proceso de registro."
  already_registered: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra registrado con \x02ChanServ\x02."
  already_approved: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  already_denied: "\x0304✗\x03 El canal \x02%channel%\x02 no puede ser registrado porque está marcado como \x0304DENEGADO\x03."
  failed: "\x0304✗\x03 No se ha podido completar el registro del canal \x02%channel%\x02."

denegar:
  syntax: "DENEGAR <#canal> <motivo>"
  short: "Deniega una solicitud de registro de canal pendiente."
  help: "Rechaza una solicitud de registro dejando libre el nombre del canal. El motivo es obligatorio y lo muestra DENEGADOS. Necesitas el permiso \x02cregserv.denegar\x02."
  denied: "\x0303✔\x03 Se ha denegado el registro del canal \x02%channel%\x02."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  no_pending: "\x0304✗\x03 El canal \x02%channel%\x02 no tiene ningún proceso de registro."
  already_approved: "\x0304✗\x03 No se pueden denegar canales ya registrados y aprobados."
  already_denied: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra denegado."

pendientes:
  syntax: "PENDIENTES"
  short: "Lista las solicitudes de registro de canal pendientes de revisión."
  help: "Muestra cada solicitud a la espera de que un operador de servicios la evalúe, con el canal, quién la pidió, la fecha y la descripción. Necesitas el permiso \x02cregserv.pendientes\x02."
  empty: "No hay canales pendientes de revisión."
  line: "\x02Canal:\x02 %channel%, \x02Solicitado por:\x02 %requester%, \x02Fecha:\x02 %date%, \x02Descripción:\x02 %description%"
  end: "Fin de la lista."

denegados:
  syntax: "DENEGADOS"
  short: "Lista las solicitudes de registro de canal que han sido denegadas."
  help: "Muestra cada solicitud denegada junto con el motivo por el que se denegó. Necesitas el permiso \x02cregserv.denegados\x02."
  empty: "No hay canales denegados."
  line: "\x02Canal:\x02 %channel%, \x02Motivo:\x02 %reason%"
  end: "Fin de la lista."

drop:
  syntax: "DROP <#canal>"
  short: "Elimina el registro de canal que \x02%bot%\x02 guarda para un canal."
  help: "Elimina el registro que \x02%bot%\x02 guarda para un canal, sea cual sea su estado. Un canal ya aprobado sigue registrado en \x02ChanServ\x02: lo que se libera aquí es el nombre, para que un canal denegado pueda volver a solicitarse. Necesitas el permiso \x02cregserv.drop\x02."
  dropped: "\x0303✔\x03 El registro del canal \x02%channel%\x02 ha sido eliminado de \x02%bot%\x02."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  no_request: "\x0304✗\x03 El canal \x02%channel%\x02 no se encuentra registrado con \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#canal> [descripción]"
  short: "Registra un canal sin estar dentro."
  help: "Registra un canal a petición del staff. El operador no necesita estar en el\ncanal, y el canal no necesita existir todavía en la red.\nEste comando requiere permiso de operador."
  done: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido registrado."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 está pendiente de eliminación y no puede ser registrado."
  already_registered: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  failed: "\x0304✗\x03 No se ha podido completar el registro del canal \x02%channel%\x02."

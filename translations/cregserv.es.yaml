# Traducciones CReG — Español
# Dominio: cregserv

unknown_command: "\x0304✗\x03 Comando desconocido \x02%command%\x02. Usa \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Sintaxis incorrecta. Uso: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Este comando está restringido a operadores IRC."
  not_identified: "\x0304✗\x03 No estás identificado. Usa \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permiso denegado. No tienes acceso a este comando."

registra:
  syntax: "REGISTRA <#canal> <descripción>"
  short: "Solicita la aprobación del registro de un canal."
  help: "Pide que un canal sea registrado. Un operador de servicios evalúa la solicitud y la aprueba o la deniega; el canal solo se registra una vez aprobada. Debes estar identificado con %nickserv%."
  requested: "\x0303✔\x03 Has solicitado el registro del canal \x02%channel%\x02. Un operador de servicios evaluará la solicitud."
  invalid_channel: "\x0304✗\x03 El nombre del canal debe empezar por un \x02#\x02."
  already_registered: "\x0304✗\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  duplicate: "\x0304✗\x03 Ya existe una solicitud de registro para \x02%channel%\x02 a la espera de aprobación. Usa \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 La solicitud de registro de \x02%channel%\x02 fue denegada."
  throttled: "\x0304✗\x03 Debes esperar \x02%minutes%\x02 minuto(s) antes de solicitar otro canal."

estado:
  syntax: "ESTADO <#canal>"
  short: "Muestra el estado de registro de un canal."
  help: "Indica en qué punto se encuentra un canal dentro del proceso de registro: registrado, en proceso o denegado."
  registered: "\x0303✔\x03 El canal \x02%channel%\x02 ya se encuentra registrado."
  pending: "\x0303◌\x03 El canal \x02%channel%\x02 se encuentra en proceso, a la espera de la revisión de un operador de servicios (solicitado el %date%)."
  denied: "\x0304✗\x03 El canal \x02%channel%\x02 está denegado desde el %date%. Motivo: %reason%"
  no_request: "\x0304✗\x03 El canal \x02%channel%\x02 no tiene ningún proceso de registro."

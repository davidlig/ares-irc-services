# Traduções de MemoServ — Português
# Domínio: memoserv
#
# Códigos de formatação IRC (aspas duplas ou blocos literais !irc):
#   \x02        ativa/desativa o negrito
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermelho, 07=laranja, 14=cinzento escuro)
#   \x03        repõe a cor
#   \x0F        repõe toda a formatação
#
# As cores IRC usam números DECIMAIS (0-15), não hexadecimais.
#   \x0314 = cinzento escuro (14 decimal): CORRETO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multilinha: !irc |- com quebras de linha e espaços reais.
# Os blocos sem etiqueta não descodificam escapes; preserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O apresentador acrescenta /msg sem cor e uma margem de dois espaços.

# --- SEND ------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#canal} <mensagem>"
  short: "Enviar uma mensagem para um nickname ou canal."
  help: |-
    Envia uma mensagem para um nickname ou canal registado. O destinatário tem de
    ter o serviço de mensagens ativado (ENABLE).
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND Ana Olá, pode rever o memo?\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND #ajuda Aviso para o canal\x03\x0F"
  sent_nick: "\x0303✔\x03 Mensagem enviada para \x02%nickname%\x02."
  sent_channel: "\x0303✔\x03 Mensagem enviada para o canal \x02%channel%\x02."
  throttled: "\x0304✗\x03 Deve aguardar \x02%seconds%\x02 segundo(s) antes de enviar outra mensagem."
  limit_reached: "\x0304✗\x03 Limite de mensagens atingido para \x02%target%\x02."
  ignored: "\x0304✗\x03 Não pode enviar mensagens para este destinatário, está na sua lista de ignorados."
  cannot_send_to_self: "\x0304✗\x03 Não pode enviar uma mensagem para si mesmo."
  message_too_long: "\x0304✗\x03 Mensagem demasiado longa. O máximo é \x02%max%\x02 caracteres."
  service_disabled_for_target: "\x0304✗\x03 O serviço de mensagens está desativado para \x02%target%\x02."

# --- READ ------------------------------------------------------------------
read:
  syntax: "READ [#canal] <número>"
  short: "Ler uma mensagem por número."
  help: |-
    Lê a mensagem com o número indicado. Sem #canal, lê da caixa de entrada do
    seu nickname. Com #canal, requer o nível MEMOREAD.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303READ 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303READ #ajuda 2\x03\x0F"
  header: "\x02\x0307Mensagem #%index%\x03 de \x02%from%\x02:\x0F"
  footer: "\x0314─────────────────────────────\x03 \x0314%date%\x03"
  not_found: "\x0304✗\x03 Mensagem #%index% não encontrada."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST [#canal]"
  short: "Listar mensagens (não lidas marcadas com * vermelho)."
  help: |-
    Lista as suas mensagens ou as do canal. As não lidas surgem com um asterisco
    vermelho e uma pré-visualização (máx. 50 caracteres). Sem #canal = a sua caixa;
    com #canal requer MEMOREAD.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST #ajuda\x03\x0F"
  header: "\x02\x0307Mensagens para %target%\x03:\x0F"
  empty: "\x0307ℹ\x03 Nenhuma mensagem para \x02%target%\x02."

# --- DEL -------------------------------------------------------------------
del:
  syntax: "DEL [#canal] <número>"
  short: "Eliminar uma mensagem por número."
  help: "Elimina a mensagem com o número indicado. Para canais requer nível MEMOCHANGE."
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL #ajuda 2\x03\x0F"
  deleted: "\x0303✔\x03 Mensagem #%index% eliminada."
  not_found: "\x0304✗\x03 Mensagem #%index% não encontrada."

# --- IGNORE ----------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD|DEL|LIST} [#canal] [nickname]"
  short: "Gerir lista de ignorados para mensagens."
  help: |-
    Permite gerir os nicknames dos quais não pretende receber mensagens, na sua
    conta ou num canal registado. Para alterar a lista de um canal, precisa da
    permissão MEMOCHANGE.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #ajuda Ana\x03\x0F"
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #ajuda\x03\x0F"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#canal] <nickname>"
    short: "Adiciona um nickname à lista de ignorados."
    help: |-
      Mensagens deste nickname não serão aceites para a sua caixa de entrada (ou do
      canal).
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD #ajuda Ana\x03\x0F"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#canal] <nickname>"
    short: "Remove um nickname da lista."
    help: "Remove o nickname da lista de ignorados."
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #ajuda Ana\x03\x0F"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#canal]"
    short: "Mostra os nicknames ignorados."
    help: "Mostra a lista de nicknames que você (ou o canal) ignora para mensagens."
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #ajuda\x03\x0F"
  added: "\x0303✔\x03 \x02%nickname%\x02 adicionado à lista de ignorados."
  removed: "\x0303✔\x03 \x02%nickname%\x02 removido da lista de ignorados."
  already_ignored: "\x0304✗\x03 \x02%nickname%\x02 já está na lista de ignorados."
  not_ignored: "\x0304✗\x03 \x02%nickname%\x02 não está na lista de ignorados."
  limit_reached_nick: "\x0304✗\x03 Limite da lista de ignorados atingido para o seu nickname (máx. \x02%limit%\x02)."
  limit_reached_channel: "\x0304✗\x03 Limite da lista de ignorados atingido para \x02%channel%\x02 (máx. \x02%limit%\x02)."
  list_empty: "\x0307ℹ\x03 A lista de ignorados está vazia."
  list_header: "\x02\x0307Lista de ignorados:\x03\x0F"

# --- ENABLE ----------------------------------------------------------------
enable:
  syntax: "ENABLE [#canal]"
  short: "Ativar receção de mensagens."
  help: |-
    Ativa a receção de mensagens para o seu nickname; nos canais, só o fundador
    a pode ativar.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE #ajuda\x03\x0F"
  enabled_nick: "\x0303✔\x03 Serviço de mensagens ativado para o seu nickname."
  enabled_channel: "\x0303✔\x03 Serviço de mensagens ativado para o canal \x02%channel%\x02."
  already_enabled_nick: "\x0307ℹ\x03 O serviço de mensagens já está ativado para o seu nickname."
  already_enabled_channel: "\x0307ℹ\x03 O serviço de mensagens já está ativado para \x02%channel%\x02."
  founder_only: "\x0304✗\x03 Apenas o fundador do canal pode ativar mensagens para \x02%channel%\x02."

# --- DISABLE ---------------------------------------------------------------
disable:
  syntax: "DISABLE [#canal]"
  short: "Desativar receção de mensagens."
  help: |-
    Desativa a receção de mensagens para o seu nickname ou canal. Nos canais, só
    o fundador a pode desativar.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE #ajuda\x03\x0F"
  disabled_nick: "\x0303✔\x03 Serviço de mensagens desativado para o seu nickname."
  disabled_channel: "\x0303✔\x03 Serviço de mensagens desativado para o canal \x02%channel%\x02."
  already_disabled_nick: "\x0307ℹ\x03 O serviço de mensagens já está desativado para o seu nickname."
  already_disabled_channel: "\x0307ℹ\x03 O serviço de mensagens já está desativado para \x02%channel%\x02."
  founder_only: "\x0304✗\x03 Apenas o fundador do canal pode desativar mensagens para \x02%channel%\x02."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [comando] [sub-opção]"
  short: "Listar comandos ou mostrar ajuda de um comando."
  help: "Mostra a lista de comandos ou a ajuda detalhada de um comando ou opção."
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP IGNORE ADD\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  intro: |-
    Permite enviar e receber mensagens entre utilizadores registados e enviar
    avisos para canais. As mensagens ficam guardadas para consulta posterior,
    mesmo que o destinatário não esteja ligado.
  general_header: "\x02 ■ Comandos disponíveis:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Opções:\x02"
  examples_header: "\x02 ■ Exemplos:\x02"
  general_footer: "\x0310ℹ\x03\x0F Use /msg %bot% \x02\x0303HELP <comando>\x03\x0F para mais informações."
  set_sub_footer: "\x0310ℹ\x03\x0F Use /msg %bot% \x02\x0303HELP %command% <opção>\x03\x0F para mais informações."
  syntax_label: "Sintaxe: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    messages: "Mensagens"
    preferences: "Preferências"
  ircop_header: "\x02 ■ Comandos disponíveis para IRCops:\x02"

# --- NOTIFY ----------------------------------------------------------------
notify:
  nick_pending: "Tem \x02%count%\x02 mensagem(ns) por ler. Para listar as mensagens: /msg %bot% \x0303LIST\x03"
  channel_pending: "O canal \x02%channel%\x02 tem \x02%count%\x02 mensagem(ns) por ler. Consulte-as com /msg %bot% \x0303LIST %channel%\x03"

# Traduções de MemoServ — Português
# Domínio: memoserv
#
# Códigos de formatação IRC (aspas duplas ou blocos literais !irc):
#   \x02        ativa/desativa o negrito
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermelho, 07=laranja, 14=cinzento escuro)
#   \x03        repõe a cor
#   \x0F        repõe toda a formatação
#
# As cores IRC usam números DECIMAIS (0-15), não hexadecimais.
#   \x0314 = cinzento escuro (14 decimal): CORRETO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multilinha: !irc |- com quebras de linha e espaços reais.
# Os blocos sem etiqueta não descodificam escapes; preserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O apresentador acrescenta /msg sem cor e uma margem de dois espaços.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#canal} <mensagem>"
  short: "Enviar uma mensagem para um nickname ou canal."
  help: |-
    Envia uma mensagem para um nickname ou canal registado. O destinatário tem de
    ter o serviço de mensagens ativado (ENABLE).
  example: "%command_prefix%SEND Ana Olá, pode rever o memo?"
  examples:
    - "%command_prefix%SEND #ajuda Aviso para o canal"
  sent_nick: "Mensagem enviada para %nickname%."
  sent_channel: "Mensagem enviada para o canal %channel%."
  throttled: "Deve aguardar %seconds% segundo(s) antes de enviar outra mensagem."
  limit_reached: "Limite de mensagens atingido para %target%."
  ignored: "Não pode enviar mensagens para este destinatário, está na sua lista de ignorados."
  cannot_send_to_self: "Não pode enviar uma mensagem para si mesmo."
  message_too_long: "Mensagem demasiado longa. O máximo é %max% caracteres."
  service_disabled_for_target: "O serviço de mensagens está desativado para %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#canal] <número>"
  short: "Ler uma mensagem por número."
  help: |-
    Lê a mensagem com o número indicado. Sem #canal, lê da caixa de entrada do
    seu nickname. Com #canal, requer o nível MEMOREAD.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #ajuda 2"
  header: "Mensagem #%index% de %from%:"
  footer: "%separator% %date%"
  not_found: "Mensagem #%index% não encontrada."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#canal]"
  short: "Listar mensagens (não lidas marcadas com * vermelho)."
  help: |-
    Lista as suas mensagens ou as do canal. As não lidas surgem com um asterisco
    vermelho e uma pré-visualização (máx. 50 caracteres). Sem #canal = a sua caixa;
    com #canal requer MEMOREAD.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #ajuda"
  header: "Mensagens para %target%:"
  empty: "Nenhuma mensagem para %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#canal] <número>"
  short: "Eliminar uma mensagem por número."
  help: "Elimina a mensagem com o número indicado. Para canais requer nível MEMOCHANGE."
  example: "%command_prefix%DEL 1"
  examples:
    - "%command_prefix%DEL #ajuda 2"
  deleted: "Mensagem #%index% eliminada."
  not_found: "Mensagem #%index% não encontrada."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#canal] <nickname>|DEL [#canal] <nickname>|LIST [#canal]}"
  short: "Gerir lista de ignorados para mensagens."
  help: |-
    Permite gerir os nicknames dos quais não pretende receber mensagens, na sua
    conta ou num canal registado. Para alterar a lista de um canal, precisa da
    permissão MEMOCHANGE.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #ajuda Ana"
    - "%command_prefix%IGNORE LIST #ajuda"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#canal] <nickname>"
    short: "Adiciona um nickname à lista de ignorados."
    help: |-
      Mensagens deste nickname não serão aceites para a sua caixa de entrada (ou do
      canal).
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #ajuda Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#canal] <nickname>"
    short: "Remove um nickname da lista."
    help: "Remove o nickname da lista de ignorados."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #ajuda Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#canal]"
    short: "Mostra os nicknames ignorados."
    help: "Mostra a lista de nicknames que você (ou o canal) ignora para mensagens."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #ajuda"
  added: "%nickname% adicionado à lista de ignorados."
  removed: "%nickname% removido da lista de ignorados."
  already_ignored: "%nickname% já está na lista de ignorados."
  not_ignored: "%nickname% não está na lista de ignorados."
  limit_reached_nick: "Limite da lista de ignorados atingido para o seu nickname (máx. %limit%)."
  limit_reached_channel: "Limite da lista de ignorados atingido para %channel% (máx. %limit%)."
  list_empty: "A lista de ignorados está vazia."
  list_header: "Lista de ignorados:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#canal]"
  short: "Ativar receção de mensagens."
  help: |-
    Ativa a receção de mensagens para o seu nickname; nos canais, só o fundador
    a pode ativar.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #ajuda"
  enabled_nick: "Serviço de mensagens ativado para o seu nickname."
  enabled_channel: "Serviço de mensagens ativado para o canal %channel%."
  already_enabled_nick: "O serviço de mensagens já está ativado para o seu nickname."
  already_enabled_channel: "O serviço de mensagens já está ativado para %channel%."
  founder_only: "Apenas o fundador do canal pode ativar mensagens para %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#canal]"
  short: "Desativar receção de mensagens."
  help: |-
    Desativa a receção de mensagens para o seu nickname ou canal. Nos canais, só
    o fundador a pode desativar.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #ajuda"
  disabled_nick: "Serviço de mensagens desativado para o seu nickname."
  disabled_channel: "Serviço de mensagens desativado para o canal %channel%."
  already_disabled_nick: "O serviço de mensagens já está desativado para o seu nickname."
  already_disabled_channel: "O serviço de mensagens já está desativado para %channel%."
  founder_only: "Apenas o fundador do canal pode desativar mensagens para %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [comando] [opção]"
  short: "Listar comandos ou mostrar ajuda de um comando."
  help: "Mostra a lista de comandos ou a ajuda detalhada de um comando ou opção."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permite enviar e receber mensagens entre utilizadores registados e enviar
    avisos para canais. As mensagens ficam guardadas para consulta posterior,
    mesmo que o destinatário não esteja ligado.
  general_header: "Comandos disponíveis:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opções:"
  examples_header: "Exemplos:"
  general_help_command: "HELP <comando>"
  option_help_command: "HELP %command% <opção>"
  general_footer: "Use /msg %bot% %help_command% para mais informações."
  set_sub_footer: "Use /msg %bot% %help_command% para mais informações."
  syntax_label: "Sintaxe: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Mensagens"
    preferences: "Preferências"
  ircop_header: "Comandos disponíveis para IRCops:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_pending: "Tem %count% mensagem(ns) por ler. Para listar as mensagens: /msg %bot% %list%"
  channel_pending: "O canal %channel% tem %count% mensagem(ns) por ler. Consulte-as com /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "O teu pedido de registo de %channel% foi aprovado."
  rejected: "O teu pedido de registo de %channel% foi rejeitado."
  reason: "Razão: %reason%"
  restriction: "Disponível a partir de: %date%"

# Traducciones de MemoServ — Español
# Dominio: memoserv
#
# Translations contain localized text and interpolation parameters only.
# The presentation engine owns IRC styling and example prefixes.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {apodo|#canal} <mensaje>"
  short: "Envía un mensaje a un apodo o canal."
  help: |-
    Envía un mensaje a un apodo o canal registrado. El destinatario debe tener el
    servicio de mensajes activado (ENABLE).
  example: "%command_prefix%SEND Ana Hola, ¿puedes revisar el memo?"
  examples:
    - "%command_prefix%SEND #ayuda Aviso para el canal"
  sent_nick: "Mensaje enviado a %nickname%."
  sent_channel: "Mensaje enviado al canal %channel%."
  throttled: "Debes esperar %seconds% segundo(s) antes de enviar otro mensaje."
  limit_reached: "Límite de mensajes alcanzado para %target%."
  ignored: "No puedes enviar mensajes a este destino, estás en su lista de ignorados."
  cannot_send_to_self: "No puedes enviarte un mensaje a ti mismo."
  message_too_long: "Mensaje demasiado largo. El máximo es %max% caracteres."
  service_disabled_for_target: "El servicio de mensajes está desactivado para %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#canal] <número>"
  short: "Lee un mensaje por número."
  help: |-
    Lee el mensaje con el número indicado. Sin #canal, lee de tu bandeja de apodo.
    Con #canal, requiere nivel MEMOREAD.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #ayuda 2"
  header: "Mensaje #%index% de %from%:"
  footer: "%separator% %date%"
  not_found: "Mensaje #%index% no encontrado."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#canal]"
  short: "Lista mensajes (no leídos con * rojo)."
  help: |-
    Lista tus mensajes o los del canal. Los no leídos se muestran con asterisco
    rojo y vista previa (máx. 50 caracteres). Sin #canal = tu bandeja; con #canal
    requiere MEMOREAD.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #ayuda"
  header: "Mensajes para %target%:"
  empty: "No hay mensajes para %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#canal] {número|ALL}"
  short: "Elimina un mensaje por número."
  help: |-
    Elimina un mensaje por número o usa ALL para vaciar la bandeja. En canales
    requiere el nivel MEMOCHANGE.
  example: "%command_prefix%DEL ALL"
  examples:
    - "%command_prefix%DEL 1"
    - "%command_prefix%DEL #ayuda 2"
    - "%command_prefix%DEL #ayuda ALL"
  deleted: "Mensaje #%index% eliminado."
  not_found: "Mensaje #%index% no encontrado."
  all_deleted: "Se han eliminado todos los mensajes de esta bandeja."
  none_to_delete: "No hay mensajes que eliminar."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#canal] <apodo>|DEL [#canal] <apodo>|LIST [#canal]}"
  short: "Gestiona la lista de ignorados para mensajes."
  help: |-
    Permite gestionar los apodos de los que no deseas recibir mensajes, tanto
    en tu cuenta como en un canal registrado. Para modificar la lista de un canal
    necesitas el permiso MEMOCHANGE.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #ayuda Ana"
    - "%command_prefix%IGNORE LIST #ayuda"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#canal] <apodo>"
    short: "Añade un apodo a la lista de ignorados."
    help: "Los mensajes de este apodo no serán aceptados en tu bandeja (o la del canal)."
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #ayuda Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#canal] <apodo>"
    short: "Elimina un apodo de la lista."
    help: "Elimina el apodo de la lista de ignorados."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #ayuda Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#canal]"
    short: "Muestra los apodos ignorados."
    help: "Muestra la lista de apodos que tú (o el canal) ignoráis para mensajes."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #ayuda"
  added: "%nickname% añadido a la lista de ignorados."
  removed: "%nickname% quitado de la lista de ignorados."
  already_ignored: "%nickname% ya está en la lista de ignorados."
  not_ignored: "%nickname% no está en la lista de ignorados."
  limit_reached_nick: "Límite de lista de ignorados alcanzado para tu apodo (máx. %limit%)."
  limit_reached_channel: "Límite de lista de ignorados alcanzado para %channel% (máx. %limit%)."
  list_empty: "La lista de ignorados está vacía."
  list_header: "Lista de ignorados:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#canal]"
  short: "Activa la recepción de mensajes."
  help: |-
    Activa recibir mensajes en tu apodo o, en canales, solo el fundador puede
    activarlo.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #ayuda"
  enabled_nick: "Servicio de mensajes activado para tu apodo."
  enabled_channel: "Servicio de mensajes activado para el canal %channel%."
  already_enabled_nick: "El servicio de mensajes ya está activado para tu apodo."
  already_enabled_channel: "El servicio de mensajes ya está activado para %channel%."
  founder_only: "Solo el fundador del canal puede activar mensajes para %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#canal]"
  short: "Desactiva la recepción de mensajes."
  help: |-
    Desactiva recibir mensajes en tu apodo o canal. En canales, solo el fundador
    puede desactivar.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #ayuda"
  disabled_nick: "Servicio de mensajes desactivado para tu apodo."
  disabled_channel: "Servicio de mensajes desactivado para el canal %channel%."
  already_disabled_nick: "El servicio de mensajes ya está desactivado para tu apodo."
  already_disabled_channel: "El servicio de mensajes ya está desactivado para %channel%."
  founder_only: "Solo el fundador del canal puede desactivar mensajes para %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [comando] [opción]"
  short: "Lista comandos o muestra ayuda de un comando."
  help: "Muestra la lista de comandos o la ayuda detallada de un comando u opción."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permite enviar y recibir mensajes entre usuarios registrados y enviar avisos a
    canales. Los mensajes quedan guardados para consultarlos más tarde, aunque el
    destinatario no esté conectado.
  general_header: "Comandos disponibles:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opciones:"
  examples_header: "Ejemplos:"
  general_help_command: "HELP <comando>"
  option_help_command: "HELP %command% <opción>"
  general_footer: "Usa /msg %bot% %help_command% para más información."
  set_sub_footer: "Usa /msg %bot% %help_command% para más información."
  syntax_label: "Sintaxis: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Mensajes"
    preferences: "Preferencias"
  ircop_header: "Comandos disponibles para IRCops:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_pending: "Tienes %count% mensaje(s) pendiente(s) de leer. Para listar los mensajes: /msg %bot% %list%"
  channel_pending: "El canal %channel% tiene %count% mensaje(s) pendiente(s) de leer. Revisa los mensajes con /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "Tu solicitud de registro de %channel% fue aceptada."
  rejected: "Tu solicitud de registro de %channel% fue rechazada."
  reason: "Razón: %reason%"
  restriction: "Disponible a partir del: %date%"

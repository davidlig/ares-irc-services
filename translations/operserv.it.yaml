# Traduzioni di OperServ — Italiano
# Dominio: operserv
#
# Codici di formattazione IRC (virgolette doppie o blocchi letterali !irc):
#   \x02        attiva/disattiva il grassetto
#   \x03NN      colore (DECIMALE: 03=verde, 04=rosso, 07=arancione, 14=grigio scuro)
#   \x03        ripristina il colore
#   \x0F        ripristina tutta la formattazione
#
# I colori IRC usano numeri DECIMALI (0-15), non esadecimali.
#   \x0314 = grigio scuro (14 decimale): CORRETTO
#   \x030F = colore 0 seguito dalla lettera F: ERRORE
#
# Testo IRC multilinea: !irc |- con interruzioni di riga e spazi reali.
# I blocchi senza tag non decodificano gli escape; preservare i letterali CTCP.
# Esempi HELP: example/examples e %command_prefix%.
# Il presentatore aggiunge /msg senza colore e un margine di due spazi.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "Questo comando è riservato agli amministratori root di rete."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [comando] [opzione]"
  short: "Elenca i comandi o mostra l'aiuto per un comando."
  help: |-
    Senza argomenti elenca tutti i comandi. Usa %help_command% per l'aiuto
    completo oppure %help_option_command% per le sotto-opzioni.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permette di gestire gli operatori di rete e i relativi permessi, applicare
    restrizioni di accesso e disconnettere gli utenti. Consente inoltre di inviare
    comunicati generali e gestire i messaggi di benvenuto della rete.
  general_header: "Comandi disponibili:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opzioni:"
  examples_header: "Esempi:"
  general_help_command: "HELP <comando>"
  option_help_command: "HELP %command% <opzione>"
  detail_help_command: "HELP <comando>"
  detail_help_option_command: "HELP <comando> <opzione>"
  general_footer: "Usa /msg %bot% %help_command% per maggiori informazioni."
  set_sub_footer: "Usa /msg %bot% %help_command% per maggiori informazioni."
  syntax_label: "Sintassi: %syntax%"
  footer: ""
  intro_expiration: "NOTA: I nickname non utilizzati per più di %days% giorni vengono rimossi automaticamente."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operatori e ruoli"
    network_security: "Sicurezza di rete"
    communication: "Comunicazione"
    low_level: "Basso livello"
  ircop_header: "Comandi disponibili per gli IRCop:"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <nickname> <ruolo>|DEL <nickname>|LIST}"
  short: "Gestisce gli operatori IRC di rete."
  help: |-
    Gestisce gli operatori IRC di rete. ADD aggiunge un nickname registrato
    come operatore con il ruolo specificato.
    DEL rimuove un operatore. LIST mostra tutti gli operatori.
    Usi ROLE LIST per vedere i ruoli disponibili.
    Questo comando è riservato agli utenti Root configurati nei servizi.
  example: "%command_prefix%IRCOP ADD Anna OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Sotto-comando sconosciuto %sub%. Usi ADD, DEL o LIST."
  unknown_role: "Il ruolo %role% non esiste. Usa /msg %bot% %role_list% per vedere i ruoli disponibili."
  already_admin: "%nickname% è già un operatore IRC (ruolo: %role%)."
  not_admin: "%nickname% non è un operatore IRC."
  role_changed: "Ruolo cambiato per %nickname% da %old% a %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nickname> <ruolo>"
    short: "Aggiunge un operatore IRC di rete."
    help: |-
      Aggiunge un nickname registrato come operatore IRC di rete.
      Usi ROLE LIST per vedere i ruoli disponibili.
      Questo comando è riservato agli utenti Root.
    example: "%command_prefix%IRCOP ADD Anna OPER"
    done: "Aggiunto %nickname% come %role%."
    nick_not_active: "Il nickname %nickname% non è un nickname registrato attivo."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nickname>"
    short: "Rimuove un operatore IRC di rete."
    help: |-
      Rimuove un operatore IRC di rete dalla lista.
      Questo comando è riservato agli utenti Root.
    example: "%command_prefix%IRCOP DEL Anna"
    done: "Rimosso %nickname% dagli operatori IRC."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Elenca tutti gli operatori IRC di rete."
    help: |-
      Elenca tutti gli operatori IRC di rete con i loro ruoli e la data di
      registrazione.
      Questo comando è riservato agli utenti Root.
    example: "%command_prefix%IRCOP LIST"
    header: "Operatori IRC di Rete"
    empty: "Non ci sono operatori IRC."

# --- ROLE ------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <ruolo>|SET <ruolo> [operclass]}"
    short: "Configura la classe operatore di UnrealIRCd."
    help: |-
      Consente di consultare e configurare l'operclass di un ruolo.

      %options_header%
      %option_LIST%Mostra le operclass disponibili in rete.
      %option_VIEW%Mostra l'operclass del ruolo e quelle disponibili.
      %option_SET%Assegna l'operclass agli IRCOP al momento dell'identificazione.

      Ometti il valore per rimuoverla.

      Disponibile solo con protocolli UnrealIRCd.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SUPPORTO"
      - "%command_prefix%ROLE OPERCLASS SET SUPPORTO services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SUPPORTO"
    list:
      header: "Operclass Disponibili nella Rete"
      empty: "Nessuna operclass disponibile nella rete."
      not_supported: "Il protocollo attuale non supporta l'elenco delle operclass disponibili."
    view:
      empty: "Il ruolo %role% non ha operclass."
      line: "Operclass: %operclass%"
      available: "Operclass disponibili: %available%"
    set:
      done: "Operclass configurata per il ruolo %role%."
      cleared: "Operclass rimossa dal ruolo %role%."
      not_available: "L'operclass %operclass% non e disponibile nella rete. Operclass disponibili: %available%."
  syntax: "ROLE {ADD <nome> [descrizione]|DEL <nome>|LIST|PERMS {{ADD|DEL} <ruolo> <permesso>|{LIST|CLEAR} <ruolo>}|MODES {VIEW <ruolo>|SET <ruolo> [modalità]}|VHOST {VIEW <ruolo>|SET <ruolo> [vhost]}}"
  short: "Consente di gestire i ruoli degli operatori, i relativi permessi e la configurazione."
  help: |-
    Consente di gestire i ruoli degli operatori, i relativi permessi e la
    configurazione.

    I ruoli ADMIN, OPER e PREOPER sono protetti e non possono essere eliminati.
    Comando riservato agli utenti Root.
  syntax_operclass: "ROLE {ADD <nome> [descrizione]|DEL <nome>|LIST|PERMS {{ADD|DEL} <ruolo> <permesso>|{LIST|CLEAR} <ruolo>}|MODES {VIEW <ruolo>|SET <ruolo> [modalità]}|VHOST {VIEW <ruolo>|SET <ruolo> [vhost]}|OPERCLASS {LIST|VIEW <nome>|SET <nome> [operclass]}}"
  help_operclass: |-
    Consente di gestire i ruoli degli operatori, i relativi permessi e la configurazione.

    I ruoli ADMIN, OPER e PREOPER sono protetti e non possono essere eliminati.
    Comando riservato agli utenti Root.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SUPPORTO Operatori di supporto"
  unknown_sub: "Sotto-comando sconosciuto %sub%. Usi ADD, DEL, LIST, PERMS, MODES o VHOST."
  unknown_sub_operclass: "Sotto-comando sconosciuto %sub%. Usi ADD, DEL, LIST, PERMS, MODES, VHOST o OPERCLASS."
  not_found: "Il ruolo %role% non esiste."
  already_exists: "Il ruolo %role% esiste già."
  protected: "Il ruolo %role% è protetto e non può essere eliminato."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <nome> [descrizione]"
    short: "Crea un nuovo ruolo."
    help: |-
      Crea un nuovo ruolo personalizzato. La descrizione è opzionale.
      Questo comando è riservato agli utenti Root.
    example: "%command_prefix%ROLE ADD SUPPORTO Operatori di supporto"
    done: "Creato ruolo %role%."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <nome>"
    short: "Elimina un ruolo."
    help: |-
      Elimina un ruolo personalizzato. I ruoli protetti (ADMIN, OPER, PREOPER)
      non possono essere eliminati. Se il ruolo ha operatori assegnati,
      deve riassegnarli prima.
      Questo comando è riservato agli utenti Root.
    example: "%command_prefix%ROLE DEL SUPPORTO"
    done: "Eliminato ruolo %role%."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Mostra i ruoli disponibili."
    help: |-
      Elenca tutti i ruoli. I ruoli protetti sono marcati con [PROTECTED].
      Questo comando è riservato agli utenti Root.
    example: "%command_prefix%ROLE LIST"
    header: "Ruoli Operatore"
    empty: "Non ci sono ruoli operatore."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <ruolo> <permesso>|{LIST|CLEAR} <ruolo>}"
    short: "Gestisce i permessi del ruolo."
    help: |-
      Gestisce i permessi assegnati a un ruolo.

      %options_header%
      %option_LIST%Mostra tutti i permessi disponibili e indica quelli assegnati.
      %option_ADD%Assegna un permesso al ruolo.
      %option_DEL%Rimuove un permesso (non per i ruoli protetti).
      %option_CLEAR%Rimuove tutti i permessi del ruolo.

      %assigned_status% indica un permesso assegnato; %unassigned_status% indica un permesso disponibile.

      Usa ALL per aggiungere in una volta tutti i permessi disponibili.
      Comando riservato agli utenti Root.
    example: "%command_prefix%ROLE PERMS LIST SUPPORTO"
    examples:
      - "%command_prefix%ROLE PERMS ADD SUPPORTO operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SUPPORTO ALL"
      - "%command_prefix%ROLE PERMS DEL SUPPORTO operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SUPPORTO"
    not_found: "Il permesso %perm% non esiste."
    already_has: "Il ruolo %role% ha già il permesso %perm%."
    does_not_have: "Il ruolo %role% non ha il permesso %perm%."
    list:
      header: "Elenco dei permessi di %role%"
      columns: "Assegnato | Chiave permesso | Descrizione"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Aggiunto permesso %perm% al ruolo %role%."
      all_done: "Aggiunti %count% permessi al ruolo %role%."
    del:
      done: "Rimosso permesso %perm% dal ruolo %role%."
    clear:
      done: "Rimossi %count% permessi dal ruolo %role%."
      empty: "Il ruolo %role% non ha permessi assegnati."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <ruolo>|SET <ruolo> [modalità]}"
    short: "Configura le modalità utente del ruolo."
    help: |-
      Gestisce le modalità utente IRCOP assegnate a un ruolo.

      %options_header%
      %option_VIEW%Mostra le modalità attuali del ruolo.
      %option_SET%Imposta le modalità IRCOP.

      Ometti le modalità per rimuoverle tutte.

      Gli utenti del ruolo riceveranno queste modalità identificandosi.
      Modalità disponibili per IRCD
      Comando riservato agli utenti Root.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Modi per %role%"
      empty: "Il ruolo %role% non ha modi assegnati."
      line: "Modi: %modes%"
    set:
      done: "Impostati modi %modes% per il ruolo %role%."
      cleared: "Rimossi tutti i modi dal ruolo %role%."
      invalid_mode: "Il modo %mode% non è un modo IRCOP valido."
      invalid_modes: "Modi non validi: %invalid%. Modi validi: %valid%."
      no_irc_user_modes: "L'IRCD attuale non ha modi IRCOP configurati."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <ruolo>|SET <ruolo> [vhost]}"
    short: "Configura il modello di host virtuale del ruolo."
    help: |-
      Consente di configurare l'host virtuale assegnato agli operatori di un ruolo
      durante l'identificazione, al posto del loro host personale.

      L'host viene generato unendo il nickname senza caratteri speciali al modello
      configurato. Esempio:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Mostra il modello configurato per un ruolo.
      %option_SET%Imposta o rimuove il modello del ruolo.

      Il modello ammette solo lettere, numeri, trattini e punti. Deve contenere
      almeno un punto, non può iniziare o terminare con trattino o punto e non può
      contenere punti consecutivi.

      Per rimuovere l'host forzato, usa SET senza specificare un modello.

      Comando riservato agli utenti Root.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Vhost forzato per %role%"
      empty: "Il ruolo %role% non ha un pattern vhost forzato impostato."
      line: "Pattern: %pattern%"
      example: "Esempio: %example_nickname%.%pattern%"
      example_nickname: "nickname"
    set:
      done: "Impostato pattern vhost forzato per il ruolo %role%."
      cleared: "Rimosso pattern vhost forzato dal ruolo %role%."
      invalid: "Pattern vhost non valido. Caratteri validi: a-z, A-Z, 0-9, - e .. Deve avere almeno un punto, non può iniziare/terminare con - o . né avere .."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <nickname> <motivo>"
  short: "Disconnette forzatamente un utente dalla rete."
  help: |-
    Disconnette un utente dalla rete IRC.
    Gli IRCop e gli utenti Root non possono essere espulsi con KILL.
  example: "%command_prefix%KILL BadUser Flood nei canali"
  protected_root: "Impossibile killare l'utente Root %nickname%."
  protected_ircop: "Impossibile killare l'IRC operator %nickname%."
  done: "Utente %nickname% è stato killato (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <maschera> <scadenza> <motivo>|DEL {<maschera>|<numero>}|LIST [maschera]}"
  short: "Gestisce i G-line a livello di rete."
  help: |-
    Gestisce le G-line (ban globali) della rete.
    ADD aggiunge una G-line con maschera, scadenza e motivo.
    DEL rimuove una G-line per maschera o numero della voce.
    LIST mostra tutte le G-line, filtrabili per maschera.

    Formato scadenza: 0 = permanente oppure suffisso d, h, m (es. 7d, 12h, 30m).
    Le G-line corrispondenti a utenti Root o IRCop vengono rifiutate.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuso di spam"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuso persistente"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Sotto-comando sconosciuto %sub%. Usi ADD, DEL o LIST."
  invalid_mask: "Formato maschera non valido. Deve essere nel formato utente@host (es., *@192.168.*)."
  global_mask: "La maschera G-line %mask% è troppo ampia. Le maschere globali non sono consentite."
  dangerous_mask: "La maschera G-line %mask% è troppo ampia. La parte host necessita di almeno 4 caratteri alfanumerici."
  protected_user: "Impossibile applicare G-line all'utente protetto %nickname%."
  invalid_expiry: "Formato scadenza non valido. Usi 0 per permanente, o un valore come 7d, 12h, 30m."
  already_exists: "G-line per %mask% esiste già."
  max_entries: "Numero massimo di G-line (%max%) raggiunto."
  not_found: "G-line %mask% non trovato."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <maschera> <scadenza> <motivo>"
    short: "Aggiunge un G-line a livello di rete."
    help: |-
      Aggiunge una G-line (ban globale) alla rete.
      La maschera deve essere nel formato utente@host.
      Scadenza: 0 = permanente oppure suffisso d, h, m (es. 7d, 12h, 30m).
      Le G-line corrispondenti a utenti Root o IRCop vengono rifiutate.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuso di spam"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuso persistente"
    done: "G-line aggiunto: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<maschera>|<numero>}"
    short: "Rimuove un G-line."
    help: |-
      Rimuove una G-line dall'elenco.
      Puoi specificare la maschera o il numero della voce restituito da LIST.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% rimosso."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [maschera]"
    short: "Elenca tutti i G-line."
    help: "Elenca tutte le G-line. Facoltativamente, filtra per modello della maschera."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-line (%count%)"
    empty: "Non ci sono G-line."
    entry: "%index%. %mask% - %reason% (%nickname%, scade: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {servizio|nick!ident@vhost} {PRIVMSG|NOTICE} <messaggio>"
  short: "Invia un messaggio globale a tutti gli utenti connessi."
  help: |-
    Permette di inviare messaggi a tutti gli utenti connessi, usando un servizio
    esistente o un client temporaneo con identità personalizzata.

    I messaggi possono essere inviati come PRIVMSG (privato) o NOTICE (avviso).

    Per un client temporaneo, specifica una maschera nel formato
    nickname!ident@vhost,
    con caratteri validi per ogni campo.

    Il nickname non può essere registrato o in uso. Il client si disconnette
    automaticamente dopo l'invio e il nickname resta bloccato per 24 ore.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Manutenzione tra 10 minuti"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE La rete verrà riavviata"
  mask_invalid: "Formato maschera non valido: %error%"
  nick_connected: "Il nickname %nickname% è attualmente connesso."
  nick_registered: "Il nickname %nickname% è registrato."
  type_invalid: "Il tipo di messaggio deve essere PRIVMSG o NOTICE."
  done: "Messaggio globale inviato da %nickname% a %count% utenti."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <linea>"
  short: "Invia una linea di protocollo raw all'IRCd."
  help: |-
    Invia la riga indicata direttamente al socket dell'IRCd di collegamento.
    Usalo con estrema cautela: righe di protocollo non valide possono bloccare la
    rete.
  example: "%command_prefix%RAW :services.ares NOTICE * :Manutenzione programmata"
  empty: "Deve specificare una linea non vuota da inviare."
  too_long: "Linea troppo lunga. Massimo 510 caratteri."
  not_connected: "Non connesso all'IRCd."
  done: "Linea raw inviata."
  protocol:
    syntax: "Il protocollo attivo ha rifiutato la sintassi del comando RAW."
    done: "Comando RAW gestito dal protocollo eseguito."
    target: "Il protocollo attivo ha rifiutato la destinazione %target%."
    unsupported: "Il protocollo attivo non supporta questo comando RAW."
    invalid_resource_type: "Tipo di risorsa di protocollo sconosciuto: %resource_type%."
    invalid_resource: "Risorsa di protocollo non valida: %resource%."
    invalid_value: "Valore non valido per la risorsa di protocollo: %resource%."
    error: "Il protocollo attivo non ha potuto eseguire il comando RAW."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator% esegue il comando GLOBAL con nickname %target% via %type% a %count% utenti. Messaggio: %message%"
  prefix_message: "Messaggio: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Gestisce i messaggi MOTD inviati agli utenti alla connessione."
  syntax: "MOTD {ADD <destinatario> {PRIVMSG|NOTICE} <scadenza> <messaggio>|DEL <id>|LIST|CLEAN}"
  help: |-
    Gestisce le voci del messaggio del giorno (MOTD) inviate quando un utente
    si connette alla rete.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Sotto-comando sconosciuto. Usi: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {servizio|nick!ident@vhost} {PRIVMSG|NOTICE} <scadenza> <messaggio>"
    syntax_hint: "Uso: %syntax%"
    short: "Aggiunge una voce MOTD."
    help: |-
      Aggiunge un nuovo messaggio MOTD che verrà inviato a ogni utente al momento
      della connessione alla rete.
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Manutenzione stanotte"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Benvenuto in rete"
    done: "Voce MOTD #%id% aggiunta."
    invalid_type: "Tipo di messaggio non valido. Deve essere PRIVMSG o NOTICE."
    invalid_expiry: "Formato di scadenza non valido. Usa: <numero><s|m|h|d> oppure 0 per illimitata (es.: 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Uso: %syntax%"
    short: "Elimina una voce MOTD."
    help: "Rimuove una voce MOTD in base al suo ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "Voce MOTD #%id% eliminata."
    not_found: "Voce MOTD non trovata."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Elenca tutte le voci MOTD."
    help: "Elenca tutte le voci MOTD configurate."
    example: "%command_prefix%MOTD LIST"
    empty: "Nessuna voce MOTD configurata."
    header: "Voci MOTD:"
    status_enabled: "abilitato"
    status_disabled: "disabilitato"
    expired: "scaduto"
    no_bot: "(nessun bot)"
    shown_count: "mostrato %count% volte"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Rimuove tutte le voci MOTD scadute."
    help: "Rimuove tutte le voci MOTD la cui scadenza è passata."
    example: "%command_prefix%MOTD CLEAN"
    done: "Rimosse %count% voci MOTD scadute."
    none: "Nessuna voce MOTD scaduta da rimuovere."
  debug:
    finalized: "Il messaggio MOTD #%id% è terminato: [%type%] %message% | %date% | %shown_count%"

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <dominio> <motivo>|DEL {numero|ALL}|LIST <modello> [pagina]}"
  short: "Gestire i domini email bloccati."
  help: |-
    Gestire i domini email bloccati.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <dominio> <motivo>"
    short: "Bloccare un dominio."
    help: |-
      Accetta domini ASCII o punycode, non indirizzi o modelli. Il motivo è
      obbligatorio. Il blocco è esatto e non include i sottodomini.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {numero|ALL}"
    short: "Rimuovere i blocchi dei domini."
    help: |-
      Elimina un identificatore permanente o tutte le voci con ALL. Gli
      altri identificatori non cambiano.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <modello> [pagina]"
    short: "Elencare i domini bloccati."
    help: |-
      Il modello è obbligatorio. Solo * è un carattere jolly per qualsiasi
      sequenza. Non distingue maiuscole e minuscole. La pagina facoltativa
      parte da 1. I filtri e le pagine conservano gli identificatori.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Dominio non valido. Usare ASCII o punycode senza punto finale."
  invalid_reason: "È richiesto un motivo amministrativo non vuoto su una sola riga."
  duplicate: "Questo dominio è già bloccato."
  not_found: "Nessun dominio bloccato ha questo identificatore."
  added: "Dominio %domain% bloccato."
  deleted: "Blocco %id% rimosso."
  cleared: "Rimossi %total% domini bloccati."
  empty: "Nessun dominio bloccato corrispondente."
  header: "ID | Dominio | Motivo"
  page: "Pagina %page%/%pages%, %total% domini corrispondenti."
  row: "%id% | %domain% | %reason%"

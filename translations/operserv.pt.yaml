# Traduções de OperServ — Português
# Domínio: operserv
#
# Códigos de formatação IRC (aspas duplas ou blocos literais !irc):
#   \x02        ativa/desativa o negrito
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermelho, 07=laranja, 14=cinzento escuro)
#   \x03        repõe a cor
#   \x0F        repõe toda a formatação
#
# As cores IRC usam números DECIMAIS (0-15), não hexadecimais.
#   \x0314 = cinzento escuro (14 decimal): CORRETO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multilinha: !irc |- com quebras de linha e espaços reais.
# Os blocos sem etiqueta não descodificam escapes; preserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O apresentador acrescenta /msg sem cor e uma margem de dois espaços.

# --- ERROR --------------------------------------------------------------------
error:
  root_only: "Este comando é restrito a administradores root da rede."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [comando] [opção]"
  short: "Listar comandos ou mostrar ajuda de um comando."
  help: |-
    Sem argumentos, lista todos os comandos. Use %help_command% para ajuda
    completa ou %help_option_command% para subopções.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permite gerir os operadores da rede e as respetivas permissões, aplicar
    restrições de acesso e desligar utilizadores. Também permite enviar
    comunicados gerais e gerir as mensagens de boas-vindas da rede.
  general_header: "Comandos disponíveis:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opções:"
  examples_header: "Exemplos:"
  general_help_command: "HELP <comando>"
  option_help_command: "HELP %command% <opção>"
  detail_help_command: "HELP <comando>"
  detail_help_option_command: "HELP <comando> <opção>"
  general_footer: "Use /msg %bot% %help_command% para mais informações."
  set_sub_footer: "Use /msg %bot% %help_command% para mais informações."
  syntax_label: "Sintaxe: %syntax%"
  footer: ""
  intro_expiration: "NOTA: Nicknames não utilizados por mais de %days% dias são removidos automaticamente."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operadores e funções"
    network_security: "Segurança da rede"
    communication: "Comunicação"
    low_level: "Baixo nível"
  ircop_header: "Comandos disponíveis para IRCops:"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax: "IRCOP <opção> [parâmetros]"
  short: "Gerir operadores de IRC da rede."
  help: |-
    Gere os operadores de IRC da rede. ADD adiciona um nickname registado
    como operador com o cargo especificado.
    DEL remove um operador. LIST mostra todos os operadores.
    Use ROLE LIST para ver os cargos disponíveis.
    Este comando é restrito a utilizadores Root configurados nos serviços.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Subcomando desconhecido %sub%. Use ADD, DEL ou LIST."
  unknown_role: "O cargo %role% não existe. Use /msg %bot% %role_list% para ver os cargos disponíveis."
  already_admin: "%nickname% já é um operador de IRC (cargo: %role%)."
  not_admin: "%nickname% não é um operador de IRC."
  role_changed: "Cargo alterado para %nickname% de %old% para %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <nickname> <cargo>"
    short: "Adicionar um operador de IRC da rede."
    help: |-
      Adiciona um nickname registado como operador de IRC da rede.
      Use ROLE LIST para ver os cargos disponíveis.
      Este comando é restrito a utilizadores Root.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "Adicionado %nickname% como %role%."
    nick_not_active: "O nickname %nickname% não é um nickname registado ativo."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <nickname>"
    short: "Remover um operador de IRC da rede."
    help: |-
      Remove um operador de IRC da rede da lista.
      Este comando é restrito a utilizadores Root.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "Removido %nickname% dos operadores de IRC."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Listar todos os operadores de IRC da rede."
    help: |-
      Lista todos os operadores de IRC da rede com os seus cargos e data de registo.
      Este comando é restrito a utilizadores Root.
    example: "%command_prefix%IRCOP LIST"
    header: "Operadores de IRC da Rede"
    empty: "Não existem operadores de IRC."

# --- ROLE ---------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <cargo>|SET <cargo> [operclass]}"
    short: "Configura a classe de operador do UnrealIRCd."
    help: |-
      Permite consultar e configurar a operclass de um cargo.

      %options_header%
      %option_LIST%Mostra as operclasses disponíveis na rede.
      %option_VIEW%Mostra a operclass do cargo e as disponíveis.
      %option_SET%Atribui a operclass aos IRCOP ao identificarem-se.

      Omita o valor para a remover.

      Disponível apenas em protocolos UnrealIRCd.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SUPORTE"
      - "%command_prefix%ROLE OPERCLASS SET SUPORTE services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SUPORTE"
    list:
      header: "Operclasses Disponiveis na Rede"
      empty: "Nao ha operclasses disponiveis na rede."
      not_supported: "O protocolo atual nao suporta listar operclasses disponiveis."
    view:
      empty: "A funcao %role% nao tem operclass."
      line: "Operclass: %operclass%"
      available: "Operclasses disponiveis: %available%"
    set:
      done: "Operclass configurada para o cargo %role%."
      cleared: "Operclass removida do cargo %role%."
      not_available: "A operclass %operclass% nao esta disponivel na rede. Operclasses disponiveis: %available%."
  syntax: "ROLE <opção> [parâmetros]"
  short: "Permite gerir os cargos dos operadores, as respetivas permissões e configuração."
  help: |-
    Permite gerir os cargos dos operadores, as respetivas permissões e configuração.

    Os cargos ADMIN, OPER e PREOPER estão protegidos e não podem ser eliminados.
    Comando reservado a utilizadores Root.
  syntax_operclass: "ROLE <opção> [parâmetros]"
  help_operclass: |-
    Permite gerir os cargos dos operadores, as respetivas permissões e configuração.

    Os cargos ADMIN, OPER e PREOPER estão protegidos e não podem ser eliminados.
    Comando reservado a utilizadores Root.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SUPORTE Operadores de suporte"
  unknown_sub: "Subcomando desconhecido %sub%. Use ADD, DEL, LIST, PERMS, MODES ou VHOST."
  unknown_sub_operclass: "Subcomando desconhecido %sub%. Use ADD, DEL, LIST, PERMS, MODES, VHOST ou OPERCLASS."
  not_found: "O cargo %role% não existe."
  already_exists: "O cargo %role% já existe."
  protected: "O cargo %role% é protegido e não pode ser eliminado."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <nome> [descrição]"
    short: "Criar um novo cargo."
    help: |-
      Cria um novo cargo personalizado. A descrição é opcional.
      Este comando é restrito a utilizadores Root.
    example: "%command_prefix%ROLE ADD SUPORTE Operadores de suporte"
    done: "Criado cargo %role%."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <nome>"
    short: "Eliminar um cargo."
    help: |-
      Elimina um cargo personalizado. Cargos protegidos (ADMIN, OPER, PREOPER)
      não podem ser eliminados. Se o cargo tiver operadores atribuídos,
      deve reatribuí-los primeiro.
      Este comando é restrito a utilizadores Root.
    example: "%command_prefix%ROLE DEL SUPORTE"
    done: "Eliminado cargo %role%."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Mostra os cargos disponíveis."
    help: |-
      Lista todos os cargos. Os cargos protegidos são marcados com [PROTEGIDO].
      Este comando é restrito a utilizadores Root.
    example: "%command_prefix%ROLE LIST"
    header: "Cargos de Operador"
    empty: "Não existem cargos de operador."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <cargo> <permissão>|{LIST|CLEAR} <cargo>}"
    short: "Gere as permissões do cargo."
    help: |-
      Gere as permissões atribuídas a um cargo.

      %options_header%
      %option_LIST%Mostra todas as permissões disponíveis e indica as atribuídas.
      %option_ADD%Atribui uma permissão ao cargo.
      %option_DEL%Remove uma permissão (exceto em cargos protegidos).
      %option_CLEAR%Remove todas as permissões do cargo.

      %assigned_status% indica que a permissão está atribuída; %unassigned_status% indica que está disponível.

      Use ALL para adicionar todas as permissões disponíveis de uma só vez.
      Comando reservado a utilizadores Root.
    example: "%command_prefix%ROLE PERMS LIST SUPORTE"
    examples:
      - "%command_prefix%ROLE PERMS ADD SUPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SUPORTE ALL"
      - "%command_prefix%ROLE PERMS DEL SUPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SUPORTE"
    not_found: "A permissão %perm% não existe."
    already_has: "O cargo %role% já tem a permissão %perm%."
    does_not_have: "O cargo %role% não tem a permissão %perm%."
    list:
      header: "Lista de permissões de %role%"
      columns: "Atribuída | Chave da permissão | Descrição"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Adicionada permissão %perm% ao cargo %role%."
      all_done: "Adicionadas %count% permissões ao cargo %role%."
    del:
      done: "Removida permissão %perm% do cargo %role%."
    clear:
      done: "Removidas %count% permissões do cargo %role%."
      empty: "O cargo %role% não tem permissões atribuídas."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <cargo>|SET <cargo> [modos]}"
    short: "Configura os modos de utilizador do cargo."
    help: |-
      Gere os modos de utilizador IRCOP atribuídos a um cargo.

      %options_header%
      %option_VIEW%Mostra os modos atuais do cargo.
      %option_SET%Define os modos IRCOP.

      Omita os modos para os remover todos.

      Os utilizadores com este cargo recebem estes modos ao identificarem-se.
      Modos disponíveis por IRCD
      Comando reservado a utilizadores Root.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Modos para %role%"
      empty: "O cargo %role% não tem modos atribuídos."
      line: "Modos: %modes%"
    set:
      done: "Definidos modos %modes% para o cargo %role%."
      cleared: "Removidos todos os modos do cargo %role%."
      invalid_mode: "O modo %mode% não é um modo IRCOP válido."
      invalid_modes: "Modos inválidos: %invalid%. Modos válidos: %valid%."
      no_irc_user_modes: "O IRCD atual não tem modos IRCOP configurados."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <cargo>|SET <cargo> [vhost]}"
    short: "Configura o padrão de host virtual do cargo."
    help: |-
      Permite configurar o host virtual atribuído aos operadores de um cargo ao
      identificarem-se, substituindo o host pessoal.

      O host é gerado combinando o nickname sem caracteres especiais com o padrão
      configurado. Por exemplo:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Mostra o padrão configurado para um cargo.
      %option_SET%Define ou remove o padrão de um cargo.

      O padrão só admite letras, números, hífenes e pontos. Tem de conter pelo
      menos um ponto, não pode começar ou terminar com hífen ou ponto e não pode
      conter pontos consecutivos.

      Para remover o host forçado, use SET sem indicar um padrão.

      Comando reservado a utilizadores Root.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Vhost forçado para %role%"
      empty: "O cargo %role% não tem um padrão de vhost forçado definido."
      line: "Padrão: %pattern%"
      example: "Exemplo: %example_nickname%.%pattern%"
      example_nickname: "nickname"
    set:
      done: "Definido padrão de vhost forçado para o cargo %role%."
      cleared: "Removido padrão de vhost forçado do cargo %role%."
      invalid: "Padrão de vhost inválido. Caracteres válidos: a-z, A-Z, 0-9, - e .. Deve ter pelo menos um ponto, não pode começar/terminar com - ou . nem ter .."

# --- KILL ---------------------------------------------------------------------
kill:
  syntax: "KILL <nickname> <motivo>"
  short: "Desligar forçadamente um utilizador da rede."
  help: |-
    Desliga um utilizador da rede IRC.
    Os IRCop e os utilizadores Root não podem ser expulsos com KILL.
  example: "%command_prefix%KILL BadUser Flood nos canais"
  protected_root: "Não é possível matar o utilizador Root %nickname%."
  protected_ircop: "Não é possível matar o operador de IRC %nickname%."
  done: "O utilizador %nickname% foi morto (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax: "GLINE <opção> [parâmetros]"
  short: "Gerir G-lines globais da rede."
  help: |-
    Gere as G-lines (banimentos globais) da rede.
    ADD adiciona uma G-line com máscara, expiração e motivo.
    DEL remove uma G-line pela máscara ou número da entrada.
    LIST mostra todas as G-lines, com filtro opcional por máscara.

    Formato da expiração: 0 = permanente, ou sufixo d, h, m (ex.: 7d, 12h, 30m).
    As GLINEs correspondentes a utilizadores Root ou IRCop são rejeitadas.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuso de spam"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuso persistente"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Subcomando desconhecido %sub%. Use ADD, DEL ou LIST."
  invalid_mask: "Formato de máscara inválido. Deve estar no formato user@host (ex: *@192.168.*)."
  global_mask: "A máscara de G-line %mask% é demasiado ampla. Máscaras globais não são permitidas."
  dangerous_mask: "A máscara de G-line %mask% é demasiado ampla. A parte do host precisa de pelo menos 4 caracteres alfanuméricos."
  protected_user: "Não é possível aplicar G-line ao utilizador protegido %nickname%."
  invalid_expiry: "Formato de expiração inválido. Use 0 para permanente, ou um valor como 7d, 12h, 30m."
  already_exists: "G-line para %mask% já existe."
  max_entries: "Número máximo de G-lines (%max%) atingido."
  not_found: "G-line %mask% não encontrada."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <máscara> <expiração> <motivo>"
    short: "Adicionar uma G-line global na rede."
    help: |-
      Adiciona uma G-line (banimento global) à rede.
      A máscara tem de estar no formato utilizador@host.
      Expiração: 0 = permanente, ou sufixo d, h, m (ex.: 7d, 12h, 30m).
      As GLINEs correspondentes a utilizadores Root ou IRCop são rejeitadas.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuso de spam"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuso persistente"
    done: "G-line adicionada: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<máscara>|<número>}"
    short: "Remover uma G-line."
    help: |-
      Remove uma G-line da lista.
      Pode indicar a máscara ou o número da entrada devolvido por LIST.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% removida."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [máscara]"
    short: "Listar todas as G-lines."
    help: "Lista todas as G-lines. Opcionalmente, filtra pelo padrão da máscara."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-lines (%count%)"
    empty: "Não existem G-lines."
    entry: "%index%. %mask% - %reason% (%nickname%, expira: %expiration%)"

# --- BADMAIL ------------------------------------------------------------------
badmail:
  syntax: "BADMAIL <opção> [parâmetros]"
  short: "Gerir domínios de email bloqueados."
  help: |-
    Gerir domínios de email bloqueados.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <domínio> <motivo>"
    short: "Bloquear um domínio."
    help: |-
      Aceita domínios ASCII ou punycode, não endereços nem padrões. O motivo
      é obrigatório. O bloqueio é exato e não inclui subdomínios.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {número|ALL}"
    short: "Remover bloqueios de domínios."
    help: |-
      Elimina um identificador permanente ou todas as entradas com ALL. Os
      outros identificadores não mudam.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <padrão> [página]"
    short: "Listar domínios bloqueados."
    help: |-
      O padrão é obrigatório. Apenas * é um caráter universal para qualquer
      sequência. Não distingue maiúsculas. A página opcional começa em 1. Os
      identificadores são mantidos ao filtrar e paginar.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Domínio inválido. Use ASCII ou punycode sem ponto final."
  invalid_reason: "É necessário um motivo administrativo não vazio numa única linha."
  duplicate: "Este domínio já está bloqueado."
  not_found: "Não existe um domínio bloqueado com esse identificador."
  added: "Domínio %domain% bloqueado."
  deleted: "Bloqueio %id% removido."
  cleared: "Foram removidos %total% domínios bloqueados."
  empty: "Nenhum domínio bloqueado corresponde."
  header: "ID | Domínio | Motivo"
  page: "Página %page%/%pages%, %total% domínios correspondentes."
  row: "%id% | %domain% | %reason%"

# --- GLOBAL -------------------------------------------------------------------
global:
  syntax: "GLOBAL {serviço|nick!ident@vhost} {PRIVMSG|NOTICE} <mensagem>"
  short: "Enviar uma mensagem global para todos os utilizadores ligados."
  help: |-
    Permite enviar mensagens a todos os utilizadores ligados, através de um
    serviço existente ou de um cliente temporário com identidade personalizada.

    As mensagens podem ser enviadas como PRIVMSG (privado) ou NOTICE (aviso).

    Para usar um cliente temporário, indique uma máscara no formato
    nickname!ident@vhost, com caracteres válidos em cada campo.

    O nickname não pode estar registado nem em uso. O cliente desliga-se
    automaticamente após o envio e o nickname fica bloqueado durante 24 horas.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Manutenção dentro de 10 minutos"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE A rede será reiniciada"
  mask_invalid: "Formato de máscara inválido: %error%"
  nick_connected: "O nickname %nickname% está atualmente ligado."
  nick_registered: "O nickname %nickname% está registado."
  type_invalid: "O tipo de mensagem deve ser PRIVMSG ou NOTICE."
  done: "Mensagem global enviada de %nickname% para %count% utilizadores."

# --- MOTD ---------------------------------------------------------------------
motd:
  short: "Gerir mensagens MOTD enviadas aos utilizadores ao ligar."
  syntax: "MOTD <opção> [parâmetros]"
  help: |-
    Gere entradas da mensagem do dia (MOTD), enviadas quando um utilizador se
    liga à rede.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Subcomando desconhecido. Use: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {serviço|nick!ident@vhost} {PRIVMSG|NOTICE} <expiração> <mensagem>"
    syntax_hint: "Uso: %syntax%"
    short: "Adicionar uma entrada MOTD."
    help: "Adiciona uma nova mensagem MOTD, enviada a cada utilizador ao ligar-se à rede."
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Manutenção esta noite"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Bem-vindo à rede"
    done: "Entrada MOTD #%id% adicionada."
    invalid_type: "Tipo de mensagem inválido. Deve ser PRIVMSG ou NOTICE."
    invalid_expiry: "Formato de expiração inválido. Use: <número><s|m|h|d> ou 0 para ilimitado (ex.: 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Uso: %syntax%"
    short: "Eliminar uma entrada MOTD."
    help: "Remove uma entrada MOTD pelo respetivo ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "Entrada MOTD #%id% eliminada."
    not_found: "Entrada MOTD não encontrada."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Listar todas as entradas MOTD."
    help: "Lista todas as entradas MOTD configuradas."
    example: "%command_prefix%MOTD LIST"
    empty: "Nenhuma entrada MOTD configurada."
    header: "Entradas MOTD:"
    status_enabled: "ativada"
    status_disabled: "desativada"
    expired: "expirada"
    no_bot: "(sem bot)"
    shown_count: "mostrado %count% vezes"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Remover todas as entradas MOTD expiradas."
    help: "Remove todas as entradas MOTD cuja expiração já tenha passado."
    example: "%command_prefix%MOTD CLEAN"
    done: "Removidas %count% entradas MOTD expiradas."
    none: "Nenhuma entrada MOTD expirada para remover."
  debug:
    finalized: "A mensagem MOTD #%id% terminou: [%type%] %message% | %date% | %shown_count%"

# --- RAW ----------------------------------------------------------------------
raw:
  syntax: "RAW <linha>"
  short: "Enviar uma linha de protocolo raw para o IRCd."
  help: |-
    Envia a linha indicada diretamente para o socket do IRCd de ligação.
    Utilize com extrema precaução. Linhas de protocolo inválidas podem bloquear a
    rede.
  example: "%command_prefix%RAW :services.ares NOTICE * :Manutenção programada"
  empty: "Deve especificar uma linha não vazia para enviar."
  too_long: "A linha é demasiado longa. Máximo 510 caracteres."
  not_connected: "Não está ligado ao IRCd."
  done: "Linha raw enviada."
  protocol:
    syntax: "O protocolo ativo rejeitou a sintaxe do comando RAW."
    done: "Comando RAW gerido pelo protocolo executado."
    target: "O protocolo ativo rejeitou o destino %target%."

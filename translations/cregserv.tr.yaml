  already_denied: "\x0304✗\x03 \x02%channel%\x02 kanalı zaten reddedilmiş."

pendientes:
  syntax: "PENDIENTES"
  short: "İnceleme bekleyen kanal kayıt taleplerini listeler."
  help: "Bir hizmet operatörünün değerlendirmesini bekleyen her talebi kanalı, talep edeni, tarihi ve açıklamasıyla birlikte gösterir. \x02cregserv.pendientes\x02 iznine ihtiyacın var."
  empty: "İnceleme bekleyen kanal yok."

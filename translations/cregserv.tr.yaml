unknown_command: "\x0304✗\x03 Bilinmeyen komut \x02%command%\x02. Kullan: \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Hatalı sözdizimi. Kullanım: \x02%syntax%\x02"

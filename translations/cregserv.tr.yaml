  already_approved: "\x0304✗\x03 \x02%channel%\x02 kanalı zaten kayıtlı."
  already_denied: "\x0304✗\x03 \x02%channel%\x02 kanalı \x0304REDDEDİLDİ\x03 olarak işaretlendiği için kaydedilemez."
  failed: "\x0304✗\x03 \x02%channel%\x02 kanalının kaydı tamamlanamadı."

denegar:
  syntax: "DENEGAR <#channel> <sebep>"
  short: "Bekleyen bir kanal kayıt talebini reddeder."
  help: "Kanal adını boş bırakarak bir kayıt talebini geri çevirir. Sebep zorunludur ve DENEGADOS tarafından gösterilir. \x02cregserv.denegar\x02 iznine ihtiyacın var."
  denied: "\x0303✔\x03 \x02%channel%\x02 kanalının kaydı reddedildi."
  invalid_channel: "\x0304✗\x03 Kanal adı bir \x02#\x02 ile başlamalıdır."
  no_pending: "\x0304✗\x03 \x02%channel%\x02 kanalının hiçbir kayıt süreci yok."

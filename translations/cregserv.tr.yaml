  end: "Liste sonu."

denegados:
  syntax: "DENEGADOS"
  short: "Reddedilen kanal kayıt taleplerini listeler."
  help: "Her reddedilen talebi, reddedilme sebebiyle birlikte gösterir. \x02cregserv.denegados\x02 iznine ihtiyacın var."
  empty: "Reddedilmiş kanal yok."
  line: "\x02Kanal:\x02 %channel%, \x02Sebep:\x02 %reason%"
  end: "Liste sonu."

drop:
  syntax: "DROP <#channel>"
  short: "\x02%bot%\x02'ün bir kanal için tuttuğu kayıt kaydını siler."
  help: "\x02%bot%\x02'ün bir kanal için, hangi durumda olursa olsun tuttuğu kaydı siler. Zaten onaylanmış bir kanal \x02ChanServ\x02 üzerinde kayıtlı kalır: burada serbest bırakılan şey kanal adıdır; böylece reddedilmiş bir kanal yeniden talep edilebilir. \x02cregserv.drop\x02 iznine ihtiyacın var."
  dropped: "\x0303✔\x03 \x02%channel%\x02 kanalının kayıt kaydı \x02%bot%\x02 üzerinden silindi."

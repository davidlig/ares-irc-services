registra:
  syntax: "REGISTRA <#channel> <açıklama>"
  short: "Bir kanal kaydının onaylanmasını talep eder."
  help: "Bir kanalın kaydedilmesini talep et. Bir hizmet operatörü talebi değerlendirir ve onaylar ya da reddeder; kanal yalnızca onaylandıktan sonra kaydedilir. %nickserv% ile kimliğin doğrulanmış olmalı."
  requested: "\x0303✔\x03 \x02%channel%\x02 kanalının kaydını talep ettin. Bir hizmet operatörü talebi değerlendirecek."
  invalid_channel: "\x0304✗\x03 Kanal adı bir \x02#\x02 ile başlamalıdır."
  channel_too_long: "\x0304✗\x03 Kanal adı çok uzun: en fazla \x0264\x02 karakter, \x02#\x02 dahil."
  description_too_long: "\x0304✗\x03 Açıklama çok uzun: en fazla \x02255\x02 karakter."
  already_registered: "\x0304✗\x03 \x02%channel%\x02 kanalı zaten kayıtlı."
  duplicate: "\x0304✗\x03 \x02%channel%\x02 için onay bekleyen bir kayıt talebi zaten var. Kullan: \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 \x02%channel%\x02 kanalının kayıt talebi reddedildi."
  throttled: "\x0304✗\x03 Başka bir kanal talep etmeden önce \x02%minutes%\x02 dakika beklemelisin."


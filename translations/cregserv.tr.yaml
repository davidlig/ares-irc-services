aprobar:
  syntax: "APROBAR <#channel>"
  short: "Bekleyen bir kanal kayıt talebini onaylar."
  help: "Talebi inceleme bekleyen bir kanalı kaydeder. Kanal, talep eden kullanıcı adına kaydedilir; ikinizin de içeride olmasına gerek yok. \x02cregserv.aprobar\x02 iznine ihtiyacın var."
  approved: "\x0303✔\x03 \x02%channel%\x02 kanalı \x02%founder%\x02 için başarıyla kaydedildi."
  invalid_channel: "\x0304✗\x03 Kanal adı bir \x02#\x02 ile başlamalıdır."

  syntax: "ESTADO <#channel>"
  short: "Bir kanalın kayıt durumunu gösterir."
  help: "Bir kanalın kayıt sürecinin hangi aşamasında olduğunu bildirir: kayıtlı, süreçte veya reddedilmiş."
  registered: "\x0303✔\x03 \x02%channel%\x02 kanalı zaten kayıtlı."
  pending: "\x0303◌\x03 \x02%channel%\x02 kanalı süreçte, bir hizmet operatörünün incelemesini bekliyor (%date% tarihinde talep edildi)."
  denied: "\x0304✗\x03 \x02%channel%\x02 kanalı %date% tarihinden beri reddedilmiş. Sebep: %reason%"

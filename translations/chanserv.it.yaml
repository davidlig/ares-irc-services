# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <#canale> {FOUNDER <soprannome> [token]|SUCCESSOR [nickname]|DESC <descrizione>|URL [url]|EMAIL [email]|ENTRYMSG [messaggio]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%SET #canale DESC Un canale comunitario"
  examples:
    - "%command_prefix%SET #canale URL https://example.test"
    - "%command_prefix%SET #canale MLOCK ON"
  short: "Modifica le opzioni del canale."
  help: |-
    Modifica un'opzione del canale. L'aiuto di ciascuna opzione ne spiega requisiti
    e varianti.
  unknown_option: "Opzione sconosciuta %option%. Usi una tra: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Usa SET <#canale> FOUNDER <soprannome> <token> con il token confermato del fondatore attuale."
    token_unavailable: "Il fondatore attuale non ha un token di recupero confermato. Deve prima autenticarsi e usare VERIFY."
    syntax: "SET <#canale> FOUNDER <soprannome> [token]"
    example: "%command_prefix%SET #canale FOUNDER Alice"
    examples:
      - "%command_prefix%SET #canale FOUNDER Alice token-confermato"
    short: "Trasferisce il canale a un altro nickname registrato."
    help: |-
      Cambia il fondatore dopo aver convalidato il token del fondatore attuale.
      Resta valida l'eccezione amministrativa del livello fondatore. Il token non
      viene consumato.
    invalid_token: "Il token di recupero non è valido."
    updated: "Il fondatore è stato cambiato in %nickname%."
    throttled: "Troppi token errati. Riprova tra %minutes% minuto/i."
    must_be_registered: "%nickname% deve essere registrato e attivato."
    suspended: "%nickname% è sospeso e non può essere impostato come fondatore."
    cannot_be_self: "Il nuovo fondatore non può essere il fondatore attuale."
    cannot_be_successor: "Il nuovo fondatore non può essere il successore del canale."
    limit_exceeded: "%nickname% ha raggiunto il massimo di %max% canali registrati."
    notice_channel: "%from% assegna %nickname% come fondatore del canale."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canale> SUCCESSOR [nickname]"
    example: "%command_prefix%SET #canale SUCCESSOR Alice"
    examples:
      - "%command_prefix%SET #canale SUCCESSOR"
    short: "Imposta il successore del canale."
    help: |-
      Imposta un nickname come successore del canale. Se il nickname viene omesso,
      rimuove quello attuale. Il nickname deve essere registrato e attivato.
    cleared: "Successore rimosso."
    updated: "Successore impostato su %nickname%."
    must_be_registered: "%nickname% deve essere registrato e attivato."
    suspended: "%nickname% è sospeso e non può essere impostato come successore."
    cannot_be_founder: "Il fondatore non può essere impostato come successore."
    notice_channel: "%from% assegna %nickname% come successore del canale."
    notice_channel_cleared: "%from% ha rimosso il successore del canale."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canale> DESC <descrizione>"
    example: "%command_prefix%SET #canale DESC Un canale comunitario"
    short: "Modifica la descrizione del canale."
    help: "Modifica la descrizione del canale (obbligatoria)."
    updated: "Descrizione aggiornata."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canale> URL [url]"
    example: "%command_prefix%SET #canale URL https://example.test"
    examples:
      - "%command_prefix%SET #canale URL"
    short: "Imposta l'URL del canale."
    help: "Modifica l'indirizzo web del canale. Ometti l'URL per rimuoverlo."
    updated: "URL aggiornato."
    cleared: "URL rimosso."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canale> EMAIL [email]"
    example: "%command_prefix%SET #canale EMAIL equipo@example.test"
    examples:
      - "%command_prefix%SET #canale EMAIL"
    short: "Imposta l'email del canale."
    help: |-
      Modifica l'indirizzo email del canale. Ometti l'email per rimuoverla.
      I domini email bloccati amministrativamente non sono consentiti.
      Eccezione amministrativa: operatori con accesso di livello fondatore.
    invalid: "Indirizzo email non valido."
    updated: "Email aggiornata."
    cleared: "Email rimossa."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canale> ENTRYMSG [messaggio]"
    example: "%command_prefix%SET #canale ENTRYMSG Benvenuto"
    examples:
      - "%command_prefix%SET #canale ENTRYMSG"
    short: "Imposta il messaggio di ingresso del canale."
    help: "Imposta il messaggio di ingresso (NOTICE). Ometti il messaggio per rimuoverlo."
    updated: "Messaggio di ingresso aggiornato."
    too_long: "Il messaggio di ingresso non può superare i %max% caratteri."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canale> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #canale TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #canale TOPICLOCK OFF"
    short: "Blocca il topic del canale."
    help: |-
      Impedisce di modificare il topic del canale. Quando si attiva, imposta quello
      attuale.
    on: "Blocco topic ora ON."
    off: "Blocco topic ora OFF."
    notice_on: "%nickname% attiva TOPICLOCK."
    notice_off: "%nickname% disattiva TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canale> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #canale MLOCK ON"
    examples:
      - "%command_prefix%SET #canale MLOCK OFF"
    short: "Blocca i modi del canale."
    help: |-
      Blocca i modi attuali del canale (es. +nt). Quando ON, i modi non possono essere
      modificati.
    no_modes: "nessun modo"
    on: "MLOCK ora ON (%modes%)."
    off: "MLOCK ora OFF."
    notice_on: "%nickname% attiva MLOCK (%modes%)."
    notice_off: "%nickname% disattiva MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canale> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #canale PRIVATE ON"
    examples:
      - "%command_prefix%SET #canale PRIVATE OFF"
    short: "Nascondi le informazioni del canale agli utenti senza accesso."
    help: |-
      Quando è ON, solo il fondatore e gli utenti con accesso possono vedere le
      informazioni del canale.
    on: "Le informazioni del canale ora sono private."
    off: "Le informazioni del canale ora sono pubbliche."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canale> SECURE {ON|OFF}"
    example: "%command_prefix%SET #canale SECURE ON"
    examples:
      - "%command_prefix%SET #canale SECURE OFF"
    short: "Richiede la lista di accesso per i ranghi del canale."
    help: |-
      Impedisce di assegnare ruoli nel canale ai nickname non presenti nell'elenco
      di accesso.
    on: "SECURE ora ON."
    off: "SECURE ora OFF."
    notice_on: "%nickname% attiva la modalità SECURE."
    notice_off: "%nickname% disattiva la modalità SECURE."


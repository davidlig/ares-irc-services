  general_header: "\x02 ■ Comandi disponibili:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Opzioni:\x02"
  general_footer: "\x0310ℹ\x03\x0F Usa /msg %bot% \x02\x0303HELP <comando>\x03\x0F per maggiori informazioni."
  set_sub_footer: "\x0310ℹ\x03\x0F Usa /msg %bot% \x02\x0303HELP %command% <opzione>\x03\x0F per maggiori informazioni."
  syntax_label: "Sintassi: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0304⚠\x03\x0F NOTA: I canali non utilizzati per più di \x1F\x0304%days% giorni\x03\x1F vengono rimossi automaticamente."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_info: "Registrazione e informazioni"
    access_levels: "Accesso e livelli"
    ranks_entry: "Gradi e ingresso"
  ircop_group:
    channel_operations: "Operazioni del canale"
    channel_management: "Gestione del canale"
    deletion: "Eliminazione e ripristino"
    restrictions: "Restrizioni"
    lookup: "Ricerca e indagine"
    registration_approval: "Approvazione della registrazione"

# --- LEVEL FOUNDER ---------------------------------------------------------
level_founder:
  short: "Consente di eseguire operazioni che richiedono il livello di fondatore del canale."

# --- CLEARACCESS -----------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#canale>"
  example: "%command_prefix%\x02\x0303CLEARACCESS #canale\x03\x0F"
  short: "Svuota l'intera lista di accesso di un canale."
  help: "Elimina tutte le voci di accesso del canale. L'azione è irreversibile."
  success: "\x0303✔\x03 Eliminate \x02%count%\x02 voci di accesso da \x02%channel%\x02."
  empty: "\x0307ℹ\x03 Il canale \x02%channel%\x02 non ha voci di accesso."

# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#canale> [motivo]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #canale\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #canale flooding\x03\x0F"
  short: "Espelle tutti gli utenti da un canale."
  help: |-
    Espelle tutti gli utenti dal canale. È un comando riservato agli IRCop; se non
    si indica un motivo, ne viene usato uno predefinito.
  not_on_network: "\x0304✗\x03 Il canale \x02%channel%\x02 non è attualmente sulla rete."
  empty: "\x0307ℹ\x03 Il canale \x02%channel%\x02 non ha utenti da espellere."
  success: "\x0303✔\x03 Espulsi \x02%count%\x02 utente/i da \x02%channel%\x02."
  default_reason: "Comando CLEARUSERS"

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <modello> [pagina]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "Elenca i canali registrati che corrispondono a un modello."
  help: |-
    Elenca i canali registrati che corrispondono al modello indicato. Il carattere
    jolly * corrisponde a qualsiasi sequenza di caratteri. La pagina è facoltativa
    e parte da 1.
  header: "Canale | Fondatore | Registrazione | Ultimo utilizzo | Stato"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Nessun canale corrisponde al modello %pattern%."
  status_pending_registration: "In attesa di approvazione"
  status_rejected_registration: "Registrazione rifiutata"
  status_active: "Attivo"

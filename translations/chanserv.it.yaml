# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <modello> [pagina]"
  example: "%command_prefix%LIST #*"
  examples:
    - "%command_prefix%LIST #* 2"
  short: "Elenca i canali registrati che corrispondono a un modello."
  help: |-
    Elenca i canali registrati che corrispondono al modello indicato. Il carattere
    jolly * corrisponde a qualsiasi sequenza di caratteri. La pagina è facoltativa
    e parte da 1.
  header: "Canale | Fondatore | Registrazione | Ultimo utilizzo | Stato"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Nessun canale corrisponde al modello %pattern%."
  status_pending_registration: "In attesa di approvazione"
  status_rejected_registration: "Registrazione rifiutata"
  status_active: "Attivo"

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%REGMODE APPROVAL"
  short: "Imposta o controlla la modalità di registrazione dei canali."
  help: |-
    Imposta la registrazione su DIRECT o APPROVAL, oppure controlla STATUS.
    DIRECT è la modalità predefinita e mantiene la registrazione immediata.

  status: "La modalità di registrazione dei canali è %mode%."
  changed: "La modalità di registrazione dei canali è ora %mode%."

# --- CREG (IRCop) -------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [pagina]|ACCEPT <#canale>|REJECT <#canale> <motivo>}"
  pending.syntax: "CREG PENDING [pagina]"
  pending.example: "%command_prefix%CREG PENDING"
  pending.short: "Elenca le richieste di registrazione in attesa."
  pending.help: "Elenca le richieste in attesa in una pagina limitata."
  accept.syntax: "CREG ACCEPT <#canale>"
  accept.example: "%command_prefix%CREG ACCEPT #canal"
  accept.short: "Approva una richiesta di registrazione del canale."
  accept.help: "Verifica nuovamente il richiedente e attiva la registrazione in attesa."
  reject.syntax: "CREG REJECT <#canale> <motivo>"
  reject.example: "%command_prefix%CREG REJECT #canal Motivo público"
  reject.short: "Rifiuta una richiesta di registrazione del canale."
  reject.help: "Rifiuta la richiesta con un motivo obbligatorio e un blocco."
  example: "%command_prefix%CREG PENDING"
  short: "Esamina le richieste di registrazione dei canali."
  help: |-
    Elenca le richieste in attesa oppure approva o rifiuta una richiesta.
    I rifiuti richiedono un motivo. Solo ACCEPT registra il canale.

  pending_header: "Registrazioni in attesa (pagina %page%)"
  pending_item: "%channel% — richiedente %requester%, inviata %submitted%: %description%"
  accepted: "La registrazione di %channel% è stata approvata."
  rejected: "La registrazione di %channel% è stata rifiutata."
  not_pending: "Il canale %channel% non ha registrazioni in attesa."
  channel_not_on_network: "Il canale %channel% non è in rete."
  founder_limit: "Il richiedente ha raggiunto il limite di registrazioni dei canali."

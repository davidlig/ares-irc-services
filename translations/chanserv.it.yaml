  already_registered: "Il canale %channel% è già registrato o ha una richiesta di registrazione in corso."
  channel_not_on_network: "Il canale %channel% non esiste sulla rete."
  pending_deletion: "Il canale %channel% è in attesa di cancellazione e non può essere registrato."
  insufficient_channel_rank: "Devi avere almeno lo stato di operatore su %channel% per registrarlo."
  limit_exceeded: "Ha raggiunto il massimo di %max% canali registrati."

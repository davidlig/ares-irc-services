# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#canale> <nickname>"
  example: "%command_prefix%\x02\x0303OP #canale Alice\x03\x0F"
  short: "Assegna lo stato di operatore del canale."
  help: "Assegna lo stato di operatore del canale."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha ricevuto lo stato di operatore del canale."
  user_not_on_channel: "\x0304✗\x03 Il nickname \x02%nickname%\x02 non è sulla rete."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 concede \x0304%mode%\x03 a \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#canale> <nickname>"
  example: "%command_prefix%\x02\x0303DEOP #canale Alice\x03\x0F"
  short: "Rimuove lo stato di operatore del canale."
  help: "Rimuove lo stato di operatore del canale."
  done: "\x0303✔\x03 \x02%nickname%\x02 è stato deoppato."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 Con SECURE attivo, \x02%nickname%\x02 deve avere almeno il livello \x02%level%\x02 per ricevere \x02%mode%\x02."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#canale> {FOUNDER <soprannome> [token]|SUCCESSOR [nickname]|DESC <descrizione>|URL [url]|EMAIL [email]|ENTRYMSG [messaggio]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%\x02\x0303SET #canale DESC Un canale comunitario\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #canale URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #canale MLOCK ON\x03\x0F"
  short: "Modifica le opzioni del canale."
  help: |-
    Modifica un'opzione del canale. L'aiuto di ciascuna opzione ne spiega requisiti
    e varianti.
  unknown_option: "\x0304✗\x03 Opzione sconosciuta \x02%option%\x02. Usi una tra: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Usa SET <#canale> FOUNDER <soprannome> <token> con il token confermato del fondatore attuale."
    token_unavailable: "Il fondatore attuale non ha un token di recupero confermato. Deve prima autenticarsi e usare VERIFY."
    syntax: "SET <#canale> FOUNDER <soprannome> [token]"
    example: "%command_prefix%\x02\x0303SET #canale FOUNDER Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canale FOUNDER Alice token-confermato\x03\x0F"
    short: "Trasferisce il canale a un altro nickname registrato."
    help: |-
      Cambia il fondatore dopo aver convalidato il token del fondatore attuale.
      Resta valida l'eccezione amministrativa del livello fondatore. Il token non
      viene consumato.
    invalid_token: "Il token di recupero non è valido."
    updated: "\x0303✔\x03 Il fondatore è stato cambiato in \x02%nickname%\x02."
    throttled: "Troppi token errati. Riprova tra %minutes% minuto/i."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 deve essere registrato e attivato."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 è sospeso e non può essere impostato come fondatore."
    cannot_be_self: "\x0304✗\x03 Il nuovo fondatore non può essere il fondatore attuale."
    cannot_be_successor: "\x0304✗\x03 Il nuovo fondatore non può essere il successore del canale."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 ha raggiunto il massimo di %max% canali registrati."
    notice_channel: "\x02%from%\x02 assegna \x02%nickname%\x02 come fondatore del canale."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canale> SUCCESSOR [nickname]"
    example: "%command_prefix%\x02\x0303SET #canale SUCCESSOR Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canale SUCCESSOR\x03\x0F"
    short: "Imposta il successore del canale."
    help: |-
      Imposta un nickname come successore del canale. Se il nickname viene omesso,
      rimuove quello attuale. Il nickname deve essere registrato e attivato.
    cleared: "\x0303✔\x03 Successore rimosso."
    updated: "\x0303✔\x03 Successore impostato su \x02%nickname%\x02."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 deve essere registrato e attivato."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 è sospeso e non può essere impostato come successore."
    cannot_be_founder: "\x0304✗\x03 Il fondatore non può essere impostato come successore."
    notice_channel: "\x02%from%\x02 assegna \x02%nickname%\x02 come successore del canale."
    notice_channel_cleared: "\x02%from%\x02 ha rimosso il successore del canale."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canale> DESC <descrizione>"
    example: "%command_prefix%\x02\x0303SET #canale DESC Un canale comunitario\x03\x0F"
    short: "Modifica la descrizione del canale."
    help: "Modifica la descrizione del canale (obbligatoria)."
    updated: "\x0303✔\x03 Descrizione aggiornata."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canale> URL [url]"
    example: "%command_prefix%\x02\x0303SET #canale URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canale URL\x03\x0F"
    short: "Imposta l'URL del canale."
    help: "Modifica l'indirizzo web del canale. Ometti l'URL per rimuoverlo."
    updated: "\x0303✔\x03 URL aggiornato."
    cleared: "\x0303✔\x03 URL rimosso."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canale> EMAIL [email]"
    example: "%command_prefix%\x02\x0303SET #canale EMAIL equipo@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canale EMAIL\x03\x0F"
    short: "Imposta l'email del canale."
    help: |-
      Modifica l'indirizzo email del canale. Ometti l'email per rimuoverla.
      I domini email bloccati amministrativamente non sono consentiti.
      Eccezione amministrativa: operatori con accesso di livello fondatore.
    invalid: "\x0304✗\x03 Indirizzo email non valido."
    updated: "\x0303✔\x03 Email aggiornata."
    cleared: "\x0303✔\x03 Email rimossa."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canale> ENTRYMSG [messaggio]"
    example: "%command_prefix%\x02\x0303SET #canale ENTRYMSG Benvenuto\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canale ENTRYMSG\x03\x0F"
    short: "Imposta il messaggio di ingresso del canale."
    help: "Imposta il messaggio di ingresso (NOTICE). Ometti il messaggio per rimuoverlo."
    updated: "\x0303✔\x03 Messaggio di ingresso aggiornato."
    too_long: "\x0304✗\x03 Il messaggio di ingresso non può superare i %max% caratteri."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canale> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canale TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canale TOPICLOCK OFF\x03\x0F"
    short: "Blocca il topic del canale."
    help: |-
      Impedisce di modificare il topic del canale. Quando si attiva, imposta quello
      attuale.
    on: "\x0303✔\x03 Blocco topic ora ON."
    off: "\x0303✔\x03 Blocco topic ora OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 attiva TOPICLOCK."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 disattiva TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canale> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canale MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canale MLOCK OFF\x03\x0F"
    short: "Blocca i modi del canale."
    help: |-
      Blocca i modi attuali del canale (es. +nt). Quando ON, i modi non possono essere
      modificati.
    no_modes: "nessun modo"
    on: "\x0303✔\x03 MLOCK ora ON (%modes%)."
    off: "\x0303✔\x03 MLOCK ora OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 attiva MLOCK (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 disattiva MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canale> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canale PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canale PRIVATE OFF\x03\x0F"
    short: "Nascondi le informazioni del canale agli utenti senza accesso."
    help: |-
      Quando è ON, solo il fondatore e gli utenti con accesso possono vedere le
      informazioni del canale.
    on: "\x0303✔\x03 Le informazioni del canale ora sono private."
    off: "\x0303✔\x03 Le informazioni del canale ora sono pubbliche."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canale> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canale SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canale SECURE OFF\x03\x0F"
    short: "Richiede la lista di accesso per i ranghi del canale."
    help: |-
      Impedisce di assegnare ruoli nel canale ai nickname non presenti nell'elenco
      di accesso.
    on: "\x0303✔\x03 SECURE ora ON."
    off: "\x0303✔\x03 SECURE ora OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 attiva la modalità SECURE."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 disattiva la modalità SECURE."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#canale> {ADD <nickname> <livello>|DEL <nickname>|LIST}"
  example: "%command_prefix%\x02\x0303ACCESS #canale LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #canale ADD Alice 100\x03\x0F"
    - "%command_prefix%\x02\x0303ACCESS #canale DEL Alice\x03\x0F"
  short: "Gestisce la lista di accesso."
  help: "Gestisce l'elenco di accesso del canale."
  unknown_sub: "\x0304✗\x03 Sotto-comando sconosciuto \x02%sub%\x02. Usi LIST, ADD o DEL."
  level_range: "\x0304✗\x03 Il livello di accesso deve essere tra %min% e %max%."
  cannot_manage_level: "\x0304✗\x03 Può gestire solo nick con livello strettamente inferiore al suo."
  founder_not_in_list: "\x0304✗\x03 Il fondatore non è nella lista di accesso."
  max_entries: "\x0304✗\x03 Massimo %max% voci di accesso per canale."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#canale> LIST"
    example: "%command_prefix%\x02\x0303ACCESS #canale LIST\x03\x0F"
    short: "Elenca la lista di accesso (richiede livello ACCESSLIST)."
    help: "Mostra nickname e livello per ogni voce."
    header: "\x0303Lista di accesso per \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Il canale \x02%channel%\x02 non ha voci di accesso."
    entry: "  #%index%: %nickname% (livello %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#canale> ADD <nickname> <livello>"
    example: "%command_prefix%\x02\x0303ACCESS #canale ADD Alice 100\x03\x0F"
    short: "Aggiunge o aggiorna il livello di accesso (richiede livello ACCESSCHANGE)."
    help: "Livello 1-499. Può impostare solo livelli inferiori al suo."
    done: "\x0303✔\x03 \x02%nickname%\x02 impostato al livello %level%."
    notice_channel: "\x0303✔\x03 \x0302%from%\x03 imposta \x0314%to%\x03 al livello \x0304%level%\x03"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#canale> DEL <nickname>"
    example: "%command_prefix%\x02\x0303ACCESS #canale DEL Alice\x03\x0F"
    short: "Rimuove dalla lista di accesso (richiede livello ACCESSCHANGE)."
    help: "Può rimuovere solo nick con livello inferiore al suo."
    not_in_list: "\x0304✗\x03 \x02%nickname%\x02 non è nella lista di accesso."
    done: "\x0303✔\x03 \x02%nickname%\x02 rimosso dalla lista di accesso."
    notice_channel: "\x0304✗\x03 \x0302%from%\x03 rimuove \x0314%to%\x03 dalla lista di accesso"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#canale>"
  example: "%command_prefix%\x02\x0303DELACCESS #canale\x03\x0F"
  short: "Rimuove il proprio accesso da un canale."
  help: |-
    Rimuove la tua voce dall'elenco di accesso del canale. Devi aver effettuato
    l'identificazione. Il fondatore non può usare questo comando.
  done: "\x0303✔\x03 Il suo accesso è stato rimosso da \x02%channel%\x02."
  not_in_list: "\x0304✗\x03 Non ha accesso in \x02%channel%\x02."
  founder_not_in_access: "\x0304✗\x03 Lei è il fondatore di \x02%channel%\x02 e non è nella lista di accesso."
  notice_channel: "\x0304✗\x03 \x0302%nickname%\x03 rimuove il proprio accesso dal canale"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#canale> {LIST|SET <livello> <valore>|RESET}"
  example: "%command_prefix%\x02\x0303LEVELS #canale LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #canale SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #canale RESET\x03\x0F"
  short: "Configura i livelli del canale."
  help: |-
    Configura i livelli minimi di accesso per le azioni del canale. Solo il
    fondatore può modificare o ripristinare i livelli.
  unknown_sub: "\x0304✗\x03 Sotto-comando sconosciuto \x02%sub%\x02. Usi LIST, SET o RESET."
  unknown_key: "\x0304✗\x03 Chiave di livello sconosciuta \x02%key%\x02 o non supportata da questo IRCd."
  value_range: "\x0304✗\x03 Il valore del livello deve essere tra %min% e %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#canale> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #canale LIST\x03\x0F"
    short: "Elenca i requisiti di livello."
    help: "Mostra ogni chiave di livello e il suo valore (predefiniti se non impostati)."
    header: "\x0303Livelli di %channel%\x03"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#canale> SET <livello> <valore>"
    example: "%command_prefix%\x02\x0303LEVELS #canale SET OPDEOP 50\x03\x0F"
    short: "Imposta un requisito di livello."
    help: "Valore da -1 a 499. Solo il fondatore."
    done: "\x0303✔\x03 \x02%key%\x02 impostato a %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#canale> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #canale RESET\x03\x0F"
    short: "Ripristina tutti i livelli ai valori predefiniti."
    help: "Rimuove tutte le personalizzazioni. Solo il fondatore."
    done: "\x0303✔\x03 Tutti i livelli ripristinati ai valori predefiniti."

# --- VOICE -----------------------------------------------------------------
voice:
  syntax: "VOICE <#canale> <nickname>"
  example: "%command_prefix%\x02\x0303VOICE #canale Alice\x03\x0F"
  short: "Assegna la modalità voice nel canale."
  help: "Assegna la modalità voice nel canale."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha ricevuto voice."
  user_not_on_channel: "\x0304✗\x03 Il nickname \x02%nickname%\x02 non è sulla rete."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 concede \x0304%mode%\x03 a \x0314%to%\x03"

# --- DEVOICE ---------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#canale> <nickname>"
  example: "%command_prefix%\x02\x0303DEVOICE #canale Alice\x03\x0F"
  short: "Rimuove la modalità voice nel canale."
  help: "Rimuove la modalità voice nel canale."
  done: "\x0303✔\x03 \x02%nickname%\x02 è stato devoicato."

# --- UNBAN -----------------------------------------------------------------
unban:
  syntax: "UNBAN <#channel>"
  example: "%command_prefix%\x02\x0303UNBAN #channel\x03\x0F"
  short: "Rimuovi i ban che ti riguardano."
  help: |-
    Rimuove tutti i ban ordinari del canale corrispondenti alla tua identità attuale, inclusi caratteri jolly e maschere IP/CIDR, secondo l’IRCd.
    Richiede identificazione e il livello UNBAN configurabile (predefinito 200). Il fondatore mantiene l’accesso; non occorre essere nel canale né esserne operatore.
    I ban estesi restano invariati. Non accetta nickname o maschere come argomento. L’azione non viene registrata nella HISTORY del canale.
  done: "Rimossi %count% ban che ti riguardano in %channel%."
  no_matches: "Nessun ban ordinario corrisponde alla tua identità in %channel%; nessuna modifica."
  unavailable: "Impossibile determinare i ban corrispondenti alla tua identità; nessuna modifica."
  not_on_network: "Il canale %channel% non è presente sulla rete."

# --- INVITE ----------------------------------------------------------------
invite:
  syntax: "INVITE <#canale>"
  example: "%command_prefix%\x02\x0303INVITE #canale\x03\x0F"
  short: "Si auto-invita nel canale."
  help: "Si auto-invita nel canale."
  done: "\x0303✔\x03 È stato invitato in \x02%channel%\x02."
  notice_channel: "\x0303✔\x03 \x0302%nickname%\x03 si auto-invita nel canale."

# --- ADMIN -----------------------------------------------------------------
admin:
  syntax: "ADMIN <#canale> <nickname>"
  example: "%command_prefix%\x02\x0303ADMIN #canale Alice\x03\x0F"
  short: "Assegna la modalità admin del canale."
  help: "Assegna la modalità admin del canale. Solo se l'IRCd supporta +a."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha ricevuto admin del canale."
  user_not_on_channel: "\x0304✗\x03 Il nickname \x02%nickname%\x02 non è sulla rete."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 concede \x0304%mode%\x03 a \x0314%to%\x03"
  not_supported: "\x0304✗\x03 Questa rete non supporta la modalità admin del canale (+a)."

# --- DEADMIN ---------------------------------------------------------------
deadmin:
  syntax: "DEADMIN <#canale> <nickname>"
  example: "%command_prefix%\x02\x0303DEADMIN #canale Alice\x03\x0F"
  short: "Rimuove la modalità admin del canale."
  help: "Rimuove la modalità admin del canale."
  done: "\x0303✔\x03 \x02%nickname%\x02 è stato deadminnato."

# --- HALFOP ----------------------------------------------------------------
halfop:
  syntax: "HALFOP <#canale> <nickname>"
  example: "%command_prefix%\x02\x0303HALFOP #canale Alice\x03\x0F"
  short: "Assegna la modalità semi-operatore nel canale."
  help: "Assegna la modalità semi-operatore nel canale. Solo se l'IRCd supporta +h."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha ricevuto halfop."
  user_not_on_channel: "\x0304✗\x03 Il nickname \x02%nickname%\x02 non è sulla rete."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 concede \x0304%mode%\x03 a \x0314%to%\x03"
  not_supported: "\x0304✗\x03 Questa rete non supporta la modalità halfop (+h)."

# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#canale> <nickname>"
  example: "%command_prefix%\x02\x0303DEHALFOP #canale Alice\x03\x0F"
  short: "Rimuove la modalità semi-operatore nel canale."
  help: "Rimuove la modalità semi-operatore nel canale."
  done: "\x0303✔\x03 \x02%nickname%\x02 è stato dehalfoppato."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#canale> {ADD <maschera> [scadenza] [motivo]|DEL {<maschera>|<numero>}|LIST}"
  example: "%command_prefix%\x02\x0303AKICK #canale ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #canale ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canale DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canale DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canale LIST\x03\x0F"
  short: "Gestisce la lista di auto-kick."
  help: "Gestisce le voci di auto-kick e la relativa scadenza facoltativa."
  unknown_sub: "\x0304✗\x03 Sotto-comando sconosciuto \x02%sub%\x02. Usi ADD, DEL o LIST."
  invalid_mask: "\x0304✗\x03 Formato maschera non valido. Usi \x02nick!ident@host\x02 con caratteri jolly (*)."
  dangerous_mask: "\x0304✗\x03 La maschera \x02%mask%\x02 è troppo ampia. Deve contenere almeno 4 caratteri alfanumerici."
  protected_user: "\x0304✗\x03 Il nickname \x02%nickname%\x02 ha accesso in questo canale."
  max_entries: "\x0304✗\x03 Massimo %max% voci AKICK per canale."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canale> ADD <maschera> [scadenza] [motivo]"
    example: "%command_prefix%\x02\x0303AKICK #canale ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canale ADD *!*@* 7d Spam\x03\x0F"
    short: "Aggiunge una voce AKICK."
    help: |-
      Aggiunge una maschera all'elenco di auto-kick del canale.

      Puoi indicare durata e motivo. Se specifichi un motivo, devi indicare anche la
      durata: 0 per permanente, d per giorni, h per ore o m per minuti.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 aggiunto."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 esiste già."
    notice_channel: "\x02%from%\x02 aggiunge AKICK: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canale> DEL {<maschera>|<numero>}"
    example: "%command_prefix%\x02\x0303AKICK #canale DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canale DEL 2\x03\x0F"
    short: "Rimuove una voce AKICK."
    help: "Rimuove per maschera esatta o numero voce da LIST."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 non trovato."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 rimosso."
    notice_channel: "\x02%from%\x02 rimuove AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canale> LIST"
    example: "%command_prefix%\x02\x0303AKICK #canale LIST\x03\x0F"
    short: "Elenca le voci AKICK."
    help: "Mostra maschera, motivo, scadenza e chi l'ha aggiunta."
    header: "\x0303Lista AKICK per \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Il canale \x02%channel%\x02 non ha voci AKICK."
    entry: "  #%index% %mask% %reason% (da %nickname%, scade: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#canale>"
  example: "%command_prefix%\x02\x0303RESTORE #canale\x03\x0F"
  short: "Ripristinare un canale in attesa di cancellazione."
  help: "Ripristina un canale eliminato manualmente ancora entro il periodo di grazia."
  success: "\x0303✔\x03 Il canale \x02%channel%\x02 è stato ripristinato."
  not_pending_deletion: "\x0304✗\x03 Il canale \x02%channel%\x02 non è in attesa di cancellazione."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#canale> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #canale\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP #canale FORCE\x03\x0F"
  short: "Elimina un canale registrato."
  help: |-
    Elimina un canale registrato dal database.
    FORCE elimina definitivamente un canale in attesa di eliminazione.
    Un IRCop con il permesso DROP può anche liberare subito
    richieste di registrazione pendenti e rifiutate, con o senza FORCE.
  registration_restricted: "\x0304✗\x03 Questa richiesta di registrazione è bloccata fino al %date%."
  force:
    short: "Elimina definitivamente un canale in attesa di eliminazione."
  success: "\x0303✔\x03 Il canale \x02%channel%\x02 è stato contrassegnato per l'eliminazione e può essere ripristinato durante il periodo di grazia."
  force_success: "\x0303✔\x03 Il canale \x02%channel%\x02 è stato eliminato definitivamente."
  pending_deletion: "\x0304✗\x03 Il canale \x02%channel%\x02 è già in attesa di cancellazione. Usa DROP <#canale> FORCE per eliminarlo definitivamente."
  invalid_channel: "\x0304✗\x03 Nome canale non valido. Usi \x02#canale\x02."
  pending_deletion_reason: "Il canale %channel% è in fase di eliminazione. Maggiori informazioni: /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canale> <durata> <motivo>"
  example: "%command_prefix%\x02\x0303SUSPEND #canale 7d Violazione delle regole\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND #canale 0 Violazione delle regole\x03\x0F"
  short: "Sospende un canale."
  help: |-
    Disattiva temporaneamente un canale registrato. Durate: 0 = permanente,
    1d, 12h, 60m.
    Durante la sospensione, le modalità, l'accesso e l'applicazione delle regole del
    canale sono disabilitati.
  success: "\x0303✔\x03 Il canale \x02%channel%\x02 è stato sospeso fino al \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 Il canale \x02%channel%\x02 è già sospeso."
  invalid_duration: "\x0304✗\x03 Durata non valida. Usi: 0 (permanente), 1d, 12h o 60m."
  channel_suspended: "\x0304✗\x03 Il canale \x02%channel%\x02 è sospeso e non può essere utilizzato."
  notice_channel: "\x0304⚠\x03 Il canale è stato sospeso. Motivo: %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#canale>"
  example: "%command_prefix%\x02\x0303UNSUSPEND #canale\x03\x0F"
  short: "Rimuove la sospensione di un canale."
  help: |-
    Riattiva un canale sospeso, ripristinandone le modalità e l'applicazione delle
    regole.
  success: "\x0303✔\x03 Il canale \x02%channel%\x02 non è più sospeso."
  not_suspended: "\x0304✗\x03 Il canale \x02%channel%\x02 non è sospeso."
  reason_expired: "sospensione scaduta"

# --- NOJOIN ----------------------------------------------------------------
nojoin:
  reason: "Restrizione livello NOJOIN"

# --- DEBUG CHANNEL ---------------------------------------------------------
debug_channel:
  kick_reason: "Non è autorizzato ad entrare in questo canale."

# --- IRCOPONLY -------------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#canale> {ON|OFF}"
  example: "%command_prefix%\x02\x0303IRCOPONLY #canale ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOPONLY #canale OFF\x03\x0F"
  short: "Limitare un canale agli operatori IRC."
  help: |-
    Solo gli operatori IRC autorizzati possono rimanere nel canale. %bot% applica
    questa restrizione.
  on: "IRCOPONLY attivato su %channel%."
  off: "IRCOPONLY disattivato su %channel%."

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#canale> {ON|OFF}"
  example: "%command_prefix%\x02\x0303NOEXPIRE #Importante ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE #Importante OFF\x03\x0F"
  short: "Imposta o rimuove la protezione dalla scadenza per un canale."
  help: |-
    Controlla se il canale scade per inattività.
    ON impedisce la scadenza; OFF applica le regole normali.
  success_on: "\x0303✔\x03 Il canale \x02%channel%\x02 è ora protetto dalla scadenza."
  success_off: "\x0303✔\x03 Il canale \x02%channel%\x02 ora scadrà normalmente."
  forbidden: "\x0304✗\x03 Il canale \x02%channel%\x02 è vietato."
  suspended: "\x0304✗\x03 Il canale \x02%channel%\x02 è sospeso."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <#canale> <motivo>"
  example: "%command_prefix%\x02\x0303FORBID #canale Violazione delle regole\x03\x0F"
  short: "Vieta l'uso di un canale."
  help: |-
    Vieta l'uso di un canale, espellendo tutti gli utenti e impedendo loro di
    rientrare. Se è registrato, la registrazione viene rimossa prima di applicare
    il divieto.
  reason_required: "\x0304✗\x03 Deve specificare un motivo."
  success: "\x0303✔\x03 Il canale \x02%channel%\x02 è stato vietato."
  updated: "\x0303✔\x03 Il motivo del divieto per il canale \x02%channel%\x02 è stato aggiornato."
  channel_forbidden: "\x0304✗\x03 Il canale \x02%channel%\x02 è vietato e non può essere utilizzato."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#canale>"
  example: "%command_prefix%\x02\x0303UNFORBID #canale\x03\x0F"
  short: "Rimuove il divieto da un canale."
  help: "Rimuove il divieto di un canale, consentendo di registrarlo nuovamente."
  success: "\x0303✔\x03 Il canale \x02%channel%\x02 non è più vietato."
  not_forbidden: "\x0304✗\x03 Il canale \x02%channel%\x02 non è vietato."

# --- DEBUG -----------------------------------------------------------------
debug:
  registration_completed: "%operator% ha registrato il canale %target%"
  registration_pending: "%operator% ha richiesto la registrazione del canale %target%"
  founder_action: "Azione livello-fondatore"

# --- HISTORY ---
history:
  syntax: "HISTORY <#canale> {ADD <messaggio>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  example: "%command_prefix%\x02\x0303HISTORY #canale ADD Revisione della moderazione\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HISTORY #canale DEL 42\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #canale VIEW\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #canale VIEW 2\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #canale VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY #canale CLEAR\x03\x0F"
  short: "Visualizza o gestisce la cronologia azioni del canale."
  help: "Gestisce la cronologia delle azioni del canale."

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#canale> ADD <messaggio>"
    example: "%command_prefix%\x02\x0303HISTORY #canale ADD Revisione della moderazione\x03\x0F"
    short: "Aggiunge una voce manuale alla cronologia."
    help: |-
      Aggiunge una voce manuale alla cronologia del canale.
    success: "\x0303✔\x03 Voce di cronologia aggiunta per \x02%channel%\x02."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#canale> DEL <id>"
    example: "%command_prefix%\x02\x0303HISTORY #canale DEL 42\x03\x0F"
    short: "Elimina una voce della cronologia."
    help: "Elimina una voce della cronologia tramite il suo ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#canale> VIEW [PAGINA|ALL]"
    example: "%command_prefix%\x02\x0303HISTORY #canale VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY #canale VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY #canale VIEW ALL\x03\x0F"
    short: "Visualizza la cronologia azioni del canale."
    help: "Mostra le voci della cronologia del canale."
    header: "\x02Cronologia per \x0307%channel%\x03\x02 (mostra %start%-%end% di %total%):"

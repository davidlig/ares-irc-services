# Traduzioni di ChanServ — Italiano
# Dominio: chanserv
#
# Codici di formattazione IRC (virgolette doppie o blocchi letterali !irc):
#   \x02        attiva/disattiva il grassetto
#   \x03NN      colore (DECIMALE: 03=verde, 04=rosso, 07=arancione, 14=grigio scuro)
#   \x03        ripristina il colore
#   \x0F        ripristina tutta la formattazione
#
# I colori IRC usano numeri DECIMALI (0-15), non esadecimali.
#   \x0314 = grigio scuro (14 decimale): CORRETTO
#   \x030F = colore 0 seguito dalla lettera F: ERRORE
#
# Testo IRC multilinea: !irc |- con interruzioni di riga e spazi reali.
# I blocchi senza tag non decodificano gli escape; preservare i letterali CTCP.
# Esempi HELP: example/examples e %command_prefix%.
# Il presentatore aggiunge /msg senza colore e un margine di due spazi.


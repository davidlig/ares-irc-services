  footer: ""

# --- ACCESS -------------------------------------------------------------------
access:
  syntax: "ACCESS <#canale> {ADD <nickname> <livello>|DEL <nickname>|LIST}"
  example: "%command_prefix%ACCESS #canale LIST"
  examples:
    - "%command_prefix%ACCESS #canale ADD Alice 100"
    - "%command_prefix%ACCESS #canale DEL Alice"
  short: "Gestisce la lista di accesso."
  help: "Gestisce l'elenco di accesso del canale."
  unknown_sub: "Sotto-comando sconosciuto %sub%. Usi LIST, ADD o DEL."
  level_range: "Il livello di accesso deve essere tra %min% e %max%."
  cannot_manage_level: "Può gestire solo nick con livello strettamente inferiore al suo."
  founder_not_in_list: "Il fondatore non è nella lista di accesso."
  max_entries: "Massimo %max% voci di accesso per canale."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#canale> LIST"
    example: "%command_prefix%ACCESS #canale LIST"
    short: "Elenca la lista di accesso (richiede livello ACCESSLIST)."
    help: "Mostra nickname e livello per ogni voce."
    header: "Lista di accesso per %channel%"
    empty: "Il canale %channel% non ha voci di accesso."
    entry: "#%index%: %nickname% (livello %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#canale> ADD <nickname> <livello>"
    example: "%command_prefix%ACCESS #canale ADD Alice 100"
    short: "Aggiunge o aggiorna il livello di accesso (richiede livello ACCESSCHANGE)."
    help: "Livello 1-499. Può impostare solo livelli inferiori al suo."
    done: "%nickname% impostato al livello %level%."
    notice_channel: "%from% imposta %to% al livello %level%"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#canale> DEL <nickname>"
    example: "%command_prefix%ACCESS #canale DEL Alice"
    short: "Rimuove dalla lista di accesso (richiede livello ACCESSCHANGE)."
    help: "Può rimuovere solo nick con livello inferiore al suo."
    not_in_list: "%nickname% non è nella lista di accesso."
    done: "%nickname% rimosso dalla lista di accesso."
    notice_channel: "%from% rimuove %to% dalla lista di accesso"

# --- DELACCESS ----------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#canale>"
  example: "%command_prefix%DELACCESS #canale"
  short: "Rimuove il proprio accesso da un canale."
  help: |-
    Rimuove la tua voce dall'elenco di accesso del canale. Devi aver effettuato
    l'identificazione. Il fondatore non può usare questo comando.
  done: "Il suo accesso è stato rimosso da %channel%."
  not_in_list: "Non ha accesso in %channel%."
  founder_not_in_access: "Lei è il fondatore di %channel% e non è nella lista di accesso."
  notice_channel: "%nickname% rimuove il proprio accesso dal canale"

# --- AKICK --------------------------------------------------------------------
akick:
  syntax: "AKICK <#canale> {ADD <maschera> [scadenza] [motivo]|DEL {<maschera>|<numero>}|LIST}"
  example: "%command_prefix%AKICK #canale ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #canale ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #canale DEL *!*@*"
    - "%command_prefix%AKICK #canale DEL 2"
    - "%command_prefix%AKICK #canale LIST"
  short: "Gestisce la lista di auto-kick."
  help: "Gestisce le voci di auto-kick e la relativa scadenza facoltativa."
  unknown_sub: "Sotto-comando sconosciuto %sub%. Usi ADD, DEL o LIST."
  invalid_mask: "Formato maschera non valido. Usi nick!ident@host con caratteri jolly (*)."
  dangerous_mask: "La maschera %mask% è troppo ampia. Deve contenere almeno 4 caratteri alfanumerici."
  protected_user: "Il nickname %nickname% ha accesso in questo canale."
  max_entries: "Massimo %max% voci AKICK per canale."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canale> ADD <maschera> [scadenza] [motivo]"
    example: "%command_prefix%AKICK #canale ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #canale ADD *!*@* 7d Spam"
    short: "Aggiunge una voce AKICK."
    help: |-
      Aggiunge una maschera all'elenco di auto-kick del canale.

      Puoi indicare durata e motivo. Se specifichi un motivo, devi indicare anche la
      durata: 0 per permanente, d per giorni, h per ore o m per minuti.
    done: "AKICK %mask% aggiunto."
    already_exists: "AKICK %mask% esiste già."
    notice_channel: "%from% aggiunge AKICK: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canale> DEL {<maschera>|<numero>}"
    example: "%command_prefix%AKICK #canale DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #canale DEL 2"
    short: "Rimuove una voce AKICK."
    help: "Rimuove per maschera esatta o numero voce da LIST."
    not_found: "AKICK %mask% non trovato."
    done: "AKICK %mask% rimosso."
    notice_channel: "%from% rimuove AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canale> LIST"
    example: "%command_prefix%AKICK #canale LIST"
    short: "Elenca le voci AKICK."
    help: "Mostra maschera, motivo, scadenza e chi l'ha aggiunta."
    header: "Lista AKICK per %channel%"
    empty: "Il canale %channel% non ha voci AKICK."
    entry: "#%index% %mask% %reason% (da %nickname%, scade: %expiration%)"

# --- LEVELS -------------------------------------------------------------------
levels:
  syntax: "LEVELS <#canale> {LIST|SET <livello> <valore>|RESET}"
  example: "%command_prefix%LEVELS #canale LIST"
  examples:
    - "%command_prefix%LEVELS #canale SET OPDEOP 50"
    - "%command_prefix%LEVELS #canale RESET"
  short: "Configura i livelli del canale."
  help: |-
    Configura i livelli minimi di accesso per le azioni del canale. Solo il
    fondatore può modificare o ripristinare i livelli.
  unknown_sub: "Sotto-comando sconosciuto %sub%. Usi LIST, SET o RESET."
  unknown_key: "Chiave di livello sconosciuta %key% o non supportata da questo IRCd."
  value_range: "Il valore del livello deve essere tra %min% e %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#canale> LIST"
    example: "%command_prefix%LEVELS #canale LIST"
    short: "Elenca i requisiti di livello."
    help: "Mostra ogni chiave di livello e il suo valore (predefiniti se non impostati)."
    header: "Livelli di %channel%"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#canale> SET <livello> <valore>"
    example: "%command_prefix%LEVELS #canale SET OPDEOP 50"
    short: "Imposta un requisito di livello."
    help: "Valore da -1 a 499. Solo il fondatore."
    done: "%key% impostato a %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#canale> RESET"
    example: "%command_prefix%LEVELS #canale RESET"
    short: "Ripristina tutti i livelli ai valori predefiniti."
    help: "Rimuove tutte le personalizzazioni. Solo il fondatore."
    done: "Tutti i livelli ripristinati ai valori predefiniti."


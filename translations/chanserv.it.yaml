# Traduzioni di ChanServ — Italiano
# Dominio: chanserv
#
# Codici di formattazione IRC (virgolette doppie o blocchi letterali !irc):
#   \x02        attiva/disattiva il grassetto
#   \x03NN      colore (DECIMALE: 03=verde, 04=rosso, 07=arancione, 14=grigio scuro)
#   \x03        ripristina il colore
#   \x0F        ripristina tutta la formattazione
#
# I colori IRC usano numeri DECIMALI (0-15), non esadecimali.
#   \x0314 = grigio scuro (14 decimale): CORRETTO
#   \x030F = colore 0 seguito dalla lettera F: ERRORE
#
# Testo IRC multilinea: !irc |- con interruzioni di riga e spazi reali.
# I blocchi senza tag non decodificano gli escape; preservare i letterali CTCP.
# Esempi HELP: example/examples e %command_prefix%.
# Il presentatore aggiunge /msg senza colore e un margine di due spazi.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Nome canale non valido. Usi \x02#canale\x02."
  generic: "\x0304✗\x03 Si è verificato un errore. Riprovi."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#canale> <descrizione>"
  example: "%command_prefix%\x02\x0303REGISTER #canale Progetto comunitario\x03\x0F"
  short: "Registra un canale."
  help: |-
    Registra e associa un canale al tuo nickname. Devi identificarti con
    %nickserv%.
    In modalità APPROVAL, un IRCop deve approvare la richiesta.
  success: "\x0303✔\x03 Il canale \x02%channel%\x02 è stato registrato."
  already_registered: "\x0304✗\x03 Il canale \x02%channel%\x02 è già registrato o ha una richiesta di registrazione in corso."
  channel_not_on_network: "\x0304✗\x03 Il canale \x02%channel%\x02 non esiste sulla rete."
  pending_deletion: "\x0304✗\x03 Il canale \x02%channel%\x02 è in attesa di cancellazione e non può essere registrato."
  insufficient_channel_rank: "\x0304✗\x03 Devi avere almeno lo stato di operatore su \x02%channel%\x02 per registrarlo."
  limit_exceeded: "\x0304✗\x03 Ha raggiunto il massimo di %max% canali registrati."
  throttled: "\x0304✗\x03 Deve attendere \x02%minutes%\x02 minuto/i prima di registrare un altro canale."

  awaiting_approval: "\x0307✔\x03 La richiesta di registrazione per \x02%channel%\x02 attende l’approvazione di un IRCop."
  restricted_indefinite: "\x0304✗\x03 Le nuove richieste per \x02%channel%\x02 sono bloccate a tempo indeterminato."
  restricted_until: "\x0304✗\x03 Le nuove richieste per \x02%channel%\x02 sono bloccate fino al %date%"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%\x02\x0303REGMODE APPROVAL\x03\x0F"
  short: "Imposta o controlla la modalità di registrazione dei canali."
  help: |-
    Imposta la registrazione su DIRECT o APPROVAL, oppure controlla STATUS.
    DIRECT è la modalità predefinita e mantiene la registrazione immediata.

  status: "\x0307ℹ\x03 La modalità di registrazione dei canali è \x02%mode%\x02."
  changed: "\x0303✔\x03 La modalità di registrazione dei canali è ora \x02%mode%\x02."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [pagina]|ACCEPT <#canale>|REJECT <#canale> <motivo>}"
  pending.syntax: "CREG PENDING [pagina]"
  pending.example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  pending.short: "Elenca le richieste di registrazione in attesa."
  pending.help: "Elenca le richieste in attesa in una pagina limitata."
  accept.syntax: "CREG ACCEPT <#canale>"
  accept.example: "%command_prefix%\x02\x0303CREG ACCEPT #canal\x03\x0F"
  accept.short: "Approva una richiesta di registrazione del canale."
  accept.help: "Verifica nuovamente il richiedente e attiva la registrazione in attesa."
  reject.syntax: "CREG REJECT <#canale> <motivo>"
  reject.example: "%command_prefix%\x02\x0303CREG REJECT #canal Motivo público\x03\x0F"
  reject.short: "Rifiuta una richiesta di registrazione del canale."
  reject.help: "Rifiuta la richiesta con un motivo obbligatorio e un blocco."
  example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  short: "Esamina le richieste di registrazione dei canali."
  help: |-
    Elenca le richieste in attesa oppure approva o rifiuta una richiesta.
    I rifiuti richiedono un motivo. Solo ACCEPT registra il canale.

  pending_header: "\x0314Registrazioni in attesa (pagina %page%)\x03"
  pending_item: "  %channel% — richiedente %requester%, inviata %submitted%: %description%"
  accepted: "\x0303✔\x03 La registrazione di \x02%channel%\x02 è stata approvata."
  rejected: "\x0303✔\x03 La registrazione di \x02%channel%\x02 è stata rifiutata."
  not_pending: "\x0304✗\x03 Il canale \x02%channel%\x02 non ha registrazioni in attesa."
  channel_not_on_network: "\x0304✗\x03 Il canale \x02%channel%\x02 non è in rete."
  founder_limit: "\x0304✗\x03 Il richiedente ha raggiunto il limite di registrazioni dei canali."
  requester_inactive: "\x0304✗\x03 L’account del richiedente non è più attivo."
  requester_ineligible: "\x0304✗\x03 Il richiedente deve avere attualmente lo stato di operatore nel canale."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <#canale>"
  example: "%command_prefix%\x02\x0303STATUS #canal\x03\x0F"
  header: "\x02Stato del canale \x0307%channel%\x03\x02"
  short: "Mostra lo stato di registrazione del canale."
  help: |-
    Mostra se il canale non è registrato, attende approvazione, è stato
    rifiutato o è registrato.
    I dettagli del rifiuto sono visibili solo al richiedente e agli IRCop
    autorizzati.

  unregistered: "  \x0314Stato                   \x03: Non registrato"
  pending: "  \x0314Stato                   \x03: \x0307In attesa di approvazione\x03"
  registered: "  \x0314Stato                   \x03: \x0303Registrato\x03"
  suspended: "  \x0314Stato                   \x03: \x0304Sospeso\x03"
  forbidden: "  \x0314Stato                   \x03: \x0304Vietato\x03"
  pending_deletion: "  \x0314Stato                   \x03: \x0307In attesa di eliminazione\x03"
  rejected_private: "  \x0314Stato                   \x03: \x0304Registrazione rifiutata\x03"
  rejected: "  \x0314Stato                   \x03: \x0304Registrazione rifiutata\x03"
  rejection_reason: "  \x0314Motivo                  \x03: %reason%"
  rejection_audit: "  \x0314Rifiutato da            \x03: %operator% il %date%"
  restriction_until: "  \x0314Disponibile dal         \x03: %date%"
  footer: "\x0314─────────────────────────────\x03\x0F"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#canale>"
  example: "%command_prefix%\x02\x0303INFO #canale\x03\x0F"
  short: "Mostra le informazioni del canale."
  help: |-
    Mostra le informazioni dettagliate di un canale registrato, inclusi
    proprietario,
    dati di registrazione, attività recente e opzioni di configurazione.
  header: "\x02Informazioni per il canale \x0307%channel%\x03\x02"
  founder: "  \x0314Fondatore\x03           : \x02%nickname%\x02"
  registered: "  \x0314Registrato\x03          : %date%"
  successor: "  \x0314Successore\x03          : \x02%nickname%\x02"
  description: "  \x0314Descrizione\x03         : %desc%"
  url: "  \x0314URL\x03                 : %url%"
  email: "  \x0314Email\x03               : %email%"
  last_used: "  \x0314Ultimo uso\x03          : %date%"
  topic: "  \x0314Ultimo topic\x03        : %topic%"
  topic_set_by: "  \x0314Topic impostato da\x03  : %nickname%"
  options: "  \x0314Opzioni\x03             : %options%"
  private: "\x0304✗\x03 Le informazioni del canale \x02%channel%\x02 sono private."
  no_expire: "  \x0314Mai in scadenza\x03     : Sì"
  mlock_modes: "  \x0314Blocco modi\x03         : %modes%"
  suspended_status: "  \x0314Stato\x03               : \x0304Sospeso\x03"
  suspended_reason: "  \x0314Motivo\x03              : %reason%"
  suspended_until: "  \x0314Termina il\x03          : %date%"
  suspended_permanent: "  \x0314Termina il\x03          : Permanente"
  forbidden_status: "  \x0314Stato\x03               : \x0304Vietato\x03"
  forbidden_reason: "  \x0314Motivo\x03              : %reason%"
  pending_deletion_status: "  \x0314Stato\x03              : \x0307In attesa di eliminazione\x03"
  pending_deletion_at: "  \x0314Eliminato\x03          : %date%"
  pending_deletion_until: "  \x0314Elim. definitiva\x03   : %date%"
  pending_deletion_notice: "  \x0307Questo canale è congelato e non può essere registrato.\x03"

# --- HELP ------------------------------------------------------------------
help:

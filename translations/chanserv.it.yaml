  short: "Rimuove la modalità semi-operatore nel canale."
  help: "Rimuove la modalità semi-operatore nel canale."
  done: "%nickname% è stato dehalfoppato."

# --- VOICE --------------------------------------------------------------------
voice:
  syntax: "VOICE <#canale> <nickname>"
  example: "%command_prefix%VOICE #canale Alice"
  short: "Assegna la modalità voice nel canale."
  help: "Assegna la modalità voice nel canale."

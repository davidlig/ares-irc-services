  registered_value: "Registrato"
  suspended: "%label%%padding%: %state%"
  suspended_label: "Stato"
  suspended_value: "Sospeso"
  forbidden: "%label%%padding%: %state%"
  forbidden_label: "Stato"
  forbidden_value: "Vietato"
  pending_deletion: "%label%%padding%: %state%"
  pending_deletion_label: "Stato"
  pending_deletion_value: "In attesa di eliminazione"
  rejected_private: "%label%%padding%: %state%"
  rejected_private_label: "Stato"
  rejected_private_value: "Registrazione rifiutata"
  rejected: "%label%%padding%: %state%"
  rejected_label: "Stato"

  syntax: "HELP [comando] [opzione]"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
  short: "Elenca i comandi o mostra l'aiuto per un comando."
  help: "Mostra i comandi disponibili e l'aiuto dettagliato delle relative opzioni."
  header_title: "%bot%"

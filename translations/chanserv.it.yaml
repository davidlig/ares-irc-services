  ircop_header: "Comandi disponibili per gli IRCop:"

# --- CLEARUSERS (IRCop) -------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#canale> [motivo]"
  example: "%command_prefix%CLEARUSERS #canale"
  examples:
    - "%command_prefix%CLEARUSERS #canale flooding"
  short: "Espelle tutti gli utenti da un canale."
  help: |-
    Espelle tutti gli utenti dal canale. È un comando riservato agli IRCop; se non
    si indica un motivo, ne viene usato uno predefinito.
  not_on_network: "Il canale %channel% non è attualmente sulla rete."
  empty: "Il canale %channel% non ha utenti da espellere."
  success: "Espulsi %count% utente/i da %channel%."
  default_reason: "Comando CLEARUSERS"

# --- CLEARACCESS (IRCop) ------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#canale>"
  example: "%command_prefix%CLEARACCESS #canale"
  short: "Svuota l'intera lista di accesso di un canale."
  help: "Elimina tutte le voci di accesso del canale. L'azione è irreversibile."
  success: "Eliminate %count% voci di accesso da %channel%."
  empty: "Il canale %channel% non ha voci di accesso."

# --- IRCOPONLY (IRCop) --------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#canale> {ON|OFF}"
  example: "%command_prefix%IRCOPONLY #canale ON"
  examples:
    - "%command_prefix%IRCOPONLY #canale OFF"
  short: "Limitare un canale agli operatori IRC."
  help: |-
    Solo gli operatori IRC autorizzati possono rimanere nel canale. %bot% applica
    questa restrizione.
  on: "IRCOPONLY attivato su %channel%."
  off: "IRCOPONLY disattivato su %channel%."

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <#canale> <nickname> <descrizione>"
  short: "Registra amministrativamente un canale."
  help: |-
    Sintassi: SAREGISTER <#canale> <nickname> <descrizione>

    Registra administrativamente un canale immediatamente per il nickname
    specificato come fondatore senza richiedere presenza, verifica o limiti di frequenza.
  example: "%command_prefix%SAREGISTER #canale Alice Canale comunitario"
  success: "Il canale %channel% è stato registrato per %founder%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#canale> {ON|OFF}"
  example: "%command_prefix%NOEXPIRE #Importante ON"
  examples:
    - "%command_prefix%NOEXPIRE #Importante OFF"
  short: "Imposta o rimuove la protezione dalla scadenza per un canale."
  help: |-
    Controlla se il canale scade per inattività.
    ON impedisce la scadenza; OFF applica le regole normali.
  success_on: "Il canale %channel% è ora protetto dalla scadenza."
  success_off: "Il canale %channel% ora scadrà normalmente."
  forbidden: "Il canale %channel% è vietato."
  suspended: "Il canale %channel% è sospeso."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <#canale> [FORCE]"
  example: "%command_prefix%DROP #canale"
  examples:
    - "%command_prefix%DROP #canale FORCE"
  short: "Elimina un canale registrato."
  help: |-
    Elimina un canale registrato dal database.
    FORCE elimina definitivamente un canale in attesa di eliminazione.
    Un IRCop con il permesso DROP può anche liberare subito
    richieste di registrazione pendenti e rifiutate, con o senza FORCE.
  registration_restricted: "Questa richiesta di registrazione è bloccata fino al %date%."
  force:
    short: "Elimina definitivamente un canale in attesa di eliminazione."
  success: "Il canale %channel% è stato contrassegnato per l'eliminazione e può essere ripristinato durante il periodo di grazia."
  force_success: "Il canale %channel% è stato eliminato definitivamente."
  pending_deletion: "Il canale %channel% è già in attesa di cancellazione. Usa DROP <#canale> FORCE per eliminarlo definitivamente."
  invalid_channel: "Nome canale non valido. Usi %example%."
  pending_deletion_reason: "Il canale %channel% è in fase di eliminazione. Maggiori informazioni: /msg %bot% \x0303INFO %channel%\x03"

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <#canale>"
  example: "%command_prefix%RESTORE #canale"
  short: "Ripristinare un canale in attesa di cancellazione."
  help: "Ripristina un canale eliminato manualmente ancora entro il periodo di grazia."
  success: "Il canale %channel% è stato ripristinato."
  not_pending_deletion: "Il canale %channel% non è in attesa di cancellazione."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canale> <durata> <motivo>"
  example: "%command_prefix%SUSPEND #canale 7d Violazione delle regole"
  examples:
    - "%command_prefix%SUSPEND #canale 0 Violazione delle regole"
  short: "Sospende un canale."
  help: |-
    Disattiva temporaneamente un canale registrato. Durate: 0 = permanente,
    1d, 12h, 60m.
    Durante la sospensione, le modalità, l'accesso e l'applicazione delle regole del
    canale sono disabilitati.
  success: "Il canale %channel% è stato sospeso fino al %duration%."
  already_suspended: "Il canale %channel% è già sospeso."
  invalid_duration: "Durata non valida. Usi: 0 (permanente), 1d, 12h o 60m."
  channel_suspended: "Il canale %channel% è sospeso e non può essere utilizzato."
  notice_channel: "Il canale è stato sospeso. Motivo: %reason%"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#canale>"
  example: "%command_prefix%UNSUSPEND #canale"
  short: "Rimuove la sospensione di un canale."
  help: |-
    Riattiva un canale sospeso, ripristinandone le modalità e l'applicazione delle
    regole.
  success: "Il canale %channel% non è più sospeso."
  not_suspended: "Il canale %channel% non è sospeso."
  reason_expired: "sospensione scaduta"

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <#canale> <motivo>"
  example: "%command_prefix%FORBID #canale Violazione delle regole"
  short: "Vieta l'uso di un canale."
  help: |-
    Vieta l'uso di un canale, espellendo tutti gli utenti e impedendo loro di
    rientrare. Se è registrato, la registrazione viene rimossa prima di applicare
    il divieto.
  reason_required: "Deve specificare un motivo."
  success: "Il canale %channel% è stato vietato."
  updated: "Il motivo del divieto per il canale %channel% è stato aggiornato."
  channel_forbidden: "Il canale %channel% è vietato e non può essere utilizzato."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#canale>"
  example: "%command_prefix%UNFORBID #canale"
  short: "Rimuove il divieto da un canale."
  help: "Rimuove il divieto di un canale, consentendo di registrarlo nuovamente."
  success: "Il canale %channel% non è più vietato."
  not_forbidden: "Il canale %channel% non è vietato."

# --- HISTORY ---
history:
  syntax: "HISTORY <#canale> {ADD <messaggio>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  example: "%command_prefix%HISTORY #canale ADD Revisione della moderazione"
  examples:
    - "%command_prefix%HISTORY #canale DEL 42"
    - "%command_prefix%HISTORY #canale VIEW"
    - "%command_prefix%HISTORY #canale VIEW 2"
    - "%command_prefix%HISTORY #canale VIEW ALL"
    - "%command_prefix%HISTORY #canale CLEAR"
  short: "Visualizza o gestisce la cronologia azioni del canale."
  help: "Gestisce la cronologia delle azioni del canale."

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#canale> ADD <messaggio>"
    example: "%command_prefix%HISTORY #canale ADD Revisione della moderazione"
    short: "Aggiunge una voce manuale alla cronologia."
    help: |-
      Aggiunge una voce manuale alla cronologia del canale.
    success: "Voce di cronologia aggiunta per %channel%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#canale> DEL <id>"
    example: "%command_prefix%HISTORY #canale DEL 42"
    short: "Elimina una voce della cronologia."
    help: "Elimina una voce della cronologia tramite il suo ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#canale> VIEW [PAGINA|ALL]"
    example: "%command_prefix%HISTORY #canale VIEW"
    examples:
      - "%command_prefix%HISTORY #canale VIEW 2"
      - "%command_prefix%HISTORY #canale VIEW ALL"
    short: "Visualizza la cronologia azioni del canale."
    help: "Mostra le voci della cronologia del canale."
    header: "%heading% (mostra %start%-%end% di %total%):"
    header_heading: "Cronologia per %channel%"
    entry: "#%id% [%date%] %action% di %operator% — %message%"
    no_entries: "Nessuna voce di cronologia trovata per %channel%."
    page_hint: "Usi %command% per altre voci."
    page_hint_command: "HISTORY %channel% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#canale> CLEAR"
    example: "%command_prefix%HISTORY #canale CLEAR"
    short: "Elimina tutte le voci di cronologia per un canale."
    help: "Elimina tutte le voci della cronologia del canale."
    success: "Eliminate %count% voci di cronologia per %channel%."


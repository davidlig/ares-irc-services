help:
  syntax: "HELP [comando]"
  short: "Mostra l'aiuto per i comandi %nickserv%."
  help: |-
    Mostra l'aiuto generale di %nickserv% o informazioni dettagliate
    per un comando specifico.
  examples_header: "Esempi:"
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP SET"
    - "%command_prefix%HELP SET EMAIL"
    - "%command_prefix%HELP SET TIMEZONE Europe"
  header_title: "%bot%"
  header: "%title%"
  navigation_marker: ""
  info_marker: ""
  error_marker: ""
  warning_marker: ""
  intro: |-
    Permette di registrare e proteggere il tuo nickname, impedendo ad altri utenti
    di usarlo. Gestisce la sicurezza dell'account, personalizza le preferenze e
    consente di recuperare l'accesso quando serve.
  intro_expiration: "%label%: I nickname non utilizzati per più di %duration% vengono rimossi automaticamente."
  intro_expiration_duration: "%days% giorni"
  intro_expiration_label: "NOTA"
  general_header: "Comandi disponibili:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opzioni:"
  general_syntax: "HELP <comando>"
  general_footer: "Usa /msg %bot% %syntax% per maggiori informazioni."
  set_sub_syntax: "HELP %command% <opzione>"
  set_sub_footer: "Usa /msg %bot% %syntax% per maggiori informazioni."
  syntax_label: "Sintassi: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    registration_auth: "Registrazione e autenticazione"
    account_security: "Account e sicurezza"
  ircop_group:
    lookup: "Ricerca e indagine"
    account_management: "Gestione account"
    suspensions_bans: "Sospensioni e divieti"
    deletion: "Eliminazione e ripristino"
  ircop_header: "Comandi disponibili per gli IRCop:"
  set_timezone:
    index_label: "Fusi orari per regione (usa %syntax% per consultare una regione):"
    index_syntax: "HELP SET TIMEZONE <regione>"
    region_header: "Fusi orari per %region%:"
    region_unknown: "Regione sconosciuta. Usi %syntax% per l'indice."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "Il nick %nickname% è registrato. Sarà rinominato se non si identifica."
  renamed_to: |-
    Sei stato rinominato in %guest_nick%. Per recuperare il tuo nickname:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <password>"
  nick_forbidden: "Il nickname %nickname% è vietato: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Ottiene l'indirizzo IP reale e l'hostname del nickname."
  help: |-
    Mostra l'indirizzo IP e il nome host reali di un nickname.
    Usalo con responsabilità: è un'informazione sensibile.
  example: "%command_prefix%USERIP Utente"
  result: "Nickname: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Trova i nickname in base all'IP dell'ultima connessione identificata."
  help: |-
    Mostra i nickname registrati la cui ultima connessione identificata ha
    usato questo indirizzo IP. L'indirizzo salvato potrebbe essere obsoleto.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Nessun nickname registrato corrisponde a questo indirizzo IP."
  header: "Nickname corrispondenti:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <durata> <motivo>"
  short: "Sospende un nickname."
  help: |-
    Impedisce al proprietario di identificarsi. La durata può essere espressa in
    giorni (d), ore (h), minuti (m) o 0 per una sospensione permanente. Non è
    possibile sospendere Operatori IRC o utenti Root.
  example: "%command_prefix%SUSPEND UtenteScorretto 7d Spam en #aiuto"
  examples:
    - "%command_prefix%SUSPEND Molesto 0 Elusione del ban"
  success: "Il nickname %nickname% è stato sospeso fino al %duration%."
  already_suspended: "Il nickname %nickname% è già sospeso."
  forbidden: "Il nickname %nickname% è vietato e non può essere sospeso."
  cannot_suspend_oper: "Impossibile sospendere l'IRC operator %nickname%."
  cannot_suspend_root: "Impossibile sospendere l'utente root %nickname%."
  cannot_suspend_service: "Impossibile sospendere il nickname di servizio %nickname%."
  invalid_duration: "Durata non valida. Usi: %duration_format% (es., 7d, 12h, 30m) o %permanent% per permanente."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Rimuove la sospensione da un nickname."
  help: |-
    Rimuove una sospensione attiva affinché il proprietario possa identificarsi di
    nuovo.
  example: "%command_prefix%UNSUSPEND Utente"
  success: "La sospensione è stata revocata da %nickname%."
  not_suspended: "Il nickname %nickname% non è sospeso."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Forza il rename di un nickname connesso a un nickname casuale."
  help: |-
    Costringe un nickname connesso a cambiare in un nome casuale con un prefisso
    definito dalla rete.
  example: "%command_prefix%RENAME Molesto"
  cannot_rename_root: "Impossibile rinominare l'utente root %nickname%."
  cannot_rename_oper: "Impossibile rinominare l'IRC operator %nickname%."
  cannot_rename_service: "Impossibile rinominare il nickname di servizio %nickname%."
  success: "Il nickname %nickname% è stato rinominato in %new_nick%."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Elimina un nickname registrato."
  help: |-
    Contrassegna un nickname registrato per l'eliminazione durante il periodo di
    grazia; può essere ripristinato con RESTORE. Aggiungi FORCE per eliminarlo
    definitivamente. Non si possono eliminare utenti Root, IRCop o servizi, né il
    tuo nickname.
  force:
    short: "Elimina definitivamente un nickname in attesa di eliminazione."
  example: "%command_prefix%DROP AccountVecchio"
  examples:
    - "%command_prefix%DROP AccountVecchio FORCE"
  suspended: "Il nickname %nickname% è sospeso. Lo riattivi prima."
  forbidden: "Il nickname %nickname% è vietato."
  cannot_drop_root: "Impossibile eliminare l'utente root %nickname%."
  cannot_drop_oper: "Impossibile eliminare l'IRC operator %nickname%."
  cannot_drop_self: "Non può eliminare il proprio nickname."
  success: "Il nickname %nickname% è stato contrassegnato per la cancellazione e può essere ripristinato durante il periodo di grazia."
  force_success: "Il nickname %nickname% è stato eliminato definitivamente."
  pending_deletion: "Il nickname %nickname% è già in attesa di cancellazione. Usa DROP <nickname> FORCE per eliminarlo definitivamente."
  cannot_drop_service: "Impossibile eliminare il nickname di servizio %nickname%."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Ripristinare un nickname in attesa di cancellazione."
  help: |-
    Ripristina un nickname in attesa di eliminazione se è ancora nel periodo di
    grazia.
  example: "%command_prefix%RESTORE AccountVecchio"
  success: "Il nickname %nickname% è stato ripristinato."
  not_pending_deletion: "Il nickname %nickname% non è in attesa di cancellazione."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <motivo>"
  short: "Blocca permanentemente l'uso di un nickname."
  help: |-
    Vieta definitivamente un nickname, impedendo a chiunque di registrarlo o usarlo.
    Se è registrato viene eliminato; se è connesso, viene costretto a cambiare in un
    nickname casuale. Non si possono vietare utenti Root, IRCop o servizi.
  example: "%command_prefix%FORBID UtenteScorretto Violaciones repetidas de política"
  success: "Il nickname %nickname% è stato vietato."
  updated: "Il motivo del divieto per %nickname% è stato aggiornato."
  reason_required: "Deve fornire un motivo per il divieto."
  cannot_forbid_root: "Impossibile vietare l'utente root %nickname%."
  cannot_forbid_oper: "Impossibile vietare l'IRC operator %nickname%."
  cannot_forbid_service: "Impossibile vietare il nickname di servizio %nickname%."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Rimuove il divieto da un nickname."
  help: "Rimuove il divieto affinché il nickname possa essere usato di nuovo."
  example: "%command_prefix%UNFORBID NicknameVietato"
  success: "Il nickname %nickname% non è più vietato."
  not_forbidden: "Il nickname %nickname% non è vietato."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <pattern>|DEL <pattern>|LIST}"
  short: "Gestisce i pattern vhost vietati."
  help: |-
    Gestisce i modelli che impediscono di impostare vhost corrispondenti con SET
    VHOST. Il carattere jolly * corrisponde a qualsiasi sequenza e ? a un carattere.
    Richiede privilegi di Operatore IRC.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Sotto-comando sconosciuto %sub%. Usi ADD, DEL o LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <pattern>"
    short: "Aggiunge un pattern vhost vietato."
    help: |-
      Aggiunge un modello all'elenco. Gli utenti non potranno impostare vhost
      corrispondenti tramite SET VHOST. * corrisponde a qualsiasi sequenza e ? a un
      carattere.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Pattern vhost vietato aggiunto: %pattern%"
    already_exists: "Il pattern %pattern% esiste già."
    invalid: "Formato pattern vhost non valido."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <pattern>"
    short: "Rimuove un pattern vhost vietato."
    help: "Rimuove un modello dall'elenco dei vhost vietati."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Pattern vhost vietato rimosso: %pattern%"
    not_found: "Pattern %pattern% non trovato."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Elenca tutti i pattern vhost vietati."
    syntax: "FORBIDVHOST LIST"
    help: "Mostra tutti i modelli di vhost vietati."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Pattern vhost vietati (%count%):"
    entry: "%index%. %pattern% — da %nickname% (%date%)"
    empty: "Nessun pattern vhost vietato."

# --- HISTORY ---
history:
  syntax: "HISTORY <nickname> {ADD <messaggio>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Visualizza o gestisce la cronologia azioni del nickname."
  help: |-
    Consulta e gestisce la cronologia delle azioni di un nickname. Registra
    automaticamente sospensioni, modifiche di password o email e recuperi.
    VIEW mostra tre voci per pagina; ALL mostra l'intera cronologia.
  example: "%command_prefix%HISTORY Utente VIEW"
  examples:
    - "%command_prefix%HISTORY Utente VIEW ALL"
    - "%command_prefix%HISTORY Utente ADD Nota manual"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <messaggio>"
    short: "Aggiunge una voce manuale alla cronologia."
    help: "Aggiunge una voce manuale alla cronologia del nickname."
    example: "%command_prefix%HISTORY Utente ADD Reportado por spam"
    success: "Voce di cronologia aggiunta per %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "Elimina una voce di cronologia per ID."
    help: "Elimina una voce specifica dalla cronologia tramite il suo ID."
    example: "%command_prefix%HISTORY Utente DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [PAGINA|ALL]"
    short: "Visualizza la cronologia azioni del nickname."
    help: |-
      Mostra la cronologia delle azioni del nickname. Per impostazione predefinita
      mostra tre voci per pagina. Usa ALL per vederle tutte.
    example: "%command_prefix%HISTORY Utente VIEW"
    examples:
      - "%command_prefix%HISTORY Utente VIEW 2"
      - "%command_prefix%HISTORY Utente VIEW ALL"
    header: "%heading% (mostra %start%-%end% di %total%):"
    header_title: "Cronologia per %nickname%"
    entry: "#%id% [%date%] %action% di %operator% — %message%"
    no_entries: "Nessuna voce di cronologia trovata per %nickname%."
    page_hint: "Usi %command% per altre voci."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Elimina tutte le voci di cronologia per un nickname."
    help: "Elimina in modo irreversibile tutte le voci della cronologia del nickname."
    example: "%command_prefix%HISTORY Utente CLEAR"
    success: "Eliminate %count% voci di cronologia per %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Account attivato"
  resend: "Email di verifica reinviata"
  noexpire_on: "Protezione dalla scadenza attivata"
  noexpire_off: "Protezione dalla scadenza disattivata"
  userip: "Consultazione USERIP"
  history_clear: "Cronologia cancellata"
  password_changed_owner: "Password cambiata dal proprietario"
  password_changed_operator: "Password cambiata dall'operatore"
  email_changed_owner: "Email cambiata da %old_email% a %new_email%"
  email_changed_operator: "Email cambiata in %new_email% dall'operatore"
  recover: "Password reimpostata tramite token email"
  saregister: "Account registrato amministrativamente"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Vecchia email: %value%"
  new_email: "Nuova email: %value%"
  method: "Metodo: %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Imposta o rimuove la protezione dalla scadenza per un nickname."
  help: |-
    Controlla se il nickname scade per inattività.
    ON impedisce la scadenza e OFF applica le regole normali.
  example: "%command_prefix%NOEXPIRE Utente ON"
  examples:
    - "%command_prefix%NOEXPIRE Utente OFF"
  success_on: "Il nickname %nickname% è ora protetto dalla scadenza."
  success_off: "Il nickname %nickname% ora scadrà normalmente."
  forbidden: "Il nickname %nickname% è vietato."
  suspended: "Il nickname %nickname% è sospeso."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <modello> [pagina]"
  short: "Elenca i nickname registrati che corrispondono a uno schema."
  help: |-
    Elenca i nickname registrati che corrispondono al modello. Il carattere jolly *
    corrisponde a qualsiasi sequenza di caratteri; la pagina facoltativa parte da 1.
  example: "%command_prefix%LIST Utente*"
  examples:
    - "%command_prefix%LIST Utente* 2"
  header: "Nickname | Registrazione | Ultima connessione | IP | Stato"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Nessun nickname corrisponde allo schema %pattern%."
  status_pending: "In attesa"
  status_registered: "Registrato"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Gestire la modalità di registrazione della rete."
  help: |-
    Configura la modalità di registrazione per i nuovi account.

    %emphasis_0% Invia il token di verifica all'indirizzo email dell'utente.
    %emphasis_1% Consegna il token di verifica direttamente via IRC.
    %emphasis_2% Mostra la modalità di registrazione attuale senza modificarla.

    Le registrazioni in attesa mantengono la modalità con cui sono iniziate.

    In modalità TOKEN, il comando RESEND resta disabilitato per tutti gli utenti.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Modalità di registrazione attuale: %mode%."
  changed: "Modalità di registrazione impostata su %mode%."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: |-
    Token di recupero: %token_display%

    Conserva questo token in un luogo sicuro. Ti servirà per recuperare il tuo nickname se dimentichi la password.

    Per confermarlo, usa: /msg %bot% %verify%

    %warning%
  issued_warning: "IMPORTANTE: È valido solo l’ultimo token generato. Una volta confermato, non verrà più mostrato. Non condividerlo con nessuno."
  confirmed: "Il token di recupero è stato confermato. Conservalo al sicuro."
  unavailable: "Autenticati e conferma il token di recupero con %command_0% prima di usare questa operazione."
  unavailable_command_0: "VERIFY"
  locked_out: "Troppi token errati. Riprova tra %seconds% secondi."
  throttled: "Troppi token errati. Riprova tra %minutes% minuto/i."
  replaced: "Il token di recupero è stato sostituito dal token dell’email appena verificato. Conservalo al sicuro."
  optional_replacement: |-
    Nuovo token di recupero facoltativo: %token_display%

    Per sostituire il token di recupero attuale, usa: /msg %bot% %verify%

    Il token attuale rimane valido fino alla conferma.

    Se non vuoi cambiarlo, ignora questo messaggio.
  replacement_unavailable: "La password è stata reimpostata, ma non è stato possibile emettere un nuovo token. Quello attuale rimane valido."
  temporarily_unavailable: "La consegna del token di recupero è temporaneamente indisponibile. Riprova più tardi."


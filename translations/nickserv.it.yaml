# Traduzioni di NickServ — Italiano
# Dominio: nickserv
#
# Codici di formattazione IRC (virgolette doppie o blocchi letterali !irc):
#   \x02        attiva/disattiva il grassetto
#   \x03NN      colore (DECIMALE: 03=verde, 04=rosso, 07=arancione, 14=grigio scuro)
#   \x03        ripristina il colore
#   \x0F        ripristina tutta la formattazione
#
# I colori IRC usano numeri DECIMALI (0-15), non esadecimali.
#   \x0314 = grigio scuro (14 decimale): CORRETTO
#   \x030F = colore 0 seguito dalla lettera F: ERRORE
#
# Testo IRC multilinea: !irc |- con interruzioni di riga e spazi reali.
# I blocchi senza tag non decodificano gli escape; preservare i letterali CTCP.
# Esempi HELP: example/examples e %command_prefix%.
# Il presentatore aggiunge /msg senza colore e un margine di due spazi.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    La registrazione è in attesa, ma non è stato possibile consegnare il token.
    Attendi la sua scadenza prima di registrarti nuovamente.
  syntax: "REGISTER <password> [email]"
  short: "Registra il suo nickname con i servizi."
  help: |-
    Registra il tuo nickname. A seconda della configurazione, la rete invierà il
    token di verifica via chat o email. Una volta convalidato, sarà il tuo token di
    recupero permanente: conservalo in un luogo sicuro. La scadenza di %duration%
    si applica solo prima della convalida.
    I domini email bloccati amministrativamente non sono consentiti.
  example: "%command_prefix%REGISTER Password$Sicura_123"
  examples:
    - "%command_prefix%REGISTER Password$Sicura_123 utente@esempio.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "È stato inviato un token di verifica a %email%."
  pending_line_2: "Esegui /msg %bot% %verify% per completare la registrazione."
  pending_line_3: "Non l'hai ricevuto? Controlla lo spam o usa /msg %bot% %resend%"
  pending_line_4: "Il token scadrà tra %duration%."
  already_registered: "Il nickname %nickname% è già registrato."
  already_pending: "La registrazione di %nickname% è in attesa. Usa %verify%. Se il token è stato inviato via email e c'è un indirizzo valido associato, puoi richiederne un altro con %resend%."
  forbidden: "Il nickname %nickname% non può essere registrato su questa rete."
  pending_deletion: "Il nickname %nickname% è in attesa di cancellazione e non può essere registrato."
  invalid_email: "L'indirizzo email fornito non è valido."
  email_already_used: "L'email %email% è già in uso da un altro nickname. Usi un indirizzo diverso."
  throttled: "Deve attendere %minutes% minuto/i prima di provare a registrarsi di nuovo."
  guest_prefix_forbidden: "Non può registrare un nick che inizia con %prefix%."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Conferma una registrazione o un token di recupero."
  help: |-
    Dopo la convalida, questo token sarà il tuo token di recupero permanente.
    Conservalo in un luogo sicuro: potrai usarlo per recuperare il nickname.
    La scadenza di %duration% si applica solo prima della convalida.
  example: "%command_prefix%VERIFY <token_ricevuto>"
  success: "Il nickname %nickname% è stato registrato con successo e ora è identificato."
  success_native: "Il nickname %nickname% è stato registrato correttamente. Utilizzi l’autenticazione nativa mostrata di seguito."
  invalid_token: "Il token di recupero non è valido."
  no_pending: "Non ha nessuna registrazione in sospeso da verificare."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "Non puoi richiedere un altro token con %resend% perché questa registrazione consegna il token direttamente via chat."
  syntax: "RESEND"
  short: "Reinvia il token di verifica alla sua email."
  help: |-
    RESEND è disponibile solo se il token di verifica è stato inviato via email.
    Dopo la convalida, questo token sarà il tuo token di recupero permanente.
    Conservalo in un luogo sicuro: potrai usarlo per recuperare il nickname.
    La scadenza di %duration% si applica solo prima della convalida.
    Usando RESEND riceverai un nuovo token via email.
    La scadenza della registrazione in attesa verrà rinnovata di %duration%.
  example: "%command_prefix%RESEND"
  success: "Token di verifica reinviato a %email%."
  no_pending: "Non ha nessuna registrazione in sospeso da verificare."
  throttled: "Deve attendere %minutes% minuto/i prima di richiedere un'altra email di verifica."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "Nessuna email impostata per il nickname %nickname%. Il recupero non è disponibile."
  email_sent: "Un token di recupero è stato inviato a %email_hint%. Controlli la posta in arrivo (e la cartella spam)."
  pending_deletion: "Il nickname %nickname% è in attesa di eliminazione e non può essere recuperato."
  instructions: "EMAIL: %command_0% richiede un token provvisorio per email. TOKEN: fornisci quello confermato. %command_1% accetta il token valido dell’email o quello confermato. Quello dell’email sostituisce il token salvato solo dopo verifica. Usare quello salvato offre una sostituzione facoltativa tramite %command_2%; ignora il messaggio per conservarlo."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <nickname> [token]"
  short: "Recuperi il suo nickname se ha perso la password."
  help: |-
    Se non hai un token, richiedi via email un token provvisorio.
    Puoi anche fornire un token di recupero valido; se è provvisorio, sostituisce
    quello salvato solo dopo la convalida. Usando il token salvato ti verrà offerta
    una sostituzione facoltativa con VERIFY; ignora il messaggio per conservare
    quello attuale.
  example: "%command_prefix%RECOVER Utente"
  examples:
    - "%command_prefix%RECOVER Utente <token_ricevuto>"
  pending: "La registrazione di %nickname% è in attesa. Usa %command_0%. Se il token è stato inviato via email e c'è un indirizzo valido associato, puoi richiederne un altro con %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Il nickname %nickname% è sospeso. Motivo: %reason%"
  forbidden: "Il nickname %nickname% non può essere usato su questa rete."
  throttled: "Troppi token errati. Riprova tra %minutes% minuto/i."
  invalid_token: "Il token di recupero non è valido."
  success_identify: "Password reimpostata. Si identifichi ora: %identify_cmd%"
  success_then_change: "Poi cambia la password: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <nuova_password>"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <password>"
  short: "Si identifichi come proprietario di un nickname."
  help: |-
    Autentica la sua sessione con %nickserv% usando nickname e password.
    Dopo un'identificazione riuscita riceverà la modalità registrata %emphasis_0%
    e, se stava usando un nick ospite, il suo nick registrato sarà ripristinato.
  example: "%command_prefix%IDENTIFY Utente <password>"
  native_syntax: "/NICK <nickname>:<password> | /NICK <nickname>!<password>"
  native_short: "Mostra la sintassi nativa per l’autenticazione del nickname."
  native_help: |-
    Questo protocollo autentica gli account tramite cambi di nickname.
    Usa %emphasis_0% oppure, se il nickname è occupato, %emphasis_1%.
  native_example: "/NICK Utente:<password>"
  native_examples:
    - "%command_prefix%/NICK Utente!<password>"
  native_authentication: "Questo protocollo gestisce l’autenticazione tramite cambi di nickname. Usa %command_0% oppure, se il nickname è occupato, %command_1%."
  native_authentication_command_0: "/NICK <nickname>:<password>"
  native_authentication_command_1: "/NICK <nickname>!<password>"
  success: "Ora è identificato come %nickname%."
  already_identified: "È già identificato come %nickname%."
  invalid_credentials: "Password errata. Riprovi."
  locked_out: "Troppi tentativi falliti. Riprovi tra %minutes% minuto/i."
  ghost_released: "La sessione fantasma che occupava %nickname% è stata disconnessa."
  kill_reason: "Nick %nickname% reclamato da %source% (il proprietario registrato si è identificato)"
  pending: |-
    %first%
    %second%
  pending_line_1: "Il nickname %nickname% è in attesa della verifica email."
  pending_line_2: "Esegui /msg %bot% %command_0% o /msg %bot% %command_1%"
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Il nickname %nickname% è sospeso. Motivo: %reason%"
  forbidden: "Il nickname %nickname% non può essere usato su questa rete."
  pending_deletion: "Il nickname %nickname% è in attesa di cancellazione e non può essere usato."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <nickname>"
  short: "Mostra lo stato di registrazione di un nickname."
  help: |-
    Mostra lo stato attuale di un nickname: registrato, in attesa di verifica,
    sospeso e così via.
  example: "%command_prefix%STATUS Utente"
  header: "Stato del nick %nickname%"
  unregistered: "  Stato           : Non registrato"
  not_registered_offline: "  Stato           : %state%"
  value_not_registered_offline: "Non registrato"
  pending: "  Stato           : %state%"
  value_pending: "In attesa di verifica"
  pending_expires: "  Scade tra       : %minutes% minuto/i"
  pending_expires_at: "  Scade il       : %date%"
  not_connected: "  Stato           : %state%"
  value_not_connected: "Non connesso"
  not_identified: "  Stato           : %state%"
  value_not_identified: "Non identificato"
  identified: "  Stato           : %state%"
  value_identified: "Identificato"
  suspended: "  Stato           : %state%"
  value_suspended: "Sospeso"
  suspended_reason: "  Motivo          : %reason%"
  suspended_until: "  Termina il      : %date%"
  suspended_permanent: "  Termina il      : Permanente"
  forbidden: "  Stato           : %state%"
  value_forbidden: "Vietato"
  forbidden_reason: "  Motivo          : %reason%"
  pending_deletion: "  %label%          : %state%"
  value_pending_deletion: "In attesa di cancellazione"
  label_pending_deletion: "Stato"
  pending_deletion_at: "  %label%       : %date%"

  label_pending_deletion_at: "Eliminato"
# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <nickname>"
  short: "Mostra le informazioni su un nickname registrato."
  help: |-
    Mostra i dati di registrazione di un nickname: data di registrazione, stato
    della connessione, ultimo messaggio in uscita e indirizzo email.

    L'email è visibile solo al proprietario identificato. Se il nickname è privato,
    solo il proprietario e gli Operatori IRC possono vedere le informazioni.
  example: "%command_prefix%INFO Utente"
  private: "Le informazioni del nickname %nickname% sono private."
  header: "Informazioni per il nickname %nickname%"
  status: "%label%               : %status%"
  label_status: "Stato"
  status_registered: "Registrato"
  status_suspended: "Sospeso"
  status_forbidden: "Vietato"
  status_pending_deletion: "In attesa di cancellazione"
  reason: "%label%                 : %reason%"
  label_reason: "Motivo"
  suspended_until: "%label%          : %date%"
  label_suspended_until: "Termina il"
  suspended_permanent: "%label%          : Permanente"
  label_suspended_permanent: "Termina il"
  registered_at: "%label%          : %date%"
  label_registered_at: "Registrato"
  last_seen_online: "%label%      : %online%"
  label_last_seen_online: "Ultimo accesso"
  value_last_seen_online: "ONLINE ORA"
  last_seen_at: "%label%      : %date%"
  label_last_seen_at: "Ultimo accesso"
  last_seen_never: "%label%      : Mai"
  label_last_seen_never: "Ultimo accesso"
  last_quit: "%label%         : %message%"
  label_last_quit: "Ultimo quit"
  last_connect: "%label%  : %ip% (%host%)"
  label_last_connect: "Ultima connessione"
  language: "%label%              : %language%"
  label_language: "Lingua"
  email: "%label%               : %email%"
  label_email: "Email"
  vhost: "%label%               : %vhost%"
  label_vhost: "VHost"
  no_expire: "%label%     : Sì"
  label_no_expire: "Mai in scadenza"
  pending_deletion_at: "%label%              : %date%"
  label_pending_deletion_at: "Eliminato"
  pending_deletion_until: "%label%       : %date%"
  label_pending_deletion_until: "Elim. definitiva"
  pending_deletion_notice: "%notice%"
  value_pending_deletion_notice: "Questo nickname è in attesa di cancellazione e non può essere registrato."
  channels_header: |-

    Canali con accesso:
  channels_entry_founder: "%channel% (%role%)"
  channels_role_founder: "Fondatore"
  channels_entry_successor: "%channel% (%role%)"
  channels_role_successor: "Successore"
  channels_entry_access: "%channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <nuova_password>|EMAIL <email> <token>|LANGUAGE <codice>|TIMEZONE <fuso_orario>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Cambiare le opzioni del tuo nickname."
  help: |-
    Modifica le impostazioni del tuo nickname. Per cambiare queste opzioni devi
    essere identificato.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Opzione sconosciuta %option%. Opzioni disponibili: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <nuova_password>"
    short: "Cambia la password del suo nickname."
    help: |-
      Cambia la password per il suo nickname. La nuova password ha
      effetto immediato. Scelga una password sicura di almeno 6 caratteri
      che non usi su altri servizi.
    example: "%command_prefix%SET PASSWORD Password$Sicura_123"
    success: "La sua password è stata aggiornata con successo."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Usa %value% con il token di recupero confermato."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Cambia l'email usando il token di recupero convalidato."
    help: |-
      SET EMAIL cambia l'indirizzo di contatto dopo aver convalidato il token di
      recupero, senza consumarlo. Verifica formato e unicità; non invia email di
      conferma.
      I domini email bloccati amministrativamente non sono consentiti.
    example: "%command_prefix%SET EMAIL utente@esempio.com <token_confermato>"
    success: "La sua email è stata aggiornata a %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "È stato inviato un token di conferma a %current_email%."
    pending_line_2: "Per confermare il cambio a %new_email%, esegui:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "Il token scade tra un'ora."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "Il token non è valido o è scaduto. Ne richieda uno nuovo con %value%."
    invalid_token_value: "SET EMAIL <nuova_email>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <codice>"
    short: "Cambia la lingua usata dai servizi per comunicare con lei."
    help: |-
      Cambia la lingua che %nickserv% e gli altri servizi usano per comunicare con
      lei.
      Lingue disponibili:
      %emphasis_0% (Catalano)
      %emphasis_1% (Tedesco)
      %emphasis_2% (Greco)
      %emphasis_3% (Inglese)
      %emphasis_4% (Spagnolo)
      %emphasis_5% (Basco)
      %emphasis_6% (Francese)
      %emphasis_7% (Galiziano)
      %emphasis_8% (Italiano)
      %emphasis_9% (Olandese)
      %emphasis_10% (Polacco)
      %emphasis_11% (Portoghese)
      %emphasis_12% (Rumeno)
      %emphasis_13% (Turco)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Lingua cambiata in %language%."
    invalid: "Lingua non supportata. Lingue disponibili: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <fuso_orario>"
    short: "Imposta il fuso orario usato per visualizzare le date."
    help: |-
      Imposta il fuso orario usato da %nickserv% per mostrare le date. Consulta
      HELP SET TIMEZONE per le regioni. Usa OFF per rimuoverlo.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Fuso orario impostato su %timezone%. Le date saranno mostrate in questo fuso."
    cleared: "Fuso orario azzerato. Le date useranno il predefinito di rete."
    invalid: "Fuso orario non valido %timezone%. Usi un identificatore valido (es. UTC, Europe/Rome)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Mostra o nasconde le informazioni del tuo nickname."
    help: |-
      Controlla la visibilità delle informazioni del suo nickname nel comando INFO.
      Con %emphasis_0% solo lei e gli IRC Operator possono vedere i suoi dettagli.
      Con %emphasis_1% le sue informazioni sono pubbliche per tutti.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Le informazioni del suo nickname ora sono %value%."
    on_value: "private"
    off: "Le informazioni del suo nickname ora sono %value%."
    off_value: "pubbliche"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Cambia il modo in cui i servizi comunicano con te."
    help: |-
      Controlla come %nickserv% e gli altri servizi ti inviano i messaggi.
      Con %emphasis_0% le risposte vengono inviate come %emphasis_1%.
      Con %emphasis_2% le risposte vengono inviate come %emphasis_3%.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "I messaggi dei servizi ora saranno inviati come %value%."
    on_value: "PRIVMSG"
    off: "I messaggi dei servizi ora saranno inviati come %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Imposta o rimuove il tuo host virtuale."
    help: |-
      Imposta un nome host personalizzato che gli altri utenti vedranno quando sei
      identificato.

      Per rimuoverlo, esegui %emphasis_0% senza specificare un valore.

      Sono ammesse solo lettere (a-z, A-Z), cifre, trattini e punti. Ogni segmento
      deve iniziare e terminare con una lettera o una cifra. Il nome host può avere
      fino a 48 caratteri e deve essere unico per nickname.
    example: "%command_prefix%SET VHOST utente.esempio.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Il suo host virtuale è stato impostato su %vhost%."
    cleared: "Il suo host virtuale è stato azzerato."
    invalid: "Vhost non valido. Solo lettere, cifre, trattino e punto (non all'inizio/fine del blocco); max 48 caratteri."
    taken: "Quel vhost è già in uso da un altro nickname."
    forced: "Il suo vhost è configurato automaticamente e non può essere modificato con SET VHOST."

# --- SAREGISTER ------------------------------------------------------------
saregister:
  syntax: "SAREGISTER <nickname> <password> [email]"
  short: "Registra amministrativamente un nickname."
  help: |-
    Sintassi: SAREGISTER <nickname> <password> [email]

    Registra amministrativamente un nickname immediatamente senza richiedere
    la verifica dell'utente né limiti di frequenza.

    In modalità TOKEN, il token di recupero viene mostrato una sola volta all'operatore.
    In modalità EMAIL, il token di recupero viene inviato all'indirizzo email specificato.
  example: "%command_prefix%SAREGISTER Alice Password123"
  examples:
    - "%command_prefix%SAREGISTER Bob Password456 bob@esempio.it"
  success_token: "Il nickname %nickname% è stato registrato. Token di recupero: %token%"
  success_email: "Il nickname %nickname% è stato registrato. Token di recupero inviato a %email%."
  invalid_nickname: "Nickname non valido %nickname%."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <nickname> {PASSWORD <nuova_password>|EMAIL <nuova_email>|LANGUAGE <codice>|TIMEZONE {<fuso_orario>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Modificare le impostazioni di un altro nickname."
  help: |-
    Consente a un IRCop di modificare le impostazioni di un altro nickname
    registrato.
    Non sono ammessi nickname Root, IRCop o di servizio.
  example: "%command_prefix%SASET Utente PRIVATE ON"
  examples:
    - "%command_prefix%SASET Utente TIMEZONE OFF"
  unknown_option: "Opzione sconosciuta %option%. Opzioni disponibili: %options%."
  cannot_modify_oper: "Impossibile modificare un nickname di IRC Operator."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <nickname> PASSWORD <nuova_password>"
    short: "Cambiare la password di un nickname."
    help: "Cambia la password di un altro nickname. La modifica è immediata."
    example: "%command_prefix%SASET Utente PASSWORD ClaveSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <nickname> EMAIL <nuova_email>"
    short: "Cambiare l'email di un nickname."
    help: |-
      Cambia l'email di un altro nickname. La modifica è immediata, non richiede il
      token di recupero e non invia un'email di conferma.
      BADMAIL non limita questa modifica amministrativa dell’email.
    example: "%command_prefix%SASET Utente EMAIL utente@esempio.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <nickname> LANGUAGE <codice>"
    short: "Cambiare la lingua di un nickname."
    help: |-
      Cambia la lingua di un altro nickname. Sono disponibili en (inglese) ed it
      (italiano).
    example: "%command_prefix%SASET Utente LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <nickname> TIMEZONE {<fuso_orario>|OFF}"
    short: "Cambiare il fuso orario di un nickname."
    help: "Imposta o rimuove il fuso orario di un altro nickname. Usa OFF per rimuoverlo."
    example: "%command_prefix%SASET Utente TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Utente TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <nickname> PRIVATE {ON|OFF}"
    short: "Cambiare la privacy di un nickname."
    help: "Attiva o disattiva la privacy delle informazioni di un altro nickname."
    example: "%command_prefix%SASET Utente PRIVATE ON"
    examples:
      - "%command_prefix%SASET Utente PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <nickname> MSG {ON|OFF}"
    short: "Cambiare la preferenza messaggi di un nickname."
    help: |-
      Imposta se un altro nickname riceve le risposte come PRIVMSG (ON) o NOTICE
      (OFF).
    example: "%command_prefix%SASET Utente MSG ON"
    examples:
      - "%command_prefix%SASET Utente MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <nickname> VHOST [vhost]"
    short: "Cambiare l'host virtuale di un nickname."
    help: |-
      Imposta o rimuove l'host virtuale di un altro nickname. Per rimuoverlo,
      esegui SASET <nickname> VHOST senza valore.
    example: "%command_prefix%SASET Utente VHOST utente.esempio.org"
    examples:
      - "%command_prefix%SASET Utente VHOST"


# Traducciones de OperServ — Español
# Dominio: operserv
#
# Translations contain localized text and interpolation parameters only.
# The presentation engine owns IRC styling and example prefixes.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "Este comando está restringido a administradores root de la red."

# --- HELP --------------------------------------------------------------------
help:
  syntax: "HELP [comando] [opción]"
  short: "Listar comandos o mostrar ayuda de un comando."
  help: |-
    Sin argumentos lista todos los comandos. Usa %help_command% para ayuda
    completa, o %help_option_command% para sub-opciones.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permite gestionar los operadores de la red y sus permisos, aplicar restricciones
    de acceso y desconectar usuarios. También permite enviar comunicados generales y
    administrar los mensajes de bienvenida de la red.
  general_header: "Comandos disponibles:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opciones:"
  examples_header: "Ejemplos:"
  general_help_command: "HELP <comando>"
  option_help_command: "HELP %command% <opción>"
  detail_help_command: "HELP <comando>"
  detail_help_option_command: "HELP <comando> <opción>"
  general_footer: "Usa /msg %bot% %help_command% para más información."
  set_sub_footer: "Usa /msg %bot% %help_command% para más información."
  syntax_label: "Sintaxis: %syntax%"
  footer: ""
  intro_expiration: "NOTA: Los nicks que no se utilicen durante más de %days% días se eliminarán automáticamente."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operadores y roles"
    network_security: "Seguridad de red"
    communication: "Comunicación"
    low_level: "Bajo nivel"
  ircop_header: "Comandos disponibles para IRCops:"

# --- IRCOP --------------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <apodo> <rol>|DEL <apodo>|LIST}"
  short: "Gestiona operadores de red."
  help: |-
    Gestiona operadores de red. ADD añade un apodo registrado
    como operador con el rol especificado.
    DEL elimina un operador. LIST muestra todos los operadores.
    Usa ROLE LIST para ver los roles disponibles.
    Este comando está restringido a usuarios Root configurados en los servicios.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"

  unknown_sub: "Subcomando desconocido %sub%. Usa ADD, DEL o LIST."
  unknown_role: "El rol %role% no existe. Usa /msg %bot% %role_list% para ver los roles disponibles."
  already_admin: "%nickname% ya es operador (rol: %role%)."
  not_admin: "%nickname% no es un operador de red."
  role_changed: "Cambiado el rol de %nickname% de %old% a %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <apodo> <rol>"
    short: "Añade un operador de red."
    help: |-
      Añade un apodo registrado como operador de red.
      Usa ROLE LIST para ver los roles disponibles.
      Este comando está restringido a usuarios Root.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "Añadido %nickname% como %role%."
    nick_not_active: "El apodo %nickname% no es un apodo registrado activo."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <apodo>"
    short: "Elimina un operador de red."
    help: |-
      Elimina un operador de red de la lista.
      Este comando está restringido a usuarios Root.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "Eliminado %nickname% de operadores."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Lista todos los operadores de red."
    help: |-
      Lista todos los operadores de red con sus roles y fecha de registro.
      Este comando está restringido a usuarios Root.
    example: "%command_prefix%IRCOP LIST"
    header: "Operadores de Red"
    empty: "No hay operadores de red."

# --- ROLE --------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rol>|SET <rol> [operclass]}"
    short: "Configura la clase de operador de UnrealIRCd."
    help: |-
      Permite consultar y configurar la operclass de un rol.

      %options_header%
      %option_LIST%Muestra las operclasses disponibles en la red.
      %option_VIEW%Muestra la operclass del rol y las disponibles.
      %option_SET%Asigna la operclass a los IRCOP al identificarse.

      Omite el valor para eliminarla.

      Disponible solo en protocolos UnrealIRCd.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SOPORTE"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE"
    list:
      header: "Operclasses Disponibles en la Red"
      empty: "No hay operclasses disponibles en la red."
      not_supported: "El protocolo actual no soporta listar operclasses disponibles."
    view:
      empty: "El rol %role% no tiene operclass asignada."
      line: "Operclass: %operclass%"
      available: "Operclasses disponibles: %available%"
    set:
      done: "Operclass configurada para el rol %role%."
      cleared: "Operclass eliminada del rol %role%."
      not_available: "La operclass %operclass% no está disponible en la red. Operclasses disponibles: %available%."
  syntax: "ROLE {ADD <nombre> [descripción]|DEL <nombre>|LIST|PERMS {{ADD|DEL} <rol> <permiso>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modos]}|VHOST {VIEW <rol>|SET <rol> [vhost]}}"
  short: "Permite administrar los roles de operadores, sus permisos y su configuración."
  help: |-
    Permite administrar los roles de operadores, sus permisos y su configuración.

    Los roles ADMIN, OPER y PREOPER están protegidos y no pueden eliminarse.
    Comando exclusivo para usuarios Root.
  syntax_operclass: "ROLE {ADD <nombre> [descripción]|DEL <nombre>|LIST|PERMS {{ADD|DEL} <rol> <permiso>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modos]}|VHOST {VIEW <rol>|SET <rol> [vhost]}|OPERCLASS {LIST|VIEW <nombre>|SET <nombre> [operclass]}}"
  help_operclass: |-
    Permite administrar los roles de operadores, sus permisos y su configuración.

    Los roles ADMIN, OPER y PREOPER están protegidos y no pueden eliminarse.
    Comando exclusivo para usuarios Root.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SOPORTE Operadores de soporte"

  unknown_sub: "Subcomando desconocido %sub%. Usa ADD, DEL, LIST, PERMS, MODES o VHOST."
  unknown_sub_operclass: "Subcomando desconocido %sub%. Usa ADD, DEL, LIST, PERMS, MODES, VHOST u OPERCLASS."
  not_found: "El rol %role% no existe."
  already_exists: "El rol %role% ya existe."
  protected: "El rol %role% está protegido y no puede eliminarse."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <nombre> [descripción]"
    short: "Crea un nuevo rol."
    help: |-
      Crea un nuevo rol personalizado. La descripción es opcional.
      Este comando está restringido a usuarios Root.
    example: "%command_prefix%ROLE ADD SOPORTE Operadores de soporte"
    done: "Creado el rol %role%."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <nombre>"
    short: "Elimina un rol."
    help: |-
      Elimina un rol personalizado. Los roles protegidos (ADMIN, OPER, PREOPER)
      no pueden eliminarse. Si el rol tiene operadores asignados,
      debes reasignarlos primero.
      Este comando está restringido a usuarios Root.
    example: "%command_prefix%ROLE DEL SOPORTE"
    done: "Eliminado el rol %role%."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Muestra los roles disponibles."
    help: |-
      Lista todos los roles. Los roles protegidos se marcan con [PROTEGIDO].
      Este comando está restringido a usuarios Root.
    example: "%command_prefix%ROLE LIST"
    header: "Roles de Operadores"
    empty: "No hay roles de operadores."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rol> <permiso>|{LIST|CLEAR} <rol>}"
    short: "Gestiona los permisos del rol."
    help: |-
      Gestiona los permisos asignados a un rol.

      %options_header%
      %option_LIST%Muestra todos los permisos disponibles e indica cuáles tiene
                      asignados el rol.
      %option_ADD%Asigna un permiso al rol.
      %option_DEL%Quita un permiso del rol.
      %option_CLEAR%Quita todos los permisos del rol.

      %assigned_status% indica que el permiso está asignado; %unassigned_status% indica que está disponible.

      Usa ALL para añadir todos los permisos disponibles a la vez.
      Este comando está restringido a usuarios Root.
    example: "%command_prefix%ROLE PERMS LIST SOPORTE"
    examples:
      - "%command_prefix%ROLE PERMS ADD SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SOPORTE ALL"
      - "%command_prefix%ROLE PERMS DEL SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SOPORTE"
    not_found: "El permiso %perm% no existe."
    already_has: "El rol %role% ya tiene el permiso %perm%."
    does_not_have: "El rol %role% no tiene el permiso %perm%."

    list:
      header: "Lista de permisos de %role%"
      columns: "Asignado | Clave permiso | Descripción"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""

    add:
      done: "Añadido permiso %perm% al rol %role%."
      all_done: "Añadidos %count% permisos al rol %role%."

    del:
      done: "Quitado permiso %perm% del rol %role%."

    clear:
      done: "Quitados %count% permisos del rol %role%."
      empty: "El rol %role% no tiene permisos asignados."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rol>|SET <rol> [modos]}"
    short: "Configura los modos de usuario del rol."
    help: |-
      Gestiona los modos de usuario IRCOP asignados a un rol.

      %options_header%
      %option_VIEW%Muestra los modos actuales del rol.
      %option_SET%Establece los modos IRCOP.

      Omite los modos para eliminarlos todos.

      Los usuarios con este rol recibirán estos modos al identificarse.
      Modos disponibles según IRCD
      Este comando está restringido a usuarios Root.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"

    view:
      header: "Modos de %role%"
      empty: "El rol %role% no tiene modos asignados."
      line: "Modos: %modes%"

    set:
      done: "Establecidos modos %modes% para el rol %role%."
      cleared: "Eliminados los modos del rol %role%."
      invalid_mode: "El modo %mode% no es un modo IRCOP válido."
      invalid_modes: "Modos inválidos: %invalid%. Modos válidos: %valid%."
      no_irc_user_modes: "El IRCD actual no tiene modos IRCOP configurados."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rol>|SET <rol> [vhost]}"
    short: "Configura el patrón de host virtual del rol."
    help: |-
      Permite configurar el host virtual que reciben los operadores de un rol
      al identificarse, sustituyendo su host personal.

      El host se genera combinando el apodo sin caracteres especiales con el
      patrón configurado. Por ejemplo:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Muestra el patrón configurado para un rol.
      %option_SET%Establece o elimina el patrón de un rol.

      El patrón solo admite letras, números, guiones y puntos. Debe contener
      al menos un punto, no puede comenzar ni terminar con guion o punto,
      ni contener puntos consecutivos.

      Para eliminar el host forzado, utiliza SET sin indicar un patrón.

      Comando exclusivo para usuarios Root.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"

    view:
      header: "VHost forzado de %role%"
      empty: "El rol %role% no tiene patrón de vhost forzado configurado."
      line: "Patrón: %pattern%"
      example: "Ejemplo: %example_nickname%.%pattern%"
      example_nickname: "apodo"

    set:
      done: "Establecido patrón de vhost forzado para el rol %role%."
      cleared: "Eliminado el patrón de vhost forzado del rol %role%."
      invalid: "Patrón de vhost inválido. Caracteres válidos: a-z, A-Z, 0-9, - y .. Debe tener al menos un punto, no puede empezar/terminar con - o . o tener .."

# --- KILL --------------------------------------------------------------------
kill:
  syntax: "KILL <apodo> <razón>"
  short: "Desconecta forzosamente a un usuario de la red."
  help: |-
    Desconecta a un usuario de la red IRC.
    Los IRCops y usuarios Root no pueden ser killeados.
  example: "%command_prefix%KILL BadUser Flooding en canales"
  protected_root: "No se puede hacer KILL al usuario Root %nickname%."
  protected_ircop: "No se puede hacer KILL al IRC operator %nickname%."
  done: "Usuario %nickname% desconectado (%reason%)."

# --- GLINE --------------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <máscara> <expiración> <razón>|DEL {<máscara>|<número>}|LIST [máscara]}"
  short: "Gestiona G-lines de red."
  help: |-
    Gestiona G-lines (bans globales) de red.
    ADD añade un nuevo G-line con máscara, expiración y razón.
    DEL elimina un G-line por máscara o número de entrada.
    LIST muestra todos los G-lines, filtrable por máscara.

    Formato de expiración: 0=permanente, o usa sufijo d, h, m (ej: 7d, 12h, 30m).
    Los GLINEs que coincidan con usuarios Root o IRCop son rechazados.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuso de spam"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuso persistente"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Subcomando desconocido %sub%. Usa ADD, DEL o LIST."
  invalid_mask: "Formato de máscara inválido. Debe ser usuario@host (ej: *@192.168.*)."
  global_mask: "La máscara G-line %mask% es demasiado amplia. No se permiten máscaras globales."
  dangerous_mask: "La máscara G-line %mask% es demasiado amplia. La parte del host necesita al menos 4 caracteres alfanuméricos."
  protected_user: "No se puede aplicar GLINE al usuario protegido %nickname%."
  invalid_expiry: "Formato de expiración inválido. Usa 0 para permanente, o un valor como 7d, 12h, 30m."
  already_exists: "Ya existe un G-line para %mask%."
  max_entries: "Se alcanzó el máximo de G-lines (%max%)."
  not_found: "G-line %mask% no encontrado."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <máscara> <expiración> <razón>"
    short: "Añade un G-line de red."
    help: |-
      Añade un G-line (ban global) de red.
      La máscara debe tener formato usuario@host.
      Expiración: 0=permanente, o usa sufijo d, h, m (ej: 7d, 12h, 30m).
      Los GLINEs que coincidan con usuarios Root o IRCop son rechazados.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuso de spam"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuso persistente"
    done: "G-line añadido: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<máscara>|<número>}"
    short: "Elimina un G-line."
    help: |-
      Elimina un G-line de la lista.
      Puedes especificar la máscara o el número de entrada de LIST.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% eliminado."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [máscara]"
    short: "Lista todos los G-lines."
    help: "Lista todos los G-lines. Opcionalmente filtra por patrón de máscara."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-lines (%count%)"
    empty: "No hay G-lines."
    entry: "%index%. %mask% - %reason% (%nickname%, expira: %expiration%)"

# --- GLOBAL -------------------------------------------------------------------
global:
  syntax: "GLOBAL {servicio|apodo!ident@vhost} {PRIVMSG|NOTICE} <mensaje>"
  short: "Envía un mensaje global a todos los usuarios conectados."
  help: |-
    Permite enviar mensajes a todos los usuarios conectados, utilizando un
    servicio existente o un cliente temporal con identidad personalizada.

    Los mensajes pueden enviarse como PRIVMSG (privado) o NOTICE (aviso).

    Para utilizar un cliente temporal, debes indicar una máscara con el formato
    apodo!ident@vhost, utilizando caracteres válidos para cada campo.

    El apodo no puede estar registrado ni en uso. El cliente se desconecta
    automáticamente tras el envío y su apodo queda bloqueado durante 24 horas.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Mantenimiento en 10 minutos"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE La red se reiniciará"
  mask_invalid: "Formato de máscara inválido: %error%"
  nick_connected: "El apodo %nickname% está conectado actualmente."
  nick_registered: "El apodo %nickname% está registrado."
  type_invalid: "El tipo de mensaje debe ser PRIVMSG o NOTICE."
  done: "Mensaje global enviado desde %nickname% a %count% usuarios."

# --- RAW ---------------------------------------------------------------------
raw:
  syntax: "RAW <línea>"
  short: "Envía una línea de protocolo cruda al IRCd."
  help: |-
    Envía la línea indicada directamente al socket del IRCd de enlace.
    Úsalo con extrema precaución. Líneas de protocolo inválidas pueden bloquear la
    red.
  example: "%command_prefix%RAW :services.ares NOTICE * :Mantenimiento programado"
  empty: "Debes especificar una línea no vacía para enviar."
  too_long: "La línea es demasiado larga. Máximo 510 caracteres."
  not_connected: "No conectado al IRCd."
  done: "Línea cruda enviada."
  protocol:
    syntax: "El protocolo activo rechazó la sintaxis del comando RAW."
    done: "Comando RAW gestionado por el protocolo ejecutado."
    target: "El protocolo activo rechazó el destino %target%."
    unsupported: "El protocolo activo no admite este comando RAW."
    invalid_resource_type: "Tipo de recurso de protocolo desconocido: %resource_type%."
    invalid_resource: "Recurso de protocolo no válido: %resource%."
    invalid_value: "Valor no válido para el recurso de protocolo: %resource%."
    error: "El protocolo activo no pudo ejecutar el comando RAW."

# --- DEBUG -------------------------------------------------------------------
debug:
  action_global: "%operator% ejecuta el comando GLOBAL con el apodo %target% mediante %type% a %count% usuarios. Mensaje: %message%"
  prefix_message: "Mensaje: %reason%"

# --- MOTD ----------------------------------------------------------------------
motd:
  short: "Gestiona mensajes MOTD que se envían a usuarios al conectar."
  syntax: "MOTD {ADD <destino> {PRIVMSG|NOTICE} <expiración> <mensaje>|DEL <id>|LIST|CLEAN}"
  help: |-
    Gestiona entradas de mensaje del día (MOTD) que se envían cuando un usuario se
    conecta a la red.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Subcomando desconocido. Usa: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {servicio|apodo!ident@vhost} {PRIVMSG|NOTICE} <expiración> <mensaje>"
    syntax_hint: "Uso: %syntax%"
    short: "Añade una entrada MOTD."
    help: |-
      Añade un nuevo mensaje MOTD que se enviará a cada usuario cuando se conecte a
      la red.
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Mantenimiento esta noche"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Bienvenido a la red"
    done: "Entrada MOTD #%id% añadida."
    invalid_type: "Tipo de mensaje inválido. Debe ser PRIVMSG o NOTICE."
    invalid_expiry: "Formato de expiración inválido. Usa: <número><s|m|h|d> o 0 para indefinido (ej: 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Uso: %syntax%"
    short: "Elimina una entrada MOTD."
    help: "Elimina una entrada MOTD por su ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "Entrada MOTD #%id% eliminada."
    not_found: "Entrada MOTD no encontrada."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Lista todas las entradas MOTD."
    help: "Lista todas las entradas MOTD configuradas."
    example: "%command_prefix%MOTD LIST"
    empty: "No hay entradas MOTD configuradas."
    header: "Entradas MOTD:"
    status_enabled: "activada"
    status_disabled: "desactivada"
    expired: "caducada"
    no_bot: "(sin bot)"
    shown_count: "%count% veces mostrado"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Elimina todas las entradas MOTD caducadas."
    help: "Elimina todas las entradas MOTD cuyo tiempo de expiración haya pasado."
    example: "%command_prefix%MOTD CLEAN"
    done: "Eliminadas %count% entradas MOTD caducadas."
    none: "No hay entradas MOTD caducadas para eliminar."
  debug:
    finalized: "El mensaje #%id% MOTD ha finalizado: [%type%] %message% | %date% | %shown_count%"

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <dominio> <razón>|DEL {número|ALL}|LIST <patrón> [página]}"
  short: "Administrar dominios de correo bloqueados."
  help: |-
    Administrar dominios de correo bloqueados.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <dominio> <razón>"
    short: "Bloquear un dominio."
    help: |-
      Acepta dominios ASCII o punycode, no direcciones ni patrones. La
      razón es obligatoria. El bloqueo es exacto y no incluye subdominios.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {número|ALL}"
    short: "Eliminar dominios bloqueados."
    help: |-
      Elimina un identificador permanente o todas las entradas con ALL. Los
      demás identificadores no cambian.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <patrón> [página]"
    short: "Listar dominios bloqueados."
    help: |-
      El patrón es obligatorio. Solo * es un comodín y coincide con
      cualquier secuencia. No distingue mayúsculas. La página opcional
      empieza en 1. El filtro y las páginas conservan los identificadores
      permanentes.
    example: "%command_prefix%BADMAIL LIST *.org 2"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Bir rumuz için süre sonu korumasını ayarlayın veya kaldırın."
  help: |-
    Takma adın etkin olmama nedeniyle süresinin dolup dolmayacağını denetler.
    ON süre dolmasını önler, OFF normal kuralları uygular.
  example: "%command_prefix%\x02\x0303NOEXPIRE Kullanıcı ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE Kullanıcı OFF\x03\x0F"
  success_on: "\x0303✔\x03 \x02%nickname%\x02 rumuzu artık süre sonuna karşı korunuyor."
  success_off: "\x0303✔\x03 \x02%nickname%\x02 rumuzu artık normal şekilde sona erecek."
  forbidden: "\x0304✗\x03 \x02%nickname%\x02 rumuzu yasaklanmış."
  suspended: "\x0304✗\x03 \x02%nickname%\x02 rumuzu askıya alınmış."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <desen> [sayfa]"
  short: "Bir desenle eşleşen kayıtlı takma adları listeler."
  help: |-
    Kalıpla eşleşen kayıtlı takma adları listeler. * joker karakteri herhangi bir
    karakter dizisiyle eşleşir; isteğe bağlı sayfa 1’den başlar.
  example: "%command_prefix%\x02\x0303LIST Kullanıcı*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST Kullanıcı* 2\x03\x0F"
  header: "Takma ad | Kayıt | Son bağlantı | IP | Durum"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "%pattern% deseniyle eşleşen takma ad yok."
  status_pending: "Beklemede"
  status_registered: "Kayıtlı"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Ağın kayıt kipini yönetir."
  help: !irc |-
    Yeni hesaplar için kayıt modunu yapılandırır.

    • \x02EMAIL:\x02 Doğrulama tokenını kullanıcının e-posta adresine gönderir.
    • \x02TOKEN:\x02 Doğrulama tokenını doğrudan IRC üzerinden iletir.
    • \x02STATUS:\x02 Değişiklik yapmadan geçerli kayıt modunu gösterir.

    Bekleyen kayıtlar başlatıldıkları modu korur.

    TOKEN modunda RESEND komutu tüm kullanıcılar için devre dışı kalır.
  example: "%command_prefix%\x02\x0303REGMODE STATUS\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGMODE EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303REGMODE TOKEN\x03\x0F"
  status: "\x0307ℹ\x03 Geçerli kayıt kipi: \x02%mode%\x02."
  changed: "\x0303✔\x03 Kayıt kipi \x02%mode%\x02 olarak değiştirildi."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: !irc |-
    Kurtarma belirteci: \x0303%token%\x03

    Bu belirteci güvenli bir yerde saklayın. Parolanızı unutursanız takma adınızı kurtarmak için buna ihtiyacınız olacak.

    Doğrulamak için kullanın: /msg %bot% \x0303VERIFY %token%\x03

    \x0304⚠\x03 ÖNEMLİ: Yalnızca en son oluşturulan belirteç geçerlidir. Doğrulandıktan sonra tekrar gösterilmez. Kimseyle paylaşmayın.
  confirmed: "\x0303✔\x03 Kurtarma belirteciniz doğrulandı. Güvenli yerde saklayın."
  unavailable: "\x0304✗\x03 Bu işlemden önce kimliğinizi doğrulayın ve kurtarma belirtecinizi \x0303VERIFY\x03 ile onaylayın."
  locked_out: "\x0304✗\x03 Çok fazla geçersiz belirteç. \x02%seconds%\x02 saniye sonra tekrar deneyin."
  throttled: "\x0304✗\x03 Çok fazla geçersiz belirteç. \x02%minutes%\x02 dakika sonra tekrar deneyin."
  replaced: "\x0303✔\x03 Kurtarma belirteciniz doğruladığınız e-posta belirteciyle değiştirildi. Güvenli yerde saklayın."
  optional_replacement: !irc |-
    \x0307→\x03 İsteğe bağlı yeni kurtarma belirteci: \x0303%token%\x03

    Geçerli kurtarma belirtecinizi değiştirmek için kullanın: /msg %bot% \x0303VERIFY %token%\x03

    Mevcut belirteç onaya kadar geçerlidir.

    Değiştirmek istemiyorsanız bu mesajı yok sayın.
  replacement_unavailable: "\x0307ℹ\x03 Parolanız sıfırlandı ancak yeni belirteç verilemedi. Mevcut belirteciniz geçerlidir."
  temporarily_unavailable: "\x0304✗\x03 Kurtarma belirteci teslimi geçici olarak kullanılamıyor. Daha sonra deneyin."

# --- NICK PROTECTION ----------------------------------------------------------
protection:
  nick_in_use: "%nickname% rumuzu kayıtlıdır. Kimlik doğrulamazsanız adınız değiştirilecektir."
  renamed_to: |-
    Takma adınız %guest_nick% olarak değiştirildi. Takma adınızı geri almak için:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <parola>"
  nick_forbidden: "%nickname% rumuzu yasaklanmıştır: %reason%"

# --- USERIP (IRCop) -----------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Rumuzun gerçek IP adresini ve host adını öğrenin."
  help: |-
    Bir takma adın gerçek IP adresini ve ana bilgisayar adını gösterir.
    Sorumlu kullanın: bu hassas bilgidir.
  example: "%command_prefix%USERIP Kullanıcı"
  result: "Rumuz: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP (IRCop) ------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Son tanımlanmış bağlantılarının IP adresine göre takma adları bulur."
  help: |-
    Son kimlik doğrulanmış bağlantısı bu IP adresini kullanan kayıtlı takma
    adları gösterir. Kaydedilen adres güncel olmayabilir.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Bu IP adresiyle eşleşen kayıtlı takma ad yok."
  header: "Eşleşen takma adlar:"

# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <desen> [sayfa]"
  short: "Bir desenle eşleşen kayıtlı takma adları listeler."
  help: |-
    Kalıpla eşleşen kayıtlı takma adları listeler. * joker karakteri herhangi bir
    karakter dizisiyle eşleşir; isteğe bağlı sayfa 1’den başlar.
  example: "%command_prefix%LIST Kullanıcı*"
  examples:
    - "%command_prefix%LIST Kullanıcı* 2"
  header: "Takma ad | Kayıt | Son bağlantı | IP | Durum"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "%pattern% deseniyle eşleşen takma ad yok."
  status_pending: "Beklemede"
  status_registered: "Kayıtlı"

# --- HISTORY ---
history:
  syntax: "HISTORY <nickname> {ADD <mesaj>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Rumuz eylem geçmişini görüntüleyin veya yönetin."
  help: |-
    Takma adın işlem geçmişini görüntüler ve yönetir. Askıya alma, parola veya
    e-posta değişiklikleri ve kurtarma işlemleri otomatik kaydedilir. VIEW sayfa
    başına
    üç kayıt gösterir; ALL tüm geçmişi gösterir.
  example: "%command_prefix%HISTORY Kullanıcı VIEW"
  examples:
    - "%command_prefix%HISTORY Kullanıcı VIEW ALL"
    - "%command_prefix%HISTORY Kullanıcı ADD Elle eklenen not"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <mesaj>"
    short: "Manuel bir geçmiş girişi ekleyin."
    help: "Takma ad geçmişine elle bir kayıt ekler."
    example: "%command_prefix%HISTORY Kullanıcı ADD Spam nedeniyle bildirildi"
    success: "%nickname% için geçmiş girişi eklendi."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "ID ile bir geçmiş girişini silin."
    help: "Geçmişteki belirli bir kaydı kimliğine göre siler."
    example: "%command_prefix%HISTORY Kullanıcı DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [SAYFA|ALL]"
    short: "Rumuz eylem geçmişini görüntüleyin."
    help: |-
      Takma adın işlem geçmişini gösterir. Varsayılan olarak sayfa başına üç kayıt
      gösterilir. Tümünü görmek için ALL kullanın.
    example: "%command_prefix%HISTORY Kullanıcı VIEW"
    examples:
      - "%command_prefix%HISTORY Kullanıcı VIEW 2"
      - "%command_prefix%HISTORY Kullanıcı VIEW ALL"
    header: "%heading% için geçmiş (%start%-%end% / %total% gösteriliyor):"
    header_title: "%nickname%"
    entry: "#%id% [%date%] %action% - %operator% tarafından — %message%"
    no_entries: "%nickname% için geçmiş girişi bulunamadı."
    page_hint: "Daha fazla giriş için %command% kullanın."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Bir rumuz için tüm geçmiş girişlerini silin."
    help: "Takma adın tüm geçmiş kayıtlarını geri alınamaz biçimde siler."
    example: "%command_prefix%HISTORY Kullanıcı CLEAR"
    success: "%nickname% için %count% geçmiş girişi temizlendi."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Hesap etkinleştirildi"
  resend: "Doğrulama e-postası yeniden gönderildi"
  noexpire_on: "Süre aşımı koruması etkinleştirildi"
  noexpire_off: "Süre aşımı koruması devre dışı bırakıldı"
  userip: "USERIP sorgusu"
  history_clear: "Geçmiş temizlendi"
  password_changed_owner: "Şifre sahibi tarafından değiştirildi"
  password_changed_operator: "Şifre operatör tarafından değiştirildi"
  email_changed_owner: "E-posta %old_email% yerine %new_email% olarak değiştirildi"
  email_changed_operator: "E-posta operatör tarafından %new_email% olarak değiştirildi"
  recover: "Şifre e-posta tokenı ile sıfırlandı"
  saregister: "Hesap yönetimsel olarak kaydedildi"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Eski e-posta: %value%"
  new_email: "Yeni e-posta: %value%"
  method: "Yöntem: %value%"

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <nickname> <şifre> [email]"
  short: "Bir rumuzu yönetimsel olarak kaydedin."
  help: |-
    Sözdizimi: SAREGISTER <nickname> <şifre> [email]

    İstemci doğrulaması veya hız sınırları gerekmeden bir rumuzu
    hemen yönetimsel olarak kaydeder.

    TOKEN modunda kurtarma belirteci operatöre yalnızca bir kez gösterilir.
    EMAIL modunda kurtarma belirteci belirtilen e-posta adresine gönderilir.
  example: "%command_prefix%SAREGISTER Alice Şifre123"
  examples:
    - "%command_prefix%SAREGISTER Bob Şifre456 bob@ornek.tr"
  success_token: "%nickname% rumuzu kaydedildi. Kurtarma belirteci: %token%"
  success_email: "%nickname% rumuzu kaydedildi. Kurtarma belirteci %email% adresine gönderildi."
  invalid_nickname: "Geçersiz rumuz %nickname%."

# --- SASET (IRCop) ------------------------------------------------------------
saset:
  syntax: "SASET <rumuz> {PASSWORD <yeni_şifre>|EMAIL <yeni_e-posta>|LANGUAGE <kod>|TIMEZONE {<zaman_dilimi>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Başka bir rumuzun ayarlarını değiştir."
  help: |-
    IRCop kullanıcısının başka bir kayıtlı takma adın ayarlarını değiştirmesini
    sağlar. Root, IRCop ve hizmet takma adları desteklenmez.
  example: "%command_prefix%SASET Kullanıcı PRIVATE ON"
  examples:
    - "%command_prefix%SASET Kullanıcı TIMEZONE OFF"
  unknown_option: "Bilinmeyen seçenek %option%. Kullanılabilir seçenekler: %options%."
  cannot_modify_oper: "IRC Operatörü rumuzu değiştirilemez."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <rumuz> PASSWORD <yeni_şifre>"
    short: "Bir rumuzun şifresini değiştir."
    help: "Başka bir takma adın parolasını değiştirir. Değişiklik hemen uygulanır."
    example: "%command_prefix%SASET Kullanıcı PASSWORD GüvenliParola123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <rumuz> EMAIL <yeni_e-posta>"
    short: "Bir rumuzun e-postasını değiştir."
    help: |-
      Başka bir takma adın e-posta adresini değiştirir. Değişiklik hemen uygulanır;
      kurtarma tokenı gerekmez ve onay e-postası gönderilmez.
      BADMAIL bu yönetimsel e-posta değişikliğini kısıtlamaz.
    example: "%command_prefix%SASET Kullanıcı EMAIL kullanici@ornek.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <rumuz> LANGUAGE <kod>"
    short: "Bir rumuzun dilini değiştir."
    help: |-
      Başka bir takma adın dilini değiştirir. Bu komutta en (İngilizce) ve es
      (İspanyolca) kullanılabilir.
    example: "%command_prefix%SASET Kullanıcı LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <rumuz> TIMEZONE {<zaman_dilimi>|OFF}"
    short: "Bir rumuzun zaman dilimini değiştir."
    help: |-
      Başka bir takma adın saat dilimini ayarlar veya kaldırır. Kaldırmak için OFF
      kullanın.
    example: "%command_prefix%SASET Kullanıcı TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Kullanıcı TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <rumuz> PRIVATE {ON|OFF}"
    short: "Bir rumuzun gizliliğini değiştir."
    help: "Başka bir takma adın bilgilerinin gizliliğini açar veya kapatır."
    example: "%command_prefix%SASET Kullanıcı PRIVATE ON"
    examples:
      - "%command_prefix%SASET Kullanıcı PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <rumuz> MSG {ON|OFF}"
    short: "Bir rumuzun mesaj tercihini değiştir."
    help: |-
      Başka bir takma ada yanıtların PRIVMSG (ON) veya NOTICE (OFF) olarak
      gönderilmesini ayarlar.
    example: "%command_prefix%SASET Kullanıcı MSG ON"
    examples:
      - "%command_prefix%SASET Kullanıcı MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <rumuz> VHOST [vhost]"
    short: "Bir rumuzun sanal host'unu değiştir."
    help: |-
      Başka bir takma adın sanal ana bilgisayar adını ayarlar veya kaldırır.
      Kaldırmak için SASET <takma_ad> VHOST komutunu değersiz çalıştırın.
    example: "%command_prefix%SASET Kullanıcı VHOST kullanici.ornek.org"
    examples:
      - "%command_prefix%SASET Kullanıcı VHOST"

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Bağlı bir rumuzu rastgele bir rumuza zorla değiştirin."
  help: |-
    Bağlı bir takma adın ağ tarafından tanımlanan önekle rastgele bir ada
    değiştirilmesini zorlar.
  example: "%command_prefix%RENAME Sorunlu"
  cannot_rename_root: "Root kullanıcı %nickname% yeniden adlandırılamaz."
  cannot_rename_oper: "IRC operatörü %nickname% yeniden adlandırılamaz."
  cannot_rename_service: "Hizmet rumuzu %nickname% yeniden adlandırılamaz."
  success: "%nickname% rumuzu %new_nick% olarak değiştirildi."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Bir rumuz için süre sonu korumasını ayarlayın veya kaldırın."
  help: |-
    Takma adın etkin olmama nedeniyle süresinin dolup dolmayacağını denetler.
    ON süre dolmasını önler, OFF normal kuralları uygular.
  example: "%command_prefix%NOEXPIRE Kullanıcı ON"
  examples:
    - "%command_prefix%NOEXPIRE Kullanıcı OFF"
  success_on: "%nickname% rumuzu artık süre sonuna karşı korunuyor."
  success_off: "%nickname% rumuzu artık normal şekilde sona erecek."
  forbidden: "%nickname% rumuzu yasaklanmış."
  suspended: "%nickname% rumuzu askıya alınmış."

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Ağın kayıt kipini yönetir."
  help: |-
    Yeni hesaplar için kayıt modunu yapılandırır.

    %emphasis_0% Doğrulama tokenını kullanıcının e-posta adresine gönderir.
    %emphasis_1% Doğrulama tokenını doğrudan IRC üzerinden iletir.
    %emphasis_2% Değişiklik yapmadan geçerli kayıt modunu gösterir.

    Bekleyen kayıtlar başlatıldıkları modu korur.

    TOKEN modunda RESEND komutu tüm kullanıcılar için devre dışı kalır.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Geçerli kayıt kipi: %mode%."
  changed: "Kayıt kipi %mode% olarak değiştirildi."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <süre> <gerekçe>"
  short: "Bir rumuzu askıya alın."
  help: |-
    Sahibinin kimliğini doğrulamasını engeller. Süre gün (d), saat (h), dakika (m)
    veya süresiz askı için 0 olarak belirtilebilir. IRC operatörleri ve Root
    kullanıcıları askıya alınamaz.
  example: "%command_prefix%SUSPEND MalKullanıcı 7d #yardım kanalında spam"
  examples:
    - "%command_prefix%SUSPEND Sorunlu 0 Yasağı aşma"
  success: "%nickname% rumuzu %duration% tarihine kadar askıya alındı."
  already_suspended: "%nickname% rumuzu zaten askıya alınmış."
  forbidden: "%nickname% rumuzu yasaklanmış ve askıya alınamaz."
  cannot_suspend_oper: "IRC operatörü %nickname% askıya alınamaz."
  cannot_suspend_root: "Root kullanıcı %nickname% askıya alınamaz."
  cannot_suspend_service: "Hizmet rumuzu %nickname% askıya alınamaz."
  invalid_duration: "Geçersiz süre. Kullanın: %duration_format% (örn. 7g, 12s, 30d) veya kalıcı için %permanent%."
  invalid_duration_format: "<g><s><d>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Bir rumuzun askısını kaldırın."
  help: "Sahibinin yeniden kimlik doğrulaması yapabilmesi için etkin askıyı kaldırır."
  example: "%command_prefix%UNSUSPEND Kullanıcı"
  success: "%nickname% adlı kullanıcının askısı kaldırıldı."
  not_suspended: "%nickname% rumuzu askıya alınmamış."

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <gerekçe>"
  short: "Bir rumuzu kalıcı olarak kullanımdan engelleyin."
  help: |-
    Bir takma adın kaydedilmesini veya kullanılmasını kalıcı olarak yasaklar.
    Kayıtlıysa silinir; bağlıysa rastgele bir takma ada geçmesi zorlanır. Root,
    IRCop
    ve hizmet takma adları yasaklanamaz.
  example: "%command_prefix%FORBID MalKullanıcı Tekrarlanan politika ihlalleri"
  success: "%nickname% rumuzu yasaklandı."
  updated: "%nickname% için yasaklama gerekçesi güncellendi."
  reason_required: "Yasaklama için bir gerekçe belirtmelisiniz."
  cannot_forbid_root: "Root kullanıcı %nickname% yasaklanamaz."
  cannot_forbid_oper: "IRC operatörü %nickname% yasaklanamaz."
  cannot_forbid_service: "Hizmet rumuzu %nickname% yasaklanamaz."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Bir rumuz yasağını kaldırın."
  help: "Takma adın yeniden kullanılabilmesi için yasağı kaldırır."
  example: "%command_prefix%UNFORBID YasaklıTakmaAd"
  success: "%nickname% rumuzu artık yasaklı değil."
  not_forbidden: "%nickname% rumuzu yasaklı değil."

# --- FORBIDVHOST (IRCop) ------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <kalıp>|DEL <kalıp>|LIST}"
  short: "Yasaklı vhost kalıplarını yönetin."
  help: |-
    SET VHOST ile eşleşen vhost ayarlarını engelleyen kalıpları yönetir. * herhangi
    bir diziyle, ? tek karakterle eşleşir. IRC operatörü ayrıcalığı gerekir.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Bilinmeyen alt komut %sub%. ADD, DEL veya LIST kullanın."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <kalıp>"
    short: "Yasaklı bir vhost kalıbı ekleyin."
    help: |-
      Listeye bir kalıp ekler. Kullanıcılar SET VHOST ile eşleşen vhost ayarlayamaz.
      * herhangi bir diziyle, ? tek karakterle eşleşir.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Yasaklı vhost kalıbı eklendi: %pattern%"
    already_exists: "%pattern% kalıbı zaten mevcut."
    invalid: "Geçersiz vhost kalıbı formatı."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <kalıp>"
    short: "Yasaklı bir vhost kalıbını kaldırın."
    help: "Yasaklı vhost kalıpları listesinden bir kalıbı siler."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Yasaklı vhost kalıbı kaldırıldı: %pattern%"
    not_found: "%pattern% kalıbı bulunamadı."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Tüm yasaklı vhost kalıplarını listeleyin."
    syntax: "FORBIDVHOST LIST"
    help: "Yasaklı tüm vhost kalıplarını gösterir."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Yasaklı vhost kalıpları (%count%):"
    entry: "%index%. %pattern% — ekleyen: %nickname% (%date%)"
    empty: "Yasaklı vhost kalıbı yok."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Kayıtlı bir rumuzu bırakın."
  help: |-
    Kayıtlı takma adı bekleme süresi sonunda silinmek üzere işaretler; RESTORE ile
    geri alınabilir. Kalıcı silmek için FORCE ekleyin. Root, IRCop, hizmet takma
    adları veya kendi takma adınız silinemez.
  force:
    short: "Silinmeyi bekleyen takma adı kalıcı olarak siler."
  example: "%command_prefix%DROP CuentaAntigua"
  examples:
    - "%command_prefix%DROP CuentaAntigua FORCE"
  suspended: "%nickname% rumuzu askıya alınmış. Önce askıyı kaldırın."
  forbidden: "%nickname% rumuzu yasaklanmış."
  cannot_drop_root: "Root kullanıcı %nickname% bırakılamaz."
  cannot_drop_oper: "IRC operatörü %nickname% bırakılamaz."
  cannot_drop_self: "Kendi rumuzunuzu bırakamazsınız."
  success: "%nickname% rumuzu silinmek üzere işaretlendi ve ödemesiz dönem içinde geri yüklenebilir."
  force_success: "%nickname% rumuzu kalıcı olarak silindi."
  pending_deletion: "%nickname% rumuzu zaten silinmeyi bekliyor. Kalıcı olarak silmek için DROP <nickname> FORCE kullanın."
  cannot_drop_service: "Hizmet rumuzu %nickname% bırakılamaz."

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Silinmeyi bekleyen bir rumuzu geri yükle."
  help: "Bekleme süresi devam ettiği müddetçe silinmeyi bekleyen takma adı geri yükler."
  example: "%command_prefix%RESTORE CuentaAntigua"
  success: "%nickname% rumuzu geri yüklendi."
  not_pending_deletion: "%nickname% rumuzu silinmeyi beklemiyor."

# --- RESCUE -------------------------------------------------------------------
rescue:
  issued: |-
    Kurtarma belirteci: %token_display%

    Bu belirteci güvenli bir yerde saklayın. Parolanızı unutursanız takma adınızı kurtarmak için buna ihtiyacınız olacak.

    Doğrulamak için kullanın: /msg %bot% %verify%

    %warning%
  issued_warning: "ÖNEMLİ: Yalnızca en son oluşturulan belirteç geçerlidir. Doğrulandıktan sonra tekrar gösterilmez. Kimseyle paylaşmayın."
  confirmed: "Kurtarma belirteciniz doğrulandı. Güvenli yerde saklayın."

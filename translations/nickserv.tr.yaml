# NickServ çevirileri — Türkçe
# Alan: nickserv
#
# IRC biçimlendirme kodları (çift tırnaklar veya !irc düz metin blokları):
#   \x02        kalın yazıyı aç/kapat
#   \x03NN      renk (ONDALIK: 03=yeşil, 04=kırmızı, 07=turuncu, 14=koyu gri)
#   \x03        rengi sıfırla
#   \x0F        tüm biçimlendirmeyi sıfırla
#
# IRC renkleri onaltılık değil, ONDALIK sayılar (0-15) kullanır.
#   \x0314 = koyu gri (ondalık 14): DOĞRU
#   \x030F = 0 rengi ve ardından F harfi: HATA
#
# Çok satırlı IRC metni: !irc |- ile gerçek satır sonları ve boşluklar.
# Etiketsiz bloklar kaçışları çözmez; CTCP sabit metinlerini koruyun.
# HELP örnekleri: example/examples ve %command_prefix%.
# Sunum katmanı renksiz /msg ve iki boşlukluk kenar payı ekler.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    \x0304✗\x03 Kayıt beklemede ancak belirteç teslim edilemedi.
    Yeniden kaydolmadan önce bu kaydın süresinin dolmasını bekleyin.
  syntax: "REGISTER <şifre> [email]"
  short: "Rumuzunuzu hizmetlere kaydedin."
  help: |-
    Takma adınızı kaydeder. Ağ yapılandırmasına göre doğrulama tokenı size sohbet
    veya e-posta yoluyla bildirilir.
    Doğrulandıktan sonra kalıcı kurtarma tokenınız olur:
    güvenli bir yerde saklayın.
    %duration% süresi yalnızca doğrulama öncesinde geçerlidir.
    Yönetim tarafından engellenen e-posta alan adları kullanılamaz.
  example: "%command_prefix%\x02\x0303REGISTER Güvenli$Parola_123\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGISTER Güvenli$Parola_123 kullanici@ornek.com\x03\x0F"
  pending: !irc |-
    \x0307→\x03 Doğrulama tokenı \x02%email%\x02 adresine gönderildi.
      Kaydı tamamlamak için /msg %bot% \x0303VERIFY <token>\x03 komutunu çalıştırın.
      Ulaşmadı mı? Spam klasörünü kontrol edin veya /msg %bot% \x0303RESEND\x03 kullanın.
      Token \x02%duration%\x02 içinde sona erecek.
  already_registered: "\x0304✗\x03 \x02%nickname%\x02 rumuzu zaten kayıtlı."
  already_pending: "\x0307→\x03 \x02%nickname%\x02 takma adının kaydı beklemede. \x0303VERIFY <token>\x03 kullanın. Token e-postayla gönderildiyse ve geçerli bir adres tanımlıysa \x0303RESEND\x03 ile yenisini isteyebilirsiniz."
  forbidden: "\x0304✗\x03 \x02%nickname%\x02 rumuzu bu ağda kaydedilemez."
  pending_deletion: "\x0304✗\x03 \x02%nickname%\x02 rumuzu silinmeyi bekliyor ve kaydedilemez."
  invalid_email: "\x0304✗\x03 Sağlanan e-posta adresi geçerli değil."
  email_already_used: "\x0304✗\x03 \x02%email%\x02 e-postası zaten başka bir rumuz tarafından kullanılıyor. Farklı bir adres kullanın."
  throttled: "\x0304✗\x03 Tekrar kayıt olmayı denemeden önce \x02%minutes%\x02 dakika beklemelisiniz."
  guest_prefix_forbidden: "\x0304✗\x03 \x02%prefix%\x02 ile başlayan bir rumuzu kaydedemezsiniz."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Kaydı veya kurtarma belirtecini onaylar."
  help: |-
    Doğrulandıktan sonra bu token kalıcı kurtarma tokenınız olur.
    Güvenli bir yerde saklayın: takma adınızı kurtarmanızı sağlar.
    %duration% süresi yalnızca doğrulama öncesinde geçerlidir.
  example: "%command_prefix%\x02\x0303VERIFY <alınan_token>\x03\x0F"
  success: "\x0303✔\x03 \x02%nickname%\x02 rumuzu başarıyla kaydedildi ve artık kimliğiniz doğrulandı."
  success_native: "\x0303✔\x03 \x02%nickname%\x02 rumuzu başarıyla kaydedildi. Aşağıda gösterilen yerel kimlik doğrulamayı kullanın."
  invalid_token: "\x0304✗\x03 Kurtarma belirteci geçersiz."
  no_pending: "\x0304✗\x03 Doğrulayacak bekleyen bir kaydınız yok."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "\x0307ℹ\x03 Bu kayıt tokenı doğrudan sohbet üzerinden gönderdiği için \x0303RESEND\x03 ile yeni token isteyemezsiniz."
  syntax: "RESEND"
  short: "Doğrulama tokenını e-postanıza yeniden gönderin."
  help: |-
    RESEND yalnızca doğrulama tokenı e-postayla gönderildiyse kullanılabilir.
    Doğrulandıktan sonra bu token kalıcı kurtarma tokenınız olur. Güvenli bir yerde
    saklayın: takma adınızı kurtarmanızı sağlar.
    %duration% süresi yalnızca doğrulama öncesinde geçerlidir.
    RESEND kullandığınızda e-postayla yeni bir token alırsınız.
    Bekleyen kayıt süresi %duration% kadar yenilenir.
  example: "%command_prefix%\x02\x0303RESEND\x03\x0F"
  success: "\x0307→\x03 Doğrulama tokenı \x02%email%\x02 adresine yeniden gönderildi."
  no_pending: "\x0304✗\x03 Doğrulayacak bekleyen bir kaydınız yok."
  throttled: "\x0304✗\x03 Başka bir doğrulama e-postası istemeden önce \x02%minutes%\x02 dakika beklemelisiniz."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "\x0304✗\x03 \x02%nickname%\x02 rumuzu için e-posta ayarlanmamış. Kurtarma kullanılamaz."
  email_sent: "\x0307→\x03 \x02%email_hint%\x02 adresine bir kurtarma tokenı gönderildi. Gelen kutunuzu (ve spam klasörünü) kontrol edin."
  pending_deletion: "\x0304✗\x03 \x02%nickname%\x02 takma adı silinmeyi bekliyor ve kurtarılamaz."
  instructions: "\x0307ℹ\x03 EMAIL: \x0303RECOVER %nickname%\x03 e-postayla geçici belirteç ister. TOKEN: onaylanmış belirtecinizi girin. \x0303RECOVER %nickname% <token>\x03 geçerli e-posta belirtecini veya onaylanmış belirteci kabul eder. E-posta belirteci ancak doğrulandıktan sonra saklananı değiştirir. Saklanan belirteç \x0303VERIFY\x03 ile isteğe bağlı değişiklik sunar; korumak için mesajı yok sayın."
  syntax: "RECOVER <nickname> [token]"
  short: "Şifrenizi kaybettiyseniz rumuzunuzu kurtarın."
  help: |-
    Tokenınız yoksa e-postayla geçici bir token isteyin.
    Geçerli bir kurtarma tokenı da verebilirsiniz; geçiciyse ancak doğrulandıktan
    sonra kayıtlı tokenın yerini alır.
    Kayıtlı tokenı kullandığınızda VERIFY ile isteğe bağlı yenileme önerilir; mevcut
    tokenı korumak istiyorsanız bu mesajı yok sayın.
  example: "%command_prefix%\x02\x0303RECOVER Kullanıcı\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303RECOVER Kullanıcı <alınan_token>\x03\x0F"
  pending: "\x0307→\x03 \x02%nickname%\x02 takma adının kaydı beklemede. \x0303VERIFY <token>\x03 kullanın. Token e-postayla gönderildiyse ve geçerli bir adres tanımlıysa \x0303RESEND\x03 ile yenisini isteyebilirsiniz."
  suspended: "\x0304✗\x03 \x02%nickname%\x02 rumuzu askıya alınmış. Gerekçe: %reason%"
  forbidden: "\x0304✗\x03 \x02%nickname%\x02 rumuzu bu ağda kullanılamaz."
  throttled: "\x0304✗\x03 Çok fazla geçersiz belirteç. \x02%minutes%\x02 dakika sonra tekrar deneyin."
  invalid_token: "\x0304✗\x03 Kurtarma belirteci geçersiz."
  success_identify: "\x0303✔\x03 Şifre sıfırlandı. Şimdi kimlik doğrulayın: \x0303%identify_cmd%\x03"
  success_then_change: "Ardından parolanızı değiştirin: /msg %bot% \x0303SET PASSWORD <yeni_parola>\x03"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <şifre>"
  short: "Kendinizi bir rumuzun sahibi olarak tanımlayın."
  help: !irc |-
    Rumuz ve şifrenizi kullanarak oturumunuzu %nickserv% ile doğrular.
    Başarılı bir kimlik doğrulamadan sonra \x02+r\x02 kayıtlı modunu alacaksınız
    ve, misafir rumuzu kullanıyorsanız, kayıtlı rumuzunuz geri yüklenecektir.
  example: "%command_prefix%\x02\x0303IDENTIFY Kullanıcı <parola>\x03\x0F"
  native_syntax: "/NICK <nickname>:<şifre> | /NICK <nickname>!<şifre>"
  native_short: "Yerel rumuz kimlik doğrulama sözdizimini gösterir."
  native_help: |-
    Bu protokol hesapları rumuz değişiklikleriyle doğrular.
    /NICK <nickname>:<şifre> kullanın veya rumuz kullanımdaysa /NICK <nickname>!<şifre> kullanın.
  native_example: "\x02\x0303/NICK Kullanıcı:<parola>\x03\x0F"
  native_examples:
    - "%command_prefix%\x02\x0303/NICK Kullanıcı!<parola>\x03\x0F"
  native_authentication: "\x0307ℹ\x03 Bu protokol kimlik doğrulamayı rumuz değişiklikleriyle yönetir. \x0303/NICK <nickname>:<şifre>\x03 kullanın veya rumuz kullanımdaysa \x0303/NICK <nickname>!<şifre>\x03 kullanın."
  success: "\x0303✔\x03 Artık \x02%nickname%\x02 olarak tanımlandınız."
  already_identified: "\x0307ℹ\x03 Zaten \x02%nickname%\x02 olarak tanımlısınız."
  invalid_credentials: "\x0304✗\x03 Hatalı şifre. Lütfen tekrar deneyin."
  locked_out: "\x0304✗\x03 Çok fazla başarısız deneme. \x02%minutes%\x02 dakika sonra tekrar deneyin."
  ghost_released: "\x0307⚡\x03 \x02%nickname%\x02 adlı rumuzu tutan hayalet oturum bağlantısı kesildi."
  kill_reason: "%nickname% rumuzu %source% tarafından geri alındı (kayıtlı sahibi kimlik doğruladı)"
  pending: !irc |-
    \x0304✗\x03 \x02%nickname%\x02 takma adı e-posta doğrulaması bekliyor.
      /msg %bot% \x0303VERIFY <token>\x03 veya /msg %bot% \x0303RESEND\x03 komutunu çalıştırın.
  suspended: "\x0304✗\x03 \x02%nickname%\x02 rumuzu askıya alınmış. Gerekçe: %reason%"
  forbidden: "\x0304✗\x03 \x02%nickname%\x02 rumuzu bu ağda kullanılamaz."
  pending_deletion: "\x0304✗\x03 \x02%nickname%\x02 rumuzu silinmeyi bekliyor ve kullanılamaz."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <nickname>"
  short: "Bir rumuzun kayıt durumunu gösterin."
  help: |-
    Bir takma adın güncel durumunu gösterir: kayıtlı, doğrulama bekliyor,
    asıya alınmış vb.
  example: "%command_prefix%\x02\x0303STATUS Kullanıcı\x03\x0F"
  header: "\x02\x0307%nickname%\x03 rumuzunun durumu\x02"
  unregistered: "  Durum           : Kayıtlı değil"
  not_registered_offline: "  Durum           : \x0315Kayıtlı değil\x03"
  pending: "  Durum           : \x0307Doğrulama bekliyor\x03"
  pending_expires: "  Sona erme        : %minutes% dakika"
  pending_expires_at: "  Sona erme tarihi : %date%"
  not_connected: "  Durum           : \x0315Bağlı değil\x03"
  not_identified: "  Durum           : \x0307Kimlik doğrulanmamış\x03"
  identified: "  Durum           : \x0303Kimlik doğrulandı\x03"
  suspended: "  Durum           : \x0304Askıya alındı\x03"
  suspended_reason: "  Gerekçe         : %reason%"
  suspended_until: "  Bitiş tarihi     : %date%"
  suspended_permanent: "  Bitiş tarihi     : Kalıcı"
  forbidden: "  Durum           : \x0304Yasaklandı\x03"
  forbidden_reason: "  Gerekçe         : %reason%"
  pending_deletion: "  \x0314Durum\x03          : \x0307Silinmeyi bekliyor\x03"
  pending_deletion_at: "  \x0314Silindi\x03         : %date%"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <nickname>"
  short: "Kayıtlı bir rumuz hakkında bilgi gösterin."
  help: |-
    Takma adın kayıt bilgilerini gösterir: kayıt tarihi, bağlantı durumu, son
    gönderilen ileti ve e-posta adresi.

    E-posta yalnızca kimliği doğrulanmış sahibine görünür.
    Takma ad gizliyse bilgileri yalnızca sahibi ve IRC operatörleri görebilir.
  example: "%command_prefix%\x02\x0303INFO Kullanıcı\x03\x0F"
  private: "\x0304✗\x03 \x02%nickname%\x02 rumuzunun bilgileri gizlidir."
  header: "\x02\x0307%nickname%\x03 rumuzu için bilgi\x02"
  status: "  \x0314Durum\x03              : %status%"
  status_registered: "\x0303Kayıtlı\x03"
  status_suspended: "\x0304Askıya alındı\x03"
  status_forbidden: "\x0304Yasaklandı\x03"
  status_pending_deletion: "\x0307Silinmeyi bekliyor\x03"
  reason: "  \x0314Gerekçe\x03            : %reason%"
  suspended_until: "  \x0314Bitiş tarihi\x03       : %date%"
  suspended_permanent: "  \x0314Bitiş tarihi\x03       : Kalıcı"
  registered_at: "  \x0314Kayıt\x03              : %date%"
  last_seen_online: "  \x0314Son görülme\x03        : \x0303● ŞİMDİ ÇEVRİMİÇİ\x03"
  last_seen_at: "  \x0314Son görülme\x03        : %date%"
  last_seen_never: "  \x0314Son görülme\x03        : Hiç"
  last_quit: "  \x0314Son çıkış msj\x03      : %message%"
  last_connect: "  \x0314Son görülme (adr)\x03  : %ip% (%host%)"
  language: "  \x0314Dil\x03                : %language%"
  email: "  \x0314E-posta\x03            : %email%"
  vhost: "  \x0314VHost\x03              : %vhost%"
  no_expire: "  \x0314Hiç Sona Ermez\x03     : Evet"
  pending_deletion_at: "  \x0314Silindi\x03                : %date%"
  pending_deletion_until: "  \x0314Kalıcı silinme\x03         : %date%"
  pending_deletion_notice: "  \x0307Bu rumuz silinmeyi bekliyor ve kaydedilemez.\x03"
  channels_header: !irc |-
    \x0314
    Erişim sahibi olunan kanallar:\x03
  channels_entry_founder: "  %channel% (\x0303Kurucu\x03)"
  channels_entry_successor: "  %channel% (\x0303Halef\x03)"
  channels_entry_access: "  %channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <yeni_şifre>|EMAIL <email> <token>|LANGUAGE <kod>|TIMEZONE <zaman_dilimi>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Rumuz seçeneklerinizi değiştirin."
  help: |-
    Takma adınızın ayarlarını değiştirir. Bu seçenekleri değiştirmek için
    kimliğiniz doğrulanmış olmalıdır.
  example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
  unknown_option: "\x0304✗\x03 Bilinmeyen seçenek \x02%option%\x02. Kullanılabilir seçenekler: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <yeni_şifre>"
    short: "Rumuz şifrenizi değiştirin."
    help: |-
      Rumuzunuzun şifresini değiştirir. Yeni şifre hemen geçerli olur.
      En az 6 karakterden oluşan, başka hizmetlerde kullanmadığınız
      güçlü bir şifre seçin.
    example: "%command_prefix%\x02\x0303SET PASSWORD Güvenli$Parola_123\x03\x0F"
    success: "\x0303✔\x03 Şifreniz başarıyla güncellendi."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "\x0304✗\x03 Onaylanmış kurtarma belirtecinizle \x0303SET EMAIL <email> <token>\x03 kullanın."
    syntax: "SET EMAIL <email> <token>"
    short: "Onaylanmış kurtarma tokenınızla e-posta adresini değiştirir."
    help: |-
      SET EMAIL, kurtarma tokenını tüketmeden doğruladıktan sonra iletişim e-postasını
      değiştirir. Biçimi ve benzersizliği denetler; onay e-postası göndermez.
      Yönetim tarafından engellenen e-posta alan adları kullanılamaz.
    example: "%command_prefix%\x02\x0303SET EMAIL kullanici@ornek.com <token_confirmado>\x03\x0F"
    success: "\x0303✔\x03 E-postanız \x02%email%\x02 olarak güncellendi."
    pending_sent: !irc |-
      \x0307→\x03 Onay tokenı \x02%current_email%\x02 adresine gönderildi.
        \x02%new_email%\x02 adresine geçişi onaylamak için şunu çalıştırın:
        /msg %bot% \x0303SET EMAIL %new_email% <token>\x03
        Token bir saat içinde sona erecek.
    invalid_token: "\x0304✗\x03 Token geçersiz veya süresi dolmuş. \x0303SET EMAIL <yeni_e-posta>\x03 ile yeni bir tane isteyin."

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <kod>"
    short: "Hizmetlerin sizinle iletişim kurarken kullandığı dili değiştirin."
    help: !irc |-
      %nickserv% ve diğer hizmetlerin sizinle konuşurken kullandığı dili değiştirir.
      Kullanılabilir diller:
        \x02ca\x02 (Katalanca)
        \x02de\x02 (Almanca)
        \x02el\x02 (Yunanca)
        \x02en\x02 (İngilizce)
        \x02es\x02 (İspanyolca)
        \x02eu\x02 (Baskça)
        \x02fr\x02 (Fransızca)
        \x02gl\x02 (Galiçyaca)
        \x02it\x02 (İtalyanca)
        \x02nl\x02 (Felemenkçe)
        \x02pl\x02 (Lehçe)
        \x02pt\x02 (Portekizce)
        \x02ro\x02 (Rumence)
        \x02tr\x02 (Türkçe)
    example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
    success: "\x0303✔\x03 Dil \x02%language%\x02 olarak değiştirildi."
    invalid: "\x0304✗\x03 Desteklenmeyen dil. Kullanılabilir diller: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <zaman_dilimi>"
    short: "Tarihleri görüntülerken kullanılacak zaman dilimini ayarlayın."
    help: |-
      %nickserv% tarafından tarihleri gösterirken kullanılan saat dilimini ayarlar.
      Bölgeleri görmek için HELP SET TIMEZONE kullanın. Kaldırmak için OFF kullanın.
    example: "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET TIMEZONE OFF\x03\x0F"
    success: "\x0303✔\x03 Zaman dilimi \x02%timezone%\x02 olarak ayarlandı. Tarihler bu zaman diliminde gösterilecek."
    cleared: "\x0303✔\x03 Zaman dilimi temizlendi. Tarihler ağ varsayılanını kullanacak."
    invalid: "\x0304✗\x03 Geçersiz zaman dilimi \x02%timezone%\x02. Geçerli bir tanımlayıcı kullanın (örn. UTC, Europe/Istanbul)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Takma adınızın bilgilerini gösterir veya gizler."
    help: !irc |-
      INFO komutunda rumuz bilgilerinizin görünürlüğünü kontrol eder.
      \x02PRIVATE AÇIK\x02 ile bilgilerinizi yalnızca siz ve IRC Operatörleri görebilir.
      \x02PRIVATE KAPALI\x02 ile bilgileriniz herkese açıktır.
    example: "%command_prefix%\x02\x0303SET PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET PRIVATE OFF\x03\x0F"
    on: "\x0303✔\x03 Rumuz bilgileriniz artık \x02gizlidir\x02."
    off: "\x0303✔\x03 Rumuz bilgileriniz artık \x02herkese açıktır\x02."

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Hizmetlerin sizinle nasıl iletişim kuracağını değiştirir."
    help: !irc |-
      %nickserv% ve diğer hizmetlerin size nasıl mesaj göndereceğini belirler.
      \x02MSG ON\x02 yanıtları \x02PRIVMSG\x02 olarak gönderir.
      \x02MSG OFF\x02 yanıtları \x02NOTICE\x02 olarak gönderir.
    example: "%command_prefix%\x02\x0303SET MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET MSG OFF\x03\x0F"
    on: "\x0303✔\x03 Hizmet mesajları artık \x02PRIVMSG\x02 olarak gönderilecek."
    off: "\x0303✔\x03 Hizmet mesajları artık \x02NOTICE\x02 olarak gönderilecek."

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Sanal ana bilgisayar adınızı ayarlar veya kaldırır."
    help: !irc |-
      Kimliğiniz doğrulandığında diğer kullanıcıların göreceği özel bir ana bilgisayar
      adı ayarlar.

      Kaldırmak için değer belirtmeden \x02SET VHOST\x02 komutunu çalıştırın.

      Yalnızca harfler (a-z, A-Z), rakamlar, tire ve noktalar kullanılabilir.
      Her bölüm harf veya rakamla başlayıp bitmelidir.
      Ad en fazla 48 karakter olabilir ve takma ad başına benzersiz olmalıdır.
    example: "%command_prefix%\x02\x0303SET VHOST kullanici.ornek.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET VHOST\x03\x0F"
    success: "\x0303✔\x03 Sanal host'unuz \x02%vhost%\x02 olarak ayarlandı."
    cleared: "\x0303✔\x03 Sanal host'unuz temizlendi."
    invalid: "\x0304✗\x03 Geçersiz vhost. Yalnızca harfler, rakamlar, tire ve nokta (blok başında/sonunda olamaz); maks 48 karakter."
    taken: "\x0304✗\x03 Bu vhost zaten başka bir rumuz tarafından kullanılıyor."
    forced: "\x0304✗\x03 Vhost'unuz otomatik olarak yapılandırılmıştır ve SET VHOST ile değiştirilemez."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <rumuz> {PASSWORD <yeni_şifre>|EMAIL <yeni_e-posta>|LANGUAGE <kod>|TIMEZONE {<zaman_dilimi>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Başka bir rumuzun ayarlarını değiştir."
  help: |-
    IRCop kullanıcısının başka bir kayıtlı takma adın ayarlarını değiştirmesini
    sağlar. Root, IRCop ve hizmet takma adları desteklenmez.
  example: "%command_prefix%\x02\x0303SASET Kullanıcı PRIVATE ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SASET Kullanıcı TIMEZONE OFF\x03\x0F"
  unknown_option: "\x0304✗\x03 Bilinmeyen seçenek \x02%option%\x02. Kullanılabilir seçenekler: %options%."
  cannot_modify_oper: "\x0304✗\x03 IRC Operatörü rumuzu değiştirilemez."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <rumuz> PASSWORD <yeni_şifre>"
    short: "Bir rumuzun şifresini değiştir."
    help: "Başka bir takma adın parolasını değiştirir. Değişiklik hemen uygulanır."
    example: "%command_prefix%\x02\x0303SASET Kullanıcı PASSWORD GüvenliParola123\x03\x0F"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <rumuz> EMAIL <yeni_e-posta>"
    short: "Bir rumuzun e-postasını değiştir."
    help: |-
      Başka bir takma adın e-posta adresini değiştirir. Değişiklik hemen uygulanır;
      kurtarma tokenı gerekmez ve onay e-postası gönderilmez.
      BADMAIL bu yönetimsel e-posta değişikliğini kısıtlamaz.
    example: "%command_prefix%\x02\x0303SASET Kullanıcı EMAIL kullanici@ornek.com\x03\x0F"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <rumuz> LANGUAGE <kod>"
    short: "Bir rumuzun dilini değiştir."
    help: |-
      Başka bir takma adın dilini değiştirir. Bu komutta en (İngilizce) ve es
      (İspanyolca) kullanılabilir.
    example: "%command_prefix%\x02\x0303SASET Kullanıcı LANGUAGE es\x03\x0F"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <rumuz> TIMEZONE {<zaman_dilimi>|OFF}"
    short: "Bir rumuzun zaman dilimini değiştir."
    help: |-
      Başka bir takma adın saat dilimini ayarlar veya kaldırır. Kaldırmak için OFF
      kullanın.
    example: "%command_prefix%\x02\x0303SASET Kullanıcı TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Kullanıcı TIMEZONE OFF\x03\x0F"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <rumuz> PRIVATE {ON|OFF}"
    short: "Bir rumuzun gizliliğini değiştir."
    help: "Başka bir takma adın bilgilerinin gizliliğini açar veya kapatır."
    example: "%command_prefix%\x02\x0303SASET Kullanıcı PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Kullanıcı PRIVATE OFF\x03\x0F"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <rumuz> MSG {ON|OFF}"
    short: "Bir rumuzun mesaj tercihini değiştir."
    help: |-
      Başka bir takma ada yanıtların PRIVMSG (ON) veya NOTICE (OFF) olarak
      gönderilmesini ayarlar.
    example: "%command_prefix%\x02\x0303SASET Kullanıcı MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Kullanıcı MSG OFF\x03\x0F"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <rumuz> VHOST [vhost]"
    short: "Bir rumuzun sanal host'unu değiştir."
    help: |-
      Başka bir takma adın sanal ana bilgisayar adını ayarlar veya kaldırır.
      Kaldırmak için SASET <takma_ad> VHOST komutunu değersiz çalıştırın.
    example: "%command_prefix%\x02\x0303SASET Kullanıcı VHOST kullanici.ornek.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Kullanıcı VHOST\x03\x0F"

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [komut]"
  short: "%nickserv% komutları için yardım gösterin."
  help: |-
    Genel %nickserv% yardımını veya belirli bir komut için
    ayrıntılı bilgi gösterir.
  examples_header: "\x02 ■ Örnekler:\x02"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET TIMEZONE Europe\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  navigation_marker: "\x0310›\x03\x0F"
  info_marker: "\x0310ℹ\x03\x0F"
  error_marker: "\x0304✗\x03\x0F"
  warning_marker: "\x0304⚠\x03\x0F"
  intro: |-
    Takma adınızı kaydedip başkalarının kullanmasını önlemek için korur. Hesap
    güvenliğini yönetin, tercihlerinizi özelleştirin ve gerektiğinde erişimi
    kurtarın.
  intro_expiration: "%marker% %label%: \x1F\x0304%days% günden\x03\x1F uzun süre kullanılmayan takma adlar otomatik olarak silinir."
  intro_expiration_label: "NOT"
  general_header: "\x02 ■ Kullanılabilir komutlar:\x02"
  command_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Seçenekler:\x02"
  general_syntax: "HELP <komut>"
  general_footer: "%marker% Daha fazla bilgi için /msg %bot% \x02\x0303%syntax%\x03\x0F kullanın."
  set_sub_syntax: "HELP %command% <seçenek>"
  set_sub_footer: "%marker% Daha fazla bilgi için /msg %bot% \x02\x0303%syntax%\x03\x0F kullanın."
  syntax_label: "Sözdizimi: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_auth: "Kayıt ve kimlik doğrulama"
    account_security: "Hesap ve güvenlik"
  ircop_group:
    lookup: "Arama ve inceleme"
    account_management: "Hesap yönetimi"
    suspensions_bans: "Askıya alma ve yasaklar"
    deletion: "Silme ve geri yükleme"
  ircop_header: "\x02 ■ IRC operatörleri için kullanılabilir komutlar:\x02"
  set_timezone:
    index_label: "Bölgeye göre saat dilimleri (bölge sorgulamak için \x02\x0303%syntax%\x03\x0F kullanın):"
    index_syntax: "HELP SET TIMEZONE <bölge>"
    region_header: "\x02 ■ %region% için zaman dilimleri:\x02"
    region_unknown: "%marker% Bilinmeyen bölge. Dizin için \x02\x0303%syntax%\x03\x0F kullanın."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "\x0304⚠\x03 \x02%nickname%\x02 rumuzu kayıtlıdır. Kimlik doğrulamazsanız adınız değiştirilecektir."
  renamed_to: !irc |-
    \x0307→\x03 Takma adınız \x02%guest_nick%\x02 olarak değiştirildi. Takma adınızı geri almak için:
    /msg %bot% \x0303IDENTIFY %nickname% <parola>\x03
  nick_forbidden: "\x0304✗\x03 \x02%nickname%\x02 rumuzu yasaklanmıştır: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Rumuzun gerçek IP adresini ve host adını öğrenin."
  help: |-
    Bir takma adın gerçek IP adresini ve ana bilgisayar adını gösterir.
    Sorumlu kullanın: bu hassas bilgidir.
  example: "%command_prefix%\x02\x0303USERIP Kullanıcı\x03\x0F"
  result: "\x0307ℹ\x03 Rumuz: \x02%nickname%\x02 | IP: \x0307%ip%\x03 | Host: \x0307%host%\x03"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Son tanımlanmış bağlantılarının IP adresine göre takma adları bulur."
  help: |-
    Son kimlik doğrulanmış bağlantısı bu IP adresini kullanan kayıtlı takma
    adları gösterir. Kaydedilen adres güncel olmayabilir.
  example: "%command_prefix%\x02\x0303WHOIP 192.0.2.10\x03\x0F"
  empty: "Bu IP adresiyle eşleşen kayıtlı takma ad yok."
  header: "Eşleşen takma adlar:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <süre> <gerekçe>"
  short: "Bir rumuzu askıya alın."
  help: |-
    Sahibinin kimliğini doğrulamasını engeller. Süre gün (d), saat (h), dakika (m)
    veya süresiz askı için 0 olarak belirtilebilir. IRC operatörleri ve Root
    kullanıcıları askıya alınamaz.
  example: "%command_prefix%\x02\x0303SUSPEND MalKullanıcı 7d #yardım kanalında spam\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND Sorunlu 0 Yasağı aşma\x03\x0F"
  success: "\x0303✔\x03 \x02%nickname%\x02 rumuzu \x02%duration%\x02 tarihine kadar askıya alındı."
  already_suspended: "\x0304✗\x03 \x02%nickname%\x02 rumuzu zaten askıya alınmış."
  forbidden: "\x0304✗\x03 \x02%nickname%\x02 rumuzu yasaklanmış ve askıya alınamaz."
  cannot_suspend_oper: "\x0304✗\x03 IRC operatörü \x02%nickname%\x02 askıya alınamaz."
  cannot_suspend_root: "\x0304✗\x03 Root kullanıcı \x02%nickname%\x02 askıya alınamaz."
  cannot_suspend_service: "\x0304✗\x03 Hizmet rumuzu \x02%nickname%\x02 askıya alınamaz."
  invalid_duration: "\x0304✗\x03 Geçersiz süre. Kullanın: \x0303<g><s><d>\x03 (örn. 7g, 12s, 30d) veya kalıcı için \x03030\x03."

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Bir rumuzun askısını kaldırın."
  help: "Sahibinin yeniden kimlik doğrulaması yapabilmesi için etkin askıyı kaldırır."
  example: "%command_prefix%\x02\x0303UNSUSPEND Kullanıcı\x03\x0F"
  success: "\x0303✔\x03 \x02%nickname%\x02 adlı kullanıcının askısı kaldırıldı."
  not_suspended: "\x0304✗\x03 \x02%nickname%\x02 rumuzu askıya alınmamış."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Bağlı bir rumuzu rastgele bir rumuza zorla değiştirin."
  help: |-
    Bağlı bir takma adın ağ tarafından tanımlanan önekle rastgele bir ada
    değiştirilmesini zorlar.
  example: "%command_prefix%\x02\x0303RENAME Sorunlu\x03\x0F"
  cannot_rename_root: "\x0304✗\x03 Root kullanıcı \x02%nickname%\x02 yeniden adlandırılamaz."
  cannot_rename_oper: "\x0304✗\x03 IRC operatörü \x02%nickname%\x02 yeniden adlandırılamaz."
  cannot_rename_service: "\x0304✗\x03 Hizmet rumuzu \x02%nickname%\x02 yeniden adlandırılamaz."
  success: "\x0303✓\x03 \x02%nickname%\x02 rumuzu \x02%new_nick%\x02 olarak değiştirildi."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Kayıtlı bir rumuzu bırakın."
  help: |-
    Kayıtlı takma adı bekleme süresi sonunda silinmek üzere işaretler; RESTORE ile
    geri alınabilir. Kalıcı silmek için FORCE ekleyin. Root, IRCop, hizmet takma
    adları veya kendi takma adınız silinemez.
  force:
    short: "Silinmeyi bekleyen takma adı kalıcı olarak siler."
  example: "%command_prefix%\x02\x0303DROP CuentaAntigua\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP CuentaAntigua FORCE\x03\x0F"
  suspended: "\x0304✗\x03 \x02%nickname%\x02 rumuzu askıya alınmış. Önce askıyı kaldırın."
  forbidden: "\x0304✗\x03 \x02%nickname%\x02 rumuzu yasaklanmış."
  cannot_drop_root: "\x0304✗\x03 Root kullanıcı \x02%nickname%\x02 bırakılamaz."
  cannot_drop_oper: "\x0304✗\x03 IRC operatörü \x02%nickname%\x02 bırakılamaz."
  cannot_drop_self: "\x0304✗\x03 Kendi rumuzunuzu bırakamazsınız."
  success: "\x0303✓\x03 \x02%nickname%\x02 rumuzu silinmek üzere işaretlendi ve ödemesiz dönem içinde geri yüklenebilir."
  force_success: "\x0303✓\x03 \x02%nickname%\x02 rumuzu kalıcı olarak silindi."
  pending_deletion: "\x0304✗\x03 \x02%nickname%\x02 rumuzu zaten silinmeyi bekliyor. Kalıcı olarak silmek için DROP <nickname> FORCE kullanın."
  cannot_drop_service: "\x0304✗\x03 Hizmet rumuzu \x02%nickname%\x02 bırakılamaz."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Silinmeyi bekleyen bir rumuzu geri yükle."
  help: "Bekleme süresi devam ettiği müddetçe silinmeyi bekleyen takma adı geri yükler."
  example: "%command_prefix%\x02\x0303RESTORE CuentaAntigua\x03\x0F"
  success: "\x0303✓\x03 \x02%nickname%\x02 rumuzu geri yüklendi."
  not_pending_deletion: "\x0304✗\x03 \x02%nickname%\x02 rumuzu silinmeyi beklemiyor."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <gerekçe>"
  short: "Bir rumuzu kalıcı olarak kullanımdan engelleyin."
  help: |-
    Bir takma adın kaydedilmesini veya kullanılmasını kalıcı olarak yasaklar.
    Kayıtlıysa silinir; bağlıysa rastgele bir takma ada geçmesi zorlanır. Root,
    IRCop
    ve hizmet takma adları yasaklanamaz.
  example: "%command_prefix%\x02\x0303FORBID MalKullanıcı Tekrarlanan politika ihlalleri\x03\x0F"
  success: "\x0303✔\x03 \x02%nickname%\x02 rumuzu yasaklandı."
  updated: "\x0303✔\x03 \x02%nickname%\x02 için yasaklama gerekçesi güncellendi."
  reason_required: "\x0304✗\x03 Yasaklama için bir gerekçe belirtmelisiniz."
  cannot_forbid_root: "\x0304✗\x03 Root kullanıcı \x02%nickname%\x02 yasaklanamaz."
  cannot_forbid_oper: "\x0304✗\x03 IRC operatörü \x02%nickname%\x02 yasaklanamaz."
  cannot_forbid_service: "\x0304✗\x03 Hizmet rumuzu \x02%nickname%\x02 yasaklanamaz."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Bir rumuz yasağını kaldırın."
  help: "Takma adın yeniden kullanılabilmesi için yasağı kaldırır."
  example: "%command_prefix%\x02\x0303UNFORBID YasaklıTakmaAd\x03\x0F"
  success: "\x0303✔\x03 \x02%nickname%\x02 rumuzu artık yasaklı değil."
  not_forbidden: "\x0304✗\x03 \x02%nickname%\x02 rumuzu yasaklı değil."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <kalıp>|DEL <kalıp>|LIST}"
  short: "Yasaklı vhost kalıplarını yönetin."
  help: |-
    SET VHOST ile eşleşen vhost ayarlarını engelleyen kalıpları yönetir. * herhangi
    bir diziyle, ? tek karakterle eşleşir. IRC operatörü ayrıcalığı gerekir.
  example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Bilinmeyen alt komut \x02%sub%\x02. ADD, DEL veya LIST kullanın."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <kalıp>"
    short: "Yasaklı bir vhost kalıbı ekleyin."
    help: |-
      Listeye bir kalıp ekler. Kullanıcılar SET VHOST ile eşleşen vhost ayarlayamaz.
      * herhangi bir diziyle, ? tek karakterle eşleşir.
    example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Yasaklı vhost kalıbı eklendi: \x02%pattern%\x02"
    already_exists: "\x0304✗\x03 \x02%pattern%\x02 kalıbı zaten mevcut."
    invalid: "\x0304✗\x03 Geçersiz vhost kalıbı formatı."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <kalıp>"
    short: "Yasaklı bir vhost kalıbını kaldırın."
    help: "Yasaklı vhost kalıpları listesinden bir kalıbı siler."
    example: "%command_prefix%\x02\x0303FORBIDVHOST DEL *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Yasaklı vhost kalıbı kaldırıldı: \x02%pattern%\x02"
    not_found: "\x0304✗\x03 \x02%pattern%\x02 kalıbı bulunamadı."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Tüm yasaklı vhost kalıplarını listeleyin."
    syntax: "FORBIDVHOST LIST"
    help: "Yasaklı tüm vhost kalıplarını gösterir."
    example: "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
    header: "\x0307ℹ\x03 Yasaklı vhost kalıpları (\x02%count%\x02):"
    entry: "  %index%. \x0304%pattern%\x03 — ekleyen: %nickname% (%date%)"
    empty: "\x0307ℹ\x03 Yasaklı vhost kalıbı yok."

# --- HISTORY ---
history:
  syntax: "HISTORY <nickname> {ADD <mesaj>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Rumuz eylem geçmişini görüntüleyin veya yönetin."
  help: |-
    Takma adın işlem geçmişini görüntüler ve yönetir. Askıya alma, parola veya
    e-posta değişiklikleri ve kurtarma işlemleri otomatik kaydedilir. VIEW sayfa
    başına
    üç kayıt gösterir; ALL tüm geçmişi gösterir.
  example: "%command_prefix%\x02\x0303HISTORY Kullanıcı VIEW\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HISTORY Kullanıcı VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY Kullanıcı ADD Elle eklenen not\x03\x0F"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <mesaj>"
    short: "Manuel bir geçmiş girişi ekleyin."
    help: "Takma ad geçmişine elle bir kayıt ekler."
    example: "%command_prefix%\x02\x0303HISTORY Kullanıcı ADD Spam nedeniyle bildirildi\x03\x0F"
    success: "\x0303✔\x03 \x02%nickname%\x02 için geçmiş girişi eklendi."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "ID ile bir geçmiş girişini silin."
    help: "Geçmişteki belirli bir kaydı kimliğine göre siler."
    example: "%command_prefix%\x02\x0303HISTORY Kullanıcı DEL 42\x03\x0F"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [SAYFA|ALL]"
    short: "Rumuz eylem geçmişini görüntüleyin."
    help: |-
      Takma adın işlem geçmişini gösterir. Varsayılan olarak sayfa başına üç kayıt
      gösterilir. Tümünü görmek için ALL kullanın.
    example: "%command_prefix%\x02\x0303HISTORY Kullanıcı VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY Kullanıcı VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY Kullanıcı VIEW ALL\x03\x0F"
    header: "\x02\x0307%nickname%\x03\x02 için geçmiş (%start%-%end% / %total% gösteriliyor):"
    entry: "#%id% [%date%] \x0303%action%\x03 - %operator% tarafından — %message%"
    no_entries: "\x0307ℹ\x03 \x02%nickname%\x02 için geçmiş girişi bulunamadı."
    page_hint: "Daha fazla giriş için \x0303HISTORY %nickname% VIEW %next_page%\x03 kullanın."

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Bir rumuz için tüm geçmiş girişlerini silin."
    help: "Takma adın tüm geçmiş kayıtlarını geri alınamaz biçimde siler."
    example: "%command_prefix%\x02\x0303HISTORY Kullanıcı CLEAR\x03\x0F"
    success: "\x0303✔\x03 \x02%nickname%\x02 için \x02%count%\x02 geçmiş girişi temizlendi."


    Genel %nickserv% yardımını veya belirli bir komut için
    ayrıntılı bilgi gösterir.
  examples_header: "Örnekler:"
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP SET"
    - "%command_prefix%HELP SET EMAIL"
    - "%command_prefix%HELP SET TIMEZONE Europe"
  header_title: "%bot%"
  header: "%title%"
  navigation_marker: ""
  info_marker: ""
  error_marker: ""
  warning_marker: ""
  intro: |-
    Takma adınızı kaydedip başkalarının kullanmasını önlemek için korur. Hesap
    güvenliğini yönetin, tercihlerinizi özelleştirin ve gerektiğinde erişimi
    kurtarın.
  intro_expiration: "%label%: %duration% uzun süre kullanılmayan takma adlar otomatik olarak silinir."
  intro_expiration_duration: "%days% günden"
  intro_expiration_label: "NOT"
  general_header: "Kullanılabilir komutlar:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Seçenekler:"

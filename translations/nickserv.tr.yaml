# NickServ çevirileri — Türkçe
# Alan: nickserv
#
# IRC biçimlendirme kodları (çift tırnaklar veya !irc düz metin blokları):
#   \x02        kalın yazıyı aç/kapat
#   \x03NN      renk (ONDALIK: 03=yeşil, 04=kırmızı, 07=turuncu, 14=koyu gri)
#   \x03        rengi sıfırla
#   \x0F        tüm biçimlendirmeyi sıfırla
#
# IRC renkleri onaltılık değil, ONDALIK sayılar (0-15) kullanır.
#   \x0314 = koyu gri (ondalık 14): DOĞRU
#   \x030F = 0 rengi ve ardından F harfi: HATA
#
# Çok satırlı IRC metni: !irc |- ile gerçek satır sonları ve boşluklar.
# Etiketsiz bloklar kaçışları çözmez; CTCP sabit metinlerini koruyun.
# HELP örnekleri: example/examples ve %command_prefix%.
# Sunum katmanı renksiz /msg ve iki boşlukluk kenar payı ekler.

# --- REGISTER -----------------------------------------------------------------
register:
  token_unavailable: !irc |-
    Kayıt beklemede ancak belirteç teslim edilemedi.
    Yeniden kaydolmadan önce bu kaydın süresinin dolmasını bekleyin.
  syntax: "REGISTER <şifre> [email]"
  short: "Rumuzunuzu hizmetlere kaydedin."
  help: |-
    Takma adınızı kaydeder. Ağ yapılandırmasına göre doğrulama tokenı size sohbet
    veya e-posta yoluyla bildirilir.
    Doğrulandıktan sonra kalıcı kurtarma tokenınız olur:
    güvenli bir yerde saklayın.
    %duration% süresi yalnızca doğrulama öncesinde geçerlidir.
    Yönetim tarafından engellenen e-posta alan adları kullanılamaz.
  example: "%command_prefix%REGISTER Güvenli$Parola_123"
  examples:
    - "%command_prefix%REGISTER Güvenli$Parola_123 kullanici@ornek.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Doğrulama tokenı %email% adresine gönderildi."
  pending_line_2: "Kaydı tamamlamak için /msg %bot% %verify% komutunu çalıştırın."
  pending_line_3: "Ulaşmadı mı? Spam klasörünü kontrol edin veya /msg %bot% %resend% kullanın."
  pending_line_4: "Token %duration% içinde sona erecek."
  already_registered: "%nickname% rumuzu zaten kayıtlı."
  already_pending: "%nickname% takma adının kaydı beklemede. %verify% kullanın. Token e-postayla gönderildiyse ve geçerli bir adres tanımlıysa %resend% ile yenisini isteyebilirsiniz."
  forbidden: "%nickname% rumuzu bu ağda kaydedilemez."
  pending_deletion: "%nickname% rumuzu silinmeyi bekliyor ve kaydedilemez."
  invalid_email: "Sağlanan e-posta adresi geçerli değil."
  email_already_used: "%email% e-postası zaten başka bir rumuz tarafından kullanılıyor. Farklı bir adres kullanın."
  throttled: "Tekrar kayıt olmayı denemeden önce %minutes% dakika beklemelisiniz."
  guest_prefix_forbidden: "%prefix% ile başlayan bir rumuzu kaydedemezsiniz."

# --- IDENTIFY -----------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <şifre>"
  short: "Kendinizi bir rumuzun sahibi olarak tanımlayın."
  help: |-
    Rumuz ve şifrenizi kullanarak oturumunuzu %nickserv% ile doğrular.
    Başarılı bir kimlik doğrulamadan sonra %emphasis_0% kayıtlı modunu alacaksınız
    ve, misafir rumuzu kullanıyorsanız, kayıtlı rumuzunuz geri yüklenecektir.
  example: "%command_prefix%IDENTIFY Kullanıcı <parola>"
  native_syntax: "/NICK <nickname>:<şifre> | /NICK <nickname>!<şifre>"
  native_short: "Yerel rumuz kimlik doğrulama sözdizimini gösterir."
  native_help: |-
    Bu protokol hesapları rumuz değişiklikleriyle doğrular.
    %emphasis_0% kullanın veya rumuz kullanımdaysa %emphasis_1% kullanın.
  native_example: "/NICK Kullanıcı:<parola>"
  native_examples:
    - "%command_prefix%/NICK Kullanıcı!<parola>"
  native_authentication: "Bu protokol kimlik doğrulamayı rumuz değişiklikleriyle yönetir. %command_0% kullanın veya rumuz kullanımdaysa %command_1% kullanın."
  native_authentication_command_0: "/NICK <nickname>:<şifre>"
  native_authentication_command_1: "/NICK <nickname>!<şifre>"
  success: "Artık %nickname% olarak tanımlandınız."
  already_identified: "Zaten %nickname% olarak tanımlısınız."
  invalid_credentials: "Hatalı şifre. Lütfen tekrar deneyin."
  locked_out: "Çok fazla başarısız deneme. %minutes% dakika sonra tekrar deneyin."
  ghost_released: "%nickname% adlı rumuzu tutan hayalet oturum bağlantısı kesildi."
  kill_reason: "%nickname% rumuzu %source% tarafından geri alındı (kayıtlı sahibi kimlik doğruladı)"
  pending: |-
    %first%
    %second%
  pending_line_1: "%nickname% takma adı e-posta doğrulaması bekliyor."
  pending_line_2: "/msg %bot% %command_0% veya /msg %bot% %command_1% komutunu çalıştırın."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "%nickname% rumuzu askıya alınmış. Gerekçe: %reason%"
  forbidden: "%nickname% rumuzu bu ağda kullanılamaz."
  pending_deletion: "%nickname% rumuzu silinmeyi bekliyor ve kullanılamaz."

# --- VERIFY -------------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Kaydı veya kurtarma belirtecini onaylar."
  help: |-
    Doğrulandıktan sonra bu token kalıcı kurtarma tokenınız olur.
    Güvenli bir yerde saklayın: takma adınızı kurtarmanızı sağlar.
    %duration% süresi yalnızca doğrulama öncesinde geçerlidir.
  example: "%command_prefix%VERIFY <alınan_token>"
  success: "%nickname% rumuzu başarıyla kaydedildi ve artık kimliğiniz doğrulandı."
  success_native: "%nickname% rumuzu başarıyla kaydedildi. Aşağıda gösterilen yerel kimlik doğrulamayı kullanın."
  invalid_token: "Kurtarma belirteci geçersiz."
  no_pending: "Doğrulayacak bekleyen bir kaydınız yok."

# --- RESEND -------------------------------------------------------------------
resend:
  disabled: "Bu kayıt tokenı doğrudan sohbet üzerinden gönderdiği için %resend% ile yeni token isteyemezsiniz."
  syntax: "RESEND"
  short: "Doğrulama tokenını e-postanıza yeniden gönderin."
  help: |-
    RESEND yalnızca doğrulama tokenı e-postayla gönderildiyse kullanılabilir.
    Doğrulandıktan sonra bu token kalıcı kurtarma tokenınız olur. Güvenli bir yerde
    saklayın: takma adınızı kurtarmanızı sağlar.
    %duration% süresi yalnızca doğrulama öncesinde geçerlidir.
    RESEND kullandığınızda e-postayla yeni bir token alırsınız.
    Bekleyen kayıt süresi %duration% kadar yenilenir.
  example: "%command_prefix%RESEND"
  success: "Doğrulama tokenı %email% adresine yeniden gönderildi."
  no_pending: "Doğrulayacak bekleyen bir kaydınız yok."
  throttled: "Başka bir doğrulama e-postası istemeden önce %minutes% dakika beklemelisiniz."

# --- RECOVER ------------------------------------------------------------------
recover:
  no_email: "%nickname% rumuzu için e-posta ayarlanmamış. Kurtarma kullanılamaz."
  email_sent: "%email_hint% adresine bir kurtarma tokenı gönderildi. Gelen kutunuzu (ve spam klasörünü) kontrol edin."
  pending_deletion: "%nickname% takma adı silinmeyi bekliyor ve kurtarılamaz."
  instructions: "EMAIL: %command_0% e-postayla geçici belirteç ister. TOKEN: onaylanmış belirtecinizi girin. %command_1% geçerli e-posta belirtecini veya onaylanmış belirteci kabul eder. E-posta belirteci ancak doğrulandıktan sonra saklananı değiştirir. Saklanan belirteç %command_2% ile isteğe bağlı değişiklik sunar; korumak için mesajı yok sayın."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <nickname> [token]"
  short: "Şifrenizi kaybettiyseniz rumuzunuzu kurtarın."
  help: |-
    Tokenınız yoksa e-postayla geçici bir token isteyin.
    Geçerli bir kurtarma tokenı da verebilirsiniz; geçiciyse ancak doğrulandıktan
    sonra kayıtlı tokenın yerini alır.
    Kayıtlı tokenı kullandığınızda VERIFY ile isteğe bağlı yenileme önerilir; mevcut
    tokenı korumak istiyorsanız bu mesajı yok sayın.
  example: "%command_prefix%RECOVER Kullanıcı"
  examples:
    - "%command_prefix%RECOVER Kullanıcı <alınan_token>"
  pending: "%nickname% takma adının kaydı beklemede. %command_0% kullanın. Token e-postayla gönderildiyse ve geçerli bir adres tanımlıysa %command_1% ile yenisini isteyebilirsiniz."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "%nickname% rumuzu askıya alınmış. Gerekçe: %reason%"
  forbidden: "%nickname% rumuzu bu ağda kullanılamaz."
  throttled: "Çok fazla geçersiz belirteç. %minutes% dakika sonra tekrar deneyin."
  invalid_token: "Kurtarma belirteci geçersiz."
  success_identify: "Şifre sıfırlandı. Şimdi kimlik doğrulayın: %identify_cmd%"
  success_then_change: "Ardından parolanızı değiştirin: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <yeni_parola>"

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <yeni_şifre>|EMAIL <email> <token>|LANGUAGE <kod>|TIMEZONE <zaman_dilimi>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Rumuz seçeneklerinizi değiştirin."
  help: |-
    Takma adınızın ayarlarını değiştirir. Bu seçenekleri değiştirmek için
    kimliğiniz doğrulanmış olmalıdır.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Bilinmeyen seçenek %option%. Kullanılabilir seçenekler: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <yeni_şifre>"
    short: "Rumuz şifrenizi değiştirin."
    help: |-
      Rumuzunuzun şifresini değiştirir. Yeni şifre hemen geçerli olur.
      En az 6 karakterden oluşan, başka hizmetlerde kullanmadığınız
      güçlü bir şifre seçin.
    example: "%command_prefix%SET PASSWORD Güvenli$Parola_123"
    success: "Şifreniz başarıyla güncellendi."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Onaylanmış kurtarma belirtecinizle %value% kullanın."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Onaylanmış kurtarma tokenınızla e-posta adresini değiştirir."
    help: |-
      SET EMAIL, kurtarma tokenını tüketmeden doğruladıktan sonra iletişim e-postasını
      değiştirir. Biçimi ve benzersizliği denetler; onay e-postası göndermez.
      Yönetim tarafından engellenen e-posta alan adları kullanılamaz.
    example: "%command_prefix%SET EMAIL kullanici@ornek.com <token_confirmado>"
    success: "E-postanız %email% olarak güncellendi."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Onay tokenı %current_email% adresine gönderildi."
    pending_line_2: "%new_email% adresine geçişi onaylamak için şunu çalıştırın:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "Token bir saat içinde sona erecek."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "Token geçersiz veya süresi dolmuş. %value% ile yeni bir tane isteyin."
    invalid_token_value: "SET EMAIL <yeni_e-posta>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <kod>"
    short: "Hizmetlerin sizinle iletişim kurarken kullandığı dili değiştirin."
    help: |-
      %nickserv% ve diğer hizmetlerin sizinle konuşurken kullandığı dili değiştirir.
      Kullanılabilir diller:
      %emphasis_0% (Katalanca)
      %emphasis_1% (Almanca)
      %emphasis_2% (Yunanca)
      %emphasis_3% (İngilizce)
      %emphasis_4% (İspanyolca)
      %emphasis_5% (Baskça)
      %emphasis_6% (Fransızca)
      %emphasis_7% (Galiçyaca)
      %emphasis_8% (İtalyanca)
      %emphasis_9% (Felemenkçe)
      %emphasis_10% (Lehçe)
      %emphasis_11% (Portekizce)
      %emphasis_12% (Rumence)
      %emphasis_13% (Türkçe)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Dil %language% olarak değiştirildi."
    invalid: "Desteklenmeyen dil. Kullanılabilir diller: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <zaman_dilimi>"
    short: "Tarihleri görüntülerken kullanılacak zaman dilimini ayarlayın."
    help: |-
      %nickserv% tarafından tarihleri gösterirken kullanılan saat dilimini ayarlar.
      Bölgeleri görmek için HELP SET TIMEZONE kullanın. Kaldırmak için OFF kullanın.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Zaman dilimi %timezone% olarak ayarlandı. Tarihler bu zaman diliminde gösterilecek."
    cleared: "Zaman dilimi temizlendi. Tarihler ağ varsayılanını kullanacak."
    invalid: "Geçersiz zaman dilimi %timezone%. Geçerli bir tanımlayıcı kullanın (örn. UTC, Europe/Istanbul)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Takma adınızın bilgilerini gösterir veya gizler."
    help: |-
      INFO komutunda rumuz bilgilerinizin görünürlüğünü kontrol eder.
      %emphasis_0% ile bilgilerinizi yalnızca siz ve IRC Operatörleri görebilir.
      %emphasis_1% ile bilgileriniz herkese açıktır.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Rumuz bilgileriniz artık %value%."
    on_value: "gizlidir"
    off: "Rumuz bilgileriniz artık %value%."
    off_value: "herkese açıktır"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Hizmetlerin sizinle nasıl iletişim kuracağını değiştirir."
    help: |-
      %nickserv% ve diğer hizmetlerin size nasıl mesaj göndereceğini belirler.
      %emphasis_0% yanıtları %emphasis_1% olarak gönderir.
      %emphasis_2% yanıtları %emphasis_3% olarak gönderir.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Hizmet mesajları artık %value% olarak gönderilecek."
    on_value: "PRIVMSG"
    off: "Hizmet mesajları artık %value% olarak gönderilecek."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Sanal ana bilgisayar adınızı ayarlar veya kaldırır."
    help: |-
      Kimliğiniz doğrulandığında diğer kullanıcıların göreceği özel bir ana bilgisayar
      adı ayarlar.

      Kaldırmak için değer belirtmeden %emphasis_0% komutunu çalıştırın.

      Yalnızca harfler (a-z, A-Z), rakamlar, tire ve noktalar kullanılabilir.
      Her bölüm harf veya rakamla başlayıp bitmelidir.
      Ad en fazla 48 karakter olabilir ve takma ad başına benzersiz olmalıdır.
    example: "%command_prefix%SET VHOST kullanici.ornek.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Sanal host'unuz %vhost% olarak ayarlandı."
    cleared: "Sanal host'unuz temizlendi."
    invalid: "Geçersiz vhost. Yalnızca harfler, rakamlar, tire ve nokta (blok başında/sonunda olamaz); maks 48 karakter."
    taken: "Bu vhost zaten başka bir rumuz tarafından kullanılıyor."
    forced: "Vhost'unuz otomatik olarak yapılandırılmıştır ve SET VHOST ile değiştirilemez."


# Common translations — English
# Domain: common
#
# IRC formatting codes (double-quoted strings or !irc literal blocks):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=green, 04=red, 07=orange, 14=dark gray)
#   \x03        reset color
#   \x0F        reset all formatting
#
# IRC colors use DECIMAL numbers (0-15), not hexadecimal.
#   \x0314 = dark gray (14 decimal): CORRECT
#   \x030F = color 0 followed by the letter F: ERROR
#
# Multiline IRC text: !irc |- with physical newlines and real spaces.
# Untagged blocks do not decode escapes; preserve CTCP literals.
# HELP examples: example/examples and %command_prefix%.
# The presenter adds the uncolored /msg prefix and a two-space margin.

# --- UNKNOWN COMMAND -------------------------------------------------------
unknown_command: "\x0304✗\x03\x0F Unknown command \x0303%command%\x03\x0F. Use /msg %bot% \x0303HELP\x03\x0F"

# --- UNKNOWN HELP OPTION ---------------------------------------------------
unknown_help_option: "\x0304✗\x03\x0F Unknown help option \x0303%option%\x03\x0F for \x0303%command%\x03\x0F. Use /msg %bot% \x0303HELP %command%\x03\x0F"

# --- ERROR -----------------------------------------------------------------
error:
  email_domain_blocked: "This email domain is administratively blocked."
  syntax: "Incorrect syntax. Usage: %syntax%"
  oper_only: "This command is restricted to IRC Operators."
  not_identified: "You are not identified. Use /msg %nickserv% IDENTIFY <nickname> <password>"
  permission_denied: "Permission denied. You do not have access to this command."
  mail_failed: "The email could not be sent. Check your address or try again later."
  channel_not_registered: "Channel %channel% is not registered."
  nick_not_registered: "Nickname %nickname% is not registered."
  insufficient_access: "Insufficient access to %operation% on channel %channel%."
  nick_not_online: "Nickname %nickname% is not connected."

# --- DURATION --------------------------------------------------------------
duration:
  unit:
    year:
      singular: "year"
      plural: "years"
    month:
      singular: "month"
      plural: "months"
    day:
      singular: "day"
      plural: "days"
    hour:
      singular: "hour"
      plural: "hours"
    minute:
      singular: "minute"
      plural: "minutes"
    second:
      singular: "second"
      plural: "seconds"
  list_separator: ", "
  list_join: "%prefix% and %last%"

# --- ANTIFLOOD -------------------------------------------------------------
antiflood:
  blocked: "You have exceeded the command rate limit. Please try again in %seconds% seconds."
  debug_channel: "%nick% %command% limit reached for %host% (%seconds%s remaining)"

# --- CTCP ------------------------------------------------------------------
ctcp:
  version:
    tribute: |
      \x02For my loyal and eternal friend,\x02

      Although 2023 was the year we had to say goodbye, time has not erased a single
      detail of you. I still remember your boundless energy, your noble gaze, and that
      immense and contagious joy that only you knew how to give.

      You filled my home with life and my life with unconditional love that I will never
      forget. Although I no longer hear your footsteps running to greet me or feel your
      head leaning on me seeking affection, I know your playful spirit still
      accompanies me.

      Thank you for every moment, every mischief, and for being the best companion I could
      have asked for. The space you left by my side is now filled with the happiest
      memories. You will always be my dear friend and you will always have an immense
      place in my heart.

# --- DEBUG -----------------------------------------------------------------
debug:
  action_message: "%operator% executes command %command% on %target%. %reason%"
  action_with_option: "%operator% executes command %command% on %target%. Option: %option%. %reason%"
  action_with_value: "%operator% executes command %command% on %target%. Option: %option%=%value%. %reason%"
  prefix_reason: "Reason: %reason%"
  action_duration: "%operator% executes command %command% on %target%. Duration: %duration%. %reason%"

# --- HISTORY ---------------------------------------------------------------
history:
  unknown_operator: "(unknown)"
  del:
    success: "History entry %id% deleted."
    not_found: "History entry %id% not found."
    invalid_id: "Invalid entry ID: %id%."
  view:
    extra: "Extra %extra%"
  message:
    unsuspend: "Suspension lifted"
  extra:
    duration: "Duration: %value%"
    expires_at: "Expires: %value%"
    ip: "IP: %value%"
    host: "Host: %value%"

# --- LIST ------------------------------------------------------------------
list:
  page: "Page %page%/%pages% — %total% matches"
  status_suspended: "Suspended"
  status_pending_deletion: "Pending deletion"
  status_forbidden: "Forbidden"

# --- REPLY -----------------------------------------------------------------
reply:
  separator: "\x0314─────────────────────────────\x03"

# --- LABEL -----------------------------------------------------------------
label:
  no_reason: "No reason"
  never: "never"
  unknown_creator: "unknown"
  permanent: "Permanent"
  permanent_inline: "permanent"

# --- PRESENTATION-FREE MIGRATED REPLIES ---
presentation:
  unknown_command: "Unknown command %command%. Use /msg %bot% %help%"
  unknown_help_option: "Unknown help option %option% for %command%. Use /msg %bot% %help% %command%"
  error.email_domain_blocked: "This email domain is administratively blocked."
  error.syntax: "Incorrect syntax. Usage: %syntax%"
  error.oper_only: "This command is restricted to IRC Operators."
  error.not_identified: "You are not identified. Use /msg %nickserv% %identify%"
  error.permission_denied: "Permission denied. You do not have access to this command."
  error.mail_failed: "The email could not be sent. Check your address or try again later."
  error.channel_not_registered: "Channel %channel% is not registered."
  error.nick_not_registered: "Nickname %nickname% is not registered."
  error.insufficient_access: "Insufficient access to %operation% on channel %channel%."
  error.nick_not_online: "Nickname %nickname% is not connected."
  identify: "IDENTIFY <nickname> <password>"

# Übersetzungen für NickServ — Deutsch
# Domäne: nickserv
#
# IRC-Formatcodes (doppelte Anführungszeichen oder !irc-Literalblöcke):
#   \x02        Fettdruck ein/aus
#   \x03NN      Farbe (DEZIMAL: 03=grün, 04=rot, 07=orange, 14=dunkelgrau)
#   \x03        Farbe zurücksetzen
#   \x0F        gesamte Formatierung zurücksetzen
#
# IRC-Farben verwenden DEZIMALZAHLEN (0-15), keine Hexadezimalzahlen.
#   \x0314 = dunkelgrau (14 dezimal): RICHTIG
#   \x030F = Farbe 0 gefolgt vom Buchstaben F: FALSCH
#
# Mehrzeiliger IRC-Text: !irc |- mit echten Zeilenumbrüchen und Leerzeichen.
# Blöcke ohne Tag dekodieren keine Escape-Sequenzen; CTCP-Literale erhalten.
# HELP-Beispiele: example/examples und %command_prefix%.
# Die Darstellung ergänzt /msg ohne Farbe und einen Rand von zwei Leerzeichen.

# --- REGISTER -----------------------------------------------------------------
register:
  token_unavailable: !irc |-
    Die Registrierung ist ausstehend, aber das Token konnte nicht ausgegeben werden.
    Warte auf den Ablauf dieser Registrierung, bevor du dich erneut registrierst.
  syntax: "REGISTER <Passwort> [email]"
  short: "Ihren Nickname bei den Services registrieren."
  help: |-
    Registriert deinen Nickname. Das Netzwerk sendet dir je nach Konfiguration
    den Verifizierungstoken per Chat oder E-Mail.
    Nach der Bestätigung wird er zu deinem dauerhaften Wiederherstellungstoken:
    Bewahre ihn sicher auf.
    Die Gültigkeitsdauer von %duration% gilt nur vor der Bestätigung.
    Administrativ gesperrte E-Mail-Domains sind nicht zulässig.
  example: "%command_prefix%REGISTER Sicheres$Passwort_123"
  examples:
    - "%command_prefix%REGISTER Sicheres$Passwort_123 benutzer@beispiel.de"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Ein Verifizierungstoken wurde an %email% gesendet."
  pending_line_2: "Führe /msg %bot% %verify% aus, um die Registrierung abzuschließen."
  pending_line_3: "Nichts erhalten? Prüfe den Spam-Ordner oder verwende /msg %bot% %resend%"
  pending_line_4: "Das Token läuft in %duration% ab."
  already_registered: "Nickname %nickname% ist bereits registriert."
  already_pending: "Die Registrierung von %nickname% steht aus. Verwende %verify%. Wurde das Token per E-Mail gesendet und ist eine gültige Adresse hinterlegt, kannst du mit %resend% ein neues anfordern."
  forbidden: "Nickname %nickname% kann in diesem Netzwerk nicht registriert werden."
  pending_deletion: "Der Nickname %nickname% steht zur Löschung an und kann nicht registriert werden."
  invalid_email: "Die angegebene E-Mail-Adresse ist ungültig."
  email_already_used: "Die E-Mail %email% wird bereits von einem anderen Nickname verwendet. Verwenden Sie eine andere Adresse."
  throttled: "Sie müssen %minutes% Minute(n) warten, bevor Sie es erneut mit der Registrierung versuchen."
  guest_prefix_forbidden: "Sie können keinen Nick registrieren, der mit %prefix% beginnt."

# --- IDENTIFY -----------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nickname> <Passwort>"
  short: "Sich als Besitzer eines Nicknames identifizieren."
  help: |-
    Authentifiziert Ihre Sitzung bei %nickserv% mit Ihrem Nickname und Passwort.
    Nach erfolgreicher Identifizierung erhalten Sie den registrierten Modus %emphasis_0%
    und, falls Sie einen Gast-Nick verwendet haben, wird Ihr registrierter Nick
    wiederhergestellt.
  example: "%command_prefix%IDENTIFY Benutzer <Passwort>"
  native_syntax: "/NICK <nickname>:<Passwort> | /NICK <nickname>!<Passwort>"
  native_short: "Zeigt die native Syntax zur Nickname-Authentifizierung."
  native_help: |-
    Dieses Protokoll authentifiziert Konten durch Nickname-Wechsel.
    Verwende %emphasis_0% oder, wenn der Nickname belegt ist, %emphasis_1%.
  native_example: "/NICK Benutzer:<Passwort>"
  native_examples:
    - "%command_prefix%/NICK Benutzer!<Passwort>"
  native_authentication: "Dieses Protokoll verwaltet die Authentifizierung durch Nickname-Wechsel. Verwende %command_0% oder, wenn der Nickname belegt ist, %command_1%."
  native_authentication_command_0: "/NICK <nickname>:<Passwort>"
  native_authentication_command_1: "/NICK <nickname>!<Passwort>"
  success: "Sie sind jetzt identifiziert als %nickname%."
  already_identified: "Sie sind bereits identifiziert als %nickname%."
  invalid_credentials: "Falsches Passwort. Bitte versuchen Sie es erneut."
  locked_out: "Zu viele Fehlversuche. Versuchen Sie es in %minutes% Minute(n) erneut."
  ghost_released: "Die Geister-Sitzung, die %nickname% hielt, wurde getrennt."
  kill_reason: "Nick %nickname% von %source% zurückgefordert (der registrierte Besitzer hat sich identifiziert)"
  pending: |-
    %first%
    %second%
  pending_line_1: "Der Nickname %nickname% wartet auf E-Mail-Verifizierung."
  pending_line_2: "Führe /msg %bot% %command_0% oder /msg %bot% %command_1% aus."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Nickname %nickname% ist suspendiert. Begründung: %reason%"
  forbidden: "Nickname %nickname% kann in diesem Netzwerk nicht verwendet werden."
  pending_deletion: "Der Nickname %nickname% steht zur Löschung an und kann nicht verwendet werden."

# --- VERIFY -------------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Bestätigt eine Registrierung oder ein Rettungstoken."
  help: |-
    Nach der Bestätigung wird dieses Token zu deinem dauerhaften
    Wiederherstellungstoken.
    Bewahre es sicher auf: Du kannst damit deinen Nickname wiederherstellen.
    Die Gültigkeitsdauer von %duration% gilt nur vor der Bestätigung.
  example: "%command_prefix%VERIFY <erhaltenes_Token>"
  success: "Nickname %nickname% wurde erfolgreich registriert und Sie sind jetzt identifiziert."
  success_native: "Nickname %nickname% wurde erfolgreich registriert. Verwenden Sie die unten gezeigte native Authentifizierung."
  invalid_token: "Das Rettungstoken ist ungültig."
  no_pending: "Sie haben keine ausstehende Registrierung zur Verifizierung."

# --- RESEND -------------------------------------------------------------------
resend:
  disabled: "%resend% ist deaktiviert, solange REGMODE auf TOKEN steht."
  syntax: "RESEND"
  short: "Das Verifizierungs-Token erneut an Ihre E-Mail senden."
  help: |-
    RESEND ist nur verfügbar, wenn das Verifizierungstoken per E-Mail gesendet
    wurde.
    Nach der Bestätigung wird dieses Token zu deinem dauerhaften
    Wiederherstellungstoken.
    Bewahre es sicher auf: Damit kannst du deinen Nickname wiederherstellen.
    Die Gültigkeitsdauer von %duration% gilt nur vor der Bestätigung.
    Mit RESEND erhältst du ein neues Token per E-Mail.
    Die Frist der ausstehenden Registrierung wird um %duration% verlängert.
  example: "%command_prefix%RESEND"
  success: "Verifizierungs-Token erneut an %email% gesendet."
  no_pending: "Sie haben keine ausstehende Registrierung zur Verifizierung."
  throttled: "Sie müssen %minutes% Minute(n) warten, bevor Sie eine weitere Verifizierungs-E-Mail anfordern."

# --- RECOVER ------------------------------------------------------------------
recover:
  no_email: "Für Nickname %nickname% ist keine E-Mail hinterlegt. Wiederherstellung nicht verfügbar."
  email_sent: "Ein Wiederherstellungs-Token wurde an %email_hint% gesendet. Prüfen Sie Ihren Posteingang (und Spam-Ordner)."
  pending_deletion: "Der Nickname %nickname% ist zur Löschung vorgemerkt und kann nicht wiederhergestellt werden."
  instructions: "EMAIL: %command_0% fordert ein vorläufiges Token per E-Mail an. TOKEN: gib dein bestätigtes Token an. %command_1% akzeptiert das gültige E-Mail-Token oder das bestätigte Token. Das E-Mail-Token ersetzt das gespeicherte erst nach Prüfung. Mit dem gespeicherten Token wird ein optionaler Ersatz über %command_2% angeboten; ignoriere die Nachricht, um es zu behalten."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <nickname> [Token]"
  short: "Ihren Nickname wiederherstellen, wenn Sie Ihr Passwort verloren haben."
  help: |-
    Fordere ohne Token per E-Mail ein vorläufiges Token an.
    Du kannst auch ein gültiges Wiederherstellungstoken angeben; ein vorläufiges
    Token ersetzt das gespeicherte erst nach seiner Bestätigung.
    Nach Verwendung des gespeicherten Tokens wird mit VERIFY optional ein Ersatz
    angeboten. Ignoriere diese Nachricht, wenn du das aktuelle Token behalten
    willst.
  example: "%command_prefix%RECOVER Benutzer"
  examples:
    - "%command_prefix%RECOVER Benutzer <erhaltenes_Token>"
  pending: "Die Registrierung von %nickname% steht aus. Verwende %command_0%. Wurde das Token per E-Mail gesendet und ist eine gültige Adresse hinterlegt, kannst du mit %command_1% ein neues anfordern."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Nickname %nickname% ist suspendiert. Begründung: %reason%"
  forbidden: "Nickname %nickname% kann in diesem Netzwerk nicht verwendet werden."
  throttled: "Zu viele ungültige Token. Versuche es in %minutes% Minute(n) erneut."
  invalid_token: "Das Rettungstoken ist ungültig."
  success_identify: "Passwort zurückgesetzt. Identifizieren Sie sich jetzt: %identify_cmd%"
  success_then_change: "Ändern Sie dann Ihr Passwort: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <neues_passwort>"

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <neues_passwort>|EMAIL <email> <token>|LANGUAGE <Code>|TIMEZONE <Zeitzone>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Optionen deines Nicknames ändern."
  help: |-
    Ändert die Einstellungen deines Nicknames. Du musst identifiziert sein, um
    diese Optionen zu ändern.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Unbekannte Option %option%. Verfügbare Optionen: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <neues_passwort>"
    short: "Ihr Nickname-Passwort ändern."
    help: |-
      Ändert das Passwort für Ihren Nickname. Das neue Passwort wird
      sofort wirksam. Wählen Sie ein starkes Passwort mit mindestens 6 Zeichen,
      das Sie nicht bei anderen Diensten verwenden.
    example: "%command_prefix%SET PASSWORD Sicheres$Passwort_123"
    success: "Ihr Passwort wurde erfolgreich aktualisiert."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Verwende %value% mit deinem bestätigten Rettungstoken."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Ändert die E-Mail-Adresse mit deinem bestätigten Rettungstoken."
    help: |-
      SET EMAIL ändert nach Prüfung des Rettungstokens die Kontakt-E-Mail-Adresse,
      ohne das Token zu verbrauchen. Format und Eindeutigkeit werden geprüft; es wird
      keine Bestätigungs-E-Mail gesendet.
      Administrativ gesperrte E-Mail-Domains sind nicht zulässig.
    example: "%command_prefix%SET EMAIL benutzer@beispiel.de <token_confirmado>"
    success: "Ihre E-Mail wurde auf %email% aktualisiert."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Ein Bestätigungs-Token wurde an %current_email% gesendet."
    pending_line_2: "Um die Änderung auf %new_email% zu bestätigen, führen Sie aus:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "Das Token läuft in 1 Stunde ab."
    pending_command: "SET EMAIL %new_email% <Token>"
    invalid_token: "Das Token ist ungültig oder abgelaufen. Fordern Sie ein neues mit %value% an."
    invalid_token_value: "SET EMAIL <neue_e-mail>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <Code>"
    short: "Die Sprache ändern, in der die Services mit Ihnen kommunizieren."
    help: |-
      Ändert die Sprache, die %nickserv% und andere Services verwenden, wenn sie
      mit Ihnen sprechen.
      Verfügbare Sprachen:
      %emphasis_0% (Katalanisch)
      %emphasis_1% (Deutsch)
      %emphasis_2% (Griechisch)
      %emphasis_3% (Englisch)
      %emphasis_4% (Spanisch)
      %emphasis_5% (Baskisch)
      %emphasis_6% (Französisch)
      %emphasis_7% (Galicisch)
      %emphasis_8% (Italienisch)
      %emphasis_9% (Niederländisch)
      %emphasis_10% (Polnisch)
      %emphasis_11% (Portugiesisch)
      %emphasis_12% (Rumänisch)
      %emphasis_13% (Türkisch)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Sprache auf %language% geändert."
    invalid: "Nicht unterstützte Sprache. Verfügbare Sprachen: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <Zeitzone>"
    short: "Die Zeitzone für die Datumsanzeige festlegen."
    help: |-
      Legt die Zeitzone fest, in der %nickserv% Datumsangaben anzeigt. Mit HELP SET
      TIMEZONE findest du die Regionen. Verwende OFF zum Entfernen.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Zeitzone auf %timezone% gesetzt. Daten werden in dieser Zeitzone angezeigt."
    cleared: "Zeitzone gelöscht. Daten verwenden die Netzwerk-Standardeinstellung."
    invalid: "Ungültige Zeitzone %timezone%. Verwenden Sie eine gültige Kennung (z. B. UTC, Europe/Berlin)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Blendet die Informationen deines Nicknames ein oder aus."
    help: |-
      Steuert die Sichtbarkeit Ihrer Nickname-Informationen im INFO-Befehl.
      Mit %emphasis_0% können nur Sie und IRC-Operatoren Ihre Details einsehen.
      Mit %emphasis_1% sind Ihre Informationen für jeden öffentlich.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Ihre Nickname-Informationen sind jetzt %value%."
    on_value: "privat"
    off: "Ihre Nickname-Informationen sind jetzt %value%."
    off_value: "öffentlich"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Ändert, wie die Dienste dir Nachrichten senden."
    help: |-
      Legt fest, wie %nickserv% und andere Dienste dir Nachrichten senden.
      Bei %emphasis_0% werden Antworten als %emphasis_1% gesendet.
      Bei %emphasis_2% werden Antworten als %emphasis_3% gesendet.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Service-Nachrichten werden jetzt als %value% gesendet."
    on_value: "PRIVMSG"
    off: "Service-Nachrichten werden jetzt als %value% gesendet."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Legt deinen virtuellen Host fest oder entfernt ihn."
    help: |-
      Legt einen benutzerdefinierten Hostnamen fest, den andere Benutzer sehen,
      wenn du identifiziert bist.

      Zum Entfernen führe %emphasis_0% ohne Wert aus.

      Erlaubt sind Buchstaben (a-z, A-Z), Ziffern, Bindestriche und Punkte.
      Jeder Abschnitt muss mit einem Buchstaben oder einer Ziffer beginnen und enden.
      Der Hostname darf bis zu 48 Zeichen lang und pro Nickname eindeutig sein.
    example: "%command_prefix%SET VHOST usuario.ejemplo.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Ihr virtueller Host wurde auf %vhost% gesetzt."
    cleared: "Ihr virtueller Host wurde gelöscht."
    invalid: !irc |-
      Ungültiger VHost. Nur Buchstaben, Ziffern, Bindestrich und Punkt (nicht am
      Anfang/Ende eines Blocks); max. 48 Zeichen.
    taken: "Dieser VHost wird bereits von einem anderen Nickname verwendet."
    forced: "Ihr VHost wird automatisch konfiguriert und kann nicht mit SET VHOST geändert werden."

# --- INFO ---------------------------------------------------------------------
info:

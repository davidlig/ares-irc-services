protection:
  nick_in_use: "Nick %nickname% ist registriert. Sie werden umbenannt, wenn Sie sich nicht identifizieren."
  renamed_to: |-
    Sie wurden in %guest_nick% umbenannt. Um Ihren Nick zurückzuerhalten:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <Passwort>"
  nick_forbidden: "Nickname %nickname% ist gesperrt: %reason%"

# --- USERIP (IRCop) -----------------------------------------------------------
userip:
  syntax: "USERIP <nickname>"
  short: "Die echte IP-Adresse und den Hostnamen eines Nicknames abrufen."
  help: |-
    Zeigt die echte IP-Adresse und den Hostnamen eines Nicknames.
    Verwende diese sensible Information verantwortungsbewusst.
  example: "%command_prefix%USERIP Benutzer"
  result: "Nickname: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP (IRCop) ------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Findet Nicknames anhand der IP ihres letzten identifizierten Logins."
  help: |-
    Zeigt registrierte Nicknames, deren letzte identifizierte Verbindung
    diese IP-Adresse verwendet hat. Die gespeicherte Adresse kann veraltet sein.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Keine registrierten Nicknames passen zu dieser IP."
  header: "Übereinstimmende Nicknamen:"

# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <Muster> [Seite]"
  short: "Listet registrierte Nicknames nach Muster auf."
  help: |-
    Listet registrierte Nicknames auf, die dem Muster entsprechen. * steht für
    beliebig viele Zeichen; die optionale Seite beginnt bei 1.
  example: "%command_prefix%LIST Benutzer*"
  examples:
    - "%command_prefix%LIST Benutzer* 2"
  header: "Nickname | Registrierung | Letzte Verbindung | IP | Status"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Keine Nicknames entsprechen dem Muster %pattern%."
  status_pending: "Ausstehend"
  status_registered: "Registriert"

# --- HISTORY ---
history:
  syntax: "HISTORY <nickname> {ADD <Nachricht>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Nickname-Aktionsverlauf anzeigen oder verwalten."
  help: |-
    Zeigt und verwaltet den Aktionsverlauf eines Nicknames. Sperren sowie Passwort-,
    E-Mail- und Wiederherstellungsänderungen werden automatisch erfasst. VIEW zeigt
    drei Einträge pro Seite; ALL zeigt den vollständigen Verlauf.
  example: "%command_prefix%HISTORY Benutzer VIEW"
  examples:
    - "%command_prefix%HISTORY Benutzer VIEW ALL"
    - "%command_prefix%HISTORY Benutzer ADD Manuelle Notiz"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nickname> ADD <Nachricht>"
    short: "Einen manuellen Verlaufseintrag hinzufügen."
    help: "Fügt dem Nickname-Verlauf einen manuellen Eintrag hinzu."
    example: "%command_prefix%HISTORY Benutzer ADD Als Spam gemeldet"
    success: "Verlaufseintrag für %nickname% hinzugefügt."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nickname> DEL <id>"
    short: "Einen Verlaufseintrag anhand der ID löschen."
    help: "Löscht einen bestimmten Verlaufseintrag anhand seiner ID."
    example: "%command_prefix%HISTORY Benutzer DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nickname> VIEW [PAGE|ALL]"
    short: "Nickname-Aktionsverlauf anzeigen."
    help: |-
      Zeigt den Aktionsverlauf des Nicknames. Standardmäßig werden drei Einträge
      pro Seite angezeigt. Verwende ALL, um alle Einträge zu sehen.
    example: "%command_prefix%HISTORY Benutzer VIEW"
    examples:
      - "%command_prefix%HISTORY Benutzer VIEW 2"
      - "%command_prefix%HISTORY Benutzer VIEW ALL"
    header: "%heading% (zeigt %start%-%end% von %total%):"
    header_title: "Verlauf für %nickname%"
    entry: "#%id% [%date%] %action% von %operator% — %message%"
    no_entries: "Keine Verlaufseinträge für %nickname% gefunden."
    page_hint: "Verwenden Sie %command% für weitere Einträge."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nickname> CLEAR"
    short: "Alle Verlaufseinträge für einen Nickname löschen."
    help: "Löscht unwiderruflich alle Verlaufseinträge des Nicknames."
    example: "%command_prefix%HISTORY Benutzer CLEAR"
    success: "%count% Verlaufseinträge für %nickname% gelöscht."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Konto aktiviert"
  resend: "Bestätigungs-E-Mail erneut gesendet"
  noexpire_on: "Ablaufschutz aktiviert"
  noexpire_off: "Ablaufschutz deaktiviert"
  userip: "USERIP-Abfrage"
  history_clear: "Verlauf gelöscht"
  password_changed_owner: "Passwort vom Besitzer geändert"
  password_changed_operator: "Passwort vom Operator geändert"
  email_changed_owner: "E-Mail von %old_email% zu %new_email% geändert"
  email_changed_operator: "E-Mail zu %new_email% von Operator geändert"
  recover: "Passwort via E-Mail-Token zurückgesetzt"
  saregister: "Konto administrativ registriert"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Alte E-Mail: %value%"
  new_email: "Neue E-Mail: %value%"
  method: "Methode: %value%"

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <nickname> <Passwort> [email]"
  short: "Einen Nickname administrativ registrieren."
  help: |-
    Syntax: SAREGISTER <nickname> <Passwort> [email]

    Registriert einen Nickname sofort administrativ, ohne dass eine
    Client-Verifizierung oder Drosselungslimits erforderlich sind.

    Im TOKEN-Modus wird das Rettungstoken einmalig dem Operator angezeigt.
    Im EMAIL-Modus wird das Rettungstoken an die angegebene E-Mail-Adresse gesendet.
  example: "%command_prefix%SAREGISTER Alice Passwort123"
  examples:
    - "%command_prefix%SAREGISTER Bob Passwort456 bob@example.de"
  success_token: "Nickname %nickname% wurde registriert. Rettungstoken: %token%"
  success_email: "Nickname %nickname% wurde registriert. Rettungstoken an %email% gesendet."
  invalid_nickname: "Ungültiger Nickname %nickname%."

# --- SASET (IRCop) ------------------------------------------------------------
saset:
  syntax: "SASET <Nickname> {PASSWORD <neues_Passwort>|EMAIL <neue_E-Mail>|LANGUAGE <Code>|TIMEZONE {<Zeitzone>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [VHost]}"
  short: "Einstellungen eines anderen Nicknames ändern."
  help: |-
    Ermöglicht IRC-Operatoren, die Einstellungen eines anderen registrierten
    Nicknames zu ändern. Nicknames von Root, IRC-Operatoren und Diensten sind
    ausgeschlossen.
  example: "%command_prefix%SASET Benutzer PRIVATE ON"
  examples:
    - "%command_prefix%SASET Benutzer TIMEZONE OFF"
  unknown_option: "Unbekannte Option %option%. Verfügbare Optionen: %options%."
  cannot_modify_oper: "Kann Nickname eines IRC-Operators nicht ändern."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <Nickname> PASSWORD <neues_Passwort>"
    short: "Passwort eines Nicknames ändern."
    help: "Ändert das Passwort eines anderen Nicknames sofort."
    example: "%command_prefix%SASET Benutzer PASSWORD ClaveSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <Nickname> EMAIL <neue_E-Mail>"
    short: "E-Mail eines Nicknames ändern."
    help: |-
      Ändert die E-Mail-Adresse eines anderen Nicknames sofort. Das Rettungstoken
      ist nicht erforderlich und es wird keine Bestätigungs-E-Mail gesendet.
      BADMAIL beschränkt diese administrative E-Mail-Änderung nicht.
    example: "%command_prefix%SASET Benutzer EMAIL benutzer@beispiel.de"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <Nickname> LANGUAGE <Code>"
    short: "Sprache eines Nicknames ändern."
    help: |-
      Ändert die Sprache eines anderen Nicknames. Verfügbar sind en (Englisch)
      und es (Spanisch).
    example: "%command_prefix%SASET Benutzer LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <Nickname> TIMEZONE {<Zeitzone>|OFF}"
    short: "Zeitzone eines Nicknames ändern."
    help: |-
      Legt die Zeitzone eines anderen Nicknames fest oder entfernt sie. Verwende OFF
      zum Entfernen.
    example: "%command_prefix%SASET Benutzer TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Benutzer TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <Nickname> PRIVATE {ON|OFF}"
    short: "Privatsphäre eines Nicknames ändern."
    help: |-
      Aktiviert oder deaktiviert den Datenschutz für die Informationen eines anderen
      Nicknames.
    example: "%command_prefix%SASET Benutzer PRIVATE ON"
    examples:
      - "%command_prefix%SASET Benutzer PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <Nickname> MSG {ON|OFF}"
    short: "Nachrichtenpräferenz eines Nicknames ändern."
    help: |-
      Legt fest, ob ein anderer Nickname Antworten als PRIVMSG (ON) oder NOTICE (OFF)
      erhält.
    example: "%command_prefix%SASET Benutzer MSG ON"
    examples:
      - "%command_prefix%SASET Benutzer MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <Nickname> VHOST [VHost]"
    short: "Virtuellen Host eines Nicknames ändern."
    help: |-
      Legt den virtuellen Host eines anderen Nicknames fest oder entfernt ihn.
      Führe zum Entfernen SASET <Nickname> VHOST ohne Wert aus.
    example: "%command_prefix%SASET Benutzer VHOST usuario.ejemplo.org"
    examples:
      - "%command_prefix%SASET Benutzer VHOST"

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax: "RENAME <nickname>"
  short: "Einen verbundenen Nickname zwangsweise in einen zufälligen Nickname umbenennen."
  help: |-
    Zwingt einen verbundenen Nickname, zu einem zufälligen, vom Netzwerk
    mit Präfix versehenen Namen zu wechseln.
  example: "%command_prefix%RENAME Problematisch"
  cannot_rename_root: "Root-Benutzer %nickname% kann nicht umbenannt werden."
  cannot_rename_oper: "IRC-Operator %nickname% kann nicht umbenannt werden."
  cannot_rename_service: "Service-Nickname %nickname% kann nicht umbenannt werden."
  success: "Nickname %nickname% wurde in %new_nick% umbenannt."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nickname> {ON|OFF}"
  short: "Ablaufschutz für einen Nickname setzen oder entfernen."
  help: |-
    Legt fest, ob der Nickname wegen Inaktivität abläuft.
    ON verhindert den Ablauf, OFF wendet die normalen Regeln an.
  example: "%command_prefix%NOEXPIRE Benutzer ON"
  examples:
    - "%command_prefix%NOEXPIRE Benutzer OFF"
  success_on: "Nickname %nickname% ist jetzt vor Ablauf geschützt."
  success_off: "Nickname %nickname% läuft jetzt normal ab."
  forbidden: "Nickname %nickname% ist gesperrt."
  suspended: "Nickname %nickname% ist suspendiert."

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Registrierungsmodus des Netzwerks verwalten."
  help: |-
    Legt den Registrierungsmodus für neue Konten fest.

    %emphasis_0% Sendet das Verifizierungstoken an die E-Mail-Adresse des Benutzers.
    %emphasis_1% Übermittelt das Token direkt per IRC.
    %emphasis_2% Zeigt den aktuellen Modus, ohne ihn zu ändern.

    Ausstehende Registrierungen behalten den bei Beginn verwendeten Modus.

    Im TOKEN-Modus ist RESEND für alle Benutzer deaktiviert.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Aktueller Registrierungsmodus: %mode%."
  changed: "Registrierungsmodus auf %mode% geändert."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <nickname> <Dauer> <Begründung>"
  short: "Einen Nickname suspendieren."
  help: |-
    Verhindert, dass sich der Eigentümer identifiziert. Die Dauer kann in Tagen
    (d), Stunden (h), Minuten (m) oder 0 für eine dauerhafte Sperre angegeben
    werden.
    IRC-Operatoren und Root-Benutzer können nicht gesperrt werden.
  example: "%command_prefix%SUSPEND SchlechterBenutzer 7d Spam en #hilfe"
  examples:
    - "%command_prefix%SUSPEND Problematisch 0 Umgehung einer Sperre"
  success: "Nickname %nickname% wurde suspendiert bis %duration%."
  already_suspended: "Nickname %nickname% ist bereits suspendiert."
  forbidden: "Nickname %nickname% ist gesperrt und kann nicht suspendiert werden."
  cannot_suspend_oper: "IRC-Operator %nickname% kann nicht suspendiert werden."
  cannot_suspend_root: "Root-Benutzer %nickname% kann nicht suspendiert werden."
  cannot_suspend_service: "Service-Nickname %nickname% kann nicht suspendiert werden."
  invalid_duration: "Ungültige Dauer. Verwenden Sie: %duration_format% (z. B. 7d, 12h, 30m) oder %permanent% für dauerhaft."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nickname>"
  short: "Suspendierung eines Nicknames aufheben."
  help: |-
    Hebt eine aktive Sperre auf, damit sich der Eigentümer wieder identifizieren
    kann.
  example: "%command_prefix%UNSUSPEND Benutzer"
  success: "Suspendierung wurde von %nickname% aufgehoben."
  not_suspended: "Nickname %nickname% ist nicht suspendiert."

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <nickname> <Begründung>"
  short: "Einen Nickname dauerhaft für die Nutzung sperren."
  help: |-
    Verbietet einen Nickname dauerhaft, sodass ihn niemand registrieren oder
    verwenden kann. Ein registrierter Eintrag wird entfernt; bei Verbindung wird
    der Benutzer zu einem zufälligen Nickname gezwungen. Root, IRC-Operatoren und
    Dienste können nicht gesperrt werden.
  example: "%command_prefix%FORBID SchlechterBenutzer Wiederholte Regelverstöße"
  success: "Nickname %nickname% wurde gesperrt."
  updated: "Begründung für die Sperre von %nickname% wurde aktualisiert."
  reason_required: "Sie müssen eine Begründung für die Sperrung angeben."
  cannot_forbid_root: "Root-Benutzer %nickname% kann nicht gesperrt werden."
  cannot_forbid_oper: "IRC-Operator %nickname% kann nicht gesperrt werden."
  cannot_forbid_service: "Service-Nickname %nickname% kann nicht gesperrt werden."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nickname>"
  short: "Eine Nickname-Sperrung aufheben."
  help: "Hebt das Verbot auf, sodass der Nickname wieder verwendet werden kann."
  example: "%command_prefix%UNFORBID VerbotenerNickname"
  success: "Nickname %nickname% ist nicht mehr gesperrt."
  not_forbidden: "Nickname %nickname% ist nicht gesperrt."

# --- FORBIDVHOST (IRCop) ------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <Muster>|DEL <Muster>|LIST}"
  short: "Gesperrte VHost-Muster verwalten."
  help: |-
    Verwaltet Muster, die passende VHosts mit SET VHOST verhindern. * steht für
    beliebig viele Zeichen, ? für genau ein Zeichen. IRC-Operatorrechte
    erforderlich.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Unbekannter Unterbefehl %sub%. Verwenden Sie ADD, DEL oder LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <Muster>"
    short: "Ein gesperrtes VHost-Muster hinzufügen."
    help: |-
      Fügt der Liste ein Muster hinzu. Benutzer können dann keinen passenden VHost
      mit SET VHOST festlegen. * steht für beliebig viele Zeichen, ? für ein Zeichen.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Gesperrtes VHost-Muster hinzugefügt: %pattern%"
    already_exists: "Muster %pattern% existiert bereits."
    invalid: "Ungültiges VHost-Muster-Format."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <Muster>"
    short: "Ein gesperrtes VHost-Muster entfernen."
    help: "Entfernt ein Muster aus der Liste verbotener VHosts."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Gesperrtes VHost-Muster entfernt: %pattern%"
    not_found: "Muster %pattern% nicht gefunden."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Alle gesperrten VHost-Muster auflisten."
    syntax: "FORBIDVHOST LIST"
    help: "Zeigt alle Muster verbotener VHosts an."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Gesperrte VHost-Muster (%count%):"
    entry: "%index%. %pattern% — von %nickname% (%date%)"
    empty: "Keine gesperrten VHost-Muster."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <nickname> [FORCE]"
  short: "Einen registrierten Nickname löschen."
  help: |-
    Markiert einen registrierten Nickname während der Schonfrist zur Löschung;
    mit RESTORE kann er wiederhergestellt werden. Mit FORCE wird er endgültig
    gelöscht. Root-, IRC-Operator- und Dienst-Nicknames sowie dein eigener können
    nicht gelöscht werden.
  force:
    short: "Löscht einen zur Löschung vorgemerkten Nickname endgültig."
  example: "%command_prefix%DROP AltesKonto"
  examples:
    - "%command_prefix%DROP AltesKonto FORCE"
  suspended: "Nickname %nickname% ist suspendiert. Zuerst entsuspendieren."
  forbidden: "Nickname %nickname% ist gesperrt."
  cannot_drop_root: "Root-Benutzer %nickname% kann nicht gelöscht werden."
  cannot_drop_oper: "IRC-Operator %nickname% kann nicht gelöscht werden."
  cannot_drop_self: "Sie können Ihren eigenen Nickname nicht löschen."
  success: "Nickname %nickname% wurde zur Löschung markiert und kann während der Gnadenfrist wiederhergestellt werden."
  force_success: "Nickname %nickname% wurde endgültig gelöscht."
  pending_deletion: "Nickname %nickname% ist bereits zur Löschung vorgemerkt. Verwenden Sie DROP <nickname> FORCE, um ihn dauerhaft zu löschen."
  cannot_drop_service: "Service-Nickname %nickname% kann nicht gelöscht werden."

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <nickname>"
  short: "Einen zur Löschung anstehenden Nickname wiederherstellen."
  help: |-
    Stellt einen zur Löschung vorgemerkten Nickname innerhalb der Schonfrist wieder
    her.
  example: "%command_prefix%RESTORE AltesKonto"
  success: "Nickname %nickname% wurde wiederhergestellt."
  not_pending_deletion: "Nickname %nickname% steht nicht zur Löschung an."

# --- RESCUE -------------------------------------------------------------------
rescue:
  issued: |-
    Rettungstoken: %token_display%

    Bewahre dieses Token an einem sicheren Ort auf. Du benötigst es, um deinen Nicknamen wiederherzustellen, wenn du dein Passwort vergisst.

    Verwende zur Bestätigung: /msg %bot% %verify%

    %warning%
  issued_warning: "WICHTIG: Nur das zuletzt erzeugte Token ist gültig. Nach der Bestätigung wird es nicht erneut angezeigt. Gib es an niemanden weiter."
  confirmed: "Dein Rettungstoken wurde bestätigt. Bewahre es sicher auf."
  unavailable: "Authentifiziere dich und bestätige dein Rettungstoken mit %command_0%, bevor du diese Aktion verwendest."
  unavailable_command_0: "VERIFY"
  locked_out: "Zu viele ungültige Token. Versuche es in %seconds% Sekunden erneut."
  throttled: "Zu viele ungültige Token. Versuche es in %minutes% Minute(n) erneut."
  replaced: "Dein Wiederherstellungstoken wurde durch das bestätigte Token aus der E-Mail ersetzt. Bewahre es sicher auf."
  optional_replacement: |-
    Optionales neues Wiederherstellungstoken: %token_display%

    Verwende zum Ersetzen deines aktuellen Tokens: /msg %bot% %verify%

    Dein aktuelles Token bleibt bis zur Bestätigung gültig.

    Wenn du es nicht ändern möchtest, ignoriere diese Nachricht.
  replacement_unavailable: "Dein Passwort wurde zurückgesetzt, aber ein neues Token konnte nicht ausgegeben werden. Dein aktuelles Token bleibt gültig."
  temporarily_unavailable: "Die Ausgabe des Wiederherstellungstokens ist vorübergehend nicht verfügbar. Versuche es später erneut."


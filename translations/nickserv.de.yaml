  suspended_until: "%label%               : %date%"
  label_suspended_until: "Endet am"
  suspended_permanent: "%label%               : Dauerhaft"
  label_suspended_permanent: "Endet am"
  registered_at: "%label%            : %date%"
  label_registered_at: "Registriert"
  last_seen_online: "%label%        : %online%"
  label_last_seen_online: "Zuletzt gesehen"
  value_last_seen_online: "JETZT ONLINE"
  last_seen_at: "%label%        : %date%"
  label_last_seen_at: "Zuletzt gesehen"
  last_seen_never: "%label%        : Nie"
  label_last_seen_never: "Zuletzt gesehen"
  last_quit: "%label%  : %message%"
  label_last_quit: "Letzte Quit-Nachricht"
  last_connect: "%label%  : %ip% (%host%)"

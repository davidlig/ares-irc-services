  pending_deletion_at: "%label%               : %date%"
  label_pending_deletion_at: "Gelöscht"
  pending_deletion_until: "%label%           : %date%"
  label_pending_deletion_until: "Endgültig am"
  pending_deletion_notice: "%notice%"
  value_pending_deletion_notice: "Dieser Nickname steht zur Löschung an und kann nicht registriert werden."
  channels_header: |-


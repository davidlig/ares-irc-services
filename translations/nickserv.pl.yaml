  suspended_until: "%label%              : %date%"
  label_suspended_until: "Kończy się"
  suspended_permanent: "%label%              : Stałe"
  label_suspended_permanent: "Kończy się"
  registered_at: "%label%          : %date%"
  label_registered_at: "Zarejestrowany"
  last_seen_online: "%label%       : %online%"
  label_last_seen_online: "Ostatnio widziany"
  value_last_seen_online: "TERAZ ONLINE"
  last_seen_at: "%label%       : %date%"
  label_last_seen_at: "Ostatnio widziany"
  last_seen_never: "%label%       : Nigdy"
  label_last_seen_never: "Ostatnio widziany"
  last_quit: "%label%  : %message%"
  label_last_quit: "Ostatnia wiad. wyjścia"
  last_connect: "%label%     : %ip% (%host%)"
  label_last_connect: "Ostatnio widziany z"
  language: "%label%                   : %language%"
  label_language: "Język"
  email: "%label%                  : %email%"
  label_email: "E-mail"
  vhost: "%label%                   : %vhost%"
  label_vhost: "VHost"
  no_expire: "%label%        : Tak"
  label_no_expire: "Nigdy nie wygasa"
  pending_deletion_at: "%label%               : %date%"

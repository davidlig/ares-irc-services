# Tłumaczenia NickServ — Polski
# Domena: nickserv
#
# Kody formatowania IRC (podwójne cudzysłowy lub bloki literalne !irc):
#   \x02        włącza/wyłącza pogrubienie
#   \x03NN      kolor (DZIESIĘTNIE: 03=zielony, 04=czerwony, 07=pomarańczowy, 14=ciemnoszary)
#   \x03        resetuje kolor
#   \x0F        resetuje całe formatowanie
#
# Kolory IRC używają liczb DZIESIĘTNYCH (0-15), nie szesnastkowych.
#   \x0314 = ciemnoszary (14 dziesiętnie): POPRAWNIE
#   \x030F = kolor 0, a po nim litera F: BŁĄD
#
# Wielowierszowy tekst IRC: !irc |- z rzeczywistymi podziałami wierszy i spacjami.
# Bloki bez tagu nie dekodują sekwencji ucieczki; zachowaj literały CTCP.
# Przykłady HELP: example/examples i %command_prefix%.
# Prezenter dodaje /msg bez koloru i margines dwóch spacji.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    Rejestracja oczekuje, ale nie udało się dostarczyć tokenu.
    Poczekaj na jej wygaśnięcie przed ponowną rejestracją.
  syntax: "REGISTER <hasło> [email]"
  short: "Zarejestruj swój nick w serwisach."
  help: |-
    Rejestruje Twój pseudonim. W zależności od konfiguracji sieci token
    weryfikacyjny zostanie wysłany przez czat lub e-mail.
    Po weryfikacji stanie się stałym tokenem odzyskiwania:
    przechowuj go w bezpiecznym miejscu.
    Czas ważności %duration% dotyczy wyłącznie okresu przed weryfikacją.
    Administracyjnie zablokowane domeny email nie są dozwolone.
  example: "%command_prefix%REGISTER Hasło$bezpieczne_123"
  examples:
    - "%command_prefix%REGISTER Hasło$bezpieczne_123 uzytkownik@przyklad.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Token weryfikacyjny został wysłany na adres %email%."
  pending_line_2: "Wykonaj /msg %bot% %verify%, aby dokończyć rejestrację."
  pending_line_3: "Nie dotarł? Sprawdź spam lub użyj /msg %bot% %resend%"
  pending_line_4: "Token wygaśnie za %duration%."
  already_registered: "Nick %nickname% jest już zarejestrowany."
  already_pending: "Rejestracja %nickname% jest w toku. Użyj %verify%. Jeśli token wysłano e-mailem i przypisano prawidłowy adres, możesz poprosić o kolejny przez %resend%."
  forbidden: "Nick %nickname% nie może być zarejestrowany w tej sieci."
  pending_deletion: "Nick %nickname% oczekuje na usunięcie i nie może być zarejestrowany."
  invalid_email: "Podany adres e-mail jest nieprawidłowy."
  email_already_used: "E-mail %email% jest już używany przez inny nick. Użyj innego adresu."
  throttled: "Musisz poczekać %minutes% minut(y) przed ponowną próbą rejestracji."
  guest_prefix_forbidden: "Nie możesz zarejestrować nicka zaczynającego się od %prefix%."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Potwierdza rejestrację lub token ratunkowy."
  help: |-
    Po weryfikacji ten token stanie się Twoim stałym tokenem odzyskiwania.
    Przechowuj go w bezpiecznym miejscu: pozwoli Ci odzyskać pseudonim.
    Czas ważności %duration% dotyczy wyłącznie okresu przed weryfikacją.
  example: "%command_prefix%VERIFY <otrzymany_token>"
  success: "Nick %nickname% został pomyślnie zarejestrowany i jesteś teraz zidentyfikowany."
  success_native: "Nick %nickname% został pomyślnie zarejestrowany. Użyj natywnego uwierzytelniania pokazanego poniżej."
  invalid_token: "Token ratunkowy jest nieprawidłowy."
  no_pending: "Nie masz oczekującej rejestracji do zweryfikowania."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "Nie możesz poprosić o kolejny token poleceniem %resend%, ponieważ ta rejestracja dostarcza token bezpośrednio przez czat."
  syntax: "RESEND"
  short: "Wyślij ponownie token weryfikacyjny na Twój e-mail."
  help: |-
    RESEND jest dostępne tylko wtedy, gdy token weryfikacyjny wysłano e-mailem.
    Po weryfikacji stanie się on stałym tokenem odzyskiwania. Przechowuj go
    w bezpiecznym miejscu: pozwoli Ci odzyskać pseudonim.
    Czas ważności %duration% dotyczy wyłącznie okresu przed weryfikacją.
    Po użyciu RESEND otrzymasz nowy token e-mailem.
    Okres oczekującej rejestracji zostanie przedłużony o %duration%.
  example: "%command_prefix%RESEND"
  success: "Token weryfikacyjny ponownie wysłany na %email%."
  no_pending: "Nie masz oczekującej rejestracji do zweryfikowania."
  throttled: "Musisz poczekać %minutes% minut(y) przed zażądaniem kolejnego e-maila weryfikacyjnego."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "Brak ustawionego e-maila dla nicka %nickname%. Odzyskiwanie nie jest dostępne."
  email_sent: "Token odzyskiwania został wysłany na %email_hint%. Sprawdź skrzynkę odbiorczą (i folder spam)."
  pending_deletion: "Pseudonim %nickname% oczekuje na usunięcie i nie można go odzyskać."
  instructions: "EMAIL: %command_0% żąda tymczasowego tokenu emailem. TOKEN: podaj potwierdzony token. %command_1% akceptuje poprawny token z emaila lub potwierdzony token. Token z emaila zastępuje zapisany dopiero po weryfikacji. Użycie zapisanego proponuje opcjonalną zmianę przez %command_2%; zignoruj wiadomość, aby go zachować."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <nick> [token]"
  short: "Odzyskaj nick jeśli zgubiłeś hasło."
  help: |-
    Bez tokenu poproś e-mailem o token tymczasowy.
    Możesz też podać prawidłowy token odzyskiwania; jeśli jest tymczasowy, zastąpi
    zapisany token dopiero po weryfikacji.
    Po użyciu zapisanego tokenu VERIFY zaproponuje opcjonalną zamianę; zignoruj tę
    wiadomość, jeśli chcesz zachować obecny token.
  example: "%command_prefix%RECOVER Użytkownik"
  examples:
    - "%command_prefix%RECOVER Użytkownik <otrzymany_token>"
  pending: "Rejestracja %nickname% jest w toku. Użyj %command_0%. Jeśli token wysłano e-mailem i przypisano prawidłowy adres, możesz poprosić o kolejny przez %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Nick %nickname% jest zawieszony. Powód: %reason%"
  forbidden: "Nick %nickname% nie może być używany w tej sieci."
  throttled: "Zbyt wiele błędnych tokenów. Spróbuj ponownie za %minutes% minut."
  invalid_token: "Token ratunkowy jest nieprawidłowy."
  success_identify: "Hasło zresetowane. Zidentyfikuj się teraz: %identify_cmd%"
  success_then_change: "Następnie zmień hasło: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <nowe_hasło>"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <nick> <hasło>"
  short: "Zidentyfikuj się jako właściciel nicka."
  help: |-
    Uwierzytelnia Twoją sesję z %nickserv% używając Twojego nicka i hasła.
    Po udanej identyfikacji otrzymasz tryb zarejestrowanego %emphasis_0%
    i, jeśli używałeś nicka gościa, Twój zarejestrowany nick zostanie przywrócony.
  example: "%command_prefix%IDENTIFY Użytkownik <hasło>"
  native_syntax: "/NICK <nick>:<hasło> | /NICK <nick>!<hasło>"
  native_short: "Wyświetla natywną składnię uwierzytelniania pseudonimu."
  native_help: |-
    Ten protokół uwierzytelnia konta przez zmianę pseudonimu.
    Użyj %emphasis_0% albo, jeśli pseudonim jest zajęty, %emphasis_1%.
  native_example: "/NICK Użytkownik:<hasło>"
  native_examples:
    - "%command_prefix%/NICK Użytkownik!<hasło>"
  native_authentication: "Ten protokół obsługuje uwierzytelnianie przez zmianę pseudonimu. Użyj %command_0% albo, jeśli pseudonim jest zajęty, %command_1%."
  native_authentication_command_0: "/NICK <nick>:<hasło>"
  native_authentication_command_1: "/NICK <nick>!<hasło>"
  success: "Jesteś teraz zidentyfikowany jako %nickname%."
  already_identified: "Jesteś już zidentyfikowany jako %nickname%."
  invalid_credentials: "Nieprawidłowe hasło. Spróbuj ponownie."
  locked_out: "Zbyt wiele nieudanych prób. Spróbuj ponownie za %minutes% minut(y)."
  ghost_released: "Sesja-duch trzymająca %nickname% została rozłączona."
  kill_reason: "Nick %nickname% odzyskany przez %source% (zarejestrowany właściciel zidentyfikował się)"
  pending: |-
    %first%
    %second%
  pending_line_1: "Pseudonim %nickname% oczekuje na weryfikację e-mail."
  pending_line_2: "Wykonaj /msg %bot% %command_0% lub /msg %bot% %command_1%"
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Nick %nickname% jest zawieszony. Powód: %reason%"
  forbidden: "Nick %nickname% nie może być używany w tej sieci."
  pending_deletion: "Nick %nickname% oczekuje na usunięcie i nie może być używany."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <nick>"
  short: "Wyświetl status rejestracji nicka."
  help: |-
    Wyświetla bieżący stan pseudonimu: zarejestrowany, oczekujący na
    weryfikację, zawieszony itd.
  example: "%command_prefix%STATUS Użytkownik"
  header: "Status nicka %nickname%"
  unregistered: "  Status          : Niezarejestrowany"
  not_registered_offline: "  Status          : %state%"
  value_not_registered_offline: "Niezarejestrowany"
  pending: "  Status          : %state%"
  value_pending: "Oczekująca weryfikacja"
  pending_expires: "  Wygasa za       : %minutes% minut(y)"
  pending_expires_at: "  Wygasa o        : %date%"
  not_connected: "  Status          : %state%"
  value_not_connected: "Niepołączony"
  not_identified: "  Status          : %state%"
  value_not_identified: "Niezidentyfikowany"
  identified: "  Status          : %state%"
  value_identified: "Zidentyfikowany"
  suspended: "  Status          : %state%"
  value_suspended: "Zawieszony"
  suspended_reason: "  Powód           : %reason%"
  suspended_until: "  Kończy się      : %date%"
  suspended_permanent: "  Kończy się      : Stałe"
  forbidden: "  Status          : %state%"
  value_forbidden: "Zabroniony"
  forbidden_reason: "  Powód           : %reason%"
  pending_deletion: "  %label%          : %state%"
  value_pending_deletion: "Oczekuje na usunięcie"
  label_pending_deletion: "Status"
  pending_deletion_at: "  %label%        : %date%"

  label_pending_deletion_at: "Usunięty"
# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <nick>"
  short: "Wyświetl informacje o zarejestrowanym nicku."
  help: |-
    Wyświetla dane rejestracji pseudonimu: datę utworzenia, stan połączenia,
    ostatnią wysłaną wiadomość i adres e-mail.

    Adres e-mail jest widoczny tylko dla zidentyfikowanego właściciela.
    Jeśli pseudonim jest prywatny, informacje może zobaczyć tylko jego właściciel
    i operatorzy IRC.
  example: "%command_prefix%INFO Użytkownik"
  private: "Informacje o nicku %nickname% są prywatne."
  header: "Informacje o nicku %nickname%"
  status: "%label%                  : %status%"

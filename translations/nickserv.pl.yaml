# NickServ translations — Polski
# Domain: nickserv
#
# IRC formatting codes (inside double-quoted strings, use \x## hex escapes):
#   \x02        bold on/off
#   \x03NN      color (DECIMAL: 03=green, 04=red, 07=orange, 14=dark grey)
#   \x03        reset color
#   \x0F        reset all formatting
#
# Kolory IRC używają liczb DZIESIĘTNYCH (0-15), nie szesnastkowych.
#   \x0314 = ciemnoszary (14 dziesiętnie): POPRAWNIE
#   \x030F = kolor 0, a po nim litera F: BŁĄD
#
# Wielowierszowy tekst IRC: !irc |- z rzeczywistymi podziałami wierszy i spacjami.
# Bloki bez tagu nie dekodują sekwencji ucieczki; zachowaj literały CTCP.
# Przykłady HELP: example/examples i %command_prefix%.
# Prezenter dodaje /msg bez koloru i margines dwóch spacji.

# --- REGISTER ---------------------------------------------------------------
register:
  token_unavailable: "\x0304✗\x03 Rejestracja oczekuje, ale nie udało się dostarczyć tokenu.\nPoczekaj na jej wygaśnięcie przed ponowną rejestracją."
  syntax: "REGISTER <password> [email]"
  short:            "Zarejestruj swój nick w serwisach."
  help: "TOKEN: REGISTER <password> [email]. EMAIL: REGISTER <password> <email>.\nPo weryfikacji ten token stanie się stałym tokenem odzyskiwania. Zachowaj go bezpiecznie: pozwoli odzyskać pseudonim. Czas ważności %duration% dotyczy wyłącznie okresu przed weryfikacją."
  example: "%command_prefix%\x02\x0303REGISTER Hasło$bezpieczne_123\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGISTER Hasło$bezpieczne_123 uzytkownik@przyklad.com\x03\x0F"
  pending:          "\x0307→\x03 Token weryfikacyjny został wysłany na \x02%email%\x02.\n  Uruchom \x0303/msg %bot% VERIFY <token>\x03 aby zakończyć rejestrację.\n  Nie otrzymałeś? Sprawdź spam lub użyj \x0303/msg %bot% RESEND\x03\n  Token wygaśnie za \x02%duration%\x02."
  already_registered: "\x0304✗\x03 Nick \x02%nickname%\x02 jest już zarejestrowany."
  already_pending: "\x0307→\x03 Rejestracja \x02%nickname%\x02 oczekuje. Użyj \x0303VERIFY <token>\x03. \x0303RESEND\x03 jest dostępne tylko przy REGMODE EMAIL i przypisanym poprawnym adresie email."
  forbidden:        "\x0304✗\x03 Nick \x02%nickname%\x02 nie może być zarejestrowany w tej sieci."
  pending_deletion: "\x0304✗\x03 Nick \x02%nickname%\x02 oczekuje na usunięcie i nie może być zarejestrowany."
  invalid_email:    "\x0304✗\x03 Podany adres e-mail jest nieprawidłowy."
  email_already_used: "\x0304✗\x03 E-mail \x02%email%\x02 jest już używany przez inny nick. Użyj innego adresu."
  throttled:          "\x0304✗\x03 Musisz poczekać \x02%minutes%\x02 minut(y) przed ponowną próbą rejestracji."
  guest_prefix_forbidden: "\x0304✗\x03 Nie możesz zarejestrować nicka zaczynającego się od \x02%prefix%\x02."

# --- VERIFY -----------------------------------------------------------------
verify:
  syntax:           "VERIFY <token>"
  short: "Potwierdza rejestrację lub token ratunkowy."
  help: "Po weryfikacji ten token stanie się stałym tokenem odzyskiwania. Zachowaj go bezpiecznie: pozwoli odzyskać pseudonim. Czas ważności %duration% dotyczy wyłącznie okresu przed weryfikacją."
  example: "%command_prefix%\x02\x0303VERIFY <otrzymany_token>\x03\x0F"
  success:          "\x0303✔\x03 Nick \x02%nickname%\x02 został pomyślnie zarejestrowany i jesteś teraz zidentyfikowany."
  success_native:   "\x0303✔\x03 Nick \x02%nickname%\x02 został pomyślnie zarejestrowany. Użyj natywnego uwierzytelniania pokazanego poniżej."
  invalid_token: "\x0304✗\x03 Token ratunkowy jest nieprawidłowy."
  no_pending:       "\x0304✗\x03 Nie masz oczekującej rejestracji do zweryfikowania."

# --- RESEND -----------------------------------------------------------------
resend:
  disabled: "\x0307ℹ\x03 \x0303RESEND\x03 jest wyłączone, gdy REGMODE ma wartość TOKEN."
  syntax:           "RESEND"
  short:            "Wyślij ponownie token weryfikacyjny na Twój e-mail."
  help: "RESEND jest wyłączone, gdy REGMODE ma wartość TOKEN.\nPo weryfikacji ten token stanie się stałym tokenem odzyskiwania. Zachowaj go bezpiecznie: pozwoli odzyskać pseudonim. Czas ważności %duration% dotyczy wyłącznie okresu przed weryfikacją.\nW trybie EMAIL polecenie RESEND odnawia token i termin oczekującej rejestracji na %duration%."
  example: "%command_prefix%\x02\x0303RESEND\x03\x0F"
  success:          "\x0307→\x03 Token weryfikacyjny ponownie wysłany na \x02%email%\x02."
  no_pending:       "\x0304✗\x03 Nie masz oczekującej rejestracji do ponownego wysłania tokenu."
  throttled:        "\x0304✗\x03 Musisz poczekać \x02%minutes%\x02 minut(y) przed zażądaniem kolejnego e-maila weryfikacyjnego."

# --- RECOVER -----------------------------------------------------------------
recover:
  no_email: "\u000304✗\u0003 Brak ustawionego e-maila dla nicka \u0002%nickname%\u0002. Odzyskiwanie nie jest dostępne."
  email_sent: "\u000307→\u0003 Token odzyskiwania został wysłany na \u0002%email_hint%\u0002. Sprawdź skrzynkę odbiorczą (i folder spam)."
  pending_deletion: "\x0304✗\x03 Pseudonim \x02%nickname%\x02 oczekuje na usunięcie i nie można go odzyskać."
  instructions: "\x0307ℹ\x03 EMAIL: \x0303RECOVER %nickname%\x03 żąda tymczasowego tokenu emailem. TOKEN: podaj potwierdzony token. \x0303RECOVER %nickname% <token>\x03 akceptuje poprawny token z emaila lub potwierdzony token. Token z emaila zastępuje zapisany dopiero po weryfikacji. Użycie zapisanego proponuje opcjonalną zmianę przez \x0303VERIFY\x03; zignoruj wiadomość, aby go zachować."
  syntax:           "RECOVER <nick> [token]"
  short:            "Odzyskaj nick jeśli zgubiłeś hasło."
  help: "EMAIL: RECOVER <nickname> żąda tymczasowego tokenu emailem. TOKEN: podaj potwierdzony token. RECOVER <nickname> <token> akceptuje poprawny token z emaila lub potwierdzony token. Token z emaila zastępuje zapisany dopiero po weryfikacji. Użycie zapisanego proponuje opcjonalną zmianę przez VERIFY; zignoruj wiadomość, aby go zachować."
  example: "%command_prefix%\x02\x0303RECOVER Użytkownik\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303RECOVER Użytkownik <otrzymany_token>\x03\x0F"
  pending: "\x0307→\x03 Rejestracja \x02%nickname%\x02 oczekuje. Użyj \x0303VERIFY <token>\x03. \x0303RESEND\x03 jest dostępne tylko przy REGMODE EMAIL i przypisanym poprawnym adresie email."
  suspended:        "\x0304✗\x03 Nick \x02%nickname%\x02 jest zawieszony. Powód: %reason%"
  forbidden:        "\x0304✗\x03 Nick \x02%nickname%\x02 nie może być używany w tej sieci."
  throttled: "\x0304✗\x03 Zbyt wiele błędnych tokenów. Spróbuj ponownie za \x02%minutes%\x02 minut."
  invalid_token: "\x0304✗\x03 Token ratunkowy jest nieprawidłowy."
  success_identify: "\x0303✔\x03 Hasło zresetowane. Zidentyfikuj się teraz: \x0303%identify_cmd%\x03"
  success_then_change: "Następnie zmień hasło: \x0303/msg %bot% SET PASSWORD <nowe_hasło>\x03"

# --- IDENTIFY ---------------------------------------------------------------
identify:
  syntax:           "IDENTIFY <nick> <hasło>"
  short:            "Zidentyfikuj się jako właściciel nicka."
  help:             "Uwierzytelnia Twoją sesję z %nickserv% używając Twojego nicka i hasła.\nPo udanej identyfikacji otrzymasz tryb zarejestrowanego \x02+r\x02\ni, jeśli używałeś nicka gościa, Twój zarejestrowany nick zostanie przywrócony."
  example: "%command_prefix%\x02\x0303IDENTIFY Użytkownik <hasło>\x03\x0F"
  native_syntax:    "/NICK <nick>:<hasło> | /NICK <nick>!<hasło>"
  native_short:     "Wyświetla natywną składnię uwierzytelniania pseudonimu."
  native_help:      "Ten protokół uwierzytelnia konta przez zmianę pseudonimu.\nUżyj /NICK <nick>:<hasło> albo, jeśli pseudonim jest zajęty, /NICK <nick>!<hasło>."
  native_example: "\x02\x0303/NICK Użytkownik:<hasło>\x03\x0F"
  native_examples:
    - "%command_prefix%\x02\x0303/NICK Użytkownik!<hasło>\x03\x0F"
  native_authentication: "\x0307ℹ\x03 Ten protokół obsługuje uwierzytelnianie przez zmianę pseudonimu. Użyj \x0303/NICK <nick>:<hasło>\x03 albo, jeśli pseudonim jest zajęty, \x0303/NICK <nick>!<hasło>\x03."
  success:          "\x0303✔\x03 Jesteś teraz zidentyfikowany jako \x02%nickname%\x02."
  already_identified: "\x0307ℹ\x03 Jesteś już zidentyfikowany jako \x02%nickname%\x02."
  invalid_credentials: "\x0304✗\x03 Nieprawidłowe hasło. Spróbuj ponownie."
  locked_out:         "\x0304✗\x03 Zbyt wiele nieudanych prób. Spróbuj ponownie za \x02%minutes%\x02 minut(y)."
  ghost_released:   "\x0307⚡\x03 Sesja-duch trzymająca \x02%nickname%\x02 została rozłączona."
  kill_reason:      "Nick %nickname% odzyskany przez %source% (zarejestrowany właściciel zidentyfikował się)"
  pending:          "\x0304✗\x03 Nick \x02%nickname%\x02 oczekuje na weryfikację e-mail.\n  Uruchom \x0303/msg %bot% VERIFY <token>\x03 lub \x0303/msg %bot% RESEND\x03."
  suspended:        "\x0304✗\x03 Nick \x02%nickname%\x02 jest zawieszony. Powód: %reason%"
  forbidden:        "\x0304✗\x03 Nick \x02%nickname%\x02 nie może być używany w tej sieci."
  pending_deletion: "\x0304✗\x03 Nick \x02%nickname%\x02 oczekuje na usunięcie i nie może być używany."

# --- STATUS -----------------------------------------------------------------
status:
  syntax:           "STATUS <nick>"
  short:            "Wyświetl status rejestracji nicka."
  help:             "Pokazuje obecny status nicka: zarejestrowany, oczekująca weryfikacja,\nzawieszony lub zabroniony."
  example: "%command_prefix%\x02\x0303STATUS Użytkownik\x03\x0F"
  header:           "\x02Status nicka \x0307%nickname%\x03\x02"
  unregistered:     "  Status          : Niezarejestrowany"
  not_registered_offline: "  Status          : \x0315Niezarejestrowany\x03"
  pending:          "  Status          : \x0307Oczekująca weryfikacja\x03"
  pending_expires:  "  Wygasa za       : %minutes% minut(y)"
  pending_expires_at: "  Wygasa o        : %date%"
  not_connected:    "  Status          : \x0315Niepołączony\x03"
  not_identified:   "  Status          : \x0307Niezidentyfikowany\x03"
  identified:       "  Status          : \x0303Zidentyfikowany\x03"
  suspended:        "  Status          : \x0304Zawieszony\x03"
  suspended_reason: "  Powód           : %reason%"
  suspended_until:  "  Kończy się      : %date%"
  suspended_permanent: "  Kończy się      : Stałe"
  forbidden:        "  Status          : \x0304Zabroniony\x03"
  forbidden_reason: "  Powód           : %reason%"
  pending_deletion:   "  \x0314Status\x03          : \x0307Oczekuje na usunięcie\x03"
  pending_deletion_at: "  \x0314Usunięty\x03        : %date%"

# --- INFO -------------------------------------------------------------------
info:
  syntax:           "INFO <nick>"
  short:            "Wyświetl informacje o zarejestrowanym nicku."
  help:             "Pokazuje szczegóły rejestracji nicka: datę rejestracji, status\npołączenia, ostatnią wiadomość wyjścia i adres e-mail. E-mail jest widoczny tylko\ndla właściciela gdy zidentyfikowany. Przy PRIVATE ON tylko właściciel i Operatorzy IRC\nmogą zobaczyć informacje."
  example: "%command_prefix%\x02\x0303INFO Użytkownik\x03\x0F"
  private:          "\x0304✗\x03 Informacje o nicku \x02%nickname%\x02 są prywatne."
  header:           "\x02Informacje o nicku \x0307%nickname%\x03\x02"
  status:           "  \x0314Status\x03                  : %status%"
  status_registered:  "\x0303Zarejestrowany\x03"
  status_suspended:   "\x0304Zawieszony\x03"
  status_forbidden:   "\x0304Zabroniony\x03"
  status_pending_deletion: "\x0307Oczekuje na usunięcie\x03"
  reason:           "  \x0314Powód\x03                   : %reason%"
  suspended_until:  "  \x0314Kończy się\x03              : %date%"
  suspended_permanent: "  \x0314Kończy się\x03              : Stałe"
  registered_at:    "  \x0314Zarejestrowany\x03          : %date%"
  last_seen_online: "  \x0314Ostatnio widziany\x03       : \x0303● TERAZ ONLINE\x03"
  last_seen_at:     "  \x0314Ostatnio widziany\x03       : %date%"
  last_seen_never:  "  \x0314Ostatnio widziany\x03       : Nigdy"
  last_quit:        "  \x0314Ostatnia wiad. wyjścia\x03  : %message%"
  last_connect:     "  \x0314Ostatnio widziany z\x03     : %ip% (%host%)"
  language:         "  \x0314Język\x03                   : %language%"
  email:            "  \x0314E-mail\x03                  : %email%"
  vhost:            "  \x0314VHost\x03                   : %vhost%"
  no_expire:        "  \x0314Nigdy nie wygasa\x03        : Tak"
  pending_deletion_at: "  \x0314Usunięty\x03               : %date%"
  pending_deletion_until: "  \x0314Trwale usunięcie\x03       : %date%"
  pending_deletion_notice: "  \x0307Ten nick oczekuje na usunięcie i nie może być zarejestrowany.\x03"
  channels_header:  "\x0314\x0AKanały z dostępem:\x03"
  channels_entry_founder:   "  %channel% (\x0303Założyciel\x03)"
  channels_entry_successor: "  %channel% (\x0303Następca\x03)"
  channels_entry_access:    "  %channel% (%level%)"

# --- SET --------------------------------------------------------------------
set:
  syntax:           "SET <opcja> <wartość>"
  short:            "Zmień opcje swojego nicka."
  help:             "Modyfikuje ustawienia Twojego nicka %nickserv%.\nMusisz być zidentyfikowany aby użyć tej komendy."
  example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
  unknown_option:   "\x0304✗\x03 Nieznana opcja \x02%option%\x02. Dostępne opcje: %options%."

  password:
    syntax:         "SET PASSWORD <nowe_hasło>"
    short:          "Zmień hasło swojego nicka."
    help:           "Zmienia hasło dla Twojego nicka. Nowe hasło obowiązuje\nnatychmiast. Wybierz silne hasło o długości co najmniej 6 znaków,\nktórego nie używasz w innych serwisach."
    success:        "\x0303✔\x03 Twoje hasło zostało pomyślnie zaktualizowane."

  email:
    token_required: "\x0304✗\x03 Użyj \x0303SET EMAIL <email> <token>\x03 z potwierdzonym tokenem ratunkowym."
    syntax: "SET EMAIL <email> <token>"
    short:          "Zmień adres e-mail powiązany z Twoim nickiem (dwuetapowe potwierdzenie)."
    help: "SET EMAIL zmienia adres kontaktowy po walidacji tokenu ratunkowego bez jego zużywania. Sprawdza format i unikalność; nie wysyła wiadomości potwierdzającej."
    success:        "\x0303✔\x03 Twój e-mail został zaktualizowany na \x02%email%\x02."
    pending_sent:   "\x0307→\x03 Token potwierdzający został wysłany na \x02%current_email%\x02.\n  Aby potwierdzić zmianę na \x02%new_email%\x02 uruchom:\n  \x0303/msg %bot% SET EMAIL %new_email% <token>\x03\n  Token wygasa za 1 godzinę."
    invalid_token:  "\x0304✗\x03 Token jest nieprawidłowy lub wygasł. Poproś o nowy używając \x0303SET EMAIL <nowy_e-mail>\x03."

  language:
    syntax:         "SET LANGUAGE <kod>"
    short:          "Zmień język używany przez serwisy do komunikacji z Tobą."
    help:           "Zmienia język, w jakim %nickserv% i inne serwisy mówią do Ciebie.\nDostępne języki:\n  \x02ca\x02 (kataloński)\n  \x02de\x02 (niemiecki)\n  \x02el\x02 (grecki)\n  \x02en\x02 (angielski)\n  \x02es\x02 (hiszpański)\n  \x02eu\x02 (baskijski)\n  \x02fr\x02 (francuski)\n  \x02gl\x02 (galicyjski)\n  \x02it\x02 (włoski)\n  \x02nl\x02 (niderlandzki)\n  \x02pl\x02 (polski)\n  \x02pt\x02 (portugalski)\n  \x02ro\x02 (rumuński)\n  \x02tr\x02 (turecki)"
    success:        "\x0303✔\x03 Język zmieniony na \x02%language%\x02."
    invalid:        "\x0304✗\x03 Nieobsługiwany język. Dostępne języki: %languages%."

  timezone:
    syntax:         "SET TIMEZONE <strefa_czasowa>"
    short:          "Ustaw strefę czasową używaną przy wyświetlaniu dat."
    help:           "Ustawia strefę czasową używaną gdy %nickserv% pokazuje daty.\nUżyj \x02HELP SET TIMEZONE\x02 aby zobaczyć indeks regionów; \x02HELP SET TIMEZONE <region>\x02 (np. Europe) aby zobaczyć strefy danego regionu. Użyj \x02OFF\x02 aby wyczyścić."
    success:        "\x0303✔\x03 Strefa czasowa ustawiona na \x02%timezone%\x02. Daty będą wyświetlane w tej strefie."
    cleared:        "\x0303✔\x03 Strefa czasowa wyczyszczona. Daty będą używać domyślnej sieciowej."
    invalid:        "\x0304✗\x03 Nieprawidłowa strefa czasowa \x02%timezone%\x02. Użyj prawidłowego identyfikatora (np. UTC, Europe/Warsaw)."

  private:
    syntax:         "SET PRIVATE {ON|OFF}"
    short:          "Włącz lub wyłącz prywatność informacji o Twoim nicku."
    help:           "Kontroluje widoczność informacji o Twoim nicku w komendzie INFO.\nPrzy \x02PRIVATE ON\x02 tylko Ty i Operatorzy IRC mogą zobaczyć Twoje dane.\nPrzy \x02PRIVATE OFF\x02 Twoje informacje są publiczne dla wszystkich."
    on:             "\x0303✔\x03 Informacje o Twoim nicku są teraz \x02prywatne\x02."
    off:            "\x0303✔\x03 Informacje o Twoim nicku są teraz \x02publiczne\x02."

  msg:
    syntax:         "SET MSG {ON|OFF}"
    short:          "Użyj PRIVMSG (ON) lub NOTICE (OFF) dla odpowiedzi serwisów."
    help:           "Kontroluje jak %nickserv% i inne serwisy wysyłają do Ciebie wiadomości.\nPrzy \x02MSG ON\x02 odpowiedzi są wysyłane jako \x02PRIVMSG\x02 (niektóre klienty mogą wywołać automatyczne odpowiedzi lub powiadomienia).\nPrzy \x02MSG OFF\x02 odpowiedzi są wysyłane jako \x02NOTICE\x02 (domyślnie; zazwyczaj bez automatycznej odpowiedzi)."
    on:             "\x0303✔\x03 Wiadomości serwisów będą teraz wysyłane jako \x02PRIVMSG\x02."
    off:            "\x0303✔\x03 Wiadomości serwisów będą teraz wysyłane jako \x02NOTICE\x02."

  vhost:
    syntax:         "SET VHOST [vhost]"
    short:          "Ustaw lub wyczyść swój niestandardowy host wirtualny (wyświetlany hostname)."
    help:           "Ustawia niestandardową nazwę hosta, którą inni widzą gdy jesteś zidentyfikowany.\nUżyj \x02SET VHOST\x02 bez wartości aby wyczyścić. Tylko litery (a-z, A-Z), cyfry, myślnik i kropka;\nbez myślnika lub kropki na początku/końcu bloku; maks. 48 znaków. Unikalny na nick."
    success:        "\x0303✔\x03 Twój host wirtualny został ustawiony na \x02%vhost%\x02."
    cleared:        "\x0303✔\x03 Twój host wirtualny został wyczyszczony."
    invalid:        "\x0304✗\x03 Nieprawidłowy vhost. Tylko litery, cyfry, myślnik i kropka (nie na początku/końcu bloku); maks. 48 znaków."
    taken:          "\x0304✗\x03 Ten vhost jest już używany przez inny nick."
    forced:         "\x0304✗\x03 Twój vhost jest konfigurowany automatycznie i nie może być zmieniony przez SET VHOST."

# --- SASET (IRCop) --------------------------------------------------------------
saset:
  syntax:           "SASET <nick> <opcja> <wartość>"
  short:            "Modyfikuj ustawienia innego nicka."
  help: |-
    Pozwala IRCop zmienić ustawienia innego zarejestrowanego pseudonimu. Nie
    dotyczy pseudonimów Root, IRCop ani usług.
  example: "%command_prefix%\x02\x0303SASET Użytkownik PRIVATE ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SASET Użytkownik TIMEZONE OFF\x03\x0F"
  unknown_option:   "\x0304✗\x03 Nieznana opcja \x02%option%\x02. Dostępne opcje: %options%."
  cannot_modify_oper: "\x0304✗\x03 Nie można modyfikować nicka Operatora IRC."

  password:
    syntax:         "SASET <nick> PASSWORD <nowe_hasło>"
    short:          "Zmień hasło nicka."
    help:           "Zmienia hasło innego nicka.\nZmiana jest natychmiastowa.\n\nSkładnia: SASET <nick> PASSWORD <nowe_hasło>\nPrzykład: SASET Użytkownik PASSWORD nowehasło123"

  email:
    syntax:         "SASET <nick> EMAIL <nowy_e-mail>"
    short:          "Zmień e-mail nicka."
    help:           "Zmienia e-mail innego nicka.\nŻadne potwierdzenie nie jest wysyłane—zmiana jest natychmiastowa.\n\nSkładnia: SASET <nick> EMAIL <nowy_e-mail>\nPrzykład: SASET Użytkownik EMAIL użytkownik@przykład.com"

  language:
    syntax:         "SASET <nick> LANGUAGE <kod>"
    short:          "Zmień język nicka."
    help:           "Zmienia język innego nicka.\nDostępne języki: en (angielski), es (hiszpański).\n\nSkładnia: SASET <nick> LANGUAGE <kod>\nPrzykład: SASET Użytkownik LANGUAGE pl"

  timezone:
    syntax:         "SASET <nick> TIMEZONE <strefa_czasowa|OFF>"
    short:          "Zmień strefę czasową nicka."
    help:           "Ustawia lub czyści strefę czasową innego nicka.\nUżyj OFF, aby wyczyścić.\n\nSkładnia: SASET <nick> TIMEZONE <strefa_czasowa>\nPrzykład: SASET Użytkownik TIMEZONE Europe/Warsaw"

  private:
    syntax:         "SASET <nick> PRIVATE {ON|OFF}"
    short:          "Zmień prywatność nicka."
    help:           "Włącza lub wyłącza prywatność informacji innego nicka.\n\nSkładnia: SASET <nick> PRIVATE {ON|OFF}\nPrzykład: SASET Użytkownik PRIVATE ON"

  msg:
    syntax:         "SASET <nick> MSG {ON|OFF}"
    short:          "Zmień preferencję wiadomości nicka."
    help:           "Ustawia, czy inny nick otrzymuje odpowiedzi jako PRIVMSG (ON) lub NOTICE (OFF).\n\nSkładnia: SASET <nick> MSG {ON|OFF}\nPrzykład: SASET Użytkownik MSG ON"

  vhost:
    syntax:         "SASET <nick> VHOST [vhost]"
    short:          "Zmień host wirtualny nicka."
    help:           "Ustawia lub czyści host wirtualny innego nicka.\nUżyj \x02SASET <nick> VHOST\x02 bez wartości, aby wyczyścić.\n\nSkładnia: SASET <nick> VHOST [vhost]\nPrzykład: SASET Użytkownik VHOST użytkownicy.przykład.com"


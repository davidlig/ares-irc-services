  channels_entry_access: "%channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <nowe_hasło>|EMAIL <email> <token>|LANGUAGE <kod>|TIMEZONE <strefa_czasowa>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Zmień opcje swojego nicka."
  help: |-
    Zmienia ustawienia Twojego pseudonimu. Aby zmienić te opcje, musisz być
    zidentyfikowany.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Nieznana opcja %option%. Dostępne opcje: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <nowe_hasło>"
    short: "Zmień hasło swojego nicka."
    help: |-
      Zmienia hasło dla Twojego nicka. Nowe hasło obowiązuje
      natychmiast. Wybierz silne hasło o długości co najmniej 6 znaków,
      którego nie używasz w innych serwisach.
    example: "%command_prefix%SET PASSWORD Hasło$bezpieczne_123"
    success: "Twoje hasło zostało pomyślnie zaktualizowane."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Użyj %value% z potwierdzonym tokenem ratunkowym."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Zmienia adres e-mail za pomocą potwierdzonego tokenu odzyskiwania."
    help: |-
      SET EMAIL zmienia kontaktowy adres e-mail po weryfikacji tokenu odzyskiwania,
      nie zużywając go. Sprawdza format i unikalność; nie wysyła potwierdzenia
      e-mailem.
      Administracyjnie zablokowane domeny email nie są dozwolone.
    example: "%command_prefix%SET EMAIL uzytkownik@przyklad.com <token_confirmado>"
    success: "Twój e-mail został zaktualizowany na %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Token potwierdzający został wysłany na adres %current_email%."
    pending_line_2: "Aby potwierdzić zmianę na %new_email%, wykonaj:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "Token wygaśnie za godzinę."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "Token jest nieprawidłowy lub wygasł. Poproś o nowy używając %value%."
    invalid_token_value: "SET EMAIL <nowy_e-mail>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <kod>"
    short: "Zmień język używany przez serwisy do komunikacji z Tobą."
    help: |-
      Zmienia język, w jakim %nickserv% i inne serwisy mówią do Ciebie.
      Dostępne języki:
      %emphasis_0% (kataloński)
      %emphasis_1% (niemiecki)
      %emphasis_2% (grecki)
      %emphasis_3% (angielski)
      %emphasis_4% (hiszpański)
      %emphasis_5% (baskijski)
      %emphasis_6% (francuski)
      %emphasis_7% (galicyjski)
      %emphasis_8% (włoski)
      %emphasis_9% (niderlandzki)
      %emphasis_10% (polski)
      %emphasis_11% (portugalski)
      %emphasis_12% (rumuński)
      %emphasis_13% (turecki)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Język zmieniony na %language%."
    invalid: "Nieobsługiwany język. Dostępne języki: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <strefa_czasowa>"
    short: "Ustaw strefę czasową używaną przy wyświetlaniu dat."
    help: |-
      Ustawia strefę czasową używaną przez %nickserv% do wyświetlania dat. Użyj HELP
      SET TIMEZONE, aby zobaczyć regiony. Użyj OFF, aby ją usunąć.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Strefa czasowa ustawiona na %timezone%. Daty będą wyświetlane w tej strefie."
    cleared: "Strefa czasowa wyczyszczona. Daty będą używać domyślnej sieciowej."
    invalid: "Nieprawidłowa strefa czasowa %timezone%. Użyj prawidłowego identyfikatora (np. UTC, Europe/Warsaw)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Pokazuje lub ukrywa informacje o Twoim pseudonimie."
    help: |-
      Kontroluje widoczność informacji o Twoim nicku w komendzie INFO.
      Przy %emphasis_0% tylko Ty i Operatorzy IRC mogą zobaczyć Twoje dane.
      Przy %emphasis_1% Twoje informacje są publiczne dla wszystkich.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Informacje o Twoim nicku są teraz %value%."
    on_value: "prywatne"
    off: "Informacje o Twoim nicku są teraz %value%."
    off_value: "publiczne"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Zmienia sposób komunikacji usług z Tobą."
    help: |-
      Określa, jak %nickserv% i pozostałe usługi wysyłają Ci wiadomości.
      Przy %emphasis_0% odpowiedzi są wysyłane jako %emphasis_1%.
      Przy %emphasis_2% odpowiedzi są wysyłane jako %emphasis_3%.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Wiadomości serwisów będą teraz wysyłane jako %value%."
    on_value: "PRIVMSG"
    off: "Wiadomości serwisów będą teraz wysyłane jako %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Ustawia lub usuwa Twój wirtualny host."
    help: |-
      Ustawia niestandardową nazwę hosta widoczną dla innych użytkowników, gdy
      jesteś zidentyfikowany.

      Aby ją usunąć, wykonaj %emphasis_0% bez wartości.

      Dozwolone są tylko litery (a-z, A-Z), cyfry, łączniki i kropki.
      Każdy człon musi zaczynać się i kończyć literą lub cyfrą.
      Nazwa hosta może mieć maksymalnie 48 znaków i musi być unikalna dla pseudonimu.
    example: "%command_prefix%SET VHOST uzytkownik.przyklad.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Twój host wirtualny został ustawiony na %vhost%."
    cleared: "Twój host wirtualny został wyczyszczony."
    invalid: "Nieprawidłowy vhost. Tylko litery, cyfry, myślnik i kropka (nie na początku/końcu bloku); maks. 48 znaków."
    taken: "Ten vhost jest już używany przez inny nick."
    forced: "Twój vhost jest konfigurowany automatycznie i nie może być zmieniony przez SET VHOST."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <nick> {PASSWORD <nowe_hasło>|EMAIL <nowy_e-mail>|LANGUAGE <kod>|TIMEZONE {<strefa_czasowa>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Modyfikuj ustawienia innego nicka."
  help: |-
    Pozwala IRCop zmienić ustawienia innego zarejestrowanego pseudonimu. Nie
    dotyczy pseudonimów Root, IRCop ani usług.
  example: "%command_prefix%SASET Użytkownik PRIVATE ON"
  examples:
    - "%command_prefix%SASET Użytkownik TIMEZONE OFF"
  unknown_option: "Nieznana opcja %option%. Dostępne opcje: %options%."
  cannot_modify_oper: "Nie można modyfikować nicka Operatora IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <nick> PASSWORD <nowe_hasło>"
    short: "Zmień hasło nicka."
    help: "Zmienia hasło innego pseudonimu. Zmiana jest natychmiastowa."
    example: "%command_prefix%SASET Użytkownik PASSWORD BezpieczneHaslo123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <nick> EMAIL <nowy_e-mail>"
    short: "Zmień e-mail nicka."
    help: |-
      Zmienia adres e-mail innego pseudonimu. Zmiana jest natychmiastowa i nie
      wymaga tokenu odzyskiwania ani wysłania wiadomości potwierdzającej.
      BADMAIL nie ogranicza tej administracyjnej zmiany adresu email.
    example: "%command_prefix%SASET Użytkownik EMAIL uzytkownik@przyklad.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <nick> LANGUAGE <kod>"
    short: "Zmień język nicka."
    help: |-
      Zmienia język innego pseudonimu. W tym poleceniu dostępne są en (angielski)
      i es (hiszpański).
    example: "%command_prefix%SASET Użytkownik LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <nick> TIMEZONE {<strefa_czasowa>|OFF}"
    short: "Zmień strefę czasową nicka."
    help: "Ustawia lub usuwa strefę czasową innego pseudonimu. Użyj OFF, aby ją usunąć."
    example: "%command_prefix%SASET Użytkownik TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Użytkownik TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <nick> PRIVATE {ON|OFF}"
    short: "Zmień prywatność nicka."
    help: "Włącza lub wyłącza prywatność informacji o innym pseudonimie."
    example: "%command_prefix%SASET Użytkownik PRIVATE ON"
    examples:
      - "%command_prefix%SASET Użytkownik PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <nick> MSG {ON|OFF}"
    short: "Zmień preferencję wiadomości nicka."
    help: |-
      Ustawia, czy odpowiedzi dla innego pseudonimu są wysyłane jako PRIVMSG (ON)
      czy NOTICE (OFF).
    example: "%command_prefix%SASET Użytkownik MSG ON"
    examples:
      - "%command_prefix%SASET Użytkownik MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <nick> VHOST [vhost]"
    short: "Zmień host wirtualny nicka."
    help: |-
      Ustawia lub usuwa wirtualny host innego pseudonimu. Wykonaj SASET <pseudonim>
      VHOST bez wartości, aby go usunąć.
    example: "%command_prefix%SASET Użytkownik VHOST uzytkownik.przyklad.org"
    examples:
      - "%command_prefix%SASET Użytkownik VHOST"

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [komenda]"
  short: "Wyświetl pomoc dla komend %nickserv%."
  help: |-
    Wyświetla ogólną pomoc %nickserv% lub szczegółowe informacje
    dla konkretnej komendy.
  examples_header: "Przykłady:"
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP SET"
    - "%command_prefix%HELP SET EMAIL"
    - "%command_prefix%HELP SET TIMEZONE Europe"
  header_title: "%bot%"
  header: "%title%"
  navigation_marker: ""
  info_marker: ""
  error_marker: ""
  warning_marker: ""
  intro: |-
    Pozwala zarejestrować i chronić pseudonim przed użyciem przez inne osoby.
    Zarządzaj bezpieczeństwem konta, dostosuj preferencje i odzyskaj dostęp w razie
    potrzeby.
  intro_expiration: "%label%: Nieużywane przez ponad %duration% pseudonimy są automatycznie usuwane."
  intro_expiration_duration: "%days% dni"
  intro_expiration_label: "UWAGA"
  general_header: "Dostępne komendy:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opcje:"
  general_syntax: "HELP <komenda>"
  general_footer: "Użyj /msg %bot% %syntax%, aby uzyskać więcej informacji."
  set_sub_syntax: "HELP %command% <opcja>"
  set_sub_footer: "Użyj /msg %bot% %syntax%, aby uzyskać więcej informacji."
  syntax_label: "Składnia: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    registration_auth: "Rejestracja i uwierzytelnianie"
    account_security: "Konto i bezpieczeństwo"
  ircop_group:
    lookup: "Wyszukiwanie i dochodzenie"
    account_management: "Zarządzanie kontami"
    suspensions_bans: "Zawieszenia i zakazy"
    deletion: "Usuwanie i przywracanie"
  ircop_header: "Dostępne komendy dla operatorów IRC:"
  set_timezone:
    index_label: "Strefy według regionu (użyj %syntax%, aby wyszukać region):"
    index_syntax: "HELP SET TIMEZONE <region>"
    region_header: "Strefy czasowe dla %region%:"
    region_unknown: "Nieznany region. Użyj %syntax% aby zobaczyć indeks."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "Nick %nickname% jest zarejestrowany. Zostaniesz przemianowany jeśli się nie zidentyfikujesz."
  renamed_to: |-
    Zmieniono Twój pseudonim na %guest_nick%. Aby odzyskać swój pseudonim:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <hasło>"
  nick_forbidden: "Nick %nickname% jest zabroniony: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <nick>"
  short: "Pobierz prawdziwy adres IP i nazwę hosta nicka."
  help: |-
    Wyświetla rzeczywisty adres IP i nazwę hosta pseudonimu.
    Używaj odpowiedzialnie: to poufne informacje.
  example: "%command_prefix%USERIP Użytkownik"
  result: "Nick: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Wyszukuje pseudonimy według IP ich ostatniego uwierzytelnionego połączenia."
  help: |-
    Wyświetla zarejestrowane pseudonimy, których ostatnie zidentyfikowane
    połączenie używało tego adresu IP. Zapisany adres może być nieaktualny.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Brak zarejestrowanych pseudonimów pasujących do tego adresu IP."
  header: "Pasujące pseudonimy:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <nick> <czas_trwania> <powód>"
  short: "Zawieś nick."
  help: |-
    Uniemożliwia właścicielowi identyfikację. Czas można podać w dniach (d),
    godzinach (h), minutach (m) lub jako 0 dla zawieszenia bezterminowego. Nie można
    zawiesić operatorów IRC ani użytkowników Root.
  example: "%command_prefix%SUSPEND MalUżytkownik 7d Spam na #pomoc"
  examples:
    - "%command_prefix%SUSPEND Uciążliwy 0 Omijanie zakazu"
  success: "Nick %nickname% został zawieszony do %duration%."
  already_suspended: "Nick %nickname% jest już zawieszony."
  forbidden: "Nick %nickname% jest zabroniony i nie może być zawieszony."
  cannot_suspend_oper: "Nie można zawiesić operatora IRC %nickname%."
  cannot_suspend_root: "Nie można zawiesić użytkownika root %nickname%."
  cannot_suspend_service: "Nie można zawiesić nicka serwisowego %nickname%."
  invalid_duration: "Nieprawidłowy czas trwania. Użyj: %duration_format% (np., 7d, 12h, 30m) lub %permanent% dla stałego."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <nick>"
  short: "Usuń zawieszenie z nicka."
  help: "Usuwa aktywne zawieszenie, aby właściciel mógł ponownie się zidentyfikować."
  example: "%command_prefix%UNSUSPEND Użytkownik"
  success: "Zawieszenie zostało zniesione z %nickname%."
  not_suspended: "Nick %nickname% nie jest zawieszony."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <nick>"
  short: "Wymuś zmianę nicka połączonego użytkownika na losowy."
  help: |-
    Wymusza zmianę pseudonimu połączonego użytkownika na losową nazwę z prefiksem
    określonym przez sieć.
  example: "%command_prefix%RENAME Kłopotliwy"
  cannot_rename_root: "Nie można przemianować użytkownika root %nickname%."
  cannot_rename_oper: "Nie można przemianować operatora IRC %nickname%."
  cannot_rename_service: "Nie można przemianować nicka serwisowego %nickname%."
  success: "Nick %nickname% został przemianowany na %new_nick%."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <nick> [FORCE]"
  short: "Usuń zarejestrowany nick."
  help: |-
    Oznacza zarejestrowany pseudonim do usunięcia po okresie karencji; można go
    przywrócić poleceniem RESTORE. Dodaj FORCE, aby usunąć go na stałe. Nie można
    usunąć użytkowników Root, IRCops, usług ani własnego pseudonimu.
  force:
    short: "Trwale usuwa pseudonim oczekujący na usunięcie."
  example: "%command_prefix%DROP CuentaAntigua"
  examples:
    - "%command_prefix%DROP CuentaAntigua FORCE"
  suspended: "Nick %nickname% jest zawieszony. Najpierw zdejmij zawieszenie."
  forbidden: "Nick %nickname% jest zabroniony."
  cannot_drop_root: "Nie można usunąć użytkownika root %nickname%."
  cannot_drop_oper: "Nie można usunąć operatora IRC %nickname%."
  cannot_drop_self: "Nie możesz usunąć własnego nicka."
  success: "Nick %nickname% został oznaczony do usunięcia i może być przywrócony w okresie karencji."
  force_success: "Nick %nickname% został trwale usunięty."
  pending_deletion: "Nick %nickname% już oczekuje na usunięcie. Użyj DROP <nick> FORCE aby usunąć go trwale."
  cannot_drop_service: "Nie można usunąć nicka serwisowego %nickname%."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <nick>"
  short: "Przywróć nicka oczekującego na usunięcie."
  help: "Przywraca pseudonim oczekujący na usunięcie, o ile nadal trwa okres karencji."
  example: "%command_prefix%RESTORE CuentaAntigua"
  success: "Nick %nickname% został przywrócony."
  not_pending_deletion: "Nick %nickname% nie oczekuje na usunięcie."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <nick> <powód>"
  short: "Trwale zablokuj nick przed używaniem."
  help: |-
    Trwale zakazuje używania pseudonimu, aby nikt nie mógł go zarejestrować ani
    używać. Jeśli jest zarejestrowany, zostaje usunięty; jeśli jest połączony,
    wymuszana jest zmiana na losowy pseudonim. Nie można zakazać użytkowników Root,
    IRCops ani usług.
  example: "%command_prefix%FORBID MalUżytkownik Powtarzające się naruszenia zasad"
  success: "Nick %nickname% został zabroniony."
  updated: "Powód zabronienia dla %nickname% został zaktualizowany."
  reason_required: "Musisz podać powód zabronienia."
  cannot_forbid_root: "Nie można zabronić użytkownika root %nickname%."
  cannot_forbid_oper: "Nie można zabronić operatora IRC %nickname%."
  cannot_forbid_service: "Nie można zabronić nicka serwisowego %nickname%."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <nick>"
  short: "Usuń zabronienie nicka."
  help: "Usuwa zakaz, aby pseudonim mógł być ponownie używany."
  example: "%command_prefix%UNFORBID ZabronionyNick"
  success: "Nick %nickname% nie jest już zabroniony."
  not_forbidden: "Nick %nickname% nie jest zabroniony."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <wzorzec>|DEL <wzorzec>|LIST}"
  short: "Zarządzaj zabronionymi wzorcami vhost."
  help: |-
    Zarządza wzorcami blokującymi ustawianie hostów vhost pasujących do SET VHOST.
    Symbol * dopasowuje dowolny ciąg, a ? jeden znak. Wymaga uprawnień operatora
    IRC.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Nieznana podkomenda %sub%. Użyj ADD, DEL lub LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <wzorzec>"
    short: "Dodaj zabroniony wzorzec vhost."
    help: |-
      Dodaje wzorzec do listy. Użytkownicy nie będą mogli ustawić pasujących hostów
      przez SET VHOST. * dopasowuje dowolny ciąg, a ? jeden znak.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Zabroniony wzorzec vhost dodany: %pattern%"
    already_exists: "Wzorzec %pattern% już istnieje."
    invalid: "Nieprawidłowy format wzorca vhost."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <wzorzec>"
    short: "Usuń zabroniony wzorzec vhost."
    help: "Usuwa wzorzec z listy zakazanych hostów vhost."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Zabroniony wzorzec vhost usunięty: %pattern%"
    not_found: "Wzorzec %pattern% nie znaleziony."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Lista wszystkich zabronionych wzorców vhost."
    syntax: "FORBIDVHOST LIST"
    help: "Wyświetla wszystkie zakazane wzorce hostów vhost."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Zabronione wzorce vhost (%count%):"
    entry: "%index%. %pattern% — przez %nickname% (%date%)"
    empty: "Brak zabronionych wzorców vhost."

# --- HISTORY ---
history:
  syntax: "HISTORY <nick> {ADD <wiadomość>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Przeglądaj lub zarządzaj historią działań nicka."
  help: |-
    Wyświetla historię działań pseudonimu. Automatycznie zapisuje zawieszenia,
    zmiany hasła lub e-maila oraz odzyskiwanie. VIEW pokazuje trzy wpisy na stronę;
    ALL wyświetla całą historię.
  example: "%command_prefix%HISTORY Użytkownik VIEW"
  examples:
    - "%command_prefix%HISTORY Użytkownik VIEW ALL"
    - "%command_prefix%HISTORY Użytkownik ADD Notatka ręczna"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <nick> ADD <wiadomość>"
    short: "Dodaj ręczny wpis historii."
    help: "Dodaje ręczny wpis do historii pseudonimu."
    example: "%command_prefix%HISTORY Użytkownik ADD Zgłoszono spam"
    success: "Wpis historii dodany dla %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <nick> DEL <id>"
    short: "Usuń wpis historii według ID."
    help: "Usuwa wskazany wpis z historii według jego ID."
    example: "%command_prefix%HISTORY Użytkownik DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <nick> VIEW [PAGE|ALL]"
    short: "Przeglądaj historię działań nicka."
    help: |-
      Wyświetla historię działań pseudonimu. Domyślnie pokazuje trzy wpisy na stronę.
      Użyj ALL, aby wyświetlić wszystkie.
    example: "%command_prefix%HISTORY Użytkownik VIEW"
    examples:
      - "%command_prefix%HISTORY Użytkownik VIEW 2"
      - "%command_prefix%HISTORY Użytkownik VIEW ALL"
    header: "%heading% (pokazuje %start%-%end% z %total%):"
    header_title: "Historia dla %nickname%"
    entry: "#%id% [%date%] %action% przez %operator% — %message%"
    no_entries: "Brak wpisów historii dla %nickname%."
    page_hint: "Użyj %command% aby zobaczyć więcej wpisów."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <nick> CLEAR"
    short: "Usuń wszystkie wpisy historii nicka."
    help: "Nieodwracalnie usuwa wszystkie wpisy historii pseudonimu."
    example: "%command_prefix%HISTORY Użytkownik CLEAR"
    success: "Wyczyszczono %count% wpisów historii dla %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Konto aktywowane"
  resend: "Wiadomość weryfikacyjna wysłana ponownie"
  noexpire_on: "Ochrona przed wygaśnięciem włączona"
  noexpire_off: "Ochrona przed wygaśnięciem wyłączona"
  userip: "Zapytanie USERIP"
  history_clear: "Historia wyczyszczona"
  password_changed_owner: "Hasło zmienione przez właściciela"
  password_changed_operator: "Hasło zmienione przez operatora"
  email_changed_owner: "E-mail zmieniony z %old_email% na %new_email%"
  email_changed_operator: "E-mail zmieniony na %new_email% przez operatora"
  recover: "Hasło zresetowane przez token e-mail"
  saregister: "Konto zarejestrowane administracyjnie"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Poprzedni e-mail: %value%"
  new_email: "Nowy e-mail: %value%"
  method: "Metoda: %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <nick> {ON|OFF}"
  short: "Ustaw lub usuń ochronę przed wygaśnięciem nicka."
  help: |-
    Określa, czy pseudonim wygasa z powodu braku aktywności.
    ON zapobiega wygaśnięciu, a OFF stosuje zwykłe zasady.
  example: "%command_prefix%NOEXPIRE Użytkownik ON"
  examples:
    - "%command_prefix%NOEXPIRE Użytkownik OFF"
  success_on: "Nick %nickname% jest teraz chroniony przed wygaśnięciem."
  success_off: "Nick %nickname% będzie teraz wygasał normalnie."
  forbidden: "Nick %nickname% jest zabroniony."
  suspended: "Nick %nickname% jest zawieszony."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <wzorzec> [strona]"
  short: "Wyświetla zarejestrowane pseudonimy pasujące do wzorca."
  help: |-
    Wyświetla zarejestrowane pseudonimy pasujące do wzorca. Symbol * dopasowuje
    dowolny ciąg znaków; opcjonalna strona zaczyna się od 1.
  example: "%command_prefix%LIST Użytkownik*"
  examples:
    - "%command_prefix%LIST Użytkownik* 2"
  header: "Pseudonim | Rejestracja | Ostatnie połączenie | IP | Status"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Brak pseudonimów pasujących do wzorca %pattern%."
  status_pending: "Oczekujący"
  status_registered: "Zarejestrowany"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Zarządzanie trybem rejestracji w sieci."
  help: |-
    Konfiguruje tryb rejestracji nowych kont.

    %emphasis_0% Wysyła token weryfikacyjny na adres e-mail użytkownika.
    %emphasis_1% Dostarcza token weryfikacyjny bezpośrednio przez IRC.
    %emphasis_2% Wyświetla bieżący tryb bez wprowadzania zmian.

    Oczekujące rejestracje zachowują tryb wybrany przy rozpoczęciu.

    W trybie TOKEN polecenie RESEND pozostaje wyłączone dla wszystkich użytkowników.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Bieżący tryb rejestracji: %mode%."
  changed: "Tryb rejestracji zmieniono na %mode%."

# --- SAREGISTER ------------------------------------------------------------
saregister:
  syntax: "SAREGISTER <nick> <hasło> [email]"
  short: "Administracyjna rejestracja nicka."
  help: |-
    Składnia: SAREGISTER <nick> <hasło> [email]

    Natychmiast rejestruje nick administracyjnie, bez konieczności
    weryfikacji klienta ani limitów częstotliwości.

    W trybie TOKEN token ratunkowy jest wyświetlany operatorowi tylko raz.
    W trybie EMAIL token ratunkowy jest wysyłany na podany adres e-mail.
  example: "%command_prefix%SAREGISTER Alice Hasło123"
  examples:
    - "%command_prefix%SAREGISTER Bob Hasło456 bob@przyklad.pl"
  success_token: "Nick %nickname% został zarejestrowany. Token ratunkowy: %token%"
  success_email: "Nick %nickname% został zarejestrowany. Token ratunkowy wysłany na %email%."
  invalid_nickname: "Nieprawidłowy nick %nickname%."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: |-
    Token ratunkowy: %token_display%

    Przechowuj ten token w bezpiecznym miejscu. Będzie potrzebny do odzyskania pseudonimu, jeśli zapomnisz hasła.

    Aby go potwierdzić, użyj: /msg %bot% %verify%

    %warning%
  issued_warning: "WAŻNE: Ważny jest tylko ostatnio wygenerowany token. Po potwierdzeniu nie zostanie ponownie wyświetlony. Nie udostępniaj go nikomu."
  confirmed: "Token ratunkowy został potwierdzony. Zachowaj go bezpiecznie."
  unavailable: "Uwierzytelnij się i potwierdź token ratunkowy przez %command_0% przed użyciem tej operacji."
  unavailable_command_0: "VERIFY"
  locked_out: "Zbyt wiele błędnych tokenów. Spróbuj ponownie za %seconds% sekund."
  throttled: "Zbyt wiele błędnych tokenów. Spróbuj ponownie za %minutes% minut."
  replaced: "Token odzyskiwania został zastąpiony właśnie zweryfikowanym tokenem z emaila. Zachowaj go bezpiecznie."
  optional_replacement: |-
    Opcjonalny nowy token odzyskiwania: %token_display%


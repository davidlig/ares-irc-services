# Traducións de OperServ — Galego
# Dominio: operserv
#
# Códigos de formato IRC (comiñas dobres ou bloques literais !irc):
#   \x02        activa/desactiva a negra
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermello, 07=laranxa, 14=gris escuro)
#   \x03        restablece a cor
#   \x0F        restablece todo o formato
#
# As cores IRC usan números DECIMAIS (0-15), non hexadecimais.
#   \x0314 = gris escuro (14 decimal): CORRECTO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multiliña: !irc |- con saltos físicos e espazos reais.
# Os bloques sen etiqueta non descodifican escapes; conserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O presentador engade /msg sen cor e unha marxe de dous espazos.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "Este comando está restrinxido a administradores root da rede."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [comando] [opción]"
  short: "Listar comandos ou mostrar axuda dun comando."
  help: |-
    Sen argumentos lista todos os comandos. Usa %help_command% para a axuda
    completa ou %help_option_command% para as subopcións.
  example: "%command_prefix%HELP KILL"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permite xestionar as persoas operadoras da rede e os seus permisos, aplicar
    restricións de acceso e desconectar persoas usuarias. Tamén permite enviar
    comunicados xerais e administrar as mensaxes de benvida da rede.
  general_header: "Comandos dispoñibles:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opcións:"
  examples_header: "Exemplos:"
  general_help_command: "HELP <comando>"
  option_help_command: "HELP %command% <opción>"
  detail_help_command: "HELP <comando>"
  detail_help_option_command: "HELP <comando> <opción>"
  general_footer: "Usa /msg %bot% %help_command% para obter máis información."
  set_sub_footer: "Usa /msg %bot% %help_command% para obter máis información."
  syntax_label: "Sintaxe: %syntax%"
  footer: ""
  intro_expiration: "NOTA: Os alcumes que non se utilicen durante máis de %days% días eliminaranse automaticamente."
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    operators_roles: "Operadores e roles"
    network_security: "Seguridade da rede"
    communication: "Comunicación"
    low_level: "Baixo nivel"
  ircop_header: "Comandos dispoñibles para IRCops:"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <alcume> <rol>|DEL <alcume>|LIST}"
  short: "Xestionar os operadores de IRC da rede."
  help: |-
    Xestiona os operadores de IRC da rede. ADD engade un alcume rexistrado
    como operador co rol especificado.
    DEL elimina un operador. LIST mostra todos os operadores.
    Use ROLE LIST para ver os roles dispoñibles.
    Este comando está restrinxido aos usuarios Root configurados nos servizos.
  example: "%command_prefix%IRCOP ADD Ana OPER"
  examples:
    - "%command_prefix%IRCOP LIST"
  unknown_sub: "Subcomando descoñecido %sub%. Use ADD, DEL ou LIST."
  unknown_role: "O rol %role% non existe. Usa /msg %bot% %role_list% para ver os roles dispoñibles."
  already_admin: "%nickname% xa é un operador de IRC (rol: %role%)."
  not_admin: "%nickname% non é un operador de IRC."
  role_changed: "Rol cambiado para %nickname% de %old% a %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <alcume> <rol>"
    short: "Engadir un operador de IRC da rede."
    help: |-
      Engade un alcume rexistrado como operador de IRC da rede.
      Use ROLE LIST para ver os roles dispoñibles.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%IRCOP ADD Ana OPER"
    done: "Engadido %nickname% como %role%."
    nick_not_active: "O alcume %nickname% non é un alcume rexistrado activo."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <alcume>"
    short: "Eliminar un operador de IRC da rede."
    help: |-
      Elimina un operador de IRC da rede da lista.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%IRCOP DEL Ana"
    done: "Eliminado %nickname% dos operadores de IRC."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Listar todos os operadores de IRC da rede."
    help: |-
      Lista todos os operadores de IRC da rede cos seus roles e data de rexistro.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%IRCOP LIST"
    header: "Operadores de IRC da Rede"
    empty: "Non hai operadores de IRC."

# --- ROLE ------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rol>|SET <rol> [operclass]}"
    short: "Configura a clase de operador de UnrealIRCd."
    help: |-
      Permite consultar e configurar a operclass dun rol.

      %options_header%
      %option_LIST%Amosa as operclasses dispoñibles na rede.
      %option_VIEW%Amosa a operclass do rol e as dispoñibles.
      %option_SET%Asigna a operclass ás IRCOP ao identificarse.

      Omite o valor para eliminala.

      Dispoñible só nos protocolos UnrealIRCd.
    example: "%command_prefix%ROLE OPERCLASS LIST"
    examples:
      - "%command_prefix%ROLE OPERCLASS VIEW SOPORTE"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE services-admin"
      - "%command_prefix%ROLE OPERCLASS SET SOPORTE"
    list:
      header: "Operclasses Dispoñibles na Rede"
      empty: "Non hai operclasses dispoñibles na rede."
      not_supported: "O protocolo actual non soporta listar operclasses dispoñibles."
    view:
      empty: "O rol %role% non ten operclass."
      line: "Operclass: %operclass%"
      available: "Operclasses dispoñibles: %available%"
    set:
      done: "Operclass configurada para o rol %role%."
      cleared: "Operclass eliminada do rol %role%."
      not_available: "A operclass %operclass% non esta dispoñible na rede. Operclasses dispoñibles: %available%."
  syntax: "ROLE {ADD <nome> [descrición]|DEL <nome>|LIST|PERMS {{ADD|DEL} <rol> <permiso>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modos]}|VHOST {VIEW <rol>|SET <rol> [vhost]}}"
  short: "Permite administrar os roles de operadores, os seus permisos e a súa configuración."
  help: |-
    Permite administrar os roles de operadores, os seus permisos e a súa
    configuración.

    Os roles ADMIN, OPER e PREOPER están protexidos e non se poden eliminar.
    Comando exclusivo para persoas usuarias Root.
  syntax_operclass: "ROLE {ADD <nome> [descrición]|DEL <nome>|LIST|PERMS {{ADD|DEL} <rol> <permiso>|{LIST|CLEAR} <rol>}|MODES {VIEW <rol>|SET <rol> [modos]}|VHOST {VIEW <rol>|SET <rol> [vhost]}|OPERCLASS {LIST|VIEW <nome>|SET <nome> [operclass]}}"
  help_operclass: |-
    Permite administrar os roles de operadores, os seus permisos e a súa configuración.

    Os roles ADMIN, OPER e PREOPER están protexidos e non se poden eliminar.
    Comando exclusivo para persoas usuarias Root.
  example: "%command_prefix%ROLE LIST"
  examples:
    - "%command_prefix%ROLE ADD SOPORTE Operadores de soporte"
  unknown_sub: "Subcomando descoñecido %sub%. Use ADD, DEL, LIST, PERMS, MODES ou VHOST."
  unknown_sub_operclass: "Subcomando descoñecido %sub%. Use ADD, DEL, LIST, PERMS, MODES, VHOST ou OPERCLASS."
  not_found: "O rol %role% non existe."
  already_exists: "O rol %role% xa existe."
  protected: "O rol %role% está protexido e non se pode eliminar."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <nome> [descrición]"
    short: "Crear un novo rol."
    help: |-
      Crea un novo rol personalizado. A descrición é opcional.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%ROLE ADD SOPORTE Operadores de soporte"
    done: "Rol %role% creado."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <nome>"
    short: "Eliminar un rol."
    help: |-
      Elimina un rol personalizado. Os roles protexidos (ADMIN, OPER, PREOPER)
      non se poden eliminar. Se o rol ten operadores asignados,
      debe reasignalos primeiro.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%ROLE DEL SOPORTE"
    done: "Rol %role% eliminado."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Amosa os roles dispoñibles."
    help: |-
      Lista todos os roles. Os roles protexidos están marcados con [PROTEXIDO].
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%ROLE LIST"
    header: "Roles de Operador"
    empty: "Non hai roles de operador."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rol> <permiso>|{LIST|CLEAR} <rol>}"
    short: "Xestiona os permisos do rol."
    help: |-
      Xestiona os permisos asignados a un rol.

      %options_header%
      %option_LIST%Amosa todos os permisos dispoñibles e indica cales ten asignados
                      o rol.
      %option_ADD%Asigna un permiso ao rol.
      %option_DEL%Retira un permiso do rol (agás nos roles protexidos).
      %option_CLEAR%Retira todos os permisos do rol.

      %assigned_status% indica que o permiso está asignado; %unassigned_status% indica que está dispoñible.

      Usa ALL para engadir todos os permisos dispoñibles á vez.
      Este comando está restrinxido a persoas usuarias Root.
    example: "%command_prefix%ROLE PERMS LIST SOPORTE"
    examples:
      - "%command_prefix%ROLE PERMS ADD SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS ADD SOPORTE ALL"
      - "%command_prefix%ROLE PERMS DEL SOPORTE operserv.gline"
      - "%command_prefix%ROLE PERMS CLEAR SOPORTE"
    not_found: "O permiso %perm% non existe."
    already_has: "O rol %role% xa ten o permiso %perm%."
    does_not_have: "O rol %role% non ten o permiso %perm%."
    list:
      header: "Lista de permisos de %role%"
      columns: "Asignado | Clave do permiso | Descrición"
      row: "%assigned% | %permission% | %description%"
      assigned: ""
      unassigned: ""
    add:
      done: "Engadido o permiso %perm% ao rol %role%."
      all_done: "Engadidos %count% permisos ao rol %role%."
    del:
      done: "Eliminado o permiso %perm% do rol %role%."
    clear:
      done: "Eliminados %count% permisos do rol %role%."
      empty: "O rol %role% non ten permisos asignados."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rol>|SET <rol> [modos]}"
    short: "Configura os modos de usuario do rol."
    help: |-
      Xestiona os modos de usuario IRCOP asignados a un rol.

      %options_header%
      %option_VIEW%Amosa os modos actuais do rol.
      %option_SET%Establece os modos IRCOP.

      Omite os modos para eliminalos todos.

      As persoas usuarias deste rol recibirán estes modos ao identificarse.
      Modos dispoñibles segundo o IRCD
      Este comando está restrinxido a persoas usuarias Root.
    example: "%command_prefix%ROLE MODES VIEW OPER"
    examples:
      - "%command_prefix%ROLE MODES SET OPER oH"
      - "%command_prefix%ROLE MODES SET OPER"
    view:
      header: "Modos de %role%"
      empty: "O rol %role% non ten modos asignados."
      line: "Modos: %modes%"
    set:
      done: "Establecidos os modos %modes% para o rol %role%."
      cleared: "Eliminados todos os modos do rol %role%."
      invalid_mode: "O modo %mode% non é un modo IRCOP válido."
      invalid_modes: "Modos non válidos: %invalid%. Modos válidos: %valid%."
      no_irc_user_modes: "O IRCD actual non ten modos IRCOP configurados."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rol>|SET <rol> [vhost]}"
    short: "Configura o patrón de host virtual do rol."
    help: |-
      Configura o host virtual que reciben as persoas operadoras dun rol ao
      identificarse, en substitución do seu host persoal.

      O host xérase combinando o alcume sen caracteres especiais co patrón
      configurado.
      Por exemplo:

      _davidlig_ + admin.ares → davidlig.admin.ares

      %options_header%
      %option_VIEW%Amosa o patrón configurado para un rol.
      %option_SET%Establece ou elimina o patrón dun rol.

      O patrón só admite letras, números, guións e puntos. Debe conter polo menos
      un punto, non pode comezar nin rematar con guión ou punto, nin conter puntos
      consecutivos.

      Para eliminar o host forzado, utiliza SET sen indicar un patrón.

      Comando exclusivo para persoas usuarias Root.
    example: "%command_prefix%ROLE VHOST VIEW OPER"
    examples:
      - "%command_prefix%ROLE VHOST SET OPER admin.ares"
      - "%command_prefix%ROLE VHOST SET OPER"
    view:
      header: "Vhost forzado de %role%"
      empty: "O rol %role% non ten un patrón de vhost forzado establecido."
      line: "Patrón: %pattern%"
      example: "Exemplo: %example_nickname%.%pattern%"
      example_nickname: "alcume"
    set:
      done: "Patrón de vhost forzado establecido para o rol %role%."
      cleared: "Eliminado o patrón de vhost forzado do rol %role%."
      invalid: "Patrón de vhost non válido. Caracteres válidos: a-z, A-Z, 0-9, - e .. Debe ter polo menos un punto, non pode comezar/rematar con - ou . nin ter .."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <alcume> <motivo>"
  short: "Desconectar forzosamente un usuario da rede."
  help: |-
    Desconecta unha persoa usuaria da rede IRC.
    As IRCops e as persoas usuarias Root non poden recibir un KILL.
  example: "%command_prefix%KILL BadUser Flooding en canales"
  protected_root: "Non se pode matar o usuario Root %nickname%."
  protected_ircop: "Non se pode matar o operador de IRC %nickname%."
  done: "O usuario %nickname% foi matado (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <máscara> <caducidade> <motivo>|DEL {<máscara>|<número>}|LIST [máscara]}"
  short: "Xestionar G-lines de toda a rede."
  help: |-
    Xestiona as G-lines (prohibicións globais da rede).
    ADD engade unha nova G-line con máscara, caducidade e motivo.
    DEL elimina unha G-line por máscara ou número de entrada.
    LIST amosa todas as G-lines e permite filtrar por máscara.

    Formato de caducidade: 0 = permanente ou sufixo d, h, m (ex.: 7d, 12h, 30m).
    Rexeítanse as G-lines que coincidan con persoas usuarias Root ou IRCop.
  example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuso de spam"
  examples:
    - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuso persistente"
    - "%command_prefix%GLINE LIST *@192.168.*"
  unknown_sub: "Subcomando descoñecido %sub%. Use ADD, DEL ou LIST."
  invalid_mask: "Formato de máscara non válido. Debe estar no formato usuario@host (p.ex., *@192.168.*)."
  global_mask: "A máscara de G-line %mask% é demasiado ampla. Non se permiten máscaras globais."
  dangerous_mask: "A máscara de G-line %mask% é demasiado ampla. A parte do host necesita polo menos 4 caracteres alfanuméricos."
  protected_user: "Non se pode poñer G-line ao usuario protexido %nickname%."
  invalid_expiry: "Formato de caducidade non válido. Use 0 para permanente ou un valor como 7d, 12h, 30m."
  already_exists: "A G-line para %mask% xa existe."
  max_entries: "Alcanzouse o número máximo de G-lines (%max%)."
  not_found: "G-line %mask% non atopada."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <máscara> <caducidade> <motivo>"
    short: "Engadir unha G-line de toda a rede."
    help: |-
      Engade unha G-line (prohibición global da rede).
      A máscara debe ter o formato usuario@host.
      Caducidade: 0 = permanente ou sufixo d, h, m (ex.: 7d, 12h, 30m).
      Rexeítanse as G-lines que coincidan con persoas usuarias Root ou IRCop.
    example: "%command_prefix%GLINE ADD *@192.168.1.* 7d Abuso de spam"
    examples:
      - "%command_prefix%GLINE ADD *@192.168.1.* 0 Abuso persistente"
    done: "G-line engadida: %mask% (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL {<máscara>|<número>}"
    short: "Eliminar unha G-line."
    help: |-
      Elimina unha G-line da lista.
      Podes indicar a máscara ou o número de entrada de LIST.
    example: "%command_prefix%GLINE DEL *@192.168.1.*"
    examples:
      - "%command_prefix%GLINE DEL 2"
    done: "G-line %mask% eliminada."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [máscara]"
    short: "Listar todas as G-lines."
    help: "Lista todas as G-lines. Opcionalmente, filtra por patrón de máscara."
    example: "%command_prefix%GLINE LIST"
    examples:
      - "%command_prefix%GLINE LIST *@192.168.*"
    header: "G-lines (%count%)"
    empty: "Non hai G-lines."
    entry: "%index%. %mask% - %reason% (%nickname%, caduca: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {servizo|alcume!ident@vhost} {PRIVMSG|NOTICE} <mensaxe>"
  short: "Enviar unha mensaxe global a todos os usuarios conectados."
  help: |-
    Permite enviar mensaxes a todas as persoas usuarias conectadas, desde un
    servizo existente ou un cliente temporal cunha identidade personalizada.

    As mensaxes poden enviarse como PRIVMSG (privada) ou NOTICE (aviso).

    Para utilizar un cliente temporal, indica unha máscara co formato
    alcume!ident@vhost
    e usa caracteres válidos en cada campo.

    O alcume non pode estar rexistrado nin en uso. O cliente desconéctase
    automaticamente tras o envío e o seu alcume queda bloqueado durante 24 horas.
  example: "%command_prefix%GLOBAL %operserv% PRIVMSG Mantemento en 10 minutos"
  examples:
    - "%command_prefix%GLOBAL Avisos!oper@services.ares NOTICE A rede reiniciarase"
  mask_invalid: "Formato de máscara non válido: %error%"
  nick_connected: "O alcume %nickname% está actualmente conectado."
  nick_registered: "O alcume %nickname% está rexistrado."
  type_invalid: "O tipo de mensaxe debe ser PRIVMSG ou NOTICE."
  done: "Mensaxe global enviada desde %nickname% a %count% usuarios."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <liña>"
  short: "Enviar unha liña de protocolo en bruto ao IRCd."
  help: |-
    Envía directamente a liña indicada ao socket do IRCd de enlace.
    Utilízao con moita precaución. As liñas de protocolo inválidas poden bloquear
    a rede.
  example: "%command_prefix%RAW :services.ares NOTICE * :Mantemento programado"
  empty: "Debe especificar unha liña non baleira para enviar."
  too_long: "A liña é demasiado longa. Máximo 510 caracteres."
  not_connected: "Non conectado ao IRCd."
  done: "Liña en bruto enviada."
  protocol:
    syntax: "O protocolo activo rexeitou a sintaxe do comando RAW."
    done: "Comando RAW xestionado polo protocolo executado."
    target: "O protocolo activo rexeitou o destino %target%."
    unsupported: "O protocolo activo non admite este comando RAW."
    invalid_resource_type: "Tipo de recurso de protocolo descoñecido: %resource_type%."
    invalid_resource: "Recurso de protocolo non válido: %resource%."
    invalid_value: "Valor non válido para o recurso de protocolo: %resource%."
    error: "O protocolo activo non puido executar o comando RAW."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator% executa o comando GLOBAL co alcume %target% mediante %type% a %count% usuarios. Mensaxe: %message%"
  prefix_message: "Mensaxe: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Xestionar as mensaxes MOTD de conexión enviadas aos usuarios ao conectarse."
  syntax: "MOTD {ADD <destino> {PRIVMSG|NOTICE} <caducidade> <mensaxe>|DEL <id>|LIST|CLEAN}"
  help: |-
    Xestiona as entradas da mensaxe do día (MOTD) que se envían cando unha persoa
    usuaria se conecta á rede.
  example: "%command_prefix%MOTD LIST"
  unknown_sub: "Subcomando descoñecido. Use: %add%, %del%, %list%, %clean%"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {servizo|alcume!ident@vhost} {PRIVMSG|NOTICE} <caducidade> <mensaxe>"
    syntax_hint: "Uso: %syntax%"
    short: "Engadir unha entrada MOTD."
    help: |-
      Engade unha mensaxe MOTD que se enviará a cada persoa usuaria ao conectarse
      á rede.
    example: "%command_prefix%MOTD ADD %operserv% NOTICE 24h Mantemento esta noite"
    examples:
      - "%command_prefix%MOTD ADD %operserv% PRIVMSG 0 Benvida a la red"
    done: "Entrada MOTD nº%id% engadida."
    invalid_type: "Tipo de mensaxe non válido. Debe ser PRIVMSG ou NOTICE."
    invalid_expiry: "Formato de caducidade non válido. Usa: <número><s|m|h|d> ou 0 para indefinido (ex.: 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "Uso: %syntax%"
    short: "Eliminar unha entrada MOTD."
    help: "Elimina unha entrada MOTD polo seu ID."
    example: "%command_prefix%MOTD DEL 12"
    done: "Entrada MOTD nº%id% eliminada."
    not_found: "Entrada MOTD non atopada."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Listar todas as entradas MOTD."
    help: "Lista todas as entradas MOTD configuradas."
    example: "%command_prefix%MOTD LIST"
    empty: "Non hai entradas MOTD configuradas."
    header: "Entradas MOTD:"
    status_enabled: "activada"
    status_disabled: "desactivada"
    expired: "caducada"
    no_bot: "(sen bot)"
    shown_count: "amosado %count% veces"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Eliminar todas as entradas MOTD caducadas."
    help: "Elimina todas as entradas MOTD cuxo prazo de caducidade rematase."
    example: "%command_prefix%MOTD CLEAN"
    done: "Eliminadas %count% entradas MOTD caducadas."
    none: "Non hai entradas MOTD caducadas que eliminar."
  debug:
    finalized: "A mensaxe MOTD #%id% finalizou: [%type%] %message% | %date% | %shown_count%"

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD <dominio> <motivo>|DEL {número|ALL}|LIST <patrón> [páxina]}"
  short: "Administrar dominios de correo bloqueados."
  help: |-
    Administrar dominios de correo bloqueados.
  example: "%command_prefix%BADMAIL LIST *"
  add:
    syntax: "BADMAIL ADD <dominio> <motivo>"
    short: "Bloquear un dominio."
    help: |-
      Acepta dominios ASCII ou punycode, non enderezos nin patróns. O motivo
      é obrigatorio. O bloqueo é exacto e non inclúe subdominios.
    example: "%command_prefix%BADMAIL ADD example.org abuse"
  del:
    syntax: "BADMAIL DEL {número|ALL}"
    short: "Eliminar dominios bloqueados."
    help: |-
      Elimina un identificador permanente ou todas as entradas con ALL. Os
      demais identificadores non cambian.
    example: "%command_prefix%BADMAIL DEL 1"
  list:
    syntax: "BADMAIL LIST <patrón> [páxina]"
    short: "Listar dominios bloqueados."
    help: |-
      O patrón é obrigatorio. Só * é un comodín e coincide con calquera
      secuencia. Non distingue maiúsculas. A páxina opcional comeza en 1. Os
      identificadores consérvanse ao filtrar e paxinar.
    example: "%command_prefix%BADMAIL LIST *.org 2"
  invalid_domain: "Dominio non válido. Usa ASCII ou punycode, sen punto final."
  invalid_reason: "Requírese un motivo administrativo non baleiro e dunha soa liña."
  duplicate: "Este dominio xa está bloqueado."
  not_found: "Non existe un dominio bloqueado con ese identificador."
  added: "Dominio %domain% bloqueado."
  deleted: "Dominio bloqueado %id% eliminado."
  cleared: "Elimináronse %total% dominios bloqueados."
  empty: "Ningún dominio bloqueado coincide."
  header: "ID | Dominio | Motivo"
  page: "Páxina %page%/%pages%, %total% dominios coincidentes."
  row: "%id% | %domain% | %reason%"

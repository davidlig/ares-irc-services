# Traducións de OperServ — Galego
# Dominio: operserv
#
# Códigos de formato IRC (comiñas dobres ou bloques literais !irc):
#   \x02        activa/desactiva a negra
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermello, 07=laranxa, 14=gris escuro)
#   \x03        restablece a cor
#   \x0F        restablece todo o formato
#
# As cores IRC usan números DECIMAIS (0-15), non hexadecimais.
#   \x0314 = gris escuro (14 decimal): CORRECTO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multiliña: !irc |- con saltos físicos e espazos reais.
# Os bloques sen etiqueta non descodifican escapes; conserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O presentador engade /msg sen cor e unha marxe de dous espazos.

# --- ERROR -----------------------------------------------------------------
error:
  root_only: "\x0304✗\x03 Este comando está restrinxido a administradores root da rede."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [comando] [opción]"
  short: "Listar comandos ou mostrar axuda dun comando."
  help: !irc |-
    Sen argumentos lista todos os comandos. Usa \x0303HELP <comando>\x03 para a axuda
    completa ou \x0303HELP <comando> <opción>\x03 para as subopcións.
  example: "%command_prefix%\x02\x0303HELP KILL\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314%separator%\x03\x0F"
  intro: |-
    Permite xestionar as persoas operadoras da rede e os seus permisos, aplicar
    restricións de acceso e desconectar persoas usuarias. Tamén permite enviar
    comunicados xerais e administrar as mensaxes de benvida da rede.
  general_header: "\x02 ■ Comandos dispoñibles:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Opcións:\x02"
  examples_header: "\x02 ■ Exemplos:\x02"
  general_footer: "\x0310ℹ\x03\x0F Usa /msg %bot% \x02\x0303HELP <comando>\x03\x0F para obter máis información."
  set_sub_footer: "\x0310ℹ\x03\x0F Usa /msg %bot% \x02\x0303HELP %command% <opción>\x03\x0F para obter máis información."
  syntax_label: "Sintaxe: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  intro_expiration: "\x0307⚠\x03\x0F NOTA: Os alcumes que non se utilicen durante máis de %days% días eliminaranse automaticamente."
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    operators_roles: "Operadores e roles"
    network_security: "Seguridade da rede"
    communication: "Comunicación"
    low_level: "Baixo nivel"
  ircop_header: "\x02 ■ Comandos dispoñibles para IRCops:\x02"

# --- IRCOP -----------------------------------------------------------------
ircop:
  syntax: "IRCOP {ADD <alcume> <rol>|DEL <alcume>|LIST}"
  short: "Xestionar os operadores de IRC da rede."
  help: |-
    Xestiona os operadores de IRC da rede. ADD engade un alcume rexistrado
    como operador co rol especificado.
    DEL elimina un operador. LIST mostra todos os operadores.
    Use ROLE LIST para ver os roles dispoñibles.
    Este comando está restrinxido aos usuarios Root configurados nos servizos.
  example: "%command_prefix%\x02\x0303IRCOP ADD Ana OPER\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL ou LIST."
  unknown_role: "\x0304✗\x03 O rol \x02%role%\x02 non existe. Usa /msg %bot% \x0303ROLE LIST\x03 para ver os roles dispoñibles."
  already_admin: "\x0304✗\x03 \x02%nickname%\x02 xa é un operador de IRC (rol: %role%)."
  not_admin: "\x0304✗\x03 \x02%nickname%\x02 non é un operador de IRC."
  role_changed: "\x0303✓\x03 Rol cambiado para \x02%nickname%\x02 de %old% a %new%."

  # --- IRCOP ADD -----------------------------------------------------------
  add:
    syntax: "IRCOP ADD <alcume> <rol>"
    short: "Engadir un operador de IRC da rede."
    help: |-
      Engade un alcume rexistrado como operador de IRC da rede.
      Use ROLE LIST para ver os roles dispoñibles.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%\x02\x0303IRCOP ADD Ana OPER\x03\x0F"
    done: "\x0303✓\x03 Engadido \x02%nickname%\x02 como \x02%role%\x02."
    nick_not_active: "\x0304✗\x03 O alcume \x02%nickname%\x02 non é un alcume rexistrado activo."

  # --- IRCOP DEL -----------------------------------------------------------
  del:
    syntax: "IRCOP DEL <alcume>"
    short: "Eliminar un operador de IRC da rede."
    help: |-
      Elimina un operador de IRC da rede da lista.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%\x02\x0303IRCOP DEL Ana\x03\x0F"
    done: "\x0303✓\x03 Eliminado \x02%nickname%\x02 dos operadores de IRC."

  # --- IRCOP LIST ----------------------------------------------------------
  list:
    syntax: "IRCOP LIST"
    short: "Listar todos os operadores de IRC da rede."
    help: |-
      Lista todos os operadores de IRC da rede cos seus roles e data de rexistro.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%\x02\x0303IRCOP LIST\x03\x0F"
    header: "\x0307---\x03 \x02Operadores de IRC da Rede\x02 \x0307---\x03"
    empty: "Non hai operadores de IRC."

# --- ROLE ------------------------------------------------------------------
role:
  # --- ROLE OPERCLASS ------------------------------------------------------
  operclass:
    syntax: "ROLE OPERCLASS {LIST|VIEW <rol>|SET <rol> [operclass]}"
    short: "Configura a clase de operador de UnrealIRCd."
    help: !irc |-
      Permite consultar e configurar a operclass dun rol.

      \x02 ■ Opcións:\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FAmosa as operclasses dispoñibles na rede.
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FAmosa a operclass do rol e as dispoñibles.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FAsigna a operclass ás IRCOP ao identificarse.

      Omite o valor para eliminala.

      Dispoñible só nos protocolos UnrealIRCd.
    example: "%command_prefix%\x02\x0303ROLE OPERCLASS LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE OPERCLASS VIEW SOPORTE\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET SOPORTE services-admin\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE OPERCLASS SET SOPORTE\x03\x0F"
    list:
      header: "\x0307---\x03 \x02Operclasses Dispoñibles na Rede\x02 \x0307---\x03"
      empty: "Non hai operclasses dispoñibles na rede."
      not_supported: "\x0304✗\x03 O protocolo actual non soporta listar operclasses dispoñibles."
    view:
      empty: "O rol %role% non ten operclass."
      line: "  Operclass: \x0303%operclass%\x03"
      available: "  Operclasses dispoñibles: \x0310%available%\x03"
    set:
      done: "\x0303✓\x03 Operclass configurada para o rol %role%."
      cleared: "\x0303✓\x03 Operclass eliminada do rol %role%."
      not_available: "\x0304✗\x03 A operclass \x02%operclass%\x02 non esta dispoñible na rede. Operclasses dispoñibles: %available%."
  syntax: "ROLE <opción> [parámetros]"
  short: "Permite administrar os roles de operadores, os seus permisos e a súa configuración."
  help: |-
    Permite administrar os roles de operadores, os seus permisos e a súa
    configuración.

    Os roles ADMIN, OPER e PREOPER están protexidos e non se poden eliminar.
    Comando exclusivo para persoas usuarias Root.
  syntax_operclass: "ROLE <opción> [parámetros]"
  help_operclass: |-
    Permite administrar os roles de operadores, os seus permisos e a súa configuración.

    Os roles ADMIN, OPER e PREOPER están protexidos e non se poden eliminar.
    Comando exclusivo para persoas usuarias Root.
  example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ROLE ADD SOPORTE Operadores de soporte\x03\x0F"
  unknown_sub: "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL, LIST, PERMS, MODES ou VHOST."
  unknown_sub_operclass: "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL, LIST, PERMS, MODES, VHOST ou OPERCLASS."
  not_found: "\x0304✗\x03 O rol \x02%role%\x02 non existe."
  already_exists: "\x0304✗\x03 O rol \x02%role%\x02 xa existe."
  protected: "\x0304✗\x03 O rol \x02%role%\x02 está protexido e non se pode eliminar."

  # --- ROLE ADD ------------------------------------------------------------
  add:
    syntax: "ROLE ADD <nome> [descrición]"
    short: "Crear un novo rol."
    help: |-
      Crea un novo rol personalizado. A descrición é opcional.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%\x02\x0303ROLE ADD SOPORTE Operadores de soporte\x03\x0F"
    done: "\x0303✓\x03 Rol \x02%role%\x02 creado."

  # --- ROLE DEL ------------------------------------------------------------
  del:
    syntax: "ROLE DEL <nome>"
    short: "Eliminar un rol."
    help: |-
      Elimina un rol personalizado. Os roles protexidos (ADMIN, OPER, PREOPER)
      non se poden eliminar. Se o rol ten operadores asignados,
      debe reasignalos primeiro.
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%\x02\x0303ROLE DEL SOPORTE\x03\x0F"
    done: "\x0303✓\x03 Rol \x02%role%\x02 eliminado."

  # --- ROLE LIST -----------------------------------------------------------
  list:
    syntax: "ROLE LIST"
    short: "Amosa os roles dispoñibles."
    help: |-
      Lista todos os roles. Os roles protexidos están marcados con [PROTEXIDO].
      Este comando está restrinxido aos usuarios Root.
    example: "%command_prefix%\x02\x0303ROLE LIST\x03\x0F"
    header: "\x0307---\x03 \x02Roles de Operador\x02 \x0307---\x03"
    empty: "Non hai roles de operador."

  # --- ROLE PERMS ----------------------------------------------------------
  perms:
    syntax: "ROLE PERMS {{ADD|DEL} <rol> <permiso>|{LIST|CLEAR} <rol>}"
    short: "Xestiona os permisos do rol."
    help: !irc |-
      Xestiona os permisos asignados a un rol.

      \x02 ■ Opcións:\x02
          \x0310›\x03\x0F \x02\x0303LIST      \x03\x0FAmosa todos os permisos dispoñibles e indica cales ten asignados
                      o rol.
          \x0310›\x03\x0F \x02\x0303ADD       \x03\x0FAsigna un permiso ao rol.
          \x0310›\x03\x0F \x02\x0303DEL       \x03\x0FRetira un permiso do rol (agás nos roles protexidos).
          \x0310›\x03\x0F \x02\x0303CLEAR     \x03\x0FRetira todos os permisos do rol.

      ✓ indica que o permiso está asignado; ✗ indica que está dispoñible.

      Usa ALL para engadir todos os permisos dispoñibles á vez.
      Este comando está restrinxido a persoas usuarias Root.
    example: "%command_prefix%\x02\x0303ROLE PERMS LIST SOPORTE\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE PERMS ADD SOPORTE operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS ADD SOPORTE ALL\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS DEL SOPORTE operserv.gline\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE PERMS CLEAR SOPORTE\x03\x0F"
    not_found: "\x0304✗\x03 O permiso \x02%perm%\x02 non existe."
    already_has: "\x0304✗\x03 O rol \x02%role%\x02 xa ten o permiso \x02%perm%\x02."
    does_not_have: "\x0304✗\x03 O rol \x02%role%\x02 non ten o permiso \x02%perm%\x02."
    list:
      header: "\x0303Lista de permisos de \x02%role%\x02\x03"
      columns: "Asignado | Clave do permiso | Descrición"
      row: "%assigned% | %permission% | %description%"
      assigned: "\x0303✓\x03\x0F"
      unassigned: "\x0304✗\x03\x0F"
    add:
      done: "\x0303✓\x03 Engadido o permiso \x02%perm%\x02 ao rol \x02%role%\x02."
      all_done: "\x0303✓\x03 Engadidos \x02%count%\x02 permisos ao rol \x02%role%\x02."
    del:
      done: "\x0303✓\x03 Eliminado o permiso \x02%perm%\x02 do rol \x02%role%\x02."
    clear:
      done: "\x0303✓\x03 Eliminados \x02%count%\x02 permisos do rol \x02%role%\x02."
      empty: "\x0304✗\x03 O rol \x02%role%\x02 non ten permisos asignados."

  # --- ROLE MODES ----------------------------------------------------------
  modes:
    syntax: "ROLE MODES {VIEW <rol>|SET <rol> [modos]}"
    short: "Configura os modos de usuario do rol."
    help: !irc |-
      Xestiona os modos de usuario IRCOP asignados a un rol.

      \x02 ■ Opcións:\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FAmosa os modos actuais do rol.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FEstablece os modos IRCOP.

      Omite os modos para eliminalos todos.

      As persoas usuarias deste rol recibirán estes modos ao identificarse.
      Modos dispoñibles segundo o IRCD
      Este comando está restrinxido a persoas usuarias Root.
    example: "%command_prefix%\x02\x0303ROLE MODES VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER oH\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE MODES SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02Modos de %role%\x02 \x0307---\x03"
      empty: "O rol \x02%role%\x02 non ten modos asignados."
      line: "  Modos: \x0303%modes%\x03"
    set:
      done: "\x0303✓\x03 Establecidos os modos \x02%modes%\x02 para o rol \x02%role%\x02."
      cleared: "\x0303✓\x03 Eliminados todos os modos do rol \x02%role%\x02."
      invalid_mode: "\x0304✗\x03 O modo \x02%mode%\x02 non é un modo IRCOP válido."
      invalid_modes: "\x0304✗\x03 Modos non válidos: %invalid%. Modos válidos: %valid%."
      no_irc_user_modes: "\x0304✗\x03 O IRCD actual non ten modos IRCOP configurados."

  # --- ROLE VHOST ----------------------------------------------------------
  vhost:
    syntax: "ROLE VHOST {VIEW <rol>|SET <rol> [vhost]}"
    short: "Configura o patrón de host virtual do rol."
    help: !irc |-
      Configura o host virtual que reciben as persoas operadoras dun rol ao
      identificarse, en substitución do seu host persoal.

      O host xérase combinando o alcume sen caracteres especiais co patrón
      configurado.
      Por exemplo:

      _davidlig_ + admin.ares → davidlig.admin.ares

      \x02 ■ Opcións:\x02
          \x0310›\x03\x0F \x02\x0303VIEW      \x03\x0FAmosa o patrón configurado para un rol.
          \x0310›\x03\x0F \x02\x0303SET       \x03\x0FEstablece ou elimina o patrón dun rol.

      O patrón só admite letras, números, guións e puntos. Debe conter polo menos
      un punto, non pode comezar nin rematar con guión ou punto, nin conter puntos
      consecutivos.

      Para eliminar o host forzado, utiliza SET sen indicar un patrón.

      Comando exclusivo para persoas usuarias Root.
    example: "%command_prefix%\x02\x0303ROLE VHOST VIEW OPER\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER admin.ares\x03\x0F"
      - "%command_prefix%\x02\x0303ROLE VHOST SET OPER\x03\x0F"
    view:
      header: "\x0307---\x03 \x02Vhost forzado de %role%\x02 \x0307---\x03"
      empty: "O rol \x02%role%\x02 non ten un patrón de vhost forzado establecido."
      line: "  Patrón: \x0303%pattern%\x03"
      example: "  Exemplo: \x02alcume\x02.%pattern%"
    set:
      done: "\x0303✓\x03 Patrón de vhost forzado establecido para o rol \x02%role%\x02."
      cleared: "\x0303✓\x03 Eliminado o patrón de vhost forzado do rol \x02%role%\x02."
      invalid: "\x0304✗\x03 Patrón de vhost non válido. Caracteres válidos: a-z, A-Z, 0-9, - e .. Debe ter polo menos un punto, non pode comezar/rematar con - ou . nin ter .."

# --- KILL ------------------------------------------------------------------
kill:
  syntax: "KILL <alcume> <motivo>"
  short: "Desconectar forzosamente un usuario da rede."
  help: |-
    Desconecta unha persoa usuaria da rede IRC.
    As IRCops e as persoas usuarias Root non poden recibir un KILL.
  example: "%command_prefix%\x02\x0303KILL BadUser Flooding en canales\x03\x0F"
  protected_root: "\x0304✗\x03 Non se pode matar o usuario Root \x02%nickname%\x02."
  protected_ircop: "\x0304✗\x03 Non se pode matar o operador de IRC \x02%nickname%\x02."
  done: "\x0303✓\x03 O usuario \x02%nickname%\x02 foi matado (%reason%)."

# --- GLINE -----------------------------------------------------------------
gline:
  syntax: "GLINE {ADD <máscara> <caducidade> <motivo>|DEL <máscara|número>|LIST [máscara]}"
  short: "Xestionar G-lines de toda a rede."
  help: |-
    Xestiona as G-lines (prohibicións globais da rede).
    ADD engade unha nova G-line con máscara, caducidade e motivo.
    DEL elimina unha G-line por máscara ou número de entrada.
    LIST amosa todas as G-lines e permite filtrar por máscara.

    Formato de caducidade: 0 = permanente ou sufixo d, h, m (ex.: 7d, 12h, 30m).
    Rexeítanse as G-lines que coincidan con persoas usuarias Root ou IRCop.
  example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Abuso de spam\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Abuso persistente\x03\x0F"
    - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
  unknown_sub: "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL ou LIST."
  invalid_mask: "\x0304✗\x03 Formato de máscara non válido. Debe estar no formato usuario@host (p.ex., *@192.168.*)."
  global_mask: "\x0304✗\x03 A máscara de G-line \x02%mask%\x02 é demasiado ampla. Non se permiten máscaras globais."
  dangerous_mask: "\x0304✗\x03 A máscara de G-line \x02%mask%\x02 é demasiado ampla. A parte do host necesita polo menos 4 caracteres alfanuméricos."
  protected_user: "\x0304✗\x03 Non se pode poñer G-line ao usuario protexido \x02%nickname%\x02."
  invalid_expiry: "\x0304✗\x03 Formato de caducidade non válido. Use 0 para permanente ou un valor como 7d, 12h, 30m."
  already_exists: "\x0304✗\x03 A G-line para \x02%mask%\x02 xa existe."
  max_entries: "\x0304✗\x03 Alcanzouse o número máximo de G-lines (%max%)."
  not_found: "\x0304✗\x03 G-line \x02%mask%\x02 non atopada."

  # --- GLINE ADD -----------------------------------------------------------
  add:
    syntax: "GLINE ADD <máscara> <caducidade> <motivo>"
    short: "Engadir unha G-line de toda a rede."
    help: |-
      Engade unha G-line (prohibición global da rede).
      A máscara debe ter o formato usuario@host.
      Caducidade: 0 = permanente ou sufixo d, h, m (ex.: 7d, 12h, 30m).
      Rexeítanse as G-lines que coincidan con persoas usuarias Root ou IRCop.
    example: "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 7d Abuso de spam\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE ADD *@192.168.1.* 0 Abuso persistente\x03\x0F"
    done: "\x0303✓\x03 G-line engadida: \x02%mask%\x02 (%duration%) - %reason%"

  # --- GLINE DEL -----------------------------------------------------------
  del:
    syntax: "GLINE DEL <máscara|número>"
    short: "Eliminar unha G-line."
    help: |-
      Elimina unha G-line da lista.
      Podes indicar a máscara ou o número de entrada de LIST.
    example: "%command_prefix%\x02\x0303GLINE DEL *@192.168.1.*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE DEL 2\x03\x0F"
    done: "\x0303✓\x03 G-line \x02%mask%\x02 eliminada."

  # --- GLINE LIST ----------------------------------------------------------
  list:
    syntax: "GLINE LIST [máscara]"
    short: "Listar todas as G-lines."
    help: "Lista todas as G-lines. Opcionalmente, filtra por patrón de máscara."
    example: "%command_prefix%\x02\x0303GLINE LIST\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303GLINE LIST *@192.168.*\x03\x0F"
    header: "\x0307---\x03 \x02G-lines (%count%) \x0307---\x03"
    empty: "Non hai G-lines."
    entry: "\x0310%index%.\x03 \x02%mask%\x02 - %reason% (\x0314%nickname%\x03, caduca: %expiration%)"

# --- GLOBAL ----------------------------------------------------------------
global:
  syntax: "GLOBAL {servizo|alcume!ident@vhost} {PRIVMSG|NOTICE} <mensaxe>"
  short: "Enviar unha mensaxe global a todos os usuarios conectados."
  help: |-
    Permite enviar mensaxes a todas as persoas usuarias conectadas, desde un
    servizo existente ou un cliente temporal cunha identidade personalizada.

    As mensaxes poden enviarse como PRIVMSG (privada) ou NOTICE (aviso).

    Para utilizar un cliente temporal, indica unha máscara co formato
    alcume!ident@vhost
    e usa caracteres válidos en cada campo.

    O alcume non pode estar rexistrado nin en uso. O cliente desconéctase
    automaticamente tras o envío e o seu alcume queda bloqueado durante 24 horas.
  example: "%command_prefix%\x02\x0303GLOBAL %operserv% PRIVMSG Mantemento en 10 minutos\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303GLOBAL Avisos!oper@services.ares NOTICE A rede reiniciarase\x03\x0F"
  mask_invalid: "\x0304✗\x03 Formato de máscara non válido: %error%"
  nick_connected: "\x0304✗\x03 O alcume \x02%nickname%\x02 está actualmente conectado."
  nick_registered: "\x0304✗\x03 O alcume \x02%nickname%\x02 está rexistrado."
  type_invalid: "\x0304✗\x03 O tipo de mensaxe debe ser PRIVMSG ou NOTICE."
  done: "\x0303✓\x03 Mensaxe global enviada desde \x02%nickname%\x02 a %count% usuarios."

# --- RAW -------------------------------------------------------------------
raw:
  syntax: "RAW <liña>"
  short: "Enviar unha liña de protocolo en bruto ao IRCd."
  help: |-
    Envía directamente a liña indicada ao socket do IRCd de enlace.
    Utilízao con moita precaución. As liñas de protocolo inválidas poden bloquear
    a rede.
  example: "%command_prefix%\x02\x0303RAW :services.ares NOTICE * :Mantemento programado\x03\x0F"
  empty: "\x0304✗\x03 Debe especificar unha liña non baleira para enviar."
  too_long: "\x0304✗\x03 A liña é demasiado longa. Máximo 510 caracteres."
  not_connected: "\x0304✗\x03 Non conectado ao IRCd."
  done: "\x0303✓\x03 Liña en bruto enviada."
  protocol:
    syntax: "\x0304✗\x03 O protocolo activo rexeitou a sintaxe do comando RAW."
    done: "\x0303✓\x03 Comando RAW xestionado polo protocolo executado."
    target: "\x0304✗\x03 O protocolo activo rexeitou o destino %target%."
    unsupported: "\x0304✗\x03 O protocolo activo non admite este comando RAW."
    invalid_resource_type: "\x0304✗\x03 Tipo de recurso de protocolo descoñecido: %resource_type%."
    invalid_resource: "\x0304✗\x03 Recurso de protocolo non válido: %resource%."
    invalid_value: "\x0304✗\x03 Valor non válido para o recurso de protocolo: %resource%."
    error: "\x0304✗\x03 O protocolo activo non puido executar o comando RAW."

# --- DEBUG -----------------------------------------------------------------
debug:
  action_global: "%operator% executa o comando GLOBAL co alcume %target% mediante %type% a %count% usuarios. Mensaxe: %message%"
  prefix_message: "Mensaxe: %reason%"

# --- MOTD ------------------------------------------------------------------
motd:
  short: "Xestionar as mensaxes MOTD de conexión enviadas aos usuarios ao conectarse."
  syntax: "MOTD {ADD <destino> {PRIVMSG|NOTICE} <caducidade> <mensaxe>|DEL <id>|LIST|CLEAN}"
  help: |-
    Xestiona as entradas da mensaxe do día (MOTD) que se envían cando unha persoa
    usuaria se conecta á rede.
  example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Subcomando descoñecido. Use: \x02ADD\x02, \x02DEL\x02, \x02LIST\x02, \x02CLEAN\x02"

  # --- MOTD ADD ------------------------------------------------------------
  add:
    syntax: "MOTD ADD {servizo|alcume!ident@vhost} {PRIVMSG|NOTICE} <caducidade> <mensaxe>"
    syntax_hint: "\x0304✗\x03 Uso: \x02%syntax%\x02"
    short: "Engadir unha entrada MOTD."
    help: |-
      Engade unha mensaxe MOTD que se enviará a cada persoa usuaria ao conectarse
      á rede.
    example: "%command_prefix%\x02\x0303MOTD ADD %operserv% NOTICE 24h Mantemento esta noite\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303MOTD ADD %operserv% PRIVMSG 0 Benvida a la red\x03\x0F"
    done: "\x0303✓\x03 Entrada MOTD nº%id% engadida."
    invalid_type: "\x0304✗\x03 Tipo de mensaxe non válido. Debe ser \x02PRIVMSG\x02 ou \x02NOTICE\x02."
    invalid_expiry: "\x0304✗\x03 Formato de caducidade non válido. Usa: \x02<número><s|m|h|d>\x02 ou \x020\x02 para indefinido (ex.: 30s, 5m, 24h, 7d)."

  # --- MOTD DEL ------------------------------------------------------------
  del:
    syntax: "MOTD DEL <id>"
    syntax_hint: "\x0304✗\x03 Uso: \x02%syntax%\x02"
    short: "Eliminar unha entrada MOTD."
    help: "Elimina unha entrada MOTD polo seu ID."
    example: "%command_prefix%\x02\x0303MOTD DEL 12\x03\x0F"
    done: "\x0303✓\x03 Entrada MOTD nº%id% eliminada."
    not_found: "\x0304✗\x03 Entrada MOTD non atopada."

  # --- MOTD LIST -----------------------------------------------------------
  list:
    syntax: "MOTD LIST"
    short: "Listar todas as entradas MOTD."
    help: "Lista todas as entradas MOTD configuradas."
    example: "%command_prefix%\x02\x0303MOTD LIST\x03\x0F"
    empty: "Non hai entradas MOTD configuradas."
    header: "Entradas MOTD:"
    status_enabled: "\x0303activada\x03"
    status_disabled: "\x0304desactivada\x03"
    expired: "\x0304caducada\x03"
    no_bot: "(sen bot)"
    shown_count: "amosado %count% veces"

  # --- MOTD CLEAN ----------------------------------------------------------
  clean:
    syntax: "MOTD CLEAN"
    short: "Eliminar todas as entradas MOTD caducadas."
    help: "Elimina todas as entradas MOTD cuxo prazo de caducidade rematase."
    example: "%command_prefix%\x02\x0303MOTD CLEAN\x03\x0F"
    done: "\x0303✓\x03 Eliminadas %count% entradas MOTD caducadas."
    none: "\x0303✓\x03 Non hai entradas MOTD caducadas que eliminar."
  debug:
    finalized: "A mensaxe MOTD #%id% finalizou: [%type%] %message% | %date% | %shown_count%"

# --- BADMAIL ---------------------------------------------------------------
badmail:
  syntax: "BADMAIL {ADD|DEL|LIST} <parámetros>"
  short: "Administrar dominios de correo bloqueados."
  help: |-
    Administrar dominios de correo bloqueados.
  example: "%command_prefix%\x02\x0303BADMAIL LIST *\x03\x0f"
  add:
    syntax: "BADMAIL ADD <dominio> <motivo>"
    short: "Bloquear un dominio."
    help: |-
      Acepta dominios ASCII ou punycode, non enderezos nin patróns. O motivo
      é obrigatorio. O bloqueo é exacto e non inclúe subdominios.
    example: "%command_prefix%\x02\x0303BADMAIL ADD example.org abuse\x03\x0f"
  del:
    syntax: "BADMAIL DEL {número|ALL}"
    short: "Eliminar dominios bloqueados."
    help: |-
      Elimina un identificador permanente ou todas as entradas con ALL. Os
      demais identificadores non cambian.
    example: "%command_prefix%\x02\x0303BADMAIL DEL 1\x03\x0f"
  list:
    syntax: "BADMAIL LIST <patrón> [páxina]"
    short: "Listar dominios bloqueados."
    help: |-
      O patrón é obrigatorio. Só * é un comodín e coincide con calquera
      secuencia. Non distingue maiúsculas. A páxina opcional comeza en 1. Os
      identificadores consérvanse ao filtrar e paxinar.
    example: "%command_prefix%\x02\x0303BADMAIL LIST *.org 2\x03\x0f"
  invalid_domain: "Dominio non válido. Usa ASCII ou punycode, sen punto final."
  invalid_reason: "Requírese un motivo administrativo non baleiro e dunha soa liña."
  duplicate: "Este dominio xa está bloqueado."
  not_found: "Non existe un dominio bloqueado con ese identificador."
  added: "\x0303✓\x03 Dominio \x02%domain%\x02 bloqueado."
  deleted: "\x0303✓\x03 Dominio bloqueado \x02%id%\x02 eliminado."
  cleared: "\x0303✓\x03 Elimináronse \x02%total%\x02 dominios bloqueados."
  empty: "Ningún dominio bloqueado coincide."
  header: "ID | Dominio | Motivo"
  page: "Páxina %page%/%pages%, %total% dominios coincidentes."
  row: "%id% | %domain% | %reason%"

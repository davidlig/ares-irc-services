  label_suspended_until: "Finaliza o"
  suspended_permanent: "%label%        : Permanente"
  label_suspended_permanent: "Finaliza o"
  registered_at: "%label%        : %date%"
  label_registered_at: "Rexistrado"
  last_seen_online: "%label%        : %online%"

  last_seen_at: "%label%        : %date%"
  label_last_seen_at: "Última vez"
  last_seen_never: "%label%        : Nunca"
  label_last_seen_never: "Última vez"
  last_quit: "%label%  : %message%"
  label_last_quit: "Últ. mens. saída"
  last_connect: "%label%    : %ip% (%host%)"

# Traducións de NickServ — Galego
# Dominio: nickserv
#
# Códigos de formato IRC (comiñas dobres ou bloques literais !irc):
#   \x02        activa/desactiva a negra
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermello, 07=laranxa, 14=gris escuro)
#   \x03        restablece a cor
#   \x0F        restablece todo o formato
#
# As cores IRC usan números DECIMAIS (0-15), non hexadecimais.
#   \x0314 = gris escuro (14 decimal): CORRECTO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multiliña: !irc |- con saltos físicos e espazos reais.
# Os bloques sen etiqueta non descodifican escapes; conserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O presentador engade /msg sen cor e unha marxe de dous espazos.

# --- REGISTER -----------------------------------------------------------------
register:
  token_unavailable: !irc |-
    O rexistro está pendente, pero non se puido entregar o token.
    Agarda a que caduque antes de rexistrarte de novo.
  syntax: "REGISTER <contrasinal> [email]"
  short: "Rexistrar o seu alcume cos servizos."
  help: |-
    Rexistra o teu alcume. A rede indicaráche o token de verificación por chat
    ou por correo, segundo a súa configuración.
    Unha vez validado, será o teu token de recuperación permanente:
    gárdao nun lugar seguro.
    A caducidade de %duration% só se aplica antes de validalo.
    Non se admiten dominios de correo bloqueados administrativamente.
  example: "%command_prefix%REGISTER Chave$egura_123"
  examples:
    - "%command_prefix%REGISTER Chave$egura_123 usuario@exemplo.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Enviouse un token de verificación a %email%."
  pending_line_2: "Executa /msg %bot% %verify% para completar o rexistro."
  pending_line_3: "Non o recibiches? Revisa o correo lixo ou usa /msg %bot% %resend%"
  pending_line_4: "O token caducará en %duration%."
  already_registered: "O alcume %nickname% xa está rexistrado."
  already_pending: "O rexistro de %nickname% está pendente. Usa %verify%. Se o token se enviou por correo e hai un enderezo válido asociado, podes solicitar outro con %resend%."
  forbidden: "O alcume %nickname% non se pode rexistrar nesta rede."
  pending_deletion: "O alcume %nickname% está pendente de eliminación e non se pode rexistrar."
  invalid_email: "O enderezo de correo electrónico proporcionado non é válido."
  email_already_used: "O correo electrónico %email% xa está en uso por outro alcume. Use un enderezo diferente."
  throttled: "Debe agardar %minutes% minuto(s) antes de tentar rexistrarse de novo."
  guest_prefix_forbidden: "Non pode rexistrar un alcume que comece con %prefix%."

# --- IDENTIFY -----------------------------------------------------------------
identify:
  syntax: "IDENTIFY <alcume> <contrasinal>"
  short: "Identificarse como o propietario dun alcume."
  help: |-
    Autentica a súa sesión con %nickserv% usando o seu alcume e contrasinal.
    Despois dunha identificación exitosa recibirá o modo rexistrado %emphasis_0%
    e, se estaba usando un alcume de convidado, restauraráselle o seu alcume
    rexistrado.
  example: "%command_prefix%IDENTIFY Usuario <contrasinal>"
  native_syntax: "/NICK <alcume>:<contrasinal> | /NICK <alcume>!<contrasinal>"
  native_short: "Mostra a sintaxe de autenticación nativa por cambio de alcume."
  native_help: |-
    Este protocolo autentica as contas mediante cambios de alcume.
    Usa %emphasis_0% ou, se o alcume está ocupado, %emphasis_1%.
  native_example: "/NICK Usuario:<contrasinal>"
  native_examples:
    - "%command_prefix%/NICK Usuario!<contrasinal>"
  native_authentication: "Este protocolo xestiona a autenticación mediante cambios de alcume. Usa %command_0% ou, se o alcume está ocupado, %command_1%."
  native_authentication_command_0: "/NICK <alcume>:<contrasinal>"
  native_authentication_command_1: "/NICK <alcume>!<contrasinal>"
  success: "Agora está identificado como %nickname%."
  already_identified: "Xa está identificado como %nickname%."
  invalid_credentials: "Contrasinal incorrecto. Tenteo de novo."
  locked_out: "Demasiados intentos errados. Tenteo de novo en %minutes% minuto(s)."
  ghost_released: "A sesión fantasma que mantiña %nickname% foi desconectada."
  kill_reason: "Alcume %nickname% recuperado por %source% (o propietario rexistrado identificouse)"
  pending: |-
    %first%
    %second%
  pending_line_1: "O alcume %nickname% está pendente de verificación por correo electrónico."
  pending_line_2: "Executa /msg %bot% %command_0% ou /msg %bot% %command_1%"
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "O alcume %nickname% está suspendido. Motivo: %reason%"
  forbidden: "O alcume %nickname% non se pode usar nesta rede."
  pending_deletion: "O alcume %nickname% está pendente de eliminación e non se pode usar."

# --- VERIFY -------------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirma un rexistro ou token de rescate."
  help: |-
    Unha vez validado, este token será o teu token de recuperación permanente.
    Gárdao nun lugar seguro: poderás usalo para recuperar o teu alcume.
    A caducidade de %duration% só se aplica antes de validalo.
  example: "%command_prefix%VERIFY <token_recibido>"
  success: "O alcume %nickname% foi rexistrado con éxito e agora está identificado."
  success_native: "O alcume %nickname% rexistrouse correctamente. Usa a autenticación nativa que se mostra a continuación."
  invalid_token: "O token de rescate non é válido."
  no_pending: "Non ten ningún rexistro pendente que verificar."

# --- RESEND -------------------------------------------------------------------
resend:
  disabled: "Non podes solicitar outro token con %resend% porque este rexistro entrega o token directamente polo chat."
  syntax: "RESEND"
  short: "Reenviar o token de verificación ao seu correo electrónico."
  help: |-
    RESEND só está dispoñible se o token de verificación se enviou por correo.
    Unha vez validado, este token será o teu token de recuperación permanente.
    Gárdao nun lugar seguro: poderás usalo para recuperar o teu alcume.
    A caducidade de %duration% só se aplica antes de validalo.
    Ao usar RESEND, recibirás un novo token por correo.
    O prazo do rexistro pendente renovarase durante %duration%.
  example: "%command_prefix%RESEND"
  success: "Token de verificación reenviado a %email%."
  no_pending: "Non ten ningún rexistro pendente que verificar."
  throttled: "Debe agardar %minutes% minuto(s) antes de solicitar outro correo de verificación."

# --- RECOVER ------------------------------------------------------------------
recover:
  no_email: "Non hai un correo electrónico configurado para o alcume %nickname%. A recuperación non está dispoñible."
  email_sent: "Enviouse un token de recuperación a %email_hint%. Comprobe a súa caixa de entrada (e o cartafol de spam)."
  pending_deletion: "O alcume %nickname% está pendente de eliminación e non se pode recuperar."
  instructions: "EMAIL: %command_0% solicita un token provisional por correo. TOKEN: proporciona o token confirmado. %command_1% acepta o token válido do correo ou o confirmado. O do correo substitúe o gardado só tras validalo. Usar o gardado ofrece un reemplazo opcional con %command_2%; ignora a mensaxe para conservalo."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <alcume> [token]"
  short: "Recuperar o seu alcume se perdeu o contrasinal."
  help: |-
    Se non tes un token, solicita por correo un token provisional.
    Tamén podes proporcionar un token de recuperación válido; se é provisional,
    substituirá o gardado só despois de validalo.
    Ao usar o token gardado ofrécesche unha substitución opcional con VERIFY; ignora
    a mensaxe se queres conservar o actual.
  example: "%command_prefix%RECOVER Usuario"
  examples:
    - "%command_prefix%RECOVER Usuario <token_recibido>"
  pending: "O rexistro de %nickname% está pendente. Usa %command_0%. Se o token se enviou por correo e hai un enderezo válido asociado, podes solicitar outro con %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "O alcume %nickname% está suspendido. Motivo: %reason%"
  forbidden: "O alcume %nickname% non se pode usar nesta rede."
  throttled: "Demasiados tokens incorrectos. Téntao de novo en %minutes% minuto(s)."
  invalid_token: "O token de rescate non é válido."
  success_identify: "Contrasinal restablecido. Identifíquese agora: %identify_cmd%"
  success_then_change: "Despois cambia o teu contrasinal: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <novo_contrasinal>"

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <novo_contrasinal>|EMAIL <email> <token>|LANGUAGE <código>|TIMEZONE <fuso_horario>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Cambiar as opcións do teu alcume."
  help: |-
    Modifica a configuración do teu alcume. Debes identificarte para cambiarestas
    opcións.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Opción descoñecida %option%. Opcións dispoñibles: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <novo_contrasinal>"
    short: "Cambiar o contrasinal do seu alcume."
    help: |-
      Cambia o contrasinal do seu alcume. O novo contrasinal ten
      efecto inmediato. Escolla un contrasinal seguro de polo menos 6 caracteres
      que non use noutros servizos.
    example: "%command_prefix%SET PASSWORD Chave$egura_123"
    success: "O seu contrasinal foi actualizado con éxito."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Usa %value% co token de rescate confirmado."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Cambia o correo electrónico usando o teu token de rescate confirmado."
    help: |-
      SET EMAIL cambia o correo de contacto tras validar o token de rescate, sen
      consumilo. Comproba o formato e a unicidade; non envía correo de confirmación.
      Non se admiten dominios de correo bloqueados administrativamente.
    example: "%command_prefix%SET EMAIL usuario@exemplo.com <token_confirmado>"
    success: "O seu correo electrónico foi actualizado a %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Enviouse un token de confirmación a %current_email%."
    pending_line_2: "Para confirmar o cambio a %new_email%, executa:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "O token caduca nunha hora."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "O token non é válido ou caducou. Solicite un novo con %value%."
    invalid_token_value: "SET EMAIL <novo_correo-e>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <código>"
    short: "Cambiar o idioma que os servizos usan para comunicarse con vostede."
    help: |-
      Cambia o idioma que %nickserv% e outros servizos usan ao falar con vostede.
      Idiomas dispoñibles:
      %emphasis_0% (catalán)
      %emphasis_1% (alemán)
      %emphasis_2% (grego)
      %emphasis_3% (inglés)
      %emphasis_4% (español)
      %emphasis_5% (éuscaro)
      %emphasis_6% (francés)
      %emphasis_7% (galego)
      %emphasis_8% (italiano)
      %emphasis_9% (neerlandés)
      %emphasis_10% (polaco)
      %emphasis_11% (portugués)
      %emphasis_12% (romanés)
      %emphasis_13% (turco)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Idioma cambiado a %language%."
    invalid: "Idioma non soportado. Idiomas dispoñibles: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <fuso_horario>"
    short: "Establecer o fuso horario usado cando se mostran datas."
    help: |-
      Establece o fuso horario co que %nickserv% amosa as datas. Consulta HELP SET
      TIMEZONE para ver as rexións. Usa OFF para eliminalo.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Fuso horario establecido en %timezone%. As datas mostraranse neste fuso."
    cleared: "Fuso horario limpado. As datas usarán o valor predeterminado da rede."
    invalid: "Fuso horario non válido %timezone%. Use un identificador válido (p.ex. UTC, Europe/Madrid)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Amosa ou oculta a información do teu alcume."
    help: |-
      Controla a visibilidade da información do seu alcume no comando INFO.
      Con %emphasis_0% só vostede e os operadores de IRC poden ver os seus detalles.
      Con %emphasis_1% a súa información é pública para todos.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "A información do seu alcume é agora %value%."
    on_value: "privada"
    off: "A información do seu alcume é agora %value%."
    off_value: "pública"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Cambia como se comunican contigo os servizos."
    help: |-
      Controla como %nickserv% e o resto dos servizos che envían mensaxes.
      Con %emphasis_0%, as respostas envíanse como %emphasis_1%.
      Con %emphasis_2%, as respostas envíanse como %emphasis_3%.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "As mensaxes do servizo enviaranse agora como %value%."
    on_value: "PRIVMSG"
    off: "As mensaxes do servizo enviaranse agora como %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Establece ou elimina o teu host virtual."
    help: |-
      Establece un nome de host personalizado que verán as demais persoas cando
      te identifiques.

      Para eliminalo, executa %emphasis_0% sen indicar un valor.

      Só se permiten letras (a-z, A-Z), díxitos, guións e puntos.
      Cada bloque debe comezar e rematar cunha letra ou un díxito.
      O nome de host pode ter ata 48 caracteres e debe ser único por alcume.
    example: "%command_prefix%SET VHOST usuario.exemplo.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "O seu host virtual foi establecido como %vhost%."
    cleared: "O seu host virtual foi limpado."
    invalid: "Vhost non válido. Só letras, díxitos, guión e punto (non ao inicio/final de bloque); máx. 48 caracteres."
    taken: "Ese vhost xa está en uso por outro alcume."
    forced: "O seu vhost está configurado automaticamente e non se pode cambiar con SET VHOST."

# --- INFO ---------------------------------------------------------------------
info:
  syntax: "INFO <alcume>"
  short: "Mostrar información sobre un alcume rexistrado."
  help: |-
    Amosa os datos de rexistro dun alcume: data de alta, estado da conexión,
    última mensaxe enviada e correo electrónico.

    O correo só é visible para a persoa propietaria identificada.
    Se o alcume é privado, só a súa persoa propietaria e os operadores IRC poden
    consultar a información.
  example: "%command_prefix%INFO Usuario"
  private: "A información do alcume %nickname% é privada."
  header: "Información do alcume %nickname%"
  status: "%label%            : %status%"
  label_status: "Estado"
  status_registered: "Rexistrado"

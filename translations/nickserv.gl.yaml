# --- NICK PROTECTION ----------------------------------------------------------
protection:
  nick_in_use: "O alcume %nickname% está rexistrado. Será renomeado se non se identifica."
  renamed_to: |-
    Cambiáronche o alcume a %guest_nick%. Para recuperar o teu alcume:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <contrasinal>"
  nick_forbidden: "O alcume %nickname% está prohibido: %reason%"

# --- USERIP (IRCop) -----------------------------------------------------------
userip:
  syntax: "USERIP <alcume>"
  short: "Obter o enderezo IP real e o nome de servidor do alcume."
  help: |-
    Amosa o enderezo IP e o nome de host reais dun alcume.
    Úsao con responsabilidade: é información sensible.
  example: "%command_prefix%USERIP Usuario"
  result: "Alcume: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP (IRCop) ------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Busca alcumes polo IP da súa última conexión identificada."
  help: |-
    Amosa os alcumes rexistrados cuxa última conexión identificada utilizou este
    enderezo IP. O enderezo gardado pode estar desactualizado.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Non hai alcumes rexistrados que coincidan con este enderezo IP."
  header: "Alcumes coincidentes:"

# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <patrón> [páxina]"
  short: "Lista alcumes rexistrados que coinciden cun patrón."
  help: |-
    Lista os alcumes rexistrados que coinciden co patrón. O comodín * coincide con
    calquera secuencia de caracteres; a páxina opcional comeza en 1.
  example: "%command_prefix%LIST Usuario*"
  examples:
    - "%command_prefix%LIST Usuario* 2"
  header: "Alcume | Rexistro | Última conexión | IP | Estado"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Ningún alcume coincide co patrón %pattern%."
  status_pending: "Pendente"
  status_registered: "Rexistrado"

# --- HISTORY ---
history:
  syntax: "HISTORY <alcume> {ADD <mensaxe>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Ver ou xestionar o historial de accións do alcume."
  help: |-
    Consulta e xestiona o historial de accións dun alcume. Rexistra automaticamente
    suspensións, cambios de contrasinal ou correo e recuperacións. VIEW amosa tres
    entradas por páxina; ALL amosa o historial completo.
  example: "%command_prefix%HISTORY Usuario VIEW"
  examples:
    - "%command_prefix%HISTORY Usuario VIEW ALL"
    - "%command_prefix%HISTORY Usuario ADD Nota manual"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <alcume> ADD <mensaxe>"
    short: "Engadir unha entrada manual ao historial."
    help: "Engade unha entrada manual ao historial do alcume."
    example: "%command_prefix%HISTORY Usuario ADD Denunciado por spam"
    success: "Entrada do historial engadida para %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <alcume> DEL <id>"
    short: "Eliminar unha entrada do historial polo ID."
    help: "Elimina unha entrada concreta do historial polo seu ID."
    example: "%command_prefix%HISTORY Usuario DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <alcume> VIEW [PÁXINA|ALL]"
    short: "Ver o historial de accións do alcume."
    help: |-
      Amosa o historial de accións do alcume. Por defecto amosa tres entradas por
      páxina. Usa ALL para velas todas.
    example: "%command_prefix%HISTORY Usuario VIEW"
    examples:
      - "%command_prefix%HISTORY Usuario VIEW 2"
      - "%command_prefix%HISTORY Usuario VIEW ALL"
    header: "%heading% (mostrando %start%-%end% de %total%):"
    header_title: "Historial de %nickname%"
    entry: "#%id% [%date%] %action% por %operator% — %message%"
    no_entries: "Non se atoparon entradas do historial para %nickname%."
    page_hint: "Use %command% para máis entradas."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <alcume> CLEAR"
    short: "Eliminar todas as entradas do historial dun alcume."
    help: "Elimina de forma irreversible todas as entradas do historial do alcume."
    example: "%command_prefix%HISTORY Usuario CLEAR"
    success: "Limpadas %count% entradas do historial de %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Conta activada"
  resend: "Correo de verificación reenviado"
  noexpire_on: "Protección de caducidade activada"
  noexpire_off: "Protección de caducidade desactivada"
  userip: "Consulta USERIP"
  history_clear: "Historial borrado"
  password_changed_owner: "Contrasinal cambiado polo propietario"
  password_changed_operator: "Contrasinal cambiado por un operador"
  email_changed_owner: "Correo electrónico cambiado de %old_email% a %new_email%"
  email_changed_operator: "Correo electrónico cambiado a %new_email% por un operador"
  recover: "Contrasinal restablecido mediante token por correo"
  saregister: "Conta rexistrada administrativamente"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Correo-e anterior: %value%"
  new_email: "Novo correo-e: %value%"
  method: "Método: %value%"

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <alcume> <contrasinal> [email]"
  short: "Rexistrar administrativamente un alcume."
  help: |-
    Sintaxe: SAREGISTER <alcume> <contrasinal> [email]

    Rexistra administrativamente un alcume de xeito inmediato sen requirir
    verificación do cliente nin límites de frecuencia.

    En modo TOKEN, o código de rescate móstrase unha vez ao operador.
    En modo EMAIL, o código de rescate envíase ao enderezo de correo indicado.
  example: "%command_prefix%SAREGISTER Alice Contrasinal123"
  examples:
    - "%command_prefix%SAREGISTER Bob Contrasinal456 bob@exemplo.gal"
  success_token: "O alcume %nickname% foi rexistrado. Código de rescate: %token%"
  success_email: "O alcume %nickname% foi rexistrado. Código de rescate enviado a %email%."
  invalid_nickname: "Alcume non válido %nickname%."

# --- SASET (IRCop) ------------------------------------------------------------
saset:
  syntax: "SASET <alcume> {PASSWORD <novo_contrasinal>|EMAIL <novo_correo>|LANGUAGE <código>|TIMEZONE {<fuso_horario>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Modificar a configuración doutro alcume."
  help: |-
    Permite a un IRCop cambiar a configuración doutro alcume rexistrado. Non
    admite alcumes Root, IRCop nin de servizos.
  example: "%command_prefix%SASET Usuario PRIVATE ON"
  examples:
    - "%command_prefix%SASET Usuario TIMEZONE OFF"
  unknown_option: "Opción descoñecida %option%. Opcións dispoñibles: %options%."
  cannot_modify_oper: "Non se pode modificar un alcume de Operador de IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <alcume> PASSWORD <novo_contrasinal>"
    short: "Cambiar o contrasinal dun alcume."
    help: "Cambia o contrasinal doutro alcume. O cambio é inmediato."
    example: "%command_prefix%SASET Usuario PASSWORD ChaveSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <alcume> EMAIL <novo_correo>"
    short: "Cambiar o correo electrónico dun alcume."
    help: |-
      Cambia o correo electrónico doutro alcume. O cambio é inmediato e non require
      o token de rescate nin envía un correo de confirmación.
      BADMAIL non restrinxe este cambio administrativo de correo.
    example: "%command_prefix%SASET Usuario EMAIL usuario@exemplo.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <alcume> LANGUAGE <código>"
    short: "Cambiar o idioma dun alcume."
    help: |-
      Cambia o idioma doutro alcume. Neste comando están dispoñibles en (inglés)
      e es (castelán).
    example: "%command_prefix%SASET Usuario LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <alcume> TIMEZONE {<fuso_horario>|OFF}"
    short: "Cambiar o fuso horario dun alcume."
    help: "Establece ou elimina o fuso horario doutro alcume. Usa OFF para eliminalo."
    example: "%command_prefix%SASET Usuario TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Usuario TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <alcume> PRIVATE {ON|OFF}"
    short: "Cambiar a privacidade dun alcume."
    help: "Activa ou desactiva a privacidade da información doutro alcume."
    example: "%command_prefix%SASET Usuario PRIVATE ON"
    examples:
      - "%command_prefix%SASET Usuario PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <alcume> MSG {ON|OFF}"
    short: "Cambiar a preferencia de mensaxes dun alcume."
    help: "Establece se outro alcume recibe respostas como PRIVMSG (ON) ou NOTICE (OFF)."
    example: "%command_prefix%SASET Usuario MSG ON"
    examples:
      - "%command_prefix%SASET Usuario MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <alcume> VHOST [vhost]"
    short: "Cambiar o host virtual dun alcume."
    help: |-
      Establece ou elimina o host virtual doutro alcume. Executa SASET <alcume> VHOST
      sen valor para eliminalo.
    example: "%command_prefix%SASET Usuario VHOST usuario.exemplo.org"
    examples:
      - "%command_prefix%SASET Usuario VHOST"

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax: "RENAME <alcume>"
  short: "Forzar o renomeado dun alcume conectado a un alcume aleatorio."
  help: |-
    Obriga un alcume conectado a cambiar a un nome aleatorio cun prefixo definido
    pola rede.
  example: "%command_prefix%RENAME Problematico"
  cannot_rename_root: "Non se pode renomear o usuario root %nickname%."
  cannot_rename_oper: "Non se pode renomear o operador de IRC %nickname%."
  cannot_rename_service: "Non se pode renomear o alcume de servizo %nickname%."
  success: "O alcume %nickname% foi renomeado a %new_nick%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <alcume> {ON|OFF}"
  short: "Establecer ou eliminar a protección contra caducidade dun alcume."
  help: |-
    Controla se o alcume caduca por inactividade.
    ON evita a caducidade e OFF aplica as regras habituais.
  example: "%command_prefix%NOEXPIRE Usuario ON"
  examples:
    - "%command_prefix%NOEXPIRE Usuario OFF"
  success_on: "O alcume %nickname% está agora protexido contra a caducidade."
  success_off: "O alcume %nickname% caducará normalmente agora."
  forbidden: "O alcume %nickname% está prohibido."
  suspended: "O alcume %nickname% está suspendido."

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Administrar o modo de rexistro da rede."
  help: |-
    Configura o modo de rexistro das novas contas.

    %emphasis_0% Envía o token de verificación ao correo electrónico da persoa usuaria.
    %emphasis_1% Entrega o token de verificación directamente por IRC.
    %emphasis_2% Amosa o modo actual sen modificalo.

    Os rexistros pendentes manteñen o modo co que se iniciaron.

    No modo TOKEN, o comando RESEND permanece desactivado para todas as persoas
    usuarias.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Modo de rexistro actual: %mode%."
  changed: "Modo de rexistro cambiado a %mode%."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <alcume> <duración> <motivo>"
  short: "Suspender un alcume."
  help: |-
    Impide que a persoa propietaria se identifique. A duración pode expresarse en
    días (d), horas (h), minutos (m) ou 0 para unha suspensión permanente. Non se
    poden suspender operadores IRC nin persoas usuarias Root.
  example: "%command_prefix%SUSPEND MalUsuario 7d Spam en #axuda"
  examples:
    - "%command_prefix%SUSPEND Problematico 0 Evasión de prohibición"
  success: "O alcume %nickname% foi suspendido ata %duration%."
  already_suspended: "O alcume %nickname% xa está suspendido."
  forbidden: "O alcume %nickname% está prohibido e non se pode suspender."
  cannot_suspend_oper: "Non se pode suspender o operador de IRC %nickname%."
  cannot_suspend_root: "Non se pode suspender o usuario root %nickname%."
  cannot_suspend_service: "Non se pode suspender o alcume de servizo %nickname%."
  invalid_duration: "Duración non válida. Use: %duration_format% (p.ex., 7d, 12h, 30m) ou %permanent% para permanente."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <alcume>"
  short: "Eliminar a suspensión dun alcume."
  help: |-
    Retira unha suspensión activa para que a persoa propietaria poida volver
    a identificarse.
  example: "%command_prefix%UNSUSPEND Usuario"
  success: "A suspensión foi levantada de %nickname%."
  not_suspended: "O alcume %nickname% non está suspendido."

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <alcume> <motivo>"
  short: "Bloquear permanentemente un alcume para que non se poida usar."
  help: |-
    Prohibe permanentemente un alcume para que ninguén poida rexistralo nin usalo.
    Se está rexistrado, elimínase; se está conectado, obrígaselle a cambiar a un
    alcume aleatorio. Non se poden prohibir persoas usuarias Root, IRCops nin
    servizos.
  example: "%command_prefix%FORBID MalUsuario Infraccións reiteradas das normas"
  success: "O alcume %nickname% foi prohibido."
  updated: "O motivo de prohibición de %nickname% foi actualizado."
  reason_required: "Debe proporcionar un motivo para a prohibición."
  cannot_forbid_root: "Non se pode prohibir o usuario root %nickname%."
  cannot_forbid_oper: "Non se pode prohibir o operador de IRC %nickname%."
  cannot_forbid_service: "Non se pode prohibir o alcume de servizo %nickname%."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <alcume>"
  short: "Eliminar unha prohibición de alcume."
  help: "Retira a prohibición para que o alcume poida volver usarse."
  example: "%command_prefix%UNFORBID AlcumeProhibido"
  success: "O alcume %nickname% xa non está prohibido."
  not_forbidden: "O alcume %nickname% non está prohibido."

# --- FORBIDVHOST (IRCop) ------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <patrón>|DEL <patrón>|LIST}"
  short: "Xestionar os patróns de vhost prohibidos."
  help: |-
    Xestiona os patróns que impiden establecer vhosts coincidentes con SET VHOST.
    O comodín * coincide con calquera secuencia e ? cun carácter. Require
    privilexios
    de operador IRC.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Subcomando descoñecido %sub%. Use ADD, DEL ou LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <patrón>"
    short: "Engadir un patrón de vhost prohibido."
    help: |-
      Engade un patrón á lista. As persoas usuarias non poderán establecer vhosts
      coincidentes mediante SET VHOST. * coincide con calquera secuencia e ? cun
      carácter.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Patrón de vhost prohibido engadido: %pattern%"
    already_exists: "O patrón %pattern% xa existe."
    invalid: "Formato de patrón de vhost non válido."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <patrón>"
    short: "Eliminar un patrón de vhost prohibido."
    help: "Elimina un patrón da lista de vhosts prohibidos."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Patrón de vhost prohibido eliminado: %pattern%"
    not_found: "Patrón %pattern% non atopado."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Listar todos os patróns de vhost prohibidos."
    syntax: "FORBIDVHOST LIST"
    help: "Amosa todos os patróns de vhost prohibidos."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Patróns de vhost prohibidos (%count%):"
    entry: "%index%. %pattern% — por %nickname% (%date%)"
    empty: "Non hai patróns de vhost prohibidos."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <alcume> [FORCE]"
  short: "Eliminar un alcume rexistrado."
  help: |-
    Marca un alcume rexistrado para eliminalo ao rematar o período de graza; pódese
    restaurar con RESTORE. Engade FORCE para eliminalo permanentemente. Non se poden
    eliminar persoas usuarias Root, IRCops e servizos, nin o teu propio alcume.
  force:
    short: "Elimina permanentemente un alcume pendente de eliminación."
  example: "%command_prefix%DROP CuentaAntigua"
  examples:
    - "%command_prefix%DROP CuentaAntigua FORCE"
  suspended: "O alcume %nickname% está suspendido. Reactíveo primeiro."
  forbidden: "O alcume %nickname% está prohibido."
  cannot_drop_root: "Non se pode eliminar o usuario root %nickname%."
  cannot_drop_oper: "Non se pode eliminar o operador de IRC %nickname%."
  cannot_drop_self: "Non pode eliminar o seu propio alcume."
  success: "O alcume %nickname% foi marcado para eliminación e pode ser restaurado durante o período de graza."
  force_success: "O alcume %nickname% foi eliminado permanentemente."
  pending_deletion: "O alcume %nickname% xa está pendente de eliminación. Use DROP <alcume> FORCE para eliminalo permanentemente."
  cannot_drop_service: "Non se pode eliminar o alcume de servizo %nickname%."

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <alcume>"
  short: "Restaurar un alcume pendente de eliminación."
  help: |-
    Restaura un alcume pendente de eliminación mentres siga dentro do período
    de graza.
  example: "%command_prefix%RESTORE CuentaAntigua"
  success: "O alcume %nickname% foi restaurado."
  not_pending_deletion: "O alcume %nickname% non está pendente de eliminación."

# --- RESCUE -------------------------------------------------------------------
rescue:
  issued: |-
    Token de rescate: %token_display%

    Garda este token nun lugar seguro. Necesitaralo para recuperar o teu alcume se esqueces o contrasinal.

    Para confirmalo, utiliza: /msg %bot% %verify%

    %warning%
  issued_warning: "IMPORTANTE: Só é válido o último token xerado. Unha vez confirmado, non volverá mostrarse. Non o compartas con ninguén."
  confirmed: "O token de rescate foi confirmado. Gárdao nun lugar seguro."
  unavailable: "Autentícate e confirma o token de rescate con %command_0% antes de usar esta operación."
  unavailable_command_0: "VERIFY"
  locked_out: "Demasiados tokens incorrectos. Téntao de novo en %seconds% segundos."
  throttled: "Demasiados tokens incorrectos. Téntao de novo en %minutes% minuto(s)."
  replaced: "O token de recuperación foi substituído polo token do correo que acabas de validar. Gárdao nun lugar seguro."
  optional_replacement: |-
    Novo token de recuperación opcional: %token_display%

    Para substituír o teu token de recuperación actual, utiliza: /msg %bot% %verify%

    O token actual segue sendo válido ata a confirmación.

    Se non queres cambialo, ignora esta mensaxe.
  replacement_unavailable: "O contrasinal restableceuse, pero non se puido emitir un token novo. O actual segue sendo válido."
  temporarily_unavailable: "A entrega do token de recuperación non está dispoñible temporalmente. Téntao máis tarde."


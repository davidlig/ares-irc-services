# Traducións de NickServ — Galego
# Dominio: nickserv
#
# Códigos de formato IRC (comiñas dobres ou bloques literais !irc):
#   \x02        activa/desactiva a negra
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermello, 07=laranxa, 14=gris escuro)
#   \x03        restablece a cor
#   \x0F        restablece todo o formato
#
# As cores IRC usan números DECIMAIS (0-15), non hexadecimais.
#   \x0314 = gris escuro (14 decimal): CORRECTO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multiliña: !irc |- con saltos físicos e espazos reais.
# Os bloques sen etiqueta non descodifican escapes; conserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O presentador engade /msg sen cor e unha marxe de dous espazos.

# --- REGISTER --------------------------------------------------------------
register:
  token_unavailable: !irc |-
    \x0304✗\x03 O rexistro está pendente, pero non se puido entregar o token.
    Agarda a que caduque antes de rexistrarte de novo.
  syntax: "REGISTER <password> [email]"
  short: "Rexistrar o seu alcume cos servizos."
  help: |-
    Rexistra o teu alcume. A rede indicaráche o token de verificación por chat
    ou por correo, segundo a súa configuración.
    Unha vez validado, será o teu token de recuperación permanente:
    gárdao nun lugar seguro.
    A caducidade de %duration% só se aplica antes de validalo.
  example: "%command_prefix%\x02\x0303REGISTER Chave$egura_123\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGISTER Chave$egura_123 usuario@exemplo.com\x03\x0F"
  pending: !irc |-
    \x0307→\x03 Enviouse un token de verificación a \x02%email%\x02.
      Executa /msg %bot% \x0303VERIFY <token>\x03 para completar o rexistro.
      Non o recibiches? Revisa o correo lixo ou usa /msg %bot% \x0303RESEND\x03
      O token caducará en \x02%duration%\x02.
  already_registered: "\x0304✗\x03 O alcume \x02%nickname%\x02 xa está rexistrado."
  already_pending: "\x0307→\x03 O rexistro de \x02%nickname%\x02 está pendente. Usa \x0303VERIFY <token>\x03. Se o token se enviou por correo e hai un enderezo válido asociado, podes solicitar outro con \x0303RESEND\x03."
  forbidden: "\x0304✗\x03 O alcume \x02%nickname%\x02 non se pode rexistrar nesta rede."
  pending_deletion: "\x0304✗\x03 O alcume \x02%nickname%\x02 está pendente de eliminación e non se pode rexistrar."
  invalid_email: "\x0304✗\x03 O enderezo de correo electrónico proporcionado non é válido."
  email_already_used: "\x0304✗\x03 O correo electrónico \x02%email%\x02 xa está en uso por outro alcume. Use un enderezo diferente."
  throttled: "\x0304✗\x03 Debe agardar \x02%minutes%\x02 minuto(s) antes de tentar rexistrarse de novo."
  guest_prefix_forbidden: "\x0304✗\x03 Non pode rexistrar un alcume que comece con \x02%prefix%\x02."

# --- VERIFY ----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirma un rexistro ou token de rescate."
  help: |-
    Unha vez validado, este token será o teu token de recuperación permanente.
    Gárdao nun lugar seguro: poderás usalo para recuperar o teu alcume.
    A caducidade de %duration% só se aplica antes de validalo.
  example: "%command_prefix%\x02\x0303VERIFY <token_recibido>\x03\x0F"
  success: "\x0303✔\x03 O alcume \x02%nickname%\x02 foi rexistrado con éxito e agora está identificado."
  success_native: "\x0303✔\x03 O alcume \x02%nickname%\x02 rexistrouse correctamente. Usa a autenticación nativa que se mostra a continuación."
  invalid_token: "\x0304✗\x03 O token de rescate non é válido."
  no_pending: "\x0304✗\x03 Non ten ningún rexistro pendente que verificar."

# --- RESEND ----------------------------------------------------------------
resend:
  disabled: "\x0307ℹ\x03 Non podes solicitar outro token con \x0303RESEND\x03 porque este rexistro entrega o token directamente polo chat."
  syntax: "RESEND"
  short: "Reenviar o token de verificación ao seu correo electrónico."
  help: |-
    RESEND só está dispoñible se o token de verificación se enviou por correo.
    Unha vez validado, este token será o teu token de recuperación permanente.
    Gárdao nun lugar seguro: poderás usalo para recuperar o teu alcume.
    A caducidade de %duration% só se aplica antes de validalo.
    Ao usar RESEND, recibirás un novo token por correo.
    O prazo do rexistro pendente renovarase durante %duration%.
  example: "%command_prefix%\x02\x0303RESEND\x03\x0F"
  success: "\x0307→\x03 Token de verificación reenviado a \x02%email%\x02."
  no_pending: "\x0304✗\x03 Non ten ningún rexistro pendente que verificar."
  throttled: "\x0304✗\x03 Debe agardar \x02%minutes%\x02 minuto(s) antes de solicitar outro correo de verificación."

# --- RECOVER ---------------------------------------------------------------
recover:
  no_email: "\x0304✗\x03 Non hai un correo electrónico configurado para o alcume \x02%nickname%\x02. A recuperación non está dispoñible."
  email_sent: "\x0307→\x03 Enviouse un token de recuperación a \x02%email_hint%\x02. Comprobe a súa caixa de entrada (e o cartafol de spam)."
  pending_deletion: "\x0304✗\x03 O alcume \x02%nickname%\x02 está pendente de eliminación e non se pode recuperar."
  instructions: "\x0307ℹ\x03 EMAIL: \x0303RECOVER %nickname%\x03 solicita un token provisional por correo. TOKEN: proporciona o token confirmado. \x0303RECOVER %nickname% <token>\x03 acepta o token válido do correo ou o confirmado. O do correo substitúe o gardado só tras validalo. Usar o gardado ofrece un reemplazo opcional con \x0303VERIFY\x03; ignora a mensaxe para conservalo."
  syntax: "RECOVER <alcume> [token]"
  short: "Recuperar o seu alcume se perdeu o contrasinal."
  help: |-
    Se non tes un token, solicita por correo un token provisional.
    Tamén podes proporcionar un token de recuperación válido; se é provisional,
    substituirá o gardado só despois de validalo.
    Ao usar o token gardado ofrécesche unha substitución opcional con VERIFY; ignora
    a mensaxe se queres conservar o actual.
  example: "%command_prefix%\x02\x0303RECOVER Usuario\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303RECOVER Usuario <token_recibido>\x03\x0F"
  pending: "\x0307→\x03 O rexistro de \x02%nickname%\x02 está pendente. Usa \x0303VERIFY <token>\x03. Se o token se enviou por correo e hai un enderezo válido asociado, podes solicitar outro con \x0303RESEND\x03."
  suspended: "\x0304✗\x03 O alcume \x02%nickname%\x02 está suspendido. Motivo: %reason%"
  forbidden: "\x0304✗\x03 O alcume \x02%nickname%\x02 non se pode usar nesta rede."
  throttled: "\x0304✗\x03 Demasiados tokens incorrectos. Téntao de novo en \x02%minutes%\x02 minuto(s)."
  invalid_token: "\x0304✗\x03 O token de rescate non é válido."
  success_identify: "\x0303✔\x03 Contrasinal restablecido. Identifíquese agora: \x0303%identify_cmd%\x03"
  success_then_change: "Despois cambia o teu contrasinal: /msg %bot% \x0303SET PASSWORD <novo_contrasinal>\x03"

# --- IDENTIFY --------------------------------------------------------------
identify:
  syntax: "IDENTIFY <alcume> <contrasinal>"
  short: "Identificarse como o propietario dun alcume."
  help: !irc |-
    Autentica a súa sesión con %nickserv% usando o seu alcume e contrasinal.
    Despois dunha identificación exitosa recibirá o modo rexistrado \x02+r\x02
    e, se estaba usando un alcume de convidado, restauraráselle o seu alcume
    rexistrado.
  example: "%command_prefix%\x02\x0303IDENTIFY Usuario <contrasinal>\x03\x0F"
  native_syntax: "/NICK <alcume>:<contrasinal> | /NICK <alcume>!<contrasinal>"
  native_short: "Mostra a sintaxe de autenticación nativa por cambio de alcume."
  native_help: |-
    Este protocolo autentica as contas mediante cambios de alcume.
    Usa /NICK <alcume>:<contrasinal> ou, se o alcume está ocupado, /NICK <alcume>!<contrasinal>.
  native_example: "\x02\x0303/NICK Usuario:<contrasinal>\x03\x0F"
  native_examples:
    - "%command_prefix%\x02\x0303/NICK Usuario!<contrasinal>\x03\x0F"
  native_authentication: "\x0307ℹ\x03 Este protocolo xestiona a autenticación mediante cambios de alcume. Usa \x0303/NICK <alcume>:<contrasinal>\x03 ou, se o alcume está ocupado, \x0303/NICK <alcume>!<contrasinal>\x03."
  success: "\x0303✔\x03 Agora está identificado como \x02%nickname%\x02."
  already_identified: "\x0307ℹ\x03 Xa está identificado como \x02%nickname%\x02."
  invalid_credentials: "\x0304✗\x03 Contrasinal incorrecto. Tenteo de novo."
  locked_out: "\x0304✗\x03 Demasiados intentos errados. Tenteo de novo en \x02%minutes%\x02 minuto(s)."
  ghost_released: "\x0307⚡\x03 A sesión fantasma que mantiña \x02%nickname%\x02 foi desconectada."
  kill_reason: "Alcume %nickname% recuperado por %source% (o propietario rexistrado identificouse)"
  pending: !irc |-
    \x0304✗\x03 O alcume \x02%nickname%\x02 está pendente de verificación por correo electrónico.
      Executa /msg %bot% \x0303VERIFY <token>\x03 ou /msg %bot% \x0303RESEND\x03
  suspended: "\x0304✗\x03 O alcume \x02%nickname%\x02 está suspendido. Motivo: %reason%"
  forbidden: "\x0304✗\x03 O alcume \x02%nickname%\x02 non se pode usar nesta rede."
  pending_deletion: "\x0304✗\x03 O alcume \x02%nickname%\x02 está pendente de eliminación e non se pode usar."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <alcume>"
  short: "Mostrar o estado de rexistro dun alcume."
  help: |-
    Amosa o estado actual dun alcume: se está rexistrado, pendente de
    verificación, suspendido, etc.
  example: "%command_prefix%\x02\x0303STATUS Usuario\x03\x0F"
  header: "\x02Estado do alcume \x0307%nickname%\x03\x02"
  unregistered: "  Estado          : Non rexistrado"
  not_registered_offline: "  Estado          : \x0315Non rexistrado\x03"
  pending: "  Estado          : \x0307Verificación pendente\x03"
  pending_expires: "  Caduca en       : %minutes% minuto(s)"
  pending_expires_at: "  Caduca ás       : %date%"
  not_connected: "  Estado          : \x0315Non conectado\x03"
  not_identified: "  Estado          : \x0307Non identificado\x03"
  identified: "  Estado          : \x0303Identificado\x03"
  suspended: "  Estado          : \x0304Suspendido\x03"
  suspended_reason: "  Motivo          : %reason%"
  suspended_until: "  Finaliza o      : %date%"
  suspended_permanent: "  Finaliza o      : Permanente"
  forbidden: "  Estado          : \x0304Prohibido\x03"
  forbidden_reason: "  Motivo          : %reason%"
  pending_deletion: "  \x0314Estado\x03          : \x0307Pendente de eliminación\x03"
  pending_deletion_at: "  \x0314Eliminado\x03       : %date%"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <alcume>"
  short: "Mostrar información sobre un alcume rexistrado."
  help: |-
    Amosa os datos de rexistro dun alcume: data de alta, estado da conexión,
    última mensaxe enviada e correo electrónico.

    O correo só é visible para a persoa propietaria identificada.
    Se o alcume é privado, só a súa persoa propietaria e os operadores IRC poden
    consultar a información.
  example: "%command_prefix%\x02\x0303INFO Usuario\x03\x0F"
  private: "\x0304✗\x03 A información do alcume \x02%nickname%\x02 é privada."
  header: "\x02Información do alcume \x0307%nickname%\x03\x02"
  status: "  \x0314Estado\x03            : %status%"
  status_registered: "\x0303Rexistrado\x03"
  status_suspended: "\x0304Suspendido\x03"
  status_forbidden: "\x0304Prohibido\x03"
  status_pending_deletion: "\x0307Pendente de eliminación\x03"
  reason: "  \x0314Motivo\x03                 : %reason%"
  suspended_until: "  \x0314Finaliza o\x03        : %date%"
  suspended_permanent: "  \x0314Finaliza o\x03        : Permanente"
  registered_at: "  \x0314Rexistrado\x03        : %date%"
  last_seen_online: "  \x0314Última vez\x03        : \x0303● EN LIÑA AGORA\x03"
  last_seen_at: "  \x0314Última vez\x03        : %date%"
  last_seen_never: "  \x0314Última vez\x03        : Nunca"
  last_quit: "  \x0314Últ. mens. saída\x03  : %message%"
  last_connect: "  \x0314Últ. vez desde\x03    : %ip% (%host%)"
  language: "  \x0314Idioma\x03            : %language%"
  email: "  \x0314Correo-e\x03          : %email%"
  vhost: "  \x0314VHost\x03             : %vhost%"
  no_expire: "  \x0314Nunca caduca\x03      : Si"
  pending_deletion_at: "  \x0314Eliminado\x03              : %date%"
  pending_deletion_until: "  \x0314Elim. definitiva\x03       : %date%"
  pending_deletion_notice: "  \x0307Este alcume está pendente de eliminación e non se pode rexistrar.\x03"
  channels_header: !irc |-
    \x0314
    Canles con acceso:\x03
  channels_entry_founder: "  %channel% (\x0303Fundador\x03)"
  channels_entry_successor: "  %channel% (\x0303Sucesor\x03)"
  channels_entry_access: "  %channel% (%level%)"

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <opción> <valor>"
  short: "Cambiar as opcións do teu alcume."
  help: |-
    Modifica a configuración do teu alcume. Debes identificarte para cambiarestas
    opcións.
  example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
  unknown_option: "\x0304✗\x03 Opción descoñecida \x02%option%\x02. Opcións dispoñibles: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <novo_contrasinal>"
    short: "Cambiar o contrasinal do seu alcume."
    help: |-
      Cambia o contrasinal do seu alcume. O novo contrasinal ten
      efecto inmediato. Escolla un contrasinal seguro de polo menos 6 caracteres
      que non use noutros servizos.
    example: "%command_prefix%\x02\x0303SET PASSWORD Chave$egura_123\x03\x0F"
    success: "\x0303✔\x03 O seu contrasinal foi actualizado con éxito."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "\x0304✗\x03 Usa \x0303SET EMAIL <email> <token>\x03 co token de rescate confirmado."
    syntax: "SET EMAIL <email> <token>"
    short: "Cambia o correo electrónico usando o teu token de rescate confirmado."
    help: |-
      SET EMAIL cambia o correo de contacto tras validar o token de rescate, sen
      consumilo. Comproba o formato e a unicidade; non envía correo de confirmación.
    example: "%command_prefix%\x02\x0303SET EMAIL usuario@exemplo.com <token_confirmado>\x03\x0F"
    success: "\x0303✔\x03 O seu correo electrónico foi actualizado a \x02%email%\x02."
    pending_sent: !irc |-
      \x0307→\x03 Enviouse un token de confirmación a \x02%current_email%\x02.
        Para confirmar o cambio a \x02%new_email%\x02, executa:
        /msg %bot% \x0303SET EMAIL %new_email% <token>\x03
        O token caduca nunha hora.
    invalid_token: "\x0304✗\x03 O token non é válido ou caducou. Solicite un novo con \x0303SET EMAIL <novo_correo-e>\x03."

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <código>"
    short: "Cambiar o idioma que os servizos usan para comunicarse con vostede."
    help: !irc |-
      Cambia o idioma que %nickserv% e outros servizos usan ao falar con vostede.
      Idiomas dispoñibles:
        \x02ca\x02 (catalán)
        \x02de\x02 (alemán)
        \x02el\x02 (grego)
        \x02en\x02 (inglés)
        \x02es\x02 (español)
        \x02eu\x02 (éuscaro)
        \x02fr\x02 (francés)
        \x02gl\x02 (galego)
        \x02it\x02 (italiano)
        \x02nl\x02 (neerlandés)
        \x02pl\x02 (polaco)
        \x02pt\x02 (portugués)
        \x02ro\x02 (romanés)
        \x02tr\x02 (turco)
    example: "%command_prefix%\x02\x0303SET LANGUAGE es\x03\x0F"
    success: "\x0303✔\x03 Idioma cambiado a \x02%language%\x02."
    invalid: "\x0304✗\x03 Idioma non soportado. Idiomas dispoñibles: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <fuso_horario>"
    short: "Establecer o fuso horario usado cando se mostran datas."
    help: |-
      Establece o fuso horario co que %nickserv% amosa as datas. Consulta HELP SET
      TIMEZONE para ver as rexións. Usa OFF para eliminalo.
    example: "%command_prefix%\x02\x0303SET TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET TIMEZONE OFF\x03\x0F"
    success: "\x0303✔\x03 Fuso horario establecido en \x02%timezone%\x02. As datas mostraranse neste fuso."
    cleared: "\x0303✔\x03 Fuso horario limpado. As datas usarán o valor predeterminado da rede."
    invalid: "\x0304✗\x03 Fuso horario non válido \x02%timezone%\x02. Use un identificador válido (p.ex. UTC, Europe/Madrid)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Amosa ou oculta a información do teu alcume."
    help: !irc |-
      Controla a visibilidade da información do seu alcume no comando INFO.
      Con \x02PRIVATE ON\x02 só vostede e os operadores de IRC poden ver os seus detalles.
      Con \x02PRIVATE OFF\x02 a súa información é pública para todos.
    example: "%command_prefix%\x02\x0303SET PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET PRIVATE OFF\x03\x0F"
    on: "\x0303✔\x03 A información do seu alcume é agora \x02privada\x02."
    off: "\x0303✔\x03 A información do seu alcume é agora \x02pública\x02."

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Cambia como se comunican contigo os servizos."
    help: !irc |-
      Controla como %nickserv% e o resto dos servizos che envían mensaxes.
      Con \x02MSG ON\x02, as respostas envíanse como \x02PRIVMSG\x02.
      Con \x02MSG OFF\x02, as respostas envíanse como \x02NOTICE\x02.
    example: "%command_prefix%\x02\x0303SET MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET MSG OFF\x03\x0F"
    on: "\x0303✔\x03 As mensaxes do servizo enviaranse agora como \x02PRIVMSG\x02."
    off: "\x0303✔\x03 As mensaxes do servizo enviaranse agora como \x02NOTICE\x02."

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Establece ou elimina o teu host virtual."
    help: !irc |-
      Establece un nome de host personalizado que verán as demais persoas cando
      te identifiques.

      Para eliminalo, executa \x02SET VHOST\x02 sen indicar un valor.

      Só se permiten letras (a-z, A-Z), díxitos, guións e puntos.
      Cada bloque debe comezar e rematar cunha letra ou un díxito.
      O nome de host pode ter ata 48 caracteres e debe ser único por alcume.
    example: "%command_prefix%\x02\x0303SET VHOST usuario.exemplo.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET VHOST\x03\x0F"
    success: "\x0303✔\x03 O seu host virtual foi establecido como \x02%vhost%\x02."
    cleared: "\x0303✔\x03 O seu host virtual foi limpado."
    invalid: "\x0304✗\x03 Vhost non válido. Só letras, díxitos, guión e punto (non ao inicio/final de bloque); máx. 48 caracteres."
    taken: "\x0304✗\x03 Ese vhost xa está en uso por outro alcume."
    forced: "\x0304✗\x03 O seu vhost está configurado automaticamente e non se pode cambiar con SET VHOST."

# --- SASET -----------------------------------------------------------------
saset:
  syntax: "SASET <alcume> <opción> <valor>"
  short: "Modificar a configuración doutro alcume."
  help: |-
    Permite a un IRCop cambiar a configuración doutro alcume rexistrado. Non
    admite alcumes Root, IRCop nin de servizos.
  example: "%command_prefix%\x02\x0303SASET Usuario PRIVATE ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SASET Usuario TIMEZONE OFF\x03\x0F"
  unknown_option: "\x0304✗\x03 Opción descoñecida \x02%option%\x02. Opcións dispoñibles: %options%."
  cannot_modify_oper: "\x0304✗\x03 Non se pode modificar un alcume de Operador de IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <alcume> PASSWORD <novo_contrasinal>"
    short: "Cambiar o contrasinal dun alcume."
    help: "Cambia o contrasinal doutro alcume. O cambio é inmediato."
    example: "%command_prefix%\x02\x0303SASET Usuario PASSWORD ChaveSegura123\x03\x0F"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <alcume> EMAIL <novo_correo>"
    short: "Cambiar o correo electrónico dun alcume."
    help: |-
      Cambia o correo electrónico doutro alcume. O cambio é inmediato e non require
      o token de rescate nin envía un correo de confirmación.
    example: "%command_prefix%\x02\x0303SASET Usuario EMAIL usuario@exemplo.com\x03\x0F"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <alcume> LANGUAGE <código>"
    short: "Cambiar o idioma dun alcume."
    help: |-
      Cambia o idioma doutro alcume. Neste comando están dispoñibles en (inglés)
      e es (castelán).
    example: "%command_prefix%\x02\x0303SASET Usuario LANGUAGE es\x03\x0F"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <alcume> TIMEZONE <fuso_horario|OFF>"
    short: "Cambiar o fuso horario dun alcume."
    help: "Establece ou elimina o fuso horario doutro alcume. Usa OFF para eliminalo."
    example: "%command_prefix%\x02\x0303SASET Usuario TIMEZONE Europe/Madrid\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Usuario TIMEZONE OFF\x03\x0F"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <alcume> PRIVATE {ON|OFF}"
    short: "Cambiar a privacidade dun alcume."
    help: "Activa ou desactiva a privacidade da información doutro alcume."
    example: "%command_prefix%\x02\x0303SASET Usuario PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Usuario PRIVATE OFF\x03\x0F"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <alcume> MSG {ON|OFF}"
    short: "Cambiar a preferencia de mensaxes dun alcume."
    help: "Establece se outro alcume recibe respostas como PRIVMSG (ON) ou NOTICE (OFF)."
    example: "%command_prefix%\x02\x0303SASET Usuario MSG ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Usuario MSG OFF\x03\x0F"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <alcume> VHOST [vhost]"
    short: "Cambiar o host virtual dun alcume."
    help: |-
      Establece ou elimina o host virtual doutro alcume. Executa SASET <alcume> VHOST
      sen valor para eliminalo.
    example: "%command_prefix%\x02\x0303SASET Usuario VHOST usuario.exemplo.org\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SASET Usuario VHOST\x03\x0F"

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [comando]"
  short: "Mostrar axuda dos comandos de %nickserv%."
  help: |-
    Mostra axuda xeral de %nickserv% ou información detallada
    dun comando específico.
  examples_header: "\x02 ■ Exemplos:\x02"
  example: "%command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HELP SET\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303HELP SET TIMEZONE Europe\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  navigation_marker: "\x0310›\x03\x0F"
  info_marker: "\x0310ℹ\x03\x0F"
  error_marker: "\x0304✗\x03\x0F"
  warning_marker: "\x0304⚠\x03\x0F"
  intro: |-
    Permite rexistrar e protexer o teu alcume para impedir que outras persoas o
    utilicen. Xestiona a seguridade da túa conta, personaliza as preferencias e
    recupera o acceso cando o necesites.
  intro_expiration: "%marker% %label%: Os alcumes que non se utilicen durante máis de \x1F\x0304%days% días\x03\x1F eliminaranse automaticamente."
  intro_expiration_label: "NOTA"
  general_header: "\x02 ■ Comandos dispoñibles:\x02"
  command_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    %marker% \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Opcións:\x02"
  general_syntax: "HELP <comando>"
  general_footer: "%marker% Usa /msg %bot% \x02\x0303%syntax%\x03\x0F para obter máis información."
  set_sub_syntax: "HELP %command% <opción>"
  set_sub_footer: "%marker% Usa /msg %bot% \x02\x0303%syntax%\x03\x0F para obter máis información."
  syntax_label: "Sintaxe: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    registration_auth: "Rexistro e autenticación"
    account_security: "Conta e seguridade"
  ircop_group:
    lookup: "Consulta e investigación"
    account_management: "Xestión de contas"
    suspensions_bans: "Suspensións e prohibicións"
    deletion: "Eliminación e restauración"
  ircop_header: "\x02 ■ Comandos dispoñibles para IRCops:\x02"
  set_timezone:
    index_label: "Zonas por rexión (usa \x02\x0303%syntax%\x03\x0F para consultar unha rexión):"
    index_syntax: "HELP SET TIMEZONE <rexión>"
    region_header: "\x02 ■ Fusos horarios de %region%:\x02"
    region_unknown: "%marker% Rexión descoñecida. Use \x02\x0303%syntax%\x03\x0F para o índice."
    region_syntax: "HELP SET TIMEZONE"

# --- NICK PROTECTION -------------------------------------------------------
protection:
  nick_in_use: "\x0304⚠\x03 O alcume \x02%nickname%\x02 está rexistrado. Será renomeado se non se identifica."
  renamed_to: !irc |-
    \x0307→\x03 Cambiáronche o alcume a \x02%guest_nick%\x02. Para recuperar o teu alcume:
    /msg %bot% \x0303IDENTIFY %nickname% <contrasinal>\x03
  nick_forbidden: "\x0304✗\x03 O alcume \x02%nickname%\x02 está prohibido: %reason%"

# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <alcume>"
  short: "Obter o enderezo IP real e o nome de servidor do alcume."
  help: |-
    Amosa o enderezo IP e o nome de host reais dun alcume.
    Úsao con responsabilidade: é información sensible.
  example: "%command_prefix%\x02\x0303USERIP Usuario\x03\x0F"
  result: "\x0307ℹ\x03 Alcume: \x02%nickname%\x02 | IP: \x0307%ip%\x03 | Host: \x0307%host%\x03"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Busca alcumes polo IP da súa última conexión identificada."
  help: |-
    Amosa os alcumes rexistrados cuxa última conexión identificada utilizou este
    enderezo IP. O enderezo gardado pode estar desactualizado.
  example: "%command_prefix%\x02\x0303WHOIP 192.0.2.10\x03\x0F"
  empty: "Non hai alcumes rexistrados que coincidan con este enderezo IP."
  header: "Alcumes coincidentes:"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <alcume> <duración> <motivo>"
  short: "Suspender un alcume."
  help: |-
    Impide que a persoa propietaria se identifique. A duración pode expresarse en
    días (d), horas (h), minutos (m) ou 0 para unha suspensión permanente. Non se
    poden suspender operadores IRC nin persoas usuarias Root.
  example: "%command_prefix%\x02\x0303SUSPEND MalUsuario 7d Spam en #axuda\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND Problematico 0 Evasión de prohibición\x03\x0F"
  success: "\x0303✔\x03 O alcume \x02%nickname%\x02 foi suspendido ata \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 O alcume \x02%nickname%\x02 xa está suspendido."
  forbidden: "\x0304✗\x03 O alcume \x02%nickname%\x02 está prohibido e non se pode suspender."
  cannot_suspend_oper: "\x0304✗\x03 Non se pode suspender o operador de IRC \x02%nickname%\x02."
  cannot_suspend_root: "\x0304✗\x03 Non se pode suspender o usuario root \x02%nickname%\x02."
  cannot_suspend_service: "\x0304✗\x03 Non se pode suspender o alcume de servizo \x02%nickname%\x02."
  invalid_duration: "\x0304✗\x03 Duración non válida. Use: \x0303<d><h><m>\x03 (p.ex., 7d, 12h, 30m) ou \x03030\x03 para permanente."

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <alcume>"
  short: "Eliminar a suspensión dun alcume."
  help: |-
    Retira unha suspensión activa para que a persoa propietaria poida volver
    a identificarse.
  example: "%command_prefix%\x02\x0303UNSUSPEND Usuario\x03\x0F"
  success: "\x0303✔\x03 A suspensión foi levantada de \x02%nickname%\x02."
  not_suspended: "\x0304✗\x03 O alcume \x02%nickname%\x02 non está suspendido."

# --- RENAME ----------------------------------------------------------------
rename:
  syntax: "RENAME <alcume>"
  short: "Forzar o renomeado dun alcume conectado a un alcume aleatorio."
  help: |-
    Obriga un alcume conectado a cambiar a un nome aleatorio cun prefixo definido
    pola rede.
  example: "%command_prefix%\x02\x0303RENAME Problematico\x03\x0F"
  cannot_rename_root: "\x0304✗\x03 Non se pode renomear o usuario root \x02%nickname%\x02."
  cannot_rename_oper: "\x0304✗\x03 Non se pode renomear o operador de IRC \x02%nickname%\x02."
  cannot_rename_service: "\x0304✗\x03 Non se pode renomear o alcume de servizo \x02%nickname%\x02."
  success: "\x0303✓\x03 O alcume \x02%nickname%\x02 foi renomeado a \x02%new_nick%\x02."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <alcume> [FORCE]"
  short: "Eliminar un alcume rexistrado."
  help: |-
    Marca un alcume rexistrado para eliminalo ao rematar o período de graza; pódese
    restaurar con RESTORE. Engade FORCE para eliminalo permanentemente. Non se poden
    eliminar persoas usuarias Root, IRCops e servizos, nin o teu propio alcume.
  force:
    short: "Elimina permanentemente un alcume pendente de eliminación."
  example: "%command_prefix%\x02\x0303DROP CuentaAntigua\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP CuentaAntigua FORCE\x03\x0F"
  suspended: "\x0304✗\x03 O alcume \x02%nickname%\x02 está suspendido. Reactíveo primeiro."
  forbidden: "\x0304✗\x03 O alcume \x02%nickname%\x02 está prohibido."
  cannot_drop_root: "\x0304✗\x03 Non se pode eliminar o usuario root \x02%nickname%\x02."
  cannot_drop_oper: "\x0304✗\x03 Non se pode eliminar o operador de IRC \x02%nickname%\x02."
  cannot_drop_self: "\x0304✗\x03 Non pode eliminar o seu propio alcume."
  success: "\x0303✓\x03 O alcume \x02%nickname%\x02 foi marcado para eliminación e pode ser restaurado durante o período de graza."
  force_success: "\x0303✓\x03 O alcume \x02%nickname%\x02 foi eliminado permanentemente."
  pending_deletion: "\x0304✗\x03 O alcume \x02%nickname%\x02 xa está pendente de eliminación. Use DROP <alcume> FORCE para eliminalo permanentemente."
  cannot_drop_service: "\x0304✗\x03 Non se pode eliminar o alcume de servizo \x02%nickname%\x02."

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <alcume>"
  short: "Restaurar un alcume pendente de eliminación."
  help: |-
    Restaura un alcume pendente de eliminación mentres siga dentro do período
    de graza.
  example: "%command_prefix%\x02\x0303RESTORE CuentaAntigua\x03\x0F"
  success: "\x0303✓\x03 O alcume \x02%nickname%\x02 foi restaurado."
  not_pending_deletion: "\x0304✗\x03 O alcume \x02%nickname%\x02 non está pendente de eliminación."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <alcume> <motivo>"
  short: "Bloquear permanentemente un alcume para que non se poida usar."
  help: |-
    Prohibe permanentemente un alcume para que ninguén poida rexistralo nin usalo.
    Se está rexistrado, elimínase; se está conectado, obrígaselle a cambiar a un
    alcume aleatorio. Non se poden prohibir persoas usuarias Root, IRCops nin
    servizos.
  example: "%command_prefix%\x02\x0303FORBID MalUsuario Infraccións reiteradas das normas\x03\x0F"
  success: "\x0303✔\x03 O alcume \x02%nickname%\x02 foi prohibido."
  updated: "\x0303✔\x03 O motivo de prohibición de \x02%nickname%\x02 foi actualizado."
  reason_required: "\x0304✗\x03 Debe proporcionar un motivo para a prohibición."
  cannot_forbid_root: "\x0304✗\x03 Non se pode prohibir o usuario root \x02%nickname%\x02."
  cannot_forbid_oper: "\x0304✗\x03 Non se pode prohibir o operador de IRC \x02%nickname%\x02."
  cannot_forbid_service: "\x0304✗\x03 Non se pode prohibir o alcume de servizo \x02%nickname%\x02."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <alcume>"
  short: "Eliminar unha prohibición de alcume."
  help: "Retira a prohibición para que o alcume poida volver usarse."
  example: "%command_prefix%\x02\x0303UNFORBID AlcumeProhibido\x03\x0F"
  success: "\x0303✔\x03 O alcume \x02%nickname%\x02 xa non está prohibido."
  not_forbidden: "\x0304✗\x03 O alcume \x02%nickname%\x02 non está prohibido."

# --- FORBIDVHOST -----------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD|DEL|LIST} [patrón]"
  short: "Xestionar os patróns de vhost prohibidos."
  help: |-
    Xestiona os patróns que impiden establecer vhosts coincidentes con SET VHOST.
    O comodín * coincide con calquera secuencia e ? cun carácter. Require
    privilexios
    de operador IRC.
  example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
  unknown_sub: "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL ou LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <patrón>"
    short: "Engadir un patrón de vhost prohibido."
    help: |-
      Engade un patrón á lista. As persoas usuarias non poderán establecer vhosts
      coincidentes mediante SET VHOST. * coincide con calquera secuencia e ? cun
      carácter.
    example: "%command_prefix%\x02\x0303FORBIDVHOST ADD *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Patrón de vhost prohibido engadido: \x02%pattern%\x02"
    already_exists: "\x0304✗\x03 O patrón \x02%pattern%\x02 xa existe."
    invalid: "\x0304✗\x03 Formato de patrón de vhost non válido."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <patrón>"
    short: "Eliminar un patrón de vhost prohibido."
    help: "Elimina un patrón da lista de vhosts prohibidos."
    example: "%command_prefix%\x02\x0303FORBIDVHOST DEL *.pirata.com\x03\x0F"
    done: "\x0303✓\x03 Patrón de vhost prohibido eliminado: \x02%pattern%\x02"
    not_found: "\x0304✗\x03 Patrón \x02%pattern%\x02 non atopado."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Listar todos os patróns de vhost prohibidos."
    syntax: "FORBIDVHOST LIST"
    help: "Amosa todos os patróns de vhost prohibidos."
    example: "%command_prefix%\x02\x0303FORBIDVHOST LIST\x03\x0F"
    header: "\x0307ℹ\x03 Patróns de vhost prohibidos (\x02%count%\x02):"
    entry: "  %index%. \x0304%pattern%\x03 — por %nickname% (%date%)"
    empty: "\x0307ℹ\x03 Non hai patróns de vhost prohibidos."

# --- HISTORY ---------------------------------------------------------------
history:
  syntax: "HISTORY <alcume> {ADD|DEL|VIEW|CLEAR}"
  short: "Ver ou xestionar o historial de accións do alcume."
  help: |-
    Consulta e xestiona o historial de accións dun alcume. Rexistra automaticamente
    suspensións, cambios de contrasinal ou correo e recuperacións. VIEW amosa tres
    entradas por páxina; ALL amosa o historial completo.
  example: "%command_prefix%\x02\x0303HISTORY Usuario VIEW\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303HISTORY Usuario VIEW ALL\x03\x0F"
    - "%command_prefix%\x02\x0303HISTORY Usuario ADD Nota manual\x03\x0F"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <alcume> ADD <mensaxe>"
    short: "Engadir unha entrada manual ao historial."
    help: "Engade unha entrada manual ao historial do alcume."
    example: "%command_prefix%\x02\x0303HISTORY Usuario ADD Denunciado por spam\x03\x0F"
    success: "\x0303✔\x03 Entrada do historial engadida para \x02%nickname%\x02."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <alcume> DEL <id>"
    short: "Eliminar unha entrada do historial polo ID."
    help: "Elimina unha entrada concreta do historial polo seu ID."
    example: "%command_prefix%\x02\x0303HISTORY Usuario DEL 42\x03\x0F"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <alcume> VIEW [PÁXINA|ALL]"
    short: "Ver o historial de accións do alcume."
    help: |-
      Amosa o historial de accións do alcume. Por defecto amosa tres entradas por
      páxina. Usa ALL para velas todas.
    example: "%command_prefix%\x02\x0303HISTORY Usuario VIEW\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303HISTORY Usuario VIEW 2\x03\x0F"
      - "%command_prefix%\x02\x0303HISTORY Usuario VIEW ALL\x03\x0F"
    header: "\x02Historial de \x0307%nickname%\x03\x02 (mostrando %start%-%end% de %total%):"
    entry: "#%id% [%date%] \x0303%action%\x03 por %operator% — %message%"
    no_entries: "\x0307ℹ\x03 Non se atoparon entradas do historial para \x02%nickname%\x02."
    page_hint: "Use \x0303HISTORY %nickname% VIEW %next_page%\x03 para máis entradas."

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <alcume> CLEAR"
    short: "Eliminar todas as entradas do historial dun alcume."
    help: "Elimina de forma irreversible todas as entradas do historial do alcume."
    example: "%command_prefix%\x02\x0303HISTORY Usuario CLEAR\x03\x0F"
    success: "\x0303✔\x03 Limpadas \x02%count%\x02 entradas do historial de \x02%nickname%\x02."
history.message:
  password_changed_owner: "Contrasinal cambiado polo propietario"
  password_changed_operator: "Contrasinal cambiado por un operador"
  email_changed_owner: "Correo electrónico cambiado de %old_email% a %new_email%"
  email_changed_operator: "Correo electrónico cambiado a %new_email% por un operador"
  recover: "Contrasinal restablecido mediante token por correo"
history.extra:
  old_email: "Correo-e anterior: %value%"
  new_email: "Novo correo-e: %value%"
  method: "Método: %value%"

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <alcume> {ON|OFF}"
  short: "Establecer ou eliminar a protección contra caducidade dun alcume."
  help: |-
    Controla se o alcume caduca por inactividade.
    ON evita a caducidade e OFF aplica as regras habituais.
  example: "%command_prefix%\x02\x0303NOEXPIRE Usuario ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE Usuario OFF\x03\x0F"
  success_on: "\x0303✔\x03 O alcume \x02%nickname%\x02 está agora protexido contra a caducidade."
  success_off: "\x0303✔\x03 O alcume \x02%nickname%\x02 caducará normalmente agora."
  forbidden: "\x0304✗\x03 O alcume \x02%nickname%\x02 está prohibido."
  suspended: "\x0304✗\x03 O alcume \x02%nickname%\x02 está suspendido."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <patrón> [páxina]"
  short: "Lista alcumes rexistrados que coinciden cun patrón."
  help: |-
    Lista os alcumes rexistrados que coinciden co patrón. O comodín * coincide con
    calquera secuencia de caracteres; a páxina opcional comeza en 1.
  example: "%command_prefix%\x02\x0303LIST Usuario*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST Usuario* 2\x03\x0F"
  header: "Alcume | Rexistro | Última conexión | IP | Estado"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Ningún alcume coincide co patrón %pattern%."
  status_pending: "Pendente"
  status_registered: "Rexistrado"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Administrar o modo de rexistro da rede."
  help: !irc |-
    Configura o modo de rexistro das novas contas.

    • \x02EMAIL:\x02 Envía o token de verificación ao correo electrónico da persoa usuaria.
    • \x02TOKEN:\x02 Entrega o token de verificación directamente por IRC.
    • \x02STATUS:\x02 Amosa o modo actual sen modificalo.

    Os rexistros pendentes manteñen o modo co que se iniciaron.

    No modo TOKEN, o comando RESEND permanece desactivado para todas as persoas
    usuarias.
  example: "%command_prefix%\x02\x0303REGMODE STATUS\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303REGMODE EMAIL\x03\x0F"
    - "%command_prefix%\x02\x0303REGMODE TOKEN\x03\x0F"
  status: "\x0307ℹ\x03 Modo de rexistro actual: \x02%mode%\x02."
  changed: "\x0303✔\x03 Modo de rexistro cambiado a \x02%mode%\x02."

# --- RESCUE ----------------------------------------------------------------
rescue:
  issued: !irc |-
    Token de rescate: \x0303%token%\x03

    Garda este token nun lugar seguro. Necesitaralo para recuperar o teu alcume se esqueces o contrasinal.

    Para confirmalo, utiliza: /msg %bot% \x0303VERIFY %token%\x03

    \x0304⚠\x03 IMPORTANTE: Só é válido o último token xerado. Unha vez confirmado, non volverá mostrarse. Non o compartas con ninguén.
  confirmed: "\x0303✔\x03 O token de rescate foi confirmado. Gárdao nun lugar seguro."
  unavailable: "\x0304✗\x03 Autentícate e confirma o token de rescate con \x0303VERIFY\x03 antes de usar esta operación."
  locked_out: "\x0304✗\x03 Demasiados tokens incorrectos. Téntao de novo en \x02%seconds%\x02 segundos."
  throttled: "\x0304✗\x03 Demasiados tokens incorrectos. Téntao de novo en \x02%minutes%\x02 minuto(s)."
  replaced: "\x0303✔\x03 O token de recuperación foi substituído polo token do correo que acabas de validar. Gárdao nun lugar seguro."
  optional_replacement: !irc |-
    \x0307→\x03 Novo token de recuperación opcional: \x0303%token%\x03

    Para substituír o teu token de recuperación actual, utiliza: /msg %bot% \x0303VERIFY %token%\x03

    O token actual segue sendo válido ata a confirmación.

    Se non queres cambialo, ignora esta mensaxe.
  replacement_unavailable: "\x0307ℹ\x03 O contrasinal restableceuse, pero non se puido emitir un token novo. O actual segue sendo válido."

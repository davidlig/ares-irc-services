# MemoServ-vertalingen — Nederlands
# Domein: memoserv
#
# IRC-opmaakcodes (dubbele aanhalingstekens of letterlijke !irc-blokken):
#   \x02        vet aan/uit
#   \x03NN      kleur (DECIMAAL: 03=groen, 04=rood, 07=oranje, 14=donkergrijs)
#   \x03        kleur herstellen
#   \x0F        alle opmaak herstellen
#
# IRC-kleuren gebruiken DECIMALE getallen (0-15), geen hexadecimale.
#   \x0314 = donkergrijs (14 decimaal): GOED
#   \x030F = kleur 0 gevolgd door de letter F: FOUT
#
# IRC-tekst over meerdere regels: !irc |- met echte regeleinden en spaties.
# Blokken zonder tag decoderen geen escapes; behoud letterlijke CTCP-waarden.
# HELP-voorbeelden: example/examples en %command_prefix%.
# De presentatielaag voegt /msg zonder kleur en een marge van twee spaties toe.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {bijnaam|#kanaal} <bericht>"
  short: "Stuur een bericht naar een bijnaam of kanaal."
  help: |-
    Stuurt een bericht naar een geregistreerde bijnaam of kanaal. De ontvanger moet
    de berichtendienst hebben ingeschakeld (ENABLE).
  example: "%command_prefix%SEND Anna Hoi, kun je het memo nakijken?"
  examples:
    - "%command_prefix%SEND #hulp Melding voor het kanaal"
  sent_nick: "Bericht verzonden naar %nickname%."
  sent_channel: "Bericht verzonden naar kanaal %channel%."
  throttled: "U moet %seconds% seconde(n) wachten voordat u een nieuw bericht verstuurt."
  limit_reached: "Berichtenlimiet bereikt voor %target%."
  ignored: "U kunt geen berichten sturen naar deze ontvanger, u staat op hun negeerlijst."
  cannot_send_to_self: "U kunt geen bericht naar uzelf sturen."
  message_too_long: "Bericht te lang. Maximum is %max% tekens."
  service_disabled_for_target: "Berichtenservice is uitgeschakeld voor %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#kanaal] <nummer>"
  short: "Lees een bericht op nummer."
  help: |-
    Leest het bericht met het opgegeven nummer. Zonder #kanaal wordt je
    bijnaam-inbox
    gebruikt. Met #kanaal is level MEMOREAD vereist.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #hulp 2"
  header: "Bericht #%index% van %from%:"
  footer: "%separator% %date%"
  not_found: "Bericht #%index% niet gevonden."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#kanaal]"
  short: "Toon berichten (ongelezen gemarkeerd met rode *)."
  help: |-
    Toont je berichten of die van het kanaal. Ongelezen berichten krijgen een rode
    ster en voorbeeldtekst (max. 50 tekens). Zonder #kanaal = je inbox; met #kanaal
    is MEMOREAD vereist.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #hulp"
  header: "Berichten voor %target%:"
  empty: "Geen berichten voor %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#kanaal] {nummer|ALL}"
  short: "Verwijder een bericht op nummer."
  help: |-
    Verwijdert een bericht op nummer of leegt de inbox met ALL. Voor kanalen is
    het toegangsniveau MEMOCHANGE vereist.
  example: "%command_prefix%DEL ALL"
  examples:
    - "%command_prefix%DEL 1"
    - "%command_prefix%DEL #hulp 2"
    - "%command_prefix%DEL #hulp ALL"
  deleted: "Bericht #%index% verwijderd."
  not_found: "Bericht #%index% niet gevonden."
  all_deleted: "Alle berichten in deze inbox zijn verwijderd."
  none_to_delete: "Er zijn geen berichten om te verwijderen."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#kanaal] <bijnaam>|DEL [#kanaal] <bijnaam>|LIST [#kanaal]}"
  short: "Beheer negeerlijst voor berichten."
  help: |-
    Beheert bijnamen waarvan je geen berichten wilt ontvangen, voor je account of
    een geregistreerd kanaal. Voor aanpassing van de kanaallijst is MEMOCHANGE
    vereist.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #hulp Ana"
    - "%command_prefix%IGNORE LIST #hulp"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#kanaal] <bijnaam>"
    short: "Voegt een bijnaam toe aan de negeerlijst."
    help: |-
      Berichten van deze bijnaam worden niet geaccepteerd voor uw inbox (of die van
      het kanaal).
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #hulp Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#kanaal] <bijnaam>"
    short: "Verwijdert een bijnaam uit de lijst."
    help: "Verwijdert de bijnaam uit de negeerlijst."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #hulp Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#kanaal]"
    short: "Toont genegeerde bijnamen."
    help: "Toont de lijst met bijnamen die u (of het kanaal) negeert voor berichten."
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #hulp"
  added: "%nickname% toegevoegd aan negeerlijst."
  removed: "%nickname% verwijderd uit negeerlijst."
  already_ignored: "%nickname% staat al op de negeerlijst."
  not_ignored: "%nickname% staat niet op de negeerlijst."
  limit_reached_nick: "Negeerlijst-limiet bereikt voor uw bijnaam (max %limit%)."
  limit_reached_channel: "Negeerlijst-limiet bereikt voor %channel% (max %limit%)."
  list_empty: "Negeerlijst is leeg."
  list_header: "Negeerlijst:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#kanaal]"
  short: "Schakel berichtenontvangst in."
  help: |-
    Schakelt berichtontvangst voor je bijnaam in. In kanalen kan alleen de
    oprichter dit inschakelen.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #hulp"
  enabled_nick: "Berichtenservice ingeschakeld voor uw bijnaam."
  enabled_channel: "Berichtenservice ingeschakeld voor kanaal %channel%."
  already_enabled_nick: "Berichtenservice is al ingeschakeld voor uw bijnaam."
  already_enabled_channel: "Berichtenservice is al ingeschakeld voor %channel%."
  founder_only: "Alleen de kanaaloprichter kan berichten inschakelen voor %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#kanaal]"
  short: "Schakel berichtenontvangst uit."
  help: |-
    Schakelt berichtontvangst voor je bijnaam of kanaal uit. In kanalen kan alleen
    de oprichter dit uitschakelen.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #hulp"
  disabled_nick: "Berichtenservice uitgeschakeld voor uw bijnaam."
  disabled_channel: "Berichtenservice uitgeschakeld voor kanaal %channel%."
  already_disabled_nick: "Berichtenservice is al uitgeschakeld voor uw bijnaam."
  already_disabled_channel: "Berichtenservice is al uitgeschakeld voor %channel%."
  founder_only: "Alleen de kanaaloprichter kan berichten uitschakelen voor %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [commando] [optie]"
  short: "Toon commando's of hulp voor een commando."
  help: "Toont de lijst met commando’s of uitgebreide hulp bij een commando of optie."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Hiermee kunnen geregistreerde gebruikers elkaar berichten sturen en meldingen
    aan kanalen sturen. Berichten worden bewaard om later te lezen, ook als de
    ontvanger niet verbonden is.
  general_header: "Beschikbare opdrachten:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opties:"
  examples_header: "Voorbeelden:"
  general_help_command: "HELP <opdracht>"
  option_help_command: "HELP %command% <optie>"
  general_footer: "Gebruik /msg %bot% %help_command% voor meer informatie."
  set_sub_footer: "Gebruik /msg %bot% %help_command% voor meer informatie."
  syntax_label: "Syntaxis: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Berichten"
    preferences: "Voorkeuren"
  ircop_header: "Beschikbare opdrachten voor IRC-operators:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_received: "Je hebt een nieuwe memo van %sender% ontvangen. Lees deze met /msg %bot% %list%"
  channel_received: "Er is een nieuwe memo van %sender% voor %channel%. Lees deze met /msg %bot% %list%"
  nick_pending: "Je hebt %count% ongelezen bericht(en). Toon de berichten: /msg %bot% %list%"
  channel_pending: "Kanaal %channel% heeft %count% ongelezen bericht(en). Bekijk berichten met /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "Je registratieaanvraag voor %channel% is goedgekeurd."
  rejected: "Je registratieaanvraag voor %channel% is afgewezen."
  reason: "Reden: %reason%"
  restriction: "Beschikbaar vanaf: %date%"

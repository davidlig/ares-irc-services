# Traducciones de NickServ — Español
# Dominio: nickserv
#
# Códigos de formato IRC (comillas dobles o bloques literales !irc):
#   \x02        activa/desactiva la negrita
#   \x03NN      color (DECIMAL: 03=verde, 04=rojo, 07=naranja, 14=gris oscuro)
#   \x03        restablece el color
#   \x0F        restablece todo el formato
#
# Los colores IRC usan números DECIMALES (0-15), no hexadecimales.
#   \x0314 = gris oscuro (14 decimal): CORRECTO
#   \x030F = color 0 seguido de la letra F: ERROR
#
# Texto IRC multilínea: !irc |- con saltos físicos y espacios reales.
# Los bloques sin etiqueta no decodifican escapes; conserva los literales CTCP.
# Ejemplos HELP: example/examples y %command_prefix%.
# El presentador añade /msg sin color y un margen de dos espacios.

# --- REGISTER ---------------------------------------------------------------
register:
  token_unavailable: !irc |-
    El registro está pendiente, pero no se pudo entregar su token.
    Espera a que caduque este registro antes de registrarte de nuevo.
  syntax: "REGISTER <contraseña> [email]"
  short: "Registra tu apodo en los servicios."
  help: |-
    Registra tu apodo. La red te indicará el token de verificación
    por el chat o por correo, según su configuración.
    Una vez validado, será tu token de recuperación permanente:
    Guárdalo en un lugar seguro.
    La caducidad de %duration% solo se aplica antes de validarlo.
    No se admiten dominios de correo bloqueados administrativamente.
  example: "%command_prefix%REGISTER Clave$egura_123"
  examples:
    - "%command_prefix%REGISTER Clave$egura_123 usuario@ejemplo.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Se ha enviado un token de verificación a %email%."
  pending_line_2: "Ejecuta /msg %bot% %verify% para completar el registro."
  pending_line_3: "¿No te llega? Revisa spam o usa /msg %bot% %resend%"
  pending_line_4: "El token expirará en %duration%."
  already_registered: "El apodo %nickname% ya está registrado."
  already_pending: "El registro de %nickname% está pendiente. Usa %verify%. Si el token se envió por correo y hay una dirección válida asociada, puedes solicitar otro con %resend%."
  forbidden: "El apodo %nickname% no puede ser registrado en esta red."
  pending_deletion: "El apodo %nickname% está pendiente de eliminación y no puede ser registrado."
  invalid_email: "La dirección de correo electrónico no es válida."
  email_already_used: "El correo %email% ya está en uso por otro apodo. Usa otra dirección."
  throttled: "Debes esperar %minutes% minuto(s) antes de intentar registrar de nuevo."
  guest_prefix_forbidden: "No puedes registrar un apodo que empiece por %prefix%."

# --- VERIFY -----------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Confirma un registro o token de rescate."
  help: |-
    Una vez validado, este token será tu token de recuperación permanente.
    Guárdalo en un lugar seguro: podrás utilizarlo para recuperar tu apodo.
    La caducidad de %duration% solo se aplica antes de validarlo.
  example: "%command_prefix%VERIFY <token_recibido>"
  success: "El apodo %nickname% ha sido registrado y ya estás identificado."
  success_native: "El apodo %nickname% ha sido registrado correctamente. Usa la autenticación nativa que se muestra a continuación."
  invalid_token: "El token de rescate no es válido."
  no_pending: "No tienes ningún registro pendiente de verificación."

# --- RESEND -----------------------------------------------------------------
resend:
  disabled: "No puedes solicitar otro token con %resend% porque este registro entrega el token directamente por el chat."
  syntax: "RESEND"
  short: "Reenvía el token de verificación a tu correo."
  help: |-
    RESEND solo está disponible si el token de verificación se envió por correo.
    Una vez validado, este token será tu token de recuperación permanente.
    Guárdalo en un lugar seguro: podrás utilizarlo para recuperar tu apodo.
    La caducidad de %duration% solo se aplica antes de validarlo.
    Al usar RESEND, recibirás un nuevo token por correo.
    El plazo del registro pendiente se renovará por %duration%.
  example: "%command_prefix%RESEND"
  success: "Token de verificación reenviado a %email%."
  no_pending: "No tienes ningún registro pendiente de verificación."
  throttled: "Debes esperar %minutes% minuto(s) antes de solicitar otro correo de verificación."

# --- RECOVER -----------------------------------------------------------------
recover:
  no_email: "No hay email configurado para el apodo %nickname%. La recuperación no está disponible."
  email_sent: "Se ha enviado un token de recuperación a %email_hint%. Revisa tu bandeja (y la de spam)."
  pending_deletion: "El apodo %nickname% está pendiente de eliminación y no puede recuperarse."
  instructions: "EMAIL: %command_0% solicita un token provisional por correo. TOKEN: proporciona tu token de recuperación confirmado. %command_1% acepta el token válido del correo o el confirmado. El del correo sustituye al guardado solo tras validarlo. Al usar el guardado se ofrece un reemplazo opcional con %command_2%; ignora ese mensaje si quieres conservar el actual."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <apodo> [token]"
  short: "Recupera tu apodo si has perdido la contraseña."
  help: |-
    Sin token, solicita por correo un token provisional.
    También puedes proporcionar un token de recuperación válido; si es
    provisional, sustituye al guardado solo después de validarlo.
    Al usar el token guardado se ofrece un reemplazo opcional
    con VERIFY; ignora ese mensaje si quieres conservar el actual.
  example: "%command_prefix%RECOVER Usuario"
  examples:
    - "%command_prefix%RECOVER Usuario <token_recibido>"
  pending: "El registro de %nickname% está pendiente. Usa %command_0%. Si el token se envió por correo y hay una dirección válida asociada, puedes solicitar otro con %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "El apodo %nickname% está suspendido. Razón: %reason%"
  forbidden: "El apodo %nickname% no puede usarse en esta red."
  throttled: "Demasiados tokens incorrectos. Inténtalo de nuevo en %minutes% minuto(s)."
  invalid_token: "El token de rescate no es válido."
  success_identify: "Contraseña restablecida. Identifícate ahora: %identify_cmd%"
  success_then_change: "Luego cambia tu contraseña: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <nueva_contraseña>"

# --- IDENTIFY ---------------------------------------------------------------
identify:
  syntax: "IDENTIFY <apodo> <contraseña>"
  short: "Acredita tu identidad como dueño de un apodo."
  help: |-
    Autentica tu sesión con %nickserv% indicando tu apodo y contraseña.
    Tras identificarte recibirás el modo registrado %emphasis_0% y, si estabas usando
    un apodo de invitado, recuperarás tu apodo registrado automáticamente.
  example: "%command_prefix%IDENTIFY Usuario <contraseña>"
  native_syntax: "/NICK <apodo>:<contraseña> | /NICK <apodo>!<contraseña>"
  native_short: "Muestra la sintaxis de autenticación nativa por cambio de apodo."
  native_help: |-
    Este protocolo autentica las cuentas mediante cambios de apodo.
    Usa %emphasis_0% o, si el apodo está ocupado, %emphasis_1%.
  native_example: "/NICK Usuario:<contraseña>"
  native_examples:
    - "%command_prefix%/NICK Usuario!<contraseña>"
  native_authentication: "Este protocolo gestiona la autenticación mediante cambios de apodo. Usa %command_0% o, si el apodo está ocupado, %command_1%."
  native_authentication_command_0: "/NICK <apodo>:<contraseña>"
  native_authentication_command_1: "/NICK <apodo>!<contraseña>"
  success: "Ahora estás identificado como %nickname%."
  already_identified: "Ya estás identificado como %nickname%."
  invalid_credentials: "Contraseña incorrecta. Inténtalo de nuevo."
  locked_out: "Demasiados intentos fallidos. Intenta de nuevo en %minutes% minuto(s)."
  ghost_released: "La sesión fantasma que ocupaba %nickname% ha sido desconectada."
  kill_reason: "Apodo %nickname% reclamado por %source% (el propietario registrado se ha identificado)"
  pending: |-
    %first%
    %second%
  pending_line_1: "El apodo %nickname% está pendiente de verificación de email."
  pending_line_2: "Ejecuta /msg %bot% %command_0% o /msg %bot% %command_1%"
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "El apodo %nickname% está suspendido. Razón: %reason%"
  forbidden: "El apodo %nickname% no puede ser utilizado en esta red."
  pending_deletion: "El apodo %nickname% está pendiente de eliminación y no puede ser usado."

# --- STATUS -----------------------------------------------------------------
status:
  syntax: "STATUS <apodo>"
  short: "Muestra el estado de registro de un apodo."
  help: |-
    Muestra el estado actual de un apodo: si está registrado,
    pendiente de verificación, suspendido, etc.
  example: "%command_prefix%STATUS Usuario"
  header: "Estado del apodo %nickname%"
  unregistered: "  Estado          : Sin registrar"
  not_registered_offline: "  Estado          : %state%"
  value_not_registered_offline: "No registrado"
  pending: "  Estado          : %state%"
  value_pending: "Pendiente de validación"
  pending_expires: "  Expira en       : %minutes% minuto(s)"
  pending_expires_at: "  Expira a las    : %date%"
  not_connected: "  Estado          : %state%"
  value_not_connected: "No conectado"
  not_identified: "  Estado          : %state%"
  value_not_identified: "No identificado"
  identified: "  Estado          : %state%"
  value_identified: "Identificado"
  suspended: "  Estado          : %state%"
  value_suspended: "Suspendido"
  suspended_reason: "  Razón           : %reason%"
  suspended_until: "  Fecha fin       : %date%"
  suspended_permanent: "  Fecha fin       : Permanente"
  forbidden: "  Estado          : %state%"
  value_forbidden: "Prohibido"
  forbidden_reason: "  Razón           : %reason%"
  pending_deletion: "  %label%          : %state%"
  value_pending_deletion: "Pendiente de eliminación"
  label_pending_deletion: "Estado"
  pending_deletion_at: "  %label%       : %date%"

  label_pending_deletion_at: "Eliminado"
# --- INFO -------------------------------------------------------------------
info:
  syntax: "INFO <apodo>"
  short: "Muestra la información de un apodo registrado."
  help: |-
    Muestra los datos de registro de un apodo: fecha de alta, estado de
    conexión, último mensaje de salida y correo electrónico.

    El correo solo es visible para el propietario identificado.
    Si el apodo es privado, solo su propietario y los Operadores IRC pueden
    ver la información.
  example: "%command_prefix%INFO Usuario"
  private: "La información del apodo %nickname% es privada."
  header: "Información del apodo %nickname%"
  status: "%label%                 : %status%"
  label_status: "Estado"
  status_registered: "Registrado"
  status_suspended: "Suspendido"
  status_forbidden: "Prohibido"
  status_pending_deletion: "Pendiente de eliminación"
  reason: "%label%                  : %reason%"
  label_reason: "Razón"
  suspended_until: "%label%              : %date%"
  label_suspended_until: "Fecha fin"
  suspended_permanent: "%label%              : Permanente"
  label_suspended_permanent: "Fecha fin"
  registered_at: "%label%         : %date%"
  label_registered_at: "Fecha registro"
  last_seen_online: "%label%        : %online%"
  label_last_seen_online: "Última conexión"
  value_last_seen_online: "CONECTADO AHORA"
  last_seen_at: "%label%        : %date%"
  label_last_seen_at: "Última conexión"
  last_seen_never: "%label%        : Nunca"
  label_last_seen_never: "Última conexión"
  last_quit: "%label%         : %message%"
  label_last_quit: "Último mensaje"
  last_connect: "%label%  : %ip% (%host%)"
  label_last_connect: "Última conexión desde"
  language: "%label%                 : %language%"
  label_language: "Idioma"
  email: "%label%                 : %email%"
  label_email: "Correo"
  vhost: "%label%                  : %vhost%"
  label_vhost: "VHost"
  no_expire: "%label%           : Sí"
  label_no_expire: "Nunca expira"
  pending_deletion_at: "%label%              : %date%"
  label_pending_deletion_at: "Eliminado"
  pending_deletion_until: "%label%       : %date%"
  label_pending_deletion_until: "Elim. definitiva"
  pending_deletion_notice: "%notice%"
  value_pending_deletion_notice: "Este apodo está pendiente de eliminación y no puede ser registrado."
  channels_header: |-

    Canales con acceso:
  channels_entry_founder: "%channel% (%role%)"
  channels_role_founder: "Fundador"
  channels_entry_successor: "%channel% (%role%)"
  channels_role_successor: "Sucesor"
  channels_entry_access: "%channel% (%level%)"

# --- SET --------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <nueva_contraseña>|EMAIL <email> <token>|LANGUAGE <código>|TIMEZONE <zona>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Cambiar opciones de tu apodo."
  help: |-
    Modifica la configuración de tu apodo. Debes estar identificado para cambiar
    estas opciones.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Opción desconocida %option%. Opciones disponibles: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <nueva_contraseña>"
    short: "Cambia la contraseña de tu apodo."
    help: |-
      Cambia la contraseña de acceso a tu apodo. La nueva contraseña entra en
      vigor de inmediato. Elige una contraseña segura de al menos 6 caracteres
      que no uses en otros servicios.
    example: "%command_prefix%SET PASSWORD Clave$egura_123"
    success: "Tu contraseña ha sido actualizada correctamente."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Usa %value% con tu token de rescate confirmado."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Cambia el correo electrónico usando tu token de rescate confirmado."
    help: |-
      SET EMAIL cambia el correo de contacto tras validar el token de rescate, sin
      consumirlo. Comprueba formato y unicidad; no envía correo de confirmación.
      No se admiten dominios de correo bloqueados administrativamente.
    example: "%command_prefix%SET EMAIL usuario@ejemplo.com <token_confirmado>"
    success: "Tu correo ha sido actualizado a %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Se ha enviado un token de confirmación a %current_email%."
    pending_line_2: "Para confirmar el cambio a %new_email% ejecuta:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "El token expira en 1 hora."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "El token no es válido o ha expirado. Solicita uno nuevo con %value%."
    invalid_token_value: "SET EMAIL <nuevo_email>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <código>"
    short: "Cambia el idioma en el que los servicios se comunican contigo."
    help: |-
      Cambia el idioma en el que %nickserv% y el resto de servicios se dirigen
      a ti. Idiomas disponibles:
      %emphasis_0% (catalán)
      %emphasis_1% (alemán)
      %emphasis_2% (griego)
      %emphasis_3% (inglés)
      %emphasis_4% (español)
      %emphasis_5% (euskera)
      %emphasis_6% (francés)
      %emphasis_7% (gallego)
      %emphasis_8% (italiano)
      %emphasis_9% (holandés)
      %emphasis_10% (polaco)
      %emphasis_11% (portugués)
      %emphasis_12% (rumano)
      %emphasis_13% (turco)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Idioma cambiado a %language%."
    invalid: "Idioma no soportado. Idiomas disponibles: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <zona>"
    short: "Establece la zona horaria para mostrar fechas."
    help: |-
      Establece la zona horaria con la que %nickserv% muestra las fechas. Consulta
      HELP SET TIMEZONE para ver las regiones. Usa OFF para quitarla.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Zona horaria establecida en %timezone%. Las fechas se mostrarán en esta zona."
    cleared: "Zona horaria quitada. Las fechas usarán la predeterminada de la red."
    invalid: "Zona horaria no válida %timezone%. Usa un identificador válido (ej. UTC, Europe/Madrid)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Muestra o oculta la información de tu apodo."
    help: |-
      Controla la visibilidad de tu información en el comando INFO.
      Con %emphasis_0% solo tú y los Operadores IRC podrán ver tus datos.
      Con %emphasis_1% la información es pública para todos.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "La información de tu apodo es ahora %value%."
    on_value: "privada"
    off: "La información de tu apodo es ahora %value%."
    off_value: "pública"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Cambia la forma en que los servicios se comunican contigo."
    help: |-
      Controla cómo %nickserv% y el resto de servicios te envían mensajes.
      Con %emphasis_0% las respuestas se envían como %emphasis_1%.
      Con %emphasis_2% las respuestas se envían como %emphasis_3%.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Los mensajes de los servicios se enviarán ahora como %value%."
    on_value: "PRIVMSG"
    off: "Los mensajes de los servicios se enviarán ahora como %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Establece o quita tu host virtual."
    help: |-
      Establece un hostname personalizado que otros usuarios verán cuando
      estés identificado.

      Para quitarlo, ejecuta %emphasis_0% sin indicar un valor.

      Solo se permiten letras (a-z, A-Z), dígitos, guiones y puntos.
      Cada bloque debe empezar y terminar con una letra o un dígito.
      El hostname puede tener hasta 48 caracteres y debe ser único por apodo.
    example: "%command_prefix%SET VHOST usuario.ejemplo.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Tu host virtual se ha establecido a %vhost%."
    cleared: "Tu host virtual ha sido eliminado."
    invalid: "Vhost no válido. Solo letras, dígitos, guión y punto (no al inicio/fin de bloque); máx. 48 caracteres."
    taken: "Ese vhost ya está en uso por otro apodo."
    forced: "Tu vhost está configurado automáticamente y no puede cambiarse con SET VHOST."

# --- SAREGISTER ------------------------------------------------------------
saregister:
  syntax: "SAREGISTER <apodo> <contraseña> [email]"
  short: "Registrar administrativamente un apodo."
  help: |-
    Sintaxis: SAREGISTER <apodo> <contraseña> [email]

    Registra administrativamente un apodo de forma inmediata sin requerir
    verificación del cliente ni límites de frecuencia.

    En modo TOKEN, el código de rescate se muestra una vez al operador.
    En modo EMAIL, el código de rescate se envía a la dirección de correo indicada.
  example: "%command_prefix%SAREGISTER Alice Contraseña123"
  examples:
    - "%command_prefix%SAREGISTER Bob Contraseña456 bob@ejemplo.com"
  success_token: "El apodo %nickname% ha sido registrado. Código de rescate: %token%"
  success_email: "El apodo %nickname% ha sido registrado. Código de rescate enviado a %email%."
  invalid_nickname: "Apodo no válido %nickname%."

# --- SASET (IRCop) --------------------------------------------------------------
saset:
  syntax: "SASET <apodo> {PASSWORD <nueva_contraseña>|EMAIL <nuevo_email>|LANGUAGE <código>|TIMEZONE {<zona>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Modifica la configuración de otro apodo."
  help: |-
    Permite a un IRCop cambiar la configuración de otro apodo registrado. No
    admite apodos de Root, IRCop ni servicios.
  example: "%command_prefix%SASET Usuario PRIVATE ON"
  examples:
    - "%command_prefix%SASET Usuario TIMEZONE OFF"
  unknown_option: "Opción desconocida %option%. Opciones disponibles: %options%."
  cannot_modify_oper: "No puedes modificar un apodo de Operador IRC."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <apodo> PASSWORD <nueva_contraseña>"
    short: "Cambia la contraseña de un apodo."
    help: "Cambia la contraseña de otro apodo. El cambio es inmediato."
    example: "%command_prefix%SASET Usuario PASSWORD ClaveSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <apodo> EMAIL <nuevo_email>"
    short: "Cambia el correo de un apodo."
    help: |-
      Cambia el correo electrónico de otro apodo. El cambio es inmediato y no
      requiere el token de rescate ni envía un correo de confirmación.
      BADMAIL no restringe este cambio administrativo de correo.
    example: "%command_prefix%SASET Usuario EMAIL usuario@ejemplo.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <apodo> LANGUAGE <código>"
    short: "Cambia el idioma de un apodo."
    help: |-
      Cambia el idioma de otro apodo. En este comando están disponibles en (inglés)
      y es (español).
    example: "%command_prefix%SASET Usuario LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <apodo> TIMEZONE {<zona>|OFF}"
    short: "Cambia la zona horaria de un apodo."
    help: "Establece o quita la zona horaria de otro apodo. Usa OFF para quitarla."
    example: "%command_prefix%SASET Usuario TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Usuario TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <apodo> PRIVATE {ON|OFF}"
    short: "Cambia la privacidad de un apodo."
    help: "Activa o desactiva la privacidad de la información de otro apodo."
    example: "%command_prefix%SASET Usuario PRIVATE ON"
    examples:
      - "%command_prefix%SASET Usuario PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <apodo> MSG {ON|OFF}"
    short: "Cambia la preferencia de mensajes de un apodo."
    help: "Establece si otro apodo recibe respuestas como PRIVMSG (ON) o NOTICE (OFF)."
    example: "%command_prefix%SASET Usuario MSG ON"
    examples:
      - "%command_prefix%SASET Usuario MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <apodo> VHOST [vhost]"
    short: "Cambia el host virtual de un apodo."
    help: |-
      Establece o quita el host virtual de otro apodo. Ejecuta SASET <apodo> VHOST
      sin valor para quitarlo.
    example: "%command_prefix%SASET Usuario VHOST usuario.ejemplo.org"
    examples:
      - "%command_prefix%SASET Usuario VHOST"

# --- HELP -------------------------------------------------------------------
help:
  syntax: "HELP [comando]"
  short: "Muestra la ayuda de los comandos de %nickserv%."
  help: |-
    Muestra la ayuda general de %nickserv% o la información detallada
    de un comando concreto.
  examples_header: "Ejemplos:"
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP SET"
    - "%command_prefix%HELP SET EMAIL"
    - "%command_prefix%HELP SET TIMEZONE Europe"
  header_title: "%bot%"
  header: "%title%"
  navigation_marker: ""
  info_marker: ""
  error_marker: ""
  warning_marker: ""
  intro: |-
    Permite registrar y proteger tu apodo para evitar que otros usuarios lo
    utilicen. Gestiona la seguridad de tu cuenta, personaliza tus preferencias y
    recupera el acceso cuando lo necesites.
  intro_expiration: "%label%: Los nicks que no se utilicen durante más de %duration% se eliminarán automáticamente."
  intro_expiration_duration: "%days% días"
  intro_expiration_label: "NOTA"
  general_header: "Comandos disponibles:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opciones:"
  general_syntax: "HELP <comando>"
  general_footer: "Usa /msg %bot% %syntax% para más información."
  set_sub_syntax: "HELP %command% <opción>"
  set_sub_footer: "Usa /msg %bot% %syntax% para más información."
  syntax_label: "Sintaxis: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    registration_auth: "Registro y autenticación"
    account_security: "Cuenta y seguridad"
  ircop_group:
    lookup: "Consulta e investigación"
    account_management: "Gestión de cuentas"
    suspensions_bans: "Suspensiones y prohibiciones"
    deletion: "Eliminación y restauración"
  ircop_header: "Comandos disponibles para IRCops:"

  set_timezone:
    index_label: "Zonas por región (usa %syntax% para consultar una región):"
    index_syntax: "HELP SET TIMEZONE <región>"
    region_header: "Zonas horarias para %region%:"
    region_unknown: "Región desconocida. Usa %syntax% para ver el índice."
    region_syntax: "HELP SET TIMEZONE"

# --- Nick Protection --------------------------------------------------------
protection:
  nick_in_use: "El apodo %nickname% está registrado. Serás renombrado si no te identificas."
  renamed_to: |-
    Has sido renombrado a %guest_nick%. Para recuperar tu apodo:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <contraseña>"
  nick_forbidden: "El apodo %nickname% está prohibido: %reason%"

# --- IRCop Commands ---------------------------------------------------------
# --- USERIP ----------------------------------------------------------------
userip:
  syntax: "USERIP <apodo>"
  short: "Obtiene la dirección IP/Host real del apodo."
  help: |-
    Muestra la IP y el hostname reales de un apodo.
    Úsalo con responsabilidad: es información sensible.
  example: "%command_prefix%USERIP Usuario"
  result: "Apodo: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP -----------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Busca apodos por la IP de su última conexión identificada."
  help: |-
    Muestra los apodos registrados cuya última conexión identificada
    utilizó esta dirección IP. La dirección guardada puede estar desactualizada.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "No hay apodos registrados que coincidan con esta dirección IP."
  header: "Apodos coincidentes:"

# --- SUSPEND (IRCop) ---------------------------------------------------------
suspend:
  syntax: "SUSPEND <apodo> <duración> <razón>"
  short: "Suspende un apodo."
  help: |-
    Impide que el propietario se identifique. La duración puede expresarse en días
    (d), horas (h), minutos (m) o 0 para una suspensión permanente. No se puede
    suspender a operadores IRC ni a usuarios Root.
  example: "%command_prefix%SUSPEND MalUsuario 7d Spam en #ayuda"
  examples:
    - "%command_prefix%SUSPEND Problematico 0 Evasión de prohibición"
  success: "El apodo %nickname% ha sido suspendido hasta %duration%."
  already_suspended: "El apodo %nickname% ya está suspendido."
  forbidden: "El apodo %nickname% está prohibido y no puede suspenderse."
  cannot_suspend_oper: "No se puede suspender al operador IRC %nickname%."
  cannot_suspend_root: "No se puede suspender al usuario root %nickname%."
  cannot_suspend_service: "No se puede suspender el apodo de servicio %nickname%."
  invalid_duration: "Duración inválida. Usa: %duration_format% (ej: 7d, 12h, 30m) o %permanent% para permanente."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND (IRCop) -------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <apodo>"
  short: "Quita la suspensión de un apodo."
  help: |-
    Quita una suspensión activa para que el propietario pueda volver a
    identificarse.
  example: "%command_prefix%UNSUSPEND Usuario"
  success: "Se ha levantado la suspensión de %nickname%."
  not_suspended: "El apodo %nickname% no está suspendido."

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax: "RENAME <apodo>"
  short: "Fuerza el cambio de apodo de un apodo conectado a uno aleatorio."
  help: |-
    Fuerza a un apodo conectado a cambiar a un nombre aleatorio con un
    prefijo definido por la red.
  example: "%command_prefix%RENAME Problematico"
  cannot_rename_root: "No se puede renombrar al usuario root %nickname%."
  cannot_rename_oper: "No se puede renombrar al IRC operator %nickname%."
  cannot_rename_service: "No se puede renombrar el apodo de servicio %nickname%."
  success: "El apodo %nickname% ha sido nombrado a %new_nick%."

# --- DROP (IRCop) --------------------------------------------------------------
drop:
  syntax: "DROP <apodo> [FORCE]"
  short: "Elimina un apodo registrado."
  help: |-
    Marca un apodo registrado para eliminarlo durante el periodo de gracia; puede
    restaurarse con RESTORE. Añade FORCE para eliminarlo permanentemente. Los
    usuarios Root, IRCops y servicios, así como tu propio apodo, no se pueden
    eliminar.
  force:
    short: "Elimina permanentemente un apodo pendiente de eliminación."
  example: "%command_prefix%DROP CuentaAntigua"
  examples:
    - "%command_prefix%DROP CuentaAntigua FORCE"
  suspended: "El apodo %nickname% está suspendido. Desuspende primero."
  forbidden: "El apodo %nickname% está prohibido."
  cannot_drop_root: "No se puede eliminar al usuario root %nickname%."
  cannot_drop_oper: "No se puede eliminar al IRC operator %nickname%."
  cannot_drop_self: "No puedes eliminar tu propio apodo."
  success: "El apodo %nickname% ha sido marcado para eliminación y puede ser restaurado durante el periodo de gracia."
  force_success: "El apodo %nickname% ha sido eliminado permanentemente."
  pending_deletion: "El apodo %nickname% ya está pendiente de eliminación. Usa DROP <apodo> FORCE para eliminarlo permanentemente."
  cannot_drop_service: "No se puede eliminar el apodo de servicio %nickname%."

# --- RESTORE (IRCop) -----------------------------------------------------------
restore:
  syntax: "RESTORE <apodo>"
  short: "Restaurar un apodo pendiente de eliminación."
  help: |-
    Restaura un apodo pendiente de eliminación mientras siga dentro del periodo de
    gracia.
  example: "%command_prefix%RESTORE CuentaAntigua"
  success: "El apodo %nickname% ha sido restaurado."
  not_pending_deletion: "El apodo %nickname% no está pendiente de eliminación."

# --- FORBID (IRCop) --------------------------------------------------------------
forbid:
  syntax: "FORBID <apodo> <razón>"
  short: "Prohíbe permanentemente el uso de un apodo."
  help: |-
    Prohíbe permanentemente un apodo para que nadie pueda registrarlo ni usarlo.
    Si está registrado se elimina; si está conectado, se le fuerza a cambiar a un
    apodo aleatorio. No se puede prohibir a usuarios Root, IRCops ni servicios.
  example: "%command_prefix%FORBID MalUsuario Violaciones repetidas de política"
  success: "El apodo %nickname% ha sido prohibido."
  updated: "Se ha actualizado la razón de prohibición para %nickname%."
  reason_required: "Debes proporcionar una razón para la prohibición."
  cannot_forbid_root: "No se puede prohibir al usuario root %nickname%."
  cannot_forbid_oper: "No se puede prohibir al IRC operator %nickname%."
  cannot_forbid_service: "No se puede prohibir el apodo de servicio %nickname%."

# --- UNFORBID (IRCop) ------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <apodo>"
  short: "Elimina la prohibición de un apodo."
  help: "Elimina la prohibición para que el apodo pueda volver a usarse."
  example: "%command_prefix%UNFORBID ApodoProhibido"
  success: "El apodo %nickname% ya no está prohibido."
  not_forbidden: "El apodo %nickname% no está prohibido."

# --- FORBIDVHOST (IRCop) ---------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <patrón>|DEL <patrón>|LIST}"
  short: "Gestiona vhosts prohibidos."
  help: |-
    Gestiona los patrones que impiden establecer vhosts coincidentes con SET
    VHOST. El comodín * coincide con cualquier secuencia y ? con un carácter.
    Requiere privilegios de Operador de IRC.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"

  unknown_sub: "Subcomando desconocido %sub%. Usa ADD, DEL o LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <patrón>"
    short: "Agregar un patrón de vhost prohibido."
    help: |-
      Agrega un patrón a la lista. Los usuarios no podrán establecer vhosts
      coincidentes mediante SET VHOST. * coincide con cualquier secuencia y ? con un
      carácter.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Patrón de vhost prohibido agregado: %pattern%"
    already_exists: "El patrón %pattern% ya existe."
    invalid: "Formato de patrón de vhost inválido."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <patrón>"
    short: "Eliminar un patrón de vhost prohibido."
    help: "Elimina un patrón de la lista de vhosts prohibidos."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Patrón de vhost prohibido eliminado: %pattern%"
    not_found: "Patrón %pattern% no encontrado."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Listar todos los patrones de vhost prohibidos."
    syntax: "FORBIDVHOST LIST"
    help: "Muestra todos los patrones de vhost prohibidos."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Patrones de vhost prohibidos (%count%):"
    entry: "%index%. %pattern% — por %nickname% (%date%)"
    empty: "No hay patrones de vhost prohibidos."

# --- HISTORY ---
history:
  syntax: "HISTORY <apodo> {ADD <mensaje>|DEL <id>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Ver o gestionar el historial de acciones de un apodo."
  help: |-
    Consulta y gestiona el historial de acciones de un apodo. Registra
    automáticamente suspensiones, cambios de contraseña o correo y recuperaciones.
    VIEW muestra tres entradas por página; ALL muestra el historial completo.
  example: "%command_prefix%HISTORY Usuario VIEW"
  examples:
    - "%command_prefix%HISTORY Usuario VIEW ALL"
    - "%command_prefix%HISTORY Usuario ADD Nota manual"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <apodo> ADD <mensaje>"
    short: "Añadir una entrada manual al historial."
    help: "Añade una entrada manual al historial del apodo."
    example: "%command_prefix%HISTORY Usuario ADD Reportado por spam"
    success: "Entrada de historial añadida para %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <apodo> DEL <id>"
    short: "Eliminar una entrada del historial por ID."
    help: "Elimina una entrada específica del historial por su ID."
    example: "%command_prefix%HISTORY Usuario DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <apodo> VIEW [PÁGINA|ALL]"
    short: "Ver historial de acciones del apodo."
    help: |-
      Muestra el historial de acciones del apodo. Por defecto muestra tres entradas
      por página. Usa ALL para verlas todas.
    example: "%command_prefix%HISTORY Usuario VIEW"
    examples:
      - "%command_prefix%HISTORY Usuario VIEW 2"
      - "%command_prefix%HISTORY Usuario VIEW ALL"
    header: "%heading% (mostrando %start%-%end% de %total%):"
    header_title: "Historial de %nickname%"
    entry: "#%id% [%date%] %action% por %operator% — %message%"
    no_entries: "No hay entradas de historial para %nickname%."
    page_hint: "Usa %command% para más entradas."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <apodo> CLEAR"
    short: "Eliminar todo el historial de un apodo."
    help: "Elimina de forma irreversible todas las entradas de historial del apodo."
    example: "%command_prefix%HISTORY Usuario CLEAR"
    success: "Eliminadas %count% entradas de historial para %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Cuenta activada"
  resend: "Correo de verificación reenviado"
  noexpire_on: "Protección de expiración activada"
  noexpire_off: "Protección de expiración desactivada"
  userip: "Consulta USERIP"
  history_clear: "Historial borrado"
  password_changed_owner: "Contraseña cambiada por el propietario"
  password_changed_operator: "Contraseña cambiada por un operador"
  email_changed_owner: "Email cambiado de %old_email% a %new_email%"
  email_changed_operator: "Email cambiado a %new_email% por un operador"
  recover: "Contraseña restablecida vía token de email"
  saregister: "Cuenta registrada administrativamente"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Email anterior: %value%"
  new_email: "Email nuevo: %value%"
  method: "Método: %value%"

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <apodo> {ON|OFF}"
  short: "Activa o desactiva la protección de expiración para un apodo."
  help: |-
    Controla si el apodo expira por inactividad.
    ON evita la expiración y OFF aplica las reglas normales.
  example: "%command_prefix%NOEXPIRE Usuario ON"
  examples:
    - "%command_prefix%NOEXPIRE Usuario OFF"
  success_on: "El apodo %nickname% está ahora protegido contra expiración."
  success_off: "El apodo %nickname% expirará normalmente."
  forbidden: "El apodo %nickname% está prohibido."
  suspended: "El apodo %nickname% está suspendido."

# --- LIST (IRCOP) ------------------------------------------------------------
list:
  syntax: "LIST <patrón> [página]"
  short: "Lista apodos registrados que coinciden con un patrón."
  help: |-
    Lista los apodos registrados que coinciden con el patrón. El comodín *
    coincide con cualquier secuencia de caracteres; la página opcional empieza en 1.
  example: "%command_prefix%LIST Usuario*"
  examples:
    - "%command_prefix%LIST Usuario* 2"
  header: "Apodo | Registro | Última conexión | IP | Estado"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Ningún apodo coincide con el patrón %pattern%."
  status_pending: "Pendiente"
  status_registered: "Registrado"
# --- DEBUG -------------------------------------------------------------------

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Administrar el modo de registro de la red."
  help: |-
    Configura el modo de registro para las nuevas cuentas.

    %emphasis_0% Envía el token de verificación al correo electrónico del usuario.
    %emphasis_1% Entrega el token de verificación directamente por IRC.
    %emphasis_2% Muestra el modo de registro actual sin modificarlo.

    Los registros pendientes mantienen el modo con el que se iniciaron.

    En modo TOKEN, el comando RESEND permanece
    deshabilitado para todos los usuarios.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Modo de registro actual: %mode%."
  changed: "Modo de registro cambiado a %mode%."

# --- Unified rescue credential -----------------------------------------------
rescue:
  issued: |-
    Token de rescate: %token_display%

    Guarda este token en un lugar seguro. Lo necesitarás para recuperar tu apodo si olvidas tu contraseña.

    Para confirmarlo, utiliza: /msg %bot% %verify%

    %warning%
  issued_warning: "IMPORTANTE: Solo el último token generado es válido. Una vez confirmado, no volverá a mostrarse. No lo compartas con nadie."
  confirmed: "Tu token de rescate ha sido confirmado. Guárdalo en un lugar seguro."
  unavailable: "Autentícate y confirma tu token de rescate con %command_0% antes de usar esta operación."
  unavailable_command_0: "VERIFY"
  locked_out: "Demasiados tokens incorrectos. Inténtalo de nuevo en %seconds% segundos."
  throttled: "Demasiados tokens incorrectos. Inténtalo de nuevo en %minutes% minuto(s)."
  replaced: "Tu token de recuperación ha sido sustituido por el token del correo que acabas de validar. Guárdalo en un lugar seguro."

  optional_replacement: |-
    Nuevo token de recuperación opcional: %token_display%

    Para sustituir tu token de recuperación actual, utiliza: /msg %bot% %verify%

    El token actual sigue siendo válido hasta la confirmación.

    Si no quieres cambiarlo, ignora este mensaje.
  replacement_unavailable: "Tu contraseña se ha restablecido, pero no se pudo emitir un token nuevo. Tu token de recuperación actual sigue siendo válido."
  temporarily_unavailable: "La entrega del token de recuperación no está disponible temporalmente. Inténtalo más tarde."


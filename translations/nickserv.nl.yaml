    Het e-mailadres is alleen zichtbaar voor de geïdentificeerde eigenaar.
    Bij een privébijnaam zien alleen de eigenaar en IRC-operators de informatie.
  example: "%command_prefix%INFO Gebruiker"
  private: "Informatie van bijnaam %nickname% is privé."

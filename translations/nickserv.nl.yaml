# --- NICK PROTECTION ----------------------------------------------------------
protection:
  nick_in_use: "Bijnaam %nickname% is geregistreerd. U wordt hernoemd als u zich niet identificeert."
  renamed_to: |-
    U bent hernoemd naar %guest_nick%. Om uw bijnaam te herstellen:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <wachtwoord>"
  nick_forbidden: "Bijnaam %nickname% is verboden: %reason%"

# --- USERIP (IRCop) -----------------------------------------------------------
userip:
  syntax: "USERIP <bijnaam>"
  short: "Verkrijg het echte IP-adres en de hostnaam van de bijnaam."
  help: |-
    Toont het echte IP-adres en de hostnaam van een bijnaam.
    Gebruik deze gevoelige informatie verantwoord.
  example: "%command_prefix%USERIP Gebruiker"
  result: "Bijnaam: %nickname% | IP: %ip% | Host: %host%"

# --- WHOIP (IRCop) ------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Zoekt nicknames op basis van het IP-adres van hun laatste geïdentificeerde verbinding."
  help: |-
    Toont geregistreerde bijnamen waarvan de laatste geïdentificeerde verbinding
    dit IP-adres gebruikte. Het opgeslagen adres kan verouderd zijn.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Geen geregistreerde nicknames komen overeen met dit IP-adres."
  header: "Overeenkomende nicknames:"

# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <patroon> [pagina]"
  short: "Toont geregistreerde bijnamen die overeenkomen met een patroon."
  help: |-
    Toont geregistreerde bijnamen die overeenkomen met het patroon. * staat voor
    eender welke tekenreeks; de optionele pagina begint bij 1.
  example: "%command_prefix%LIST Gebruiker*"
  examples:
    - "%command_prefix%LIST Gebruiker* 2"
  header: "Bijnaam | Registratie | Laatste verbinding | IP | Status"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Geen bijnamen komen overeen met patroon %pattern%."
  status_pending: "In afwachting"
  status_registered: "Geregistreerd"

# --- HISTORY ---
history:
  syntax: "HISTORY <bijnaam> <optie> [parameters]"
  short: "Bekijk of beheer bijnaamactiegeschiedenis."
  help: |-
    Raadpleegt en beheert de actgeschiedenis van een bijnaam. Opschortingen en
    wijzigingen van wachtwoord, e-mail of herstel worden automatisch vastgelegd.
    VIEW toont drie vermeldingen per pagina; ALL toont de volledige geschiedenis.
  example: "%command_prefix%HISTORY Gebruiker VIEW"
  examples:
    - "%command_prefix%HISTORY Gebruiker VIEW ALL"
    - "%command_prefix%HISTORY Gebruiker ADD Handmatige notitie"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <bijnaam> ADD <bericht>"
    short: "Voeg een handmatige geschiedenisvermelding toe."
    help: "Voegt handmatig een vermelding toe aan de bijnaamgeschiedenis."
    example: "%command_prefix%HISTORY Gebruiker ADD Gemeld wegens spam"
    success: "Geschiedenisvermelding toegevoegd voor %nickname%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <bijnaam> DEL <id>"
    short: "Verwijder een geschiedenisvermelding op ID."
    help: "Verwijdert een specifieke geschiedenisvermelding op basis van ID."
    example: "%command_prefix%HISTORY Gebruiker DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <bijnaam> VIEW [PAGINA|ALL]"
    short: "Bekijk bijnaamactiegeschiedenis."
    help: |-
      Toont de actgeschiedenis van een bijnaam. Standaard drie vermeldingen per
      pagina.
      Gebruik ALL om alles te tonen.
    example: "%command_prefix%HISTORY Gebruiker VIEW"
    examples:
      - "%command_prefix%HISTORY Gebruiker VIEW 2"
      - "%command_prefix%HISTORY Gebruiker VIEW ALL"
    header: "%heading% (toont %start%-%end% van %total%):"
    header_title: "Geschiedenis voor %nickname%"
    entry: "#%id% [%date%] %action% door %operator% — %message%"
    no_entries: "Geen geschiedenisvermeldingen gevonden voor %nickname%."
    page_hint: "Gebruik %command% voor meer vermeldingen."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <bijnaam> CLEAR"
    short: "Verwijder alle geschiedenisvermeldingen voor een bijnaam."
    help: "Verwijdert alle vermeldingen in de bijnaamgeschiedenis onherroepelijk."
    example: "%command_prefix%HISTORY Gebruiker CLEAR"
    success: "%count% geschiedenisvermeldingen gewist voor %nickname%."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Account geactiveerd"
  resend: "Verificatiemail opnieuw verzonden"
  noexpire_on: "Vervalbeveiliging ingeschakeld"
  noexpire_off: "Vervalbeveiliging uitgeschakeld"
  userip: "USERIP-raadpleging"
  history_clear: "Geschiedenis gewist"
  password_changed_owner: "Wachtwoord gewijzigd door eigenaar"
  password_changed_operator: "Wachtwoord gewijzigd door operator"
  email_changed_owner: "E-mail gewijzigd van %old_email% naar %new_email%"
  email_changed_operator: "E-mail gewijzigd naar %new_email% door operator"
  recover: "Wachtwoord gereset via e-mailtoken"
  saregister: "Account administratief geregistreerd"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Oude e-mail: %value%"
  new_email: "Nieuwe e-mail: %value%"
  method: "Methode: %value%"

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <bijnaam> <wachtwoord> [email]"
  short: "Een bijnaam administratief registreren."
  help: |-
    Syntaxis: SAREGISTER <bijnaam> <wachtwoord> [email]

    Registreert een bijnaam onmiddellijk administratief zonder dat
    clientverificatie of frequentielimieten vereist zijn.

    In TOKEN-modus wordt het hersteltoken eenmalig aan de beheerder getoond.
    In EMAIL-modus wordt het hersteltoken naar het opgegeven e-mailadres verzonden.
  example: "%command_prefix%SAREGISTER Alice Wachtwoord123"
  examples:
    - "%command_prefix%SAREGISTER Bob Wachtwoord456 bob@voorbeeld.nl"
  success_token: "Bijnaam %nickname% is geregistreerd. Hersteltoken: %token%"
  success_email: "Bijnaam %nickname% is geregistreerd. Hersteltoken verzonden naar %email%."
  invalid_nickname: "Ongeldige bijnaam %nickname%."

# --- SASET (IRCop) ------------------------------------------------------------
saset:
  syntax: "SASET <bijnaam> <optie> [parameters]"
  short: "Instellingen van een andere bijnaam wijzigen."
  help: |-
    Hiermee kan een IRC-operator instellingen van een andere geregistreerde bijnaam
    wijzigen. Root-, IRC-operator- en servicebijnamen zijn uitgesloten.
  example: "%command_prefix%SASET Gebruiker PRIVATE ON"
  examples:
    - "%command_prefix%SASET Gebruiker TIMEZONE OFF"
  unknown_option: "Onbekende optie %option%. Beschikbare opties: %options%."
  cannot_modify_oper: "Kan de bijnaam van een IRC-operator niet wijzigen."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <bijnaam> PASSWORD <nieuw_wachtwoord>"
    short: "Wachtwoord van een bijnaam wijzigen."
    help: "Wijzigt het wachtwoord van een andere bijnaam onmiddellijk."
    example: "%command_prefix%SASET Gebruiker PASSWORD ClaveSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <bijnaam> EMAIL <nieuwe_e-mail>"
    short: "E-mail van een bijnaam wijzigen."
    help: |-
      Wijzigt het e-mailadres van een andere bijnaam direct. Het herstel-token is niet
      nodig en er wordt geen bevestigingsmail verstuurd.
      BADMAIL beperkt deze administratieve e-mailwijziging niet.
    example: "%command_prefix%SASET Gebruiker EMAIL gebruiker@voorbeeld.nl"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <bijnaam> LANGUAGE <code>"
    short: "Taal van een bijnaam wijzigen."
    help: |-
      Wijzigt de taal van een andere bijnaam. Beschikbaar zijn en (Engels) en es
      (Spaans).
    example: "%command_prefix%SASET Gebruiker LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <bijnaam> TIMEZONE {<tijdzone>|OFF}"
    short: "Tijdzone van een bijnaam wijzigen."
    help: |-
      Stelt de tijdzone van een andere bijnaam in of verwijdert deze. Gebruik OFF om
      te verwijderen.
    example: "%command_prefix%SASET Gebruiker TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Gebruiker TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <bijnaam> PRIVATE {ON|OFF}"
    short: "Privacy van een bijnaam wijzigen."
    help: "Schakelt de privacy van de informatie van een andere bijnaam in of uit."
    example: "%command_prefix%SASET Gebruiker PRIVATE ON"
    examples:
      - "%command_prefix%SASET Gebruiker PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <bijnaam> MSG {ON|OFF}"
    short: "Berichtvoorkeur van een bijnaam wijzigen."
    help: |-
      Stelt in of een andere bijnaam antwoorden als PRIVMSG (ON) of NOTICE (OFF)
      ontvangt.
    example: "%command_prefix%SASET Gebruiker MSG ON"
    examples:
      - "%command_prefix%SASET Gebruiker MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <bijnaam> VHOST [vhost]"
    short: "Virtuele host van een bijnaam wijzigen."
    help: |-
      Stelt de virtuele host van een andere bijnaam in of verwijdert deze. Voer SASET
      <bijnaam> VHOST zonder waarde uit om deze te verwijderen.
    example: "%command_prefix%SASET Gebruiker VHOST user.voorbeeld.nl"
    examples:
      - "%command_prefix%SASET Gebruiker VHOST"

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax: "RENAME <bijnaam>"
  short: "Forceer hernoeming van een verbonden bijnaam naar een willekeurige bijnaam."
  help: |-
    Dwingt een verbonden bijnaam om te veranderen naar een willekeurige naam met
    een door het netwerk ingesteld voorvoegsel.
  example: "%command_prefix%RENAME Problematisch"
  cannot_rename_root: "Kan rootgebruiker %nickname% niet hernoemen."
  cannot_rename_oper: "Kan IRC-operator %nickname% niet hernoemen."
  cannot_rename_service: "Kan service-bijnaam %nickname% niet hernoemen."
  success: "Bijnaam %nickname% is hernoemd naar %new_nick%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <bijnaam> {ON|OFF}"
  short: "Stel verloopbescherming in of verwijder deze voor een bijnaam."
  help: |-
    Bepaalt of een bijnaam door inactiviteit verloopt.
    ON voorkomt verval; OFF past de normale regels toe.
  example: "%command_prefix%NOEXPIRE Gebruiker ON"
  examples:
    - "%command_prefix%NOEXPIRE Gebruiker OFF"
  success_on: "Bijnaam %nickname% is nu beschermd tegen verloop."
  success_off: "Bijnaam %nickname% verloopt nu normaal."
  forbidden: "Bijnaam %nickname% is verboden."
  suspended: "Bijnaam %nickname% is geschorst."

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "De registratiemodus van het netwerk beheren."
  help: |-
    Stelt de registratiemodus voor nieuwe accounts in.

    %emphasis_0% Stuurt het verificatietoken naar het e-mailadres van de gebruiker.
    %emphasis_1% Levert het verificatietoken rechtstreeks via IRC.
    %emphasis_2% Toont de huidige modus zonder deze te wijzigen.

    Registraties in behandeling behouden de modus waarmee ze zijn gestart.

    In TOKEN-modus blijft RESEND voor alle gebruikers uitgeschakeld.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Huidige registratiemodus: %mode%."
  changed: "Registratiemodus gewijzigd naar %mode%."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <bijnaam> <duur> <reden>"
  short: "Schors een bijnaam."
  help: |-
    Voorkomt dat de eigenaar zich identificeert. De duur kan worden opgegeven in
    dagen (d), uren (h), minuten (m) of 0 voor een permanente opschorting.
    IRC-operators
    en Root-gebruikers kunnen niet worden opgeschort.
  example: "%command_prefix%SUSPEND SlechteGebruiker 7d Spam en #hulp"
  examples:
    - "%command_prefix%SUSPEND Problematisch 0 Omzeilen van een ban"
  success: "Bijnaam %nickname% is geschorst tot %duration%."
  already_suspended: "Bijnaam %nickname% is al geschorst."
  forbidden: "Bijnaam %nickname% is verboden en kan niet worden geschorst."
  cannot_suspend_oper: "Kan IRC-operator %nickname% niet schorsen."
  cannot_suspend_root: "Kan rootgebruiker %nickname% niet schorsen."
  cannot_suspend_service: "Kan service-bijnaam %nickname% niet schorsen."
  invalid_duration: "Ongeldige duur. Gebruik: %duration_format% (bijv. 7d, 12h, 30m) of %permanent% voor permanent."
  invalid_duration_format: "<d><h><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <bijnaam>"
  short: "Hef schorsing van een bijnaam op."
  help: "Heft een actieve opschorting op, zodat de eigenaar zich weer kan identificeren."
  example: "%command_prefix%UNSUSPEND Gebruiker"
  success: "De schorsing van %nickname% is opgeheven."
  not_suspended: "Bijnaam %nickname% is niet geschorst."

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <bijnaam> <reden>"
  short: "Blokkeer permanent het gebruik van een bijnaam."
  help: |-
    Verbiedt een bijnaam permanent zodat niemand deze kan registreren of gebruiken.
    Een geregistreerde bijnaam wordt verwijderd; een verbonden gebruiker wordt naar
    een willekeurige bijnaam verplaatst. Root, IRC-operators en services kunnen niet
    worden verboden.
  example: "%command_prefix%FORBID SlechteGebruiker Herhaalde beleidsschendingen"
  success: "Bijnaam %nickname% is verboden."
  updated: "Verbodsreden voor %nickname% is bijgewerkt."
  reason_required: "U moet een reden opgeven voor het verbod."
  cannot_forbid_root: "Kan rootgebruiker %nickname% niet verbieden."
  cannot_forbid_oper: "Kan IRC-operator %nickname% niet verbieden."
  cannot_forbid_service: "Kan service-bijnaam %nickname% niet verbieden."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <bijnaam>"
  short: "Hef een bijnaamverbod op."
  help: "Heft het verbod op zodat de bijnaam weer gebruikt kan worden."
  example: "%command_prefix%UNFORBID VerbodenBijnaam"
  success: "Bijnaam %nickname% is niet langer verboden."
  not_forbidden: "Bijnaam %nickname% is niet verboden."

# --- FORBIDVHOST (IRCop) ------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST <optie> [parameters]"
  short: "Beheer verboden vhost-patronen."
  help: |-
    Beheert patronen die overeenkomende VHosts via SET VHOST blokkeren. * staat voor
    eender welke reeks en ? voor één teken. IRC-operatorrechten zijn vereist.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Onbekende sub-opdracht %sub%. Gebruik ADD, DEL of LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <patroon>"
    short: "Voeg een verboden vhost-patroon toe."
    help: |-
      Voegt een patroon toe aan de lijst. Gebruikers kunnen geen overeenkomende VHost
      instellen via SET VHOST. * staat voor elke reeks en ? voor één teken.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Verboden vhost-patroon toegevoegd: %pattern%"
    already_exists: "Patroon %pattern% bestaat al."
    invalid: "Ongeldig vhost-patroonformaat."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <patroon>"
    short: "Verwijder een verboden vhost-patroon."
    help: "Verwijdert een patroon uit de lijst met verboden VHosts."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Verboden vhost-patroon verwijderd: %pattern%"
    not_found: "Patroon %pattern% niet gevonden."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Toon alle verboden vhost-patronen."
    syntax: "FORBIDVHOST LIST"
    help: "Toont alle verboden VHost-patronen."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Verboden vhost-patronen (%count%):"
    entry: "%index%. %pattern% — door %nickname% (%date%)"
    empty: "Geen verboden vhost-patronen."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <bijnaam> [FORCE]"
  short: "Laat een geregistreerde bijnaam vallen."
  help: |-
    Markeert een geregistreerde bijnaam voor verwijdering tijdens de respijtperiode;
    RESTORE kan deze herstellen. Voeg FORCE toe voor permanente verwijdering. Root-,
    IRC-operator- en servicebijnamen en je eigen bijnaam kunnen niet worden
    verwijderd.
  force:
    short: "Verwijdert een bijnaam die op verwijdering wacht definitief."
  example: "%command_prefix%DROP OudAccount"
  examples:
    - "%command_prefix%DROP OudAccount FORCE"
  suspended: "Bijnaam %nickname% is geschorst. Hef eerst de schorsing op."
  forbidden: "Bijnaam %nickname% is verboden."
  cannot_drop_root: "Kan rootgebruiker %nickname% niet verwijderen."
  cannot_drop_oper: "Kan IRC-operator %nickname% niet verwijderen."
  cannot_drop_self: "U kunt uw eigen bijnaam niet verwijderen."
  success: "Bijnaam %nickname% is gemarkeerd voor verwijdering en kan tijdens de respijtperiode worden hersteld."
  force_success: "Bijnaam %nickname% is definitief verwijderd."
  pending_deletion: "Bijnaam %nickname% staat al op het punt verwijderd te worden. Gebruik DROP <bijnaam> FORCE om hem definitief te verwijderen."
  cannot_drop_service: "Kan service-bijnaam %nickname% niet verwijderen."

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <bijnaam>"
  short: "Een bijnaam die op verwijdering wacht herstellen."
  help: "Herstelt een bijnaam die op verwijdering wacht zolang de respijtperiode duurt."
  example: "%command_prefix%RESTORE OudAccount"
  success: "Bijnaam %nickname% is hersteld."
  not_pending_deletion: "Bijnaam %nickname% staat niet op het punt verwijderd te worden."

# --- RESCUE -------------------------------------------------------------------
rescue:
  issued: |-
    Hersteltoken: %token_display%

    Bewaar dit token op een veilige plek. Je hebt het nodig om je nickname te herstellen als je je wachtwoord vergeet.

    Gebruik om het te bevestigen: /msg %bot% %verify%

    %warning%
  issued_warning: "BELANGRIJK: Alleen het laatst aangemaakte token is geldig. Na bevestiging wordt het niet meer getoond. Deel het met niemand."
  confirmed: "Je hersteltoken is bevestigd. Bewaar het veilig."
  unavailable: "Authenticeer je en bevestig je hersteltoken met %command_0% voordat je deze bewerking gebruikt."
  unavailable_command_0: "VERIFY"
  locked_out: "Te veel ongeldige tokens. Probeer het over %seconds% seconden opnieuw."
  throttled: "Te veel ongeldige tokens. Probeer het over %minutes% minuten opnieuw."
  replaced: "Je hersteltoken is vervangen door het zojuist bevestigde token uit de e-mail. Bewaar het veilig."
  optional_replacement: |-
    Optioneel nieuw hersteltoken: %token_display%

    Gebruik om je huidige hersteltoken te vervangen: /msg %bot% %verify%

    Je huidige token blijft geldig tot bevestiging.

    Wil je het niet wijzigen, negeer dan dit bericht.
  replacement_unavailable: "Je wachtwoord is hersteld, maar een nieuw token kon niet worden uitgegeven. Je huidige token blijft geldig."
  temporarily_unavailable: "De uitgifte van hersteltokens is tijdelijk niet beschikbaar. Probeer het later opnieuw."


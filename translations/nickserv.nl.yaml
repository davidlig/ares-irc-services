# NickServ-vertalingen — Nederlands
# Domein: nickserv
#
# IRC-opmaakcodes (dubbele aanhalingstekens of letterlijke !irc-blokken):
#   \x02        vet aan/uit
#   \x03NN      kleur (DECIMAAL: 03=groen, 04=rood, 07=oranje, 14=donkergrijs)
#   \x03        kleur herstellen
#   \x0F        alle opmaak herstellen
#
# IRC-kleuren gebruiken DECIMALE getallen (0-15), geen hexadecimale.
#   \x0314 = donkergrijs (14 decimaal): GOED
#   \x030F = kleur 0 gevolgd door de letter F: FOUT
#
# IRC-tekst over meerdere regels: !irc |- met echte regeleinden en spaties.
# Blokken zonder tag decoderen geen escapes; behoud letterlijke CTCP-waarden.
# HELP-voorbeelden: example/examples en %command_prefix%.
# De presentatielaag voegt /msg zonder kleur en een marge van twee spaties toe.

# --- REGISTER -----------------------------------------------------------------
register:
  token_unavailable: !irc |-
    De registratie is in behandeling, maar het token kon niet worden verstrekt.
    Wacht tot deze registratie verloopt voordat je opnieuw registreert.
  syntax: "REGISTER <wachtwoord> [email]"
  short: "Registreer uw bijnaam bij de services."
  help: |-
    Registreert je bijnaam. Het netwerk stuurt het verificatietoken via chat of
    e-mail,
    afhankelijk van de configuratie.
    Na verificatie wordt dit je permanente hersteltoken:
    Bewaar het op een veilige plaats.
    De geldigheidsduur van %duration% geldt alleen vóór verificatie.
    Administratief geblokkeerde e-maildomeinen zijn niet toegestaan.
  example: "%command_prefix%REGISTER Veilig$Wachtwoord_123"
  examples:
    - "%command_prefix%REGISTER Veilig$Wachtwoord_123 gebruiker@voorbeeld.nl"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Er is een verificatietoken gestuurd naar %email%."
  pending_line_2: "Voer /msg %bot% %verify% uit om de registratie te voltooien."
  pending_line_3: "Niets ontvangen? Controleer spam of gebruik /msg %bot% %resend%"
  pending_line_4: "Het token verloopt over %duration%."
  already_registered: "Bijnaam %nickname% is al geregistreerd."
  already_pending: "De registratie van %nickname% staat in behandeling. Gebruik %verify%. Als het token per e-mail is gestuurd en er een geldig adres is gekoppeld, kun je met %resend% een nieuw token aanvragen."
  forbidden: "Bijnaam %nickname% kan niet worden geregistreerd op dit netwerk."
  pending_deletion: "Bijnaam %nickname% staat op het punt verwijderd te worden en kan niet worden geregistreerd."
  invalid_email: "Het opgegeven e-mailadres is niet geldig."
  email_already_used: "De e-mail %email% is al in gebruik door een andere bijnaam. Gebruik een ander adres."
  throttled: "U moet %minutes% minu(u)t(en) wachten voordat u opnieuw probeert te registreren."
  guest_prefix_forbidden: "U kunt geen bijnaam registreren die begint met %prefix%."

# --- IDENTIFY -----------------------------------------------------------------
identify:
  syntax: "IDENTIFY <bijnaam> <wachtwoord>"
  short: "Identificeer uzelf als de eigenaar van een bijnaam."
  help: |-
    Authenticeert uw sessie bij %nickserv% met uw bijnaam en wachtwoord.
    Na succesvolle identificatie ontvangt u de geregistreerde modus %emphasis_0%
    en, als u een gastbijnaam gebruikte, wordt uw geregistreerde bijnaam hersteld.
  example: "%command_prefix%IDENTIFY Gebruiker <wachtwoord>"
  native_syntax: "/NICK <bijnaam>:<wachtwoord> | /NICK <bijnaam>!<wachtwoord>"
  native_short: "Toont de native syntaxis voor nickname-authenticatie."
  native_help: |-
    Dit protocol authenticeert accounts via nicknamewijzigingen.
    Gebruik %emphasis_0% of, als de nickname bezet is, %emphasis_1%.
  native_example: "/NICK Gebruiker:<wachtwoord>"
  native_examples:
    - "%command_prefix%/NICK Gebruiker!<wachtwoord>"
  native_authentication: "Dit protocol beheert authenticatie via nicknamewijzigingen. Gebruik %command_0% of, als de nickname bezet is, %command_1%."
  native_authentication_command_0: "/NICK <bijnaam>:<wachtwoord>"
  native_authentication_command_1: "/NICK <bijnaam>!<wachtwoord>"
  success: "U bent nu geïdentificeerd als %nickname%."
  already_identified: "U bent al geïdentificeerd als %nickname%."
  invalid_credentials: "Onjuist wachtwoord. Probeer het opnieuw."
  locked_out: "Te veel mislukte pogingen. Probeer het over %minutes% minu(u)t(en) opnieuw."
  ghost_released: "De spooksessie die %nickname% vasthield is verbroken."
  kill_reason: "Bijnaam %nickname% teruggevorderd door %source% (de geregistreerde eigenaar heeft zich geïdentificeerd)"
  pending: |-
    %first%
    %second%
  pending_line_1: "Bijnaam %nickname% wacht op e-mailverificatie."
  pending_line_2: "Voer /msg %bot% %command_0% uit of /msg %bot% %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Bijnaam %nickname% is geschorst. Reden: %reason%"
  forbidden: "Bijnaam %nickname% kan niet worden gebruikt op dit netwerk."
  pending_deletion: "Bijnaam %nickname% staat op het punt verwijderd te worden en kan niet worden gebruikt."

# --- VERIFY -------------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Bevestigt een registratie of hersteltoken."
  help: |-
    Na verificatie wordt dit je permanente hersteltoken.
    Bewaar het veilig: je kunt het gebruiken om je bijnaam te herstellen.
    De geldigheidsduur van %duration% geldt alleen vóór verificatie.
  example: "%command_prefix%VERIFY <ontvangen_token>"
  success: "Bijnaam %nickname% is succesvol geregistreerd en u bent nu geïdentificeerd."
  success_native: "De bijnaam %nickname% is succesvol geregistreerd. Gebruik de hieronder weergegeven native authenticatie."
  invalid_token: "Het hersteltoken is ongeldig."
  no_pending: "U heeft geen lopende registratie om te verifiëren."

# --- RESEND -------------------------------------------------------------------
resend:
  disabled: "%resend% is uitgeschakeld omdat dit account een token rechtstreeks via chat verzendt."
  syntax: "RESEND"
  short: "Verstuur de verificatietoken opnieuw naar uw e-mail."
  help: |-
    RESEND is alleen beschikbaar als het verificatietoken per e-mail is gestuurd.
    Na verificatie wordt dit je permanente hersteltoken. Bewaar het veilig om je
    bijnaam te herstellen. De geldigheidsduur van %duration% geldt alleen vóór
    verificatie.
    Met RESEND ontvang je een nieuw token per e-mail.
    De termijn van de registratie in behandeling wordt met %duration% verlengd.
  example: "%command_prefix%RESEND"
  success: "Verificatietoken opnieuw verzonden naar %email%."
  no_pending: "U heeft geen lopende registratie om te verifiëren."
  throttled: "U moet %minutes% minu(u)t(en) wachten voordat u een nieuwe verificatie-e-mail aanvraagt."

# --- RECOVER ------------------------------------------------------------------
recover:
  no_email: "Er is geen e-mail ingesteld voor bijnaam %nickname%. Herstel is niet beschikbaar."
  email_sent: "Er is een hersteltoken verzonden naar %email_hint%. Controleer uw inbox (en spammap)."
  pending_deletion: "Bijnaam %nickname% staat klaar voor verwijdering en kan niet worden hersteld."
  instructions: "EMAIL: %command_0% vraagt een voorlopig token per e-mail aan. TOKEN: geef je bevestigde token op. %command_1% accepteert een geldig e-mailtoken of bevestigd token. Het e-mailtoken vervangt het opgeslagen token pas na validatie. Het opgeslagen token biedt een optionele vervanging via %command_2%; negeer het bericht om het te behouden."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <bijnaam> [token]"
  short: "Herstel uw bijnaam als u uw wachtwoord bent kwijtgeraakt."
  help: |-
    Vraag zonder token per e-mail een tijdelijk token aan.
    Je kunt ook een geldig hersteltoken opgeven; een tijdelijk token vervangt het
    opgeslagen token pas na verificatie.
    Na gebruik van het opgeslagen token wordt met VERIFY optioneel een vervanging
    aangeboden. Negeer dat bericht als je het huidige wilt behouden.
  example: "%command_prefix%RECOVER Gebruiker"
  examples:
    - "%command_prefix%RECOVER Gebruiker <ontvangen_token>"
  pending: "De registratie van %nickname% is in behandeling. Gebruik %command_0%. %command_1% is alleen beschikbaar bij REGMODE EMAIL en een geldig gekoppeld e-mailadres."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "Bijnaam %nickname% is geschorst. Reden: %reason%"
  forbidden: "Bijnaam %nickname% kan niet worden gebruikt op dit netwerk."
  throttled: "Te veel ongeldige tokens. Probeer het over %minutes% minuten opnieuw."
  invalid_token: "Het hersteltoken is ongeldig."
  success_identify: "Wachtwoord gereset. Identificeer nu: %identify_cmd%"
  success_then_change: "Wijzig daarna uw wachtwoord: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <nieuw_wachtwoord>"

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <optie> [parameters]"
  short: "Wijzig de opties van je bijnaam."
  help: |-
    Wijzigt de instellingen van je bijnaam. Je moet geïdentificeerd zijn om deze
    opties te wijzigen.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Onbekende optie %option%. Beschikbare opties: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <nieuw_wachtwoord>"
    short: "Wijzig uw bijnaamwachtwoord."
    help: |-
      Wijzigt het wachtwoord voor uw bijnaam. Het nieuwe wachtwoord wordt
      direct van kracht. Kies een sterk wachtwoord van minimaal 6 tekens
      dat u niet op andere services gebruikt.
    example: "%command_prefix%SET PASSWORD Veilig$Wachtwoord_123"
    success: "Uw wachtwoord is succesvol bijgewerkt."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Gebruik %value% met je bevestigde hersteltoken."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Wijzigt het e-mailadres met je bevestigde herstel-token."
    help: |-
      SET EMAIL wijzigt het contactadres na controle van het herstel-token, zonder dit
      te verbruiken. Formaat en uniekheid worden gecontroleerd; er wordt geen
      bevestigingsmail verstuurd.
      Administratief geblokkeerde e-maildomeinen zijn niet toegestaan.
    example: "%command_prefix%SET EMAIL gebruiker@voorbeeld.nl <token_confirmado>"
    success: "Uw e-mail is bijgewerkt naar %email%."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Er is een bevestigingstoken verzonden naar %current_email%."
    pending_line_2: "Om de wijziging naar %new_email% te bevestigen, voer uit:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "De token verloopt binnen 1 uur."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "De token is ongeldig of verlopen. Vraag een nieuwe aan met %value%."
    invalid_token_value: "SET EMAIL <nieuwe_e-mail>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <code>"
    short: "Wijzig de taal die de services gebruiken om met u te communiceren."
    help: |-
      Wijzigt de taal die %nickserv% en andere services gebruiken wanneer ze met u
      praten.
      Beschikbare talen:
      %emphasis_0% (Catalaans)
      %emphasis_1% (Duits)
      %emphasis_2% (Grieks)
      %emphasis_3% (Engels)
      %emphasis_4% (Spaans)
      %emphasis_5% (Baskisch)
      %emphasis_6% (Frans)
      %emphasis_7% (Galicisch)
      %emphasis_8% (Italiaans)
      %emphasis_9% (Nederlands)
      %emphasis_10% (Pools)
      %emphasis_11% (Portugees)
      %emphasis_12% (Roemeens)
      %emphasis_13% (Turks)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Taal gewijzigd naar %language%."
    invalid: "Niet-ondersteunde taal. Beschikbare talen: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <tijdzone>"
    short: "Stel de tijdzone in die wordt gebruikt bij het weergeven van datums."
    help: |-
      Stelt de tijdzone in die %nickserv% gebruikt voor datumweergave. Bekijk HELP SET
      TIMEZONE voor regio’s. Gebruik OFF om deze te verwijderen.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Tijdzone ingesteld op %timezone%. Datums worden in deze tijdzone weergegeven."
    cleared: "Tijdzone gewist. Datums gebruiken de netwerkstandaard."
    invalid: "Ongeldige tijdzone %timezone%. Gebruik een geldige identificatie (bijv. UTC, Europe/Amsterdam)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Toont of verbergt informatie over je bijnaam."
    help: |-
      Bepaalt de zichtbaarheid van uw bijnaaminformatie in het INFO-commando.
      Met %emphasis_0% kunnen alleen u en IRC Operators uw gegevens bekijken.
      Met %emphasis_1% is uw informatie openbaar voor iedereen.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Uw bijnaaminformatie is nu %value%."
    on_value: "privé"
    off: "Uw bijnaaminformatie is nu %value%."
    off_value: "openbaar"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Wijzigt hoe de services je berichten sturen."
    help: |-
      Bepaalt hoe %nickserv% en andere services je berichten sturen.
      Met %emphasis_0% worden antwoorden als %emphasis_1% verstuurd.
      Met %emphasis_2% worden antwoorden als %emphasis_3% verstuurd.
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Serviceberichten worden nu verzonden als %value%."
    on_value: "PRIVMSG"
    off: "Serviceberichten worden nu verzonden als %value%."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost]"
    short: "Stelt je virtuele host in of verwijdert deze."
    help: |-
      Stelt een aangepaste hostnaam in die anderen zien wanneer je geïdentificeerd
      bent.

      Voer %emphasis_0% zonder waarde uit om deze te verwijderen.

      Alleen letters (a-z, A-Z), cijfers, koppeltekens en punten zijn toegestaan.
      Elk onderdeel moet beginnen en eindigen met een letter of cijfer.
      De hostnaam mag maximaal 48 tekens lang zijn en moet uniek zijn per bijnaam.
    example: "%command_prefix%SET VHOST user.voorbeeld.nl"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Uw virtuele host is ingesteld op %vhost%."
    cleared: "Uw virtuele host is gewist."
    invalid: "Ongeldige vhost. Alleen letters, cijfers, koppelteken en punt (niet aan begin/einde van blok); max 48 tekens."
    taken: "Die vhost is al in gebruik door een andere bijnaam."
    forced: "Uw vhost wordt automatisch geconfigureerd en kan niet worden gewijzigd met SET VHOST."

# --- INFO ---------------------------------------------------------------------
info:

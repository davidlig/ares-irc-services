# CReG translations — Greek
# Domain: cregserv

unknown_command: "\x0304✗\x03 Άγνωστη εντολή \x02%command%\x02. Χρησιμοποίησε \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Λανθασμένη σύνταξη. Χρήση: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Αυτή η εντολή είναι περιορισμένη στους χειριστές IRC."
  not_identified: "\x0304✗\x03 Δεν είσαι ταυτοποιημένος. Χρησιμοποίησε \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Η άδεια απορρίφθηκε. Δεν έχεις πρόσβαση σε αυτή την εντολή."

registra:
  syntax: "REGISTRA <#channel> <description>"
  short: "Ζητά την έγκριση εγγραφής ενός καναλιού."
  help: "Ζήτησε την εγγραφή ενός νέου καναλιού. Ένας χειριστής υπηρεσιών ελέγχει το αίτημα και το εγκρίνει ή το απορρίπτει· το κανάλι εγγράφεται μόνο αφού εγκριθεί. Πρέπει να είσαι ταυτοποιημένος με το %nickserv%.\n\n\x02#channel:\x02 Το κανάλι προς εγγραφή. Πρέπει να ξεκινά με #, να μην είναι ήδη εγγεγραμμένο (έλεγξέ το με την εντολή ESTADO) και να έχει έως 64 χαρακτήρες μαζί με το #.\n\n\x02description:\x02 Το θέμα ή ο σκοπός του καναλιού, έως 255 χαρακτήρες. Αυτό αξιολογεί ο χειριστής κατά την εξέταση του αιτήματος.\n\nΑφού υποβληθεί, το αίτημα παραμένει σε αναμονή μέχρι ένας χειριστής υπηρεσιών να το εγκρίνει ή να το απορρίψει. Μπορείς να στείλεις μόνο ένα αίτημα κάθε 24 ώρες."
  example: "/msg CReG REGISTRA #mychannel ένας τόπος για συνομιλία"
  requested: "\x0303✔\x03 Ζήτησες την εγγραφή του καναλιού \x02%channel%\x02. Ένας χειριστής υπηρεσιών θα αξιολογήσει το αίτημα."
  invalid_channel: "\x0304✗\x03 Το όνομα του καναλιού πρέπει να ξεκινά με \x02#\x02."
  channel_too_long: "\x0304✗\x03 Το όνομα του καναλιού είναι πολύ μεγάλο: έως \x0264\x02 χαρακτήρες, συμπεριλαμβανομένου του \x02#\x02."
  description_too_long: "\x0304✗\x03 Η περιγραφή είναι πολύ μεγάλη: έως \x02255\x02 χαρακτήρες."
  already_registered: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι ήδη εγγεγραμμένο."
  pending_deletion: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 διαγράφεται τώρα και δεν μπορεί να εγγραφεί μέχρι να ολοκληρωθεί η διαγραφή."
  duplicate: "\x0304✗\x03 Υπάρχει ήδη αίτημα εγγραφής για το \x02%channel%\x02 που περιμένει έγκριση. Χρησιμοποίησε \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 Το αίτημα εγγραφής για το \x02%channel%\x02 απορρίφθηκε."
  throttled: "\x0304✗\x03 Πρέπει να περιμένεις \x02%minutes%\x02 λεπτό(ά) πριν ζητήσεις άλλο κανάλι."

estado:
  syntax: "ESTADO <#channel>"
  short: "Εμφανίζει την κατάσταση εγγραφής ενός καναλιού."
  help: "Αναφέρει σε ποιο σημείο βρίσκεται ένα κανάλι στη διαδικασία εγγραφής.\n\nΟι πιθανές καταστάσεις είναι:\n    \x02ΕΓΓΕΓΡΑΜΜΕΝΟ\x02: το κανάλι είναι ήδη εγγεγραμμένο στο ChanServ.\n    \x02ΣΕ ΕΛΕΓΧΟ\x02: ένα αίτημα εγγραφής περιμένει έναν χειριστή υπηρεσιών να το εγκρίνει ή να το απορρίψει.\n    \x02ΑΠΟΡΡΙΦΘΕΝ\x02: το αίτημα εγγραφής απορρίφθηκε.\n    \x02ΔΙΑΓΡΑΦΕΤΑΙ\x02: το κανάλι αποχαιρετήθηκε και βρίσκεται στην περίοδο χάριτος διαγραφής· δεν μπορεί να εγγραφεί ξανά μέχρι να ολοκληρωθεί η διαγραφή.\n    \x02ΧΩΡΙΣ ΔΙΑΔΙΚΑΣΙΑ\x02: το κανάλι δεν έχει καμία διαδικασία εγγραφής."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 είναι ήδη εγγεγραμμένο."
  pending_deletion: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 διαγράφεται τώρα και δεν μπορεί να εγγραφεί μέχρι να ολοκληρωθεί η διαγραφή."
  pending: "\x0303◌\x03 Το κανάλι \x02%channel%\x02 βρίσκεται σε εξέλιξη, σε αναμονή ελέγχου από χειριστή υπηρεσιών (ζητήθηκε στις %date%)."
  denied: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 απορρίφθηκε στις %date%. Λόγος: %reason%"
  no_request: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν έχει διαδικασία εγγραφής."

cancel:
  syntax: "CANCEL <#channel>"
  short: "Ακυρώνει το εκκρεμές αίτημα εγγραφής ενός καναλιού."
  help: "Ακυρώνει ένα αίτημα εγγραφής καναλιού που δεν έχει ακόμη εγκριθεί ή απορριφθεί. Μπορείς να ακυρώσεις μόνο τα δικά σου εκκρεμή αιτήματα.\n\n\x02#channel:\x02 Το κανάλι του αιτήματος που θέλεις να ακυρώσεις. Το αίτημα πρέπει να είναι αυτό που υπέβαλες εσύ και να παραμένει εκκρεμές.\n\nΑφού ακυρωθεί, το αίτημα αφαιρείται και το όνομα του καναλιού ελευθερώνεται."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 Το αίτημα εγγραφής για το κανάλι \x02%channel%\x02 ακυρώθηκε και το όνομα του καναλιού είναι ξανά ελεύθερο."
  invalid_channel: "\x0304✗\x03 Το όνομα του καναλιού πρέπει να ξεκινά με \x02#\x02."
  no_request: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν έχει καμία διαδικασία εγγραφής."
  not_yours: "\x0304✗\x03 Το αίτημα εγγραφής για το \x02%channel%\x02 δεν ανήκει σε εσένα."
  not_pending: "\x0304✗\x03 Το αίτημα εγγραφής για το \x02%channel%\x02 έχει ήδη εγκριθεί ή απορριφθεί και δεν μπορεί να ακυρωθεί."

aprobar:
  syntax: "APROBAR <#channel>"
  short: "Εγκρίνει ένα εκκρεμές αίτημα εγγραφής καναλιού."
  help: "Εγγράφει ένα κανάλι του οποίου το αίτημα περιμένει έλεγχο. Το κανάλι εγγράφεται στον χρήστη που το ζήτησε· κανένας από τους δύο δεν χρειάζεται να βρίσκεται μέσα. Χρειάζεσαι την άδεια \x02cregserv.aprobar\x02.\n\n\x02#channel:\x02 Το κανάλι με το εκκρεμές αίτημα. Χρησιμοποίησε το PENDIENTES για να δεις την ουρά.\n\nΜόλις εγκριθεί, το κανάλι εγγράφεται στο \x02ChanServ\x02 και το αίτημα κλείνει."
  example: "/msg CReG APROBAR #channel"
  approved: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 εγγράφηκε σωστά για τον \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 Το όνομα του καναλιού πρέπει να ξεκινά με \x02#\x02."
  no_pending: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν βρίσκεται σε διαδικασία εγγραφής."
  already_registered: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι ήδη εγγεγραμμένο στο \x02ChanServ\x02."
  already_approved: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι ήδη εγγεγραμμένο."
  already_denied: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν μπορεί να εγγραφεί επειδή είναι σημειωμένο ως \x0304ΑΠΟΡΡΙΦΘΗΚΕ\x03."
  failed: "\x0304✗\x03 Η εγγραφή του καναλιού \x02%channel%\x02 δεν ολοκληρώθηκε."

denegar:
  syntax: "DENEGAR <#channel> <reason>"
  short: "Απορρίπτει ένα εκκρεμές αίτημα εγγραφής καναλιού."
  help: "Απορρίπτει ένα αίτημα εγγραφής αφήνοντας ελεύθερο το όνομα του καναλιού. Ο λόγος είναι υποχρεωτικός και εμφανίζεται από το DENEGADOS. Χρειάζεσαι την άδεια \x02cregserv.denegar\x02.\n\n\x02#channel:\x02 Το κανάλι με το εκκρεμές αίτημα.\n\x02reason:\x02 Γιατί απορρίπτεται το αίτημα· αποθηκεύεται και εμφανίζεται σε όποιον ελέγχει το DENEGADOS.\n\nΤο όνομα του καναλιού γίνεται ελεύθερο για να ζητηθεί ξανά μετά την απόρριψη."
  example: "/msg CReG DENEGAR #channel εκτός θέματος"
  denied: "\x0303✔\x03 Η εγγραφή του καναλιού \x02%channel%\x02 απορρίφθηκε."
  invalid_channel: "\x0304✗\x03 Το όνομα του καναλιού πρέπει να ξεκινά με \x02#\x02."
  no_pending: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν έχει διαδικασία εγγραφής."
  already_approved: "\x0304✗\x03 Τα ήδη εγγεγραμμένα και εγκεκριμένα κανάλια δεν μπορούν να απορριφθούν."
  already_denied: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι ήδη απορριφθέν."

pendientes:
  syntax: "PENDIENTES"
  short: "Λίστα των αιτημάτων εγγραφής καναλιών σε αναμονή ελέγχου."
  help: "Εμφανίζει κάθε αίτημα εγγραφής καναλιού που περιμένει να αξιολογήσει ένας χειριστής υπηρεσιών, με το κανάλι, ποιος το ζήτησε, την ημερομηνία και την περιγραφή. Χρειάζεσαι την άδεια \x02cregserv.pendientes\x02.\n\nΑυτή η εντολή δεν δέχεται παραμέτρους."
  example: "/msg CReG PENDIENTES"
  empty: "Δεν υπάρχουν κανάλια σε αναμονή ελέγχου."
  line: "\x02Κανάλι:\x02 %channel%, \x02Ζητήθηκε από:\x02 %requester%, \x02Ημερομηνία:\x02 %date%, \x02Περιγραφή:\x02 %description%"
  end: "Τέλος της λίστας."

denegados:
  syntax: "DENEGADOS"
  short: "Λίστα των αιτημάτων εγγραφής καναλιών που απορρίφθηκαν."
  help: "Εμφανίζει κάθε απορριφθέν αίτημα εγγραφής μαζί με το λόγο για τον οποίο απορρίφθηκε. Χρειάζεσαι την άδεια \x02cregserv.denegados\x02.\n\nΑυτή η εντολή δεν δέχεται παραμέτρους."
  example: "/msg CReG DENEGADOS"
  empty: "Δεν υπάρχουν απορριφθέντα κανάλια."
  line: "\x02Κανάλι:\x02 %channel%, \x02Λόγος:\x02 %reason%"
  end: "Τέλος της λίστας."

drop:
  syntax: "DROP <#channel>"
  short: "Αφαιρεί το αρχείο εγγραφής που το \x02%bot%\x02 κρατά για ένα κανάλι."
  help: "Αφαιρεί το αρχείο εγγραφής που το \x02%bot%\x02 κρατά για ένα κανάλι και, αν το κανάλι είναι εγγεγραμμένο εκεί, το καταργεί και από το \x02ChanServ\x02. Χρειάζεσαι την άδεια \x02cregserv.drop\x02.\n\n\x02#channel:\x02 Το κανάλι που θέλεις να αφαιρέσεις.\n\nΗ κατάργηση από το \x02ChanServ\x02 είναι ήπια: το κανάλι εισέρχεται σε περίοδο χάριτος διαγραφής αντί να διαγραφεί αμέσως."
  example: "/msg CReG DROP #channel"
  dropped: "\x0303✔\x03 Το αρχείο εγγραφής του καναλιού \x02%channel%\x02 αφαιρέθηκε από το \x02%bot%\x02."
  dropped_channel: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 καταργήθηκε και εισέρχεται τώρα στην περίοδο χάριτος διαγραφής."
  invalid_channel: "\x0304✗\x03 Το όνομα του καναλιού πρέπει να ξεκινά με \x02#\x02."
  no_request: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 δεν καταγράφεται από το \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#channel> [description]"
  short: "Εγγράφει ένα κανάλι χωρίς να βρίσκεσαι μέσα."
  help: "Εγγράφει ένα κανάλι κατόπιν αιτήματος του staff, χωρίς να περάσει από τη διαδικασία αιτήματος και έγκρισης. Δεν χρειάζεται να βρίσκεσαι μέσα στο κανάλι ούτε να υπάρχει ήδη. Χρειάζεσαι την άδεια \x02cregserv.saregister\x02.\n\n\x02#channel:\x02 Το κανάλι που θέλεις να εγγράψεις.\n\x02description:\x02 Προαιρετική περιγραφή που αποθηκεύεται με την εγγραφή."
  example: "/msg CReG SAREGISTER #channel ένα κανάλι του staff"
  done: "\x0303✔\x03 Το κανάλι \x02%channel%\x02 εγγράφηκε."
  invalid_channel: "\x0304✗\x03 Το όνομα του καναλιού πρέπει να ξεκινά με \x02#\x02."
  pending_deletion: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι σε αναμονή διαγραφής και δεν μπορεί να εγγραφεί."
  already_registered: "\x0304✗\x03 Το κανάλι \x02%channel%\x02 είναι ήδη εγγεγραμμένο."
  failed: "\x0304✗\x03 Η εγγραφή του καναλιού \x02%channel%\x02 δεν ολοκληρώθηκε."


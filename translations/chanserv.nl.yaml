  private: "\x0304✗\x03 De kanaalinformatie van \x02%channel%\x02 is privé."
  no_expire: "  \x0314Vervalt nooit\x03       : Ja"
  mlock_modes: "  \x0314Mode-vergrendeling\x03  : %modes%"
  suspended_status: "  \x0314Status\x03              : \x0304Geschorst\x03"

# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#kanaal> <bijnaam>"
  example: "%command_prefix%\x02\x0303OP #kanaal Alice\x03\x0F"
  short: "Geef kanaaloperator-modus."
  help: "Geef kanaaloperator-modus."
  done: "\x0303✔\x03 \x02%nickname%\x02 heeft kanaaloperator-status gekregen."
  user_not_on_channel: "\x0304✗\x03 Bijnaam \x02%nickname%\x02 is niet op het netwerk."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 geeft \x0304%mode%\x03 aan \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#kanaal> <bijnaam>"
  example: "%command_prefix%\x02\x0303DEOP #kanaal Alice\x03\x0F"
  short: "Verwijder kanaaloperator-modus."
  help: "Verwijder kanaaloperator-modus."
  done: "\x0303✔\x03 \x02%nickname%\x02 is gedeopt."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 Met SECURE aan moet \x02%nickname%\x02 ten minste niveau \x02%level%\x02 hebben om \x02%mode%\x02 te ontvangen."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#kanaal> {FOUNDER <bijnaam> [token]|SUCCESSOR [bijnaam]|DESC <beschrijving>|URL [url]|EMAIL [e-mail]|ENTRYMSG [bericht]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%\x02\x0303SET #kanaal DESC Een gemeenschapskanaal\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #kanaal URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #kanaal MLOCK ON\x03\x0F"
  short: "Wijzig kanaalopties."
  help: |-
    Wijzigt een kanaaloptie. De hulp bij elke optie beschrijft de vereisten en
    varianten.
  unknown_option: "\x0304✗\x03 Onbekende optie \x02%option%\x02. Gebruik een van: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Gebruik SET <#kanaal> FOUNDER <bijnaam> <token> met het bevestigde token van de huidige oprichter."
    token_unavailable: "De huidige oprichter heeft geen bevestigd hersteltoken. Die moet zich eerst authenticeren en VERIFY gebruiken."
    syntax: "SET <#kanaal> FOUNDER <bijnaam> [token]"
    example: "%command_prefix%\x02\x0303SET #kanaal FOUNDER Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanaal FOUNDER Alice bevestigd-token\x03\x0F"
    short: "Draag kanaal over aan een andere geregistreerde bijnaam."
    help: |-
      Wijzigt de oprichter na controle van het token van de huidige oprichter. De
      uitzondering voor beheerders op oprichtersniveau blijft behouden. Het token
      wordt niet verbruikt.
    invalid_token: "Het hersteltoken is ongeldig."
    updated: "\x0303✔\x03 Oprichter is gewijzigd naar \x02%nickname%\x02."
    throttled: "Te veel ongeldige tokens. Probeer het over %minutes% minuten opnieuw."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 moet geregistreerd en geactiveerd zijn."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 is geschorst en kan niet als oprichter worden ingesteld."
    cannot_be_self: "\x0304✗\x03 De nieuwe oprichter kan niet de huidige oprichter zijn."
    cannot_be_successor: "\x0304✗\x03 De nieuwe oprichter kan niet de kanaalopvolger zijn."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 heeft het maximum van %max% geregistreerde kanalen bereikt."
    notice_channel: "\x02%from%\x02 wijst \x02%nickname%\x02 aan als kanaaloprichter."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#kanaal> SUCCESSOR [bijnaam]"
    example: "%command_prefix%\x02\x0303SET #kanaal SUCCESSOR Alice\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanaal SUCCESSOR\x03\x0F"
    short: "Stel de kanaalopvolger in."
    help: |-
      Stelt een bijnaam in als opvolger van een kanaal. Laat de bijnaam weg om de
      huidige opvolger te verwijderen. De bijnaam moet geregistreerd en ingeschakeld
      zijn.
    cleared: "\x0303✔\x03 Opvolger is gewist."
    updated: "\x0303✔\x03 Opvolger is ingesteld op \x02%nickname%\x02."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 moet geregistreerd en geactiveerd zijn."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 is geschorst en kan niet als opvolger worden ingesteld."
    cannot_be_founder: "\x0304✗\x03 De oprichter kan niet als opvolger worden ingesteld."
    notice_channel: "\x02%from%\x02 wijst \x02%nickname%\x02 aan als kanaalopvolger."
    notice_channel_cleared: "\x02%from%\x02 heeft de kanaalopvolger gewist."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#kanaal> DESC <beschrijving>"
    example: "%command_prefix%\x02\x0303SET #kanaal DESC Een gemeenschapskanaal\x03\x0F"
    short: "Wijzig kanaalbeschrijving."
    help: "Wijzig de kanaalbeschrijving (verplicht)."
    updated: "\x0303✔\x03 Beschrijving bijgewerkt."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#kanaal> URL [url]"
    example: "%command_prefix%\x02\x0303SET #kanaal URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanaal URL\x03\x0F"
    short: "Stel kanaal-URL in."
    help: "Wijzigt de website-URL van een kanaal. Laat de URL weg om deze te verwijderen."
    updated: "\x0303✔\x03 URL bijgewerkt."
    cleared: "\x0303✔\x03 URL gewist."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#kanaal> EMAIL [e-mail]"
    example: "%command_prefix%\x02\x0303SET #kanaal EMAIL team@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanaal EMAIL\x03\x0F"
    short: "Stel kanaal-e-mail in."
    help: |-
      Wijzigt het e-mailadres van een kanaal. Laat e-mail weg om het te
      verwijderen. Administratief geblokkeerde e-maildomeinen zijn niet
      toegestaan. Administratieve uitzondering: operators met toegang op
      oprichtersniveau.
    invalid: "\x0304✗\x03 Ongeldig e-mailadres."
    updated: "\x0303✔\x03 E-mail bijgewerkt."
    cleared: "\x0303✔\x03 E-mail gewist."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#kanaal> ENTRYMSG [bericht]"
    example: "%command_prefix%\x02\x0303SET #kanaal ENTRYMSG Welkom\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanaal ENTRYMSG\x03\x0F"
    short: "Stel kanaal-toegangsbericht in."
    help: |-
      Stelt het welkomstbericht (NOTICE) in. Laat het bericht weg om het te
      verwijderen.
    updated: "\x0303✔\x03 Toegangsbericht bijgewerkt."
    too_long: "\x0304✗\x03 Toegangsbericht mag niet langer zijn dan %max% tekens."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#kanaal> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanaal TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanaal TOPICLOCK OFF\x03\x0F"
    short: "Vergrendel kanaalonderwerp."
    help: |-
      Voorkomt wijzigingen aan het kanaalonderwerp. Bij inschakeling wordt het
      huidige onderwerp opgeslagen en vergrendeld.
    on: "\x0303✔\x03 Onderwerpvergrendeling is nu ON."
    off: "\x0303✔\x03 Onderwerpvergrendeling is nu OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 schakelt TOPICLOCK in."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 schakelt TOPICLOCK uit."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#kanaal> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanaal MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanaal MLOCK OFF\x03\x0F"
    short: "Vergrendel kanaalmodi."
    help: |-
      Vergrendelt de huidige kanaalmodi (bijv. +nt). Wanneer ON, kunnen modi niet
      worden gewijzigd.
    no_modes: "geen modi"
    on: "\x0303✔\x03 MLOCK is nu ON (%modes%)."
    off: "\x0303✔\x03 MLOCK is nu OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 schakelt MLOCK in (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 schakelt MLOCK uit."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#kanaal> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanaal PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanaal PRIVATE OFF\x03\x0F"
    short: "Verberg kanaalinformatie voor gebruikers zonder toegang."
    help: |-
      Bij ON kunnen alleen de oprichter en gebruikers met toegang kanaalinformatie
      zien.
    on: "\x0303✔\x03 Kanaalinformatie is nu privé."
    off: "\x0303✔\x03 Kanaalinformatie is nu openbaar."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#kanaal> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #kanaal SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #kanaal SECURE OFF\x03\x0F"
    short: "Vereis toegangslijst voor kanaalrangen."
    help: "Voorkomt dat bijnamen buiten de toegangslijst kanaalrangen krijgen."
    on: "\x0303✔\x03 SECURE is nu ON."
    off: "\x0303✔\x03 SECURE is nu OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 schakelt SECURE-modus in."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 schakelt SECURE-modus uit."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#kanaal> {ADD <bijnaam> <niveau>|DEL <bijnaam>|LIST}"
  example: "%command_prefix%\x02\x0303ACCESS #kanaal LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #kanaal ADD Alice 100\x03\x0F"
    - "%command_prefix%\x02\x0303ACCESS #kanaal DEL Alice\x03\x0F"
  short: "Beheer toegangslijst."
  help: "Beheert de toegangslijst van het kanaal."

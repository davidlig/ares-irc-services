  notice_channel: "\x0304✗\x03 \x0302%nickname%\x03 verwijdert hun toegang van het kanaal"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#kanaal> {LIST|SET <niveau> <waarde>|RESET}"
  example: "%command_prefix%\x02\x0303LEVELS #kanaal LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #kanaal SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #kanaal RESET\x03\x0F"
  short: "Configureer kanaalniveaus."
  help: |-
    Stelt de minimale toegangslevels voor kanaalacties in. Alleen de oprichter
    kan levels wijzigen of herstellen.
  unknown_sub: "\x0304✗\x03 Onbekende sub-opdracht \x02%sub%\x02. Gebruik LIST, SET of RESET."
  unknown_key: "\x0304✗\x03 Onbekende niveausleutel \x02%key%\x02 of niet ondersteund door deze IRCd."
  value_range: "\x0304✗\x03 Niveauwaarde moet tussen %min% en %max% liggen."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#kanaal> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #kanaal LIST\x03\x0F"
    short: "Toon niveauvereisten."
    help: |-
      Toont elke niveausleutel en de waarde ervan (standaardwaarden indien niet
      ingesteld).
    header: "\x0303Levels voor %channel%\x03"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#kanaal> SET <niveau> <waarde>"
    example: "%command_prefix%\x02\x0303LEVELS #kanaal SET OPDEOP 50\x03\x0F"
    short: "Stel een niveauvereiste in."
    help: "Waarde -1 tot 499. Alleen oprichter."
    done: "\x0303✔\x03 \x02%key%\x02 ingesteld op %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#kanaal> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #kanaal RESET\x03\x0F"
    short: "Herstel alle niveaus naar standaardwaarden."
    help: "Verwijdert alle overschrijvingen. Alleen oprichter."
    done: "\x0303✔\x03 Alle niveaus hersteld naar standaardwaarden."


# ChanServ-vertalingen — Nederlands
# Domein: chanserv
#
# IRC-opmaakcodes (dubbele aanhalingstekens of letterlijke !irc-blokken):
#   \x02        vet aan/uit
#   \x03NN      kleur (DECIMAAL: 03=groen, 04=rood, 07=oranje, 14=donkergrijs)
#   \x03        kleur herstellen
#   \x0F        alle opmaak herstellen
#
# IRC-kleuren gebruiken DECIMALE getallen (0-15), geen hexadecimale.
#   \x0314 = donkergrijs (14 decimaal): GOED
#   \x030F = kleur 0 gevolgd door de letter F: FOUT
#
# IRC-tekst over meerdere regels: !irc |- met echte regeleinden en spaties.
# Blokken zonder tag decoderen geen escapes; behoud letterlijke CTCP-waarden.
# HELP-voorbeelden: example/examples en %command_prefix%.
# De presentatielaag voegt /msg zonder kleur en een marge van twee spaties toe.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Ongeldige kanaalnaam. Gebruik \x02#kanaal\x02."
  generic: "\x0304✗\x03 Er is een fout opgetreden. Probeer het opnieuw."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#kanaal> <beschrijving>"
  example: "%command_prefix%\x02\x0303REGISTER #kanaal Gemeenschapsproject\x03\x0F"
  short: "Registreer een kanaal."
  help: |-
    Registreer een kanaal en koppel het aan je bijnaam. Identificeer jezelf met
    %nickserv%.
    In de modus APPROVAL moet een IRCop de aanvraag goedkeuren.
  success: "\x0303✔\x03 Kanaal \x02%channel%\x02 is geregistreerd."
  already_registered: "\x0304✗\x03 Kanaal \x02%channel%\x02 is al geregistreerd of heeft een lopende registratieaanvraag."
  channel_not_on_network: "\x0304✗\x03 Kanaal \x02%channel%\x02 bestaat niet op het netwerk."
  pending_deletion: "\x0304✗\x03 Kanaal \x02%channel%\x02 staat op het punt verwijderd te worden en kan niet worden geregistreerd."
  insufficient_channel_rank: "\x0304✗\x03 Je moet minstens operatorstatus hebben op \x02%channel%\x02 om het kanaal te registreren."
  limit_exceeded: "\x0304✗\x03 U heeft het maximum van %max% geregistreerde kanalen bereikt."
  throttled: "\x0304✗\x03 U moet \x02%minutes%\x02 minu(u)t(en) wachten voordat u een ander kanaal registreert."

  awaiting_approval: "\x0307✔\x03 Registratieaanvraag voor \x02%channel%\x02 wacht op goedkeuring door een IRCop."
  restricted_indefinite: "\x0304✗\x03 Nieuwe aanvragen voor \x02%channel%\x02 zijn onbeperkt geblokkeerd."
  restricted_until: "\x0304✗\x03 Nieuwe aanvragen voor \x02%channel%\x02 zijn geblokkeerd tot %date%"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%\x02\x0303REGMODE APPROVAL\x03\x0F"
  short: "Stel de registratiemodus voor kanalen in of bekijk deze."
  help: |-
    Stel registratie in op DIRECT of APPROVAL, of bekijk STATUS.
    DIRECT is de standaardmodus en behoudt directe registratie.

  status: "\x0307ℹ\x03 De kanaalregistratiemodus is \x02%mode%\x02."
  changed: "\x0303✔\x03 De kanaalregistratiemodus is nu \x02%mode%\x02."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [pagina]|ACCEPT <#kanaal>|REJECT <#kanaal> <reden>}"
  pending.syntax: "CREG PENDING [pagina]"
  pending.example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  pending.short: "Toon openstaande registratieaanvragen."
  pending.help: "Toont openstaande aanvragen op een begrensde pagina."
  accept.syntax: "CREG ACCEPT <#kanaal>"
  accept.example: "%command_prefix%\x02\x0303CREG ACCEPT #canal\x03\x0F"
  accept.short: "Keur een kanaalregistratieaanvraag goed."
  accept.help: "Controleert de aanvrager opnieuw en activeert de registratie."
  reject.syntax: "CREG REJECT <#kanaal> <reden>"
  reject.example: "%command_prefix%\x02\x0303CREG REJECT #canal Motivo público\x03\x0F"
  reject.short: "Wijs een kanaalregistratieaanvraag af."
  reject.help: "Wijst de aanvraag af met een verplichte reden en blokkering."
  example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  short: "Beoordeel registratieaanvragen voor kanalen."
  help: |-
    Toon openstaande aanvragen of keur een aanvraag goed of af.
    Voor afwijzing is een reden vereist. Alleen ACCEPT registreert het kanaal.

  pending_header: "\x0314Openstaande registraties (pagina %page%)\x03"
  pending_item: "  %channel% — aanvrager %requester%, ingediend %submitted%: %description%"
  accepted: "\x0303✔\x03 Registratie van \x02%channel%\x02 is goedgekeurd."
  rejected: "\x0303✔\x03 Registratie van \x02%channel%\x02 is afgewezen."
  not_pending: "\x0304✗\x03 Kanaal \x02%channel%\x02 heeft geen openstaande registratie."
  channel_not_on_network: "\x0304✗\x03 Kanaal \x02%channel%\x02 is niet op het netwerk."
  founder_limit: "\x0304✗\x03 De aanvrager heeft de registratielimiet voor kanalen bereikt."
  requester_inactive: "\x0304✗\x03 Het account van de aanvrager is niet meer actief."
  requester_ineligible: "\x0304✗\x03 De aanvrager moet momenteel kanaaloperator zijn."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <#kanaal>"
  example: "%command_prefix%\x02\x0303STATUS #canal\x03\x0F"
  header: "\x02Status van kanaal \x0307%channel%\x03\x02"
  short: "Toon de registratiestatus van een kanaal."
  help: |-
    Toont of een kanaal niet geregistreerd is, op goedkeuring wacht, is
    afgewezen of geregistreerd is.
    Afwijsgegevens zijn alleen zichtbaar voor de aanvrager en bevoegde IRCops.

  unregistered: "  \x0314Status                  \x03: Niet geregistreerd"
  pending: "  \x0314Status                  \x03: \x0307Wacht op goedkeuring\x03"
  registered: "  \x0314Status                  \x03: \x0303Geregistreerd\x03"
  suspended: "  \x0314Status                  \x03: \x0304Geschorst\x03"
  forbidden: "  \x0314Status                  \x03: \x0304Verboden\x03"
  pending_deletion: "  \x0314Status                  \x03: \x0307Wacht op verwijdering\x03"
  rejected_private: "  \x0314Status                  \x03: \x0304Registratie afgewezen\x03"
  rejected: "  \x0314Status                  \x03: \x0304Registratie afgewezen\x03"
  rejection_reason: "  \x0314Reden                   \x03: %reason%"
  rejection_audit: "  \x0314Afgewezen door          \x03: %operator% op %date%"
  restriction_until: "  \x0314Beschikbaar vanaf       \x03: %date%"
  footer: "\x0314─────────────────────────────\x03\x0F"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#kanaal>"
  example: "%command_prefix%\x02\x0303INFO #kanaal\x03\x0F"
  short: "Toon kanaalinformatie."
  help: |-
    Toont uitgebreide informatie over een geregistreerd kanaal, zoals de eigenaar,
    registratiegegevens, laatste activiteit en instellingen.
  header: "\x02Informatie voor kanaal \x0307%channel%\x03\x02"
  founder: "  \x0314Oprichter\x03           : \x02%nickname%\x02"

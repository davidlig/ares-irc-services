  pending_deletion_status: "  \x0314Status\x03             : \x0307In afwachting van verwijdering\x03"
  pending_deletion_at: "  \x0314Verwijderd\x03         : %date%"
  pending_deletion_until: "  \x0314Definitief op\x03      : %date%"

# --- LEVEL FOUNDER ---------------------------------------------------------
level_founder:
  short: "Staat handelingen toe waarvoor het oprichterslevel van het kanaal vereist is."

# --- CLEARACCESS -----------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#kanaal>"
  example: "%command_prefix%\x02\x0303CLEARACCESS #kanaal\x03\x0F"
  short: "Wis de volledige toegangslijst van een kanaal."
  help: |-
    Verwijdert alle toegang vermeldingen van het kanaal. Dit kan niet ongedaan
    worden gemaakt.
  success: "\x0303✔\x03 \x02%count%\x02 toegangsvermeldingen gewist uit \x02%channel%\x02."
  empty: "\x0307ℹ\x03 Kanaal \x02%channel%\x02 heeft geen toegangsvermeldingen."

# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#kanaal> [reden]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #kanaal\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #kanaal overstroming\x03\x0F"
  short: "Kick alle gebruikers uit een kanaal."
  help: |-
    Verwijdert alle gebruikers uit het kanaal. Alleen IRC-operators mogen dit;
    zonder reden wordt een standaardreden gebruikt.
  not_on_network: "\x0304✗\x03 Kanaal \x02%channel%\x02 is momenteel niet op het netwerk."
  empty: "\x0307ℹ\x03 Kanaal \x02%channel%\x02 heeft geen gebruikers om te kicken."
  success: "\x0303✔\x03 \x02%count%\x02 gebruiker(s) gekickt uit \x02%channel%\x02."
  default_reason: "CLEARUSERS commando"

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <patroon> [pagina]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "Toon geregistreerde kanalen die overeenkomen met een patroon."
  help: |-
    Toont geregistreerde kanalen die overeenkomen met het patroon. Het jokerteken
    * staat voor een willekeurige tekenreeks. De optionele pagina begint bij 1.
  header: "Kanaal | Oprichter | Registratie | Laatst gebruikt | Status"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Geen kanalen komen overeen met patroon %pattern%."
  status_pending_registration: "Goedkeuring in behandeling"
  status_rejected_registration: "Registratie afgewezen"
  status_active: "Actief"

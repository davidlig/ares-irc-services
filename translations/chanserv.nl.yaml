  help: |-
    Registreer een kanaal en koppel het aan je bijnaam. Identificeer jezelf met
    %nickserv%.
    In de modus APPROVAL moet een IRCop de aanvraag goedkeuren.
  success: "Kanaal %channel% is geregistreerd."
  already_registered: "Kanaal %channel% is al geregistreerd of heeft een lopende registratieaanvraag."
  channel_not_on_network: "Kanaal %channel% bestaat niet op het netwerk."
  pending_deletion: "Kanaal %channel% staat op het punt verwijderd te worden en kan niet worden geregistreerd."
  insufficient_channel_rank: "Je moet minstens operatorstatus hebben op %channel% om het kanaal te registreren."
  limit_exceeded: "U heeft het maximum van %max% geregistreerde kanalen bereikt."
  throttled: "U moet %minutes% minu(u)t(en) wachten voordat u een ander kanaal registreert."

  awaiting_approval: "Registratieaanvraag voor %channel% wacht op goedkeuring door een IRCop."
  restricted_indefinite: "Nieuwe aanvragen voor %channel% zijn onbeperkt geblokkeerd."
  restricted_until: "Nieuwe aanvragen voor %channel% zijn geblokkeerd tot %date%"


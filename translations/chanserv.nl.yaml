    notice_channel: "\x0304✗\x03 \x0302%from%\x03 verwijdert \x0314%to%\x03 uit de toegangslijst"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#kanaal>"
  example: "%command_prefix%\x02\x0303DELACCESS #kanaal\x03\x0F"
  short: "Verwijder uw eigen toegang van een kanaal."
  help: |-
    Verwijdert je toegang uit de kanaallijst. Je moet geïdentificeerd zijn. De
    oprichter kan dit commando niet gebruiken.

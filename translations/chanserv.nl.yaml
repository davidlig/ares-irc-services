# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <#kanaal> <optie> [parameters]"
  example: "%command_prefix%SET #kanaal DESC Een gemeenschapskanaal"
  examples:
    - "%command_prefix%SET #kanaal URL https://example.test"
    - "%command_prefix%SET #kanaal MLOCK ON"
  short: "Wijzig kanaalopties."
  help: |-
    Wijzigt een kanaaloptie. De hulp bij elke optie beschrijft de vereisten en
    varianten.
  unknown_option: "Onbekende optie %option%. Gebruik een van: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Gebruik SET <#kanaal> FOUNDER <bijnaam> <token> met het bevestigde token van de huidige oprichter."
    token_unavailable: "De huidige oprichter heeft geen bevestigd hersteltoken. Die moet zich eerst authenticeren en VERIFY gebruiken."
    syntax: "SET <#kanaal> FOUNDER <bijnaam> [token]"
    example: "%command_prefix%SET #kanaal FOUNDER Alice"
    examples:
      - "%command_prefix%SET #kanaal FOUNDER Alice bevestigd-token"
    short: "Draag kanaal over aan een andere geregistreerde bijnaam."
    help: |-
      Wijzigt de oprichter na controle van het token van de huidige oprichter. De
      uitzondering voor beheerders op oprichtersniveau blijft behouden. Het token
      wordt niet verbruikt.
    invalid_token: "Het hersteltoken is ongeldig."
    updated: "Oprichter is gewijzigd naar %nickname%."
    throttled: "Te veel ongeldige tokens. Probeer het over %minutes% minuten opnieuw."
    must_be_registered: "%nickname% moet geregistreerd en geactiveerd zijn."
    suspended: "%nickname% is geschorst en kan niet als oprichter worden ingesteld."
    cannot_be_self: "De nieuwe oprichter kan niet de huidige oprichter zijn."
    cannot_be_successor: "De nieuwe oprichter kan niet de kanaalopvolger zijn."
    limit_exceeded: "%nickname% heeft het maximum van %max% geregistreerde kanalen bereikt."
    notice_channel: "%from% wijst %nickname% aan als kanaaloprichter."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#kanaal> SUCCESSOR [bijnaam]"
    example: "%command_prefix%SET #kanaal SUCCESSOR Alice"
    examples:
      - "%command_prefix%SET #kanaal SUCCESSOR"
    short: "Stel de kanaalopvolger in."
    help: |-
      Stelt een bijnaam in als opvolger van een kanaal. Laat de bijnaam weg om de
      huidige opvolger te verwijderen. De bijnaam moet geregistreerd en ingeschakeld
      zijn.
    cleared: "Opvolger is gewist."
    updated: "Opvolger is ingesteld op %nickname%."
    must_be_registered: "%nickname% moet geregistreerd en geactiveerd zijn."
    suspended: "%nickname% is geschorst en kan niet als opvolger worden ingesteld."
    cannot_be_founder: "De oprichter kan niet als opvolger worden ingesteld."
    notice_channel: "%from% wijst %nickname% aan als kanaalopvolger."
    notice_channel_cleared: "%from% heeft de kanaalopvolger gewist."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#kanaal> DESC <beschrijving>"
    example: "%command_prefix%SET #kanaal DESC Een gemeenschapskanaal"
    short: "Wijzig kanaalbeschrijving."
    help: "Wijzig de kanaalbeschrijving (verplicht)."
    updated: "Beschrijving bijgewerkt."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#kanaal> URL [url]"
    example: "%command_prefix%SET #kanaal URL https://example.test"
    examples:
      - "%command_prefix%SET #kanaal URL"
    short: "Stel kanaal-URL in."
    help: "Wijzigt de website-URL van een kanaal. Laat de URL weg om deze te verwijderen."
    updated: "URL bijgewerkt."
    cleared: "URL gewist."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#kanaal> EMAIL [e-mail]"
    example: "%command_prefix%SET #kanaal EMAIL team@example.test"
    examples:
      - "%command_prefix%SET #kanaal EMAIL"
    short: "Stel kanaal-e-mail in."
    help: |-
      Wijzigt het e-mailadres van een kanaal. Laat e-mail weg om het te
      verwijderen. Administratief geblokkeerde e-maildomeinen zijn niet
      toegestaan. Administratieve uitzondering: operators met toegang op
      oprichtersniveau.
    invalid: "Ongeldig e-mailadres."
    updated: "E-mail bijgewerkt."
    cleared: "E-mail gewist."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#kanaal> ENTRYMSG [bericht]"
    example: "%command_prefix%SET #kanaal ENTRYMSG Welkom"
    examples:
      - "%command_prefix%SET #kanaal ENTRYMSG"
    short: "Stel kanaal-toegangsbericht in."
    help: |-
      Stelt het welkomstbericht (NOTICE) in. Laat het bericht weg om het te
      verwijderen.
    updated: "Toegangsbericht bijgewerkt."
    too_long: "Toegangsbericht mag niet langer zijn dan %max% tekens."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#kanaal> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #kanaal TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #kanaal TOPICLOCK OFF"
    short: "Vergrendel kanaalonderwerp."
    help: |-
      Voorkomt wijzigingen aan het kanaalonderwerp. Bij inschakeling wordt het
      huidige onderwerp opgeslagen en vergrendeld.
    on: "Onderwerpvergrendeling is nu ON."
    off: "Onderwerpvergrendeling is nu OFF."
    notice_on: "%nickname% schakelt TOPICLOCK in."
    notice_off: "%nickname% schakelt TOPICLOCK uit."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#kanaal> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #kanaal MLOCK ON"
    examples:
      - "%command_prefix%SET #kanaal MLOCK OFF"
    short: "Vergrendel kanaalmodi."
    help: |-
      Vergrendelt de huidige kanaalmodi (bijv. +nt). Wanneer ON, kunnen modi niet
      worden gewijzigd.
    no_modes: "geen modi"
    on: "MLOCK is nu ON (%modes%)."
    off: "MLOCK is nu OFF."
    notice_on: "%nickname% schakelt MLOCK in (%modes%)."
    notice_off: "%nickname% schakelt MLOCK uit."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#kanaal> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #kanaal PRIVATE ON"
    examples:
      - "%command_prefix%SET #kanaal PRIVATE OFF"
    short: "Verberg kanaalinformatie voor gebruikers zonder toegang."
    help: |-
      Bij ON kunnen alleen de oprichter en gebruikers met toegang kanaalinformatie
      zien.
    on: "Kanaalinformatie is nu privé."
    off: "Kanaalinformatie is nu openbaar."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#kanaal> SECURE {ON|OFF}"
    example: "%command_prefix%SET #kanaal SECURE ON"
    examples:
      - "%command_prefix%SET #kanaal SECURE OFF"
    short: "Vereis toegangslijst voor kanaalrangen."
    help: "Voorkomt dat bijnamen buiten de toegangslijst kanaalrangen krijgen."
    on: "SECURE is nu ON."
    off: "SECURE is nu OFF."
    notice_on: "%nickname% schakelt SECURE-modus in."
    notice_off: "%nickname% schakelt SECURE-modus uit."

  # --- SET VERBOSE ---------------------------------------------------------
  verbose:
    syntax: "SET <#kanaal> VERBOSE {ON|OFF}"
    example: "%command_prefix%SET #kanaal VERBOSE ON"
    examples:
      - "%command_prefix%SET #kanaal VERBOSE OFF"
    short: "Kanaalactiemeldingen in- of uitschakelen."
    help: |-
      Schakelt NOTICE-uitzendingen naar het kanaal in of uit voor acties
      die op het kanaal worden uitgevoerd.
    on: "Kanaalactiemeldingen ingeschakeld."
    off: "Kanaalactiemeldingen uitgeschakeld."

# --- STATUS -------------------------------------------------------------------
status:
  syntax: "STATUS <#kanaal>"
  example: "%command_prefix%STATUS #canal"
  header: "Status van kanaal %channel%"

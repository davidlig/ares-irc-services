# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#kanaal> {ADD <masker> [verloop] [reden]|DEL {<masker>|<nummer>}|LIST}"
  example: "%command_prefix%\x02\x0303AKICK #kanaal ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #kanaal ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanaal DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanaal DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #kanaal LIST\x03\x0F"
  short: "Beheer auto-kick-lijst."
  help: "Beheert automatische kick-vermeldingen en hun optionele vervaltijd."
  unknown_sub: "\x0304✗\x03 Onbekende sub-opdracht \x02%sub%\x02. Gebruik ADD, DEL of LIST."
  invalid_mask: "\x0304✗\x03 Ongeldig maskerformaat. Gebruik \x02nick!ident@host\x02 met wildcards (*)."
  dangerous_mask: "\x0304✗\x03 Het masker \x02%mask%\x02 is te breed. Het moet ten minste 4 alfanumerieke tekens bevatten."
  protected_user: "\x0304✗\x03 Bijnaam \x02%nickname%\x02 heeft toegang in dit kanaal."
  max_entries: "\x0304✗\x03 Maximum %max% AKICK-vermeldingen per kanaal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#kanaal> ADD <masker> [verloop] [reden]"
    example: "%command_prefix%\x02\x0303AKICK #kanaal ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #kanaal ADD *!*@* 7d Spam\x03\x0F"
    short: "Voeg AKICK-vermelding toe."
    help: |-
      Voegt een masker toe aan de automatische kick-lijst van het kanaal.

      Je kunt een duur en reden opgeven. Als je een reden opgeeft, moet je ook
      een duur aangeven: 0 voor permanent, d voor dagen, h voor uren of m voor
      minuten.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 toegevoegd."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 bestaat al."
    notice_channel: "\x02%from%\x02 voegt AKICK toe: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#kanaal> DEL {<masker>|<nummer>}"
    example: "%command_prefix%\x02\x0303AKICK #kanaal DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #kanaal DEL 2\x03\x0F"
    short: "Verwijder AKICK-vermelding."
    help: "Verwijder op exact masker of vermeldingsnummer van LIST."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 niet gevonden."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 verwijderd."
    notice_channel: "\x02%from%\x02 verwijdert AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#kanaal> LIST"
    example: "%command_prefix%\x02\x0303AKICK #kanaal LIST\x03\x0F"
    short: "Toon AKICK-vermeldingen."
    help: "Toont masker, reden, verloop en wie heeft toegevoegd."
    header: "\x0303AKICK-lijst voor \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 Kanaal \x02%channel%\x02 heeft geen AKICK-vermeldingen."
    entry: "  #%index% %mask% %reason% (door %nickname%, verloopt: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#kanaal>"
  example: "%command_prefix%\x02\x0303RESTORE #kanaal\x03\x0F"
  short: "Een kanaal dat op verwijdering wacht herstellen."
  help: |-
    Herstelt een handmatig verwijderd kanaal als de respijtperiode nog niet is
    verstreken.
  success: "\x0303✔\x03 Kanaal \x02%channel%\x02 is hersteld."
  not_pending_deletion: "\x0304✗\x03 Kanaal \x02%channel%\x02 staat niet op het punt verwijderd te worden."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#kanaal> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #kanaal\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP #kanaal FORCE\x03\x0F"
  short: "Laat een geregistreerd kanaal vallen."
  help: |-
    Verwijdert een geregistreerd kanaal uit de database.
    FORCE verwijdert een kanaal dat wordt verwijderd definitief.
    Een IRCop met DROP-recht kan een afgewezen registratie ook
    direct vrijgeven, met of zonder FORCE. FORCE vereist ook DROP_FORCE.
  registration_restricted: "\x0304✗\x03 Deze registratieaanvraag is beperkt tot %date%."
  force:
    short: "Verwijdert een kanaal dat op verwijdering wacht definitief."
  success: "\x0303✔\x03 Kanaal \x02%channel%\x02 is gemarkeerd voor verwijdering en kan tijdens de respijtperiode worden hersteld."
  force_success: "\x0303✔\x03 Kanaal \x02%channel%\x02 is definitief verwijderd."
  pending_deletion: "\x0304✗\x03 Kanaal \x02%channel%\x02 staat al op het punt verwijderd te worden. Gebruik DROP <#kanaal> FORCE om het definitief te verwijderen."
  invalid_channel: "\x0304✗\x03 Ongeldige kanaalnaam. Gebruik \x02#kanaal\x02."
  pending_deletion_reason: "Kanaal %channel% wordt momenteel verwijderd. Meer informatie: /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#kanaal> <duur> <reden>"
  example: "%command_prefix%\x02\x0303SUSPEND #kanaal 7d Regelovertreding\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND #kanaal 0 Regelovertreding\x03\x0F"
  short: "Schors een kanaal."
  help: |-
    Schort een geregistreerd kanaal tijdelijk op. Duurformaten: 0 = permanent,
    1d, 12h, 60m.
    Tijdens de opschorting zijn kanaalmodi, toegang en handhaving uitgeschakeld.
  success: "\x0303✔\x03 Kanaal \x02%channel%\x02 is geschorst tot \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 Kanaal \x02%channel%\x02 is al geschorst."
  invalid_duration: "\x0304✗\x03 Ongeldige duur. Gebruik: 0 (permanent), 1d, 12h of 60m."
  channel_suspended: "\x0304✗\x03 Kanaal \x02%channel%\x02 is geschorst en kan niet worden gebruikt."
  notice_channel: "\x0304⚠\x03 Kanaal is geschorst. Reden: %reason%"


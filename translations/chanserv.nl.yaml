  help: |-
    Toont of een kanaal niet geregistreerd is, op goedkeuring wacht, is
    afgewezen of geregistreerd is.
    Afwijsgegevens zijn alleen zichtbaar voor de aanvrager en bevoegde IRCops.

  unregistered: "%label%%padding%: Niet geregistreerd"
  unregistered_label: "Status"
  pending: "%label%%padding%: %state%"
  pending_label: "Status"
  pending_value: "Wacht op goedkeuring"
  registered: "%label%%padding%: %state%"
  registered_label: "Status"
  registered_value: "Geregistreerd"
  suspended: "%label%%padding%: %state%"
  suspended_label: "Status"
  suspended_value: "Geschorst"
  forbidden: "%label%%padding%: %state%"
  forbidden_label: "Status"
  forbidden_value: "Verboden"
  pending_deletion: "%label%%padding%: %state%"
  pending_deletion_label: "Status"
  pending_deletion_value: "Wacht op verwijdering"
  rejected_private: "%label%%padding%: %state%"
  rejected_private_label: "Status"
  rejected_private_value: "Registratie afgewezen"
  rejected: "%label%%padding%: %state%"
  rejected_label: "Status"
  rejected_value: "Registratie afgewezen"
  rejection_reason: "%label%%padding%: %reason%"
  rejection_reason_label: "Reden"
  rejection_audit: "%label%%padding%: %operator% op %date%"
  rejection_audit_label: "Afgewezen door"
  restriction_until: "%label%%padding%: %date%"
  restriction_until_label: "Beschikbaar vanaf"
  footer: ""

# --- ACCESS -------------------------------------------------------------------
access:
  syntax: "ACCESS <#kanaal> <optie> [parameters]"
  example: "%command_prefix%ACCESS #kanaal LIST"
  examples:
    - "%command_prefix%ACCESS #kanaal ADD Alice 100"
    - "%command_prefix%ACCESS #kanaal DEL Alice"
  short: "Beheer toegangslijst."
  help: "Beheert de toegangslijst van het kanaal."
  unknown_sub: "Onbekende sub-opdracht %sub%. Gebruik LIST, ADD of DEL."
  level_range: "Toegangsniveau moet tussen %min% en %max% liggen."
  cannot_manage_level: "U kunt alleen bijnamen beheren met een niveau strikt lager dan uw eigen."
  founder_not_in_list: "De oprichter staat niet in de toegangslijst."
  max_entries: "Maximum %max% toegangsvermeldingen per kanaal."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#kanaal> LIST"
    example: "%command_prefix%ACCESS #kanaal LIST"
    short: "Toon toegangslijst (vereist ACCESSLIST-niveau)."
    help: "Toont bijnaam en niveau voor elke vermelding."
    header: "Toegangslijst voor %channel%"
    empty: "Kanaal %channel% heeft geen toegangsvermeldingen."
    entry: "#%index%: %nickname% (niveau %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#kanaal> ADD <bijnaam> <niveau>"
    example: "%command_prefix%ACCESS #kanaal ADD Alice 100"
    short: "Voeg toegangsniveau toe of werk bij (vereist ACCESSCHANGE-niveau)."
    help: "Niveau 1-499. U kunt alleen niveaus lager dan uw eigen instellen."
    done: "%nickname% ingesteld op niveau %level%."
    notice_channel: "%from% stelt %to% in op niveau %level%"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#kanaal> DEL <bijnaam>"
    example: "%command_prefix%ACCESS #kanaal DEL Alice"
    short: "Verwijder uit toegangslijst (vereist ACCESSCHANGE-niveau)."
    help: "U kunt alleen bijnamen verwijderen met een niveau lager dan uw eigen."
    not_in_list: "%nickname% staat niet in de toegangslijst."
    done: "%nickname% verwijderd uit toegangslijst."
    notice_channel: "%from% verwijdert %to% uit de toegangslijst"

# --- DELACCESS ----------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#kanaal>"
  example: "%command_prefix%DELACCESS #kanaal"
  short: "Verwijder uw eigen toegang van een kanaal."
  help: |-
    Verwijdert je toegang uit de kanaallijst. Je moet geïdentificeerd zijn. De
    oprichter kan dit commando niet gebruiken.
  done: "Uw toegang is verwijderd van %channel%."
  not_in_list: "U heeft geen toegang in %channel%."
  founder_not_in_access: "U bent de oprichter van %channel% en staat niet in de toegangslijst."
  notice_channel: "%nickname% verwijdert hun toegang van het kanaal"

# --- AKICK --------------------------------------------------------------------
akick:
  syntax: "AKICK <#kanaal> <optie> [parameters]"
  example: "%command_prefix%AKICK #kanaal ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #kanaal ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #kanaal DEL *!*@*"
    - "%command_prefix%AKICK #kanaal DEL 2"
    - "%command_prefix%AKICK #kanaal LIST"
    - "%command_prefix%AKICK #kanaal VIEW 1"
    - "%command_prefix%AKICK #kanaal CLEAR"
    - "%command_prefix%AKICK #kanaal CHECK Alice"
  short: "Beheer auto-kick-lijst."
  help: "Beheert automatische kick-vermeldingen en hun optionele vervaltijd."
  unknown_sub: "Onbekende sub-opdracht %sub%. Gebruik ADD, DEL, LIST, VIEW, CLEAR of CHECK."
  invalid_mask: "Ongeldig maskerformaat. Gebruik nick!ident@host met wildcards (*)."
  dangerous_mask: "Het masker %mask% is te breed. Het moet ten minste 4 alfanumerieke tekens bevatten."
  protected_user: "Bijnaam %nickname% heeft toegang in dit kanaal."
  max_entries: "Maximum %max% AKICK-vermeldingen per kanaal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#kanaal> ADD <masker> [verloop] [reden]"
    example: "%command_prefix%AKICK #kanaal ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #kanaal ADD *!*@* 7d Spam"
    short: "Voeg AKICK-vermelding toe."
    help: |-
      Voegt een masker toe aan de automatische kick-lijst van het kanaal.

      Je kunt een duur en reden opgeven. Als je een reden opgeeft, moet je ook
      een duur aangeven: 0 voor permanent, d voor dagen, h voor uren of m voor
      minuten.
    done: "AKICK %mask% toegevoegd."
    already_exists: "AKICK %mask% bestaat al."
    notice_channel: "%from% voegt AKICK toe: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#kanaal> DEL {<masker>|<nummer>}"
    example: "%command_prefix%AKICK #kanaal DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #kanaal DEL 2"
    short: "Verwijder AKICK-vermelding."
    help: "Verwijder op exact masker of vermeldingsnummer van LIST."
    not_found: "AKICK %mask% niet gevonden."
    done: "AKICK %mask% verwijderd."
    notice_channel: "%from% verwijdert AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#kanaal> LIST"
    example: "%command_prefix%AKICK #kanaal LIST"
    short: "Toon AKICK-vermeldingen."
    help: "Toont masker, reden, verloop en wie heeft toegevoegd."
    header: "AKICK-lijst voor %channel%"
    empty: "Kanaal %channel% heeft geen AKICK-vermeldingen."
    entry: "#%index% %mask% %reason% (door %nickname%, verloopt: %expiration%, gebruiken: %uses%)"

  # --- AKICK VIEW ----------------------------------------------------------
  view:
    syntax: "AKICK <#kanaal> VIEW {<masker>|<nummer>}"
    example: "%command_prefix%AKICK #kanaal VIEW 1"
    examples:
      - "%command_prefix%AKICK #kanaal VIEW *!*@bad.host"
    short: "Bekijk gedetailleerde AKICK-metagegevens."
    help: |-
      Toont reden, auteur, aanmaakdatum, vervaldatum,
      gebruikersteller en datum van laatste gebruik voor een autokick-vermelding.
    header: "AKICK-details voor %channel%"
    reason: "%label%%padding%: %reason%"
    reason_label: "Reden"
    author: "%label%%padding%: %author%"
    author_label: "Auteur"
    created: "%label%%padding%: %date%"
    created_label: "Aangemaakt"
    expires: "%label%%padding%: %date%"
    expires_label: "Vervalt"
    uses: "%label%%padding%: %uses%"
    uses_label: "Gebruiken"
    last_used: "%label%%padding%: %date%"
    last_used_label: "Laatst gebruikt"

  # --- AKICK CLEAR ---------------------------------------------------------
  clear:
    syntax: "AKICK <#kanaal> CLEAR"
    example: "%command_prefix%AKICK #kanaal CLEAR"
    short: "Wis alle AKICK-vermeldingen."
    help: |-
      Verwijdert alle autokick-vermeldingen uit het kanaal.
      Vereist kanaaloprichter of AKICK-niveau.
    empty: "Kanaal %channel% heeft geen AKICK-vermeldingen om te wissen."
    done: "%count% AKICK-vermeldingen gewist uit %channel%."
    notice_channel: "%from% heeft %count% AKICK-vermeldingen gewist uit %channel%"

  # --- AKICK CHECK ---------------------------------------------------------
  check:
    syntax: "AKICK <#kanaal> CHECK <bijnaam>"
    example: "%command_prefix%AKICK #kanaal CHECK Alice"
    short: "Controleer of een bijnaam overeenkomt met AKICK-vermeldingen."
    help: |-
      Controleert of een verbonden gebruiker overeenkomt met een autokick-vermelding in het kanaal.
    no_match: "%nickname% komt niet overeen met AKICK-vermeldingen in %channel%."
    not_connected: "Gebruiker %nickname% is niet verbonden."
    header: "AKICK-overeenkomsten voor %nickname% in %channel%"
    entry: "#%index% %mask% %reason%"

  # --- AKICK ENFORCE -------------------------------------------------------
  enforce:
    syntax: "AKICK <#kanaal> ENFORCE"
    example: "%command_prefix%AKICK #kanaal ENFORCE"
    short: "AKICK-regels toepassen op huidige kanaalgebruikers."
    help: |-
      Controleert gebruikers in het kanaal tegen de AKICK-lijst
      en bant en verwijdert overeenkomende gebruikers.
    no_matches: "Geen gebruikers in %channel% komen overeen met de AKICK-lijst."
    done: "%count% AKICK-verwijderingen toegepast op %channel%."
    notice_channel: "%from% heeft AKICK toegepast op %channel% (%count% gebruikers)"

# --- LEVELS -------------------------------------------------------------------
levels:
  syntax: "LEVELS <#kanaal> <optie> [parameters]"
  example: "%command_prefix%LEVELS #kanaal LIST"
  examples:
    - "%command_prefix%LEVELS #kanaal SET OPDEOP 50"
    - "%command_prefix%LEVELS #kanaal RESET"
  short: "Configureer kanaalniveaus."
  help: |-

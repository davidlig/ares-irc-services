devoice:
  syntax: "DEVOICE <#canle> <alcume>"
  example: "%command_prefix%\x02\x0303DEVOICE #canle Alicia\x03\x0F"
  short: "Retirar o modo voice na canle."
  help: "Retirar o modo voice na canle."
  done: "\x0303✔\x03 A \x02%nickname%\x02 foille retirado voice."

# --- INVITE ----------------------------------------------------------------
invite:
  syntax: "INVITE <#canle>"
  example: "%command_prefix%\x02\x0303INVITE #canle\x03\x0F"
  short: "Convidarse a si mesmo á canle."
  help: "Convidarse a si mesmo á canle."
  done: "\x0303✔\x03 Foi convidado a \x02%channel%\x02."
  notice_channel: "\x0303✔\x03 \x0302%nickname%\x03 convídase a si mesmo á canle."

# --- ADMIN -----------------------------------------------------------------
admin:
  syntax: "ADMIN <#canle> <alcume>"
  example: "%command_prefix%\x02\x0303ADMIN #canle Alicia\x03\x0F"
  short: "Conceder o modo de administrador de canle."
  help: "Concede o modo de administrador de canle. Só se o IRCd soporta +a."
  done: "\x0303✔\x03 A \x02%nickname%\x02 foille concedido administrador de canle."
  user_not_on_channel: "\x0304✗\x03 O alcume \x02%nickname%\x02 non está na rede."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 concede \x0304%mode%\x03 a \x0314%to%\x03"
  not_supported: "\x0304✗\x03 Esta rede non soporta o modo de administrador de canle (+a)."

# --- DEADMIN ---------------------------------------------------------------
deadmin:
  syntax: "DEADMIN <#canle> <alcume>"
  example: "%command_prefix%\x02\x0303DEADMIN #canle Alicia\x03\x0F"
  short: "Retirar o modo de administrador de canle."
  help: "Retirar o modo de administrador de canle."
  done: "\x0303✔\x03 A \x02%nickname%\x02 foille retirado administrador."

# --- HALFOP ----------------------------------------------------------------
halfop:
  syntax: "HALFOP <#canle> <alcume>"
  example: "%command_prefix%\x02\x0303HALFOP #canle Alicia\x03\x0F"
  short: "Conceder o modo de semioperador na canle."
  help: "Concede o modo de semioperador na canle. Só se o IRCd soporta +h."
  done: "\x0303✔\x03 A \x02%nickname%\x02 foille concedido halfop."
  user_not_on_channel: "\x0304✗\x03 O alcume \x02%nickname%\x02 non está na rede."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 concede \x0304%mode%\x03 a \x0314%to%\x03"
  not_supported: "\x0304✗\x03 Esta rede non soporta o modo halfop (+h)."

# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#canle> <alcume>"
  example: "%command_prefix%\x02\x0303DEHALFOP #canle Alicia\x03\x0F"
  short: "Retirar o modo de semioperador na canle."
  help: "Retirar o modo de semioperador na canle."
  done: "\x0303✔\x03 A \x02%nickname%\x02 foille retirado halfop."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#canle> {ADD|DEL|LIST} [máscara] [caducidade] [motivo]"
  example: "%command_prefix%\x02\x0303AKICK #canle ADD *!*@* 0\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303AKICK #canle ADD *!*@* 7d Spam\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canle DEL *!*@*\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canle DEL 2\x03\x0F"
    - "%command_prefix%\x02\x0303AKICK #canle LIST\x03\x0F"
  short: "Xestionar a lista de expulsión automática."
  help: |-
    Xestiona as entradas de expulsión automática da canle e a súa posible
    caducidade.
  unknown_sub: "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use ADD, DEL ou LIST."
  invalid_mask: "\x0304✗\x03 Formato de máscara non válido. Use \x02alcume!ident@host\x02 con comodíns (*)."
  dangerous_mask: "\x0304✗\x03 A máscara \x02%mask%\x02 é demasiado ampla. Debe conter polo menos 4 caracteres alfanuméricos."
  protected_user: "\x0304✗\x03 O alcume \x02%nickname%\x02 ten acceso nesta canle."
  max_entries: "\x0304✗\x03 Máximo %max% entradas AKICK por canle."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canle> ADD <máscara> [caducidade] [motivo]"
    example: "%command_prefix%\x02\x0303AKICK #canle ADD *!*@* 0\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canle ADD *!*@* 7d Spam\x03\x0F"
    short: "Engadir entrada AKICK."
    help: |-
      Engade unha máscara á lista de expulsión automática da canle.

      Podes indicar unha duración e un motivo. Se inclúes un motivo, tamén debes
      especificar a duración: 0 para permanente, d para días, h para horas ou m para
      minutos.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 engadida."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 xa existe."
    notice_channel: "\x02%from%\x02 engade AKICK: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canle> DEL <máscara|número>"
    example: "%command_prefix%\x02\x0303AKICK #canle DEL *!*@*\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canle DEL 2\x03\x0F"
    short: "Eliminar entrada AKICK."
    help: "Elimina pola máscara exacta ou polo número de entrada de LIST."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 non atopada."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 eliminada."
    notice_channel: "\x02%from%\x02 elimina AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canle> LIST"
    example: "%command_prefix%\x02\x0303AKICK #canle LIST\x03\x0F"
    short: "Listar entradas AKICK."
    help: "Mostra máscara, motivo, caducidade e quen a engadiu."
    header: "\x0303Lista AKICK de \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 A canle \x02%channel%\x02 non ten entradas AKICK."
    entry: "  #%index% %mask% %reason% (por %nickname%, caduca: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#canle>"
  example: "%command_prefix%\x02\x0303RESTORE #canle\x03\x0F"
  short: "Restaurar un canal pendente de eliminación."
  help: |-
    Restaura unha canle eliminada manualmente que aínda estea dentro do período
    de graza.
  success: "\x0303✔\x03 O canal \x02%channel%\x02 foi restaurado."
  not_pending_deletion: "\x0304✗\x03 O canal \x02%channel%\x02 non está pendente de eliminación."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#canle> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #canle\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303DROP #canle FORCE\x03\x0F"
  short: "Eliminar unha canle rexistrada."
  help: |-
    Elimina unha canle rexistrada da base de datos.
    FORCE elimina permanentemente unha canle pendente de eliminación.
    DROP libera unha solicitude rexeitada cando remata a restrición.
    Un IRCop autorizado pode liberar expresamente unha restrición indefinida.
  registration_restricted: "\x0304✗\x03 Esta solicitude de rexistro está restrinxida ata %date%."
  force:
    short: "Elimina permanentemente unha canle pendente de eliminación."
  success: "\x0303✔\x03 A canle \x02%channel%\x02 foi marcada para eliminación e pode ser restaurada durante o período de graza."
  force_success: "\x0303✔\x03 O canal \x02%channel%\x02 foi eliminado permanentemente."
  pending_deletion: "\x0304✗\x03 O canal \x02%channel%\x02 xa está pendente de eliminación. Use DROP <#canle> FORCE para eliminalo permanentemente."
  invalid_channel: "\x0304✗\x03 Nome de canle non válido. Use \x02#canle\x02."
  pending_deletion_reason: "A canle %channel% está en proceso de eliminación. Máis información: /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canle> <duración> <motivo>"
  example: "%command_prefix%\x02\x0303SUSPEND #canle 7d Incumprimento das normas\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND #canle 0 Incumprimento das normas\x03\x0F"
  short: "Suspender unha canle."
  help: |-
    Desactiva temporalmente unha canle rexistrada. Formatos de duración: 0 =
    permanente, 1d, 12h, 60m.
    Mentres estea suspendida, desactívanse os modos, o acceso e a aplicación das
    regras.
  success: "\x0303✔\x03 A canle \x02%channel%\x02 foi suspendida ata \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 A canle \x02%channel%\x02 xa está suspendida."
  invalid_duration: "\x0304✗\x03 Duración non válida. Use: 0 (permanente), 1d, 12h ou 60m."
  channel_suspended: "\x0304✗\x03 A canle \x02%channel%\x02 está suspendida e non se pode usar."
  notice_channel: "\x0304⚠\x03 A canle foi suspendida. Motivo: %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#canle>"
  example: "%command_prefix%\x02\x0303UNSUSPEND #canle\x03\x0F"
  short: "Levantar unha suspensión de canle."
  help: |-
    Reactiva unha canle suspendida e restaura os seus modos e a aplicación das
    regras.
  success: "\x0303✔\x03 A canle \x02%channel%\x02 xa non está suspendida."
  not_suspended: "\x0304✗\x03 A canle \x02%channel%\x02 non está suspendida."
  reason_expired: "suspensión caducada"


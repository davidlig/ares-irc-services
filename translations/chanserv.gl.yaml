# --- CLEARUSERS (IRCop) -------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#canle> [motivo]"
  example: "%command_prefix%CLEARUSERS #canle"
  examples:
    - "%command_prefix%CLEARUSERS #canle flooding"
  short: "Expulsar todos os usuarios dunha canle."
  help: |-
    Expulsa todas as persoas usuarias da canle. É exclusivo de IRCop; se non se
    indica un motivo, úsase un predeterminado.
  not_on_network: "A canle %channel% non está actualmente na rede."
  empty: "A canle %channel% non ten usuarios que expulsar."
  success: "Expulsado(s) %count% usuario(s) de %channel%."
  default_reason: "Comando CLEARUSERS"

# --- CLEARACCESS (IRCop) ------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#canle>"
  example: "%command_prefix%CLEARACCESS #canle"
  short: "Limpar toda a lista de acceso dunha canle."
  help: "Elimina todas as entradas de acceso da canle. Esta acción é irreversible."
  success: "Limpadas %count% entradas de acceso de %channel%."
  empty: "A canle %channel% non ten entradas de acceso."

# --- IRCOPONLY (IRCop) --------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#canle> {ON|OFF}"
  example: "%command_prefix%IRCOPONLY #canle ON"
  examples:
    - "%command_prefix%IRCOPONLY #canle OFF"
  short: "Restrinxir unha canle aos operadores IRC."
  help: |-
    Só as persoas operadoras IRC autorizadas poden permanecer na canle. %bot%
    encárgase de aplicar esta restrición.
  on: "IRCOPONLY activado en %channel%."
  off: "IRCOPONLY desactivado en %channel%."

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <#canle> <alcume> <descrición>"
  short: "Rexistrar administrativamente unha canle."
  help: |-
    Sintaxe: SAREGISTER <#canle> <alcume> <descrición>

    Rexistra administrativamente unha canle de xeito inmediato para o alcume
    especificado como fundador sen requirir presenza, verificación nin límites de frecuencia.
  example: "%command_prefix%SAREGISTER #canle Alicia Canle comunitaria"
  success: "A canle %channel% foi rexistrada para %founder%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#canle> {ON|OFF}"
  example: "%command_prefix%NOEXPIRE #Importante ON"
  examples:
    - "%command_prefix%NOEXPIRE #Importante OFF"
  short: "Establecer ou eliminar a protección contra caducidade dunha canle."
  help: |-
    Controla se a canle caduca por inactividade.
    ON evita a caducidade e OFF aplica as regras habituais.
  success_on: "A canle %channel% está agora protexida contra a caducidade."
  success_off: "A canle %channel% caducará normalmente agora."
  forbidden: "A canle %channel% está prohibida."
  suspended: "A canle %channel% está suspendida."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <#canle> [FORCE]"
  example: "%command_prefix%DROP #canle"
  examples:
    - "%command_prefix%DROP #canle FORCE"
  short: "Eliminar unha canle rexistrada."
  help: |-
    Elimina unha canle rexistrada da base de datos.
    FORCE elimina permanentemente unha canle pendente de eliminación.
    Un IRCop co permiso DROP tamén pode liberar inmediatamente
    solicitudes de rexistro pendentes e rexeitadas, con FORCE ou sen el.
  registration_restricted: "Esta solicitude de rexistro está restrinxida ata %date%."
  force:
    short: "Elimina permanentemente unha canle pendente de eliminación."
  success: "A canle %channel% foi marcada para eliminación e pode ser restaurada durante o período de graza."
  force_success: "O canal %channel% foi eliminado permanentemente."
  pending_deletion: "O canal %channel% xa está pendente de eliminación. Use DROP <#canle> FORCE para eliminalo permanentemente."
  invalid_channel: "Nome de canle non válido. Use %example%."
  pending_deletion_reason: "A canle %channel% está en proceso de eliminación. Máis información: /msg %bot% \x0303INFO %channel%\x03"

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <#canle>"
  example: "%command_prefix%RESTORE #canle"
  short: "Restaurar un canal pendente de eliminación."
  help: |-
    Restaura unha canle eliminada manualmente que aínda estea dentro do período
    de graza.
  success: "O canal %channel% foi restaurado."
  not_pending_deletion: "O canal %channel% non está pendente de eliminación."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canle> <duración> <motivo>"
  example: "%command_prefix%SUSPEND #canle 7d Incumprimento das normas"
  examples:
    - "%command_prefix%SUSPEND #canle 0 Incumprimento das normas"
  short: "Suspender unha canle."
  help: |-
    Desactiva temporalmente unha canle rexistrada. Formatos de duración: 0 =
    permanente, 1d, 12h, 60m.
    Mentres estea suspendida, desactívanse os modos, o acceso e a aplicación das
    regras.
  success: "A canle %channel% foi suspendida ata %duration%."
  already_suspended: "A canle %channel% xa está suspendida."
  invalid_duration: "Duración non válida. Use: 0 (permanente), 1d, 12h ou 60m."
  channel_suspended: "A canle %channel% está suspendida e non se pode usar."
  notice_channel: "A canle foi suspendida. Motivo: %reason%"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#canle>"
  example: "%command_prefix%UNSUSPEND #canle"
  short: "Levantar unha suspensión de canle."
  help: |-
    Reactiva unha canle suspendida e restaura os seus modos e a aplicación das
    regras.
  success: "A canle %channel% xa non está suspendida."
  not_suspended: "A canle %channel% non está suspendida."
  reason_expired: "suspensión caducada"

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <#canle> <motivo>"
  example: "%command_prefix%FORBID #canle Incumprimento das normas"
  short: "Prohibir que unha canle sexa usada."
  help: |-
    Prohibe o uso dunha canle, expulsa todas as persoas usuarias e impide que
    volvan entrar. Se está rexistrada, elimínase o rexistro antes de aplicar a
    prohibición.
  reason_required: "Debe especificar un motivo."
  success: "A canle %channel% foi prohibida."
  updated: "O motivo de prohibición da canle %channel% foi actualizado."
  channel_forbidden: "A canle %channel% está prohibida e non se pode usar."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#canle>"
  example: "%command_prefix%UNFORBID #canle"
  short: "Eliminar unha prohibición de canle."
  help: "Retira a prohibición dunha canle para que se poida rexistrar de novo."
  success: "A canle %channel% xa non está prohibida."
  not_forbidden: "A canle %channel% non está prohibida."

# --- HISTORY ---
history:
  syntax: "HISTORY <#canle> <opción> [parámetros]"
  example: "%command_prefix%HISTORY #canle ADD Revisión de moderación"
  examples:
    - "%command_prefix%HISTORY #canle DEL 42"
    - "%command_prefix%HISTORY #canle VIEW"
    - "%command_prefix%HISTORY #canle VIEW 2"
    - "%command_prefix%HISTORY #canle VIEW ALL"
    - "%command_prefix%HISTORY #canle CLEAR"
  short: "Ver ou xestionar o historial de accións da canle."
  help: "Xestiona o historial de accións da canle."

  # --- HISTORY ADD ---------------------------------------------------------

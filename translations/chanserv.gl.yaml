voice:
  syntax: "VOICE <#canle> <alcume>"
  example: "%command_prefix%\x02\x0303VOICE #canle Alicia\x03\x0F"
  short: "Conceder o modo voice na canle."
  help: "Conceder o modo voice na canle."
  done: "\x0303✔\x03 A \x02%nickname%\x02 foille concedido voice."
  user_not_on_channel: "\x0304✗\x03 O alcume \x02%nickname%\x02 non está na rede."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 concede \x0304%mode%\x03 a \x0314%to%\x03"


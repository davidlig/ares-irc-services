  header: "Estado da canle %channel%"
  short: "Amosar o estado do rexistro da canle."
  help: |-
    Amosa se unha canle non está rexistrada, agarda aprobación,
    foi rexeitada ou está rexistrada.
    Os detalles do rexeitamento só son visibles para a persoa solicitante
    e para IRCops autorizados.
  unregistered: "%label%%padding%: Sen rexistrar"
  unregistered_label: "Estado"
  pending: "%label%%padding%: %state%"
  pending_label: "Estado"
  pending_value: "Pendente de aprobación"
  registered: "%label%%padding%: %state%"
  registered_label: "Estado"
  registered_value: "Rexistrada"
  suspended: "%label%%padding%: %state%"
  suspended_label: "Estado"
  suspended_value: "Suspendida"
  forbidden: "%label%%padding%: %state%"
  forbidden_label: "Estado"
  forbidden_value: "Prohibida"
  pending_deletion: "%label%%padding%: %state%"
  pending_deletion_label: "Estado"
  pending_deletion_value: "Pendente de eliminación"
  rejected_private: "%label%%padding%: %state%"
  rejected_private_label: "Estado"
  rejected_private_value: "Rexistro rexeitado"
  rejected: "%label%%padding%: %state%"
  rejected_label: "Estado"
  rejected_value: "Rexistro rexeitado"
  rejection_reason: "%label%%padding%: %reason%"
  rejection_reason_label: "Razón"
  rejection_audit: "%label%%padding%: %operator% o %date%"
  rejection_audit_label: "Rexeitada por"
  restriction_until: "%label%%padding%: %date%"
  restriction_until_label: "Dispoñible a partir do"
  footer: ""

# --- ACCESS -------------------------------------------------------------------
access:
  syntax: "ACCESS <#canle> <opción> [parámetros]"
  example: "%command_prefix%ACCESS #canle LIST"
  examples:
    - "%command_prefix%ACCESS #canle ADD Alicia 100"
    - "%command_prefix%ACCESS #canle DEL Alicia"
  short: "Xestionar a lista de acceso."
  help: "Xestiona a lista de acceso da canle."
  unknown_sub: "Subcomando descoñecido %sub%. Use LIST, ADD ou DEL."
  level_range: "O nivel de acceso debe estar entre %min% e %max%."
  cannot_manage_level: "Só pode xestionar alcumes con nivel estritamente inferior ao seu propio."
  founder_not_in_list: "O fundador non está na lista de acceso."
  max_entries: "Máximo %max% entradas de acceso por canle."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#canle> LIST"
    example: "%command_prefix%ACCESS #canle LIST"
    short: "Listar a lista de acceso (require nivel ACCESSLIST)."
    help: "Mostra o alcume e nivel de cada entrada."
    header: "Lista de acceso de %channel%"
    empty: "A canle %channel% non ten entradas de acceso."
    entry: "#%index%: %nickname% (nivel %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#canle> ADD <alcume> <nivel>"
    example: "%command_prefix%ACCESS #canle ADD Alicia 100"
    short: "Engadir ou actualizar nivel de acceso (require nivel ACCESSCHANGE)."
    help: "Nivel 1-499. Só pode establecer niveis inferiores ao seu propio."
    done: "%nickname% establecido no nivel %level%."
    notice_channel: "%from% establece %to% no nivel %level%"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#canle> DEL <alcume>"
    example: "%command_prefix%ACCESS #canle DEL Alicia"
    short: "Eliminar da lista de acceso (require nivel ACCESSCHANGE)."
    help: "Só pode eliminar alcumes con nivel inferior ao seu propio."
    not_in_list: "%nickname% non está na lista de acceso."
    done: "%nickname% eliminado da lista de acceso."
    notice_channel: "%from% elimina %to% da lista de acceso"

# --- DELACCESS ----------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#canle>"
  example: "%command_prefix%DELACCESS #canle"
  short: "Eliminar o seu propio acceso dunha canle."
  help: |-
    Elimina a túa entrada da lista de acceso da canle. Debes identificarte.
    A persoa fundadora non pode usar este comando.
  done: "O seu acceso foi eliminado de %channel%."
  not_in_list: "Non ten acceso en %channel%."
  founder_not_in_access: "Vostede é o fundador de %channel% e non está na lista de acceso."
  notice_channel: "%nickname% elimina o seu acceso da canle"

# --- AKICK --------------------------------------------------------------------
akick:
  syntax: "AKICK <#canle> <opción> [parámetros]"
  example: "%command_prefix%AKICK #canle ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #canle ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #canle DEL *!*@*"
    - "%command_prefix%AKICK #canle DEL 2"
    - "%command_prefix%AKICK #canle LIST"
    - "%command_prefix%AKICK #canle VIEW 1"
    - "%command_prefix%AKICK #canle CLEAR"
    - "%command_prefix%AKICK #canle CHECK Alice"
  short: "Xestionar a lista de expulsión automática."
  help: |-
    Xestiona as entradas de expulsión automática da canle e a súa posible
    caducidade.
  unknown_sub: "Subcomando descoñecido %sub%. Use ADD, DEL, LIST, VIEW, CLEAR ou CHECK."
  invalid_mask: "Formato de máscara non válido. Use alcume!ident@host con comodíns (*)."
  dangerous_mask: "A máscara %mask% é demasiado ampla. Debe conter polo menos 4 caracteres alfanuméricos."
  protected_user: "O alcume %nickname% ten acceso nesta canle."
  max_entries: "Máximo %max% entradas AKICK por canle."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canle> ADD <máscara> [caducidade] [motivo]"
    example: "%command_prefix%AKICK #canle ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #canle ADD *!*@* 7d Spam"
    short: "Engadir entrada AKICK."
    help: |-
      Engade unha máscara á lista de expulsión automática da canle.

      Podes indicar unha duración e un motivo. Se inclúes un motivo, tamén debes
      especificar a duración: 0 para permanente, d para días, h para horas ou m para
      minutos.
    done: "AKICK %mask% engadida."
    already_exists: "AKICK %mask% xa existe."
    notice_channel: "%from% engade AKICK: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canle> DEL {<máscara>|<número>}"
    example: "%command_prefix%AKICK #canle DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #canle DEL 2"
    short: "Eliminar entrada AKICK."
    help: "Elimina pola máscara exacta ou polo número de entrada de LIST."
    not_found: "AKICK %mask% non atopada."
    done: "AKICK %mask% eliminada."
    notice_channel: "%from% elimina AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canle> LIST"
    example: "%command_prefix%AKICK #canle LIST"
    short: "Listar entradas AKICK."
    help: "Mostra máscara, motivo, caducidade e quen a engadiu."
    header: "Lista AKICK de %channel%"
    empty: "A canle %channel% non ten entradas AKICK."
    entry: "#%index% %mask% %reason% (por %nickname%, caduca: %expiration%, usos: %uses%)"

  # --- AKICK VIEW ----------------------------------------------------------
  view:
    syntax: "AKICK <#canle> VIEW {<máscara>|<número>}"
    example: "%command_prefix%AKICK #canle VIEW 1"
    examples:
      - "%command_prefix%AKICK #canle VIEW *!*@bad.host"
    short: "Ver metadatos detallados dunha entrada AKICK."
    help: |-
      Mostra motivo, autor, data de creación, data de expiración,
      contador de usos e data do último uso para unha entrada de autokick.
    header: "Detalles de AKICK para %channel%"
    reason: "%label%%padding%: %reason%"
    reason_label: "Motivo"
    author: "%label%%padding%: %author%"
    author_label: "Autor"
    created: "%label%%padding%: %date%"
    created_label: "Data creación"
    expires: "%label%%padding%: %date%"
    expires_label: "Data expiración"
    uses: "%label%%padding%: %uses%"
    uses_label: "Usos"
    last_used: "%label%%padding%: %date%"
    last_used_label: "Último uso"

  # --- AKICK CLEAR ---------------------------------------------------------
  clear:
    syntax: "AKICK <#canle> CLEAR"
    example: "%command_prefix%AKICK #canle CLEAR"
    short: "Baleirar todas as entradas AKICK."
    help: |-
      Elimina todas as entradas de expulsión automática da canle.
      Require nivel de fundador ou AKICK.
    empty: "A canle %channel% non ten entradas AKICK para baleirar."
    done: "%count% entradas AKICK baleiradas de %channel%."
    notice_channel: "%from% baleirou %count% entradas AKICK de %channel%"

  # --- AKICK CHECK ---------------------------------------------------------
  check:
    syntax: "AKICK <#canle> CHECK <alcume>"
    example: "%command_prefix%AKICK #canle CHECK Alice"
    short: "Comprobar se un alcume coincide con entradas AKICK."
    help: |-
      Comproba se un usuario conectado coincide con algunha entrada de autokick da canle.
    no_match: "%nickname% non coincide con ningunha entrada AKICK en %channel%."
    not_connected: "O usuario %nickname% non está conectado."
    header: "Coincidencias AKICK para %nickname% en %channel%"
    entry: "#%index% %mask% %reason%"

  # --- AKICK ENFORCE -------------------------------------------------------
  enforce:
    syntax: "AKICK <#canle> ENFORCE"
    example: "%command_prefix%AKICK #canle ENFORCE"
    short: "Aplica as entradas AKICK aos usuarios actuais da canle."
    help: |-
      Comproba se hai usuarios na canle que coincidan coa lista AKICK
      e expulsa e banea aos que coincidan.
    no_matches: "Ningún usuario en %channel% coincide coa lista AKICK."
    done: "Aplicáronse %count% expulsións de AKICK en %channel%."
    notice_channel: "%from% aplicou expulsións AKICK en %channel% (%count% usuarios)"

# --- LEVELS -------------------------------------------------------------------
levels:
  syntax: "LEVELS <#canle> <opción> [parámetros]"
  example: "%command_prefix%LEVELS #canle LIST"
  examples:
    - "%command_prefix%LEVELS #canle SET OPDEOP 50"
    - "%command_prefix%LEVELS #canle RESET"
  short: "Configurar os niveis da canle."
  help: |-
    Configura os niveis mínimos de acceso para as accións da canle. Só a persoa
    fundadora pode cambiar ou restablecer os niveis.
  unknown_sub: "Subcomando descoñecido %sub%. Use LIST, SET ou RESET."
  unknown_key: "Clave de nivel descoñecida %key% ou non soportada por este IRCd."
  value_range: "O valor de nivel debe estar entre %min% e %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#canle> LIST"
    example: "%command_prefix%LEVELS #canle LIST"
    short: "Listar os requisitos de nivel."
    help: "Mostra cada clave de nivel e o seu valor (predeterminado se non está definido)."
    header: "Niveis de %channel%"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#canle> SET <nivel> <valor>"

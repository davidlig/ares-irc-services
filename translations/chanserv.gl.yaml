  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#canle> DEL <id>"
    example: "%command_prefix%HISTORY #canle DEL 42"
    short: "Elimina unha entrada do historial."
    help: "Elimina unha entrada do historial polo seu ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#canle> VIEW [PÁXINA|ALL]"
    example: "%command_prefix%HISTORY #canle VIEW"
    examples:
      - "%command_prefix%HISTORY #canle VIEW 2"
      - "%command_prefix%HISTORY #canle VIEW ALL"
    short: "Ver o historial de accións da canle."
    help: "Mostra as entradas do historial da canle."
    header: "%heading% (mostrando %start%-%end% de %total%):"
    header_heading: "Historial de %channel%"
    entry: "#%id% [%date%] %action% por %operator% — %message%"
    no_entries: "Non se atoparon entradas do historial para %channel%."
    page_hint: "Use %command% para máis entradas."
    page_hint_command: "HISTORY %channel% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#canle> CLEAR"
    example: "%command_prefix%HISTORY #canle CLEAR"
    short: "Eliminar todas as entradas do historial dunha canle."
    help: "Elimina todas as entradas do historial da canle."
    success: "Limpadas %count% entradas do historial de %channel%."


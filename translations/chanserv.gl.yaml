# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#canle> <alcume>"
  example: "%command_prefix%\x02\x0303OP #canle Alicia\x03\x0F"
  short: "Conceder o modo de operador de canle."
  help: "Conceder o modo de operador de canle."
  done: "\x0303✔\x03 A \x02%nickname%\x02 foille concedido o estado de operador de canle."
  user_not_on_channel: "\x0304✗\x03 O alcume \x02%nickname%\x02 non está na rede."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 concede \x0304%mode%\x03 a \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#canle> <alcume>"
  example: "%command_prefix%\x02\x0303DEOP #canle Alicia\x03\x0F"
  short: "Retirar o modo de operador de canle."
  help: "Retirar o modo de operador de canle."
  done: "\x0303✔\x03 A \x02%nickname%\x02 foille retirado o modo de operador."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 Con SECURE activado, \x02%nickname%\x02 debe ter polo menos nivel \x02%level%\x02 para recibir \x02%mode%\x02."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#canle> <opción> [valor]"
  example: "%command_prefix%\x02\x0303SET #canle DESC Unha canle comunitaria\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303SET #canle URL https://example.test\x03\x0F"
    - "%command_prefix%\x02\x0303SET #canle MLOCK ON\x03\x0F"
  short: "Cambiar as opcións da canle."
  help: |-
    Cambia unha opción da canle. A axuda de cada opción explica os seus requisitos
    e variantes.
  unknown_option: "\x0304✗\x03 Opción descoñecida \x02%option%\x02. Use unha de: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Usa SET <#canle> FOUNDER <alcume> <token> co token confirmado do fundador actual."
    token_unavailable: "O fundador actual non ten un token de rescate confirmado. Debe autenticarse e usar VERIFY primeiro."
    syntax: "SET <#canle> FOUNDER <alcume> [token]"
    example: "%command_prefix%\x02\x0303SET #canle FOUNDER Alicia\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canle FOUNDER Alicia token-confirmado\x03\x0F"
    short: "Transferir a canle a outro alcume rexistrado."
    help: |-
      Cambia a persoa fundadora tras validar o token da persoa fundadora actual.
      Mantense a excepción administrativa de nivel fundador. O token non se consome.
    invalid_token: "O token de rescate non é válido."
    updated: "\x0303✔\x03 O fundador foi cambiado a \x02%nickname%\x02."
    throttled: "Demasiados tokens incorrectos. Téntao de novo en %minutes% minuto(s)."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 debe estar rexistrado e activado."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 está suspendido e non pode ser establecido como fundador."
    cannot_be_self: "\x0304✗\x03 O novo fundador non pode ser o fundador actual."
    cannot_be_successor: "\x0304✗\x03 O novo fundador non pode ser o sucesor da canle."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 alcanzou o máximo de %max% canles rexistradas."
    notice_channel: "\x02%from%\x02 asigna \x02%nickname%\x02 como fundador da canle."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canle> SUCCESSOR [alcume]"
    example: "%command_prefix%\x02\x0303SET #canle SUCCESSOR Alicia\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canle SUCCESSOR\x03\x0F"
    short: "Establecer o sucesor da canle."
    help: |-
      Asigna un alcume como sucesor dunha canle. Se non se indica un alcume,
      elimínase o actual. O alcume debe estar rexistrado e activado.
    cleared: "\x0303✔\x03 O sucesor foi limpo."
    updated: "\x0303✔\x03 O sucesor foi establecido como \x02%nickname%\x02."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 debe estar rexistrado e activado."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 está suspendido e non pode ser establecido como sucesor."
    cannot_be_founder: "\x0304✗\x03 O fundador non pode ser establecido como sucesor."
    notice_channel: "\x02%from%\x02 asigna \x02%nickname%\x02 como sucesor da canle."
    notice_channel_cleared: "\x02%from%\x02 limpou o sucesor da canle."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canle> DESC <descrición>"
    example: "%command_prefix%\x02\x0303SET #canle DESC Unha canle comunitaria\x03\x0F"
    short: "Cambiar a descrición da canle."
    help: "Cambia a descrición da canle (obrigatoria)."
    updated: "\x0303✔\x03 Descrición actualizada."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canle> URL [url]"
    example: "%command_prefix%\x02\x0303SET #canle URL https://example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canle URL\x03\x0F"
    short: "Establecer o URL da canle."
    help: "Cambia o enderezo web da canle. Omite o URL para eliminalo."
    updated: "\x0303✔\x03 URL actualizado."
    cleared: "\x0303✔\x03 URL limpado."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canle> EMAIL [correo]"
    example: "%command_prefix%\x02\x0303SET #canle EMAIL equipo@example.test\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canle EMAIL\x03\x0F"
    short: "Establecer o correo electrónico da canle."
    help: |-
      Cambia o correo electrónico da canle. Omite o correo para eliminalo.
      Non se admiten dominios de correo bloqueados administrativamente.
      Excepción administrativa: operadores con acceso de nivel fundador.
    invalid: "\x0304✗\x03 Enderezo de correo non válido."
    updated: "\x0303✔\x03 Correo electrónico actualizado."
    cleared: "\x0303✔\x03 Correo electrónico limpado."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canle> ENTRYMSG [mensaxe]"
    example: "%command_prefix%\x02\x0303SET #canle ENTRYMSG Benvida\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canle ENTRYMSG\x03\x0F"
    short: "Establecer a mensaxe de entrada da canle."
    help: "Establece a mensaxe de entrada (NOTICE). Omite a mensaxe para eliminala."
    updated: "\x0303✔\x03 Mensaxe de entrada actualizada."
    too_long: "\x0304✗\x03 A mensaxe de entrada non pode exceder %max% caracteres."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canle> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canle TOPICLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canle TOPICLOCK OFF\x03\x0F"
    short: "Bloquear o tema da canle."
    help: |-
      Impide cambiar o tema da canle. Ao activalo, gárdase e bloquéase o tema
      actual.
    on: "\x0303✔\x03 O bloqueo de tema está agora ON."
    off: "\x0303✔\x03 O bloqueo de tema está agora OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activa TOPICLOCK."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 desactiva TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canle> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canle MLOCK ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canle MLOCK OFF\x03\x0F"
    short: "Bloquear os modos da canle."
    help: |-
      Bloquea os modos actuais da canle (p. ex. +nt). Cando está ON, os modos non se
      poden cambiar.
    no_modes: "sen modos"
    on: "\x0303✔\x03 MLOCK está agora ON (%modes%)."
    off: "\x0303✔\x03 MLOCK está agora OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activa MLOCK (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 desactiva MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canle> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canle PRIVATE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canle PRIVATE OFF\x03\x0F"
    short: "Agochar a información da canle aos usuarios sen acceso."
    help: |-
      Cando está activado, só a persoa fundadora e as persoas con acceso poden
      consultar a información da canle.
    on: "\x0303✔\x03 A información da canle agora é privada."
    off: "\x0303✔\x03 A información da canle agora é pública."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canle> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canle SECURE ON\x03\x0F"
    examples:
      - "%command_prefix%\x02\x0303SET #canle SECURE OFF\x03\x0F"
    short: "Esixir lista de acceso para rangos de canle."
    help: "Impide asignar rangos na canle a alcumes que non estean na lista de acceso."
    on: "\x0303✔\x03 SECURE está agora ON."
    off: "\x0303✔\x03 SECURE está agora OFF."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activa o modo SECURE."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 desactiva o modo SECURE."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#canle> {ADD|DEL|LIST} [alcume] [nivel]"
  example: "%command_prefix%\x02\x0303ACCESS #canle LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #canle ADD Alicia 100\x03\x0F"
    - "%command_prefix%\x02\x0303ACCESS #canle DEL Alicia\x03\x0F"
  short: "Xestionar a lista de acceso."
  help: "Xestiona a lista de acceso da canle."
  unknown_sub: "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use LIST, ADD ou DEL."
  level_range: "\x0304✗\x03 O nivel de acceso debe estar entre %min% e %max%."
  cannot_manage_level: "\x0304✗\x03 Só pode xestionar alcumes con nivel estritamente inferior ao seu propio."
  founder_not_in_list: "\x0304✗\x03 O fundador non está na lista de acceso."
  max_entries: "\x0304✗\x03 Máximo %max% entradas de acceso por canle."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#canle> LIST"
    example: "%command_prefix%\x02\x0303ACCESS #canle LIST\x03\x0F"
    short: "Listar a lista de acceso (require nivel ACCESSLIST)."
    help: "Mostra o alcume e nivel de cada entrada."
    header: "\x0303Lista de acceso de \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 A canle \x02%channel%\x02 non ten entradas de acceso."
    entry: "  #%index%: %nickname% (nivel %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#canle> ADD <alcume> <nivel>"
    example: "%command_prefix%\x02\x0303ACCESS #canle ADD Alicia 100\x03\x0F"
    short: "Engadir ou actualizar nivel de acceso (require nivel ACCESSCHANGE)."
    help: "Nivel 1-499. Só pode establecer niveis inferiores ao seu propio."
    done: "\x0303✔\x03 \x02%nickname%\x02 establecido no nivel %level%."
    notice_channel: "\x0303✔\x03 \x0302%from%\x03 establece \x0314%to%\x03 no nivel \x0304%level%\x03"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#canle> DEL <alcume>"
    example: "%command_prefix%\x02\x0303ACCESS #canle DEL Alicia\x03\x0F"
    short: "Eliminar da lista de acceso (require nivel ACCESSCHANGE)."
    help: "Só pode eliminar alcumes con nivel inferior ao seu propio."
    not_in_list: "\x0304✗\x03 \x02%nickname%\x02 non está na lista de acceso."
    done: "\x0303✔\x03 \x02%nickname%\x02 eliminado da lista de acceso."
    notice_channel: "\x0304✗\x03 \x0302%from%\x03 elimina \x0314%to%\x03 da lista de acceso"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#canle>"
  example: "%command_prefix%\x02\x0303DELACCESS #canle\x03\x0F"
  short: "Eliminar o seu propio acceso dunha canle."
  help: |-
    Elimina a túa entrada da lista de acceso da canle. Debes identificarte.
    A persoa fundadora non pode usar este comando.
  done: "\x0303✔\x03 O seu acceso foi eliminado de \x02%channel%\x02."
  not_in_list: "\x0304✗\x03 Non ten acceso en \x02%channel%\x02."
  founder_not_in_access: "\x0304✗\x03 Vostede é o fundador de \x02%channel%\x02 e non está na lista de acceso."
  notice_channel: "\x0304✗\x03 \x0302%nickname%\x03 elimina o seu acceso da canle"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#canle> {LIST|SET|RESET} [nivel] [valor]"
  example: "%command_prefix%\x02\x0303LEVELS #canle LIST\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #canle SET OPDEOP 50\x03\x0F"
    - "%command_prefix%\x02\x0303LEVELS #canle RESET\x03\x0F"
  short: "Configurar os niveis da canle."
  help: |-
    Configura os niveis mínimos de acceso para as accións da canle. Só a persoa
    fundadora pode cambiar ou restablecer os niveis.
  unknown_sub: "\x0304✗\x03 Subcomando descoñecido \x02%sub%\x02. Use LIST, SET ou RESET."
  unknown_key: "\x0304✗\x03 Clave de nivel descoñecida \x02%key%\x02 ou non soportada por este IRCd."
  value_range: "\x0304✗\x03 O valor de nivel debe estar entre %min% e %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#canle> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #canle LIST\x03\x0F"
    short: "Listar os requisitos de nivel."
    help: "Mostra cada clave de nivel e o seu valor (predeterminado se non está definido)."
    header: "\x0303Niveis de %channel%\x03"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#canle> SET <nivel> <valor>"
    example: "%command_prefix%\x02\x0303LEVELS #canle SET OPDEOP 50\x03\x0F"
    short: "Establecer un requisito de nivel."
    help: "Valor -1 a 499. Só fundador."
    done: "\x0303✔\x03 \x02%key%\x02 establecido en %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#canle> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #canle RESET\x03\x0F"
    short: "Restablecer todos os niveis aos valores predeterminados."
    help: "Elimina todas as modificacións. Só fundador."
    done: "\x0303✔\x03 Todos os niveis restablecidos aos valores predeterminados."


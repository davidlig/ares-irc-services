# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <#canle> <opción> [parámetros]"
  example: "%command_prefix%SET #canle DESC Unha canle comunitaria"
  examples:
    - "%command_prefix%SET #canle URL https://example.test"
    - "%command_prefix%SET #canle MLOCK ON"
  short: "Cambiar as opcións da canle."
  help: |-
    Cambia unha opción da canle. A axuda de cada opción explica os seus requisitos
    e variantes.
  unknown_option: "Opción descoñecida %option%. Use unha de: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Usa SET <#canle> FOUNDER <alcume> <token> co token confirmado do fundador actual."
    token_unavailable: "O fundador actual non ten un token de rescate confirmado. Debe autenticarse e usar VERIFY primeiro."
    syntax: "SET <#canle> FOUNDER <alcume> [token]"
    example: "%command_prefix%SET #canle FOUNDER Alicia"
    examples:
      - "%command_prefix%SET #canle FOUNDER Alicia token-confirmado"
    short: "Transferir a canle a outro alcume rexistrado."
    help: |-
      Cambia a persoa fundadora tras validar o token da persoa fundadora actual.
      Mantense a excepción administrativa de nivel fundador. O token non se consome.
    invalid_token: "O token de rescate non é válido."
    updated: "O fundador foi cambiado a %nickname%."
    throttled: "Demasiados tokens incorrectos. Téntao de novo en %minutes% minuto(s)."
    must_be_registered: "%nickname% debe estar rexistrado e activado."
    suspended: "%nickname% está suspendido e non pode ser establecido como fundador."
    cannot_be_self: "O novo fundador non pode ser o fundador actual."
    cannot_be_successor: "O novo fundador non pode ser o sucesor da canle."
    limit_exceeded: "%nickname% alcanzou o máximo de %max% canles rexistradas."
    notice_channel: "%from% asigna %nickname% como fundador da canle."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canle> SUCCESSOR [alcume]"
    example: "%command_prefix%SET #canle SUCCESSOR Alicia"
    examples:
      - "%command_prefix%SET #canle SUCCESSOR"
    short: "Establecer o sucesor da canle."
    help: |-
      Asigna un alcume como sucesor dunha canle. Se non se indica un alcume,
      elimínase o actual. O alcume debe estar rexistrado e activado.
    cleared: "O sucesor foi limpo."
    updated: "O sucesor foi establecido como %nickname%."
    must_be_registered: "%nickname% debe estar rexistrado e activado."
    suspended: "%nickname% está suspendido e non pode ser establecido como sucesor."
    cannot_be_founder: "O fundador non pode ser establecido como sucesor."
    notice_channel: "%from% asigna %nickname% como sucesor da canle."
    notice_channel_cleared: "%from% limpou o sucesor da canle."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canle> DESC <descrición>"
    example: "%command_prefix%SET #canle DESC Unha canle comunitaria"
    short: "Cambiar a descrición da canle."
    help: "Cambia a descrición da canle (obrigatoria)."
    updated: "Descrición actualizada."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canle> URL [url]"
    example: "%command_prefix%SET #canle URL https://example.test"
    examples:
      - "%command_prefix%SET #canle URL"
    short: "Establecer o URL da canle."
    help: "Cambia o enderezo web da canle. Omite o URL para eliminalo."
    updated: "URL actualizado."
    cleared: "URL limpado."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canle> EMAIL [correo]"
    example: "%command_prefix%SET #canle EMAIL equipo@example.test"
    examples:
      - "%command_prefix%SET #canle EMAIL"
    short: "Establecer o correo electrónico da canle."
    help: |-
      Cambia o correo electrónico da canle. Omite o correo para eliminalo.
      Non se admiten dominios de correo bloqueados administrativamente.
      Excepción administrativa: operadores con acceso de nivel fundador.
    invalid: "Enderezo de correo non válido."
    updated: "Correo electrónico actualizado."
    cleared: "Correo electrónico limpado."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canle> ENTRYMSG [mensaxe]"
    example: "%command_prefix%SET #canle ENTRYMSG Benvida"
    examples:
      - "%command_prefix%SET #canle ENTRYMSG"
    short: "Establecer a mensaxe de entrada da canle."
    help: "Establece a mensaxe de entrada (NOTICE). Omite a mensaxe para eliminala."
    updated: "Mensaxe de entrada actualizada."
    too_long: "A mensaxe de entrada non pode exceder %max% caracteres."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canle> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #canle TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #canle TOPICLOCK OFF"
    short: "Bloquear o tema da canle."
    help: |-
      Impide cambiar o tema da canle. Ao activalo, gárdase e bloquéase o tema
      actual.
    on: "O bloqueo de tema está agora ON."
    off: "O bloqueo de tema está agora OFF."
    notice_on: "%nickname% activa TOPICLOCK."
    notice_off: "%nickname% desactiva TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canle> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #canle MLOCK ON"
    examples:
      - "%command_prefix%SET #canle MLOCK OFF"
    short: "Bloquear os modos da canle."
    help: |-
      Bloquea os modos actuais da canle (p. ex. +nt). Cando está ON, os modos non se
      poden cambiar.
    no_modes: "sen modos"
    on: "MLOCK está agora ON (%modes%)."
    off: "MLOCK está agora OFF."
    notice_on: "%nickname% activa MLOCK (%modes%)."
    notice_off: "%nickname% desactiva MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canle> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #canle PRIVATE ON"
    examples:
      - "%command_prefix%SET #canle PRIVATE OFF"
    short: "Agochar a información da canle aos usuarios sen acceso."
    help: |-
      Cando está activado, só a persoa fundadora e as persoas con acceso poden
      consultar a información da canle.
    on: "A información da canle agora é privada."
    off: "A información da canle agora é pública."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canle> SECURE {ON|OFF}"
    example: "%command_prefix%SET #canle SECURE ON"
    examples:
      - "%command_prefix%SET #canle SECURE OFF"
    short: "Esixir lista de acceso para rangos de canle."
    help: "Impide asignar rangos na canle a alcumes que non estean na lista de acceso."
    on: "SECURE está agora ON."
    off: "SECURE está agora OFF."
    notice_on: "%nickname% activa o modo SECURE."
    notice_off: "%nickname% desactiva o modo SECURE."

  # --- SET VERBOSE ---------------------------------------------------------
  verbose:
    syntax: "SET <#canle> VERBOSE {ON|OFF}"
    example: "%command_prefix%SET #canle VERBOSE ON"
    examples:
      - "%command_prefix%SET #canle VERBOSE OFF"
    short: "Alternar notificacións de accións da canle."
    help: |-
      Activa ou desactiva as emisións NOTICE á canle para as accións
      realizadas nela.
    on: "Notificacións de accións da canle activadas."
    off: "Notificacións de accións da canle desactivadas."

# --- STATUS -------------------------------------------------------------------
status:
  syntax: "STATUS <#channel>"

ircoponly:
  syntax: "IRCOPONLY <#canle> {ON|OFF}"
  example: "%command_prefix%\x02\x0303IRCOPONLY #canle ON\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303IRCOPONLY #canle OFF\x03\x0F"
  short: "Restrinxir unha canle aos operadores IRC."
  help: |-
    Só as persoas operadoras IRC autorizadas poden permanecer na canle. %bot%
    encárgase de aplicar esta restrición.
  on: "IRCOPONLY activado en %channel%."
  off: "IRCOPONLY desactivado en %channel%."

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#canle> {ON|OFF}"
  example: "%command_prefix%\x02\x0303NOEXPIRE #Importante ON\x03\x0F"

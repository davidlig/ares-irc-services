  short: "Rexistrar unha canle."
  help: |-
    Rexistra unha canle e asóciana ao teu alcume. Debes estar
    identificado con %nickserv%. No modo APPROVAL, un IRCop debe
    aprobar a solicitude.
  success: "A canle %channel% foi rexistrada."
  already_registered: "A canle %channel% xa está rexistrada ou ten unha solicitude de rexistro en curso."
  channel_not_on_network: "A canle %channel% non existe na rede."
  pending_deletion: "O canal %channel% está pendente de eliminación e non se pode rexistrar."
  insufficient_channel_rank: "Debes ter polo menos estado de operador en %channel% para rexistrala."
  limit_exceeded: "Alcanzou o máximo de %max% canles rexistradas."
  throttled: "Debe agardar %minutes% minuto(s) antes de rexistrar outra canle."

  awaiting_approval: "A solicitude de %channel% agarda a aprobación dun IRCop."
  restricted_indefinite: "As novas solicitudes para %channel% están bloqueadas indefinidamente."
  restricted_until: "As novas solicitudes para %channel% están bloqueadas ata %date%"


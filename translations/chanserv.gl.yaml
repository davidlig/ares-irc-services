  suspended_status: "%label%%padding%: %state%"
  suspended_status_label: "Estado"
  suspended_status_value: "Suspendida"
  suspended_reason: "%label%%padding%: %reason%"
  suspended_reason_label: "Motivo"
  suspended_until: "%label%%padding%: %date%"
  suspended_until_label: "Finaliza o"
  suspended_permanent: "%label%%padding%: Permanente"
  suspended_permanent_label: "Finaliza o"
  forbidden_status: "%label%%padding%: %state%"
  forbidden_status_label: "Estado"
  forbidden_status_value: "Prohibida"
  forbidden_reason: "%label%%padding%: %reason%"

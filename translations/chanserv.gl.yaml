# Traducións de ChanServ — Galego
# Dominio: chanserv
#
# Códigos de formato IRC (comiñas dobres ou bloques literais !irc):
#   \x02        activa/desactiva a negra
#   \x03NN      cor (DECIMAL: 03=verde, 04=vermello, 07=laranxa, 14=gris escuro)
#   \x03        restablece a cor
#   \x0F        restablece todo o formato
#
# As cores IRC usan números DECIMAIS (0-15), non hexadecimais.
#   \x0314 = gris escuro (14 decimal): CORRECTO
#   \x030F = cor 0 seguida da letra F: ERRO
#
# Texto IRC multiliña: !irc |- con saltos físicos e espazos reais.
# Os bloques sen etiqueta non descodifican escapes; conserva os literais CTCP.
# Exemplos HELP: example/examples e %command_prefix%.
# O presentador engade /msg sen cor e unha marxe de dous espazos.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Nome de canle non válido. Use \x02#canle\x02."
  generic: "\x0304✗\x03 Produciuse un erro. Tenteo de novo."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#canle> <descrición>"
  example: "%command_prefix%\x02\x0303REGISTER #canle Proxecto comunitario\x03\x0F"
  short: "Rexistrar unha canle."
  help: |-
    Rexistra unha canle e asóciana ao teu alcume. Debes estar
    identificado con %nickserv%. No modo APPROVAL, un IRCop debe
    aprobar a solicitude.
  success: "\x0303✔\x03 A canle \x02%channel%\x02 foi rexistrada."
  already_registered: "\x0304✗\x03 O canal \x02%channel%\x02 xa está rexistrado."
  channel_not_on_network: "\x0304✗\x03 A canle \x02%channel%\x02 non existe na rede."
  pending_deletion: "\x0304✗\x03 O canal \x02%channel%\x02 está pendente de eliminación e non se pode rexistrar."
  insufficient_channel_rank: "\x0304✗\x03 Debes ter polo menos estado de operador en \x02%channel%\x02 para rexistrala."
  limit_exceeded: "\x0304✗\x03 Alcanzou o máximo de %max% canles rexistradas."
  throttled: "\x0304✗\x03 Debe agardar \x02%minutes%\x02 minuto(s) antes de rexistrar outra canle."

  awaiting_approval: "\x0307✔\x03 A solicitude de %channel% agarda a aprobación dun IRCop."
  restricted_indefinite: "\x0304✗\x03 As novas solicitudes para \x02%channel%\x02 están bloqueadas indefinidamente."
  restricted_until: "\x0304✗\x03 As novas solicitudes para \x02%channel%\x02 están bloqueadas ata %date%"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%\x02\x0303REGMODE APPROVAL\x03\x0F"
  short: "Establecer ou consultar o modo de rexistro das canles."
  help: |-
    Establece DIRECT ou APPROVAL, ou consulta STATUS.
    DIRECT é o modo predeterminado e mantén o rexistro inmediato.
  status: "\x0307ℹ\x03 O modo de rexistro da canle é %mode%."
  changed: "\x0303✔\x03 O modo de rexistro da canle agora é %mode%."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [page]|ACCEPT <#channel>|REJECT <#channel> <reason>}"
  pending.syntax: "CREG PENDING [page]"
  pending.example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  pending.short: "Lista as solicitudes pendentes nunha páxina limitada."
  pending.help: "Lista as solicitudes pendentes nunha páxina limitada."
  accept.syntax: "CREG ACCEPT <#channel>"
  accept.example: "%command_prefix%\x02\x0303CREG ACCEPT #channel\x03\x0F"
  accept.short: "Aprobar unha solicitude de rexistro de canle."
  accept.help: "Volver validar a solicitude e activar o rexistro pendente."
  reject.syntax: "CREG REJECT <#channel> <reason>"
  reject.example: "%command_prefix%\x02\x0303CREG REJECT #channel Precisa un tema público\x03\x0F"
  reject.short: "Rexeitar unha solicitude de rexistro de canle."
  reject.help: "Rexeita unha solicitude cun motivo obrigatorio e unha restrición."
  example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  short: "Revisar as solicitudes de rexistro de canles."
  help: |-
    Lista as solicitudes pendentes ou acepta ou rexeita unha.
    Os rexeitamentos requiren un motivo. Só ACCEPT rexistra a canle.
  pending_header: "\x0314Rexistros pendentes (páxina %page%)\x03"
  pending_item: "  %channel% — solicitante %requester%, enviada o %submitted%: %description%"
  accepted: "\x0303✔\x03 O rexistro de %channel% foi aprobado."
  rejected: "\x0307✔\x03 O rexistro de %channel% foi rexeitado."
  not_pending: "\x0304✗\x03 %channel% non ten ningunha solicitude de rexistro pendente."
  channel_not_on_network: "\x0304✗\x03 A canle %channel% non está na rede."
  founder_limit: "\x0304✗\x03 A persoa solicitante alcanzou o límite de rexistro de canles."
  requester_inactive: "\x0304✗\x03 A conta solicitante xa non está activa."
  requester_ineligible: "\x0304✗\x03 A persoa solicitante debe ter agora estado de operador na canle."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <#channel>"
  example: "%command_prefix%\x02\x0303STATUS #channel\x03\x0F"
  short: "Amosar o estado do rexistro da canle."
  help: |-
    Amosa se unha canle non está rexistrada, agarda aprobación,
    foi rexeitada ou está rexistrada.
    Os detalles do rexeitamento só son visibles para a persoa solicitante
    e para IRCops autorizados.
  unregistered: "\x0314%channel% non está rexistrada.\x03"
  pending: "\x0314%channel% agarda a aprobación dun IRCop.\x03"
  registered: "\x0314%channel% está rexistrada.\x03"
  suspended: "\x0314%channel% está rexistrada pero suspendida.\x03"
  forbidden: "\x0314%channel% non se pode rexistrar.\x03"
  pending_deletion: "\x0314%channel% está pendente de eliminación.\x03"
  rejected_private: "\x0314A solicitude de rexistro de %channel% foi rexeitada.\x03"
  rejected: "\x0314A solicitude de rexistro de %channel% foi rexeitada.\x03"
  rejection_reason: "  \x0314Motivo\x03: %reason%"
  rejection_audit: "  \x0314Rexeitada por\x03: %operator% o %date%"
  restriction_indefinite: "  \x0314As novas solicitudes están bloqueadas indefinidamente.\x03"
  restriction_until: "  \x0314As novas solicitudes están bloqueadas ata %date%\x03"
  restriction_expired: "  \x0314A restrición de rexistro rematou o %date%.\x03"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#canle>"
  example: "%command_prefix%\x02\x0303INFO #canle\x03\x0F"
  short: "Mostrar información da canle."
  help: |-
    Amosa información detallada dunha canle rexistrada, incluídos o propietario,
    os datos de rexistro, a última actividade e as opcións de configuración.
  header: "\x02Información da canle \x0307%channel%\x03\x02"
  founder: "  \x0314Fundador\x03        : \x02%nickname%\x02"
  registered: "  \x0314Rexistrada\x03      : %date%"
  successor: "  \x0314Sucesor\x03         : \x02%nickname%\x02"
  description: "  \x0314Descrición\x03      : %desc%"
  url: "  \x0314URL\x03             : %url%"
  email: "  \x0314Correo-e\x03        : %email%"
  last_used: "  \x0314Último uso\x03      : %date%"
  topic: "  \x0314Último tema\x03     : %topic%"
  topic_set_by: "  \x0314Tema posto por\x03  : %nickname%"
  options: "  \x0314Opcións\x03         : %options%"
  private: "\x0304✗\x03 A información da canle \x02%channel%\x02 é privada."
  no_expire: "  \x0314Nunca caduca\x03    : Si"
  mlock_modes: "  \x0314Bloqueo modos\x03   : %modes%"
  suspended_status: "  \x0314Estado\x03          : \x0304Suspendida\x03"
  suspended_reason: "  \x0314Motivo\x03          : %reason%"
  suspended_until: "  \x0314Finaliza o\x03      : %date%"
  suspended_permanent: "  \x0314Finaliza o\x03      : Permanente"
  forbidden_status: "  \x0314Estado\x03          : \x0304Prohibida\x03"
  forbidden_reason: "  \x0314Motivo\x03          : %reason%"
  pending_deletion_status: "  \x0314Estado\x03             : \x0307En proceso de eliminación\x03"
  pending_deletion_at: "  \x0314Eliminado\x03          : %date%"
  pending_deletion_until: "  \x0314Elim. definitiva\x03   : %date%"
  pending_deletion_notice: "  \x0307Esta canle está conxelada e non pode ser rexistrada.\x03"


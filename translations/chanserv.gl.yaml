clearaccess:
  syntax: "CLEARACCESS <#canle>"
  example: "%command_prefix%\x02\x0303CLEARACCESS #canle\x03\x0F"
  short: "Limpar toda a lista de acceso dunha canle."
  help: "Elimina todas as entradas de acceso da canle. Esta acción é irreversible."
  success: "\x0303✔\x03 Limpadas \x02%count%\x02 entradas de acceso de \x02%channel%\x02."
  empty: "\x0307ℹ\x03 A canle \x02%channel%\x02 non ten entradas de acceso."

# --- CLEARUSERS ------------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#canle> [motivo]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #canle\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #canle flooding\x03\x0F"
  short: "Expulsar todos os usuarios dunha canle."
  help: |-
    Expulsa todas as persoas usuarias da canle. É exclusivo de IRCop; se non se
    indica un motivo, úsase un predeterminado.
  not_on_network: "\x0304✗\x03 A canle \x02%channel%\x02 non está actualmente na rede."
  empty: "\x0307ℹ\x03 A canle \x02%channel%\x02 non ten usuarios que expulsar."
  success: "\x0303✔\x03 Expulsado(s) \x02%count%\x02 usuario(s) de \x02%channel%\x02."
  default_reason: "Comando CLEARUSERS"

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST <patrón> [páxina]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0F"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0F"
  short: "Lista as canles rexistradas que coinciden cun patrón."
  help: |-
    Lista as canles rexistradas que coinciden co patrón indicado. O comodín *
    coincide con calquera secuencia de caracteres. A páxina é opcional e comeza en
    1.
  header: "Canle | Fundador | Rexistro | Último uso | Estado"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Ningunha canle coincide co patrón %pattern%."
  status_active: "Activa"
  status_pending_registration: "Agardando aprobación"
  status_rejected_registration: "Rexistro rexeitado"

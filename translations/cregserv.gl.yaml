# CReG translations — Galician
# Domain: cregserv

unknown_command: "\x0304✗\x03 Comando descoñecido \x02%command%\x02. Usa \x0303/msg %bot% HELP\x03."

error:
  syntax: "\x0304✗\x03 Sintaxe incorrecta. Uso: \x02%syntax%\x02"
  oper_only: "\x0304✗\x03 Este comando está restrinxido aos operadores de IRC."
  not_identified: "\x0304✗\x03 Non estás identificado. Usa \x0303/msg %nickserv% IDENTIFY\x03."
  permission_denied: "\x0304✗\x03 Permiso denegado. Non tes acceso a este comando."

registra:
  syntax: "REGISTRA <#canle> <descrición>"
  short: "Solicita a aprobación do rexistro dunha canle."
  help: "Solicita o rexistro dunha canle nova. Un operador de servizos revisa a solicitude e a aproba ou a denega; a canle só se rexistra unha vez aprobada. Debes estar identificado con %nickserv%.\n\n\x02#canle:\x02 A canle a rexistrar. Debe comezar por #, non pode estar xa rexistrada (comproba coa orde ESTADO) e debe ter como máximo 64 caracteres incluíndo o #.\n\n\x02descrición:\x02 O tema ou o propósito da canle, ata 255 caracteres. É o que o operador ten en conta ao revisar a solicitude.\n\nUnha vez enviada, a solicitude queda pendente até que un operador de servizos a aprove ou a denegue. Só podes enviar unha solicitude cada 24 horas."
  example: "/msg CReG REGISTRA #mychannel un lugar para conversar"
  requested: "\x0303✔\x03 Solicitaches o rexistro da canle \x02%channel%\x02. Un operador de servizos avaliará a solicitude."
  invalid_channel: "\x0304✗\x03 O nome da canle debe empezar por un \x02#\x02."
  channel_too_long: "\x0304✗\x03 O nome da canle é demasiado longo: como máximo \x0264\x02 caracteres incluído o \x02#\x02."
  description_too_long: "\x0304✗\x03 A descrición é demasiado longa: como máximo \x02255\x02 caracteres."
  already_registered: "\x0304✗\x03 A canle \x02%channel%\x02 xa está rexistrada."
  pending_deletion: "\x0304✗\x03 A canle \x02%channel%\x02 estase eliminando e non pode ser rexistrada ata que se complete a eliminación."
  duplicate: "\x0304✗\x03 Xa existe unha solicitude de rexistro para \x02%channel%\x02 á espera de aprobación. Usa \x0303/msg %bot% ESTADO %channel%\x03."
  denied: "\x0304✗\x03 A solicitude de rexistro de \x02%channel%\x02 foi denegada."
  throttled: "\x0304✗\x03 Debes esperar \x02%minutes%\x02 minuto(s) antes de solicitar outra canle."

estado:
  syntax: "ESTADO <#canle>"
  short: "Amosa o estado de rexistro dunha canle."
  help: "Indica en que punto se atopa unha canle dentro do proceso de rexistro.\n\nOs estados posibles son:\n    \x02REXISTRADA\x02: a canle xa está rexistrada con %chanserv%.\n    \x02EN REVISIÓN\x02: unha solicitude de rexistro espera a que un operador de servizos a aprove ou a denegue.\n    \x02DENEGADA\x02: a solicitude de rexistro foi denegada.\n    \x02EN ELIMINACIÓN\x02: a canle foi dada de baixa e está no seu período de graza de eliminación; non pode rexistrarse de novo até que remate a eliminación.\n    \x02SEN PROCESO\x02: a canle non ten ningún proceso de rexistro."
  example: "/msg CReG ESTADO #mychannel"
  registered: "\x0303✔\x03 A canle \x02%channel%\x02 xa está rexistrada."
  pending_deletion: "\x0304✗\x03 A canle \x02%channel%\x02 estase eliminando e non pode ser rexistrada ata que se complete a eliminación."
  pending: "\x0303◌\x03 A canle \x02%channel%\x02 está en proceso, á espera da revisión dun operador de servizos (solicitada o %date%)."
  denied: "\x0304✗\x03 A canle \x02%channel%\x02 está denegada desde o %date%. Motivo: %reason%"
  no_request: "\x0304✗\x03 A canle \x02%channel%\x02 non ten ningún proceso de rexistro."

cancel:
  syntax: "CANCEL <#canle>"
  short: "Cancela a túa solicitude de rexistro pendente dunha canle."
  help: "Cancela unha solicitude de rexistro de canle que aínda non foi aprobada nin denegada. Só podes cancelar as túas propias solicitudes pendentes.\n\n\x02#canle:\x02 A canle da solicitude que queres cancelar. A solicitude debe ser a que ti enviaches e debe seguir pendente.\n\nUnha vez cancelada, a solicitude elimínase e o nome da canle queda libre."
  example: "/msg CReG CANCEL #mychannel"
  cancelled: "\x0303✔\x03 A túa solicitude de rexistro da canle \x02%channel%\x02 foi cancelada e o nome da canle volve estar libre."
  invalid_channel: "\x0304✗\x03 O nome da canle debe comezar por \x02#\x02."
  no_request: "\x0304✗\x03 A canle \x02%channel%\x02 non ten ningún proceso de rexistro."
  not_yours: "\x0304✗\x03 A solicitude de rexistro de \x02%channel%\x02 non é túa."
  not_pending: "\x0304✗\x03 A solicitude de rexistro de \x02%channel%\x02 xa foi aprobada ou denegada e non pode cancelarse."

aprobar:
  syntax: "APROBAR <#canle>"
  short: "Aprueba unha solicitude de rexistro de canle pendente."
  help: "Rexistra unha canle cuxa solicitude está á espera de revisión. A canle rexístrase a nome de quen a solicitou; ningún dos dous ten que estar dentro. Necesitas o permiso \x02cregserv.aprobar\x02.\n\n\x02#canle:\x02 A canle coa solicitude pendente. Usa PENDIENTES para ver a cola.\n\nUnha vez aprobada, a canle queda rexistrada en \x02%chanserv%\x02 e a solicitude péchase."
  example: "/msg CReG APROBAR #canle"
  approved: "\x0303✔\x03 A canle \x02%channel%\x02 foi rexistrada correctamente para \x02%founder%\x02."
  invalid_channel: "\x0304✗\x03 O nome da canle debe empezar por un \x02#\x02."
  no_pending: "\x0304✗\x03 A canle \x02%channel%\x02 non está en proceso de rexistro."
  already_registered: "\x0304✗\x03 A canle \x02%channel%\x02 xa está rexistrada con \x02%chanserv%\x02."
  already_approved: "\x0304✗\x03 A canle \x02%channel%\x02 xa está rexistrada."
  already_denied: "\x0304✗\x03 A canle \x02%channel%\x02 non pode ser rexistrada porque está marcada como \x0304DENEGADO\x03."
  failed: "\x0304✗\x03 Non se puido completar o rexistro da canle \x02%channel%\x02."

denegar:
  syntax: "DENEGAR <#canle> <motivo>"
  short: "Denega unha solicitude de rexistro de canle pendente."
  help: "Denega unha solicitude de rexistro deixando libre o nome da canle. O motivo é obrigatorio e móstrase en DENEGADOS. Necesitas o permiso \x02cregserv.denegar\x02.\n\n\x02#canle:\x02 A canle coa solicitude pendente.\n\x02motivo:\x02 Por que se denega a solicitude; gárdase e móstralle a calquera que consulte DENEGADOS.\n\nO nome da canle queda libre para volve-la solicitar tras a denegación."
  example: "/msg CReG DENEGAR #canle fora de tema"
  denied: "\x0303✔\x03 Denegouse o rexistro da canle \x02%channel%\x02."
  invalid_channel: "\x0304✗\x03 O nome da canle debe empezar por un \x02#\x02."
  no_pending: "\x0304✗\x03 A canle \x02%channel%\x02 non ten ningún proceso de rexistro."
  already_approved: "\x0304✗\x03 Non se poden denegar canles xa rexistradas e aprobadas."
  already_denied: "\x0304✗\x03 A canle \x02%channel%\x02 xa está denegada."

pendientes:
  syntax: "PENDIENTES"
  short: "Lista as solicitudes de rexistro de canle pendentes de revisión."
  help: "Lista cada solicitude de rexistro á espera de que un operador de servizos a evalúe, amosando a canle, quen a pediu, a data e a descrición. Necesitas o permiso \x02cregserv.pendientes\x02.\n\nEste comando non acepta parámetros."
  example: "/msg CReG PENDIENTES"
  empty: "Non hai canles pendentes de revisión."
  line: "\x02Canle:\x02 %channel%, \x02Solicitada por:\x02 %requester%, \x02Data:\x02 %date%, \x02Descrición:\x02 %description%"
  end: "Fin da lista."

denegados:
  syntax: "DENEGADOS"
  short: "Lista as solicitudes de rexistro de canle que foron denegadas."
  help: "Lista cada solicitude de rexistro denegada xunto co motivo polo que se denegou. Necesitas o permiso \x02cregserv.denegados\x02.\n\nEste comando non acepta parámetros."
  example: "/msg CReG DENEGADOS"
  empty: "Non hai canles denegadas."
  line: "\x02Canle:\x02 %channel%, \x02Motivo:\x02 %reason%"
  end: "Fin da lista."

drop:
  syntax: "DROP <#canle>"
  short: "Elimina o rexistro de canle que \x02%bot%\x02 garda para unha canle."
  help: "Elimina o rexistro que \x02%bot%\x02 garda para unha canle e, se a canle está rexistrada alí, tamén a dá de baixa de \x02%chanserv%\x02. Necesitas o permiso \x02cregserv.drop\x02.\n\n\x02#canle:\x02 A canle que queres eliminar.\n\nA baixa de \x02%chanserv%\x02 é branda: a canle entra nun período de graza de eliminación en lugar de borrarse de inmediato."
  example: "/msg CReG DROP #canle"
  dropped: "\x0303✔\x03 O rexistro da canle \x02%channel%\x02 foi eliminado de \x02%bot%\x02."
  dropped_channel: "\x0303✔\x03 A canle \x02%channel%\x02 foi eliminada e agora entra no período de graza de eliminación."
  invalid_channel: "\x0304✗\x03 O nome da canle debe empezar por un \x02#\x02."
  no_request: "\x0304✗\x03 A canle \x02%channel%\x02 non está rexistrada con \x02%bot%\x02."

saregister:
  syntax: "SAREGISTER <#canle> [descrición]"
  short: "Rexistra unha canle sen estar dentro."
  help: "Rexistra unha canle a petición do staff, sen pasar polo fluxo de solicitude e aprobación. Non necesitas estar dentro da canle nin que esta exista aínda. Necesitas o permiso \x02cregserv.saregister\x02.\n\n\x02#canle:\x02 A canle que queres rexistrar.\n\x02descrición:\x02 Descrición opcional que se garda co rexistro."
  example: "/msg CReG SAREGISTER #canle unha canle do staff"
  done: "\x0303✔\x03 A canle \x02%channel%\x02 foi rexistrada."
  invalid_channel: "\x0304✗\x03 O nome da canle debe empezar por un \x02#\x02."
  pending_deletion: "\x0304✗\x03 A canle \x02%channel%\x02 está pendente de eliminación e non pode ser rexistrada."
  already_registered: "\x0304✗\x03 A canle \x02%channel%\x02 xa está rexistrada."
  failed: "\x0304✗\x03 Non se puido completar o rexistro da canle \x02%channel%\x02."


# Übersetzungen für MemoServ — Deutsch
# Domäne: memoserv
#
# IRC-Formatcodes (doppelte Anführungszeichen oder !irc-Literalblöcke):
#   \x02        Fettdruck ein/aus
#   \x03NN      Farbe (DEZIMAL: 03=grün, 04=rot, 07=orange, 14=dunkelgrau)
#   \x03        Farbe zurücksetzen
#   \x0F        gesamte Formatierung zurücksetzen
#
# IRC-Farben verwenden DEZIMALZAHLEN (0-15), keine Hexadezimalzahlen.
#   \x0314 = dunkelgrau (14 dezimal): RICHTIG
#   \x030F = Farbe 0 gefolgt vom Buchstaben F: FALSCH
#
# Mehrzeiliger IRC-Text: !irc |- mit echten Zeilenumbrüchen und Leerzeichen.
# Blöcke ohne Tag dekodieren keine Escape-Sequenzen; CTCP-Literale erhalten.
# HELP-Beispiele: example/examples und %command_prefix%.
# Die Darstellung ergänzt /msg ohne Farbe und einen Rand von zwei Leerzeichen.

# --- SEND ------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#channel} <Nachricht>"
  short: "Eine Nachricht an einen Nickname oder Channel senden."
  help: |-
    Sendet eine Nachricht an einen registrierten Nickname oder Channel. Der
    Empfänger muss den Nachrichtendienst aktiviert haben (ENABLE).
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND Ana Hola, ¿puedes revisar el memo?\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303SEND #hilfe Aviso para el canal\x03\x0F"
  sent_nick: "\x0303✔\x03 Nachricht an \x02%nickname%\x02 gesendet."
  sent_channel: "\x0303✔\x03 Nachricht an Channel \x02%channel%\x02 gesendet."
  throttled: "\x0304✗\x03 Sie müssen \x02%seconds%\x02 Sekunde(n) warten, bevor Sie eine weitere Nachricht senden."
  limit_reached: "\x0304✗\x03 Nachrichtenlimit für \x02%target%\x02 erreicht."
  ignored: "\x0304✗\x03 Sie können keine Nachrichten an dieses Ziel senden, Sie stehen auf dessen Ignorierliste."
  cannot_send_to_self: "\x0304✗\x03 Sie können keine Nachricht an sich selbst senden."
  message_too_long: "\x0304✗\x03 Nachricht zu lang. Maximum sind \x02%max%\x02 Zeichen."
  service_disabled_for_target: "\x0304✗\x03 Nachrichtendienst ist für \x02%target%\x02 deaktiviert."

# --- READ ------------------------------------------------------------------
read:
  syntax: "READ [#channel] <Nummer>"
  short: "Eine Nachricht anhand der Nummer lesen."
  help: |-
    Liest die Nachricht mit der angegebenen Nummer. Ohne #channel wird dein
    Nickname-Postfach verwendet. Mit #channel ist die Stufe MEMOREAD erforderlich.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303READ 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303READ #hilfe 2\x03\x0F"
  header: "\x02\x0307Nachricht #%index%\x03 von \x02%from%\x02:\x0F"
  footer: "\x0314─────────────────────────────\x03 \x0314%date%\x03"
  not_found: "\x0304✗\x03 Nachricht #%index% nicht gefunden."

# --- LIST ------------------------------------------------------------------
list:
  syntax: "LIST [#channel]"
  short: "Nachrichten auflisten (ungelesen mit rotem * markiert)."
  help: |-
    Listet deine Nachrichten oder die eines Channels auf. Ungelesene Nachrichten
    werden mit rotem Stern und Vorschau angezeigt (max. 50 Zeichen). Ohne #channel
    = dein Postfach; mit #channel ist MEMOREAD erforderlich.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303LIST #hilfe\x03\x0F"
  header: "\x02\x0307Nachrichten für %target%\x03:\x0F"
  empty: "\x0307ℹ\x03 Keine Nachrichten für \x02%target%\x02."

# --- DEL -------------------------------------------------------------------
del:
  syntax: "DEL [#channel] <Nummer>"
  short: "Eine Nachricht anhand der Nummer löschen."
  help: |-
    Löscht die Nachricht mit der angegebenen Nummer. Für Channels ist
    MEMOCHANGE-Level erforderlich.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL 1\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DEL #hilfe 2\x03\x0F"
  deleted: "\x0303✔\x03 Nachricht #%index% gelöscht."
  not_found: "\x0304✗\x03 Nachricht #%index% nicht gefunden."

# --- IGNORE ----------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#channel] <nickname>|DEL [#channel] <nickname>|LIST [#channel]}"
  short: "Ignorierliste für Nachrichten verwalten."
  help: |-
    Verwaltet Nicknames, von denen du keine Nachrichten erhalten möchtest – für
    dein Konto oder einen registrierten Channel. Zum Ändern der Channel-Liste
    brauchst du die Berechtigung MEMOCHANGE.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #hilfe Ana\x03\x0F"
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #hilfe\x03\x0F"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#channel] <nickname>"
    short: "Fügt einen Nickname zur Ignorierliste hinzu."
    help: |-
      Nachrichten von diesem Nickname werden für Ihren Posteingang (oder den des
      Channels) nicht akzeptiert.
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE ADD #hilfe Ana\x03\x0F"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#channel] <nickname>"
    short: "Entfernt einen Nickname aus der Liste."
    help: "Entfernt den Nickname von der Ignorierliste."
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL Ana\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE DEL #hilfe Ana\x03\x0F"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#channel]"
    short: "Zeigt ignorierte Nicknames an."
    help: |-
      Zeigt die Liste der Nicknames, die Sie (oder der Channel) für Nachrichten
      ignorieren.
    example: "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST\x03\x0F"
    examples:
      - "\x0310›\x03\x0F %command_prefix%\x02\x0303IGNORE LIST #hilfe\x03\x0F"
  added: "\x0303✔\x03 \x02%nickname%\x02 zur Ignorierliste hinzugefügt."
  removed: "\x0303✔\x03 \x02%nickname%\x02 von der Ignorierliste entfernt."
  already_ignored: "\x0304✗\x03 \x02%nickname%\x02 steht bereits auf der Ignorierliste."
  not_ignored: "\x0304✗\x03 \x02%nickname%\x02 steht nicht auf der Ignorierliste."
  limit_reached_nick: "\x0304✗\x03 Ignorierlisten-Limit für Ihren Nickname erreicht (max. \x02%limit%\x02)."
  limit_reached_channel: "\x0304✗\x03 Ignorierlisten-Limit für \x02%channel%\x02 erreicht (max. \x02%limit%\x02)."
  list_empty: "\x0307ℹ\x03 Ignorierliste ist leer."
  list_header: "\x02\x0307Ignorierliste:\x03\x0F"

# --- ENABLE ----------------------------------------------------------------
enable:
  syntax: "ENABLE [#channel]"
  short: "Nachrichtenempfang aktivieren."
  help: |-
    Aktiviert den Empfang von Nachrichten an deinen Nickname. In Channels kann
    nur der Gründer dies aktivieren.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303ENABLE #hilfe\x03\x0F"
  enabled_nick: "\x0303✔\x03 Nachrichtendienst für Ihren Nickname aktiviert."
  enabled_channel: "\x0303✔\x03 Nachrichtendienst für Channel \x02%channel%\x02 aktiviert."
  already_enabled_nick: "\x0307ℹ\x03 Nachrichtendienst ist für Ihren Nickname bereits aktiviert."
  already_enabled_channel: "\x0307ℹ\x03 Nachrichtendienst ist für \x02%channel%\x02 bereits aktiviert."
  founder_only: "\x0304✗\x03 Nur der Channel-Founder kann Nachrichten für \x02%channel%\x02 aktivieren."

# --- DISABLE ---------------------------------------------------------------
disable:
  syntax: "DISABLE [#channel]"
  short: "Nachrichtenempfang deaktivieren."
  help: |-
    Deaktiviert den Empfang von Nachrichten an deinen Nickname oder Channel.
    In Channels kann nur der Gründer dies deaktivieren.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303DISABLE #hilfe\x03\x0F"
  disabled_nick: "\x0303✔\x03 Nachrichtendienst für Ihren Nickname deaktiviert."
  disabled_channel: "\x0303✔\x03 Nachrichtendienst für Channel \x02%channel%\x02 deaktiviert."
  already_disabled_nick: "\x0307ℹ\x03 Nachrichtendienst ist für Ihren Nickname bereits deaktiviert."
  already_disabled_channel: "\x0307ℹ\x03 Nachrichtendienst ist für \x02%channel%\x02 bereits deaktiviert."
  founder_only: "\x0304✗\x03 Nur der Channel-Founder kann Nachrichten für \x02%channel%\x02 deaktivieren."

# --- HELP ------------------------------------------------------------------
help:
  syntax: "HELP [Befehl] [Option]"
  short: "Befehle auflisten oder Hilfe für einen Befehl anzeigen."
  help: |-
    Zeigt die Befehlsliste oder ausführliche Hilfe zu einem Befehl oder einer
    Option.
  example: "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP\x03\x0F"
  examples:
    - "\x0310›\x03\x0F %command_prefix%\x02\x0303HELP IGNORE ADD\x03\x0F"
  header_title: "%bot%"
  header: "\x02\x0307🤖 %title%\x03\x0F \x0314─────────────────────────────\x03\x0F"
  intro: |-
    Ermöglicht den Versand und Empfang von Nachrichten zwischen registrierten
    Benutzern sowie Mitteilungen an Channels. Nachrichten werden zur späteren
    Abfrage gespeichert, auch wenn der Empfänger nicht verbunden ist.
  general_header: "\x02 ■ Verfügbare Befehle:\x02"
  command_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  subcommand_line: "    \x0310›\x03\x0F \x02\x0303%command%\x03\x0F%description%"
  options_header: "\x02 ■ Optionen:\x02"
  examples_header: "\x02 ■ Beispiele:\x02"
  general_footer: "\x0310ℹ\x03\x0F Verwende /msg %bot% \x02\x0303HELP <Befehl>\x03\x0F für weitere Informationen."
  set_sub_footer: "\x0310ℹ\x03\x0F Verwende /msg %bot% \x02\x0303HELP %command% <Option>\x03\x0F für weitere Informationen."
  syntax_label: "Syntax: \x02\x0303%syntax%\x03\x0F"
  footer: "\x0314─────────────────────────────\x03\x0F"
  group_header: "\x0310  ◆ %group%\x03\x0F"
  subgroup_header: "\x0310  ◆ %group%\x03\x0F"
  group:
    messages: "Nachrichten"
    preferences: "Einstellungen"
  ircop_header: "\x02 ■ Verfügbare Befehle für IRC-Operatoren:\x02"

# --- NOTIFY ----------------------------------------------------------------
notify:
  nick_pending: "Du hast \x02%count%\x02 ungelesene Nachricht(en). Nachrichten anzeigen: /msg %bot% \x0303LIST\x03"
  channel_pending: "Der Channel \x02%channel%\x02 hat \x02%count%\x02 ungelesene Nachricht(en). Nachrichten anzeigen: /msg %bot% \x0303LIST %channel%\x03"

# --- CHANNEL REGISTRATION DECISIONS ---
registration_decision:
  accepted: "Deine Registrierungsanfrage für %channel% wurde angenommen."
  rejected: "Deine Registrierungsanfrage für %channel% wurde abgelehnt."
  reason: "Begründung: %reason%"
  restriction: "Verfügbar ab: %date%"

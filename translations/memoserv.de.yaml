# Übersetzungen für MemoServ — Deutsch
# Domäne: memoserv
#
# IRC-Formatcodes (doppelte Anführungszeichen oder !irc-Literalblöcke):
#   \x02        Fettdruck ein/aus
#   \x03NN      Farbe (DEZIMAL: 03=grün, 04=rot, 07=orange, 14=dunkelgrau)
#   \x03        Farbe zurücksetzen
#   \x0F        gesamte Formatierung zurücksetzen
#
# IRC-Farben verwenden DEZIMALZAHLEN (0-15), keine Hexadezimalzahlen.
#   \x0314 = dunkelgrau (14 dezimal): RICHTIG
#   \x030F = Farbe 0 gefolgt vom Buchstaben F: FALSCH
#
# Mehrzeiliger IRC-Text: !irc |- mit echten Zeilenumbrüchen und Leerzeichen.
# Blöcke ohne Tag dekodieren keine Escape-Sequenzen; CTCP-Literale erhalten.
# HELP-Beispiele: example/examples und %command_prefix%.
# Die Darstellung ergänzt /msg ohne Farbe und einen Rand von zwei Leerzeichen.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {nickname|#channel} <Nachricht>"
  short: "Eine Nachricht an einen Nickname oder Channel senden."
  help: |-
    Sendet eine Nachricht an einen registrierten Nickname oder Channel. Der
    Empfänger muss den Nachrichtendienst aktiviert haben (ENABLE).
  example: "%command_prefix%SEND Ana Hola, ¿puedes revisar el memo?"
  examples:
    - "%command_prefix%SEND #hilfe Aviso para el canal"
  sent_nick: "Nachricht an %nickname% gesendet."
  sent_channel: "Nachricht an Channel %channel% gesendet."
  throttled: "Sie müssen %seconds% Sekunde(n) warten, bevor Sie eine weitere Nachricht senden."
  limit_reached: "Nachrichtenlimit für %target% erreicht."
  ignored: "Sie können keine Nachrichten an dieses Ziel senden, Sie stehen auf dessen Ignorierliste."
  cannot_send_to_self: "Sie können keine Nachricht an sich selbst senden."
  message_too_long: "Nachricht zu lang. Maximum sind %max% Zeichen."
  service_disabled_for_target: "Nachrichtendienst ist für %target% deaktiviert."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#channel] <Nummer>"
  short: "Eine Nachricht anhand der Nummer lesen."
  help: |-
    Liest die Nachricht mit der angegebenen Nummer. Ohne #channel wird dein
    Nickname-Postfach verwendet. Mit #channel ist die Stufe MEMOREAD erforderlich.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #hilfe 2"
  header: "Nachricht #%index% von %from%:"
  footer: "%separator% %date%"
  not_found: "Nachricht #%index% nicht gefunden."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#channel]"
  short: "Nachrichten auflisten (ungelesen mit rotem * markiert)."
  help: |-
    Listet deine Nachrichten oder die eines Channels auf. Ungelesene Nachrichten
    werden mit rotem Stern und Vorschau angezeigt (max. 50 Zeichen). Ohne #channel
    = dein Postfach; mit #channel ist MEMOREAD erforderlich.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #hilfe"
  header: "Nachrichten für %target%:"
  empty: "Keine Nachrichten für %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#channel] {Nummer|ALL}"
  short: "Eine Nachricht anhand der Nummer löschen."
  help: |-
    Löscht eine Nachricht nach Nummer oder leert mit ALL das Postfach. Für
    Kanäle ist die Zugriffsstufe MEMOCHANGE erforderlich.
  example: "%command_prefix%DEL ALL"
  examples:
    - "%command_prefix%DEL 1"
    - "%command_prefix%DEL #hilfe 2"
    - "%command_prefix%DEL #hilfe ALL"
  deleted: "Nachricht #%index% gelöscht."
  not_found: "Nachricht #%index% nicht gefunden."
  all_deleted: "Alle Nachrichten in diesem Postfach wurden gelöscht."
  none_to_delete: "Es sind keine Nachrichten zum Löschen vorhanden."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#channel] <nickname>|DEL [#channel] <nickname>|LIST [#channel]}"
  short: "Ignorierliste für Nachrichten verwalten."
  help: |-
    Verwaltet Nicknames, von denen du keine Nachrichten erhalten möchtest – für
    dein Konto oder einen registrierten Channel. Zum Ändern der Channel-Liste
    brauchst du die Berechtigung MEMOCHANGE.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #hilfe Ana"
    - "%command_prefix%IGNORE LIST #hilfe"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#channel] <nickname>"
    short: "Fügt einen Nickname zur Ignorierliste hinzu."
    help: |-
      Nachrichten von diesem Nickname werden für Ihren Posteingang (oder den des
      Channels) nicht akzeptiert.
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #hilfe Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#channel] <nickname>"
    short: "Entfernt einen Nickname aus der Liste."
    help: "Entfernt den Nickname von der Ignorierliste."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #hilfe Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#channel]"
    short: "Zeigt ignorierte Nicknames an."
    help: |-
      Zeigt die Liste der Nicknames, die Sie (oder der Channel) für Nachrichten
      ignorieren.
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #hilfe"
  added: "%nickname% zur Ignorierliste hinzugefügt."
  removed: "%nickname% von der Ignorierliste entfernt."
  already_ignored: "%nickname% steht bereits auf der Ignorierliste."
  not_ignored: "%nickname% steht nicht auf der Ignorierliste."
  limit_reached_nick: "Ignorierlisten-Limit für Ihren Nickname erreicht (max. %limit%)."
  limit_reached_channel: "Ignorierlisten-Limit für %channel% erreicht (max. %limit%)."
  list_empty: "Ignorierliste ist leer."
  list_header: "Ignorierliste:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#channel]"
  short: "Nachrichtenempfang aktivieren."
  help: |-
    Aktiviert den Empfang von Nachrichten an deinen Nickname. In Channels kann
    nur der Gründer dies aktivieren.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #hilfe"
  enabled_nick: "Nachrichtendienst für Ihren Nickname aktiviert."
  enabled_channel: "Nachrichtendienst für Channel %channel% aktiviert."
  already_enabled_nick: "Nachrichtendienst ist für Ihren Nickname bereits aktiviert."
  already_enabled_channel: "Nachrichtendienst ist für %channel% bereits aktiviert."
  founder_only: "Nur der Channel-Founder kann Nachrichten für %channel% aktivieren."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#channel]"
  short: "Nachrichtenempfang deaktivieren."
  help: |-
    Deaktiviert den Empfang von Nachrichten an deinen Nickname oder Channel.
    In Channels kann nur der Gründer dies deaktivieren.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #hilfe"
  disabled_nick: "Nachrichtendienst für Ihren Nickname deaktiviert."
  disabled_channel: "Nachrichtendienst für Channel %channel% deaktiviert."
  already_disabled_nick: "Nachrichtendienst ist für Ihren Nickname bereits deaktiviert."
  already_disabled_channel: "Nachrichtendienst ist für %channel% bereits deaktiviert."
  founder_only: "Nur der Channel-Founder kann Nachrichten für %channel% deaktivieren."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [Befehl] [Option]"
  short: "Befehle auflisten oder Hilfe für einen Befehl anzeigen."
  help: |-
    Zeigt die Befehlsliste oder ausführliche Hilfe zu einem Befehl oder einer
    Option.
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Ermöglicht den Versand und Empfang von Nachrichten zwischen registrierten
    Benutzern sowie Mitteilungen an Channels. Nachrichten werden zur späteren
    Abfrage gespeichert, auch wenn der Empfänger nicht verbunden ist.
  general_header: "Verfügbare Befehle:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Optionen:"
  examples_header: "Beispiele:"
  general_help_command: "HELP <Befehl>"
  option_help_command: "HELP %command% <Option>"
  general_footer: "Verwende /msg %bot% %help_command% für weitere Informationen."
  set_sub_footer: "Verwende /msg %bot% %help_command% für weitere Informationen."
  syntax_label: "Syntax: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Nachrichten"
    preferences: "Einstellungen"
  ircop_header: "Verfügbare Befehle für IRC-Operatoren:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_pending: "Du hast %count% ungelesene Nachricht(en). Nachrichten anzeigen: /msg %bot% %list%"
  channel_pending: "Der Channel %channel% hat %count% ungelesene Nachricht(en). Nachrichten anzeigen: /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "Deine Registrierungsanfrage für %channel% wurde angenommen."
  rejected: "Deine Registrierungsanfrage für %channel% wurde abgelehnt."
  reason: "Begründung: %reason%"
  restriction: "Verfügbar ab: %date%"

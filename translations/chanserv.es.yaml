  ircop_header: "Comandos disponibles para IRCops:"

# --- CLEARUSERS (IRCop) -------------------------------------------------------
clearusers:
  syntax: "CLEARUSERS <#canal> [razón]"
  example: "%command_prefix%CLEARUSERS #canal"
  examples:
    - "%command_prefix%CLEARUSERS #canal flooding"
  short: "Expulsar a todos los usuarios de un canal."
  help: |-
    Expulsa a todos los usuarios del canal. Es exclusivo de IRCop; si se omite la
    razón se usa una predeterminada.
  not_on_network: "El canal %channel% no se encuentra actualmente en la red."
  empty: "El canal %channel% no tiene usuarios para expulsar."
  success: "Se expulsaron %count% usuario(s) de %channel%."
  default_reason: "Comando CLEARUSERS"

# --- CLEARACCESS (IRCop) ------------------------------------------------------
clearaccess:
  syntax: "CLEARACCESS <#canal>"
  example: "%command_prefix%CLEARACCESS #canal"
  short: "Limpiar la lista de acceso completa de un canal."
  help: "Elimina todas las entradas de acceso del canal. Esta acción es irreversible."
  success: "Eliminadas %count% entradas de acceso de %channel%."
  empty: "El canal %channel% no tiene entradas de acceso."

# --- IRCOPONLY (IRCop) --------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#canal> {ON|OFF}"
  example: "%command_prefix%IRCOPONLY #canal ON"
  examples:
    - "%command_prefix%IRCOPONLY #canal OFF"
  short: "Restringir un canal a operadores IRC."
  help: |-
    Solo los operadores IRC autorizados pueden permanecer en el canal. %bot%
    se encarga de aplicar esta restricción.
  on: "IRCOPONLY activado en %channel%."
  off: "IRCOPONLY desactivado en %channel%."

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <#canal> <apodo> <descripción>"
  short: "Registrar administrativamente un canal."
  help: |-
    Sintaxis: SAREGISTER <#canal> <apodo> <descripción>

    Registra administrativamente un canal de forma inmediata para el apodo
    especificado como fundador sin requerir presencia, verificación ni límites de frecuencia.
  example: "%command_prefix%SAREGISTER #canal Alicia Canal comunitario"
  success: "El canal %channel% ha sido registrado para %founder%."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#canal> {ON|OFF}"
  example: "%command_prefix%NOEXPIRE #Importante ON"
  examples:
    - "%command_prefix%NOEXPIRE #Importante OFF"
  short: "Activa o desactiva la protección de expiración para un canal."
  help: |-
    Controla si el canal expira por inactividad.
    ON evita la expiración y OFF aplica las reglas normales.
  success_on: "El canal %channel% está ahora protegido contra expiración."
  success_off: "El canal %channel% expirará normalmente."
  forbidden: "El canal %channel% está prohibido."
  suspended: "El canal %channel% está suspendido."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <#canal> [FORCE]"
  example: "%command_prefix%DROP #canal"
  examples:
    - "%command_prefix%DROP #canal FORCE"
  short: "Eliminar un canal registrado."
  help: |-
    Elimina un canal registrado de la base de datos.
    FORCE elimina permanentemente un canal pendiente de eliminación.
    Un IRCop con permiso DROP también puede liberar inmediatamente
    una solicitud pendiente de registro y rechazada, con o sin FORCE.
  registration_restricted: "Esta solicitud de registro está restringida hasta %date%."
  force:
    short: "Elimina permanentemente un canal pendiente de eliminación."
  success: "El canal %channel% ha sido marcado para eliminación y puede ser restaurado durante el periodo de gracia."
  force_success: "El canal %channel% ha sido eliminado permanentemente."
  pending_deletion: "El canal %channel% ya está pendiente de eliminación. Usa DROP <#canal> FORCE para eliminarlo permanentemente."
  invalid_channel: "Nombre de canal no válido. Usa %example%."
  pending_deletion_reason: "El canal %channel% está en proceso de eliminación. Más información /msg %bot% \x0303INFO %channel%\x03"

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <#canal>"
  example: "%command_prefix%RESTORE #canal"
  short: "Restaurar un canal pendiente de eliminación."
  help: |-
    Restaura un canal que fue eliminado manualmente y aún está dentro del periodo
    de gracia.
  success: "El canal %channel% ha sido restaurado."
  not_pending_deletion: "El canal %channel% no está pendiente de eliminación."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canal> <duración> <razón>"
  example: "%command_prefix%SUSPEND #canal 7d Incumplimiento de normas"
  examples:
    - "%command_prefix%SUSPEND #canal 0 Incumplimiento de normas"
  short: "Suspender un canal."
  help: |-
    Desactiva temporalmente un canal registrado. Formatos de duración: 0 =
    permanente, 1d, 12h, 60m.
    Mientras esté suspendido, los modos, acceso y enforcement del canal están
    deshabilitados.
  success: "El canal %channel% ha sido suspendido hasta %duration%."
  already_suspended: "El canal %channel% ya está suspendido."
  invalid_duration: "Duración inválida. Usa: 0 (permanente), 1d, 12h o 60m."
  channel_suspended: "El canal %channel% está suspendido y no puede ser usado."
  notice_channel: "El canal ha sido suspendido. Razón: %reason%"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#canal>"
  example: "%command_prefix%UNSUSPEND #canal"
  short: "Levantar la suspensión de un canal."
  help: "Reactiva un canal suspendido, restaurando sus modos y enforcement."
  success: "El canal %channel% ya no está suspendido."
  not_suspended: "El canal %channel% no está suspendido."
  reason_expired: "suspensión expirada"

# NOJOIN documentación para LEVELS:
# NOJOIN: Nivel mínimo de acceso para entrar al canal. Usuarios con nivel < NOJOIN son expulsados.
# Por defecto: -1 (deshabilitado). Pon 0 para permitir solo usuarios registrados, 50 para nivel 50+, etc.

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <#canal> <razón>"
  example: "%command_prefix%FORBID #canal Incumplimiento de normas"
  short: "Prohibir un canal para que no pueda ser usado."
  help: |-
    Prohíbe el uso de un canal, expulsando a todos sus usuarios e impidiendo
    que vuelvan a entrar. Si el canal está registrado, se elimina su registro
    antes de aplicar la prohibición.
  reason_required: "Debes especificar una razón."
  success: "El canal %channel% ha sido prohibido."
  updated: "La razón de prohibición del canal %channel% ha sido actualizada."
  channel_forbidden: "El canal %channel% está prohibido y no puede ser usado."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#canal>"
  example: "%command_prefix%UNFORBID #canal"
  short: "Quitar la prohibición de un canal."
  help: "Quita la prohibición de un canal, permitiendo que sea registrado nuevamente."
  success: "El canal %channel% ya no está prohibido."
  not_forbidden: "El canal %channel% no está prohibido."

# --- HISTORY ---
history:
  syntax: "HISTORY <#canal> <opción> [parámetros]"
  example: "%command_prefix%HISTORY #canal ADD Revisión de moderación"
  examples:
    - "%command_prefix%HISTORY #canal DEL 42"
    - "%command_prefix%HISTORY #canal VIEW"
    - "%command_prefix%HISTORY #canal VIEW 2"
    - "%command_prefix%HISTORY #canal VIEW ALL"
    - "%command_prefix%HISTORY #canal CLEAR"
  short: "Ver o gestionar el historial de acciones del canal."
  help: "Gestiona el historial de acciones del canal."

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <#canal> ADD <mensaje>"
    example: "%command_prefix%HISTORY #canal ADD Revisión de moderación"
    short: "Añadir una entrada manual al historial."
    help: |-
      Añade una entrada manual al historial del canal.
    success: "Entrada de historial añadida para %channel%."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <#canal> DEL <id>"
    example: "%command_prefix%HISTORY #canal DEL 42"
    short: "Eliminar una entrada del historial."
    help: "Elimina una entrada del historial por su ID."

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <#canal> VIEW [PÁGINA|ALL]"
    example: "%command_prefix%HISTORY #canal VIEW"
    examples:
      - "%command_prefix%HISTORY #canal VIEW 2"
      - "%command_prefix%HISTORY #canal VIEW ALL"
    short: "Ver historial de acciones del canal."
    help: "Muestra las entradas del historial del canal."
    header: "%heading% (mostrando %start%-%end% de %total%):"
    header_heading: "Historial de %channel%"
    entry: "#%id% [%date%] %action% por %operator% — %message%"
    no_entries: "No hay entradas de historial para %channel%."
    page_hint: "Usa %command% para más entradas."
    page_hint_command: "HISTORY %channel% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <#canal> CLEAR"
    example: "%command_prefix%HISTORY #canal CLEAR"
    short: "Eliminar todas las entradas de historial de un canal."
    help: "Elimina todas las entradas del historial del canal."
    success: "Eliminadas %count% entradas de historial para %channel%."


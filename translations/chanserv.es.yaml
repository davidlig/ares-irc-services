  description: "%label%%padding%: %desc%"
  description_label: "Descripción"
  url: "%label%%padding%: %url%"
  url_label: "URL"
  email: "%label%%padding%: %email%"
  email_label: "Email"
  last_used: "%label%%padding%: %date%"
  last_used_label: "Último uso"
  topic: "%label%%padding%: %topic%"
  topic_label: "Último tema"
  topic_set_by: "%label%%padding%: %nickname%"
  topic_set_by_label: "Tema cambiado por"
  options: "%label%%padding%: %options%"
  options_label: "Opciones"
  verbose: "%label%%padding%: %state%"
  verbose_label: "Notificaciones de canal"
  private: "La información del canal %channel% es privada."
  no_expire: "%label%%padding%: Sí"
  no_expire_label: "Nunca Expira"
  mlock_modes: "%label%%padding%: %modes%"
  mlock_modes_label: "Candado de modos"
  suspended_status: "%label%%padding%: %state%"
  suspended_status_label: "Estado"
  suspended_status_value: "Suspendido"
  suspended_reason: "%label%%padding%: %reason%"
  suspended_reason_label: "Razón"
  suspended_until: "%label%%padding%: %date%"
  suspended_until_label: "Hasta"
  suspended_permanent: "%label%%padding%: Permanente"
  suspended_permanent_label: "Hasta"
  forbidden_status: "%label%%padding%: %state%"
  forbidden_status_label: "Estado"
  forbidden_status_value: "Prohibido"
  forbidden_reason: "%label%%padding%: %reason%"
  forbidden_reason_label: "Razón"
  pending_deletion_status: "%label%%padding%: %state%"
  pending_deletion_status_label: "Estado"
  pending_deletion_status_value: "En proceso de eliminación"
  pending_deletion_at: "%label%%padding%: %date%"
  pending_deletion_at_label: "Eliminado"
  pending_deletion_until: "%label%%padding%: %date%"
  pending_deletion_until_label: "Elim. definitiva"
  pending_deletion_notice: "Este canal está congelado y no puede ser registrado."

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET <#canal> <opción> [parámetros]"
  example: "%command_prefix%SET #canal DESC Un canal comunitario"
  examples:
    - "%command_prefix%SET #canal URL https://example.test"
    - "%command_prefix%SET #canal MLOCK ON"
  short: "Cambiar opciones del canal."
  help: |-
    Cambia una opción del canal. La ayuda de cada opción explica sus requisitos y
    variantes.
  unknown_option: "Opción desconocida %option%. Usa una de: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Usa SET <#canal> FOUNDER <apodo> <token> con el token confirmado del fundador actual."
    token_unavailable: "El fundador actual no tiene un token de rescate confirmado. Debe autenticarse y usar VERIFY primero."
    syntax: "SET <#canal> FOUNDER <apodo> [token]"
    example: "%command_prefix%SET #canal FOUNDER Alicia"
    examples:
      - "%command_prefix%SET #canal FOUNDER Alicia token-confirmado"
    short: "Transferir canal a otro apodo registrado."
    help: |-
      Cambia el fundador tras validar el token del fundador actual. Se conserva la
      excepción administrativa de nivel fundador. El token no se consume.
    invalid_token: "El token de rescate no es válido."
    updated: "El fundador ha sido cambiado a %nickname%."
    throttled: "Demasiados tokens incorrectos. Inténtalo de nuevo en %minutes% minuto(s)."
    must_be_registered: "%nickname% debe estar registrado y activado."
    suspended: "%nickname% está suspendido y no puede ser fundador."
    cannot_be_self: "El nuevo fundador no puede ser el actual."
    cannot_be_successor: "El nuevo fundador no puede ser el sucesor del canal."
    limit_exceeded: "%nickname% ha alcanzado el máximo de %max% canales registrados."
    notice_channel: "%from% asigna como fundador del canal a %nickname%."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canal> SUCCESSOR [apodo]"
    example: "%command_prefix%SET #canal SUCCESSOR Alicia"
    examples:
      - "%command_prefix%SET #canal SUCCESSOR"
    short: "Establecer el sucesor del canal."
    help: |-
      Asigna un apodo como sucesor de un canal. Si no se establece un apodo borra el
      actual. El apodo debe estar registrado y activado.
    cleared: "Sucesor borrado."
    updated: "Sucesor establecido en %nickname%."
    must_be_registered: "%nickname% debe estar registrado y activado."
    suspended: "%nickname% está suspendido y no puede ser sucesor."
    cannot_be_founder: "El fundador no puede ser sucesor."
    notice_channel: "%from% asigna como sucesor del canal a %nickname%."
    notice_channel_cleared: "%from% borra al sucesor del canal."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canal> DESC <descripción>"
    example: "%command_prefix%SET #canal DESC Un canal comunitario"
    short: "Cambiar descripción del canal."
    help: "Cambia la descripción del canal (obligatoria)."
    updated: "Descripción actualizada."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canal> URL [url]"
    example: "%command_prefix%SET #canal URL https://example.test"
    examples:
      - "%command_prefix%SET #canal URL"
    short: "Establecer URL del canal."
    help: "Cambia la dirección url (web) de un canal. Omite url para borrar."
    updated: "URL actualizada."
    cleared: "URL borrada."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canal> EMAIL [email]"
    example: "%command_prefix%SET #canal EMAIL equipo@example.test"
    examples:
      - "%command_prefix%SET #canal EMAIL"
    short: "Establecer correo electrónico del canal."
    help: |-
      Cambia el correo electrónico de un canal. Omite email para borrar. No
      se admiten dominios de correo bloqueados administrativamente.
      Excepción administrativa: operadores con acceso de nivel fundador.
    invalid: "Dirección de correo no válida."
    updated: "Email actualizado."
    cleared: "Email borrado."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canal> ENTRYMSG [mensaje]"
    example: "%command_prefix%SET #canal ENTRYMSG Bienvenido"
    examples:
      - "%command_prefix%SET #canal ENTRYMSG"
    short: "Establecer mensaje de entrada al canal."
    help: "Establece el mensaje de entrada (NOTICE). Omite el mensaje para borrar."
    updated: "Mensaje de entrada actualizado."
    too_long: "El mensaje de entrada no puede superar %max% caracteres."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canal> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%SET #canal TOPICLOCK ON"
    examples:
      - "%command_prefix%SET #canal TOPICLOCK OFF"
    short: "Bloquear el topic del canal."
    help: |-
      Bloquea la posibilidad de cambiar el topic de un canal. Al activar se
      establece el actual.
    on: "Topic lock activado."
    off: "Topic lock desactivado."
    notice_on: "%nickname% activa TOPICLOCK."
    notice_off: "%nickname% desactiva TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canal> MLOCK {ON|OFF}"
    example: "%command_prefix%SET #canal MLOCK ON"
    examples:
      - "%command_prefix%SET #canal MLOCK OFF"
    short: "Bloquear modos del canal."
    help: "Bloquea los modos actuales establecidos en el canal."
    no_modes: "sin modos"
    on: "MLOCK activado (%modes%)."
    off: "MLOCK desactivado."
    notice_on: "%nickname% activa MLOCK (%modes%)."
    notice_off: "%nickname% desactiva MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canal> PRIVATE {ON|OFF}"
    example: "%command_prefix%SET #canal PRIVATE ON"
    examples:
      - "%command_prefix%SET #canal PRIVATE OFF"
    short: "Ocultar la información del canal a usuarios sin acceso."
    help: |-
      Cuando está ON, solo el fundador y los usuarios con acceso pueden ver la
      información del canal.
    on: "La información del canal ahora es privada."
    off: "La información del canal ahora es pública."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canal> SECURE {ON|OFF}"
    example: "%command_prefix%SET #canal SECURE ON"
    examples:
      - "%command_prefix%SET #canal SECURE OFF"
    short: "Exigir rangos de canal solo a lista de acceso."
    help: |-
      Bloquea la posibilidad de asignar rangos en el canal a apodos que no estén en
      la lista de acceso.
    on: "SECURE activado."
    off: "SECURE desactivado."
    notice_on: "%nickname% activa el modo SECURE."
    notice_off: "%nickname% desactiva el modo SECURE."

  # --- SET VERBOSE ---------------------------------------------------------
  verbose:
    syntax: "SET <#canal> VERBOSE {ON|OFF}"
    example: "%command_prefix%SET #canal VERBOSE ON"
    examples:
      - "%command_prefix%SET #canal VERBOSE OFF"
    short: "Alternar notificaciones de acciones del canal."
    help: |-
      Activa o desactiva las emisiones NOTICE al canal para las acciones
      realizadas en él.
    on: "Notificaciones de acciones del canal activadas."
    off: "Notificaciones de acciones del canal desactivadas."

# --- STATUS -------------------------------------------------------------------
status:
  syntax: "STATUS <#canal>"
  example: "%command_prefix%STATUS #canal"
  header: "Estado del canal %channel%"
  short: "Mostrar el estado de registro de un canal."
  help: |-
    Indica si el canal no está registrado, espera aprobación, fue rechazado o
    está registrado.
    Los detalles del rechazo solo son visibles para el solicitante y los IRCops
    autorizados.

  unregistered: "%label%%padding%: Sin registrar"
  unregistered_label: "Estado"
  pending: "%label%%padding%: %state%"
  pending_label: "Estado"
  pending_value: "Pendiente de aprobación"
  registered: "%label%%padding%: %state%"
  registered_label: "Estado"
  registered_value: "Registrado"
  suspended: "%label%%padding%: %state%"
  suspended_label: "Estado"
  suspended_value: "Suspendido"
  forbidden: "%label%%padding%: %state%"
  forbidden_label: "Estado"
  forbidden_value: "Prohibido"
  pending_deletion: "%label%%padding%: %state%"
  pending_deletion_label: "Estado"
  pending_deletion_value: "Pendiente de eliminación"
  rejected_private: "%label%%padding%: %state%"
  rejected_private_label: "Estado"
  rejected_private_value: "Registro rechazado"
  rejected: "%label%%padding%: %state%"
  rejected_label: "Estado"
  rejected_value: "Registro rechazado"
  rejection_reason: "%label%%padding%: %reason%"
  rejection_reason_label: "Razón"
  rejection_audit: "%label%%padding%: %operator% el %date%"
  rejection_audit_label: "Rechazado por"
  restriction_until: "%label%%padding%: %date%"
  restriction_until_label: "Disponible a partir del"
  footer: ""

# --- ACCESS -------------------------------------------------------------------
access:
  syntax: "ACCESS <#canal> <opción> [parámetros]"
  example: "%command_prefix%ACCESS #canal LIST"
  examples:
    - "%command_prefix%ACCESS #canal ADD Alicia 100"
    - "%command_prefix%ACCESS #canal DEL Alicia"
  short: "Gestionar lista de acceso."
  help: "Gestiona la lista de acceso del canal."
  unknown_sub: "Subcomando desconocido %sub%. Usa LIST, ADD o DEL."
  level_range: "El nivel de acceso debe estar entre %min% y %max%."
  cannot_manage_level: "Solo puedes gestionar apodos con nivel estrictamente menor al tuyo."
  founder_not_in_list: "El fundador no está en la lista de acceso."
  max_entries: "Máximo %max% entradas de acceso por canal."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#canal> LIST"
    example: "%command_prefix%ACCESS #canal LIST"
    short: "Listar lista de acceso (requiere nivel ACCESSLIST)."
    help: "Muestra apodo y nivel de cada entrada."
    header: "Lista de acceso de %channel%"
    empty: "El canal %channel% no tiene entradas de acceso."
    entry: "#%index%: %nickname% (nivel %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#canal> ADD <apodo> <nivel>"
    example: "%command_prefix%ACCESS #canal ADD Alicia 100"
    short: "Añadir o actualizar nivel (requiere nivel ACCESSCHANGE)."
    help: "Nivel 1-499. Solo puedes asignar niveles por debajo del tuyo."
    done: "%nickname% establecido a nivel %level%."
    notice_channel: "%from% establece a %to% a nivel %level%"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#canal> DEL <apodo>"
    example: "%command_prefix%ACCESS #canal DEL Alicia"
    short: "Quitar de la lista (requiere nivel ACCESSCHANGE)."
    help: "Solo puedes quitar apodos con nivel menor al tuyo."
    not_in_list: "%nickname% no está en la lista de acceso."
    done: "%nickname% eliminado de la lista de acceso."
    notice_channel: "%from% quita a %to% de la lista de acceso"

# --- DELACCESS ----------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#canal>"
  example: "%command_prefix%DELACCESS #canal"
  short: "Eliminar tu propio acceso del canal."
  help: |-
    Elimina tu entrada de acceso de la lista del canal. Debes estar identificado.
    El fundador no puede usar este comando.
  done: "Tu acceso ha sido eliminado de %channel%."
  not_in_list: "No tienes acceso en %channel%."
  founder_not_in_access: "Eres el fundador de %channel% y no estás en la lista de acceso."
  notice_channel: "%nickname% elimina su acceso del canal"

# --- AKICK --------------------------------------------------------------------
akick:
  syntax: "AKICK <#canal> <opción> [parámetros]"
  example: "%command_prefix%AKICK #canal ADD *!*@* 0"
  examples:
    - "%command_prefix%AKICK #canal ADD *!*@* 7d Spam"
    - "%command_prefix%AKICK #canal DEL *!*@*"
    - "%command_prefix%AKICK #canal DEL 2"
    - "%command_prefix%AKICK #canal LIST"
    - "%command_prefix%AKICK #canal VIEW 1"
    - "%command_prefix%AKICK #canal CLEAR"
    - "%command_prefix%AKICK #canal CHECK Alice"
  short: "Gestionar lista de auto-kick."
  help: "Gestiona las entradas de autokick y su expiración opcional."
  unknown_sub: "Subcomando desconocido %sub%. Usa ADD, DEL, LIST, VIEW, CLEAR o CHECK."
  invalid_mask: "Formato de máscara inválido. Usa apodo!ident@host con comodines (*)."
  dangerous_mask: "La máscara %mask% es demasiado amplia. Debe contener al menos 4 caracteres alfanuméricos."
  protected_user: "El apodo %nickname% tiene acceso en este canal."
  max_entries: "Máximo %max% entradas AKICK por canal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canal> ADD <máscara> [expiración] [razón]"
    example: "%command_prefix%AKICK #canal ADD *!*@* 0"
    examples:
      - "%command_prefix%AKICK #canal ADD *!*@* 7d Spam"
    short: "Añadir entrada AKICK."
    help: |-
      Añade una máscara a la lista de expulsión automática del canal.

      Puedes indicar una duración y una razón. Si incluyes una razón, debes
      especificar también la duración: 0 para permanente, d para días, h para
      horas o m para minutos.
    done: "AKICK %mask% añadido."
    already_exists: "AKICK %mask% ya existe."
    notice_channel: "%from% añade AKICK: %mask% (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canal> DEL {<máscara>|<número>}"
    example: "%command_prefix%AKICK #canal DEL *!*@*"
    examples:
      - "%command_prefix%AKICK #canal DEL 2"
    short: "Eliminar entrada AKICK."
    help: "Eliminar por máscara exacta o número de entrada de LIST."
    not_found: "AKICK %mask% no encontrado."
    done: "AKICK %mask% eliminado."
    notice_channel: "%from% elimina AKICK: %mask%"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canal> LIST"
    example: "%command_prefix%AKICK #canal LIST"
    short: "Listar entradas AKICK."
    help: "Muestra máscara, razón, expiración y quién añadió."
    header: "Lista AKICK de %channel%"
    empty: "El canal %channel% no tiene AKICKs."
    entry: "#%index% %mask% %reason% (por %nickname%, expira: %expiration%, usos: %uses%)"

  # --- AKICK VIEW ----------------------------------------------------------
  view:
    syntax: "AKICK <#canal> VIEW {<máscara>|<número>}"
    example: "%command_prefix%AKICK #canal VIEW 1"
    examples:
      - "%command_prefix%AKICK #canal VIEW *!*@bad.host"
    short: "Ver metadatos detallados de una entrada AKICK."
    help: |-
      Muestra razón, autor, fecha de creación, fecha de expiración,
      contador de usos y fecha del último uso para una entrada de autokick.
    header: "Detalles de AKICK para %channel%"
    reason: "%label%%padding%: %reason%"
    reason_label: "Razón"
    author: "%label%%padding%: %author%"
    author_label: "Autor"
    created: "%label%%padding%: %date%"
    created_label: "Fecha creación"
    expires: "%label%%padding%: %date%"
    expires_label: "Fecha expiración"
    uses: "%label%%padding%: %uses%"
    uses_label: "Usos"
    last_used: "%label%%padding%: %date%"
    last_used_label: "Último uso"

  # --- AKICK CLEAR ---------------------------------------------------------
  clear:
    syntax: "AKICK <#canal> CLEAR"
    example: "%command_prefix%AKICK #canal CLEAR"
    short: "Vaciar todas las entradas AKICK."
    help: |-
      Elimina todas las entradas de expulsión automática del canal.
      Requiere nivel de fundador o AKICK.
    empty: "El canal %channel% no tiene entradas AKICK para vaciar."
    done: "%count% entradas AKICK vaciadas de %channel%."
    notice_channel: "%from% vació %count% entradas AKICK de %channel%"

  # --- AKICK CHECK ---------------------------------------------------------
  check:
    syntax: "AKICK <#canal> CHECK <apodo>"
    example: "%command_prefix%AKICK #canal CHECK Alice"
    short: "Comprobar si un apodo coincide con entradas AKICK."
    help: |-
      Comprueba si un usuario conectado coincide con alguna entrada de autokick del canal.
    no_match: "%nickname% no coincide con ninguna entrada AKICK en %channel%."
    not_connected: "El usuario %nickname% no está conectado."
    header: "Coincidencias AKICK para %nickname% en %channel%"
    entry: "#%index% %mask% %reason%"

  # --- AKICK ENFORCE -------------------------------------------------------
  enforce:
    syntax: "AKICK <#canal> ENFORCE"
    example: "%command_prefix%AKICK #canal ENFORCE"
    short: "Aplica las entradas AKICK a los usuarios actuales del canal."
    help: |-
      Comprueba si hay usuarios en el canal que coincidan con la lista AKICK
      y expulsa y banea a quienes coincidan.
    no_matches: "Ningún usuario en %channel% coincide con la lista AKICK."
    done: "Se aplicaron %count% expulsiones de AKICK en %channel%."
    notice_channel: "%from% aplicó expulsiones AKICK en %channel% (%count% usuarios)"

# --- LEVELS -------------------------------------------------------------------
levels:
  syntax: "LEVELS <#canal> <opción> [parámetros]"
  example: "%command_prefix%LEVELS #canal LIST"
  examples:
    - "%command_prefix%LEVELS #canal SET OPDEOP 50"
    - "%command_prefix%LEVELS #canal RESET"
  short: "Configurar los niveles del canal."
  help: |-
    Configura los niveles mínimos de acceso para las acciones del canal. Solo el
    fundador puede cambiar o restablecer niveles.
  unknown_sub: "Subcomando desconocido %sub%. Usa LIST, SET o RESET."
  unknown_key: "Clave de nivel %key% desconocida o no soportada por este IRCd."
  value_range: "El valor debe estar entre %min% y %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#canal> LIST"
    example: "%command_prefix%LEVELS #canal LIST"
    short: "Listar niveles."
    help: "Muestra cada clave y su valor (por defecto si no está fijado)."
    header: "Niveles de %channel%"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#canal> SET <nivel> <valor>"
    example: "%command_prefix%LEVELS #canal SET OPDEOP 50"
    short: "Establecer un nivel."
    help: "Valor -1 a 499. Solo fundador."
    done: "%key% establecido a %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#canal> RESET"
    example: "%command_prefix%LEVELS #canal RESET"
    short: "Restaurar todos los niveles por defecto."
    help: "Elimina todas las sobreescrituras. Solo fundador."
    done: "Niveles restaurados por defecto."

# --- INVITE -------------------------------------------------------------------
invite:
  syntax: "INVITE <#canal>"
  example: "%command_prefix%INVITE #canal"
  short: "Invitarse al canal."
  help: "Invitarse al canal."
  done: "Has sido invitado a %channel%."

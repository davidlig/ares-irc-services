  kick_reason: "No estás autorizado para entrar en este canal."

# --- IRCOPONLY -------------------------------------------------------------
ircoponly:
  syntax: "IRCOPONLY <#canal> {ON|OFF}"
  example: "%command_prefix%\x02\x0303IRCOPONLY #canal ON\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303IRCOPONLY #canal OFF\x03\x0f"
  short: "Restringir un canal a operadores IRC."
  help: |-
    Solo los operadores IRC autorizados pueden permanecer en el canal. %bot%
    se encarga de aplicar esta restricción.
  on: "IRCOPONLY activado en %channel%."
  off: "IRCOPONLY desactivado en %channel%."

# --- NOEXPIRE --------------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <#canal> {ON|OFF}"
  example: "%command_prefix%\x02\x0303NOEXPIRE #Importante ON\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303NOEXPIRE #Importante OFF\x03\x0f"
  short: "Activa o desactiva la protección de expiración para un canal."
  help: |-
    Controla si el canal expira por inactividad.
    ON evita la expiración y OFF aplica las reglas normales.
  success_on: "\x0303✔\x03 El canal \x02%channel%\x02 está ahora protegido contra expiración."
  success_off: "\x0303✔\x03 El canal \x02%channel%\x02 expirará normalmente."
  forbidden: "\x0304✗\x03 El canal \x02%channel%\x02 está prohibido."
  suspended: "\x0304✗\x03 El canal \x02%channel%\x02 está suspendido."

# --- FORBID ----------------------------------------------------------------
forbid:
  syntax: "FORBID <#canal> <razón>"
  example: "%command_prefix%\x02\x0303FORBID #canal Incumplimiento de normas\x03\x0F"
  short: "Prohibir un canal para que no pueda ser usado."
  help: |-
    Prohíbe el uso de un canal, expulsando a todos sus usuarios e impidiendo
    que vuelvan a entrar. Si el canal está registrado, se elimina su registro
    antes de aplicar la prohibición.
  reason_required: "\x0304✗\x03 Debes especificar una razón."
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido prohibido."
  updated: "\x0303✔\x03 La razón de prohibición del canal \x02%channel%\x02 ha sido actualizada."
  channel_forbidden: "\x0304✗\x03 El canal \x02%channel%\x02 está prohibido y no puede ser usado."

# --- UNFORBID --------------------------------------------------------------
unforbid:
  syntax: "UNFORBID <#canal>"
  example: "%command_prefix%\x02\x0303UNFORBID #canal\x03\x0F"

  topic_set_by: "  \x0314Tema cambiado por\x03  : %nickname%"
  options: "  \x0314Opciones\x03           : %options%"
  private: "\x0304✗\x03 La información del canal \x02%channel%\x02 es privada."
  no_expire: "  \x0314Nunca Expira\x03       : Sí"
  mlock_modes: "  \x0314Candado de modos\x03   : %modes%"
  suspended_status: "  \x0314Estado\x03             : \x0304Suspendido\x03"
  suspended_reason: "  \x0314Razón\x03              : %reason%"
  suspended_until: "  \x0314Hasta\x03              : %date%"
  suspended_permanent: "  \x0314Hasta\x03              : Permanente"
  forbidden_status: "  \x0314Estado\x03             : \x0304Prohibido\x03"
  forbidden_reason: "  \x0314Razón\x03              : %reason%"
  pending_deletion_status: "  \x0314Estado\x03             : \x0307En proceso de eliminación\x03"
  pending_deletion_at: "  \x0314Eliminado\x03          : %date%"
  pending_deletion_until: "  \x0314Elim. definitiva\x03   : %date%"
  pending_deletion_notice: "  \x0307Este canal está congelado y no puede ser registrado.\x03"


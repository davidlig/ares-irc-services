clearusers:
  syntax: "CLEARUSERS <#canal> [razón]"
  example: "%command_prefix%\x02\x0303CLEARUSERS #canal\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303CLEARUSERS #canal flooding\x03\x0f"
  short: "Expulsar a todos los usuarios de un canal."
  help: |-
    Expulsa a todos los usuarios del canal. Es exclusivo de IRCop; si se omite la
    razón se usa una predeterminada.
  not_on_network: "\x0304✗\x03 El canal \x02%channel%\x02 no se encuentra actualmente en la red."
  empty: "\x0307ℹ\x03 El canal \x02%channel%\x02 no tiene usuarios para expulsar."
  success: "\x0303✔\x03 Se expulsaron \x02%count%\x02 usuario(s) de \x02%channel%\x02."
  default_reason: "Comando CLEARUSERS"

# --- LIST (IRCop) ------------------------------------------------------------
list:
  syntax: "LIST <patrón> [página]"
  example: "%command_prefix%\x02\x0303LIST #*\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303LIST #* 2\x03\x0f"
  short: "Lista canales registrados que coinciden con un patrón."
  help: |-
    Lista los canales registrados que coinciden con el patrón indicado. El comodín
    * coincide con cualquier secuencia de caracteres. La página es opcional y
    empieza en 1.
  header: "Nombre | Fundador | Registro | Último uso | Estado"
  row: "%channel% | %founder% | %registered% | %last_used% | %status%"
  empty: "Ningún canal coincide con el patrón %pattern%."
  status_pending_registration: "Pendiente de aprobación"
  status_rejected_registration: "Registro rechazado"
  status_active: "Activo"

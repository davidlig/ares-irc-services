# Traducciones de ChanServ — Español
# Dominio: chanserv
#
# Códigos de formato IRC (comillas dobles o bloques literales !irc):
#   \x02        activa/desactiva la negrita
#   \x03NN      color (DECIMAL: 03=verde, 04=rojo, 07=naranja, 14=gris oscuro)
#   \x03        restablece el color
#   \x0F        restablece todo el formato
#
# Los colores IRC usan números DECIMALES (0-15), no hexadecimales.
#   \x0314 = gris oscuro (14 decimal): CORRECTO
#   \x030F = color 0 seguido de la letra F: ERROR
#
# Texto IRC multilínea: !irc |- con saltos físicos y espacios reales.
# Los bloques sin etiqueta no decodifican escapes; conserva los literales CTCP.
# Ejemplos HELP: example/examples y %command_prefix%.
# El presentador añade /msg sin color y un margen de dos espacios.

# --- ERROR --------------------------------------------------------------------
error:
  invalid_channel: "Nombre de canal no válido. Usa %example%."
  invalid_channel_example: "#canal"
  generic: "Ocurrió un error. Inténtalo de nuevo."

# --- REGISTER -----------------------------------------------------------------
register:
  syntax: "REGISTER <#canal> <descripción>"
  example: "%command_prefix%REGISTER #canal Proyecto comunitario"
  short: "Registrar un canal."
  help: |-
    Registra y asocia un canal a tu apodo. Debes identificarte con %nickserv%.
    En modo APPROVAL, un IRCop debe aprobar la solicitud.
  success: "El canal %channel% ha sido registrado."
  already_registered: "El canal %channel% ya está registrado o en proceso de registro."
  channel_not_on_network: "El canal %channel% no existe en la red."
  pending_deletion: "El canal %channel% está pendiente de eliminación y no puede ser registrado."
  insufficient_channel_rank: "Debes tener al menos estado de operador en %channel% para registrarlo."
  limit_exceeded: "Has alcanzado el máximo de %max% canales registrados."
  throttled: "Debes esperar %minutes% minuto(s) antes de registrar otro canal."

  awaiting_approval: "La solicitud de registro de %channel% espera la aprobación de un IRCop."
  restricted_indefinite: "Las nuevas solicitudes para %channel% están bloqueadas indefinidamente."
  restricted_until: "Las nuevas solicitudes para %channel% están bloqueadas hasta %date%"


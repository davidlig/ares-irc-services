# --- OP --------------------------------------------------------------------
op:
  syntax: "OP <#canal> <apodo>"
  example: "%command_prefix%\x02\x0303OP #canal Alicia\x03\x0F"
  short: "Dar modo operador en el canal."
  help: "Dar modo operador en el canal."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha recibido estatus de operador de canal."
  user_not_on_channel: "\x0304✗\x03 El apodo \x02%nickname%\x02 no está en la red."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 da \x0304%mode%\x03 a \x0314%to%\x03"

# --- DEOP ------------------------------------------------------------------
deop:
  syntax: "DEOP <#canal> <apodo>"
  example: "%command_prefix%\x02\x0303DEOP #canal Alicia\x03\x0F"
  short: "Quitar modo operador en el canal."
  help: "Quitar modo operador en el canal."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha sido deopado."

# --- SECURE ----------------------------------------------------------------
secure:
  requires_min_level: "\x0304✗\x03 Con SECURE activado, \x02%nickname%\x02 debe tener al menos nivel \x02%level%\x02 para recibir \x02%mode%\x02."

# --- SET -------------------------------------------------------------------
set:
  syntax: "SET <#canal> {FOUNDER <apodo> [token]|SUCCESSOR [apodo]|DESC <descripción>|URL [url]|EMAIL [email]|ENTRYMSG [mensaje]|TOPICLOCK {ON|OFF}|MLOCK {ON|OFF}|PRIVATE {ON|OFF}|SECURE {ON|OFF}}"
  example: "%command_prefix%\x02\x0303SET #canal DESC Un canal comunitario\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303SET #canal URL https://example.test\x03\x0f"
    - "%command_prefix%\x02\x0303SET #canal MLOCK ON\x03\x0f"
  short: "Cambiar opciones del canal."
  help: |-
    Cambia una opción del canal. La ayuda de cada opción explica sus requisitos y
    variantes.
  unknown_option: "\x0304✗\x03 Opción desconocida \x02%option%\x02. Usa una de: %options%."

  # --- SET FOUNDER ---------------------------------------------------------
  founder:
    token_required: "Usa SET <#canal> FOUNDER <apodo> <token> con el token confirmado del fundador actual."
    token_unavailable: "El fundador actual no tiene un token de rescate confirmado. Debe autenticarse y usar VERIFY primero."
    syntax: "SET <#canal> FOUNDER <apodo> [token]"
    example: "%command_prefix%\x02\x0303SET #canal FOUNDER Alicia\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303SET #canal FOUNDER Alicia token-confirmado\x03\x0f"
    short: "Transferir canal a otro apodo registrado."
    help: |-
      Cambia el fundador tras validar el token del fundador actual. Se conserva la
      excepción administrativa de nivel fundador. El token no se consume.
    invalid_token: "El token de rescate no es válido."
    updated: "\x0303✔\x03 El fundador ha sido cambiado a \x02%nickname%\x02."
    throttled: "Demasiados tokens incorrectos. Inténtalo de nuevo en %minutes% minuto(s)."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 debe estar registrado y activado."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 está suspendido y no puede ser fundador."
    cannot_be_self: "\x0304✗\x03 El nuevo fundador no puede ser el actual."
    cannot_be_successor: "\x0304✗\x03 El nuevo fundador no puede ser el sucesor del canal."
    limit_exceeded: "\x0304✗\x03 \x02%nickname%\x02 ha alcanzado el máximo de %max% canales registrados."
    notice_channel: "\x02%from%\x02 asigna como fundador del canal a \x02%nickname%\x02."

  # --- SET SUCCESSOR -------------------------------------------------------
  successor:
    syntax: "SET <#canal> SUCCESSOR [apodo]"
    example: "%command_prefix%\x02\x0303SET #canal SUCCESSOR Alicia\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303SET #canal SUCCESSOR\x03\x0f"
    short: "Establecer el sucesor del canal."
    help: |-
      Asigna un apodo como sucesor de un canal. Si no se establece un apodo borra el
      actual. El apodo debe estar registrado y activado.
    cleared: "\x0303✔\x03 Sucesor borrado."
    updated: "\x0303✔\x03 Sucesor establecido en \x02%nickname%\x02."
    must_be_registered: "\x0304✗\x03 \x02%nickname%\x02 debe estar registrado y activado."
    suspended: "\x0304✗\x03 \x02%nickname%\x02 está suspendido y no puede ser sucesor."
    cannot_be_founder: "\x0304✗\x03 El fundador no puede ser sucesor."
    notice_channel: "\x02%from%\x02 asigna como sucesor del canal a \x02%nickname%\x02."
    notice_channel_cleared: "\x02%from%\x02 borra al sucesor del canal."

  # --- SET DESC ------------------------------------------------------------
  desc:
    syntax: "SET <#canal> DESC <descripción>"
    example: "%command_prefix%\x02\x0303SET #canal DESC Un canal comunitario\x03\x0F"
    short: "Cambiar descripción del canal."
    help: "Cambia la descripción del canal (obligatoria)."
    updated: "\x0303✔\x03 Descripción actualizada."

  # --- SET URL -------------------------------------------------------------
  url:
    syntax: "SET <#canal> URL [url]"
    example: "%command_prefix%\x02\x0303SET #canal URL https://example.test\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303SET #canal URL\x03\x0f"
    short: "Establecer URL del canal."
    help: "Cambia la dirección url (web) de un canal. Omite url para borrar."
    updated: "\x0303✔\x03 URL actualizada."
    cleared: "\x0303✔\x03 URL borrada."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    syntax: "SET <#canal> EMAIL [email]"
    example: "%command_prefix%\x02\x0303SET #canal EMAIL equipo@example.test\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303SET #canal EMAIL\x03\x0f"
    short: "Establecer correo electrónico del canal."
    help: |-
      Cambia el correo electrónico de un canal. Omite email para borrar. No
      se admiten dominios de correo bloqueados administrativamente.
      Excepción administrativa: operadores con acceso de nivel fundador.
    invalid: "\x0304✗\x03 Dirección de correo no válida."
    updated: "\x0303✔\x03 Email actualizado."
    cleared: "\x0303✔\x03 Email borrado."

  # --- SET ENTRYMSG --------------------------------------------------------
  entrymsg:
    syntax: "SET <#canal> ENTRYMSG [mensaje]"
    example: "%command_prefix%\x02\x0303SET #canal ENTRYMSG Bienvenido\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303SET #canal ENTRYMSG\x03\x0f"
    short: "Establecer mensaje de entrada al canal."
    help: "Establece el mensaje de entrada (NOTICE). Omite el mensaje para borrar."
    updated: "\x0303✔\x03 Mensaje de entrada actualizado."
    too_long: "\x0304✗\x03 El mensaje de entrada no puede superar %max% caracteres."

  # --- SET TOPICLOCK -------------------------------------------------------
  topiclock:
    syntax: "SET <#canal> TOPICLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal TOPICLOCK ON\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303SET #canal TOPICLOCK OFF\x03\x0f"
    short: "Bloquear el topic del canal."
    help: |-
      Bloquea la posibilidad de cambiar el topic de un canal. Al activar se
      establece el actual.
    on: "\x0303✔\x03 Topic lock activado."
    off: "\x0303✔\x03 Topic lock desactivado."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activa TOPICLOCK."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 desactiva TOPICLOCK."

  # --- SET MLOCK -----------------------------------------------------------
  mlock:
    syntax: "SET <#canal> MLOCK {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal MLOCK ON\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303SET #canal MLOCK OFF\x03\x0f"
    short: "Bloquear modos del canal."
    help: "Bloquea los modos actuales establecidos en el canal."
    no_modes: "sin modos"
    on: "\x0303✔\x03 MLOCK activado (%modes%)."
    off: "\x0303✔\x03 MLOCK desactivado."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activa MLOCK (%modes%)."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 desactiva MLOCK."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET <#canal> PRIVATE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal PRIVATE ON\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303SET #canal PRIVATE OFF\x03\x0f"
    short: "Ocultar la información del canal a usuarios sin acceso."
    help: |-
      Cuando está ON, solo el fundador y los usuarios con acceso pueden ver la
      información del canal.
    on: "\x0303✔\x03 La información del canal ahora es privada."
    off: "\x0303✔\x03 La información del canal ahora es pública."

  # --- SET SECURE ----------------------------------------------------------
  secure:
    syntax: "SET <#canal> SECURE {ON|OFF}"
    example: "%command_prefix%\x02\x0303SET #canal SECURE ON\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303SET #canal SECURE OFF\x03\x0f"
    short: "Exigir rangos de canal solo a lista de acceso."
    help: |-
      Bloquea la posibilidad de asignar rangos en el canal a apodos que no estén en
      la lista de acceso.
    on: "\x0303✔\x03 SECURE activado."
    off: "\x0303✔\x03 SECURE desactivado."
    notice_on: "\x0303✔\x03 \x0302%nickname%\x03 activa el modo SECURE."
    notice_off: "\x0304✗\x03 \x0302%nickname%\x03 desactiva el modo SECURE."

# --- ACCESS ----------------------------------------------------------------
access:
  syntax: "ACCESS <#canal> {ADD <apodo> <nivel>|DEL <apodo>|LIST}"
  example: "%command_prefix%\x02\x0303ACCESS #canal LIST\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303ACCESS #canal ADD Alicia 100\x03\x0f"
    - "%command_prefix%\x02\x0303ACCESS #canal DEL Alicia\x03\x0f"
  short: "Gestionar lista de acceso."
  help: "Gestiona la lista de acceso del canal."
  unknown_sub: "\x0304✗\x03 Subcomando desconocido \x02%sub%\x02. Usa LIST, ADD o DEL."
  level_range: "\x0304✗\x03 El nivel de acceso debe estar entre %min% y %max%."
  cannot_manage_level: "\x0304✗\x03 Solo puedes gestionar apodos con nivel estrictamente menor al tuyo."
  founder_not_in_list: "\x0304✗\x03 El fundador no está en la lista de acceso."
  max_entries: "\x0304✗\x03 Máximo %max% entradas de acceso por canal."

  # --- ACCESS LIST ---------------------------------------------------------
  list:
    syntax: "ACCESS <#canal> LIST"
    example: "%command_prefix%\x02\x0303ACCESS #canal LIST\x03\x0F"
    short: "Listar lista de acceso (requiere nivel ACCESSLIST)."
    help: "Muestra apodo y nivel de cada entrada."
    header: "\x0303Lista de acceso de \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 El canal \x02%channel%\x02 no tiene entradas de acceso."
    entry: "  #%index%: %nickname% (nivel %level%)"

  # --- ACCESS ADD ----------------------------------------------------------
  add:
    syntax: "ACCESS <#canal> ADD <apodo> <nivel>"
    example: "%command_prefix%\x02\x0303ACCESS #canal ADD Alicia 100\x03\x0F"
    short: "Añadir o actualizar nivel (requiere nivel ACCESSCHANGE)."
    help: "Nivel 1-499. Solo puedes asignar niveles por debajo del tuyo."
    done: "\x0303✔\x03 \x02%nickname%\x02 establecido a nivel %level%."
    notice_channel: "\x0303✔\x03 \x0302%from%\x03 establece a \x0314%to%\x03 a nivel \x0304%level%\x03"

  # --- ACCESS DEL ----------------------------------------------------------
  del:
    syntax: "ACCESS <#canal> DEL <apodo>"
    example: "%command_prefix%\x02\x0303ACCESS #canal DEL Alicia\x03\x0F"
    short: "Quitar de la lista (requiere nivel ACCESSCHANGE)."
    help: "Solo puedes quitar apodos con nivel menor al tuyo."
    not_in_list: "\x0304✗\x03 \x02%nickname%\x02 no está en la lista de acceso."
    done: "\x0303✔\x03 \x02%nickname%\x02 eliminado de la lista de acceso."
    notice_channel: "\x0304✗\x03 \x0302%from%\x03 quita a \x0314%to%\x03 de la lista de acceso"

# --- DELACCESS -------------------------------------------------------------
delaccess:
  syntax: "DELACCESS <#canal>"
  example: "%command_prefix%\x02\x0303DELACCESS #canal\x03\x0F"
  short: "Eliminar tu propio acceso del canal."
  help: |-
    Elimina tu entrada de acceso de la lista del canal. Debes estar identificado.
    El fundador no puede usar este comando.
  done: "\x0303✔\x03 Tu acceso ha sido eliminado de \x02%channel%\x02."
  not_in_list: "\x0304✗\x03 No tienes acceso en \x02%channel%\x02."
  founder_not_in_access: "\x0304✗\x03 Eres el fundador de \x02%channel%\x02 y no estás en la lista de acceso."
  notice_channel: "\x0304✗\x03 \x0302%nickname%\x03 elimina su acceso del canal"

# --- LEVELS ----------------------------------------------------------------
levels:
  syntax: "LEVELS <#canal> {LIST|SET <nivel> <valor>|RESET}"
  example: "%command_prefix%\x02\x0303LEVELS #canal LIST\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303LEVELS #canal SET OPDEOP 50\x03\x0f"
    - "%command_prefix%\x02\x0303LEVELS #canal RESET\x03\x0f"
  short: "Configurar los niveles del canal."
  help: |-
    Configura los niveles mínimos de acceso para las acciones del canal. Solo el
    fundador puede cambiar o restablecer niveles.
  unknown_sub: "\x0304✗\x03 Subcomando desconocido \x02%sub%\x02. Usa LIST, SET o RESET."
  unknown_key: "\x0304✗\x03 Clave de nivel \x02%key%\x02 desconocida o no soportada por este IRCd."
  value_range: "\x0304✗\x03 El valor debe estar entre %min% y %max%."

  # --- LEVELS LIST ---------------------------------------------------------
  list:
    syntax: "LEVELS <#canal> LIST"
    example: "%command_prefix%\x02\x0303LEVELS #canal LIST\x03\x0F"
    short: "Listar niveles."
    help: "Muestra cada clave y su valor (por defecto si no está fijado)."
    header: "\x0303Niveles de %channel%\x03"

  # --- LEVELS SET ----------------------------------------------------------
  set:
    syntax: "LEVELS <#canal> SET <nivel> <valor>"
    example: "%command_prefix%\x02\x0303LEVELS #canal SET OPDEOP 50\x03\x0F"
    short: "Establecer un nivel."
    help: "Valor -1 a 499. Solo fundador."
    done: "\x0303✔\x03 \x02%key%\x02 establecido a %value%."

  # --- LEVELS RESET --------------------------------------------------------
  reset:
    syntax: "LEVELS <#canal> RESET"
    example: "%command_prefix%\x02\x0303LEVELS #canal RESET\x03\x0F"
    short: "Restaurar todos los niveles por defecto."
    help: "Elimina todas las sobreescrituras. Solo fundador."
    done: "\x0303✔\x03 Niveles restaurados por defecto."

# --- VOICE -----------------------------------------------------------------
voice:
  syntax: "VOICE <#canal> <apodo>"
  example: "%command_prefix%\x02\x0303VOICE #canal Alicia\x03\x0F"
  short: "Dar modo voz en el canal."
  help: "Dar modo voz en el canal."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha recibido voz."
  user_not_on_channel: "\x0304✗\x03 El apodo \x02%nickname%\x02 no está en la red."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 da \x0304%mode%\x03 a \x0314%to%\x03"

# --- DEVOICE ---------------------------------------------------------------
devoice:
  syntax: "DEVOICE <#canal> <apodo>"
  example: "%command_prefix%\x02\x0303DEVOICE #canal Alicia\x03\x0F"
  short: "Quitar modo voz en el canal."
  help: "Quitar modo voz en el canal."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha sido devoiceado."

# --- INVITE ----------------------------------------------------------------
invite:
  syntax: "INVITE <#canal>"
  example: "%command_prefix%\x02\x0303INVITE #canal\x03\x0F"
  short: "Invitarse al canal."
  help: "Invitarse al canal."
  done: "\x0303✔\x03 Has sido invitado a \x02%channel%\x02."
  notice_channel: "\x0303✔\x03 \x0302%nickname%\x03 se invita al canal."

# --- ADMIN -----------------------------------------------------------------
admin:
  syntax: "ADMIN <#canal> <apodo>"
  example: "%command_prefix%\x02\x0303ADMIN #canal Alicia\x03\x0F"
  short: "Dar modo admin en el canal."
  help: "Dar modo admin en el canal. Solo si el IRCd soporta +a."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha recibido admin de canal."
  user_not_on_channel: "\x0304✗\x03 El apodo \x02%nickname%\x02 no está en la red."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 da \x0304%mode%\x03 a \x0314%to%\x03"
  not_supported: "\x0304✗\x03 Esta red no soporta el modo admin de canal (+a)."

# --- DEADMIN ---------------------------------------------------------------
deadmin:
  syntax: "DEADMIN <#canal> <apodo>"
  example: "%command_prefix%\x02\x0303DEADMIN #canal Alicia\x03\x0F"
  short: "Quitar modo admin en el canal."
  help: "Quitar modo admin en el canal."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha sido deadminado."

# --- HALFOP ----------------------------------------------------------------
halfop:
  syntax: "HALFOP <#canal> <apodo>"
  example: "%command_prefix%\x02\x0303HALFOP #canal Alicia\x03\x0F"
  short: "Dar modo semi-operador en el canal."
  help: "Dar modo semi-operador en el canal. Solo si el IRCd soporta +h."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha recibido halfop."
  user_not_on_channel: "\x0304✗\x03 El apodo \x02%nickname%\x02 no está en la red."
  notice_grant: "\x0303✔\x03 \x0302%from%\x03 da \x0304%mode%\x03 a \x0314%to%\x03"
  not_supported: "\x0304✗\x03 Esta red no soporta el modo halfop (+h)."

# --- DEHALFOP --------------------------------------------------------------
dehalfop:
  syntax: "DEHALFOP <#canal> <apodo>"
  example: "%command_prefix%\x02\x0303DEHALFOP #canal Alicia\x03\x0F"
  short: "Quitar modo semi-operador en el canal."
  help: "Quitar modo semi-operador en el canal."
  done: "\x0303✔\x03 \x02%nickname%\x02 ha sido dehalfopeado."

# --- AKICK -----------------------------------------------------------------
akick:
  syntax: "AKICK <#canal> {ADD <máscara> [expiración] [razón]|DEL {<máscara>|<número>}|LIST}"
  example: "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 0\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 7d Spam\x03\x0f"
    - "%command_prefix%\x02\x0303AKICK #canal DEL *!*@*\x03\x0f"
    - "%command_prefix%\x02\x0303AKICK #canal DEL 2\x03\x0f"
    - "%command_prefix%\x02\x0303AKICK #canal LIST\x03\x0f"
  short: "Gestionar lista de auto-kick."
  help: "Gestiona las entradas de autokick y su expiración opcional."
  unknown_sub: "\x0304✗\x03 Subcomando desconocido \x02%sub%\x02. Usa ADD, DEL o LIST."
  invalid_mask: "\x0304✗\x03 Formato de máscara inválido. Usa \x02apodo!ident@host\x02 con comodines (*)."
  dangerous_mask: "\x0304✗\x03 La máscara \x02%mask%\x02 es demasiado amplia. Debe contener al menos 4 caracteres alfanuméricos."
  protected_user: "\x0304✗\x03 El apodo \x02%nickname%\x02 tiene acceso en este canal."
  max_entries: "\x0304✗\x03 Máximo %max% entradas AKICK por canal."

  # --- AKICK ADD -----------------------------------------------------------
  add:
    syntax: "AKICK <#canal> ADD <máscara> [expiración] [razón]"
    example: "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 0\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canal ADD *!*@* 7d Spam\x03\x0f"
    short: "Añadir entrada AKICK."
    help: |-
      Añade una máscara a la lista de expulsión automática del canal.

      Puedes indicar una duración y una razón. Si incluyes una razón, debes
      especificar también la duración: 0 para permanente, d para días, h para
      horas o m para minutos.
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 añadido."
    already_exists: "\x0304✗\x03 AKICK \x02%mask%\x02 ya existe."
    notice_channel: "\x02%from%\x02 añade AKICK: \x02%mask%\x02 (%reason%)"

  # --- AKICK DEL -----------------------------------------------------------
  del:
    syntax: "AKICK <#canal> DEL {<máscara>|<número>}"
    example: "%command_prefix%\x02\x0303AKICK #canal DEL *!*@*\x03\x0f"
    examples:
      - "%command_prefix%\x02\x0303AKICK #canal DEL 2\x03\x0f"
    short: "Eliminar entrada AKICK."
    help: "Eliminar por máscara exacta o número de entrada de LIST."
    not_found: "\x0304✗\x03 AKICK \x02%mask%\x02 no encontrado."
    done: "\x0303✔\x03 AKICK \x02%mask%\x02 eliminado."
    notice_channel: "\x02%from%\x02 elimina AKICK: \x02%mask%\x02"

  # --- AKICK LIST ----------------------------------------------------------
  list:
    syntax: "AKICK <#canal> LIST"
    example: "%command_prefix%\x02\x0303AKICK #canal LIST\x03\x0F"
    short: "Listar entradas AKICK."
    help: "Muestra máscara, razón, expiración y quién añadió."
    header: "\x0303Lista AKICK de \x02%channel%\x02\x03"
    empty: "\x0307ℹ\x03 El canal \x02%channel%\x02 no tiene AKICKs."
    entry: "  #%index% %mask% %reason% (por %nickname%, expira: %expiration%)"

# --- RESTORE ---------------------------------------------------------------
restore:
  syntax: "RESTORE <#canal>"
  example: "%command_prefix%\x02\x0303RESTORE #canal\x03\x0F"
  short: "Restaurar un canal pendiente de eliminación."
  help: |-
    Restaura un canal que fue eliminado manualmente y aún está dentro del periodo
    de gracia.
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido restaurado."
  not_pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 no está pendiente de eliminación."

# --- DROP ------------------------------------------------------------------
drop:
  syntax: "DROP <#canal> [FORCE]"
  example: "%command_prefix%\x02\x0303DROP #canal\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303DROP #canal FORCE\x03\x0f"
  short: "Eliminar un canal registrado."
  help: |-
    Elimina un canal registrado de la base de datos.
    FORCE elimina permanentemente un canal pendiente de eliminación.
    Un IRCop con permiso DROP también puede liberar inmediatamente
    una solicitud rechazada, con o sin FORCE. FORCE requiere además DROP_FORCE.
  registration_restricted: "\x0304✗\x03 Esta solicitud de registro está restringida hasta %date%."
  force:
    short: "Elimina permanentemente un canal pendiente de eliminación."
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido marcado para eliminación y puede ser restaurado durante el periodo de gracia."
  force_success: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido eliminado permanentemente."
  pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 ya está pendiente de eliminación. Usa DROP <#canal> FORCE para eliminarlo permanentemente."
  invalid_channel: "\x0304✗\x03 Nombre de canal no válido. Usa \x02#canal\x02."
  pending_deletion_reason: "El canal %channel% está en proceso de eliminación. Más información /msg %bot% \x0303INFO %channel%\x03"

# --- SUSPEND ---------------------------------------------------------------
suspend:
  syntax: "SUSPEND <#canal> <duración> <razón>"
  example: "%command_prefix%\x02\x0303SUSPEND #canal 7d Incumplimiento de normas\x03\x0f"
  examples:
    - "%command_prefix%\x02\x0303SUSPEND #canal 0 Incumplimiento de normas\x03\x0f"
  short: "Suspender un canal."
  help: |-
    Desactiva temporalmente un canal registrado. Formatos de duración: 0 =
    permanente, 1d, 12h, 60m.
    Mientras esté suspendido, los modos, acceso y enforcement del canal están
    deshabilitados.
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido suspendido hasta \x02%duration%\x02."
  already_suspended: "\x0304✗\x03 El canal \x02%channel%\x02 ya está suspendido."
  invalid_duration: "\x0304✗\x03 Duración inválida. Usa: 0 (permanente), 1d, 12h o 60m."
  channel_suspended: "\x0304✗\x03 El canal \x02%channel%\x02 está suspendido y no puede ser usado."
  notice_channel: "\x0304⚠\x03 El canal ha sido suspendido. Razón: %reason%"

# --- UNSUSPEND -------------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <#canal>"
  example: "%command_prefix%\x02\x0303UNSUSPEND #canal\x03\x0F"
  short: "Levantar la suspensión de un canal."
  help: "Reactiva un canal suspendido, restaurando sus modos y enforcement."
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ya no está suspendido."
  not_suspended: "\x0304✗\x03 El canal \x02%channel%\x02 no está suspendido."
  reason_expired: "suspensión expirada"

# NOJOIN documentación para LEVELS:
# NOJOIN: Nivel mínimo de acceso para entrar al canal. Usuarios con nivel < NOJOIN son expulsados.
# Por defecto: -1 (deshabilitado). Pon 0 para permitir solo usuarios registrados, 50 para nivel 50+, etc.

# --- NOJOIN ----------------------------------------------------------------
nojoin:
  reason: "Restricción de nivel NOJOIN"


# Traducciones de ChanServ — Español
# Dominio: chanserv
#
# Códigos de formato IRC (comillas dobles o bloques literales !irc):
#   \x02        activa/desactiva la negrita
#   \x03NN      color (DECIMAL: 03=verde, 04=rojo, 07=naranja, 14=gris oscuro)
#   \x03        restablece el color
#   \x0F        restablece todo el formato
#
# Los colores IRC usan números DECIMALES (0-15), no hexadecimales.
#   \x0314 = gris oscuro (14 decimal): CORRECTO
#   \x030F = color 0 seguido de la letra F: ERROR
#
# Texto IRC multilínea: !irc |- con saltos físicos y espacios reales.
# Los bloques sin etiqueta no decodifican escapes; conserva los literales CTCP.
# Ejemplos HELP: example/examples y %command_prefix%.
# El presentador añade /msg sin color y un margen de dos espacios.

# --- ERROR -----------------------------------------------------------------
error:
  invalid_channel: "\x0304✗\x03 Nombre de canal no válido. Usa \x02#canal\x02."
  generic: "\x0304✗\x03 Ocurrió un error. Inténtalo de nuevo."

# --- REGISTER --------------------------------------------------------------
register:
  syntax: "REGISTER <#canal> <descripción>"
  example: "%command_prefix%\x02\x0303REGISTER #canal Proyecto comunitario\x03\x0F"
  short: "Registrar un canal."
  help: |-
    Registra y asocia un canal a tu apodo. Debes identificarte con %nickserv%.
    En modo APPROVAL, un IRCop debe aprobar la solicitud.
  success: "\x0303✔\x03 El canal \x02%channel%\x02 ha sido registrado."
  already_registered: "\x0304✗\x03 El canal \x02%channel%\x02 ya está registrado o en proceso de registro."
  channel_not_on_network: "\x0304✗\x03 El canal \x02%channel%\x02 no existe en la red."
  pending_deletion: "\x0304✗\x03 El canal \x02%channel%\x02 está pendiente de eliminación y no puede ser registrado."
  insufficient_channel_rank: "\x0304✗\x03 Debes tener al menos estado de operador en \x02%channel%\x02 para registrarlo."
  limit_exceeded: "\x0304✗\x03 Has alcanzado el máximo de %max% canales registrados."
  throttled: "\x0304✗\x03 Debes esperar \x02%minutes%\x02 minuto(s) antes de registrar otro canal."

  awaiting_approval: "\x0307✔\x03 La solicitud de registro de \x02%channel%\x02 espera la aprobación de un IRCop."
  restricted_indefinite: "\x0304✗\x03 Las nuevas solicitudes para \x02%channel%\x02 están bloqueadas indefinidamente."
  restricted_until: "\x0304✗\x03 Las nuevas solicitudes para \x02%channel%\x02 están bloqueadas hasta %date%"

# --- REGMODE ---------------------------------------------------------------
regmode:
  syntax: "REGMODE {DIRECT|APPROVAL|STATUS}"
  example: "%command_prefix%\x02\x0303REGMODE APPROVAL\x03\x0F"
  short: "Configurar o consultar el modo de registro de canales."
  help: |-
    Configura el registro como DIRECT o APPROVAL, o consulta STATUS.
    DIRECT es el modo predeterminado y mantiene el registro inmediato.

  status: "\x0307ℹ\x03 El modo de registro de canales es \x02%mode%\x02."
  changed: "\x0303✔\x03 El modo de registro de canales ahora es \x02%mode%\x02."

# --- CREG ------------------------------------------------------------------
creg:
  syntax: "CREG {PENDING [página]|ACCEPT <#canal>|REJECT <#canal> <razón>}"
  pending.syntax: "CREG PENDING [página]"
  pending.example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  pending.short: "Listar solicitudes de registro pendientes."
  pending.help: "Muestra las solicitudes pendientes en una página limitada."
  accept.syntax: "CREG ACCEPT <#canal>"
  accept.example: "%command_prefix%\x02\x0303CREG ACCEPT #canal\x03\x0F"
  accept.short: "Aprobar una solicitud de registro de canal."
  accept.help: "Vuelve a validar al solicitante y activa el registro pendiente."
  reject.syntax: "CREG REJECT <#canal> <razón>"
  reject.example: "%command_prefix%\x02\x0303CREG REJECT #canal Razón pública\x03\x0F"
  reject.short: "Rechazar una solicitud de registro de canal."
  reject.help: "Rechaza la solicitud con una razón obligatoria y una restricción."
  example: "%command_prefix%\x02\x0303CREG PENDING\x03\x0F"
  short: "Revisar solicitudes de registro de canales."
  help: |-
    Lista solicitudes pendientes o acepta o rechaza una solicitud.
    Los rechazos requieren una razón. Solo ACCEPT registra el canal.

  pending_header: "\x0314Registros pendientes (página %page%)\x03"
  pending_item: "  %channel% — solicitante %requester%, enviada %submitted%: %description%"
  accepted: "\x0303✔\x03 Se aprobó el registro de \x02%channel%\x02."
  rejected: "\x0303✔\x03 Se rechazó el registro de \x02%channel%\x02."
  not_pending: "\x0304✗\x03 El canal \x02%channel%\x02 no tiene un registro pendiente."
  channel_not_on_network: "\x0304✗\x03 El canal \x02%channel%\x02 no está en la red."
  founder_limit: "\x0304✗\x03 El solicitante alcanzó el límite de registros de canales."
  requester_inactive: "\x0304✗\x03 La cuenta solicitante ya no está activa."
  requester_ineligible: "\x0304✗\x03 La cuenta solicitante debe tener actualmente estado de operador en el canal."

# --- STATUS ----------------------------------------------------------------
status:
  syntax: "STATUS <#canal>"
  example: "%command_prefix%\x02\x0303STATUS #canal\x03\x0F"
  header: "\x02Estado del canal \x0307%channel%\x03\x02"
  short: "Mostrar el estado de registro de un canal."
  help: |-
    Indica si el canal no está registrado, espera aprobación, fue rechazado o
    está registrado.
    Los detalles del rechazo solo son visibles para el solicitante y los IRCops
    autorizados.

  unregistered: "  \x0314Estado                  \x03: Sin registrar"
  pending: "  \x0314Estado                  \x03: \x0307Pendiente de aprobación\x03"
  registered: "  \x0314Estado                  \x03: \x0303Registrado\x03"
  suspended: "  \x0314Estado                  \x03: \x0304Suspendido\x03"
  forbidden: "  \x0314Estado                  \x03: \x0304Prohibido\x03"
  pending_deletion: "  \x0314Estado                  \x03: \x0307Pendiente de eliminación\x03"
  rejected_private: "  \x0314Estado                  \x03: \x0304Registro rechazado\x03"
  rejected: "  \x0314Estado                  \x03: \x0304Registro rechazado\x03"
  rejection_reason: "  \x0314Razón                   \x03: %reason%"
  rejection_audit: "  \x0314Rechazado por           \x03: %operator% el %date%"
  restriction_until: "  \x0314Disponible a partir del \x03: %date%"
  footer: "\x0314─────────────────────────────\x03\x0F"

# --- INFO ------------------------------------------------------------------
info:
  syntax: "INFO <#canal>"
  example: "%command_prefix%\x02\x0303INFO #canal\x03\x0F"
  short: "Mostrar información del canal."
  help: |-
    Muestra información detallada de un canal registrado, incluyendo su
    propietario, datos de registro, última actividad y opciones de configuración.
  header: "\x02Información del canal \x0307%channel%\x03\x02"
  founder: "  \x0314Fundador\x03           : \x02%nickname%\x02"
  registered: "  \x0314Registrado\x03         : %date%"
  successor: "  \x0314Sucesor\x03            : \x02%nickname%\x02"
  description: "  \x0314Descripción\x03        : %desc%"

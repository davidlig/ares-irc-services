# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [komandoa]"
  short: "Erakutsi %nickserv% komandoentzako laguntza."
  help: |-
    %nickserv% laguntza orokorra edo komando zehatz baten
    informazio zehatza erakusten du.
  examples_header: "Adibideak:"
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP SET"
    - "%command_prefix%HELP SET EMAIL"
    - "%command_prefix%HELP SET TIMEZONE Europe"
  header_title: "%bot%"
  header: "%title%"
  navigation_marker: ""
  info_marker: ""
  error_marker: ""
  warning_marker: ""
  intro: |-
    Zure ezizena erregistratu eta babesteko aukera ematen du, beste erabiltzaileek
    erabil ez dezaten. Kudeatu zure kontuaren segurtasuna, pertsonalizatu zure
    hobespenak eta berreskuratu sarbidea behar duzunean.

# NickServ itzulpenak — Euskara
# Domeinua: nickserv
#
# IRC formatu-kodeak (komatxo bikoitzak edo !irc bloke literalak):
#   \x02        letra lodia aktibatu/desaktibatu
#   \x03NN      kolorea (HAMARTARRA: 03=berdea, 04=gorria, 07=laranja, 14=gris iluna)
#   \x03        kolorea berrezarri
#   \x0F        formatu osoa berrezarri
#
# IRC koloreek zenbaki HAMARTARRAK (0-15) erabiltzen dituzte, ez hamaseitarrak.
#   \x0314 = gris iluna (14 hamartarra): ZUZENA
#   \x030F = 0 kolorea eta ondoren F letra: OKERRA
#
# Lerro anitzeko IRC testua: !irc |- benetako lerro-jauzi eta zuriuneekin.
# Etiketarik gabeko blokeek ez dituzte ihesak deskodetzen; gorde CTCP literalak.
# HELP adibideak: example/examples eta %command_prefix%.
# Aurkezleak kolorerik gabeko /msg eta bi zuriuneko marjina gehitzen ditu.

# --- REGISTER -----------------------------------------------------------------
register:
  token_unavailable: !irc |-
    Erregistroa zain dago, baina ezin izan da tokena bidali.
    Itxaron erregistroa iraungi arte berriro erregistratu aurretik.
  syntax: "REGISTER <pasahitza> [email]"
  short: "Erregistratu zure ezizena zerbitzuetan."
  help: |-
    Erregistratu zure ezizena. Sareak egiaztapen-tokena txatez edo postaz
    bidaliko dizu, konfigurazioaren arabera. Balioztatu ondoren, tokena
    berreskuratze-token iraunkorra izango da: gorde leku seguruan. %duration%ko
    iraungitzea balioztatu aurretik bakarrik aplikatzen da.
    Administrazioak blokeatutako posta-domeinuak ez dira onartzen.
  example: "%command_prefix%REGISTER Pasahitz$Segurua_123"
  examples:
    - "%command_prefix%REGISTER Pasahitz$Segurua_123 erabiltzailea@adibidea.com"
  pending: |-
    %first%
    %second%
    %third%
    %fourth%
  pending_line_1: "Egiaztapen-tokena %email% helbidera bidali da."
  pending_line_2: "Exekutatu /msg %bot% %verify% erregistroa osatzeko."
  pending_line_3: "Ez duzu jaso? Begiratu spam karpeta edo erabili /msg %bot% %resend%"
  pending_line_4: "Tokena %duration% barru iraungiko da."
  already_registered: "%nickname% ezizena jada erregistratuta dago."
  already_pending: "%nickname% ezizenaren erregistroa zain dago. Erabili %verify%. %resend% erabilgarri dago REGMODE EMAIL denean eta baliozko posta-helbidea esleituta dagoenean bakarrik."
  forbidden: "%nickname% ezizena ezin da sare honetan erregistratu."
  pending_deletion: "%nickname% ezizena ezabatzearen zain dago eta ezin da erregistratu."
  invalid_email: "Emandako posta elektronikoko helbidea ez da baliozkoa."
  email_already_used: "%email% posta jada beste ezizen batek erabiltzen du. Erabili beste helbide bat."
  throttled: "%minutes% minutu itxaron behar duzu berriro erregistratzen saiatu aurretik."
  guest_prefix_forbidden: "Ezin duzu %prefix% aurrizkiarekin hasten den ezizenik erregistratu."

# --- IDENTIFY -----------------------------------------------------------------
identify:
  syntax: "IDENTIFY <ezizena> <pasahitza>"
  short: "Identifikatu zeure burua ezizen baten jabe gisa."
  help: |-
    Zure saioa %nickserv% zerbitzuarekin autentikatzen du zure ezizena eta pasahitza
    erabiliz.
    Identifikazio arrakastatsu baten ondoren %emphasis_0% modu erregistratua jasoko duzu
    eta, gonbidatu ezizen bat erabiltzen ari bazinen, zure ezizen erregistratua
    berreskuratuko da.
  example: "%command_prefix%IDENTIFY Erabiltzailea <pasahitza>"
  native_syntax: "/NICK <ezizena>:<pasahitza> | /NICK <ezizena>!<pasahitza>"
  native_short: "Erakutsi ezizenaren jatorrizko autentifikazio-sintaxia."
  native_help: |-
    Protokolo honek kontuak ezizen-aldaketen bidez autentifikatzen ditu.
    Erabili %emphasis_0% edo, ezizena hartuta badago, %emphasis_1%.
  native_example: "/NICK Erabiltzailea:<pasahitza>"
  native_examples:
    - "%command_prefix%/NICK Erabiltzailea!<pasahitza>"
  native_authentication: "Protokolo honek autentifikazioa ezizen-aldaketen bidez kudeatzen du. Erabili %command_0% edo, ezizena hartuta badago, %command_1%."
  native_authentication_command_0: "/NICK <ezizena>:<pasahitza>"
  native_authentication_command_1: "/NICK <ezizena>!<pasahitza>"
  success: "Orain %nickname% gisa identifikatuta zaude."
  already_identified: "Jada %nickname% gisa identifikatuta zaude."
  invalid_credentials: "Pasahitz okerra. Saiatu berriro."
  locked_out: "Porrot saiakera gehiegi. Saiatu berriro %minutes% minututan."
  ghost_released: "%nickname% ezizena eusten zuen mamua saioa deskonektatu da."
  kill_reason: "%nickname% ezizena %source%(e)k berreskuratu du (jabe erregistratuak identifikatu du)"
  pending: |-
    %first%
    %second%
  pending_line_1: "%nickname% ezizenak posta elektronikoaren egiaztapena zain du."
  pending_line_2: "Exekutatu /msg %bot% %command_0% edo /msg %bot% %command_1%."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "%nickname% ezizena etenda dago. Arrazoia: %reason%"
  forbidden: "%nickname% ezizena ezin da sare honetan erabili."
  pending_deletion: "%nickname% ezizena ezabatzearen zain dago eta ezin da erabili."

# --- VERIFY -------------------------------------------------------------------
verify:
  syntax: "VERIFY <token>"
  short: "Erregistroa edo erreskate-tokena berresten du."
  help: |-
    Balioztatu ondoren, token hau berreskuratze-token iraunkorra izango da.
    Gorde leku seguruan: ezizena berreskuratzeko erabil dezakezu.
    %duration%ko iraungitzea balioztatu aurretik bakarrik aplikatzen da.
  example: "%command_prefix%VERIFY <jasotako_tokena>"
  success: "%nickname% ezizena arrakastaz erregistratu da eta orain identifikatuta zaude."
  success_native: "%nickname% ezizena behar bezala erregistratu da. Erabili behean agertzen den jatorrizko autentifikazioa."
  invalid_token: "Erreskate-tokena baliogabea da."
  no_pending: "Ez duzu egiaztatzeko zain dagoen erregistrorik."

# --- RESEND -------------------------------------------------------------------
resend:
  disabled: "Ezin duzu beste tokenik eskatu %resend% erabiliz, erregistro honek tokena zuzenean txatez bidaltzen duelako."
  syntax: "RESEND"
  short: "Berbidali egiaztapen tokena zure posta elektronikora."
  help: |-
    RESEND erabilgarri dago egiaztapen-tokena postaz bidali bada soilik.
    Balioztatu ondoren, token hau berreskuratze-token iraunkorra izango da.
    Gorde leku seguruan, ezizena berreskuratzeko erabil dezakezu.
    %duration%ko iraungitzea balioztatu aurretik bakarrik aplikatzen da.
    RESEND erabilita token berria jasoko duzu postaz.
    Zain dagoen erregistroaren epea %duration%z berrituko da.
  example: "%command_prefix%RESEND"
  success: "Egiaztapen tokena %email% helbidera berbidali da."
  no_pending: "Ez duzu egiaztatzeko zain dagoen erregistrorik."
  throttled: "%minutes% minutu itxaron behar duzu beste egiaztapen posta elektroniko bat eskatu aurretik."

# --- RECOVER ------------------------------------------------------------------
recover:
  no_email: "Ez dago posta elektronikorik ezarrita %nickname% ezizenarentzat. Berreskurapena ez dago erabilgarri."
  email_sent: "Berreskuratze token bat bidali da %email_hint% helbidera. Egiaztatu sarrera-ontzia (eta spam karpeta)."
  pending_deletion: "%nickname% ezizena ezabatzeko zain dago eta ezin da berreskuratu."
  instructions: "EMAIL: %command_0% komandoak behin-behineko tokena eskatzen du postaz. TOKEN: eman berretsitako tokena. %command_1% komandoak posta-token balioduna edo berretsitakoa onartzen du. Postakoak gordetakoa balioztatu ondoren bakarrik ordezten du. Gordetakoak aukerako ordezkapena eskaintzen du %command_2% bidez; ez ikusi egin mezua mantentzeko."
  instructions_command_0: "RECOVER %nickname%"
  instructions_command_1: "RECOVER %nickname% <token>"
  instructions_command_2: "VERIFY"
  syntax: "RECOVER <ezizena> [tokena]"
  short: "Berreskuratu zure ezizena pasahitza galdu baduzu."
  help: |-
    EMAIL: RECOVER <nickname> komandoak behin-behineko tokena eskatzen du postaz.
    TOKEN: eman berretsitako tokena. RECOVER <nickname> <token> komandoak
    posta-token balioduna edo berretsitakoa onartzen du. Postakoak gordetakoa
    balioztatu ondoren bakarrik ordezten du. Gordetakoak aukerako ordezkapena
    eskaintzen du VERIFY bidez; ez ikusi egin mezua mantentzeko.
  example: "%command_prefix%RECOVER Erabiltzailea"
  examples:
    - "%command_prefix%RECOVER Erabiltzailea <jasotako_tokena>"
  pending: "%nickname% ezizenaren erregistroa zain dago. Erabili %command_0%. %command_1% erabilgarri dago REGMODE EMAIL denean eta baliozko posta-helbidea esleituta dagoenean bakarrik."
  pending_command_0: "VERIFY <token>"
  pending_command_1: "RESEND"
  suspended: "%nickname% ezizena etenda dago. Arrazoia: %reason%"
  forbidden: "%nickname% ezizena ezin da sare honetan erabili."
  throttled: "Token oker gehiegi. Saiatu berriro %minutes% minutu barru."
  invalid_token: "Erreskate-tokena baliogabea da."
  success_identify: "Pasahitza berrezarrita. Identifikatu orain: %identify_cmd%"
  success_then_change: "Ondoren aldatu zure pasahitza: /msg %bot% %command_0%"
  success_then_change_command_0: "SET PASSWORD <pasahitz_berria>"

# --- SET ----------------------------------------------------------------------
set:
  syntax: "SET {PASSWORD <pasahitz_berria>|EMAIL <email> <token>|LANGUAGE <kodea>|TIMEZONE <ordu-zona>|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost-a]}"
  short: "Aldatu zure ezizenaren aukerak."
  help: |-
    Zure ezizenaren ezarpenak aldatzen ditu. Aukera hauek aldatzeko
    identifikatuta egon behar duzu.
  example: "%command_prefix%SET LANGUAGE es"
  examples:
    - "%command_prefix%SET TIMEZONE Europe/Madrid"
  unknown_option: "Aukera ezezaguna %option%. Aukera erabilgarriak: %options%."

  # --- SET PASSWORD --------------------------------------------------------
  password:
    syntax: "SET PASSWORD <pasahitz_berria>"
    short: "Aldatu zure ezizenaren pasahitza."
    help: |-
      Zure ezizenaren pasahitza aldatzen du. Pasahitz berriak
      berehala eragiten du. Aukeratu gutxienez 6 karaktereko pasahitz sendo bat
      beste zerbitzuetan erabiltzen ez duzuna.
    example: "%command_prefix%SET PASSWORD Pasahitz$Segurua_123"
    success: "Zure pasahitza arrakastaz eguneratu da."

  # --- SET EMAIL -----------------------------------------------------------
  email:
    token_required: "Erabili %value% berretsitako erreskate-tokenarekin."
    token_required_value: "SET EMAIL <email> <token>"
    syntax: "SET EMAIL <email> <token>"
    short: "Aldatu zure ezizenari lotutako posta elektroniko helbidea (bi urratseko berrespena)."
    help: |-
      SET EMAIL komandoak kontaktu-helbidea aldatzen du erreskate-tokena balioztatu
      ondoren, kontsumitu gabe. Formatua eta bakartasuna egiaztatzen ditu; ez du
      berrespen-mezurik bidaltzen.
      Administrazioak blokeatutako posta-domeinuak ez dira onartzen.
    example: "%command_prefix%SET EMAIL erabiltzailea@adibidea.com <token-berretsia>"
    success: "Zure posta elektronikoa %email% helbidera eguneratu da."
    pending_sent: |-
      %first%
      %second%
      %third%
      %fourth%
    pending_line_1: "Berrespen token bat bidali da %current_email% helbidera."
    pending_line_2: "%new_email% helbiderako aldaketa baieztatzeko exekutatu:"
    pending_line_3: "/msg %bot% %command%"
    pending_line_4: "Tokena ordubetean iraungitzen da."
    pending_command: "SET EMAIL %new_email% <token>"
    invalid_token: "Tokena baliogabea da edo iraungi da. Eskatu berri bat honekin %value%."
    invalid_token_value: "SET EMAIL <posta_berria>"

  # --- SET LANGUAGE --------------------------------------------------------
  language:
    syntax: "SET LANGUAGE <kodea>"
    short: "Aldatu zerbitzuek zurekin komunikatzeko erabiltzen duten hizkuntza."
    help: |-
      %nickserv% eta beste zerbitzuek zurekin hitz egitean erabiltzen duten hizkuntza
      aldatzen du. Hizkuntza erabilgarriak:
      %emphasis_0% (Katalana)
      %emphasis_1% (Alemana)
      %emphasis_2% (Greziera)
      %emphasis_3% (Ingelesa)
      %emphasis_4% (Gaztelania)
      %emphasis_5% (Euskara)
      %emphasis_6% (Frantsesa)
      %emphasis_7% (Galiziera)
      %emphasis_8% (Italiera)
      %emphasis_9% (Nederlandera)
      %emphasis_10% (Poloniera)
      %emphasis_11% (Portugesa)
      %emphasis_12% (Errumaniera)
      %emphasis_13% (Turkiera)
    example: "%command_prefix%SET LANGUAGE es"
    success: "Hizkuntza %language%(e)ra aldatu da."
    invalid: "Onartu gabeko hizkuntza. Hizkuntza erabilgarriak: %languages%."

  # --- SET TIMEZONE --------------------------------------------------------
  timezone:
    syntax: "SET TIMEZONE <ordu-zona>"
    short: "Ezarri datak erakustean erabiltzen den ordu-zona."
    help: |-
      %nickserv% zerbitzuak datak erakusteko erabiltzen duen ordu-eremua ezartzen du.
      Erabili HELP SET TIMEZONE eskualdeak ikusteko. Erabili OFF kentzeko.
    example: "%command_prefix%SET TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SET TIMEZONE OFF"
    success: "Ordu-zona %timezone% gisa ezarri da. Datak ordu-zona honetan erakutsiko dira."
    cleared: "Ordu-zona garbitu da. Datek sarearen lehenetsia erabiliko dute."
    invalid: "Ordu-zona baliogabea %timezone%. Erabili identifikatzaile baliozko bat (adib. UTC, Europe/Madrid)."

  # --- SET PRIVATE ---------------------------------------------------------
  private:
    syntax: "SET PRIVATE {ON|OFF}"
    short: "Gaitu edo desgaitu pribatutasuna zure ezizenaren informaziorako."
    help: |-
      Zure ezizenaren informazioaren ikusgarritasuna kontrolatzen du INFO komandoan.
      %emphasis_0% dagoenean zuk eta IRC Operadoreek soilik ikus ditzakezue zure
      xehetasunak.
      %emphasis_1% dagoenean zure informazioa guztiontzat publikoa da.
    example: "%command_prefix%SET PRIVATE ON"
    examples:
      - "%command_prefix%SET PRIVATE OFF"
    on: "Zure ezizenaren informazioa orain %value% da."
    on_value: "pribatua"
    off: "Zure ezizenaren informazioa orain %value% da."
    off_value: "publikoa"

  # --- SET MSG -------------------------------------------------------------
  msg:
    syntax: "SET MSG {ON|OFF}"
    short: "Erabili PRIVMSG (ON) edo NOTICE (OFF) zerbitzuen erantzunetarako."
    help: |-
      %nickserv% eta beste zerbitzuek zuri mezuak nola bidaltzen dizkizuten
      kontrolatzen du.
      %emphasis_0% dagoenean erantzunak %emphasis_1% gisa bidaltzen dira (bezero batzuek
      erantzunak edo jakinarazpenak aktiba ditzakete).
      %emphasis_2% dagoenean erantzunak %emphasis_3% gisa bidaltzen dira (lehenetsia; normalean
      ez du erantzun automatikorik).
    example: "%command_prefix%SET MSG ON"
    examples:
      - "%command_prefix%SET MSG OFF"
    on: "Zerbitzuen mezuak orain %value% gisa bidaliko dira."
    on_value: "PRIVMSG"
    off: "Zerbitzuen mezuak orain %value% gisa bidaliko dira."
    off_value: "NOTICE"

  # --- SET VHOST -----------------------------------------------------------
  vhost:
    syntax: "SET VHOST [vhost-a]"
    short: "Ezarri edo garbitu zure ostalari birtual pertsonalizatua (erakutsitako ostalari izena)."
    help: |-
      Identifikatuta zaudenean beste erabiltzaileek ikusiko duten ostalari-izen
      pertsonalizatua ezartzen du.

      Kentzeko, exekutatu %emphasis_0% baliorik gabe.

      Letrak (a-z, A-Z), digituak, marratxoak eta puntuak soilik onartzen dira.
      Zati bakoitza letra edo digitu batekin hasi eta amaitu behar da. Ostalari-izenak
      gehienez 48 karaktere izan ditzake eta ezizen bakoitzeko bakarra izan behar du.
    example: "%command_prefix%SET VHOST erabiltzailea.adibidea.org"
    examples:
      - "%command_prefix%SET VHOST"
    success: "Zure ostalari birtuala %vhost% gisa ezarri da."
    cleared: "Zure ostalari birtuala garbitu da."
    invalid: "Vhost baliogabea. Letrak, digituak, marra eta puntua soilik (ez blokearen hasieran/amaieran); gehienez 48 karaktere."
    taken: "Vhost hori jada beste ezizen batek erabiltzen du."
    forced: "Zure vhost-a automatikoki konfiguratuta dago eta ezin da SET VHOST bidez aldatu."


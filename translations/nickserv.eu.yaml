# --- NICK PROTECTION ----------------------------------------------------------
protection:
  nick_in_use: "%nickname% ezizena erregistratuta dago. Izena aldatuko zaizu identifikatzen ez bazara."
  renamed_to: |-
    %guest_nick% izenera aldatu zara. Zure ezizena berreskuratzeko:
    /msg %bot% %identify%
  renamed_command: "IDENTIFY %nickname% <pasahitza>"
  nick_forbidden: "%nickname% ezizena debekatua dago: %reason%"

# --- USERIP (IRCop) -----------------------------------------------------------
userip:
  syntax: "USERIP <ezizena>"
  short: "Lortu ezizenaren benetako IP helbidea eta ostalari izena."
  help: |-
    Ezizen baten benetako IP helbidea eta ostalari-izena erakusten ditu.
    Erabili arduraz: informazio sentikorra da.
  example: "%command_prefix%USERIP Erabiltzailea"
  result: "Ezizena: %nickname% | IPa: %ip% | Ostalaria: %host%"

# --- WHOIP (IRCop) ------------------------------------------------------------
whoip:
  syntax: "WHOIP <ip>"
  short: "Bilatu ezizenak azken identifikatutako konexioaren IP helbidearen arabera."
  help: |-
    Azken identifikatutako konexioan IP helbide hau erabili zuten ezizen
    erregistratuak erakusten ditu. Gordetako helbidea zaharkituta egon daiteke.
  example: "%command_prefix%WHOIP 192.0.2.10"
  empty: "Ez da IP honekin bat datorren ezizen erregistraturik aurkitu."
  header: "Bat datozen ezizenak:"

# --- LIST (IRCop) -------------------------------------------------------------
list:
  syntax: "LIST <eredua> [orria]"
  short: "Eredu batekin bat datozen goitizen erregistratuak zerrendatzen ditu."
  help: |-
    Ereduarekin bat datozen ezizen erregistratuak zerrendatzen ditu. * komodinak
    karaktere-segida oro adierazten du; aukerako orria 1etik hasten da.
  example: "%command_prefix%LIST Erabiltzailea*"
  examples:
    - "%command_prefix%LIST Erabiltzailea* 2"
  header: "Goitizena | Erregistroa | Azken konexioa | IPa | Egoera"
  row: "%nickname% | %registered% | %last_seen% | %ip% | %status%"
  empty: "Ez dago %pattern% ereduarekin bat datorren goitizenik."
  status_pending: "Zain"
  status_registered: "Erregistratuta"

# --- HISTORY ---
history:
  syntax: "HISTORY <ezizena> {ADD <mezua>|DEL <ida>|VIEW [PAGE|ALL]|CLEAR}"
  short: "Ikusi edo kudeatu ezizenaren ekintza historia."
  help: |-
    Ezizen baten ekintza historia kudeatzen du.
    'nickserv.history' baimena duten IRCopek soilik erabil dezakete komando hau.

    Automatikoki grabatutako ekintzak:
      SUSPEND, UNSUSPEND, SET PASSWORD, SET EMAIL, SASET PASSWORD,
      SASET EMAIL, RECOVER

    Sintaxia: HISTORY <ezizena> ADD <mezua>
            HISTORY <ezizena> DEL <ida>
            HISTORY <ezizena> VIEW [ORRIA|ALL]
            HISTORY <ezizena> CLEAR

    Adibideak:
      HISTORY EzizenBat VIEW
      HISTORY EzizenBat ADD Erabiltzaile honi buruzko oharra
      HISTORY EzizenBat VIEW 2
      HISTORY EzizenBat VIEW ALL
      HISTORY EzizenBat DEL 123
      HISTORY EzizenBat CLEAR

    Erabili VIEW historia ikusteko (3 sarrera erakusten ditu lehenetsiz).
    Erabili VIEW PAGE 2 hurrengo orria ikusteko.
    Erabili VIEW ALL historia osoa ikusteko.
    Erabili ADD eskuzko sarrera bat gehitzeko.
    Erabili DEL ID zehatz baten sarrera ezabatzeko.
    Erabili CLEAR historia sarrera guztiak ezabatzeko.
  example: "%command_prefix%HISTORY Erabiltzailea VIEW"
  examples:
    - "%command_prefix%HISTORY Erabiltzailea VIEW ALL"
    - "%command_prefix%HISTORY Erabiltzailea ADD Nota manual"

  # --- HISTORY ADD ---------------------------------------------------------
  add:
    syntax: "HISTORY <ezizena> ADD <mezua>"
    short: "Gehitu eskuzko historia sarrera bat."
    help: "Eskuzko sarrera bat gehitzen dio ezizenaren historiari."
    example: "%command_prefix%HISTORY Erabiltzailea ADD Reportado por spam"
    success: "Historia sarrera gehitu da %nickname% ezizenarentzat."

  # --- HISTORY DEL ---------------------------------------------------------
  del:
    syntax: "HISTORY <ezizena> DEL <ida>"
    short: "Ezabatu historia sarrera bat IDaren arabera."
    help: "Historiako sarrera zehatz bat ezabatzen du, IDa erabiliz."
    example: "%command_prefix%HISTORY Erabiltzailea DEL 42"

  # --- HISTORY VIEW --------------------------------------------------------
  view:
    syntax: "HISTORY <ezizena> VIEW [ORRIA|ALL]"
    short: "Ikusi ezizenaren ekintza historia."
    help: |-
      Ezizenaren ekintzen historia erakusten du. Lehenespenez hiru sarrera
      erakusten ditu orrialdeko. Erabili ALL denak ikusteko.
    example: "%command_prefix%HISTORY Erabiltzailea VIEW"
    examples:
      - "%command_prefix%HISTORY Erabiltzailea VIEW 2"
      - "%command_prefix%HISTORY Erabiltzailea VIEW ALL"
    header: "%heading% (%total%etik %start%-%end% erakusten):"
    header_title: "%nickname% ezizenaren historia"
    entry: "#%id% [%date%] %action% by %operator% — %message%"
    no_entries: "Ez da historia sarrerarik aurkitu %nickname% ezizenarentzat."
    page_hint: "Erabili %command% sarrera gehiagotarako."
    page_hint_command: "HISTORY %nickname% VIEW %next_page%"

  # --- HISTORY CLEAR -------------------------------------------------------
  clear:
    syntax: "HISTORY <ezizena> CLEAR"
    short: "Ezabatu ezizen baten historia sarrera guztiak."
    help: "Ezizenaren historiako sarrera guztiak modu itzulezinean ezabatzen ditu."
    example: "%command_prefix%HISTORY Erabiltzailea CLEAR"
    success: "%count% historia sarrera garbitu dira %nickname% ezizenarentzat."

# --- HISTORY MESSAGES ---
history.message:
  verify: "Kontua aktibatu da"
  resend: "Egiaztapen-mezua berriz bidali da"
  noexpire_on: "Iraungitze-babesa aktibatu da"
  noexpire_off: "Iraungitze-babesa desaktibatu da"
  userip: "USERIP kontsulta"
  history_clear: "Historia ezabatu da"
  password_changed_owner: "Pasahitza jabeak aldatua"
  password_changed_operator: "Pasahitza operadoreak aldatua"
  email_changed_owner: "Posta %old_email%-(e)tik %new_email%-(e)ra aldatua"
  email_changed_operator: "Posta %new_email%-(e)ra aldatua operadoreak"
  recover: "Pasahitza posta tokenaren bidez berrezarria"
  saregister: "Kontua administratiboki erregistratua"

# --- HISTORY EXTRA FIELDS ---
history.extra:
  old_email: "Posta zaharra: %value%"
  new_email: "Posta berria: %value%"
  method: "Metodoa: %value%"

# --- SAREGISTER (IRCop) -------------------------------------------------------
saregister:
  syntax: "SAREGISTER <ezizena> <pasahitza> [email]"
  short: "Ezizen bat administratiboki erregistratu."
  help: |-
    Sintaxia: SAREGISTER <ezizena> <pasahitza> [email]

    Ezizen bat administratiboki erregistratzen du berehala, bezeroaren
    egiaztapenik edo maiztasun-mugarik eskatu gabe.

    TOKEN moduan, erreskate-tokena behin erakusten zaio operadoreari.
    EMAIL moduan, erreskate-tokena zehaztutako helbide elektronikora bidaltzen da.
  example: "%command_prefix%SAREGISTER Alice Pasahitza123"
  examples:
    - "%command_prefix%SAREGISTER Bob Pasahitza456 bob@adibidea.eus"
  success_token: "%nickname% ezizena erregistratu da. Erreskate-tokena: %token%"
  success_email: "%nickname% ezizena erregistratu da. Erreskate-tokena %email% helbidera bidali da."
  invalid_nickname: "%nickname% ezizena ez da baliozkoa."

# --- SASET (IRCop) ------------------------------------------------------------
saset:
  syntax: "SASET <ezizen> {PASSWORD <pasahitz_berria>|EMAIL <posta_berria>|LANGUAGE <kodea>|TIMEZONE {<ordu_zona>|OFF}|PRIVATE {ON|OFF}|MSG {ON|OFF}|VHOST [vhost]}"
  short: "Beste ezizen baten ezarpenak aldatu."
  help: |-
    IRC Operadore bati erregistratutako ezizen baten ezarpenak aldatzea ahalbidetzen
    dio.
    Helburuko ezizena ezin da root erabiltzaile, IRC Operadore edo zerbitzu ezizen
    bat izan.

    Aukera erabilgarriak: PASSWORD, EMAIL, LANGUAGE, TIMEZONE, PRIVATE, MSG, VHOST

    SASET PASSWORD: Pasahitza zuzenean aldatzen du (berrespenik gabe).
    SASET EMAIL: Posta elektronikoa zuzenean aldatzen du (token balidaziorik gabe).

    Komando honek IRCop baimena behar du: nickserv.saset

    Sintaxia: SASET <ezizen> <aukera> <balio>
    Adibidea: SASET Erabiltzaile PASSWORD pasahitzberria
  example: "%command_prefix%SASET Erabiltzailea PRIVATE ON"
  examples:
    - "%command_prefix%SASET Erabiltzailea TIMEZONE OFF"
  unknown_option: "Aukera ezezaguna %option%. Aukera erabilgarriak: %options%."
  cannot_modify_oper: "Ezin da IRC Operadore baten ezizena aldatu."

  # --- SASET PASSWORD ------------------------------------------------------
  password:
    syntax: "SASET <ezizen> PASSWORD <pasahitz_berria>"
    short: "Ezizen baten pasahitza aldatu."
    help: |-
      Beste ezizen baten pasahitza aldatzen du.
      Aldaketa berehalakoa da.

      Sintaxia: SASET <ezizen> PASSWORD <pasahitz_berria>
      Adibidea: SASET Erabiltzaile PASSWORD pasahitzberria123
    example: "%command_prefix%SASET Erabiltzailea PASSWORD ClaveSegura123"

  # --- SASET EMAIL ---------------------------------------------------------
  email:
    syntax: "SASET <ezizen> EMAIL <posta_berria>"
    short: "Ezizen baten posta elektronikoa aldatu."
    help: |-
      Beste ezizen baten posta elektronikoa aldatzen du.
      Ez da berrespenik bidaltzen—aldaketa berehalakoa da.

      Sintaxia: SASET <ezizen> EMAIL <posta_berria>
      Adibidea: SASET Erabiltzaile EMAIL erabiltzaile@adibidea.com
      BADMAILek ez du administrazioaren posta-aldaketa hau mugatzen.
    example: "%command_prefix%SASET Erabiltzailea EMAIL erabiltzailea@adibidea.com"

  # --- SASET LANGUAGE ------------------------------------------------------
  language:
    syntax: "SASET <ezizen> LANGUAGE <kodea>"
    short: "Ezizen baten hizkuntza aldatu."
    help: |-
      Beste ezizen baten hizkuntza aldatzen du.
      Hizkuntza erabilgarriak: en (ingelesa), es (espainiera).

      Sintaxia: SASET <ezizen> LANGUAGE <kodea>
      Adibidea: SASET Erabiltzaile LANGUAGE eu
    example: "%command_prefix%SASET Erabiltzailea LANGUAGE es"

  # --- SASET TIMEZONE ------------------------------------------------------
  timezone:
    syntax: "SASET <ezizen> TIMEZONE {<ordu_zona>|OFF}"
    short: "Ezizen baten ordu-zona aldatu."
    help: |-
      Beste ezizen baten ordu-zona ezartzen edo garbitzen du.
      Erabili OFF garbitzeko.

      Sintaxia: SASET <ezizen> TIMEZONE <ordu_zona>
      Adibidea: SASET Erabiltzaile TIMEZONE Europe/Madrid
    example: "%command_prefix%SASET Erabiltzailea TIMEZONE Europe/Madrid"
    examples:
      - "%command_prefix%SASET Erabiltzailea TIMEZONE OFF"

  # --- SASET PRIVATE -------------------------------------------------------
  private:
    syntax: "SASET <ezizen> PRIVATE {ON|OFF}"
    short: "Ezizen baten pribatutasuna aldatu."
    help: |-
      Beste ezizen baten informazioaren pribatutasuna gaitu edo desgaitu.

      Sintaxia: SASET <ezizen> PRIVATE {ON|OFF}
      Adibidea: SASET Erabiltzaile PRIVATE ON
    example: "%command_prefix%SASET Erabiltzailea PRIVATE ON"
    examples:
      - "%command_prefix%SASET Erabiltzailea PRIVATE OFF"

  # --- SASET MSG -----------------------------------------------------------
  msg:
    syntax: "SASET <ezizen> MSG {ON|OFF}"
    short: "Ezizen baten mezuen hobespena aldatu."
    help: |-
      Beste ezizen batek erantzunak PRIVMSG (ON) edo NOTICE (OFF) gisa jasoko dituen
      ezartzen du.

      Sintaxia: SASET <ezizen> MSG {ON|OFF}
      Adibidea: SASET Erabiltzaile MSG ON
    example: "%command_prefix%SASET Erabiltzailea MSG ON"
    examples:
      - "%command_prefix%SASET Erabiltzailea MSG OFF"

  # --- SASET VHOST ---------------------------------------------------------
  vhost:
    syntax: "SASET <ezizen> VHOST [vhost]"
    short: "Ezizen baten ostalari birtuala aldatu."
    help: |-
      Beste ezizen baten ostalari birtuala ezartzen edo kentzen du. Kentzeko,
      exekutatu SASET <ezizena> VHOST baliorik gabe.
    example: "%command_prefix%SASET Erabiltzailea VHOST erabiltzailea.adibidea.org"
    examples:
      - "%command_prefix%SASET Erabiltzailea VHOST"

# --- RENAME (IRCop) -----------------------------------------------------------
rename:
  syntax: "RENAME <ezizena>"
  short: "Behartu konektatutako ezizen bat ausazko ezizen batera izenaz aldatzea."
  help: |-
    Konektatutako ezizen bat sareak zehaztutako aurrizkia duen ausazko izen
    batera aldatzera behartzen du.
  example: "%command_prefix%RENAME ArazoSortzailea"
  cannot_rename_root: "Ezin da root erabiltzaile %nickname% izenaz aldatu."
  cannot_rename_oper: "Ezin da IRC operadore %nickname% izenaz aldatu."
  cannot_rename_service: "Ezin da zerbitzu ezizen %nickname% izenaz aldatu."
  success: "%nickname% ezizena %new_nick% izenera aldatu da."

# --- NOEXPIRE (IRCop) ---------------------------------------------------------
noexpire:
  syntax: "NOEXPIRE <ezizena> {ON|OFF}"
  short: "Ezarri edo kendu iraungitze babesa ezizen batentzat."
  help: |-
    Ezizena jarduerarik ezagatik iraungitzen den kontrolatzen du.
    ONek iraungitzea saihesten du; OFFek ohiko arauak aplikatzen ditu.
  example: "%command_prefix%NOEXPIRE Erabiltzailea ON"
  examples:
    - "%command_prefix%NOEXPIRE Erabiltzailea OFF"
  success_on: "%nickname% ezizena iraungitzetik babestuta dago orain."
  success_off: "%nickname% ezizena normal iraungiko da orain."
  forbidden: "%nickname% ezizena debekatua dago."
  suspended: "%nickname% ezizena etenda dago."

# --- REGMODE (IRCop) ----------------------------------------------------------
regmode:
  syntax: "REGMODE {EMAIL|TOKEN|STATUS}"
  short: "Sareko erregistro modua kudeatu."
  help: |-
    Kontu berrien erregistro-modua konfiguratzen du.

    %emphasis_0% Egiaztapen-tokena erabiltzailearen posta-helbidera bidaltzen du.
    %emphasis_1% Egiaztapen-tokena zuzenean IRC bidez ematen du.
    %emphasis_2% Uneko erregistro-modua erakusten du, aldatu gabe.

    Zain dauden erregistroek hasierako modua mantentzen dute.

    TOKEN moduan, RESEND desgaituta dago erabiltzaile guztientzat.
  example: "%command_prefix%REGMODE STATUS"
  examples:
    - "%command_prefix%REGMODE EMAIL"
    - "%command_prefix%REGMODE TOKEN"
  status: "Uneko erregistro modua: %mode%."
  changed: "Erregistro modua %mode% modura aldatu da."

# --- SUSPEND (IRCop) ----------------------------------------------------------
suspend:
  syntax: "SUSPEND <ezizena> <iraupena> <arrazoia>"
  short: "Etten du ezizen bat."
  help: |-
    Jabeari identifikatzea eragozten dio. Iraupena egunetan (d), orduetan (h),
    minututan (m) edo 0 gisa adieraz daiteke, etenaldi iraunkorra izateko.
    Ezin dira IRC operadoreak edo Root erabiltzaileak eten.
  example: "%command_prefix%SUSPEND ErabiltzaileGaiztoa 7d Spam en #laguntza"
  examples:
    - "%command_prefix%SUSPEND ArazoSortzailea 0 Debekua saihestea"
  success: "%nickname% ezizena %duration% arte eten da."
  already_suspended: "%nickname% ezizena jada etenda dago."
  forbidden: "%nickname% ezizena debekatua dago eta ezin da eten."
  cannot_suspend_oper: "Ezin da IRC operadore %nickname% eten."
  cannot_suspend_root: "Ezin da root erabiltzaile %nickname% eten."
  cannot_suspend_service: "Ezin da zerbitzu ezizen %nickname% eten."
  invalid_duration: "Iraupen baliogabea. Erabili: %duration_format% (adib., 7d, 12o, 30m) edo %permanent% iraunkorrerako."
  invalid_duration_format: "<d><o><m>"
  invalid_duration_permanent: "0"

# --- UNSUSPEND (IRCop) --------------------------------------------------------
unsuspend:
  syntax: "UNSUSPEND <ezizena>"
  short: "Kendu ezizen baten etenaldia."
  help: |-
    Ezizen baten etenaldi aktiboa kentzen du, jabea berriro identifikatzea
    ahalbidetuz.

    Sintaxia: UNSUSPEND <ezizena>
    Adibidea: UNSUSPEND ErabiltzaileBat
  example: "%command_prefix%UNSUSPEND Erabiltzailea"
  success: "%nickname% ezizenaren etenaldia kendu da."
  not_suspended: "%nickname% ezizena ez dago etenda."

# --- FORBID (IRCop) -----------------------------------------------------------
forbid:
  syntax: "FORBID <ezizena> <arrazoia>"
  short: "Betirako blokeatu ezizen bat erabilia izatea."
  help: |-
    Ezizen bat sarean erabilia izatea debekatzen du.
    Ezizena ezin da erregistratu edo inork erabili.

    Ezizena unean erregistratuta badago, lehenik ezabatua izango da.
    Norbaitek erabiltzen badu, Guest- ezizen batera aldatzea behartuko zaio.

    Root erabiltzaileak, IRC operadoreak eta zerbitzu ezizenak ezin dira debekatu.

    Komando honek IRCop baimena behar du: nickserv.forbid

    Sintaxia: FORBID <ezizena> <arrazoia>
    Adibidea: FORBID EzizenGaiztoa Behin eta berrizko politika urraketak
  example: "%command_prefix%FORBID ErabiltzaileGaiztoa Politika behin eta berriz urratzea"
  success: "%nickname% ezizena debekatu da."
  updated: "%nickname% ezizenaren debeku arrazoia eguneratu da."
  reason_required: "Debekurako arrazoi bat eman behar duzu."
  cannot_forbid_root: "Ezin da root erabiltzaile %nickname% debekatu."
  cannot_forbid_oper: "Ezin da IRC operadore %nickname% debekatu."
  cannot_forbid_service: "Ezin da zerbitzu ezizen %nickname% debekatu."

# --- UNFORBID (IRCop) ---------------------------------------------------------
unforbid:
  syntax: "UNFORBID <ezizena>"
  short: "Kendu ezizen debekua."
  help: |-
    Ezizen debekua kentzen du, ezizena berriro erabilia izatea ahalbidetuz.

    Komando honek IRCop baimena behar du: nickserv.forbid

    Sintaxia: UNFORBID <ezizena>
    Adibidea: UNFORBID EzizenBat
  example: "%command_prefix%UNFORBID DebekatutakoEzizena"
  success: "%nickname% ezizena jada ez dago debekatuta."
  not_forbidden: "%nickname% ezizena ez dago debekatuta."

# --- FORBIDVHOST (IRCop) ------------------------------------------------------
forbidvhost:
  syntax: "FORBIDVHOST {ADD <eredua>|DEL <eredua>|LIST}"
  short: "Kudeatu debekatutako vhost ereduak."
  help: |-
    SET VHOST bidez bat datozen vhost-ak ezartzea eragozten duten ereduak
    kudeatzen ditu. * komodinak edozein segida adierazten du; ? komodinak karaktere
    bakar bat. IRC Operadorearen pribilegioak behar dira.
  example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
  examples:
    - "%command_prefix%FORBIDVHOST LIST"
  unknown_sub: "Azpikomando ezezaguna %sub%. Erabili ADD, DEL edo LIST."

  # --- FORBIDVHOST ADD -----------------------------------------------------
  add:
    syntax: "FORBIDVHOST ADD <eredua>"
    short: "Gehitu debekatutako vhost eredu bat."
    help: |-
      Eredu bat gehitzen dio zerrendari. Erabiltzaileek ezin izango dute SET VHOST
      bidez bat datorren vhost bat ezarri. * komodinak edozein segida adierazten du;
      ? komodinak karaktere bakarra adierazten du.
    example: "%command_prefix%FORBIDVHOST ADD *.pirata.com"
    done: "Debekatutako vhost eredua gehitu da: %pattern%"
    already_exists: "%pattern% eredua jada existitzen da."
    invalid: "Debekatutako vhost eredu formatu baliogabea."

  # --- FORBIDVHOST DEL -----------------------------------------------------
  del:
    syntax: "FORBIDVHOST DEL <eredua>"
    short: "Kendu debekatutako vhost eredu bat."
    help: "Debekatutako vhost-eredu bat zerrendatik ezabatzen du."
    example: "%command_prefix%FORBIDVHOST DEL *.pirata.com"
    done: "Debekatutako vhost eredua kendu da: %pattern%"
    not_found: "%pattern% eredua ez da aurkitu."

  # --- FORBIDVHOST LIST ----------------------------------------------------
  list:
    short: "Zerrendatu debekatutako vhost eredu guztiak."
    syntax: "FORBIDVHOST LIST"
    help: "Debekatutako vhost-eredu guztiak erakusten ditu."
    example: "%command_prefix%FORBIDVHOST LIST"
    header: "Debekatutako vhost ereduak (%count%):"
    entry: "%index%. %pattern% — %nickname%-(e)k (%date%)"
    empty: "Ez dago debekatutako vhost eredurik."

# --- DROP (IRCop) -------------------------------------------------------------
drop:
  syntax: "DROP <ezizena> [FORCE]"
  short: "Ezabatu erregistratutako ezizen bat."
  help: |-
    Erregistratutako ezizen bat datu-basetik ezabatzen du.
    Ekintza hau ezin da desegin.

    Erabiltzailea online badago, Guest- ezizen batera aldatuko zaio izena.
    Root erabiltzaileak eta IRC operadoreak ezin dira ezabatu.
    Ezin duzu zure ezizena ezabatu.

    Komando honek IRCop baimena behar du: nickserv.drop

    Sintaxia: DROP <ezizena>
    Adibidea: DROP KontuZaharra
  force:
    short: "Ezabatu ezabatzeko zain dagoen ezizena behin betiko."
  example: "%command_prefix%DROP KontuZaharra"
  examples:
    - "%command_prefix%DROP KontuZaharra FORCE"
  suspended: "%nickname% ezizena etenda dago. Kendu etenaldia lehenik."
  forbidden: "%nickname% ezizena debekatua dago."
  cannot_drop_root: "Ezin da root erabiltzaile %nickname% ezabatu."
  cannot_drop_oper: "Ezin da IRC operadore %nickname% ezabatu."
  cannot_drop_self: "Ezin duzu zure ezizena ezabatu."
  success: "%nickname% ezizena ezabatzeko markatua izan da eta grazia aldian berreskura daiteke."
  force_success: "%nickname% ezizena behin betiko ezabatu da."
  pending_deletion: "%nickname% ezizena jada ezabatzearen zain dago. Erabili DROP <ezizena> FORCE behin betiko ezabatzeko."
  cannot_drop_service: "Ezin da zerbitzu ezizen %nickname% ezabatu."

# --- RESTORE (IRCop) ----------------------------------------------------------
restore:
  syntax: "RESTORE <ezizena>"
  short: "Ezabatzearen zain dagoen ezizena berreskuratu."
  help: |-
    Eskuz ezabatutako eta oraindik grazia epearen barruan dagoen ezizena
    berreskuratzen du. IRCop baimena behar du: nickserv.restore.
  example: "%command_prefix%RESTORE KontuZaharra"
  success: "%nickname% ezizena berreskuratu da."
  not_pending_deletion: "%nickname% ezizena ez dago ezabatzearen zain."

# --- RESCUE -------------------------------------------------------------------
rescue:
  issued: |-
    Erreskate-tokena: %token_display%

    Gorde token hau leku seguru batean. Pasahitza ahazten baduzu, zure ezizena berreskuratzeko beharko duzu.

    Berresteko, erabili: /msg %bot% %verify%

    %warning%
  issued_warning: "GARRANTZITSUA: Sortutako azken tokenak bakarrik balio du. Berretsi ondoren, ez da berriro erakutsiko. Ez partekatu inorekin."
  confirmed: "Erreskate-tokena berretsi da. Gorde leku seguruan."
  unavailable: "Autentifikatu eta berretsi erreskate-tokena %command_0% erabiliz eragiketa hau egin aurretik."
  unavailable_command_0: "VERIFY"
  locked_out: "Token oker gehiegi. Saiatu berriro %seconds% segundo barru."
  throttled: "Token oker gehiegi. Saiatu berriro %minutes% minutu barru."
  replaced: "Berreskuratze-tokena balioztatu berri duzun posta-tokenarekin ordeztu da. Gorde leku seguruan."
  optional_replacement: |-
    Aukerako berreskuratze-token berria: %token_display%

    Uneko berreskuratze-tokena ordezkatzeko, erabili: /msg %bot% %verify%

    Oraingo tokenak balio du berretsi arte.

    Aldatu nahi ez baduzu, ez ikusi egin mezu honi.
  replacement_unavailable: "Pasahitza berrezarri da, baina ezin izan da token berririk eman. Oraingo tokenak balio du oraindik."
  temporarily_unavailable: "Berreskuratze-tokenaren bidalketa ez dago une honetan erabilgarri. Saiatu geroago."


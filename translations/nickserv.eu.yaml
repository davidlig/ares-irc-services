    Posta jabeak identifikatuta daudenean soilik ikus dezake.
    PRIVATE ON dagoenean jabeak eta IRC Operadoreek soilik
    ikus dezakete informazioa.
  example: "%command_prefix%INFO Erabiltzailea"
  private: "%nickname% ezizenaren informazioa pribatua da."
  header: "%nickname% ezizenaren informazioa"
  status: "%label%             : %status%"

# Traduceri MemoServ — Română
# Domeniu: memoserv
#
# Coduri de formatare IRC (ghilimele duble sau blocuri literale !irc):
#   \x02        activează/dezactivează caracterele aldine
#   \x03NN      culoare (ZECIMAL: 03=verde, 04=roșu, 07=portocaliu, 14=gri închis)
#   \x03        resetează culoarea
#   \x0F        resetează întreaga formatare
#
# Culorile IRC folosesc numere ZECIMALE (0-15), nu hexazecimale.
#   \x0314 = gri închis (14 zecimal): CORECT
#   \x030F = culoarea 0 urmată de litera F: EROARE
#
# Text IRC pe mai multe rânduri: !irc |- cu rânduri și spații reale.
# Blocurile fără etichetă nu decodează secvențe escape; păstrează literalii CTCP.
# Exemple HELP: example/examples și %command_prefix%.
# Prezentatorul adaugă /msg fără culoare și o margine de două spații.

# --- SEND ---------------------------------------------------------------------
send:
  syntax: "SEND {poreclă|#canal} <mesaj>"
  short: "Trimiteți un mesaj către o poreclă sau un canal."
  help: |-
    Trimite un mesaj unei porecle sau unui canal înregistrat. Destinatarul trebuie
    să aibă activat serviciul de mesaje (ENABLE).
  example: "%command_prefix%SEND Ana Salut, poți verifica mesajul?"
  examples:
    - "%command_prefix%SEND #ajutor Anunț pentru canal"
  sent_nick: "Mesaj trimis către %nickname%."
  sent_channel: "Mesaj trimis către canalul %channel%."
  throttled: "Trebuie să așteptați %seconds% secundă(e) înainte de a trimite alt mesaj."
  limit_reached: "Limita de mesaje atinsă pentru %target%."
  ignored: "Nu puteți trimite mesaje către această destinație, vă aflați pe lista sa de ignorare."
  cannot_send_to_self: "Nu vă puteți trimite un mesaj dumneavoastră înșivă."
  message_too_long: "Mesaj prea lung. Maximul este de %max% caractere."
  service_disabled_for_target: "Serviciul de mesaje este dezactivat pentru %target%."

# --- READ ---------------------------------------------------------------------
read:
  syntax: "READ [#canal] <număr>"
  short: "Citiți un mesaj după număr."
  help: |-
    Citește mesajul cu numărul indicat. Fără #canal, citește din căsuța poreclei.
    Cu #canal, este necesar nivelul MEMOREAD.
  example: "%command_prefix%READ 1"
  examples:
    - "%command_prefix%READ #ayuda 2"
  header: "Mesajul #%index% de la %from%:"
  footer: "%separator% %date%"
  not_found: "Mesajul #%index% nu a fost găsit."

# --- LIST ---------------------------------------------------------------------
list:
  syntax: "LIST [#canal]"
  short: "Listați mesajele (necititele sunt marcate cu * roșu)."
  help: |-
    Listează mesajele tale sau ale canalului. Cele necitite au un asterisc roșu și
    o previzualizare (max. 50 de caractere). Fără #canal = căsuța ta; cu #canal
    este necesar MEMOREAD.
  example: "%command_prefix%LIST"
  examples:
    - "%command_prefix%LIST #ayuda"
  header: "Mesaje pentru %target%:"
  empty: "Nu există mesaje pentru %target%."

# --- DEL ----------------------------------------------------------------------
del:
  syntax: "DEL [#canal] <număr>"
  short: "Ștergeți un mesaj după număr."
  help: "Șterge mesajul cu numărul specificat. Pentru canale necesită nivel MEMOCHANGE."
  example: "%command_prefix%DEL 1"
  examples:
    - "%command_prefix%DEL #ayuda 2"
  deleted: "Mesajul #%index% a fost șters."
  not_found: "Mesajul #%index% nu a fost găsit."

# --- IGNORE -------------------------------------------------------------------
ignore:
  syntax: "IGNORE {ADD [#canal] <poreclă>|DEL [#canal] <poreclă>|LIST [#canal]}"
  short: "Gestionați lista de ignorare pentru mesaje."
  help: |-
    Gestionează poreclele de la care nu dorești să primești mesaje, atât pentru
    contul
    tău, cât și pentru un canal înregistrat. Pentru lista canalului ai nevoie de
    MEMOCHANGE.
  example: "%command_prefix%IGNORE ADD Ana"
  examples:
    - "%command_prefix%IGNORE DEL #ayuda Ana"
    - "%command_prefix%IGNORE LIST #ayuda"

  # --- IGNORE ADD ----------------------------------------------------------
  add:
    syntax: "IGNORE ADD [#canal] <poreclă>"
    short: "Adaugă o poreclă în lista de ignorare."
    help: |-
      Mesajele de la această poreclă nu vor fi acceptate pentru inboxul dumneavoastră
      (sau al canalului).
    example: "%command_prefix%IGNORE ADD Ana"
    examples:
      - "%command_prefix%IGNORE ADD #ayuda Ana"

  # --- IGNORE DEL ----------------------------------------------------------
  del:
    syntax: "IGNORE DEL [#canal] <poreclă>"
    short: "Elimină o poreclă din listă."
    help: "Elimină porecla din lista de ignorare."
    example: "%command_prefix%IGNORE DEL Ana"
    examples:
      - "%command_prefix%IGNORE DEL #ayuda Ana"

  # --- IGNORE LIST ---------------------------------------------------------
  list:
    syntax: "IGNORE LIST [#canal]"
    short: "Afișează poreclele ignorate."
    help: |-
      Afișează lista poreclelor pe care dumneavoastră (sau canalul) le ignorați pentru
      mesaje.
    example: "%command_prefix%IGNORE LIST"
    examples:
      - "%command_prefix%IGNORE LIST #ayuda"
  added: "%nickname% adăugat în lista de ignorare."
  removed: "%nickname% eliminat din lista de ignorare."
  already_ignored: "%nickname% se află deja în lista de ignorare."
  not_ignored: "%nickname% nu se află în lista de ignorare."
  limit_reached_nick: "Limita listei de ignorare atinsă pentru porecla dumneavoastră (max %limit%)."
  limit_reached_channel: "Limita listei de ignorare atinsă pentru %channel% (max %limit%)."
  list_empty: "Lista de ignorare este goală."
  list_header: "Lista de ignorare:"

# --- ENABLE -------------------------------------------------------------------
enable:
  syntax: "ENABLE [#canal]"
  short: "Activați recepția de mesaje."
  help: |-
    Activează primirea mesajelor pentru porecla ta. În canale, doar fondatorul poate
    activa.
  example: "%command_prefix%ENABLE"
  examples:
    - "%command_prefix%ENABLE #ayuda"
  enabled_nick: "Serviciul de mesaje activat pentru porecla dumneavoastră."
  enabled_channel: "Serviciul de mesaje activat pentru canalul %channel%."
  already_enabled_nick: "Serviciul de mesaje este deja activat pentru porecla dumneavoastră."
  already_enabled_channel: "Serviciul de mesaje este deja activat pentru %channel%."
  founder_only: "Doar fondatorul canalului poate activa mesajele pentru %channel%."

# --- DISABLE ------------------------------------------------------------------
disable:
  syntax: "DISABLE [#canal]"
  short: "Dezactivați recepția de mesaje."
  help: |-
    Dezactivează primirea mesajelor pentru porecla sau canalul tău. În canale, doar
    fondatorul poate dezactiva.
  example: "%command_prefix%DISABLE"
  examples:
    - "%command_prefix%DISABLE #ayuda"
  disabled_nick: "Serviciul de mesaje dezactivat pentru porecla dumneavoastră."
  disabled_channel: "Serviciul de mesaje dezactivat pentru canalul %channel%."
  already_disabled_nick: "Serviciul de mesaje este deja dezactivat pentru porecla dumneavoastră."
  already_disabled_channel: "Serviciul de mesaje este deja dezactivat pentru %channel%."
  founder_only: "Doar fondatorul canalului poate dezactiva mesajele pentru %channel%."

# --- HELP ---------------------------------------------------------------------
help:
  syntax: "HELP [comandă] [opțiune]"
  short: "Listați comenzile sau afișați ajutor pentru o comandă."
  help: "Afișează lista comenzilor sau ajutor detaliat pentru o comandă ori opțiune."
  example: "%command_prefix%HELP"
  examples:
    - "%command_prefix%HELP IGNORE ADD"
  header_title: "%bot%"
  header: "%title%"
  intro: |-
    Permite trimiterea și primirea mesajelor între utilizatori înregistrați și
    trimiterea anunțurilor către canale. Mesajele sunt păstrate pentru consultare
    ulterioară, chiar dacă destinatarul nu este conectat.
  general_header: "Comenzi disponibile:"
  command_line: "%command%%description%"
  subcommand_line: "%command%%description%"
  options_header: "Opțiuni:"
  examples_header: "Exemple:"
  general_help_command: "HELP <comandă>"
  option_help_command: "HELP %command% <opțiune>"
  general_footer: "Folosește /msg %bot% %help_command% pentru mai multe informații."
  set_sub_footer: "Folosește /msg %bot% %help_command% pentru mai multe informații."
  syntax_label: "Sintaxă: %syntax%"
  footer: ""
  group_header: "%group%"
  subgroup_header: "%group%"
  group:
    messages: "Mesaje"
    preferences: "Preferințe"
  ircop_header: "Comenzi disponibile pentru IRCops:"

# --- NOTIFY -------------------------------------------------------------------
notify:
  nick_pending: "Ai %count% mesaj(e) necitit(e). Listează mesajele: /msg %bot% %list%"
  channel_pending: "Canalul %channel% are %count% mesaj(e) necitit(e). Verifică mesajele cu /msg %bot% %list%"

# --- CHANNEL REGISTRATION DECISIONS -------------------------------------------
registration_decision:
  accepted: "Cererea ta de înregistrare pentru %channel% a fost aprobată."
  rejected: "Cererea ta de înregistrare pentru %channel% a fost respinsă."
  reason: "Motiv: %reason%"
  restriction: "Disponibilă de la: %date%"

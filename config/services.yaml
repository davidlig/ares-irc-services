                - '@App\NickServ\Adapter\Out\Security\Voter\NickServIdentifiedOwnerVoter'
                - '@App\NickServ\Adapter\Out\Security\Voter\NickServSasetVoter'
                - '@App\ChanServ\Adapter\Out\Security\Voter\ChanServLevelFounderVoter'
                - '@App\Infrastructure\Security\Voter\IdentifiedVoter'
                - '@App\Infrastructure\Security\Voter\IrcopPermissionVoter'

    Symfony\Component\Security\Core\Authorization\AuthorizationChecker:
        arguments:
            $tokenStorage: '@Symfony\Component\Security\Core\Authentication\Token\Storage\TokenStorage'
            $accessDecisionManager: '@Symfony\Component\Security\Core\Authorization\AccessDecisionManager'

    Symfony\Component\Security\Core\Authorization\AuthorizationCheckerInterface:
        alias: Symfony\Component\Security\Core\Authorization\AuthorizationChecker

    App\NickServ\Application\Port\Out\AuthorizationContextInterface:
        class: App\NickServ\Adapter\Out\Security\SymfonyAuthorizationContext
        arguments:
            $tokenStorage: '@Symfony\Component\Security\Core\Authentication\Token\Storage\TokenStorage'

    App\NickServ\Application\Port\In\IrcAuthorizationContext:
        alias: App\NickServ\Application\Port\Out\AuthorizationContextInterface

    App\NickServ\Application\Port\Out\AuthorizationCheckerInterface:
        class: App\NickServ\Adapter\Out\Security\SymfonyAuthorizationCheckerAdapter
        arguments:
            $authorizationChecker: '@Symfony\Component\Security\Core\Authorization\AuthorizationChecker'

    # --- Permission Registry (IRCOP permissions across all services) ----------------

    App\Application\Security\PermissionRegistry:
        arguments:
            $providers: !tagged_iterator permission.provider

    App\Bootstrap\Security\NickServPermissionProvider:
        tags: ['permission.provider']

    App\Bootstrap\Security\ChanServPermissionProvider:
        tags: ['permission.provider']

    App\Bootstrap\Security\MemoServPermissionProvider:
        tags: ['permission.provider']

    App\Application\OperServ\Security\OperServIrcopPermission:
        tags: ['permission.provider']

    # --- NickServ registries ----------------------------------------------------

    App\NickServ\Adapter\Out\InMemory\IdentifiedSessionRegistry:
        class: App\NickServ\Adapter\Out\InMemory\IdentifiedSessionRegistry
        arguments:
            $logger: '@monolog.logger.irc'

    App\NickServ\Adapter\Out\InMemory\PendingVerificationRegistry:
        class: App\NickServ\Adapter\Out\InMemory\PendingVerificationRegistry

    App\NickServ\Adapter\Out\InMemory\PendingEmailChangeRegistry:
        class: App\NickServ\Adapter\Out\InMemory\PendingEmailChangeRegistry

    App\NickServ\Adapter\Out\InMemory\RecoveryTokenRegistry:
        class: App\NickServ\Adapter\Out\InMemory\RecoveryTokenRegistry

    # --- NickServ Service -------------------------------------------------------

    App\NickServ\Adapter\In\Irc\NickServService:
        arguments:
            $authorizationContext: '@App\NickServ\Application\Port\Out\AuthorizationContextInterface'
            $authorizationChecker:  '@App\NickServ\Application\Port\Out\AuthorizationCheckerInterface'
            $serviceNicks: '@App\Shared\Application\ServiceNicknameRegistry'
            $languageResolver: '@App\NickServ\Application\Port\In\UserLanguageQuery'
            $defaultLanguage:      '%services.default_language%'
            $defaultTimezone:      '%services.default_timezone%'
            $logger:               '@monolog.logger.irc'

    # --- NickServ Subscribers ---------------------------------------------------
    # NickServMessageSubscriber removed: commands are routed via ServiceCommandGateway + NickServCommandListener

    App\NickServ\Adapter\In\Event\NickProtectionSubscriber:
        arguments:
            $nickProtectionService:      '@App\NickServ\Application\Service\NickProtectionService'
            $identifiedUserVhostSync:   '@App\NickServ\Application\Service\IdentifiedUserVhostSyncService'
            $burstState:                '@App\NickServ\Application\Service\BurstState'
            $networkUserLookup:        '@App\Irc\Application\Port\In\NetworkUserLookupPort'
            $pendingProtectionRegistry: '@App\NickServ\Application\Port\Out\PendingNickProtectionRegistryInterface'
            $connectionHolder:          '@App\Application\Port\ActiveConnectionHolderInterface'
        tags: ['kernel.event_subscriber']

    App\NickServ\Adapter\In\Event\ForbiddenNickEnforceSubscriber:
        arguments:
            $nickRepository: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $forbiddenService: '@App\NickServ\Application\Service\ForbiddenNickService'
            $burstState: '@App\NickServ\Application\Service\BurstState'
            $pendingRegistry: '@App\NickServ\Application\Port\Out\PendingNickRestoreRegistryInterface'
            $userLookup: '@App\Irc\Application\Port\In\NetworkUserLookupPort'
            $logger: '@monolog.logger.irc'
        tags: ['kernel.event_subscriber']

    # --- Maintenance system -----------------------------------------------------

    App\Application\Maintenance\MaintenanceScheduler:
        arguments:
            $tasks:  !tagged_iterator maintenance.task
            $logger: '@monolog.logger.maintenance'

    App\NickServ\Adapter\In\Maintenance\PurgeExpiredPendingTask:
        arguments:
            $intervalSeconds: '%maintenance.interval%'
            $logger:          '@monolog.logger.maintenance'
        tags: ['maintenance.task']

    App\NickServ\Adapter\In\Maintenance\UnsuspendExpiredSuspensionsTask:
        arguments:
            $nickRepository: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $debugNotifier: '@App\NickServ\Adapter\Out\Service\NickServDebugNotifier'
            $serverName: '%irc.server_name%'
            $logger: '@monolog.logger.maintenance'
            $intervalSeconds: '%maintenance.interval%'
        tags: ['maintenance.task']

    App\NickServ\Adapter\In\Maintenance\PurgeInactiveNicknamesTask:
        arguments:
            $nickRepository: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $dropService: '@App\NickServ\Application\Service\NickDropService'
            $intervalSeconds: '%maintenance.interval%'
            $inactivityExpiryDays: '%nickserv.inactivity_expiry_days%'
        tags: ['maintenance.task']

    App\NickServ\Adapter\In\Maintenance\PurgePendingDeletionNicknamesTask:
        arguments:
            $nickRepository: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $dropService: '@App\NickServ\Application\Service\NickDropService'
            $intervalSeconds: '%maintenance.interval%'
            $dropGraceDays: '%nickserv.drop_grace_days%'
        tags: ['maintenance.task']

    App\NickServ\Adapter\In\Maintenance\CleanupHistoryTask:
        arguments:
            $historyRepository: '@App\NickServ\Application\Port\Out\NickHistoryRepositoryInterface'
            $logger: '@monolog.logger.maintenance'
            $intervalSeconds: '%maintenance.interval%'
            $retentionDays: '%nickserv.history_retention_days%'
        tags: ['maintenance.task']


    # --- In-memory pruners (tagged for PruneMemoryRegistriesTask) -----------------
    App\NickServ\Adapter\In\Maintenance\Pruner\IdentifyFailedAttemptPruner:
        arguments:
            $windowSeconds: '%nickserv.identify_failed_window_seconds%'
        tags: ['maintenance.prunable']

    App\NickServ\Adapter\In\Maintenance\Pruner\RegisterThrottlePruner:
        arguments:
            $minIntervalSeconds: '%nickserv.register_min_interval%'
        tags: ['maintenance.prunable']

    App\NickServ\Adapter\In\Maintenance\Pruner\PendingVerificationPruner:
        tags: ['maintenance.prunable']

    App\NickServ\Adapter\In\Maintenance\Pruner\PendingEmailChangePruner:
        tags: ['maintenance.prunable']

    App\NickServ\Adapter\In\Maintenance\Pruner\IdentifiedSessionPruner:
        tags: ['maintenance.prunable']

    App\NickServ\Adapter\In\Maintenance\Pruner\SessionLanguagePruner:
        tags: ['maintenance.prunable']

    App\NickServ\Adapter\In\Maintenance\Pruner\RecoveryTokenPruner:
        tags: ['maintenance.prunable']

    App\NickServ\Adapter\In\Maintenance\PruneMemoryRegistriesTask:
        arguments:
            $prunables:        !tagged_iterator maintenance.prunable
            $logger:           '@monolog.logger.maintenance'
            $intervalSeconds:  '%maintenance.interval%'
        tags: ['maintenance.task']

    # --- Session Language Registry — temporary language for unregistered users ---

    App\NickServ\Adapter\Out\InMemory\SessionLanguageRegistry: ~

    # --- UserLanguageResolver — shared across all services ----------------------

    App\NickServ\Adapter\Out\User\UserLanguageResolver:
        arguments:
            $defaultLanguage: '%services.default_language%'

    App\NickServ\Application\Port\In\UserLanguageQuery:
        alias: App\NickServ\Adapter\Out\User\UserLanguageResolver

    App\NickServ\Adapter\Out\User\NickAccountResolver: ~

    App\NickServ\Application\Port\In\NickAccountQuery:
        alias: App\NickServ\Adapter\Out\User\NickAccountResolver

    # --- UserMessageTypeResolver — NOTICE vs PRIVMSG preference -----------------

    App\NickServ\Application\Port\In\UserMessagePreferenceQuery:
        alias: App\NickServ\Adapter\Out\User\UserMessageTypeResolver

    App\Irc\Application\Port\Out\ServiceUserPreferences:
        alias: App\Irc\Adapter\Out\User\NickServUserPreferencesAdapter

    App\ChanServ\Adapter\In\Irc\ChanServUserPresentationPreferences:
        alias: App\ChanServ\Adapter\Out\User\NickServUserPreferencesAdapter

    App\MemoServ\Adapter\In\Irc\MemoServUserPresentationPreferences:
        alias: App\MemoServ\Adapter\Out\NickServ\NickServUserPreferencesAdapter

    App\Application\OperServ\Port\Out\ServiceUserPreferences:
        alias: App\Infrastructure\OperServ\User\NickServUserPreferencesAdapter

    App\NickServ\Adapter\Out\User\UserMessageTypeResolver: ~

    App\Application\Port\EventBusInterface:
        alias: App\Infrastructure\Event\SymfonyEventBus

    App\Application\Port\TransactionManagerInterface:
        alias: App\Infrastructure\Persistence\DoctrineTransactionManager

    App\Application\Port\AsyncMessageDispatcherInterface:
        alias: App\Infrastructure\Messenger\SymfonyAsyncMessageDispatcher

    App\Application\Port\TranslationInterface:
        alias: App\Infrastructure\Translation\SymfonyTranslationAdapter

    # --- OperServ Domain --------------------------------------------------------

    App\Domain\OperServ\Repository\OperIrcopRepositoryInterface:
        class: App\Infrastructure\OperServ\Doctrine\OperIrcopDoctrineRepository

    App\Domain\OperServ\Repository\OperRoleRepositoryInterface:
        class: App\Infrastructure\OperServ\Doctrine\OperRoleDoctrineRepository

    App\Domain\OperServ\Repository\OperPermissionRepositoryInterface:
        class: App\Infrastructure\OperServ\Doctrine\OperPermissionDoctrineRepository

    App\Domain\OperServ\Repository\GlineRepositoryInterface:
        class: App\Infrastructure\OperServ\Doctrine\GlineDoctrineRepository

    App\Domain\OperServ\Repository\MotdRepositoryInterface:
        class: App\Infrastructure\OperServ\Doctrine\MotdDoctrineRepository

    # --- OperServ Application ---------------------------------------------------

    App\Application\OperServ\RootUserRegistry:
        arguments:
            $rootUsers: '%operserv.root_users%'

    App\Application\OperServ\IrcopAccessHelper: ~

    App\Application\OperServ\Command\OperServCommandRegistry:
        arguments:
            $commands: !tagged_iterator operserv.command

    App\Application\OperServ\OperServService:
        arguments:
            $serviceNicks: '@App\Shared\Application\ServiceNicknameRegistry'
            $languageResolver: '@App\Application\OperServ\Port\Out\ServiceUserPreferences'
            $authorizationContext: '@App\NickServ\Application\Port\Out\AuthorizationContextInterface'
            $authorizationChecker: '@App\NickServ\Application\Port\Out\AuthorizationCheckerInterface'
            $defaultLanguage: '%services.default_language%'
            $defaultTimezone: '%services.default_timezone%'
            $logger: '@monolog.logger.irc'

    App\Application\OperServ\Command\Handler\IrcopCommand:
        tags: ['operserv.command']

    App\Application\OperServ\IrcopModeApplier:
        arguments:
            $identifiedRegistry: '@App\NickServ\Application\Port\Out\IdentifiedSessionTracker'
            $connectionHolder: '@App\Irc\Adapter\Out\Connection\ActiveConnectionHolder'
            $ircopRepository: '@App\Domain\OperServ\Repository\OperIrcopRepositoryInterface'
            $nickRepository: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $userLookup: '@App\Irc\Adapter\ServiceBridge\CoreNetworkUserLookupAdapter'
            $logger: '@monolog.logger.irc'

    App\Application\OperServ\Command\Handler\RoleCommand:
        tags: ['operserv.command']

    App\Application\OperServ\Command\Handler\RolePermissionsHandler:
        arguments:
            $permissionRegistry: '@App\Application\Security\PermissionRegistry'

    App\Application\OperServ\Command\Handler\HelpCommand:
        tags: ['operserv.command']

    App\Application\OperServ\Command\Handler\MotdCommand:
        arguments:
            $motdRepository: '@App\Domain\OperServ\Repository\MotdRepositoryInterface'
            $debugNotifier: '@App\Infrastructure\OperServ\Service\OperServDebugNotifier'
        tags: ['operserv.command']

    # --- OperServ Infrastructure -------------------------------------------------

    App\Infrastructure\IRC\ServiceBridge\OperServSendNoticeAdapter:
        class: App\Infrastructure\IRC\ServiceBridge\CoreSendNoticeAdapter

    App\Infrastructure\OperServ\Bot\OperServBot:
        arguments:
            $uidGenerator: '@App\Irc\Application\Port\In\ServiceUidGeneratorInterface'
            $servicesVhost: '%services.vhost%'
            $operservNick: '%operserv.nick%'
            $operservIdent: '%operserv.ident%'
            $operservRealname: '%operserv.realname%'
            $logger: '@monolog.logger.irc'
            $sendNoticePort: '@App\Infrastructure\IRC\ServiceBridge\OperServSendNoticeAdapter'
        tags: ['kernel.event_subscriber', { name: 'app.service_nickname_provider' }, { name: 'app.service_uid_provider' }]

    App\Application\OperServ\Command\OperServNotifierInterface:
        alias: App\Infrastructure\OperServ\Bot\OperServBot

    App\Infrastructure\OperServ\Subscriber\OperServCommandListener:
        arguments:
            $logger: '@monolog.logger.irc'
        tags: ['service_command_listener']

    App\Infrastructure\OperServ\Subscriber\MotdOnConnectSubscriber:
        arguments:
            $motdRepository: '@App\Domain\OperServ\Repository\MotdRepositoryInterface'
            $uidRegistry: '@App\Application\Shared\ServiceUidRegistry'
            $connectionHolder: '@App\Application\Port\ActiveConnectionHolderInterface'
            $channelLookup: '@App\Irc\Application\Port\In\ChannelLookupPort'
            $channelRegistration: '@App\Application\Port\ServiceChannelRegistrationPort'
            $pseudoUidGenerator: '@App\Application\OperServ\Service\PseudoClientUidGenerator'
            $userLookup: '@App\Irc\Application\Port\In\NetworkUserLookupPort'
            $nickRepository: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $sendNoticePort: '@App\Application\Port\SendNoticePort'
            $nickForce: '@App\NickServ\Application\Service\NickForceService'
            $debugChannel: '%ircops.debug_channel%'
            $logger: '@monolog.logger.irc'
        tags: ['kernel.event_subscriber']

    App\Infrastructure\OperServ\Subscriber\OperRoleModesDeidentifiedSubscriber:
        arguments:
            $ircopRepository: '@App\Domain\OperServ\Repository\OperIrcopRepositoryInterface'
            $connectionHolder: '@App\Irc\Adapter\Out\Connection\ActiveConnectionHolder'
            $userLookup: '@App\Irc\Adapter\ServiceBridge\CoreNetworkUserLookupAdapter'
            $logger: '@monolog.logger.irc'
        tags: ['kernel.event_subscriber']

    # --- Debug Notifiers -----------------------------------------------------------

    App\Application\Port\ServiceDebugNotifierRegistry:
        arguments:
            $notifierIter: !tagged_iterator app.debug_notifier

    App\NickServ\Adapter\Out\Service\NickServDebugNotifier:
        arguments:
            $notifier: '@App\NickServ\Application\Port\Out\NickNetworkActions'
            $userLookup: '@App\Irc\Application\Port\In\NetworkUserLookupPort'
            $identifiedRegistry: '@App\NickServ\Application\Port\Out\IdentifiedSessionTracker'
            $operatorAccess: '@App\NickServ\Application\Port\Out\NickServOperatorAccess'
            $nickRepo: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $translator: '@translator'
            $defaultLanguage: '%services.default_language%'
            $debugChannel: '%ircops.debug_channel%'
            $logger: '@monolog.logger.ircops'
        tags: ['app.debug_notifier']

    App\Infrastructure\OperServ\Service\OperServDebugNotifier:
        arguments:
            $channelActions: '@App\Application\Port\ChannelServiceActionsPort'
            $userLookup: '@App\Irc\Application\Port\In\NetworkUserLookupPort'
            $notifier: '@App\Application\OperServ\Command\OperServNotifierInterface'
            $identifiedRegistry: '@App\NickServ\Application\Port\Out\IdentifiedSessionTracker'
            $ircopRepo: '@App\Domain\OperServ\Repository\OperIrcopRepositoryInterface'
            $rootRegistry: '@App\Application\OperServ\RootUserRegistry'
            $nickRepo: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $translator: '@translator'
            $defaultLanguage: '%services.default_language%'
            $debugChannel: '%ircops.debug_channel%'
            $logger: '@monolog.logger.ircops'
        tags: ['app.debug_notifier']


    App\Application\OperServ\Command\Handler\KillCommand:
        arguments:
            $userLookup: '@App\Irc\Application\Port\In\NetworkUserLookupPort'
            $rootRegistry: '@App\Application\OperServ\RootUserRegistry'
            $ircopRepo: '@App\Domain\OperServ\Repository\OperIrcopRepositoryInterface'
            $nickRepo: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $accessHelper: '@App\Application\OperServ\IrcopAccessHelper'
            $connectionHolder: '@App\Application\Port\ActiveConnectionHolderInterface'
            $logger: '@monolog.logger.ircops'
        tags: ['operserv.command']

    App\Application\OperServ\Command\Handler\GlineCommand:
        arguments:
            $glineRepository: '@App\Domain\OperServ\Repository\GlineRepositoryInterface'
            $userLookup: '@App\Irc\Application\Port\In\NetworkUserLookupPort'
            $nickRepository: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $ircopRepo: '@App\Domain\OperServ\Repository\OperIrcopRepositoryInterface'
            $rootRegistry: '@App\Application\OperServ\RootUserRegistry'
            $accessHelper: '@App\Application\OperServ\IrcopAccessHelper'
            $connectionHolder: '@App\Application\Port\ActiveConnectionHolderInterface'
            $logger: '@monolog.logger.ircops'
            $maxGlines: '%operserv.max_glines%'
        tags: ['operserv.command']

    App\Application\OperServ\Service\PseudoClientUidGenerator:
        arguments:
            $connectionHolder: '@App\Application\Port\ActiveConnectionHolderInterface'

    App\Application\OperServ\Command\Handler\GlobalCommand:
        arguments:
            $userLookup: '@App\Irc\Application\Port\In\NetworkUserLookupPort'
            $nickRepository: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $serviceUidRegistry: '@App\Application\Shared\ServiceUidRegistry'
            $uidGenerator: '@App\Application\OperServ\Service\PseudoClientUidGenerator'
            $connectionHolder: '@App\Application\Port\ActiveConnectionHolderInterface'
            $sendNoticePort: '@App\Application\Port\SendNoticePort'
            $logger: '@monolog.logger.ircops'
        tags: ['operserv.command']

    App\Application\OperServ\Command\Handler\RawCommand:
        arguments:
            $connectionHolder: '@App\Application\Port\ActiveConnectionHolderInterface'
            $logger: '@monolog.logger.ircops'
            $udbCommands: '@App\Application\Port\UdbRawCommandHandlerProviderInterface'
        tags: ['operserv.command']

    App\Application\Port\UdbRawCommandHandlerProviderInterface:
        alias: App\Infrastructure\IRC\Connection\ActiveUdbRawCommandHandlerProvider

    App\Infrastructure\OperServ\Subscriber\OperServGlineEnforceSubscriber:
        arguments:
            $glineRepository: '@App\Domain\OperServ\Repository\GlineRepositoryInterface'
            $connectionHolder: '@App\Application\Port\ActiveConnectionHolderInterface'
            $logger: '@monolog.logger.irc'
        tags: ['kernel.event_subscriber']

    App\Application\OperServ\Maintenance\PurgeExpiredGlinesTask:
        arguments:
            $glineRepository: '@App\Domain\OperServ\Repository\GlineRepositoryInterface'
            $debugNotifier: '@App\Infrastructure\OperServ\Service\OperServDebugNotifier'
            $eventDispatcher: '@App\Application\Port\EventBusInterface'
            $serverName: '%irc.server_name%'
            $logger: '@monolog.logger.maintenance'
            $intervalSeconds: '%maintenance.purge_expired_glines_interval%'
        tags: ['maintenance.task']

    App\Application\OperServ\Maintenance\PurgeExpiredMotdsTask:
        arguments:
            $motdRepository: '@App\Domain\OperServ\Repository\MotdRepositoryInterface'
            $debugNotifier: '@App\Infrastructure\OperServ\Service\OperServDebugNotifier'
            $translator: '@App\Application\Port\TranslationInterface'
            $logger: '@monolog.logger.maintenance'
            $defaultLanguage: '%services.default_language%'
            $defaultTimezone: '%services.default_timezone%'
            $intervalSeconds: '%maintenance.purge_expired_motds_interval%'
        tags: ['maintenance.task']

    # --- IRCops Debug Channel Protection ----------------------------------------

    App\Infrastructure\IRC\Subscriber\IrcopsDebugChannelProtectionSubscriber:
        arguments:
            $channelActions: '@App\Application\Port\ChannelServiceActionsPort'
            $channelLookup: '@App\Irc\Application\Port\In\ChannelLookupPort'
            $userLookup: '@App\Irc\Application\Port\In\NetworkUserLookupPort'
            $ircopRepo: '@App\Domain\OperServ\Repository\OperIrcopRepositoryInterface'
            $rootRegistry: '@App\Application\OperServ\RootUserRegistry'
            $nickRepo: '@App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface'
            $translator: '@translator'
            $defaultLanguage: '%services.default_language%'
            $chanservNick: '%chanserv.nick%'
            $debugChannel: '%ircops.debug_channel%'
            $logger: '@monolog.logger.ircops'
        tags: ['kernel.event_subscriber']

    # --- Debug Channel Join on Startup -----------------------------------------

    App\Infrastructure\IRC\Subscriber\DebugChannelJoinSubscriber:
        arguments:
            $debugNotifiers: !tagged_iterator app.debug_notifier
            $debugChannel: '%ircops.debug_channel%'
            $registeredChannelRepository: '@App\ChanServ\Application\Port\Out\RegisteredChannelRepositoryInterface'
            $channelLookup: '@App\Irc\Application\Port\In\ChannelLookupPort'
            $channelServiceActions: '@App\Application\Port\ChannelServiceActionsPort'
            $modeSupportProvider: '@App\Application\Port\ActiveChannelModeSupportProviderInterface'
            $uidRegistry: '@App\Application\Shared\ServiceUidRegistry'
            $logger: '@monolog.logger.ircops'
        tags: ['kernel.event_subscriber']

    # --- IRCop Command Audit ----------------------------------------------------

    App\Infrastructure\IRC\Subscriber\IrcopCommandAuditSubscriber:
        arguments:
            $registry: '@App\Application\Port\ServiceDebugNotifierRegistry'
            $detector: '@App\Application\Security\IrcopPermissionDetector'
        tags: ['kernel.event_subscriber']

    App\Application\Security\IrcopPermissionDetector: ~

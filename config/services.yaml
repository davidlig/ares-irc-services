# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # IRC link parameters — values come from environment variables (see .env)
    irc.server_name:   '%env(IRC_SERVER_NAME)%'
    irc.ircd_host:     '%env(IRC_IRCD_HOST)%'
    irc.ircd_port:     '%env(int:IRC_IRCD_PORT)%'
    irc.link_password: '%env(IRC_LINK_PASSWORD)%'
    irc.description:   '%env(IRC_DESCRIPTION)%'
    irc.protocol:      '%env(IRC_PROTOCOL)%'
    irc.use_tls:       '%env(bool:IRC_USE_TLS)%'
    irc.tls_verify_peer_default: true
    irc.tls_verify_peer: '%env(bool:default:irc.tls_verify_peer_default:IRC_TLS_VERIFY_PEER)%'
    irc.server_sid:    '%env(IRC_SERVER_SID)%'

    # Services global settings
    services.vhost:         '%env(IRC_SERVICES_VHOST)%'
    services.default_language: '%env(SERVICES_DEFAULT_LANGUAGE)%'
    services.default_timezone_fallback: 'UTC'
    services.default_timezone: '%env(default:services.default_timezone_fallback:SERVICES_DEFAULT_TIMEZONE)%'
    services.version: 'v1.0'
    services.guest_prefix:     '%env(NICKSERV_GUEST_PREFIX)%'
    services.vhost_suffix:     '%env(default::NICKSERV_VHOST_SUFFIX)%'

    # IRCops debug channel (shared by all services)
    ircops.debug_channel_default: null
    ircops.debug_channel: '%env(string:default:ircops.debug_channel_default:IRCOPS_DEBUG_CHANNEL)%'

    # Antiflood: command rate limiting for service bots (IRCops exempt)
    services.antiflood_max_messages_default: 5
    services.antiflood_max_messages: '%env(int:default:services.antiflood_max_messages_default:SERVICES_ANTIFLOOD_MAX_MESSAGES)%'
    services.antiflood_window_seconds_default: 10
    services.antiflood_window_seconds: '%env(int:default:services.antiflood_window_seconds_default:SERVICES_ANTIFLOOD_WINDOW_SECONDS)%'
    services.antiflood_cooldown_seconds_default: 60
    services.antiflood_cooldown_seconds: '%env(int:default:services.antiflood_cooldown_seconds_default:SERVICES_ANTIFLOOD_COOLDOWN_SECONDS)%'

    # Maintenance scheduler
    maintenance.interval: '%env(int:MAINTENANCE_INTERVAL)%'
    maintenance.purge_expired_akick_interval: '%env(int:MAINTENANCE_INTERVAL)%'
    maintenance.purge_expired_glines_interval: '%env(int:MAINTENANCE_INTERVAL)%'
    maintenance.purge_expired_motds_interval: '%env(int:MAINTENANCE_INTERVAL)%'

    # NickServ pseudo-client
    nickserv.nick:     '%env(NICKSERV_NICK)%'
    nickserv.ident:    '%env(NICKSERV_IDENT)%'
    nickserv.realname: '%env(NICKSERV_REALNAME)%'
    # Minimum seconds between RESEND requests per nick (default 600 = 10 minutes)
    nickserv.resend_min_interval_default: 600
    nickserv.resend_min_interval: '%env(int:default:nickserv.resend_min_interval_default:NICKSERV_RESEND_MIN_INTERVAL)%'
    # Minimum seconds between REGISTER attempts per host/IP (default 300 = 5 minutes, anti-bot)
    nickserv.register_min_interval_default: 300
    nickserv.register_min_interval: '%env(int:default:nickserv.register_min_interval_default:NICKSERV_REGISTER_MIN_INTERVAL)%'
    nickserv.verification_token_ttl_seconds: 3600
    # IDENTIFY lockout after repeated failures (anti brute-force)
    nickserv.identify_max_failed_attempts_default: 5
    nickserv.identify_max_failed_attempts: '%env(int:default:nickserv.identify_max_failed_attempts_default:NICKSERV_IDENTIFY_MAX_FAILED_ATTEMPTS)%'
    nickserv.identify_failed_window_seconds_default: 900
    nickserv.identify_failed_window_seconds: '%env(int:default:nickserv.identify_failed_window_seconds_default:NICKSERV_IDENTIFY_FAILED_WINDOW_SECONDS)%'
    nickserv.identify_lockout_seconds_default: 600
    nickserv.identify_lockout_seconds: '%env(int:default:nickserv.identify_lockout_seconds_default:NICKSERV_IDENTIFY_LOCKOUT_SECONDS)%'
    # RECOVER: token TTL and throttle
    nickserv.recover_token_ttl_seconds_default: 3600
    nickserv.recover_token_ttl_seconds: '%env(int:default:nickserv.recover_token_ttl_seconds_default:NICKSERV_RECOVER_TOKEN_TTL)%'
    nickserv.recover_min_interval_seconds_default: 600
    nickserv.recover_min_interval_seconds: '%env(int:default:nickserv.recover_min_interval_seconds_default:NICKSERV_RECOVER_MIN_INTERVAL)%'
    # Inactivity expiry: days without use after which a registered nick is dropped (0 = disabled)
    nickserv.inactivity_expiry_days_default: 0
    nickserv.inactivity_expiry_days: '%env(int:default:nickserv.inactivity_expiry_days_default:NICKSERV_INACTIVITY_EXPIRY_DAYS)%'
    # Manual DROP grace: days before a soft-deleted nick is permanently purged (0 = next maintenance run)
    nickserv.drop_grace_days_default: 7
    nickserv.drop_grace_days: '%env(int:default:nickserv.drop_grace_days_default:NICKSERV_DROP_GRACE_DAYS)%'
    # History retention: days to keep nickname action history (0 = forever)
    nickserv.history_retention_days_default: 30
    nickserv.history_retention_days: '%env(int:default:nickserv.history_retention_days_default:NICKSERV_HISTORY_RETENTION_DAYS)%'
    # History view: maximum entries per page in VIEW (default: 40)
    nickserv.history_view_limit_default: 40
    nickserv.history_view_limit: '%env(int:default:nickserv.history_view_limit_default:NICKSERV_HISTORY_VIEW_LIMIT)%'

    # History retention: days to keep channel action history (0 = forever)
    chanserv.history_retention_days_default: 30
    chanserv.history_retention_days: '%env(int:default:chanserv.history_retention_days_default:CHANSERV_HISTORY_RETENTION_DAYS)%'
    # History view: maximum entries per page in VIEW (default: 40)
    chanserv.history_view_limit_default: 40
    chanserv.history_view_limit: '%env(int:default:chanserv.history_view_limit_default:CHANSERV_HISTORY_VIEW_LIMIT)%'

    # ChanServ pseudo-client
    chanserv.nick:     '%env(CHANSERV_NICK)%'
    chanserv.ident:    '%env(CHANSERV_IDENT)%'
    chanserv.realname: '%env(CHANSERV_REALNAME)%'
    # Maximum registered channels per nick (default: 3)
    chanserv.max_channels_per_nick_default: 3
    chanserv.max_channels_per_nick: '%env(int:default:chanserv.max_channels_per_nick_default:CHANSERV_MAX_CHANNELS_PER_NICK)%'
    # Minimum seconds between channel registrations per nick (default: 21600 = 6 hours)
    chanserv.register_min_interval_default: 21600
    chanserv.register_min_interval: '%env(int:default:chanserv.register_min_interval_default:CHANSERV_REGISTER_MIN_INTERVAL)%'
    # SET FOUNDER: token TTL and throttle (same defaults as NickServ RECOVER)
    chanserv.founder_token_ttl_seconds_default: 3600
    chanserv.founder_token_ttl_seconds: '%env(int:default:chanserv.founder_token_ttl_seconds_default:CHANSERV_FOUNDER_TOKEN_TTL)%'
    chanserv.founder_min_interval_seconds_default: 600
    chanserv.founder_min_interval_seconds: '%env(int:default:chanserv.founder_min_interval_seconds_default:CHANSERV_FOUNDER_MIN_INTERVAL)%'
    # Inactivity expiry: days without use after which a registered channel is dropped (0 = disabled)
    chanserv.inactivity_expiry_days_default: 0
    chanserv.inactivity_expiry_days: '%env(int:default:chanserv.inactivity_expiry_days_default:CHANSERV_INACTIVITY_EXPIRY_DAYS)%'
    # Manual DROP grace: days before a soft-deleted channel is permanently purged (0 = next maintenance run)
    chanserv.drop_grace_days_default: 7
    chanserv.drop_grace_days: '%env(int:default:chanserv.drop_grace_days_default:CHANSERV_DROP_GRACE_DAYS)%'

    # MemoServ pseudo-client
    memoserv.nick_default: 'MemoServ'
    memoserv.nick: '%env(string:default:memoserv.nick_default:MEMOSERV_NICK)%'
    memoserv.ident_default: 'MemoServ'
    memoserv.ident: '%env(string:default:memoserv.ident_default:MEMOSERV_IDENT)%'
    memoserv.realname_default: 'Memo Services'
    memoserv.realname: '%env(string:default:memoserv.realname_default:MEMOSERV_REALNAME)%'
    memoserv.send_min_interval_seconds_default: 30
    memoserv.send_min_interval_seconds: '%env(int:default:memoserv.send_min_interval_seconds_default:MEMOSERV_SEND_MIN_INTERVAL)%'
    memoserv.max_memos_per_nick_default: 50
    memoserv.max_memos_per_nick: '%env(int:default:memoserv.max_memos_per_nick_default:MEMOSERV_MAX_MEMOS_PER_NICK)%'
    memoserv.max_memos_per_channel_default: 50
    memoserv.max_memos_per_channel: '%env(int:default:memoserv.max_memos_per_channel_default:MEMOSERV_MAX_MEMOS_PER_CHANNEL)%'
    memoserv.ignore_list_limit_nick_default: 50
    memoserv.ignore_list_limit_nick: '%env(int:default:memoserv.ignore_list_limit_nick_default:MEMOSERV_IGNORE_LIST_LIMIT_NICK)%'
    memoserv.ignore_list_limit_channel_default: 100
    memoserv.ignore_list_limit_channel: '%env(int:default:memoserv.ignore_list_limit_channel_default:MEMOSERV_IGNORE_LIST_LIMIT_CHANNEL)%'

    # OperServ pseudo-client
    operserv.nick_default: 'OperServ'
    operserv.nick: '%env(string:default:operserv.nick_default:OPERSERV_NICK)%'
    operserv.ident_default: 'OperServ'
    operserv.ident: '%env(string:default:operserv.ident_default:OPERSERV_IDENT)%'
    operserv.realname_default: 'Network Operations Services'
    operserv.realname: '%env(string:default:operserv.realname_default:OPERSERV_REALNAME)%'
    operserv.root_users_default: ''
    operserv.root_users: '%env(string:default:operserv.root_users_default:OPERSERV_ROOT_USERS)%'
    operserv.max_glines_default: 1000
    operserv.max_glines: '%env(int:default:operserv.max_glines_default:OPERSERV_MAX_GLINES)%'

    # Mailer (verification and email-change emails)
    mailer.from: '%env(MAILER_FROM)%'
    mailer.send_delay_seconds_default: 5
    # Seconds to wait after each email send (avoids provider rate limits / blocks)
    mailer.send_delay_seconds: '%env(int:default:mailer.send_delay_seconds_default:MAILER_SEND_DELAY_SECONDS)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # --- Interface bindings ---------------------------------------------------

    App\Irc\Adapter\Out\Connection\ConnectionFactoryInterface:
        class: App\Irc\Adapter\Out\Connection\SocketConnectionFactory
        arguments:
            $logger: '@monolog.logger.irc'

    App\Application\Mail\MailerInterface:
        class: App\Infrastructure\Mail\SymfonyMailerAdapter
        arguments:
            $from: '%mailer.from%'
            $senderName: '%irc.server_name%'

    App\NickServ\Application\Port\Out\PasswordHasher:
        alias: App\NickServ\Adapter\Out\Security\PhpPasswordHasher

    App\NickServ\Application\Port\Out\Clock:
        alias: App\NickServ\Adapter\Out\Time\SystemClock

    App\NickServ\Application\Port\Out\VerificationTokenGenerator:
        alias: App\NickServ\Adapter\Out\Random\SecureVerificationTokenGenerator

    App\NickServ\Application\Port\Out\GuestNicknameGenerator:
        alias: App\NickServ\Adapter\Out\Random\SecureGuestNicknameGenerator

    App\NickServ\Application\Port\Out\NickServActivitySink:
        alias: App\NickServ\Adapter\Out\Service\PsrNickServActivitySink

    App\NickServ\Application\Port\Out\NickNetworkUserLookup:
        alias: App\NickServ\Adapter\Out\User\IrcNickNetworkUserLookup

    App\NickServ\Application\Port\Out\NickChangeIdentificationPolicy:
        alias: App\NickServ\Adapter\Out\Protocol\ProtocolNickChangeIdentificationPolicy

    App\NickServ\Application\Port\Out\NicknameReservation:
        alias: App\NickServ\Adapter\Out\Protocol\ProtocolNicknameReservation

    App\NickServ\Application\Port\Out\NickProtectionNotifier:
        alias: App\NickServ\Adapter\Out\User\IrcNickProtectionNotifier

    App\NickServ\Application\Port\Out\NickServEventPublisher:
        alias: App\NickServ\Adapter\Out\Event\SymfonyNickServEventPublisher

    App\NickServ\Application\Port\Out\NickTransactionBoundary:
        alias: App\NickServ\Adapter\Out\Persistence\Doctrine\NickDoctrineTransactionBoundary

    App\NickServ\Application\Port\Out\NickAuditSink:
        alias: App\NickServ\Adapter\Out\Service\NickServDebugNotifier

    App\NickServ\Adapter\Out\Service\PsrNickServActivitySink:
        arguments:
            $logger: '@monolog.logger.irc'

    App\NickServ\Application\Port\Out\RegisterNickRepository:
        alias: App\NickServ\Adapter\Out\Persistence\Doctrine\DoctrineRegisterNickRepository

    App\NickServ\Application\Port\Out\RegistrationThrottle:
        alias: App\NickServ\Adapter\Out\InMemory\InMemoryRegistrationThrottle

    App\NickServ\Application\Port\Out\RegistrationVerificationStore:
        alias: App\NickServ\Adapter\Out\InMemory\PendingRegistrationVerificationStore

    App\NickServ\Application\Port\Out\RegistrationEventPublisher:
        alias: App\NickServ\Adapter\Out\Event\SymfonyRegistrationEventPublisher

    App\NickServ\Application\Port\Out\RegistrationMailSender:
        alias: App\NickServ\Adapter\Out\Mail\MessengerRegistrationMailSender

    App\NickServ\Application\UseCase\Register\RegisterNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Register\RegisterNickHandler

    App\NickServ\Application\Port\Out\IdentifiedSessionTracker:
        alias: App\NickServ\Adapter\Out\InMemory\IdentifiedSessionRegistry

    App\NickServ\Application\Port\Out\IdentifyLockoutTracker:
        alias: App\NickServ\Adapter\Out\InMemory\IdentifyFailedAttemptRegistry

    App\NickServ\Application\Port\Out\IdentifyEventPublisher:
        alias: App\NickServ\Adapter\Out\Event\SymfonyIdentifyEventPublisher

    App\NickServ\Application\Port\Out\ForcedVhostCheckerInterface:
        alias: App\NickServ\Adapter\Out\Security\OperIrcopForcedVhostChecker

    App\NickServ\Application\Port\Out\VerificationTokenConsumer:
        alias: App\NickServ\Adapter\Out\InMemory\PendingRegistrationVerificationStore

    App\NickServ\Application\Port\Out\ResendThrottle:
        alias: App\NickServ\Adapter\Out\InMemory\InMemoryResendThrottle

    App\NickServ\Application\Port\Out\ResendMailSender:
        alias: App\NickServ\Adapter\Out\Mail\MessengerResendMailSender

    App\NickServ\Application\Port\Out\NickAssociatedChannelsPort:
        alias: App\NickServ\Adapter\Out\ChanServ\ChanServNickAssociatedChannelsAdapter

    App\ChanServ\Application\Port\Out\ChannelRankPolicyRepository:
        alias: App\ChanServ\Adapter\Out\Persistence\LegacyChannelRankPolicyRepository

    App\ChanServ\Application\Port\Out\ChannelMlockPolicyRepository:
        alias: App\ChanServ\Adapter\Out\Persistence\LegacyChannelMlockPolicyRepository

    App\ChanServ\Application\Port\Out\ChannelRankNetworkQuery:
        alias: App\ChanServ\Adapter\Out\Network\IrcChannelRankNetworkQuery

    App\ChanServ\Application\Port\Out\ChannelMlockNetworkQuery:
        alias: App\ChanServ\Adapter\Out\Network\IrcChannelMlockNetworkQuery

    App\ChanServ\Application\Port\Out\ChannelRankActions:
        alias: App\ChanServ\Adapter\Out\Network\IrcChannelRankActions

    App\ChanServ\Application\Port\Out\ChannelModeActions:
        alias: App\ChanServ\Adapter\Out\Network\IrcChannelModeActions

    App\ChanServ\Application\UseCase\EnforceRanks\EnforceChannelRanksHandlerInterface:
        alias: App\ChanServ\Application\UseCase\EnforceRanks\EnforceChannelRanksHandler

    App\ChanServ\Application\UseCase\EnforceMlock\EnforceChannelMlockHandlerInterface:
        alias: App\ChanServ\Application\UseCase\EnforceMlock\EnforceChannelMlockHandler

    App\ChanServ\Adapter\Out\Network\IrcChannelRankNetworkQuery:
        arguments:
            $chanservNick: '%chanserv.nick%'

    App\ChanServ\Application\Port\In\NickChannelAssociationQuery:
        alias: App\ChanServ\Application\Service\NickChannelAssociationQueryService

    App\NickServ\Application\UseCase\Identify\IdentifyNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Identify\IdentifyNickHandler

    App\NickServ\Application\UseCase\Verify\VerifyNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Verify\VerifyNickHandler

    App\NickServ\Application\UseCase\Resend\ResendVerificationHandlerInterface:
        alias: App\NickServ\Application\UseCase\Resend\ResendVerificationHandler

    App\NickServ\Application\UseCase\Status\StatusNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Status\StatusNickHandler

    App\NickServ\Application\UseCase\Info\InfoNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Info\InfoNickHandler

    App\NickServ\Application\UseCase\Rename\RenameNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Rename\RenameNickHandler

    App\NickServ\Application\Port\Out\RecoveryTokenStore:
        alias: App\NickServ\Adapter\Out\InMemory\RecoveryTokenRegistry

    App\NickServ\Application\Port\Out\RecoveryPasswordGenerator:
        alias: App\NickServ\Adapter\Out\Random\SecureRecoveryPasswordGenerator

    App\NickServ\Application\Port\Out\RecoveryMailSender:
        alias: App\NickServ\Adapter\Out\Mail\MessengerRecoveryMailSender

    App\NickServ\Application\Port\Out\RecoverEventPublisher:
        alias: App\NickServ\Adapter\Out\Event\SymfonyRecoverEventPublisher

    App\NickServ\Application\UseCase\Recover\RecoverNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Recover\RecoverNickHandler

    App\NickServ\Application\UseCase\Restore\RestoreNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Restore\RestoreNickHandler

    App\NickServ\Application\UseCase\Drop\DropNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Drop\DropNickHandler

    App\NickServ\Application\UseCase\Noexpire\SetNoexpireNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\Noexpire\SetNoexpireNickHandler

    App\NickServ\Application\UseCase\History\HistoryNickHandlerInterface:
        alias: App\NickServ\Application\UseCase\History\HistoryNickHandler

    App\NickServ\Application\UseCase\Userip\GetUseripHandlerInterface:
        alias: App\NickServ\Application\UseCase\Userip\GetUseripHandler

    App\NickServ\Adapter\Out\Mail\MessengerRecoveryMailSender:
        arguments:
            $logger: '@monolog.logger.irc'
            $nickservNick: '%nickserv.nick%'

    App\NickServ\Adapter\Out\Mail\MessengerResendMailSender:
        arguments:
            $logger: '@monolog.logger.irc'
            $nickservNick: '%nickserv.nick%'

    App\NickServ\Adapter\Out\Mail\MessengerRegistrationMailSender:
        arguments:
            $logger: '@monolog.logger.irc'
            $nickservNick: '%nickserv.nick%'

    App\NickServ\Adapter\Out\Mail\RegistrationVerificationEmailHandler:
        arguments:
            $from: '%mailer.from%'
            $senderName: '%irc.server_name%'
            $sendDelaySeconds: '%mailer.send_delay_seconds%'
        tags: ['messenger.message_handler']

    App\Infrastructure\Messenger\Middleware\EmailDelayMiddleware:
        arguments:
            $emailDelaySeconds: '%mailer.send_delay_seconds%'

    App\Application\Mail\Message\SendEmailHandler:
        tags: ['messenger.message_handler']

    App\Application\Maintenance\Message\RunMaintenanceCycleHandler:
        tags: ['messenger.message_handler']

    # --- Service Nickname Registry (dynamic service names for placeholders) ---------

    App\Shared\Application\ServiceNicknameRegistry:
        arguments:
            $providers: !tagged_iterator app.service_nickname_provider

    # --- Service UID Registry (resolve service nick to UID) -------------------------

    App\Application\Shared\ServiceUidRegistry:
        factory: ['App\Application\Shared\ServiceUidRegistry', 'fromIterable']
        arguments: [!tagged_iterator app.service_uid_provider]

    # --- Service UID Generator (auto-generates UIDs on burst) --------------------

    App\Irc\Application\Port\In\ServiceUidGeneratorInterface:
        class: App\Irc\Application\ServiceUidGenerator

    # --- Application services — inject the irc Monolog channel ---------------

    App\Infrastructure\IRC\Runtime\RevoltLoopScheduler: ~

    App\Infrastructure\IRC\Runtime\LoopSchedulerInterface: '@App\Infrastructure\IRC\Runtime\RevoltLoopScheduler'

    App\Irc\Adapter\Runtime\IRCClientFactoryInterface: '@App\Irc\Adapter\Runtime\IRCClientFactory'

    App\Irc\Adapter\Runtime\ProtocolRuntimeModuleInterface:
        factory: ['@App\Bootstrap\Protocol\ProtocolComposition', 'protocolModule']

    App\Irc\Adapter\Protocol\NetworkStateAdapterInterface:
        factory: ['@App\Bootstrap\Protocol\ProtocolComposition', 'networkStateAdapter']

    App\Irc\Application\Port\Out\IrcSessionConnectorInterface: '@App\Irc\Adapter\Out\Connection\IrcSessionConnector'

    App\Irc\Adapter\Runtime\IRCClientFactory:
        arguments:
            $maintenanceDispatchIntervalSeconds: '%maintenance.interval%'
            $logger: '@monolog.logger.irc'

    # --- Messenger consumer process (started/stopped with irc:connect) ---

    App\Application\Port\ConsumerProcessManagerInterface: '@App\Infrastructure\Messenger\ConsumerProcessManager'

    App\Infrastructure\Messenger\ConsumerProcessManager:
        arguments:
            $consolePath: '%kernel.project_dir%/bin/console'
            $transportNames: ['async', 'async_emails']

    # --- CLI command — inject .env defaults so the command runs without arguments ---

    App\Irc\Application\Connect\ConnectToServerHandlerInterface: '@App\Irc\Application\Connect\ConnectToServerHandler'

    App\UI\CLI\ConnectCommand:
        arguments:
            $consumerManager:   '@App\Infrastructure\Messenger\ConsumerProcessManager'
            $defaultServerName:  '%irc.server_name%'
            $defaultHost:        '%irc.ircd_host%'
            $defaultPort:        '%irc.ircd_port%'
            $defaultPassword:    '%irc.link_password%'
            $defaultDescription: '%irc.description%'
            $defaultUseTls:      '%irc.use_tls%'
            $defaultTlsVerifyPeer: '%irc.tls_verify_peer%'

    App\Infrastructure\IRC\Protocol\UnrealUdb\UnrealUdbConnectionPreflight:
        arguments:
            $directory: '%env(string:default::IRC_UDB_DIRECTORY)%'
            $bootstrapFromPeer: '%env(bool:IRC_UDB_BOOTSTRAP_FROM_PEER)%'

    App\Irc\Application\Connect\ProtocolConnectionPreflightInterface:
        alias: App\Bootstrap\Protocol\ProtocolComposition

    App\Bootstrap\Protocol\ProtocolComposition:
        arguments:
            $protocolName: '%irc.protocol%'
            $modules: !tagged_iterator irc.protocol_module
            $networkStateAdapters: !tagged_iterator irc.network_state_adapter
            $unrealUdbPreflight: '@App\Infrastructure\IRC\Protocol\UnrealUdb\UnrealUdbConnectionPreflight'

    # --- Protocol modules (one per IRCd type: Unreal, InspIRCd, etc.) ---

    App\Irc\Adapter\Protocol\UnrealStandalone\UnrealStandaloneProtocolHandler:
        arguments:
            $sid:             '%irc.server_sid%'
            $logger:          '@monolog.logger.irc'
            $eventDispatcher: '@event_dispatcher'

    App\Infrastructure\IRC\Protocol\UnrealUdb\UnrealUdbProtocolHandler:
        arguments:
            $sid:             '%irc.server_sid%'
            $coordinator:     '@App\Infrastructure\IRC\Protocol\UnrealUdb\UdbSessionCoordinator'
            $lock:            '@App\Infrastructure\IRC\Protocol\UnrealUdb\UdbSessionLock'
            $logger:          '@monolog.logger.irc'
            $eventDispatcher: '@event_dispatcher'

    App\Infrastructure\IRC\Protocol\UnrealUdb\UdbSessionLock:
        arguments:
            $directory: '%env(string:default::IRC_UDB_DIRECTORY)%'
            $logger:    '@monolog.logger.irc'

    App\Irc\Adapter\Protocol\InspIRCd\InspIRCdProtocolHandler:
        arguments:
            $sid:                '%irc.server_sid%'
            $connectionHolder:   '@App\Irc\Adapter\Out\Connection\ActiveConnectionHolder'
            $modeSupportFactory: '@App\Irc\Adapter\Protocol\InspIRCd\InspIRCdChannelModeSupportFactory'
            $logger:             '@monolog.logger.irc'
            $eventDispatcher:    '@event_dispatcher'

    App\Irc\Adapter\Protocol\UnrealStandalone\UnrealStandaloneServiceIntroductionFormatter: ~

    App\Irc\Adapter\Protocol\InspIRCd\InspIRCdServiceIntroductionFormatter: ~

    App\Infrastructure\IRC\Protocol\UnrealUdb\UnrealUdbServiceIntroductionFormatter: ~

    App\Irc\Adapter\Protocol\UnrealStandalone\UnrealStandaloneProtocolServiceActions:
        arguments:
            $introductionFormatter: '@App\Irc\Adapter\Protocol\UnrealStandalone\UnrealStandaloneServiceIntroductionFormatter'
            $logger: '@monolog.logger.irc'

    App\Infrastructure\IRC\Protocol\UnrealUdb\UnrealUdbRecordWriter:
        arguments:
            $connectionHolder: '@App\Irc\Adapter\Out\Connection\ActiveConnectionHolder'
            $sessionState:     '@App\Infrastructure\IRC\Protocol\UnrealUdb\UdbSessionStateInterface'
            $records:          '@App\Domain\Udb\Repository\UdbRecordRepositoryInterface'
            $sid:              '%irc.server_sid%'
            $logger:           '@monolog.logger.irc'

    App\Application\Port\UdbRecordWriterInterface:
        alias: App\Infrastructure\IRC\Protocol\UnrealUdb\UnrealUdbRecordWriter

    App\Infrastructure\IRC\Protocol\UnrealUdb\UdbSessionCoordinator:
        arguments:

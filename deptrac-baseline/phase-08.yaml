# Phase 08: UnrealUdb and legacy UDB ownership.
# Exact source -> target exceptions owned by that phase; do not broaden.
deptrac:
  skip_violations:
    App\Infrastructure\IRC\Protocol\UnrealUdb\Subscriber\UdbChannelSyncSubscriber:
      - App\ChanServ\Domain\Entity\RegisteredChannel
      - App\ChanServ\Application\Port\Out\RegisteredChannelRepositoryInterface
    App\Infrastructure\IRC\Protocol\UnrealUdb\Subscriber\UdbGlineSyncSubscriber:
      - App\Domain\OperServ\Event\GlineRemovedEvent
    App\Infrastructure\IRC\Protocol\UnrealUdb\Subscriber\UdbNickSyncSubscriber:
      - App\NickServ\Domain\Entity\RegisteredNick
      - App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface
      - App\Domain\OperServ\Event\OperIrcopChangedEvent
      - App\Domain\OperServ\Event\OperRoleForcedVhostChangedEvent
      - App\Domain\OperServ\Repository\OperIrcopRepositoryInterface
    App\Infrastructure\IRC\Protocol\UnrealUdb\Subscriber\UdbPasswordRepairSubscriber:
      - App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface
    App\Infrastructure\IRC\Protocol\UnrealUdb\UdbRecordExporter:
      - App\ChanServ\Domain\Entity\ChannelAccess
      - App\ChanServ\Domain\Entity\RegisteredChannel
      - App\ChanServ\Application\Port\Out\ChannelAccessRepositoryInterface
      - App\ChanServ\Application\Port\Out\RegisteredChannelRepositoryInterface
      - App\NickServ\Domain\Entity\RegisteredNick
      - App\NickServ\Application\Port\Out\RegisteredNickRepositoryInterface
      - App\Domain\OperServ\Entity\Gline
      - App\Domain\OperServ\Repository\GlineRepositoryInterface
      - App\Domain\OperServ\Repository\OperIrcopRepositoryInterface
      - App\Domain\OperServ\ValueObject\ForcedVhost
